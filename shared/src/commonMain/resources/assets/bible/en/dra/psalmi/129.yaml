language: English
book: Psalmi
chapter: "129"
verses:
  "1": A prayer of a sinner trusting in the mercies of God. The th penitential psalm.
  "2": 'A gradual canticle. Out of the depths I have cried to thee, O Lord:'
  "3": Lord, hear my voice. Let thy ears be attentive to the voice of my supplication.
  "4": If thou, O Lord, wilt mark iniquities; Lord, who shall stand?
  "5": 'For with thee there is merciful forgiveness: and by reason of thy law, I have waited for thee, O Lord. My soul hath relied on his word: '
  "6": my soul hath hoped in the Lord.
  "7": From the morning watch even until night, let Israel hope in the Lord.
  "8": Because with the Lord there is mercy; and with him plentiful redemption.
  "9": And he shall redeem Israel from all his iniquities.
