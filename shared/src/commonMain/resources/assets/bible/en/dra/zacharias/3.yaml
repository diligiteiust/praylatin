book: Zacharias
chapter: "3"
verses:
  "15": 'And the Lord shewed me Jesus, the high priest, standing before the angel of the Lord: and satan stood on his right hand, to be his adversary.'
  "16": 'And the Lord said to satan: The Lord rebuke thee, O datan: and the Lord, that chose Jerusalem, rebuke thee: Is not this a brand plucked out of the fire?'
  "17": 'And Jesus was clothed with filthy garments: and he stood before the face of the angel.'
  "18": 'Who answered, and said to them that stood before him, saying: Take away the filthy garments from him. And he said to him: Behold, I have taken away thy iniquity, and have clothed thee with a change of garments.'
  "19": 'And he said: Put a clean mitre upon his head: and they put a clean mitre upon his head, and clothed him with garments: and the angel of the Lord stood.'
  "20": 'And the angel of the Lord protested to Jesus, saying:'
  "21": 'Thus saith the Lord of hosts: If thou wilt walk in my ways, and keep my charge, thou also shalt judge my house, and shalt keep my courts, and I will give thee some of them that are now present here to walk with thee.'
  "22": 'Hear, O Jesus, thou high priest, thou and thy friends that dwell before thee, for they are portending men: for behold, *I will bring my servant, the Orient.'
  "23": 'For behold the stone that I have laid before Jesus: upon one stone there are seven eyes: behold, I will grave the graving thereof, saith the Lord of hosts: and I will take away the iniquity of that land in one day.'
  "24": In that day, saith the Lord of hosts, every man shall call his friend under the vine, and under the fig-tree.
