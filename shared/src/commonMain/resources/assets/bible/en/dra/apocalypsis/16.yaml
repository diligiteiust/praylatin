language: English
book: Apocalypsis
chapter: "16"
verses:
  "1": 'And I heard a great voice out of the temple, saying to the seven Angels: Go, and pour out the seven vials of the wrath of God upon the earth.'
  "2": And the first went, and poured out his vial upon the earth, and there fell a sore and grievous wound upon the men, who had the mark of the beast; and upon them who adored his image.
  "3": 'And the second Angel poured out his vial into the sea, and there came blood as of a dead man: and every living soul died in the sea.'
  "4": And the third poured out his vial upon the rivers, and the fountains of waters, and there was blood.
  "5": 'And I heard the Angel of the waters, saying: Thou art just, O Lord, who art, and who wast, the holy one, who hast judged these things:'
  "6": For they have shed the blood of saints and prophets, and thou hast given them blood to drink; for they deserve it.
  "7": 'And I heard another from the altar, saying: Yea, O Lord God Almighty, true and just are thy judgments.'
  "8": 'And the fourth Angel poured out his vial upon the sun, and it was given to him to afflict men with heat, and fire:'
  "9": And men were scorched with great heat, and they blasphemed the name of God who hath power over these plagues, neither did they penance to give him glory.
  "10": 'And the fifth Angel poured out his vial upon the seat of the beast: and his kingdom became dark, and they gnawed their tongues for pain:'
  "11": And they blasphemed the God of heaven, because of their pains, and wounds, and did not penance for their works.
  "12": 'And the sixth Angel poured out his vial upon that great river Euphrates: and dried up the water thereof, that a way might be prepared for the kings from the rising of the sun.'
  "13": And I saw from the mouth of the dragon, and from the mouth of the beast, and from the mouth of the false prophet, three unclean spirits like frogs.
  "14": For they are the spirits of devils working signs, and they go forth unto the kings of the whole earth, to gather them to battle against the great day of the Almighty God.
  "15": '*Behold, I come as a thief. Blessed is he that watcheth and keepeth his garments, lest he walk naked, and they see his shame.'
  "16": And he shall gather them together into a place, which is called in Hebrew Armagedon.
  "17": 'And the seventh Angel poured out his vial into the air, and a great voice came out of the temple from the throne, saying: It is done.'
  "18": 'And there were lightnings, and voices, and thunders, and there was a great earthquake, such as never hath been since men were upon the earth: such an earthquake, so great.'
  "19": 'And the great city was made into three parts: and the cities of the Gentiles fell, and great Babylon came in remembrance before God, to give her the cup of the wine of the indignation of his wrath.'
  "20": And every island fled away, and the mountains were not found.
  "21": 'And great hail like a talent came down from heaven upon men: and men blasphemed God, because of the plague of the hail: because it was exceeding great.'
