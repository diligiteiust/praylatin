book: Esther
chapter: "11"
verses:
  "15": In the fourth year *of the reign of Ptolemy and Cleopatra, Dositheus, who said he was a priest, and of the Levitical race, and Ptolemy, his son, brought this epistle of Phurim, which they said Lysimachus, the son of Ptolemy, had interpreted in Jerusalem.
  "16": 'In the second year *of the reign of Artaxerxes, the great, in the first day of the month Nisan, Mardochai, the son of Jair, the son of Semei, the son of Cis, of the tribe of Benjamin:'
  "17": A Jew, who dwelt in the city of Susan, a great man, and among the first of the king's court, had it dream.
  "18": '*Now he was of the number of the captives, whom Nabuchodonosor, king of Babylon, had carried away from Jerusalem, with Jechonias, king of Juda:'
  "19": 'And this was his dream: Behold there were voices, and tumults, and thunders, and earthquakes, and a disturbance upon the earth.'
  "20": '*And behold two great dragons came forth ready to fight one against another.'
  "21": And at their cry all nations were stirred up to fight against the nation of the just.
  "22": And that was a day of darkness and danger, of tribulation and distress, and great fear upon the earth.
  "23": And the nation of the just was troubled, fearing their own evils, and was prepared for death.
  "24": 'And they cried to God: and as they were crying, a little fountain grew into a very great river, and abounded into many waters.'
  "25": The light and the sun rose up, and the humble were exalted, and they devoured the glorious.
  "26": 'And when Mardochai had seen this, and arose out of his bed, he was thinking what God would do: and he kept it fixed in his mind, desirous to know what the dream should signify.'
