language: English
book: I Paralipomenon
chapter: "27"
verses:
  "66": Now the children of Israel, according to their number, the heads of families, captains of thousands and of hundreds, and officers, that served the king according to their companies, who came in and went out every month in the year, under every chief, were four and twenty thousand.
  "67": Over the first company, the first month, Jesboam, the son of Zabdiel, was chief, and under him were four and twenty thousand.
  "68": Of the sons of Phares, the chief of all the captains in the host, in the first month.
  "69": The company of the second month was under Dudia, an Ahohite, and after him was another named Macelloth, who commanded a part of the army of four and twenty thousand.
  "70": 'And the captain of the third company, for the third month, was Banaias, the son of Joiada, the priest: and in his division were four and twenty thousand.'
  "71": This is that Banaias, the most valiant among the thirty, and above the thirty. And Amizabad, his son, commanded his company.
  "72": 'The fourth, for the fourth month, was Asahel, the brother of Joab, and Zabadias, his son, after him: and in his company were four and twenty thousand.'
  "73": 'The fifth captain, for the fifth month, was Samaoth, a Jezerite: and his company were four and twenty thousand.'
  "74": 'The sixth, for the sixth month, was Hira, the son of Acces a Thecuite: and in his company were four and twenty thousand.'
  "75": 'The seventh, for the seventh month, was Helles, a Phallonite, of the sons of Ephraim: and in his company were four and twenty thousand.'
  "76": 'The eighth, for the eighth month, was Sobochai, a Husathite, of the race of Zarahi: and in his company were four and twenty thousand.'
  "77": The ninth, for the ninth month, was Abiezer, an Anathothite, of the sons of Jemini, and in his company were four and twenty thousand.
  "78": 'The tenth, for the tenth month, was Marai, who was a Netophathite, of the race of Zarai: and in his company were four and twenty thousand.'
  "79": 'The eleventh, for the eleventh month, was Banaias, a Pharathonite, of the sons of Ephraim: and in his company were four and twenty thousand.'
  "80": 'The twelfth, for the twelfth month, was Holdai, a Netophathite, of the race of Gothoniel: and in his company were four and twenty thousand.'
  "81": 'Now the chiefs over the tribes of Israel were these: over the Rubenites, Eliezer, the son of Zechri, was ruler: over the Simeonites, Saphatias, the son of Maacha:'
  "82": 'Over the Levites, Hasabias, the son of Camuel: over the Aaronites, Sadoc:'
  "83": 'Over Juda, Eliu, the brother of David: over Issachar, Amri, the son of Michael:'
  "84": 'Over the Zabulonites, Jesmaias, the son of Adias: over the Nephthalites, Jerimoth, the son of Ozriel:'
  "85": 'Over the sons of Ephraim: Osee, the son of Ozaziu: over the half tribe of Manasses, Joel, the son of Phadaia:'
  "86": 'And over the half tribe of Manasses in Galaad, Jaddo, the son of Zacharias: and over Benjamin, Jasiel, the son of Abner.'
  "87": 'And over Dan, Ezrihel, the son of Jeroham: these were the princes of the children of Israel.'
  "88": 'But David would not number them from twenty years old and under: because the Lord had said that he would multiply Israel like the stars of heaven.'
  "89": '*Joab, the son of Sarvia, began to number, but he finished not: because upon this there fell wrath upon Israel: and therefore the number of them that were numbered, was not registered in the chronicles of king David.'
  "90": 'And over the king''s treasures was Azmoth, the son of Adiel: and over those stores, which were in the cities, and in the villages, and in the castles, was Jonathan the son of Ozias.'
  "91": 'And over the tillage, and the husbandmen, who tilled the ground, was Ezri, the son of Chelub:'
  "92": 'And over the dressers of the vineyards, was Semeias, a Romathite: and over the wine-cellars, Zabdias, an Aphonite.'
  "93": 'And over the olive-yards and the fig-groves, which were in the plains, was Balanam, a Gederite: and over the oil-cellars, Joas:'
  "94": 'And over the herds that fed in Saron, was Setrai, a Saronite: and over the oxen in the valleys, Saphat, the son of Adli:'
  "95": 'And over the camels, Ubil, an Ishmahelite: and over the asses, Jadias, a Meronathite:'
  "96": And over the sheep, Jaziz, an Agarene. All these were the rulers of the substance of king David.
  "97": 'And Jonathan, David''s uncle, a counsellor, a wise and learned man: he and Jahiel, the son of Hachamoni, were with the king''s sons.'
  "98": And Achitophel was the king's counsellor, and Chusai, the Arachite, the king's friend.
  "99": And after Achitophel was Joiada, the son of Banaias, and Abiathar. And the general of the king's army was Joab.
