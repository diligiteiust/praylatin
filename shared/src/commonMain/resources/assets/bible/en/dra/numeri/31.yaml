book: Numeri
chapter: "31"
verses:
  "19": 'And the Lord spoke to Moses,* saying:'
  "20": Revenge first the children of Israel on the Madianites, and so thou shalt be gathered to thy people.
  "21": 'And Moses forthwith said: *Arm of you men to fight, who may take the revenge of the Lord on the Madianites.'
  "22": Let a thousand men be chosen out of every tribe of Israel to be sent to the war.
  "23": 'And they gave a thousand of every tribe, that is to say, twelve thousand men, well appointed for battle:'
  "24": And Moses sent them with Phinees, the son of Eleazar the priest, and he delivered to him the holy vessels, and the trumpets to sound.
  "25": And when they had fought against the Madianites and had overcome them, they slew all the men,
  "26": '*And their kings Evi, and Recem, and Sur, and Hur, and Rebe, five princes of the nation: Balaam also, the son of Beor, they killed with the sword.'
  "27": 'And they took their women, and their children captives, and all their cattle, and all their goods: and all their possessions they plundered:'
  "28": And all their cities, and their villages, and their castles, they burned.
  "29": 'And they carried away the booty, and all that they had taken, both of men and of beasts:'
  "30": And they brought them to Moses, and Eleazar the priest, and to all the multitude of the children of Israel. But the rest of the things for use they carried to the camp, on the plains of Moab, beside the Jordan, over-against Jericho.
  "31": And Moses and Eleazar the priest, and all the princes of the synagogue, went forth to meet them without the camp.
  "32": And Moses being angry with the chief officers of the army, the tribunes, and the centurions, that were come from the battle,
  "33": 'Said: Why have you saved the women?'
  "34": '*Are not these they that deceived the children of Israel by the counsel of Balaam, and made you transgress against the Lord by the sin of Phogor, for which also the people was punished?'
  "35": '*Therefore kill all that are of the male sex, even of the children: and put to death the women, that have carnally known men.'
  "36": 'But the girls, and all the women that are virgins, save for yourselves:'
  "37": And stay without the camp seven days. He that hath killed a man, or touched one that is killed, shall be purified the third day and the seventh day.
  "38": And of all the spoil, every garment, or vessel, or any thing made for use, of the skins, or hair of goats, or of wood, shall be purified.
  "39": 'Eleazar also, the priest, spoke to the men of the army that had fought, in this manner: This is the ordinance of the law,* which the Lord hath commanded Moses:'
  "40": Gold, and silver, and brass, and iron, and lead, and tin,
  "41": 'And all that may pass through the fire, shall be purified by fire, but whatsoever cannot abide the fire, shall be sanctified with the water of expiation:'
  "42": And you shall wash your garments the seventh day, and being purified, you shall afterwards enter into the camp.
  "43": 'And the Lord said to Moses:'
  "44": 'Take the sum of the things that were taken, both of man and beast, thou, and Eleazar the priest, and the princes of the multitude:'
  "45": And thou shalt divide the spoil equally, between them that fought and went out to the war, and between the rest of the multitude.
  "46": And thou shalt separate a portion to the Lord from them that fought and were in the battle, one soul of five hundred, as well of persons as of oxen and asses and sheep,
  "47": And thou shalt give it to Eleazar the priest, because they are the first-fruits of the Lord.
  "48": Out of the moiety also of the children of Israel, thou shalt take the fiftieth head of persons, and of oxen, and asses, and sheep, and of all beasts, and thou shalt give them to the Levites, that watch in the charge of the tabernacle of the Lord.
  "49": And Moses and Eleazar did as the Lord had commanded.
  "50": And the spoil which the army had taken, was six hundred seventy-five thousand sheep,
  "51": Seventy-two thousand oxen,
  "52": 'Sixty-one thousand asses:'
  "53": And thirty-two thousand persons of the female sex, that had not known men.
  "54": 'And one half was given to them that had been in the battle, to wit, three hundred thirty-seven thousand five hundred sheep:'
  "55": Out of which, for the portion of the Lord, were reckoned six hundred seventy-five sheep.
  "56": 'And out of the thirty-six thousand oxen, seventy-two oxen:'
  "57": 'Out of the thirty thousand asses, sixty-one asses:'
  "58": Out of the sixteen thousand persons, there fell to the portion of the Lord, thirty-two souls.
  "59": And Moses delivered the number of the first-fruits of the Lord to Eleazar the priest, as had been commanded him,
  "60": Out of the half of the children of Israel, which he had separated for them that had been in the battle.
  "61": But out of the half that fell to the rest of the multitude, that is to say, out of the three hundred thirty-seven thousand five hundred sheep,
  "62": And out of the thirty-six thousand oxen,
  "63": And out of the thirty thousand five hundred asses,
  "64": And out of the sixteen thousand persons,
  "65": Moses took the fiftieth head, and gave it to the Levites that watched in the tabernacle of the Lord, as the Lord had commanded.
  "66": 'And when the commanders of the army, and the tribunes, and centurions were come to Moses, they said:'
  "67": We, thy servants, have reckoned up the number of the fighting men, whom we had under our hand, and not so much as one was wanting.
  "68": Therefore we offer as gifts to the Lord, what gold every one of us could find in the booty, in garters and tablets, rings and bracelets, and chains, that thou mayst pray to the Lord for us.
  "69": And Moses, and Eleazar the priest, received all the gold in divers kinds,
  "70": In weight sixteen thousand seven hundred and fifty sicles, from the tribunes and from the centurions.
  "71": For that which every one had taken in the booty was his own.
  "72": And that which was received, they brought into the tabernacle of the testimony, for a memorial of the children of Israel before the Lord.
