book: Iudith
chapter: "4"
verses:
  "17": Then the children of Israel, who dwelt in the land of Juda, hearing these things, were exceedingly afraid of him.
  "18": Dread and horror seized upon their minds, lest he should do the same to Jerusalem, and to the temple of the Lord, that he had done to other cities, and their temples.
  "19": 'And they sent into all Samaria round about, as far as Jericho, and seized upon all the tops of the mountains:'
  "20": And they compassed their towns with walls, and gathered together corn, for provision for war.
  "21": And Eliachim, the priest, wrote to all that were over-against Esdrelon, which faceth the great plain near Dothain, and to all by whom there might be a passage of way, that they should take possession of the ascents of the mountains, by which there might be any way to Jerusalem, and should keep watch where the way was narrow between the mountains.
  "22": And the children of Israel did as the priest of the Lord, Eliachim, had appointed them.
  "23": And all the people cried to the Lord with great earnestness, and they humbled their souls in fastings, and prayers, both they and their wives.
  "24": And the priests put on hair-cloths, and they caused the little children to lie prostrate before the temple of the Lord, and the altar of the Lord they covered with hair-cloth.
  "25": And they cried to the Lord, the God of Israel, with one accord, that their children might not be made a prey, and their wives carried off, and their cities destroyed, and their holy things profaned, and that they might not be made a reproach to the Gentiles.
  "26": Then Eliachim, the high priest of the Lord, went about all Israel, and spoke to them,
  "27": 'Saying: Know ye that the Lord will hear your prayers, if you continue with perseverance in fastings and prayers, in the sight of the Lord.'
  "28": 'Remember Moses, the servant of the Lord, who overcame Amalec, that trusted in his own strength, and in his power, and in his army, and in his shields, and in his chariots, and in his horsemen, not by fighting with the sword, but by holy prayers:'
  "29": '*So shall all the enemies of Israel be, if you persevere in this work which you have begun.'
  "30": So they being moved by this exhortation of his, prayed to the Lord, and continued in the sight of the Lord.
  "31": So that even they who offered the holocausts to the Lord, offered the sacrifices to the Lord, girded with hair-cloths, and with ashes upon their head.
  "32": And they all begged of God, with all their heart, that he would visit his people, Israel.
