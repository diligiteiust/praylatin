language: English
book: ad Corinthios I
chapter: "14"
verses:
  "15": 'Follow after charity, be zealous for spiritual gifts: but rather that you may prophesy.'
  "16": 'For he that speaketh in a tongue, speaketh not to men, but unto God: for no man heareth. But by the Spirit he speaketh mysteries.'
  "17": But he that prophesieth, speaketh to men unto edification, and exhortation and comfort.
  "18": He that speaketh in a tongue, edifieth himself; but he that prophesieth, edifieth the church.
  "19": 'And I would have you all to speak with tongues, but rather to prophesy. For greater is he that prophesieth than he that speaketh with tongues: unless, perhaps, he interpret, that the church may receive edification.'
  "20": But now, brethren, if I come to you speaking with tongues, what shall I profit you, unless I speak to you either in revelation, or in knowledge, or in prophecy, or in doctrine?
  "21": Even things without life that give sound, whether pipe or harp, except they give a distinction of sounds, how shall it be known what is piped or harped?
  "22": For if the trumpet give an uncertain sound, who shall prepare himself for battle?
  "23": So likewise you, unless you utter by the tongue plain speech, how shall it be known what is spoken? For you shall be speaking into the air.
  "24": 'There are, for example, so many kinds of tongues in this world: and none is without a voice.'
  "25": If then I know not the power of the voice, I shall be to him, to whom I speak, a barbarian, and he that speaketh, a barbarian to me.
  "26": So you also, forasmuch as you are zealous of spirits, seek to abound unto the edifying of the church.
  "27": And therefore he that speaketh in a tongue, pray that he may interpret.
  "28": For if I pray in a tongue, my spirit prayeth, but my understanding is without fruit.
  "29": 'What is it then? I will pray with the spirit, I will pray also with the understanding: I will sing with the spirit, I will sing also with the understanding:'
  "30": Else if thou shalt bless with the spirit, how shall he that holdeth the place of the unlearned say Amen to thy blessing? because he knoweth not what thou sayest.
  "31": For thou indeed givest thanks well, but the other is not edified.
  "32": I thank my God, that I speak with all your tongues.
  "33": But in the church I had rather speak five words with my understanding, that I may instruct others also, than ten thousand words in a tongue.
  "34": 'Brethren, do not become children in sense,: but in malice be children, and in sense be perfect.'
  "35": 'In the law it is written: *That in other tongues, and other lips, I will speak to this people: and neither so will they hear me, saith the Lord.'
  "36": 'Wherefore tongues are for a sign, not to believers, but to unbelievers: but prophecies, not to unbelievers, but to believers.'
  "37": If, therefore, the whole church come together into one place, and all speak with tongues, and there come in unlearned persons, or unbelievers, will they not say that you are mad?
  "38": But if all prophesy, and there come in one that believeth not, or one unlearned, he is convinced of all, he is judged of all.
  "39": The secrets of his heart are made manifest, and so, falling down on his face, he will adore God, affirming that God is among you indeed.
  "40": 'How is it then, brethren? When you come together, every one of you hath a psalm, hath a doctrine, hath a revelation, hath a tongue, hath an interpretation: let all things be done unto edification.'
  "41": If any speak with a tongue, let it be by two, or at the most by three, and in course, and let one interpret.
  "42": But if there be no interpreter, let him hold his peace in the church, and speak to himself and to God.
  "43": 'And let the prophets speak, two or three: and let the rest judge.'
  "44": But if any thing be revealed to another sitting, let the first hold his peace.
  "45": 'For you may all prophesy one by one: that all may learn, and all may be exhorted:'
  "46": And the spirits of the prophets are subject to the prophets.
  "47": 'For he is not the God of dissension, but of peace: as also I teach in all the churches of the saints.'
  "48": 'Let women keep silence in the churches: for it is not permitted to them to speak, but to be subject, *as also the law saith.'
  "49": But if they would learn any thing, let them ask their husbands at home. For it is a shame for a woman to speak in the church.
  "50": Or did the word of God come out from you? Or came it only unto you?
  "51": If any man seem to be a prophet, or spiritual, let him know the things that I write to you, that they are the commandments of the Lord.
  "52": But if any man know not, he shall not be known.
  "53": 'Wherefore, brethren, be zealous to prophesy: and forbid not to speak with tongues.'
  "54": But let all things be done decently, and according to order.
