language: English
book: Psalmi
chapter: "51"
verses:
  "1": 'Unto the end, understanding for David,  when Doeg, the Edomite, came and told Saul: David went to the house of Achimelech. [ Kings xxii. .]'
  "2": Why dost thou glory in malice, thou that art mighty in iniquity?
  "3": 'All the day long thy tongue hath devised injustice: as a sharp razor, thou hast wrought deceit.'
  "4": Thou hast loved malice more than goodness; and iniquity rather than to speak righteousness.
  "5": Thou hast loved all the words of ruin, O deceitful tongue.
  "6": 'Therefore will God destroy thee for ever: he will pluck thee out, and remove thee from thy dwelling-place: and thy root out of the land of the living.'
  "7": 'The just shall see and fear, and shall laugh at him, and say: '
  "8": 'Behold the man that made not God his helper: But trusted in the abundance of his riches: and prevailed in his vanity.'
  "9": But I, as a fruitful olive-tree in the house of God, have hoped in the mercy of God for ever; yea, for ever and ever.
  "10": 'I will praise thee for ever, because thou hast done it: and I will wait on thy name, for it is good in the sight of thy saints.'
