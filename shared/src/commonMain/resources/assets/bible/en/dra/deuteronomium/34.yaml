language: English
book: Deuteronomium
chapter: "34"
verses:
  "1": Moses seeth the promised land, but is not suffered to go into it. He dieth at the age of  years. God burieth his body secretly, and all Israel mourn for him thirty days. Josue, replenished (by the imposition of Moses' hands) with the spirit of God, succeedeth. But Moses, for his special familiarity with God and for most wonderful miracles, is commended above all other prophets.
  "2": 'Then *Moses went up from the plains of Moab, upon Mount Nebo, to the top of Phasga, **over-against Jericho: and the Lord shewed him all the land of Galaad, as far as Dan,'
  "3": And all Nephthali, and the land of Ephraim and Manasses, and all the land of Juda unto the furthermost sea,
  "4": And the south part, and the breadth of the plain of Jericho, the city of palm-trees, as far as Segor.
  "5": 'And the Lord said to him: *This is the land, for which I swore to Abraham, Isaac, and Jacob, saying: I will give it to thy seed. Thou hast seen it with thy eyes, and shalt not pass over to it.'
  "6": 'And Moses, the servant of the Lord, died there, in the land of Moab, by the commandment of the Lord:'
  "7": 'And he buried him in the valley of the land of Moab, over-against Phogor: and no man hath known of his sepulchre until this present day.'
  "8": 'Moses was a hundred and twenty years old when he died: his eye was not dim, neither were his teeth moved.'
  "9": 'And the children of Israel mourned for him, in the plains of Moab, thirty days: and the days of their mourning, in which they mourned for Moses, were ended.'
  "10": And Josue, the son of Nun, was filled with the spirit of wisdom, because Moses had laid his hands upon him. And the children of Israel obeyed him, and did as the Lord commanded Moses.
  "11": And there arose no more a prophet in Israel, like unto Moses, whom the Lord knew face to face,
  "12": In all the signs and wonders which he sent by him, to do in the land of Egypt to Pharao, and to all his servants, and to his whole land,
  "13": And all the mighty hand, and great miracles, which Moses did before all Israel.
