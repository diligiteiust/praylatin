bible: jerusalem
lang: es
language: Español
book: Esther
chapter: "13"
verses:
  "1": 'He aquí el texto de la carta: «El gran rey Asuero, a los jefes y gobernadores, súbditos suyos, de las 127 provincias que van desde la India hasta Etiopía, les escribe lo siguiente:'
  "2": «Puesto al frente de muchos pueblos, y siendo señor de toda la tierra, he procurado no dejarme arrastrar por el orgullo del poder, sino gobernar siempre del modo más conveniente y benigno, manteniendo tranquilas en toda ocasión las vidas de mis súbditos, ofreciendo un reino culto y en seguridad hasta sus últimas fronteras y haciendo florecer la paz, tan deseada de todos los hombres.
  "3": Queriendo yo saber, por medio de mis consejeros, cómo podría llevar a buen término mis intenciones, uno de ellos, distinguido entre todos por su prudencia y señalado por su inquebrantable lealtad y su firme fidelidad, segundo en el reino por su dignidad, Amán,
  "4": nos denunció que se hallaba diseminado, entre todas las tribus del universo, un pueblo hostil, opuesto por sus leyes a todas las gentes, que rechaza constantemente las órdenes reales, de modo que no hay seguridad en el programa de gobierno que nosotros, con indiscutible acierto, venimos ejecutando.
  "5": «Considerando, pues, que este pueblo se mantiene aislado y en total oposición a todos los hombres, que vive según leyes exóticas y es hostil a nuestros intereses, llevando a cabo los peores crímenes para que no se consiga la estabilidad del reino,
  "6": hemos decidido que todos los que os han sido señalados en cartas de Amán, encargado de nuestros negocios y nuestro segundo padre, sean exterminados de raíz, con sus mujeres y sus niños, por la espada de sus enemigos, sin ninguna compasión ni miramiento, el día catorce del mes doce de Adar del presente año,
  "7": de modo que los malévolos de ayer y hoy desciendan en un solo día al Hades por la violencia y nos permitan gozar, en los días futuros, de la perpetua paz y seguridad.»
  "8": 'Mardoqueo oró al Señor, acordándose de todas sus maravillas, y exclamó:'
  "9": «¡Señor, Señor, Rey Omnipotente! Todo está sometido a tu poder, y no hay quien pueda resistir tu voluntad si has decidido salvar a Israel.
  "10": Tú hiciste el cielo y la tierra y cuantas maravillas existen bajo el cielo.
  "11": Eres Señor de todo, y nadie puede oponerse a ti, Señor.
  "12": Tú lo conoces todo, tú sabes, Señor, que no por insolencia, orgullo o pundonor, hice yo esto de rehusar inclinarme ante el orgulloso Amán,
  "13": pues gustoso besaría las plantas de sus pies por la salvación de Israel.
  "14": Pero yo lo hice por no rendir a un hombre gloria por encima de la gloria de Dios; no me postraré ante nadie, sino ante ti solo, Señor; y no dicta el orgullo mi conducta.
  "15": Ahora, pues, Señor, Dios, Rey, Dios de Abraham, perdona a tu pueblo, porque andan mirando cómo destruirnos y han deseado exterminar la heredad que fue tuya desde siempre.
  "16": No desprecies tu parte, la que rescataste para ti del país de Egipto.
  "17": Escucha mi oración, muéstrate propicio a tu heredad; convierte nuestro duelo en alegría, para que, viviendo, cantemos himnos a tu Nombre, Señor. No tapes la boca de los que te alaban.»
  "18": Todo Israel clamaba con todas sus fuerzas, pues tenían la muerte ante los ojos.
