bible: jerusalem
lang: es
language: Español
book: Ieremias
chapter: "29"
verses:
  "1": Este es el tenor de la carta que envió el profeta Jeremías desde Jeursalén al resto de los ancianos de la deportación, a los sacerdotes, profetas y pueblo en general, que había deportado Nabucodonosor desde Jerusalén a Babilonia
  "2": '- después de salir de Jerusalén el rey Jeconías y la Gran Dama, los eunucos, los jefes de Judá y Jerusalén, los herreros y cerrajeros -,'
  "3": 'por mediación de Elasá, hijo de Safán, y de Guemarías, hijo de Jilquías, a quienes Sedecías, rey de Judá, envió a Babilonia, donde Nabucodonosor, rey de Babilonia:'
  "4": '«Así dice Yahveh Sebaot, el Dios de Israel, a toda la deportación que deporté de Jerusalén a Babilonia:'
  "5": Edificad casas y habitadlas; plantad huertos y comed su fruto;
  "6": tomad mujeres y engendrad hijos e hijas; casad a vuestros hijos y dad vuestras hijas a maridos para que den a luz hijos e hijas, y medrad allí y no mengüéis;
  "7": procurad el bien de la ciudad a donde os he deportado y orad por ella a Yahveh, porque su bien será el vuestro.
  "8": 'Así dice Yahveh Sebaot, el dios de Israel: No os embauquen los profetas que hay entre vosotros ni vuestros adivinos, y no hagáis caso de vuestros soñadores que sueñan por cuenta propia,'
  "9": porque falsamente os profetizan en mi Nombre. Yo no los he enviado - oráculo de Yahveh -.
  "10": '«Pues así dice Yahveh: Al filo de cumplírsele a Babilonia setenta años, yo os visitaré y confirmaré sobre vosotros mi favorable promesa de volveros a este lugar;'
  "11": que bien me sé los pensamientos que pienso sobre vosotros - oráculo de Yahveh - pensamientos de paz, y no de desgracia, de daros un porvenir de esperanza.
  "12": Me invocaréis y vendréis a rogarme, y yo os escucharé.
  "13": Me buscaréis y me encontraréis cuando me solicitéis de todo corazón;
  "14": me dejaré encontrar de vosotros (- oráculo de Yahveh -; devolveré vuestros cautivos, os recogeré de todas las naciones y lugares a donde os arrojé - oráculo de Yahveh - y os haré tornar al sitio de donde os hice que fueseis desterrados).
  "15": '«En cuanto a eso que decís: "Nos ha suscitado Yahveh profetas en Babilonia",'
  "16": así dice Yahveh del rey que se sienta sobre el solio de David y de todo el pueblo que se asienta en esta ciudad, los hermanos vuestros que no salieron con vosotros al destierro;
  "17": 'así dice Yahveh Sebaot: He aquí que yo suelto contra ellos la espada, el hambre y la peste, y los pondré como aquellos higos reventados,, tan malos que no se podían comer.'
  "18": 'Los perseguiré con la espada, el hambre y la peste, y los convertiré en espantajo para todos los reinos de la tierra: maldición, pasmo, rechifla y oprobio entre todas las naciones a donde los arroje,'
  "19": por cuanto que no oyeron las palabras - oráculo de Yahveh - que les envié por mis siervos los profetas asiduamente; pero no oísteis - oráculo de Yahveh -.
  "20": Vosotros, pues, oíd la palabra de Yahveh, todos los deportados que envié de Jerusalén a Babilonia.
  "21": '«Así dice Yahveh Sebaot, el Dios de Israel, sobre Ajab, hijo de Colaías, y sobre Sedecías, hijo de Maasías, que os profetizan falsamente en mi Nombre: He aquí que yo los pongo en manos de Nabucodonosor, rey de Babilonia; él los herirá ante vuestros ojos,'
  "22": 'y de ellos tomarán esta maldición todos los deportados de Judá que se encuentran en Babilonia: "Vuélvate Yahveh como a Sedecías y como a Ajab, a quienes asó al fuego el rey de Babilonia",'
  "23": porque obraron con fatuidad en Jerusalén, cometieron adulterio con las mujeres de sus prójimos y fingieron pronunciar en mi Nombre palabras que yo no les mandé. Yo soy sabedor y testigo - oráculo de Yahveh -.»
  "24": 'Semaías el najlamita despachó en su propio nombre cartas (a todo el pueblo que hay en Jerusalén) a Sofonías, hijo del sacerdote Maasías (y a todos los sacerdotes), diciendo:'
  "26": '«Yahveh te ha puesto por sacerdote en vez del sacerdote Yehoyadá como inspector en la Casa de Yahveh de todos los locos y seudoprofetas: tú debes meterlos en los cepos y en el calabozo.'
  "27": Pues entonces, ¿por qué no has sancionado a Jeremías de Anatot que se os hace pasar por profeta?
  "28": 'Porque, en efecto, nos ha enviado a Babilonia un mensaje diciendo: "Es para largo. Edificad casas y habitadlas; plantad huertos y comed su fruto"»'
  "29": El sacerdote Sofonías leyó esta carta a oídos del profeta Jeremías.
  "30": 'Entonces fue dirigida la palabra de Yahveh a Jeremías en estos términos:'
  "31": '«Envía este mensaje a todos los deportados: Así dice Yahveh respecto a Semaías el najlamita, por haberos profetizado sin haberle yo enviado, inspirándoos una falsa seguridad.'
  "32": 'Sí, por cierto, así dice Yahveh: He aquí que yo voy a visitar a Semaías el najlamita y a su descendencia. No habrá en ella ninguno que se siente en medio de este pueblo ni que vea el bien que yo haga a mi pueblo - oráculo de Yahveh - porque predicó la desobediencia a Yahveh.»'
