bible: jerusalem
lang: es
language: Español
book: Esther
chapter: "16"
verses:
  "1": 'He aquí el texto de la carta: «El gran rey Asuero, a los sátrapas de las 127 provincias comprendidas entre la India y Etiopía, y a todos nuestros fieles súbditos, salud:'
  "2": Hay muchos que, cuanto más abundantes favores reciben de sus bienhechores, tanto más se dejan arrastrar por el orgullo.
  "3": Y no contentos con tramar la perdición de nuestros súbditos, e incapaces ya de poner límites a su insolencia, llegan a conspirar contra sus propios bienhechores;
  "4": y no sólo hacen desaparecer la gratitud de entre los hombres, sino que, envanecidos con la jactancia de los que obran el mal, se imaginan que podrán escapar a la justicia de Dios, que odia toda maldad y a la que nada se oculta.
  "5": Sucede con frecuencia, a muchos de los que detentan la autoridad, que, por haberse dejado influenciar por sus amigos, y haber dejado en sus manos la administración de los negocios, se han hecho cómplices de sangre inocente, y se han visto arrastrados a desgracias irremediables,
  "6": pues con perversos razonamientos, nacidos de su maldad, consiguieron engañar la natural nobleza de sentimientos de las autoridades.
  "7": Y no es necesario, para comprobar todo esto, acudir a las antiguas historias que acabamos de mencionar, sino que basta con observar lo que en nuestra misma presencia lleva a cabo la pestilente ralea de los que indignamente detentan el poder.
  "8": En consecuencia, nos proponemos procurar, en lo sucesivo, paz y tranquilidad para todos los hombres de nuestro reino,
  "9": haciendo los cambios oportunos y juzgando las cosas que se nos expongan con espíritu abierto y benevolente.
  "10": Porque, en efecto, Amán, hijo de Hamdatá, macedonio y, a la verdad, extraño a la raza de los persas y muy alejado de nuestra benevolencia,
  "11": fue recibido por nosotros como huésped y tratado con aquella humanidad que nosotros usamos con todos los pueblos, a tal punto que era públicamente llamado «nuestro padre» y había obtenido el segundo puesto en el reino; todos se postraban ante él;
  "12": pero dominado por su orgullo, intentó arrebatarnos el poder y la vida.
  "13": Comenzó pidiéndonos, con toda suerte de falaces argumentos, la muerte de Mardoqueo, nuestro salvador y bienhechor continuo, la de Ester, irreprochable compañera de nuestro reino, y la de todo su pueblo,
  "14": para aislarnos por este medio y poder entregar a los macedonios el dominio de los persas.
  "15": Pero nosotros hemos comprobado que los judíos, condenados al exterminio por aquel hombre tres veces criminal, no son malhechores, sino que se gobiernan por leyes enteramente justas;
  "16": y que son hijos del Altísimo, del gran Dios vivo, que, para bien nuestro y de nuestros padres, mantiene el reino en el más floreciente estado.
  "17": Haréis, pues, bien no teniendo en cuenta las cartas que os ha enviado Amán, hijo de Hamdatá,
  "18": 'atendido que el autor de ellas ha sido colgado, con toda su familia, a las puertas de Susa: castigo merecido que, sin tardar, le ha enviado Dios, Señor universal.'
  "19": Poned una copia de esta carta en todo lugar público y dejad que los judíos se rijan libremente por sus leyes;
  "20": prestadles ayuda para que puedan rechazar a cuantos les ataquen el día designado para su destrucción, es decir, el día trece del mes doce, el mes de Adar,
  "21": porque el Dios, Señor universal, ha mudado en gozo el día destinado a la destrucción y al exterminio de la raza elegida.
  "22": Cuanto a vosotros, judíos, celebraréis con toda suerte de regocijos este día insigne, como una de vuestras solemnidades,
  "23": para que ahora y en el futuro sea salvación para vosotros y para los persas de buena voluntad; y a los que se conjuran contra vosotros les sirva de recuerdo de su ruina.
  "24": Cualquier ciudad, o, en general, cualquier provincia que no se conformare a esto, será implacablemente aniquilada a lanza y fuego, y no sólo será inhabitable para los hombres, sino también odiosa por siempre para las bestias y las aves.»
