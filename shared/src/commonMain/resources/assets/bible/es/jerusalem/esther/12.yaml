bible: jerusalem
lang: es
language: Español
book: Esther
chapter: "12"
verses:
  "1": Vivía Mardoqueo en el palacio con Bigtán y Teres, dos eunucos del rey, guardianes del palacio.
  "2": Les oyó sus proyectos, descubrió sus intenciones y se enteró de que estaban dispuestos a poner sus manos en el rey Asuero. Entonces Mardoqueo los denunció al rey,
  "3": que sometió a interrogatorio a los dos eunucos; y habiendo ellos confesado la verdad, fueron llevados al suplicio.
  "4": El rey hizo escribir todo esto para memoria; también Mardoqueo, por su parte, escribió sobre estos sucesos.
  "5": Por aquel servicio, el rey confió a Mardoqueo un puesto en palacio y le hizo regalos.
  "6": Pero Amán, hijo de Hamdatá, del país de Agag, que gozaba del favor real, buscaba la ruina de Mardoqueo y de su pueblo, por el asunto de los dos eunucos del rey.
