bible: jerusalem
lang: es
language: Español
book: Ieremias
chapter: "27"
verses:
  "1": (Al principio del reinado de Sedecías, hijo de Josías, rey de Judá, fue dirigida esta palabra a Jeremías de parte de Yahveh:)
  "2": 'Así me ha dicho Yahveh: «Hazte unas coyundas y un yugo, póntelo sobre la cerviz,'
  "3": y envíalos al rey de Edom, al rey de Moab y al rey de los ammonitas, al rey de Tiro y al rey de Sidón por medio de los embajadores que vienen a Jerusalén a ver a Sedecías, rey de Judá,
  "4": 'y dales estas instrucciones para sus señores: «Así dice Yahveh Sebaot, el Dios de Israel: Así diréis a vuestros señores:'
  "5": Yo hice la tierra, el hombre y las bestias que hay sobre la haz de la tierra, con mi gran poder y mi tenso brazo, y lo di a quien me plugo.
  "6": Ahora yo he puesto todos estos países en manos de mi siervo Nabucodonosor, rey de Babilonia, y también los animales del campo le he dado para servirle
  "7": (y todas las naciones le servirán a él, a su hijo y al hijo de su hijo, hasta que llegue también el turno a su propio país - y le reducirán a servidumbre muchas naciones y reyes grandes -).
  "8": Así que las naciones y reinos que no sirvan a Nabucodonosor, rey de Babilonia, y que no sometan su cerviz al yugo del rey de Babilonia, con la espada, con el hambre y con la peste los visitaré - oráculo de Yahveh - hata acabarlos por medio de él.
  "9": 'Vosotros, pues, no oigáis a vuestros profetas, adivinos, soñadores, augures ni hechiceros que os hablan diciendo: "No serviréis al rey de Babilonia",'
  "10": porque cosa falsa os profetizan para alejaros de sobre vuestro suelo, de suerte que yo os arroje y perezcáis.
  "11": Pero la nación que someta su cerviz al yugo de Babilonia y le sirva, yo la dejaré tranquila en su suelo - oráculo de Yahveh - y lo labrará y morará en él.»
  "12": 'A Sedecías, rey de Judá, le hablé en estos mismos términos, diciendo: «Someted vuestras cervices al yugo del rey de Babilonia, servidle a él y a su pueblo, y quedaréis con vida.'
  "13": (¿A qué morir tú y tu pueblo por la espada, el hambre y la peste, como ha amenazado Yahveh a aquella nación que no sirva al rey de Babilonia?)
  "14": '¡No oigáis, pues, las palabras de los profetas que os dicen: "No serviréis al rey de Babilonia", porque cosa falsa os profetizan,'
  "15": pues yo no les he enviado - oráculo de Yahveh - y ellos andan profetizando en mi Nombre falsamente; no sea que yo os arroje, y perezcáis vosotros y los profetas que os profetizan.»
  "16": 'Y a los sacerdotes y a todo este pueblo les hablé diciendo: «Así dice Yahveh: No oigáis las palabras de vuestros profetas que os profetizan diciendo: "He aquí que el ajuar de la Casa de Yahveh va a ser devuelto de Babilonia en seguida", porque cosa falsa os profetizan.'
  "17": (No les hagáis caso. Servid al rey de Babilonia y quedaréis con vida. ¿Para qué ha de quedar esta ciudad arrasada?)
  "18": Y si ellos son profetas y la palabra de Yahveh les acompaña, que conjuren, ea, a Yahveh Sebaot para que los objetos que quedaron en la Casa de Yahveh, en la casa del rey de Judá y en Jerusalén no vayan a Babilonia.
  "19": Porque así dice Yahveh Sebaot de las columnas, del Mar, de las basas y de los demás objetos que quedaron en esta ciudad,
  "20": de los cuales no se apoderó Nabucodonosor, rey de Babilonia, al deportar a Jeconías, hijo de Yoyaquim, rey de Judá, de Jerusalén a Babilonia (así como a todos los nobles de Judá y Jerusalén).
  "21": 'Sí, porque así dice Yahveh Sebaot, el Dios de Israel, respecto a los objetos que quedaron en la Casa de Yahveh, en la casa del rey de Judá y en Jerusalén:'
  "22": A Babilonia serán llevados (y allí estarán hasta el día que yo los visite) - oráculo de Yahveh - (y entonces los subiré y devolveré a este lugar).»
