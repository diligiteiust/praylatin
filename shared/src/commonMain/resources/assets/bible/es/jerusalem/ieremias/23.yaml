bible: jerusalem
lang: es
language: Español
book: Ieremias
chapter: "23"
verses:
  "1": ¡Ay de los pastores que dejan perderse y desparrarmarse las ovejas de mis pastos! - oráculo de Yahveh -.
  "2": 'Pues así dice Yahveh, el Dios de Israel, tocante a los pastores que apacientan a mi pueblo: Vosotros habéis dispersado las ovejas mías, las empujasteis y no las atendisteis. Mirad que voy a pasaros revista por vuestras malas obras - oráculo de Yahveh -.'
  "3": Yo recogeré el Resto de mis ovejas de todas las tierras a donde las empujé, las haré tornar a sus estancias, criarán y se multiplicarán.
  "4": Y pondré al frente de ellas pastores que las apacienten, y nunca más estarán medrosas ni asustadas, ni faltará ninguna - oráculo de Yahveh -.
  "5": 'Mirad que días vienen - oráculo de Yahveh - en que suscitaré a David un Germen justo: reinará un rey prudente, practicará el derecho y la justicia en la tierra.'
  "6": 'En sus días estará a salvo Judá, e Israel vivirá en seguro. Y este es el nombre con que te llamarán: «Yahveh, justicia nuestra.»'
  "7": 'Por tanto, mirad que vienen días - oráculo de Yahveh - en que no se dirá más: «¡Por vida de Yahveh, que subió a los hijos de Israel de Egipto!»,'
  "8": 'sino: «¡Por vida de Yahveh, que subió y trajo la simiente de la casa de Israel de tierras del norte y de todas las tierras a donde los arrojara!», y habitarán en su propio suelo.'
  "9": A los profetas. Se me partió el corazón en mis adentros, estremeciéronse todos mis huesos, me quedé como un borracho, como aquél a quien le domina el vino, por causa de Yahveh, por causa de sus santas palabras.
  "10": «Porque de fornicadores se ha henchido la tierra. (A causa de una maldición se ha enlutado la tierra, se han secado los pastos de la estepa.) Se ha vuelto la carrera de ellos mala y su esfuerzo no recto.
  "11": Tanto el profeta como el sacerdote se han vuelto impíos; en mi misma Casa topé con su maldad - oráculo de Yahveh -.
  "12": 'Por ende su camino vendrá a ser su despeñadero: a la sima serán empujados y caerán en ella. Porque voy a traer sobre ellos una calamidad, al tiempo de su visita» - oráculo de Yahveh -.'
  "13": 'En los profetas de Samaría, he observado una inepcia: profetizaban por Baal y hacían errar a mi pueblo Israel.'
  "14": 'Mas en los profetas de Jerusalén he observado una monstruosidad: fornicar y proceder con falsía, dándose la mano con los malhechores, sin volverse cada cual de su malicia. Se me han vuelto todos ellos cual Sodoma, y los habitantes de la ciudad, cual Gomorra.'
  "15": 'Por tanto, así dice Yahveh Sebaot tocante a los profetas: He aquí que les voy a dar de comer ajenjo y les voy a dar de beber agua emponzoñada. Porque a partir de los profetas de Jerusalén se ha propagado la impiedad por toda la tierra.'
  "16": 'Así dice Yahveh Sebaot: No escuchéis las palabras de los profetas que os profetizan. Os están embaucando. Os cuentan sus propias fantasías, no cosa de boca de Yahveh.'
  "17": 'Dicen a los que me desprecian: «Yahveh dice: ¡Paz tendréis!» y a todo el que camina en terquedad de corazón: «No os sucederá nada malo.»'
  "18": (Porque ¿quién asistió al consejo de Yahveh y vio y oyó su palabra?, ¿quién escuchó su palabra y la ha oído?)
  "19": Mirad que una tormenta de Yahveh, su ira, ha estallado, un torbellino remolinea, sobre la cabeza de los malos descarga.
  "20": No ha de apaciguarse la ira de Yahveh hasta que la ejecute, y realice los designios de su corazón. En días futuros os percataréis de ello.
  "21": Yo no envié a esos profetas, y ellos corrieron. No les hablé, y ellos profetizaron.
  "22": Pues si asistieron a mi consejo, hagan oír mi palabra a mi pueblo, y háganle tornar de su mal camino y de sus acciones malas.
  "23": ¿Soy yo un Dios sólo de cerca - oráculo de Yahveh - y no soy Dios de lejos?
  "24": ¿O se esconderá alguno en escondite donde yo no le vea? - oráculo de Yahveh -. ¿Los cielos y la tierra no los lleno yo? - oráculo de Yahveh -.
  "25": 'Ya he oído lo que dicen esos profetas que profetizan falsamente en mi nombre diciendo: «¡He tenido un sueño, he tenido un sueño!»'
  "26": ¿Hasta cuándo va a durar esto en el corazón de los profetas que profetizan en falso y son profetas de la impostura de su corazón?,
  "27": ¿los que piensan hacer olvidarse a mi pueblo de mi Nombre por los sueños que se cuentan cada cual a su vecino, como olvidaron sus padres mi Nombre por Baal?
  "28": Profeta que tenga un sueño, cuente un sueño, y el que tenga consigo mi palabra, que hable mi palabra fielmente. ¿Qué tiene que ver la paja con el grano? - oráculo de Yahveh -.
  "29": ¿No es así mi palabra, como el fuego, y como un martillo golpea la peña?
  "30": Pues bien, aquí estoy yo contra los profetas - oráculo de Yahveh - que se roban mis palabras el uno al otro.
  "31": Aquí estoy yo contra los profetas - oráculo de Yahveh - que usan de su lengua y emiten oráculo.
  "32": Aquí estoy yo contra los profetas que profetizan falsos sueños - oráculo de Yahveh - y los cuentan, y hacen errar a mi pueblo con sus falsedades y su presunción, cuando yo ni les he enviado ni dado órdenes, y ellos de ningún provecho han sido para este pueblo - oráculo de Yahveh -.
  "33": 'Y cuando te pregunte este pueblo - o un profeta o un sacerdote -. «¿Cuál es la carga de Yahveh?» les dirás: «Vosotros sois la carga, y voy a dejaros en el suelo - oráculo de Yahveh -.»'
  "34": 'Y el profeta, el sacerdote o cualquiera que dijere: «Una carga de Yahveh», yo me las entenderé con él y con su casa.'
  "35": 'Así os diréis cada uno a su prójimo, y cada uno a su hermano: «¿Qué ha respondido Yahveh?, ¿qué ha dicho Yahveh?»'
  "36": Pero de eso de la «carga de Yahveh» no os acordaréis más, porque tal carga sería para cada uno su propia palabra. Porque trastornáis las palabras del Dios vivo, Yahveh Sebaot nuestro Dios.
  "37": 'Así diréis al profeta: «¿Qué te ha respondido Yahveh?, ¿qué ha dicho Yahveh?»'
  "38": 'Pero como habléis de «carga de Yahveh», entonces así dice Yahveh: «Por haber dicho eso de carga de Yahveh por más que os avisé que no dijerais carga de Yahveh,'
  "39": por lo mismo, he aquí que yo os levanto en alto y os dejo caer a vosotros y a la ciudad que os di a vosotros y a vuestros padres.
  "40": Y os pondré encima oprobio eterno y baldón eterno que no será olvidado.»
