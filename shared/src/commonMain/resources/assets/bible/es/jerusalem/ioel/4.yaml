bible: jerusalem
lang: es
language: Español
book: Ioel
chapter: "4"
verses:
  "1": «Porque he aquí que en aquellos días, en el tiempo aquel, cuando yo cambie la suerte de Judá y Jerusalén,
  "2": 'congregaré a todas las naciones y las haré bajar al Valle de Josafat: allí entraré en juicio con ellas, acerca de mi pueblo y mi heredad, Israel. Porque lo dispersaron entre las naciones, y mi tierra se repartieron.'
  "3": Y echaron suertes sobre mi pueblo, cambiaron el niño por la prostituta, y a la niña la vendieron por vino para beber.»
  "4": «Y vosotros también, ¿qué sois para mí, Tiro y Sidón, y distritos todos de Filistea? ¿Queréis exigir paga de mí? Mas, si queréis cobrar de mí, ¡bien pronto he de volver sobre vuestra cabeza vuestra paga!
  "5": Vosotros que arrebatasteis mi plata y mi oro, que llevasteis a vuestros templos mis mejores alhajas,
  "6": y a los hijos de Judá y Jerusalén los vendisteis a los hijos de Yaván, para alejarlos de su término.
  "7": 'He aquí que yo los voy a reclamar del lugar donde los vendisteis, y volveré sobre vuestra cabeza vuestra paga:'
  "8": venderé vuestros hijos y vuestras hijas en manos de los hijos de Judá, y ellos los venderán a los sabeos, a una nación lejana, ¡porque ha hablado Yahveh!»
  "9": 'Publicad esto entre las naciones: ¡Proclamad la guerra, incitad a los bravos! ¡Que avancen y suban todos los hombres de guerra!'
  "10": 'Forjad espadas de vuestros azadones y lanzad de vuestras podaderas; y diga el débil: «¡Soy un bravo!»'
  "11": ¡Daos prisa, venid, naciones todas circundantes, y congregaos allá! (¡Haz bajar, Yahveh, a tus bravos!)
  "12": «¡Despiértense y suban las naciones al Valle de Josafat! Que allí me sentaré yo para juzgar a todas las naciones circundantes.
  "13": Meted la hoz, porque la mies está madura; venid, pisad, que el lagar está lleno, y las cavas rebosan, tan grande es su maldad.»
  "14": ¡Multitudes y multitudes en el Valle de la Decisión! Porque está cerca el Día de Yahveh, en el Valle de la Decisión.
  "15": El sol y la luna se oscurecen, las estrellas retraen su fulgor.
  "16": 'Ruge Yahveh desde Sión, desde Jerusalén da su voz: ¡el cielo y la tierra se estremecen! Mas Yahveh será un refugio para su pueblo, una fortaleza para los hijos de Israel.'
  "17": «Sabréis entonces que yo soy Yahveh vuestro Dios, que habito en Sión, mi monte santo. Santa será Jerusalén, y los extranjeros no pasarán más por ella.»
  "18": Sucederá aquel día que los montes destilarán vino y las colinas fluirán leche; por todas las torrenteras de Judá fluirán las aguas; y una fuente manará de la Casa de Yahveh que regará el valle de las Acacias.
  "19": Egipto quedará hecho una desolación, Edom un desierto desolado, por su violencia contra los hijos de Judá, por haber derramado sangre inocente en su tierra.
  "20": Pero Judá será habitada para siempre, y Jerusalén de edad en edad.
  "21": «Yo vengaré su sangre, no la dejaré impune», y Yahveh morará en Sión.
