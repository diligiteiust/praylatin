bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "125"
verses:
  "1": 'Cánticum gráduum. In converténdo Dóminus captivitátem Sion: facti sumus sicut consoláti:'
  "2": 'tunc replétum est gáudio os nostrum: et lingua nostra exsultatióne. Tunc dicent inter gentes: Magnificávit Dóminus fácere cum eis.'
  "3": 'Magnificávit Dóminus fácere nobíscum: facti sumus lætántes.'
  "4": Convérte Dómine captivitátem nostram, sicut torrens in austro.
  "5": Qui séminant in lácrymis, in exsultatióne metent.
  "6": Eúntes ibant et flebant, mitténtes sémina sua. Veniéntes autem vénient cum exsultatióne, portántes manípulos suos.
