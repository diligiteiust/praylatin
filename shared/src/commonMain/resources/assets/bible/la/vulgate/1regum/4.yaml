bible: vulgate
lang: la
language: Latina
book: I Regum
chapter: "4"
verses:
  "1": 'Erat autem rex Sálomon regnans super omnem Israel:'
  "2": 'et hi príncipes quos habébat: Azarías fílius Sadoc sacerdótis:'
  "3": 'Elíhoreph, et Ahía fílii Sisa scribæ: Iósaphat fílius Ahilud a commentáriis:'
  "4": 'Banaías fílius Ióiadæ super exércitum: Sadoc autem, et Abíathar sacerdótes:'
  "5": 'Azarías fílius Nathan super eos qui assistébant regi: Zabud fílius Nathan sacérdos, amícus regis:'
  "6": 'et Ahisar præpósitus domus: et Adoníram fílius Abda super tribúta.'
  "7": 'Habébat autem Sálomon duódecim præféctos super omnem Israel, qui præbébant annónam regi et dómui eius: per síngulos enim menses in anno, sínguli necessária ministrábant.'
  "8": 'Et hæc nómina eórum: Benhur in monte Ephraim.'
  "9": Béndecar in Macces, et in Sálebim, et in Béthsames, et in Elon, et in Béthanan.
  "10": 'Bénhesed in Aruboth: ipsíus erat Socho, et omnis terra Epher.'
  "11": 'Benabínadab, cuius omnis Nephath Dor: Tapheth fíliam Salomónis habébat uxórem.'
  "12": Bana fílius Ahilud regébat Thanac et Magéddo, et univérsam Bethsan, quæ est iuxta Sárthana subter Iézrahel, a Bethsan usque Abelméhula e regióne Iécmaan.
  "13": 'Béngaber in Ramoth Gálaad: habébat Avóthiair fílii Manásse in Gálaad: ipse prǽerat in omni regióne Argob, quæ est in Basan, sexagínta civitátibus magnis atque murátis, quæ habébant seras ǽreas.'
  "14": Ahínadab fílius Addo prǽerat in Mánaim.
  "15": 'Achímaas in Néphthali: sed et ipse habébat Básemath fíliam Salomónis in coniúgio.'
  "16": Báana fílius Husi in Aser, et in Baloth.
  "17": Iósaphat fílius Phárue in Issachar.
  "18": Sémei fílius Ela in Béniamin.
  "19": Gaber fílius Uri in terra Gálaad, in terra Sehon regis Amorrhǽi et Og regis Basan, super ómnia quæ erant in illa terra.
  "20": 'Iuda et Israel innumerábiles, sicut aréna maris in multitúdine: comedéntes, et bibéntes, atque lætántes.'
  "21": 'Sálomon autem erat in ditióne sua, habens ómnia regna a flúmine terræ Philísthiim usque ad términum Ægýpti: offeréntium sibi múnera, et serviéntium ei cunctis diébus vitæ eius.'
  "22": Erat autem cibus Salomónis per dies síngulos trigínta cori símilæ, et sexagínta cori farínæ,
  "23": decem boves pingues, et vigínti boves pascuáles, et centum aríetes, excépta venatióne cervórum, capreárum, atque bubalórum, et ávium altílium.
  "24": 'Ipse enim obtinébat omnem regiónem, quæ erat trans flumen, a Thaphsa usque ad Gazan, et cunctos reges illárum regiónum: et habébat pacem ex omni parte in circúitu.'
  "25": Habitabátque Iuda, et Israel absque timóre ullo, unusquísque sub vite sua, et sub ficu sua, a Dan usque Bersabée, cunctis diébus Salomónis.
  "26": Et habébat Sálomon quadragínta míllia præsépia equórum currílium, et duódecim míllia equéstrium.
  "27": 'Nutriebántque eos supradícti regis præfécti: sed et necessária mensæ regis Salomónis cum ingénti cura præbébant in témpore suo.'
  "28": Hórdeum quoque, et páleas equórum, et iumentórum, deferébant in locum ubi erat rex, iuxta constitútum sibi.
  "29": Dedit quoque Deus sapiéntiam Salomóni, et prudéntiam multam nimis, et latitúdinem cordis quasi arénam, quæ est in líttore maris.
  "30": Et præcedébat sapiéntia Salomónis sapiéntiam ómnium Orientálium et Ægyptiórum,
  "31": 'et erat sapiéntior cunctis homínibus: sapiéntior Ethan Ezrahíta, et Heman, et Chalcol, et Dorda fíliis Mahol: et erat nominátus in univérsis géntibus per circúitum.'
  "32": 'Locútus est quoque Sálomon tria míllia parábolas: et fuérunt cármina eius quinque et mille.'
  "33": 'Et disputávit super lignis, a cedro quæ est in Líbano, usque ad hyssópum, quæ egréditur de paríete: et disséruit de iuméntis, et volúcribus, et reptílibus, et píscibus.'
  "34": Et veniébant de cunctis pópulis ad audiéndam sapiéntiam Salomónis, et ab univérsis régibus terræ, qui audiébant sapiéntiam eius.
