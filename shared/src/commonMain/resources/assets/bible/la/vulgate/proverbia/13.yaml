bible: vulgate
lang: la
language: Latina
book: Proverbia
chapter: "13"
verses:
  "1": 'Fílius sápiens, doctrína patris: qui autem illúsor est, non audit cum argúitur.'
  "2": 'De fructu oris sui homo satiábitur bonis: ánima autem prævaricatórum iníqua.'
  "3": 'Qui custódit os suum, custódit ánimam suam: qui autem inconsiderátus est ad loquéndum, séntiet mala.'
  "4": 'Vult et non vult piger: ánima autem operántium impinguábitur.'
  "5": 'Verbum mendax iustus detestábitur: ímpius autem confúndit, et confundétur.'
  "6": 'Iustítia custódit innocéntis viam: impíetas autem peccatórem supplántat.'
  "7": 'Est quasi dives, cum nihil hábeat: et est quasi pauper, cum in multis divítiis sit.'
  "8": 'Redémptio ánimæ viri, divítiæ suæ: qui autem pauper est, increpatiónem non sústinet.'
  "9": 'Lux iustórum lætíficat: lucérna autem impiórum exstinguétur.'
  "10": 'Inter supérbos semper iúrgia sunt: qui autem agunt ómnia cum consílio, regúntur sapiéntia.'
  "11": 'Substántia festináta minuétur: quæ autem paulátim collígitur manu, multiplicábitur.'
  "12": 'Spes, quæ différtur, afflígit ánimam: lignum vitæ desidérium véniens.'
  "13": 'Qui détrahit alícui rei, ipse se in futúrum óbligat: qui autem timet præcéptum, in pace versábitur. Animæ dolósæ errant in peccátis: iusti autem misericórdes sunt, et miserántur.'
  "14": Lex sapiéntis fons vitæ, ut declínet a ruína mortis.
  "15": 'Doctrína bona dabit grátiam: in itínere contemptórum vorágo.'
  "16": 'Astútus ómnia agit cum consílio: qui autem fátuus est, áperit stultítiam.'
  "17": 'Núntius ímpii cadet in malum: legátus autem fidélis, sánitas.'
  "18": 'Egéstas, et ignomínia ei, qui déserit disciplínam: qui autem acquiéscit arguénti, glorificábitur.'
  "19": 'Desidérium si compleátur, deléctat ánimam: detestántur stulti eos, qui fúgiunt mala.'
  "20": 'Qui cum sapiéntibus gráditur, sápiens erit: amícus stultórum símilis efficiétur.'
  "21": 'Peccatóres perséquitur malum: et iustis retribuéntur bona.'
  "22": 'Bonus relínquit herédes fílios, et nepótes: et custodítur iusto substántia peccatóris.'
  "23": 'Multi cibi in noválibus patrum: et áliis congregántur absque iudício.'
  "24": 'Qui parcit virgæ, odit fílium suum: qui autem díligit illum, instánter érudit.'
  "25": 'Iustus cómedit, et replet ánimam suam: venter autem impiórum insaturábilis.'
