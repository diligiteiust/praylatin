bible: vulgate
lang: la
language: Latina
book: Numeri
chapter: "34"
verses:
  "1": 'Locutúsque est Dóminus ad Móysen, dicens:'
  "2": 'Prǽcipe fíliis Israel, et dices ad eos: Cum ingréssi fuéritis terram Chánaan, et in possessiónem vobis sorte cecíderit, his fínibus terminábitur.'
  "3": 'Pars meridiána incípiet a solitúdine Sin, quæ est iuxta Edom: et habébit términos contra oriéntem mare salsíssimum.'
  "4": Qui circuíbunt austrálem plagam per ascénsum Scorpiónis, ita ut tránseant in Senna, et pervéniant a merídie usque ad Cadesbárne, unde egrediéntur confínia ad villam nómine Adar, et tendent usque ad Asemóna.
  "5": Ibítque per gyrum términus ab Asemóna usque ad torréntem Ægýpti, et maris magni líttore finiétur.
  "6": Plaga autem occidentális a mari magno incípiet, et ipso fine claudétur.
  "7": Porro ad septentrionálem plagam a mari magno términi incípient, perveniéntes usque ad montem altíssimum,
  "8": 'a quo vénient in Emath usque ad términos Sedáda:'
  "9": ibúntque confínia usque ad Zephróna, et villam Enan. Hi erunt términi in parte aquilónis.
  "10": Inde metabúntur fines contra orientálem plagam de villa Enan usque Sepháma,
  "11": 'et de Sepháma descéndent términi in Rebla contra fontem Daphnim: inde pervénient contra oriéntem ad mare Cénereth,'
  "12": et tendent usque ad Iordánem, et ad últimum salsíssimo claudéntur mari. Hanc habébitis terram per fines suos in circúitu.
  "13": 'Præcepítque Móyses fíliis Israel, dicens: Hæc erit terra, quam possidébitis sorte, et quam iussit Dóminus dari novem tríbubus, et dimídiæ tríbui.'
  "14": Tribus enim filiórum Ruben per famílias suas, et tribus filiórum Gad iuxta cognatiónum númerum, média quoque tribus Manásse,
  "15": id est, duæ semis tribus, accepérunt partem suam trans Iordánem contra Iéricho ad orientálem plagam.
  "16": 'Et ait Dóminus ad Móysen:'
  "17": Hæc sunt nómina virórum, qui terram vobis dívident, Eleázar sacérdos, et Iósue fílius Nun,
  "18": et sínguli príncipes de tríbubus síngulis,
  "19": 'quorum ista sunt vocábula: De tribu Iuda, Caleb fílius Iéphone.'
  "20": De tribu Símeon, Sámuel fílius Ammiud.
  "21": De tribu Béniamin, Elídad fílius Cháselon.
  "22": De tribu filiórum Dan, Bocci fílius Iogli.
  "23": Filiórum Ioseph de tribu Manásse, Hánniel fílius Ephod.
  "24": De tribu Ephraim, Cámuel fílius Sephthan.
  "25": De tribu Zábulon, Elísaphan fílius Pharnach.
  "26": De tribu Issachar, dux Pháltiel fílius Ozan.
  "27": De tribu Aser, Ahiud fílius Salómi.
  "28": De tribu Néphthali, Phédael fílius Ammiud.
  "29": Hi sunt, quibus præcépit Dóminus ut divíderent fíliis Israel terram Chánaan.
