bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "102"
verses:
  "1": 'Ipsi David. Bénedic ánima mea Dómino: et ómnia, quæ intra me sunt, nómini sancto eius.'
  "2": 'Bénedic ánima mea Dómino: et noli oblivísci omnes retributiónes eius.'
  "3": 'Qui propitiátur ómnibus iniquitátibus tuis: qui sanat omnes infirmitátes tuas.'
  "4": 'Qui rédimit de intéritu vitam tuam: qui corónat te in misericórdia et miseratiónibus.'
  "5": 'Qui replet in bonis desidérium tuum: renovábitur ut áquilæ iuvéntus tua.'
  "6": Fáciens misericórdias Dóminus, et iudícium ómnibus iniúriam patiéntibus.
  "7": 'Notas fecit vias suas Móysi: fíliis Israel voluntátes suas.'
  "8": 'Miserátor et miséricors Dóminus: longánimis, et multum miséricors.'
  "9": 'Non in perpétuum irascétur: neque in ætérnum comminábitur.'
  "10": 'Non secúndum peccáta nostra fecit nobis: neque secúndum iniquitátes nostras retríbuit nobis.'
  "11": Quóniam secúndum altitúdinem cæli a terra, corroborávit misericórdiam suam super timéntes se.
  "12": 'Quantum distat ortus ab occidénte: longe fecit a nobis iniquitátes nostras.'
  "13": 'Quómodo miserétur pater filiórum, misértus est Dóminus timéntibus se:'
  "14": 'quóniam ipse cognóvit figméntum nostrum. Recordátus est quóniam pulvis sumus:'
  "15": 'homo, sicut fœnum dies eius: tamquam flos agri, sic efflorébit.'
  "16": 'Quóniam spíritus pertransíbit in illo, et non subsístet: et non cognóscet ámplius locum suum.'
  "17": Misericórdia autem Dómini ab ætérno, et usque in ætérnum super timéntes eum. Et iustítia illíus in fílios filiórum,
  "18": 'his qui servant testaméntum eius: et mémores sunt mandatórum ipsíus, ad faciéndum ea.'
  "19": 'Dóminus in cælo parávit sedem suam: et regnum ipsíus ómnibus dominábitur.'
  "20": 'Benedícite Dómino omnes ángeli eius: poténtes virtúte, faciéntes verbum illíus, ad audiéndam vocem sermónum eius.'
  "21": 'Benedícite Dómino omnes virtútes eius: minístri eius, qui fácitis voluntátem eius.'
  "22": 'Benedícite Dómino ómnia ópera eius: in omni loco dominatiónis eius, bénedic ánima mea Dómino.'
