bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "91"
verses:
  "1": Psalmus cántici, in die sábbati.
  "2": Bonum est confitéri Dómino, et psállere nómini tuo Altíssime.
  "3": 'Ad annuntiándum mane misericórdiam tuam, et veritátem tuam per noctem:'
  "4": 'in decachórdo, psaltério: cum cántico, in cíthara.'
  "5": 'Quia delectásti me Dómine in factúra tua: et in opéribus mánuum tuárum exsultábo.'
  "6": Quam magnificáta sunt ópera tua Dómine! nimis profúndæ factæ sunt cogitatiónes tuæ.
  "7": 'Vir insípiens non cognóscet: et stultus non intélliget hæc.'
  "8": 'Cum exórti fúerint peccatóres sicut fœnum: et apparúerint omnes, qui operántur iniquitátem: ut intéreant in sǽculum sǽculi:'
  "9": tu autem Altíssimus in ætérnum Dómine.
  "10": 'Quóniam ecce inimíci tui Dómine, quóniam ecce inimíci tui períbunt: et dispergéntur omnes, qui operántur iniquitátem.'
  "11": 'Et exaltábitur sicut unicórnis cornu meum: et senéctus mea in misericórdia úberi.'
  "12": 'Et despéxit óculus meus inimícos meos: et in insurgéntibus in me malignántibus áudiet auris mea.'
  "13": 'Iustus ut palma florébit: sicut cedrus Líbani multiplicábitur.'
  "14": Plantáti in domo Dómini, in átriis domus Dei nostri florébunt.
  "15": 'Adhuc multiplicabúntur in senécta úberi: et bene patiéntes erunt,'
  "16": 'ut annúntient: Quóniam rectus Dóminus Deus noster: et non est iníquitas in eo.'
