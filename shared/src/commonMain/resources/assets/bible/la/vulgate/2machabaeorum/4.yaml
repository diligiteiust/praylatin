bible: vulgate
lang: la
language: Latina
book: II Machabaeorum
chapter: "4"
verses:
  "1": 'Simon autem prædíctus pecuniárum, et pátriæ delátor, male loquebátur de Onía, tamquam ipse Heliodórum instigásset ad hæc, et ipse fuísset incéntor malórum:'
  "2": provisorémque civitátis, ac defensórem gentis suæ, et æmulatórem legis Dei, audébat insidiatórem regni dícere.
  "3": Sed cum inimicítiæ in tantum procéderent, ut étiam per quosdam Simónis necessários homicídia fíerent,
  "4": consíderans Onías perículum contentiónis, et Apollónium insaníre, útpote ducem Cœlesýriæ, et Phœnícis, ad augéndam malítiam Simónis, ad regem se cóntulit,
  "5": non ut cívium accusátor, sed commúnem utilitátem apud semetípsum univérsæ multitúdinis consíderans.
  "6": Vidébat enim sine regáli providéntia impossíbile esse pacem rebus dari, nec Simónem posse cessáre a stultítia sua.
  "7": 'Sed post Seléuci vitæ excéssum, cum suscepísset regnum Antíochus, qui Nóbilis appellabátur, ambiébat Iason frater Oníæ summum sacerdótium:'
  "8": ádito rege, promíttens ei argénti talénta trecénta sexagínta, et ex reddítibus áliis talénta octogínta,
  "9": super hæc promittébat et ália centum quinquagínta, si potestáti eius concederétur gymnásium, et ephébiam sibi constitúere, et eos, qui in Ierosólymis erant, Antiochénos scríbere.
  "10": Quod cum rex annuísset, et obtinuísset principátum, statim ad gentílem ritum contribúles suos transférre cœpit,
  "11": et amótis his, quæ humanitátis causa Iudǽis a régibus fúerant constitúta per Ioánnem patrem Eupólemi, qui apud Romános de amicítia, et societáte functus est legatióne legítima, cívium iura destítuens, prava institúta sanciébat.
  "12": Etenim ausus est sub ipsa arce gymnásium constitúere, et óptimos quosque ephebórum in lupanáribus pónere.
  "13": 'Erat autem hoc non inítium, sed increméntum quoddam, et proféctus gentílis, et alienígenæ conversatiónis, propter ímpii, et non sacerdótis Iasónis nefárium, et inaudítum scelus:'
  "14": ita ut sacerdótes iam non circa altáris offícia déditi essent, sed contémpto templo, et sacrifíciis negléctis, festinárent partícipes fíeri palǽstræ, et præbitiónis eius iniústæ, et in exercítiis disci.
  "15": 'Et pátrios quidem honóres nihil habéntes, Græcas glórias óptimas arbitrabántur:'
  "16": quarum grátia periculósa eos conténtio habébat, et eórum institúta æmulabántur, ac per ómnia his consímiles esse cupiébant, quos hostes, et peremptóres habúerant.
  "17": 'In leges enim divínas ímpie ágere impúne non cedit: sed hoc tempus sequens declarábit.'
  "18": Cum autem quinquennális agon Tyri celebrarétur, et rex præsens esset,
  "19": 'misit Iason facinorósus ab Ierosólymis viros peccatóres, portántes argénti dídrachmas trecéntas in sacríficum Hérculis: quas postulavérunt hi, qui asportáverant ne in sacrifíciis erogaréntur, quia non oportéret, sed in álios sumptus eas deputári.'
  "20": 'Sed hæ oblátæ sunt quidem ab eo, qui míserat in sacrifícium Hérculis: propter præséntes autem datæ sunt in fábricam návium trirémium.'
  "21": Misso autem in Ægýptum Apollónio Mnésthei fílio propter primátes Ptolemǽi Philométoris regis, cum cognovísset Antíochus aliénum se a negótiis regni efféctum, própriis utilitátibus cónsulens, proféctus inde venit Ioppen, et inde Ierosólymam.
  "22": 'Et magnífice ab Iasóne, et civitáte suscéptus, cum faculárum lumínibus, et láudibus ingréssus est: et inde in Phœnícen exércitum convértit.'
  "23": Et post triénnii tempus, misit Iason Meneláum supradícti Simónis fratrem portántem pecúnias regi, et de negótiis necessáriis respónsa perlatúrum.
  "24": At ille commendátus regi, cum magnificásset fáciem potestátis eius, in semetípsum retórsit summum sacerdótium, superpónens Iasóni talénta argénti trecénta.
  "25": 'Acceptísque a rege mandátis, venit, nihil quidem habens dignum sacerdótio: ánimos vero crudélis tyránni, et feræ béluæ iram gerens.'
  "26": Et Iason quidem, qui próprium fratrem captiváverat, ipse decéptus prófugus in Ammanítem expúlsus est regiónem.
  "27": 'Meneláus autem principátum quidem obtínuit: de pecúniis vero regi promíssis, nihil agébat, cum exactiónem fáceret Sóstratus, qui arci erat præpósitus.'
  "28": 'Nam ad hunc exáctio vectigálium pertinébant: quam ob causam utríque ad regem sunt evocáti.'
  "29": 'Et Meneláus amótus est a sacerdótio, succedénte Lysímacho fratre suo: Sóstratus autem prælátus est Cýpriis.'
  "30": Et cum hæc ageréntur, cóntigit Tharsénses et Mallótas seditiónem movére, eo quod Antióchidi regis concubínæ dono essent dati.
  "31": Festinánter ítaque rex venit sedáre illos, relícto suffécto uno ex comítibus suis Andrónico.
  "32": Ratus autem Meneláus accepísse se tempus opportúnum, áurea quædam vasa e templo furátus donávit Andrónico, et ália vendíderat Tyri, et per vicínas civitátes.
  "33": Quod cum certíssime cognovísset Onías, arguébat eum, ipse in loco tuto se cóntinens Antiochíæ secus Daphnem.
  "34": Unde Meneláus accédens ad Andrónicum, rogábat ut Oníam interfíceret. Qui cum venísset ad Oníam, et datis dextris cum iureiurándo (quamvis esset ei suspéctus) suasísset de asýlo procédere, statim eum perémit, non véritus iustítiam.
  "35": Ob quam causam non solum Iudǽi, sed áliæ quoque natiónes indignabántur, et moléste ferébant de nece tanti viri iniústa.
  "36": Sed regréssum regem de Cilíciæ locis adiérunt Iudǽi apud Antiochíam, simul et Græci, conqueréntes de iníqua nece Oníæ.
  "37": 'Contristátus ítaque ánimo Antíochus propter Oníam, et flexus ad misericórdiam, lácrymas fudit, recordátus defúncti sobrietátem et modéstiam:'
  "38": 'accensísque ánimis Andrónicum púrpura exútum, per totam civitátem iubet circumdúci: et in eódem loco, in quo in Oníam impietátem commíserat, sacrílegum vita privári, Dómino illi condígnam retribuénte pœnam.'
  "39": Multis autem sacrilégiis in templo a Lysímacho commíssis Menelái consílio, et divulgáta fama, congregáta est multitúdo advérsum Lysímachum multo iam auro exportáto.
  "40": Turbis autem insurgéntibus, et ánimis ira replétis, Lysímachus armátis fere tribus míllibus iníquis mánibus uti cœpit, duce quodam tyránno, ætáte páriter, et deméntia provécto.
  "41": 'Sed ut intellexérunt conátum Lysímachi, álii lápides, álii fustes válidos arripuére: quidam vero cínerem in Lysímachum iecére.'
  "42": 'Et multi quidem vulneráti, quidam autem et prostráti, omnes vero in fugam convérsi sunt: ipsum étiam sacrílegum secus ærárium interfecérunt.'
  "43": De his ergo cœpit iudícium advérsus Meneláum agitári.
  "44": Et cum venísset rex Tyrum, ad ipsum negótium detulérunt missi tres viri a senióribus.
  "45": Et cum superarétur Meneláus, promísit Ptolemǽo multas pecúnias dare ad suadéndum regi.
  "46": 'Itaque Ptolemǽus in quodam átrio pósitum quasi refrigerándi grátia regem ádiit, et dedúxit a senténtia:'
  "47": 'et Meneláum quidem univérsæ malítiæ reum crimínibus absólvit: míseros autem, qui, etiámsi apud Scythas causam dixíssent, innocéntes iudicaréntur, hos morte damnávit.'
  "48": Cito ergo iniústam pœnam dedérunt, qui pro civitáte, et pópulo, et sacris vasis causam prosecúti sunt.
  "49": Quam ob rem Týrii quoque indignáti, erga sepultúram eórum liberalíssimi exstitérunt.
  "50": Meneláus autem, propter eórum, qui in poténtia erant, avarítiam, permanébat in potestáte, crescens in malítia ad insídias cívium.
