bible: vulgate
lang: la
language: Latina
book: Isaias
chapter: "52"
verses:
  "1": 'Consúrge, consúrge, indúere fortitúdine tua Sion, indúere vestiméntis glóriæ tuæ Ierúsalem cívitas sancti: quia non adíciet ultra ut pertránseat per te incircumcísus et immúndus.'
  "2": 'Excútere de púlvere, consúrge, sede Ierúsalem: solve víncula colli tui captíva fília Sion.'
  "3": 'Quia hæc dicit Dóminus: Gratis venúmdati estis, et sine argénto redimémini.'
  "4": 'Quia hæc dicit Dóminus Deus: In Ægýptum descéndit pópulus meus in princípio, ut colónus esset ibi: et Assur absque ulla causa calumniátus est eum.'
  "5": Et nunc quid mihi est hic, dicit Dóminus, quóniam ablátus est pópulus meus gratis? Dominatóres eius iníque agunt, dicit Dóminus, et iúgiter tota die nomen meum blasphemátur.
  "6": 'Propter hoc sciet pópulus meus nomen meum in die illa: quia ego ipse qui loquébar, ecce adsum.'
  "7": 'Quam pulchri super montes pedes annuntiántis et prædicántis pacem: annuntiántis bonum, prædicántis salútem, dicéntis Sion: Regnábit Deus tuus!'
  "8": 'Vox speculatórum tuórum: levavérunt vocem, simul laudábunt: quia óculo ad óculum vidébunt cum convérterit Dóminus Sion.'
  "9": 'Gaudéte, et laudáte simul desérta Ierúsalem: quia consolátus est Dóminus pópulum suum, redémit Ierúsalem.'
  "10": 'Parávit Dóminus bráchium sanctum suum in óculis ómnium géntium: et vidébunt omnes fines terræ salutáre Dei nostri.'
  "11": 'Recédite, recédite, exíte inde, pollútum nolíte tángere: exíte de médio eius, mundámini qui fertis vasa Dómini.'
  "12": 'Quóniam non in tumúltu exíbitis, nec in fuga properábitis: præcédet enim vos Dóminus, et congregábit vos Deus Israel.'
  "13": Ecce intélliget servus meus, exaltábitur, et elevábitur, et sublímis erit valde.
  "14": Sicut obstupuérunt super te multi, sic inglórius erit inter viros aspéctus eius, et forma eius inter fílios hóminum.
  "15": 'Iste aspérget gentes multas, super ipsum continébunt reges os suum: quia quibus non est narrátum de eo, vidérunt: et qui non audiérunt, contempláti sunt.'
