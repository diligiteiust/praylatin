bible: vulgate
lang: la
language: Latina
book: Osee
chapter: "9"
verses:
  "1": 'Noli lætári Israel, noli exsultáre sicut pópuli: quia fornicátus es a Deo tuo: dilexísti mercédem super omnes áreas trítici.'
  "2": Area et tórcular non pascet eos, et vinum mentiétur eis.
  "3": 'Non habitábunt in terra Dómini: revérsus est Ephraim in Ægýptum, et in Assýriis pollútum comédit.'
  "4": 'Non libábunt Dómino vinum, et non placébunt ei. Sacrifícia eórum quasi panis lugéntium: omnes, qui cómedent eum, contaminabúntur: quia panis eórum ánimæ ipsórum, non intrábit in domum Dómini.'
  "5": Quid faciétis in die solémni, in die festivitátis Dómini?
  "6": 'Ecce enim profécti sunt a vastitáte: Ægýptus congregábit eos, Memphis sepéliet eos: desiderábile argéntum eórum urtíca hereditábit, lappa in tabernáculis eórum.'
  "7": 'Venérunt dies visitatiónis, venérunt dies retributiónis: scitóte Israel stultum prophétam, insánum virum spirituálem, propter multitúdinem iniquitátis tuæ, et multitúdinem améntiæ.'
  "8": 'Speculátor Ephraim cum Deo meo: prophéta láqueus ruínæ factus est super omnes vias eius, insánia in domo Dei eius.'
  "9": 'Profúnde peccavérunt, sicut in diébus Gábaa: recordábitur iniquitátis eórum, et visitábit peccáta eórum.'
  "10": 'Quasi uvas in desérto invéni Israel: quasi prima poma ficúlneæ in cacúmine eius vidi patres eórum: ipsi autem intravérunt ad Beélphegor, et abalienáti sunt in confusiónem, et facti sunt abominábiles sicut ea, quæ dilexérunt.'
  "11": Ephraim quasi avis avolávit, glória eórum a partu, et ab útero, et a concéptu.
  "12": 'Quod etsi enutríerint fílios suos, absque líberis eos fáciam in homínibus: sed et væ eis cum recéssero ab eis.'
  "13": 'Ephraim, ut vidi, Tyrus erat fundáta in pulchritúdine: et Ephraim edúcet ad interfectórem fílios suos.'
  "14": Da eis Dómine. Quid dabis eis? Da eis vulvam sine líberis, et úbera aréntia.
  "15": 'Omnes nequítiæ eórum in Galgal, quia ibi exósos hábui eos: propter malítiam adinventiónum eórum, de domo mea eíciam eos: non addam ut díligam eos, omnes príncipes eórum recedéntes.'
  "16": 'Percússus est Ephraim, radix eórum exsiccáta est: fructum nequáquam fácient. Quod etsi genúerint, interfíciam amantíssima úteri eórum.'
  "17": 'Abíciet eos Deus meus, quia non audiérunt eum: et erunt vagi in natiónibus.'
