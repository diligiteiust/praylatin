bible: vulgate
lang: la
language: Latina
book: Baruch
chapter: "2"
verses:
  "1": 'Propter quod státuit Dóminus Deus noster verbum suum, quod locútus est ad nos, et ad iúdices nostros, qui iudicavérunt Israel, et ad reges nostros, et ad príncipes nostros, et ad omnem Israel et Iuda:'
  "2": ut addúceret Dóminus super nos mala magna, quæ non sunt facta sub cælo, quemádmodum facta sunt in Ierúsalem, secúndum quæ scripta sunt in lege Móysi,
  "3": ut manducáret homo carnes fílii sui, et carnes fíliæ suæ.
  "4": Et dedit eos sub manu regum ómnium, qui sunt in circúitu nostro, in impropérium, et in desolatiónem in ómnibus pópulis, in quibus nos dispérsit Dóminus.
  "5": 'Et facti sumus subtus, et non supra: quia peccávimus Dómino Deo nostro, non obaudiéndo voci ipsíus.'
  "6": 'Dómino Deo nostro iustítia: nobis autem, et pátribus nostris confúsio faciéi, sicut est dies hæc.'
  "7": 'Quia locútus est Dóminus super nos ómnia mala hæc, quæ venérunt super nos:'
  "8": et non sumus deprecáti fáciem Dómini Dei nostri, ut reverterémur unusquísque nostrum a viis nostris péssimis.
  "9": 'Et vigilávit Dóminus in malis, et addúxit ea super nos: quia iustus est Dóminus in ómnibus opéribus suis, quæ mandávit nobis:'
  "10": et non audívimus vocem ipsíus ut irémus in præcéptis Dómini, quæ dedit ante fáciem nostram.
  "11": 'Et nunc Dómine Deus Israel, qui eduxísti pópulum tuum de terra Ægýpti in manu válida, et in signis, et in prodígiis, et in virtúte tua magna, et in bráchio excélso, et fecísti tibi nomen sicut est dies iste:'
  "12": peccávimus, ímpie égimus, iníque géssimus, Dómine Deus noster, in ómnibus iustítiis tuis.
  "13": 'Avertátur ira tua a nobis: quia derelícti sumus pauci inter gentes, ubi dispersísti nos.'
  "14": 'Exáudi Dómine preces nostras, et oratiónes nostras, et educ nos propter te: et da nobis inveníre grátiam ante fáciem eórum, qui nos abduxérunt:'
  "15": ut sciat omnis terra quia tu es Dóminus Deus noster, et quia nomen tuum invocátum est super Israel, et super genus ipsíus.
  "16": Réspice Dómine de domo sancta tua in nos, et inclína aurem tuam, et exáudi nos.
  "17": 'Aperi óculos tuos, et vide: quia non mórtui, qui sunt in inférno, quorum spíritus accéptus est a viscéribus suis, dabunt honórem et iustificatiónem Dómino:'
  "18": sed ánima, quæ tristis est super magnitúdine mali, et incédit curva et infírma, et óculi deficiéntes, et ánima esúriens, dat tibi glóriam et iustítiam Dómino.
  "19": 'Quia non secúndum iustítias patrum nostrórum nos fúndimus preces, et pétimus misericórdiam ante conspéctum tuum Dómine Deus noster:'
  "20": 'sed quia misísti iram tuam, et furórem tuum super nos, sicut locútus es in manu puerórum tuórum prophetárum, dicens:'
  "21": 'Sic dicit Dóminus: Inclináte húmerum vestrum et cervícem vestram, et ópera fácite regi Babylónis: et sedébitis in terra, quam dedi pátribus vestris.'
  "22": Quod si non audiéritis vocem Dómini Dei vestri, operári regi Babylóniæ, defectiónem vestram fáciam de civitátibus Iuda, et a foris Ierúsalem,
  "23": et áuferam a vobis vocem iucunditátis et vocem gáudii, et vocem sponsi et vocem sponsæ, et erit omnis terra sine vestígio ab inhabitántibus eam.
  "24": 'Et non audiérunt vocem tuam, ut operaréntur regi Babylónis: et statuísti verba tua, quæ locútus es in mánibus puerórum tuórum prophetárum, ut transferréntur ossa regum nostrórum et ossa patrum nostrórum de loco suo:'
  "25": 'et ecce proiécta sunt in calóre solis, et in gelu noctis: et mórtui sunt in dolóribus péssimis, in fame et in gládio, et in emissióne.'
  "26": Et posuísti templum, in quo invocátum est nomen tuum in ipso, sicut hæc dies, propter iniquitátem domus Israel, et domus Iuda.
  "27": 'Et fecísti in nobis Dómine Deus noster secúndum omnem bonitátem tuam, et secúndum omnem miseratiónem tuam illam magnam:'
  "28": sicut locútus es in manu púeri tui Móysi in die, qua præcepísti ei scríbere legem tuam coram fíliis Israel,
  "29": 'dicens: Si non audiéritis vocem meam, multitúdo hæc magna convertétur in mínimam inter gentes, quo ego eos dispérgam:'
  "30": 'quia scio quod me non áudiet pópulus: pópulus est enim dura cervíce: et convertétur ad cor suum in terra captivitátis suæ:'
  "31": et scient quia ego sum Dóminus Deus eórum, et dabo eis cor, et intélligent, aures, et áudient.
  "32": Et laudábunt me in terra captivitátis suæ, et mémores erunt nóminis mei.
  "33": 'Et avértent se a dorso suo duro, et a malignitátibus suis: quia reminiscéntur viam patrum suórum, qui peccavérunt in me.'
  "34": 'Et revocábo illos in terram, quam iurávi pátribus eórum, Abraham, Isaac, et Iacob, et dominabúntur eius: et multiplicábo eos, et non minorabúntur.'
  "35": 'Et státuam illis testaméntum álterum sempitérnum, ut sim illis in Deum, et ipsi erunt mihi in pópulum: et non movébo ámplius pópulum meum, fílios Israel a terra, quam dedi illis.'
