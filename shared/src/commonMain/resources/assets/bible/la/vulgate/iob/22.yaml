bible: vulgate
lang: la
language: Latina
book: Iob
chapter: "22"
verses:
  "1": 'Respóndens autem Eliphaz Themanítes, dixit:'
  "2": Numquid Deo potest comparári homo, étiam cum perféctæ fúerit sciéntiæ?
  "3": Quid prodest Deo, si iustus fúeris? aut quid ei confers, si immaculáta fúerit via tua?
  "4": Numquid timens árguet te, et véniet tecum in iudícium,
  "5": et non propter malítiam tuam plúrimam, et infinítas iniquitátes tuas?
  "6": Abstulísti enim pignus fratrum tuórum sine causa, et nudos spoliásti véstibus.
  "7": Aquam lasso non dedísti, et esuriénti subtraxísti panem.
  "8": In fortitúdine bráchii tui possidébas terram, et potentíssimus obtinébas eam.
  "9": Víduas dimisísti vácuas, et lacértos pupillórum comminuísti.
  "10": Proptérea circúmdatus es láqueis, et contúrbat te formído súbita.
  "11": Et putábas te ténebras non visúrum, et ímpetu aquárum inundántium non oppréssum iri?
  "12": An non cógitas quod Deus excélsior cælo sit, et super stellárum vérticem sublimétur?
  "13": 'Et dicis: Quid enim novit Deus? et quasi per calíginem iúdicat.'
  "14": Nubes latíbulum eius, nec nostra consíderat, et circa cárdines cæli perámbulat.
  "15": Numquid sémitam sæculórum custodíre cupis, quam calcavérunt viri iníqui?
  "16": 'Qui subláti sunt ante tempus suum, et flúvius subvértit fundaméntum eórum:'
  "17": 'qui dicébant Deo: Recéde a nobis: et quasi nihil posset fácere Omnípotens, æstimábant eum:'
  "18": 'cum ille implésset domos eórum bonis: quorum senténtia procul sit a me.'
  "19": Vidébunt iusti, et lætabúntur, et ínnocens subsannábit eos.
  "20": Nonne succísa est eréctio eórum, et relíquias eórum devorávit ignis?
  "21": 'Acquiésce ígitur ei, et habéto pacem: et per hæc habébis fructus óptimos.'
  "22": Súscipe ex ore illíus legem, et pone sermónes eius in corde tuo.
  "23": Si revérsus fúeris ad Omnipoténtem, ædificáberis, et longe fácies iniquitátem a tabernáculo tuo.
  "24": Dabit pro terra sílicem, et pro sílice torréntes áureos.
  "25": Erítque Omnípotens contra hostes tuos, et argéntum coacervábitur tibi.
  "26": Tunc super Omnipoténtem delíciis áfflues, et elevábis ad Deum fáciem tuam.
  "27": Rogábis eum, et exáudiet te, et vota tua reddes.
  "28": Decérnes rem, et véniet tibi, et in viis tuis splendébit lumen.
  "29": 'Qui enim humiliátus fúerit, erit in glória: et qui inclináverit óculos, ipse salvábitur.'
  "30": Salvábitur ínnocens, salvábitur autem in mundítia mánuum suárum.
