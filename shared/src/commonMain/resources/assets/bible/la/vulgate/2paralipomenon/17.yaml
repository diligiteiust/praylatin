bible: vulgate
lang: la
language: Latina
book: II Paralipomenon
chapter: "17"
verses:
  "1": Regnávit autem Iósaphat fílius eius pro eo, et inváluit contra Israel.
  "2": Constituítque mílitum números in cunctis úrbibus Iuda, quæ erant vallátæ muris. Præsidiáque dispósuit in terra Iuda, et in civitátibus Ephraim, quas céperat Asa pater eius.
  "3": 'Et fuit Dóminus cum Iósaphat, quia ambulávit in viis David patris sui primis: et non sperávit in Báalim,'
  "4": sed in Deo patris sui, et perréxit in præcéptis illíus, et non iuxta peccáta Israel.
  "5": 'Confirmavítque Dóminus regnum in manu eius, et dedit omnis Iuda múnera Iósaphat: factǽque sunt ei infinítæ divítiæ, et multa glória.'
  "6": Cumque sumpsísset cor eius audáciam propter vias Dómini, étiam excélsa et lucos de Iuda ábstulit.
  "7": 'Tértio autem anno regni sui misit de princípibus suis Bénhail, et Obdíam, et Zacharíam, et Nathánael, et Michǽam, ut docérent in civitátibus Iuda:'
  "8": et cum eis Levítas Semeíam, et Nathaníam, et Zabadíam, Asael quoque, et Semíramoth, et Iónathan, Adoniámque et Thobíam, et Thobadoníam Levítas, et cum eis Elísama, et Ioran sacerdótes,
  "9": docebántque pópulum in Iuda, habéntes librum legis Dómini, et circuíbant cunctas urbes Iuda, atque erudiébant pópulum.
  "10": Itaque factus est pavor Dómini super ómnia regna terrárum, quæ erant per gyrum Iuda, nec audébant belláre contra Iósaphat.
  "11": 'Sed et Philisthǽi Iósaphat múnera deferébant, et vectígal argénti: Arabes quoque adducébant pécora, aríetum septem míllia septingénta, et hircórum tótidem.'
  "12": 'Crevit ergo Iósaphat, et magnificátus est usque in sublíme: atque ædificávit in Iuda domos ad instar túrrium, urbésque murátas.'
  "13": 'Et multa ópera parávit in úrbibus Iuda: viri quoque bellatóres, et robústi erant in Ierúsalem,'
  "14": 'quorum iste númerus per domos atque famílias singulórum: in Iuda príncipes exércitus, Ednas dux, et cum eo robustíssimi viri trecénta míllia.'
  "15": Post hunc Ióhanan princeps, et cum eo ducénta octogínta míllia.
  "16": Post istum quoque Amasías fílius Zechri, consecrátus Dómino, et cum eo ducénta míllia virórum fórtium.
  "17": Hunc sequebátur robústus ad prœ́lia Elíada, et cum eo tenéntium arcum et clýpeum ducénta míllia.
  "18": Post istum étiam Iózabad, et cum eo centum octogínta míllia expeditórum mílitum.
  "19": Hi omnes erant ad manum regis, excéptis áliis, quos posúerat in úrbibus murátis in univérso Iuda.
