bible: vulgate
lang: la
language: Latina
book: II Samuelis
chapter: "20"
verses:
  "1": 'Accidit quoque ut ibi esset vir Bélial, nómine Seba, fílius Bochri, vir Iemíneus: et cécinit búccina, et ait: Non est nobis pars in David, neque heréditas in fílio Isai: revértere in tabernácula tua Israel.'
  "2": 'Et separátus est omnis Israel a David, secutúsque est Seba fílium Bochri: viri autem Iuda adhæsérunt regi suo a Iordáne usque Ierúsalem.'
  "3": 'Cumque venísset rex in domum suam in Ierúsalem, tulit decem mulíeres concubínas, quas derelíquerat ad custodiéndam domum, et trádidit eas in custódiam, aliménta eis præbens: et non est ingréssus ad eas, sed erant clausæ usque in diem mortis suæ in viduitáte vivéntes.'
  "4": 'Dixit autem rex Amasæ: Cónvoca mihi omnes viros Iuda in diem tértium, et tu adésto præsens.'
  "5": Abiit ergo Amasa ut convocáret Iudam, et morátus est extra plácitum quod ei constitúerat rex.
  "6": 'Ait autem David ad Abísai: Nunc magis afflictúrus est nos Seba fílius Bochri quam Absalom: tolle ígitur servos dómini tui, et perséquere eum, ne forte invéniat civitátes munítas, et effúgiat nos.'
  "7": 'Egréssi sunt ergo cum eo viri Ioab, Ceréthi quoque et Pheléthi: et omnes robústi exiérunt de Ierúsalem ad persequéndum Seba fílium Bochri.'
  "8": Cumque illi essent iuxta lápidem grandem, qui est in Gábaon, Amasa véniens occúrrit eis. Porro Ioab vestítus erat túnica stricta ad mensúram hábitus sui, et désuper accínctus gládio dependénte usque ad ília, in vagína, qui fabricátus levi motu égredi póterat, et percútere.
  "9": 'Dixit ítaque Ioab ad Amasam: Salve mi frater. Et ténuit manu déxtera mentum Amasæ, quasi ósculans eum.'
  "10": 'Porro Amasa non observávit gládium, quem habébat Ioab: qui percússit eum in látere, et effúdit intestína eius in terram, nec secúndum vulnus appósuit: et mórtuus est. Ioab autem, et Abísai frater eius, persecúti sunt Seba fílium Bochri.'
  "11": 'Intérea quidam viri, cum stetíssent iuxta cadáver Amasæ, de sóciis Ioab, dixérunt: Ecce qui esse vóluit pro Ioab comes David.'
  "12": Amasa autem conspérsus sánguine iacébat in média via. Vidit hoc quidam vir, quod subsísteret omnis pópulus ad vidéndum eum, et amóvit Amasam de via in agrum, operuítque eum vestiménto, ne subsísterent transeúntes propter eum.
  "13": Amóto ergo illo de via, transíbat omnis vir sequens Ioab ad persequéndum Seba fílium Bochri.
  "14": 'Porro ille transíerat per omnes tribus Israel in Abelam, et Bethmáacha: omnésque viri elécti congregáti fúerant ad eum.'
  "15": 'Venérunt ítaque, et oppugnábant eum in Abela et in Bethmáacha, et circumdedérunt munitiónibus civitátem, et obséssa est urbs: omnis autem turba, quæ erat cum Ioab, moliebátur destrúere muros.'
  "16": 'Et exclamávit múlier sápiens de civitáte: Audíte, audíte, dícite Ioab: Appropínqua huc, et loquar tecum.'
  "17": 'Qui cum accessísset ad eam, ait illi: Tu es Ioab? Et ille respóndit: Ego. Ad quem sic locúta est: Audi sermónes ancíllæ tuæ. Qui respóndit: Audio.'
  "18": 'Rursúmque illa: Sermo, inquit, dicebátur in véteri provérbio: Qui intérrogant, intérrogent in Abela: et sic perficiébant.'
  "19": Nonne ego sum quæ respóndeo veritátem in Israel, et tu quæris subvértere civitátem, et evértere matrem in Israel? quare præcípitas hereditátem Dómini?
  "20": 'Respondénsque Ioab, ait: Absit, absit hoc a me: non præcípito, neque demólior.'
  "21": 'Non sic se habet res, sed homo de monte Ephraim, Seba fílius Bochri cognómine, levávit manum suam contra regem David: trádite illum solum, et recedémus a civitáte. Et ait múlier ad Ioab: Ecce caput eius mittétur ad te per murum.'
  "22": 'Ingréssa est ergo ad omnem pópulum, et locúta est eis sapiénter: qui abscíssum caput Seba fílii Bochri proiecérunt ad Ioab. Et ille cécinit tuba, et recessérunt ab urbe, unusquísque in tabernácula sua: Ioab autem revérsus est Ierúsalem ad regem.'
  "23": 'Fuit ergo Ioab super omnem exércitum Israel: Banaías autem fílius Ióiadæ super Cerethǽos et Phelethǽos.'
  "24": 'Adúram vero super tribúta: porro Iósaphat fílius Ahilud, a commentáriis.'
  "25": 'Siva autem, scriba: Sadoc vero et Abíathar, sacerdótes.'
  "26": Ira autem Iairítes erat sacérdos David.
