bible: vulgate
lang: la
language: Latina
book: Isaias
chapter: "54"
verses:
  "1": 'Lauda stérilis quæ non paris: decánta laudem, et hinni quæ non pariébas: quóniam multi fílii desértæ magis quam eius, quæ habet virum, dicit Dóminus.'
  "2": 'Diláta locum tentórii tui, et pelles tabernaculórum tuórum exténde, ne parcas: longos fac funículos tuos, et clavos tuos consólida.'
  "3": Ad déxteram enim, et ad lævam penetrábis, et semen tuum gentes hereditábit, et civitátes desértas inhabitábit.
  "4": 'Noli timére, quia non confundéris, neque erubésces: non enim te pudébit, quia confusiónis adolescéntiæ tuæ obliviscéris, et oppróbrii viduitátis tuæ non recordáberis ámplius.'
  "5": 'Quia dominábitur tui qui fecit te, Dóminus exercítuum nomen eius: et redémptor tuus sanctus Israel, Deus omnis terræ vocábitur.'
  "6": Quia ut mulíerem derelíctam et mœréntem spíritu vocávit te Dóminus, et uxórem ab adolescéntia abiéctam, dixit Deus tuus.
  "7": Ad punctum in módico derelíqui te, et in miseratiónibus magnis congregábo te.
  "8": 'In moménto indignatiónis abscóndi fáciem meam parúmper a te, et in misericórdia sempitérna misértus sum tui: dixit redémptor tuus Dóminus.'
  "9": 'Sicut in diébus Noe istud mihi est, cui iurávi ne indúcerem aquas Noe ultra super terram: sic iurávi ut non iráscar tibi, et non íncrepem te.'
  "10": 'Montes enim commovebúntur, et colles contremíscent: misericórdia autem mea non recédet a te, et fœdus pacis meæ non movébitur: dixit miserátor tuus Dóminus.'
  "11": Paupércula tempestáte convúlsa, absque ulla consolatióne. Ecce ego sternam per órdinem lápides tuos, et fundábo te in sapphíris,
  "12": 'et ponam iáspidem propugnácula tua, et portas tuas in lápides sculptos, et omnes términos tuos in lápides desiderábiles:'
  "13": 'univérsos fílios tuos doctos a Dómino: et multitúdinem pacis fíliis tuis.'
  "14": 'Et in iustítia fundáberis: recéde procul a calúmnia, quia non timébis: et a pavóre, quia non appropinquábit tibi.'
  "15": Ecce áccola véniet, qui non erat mecum, ádvena quondam tuus adiungétur tibi.
  "16": 'Ecce ego creávi fabrum sufflántem in igne prunas, et proferéntem vas in opus suum: et ego creávi interfectórem ad disperdéndum.'
  "17": 'Omne vas, quod fictum est contra te, non dirigétur: et omnem linguam resisténtem tibi in iudício, iudicábis. Hæc est heréditas servórum Dómini, et iustítia eórum apud me, dicit Dóminus.'
