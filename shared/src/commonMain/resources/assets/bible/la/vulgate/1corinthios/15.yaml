bible: vulgate
lang: la
language: Latina
book: ad Corinthios I
chapter: "15"
verses:
  "1": Notum autem vobis fácio, fratres, Evangélium, quod prædicávi vobis, quod et accepístis, in quo et statis,
  "2": 'per quod et salvámini: qua ratióne prædicáverim vobis, si tenétis, nisi frustra credidístis.'
  "3": 'Trádidi enim vobis in primis quod et accépi: quóniam Christus mórtuus est pro peccátis nostris secúndum Scriptúras:'
  "4": 'et quia sepúltus est, et quia resurréxit tértia die secúndum Scriptúras:'
  "5": 'et quia visus est Cephæ, et post hoc úndecim:'
  "6": 'deínde visus est plus quam quingéntis frátribus simul: ex quibus multi manent usque adhuc, quidam autem dormiérunt:'
  "7": 'deínde visus est Iacóbo, deínde Apóstolis ómnibus:'
  "8": novíssime autem ómnium tamquam abortívo, visus est et mihi.
  "9": Ego enim sum mínimus Apostolórum, qui non sum dignus vocári Apóstolus, quóniam persecútus sum Ecclésiam Dei.
  "10": 'Grátia autem Dei sum id quod sum, et grátia eius in me vácua non fuit, sed abundántius illis ómnibus laborávi: non ego autem, sed grátia Dei mecum:'
  "11": 'sive enim ego, sive illi: sic prædicámus, et sic credidístis.'
  "12": Si autem Christus prædicátur quod resurréxit a mórtuis, quómodo quidam dicunt in vobis, quóniam resurréctio mortuórum non est?
  "13": 'Si autem resurréctio mortuórum non est: neque Christus resurréxit.'
  "14": 'Si autem Christus non resurréxit, inánis est ergo prædicátio nostra, inánis est et fides vestra:'
  "15": 'invenímur autem et falsi testes Dei: quóniam testimónium díximus advérsus Deum quod suscitáverit Christum, quem non suscitávit, si mórtui non resúrgunt.'
  "16": Nam si mórtui non resúrgunt, neque Christus resurréxit.
  "17": 'Quod si Christus non resurréxit, vana est fides vestra: adhuc enim estis in peccátis vestris.'
  "18": Ergo et qui dormiérunt in Christo, periérunt.
  "19": Si in hac vita tantum in Christo sperántes sumus, miserabilióres sumus ómnibus homínibus.
  "20": Nunc autem Christus resurréxit a mórtuis primítiæ dormiéntium,
  "21": quóniam quidem per hóminem mors, et per hóminem resurréctio mortuórum.
  "22": Et sicut in Adam omnes moriúntur, ita et in Christo omnes vivificabúntur.
  "23": 'Unusquísque autem in suo órdine, primítiæ Christus: deínde ii, qui sunt Christi, qui in advéntu eius credidérunt.'
  "24": 'Deínde finis: cum tradíderit regnum Deo et Patri, cum evacuáverit omnem principátum, et potestátem, et virtútem.'
  "25": Opórtet autem illum regnáre donec ponat omnes inimícos sub pédibus eius.
  "26": 'Novíssima autem inimíca destruétur mors: ómnia enim subiécit sub pédibus eius. Cum autem dicat:'
  "27": Omnia subiécta sunt ei, sine dúbio præter eum, qui subiécit ei ómnia.
  "28": 'Cum autem subiécta fúerint illi ómnia: tunc et ipse Fílius subiéctus erit ei, qui subiécit sibi ómnia, ut sit Deus ómnia in ómnibus.'
  "29": Alióquin quid fácient qui baptizántur pro mórtuis, si omníno mórtui non resúrgunt? ut quid et baptizántur pro illis?
  "30": Ut quid et nos periclitámur omni hora?
  "31": Quotídie mórior per vestram glóriam, fratres, quam hábeo in Christo Iesu Dómino nostro.
  "32": Si secúndum hóminem ad béstias pugnávi Ephesi, quid mihi prodest, si mórtui non resúrgunt? Manducémus, et bibámus, cras enim moriémur.
  "33": 'Nolíte sedúci: corrúmpunt mores bonos collóquia mala.'
  "34": 'Evigiláte iusti, et nolíte peccáre: ignorántiam enim Dei quidam habent, ad reveréntiam vobis loquor.'
  "35": 'Sed dicet áliquis: Quómodo resúrgunt mórtui? qualíve córpore vénient?'
  "36": Insípiens, tu quod séminas non vivificátur, nisi prius moriátur.
  "37": Et quod séminas, non corpus, quod futúrum est, séminas, sed nudum granum, ut puta trítici, aut alicúius ceterórum.
  "38": 'Deus autem dat illi corpus sicut vult: ut unicuíque séminum próprium corpus.'
  "39": 'Non omnis caro, éadem caro: sed ália quidem hóminum, ália vero pécorum, ália vólucrum, ália autem píscium.'
  "40": 'Et córpora cæléstia, et córpora terréstria: sed ália quidem cæléstium glória, ália autem terréstrium.'
  "41": 'Alia cláritas solis, ália cláritas lunæ, et ália cláritas stellárum. Stella enim a stella differt in claritáte:'
  "42": sic et resurréctio mortuórum. Seminátur in corruptióne, surget in incorruptióne.
  "43": 'Seminátur in ignobilitáte, surget in glória: seminátur in infirmitáte, surget in virtúte:'
  "44": 'seminátur corpus animále, surget corpus spiritále. Si est corpus animále, est et spiritále, sicut scriptum est:'
  "45": Factus est primus homo Adam in ánimam vivéntem, novíssimus Adam in spíritum vivificántem.
  "46": 'Sed non prius quod spiritále est, sed quod animále: deínde quod spiritále.'
  "47": 'Primus homo de terra, terrénus: secúndus homo de cælo, cæléstis.'
  "48": 'Qualis terrénus, tales et terréni: et qualis cæléstis, tales et cæléstes.'
  "49": Igitur, sicut portávimus imáginem terréni, portémus et imáginem cæléstis.
  "50": 'Hoc autem dico, fratres: quia caro et sanguis regnum Dei possidére non possunt: neque corrúptio incorruptélam possidébit.'
  "51": 'Ecce mystérium vobis dico: omnes quidem resurgémus, sed non omnes immutábimur.'
  "52": 'In moménto, in ictu óculi, in novíssima tuba: canet enim tuba, et mórtui resúrgent incorrúpti: et nos immutábimur.'
  "53": 'Opórtet enim corruptíbile hoc indúere incorruptiónem: et mortále hoc indúere immortalitátem.'
  "54": 'Cum autem mortále hoc indúerit immortalitátem, tunc fiet sermo, qui scriptus est: Absórpta est mors in victória.'
  "55": Ubi est mors victória tua? ubi est mors stímulus tuus?
  "56": 'Stímulus autem mortis peccátum est: virtus vero peccáti lex.'
  "57": Deo autem grátias, qui dedit nobis victóriam per Dóminum nostrum Iesum Christum.
  "58": 'Itaque fratres mei dilécti, stábiles estóte, et immóbiles: abundántes in ópere Dómini semper, sciéntes quod labor vester non est inánis in Dómino.'
