bible: vulgate
lang: la
language: Latina
book: Ezechiel
chapter: "23"
verses:
  "1": 'Et factus est sermo Dómini ad me, dicens:'
  "2": 'Fili hóminis, duæ mulíeres fíliæ matris uníus fuérunt:'
  "3": 'et fornicátæ sunt in Ægýpto, in adolescéntia sua fornicátæ sunt: ibi subácta sunt úbera eárum, et fractæ sunt mammæ pubertátis eárum.'
  "4": 'Nómina autem eárum, Oólla maior, et Oóliba soror eius minor: et hábui eas, et peperérunt fílios et fílias. Porro eárum nómina Samaría Oólla, et Ierúsalem Oóliba.'
  "5": Fornicáta est ígitur super me Oólla, et insanívit in amatóres suos, in Assýrios propinquántes,
  "6": vestítos hyacíntho, príncipes et magistrátus, iúvenes cupídinis, univérsos équites, ascensóres equórum.
  "7": 'Et dedit fornicatiónes suas super eos eléctos, fílios Assyriórum univérsos: et in ómnibus, in quos insanívit, in immundítiis eórum pollúta est.'
  "8": 'Insuper et fornicatiónes suas, quas habúerat in Ægýpto, non relíquit: nam et illi dormiérunt cum ea in adolescéntia eius, et illi confregérunt úbera pubertátis eius, et effudérunt fornicatiónem suam super eam.'
  "9": Proptérea trádidi eam in manus amatórum suórum, in manus filiórum Assur, super quorum insanívit libídine.
  "10": 'Ipsi discooperuérunt ignomíniam eius, fílios et fílias eius tulérunt, et ipsam occidérunt gládio: et factæ sunt famósæ mulíeres, et iudícia perpetravérunt in ea.'
  "11": 'Quod cum vidísset soror eius Oóliba, plus quam illa insanívit libídine: et fornicatiónem suam super fornicatiónem soróris suæ.'
  "12": Ad fílios Assyriórum prǽbuit impudénter, dúcibus et magistrátibus ad se veniéntibus, indútis veste vária, equítibus qui vectabántur equis, et adolescéntibus forma cunctis egrégia.
  "13": Et vidi quod pollúta esset via una ambárum.
  "14": 'Et auxit fornicatiónes suas: cumque vidísset viros depíctos in paríete, imágines Chaldæórum expréssas colóribus,'
  "15": et accínctos bálteis renes, et tiáras tinctas in capítibus eórum, formam ducum ómnium, similitúdinem filiórum Babylónis, terrǽque Chaldæórum, in qua orti sunt,
  "16": insanívit super eos concupiscéntia oculórum suórum, et misit núntios ad eos in Chaldǽam.
  "17": 'Cumque veníssent ad eam fílii Babylónis ad cubíle mammárum, polluérunt eam stupris suis: et pollúta est ab eis, et saturáta est ánima eius ab illis.'
  "18": 'Denudávit quoque fornicatiónes suas, et discoopéruit ignomíniam suam: et recéssit ánima mea ab ea, sicut recésserat ánima mea a soróre eius.'
  "19": Multiplicávit enim fornicatiónes suas, recórdans dies adolescéntiæ suæ, quibus fornicáta est in terra Ægýpti.
  "20": Et insanívit libídine super concúbitum eórum, quorum carnes sunt ut carnes asinórum, et sicut fluxus equórum fluxus eórum.
  "21": Et visitásti scelus adolescéntiæ tuæ, quando subácta sunt in Ægýpto úbera tua, et confráctæ sunt mammæ pubertátis tuæ.
  "22": 'Proptérea Oóliba, hæc dicit Dóminus Deus: Ecce ego suscitábo omnes amatóres tuos contra te, de quibus satiáta est ánima tua: et congregábo eos advérsum te in circúitu:'
  "23": 'fílios Babylónis, et univérsos Chaldǽos, nóbiles, tyrannósque, et príncipes, omnes fílios Assyriórum, iúvenes forma egrégia, duces et magistrátus univérsos, príncipes príncipum, et nominátos ascensóres equórum:'
  "24": 'et vénient super te instrúcti curru et rota, multitúdo populórum: loríca, et clýpeo, et gálea armabúntur contra te úndique: et dabo coram eis iudícium, et iudicábunt te iudíciis suis.'
  "25": 'Et ponam zelum meum in te, quem exércent tecum in furóre: nasum tuum, et aures tuas præcídent: et quæ remánserint, gládio cóncident: ipsi fílios tuos, et fílias tuas cápient, et novíssimum tuum devorábitur igni.'
  "26": Et denudábunt te vestiméntis tuis, et tollent vasa glóriæ tuæ.
  "27": 'Et requiéscere fáciam scelus tuum de te, et fornicatiónem tuam de terra Ægýpti: nec levábis óculos tuos ad eos, et Ægýpti non recordáberis ámplius.'
  "28": 'Quia hæc dicit Dóminus Deus: Ecce ego tradam te in manus eórum, quos odísti, in manus, de quibus satiáta est ánima tua.'
  "29": 'Et agent tecum in ódio, et tollent omnes labóres tuos, et dimíttent te nudam et ignomínia plenam: et revelábitur ignomínia fornicatiónum tuárum, scelus tuum, et fornicatiónes tuæ.'
  "30": Fecérunt hæc tibi, quia fornicáta es post gentes, inter quas pollúta es in idólis eárum.
  "31": In via soróris tuæ ambulásti, et dabo cálicem eius in manu tua.
  "32": 'Hæc dicit Dóminus Deus: Cálicem soróris tuæ bibes profúndum et latum: eris in derísum, et in subsannatiónem, quæ est capacíssima.'
  "33": 'Ebrietáte, et dolóre repléberis: cálice mœróris et tristítiæ, cálice soróris tuæ Samaríæ.'
  "34": 'Et bibes illum, et epotábis usque ad fæces: et fragménta eius devorábis, et úbera tua lacerábis: quia ego locútus sum, ait Dóminus Deus.'
  "35": 'Proptérea hæc dicit Dóminus Deus: Quia oblíta es mei, et proiecísti me post corpus tuum, tu quoque porta scelus tuum, et fornicatiónes tuas.'
  "36": 'Et ait Dóminus ad me, dicens: Fili hóminis, numquid iúdicas Oóllam et Oólibam, et annúntias eis scélera eárum?'
  "37": 'Quia adulterátæ sunt, et sanguis in mánibus eárum, et cum idólis suis fornicátæ sunt: ínsuper et fílios suos, quos genuérunt mihi, obtulérunt eis ad devorándum.'
  "38": 'Sed et hoc fecérunt mihi: polluérunt sanctuárium meum in die illa, et sábbata mea profanavérunt.'
  "39": Cumque immolárent fílios suos idólis suis, et ingrederéntur sanctuárium meum in die illa ut pollúerent illud, étiam hæc fecérunt in médio domus meæ.
  "40": 'Misérunt ad viros veniéntes de longe, ad quos núntium míserant: ítaque ecce venérunt: quibus te lavísti, et circumlinísti stíbio óculos tuos, et ornáta es mundo mulíebri.'
  "41": 'Sedísti in lecto pulchérrimo, et mensa ornáta est ante te: thymiáma meum, et unguéntum meum posuísti super eam.'
  "42": 'Et vox multitúdinis exsultántis erat in ea: et in viris, qui de multitúdine hóminum adducebántur, et veniébant de desérto, posuérunt armíllas in mánibus eórum, et corónas speciósas in capítibus eórum.'
  "43": 'Et dixi ei, quæ attríta est in adultériis: Nunc fornicábitur in fornicatióne sua étiam hæc.'
  "44": 'Et ingréssi sunt ad eam quasi ad mulíerem meretrícem: sic ingrediebántur ad Oóllam, et Oólibam, mulíeres nefárias.'
  "45": 'Viri ergo iusti sunt: hi iudicábunt eas iudício adulterárum, et iudício effundéntium sánguinem: quia adúlteræ sunt, et sanguis in mánibus eárum.'
  "46": 'Hæc enim dicit Dóminus Deus: Adduc ad eas multitúdinem, et trade eas in tumúltum, et in rapínam:'
  "47": 'et lapidéntur lapídibus populórum, et confodiántur gládiis eórum: fílios, et fílias eárum interfícient, et domos eárum igne succéndent.'
  "48": Et áuferam scelus de terra, et discent omnes mulíeres ne fáciant secúndum scelus eárum.
  "49": 'Et dabunt scelus vestrum super vos, et peccáta idolórum vestrórum portábitis: et sciétis quia ego Dóminus Deus.'
