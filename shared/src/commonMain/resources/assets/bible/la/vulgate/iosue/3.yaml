bible: vulgate
lang: la
language: Latina
book: Iosue
chapter: "3"
verses:
  "1": 'Igitur Iósue de nocte consúrgens movit castra: egredientésque de Setim, venérunt ad Iordánem ipse, et omnes fílii Israel, et moráti sunt ibi tres dies.'
  "2": Quibus evolútis transiérunt præcónes per castrórum médium,
  "3": 'et clamáre cœpérunt: Quando vidéritis arcam fœ́deris Dómini Dei vestri, et sacerdótes stirpis Levíticæ portántes eam, vos quoque consúrgite, et sequímini præcedéntes:'
  "4": 'sitque inter vos et arcam spátium cubitórum duum míllium: ut procul vidére possítis, et nosse per quam viam ingrediámini: quia prius non ambulástis per eam: et cavéte ne appropinquétis ad arcam.'
  "5": 'Dixítque Iósue ad pópulum: Sanctificámini: cras enim fáciet Dóminus inter vos mirabília.'
  "6": 'Et ait ad sacerdótes: Tóllite arcam fœ́deris, et præcédite pópulum. Qui iussa compléntes, tulérunt, et ambulavérunt ante eos.'
  "7": 'Dixítque Dóminus ad Iósue: Hódie incípiam exaltáre te coram omni Israel: ut sciant quod sicut cum Móyse fui, ita et tecum sim.'
  "8": 'Tu autem prǽcipe sacerdótibus, qui portant arcam fœ́deris, et dic eis: Cum ingréssi fuéritis partem aquæ Iordánis, state in ea.'
  "9": 'Dixítque Iósue ad fílios Israel: Accédite huc, et audíte verbum Dómini Dei vestri.'
  "10": 'Et rursum: In hoc, inquit, sciétis quod Dóminus Deus vivens in médio vestri est, et dispérdet in conspéctu vestro Chananǽum et Hethǽum, Hevǽum et Pherezǽum, Gergesǽum quoque et Iebusǽum, et Amorrhǽum.'
  "11": Ecce arca fœ́deris Dómini omnis terræ antecédet vos per Iordánem.
  "12": Paráte duódecim viros de tríbubus Israel, síngulos per síngulas tribus.
  "13": 'Et cum posúerint vestígia pedum suórum sacerdótes qui portant arcam Dómini Dei univérsæ terræ in aquis Iordánis, aquæ, quæ inferióres sunt, decúrrent atque defícient: quæ autem désuper véniunt, in una mole consístent.'
  "14": 'Igitur egréssus est pópulus de tabernáculis suis, ut transíret Iordánem: et sacerdótes, qui portábant arcam fœ́deris, pergébant ante eum.'
  "15": Ingressísque eis Iordánem, et pédibus eórum in parte aquæ tinctis (Iordánis autem ripas álvei sui témpore messis impléverat),
  "16": 'stetérunt aquæ descendéntes in loco uno, et ad instar montis intumescéntes apparébant procul ab urbe, quæ vocátur Adom usque ad locum Sarthan: quæ autem inferióres erant, in Mare solitúdinis (quod nunc vocátur mórtuum) descendérunt, úsquequo omníno defícerent.'
  "17": 'Pópulus autem incedébat contra Iéricho: et sacerdótes qui portábant arcam fœ́deris Dómini, stabant super siccam humum in médio Iordánis accíncti, omnísque pópulus per aréntem álveum transíbat.'
