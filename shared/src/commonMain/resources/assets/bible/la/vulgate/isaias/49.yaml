bible: vulgate
lang: la
language: Latina
book: Isaias
chapter: "49"
verses:
  "1": 'Audíte ínsulæ, et atténdite pópuli de longe: Dóminus ab útero vocávit me, de ventre matris meæ recordátus est nóminis mei.'
  "2": 'Et pósuit os meum quasi gládium acútum, in umbra manus suæ protéxit me, et pósuit me sicut sagíttam eléctam: in pháretra sua abscóndit me.'
  "3": 'Et dixit mihi: Servus meus es tu Israel, quia in te gloriábor.'
  "4": 'Et ego dixi: In vácuum laborávi, sine causa et vane fortitúdinem meam consúmpsi: ergo iudícium meum cum Dómino, et opus meum cum Deo meo.'
  "5": 'Et nunc dicit Dóminus, formans me ex útero servum sibi, ut redúcam Iacob ad eum, et Israel non congregábitur: et glorificátus sum in óculis Dómini, et Deus meus factus est fortitúdo mea.'
  "6": 'Et dixit: Parum est ut sis mihi servus ad suscitándas tribus Iacob, et fæces Israel converténdas: ecce dedi te in lucem géntium, ut sis salus mea usque ad extrémum terræ.'
  "7": 'Hæc dicit Dóminus redémptor Israel, sanctus eius, ad contemptíbilem ánimam, ad abominátam gentem, ad servum dominórum: Reges vidébunt, et consúrgent príncipes, et adorábunt propter Dóminum, quia fidélis est, et sanctum Israel qui elégit te.'
  "8": 'Hæc dicit Dóminus: In témpore plácito exaudívi te, et in die salútis auxiliátus sum tui: et servávi te, et dedi te in fœdus pópuli, ut suscitáres terram, et possidéres hereditátes dissipátas:'
  "9": 'ut díceres his, qui vincti sunt: Exíte: et his, qui in ténebris: Revelámini. Super vias pascéntur, et in ómnibus planis páscua eórum.'
  "10": Non esúrient neque sítient, et non percútiet eos æstus et sol, quia miserátor eórum reget eos, et ad fontes aquárum potábit eos.
  "11": Et ponam omnes montes meos in viam, et sémitæ meæ exaltabúntur.
  "12": Ecce isti de longe vénient, et ecce illi ab aquilóne et mari, et isti de terra austráli.
  "13": 'Laudáte cæli, et exsúlta terra, iubiláte montes laudem: quia consolátus est Dóminus pópulum suum, et páuperum suórum miserébitur.'
  "14": 'Et dixit Sion: Derelíquit me Dóminus, et Dóminus oblítus est mei.'
  "15": Numquid oblivísci potest múlier infántem suum, ut non misereátur fílio úteri sui? Etsi illa oblíta fúerit, ego tamen non oblivíscar tui.
  "16": 'Ecce in mánibus meis descrípsi te: muri tui coram óculis meis semper.'
  "17": 'Venérunt structóres tui: destruéntes te et dissipántes a te exíbunt.'
  "18": 'Leva in circúitu óculos tuos, et vide: omnes isti congregáti sunt, venérunt tibi. Vivo ego, dicit Dóminus, quia ómnibus his velut ornaménto vestiéris, et circúmdabis tibi eos quasi sponsa.'
  "19": 'Quia desérta tua, et solitúdines tuæ, et terra ruínæ tuæ, nunc angústa erunt præ habitatóribus: et longe fugabúntur qui absorbébant te.'
  "20": 'Adhuc dicent in áuribus tuis fílii sterilitátis tuæ: Angústus est mihi locus, fac spátium mihi, ut hábitem.'
  "21": 'Et dices in corde tuo: Quis génuit mihi istos? ego stérilis, et non páriens, transmigráta, et captíva: et istos quis enutrívit? ego destitúta et sola: et isti ubi erant?'
  "22": 'Hæc dicit Dóminus Deus: Ecce levábo ad gentes manum meam, et ad pópulos exaltábo signum meum: et áfferent fílios tuos in ulnis, et fílias tuas super húmeros portábunt.'
  "23": 'Et erunt reges nutrítii tui, et regínæ nutríces tuæ: vultu in terram demísso adorábunt te, et púlverem pedum tuórum lingent. Et scies quia ego Dóminus, super quo non confundéntur qui exspéctant eum.'
  "24": Numquid tollétur a forti præda? aut quod captum fúerit a robústo, salvum esse póterit?
  "25": 'Quia hæc dicit Dóminus: Equidem, et captívitas a forti tollétur, et quod ablátum fúerit a robústo, salvábitur. Eos vero, qui iudicavérunt te, ego iudicábo, et fílios tuos ego salvábo.'
  "26": 'Et cibábo hostes tuos cárnibus suis, et quasi musto, sánguine suo inebriabúntur: et sciet omnis caro, quia ego Dóminus salvans te, et redémptor tuus fortis Iacob.'
