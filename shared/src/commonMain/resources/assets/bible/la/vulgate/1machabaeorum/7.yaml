bible: vulgate
lang: la
language: Latina
book: I Machabaeorum
chapter: "7"
verses:
  "1": Anno centésimo quinquagésimo primo, éxiit Demétrius Seléuci fílius ab urbe Roma, et ascéndit cum paucis viris in civitátem marítimam, et regnávit illic.
  "2": Et factum est, ut ingréssus est domum regni patrum suórum, comprehéndit exércitus Antíochum et Lýsiam, ut addúcerent eos ad eum.
  "3": 'Et res ei innótuit, et ait: Nolíte mihi osténdere fáciem eórum.'
  "4": 'Et occídit eos exércitus. Et sedit Demétrius super sedem regni sui:'
  "5": 'et venérunt ad eum viri iníqui et ímpii ex Israel: et Alcimus dux eórum, qui volébat fíeri sacérdos.'
  "6": 'Et accusavérunt pópulum apud regem, dicéntes: Pérdidit Iudas, et fratres eius omnes amícos tuos, et nos dispérsit de terra nostra.'
  "7": 'Nunc ergo mitte virum, cui credis, ut eat, et vídeat extermínium omne, quod fecit nobis, et regiónibus regis: et púniat omnes amícos eius, et adiutóres eórum.'
  "8": 'Et elégit rex ex amícis suis Bácchidem, qui dominabátur trans flumen magnum in regno, et fidélem regi: et misit eum,'
  "9": 'ut vidéret extermínium, quod fecit Iudas: sed et Alcimum ímpium constítuit in sacerdótium, et mandávit ei fácere ultiónem in fílios Israel.'
  "10": 'Et surrexérunt, et venérunt cum exércitu magno in terram Iuda: et misérunt núntios, et locúti sunt ad Iudam, et ad fratres eius verbis pacíficis in dolo.'
  "11": 'Et non intendérunt sermónibus eórum: vidérunt enim quia venérunt cum exércitu magno.'
  "12": 'Et convenérunt ad Alcimum, et Bácchidem congregátio scribárum requírere quæ iusta sunt:'
  "13": 'et primi, Assidǽi qui erant in fíliis Israel: et exquirébant ab eis pacem.'
  "14": 'Dixérunt enim: Homo sacérdos de sémine Aaron venit, non decípiet nos:'
  "15": 'et locútus est cum eis verba pacífica, et iurávit illis, dicens: Non inferémus vobis malum, neque amícis vestris.'
  "16": 'Et credidérunt ei: et comprehéndit ex eis sexagínta viros, et occídit eos in una die secúndum verbum, quod scriptum est:'
  "17": Carnes sanctórum tuórum, et sánguinem ipsórum effudérunt in circúitu Ierúsalem, et non erat qui sepelíret.
  "18": 'Et incúbuit timor, et tremor in omnem pópulum: quia dixérunt: Non est véritas, et iudícium in eis: transgréssi sunt enim constitútum, et iusiurándum quod iuravérunt.'
  "19": 'Et movit Bácchides castra ab Ierúsalem, et applícuit in Bethzécha: et misit, et comprehéndit multos ex eis, qui a se effúgerant, et quosdam de pópulo mactávit, et in púteum magnum proiécit.'
  "20": 'Et commísit regiónem Alcimo, et relíquit cum eo auxílium in adiutórium ipsi. Et ábiit Bácchides ad regem:'
  "21": et satis agébat Alcimus pro principátu sacerdótii sui.
  "22": Et convenérunt ad eum omnes, qui perturbábant pópulum suum, et obtinuérunt terram Iuda, et fecérunt plagam magnam in Israel.
  "23": Et vidit Iudas ómnia mala quæ fecit Alcimus, et qui cum eo erant, fíliis Israel, multo plus quam gentes.
  "24": Et éxiit in omnes fines Iudǽæ in circúitu, et fecit vindíctam in viros desertóres, et cessavérunt ultra exíre in regiónem.
  "25": 'Vidit autem Alcimus quod præváluit Iudas, et qui cum eo erant: et cognóvit quia non potest sustinére eos, et regréssus est ad regem, et accusávit eos multis crimínibus.'
  "26": 'Et misit rex Nicánorem, unum ex princípibus suis nobilióribus, qui erat inimicítias exércens contra Israel: et mandávit ei evértere pópulum.'
  "27": Et venit Nicánor in Ierúsalem cum exércitu magno, et misit ad Iudam et ad fratres eius verbis pacíficis cum dolo,
  "28": 'dicens: Non sit pugna inter me et vos: véniam cum viris paucis, ut vídeam fácies vestras cum pace.'
  "29": 'Et venit ad Iudam, et salutavérunt se ínvicem pacífice: et hostes paráti erant rápere Iudam.'
  "30": 'Et innótuit sermo Iudæ quóniam cum dolo vénerat ad eum: et contérritus est ab eo, et ámplius nóluit vidére fáciem eius.'
  "31": 'Et cognóvit Nicánor quóniam denudátum est consílium eius: et exívit óbviam Iudæ in pugnam iuxta Capharsálama.'
  "32": Et cecidérunt de Nicánoris exércitu fere quinque míllia viri, et fugérunt in civitátem David.
  "33": 'Et post hæc verba ascéndit Nicánor in montem Sion: et exiérunt de sacerdótibus pópuli salutáre eum in pace, et demonstráre ei holocautómata, quæ offerebántur pro rege.'
  "34": 'Et irrídens sprevit eos, et pólluit: et locútus est supérbe,'
  "35": 'et iurávit cum ira, dicens: Nisi tráditus fúerit Iudas, et exércitus eius in manus meas, contínuo cum regréssus fúero in pace, succéndam domum istam. Et éxiit cum ira magna.'
  "36": 'Et intravérunt sacerdótes, et stetérunt ante fáciem altáris et templi: et flentes dixérunt:'
  "37": 'Tu Dómine elegísti domum istam ad invocándum nomen tuum in ea, ut esset domus oratiónis et obsecratiónis pópulo tuo:'
  "38": 'fac vindíctam in hómine isto, et exércitu eius, et cadant in gládio: meménto blasphémias eórum, et ne déderis eis ut permáneant.'
  "39": 'Et éxiit Nicánor ab Ierúsalem, et castra applícuit ad Béthoron: et occúrrit illi exércitus Sýriæ.'
  "40": 'Et Iudas applícuit in Adársa cum tribus míllibus viris: et orávit Iudas, et dixit:'
  "41": 'Qui missi erant a rege Sennácherib, Dómine, quia blasphemavérunt te, éxiit ángelus, et percússit ex eis centum octogínta quinque míllia:'
  "42": 'sic cóntere exércitum istum in conspéctu nostro hódie: et sciant céteri quia male locútus est super sancta tua: et iúdica illum secúndum malítiam illíus.'
  "43": 'Et commisérunt exércitus prœ́lium tertiadécima die mensis Adar: et contríta sunt castra Nicánoris, et cécidit ipse primus in prœ́lio.'
  "44": 'Ut autem vidit exércitus eius quia cecidísset Nicánor, proiecérunt arma sua, et fugérunt:'
  "45": 'et persecúti sunt eos viam uníus diéi ab Adázer úsquequo veniátur in Gázara, et tubis cecinérunt post eos cum significatiónibus:'
  "46": et exiérunt de ómnibus castéllis Iudǽæ in circúitu, et ventilábant eos córnibus, et convertebántur íterum ad eos, et cecidérunt omnes gládio, et non est relíctus ex eis nec unus.
  "47": 'Et accepérunt spólia eórum in prædam: et caput Nicánoris amputavérunt, et déxteram eius, quam exténderat supérbe, et attulérunt, et suspendérunt contra Ierúsalem.'
  "48": Et lætátus est pópulus valde, et egérunt diem illam in lætítia magna.
  "49": Et constítuit agi ómnibus annis diem istam tertiadécima die mensis Adar.
  "50": Et síluit terra Iuda dies paucos.
