bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "113"
verses:
  "1": 'Allelúia. In éxitu Israel de Ægýpto, domus Iacob de pópulo bárbaro:'
  "2": facta est Iudǽa sanctificátio eius, Israel potéstas eius.
  "3": 'Mare vidit, et fugit: Iordánis convérsus est retrórsum.'
  "4": 'Montes exsultavérunt ut aríetes: et colles sicut agni óvium.'
  "5": Quid est tibi mare quod fugísti? et tu Iordánis, quia convérsus es retrórsum?
  "6": Montes exsultástis sicut aríetes? et colles sicut agni óvium?
  "7": A fácie Dómini mota est terra, a fácie Dei Iacob.
  "8": Qui convértit petram in stagna aquárum, et rupem in fontes aquárum.
  "9": 'Non nobis Dómine, non nobis: sed nómini tuo da glóriam.'
  "10": 'Super misericórdia tua, et veritáte tua: nequándo dicant gentes: Ubi est Deus eórum?'
  "11": 'Deus autem noster in cælo: ómnia quæcúmque vóluit, fecit.'
  "12": Simulácra géntium argéntum et aurum, ópera mánuum hóminum.
  "13": 'Os habent, et non loquéntur: óculos habent, et non vidébunt.'
  "14": 'Aures habent, et non áudient: nares habent, et non odorábunt.'
  "15": 'Manus habent, et non palpábunt: pedes habent, et non ambulábunt: non clamábunt in gútture suo.'
  "16": 'Símiles illis fiant qui fáciunt ea: et omnes qui confídunt in eis.'
  "17": 'Domus Israel sperávit in Dómino: adiútor eórum et protéctor eórum est.'
  "18": 'Domus Aaron sperávit in Dómino: adiútor eórum et protéctor eórum est.'
  "19": 'Qui timent Dóminum, speravérunt in Dómino: adiútor eórum et protéctor eórum est.'
  "20": 'Dóminus memor fuit nostri: et benedíxit nobis: benedíxit dómui Israel: benedíxit dómui Aaron.'
  "21": Benedíxit ómnibus, qui timent Dóminum, pusíllis cum maióribus.
  "22": 'Adíciat Dóminus super vos: super vos et super fílios vestros.'
  "23": Benedícti vos a Dómino, qui fecit cælum et terram.
  "24": 'Cælum cæli Dómino: terram autem dedit fíliis hóminum.'
  "25": 'Non mórtui laudábunt te Dómine: neque omnes, qui descéndunt in inférnum.'
  "26": Sed nos qui vívimus, benedícimus Dómino, ex hoc nunc et usque in sǽculum.
