bible: vulgate
lang: la
language: Latina
book: II Paralipomenon
chapter: "16"
verses:
  "1": Anno autem trigésimo sexto regni eius, ascéndit Báasa rex Israel in Iudam, et muro circúmdabat Rama, ut nullus tute posset égredi et íngredi de regno Asa.
  "2": 'Prótulit ergo Asa argéntum et aurum de thesáuris domus Dómini, et de thesáuris regis, misítque ad Bénadad regem Sýriæ, qui habitábat in Damásco, dicens:'
  "3": 'Fœdus inter me et te est, pater quoque meus et pater tuus habuére concórdiam: quam ob rem misi tibi argéntum et aurum, ut rupto fœ́dere, quod habes cum Báasa rege Israel, fácias eum a me recédere.'
  "4": 'Quo compérto, Bénadad misit príncipes exercítuum suórum ad urbes Israel: qui percussérunt Ahion, et Dan, et Abélmaim, et univérsas urbes Néphthali murátas.'
  "5": Quod cum audísset Báasa, désiit ædificáre Rama, et intermísit opus suum.
  "6": Porro Asa rex assúmpsit univérsum Iudam, et tulérunt lápides de Rama, et ligna quæ ædificatióni præparáverat Báasa, ædificavítque ex eis Gábaa, et Maspha.
  "7": 'In témpore illo venit Hánani prophéta ad Asa regem Iuda, et dixit ei: Quia habuísti fidúciam in rege Sýriæ, et non in Dómino Deo tuo, idcírco evásit Sýriæ regis exércitus de manu tua.'
  "8": 'Nonne Æthíopes, et Líbyes multo plures erant quadrígis, et equítibus, et multitúdine nímia: quos, cum Dómino credidísses, trádidit in manu tua?'
  "9": Oculi enim Dómini contemplántur univérsam terram, et præbent fortitúdinem his, qui corde perfécto credunt in eum. Stulte ígitur egísti, et propter hoc ex præsénti témpore advérsum te bella consúrgent.
  "10": 'Iratúsque Asa advérsus vidéntem, iussit eum mitti in nervum: valde quippe super hoc fúerat indignátus: et interfécit de pópulo in témpore illo plúrimos.'
  "11": Opera autem Asa prima et novíssima scripta sunt in Libro regum Iuda et Israel.
  "12": Ægrotávit étiam Asa anno trigésimo nono regni sui, dolóre pedum vehementíssimo, et nec in infirmitáte sua quæsívit Dóminum, sed magis in medicórum arte confísus est.
  "13": Dormivítque cum pátribus suis, et mórtuus est anno quadragésimo primo regni sui.
  "14": 'Et sepeliérunt eum in sepúlcro suo, quod fóderat sibi in civitáte David: posuerúntque eum super lectum suum plenum aromátibus et unguéntibus meretríciis, quæ erant pigmentariórum arte confécta, et combussérunt super eum ambitióne nímia.'
