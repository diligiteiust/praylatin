bible: vulgate
lang: la
language: Latina
book: ad Titum
chapter: "3"
verses:
  "1": 'Admone illos princípibus, et potestátibus súbditos esse, dicto obedíre, ad omne opus bonum parátos esse:'
  "2": néminem blasphemáre, non litigiósos esse, sed modéstos, omnem ostendéntes mansuetúdinem ad omnes hómines.
  "3": Erámus enim aliquándo et nos insipiéntes, incréduli, errántes, serviéntes desidériis, et voluptátibus váriis, in malítia et invídia agéntes, odíbiles, odiéntes ínvicem.
  "4": Cum autem benígnitas, et humánitas appáruit Salvatóris nostri Dei,
  "5": non ex opéribus iustítiæ, quæ fécimus nos, sed secúndum suam misericórdiam salvos nos fecit per lavácrum regeneratiónis, et renovatiónis Spíritus sancti,
  "6": 'quem effúdit in nos abúnde per Iesum Christum Salvatórem nostrum:'
  "7": ut iustificáti grátia ipsíus, herédes simus secúndum spem vitæ ætérnæ.
  "8": 'Fidélis sermo est: et de his volo te confirmáre: ut curent bonis opéribus præésse qui credunt Deo. Hæc sunt bona, et utília homínibus.'
  "9": 'Stultas autem quæstiónes, et genealógias, et contentiónes, et pugnas legis devíta: sunt enim inútiles, et vanæ.'
  "10": 'Hæréticum hóminem post unam, et secúndam correptiónem devíta:'
  "11": sciens quia subvérsus est, qui eiúsmodi est, et delínquit, cum sit próprio iudício condemnátus.
  "12": 'Cum mísero ad te Artemam, aut Týchicum, festína ad me veníre Nicópolim: ibi enim státui hiemáre.'
  "13": Zenam legisperítum, et Apóllo sollícite præmítte, ut nihil illis desit.
  "14": 'Discant autem et nostri bonis opéribus præésse ad usus necessários: ut non sint infructuósi.'
  "15": 'Salútant te qui mecum sunt omnes: salúta eos, qui nos amant in fide. Grátia Dei cum ómnibus vobis. Amen.'
