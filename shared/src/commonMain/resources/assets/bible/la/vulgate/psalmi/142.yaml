bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "142"
verses:
  "1": 'Psalmus David, Quando persequebátur eum Absalom fílius eius. Dómine exáudi oratiónem meam: áuribus pércipe obsecratiónem meam in veritáte tua: exáudi me in tua iustítia.'
  "2": 'Et non intres in iudícium cum servo tuo: quia non iustificábitur in conspéctu tuo omnis vivens.'
  "3": 'Quia persecútus est inimícus ánimam meam: humiliávit in terra vitam meam. Collocávit me in obscúris sicut mórtuos sǽculi:'
  "4": et anxiátus est super me spíritus meus, in me turbátum est cor meum.
  "5": Memor fui diérum antiquórum, meditátus sum in ómnibus opéribus tuis, in factis mánuum tuárum meditábar.
  "6": 'Expándi manus meas ad te: ánima mea sicut terra sine aqua tibi:'
  "7": 'velóciter exáudi me Dómine: defécit spíritus meus. Non avértas fáciem tuam a me: et símilis ero descendéntibus in lacum.'
  "8": 'Audítam fac mihi mane misericórdiam tuam: quia in te sperávi. Notam fac mihi viam, in qua ámbulem: quia ad te levávi ánimam meam.'
  "9": 'Eripe me de inimícis meis Dómine, ad te confúgi:'
  "10": 'doce me fácere voluntátem tuam, quia Deus meus es tu. Spíritus tuus bonus dedúcet me in terram rectam:'
  "11": 'propter nomen tuum Dómine vivificábis me, in æquitáte tua. Edúces de tribulatióne ánimam meam:'
  "12": 'et in misericórdia tua dispérdes inimícos meos. Et perdes omnes, qui tríbulant ánimam meam: quóniam ego servus tuus sum.'
