bible: vulgate
lang: la
language: Latina
book: Iob
chapter: "1"
verses:
  "1": 'Vir erat in terra Hus, nómine Iob, et erat vir ille simplex, et rectus, ac timens Deum, et recédens a malo:'
  "2": natíque sunt ei septem fílii, et tres fíliæ.
  "3": 'Et fuit posséssio eius septem míllia óvium, et tria míllia camelórum, quingénta quoque iuga boum, et quingéntæ ásinæ, ac família multa nimis: erátque vir ille magnus inter omnes orientáles.'
  "4": Et ibant fílii eius, et faciébant convívium per domos, unusquísque in die suo. Et mitténtes vocábant tres soróres suas ut coméderent et bíberent cum eis.
  "5": 'Cumque in orbem transíssent dies convívii, mittébat ad eos Iob, et sanctificábat illos: consurgénsque dilúculo, offerébat holocáusta pro síngulis. Dicébat enim: Ne forte peccáverint fílii mei, et benedíxerint Deo in córdibus suis. Sic faciébat Iob cunctis diébus.'
  "6": Quadam autem die, cum veníssent fílii Dei ut assísterent coram Dómino, áffuit inter eos étiam Satan.
  "7": 'Cui dixit Dóminus: Unde venis? Qui respóndens, ait: Circuívi terram, et perambulávi eam.'
  "8": 'Dixítque Dóminus ad eum: Numquid considerásti servum meum Iob, quod non sit ei símilis in terra, homo simplex, et rectus, ac timens Deum, et recédens a malo?'
  "9": 'Cui respóndens Satan, ait: Numquid Iob frustra timet Deum?'
  "10": 'Nonne tu vallásti eum, ac domum eius, universámque substántiam per circúitum: opéribus mánuum eius benedixísti, et posséssio eius crevit in terra?'
  "11": Sed exténde páululum manum tuam, et tange cuncta quæ póssidet, nisi in fáciem benedíxerit tibi.
  "12": 'Dixit ergo Dóminus ad Satan: Ecce, univérsa quæ habet, in manu tua sunt: tantum in eum ne exténdas manum tuam. Egressúsque est Satan a fácie Dómini.'
  "13": Cum autem quadam die fílii et fíliæ eius coméderent et bíberent vinum in domo fratris sui primogéniti,
  "14": 'núntius venit ad Iob, qui díceret: Boves arábant, et ásinæ pascebántur iuxta eos,'
  "15": et irruérunt Sabǽi, tulerúntque ómnia, et púeros percussérunt gládio, et evási ego solus ut nuntiárem tibi.
  "16": 'Cumque adhuc ille loquerétur, venit alter, et dixit: Ignis Dei cécidit e cælo, et tactas oves puerósque consúmpsit, et effúgi ego solus ut nuntiárem tibi.'
  "17": 'Sed et illo adhuc loquénte, venit álius, et dixit: Chaldǽi fecérunt tres turmas, et invasérunt camélos, et tulérunt eos, necnon et púeros percussérunt gládio, et ego fugi solus ut nuntiárem tibi.'
  "18": 'Adhuc loquebátur ille, et ecce álius intrávit, et dixit: Fíliis tuis et filiábus vescéntibus et bibéntibus vinum in domo fratris sui primogéniti,'
  "19": repénte ventus véhemens írruit a regióne desérti, et concússit quátuor ángulos domus, quæ córruens oppréssit líberos tuos, et mórtui sunt, et effúgi ego solus ut nuntiárem tibi.
  "20": Tunc surréxit Iob, et scidit vestiménta sua, et tonso cápite córruens in terram, adorávit,
  "21": 'et dixit: Nudus egréssus sum de útero matris meæ, et nudus revértar illuc: Dóminus dedit, Dóminus ábstulit: sicut Dómino plácuit, ita factum est: sit nomen Dómini benedíctum.'
  "22": In ómnibus his non peccávit Iob lábiis suis, neque stultum quid contra Deum locútus est.
