bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "94"
verses:
  "1": 'Laus Cántici ipsi David. Veníte, exsultémus Dómino: iubilémus Deo salutári nostro:'
  "2": 'præoccupémus fáciem eius in confessióne: et in psalmis iubilémus ei.'
  "3": 'Quóniam Deus magnus Dóminus: et rex magnus super omnes deos.'
  "4": 'Quia in manu eius sunt omnes fines terræ: et altitúdines móntium ipsíus sunt.'
  "5": 'Quóniam ipsíus est mare, et ipse fecit illud: et siccam manus eius formavérunt.'
  "6": 'Veníte adorémus, et procidámus: et plorémus ante Dóminum, qui fecit nos.'
  "7": 'Quia ipse est Dóminus Deus noster: et nos pópulus páscuæ eius, et oves manus eius.'
  "8": 'Hódie si vocem eius audiéritis, nolíte obduráre corda vestra:'
  "9": 'sicut in irritatióne secúndum diem tentatiónis in desérto: ubi tentavérunt me patres vestri, probavérunt me, et vidérunt ópera mea.'
  "10": 'Quadragínta annis offénsus fui generatióni illi, et dixi: Semper hi errant corde.'
  "11": 'Et isti non cognovérunt vias meas: ut iurávi in ira mea: Si introíbunt in réquiem meam.'
