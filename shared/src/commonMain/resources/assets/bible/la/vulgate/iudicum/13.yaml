bible: vulgate
lang: la
language: Latina
book: Iudicum
chapter: "13"
verses:
  "1": 'Rursúmque fílii Israel fecérunt malum in conspéctu Dómini: qui trádidit eos in manus Philisthinórum quadragínta annis.'
  "2": Erat autem quidam vir de Sáraa, et de stirpe Dan, nómine Manue, habens uxórem stérilem.
  "3": 'Cui appáruit ángelus Dómini, et dixit ad eam: Stérilis es et absque líberis: sed concípies, et páries fílium.'
  "4": 'Cave ergo ne bibas vinum ac síceram, nec immúndum quidquam cómedas:'
  "5": 'quia concípies, et páries fílium, cuius non tanget caput novácula: erit enim Nazarǽus Dei ab infántia sua et ex matris útero, et ipse incípiet liberáre Israel de manu Philisthinórum.'
  "6": 'Quæ cum venísset ad marítum suum, dixit ei: Vir Dei venit ad me, habens vultum angélicum, terríbilis nimis. Quem cum interrogássem quis esset, et unde venísset, et quo nómine vocarétur, nóluit mihi dícere:'
  "7": 'sed hoc respóndit: Ecce concípies et páries fílium: cave ne vinum bibas, nec síceram, et ne áliquo vescáris immúndo: erit enim puer Nazarǽus Dei ab infántia sua, ex útero matris suæ usque ad diem mortis suæ.'
  "8": 'Orávit ítaque Manue Dóminum, et ait: Obsecro Dómine, ut vir Dei, quem misísti, véniat íterum, et dóceat nos quid debeámus fácere de púero, qui nascitúrus est.'
  "9": 'Exaudivítque Dóminus deprecántem Manue, et appáruit rursum ángelus Dei uxóri eius sedénti in agro: Manue autem marítus eius non erat cum ea. Quæ cum vidísset ángelum,'
  "10": 'festinávit, et cucúrrit ad virum suum: nuntiavítque ei, dicens: Ecce appáruit mihi vir, quem ante víderam.'
  "11": 'Qui surréxit, et secútus est uxórem suam: veniénsque ad virum, dixit ei: Tu es qui locútus es mulíeri? Et ille respóndit: Ego sum.'
  "12": 'Cui Manue: Quando, inquit, sermo tuus fúerit explétus, quid vis ut fáciat puer? aut a quo se observáre debébit?'
  "13": 'Dixítque ángelus Dómini ad Manue: Ab ómnibus, quæ locútus sum uxóri tuæ, abstíneat se:'
  "14": 'et quidquid ex vínea náscitur, non cómedat: vinum et síceram non bibat: nullo vescátur immúndo: et quod ei præcépi, ímpleat atque custódiat.'
  "15": 'Dixítque Manue ad ángelum Dómini: Obsecro te ut acquiéscas précibus meis, et faciámus tibi hædum de capris.'
  "16": 'Cui respóndit ángelus: Si me cogis, non cómedam panes tuos: si autem vis holocáustum fácere, offer illud Dómino. Et nesciébat Manue quod ángelus Dómini esset.'
  "17": 'Dixítque ad eum: Quod est tibi nomen, ut, si sermo tuus fúerit explétus, honorémus te?'
  "18": 'Cui ille respóndit: Cur quæris nomen meum, quod est mirábile?'
  "19": 'Tulit ítaque Manue hædum de capris, et libaménta, et pósuit super petram, ófferens Dómino, qui facit mirabília: ipse autem et uxor eius intuebántur.'
  "20": Cumque ascénderet flamma altáris in cælum, ángelus Dómini páriter in flamma ascéndit. Quod cum vidíssent Manue et uxor eius, proni cecidérunt in terram,
  "21": et ultra eis non appáruit ángelus Dómini. Statímque intelléxit Manue ángelum Dómini esse,
  "22": 'et dixit ad uxórem suam: Morte moriémur, quia vídimus Deum.'
  "23": 'Cui respóndit múlier: Si Dóminus nos vellet occídere, de mánibus nostris holocáustum et libaménta non suscepísset, nec ostendísset nobis hæc ómnia, neque ea, quæ sunt ventúra dixísset.'
  "24": Péperit ítaque fílium, et vocávit nomen eius Samson. Crevítque puer, et benedíxit ei Dóminus.
  "25": Cœpítque Spíritus Dómini esse cum eo in castris Dan inter Sáraa et Esthaol.
