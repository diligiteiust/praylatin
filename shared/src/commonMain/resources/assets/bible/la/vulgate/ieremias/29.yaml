bible: vulgate
lang: la
language: Latina
book: Ieremias
chapter: "29"
verses:
  "1": 'Et hæc sunt verba libri, quem misit Ieremías prophéta de Ierúsalem ad relíquias seniórum transmigratiónis, et ad sacerdótes, et ad prophétas, et ad omnem pópulum, quem tradúxerat Nabuchodónosor de Ierúsalem in Babylónem:'
  "2": 'postquam egréssus est Iechonías rex, et dómina, et eunúchi, et príncipes Iuda et Ierúsalem, et faber et inclúsor, de Ierúsalem:'
  "3": 'in manu Elasa fílii Saphan, et Gamaríæ fílii Helcíæ, quos misit Sedecías rex Iuda ad Nabuchodónosor regem Babylónis in Babylónem, dicens:'
  "4": 'Hæc dicit Dóminus exercítuum Deus Israel omni transmigratióni, quam tránstuli de Ierúsalem in Babylónem:'
  "5": 'Ædificáte domos, et habitáte: et plantáte hortos, et comédite fructum eórum.'
  "6": 'Accípite uxóres, et generáte fílios et fílias: et date fíliis vestris uxóres, et fílias vestras date viris, et páriant fílios et fílias: et multiplicámini ibi, et nolíte esse pauci número.'
  "7": 'Et quǽrite pacem civitátis, ad quam transmigráre vos feci: et oráte pro ea ad Dóminum: quia in pace illíus erit pax vobis.'
  "8": 'Hæc enim dicit Dóminus exercítuum, Deus Israel: Non vos sedúcant prophétæ vestri, qui sunt in médio vestrum, et divíni vestri, et ne attendátis ad sómnia vestra, quæ vos somniátis:'
  "9": 'quia falso ipsi prophétant vobis in nómine meo: et non misi eos, dicit Dóminus.'
  "10": 'Quia hæc dicit Dóminus: Cum cœ́perint impléri in Babylóne septuagínta anni, visitábo vos, et suscitábo super vos verbum meum bonum, ut redúcam vos ad locum istum.'
  "11": Ego enim scio cogitatiónes, quas ego cógito super vos, ait Dóminus, cogitatiónes pacis, et non afflictiónis, ut dem vobis finem et patiéntiam.
  "12": 'Et invocábitis me, et íbitis: et orábitis me, et ego exáudiam vos.'
  "13": 'Quærétis me, et inveniétis: cum quæsiéritis me in toto corde vestro.'
  "14": 'Et invéniar a vobis, ait Dóminus: et redúcam captivitátem vestram, et congregábo vos de univérsis géntibus, et de cunctis locis, ad quæ éxpuli vos, dicit Dóminus: et revérti vos fáciam de loco, ad quem transmigráre vos feci.'
  "15": 'Quia dixístis: Suscitávit nobis Dóminus prophétas in Babylóne:'
  "16": 'quia hæc dicit Dóminus ad regem, qui sedet super sólium David, et ad omnem pópulum habitatórem urbis huius, ad fratres vestros, qui non sunt egréssi vobíscum in transmigratiónem:'
  "17": 'Hæc dicit Dóminus exercítuum: Ecce mittam in eos gládium, et famem, et pestem: et ponam eos quasi ficus malas, quæ cómedi non possunt, eo quod péssimæ sint.'
  "18": 'Et pérsequar eos in gládio, et in fame, et in pestiléntia: et dabo eos in vexatiónem univérsis regnis terræ: in maledictiónem, et in stupórem, et in síbilum, et in oppróbrium cunctis géntibus, ad quas ego eiéci eos:'
  "19": 'eo quod non audíerint verba mea, dicit Dóminus, quæ misi ad eos per servos meos prophétas, de nocte consúrgens et mittens: et non audístis, dicit Dóminus.'
  "20": Vos ergo audíte verbum Dómini omnis transmigrátio, quam emísi de Ierúsalem in Babylónem.
  "21": 'Hæc dicit Dóminus exercítuum, Deus Israel, ad Achab fílium Cóliæ, et ad Sedecíam fílium Maasíæ, qui prophétant vobis in nómine meo mendáciter: Ecce ego tradam eos in manus Nabuchodónosor regis Babylónis, et percútiet eos in óculis vestris.'
  "22": 'Et assumétur ex eis maledíctio omni transmigratióni Iuda, quæ est in Babylóne, dicéntium: Ponat te Dóminus sicut Sedecíam et sicut Achab, quos frixit rex Babylónis in igne:'
  "23": 'pro eo quod fécerint stultítiam in Israel, et mœcháti sunt in uxóres amicórum suórum, et locúti sunt verbum in nómine meo mendáciter, quod non mandávi eis: ego sum iudex et testis, dicit Dóminus.'
  "24": 'Et ad Semeíam Nehelamíten dices:'
  "25": 'Hæc dicit Dóminus exercítuum, Deus Israel: Pro eo quod misísti in nómine tuo libros ad omnem pópulum, qui est in Ierúsalem, et ad Sophoníam fílium Maasíæ sacerdótem, et ad univérsos sacerdótes, dicens:'
  "26": Dóminus dedit te sacerdótem pro Ióiade sacerdóte, ut sis dux in domo Dómini, super omnem virum arreptítium et prophetántem, ut mittas eum in nervum et in cárcerem.
  "27": Et nunc quare non increpásti Ieremíam Anathothíten, qui prophétat vobis?
  "28": 'Quia super hoc misit in Babylónem ad nos, dicens: Longum est: ædificáte domos, et habitáte: et plantáte hortos, et comédite fructus eórum.'
  "29": Legit ergo Sophonías sacérdos librum istum in áuribus Ieremíæ prophétæ.
  "30": 'Et factum est verbum Dómini ad Ieremíam, dicens:'
  "31": 'Mitte ad omnem transmigratiónem, dicens: Hæc dicit Dóminus ad Semeíam Nehelamíten: Pro eo quod prophetávit vobis Semeías, et ego non misi eum, et fecit vos confídere in mendácio:'
  "32": 'idcírco hæc dicit Dóminus: Ecce ego visitábo super Semeíam Nehelamíten, et super semen eius: non erit ei vir sedens in médio pópuli huius, et non vidébit bonum, quod ego fáciam pópulo meo, ait Dóminus, quia prævaricatiónem locútus est advérsus Dóminum.'
