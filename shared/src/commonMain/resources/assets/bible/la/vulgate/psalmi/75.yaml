bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "75"
verses:
  "1": In finem, in Láudibus, Psalmus Asaph, Cánticum ad Assýrios.
  "2": 'Notus in Iudǽa Deus: in Israel magnum nomen eius.'
  "3": 'Et factus est in pace locus eius: et habitátio eius in Sion.'
  "4": Ibi confrégit poténtias árcuum, scutum, gládium, et bellum.
  "5": 'Illúminans tu mirabíliter a móntibus ætérnis:'
  "6": 'turbáti sunt omnes insipiéntes corde. Dormiérunt somnum suum: et nihil invenérunt omnes viri divitiárum in mánibus suis.'
  "7": Ab increpatióne tua Deus Iacob, dormitavérunt qui ascendérunt equos.
  "8": Tu terríbilis es, et quis resístet tibi? ex tunc ira tua.
  "9": 'De cælo audítum fecísti iudícium: terra trémuit et quiévit,'
  "10": cum exsúrgeret in iudícium Deus, ut salvos fáceret omnes mansuétos terræ.
  "11": 'Quóniam cogitátio hóminis confitébitur tibi: et relíquiæ cogitatiónis diem festum agent tibi.'
  "12": 'Vovéte, et réddite Dómino Deo vestro: omnes qui in circúitu eius affértis múnera, terríbili,'
  "13": et ei qui aufert spíritum príncipum, terríbili apud reges terræ.
