bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "143"
verses:
  "1": Psalmus David Advérsus Góliath. Benedíctus Dóminus Deus meus, qui docet manus meas ad prœ́lium, et dígitos meos ad bellum.
  "2": 'Misericórdia mea, et refúgium meum: suscéptor meus, et liberátor meus: protéctor meus, et in ipso sperávi: qui subdit pópulum meum sub me.'
  "3": Dómine quid est homo, quia innotuísti ei? aut fílius hóminis, quia réputas eum?
  "4": 'Homo vanitáti símilis factus est: dies eius sicut umbra prætéreunt.'
  "5": 'Dómine inclína cælos tuos, et descénde: tange montes, et fumigábunt.'
  "6": 'Fúlgura coruscatiónem, et dissipábis eos: emítte sagíttas tuas, et conturbábis eos.'
  "7": 'Emítte manum tuam de alto, éripe me, et líbera me de aquis multis: de manu filiórum alienórum.'
  "8": 'Quorum os locútum est vanitátem: et déxtera eórum déxtera iniquitátis.'
  "9": 'Deus cánticum novum cantábo tibi: in psaltério decachórdo psallam tibi.'
  "10": 'Qui das salútem régibus, qui redemísti David servum tuum de gládio malígno:'
  "11": 'éripe me. Et érue me de manu filiórum alienórum, quorum os locútum est vanitátem: et déxtera eórum, déxtera iniquitátis:'
  "12": 'quorum fílii, sicut novéllæ plantatiónes in iuventúte sua. Fíliæ eórum compósitæ: circumornátæ ut similitúdo templi.'
  "13": 'Promptuária eórum plena, eructántia ex hoc in illud. Oves eórum fœtósæ, abundántes in egréssibus suis:'
  "14": 'boves eórum crassæ. Non est ruína macériæ, neque tránsitus: neque clamor in platéis eórum.'
  "15": 'Beátum dixérunt pópulum, cui hæc sunt: beátus pópulus, cuius Dóminus Deus eius.'
