bible: vulgate
lang: la
language: Latina
book: II Regum
chapter: "12"
verses:
  "1": 'Anno séptimo Iehu, regnávit Ioas: et quadragínta annis regnávit in Ierúsalem. Nomen matris eius Sebía de Bersabée.'
  "2": Fecítque Ioas rectum coram Dómino cunctis diébus, quibus dócuit eum Ióiada sacérdos.
  "3": 'Verúmtamen excélsa non ábstulit: adhuc enim pópulus immolábat, et adolébat in excélsis incénsum.'
  "4": 'Dixítque Ioas ad sacerdótes: Omnem pecúniam sanctórum, quæ illáta fúerit in templum Dómini a prætereúntibus, quæ offértur pro prétio ánimæ, et quam sponte et arbítrio cordis sui ínferunt in templum Dómini:'
  "5": accípiant illam sacerdótes iuxta órdinem suum, et instáurent sartatécta domus, si quid necessárium víderint instauratióne.
  "6": Igitur usque ad vigésimum tértium annum regis Ioas, non instauravérunt sacerdótes sartatécta templi.
  "7": 'Vocavítque rex Ioas Ióiadam pontíficem et sacerdótes, dicens eis: Quare sartatécta non instaurátis templi? nolíte ergo ámplius accípere pecúniam iuxta órdinem vestrum, sed ad instauratiónem templi réddite eam.'
  "8": Prohibitíque sunt sacerdótes ultra accípere pecúniam a pópulo, et instauráre sartatécta domus.
  "9": 'Et tulit Ióiada póntifex gazophylácium unum, aperuítque forámen désuper, et pósuit illud iuxta altáre ad déxteram ingrediéntium domum Dómini: mittebántque in eo sacerdótes, qui custodiébant óstia, omnem pecúniam, quæ deferebátur ad templum Dómini.'
  "10": 'Cumque vidérent nímiam pecúniam esse in gazophylácio, ascendébat scriba regis, et póntifex, effundebántque et numerábant pecúniam, quæ inveniebátur in domo Dómini:'
  "11": 'et dabant eam iuxta númerum atque mensúram in manu eórum, qui prǽerant cæmentáriis domus Dómini: qui impendébant eam in fabris lignórum, et in cæmentáriis iis, qui operabántur in domo Dómini,'
  "12": 'et sartatécta faciébant: et in iis, qui cædébant saxa, et ut émerent ligna, et lápides, qui excidebántur, ita ut implerétur instaurátio domus Dómini in univérsis, quæ indigébant expénsa ad muniéndam domum.'
  "13": Verúmtamen non fiébant ex eádem pecúnia hýdriæ templi Dómini, et fuscínulæ, et thuríbula, et tubæ, et omne vas áureum et argénteum de pecúnia, quæ inferebátur in templum Dómini.
  "14": 'Iis enim, qui faciébant opus, dabátur ut instaurarétur templum Dómini:'
  "15": et non fiébat rátio iis homínibus, qui accipiébant pecúniam ut distribúerent eam artifícibus, sed in fide tractábant eam.
  "16": Pecúniam vero pro delícto, et pecúniam pro peccátis non inferébant in templum Dómini, quia sacerdótum erat.
  "17": 'Tunc ascéndit Házael rex Sýriæ, et pugnábat contra Geth, cepítque eam: et diréxit fáciem suam ut ascénderet in Ierúsalem.'
  "18": 'Quam ob rem tulit Ioas rex Iuda ómnia sanctificáta, quæ consecráverant Iósaphat, et Ioram, et Ochozías patres eius reges Iuda, et quæ ipse obtúlerat: et univérsum argéntum, quod inveníri pótuit in thesáuris templi Dómini, et in palátio regis: misítque Hazaéli regi Sýriæ, et recéssit ab Ierúsalem.'
  "19": Réliqua autem sermónum Ioas, et univérsa quæ fecit, nonne hæc scripta sunt in Libro verbórum diérum regum Iuda?
  "20": Surrexérunt autem servi eius, et coniuravérunt inter se, percusserúntque Ioas in domo Mello in descénsu Sella.
  "21": 'Iósachar namque fílius Sémaath, et Iózabad fílius Somer servi eius, percussérunt eum, et mórtuus est: et sepeliérunt eum cum pátribus suis in civitáte David: regnavítque Amasías fílius eius pro eo.'
