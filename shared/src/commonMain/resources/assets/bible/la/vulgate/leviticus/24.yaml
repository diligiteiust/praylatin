bible: vulgate
lang: la
language: Latina
book: Leviticus
chapter: "24"
verses:
  "1": 'Et locútus est Dóminus ad Móysen, dicens:'
  "2": Prǽcipe fíliis Israel, ut áfferant tibi óleum de olívis puríssimum, ac lúcidum, ad concinnándas lucérnas iúgiter,
  "3": extra velum testimónii in tabernáculo fœ́deris. Ponétque eas Aaron a véspere usque ad mane coram Dómino, cultu ritúque perpétuo in generatiónibus vestris.
  "4": Super candelábrum mundíssimum ponéntur semper in conspéctu Dómini.
  "5": 'Accípies quoque símilam, et coques ex ea duódecim panes, qui sínguli habébunt duas décimas:'
  "6": 'quorum senos altrínsecus super mensam puríssimam coram Dómino státues:'
  "7": et pones super eos thus lucidíssimum, ut sit panis in moniméntum oblatiónis Dómini.
  "8": 'Per síngula sábbata mutabúntur coram Dómino suscépti a fíliis Israel fœ́dere sempitérno:'
  "9": 'erúntque Aaron et filiórum eius, ut cómedant eos in loco sancto: quia Sanctum sanctórum est de sacrifíciis Dómini iure perpétuo.'
  "10": Ecce autem egréssus fílius mulíeris Israelítidis, quem pepérerat de viro Ægýptio inter fílios Israel, iurgátus est in castris cum viro Israelíta.
  "11": Cumque blasphemásset nomen, et maledixísset ei, addúctus est ad Móysen. (Vocabátur autem mater eius Salúmith, fília Dabri de tribu Dan.)
  "12": Miserúntque eum in cárcerem, donec nossent quid iubéret Dóminus.
  "13": Qui locútus est ad Móysen,
  "14": 'dicens: Educ blasphémum extra castra, et ponant omnes qui audiérunt, manus suas super caput eius, et lápidet eum pópulus univérsus.'
  "15": 'Et ad fílios Israel loquéris: Homo, qui maledíxerit Deo suo, portábit peccátum suum:'
  "16": 'et qui blasphemáverit nomen Dómini, morte moriátur: lapídibus ópprimet eum omnis multitúdo, sive ille civis, sive peregrínus fúerit. Qui blasphemáverit nomen Dómini, morte moriátur.'
  "17": Qui percússerit, et occíderit hóminem, morte moriátur.
  "18": Qui percússerit ánimal, reddet vicárium, id est, ánimam pro ánima.
  "19": 'Qui irrogáverit máculam cuílibet cívium suórum: sicut fecit, sic fiet ei:'
  "20": 'fractúram pro fractúra, óculum pro óculo, dentem pro dente restítuet: qualem inflíxerit máculam, talem sustinére cogétur.'
  "21": Qui percússerit iuméntum, reddet áliud. Qui percússerit hóminem, puniétur.
  "22": 'Æquum iudícium sit inter vos, sive peregrínus, sive civis peccáverit: quia ego sum Dóminus Deus vester.'
  "23": 'Locutúsque est Móyses ad fílios Israel: et eduxérunt eum, qui blasphemáverat, extra castra, ac lapídibus oppressérunt. Fecerúntque fílii Israel sicut præcéperat Dóminus Móysi.'
