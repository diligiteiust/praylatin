bible: vulgate
lang: la
language: Latina
book: Iob
chapter: "23"
verses:
  "1": 'Respóndens autem Iob, ait:'
  "2": Nunc quoque in amaritúdine est sermo meus, et manus plagæ meæ aggraváta est super gémitum meum.
  "3": Quis mihi tríbuat ut cognóscam et invéniam illum, et véniam usque ad sólium eius?
  "4": Ponam coram eo iudícium, et os meum replébo increpatiónibus.
  "5": Ut sciam verba, quæ mihi respóndeat, et intélligam quid loquátur mihi.
  "6": Nolo multa fortitúdine conténdat mecum, nec magnitúdinis suæ mole me premat.
  "7": Propónat æquitátem contra me, et pervéniat ad victóriam iudícium meum.
  "8": 'Si ad oriéntem íero, non appáret: si ad occidéntem, non intélligam eum.'
  "9": 'Si ad sinístram, quid agam? non apprehéndam eum: si me vertam ad déxteram, non vidébo illum.'
  "10": Ipse vero scit viam meam, et probávit me quasi aurum, quod per ignem transit.
  "11": Vestígia eius secútus est pes meus, viam eius custodívi, et non declinávi ex ea.
  "12": A mandátis labiórum eius non recéssi, et in sinu meo abscóndi verba oris eius.
  "13": 'Ipse enim solus est, et nemo avértere potest cogitatiónem eius: et ánima eius quodcúmque vóluit, hoc fecit.'
  "14": Cum expléverit in me voluntátem suam, et ália multa simília præsto sunt ei.
  "15": Et idcírco a fácie eius turbátus sum, et consíderans eum, timóre sollícitor.
  "16": Deus mollívit cor meum, et Omnípotens conturbávit me.
  "17": Non enim périi propter imminéntes ténebras, nec fáciem meam opéruit calígo.
