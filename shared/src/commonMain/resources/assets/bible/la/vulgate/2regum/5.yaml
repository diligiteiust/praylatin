bible: vulgate
lang: la
language: Latina
book: II Regum
chapter: "5"
verses:
  "1": 'Náaman princeps milítiæ regis Sýriæ erat vir magnus apud dóminum suum, et honorátus: per illum enim dedit Dóminus salútem Sýriæ: erat autem vir fortis et dives, sed leprósus.'
  "2": Porro de Sýria egréssi fúerant latrúnculi, et captívam dúxerant de terra Israel puéllam párvulam, quæ erat in obséquio uxóris Náaman,
  "3": 'quæ ait ad dóminam suam: Utinam fuísset dóminus meus ad prophétam, qui est in Samaría: profécto curásset eum a lepra, quam habet.'
  "4": 'Ingréssus est ítaque Náaman ad dóminum suum, et nuntiávit ei, dicens: Sic et sic locúta est puélla de terra Israel.'
  "5": 'Dixítque ei rex Sýriæ: Vade, et mittam lítteras ad regem Israel. Qui cum proféctus esset, et tulísset secum decem talénta argénti, et sex míllia áureos, et decem mutatória vestimentórum,'
  "6": 'détulit lítteras ad regem Israel, in hæc verba: Cum accéperis epístolam hanc, scito quod míserim ad te Náaman servum meum, ut cures eum a lepra sua.'
  "7": 'Cumque legísset rex Israel lítteras, scidit vestiménta sua, et ait: Numquid Deus ego sum, ut occídere possim et vivificáre, quia iste misit ad me, ut curem hóminem a lepra sua? animadvértite, et vidéte quod occasiónes quærat advérsum me.'
  "8": 'Quod cum audísset Eliséus vir Dei, scidísse vidélicet regem Israel vestiménta sua, misit ad eum, dicens: Quare scidísti vestiménta tua? véniat ad me, et sciat esse prophétam in Israel.'
  "9": 'Venit ergo Náaman cum equis, et cúrribus, et stetit ad óstium domus Eliséi:'
  "10": 'misítque ad eum Eliséus núntium, dicens: Vade, et laváre sépties in Iordáne, et recípiet sanitátem caro tua, atque mundáberis.'
  "11": 'Irátus Náaman recedébat, dicens: Putábam quod egrederétur ad me, et stans invocáret nomen Dómini Dei sui, et tángeret manu sua locum lepræ, et curáret me.'
  "12": Numquid non melióres sunt Abana et Pharphar, flúvii Damásci, ómnibus aquis Israel, ut laver in eis, et munder? Cum ergo vertísset se, et abíret indígnans,
  "13": 'accessérunt ad eum servi sui, et locúti sunt ei: Pater, etsi rem grandem dixísset tibi prophéta, certe fácere debúeras: quanto magis quia nunc dixit tibi: Laváre, et mundáberis?'
  "14": 'Descéndit, et lavit in Iordáne sépties iuxta sermónem viri Dei: et restitúta est caro eius sicut caro púeri párvuli, et mundátus est.'
  "15": 'Reversúsque ad virum Dei cum univérso comitátu suo, venit, et stetit coram eo, et ait: Vere scio, quod non sit álius Deus in univérsa terra, nisi tantum in Israel. Obsecro ítaque ut accípias benedictiónem a servo tuo.'
  "16": 'At ille respóndit: Vivit Dóminus, ante quem sto, quia non accípiam. Cumque vim fáceret, pénitus non acquiévit.'
  "17": 'Dixítque Náaman: Ut vis: sed, óbsecro, concéde mihi servo tuo ut tollam onus duórum burdónum de terra: non enim fáciet ultra servus tuus holocáustum, aut víctimam diis aliénis, nisi Dómino.'
  "18": 'Hoc autem solum est, de quo deprecéris Dóminum pro servo tuo, quando ingrediétur dóminus meus templum Remmon ut adóret: et illo inniténte super manum meam, si adorávero in templo Remmon, adoránte eo in eódem loco, ut ignóscat mihi Dóminus servo tuo pro hac re.'
  "19": 'Qui dixit ei: Vade in pace. Abiit ergo ab eo elécto terræ témpore.'
  "20": 'Dixítque Giézi puer viri Dei: Pepércit dóminus meus Náaman Syro isti, ut non accíperet ab eo quæ áttulit: vivit Dóminus, quia curram post eum, et accípiam ab eo áliquid.'
  "21": 'Et secútus est Giézi post tergum Náaman: quem cum vidísset ille curréntem ad se, desíliit de curru in occúrsum eius, et ait: Recténe sunt ómnia?'
  "22": 'Et ille ait: Recte: dóminus meus misit me ad te, dicens: Modo venérunt ad me duo adolescéntes de monte Ephraim, ex fíliis prophetárum: da eis taléntum argénti, et vestes mutatórias dúplices.'
  "23": 'Dixítque Náaman: Mélius est ut accípias duo talénta. Et coégit eum, ligavítque duo talénta argénti in duóbus saccis, et duplícia vestiménta, et impósuit duóbus púeris suis, qui et portavérunt coram eo.'
  "24": Cumque venísset iam vésperi, tulit de manu eórum, et repósuit in domo, dimisítque viros, et abiérunt.
  "25": 'Ipse autem ingréssus, stetit coram dómino suo. Et dixit Eliséus: Unde venis Giézi? Qui respóndit: Non ivit servus tuus quoquam.'
  "26": 'At ille ait: Nonne cor meum in præsénti erat, quando revérsus est homo de curru suo in occúrsum tui? Nunc ígitur accepísti argéntum, et accepísti vestes ut emas olivéta, et víneas, et oves, et boves, et servos, et ancíllas.'
  "27": Sed et lepra Náaman adhærébit tibi, et sémini tuo usque in sempitérnum. Et egréssus est ab eo leprósus quasi nix.
