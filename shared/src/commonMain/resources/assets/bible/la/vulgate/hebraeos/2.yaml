bible: vulgate
lang: la
language: Latina
book: ad Hebraeos
chapter: "2"
verses:
  "1": Proptérea abundántius opórtet observáre nos ea, quæ audívimus, ne forte pereffluámus.
  "2": 'Si enim qui per ángelos dictus est sermo, factus est firmus, et omnis prævaricátio, et inobediéntia accépit iustam mercédis retributiónem:'
  "3": quómodo nos effugiémus si tantam neglexérimus salútem? quæ cum inítium accepísset enarrári per Dóminum ab eis, qui audiérunt, in nos confirmáta est,
  "4": contestánte Deo signis et porténtis, et váriis virtútibus, et Spíritus sancti distributiónibus secúndum suam voluntátem.
  "5": Non enim ángelis subiécit Deus orbem terræ futúrum, de quo lóquimur.
  "6": 'Testátus est autem in quodam loco quis, dicens: Quid est homo quod memor es eius, aut fílius hóminis quóniam vísitas eum?'
  "7": 'Minuísti eum paulo minus ab ángelis: glória et honóre coronásti eum: et constituísti eum super ópera mánuum tuárum.'
  "8": Omnia subiecísti sub pédibus eius. In eo enim quod ómnia ei subiécit, nihil dimísit non subiéctum ei. Nunc autem necdum vidémus ómnia subiécta ei.
  "9": 'Eum autem, qui módico quam ángeli minorátus est, vidémus Iesum propter passiónem mortis, glória et honóre coronátum: ut grátia Dei, pro ómnibus gustáret mortem.'
  "10": Decébat enim eum, propter quem ómnia, et per quem ómnia, qui multos fílios in glóriam addúxerat, auctórem salútis eórum per passiónem consummáre.
  "11": 'Qui enim sanctíficat, et qui sanctificántur, ex uno omnes. Propter quam causam non confúnditur fratres eos vocáre, dicens:'
  "12": 'Nuntiábo nomen tuum frátribus meis: in médio ecclésiæ laudábo te.'
  "13": 'Et íterum: Ego ero fidens in eum. Et íterum: Ecce ego, et púeri mei, quos dedit mihi Deus.'
  "14": 'Quia ergo púeri communicavérunt carni, et sánguini, et ipse simíliter participávit eísdem: ut per mortem destrúeret eum, qui habébat mortis impérium, id est, diábolum:'
  "15": et liberáret eos, qui timóre mortis per totam vitam obnóxii erant servitúti.
  "16": Nusquam enim ángelos apprehéndit, sed semen Abrahæ apprehéndit.
  "17": Unde débuit per ómnia frátribus similári, ut miséricors fíeret, et fidélis póntifex ad Deum, ut repropitiáret delícta pópuli.
  "18": In eo enim, in quo passus est ipse et tentátus, potens est et eis, qui tentántur, auxiliári.
