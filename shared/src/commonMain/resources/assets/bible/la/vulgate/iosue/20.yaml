bible: vulgate
lang: la
language: Latina
book: Iosue
chapter: "20"
verses:
  "1": 'Et locútus est Dóminus ad Iósue, dicens: Lóquere fíliis Israel, et dic eis:'
  "2": 'Separáte urbes fugitivórum, de quibus locútus sum ad vos per manum Móysi:'
  "3": 'ut confúgiat ad eas quicúmque ánimam percússerit néscius, et possit evádere iram próximi, qui ultor est sánguinis:'
  "4": 'cum ad unam harum confúgerit civitátum, stabit ante portam civitátis, et loquétur senióribus urbis illíus ea, quæ se cómprobent innocéntem: sicque suscípient eum, et dabunt ei locum ad habitándum.'
  "5": 'Cumque ultor sánguinis eum fúerit persecútus, non tradent in manus eius: quia ignórans percússit próximum eius, nec ante bíduum triduúmve eius probátur inimícus.'
  "6": 'Et habitábit in civitáte illa, donec stet ante iudícium, causam reddens facti sui, et moriátur sacérdos magnus, qui fúerit in illo témpore: tunc revertétur homicída, et ingrediétur civitátem et domum suam de qua fúgerat.'
  "7": Decreverúntque Cedes in Galilǽa montis Néphthali, et Sichem in monte Ephraim, et Cariathárbe, ipsa est Hebron in monte Iuda.
  "8": Et trans Iordánem contra orientálem plagam Iéricho, statuérunt Bosor, quæ sita est in campéstri solitúdine de tribu Ruben, et Ramoth in Gálaad de tribu Gad, et Gaulon in Basan de tribu Manásse.
  "9": Hæ civitátes constitútæ sunt cunctis fíliis Israel, et ádvenis, qui habitábant inter eos, ut fúgeret ad eas qui ánimam néscius percussísset, et non morerétur in manu próximi, effúsum sánguinem vindicáre cupiéntis, donec staret ante pópulum expositúrus causam suam.
