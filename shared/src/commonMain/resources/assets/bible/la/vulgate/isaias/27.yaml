bible: vulgate
lang: la
language: Latina
book: Isaias
chapter: "27"
verses:
  "1": In die illa visitábit Dóminus in gládio suo duro, et grandi, et forti, super Levíathan, serpéntem vectem, et super Levíathan, serpéntem tortuósum, et occídet cetum, qui in mari est.
  "2": In die illa vínea meri cantábit ei.
  "3": 'Ego Dóminus, qui servo eam, repénte propinábo ei: ne forte visitétur contra eam, nocte et die servo eam.'
  "4": 'Indignátio non est mihi: quis dabit me spinam et veprem in prœ́lio: grádiar super eam, succéndam eam páriter?'
  "5": An pótius tenébit fortitúdinem meam, fáciet pacem mihi, pacem fáciet mihi?
  "6": Qui ingrediúntur ímpetu ad Iacob, florébit et germinábit Israel, et implébunt fáciem orbis sémine.
  "7": Numquid iuxta plagam percutiéntis se percússit eum? aut sicut occídit interféctos eius, sic occísus est?
  "8": 'In mensúra contra mensúram, cum abiécta fúerit, iudicábis eam: meditátus est in spíritu suo duro per diem æstus.'
  "9": 'Idcírco super hoc dimittétur iníquitas dómui Iacob: et iste omnis fructus ut auferátur peccátum eius, cum posúerit omnes lápides altáris sicut lápides cíneris allísos, non stabunt luci et delúbra.'
  "10": 'Cívitas enim muníta desoláta erit: speciósa relinquétur, et dimittétur quasi desértum: ibi pascétur vítulus, et ibi accubábit, et consúmet summitátes eius.'
  "11": 'In siccitáte messes illíus conteréntur, mulíeres veniéntes, et docéntes eam: non est enim pópulus sápiens, proptérea non miserébitur eius, qui fecit eum: et qui formávit eum, non parcet ei.'
  "12": 'Et erit: in die illa percútiet Dóminus ab álveo flúminis usque ad torréntem Ægýpti, et vos congregabímini unus et unus fílii Israel.'
  "13": 'Et erit: in die illa clangétur in tuba magna, et vénient, qui pérditi fúerant de terra Assyriórum, et qui eiécti erant in terra Ægýpti, et adorábunt Dóminum in monte sancto in Ierúsalem.'
