bible: vulgate
lang: la
language: Latina
book: II Samuelis
chapter: "5"
verses:
  "1": 'Et venérunt univérsæ tribus Israel ad David in Hebron, dicéntes: Ecce nos, os tuum, et caro tua sumus.'
  "2": 'Sed et heri et nudiustértius cum esset Saul rex super nos, tu eras edúcens et redúcens Israel: dixit autem Dóminus ad te: Tu pasces pópulum meum Israel, et tu eris dux super Israel.'
  "3": 'Venérunt quoque et senióres Israel ad regem in Hebron, et percússit cum eis rex David fœdus in Hebron coram Dómino: unxerúntque David in regem super Israel.'
  "4": Fílius trigínta annórum erat David cum regnáre cœpísset, et quadragínta annis regnávit.
  "5": 'In Hebron regnávit super Iudam septem annis et sex ménsibus: in Ierúsalem autem regnávit trigínta tribus annis super omnem Israel et Iudam.'
  "6": 'Et ábiit rex, et omnes viri qui erant cum eo, in Ierúsalem, ad Iebusǽum habitatórem terræ: dictúmque est David ab eis: Non ingrediéris huc, nisi abstúleris cæcos et claudos dicéntes: Non ingrediétur David huc.'
  "7": 'Cepit autem David arcem Sion: hæc est cívitas David.'
  "8": 'Proposúerat enim David in die illa prǽmium, qui percussísset Iebusǽum, et tetigísset dómatum fístulas, et abstulísset cæcos et claudos odiéntes ánimam David. Idcírco dícitur in provérbio: Cæcus et claudus non intrábunt in templum.'
  "9": 'Habitávit autem David in arce, et vocávit eam, Civitátem David: et ædificávit per gyrum a Mello et intrínsecus.'
  "10": Et ingrediebátur profíciens atque succréscens, et Dóminus Deus exercítuum erat cum eo.
  "11": 'Misit quoque Hiram rex Tyri núntios ad David, et ligna cédrina, et artífices lignórum, artificésque lápidum ad paríetes: et ædificavérunt domum David.'
  "12": Et cognóvit David quóniam confirmásset eum Dóminus regem super Israel, et quóniam exaltásset regnum eius super pópulum suum Israel.
  "13": 'Accépit ergo David adhuc concubínas et uxóres de Ierúsalem, postquam vénerat de Hebron: natíque sunt David et álii fílii et fíliæ:'
  "14": 'et hæc nómina eórum, qui nati sunt ei in Ierúsalem: Sámua, et Sobab, et Nathan, et Sálomon,'
  "15": et Iébahar, et Elísua, et Nepheg,
  "16": et Iáphia, et Elísama, et Elíoda, et Elíphaleth.
  "17": 'Audiérunt ergo Philísthiim quod unxíssent David in regem super Israel, et ascendérunt univérsi ut quǽrerent David: quod cum audísset David, descéndit in præsídium.'
  "18": Philísthiim autem veniéntes diffúsi sunt in valle Ráphaim.
  "19": 'Et consúluit David Dóminum, dicens: Si ascéndam ad Philísthiim? et si dabis eos in manu mea? Et dixit Dóminus ad David: Ascénde, quia tradens dabo Philísthiim in manu tua.'
  "20": 'Venit ergo David in Baal Phárasim: et percússit eos ibi, et dixit: Divísit Dóminus inimícos meos coram me, sicut dividúntur aquæ. Proptérea vocátum est nomen loci illíus, Baal Phárasim.'
  "21": 'Et reliquérunt ibi sculptília sua: quæ tulit David et viri eius.'
  "22": Et addidérunt adhuc Philísthiim ut ascénderent, et diffúsi sunt in valle Ráphaim.
  "23": 'Consúluit autem David Dóminum: Si ascéndam contra Philisthǽos, et tradas eos in manus meas? Qui respóndit: Non ascéndas contra eos, sed gyra post tergum eórum, et vénies ad eos ex advérso pyrórum.'
  "24": 'Et cum audíeris sónitum gradiéntis in cacúmine pyrórum, tunc iníbis prœ́lium: quia tunc egrediétur Dóminus ante fáciem tuam, ut percútiat castra Philísthiim.'
  "25": Fecit ítaque David sicut præcéperat ei Dóminus, et percússit Philísthiim de Gábaa usque dum vénias Gezer.
