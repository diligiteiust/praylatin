bible: vulgate
lang: la
language: Latina
book: Apocalypsis
chapter: "8"
verses:
  "1": Et cum aperuísset sigíllum séptimum, factum est siléntium in cælo, quasi média hora.
  "2": 'Et vidi septem ángelos stantes in conspéctu Dei: et datæ sunt illis septem tubæ.'
  "3": 'Et álius ángelus venit, et stetit ante altáre habens thuríbulum áureum: et data sunt illi incénsa multa, ut daret de oratiónibus sanctórum ómnium super altáre áureum, quod est ante thronum Dei.'
  "4": Et ascéndit fumus incensórum de oratiónibus sanctórum de manu ángeli coram Deo.
  "5": 'Et accépit ángelus thuríbulum, et implévit illud de igne altáris, et misit in terram: et facta sunt tonítrua, et voces, et fúlgura, et terræmótus magnus.'
  "6": Et septem ángeli, qui habébant septem tubas, præparavérunt se ut tuba cánerent.
  "7": Et primus ángelus tuba cécinit, et facta est grando, et ignis, mista in sánguine, et missum est in terram, et tértia pars terræ combústa est, et tértia pars árborum concremáta est, et omne fœnum víride combústum est.
  "8": 'Et secúndus ángelus tuba cécinit: et tamquam mons magnus igne ardens missus est in mare, et facta est tértia pars maris sanguis,'
  "9": et mórtua est tértia pars creatúræ eórum, quæ habébant ánimas in mari, et tértia pars návium intériit.
  "10": 'Et tértius ángelus tuba cécinit: et cécidit de cælo stella magna, ardens tamquam fácula, et cécidit in tértiam partem flúminum, et in fontes aquárum:'
  "11": 'et nomen stellæ dícitur Absínthium: et facta est tértia pars aquárum in absínthium: et multi hóminum mórtui sunt de aquis, quia amáræ factæ sunt.'
  "12": 'Et quartus ángelus tuba cécinit: et percússa est tértia pars solis, et tértia pars lunæ, et tértia pars stellárum, ita ut obscurarétur tértia pars eórum, et diéi non lucéret pars tértia, et noctis simíliter.'
  "13": 'Et vidi, et audívi vocem uníus áquilæ volántis per médium cæli, dicéntis voce magna: Væ, væ, væ habitántibus in terra de céteris vócibus trium angelórum, qui erant tuba canitúri.'
