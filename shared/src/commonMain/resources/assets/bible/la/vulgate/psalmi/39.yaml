bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "39"
verses:
  "1": In finem, Psalmus ipsi David.
  "2": Exspéctans exspectávi Dóminum, et inténdit mihi.
  "3": 'Et exaudívit preces meas: et edúxit me de lacu misériæ et de luto fæcis. Et státuit super petram pedes meos: et diréxit gressus meos.'
  "4": 'Et immísit in os meum cánticum novum, carmen Deo nostro. Vidébunt multi, et timébunt: et sperábunt in Dómino.'
  "5": 'Beátus vir, cuius est nomen Dómini spes eius: et non respéxit in vanitátes et insánias falsas.'
  "6": 'Multa fecísti tu Dómine Deus meus mirabília tua: et cogitatiónibus tuis non est qui símilis sit tibi. Annuntiávi et locútus sum: multiplicáti sunt super númerum.'
  "7": 'Sacrifícium et oblatiónem noluísti: aures autem perfecísti mihi. Holocáustum et pro peccáto non postulásti:'
  "8": 'tunc dixi: Ecce vénio. In cápite libri scriptum est de me'
  "9": 'ut fácerem voluntátem tuam: Deus meus vólui, et legem tuam in médio cordis mei.'
  "10": 'Annuntiávi iustítiam tuam in ecclésia magna: ecce lábia mea non prohibébo: Dómine tu scisti.'
  "11": 'Iustítiam tuam non abscóndi in corde meo: veritátem tuam et salutáre tuum dixi: non abscóndi misericórdiam tuam et veritátem tuam a concílio multo.'
  "12": 'Tu autem Dómine ne longe fácias miseratiónes tuas a me: misericórdia tua et véritas tua semper suscepérunt me.'
  "13": 'Quóniam circumdedérunt me mala, quorum non est númerus: comprehendérunt me iniquitátes meæ, et non pótui ut vidérem. Multiplicátæ sunt super capíllos cápitis mei: et cor meum derelíquit me.'
  "14": 'Compláceat tibi Dómine ut éruas me: Dómine, ad adiuvándum me réspice.'
  "15": 'Confundántur et revereántur simul, qui quærunt ánimam meam, ut áuferant eam: convertántur retrórsum et revereántur, qui volunt mihi mala.'
  "16": 'Ferant conféstim confusiónem suam, qui dicunt mihi: Euge, euge.'
  "17": 'Exsúltent et læténtur super te omnes quæréntes te: et dicant semper: Magnificétur Dóminus: qui díligunt salutáre tuum.'
  "18": 'Ego autem mendícus sum, et pauper: Dóminus sollícitus est mei. Adiútor meus, et protéctor meus tu es: Deus meus ne tardáveris.'
