bible: vulgate
lang: la
language: Latina
book: Iob
chapter: "17"
verses:
  "1": Spíritus meus attenuábitur, dies mei breviabúntur, et solum mihi súperest sepúlcrum.
  "2": Non peccávi, et in amaritudínibus morátur óculus meus.
  "3": Líbera me Dómine, et pone me iuxta te, et cuiúsvis manus pugnet contra me.
  "4": Cor eórum longe fecísti a disciplína, proptérea non exaltabúntur.
  "5": Prædam pollicétur sóciis, et óculi filiórum eius defícient.
  "6": Pósuit me quasi in provérbium vulgi, et exémplum sum coram eis.
  "7": Caligávit ab indignatióne óculus meus, et membra mea quasi in níhilum redácta sunt.
  "8": Stupébunt iusti super hoc, et ínnocens contra hypócritam suscitábitur.
  "9": Et tenébit iustus viam suam, et mundis mánibus addet fortitúdinem.
  "10": Igitur omnes vos convertímini, et veníte, et non invéniam in vobis ullum sapiéntem.
  "11": Dies mei transiérunt, cogitatiónes meæ dissipátæ sunt, torquéntes cor meum.
  "12": Noctem vertérunt in diem, et rursum post ténebras spero lucem.
  "13": Si sustinúero, inférnus domus mea est, et in ténebris stravi léctulum meum.
  "14": 'Putrédini dixi: Pater meus es: mater mea, et soror mea, vérmibus.'
  "15": Ubi est ergo nunc præstolátio mea? et patiéntiam meam quis consíderat?
  "16": 'In profundíssimum inférnum descéndent ómnia mea: putásne saltem ibi erit réquies mihi?'
