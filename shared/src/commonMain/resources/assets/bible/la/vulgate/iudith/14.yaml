bible: vulgate
lang: la
language: Latina
book: Iudith
chapter: "14"
verses:
  "1": 'Dixit autem Iudith ad omnem pópulum: Audíte me fratres, suspéndite caput hoc super muros nostros:'
  "2": et erit, cum exíerit sol, accípiat unusquísque arma sua, et exíte cum ímpetu, non ut descendátis deórsum, sed quasi ímpetum faciéntes.
  "3": Tunc exploratóres necésse erit ut fúgiant ad príncipem suum excitándum ad pugnam.
  "4": Cumque duces eórum cucúrrerint ad tabernáculum Holoférnis, et invénerint eum truncum in suo sánguine volutátum, décidet super eos timor.
  "5": Cumque cognovéritis fúgere eos, ite post illos secúri, quóniam Dóminus cónteret eos sub pédibus vestris.
  "6": Tunc Achior, videns virtútem, quam fecit Deus Israel, relícto gentilitátis ritu, crédidit Deo, et circumcídit carnem præpútii sui, et appósitus est ad pópulum Israel, et omnis succéssio géneris eius usque in hodiérnum diem.
  "7": Mox autem ut ortus est dies, suspendérunt super muros caput Holoférnis, accepítque unusquísque vir arma sua, et egréssi sunt cum grandi strépitu et ululátu.
  "8": Quod vidéntes exploratóres, ad tabernáculum Holoférnis cucurrérunt.
  "9": Porro hi, qui in tabernáculo erant, veniéntes, et ante ingréssum cubículi perstrepéntes, excitándi grátia, inquietúdinem arte moliebántur, ut non ab excitántibus, sed a sonántibus Holoférnes evigiláret.
  "10": Nullus enim audébat cubículum virtútis Assyriórum pulsándo aut intrándo aperíre.
  "11": 'Sed cum veníssent eius duces ac tribúni, et univérsi maióres exércitus regis Assyriórum, dixérunt cubiculáriis:'
  "12": Intráte, et excitáte illum, quóniam egréssi mures de cavérnis suis, ausi sunt provocáre nos ad prœ́lium.
  "13": 'Tunc ingréssus Vágao cubículum eius, stetit ante cortínam, et plausum fecit mánibus suis: suspicabátur enim illum cum Iudith dormíre.'
  "14": Sed cum nullum motum iacéntis sensu áurium cáperet, accéssit próximans ad cortínam, et élevans eam, vidénsque cadáver absque cápite Holoférnis in suo sánguine tabefáctum iacére super terram, exclamávit voce magna cum fletu, et scidit vestiménta sua.
  "15": Et ingréssus tabernáculum Iudith, non invénit eam, et exsíliit foras ad pópulum,
  "16": 'et dixit: Una múlier Hebrǽa fecit confusiónem in domo regis Nabuchodónosor: ecce enim Holoférnes iacet in terra, et caput eius non est in illo.'
  "17": Quod cum audíssent príncipes virtútis Assyriórum, scidérunt omnes vestiménta sua, et intolerábilis timor et tremor cécidit super eos, et turbáti sunt ánimi eórum valde.
  "18": Et factus est clamor incomparábilis in médio castrórum eórum.
