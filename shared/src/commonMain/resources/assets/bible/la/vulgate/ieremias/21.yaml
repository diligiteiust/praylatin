bible: vulgate
lang: la
language: Latina
book: Ieremias
chapter: "21"
verses:
  "1": 'Verbum, quod factum est ad Ieremíam a Dómino, quando misit ad eum rex Sedecías Phassur fílium Melchíæ, et Sophoníam fílium Maasíæ sacerdótem, dicens:'
  "2": 'Intérroga pro nobis Dóminum, quia Nabuchodónosor, rex Babylónis, prœliátur advérsum nos: si forte fáciat Dóminus nobíscum secúndum ómnia mirabília sua, et recédat a nobis.'
  "3": 'Et dixit Ieremías ad eos: Sic dicétis Sedecíæ:'
  "4": 'Hæc dicit Dóminus Deus Israel: Ecce ego convértam vasa belli quæ in mánibus vestris sunt, et quibus vos pugnátis advérsum regem Babylónis, et Chaldǽos, qui óbsident vos in circúitu murórum: et congregábo ea in médio civitátis huius.'
  "5": Et debellábo ego vos in manu exténta, et in bráchio forti, et in furóre, et in indignatióne, et in ira grandi.
  "6": Et percútiam habitatóres civitátis huius, hómines et béstiæ pestiléntia magna moriéntur.
  "7": 'Et post hæc, ait Dóminus, dabo Sedecíam regem Iuda, et servos eius, et pópulum eius, et qui derelícti sunt in civitáte hac a peste, et gládio, et fame, in manu Nabuchodónosor regis Babylónis, et in manu inimicórum eórum, et in manu quæréntium ánimam eórum: et percútiet eos in ore gládii, et non flectétur, neque parcet, nec miserébitur.'
  "8": 'Et ad pópulum hunc dices: Hæc dicit Dóminus: Ecce ego do coram vobis viam vitæ, et viam mortis.'
  "9": 'Qui habitáverit in urbe hac moriétur gládio, et fame, et peste: qui autem egréssus fúerit, et transfúgerit ad Chaldǽos, qui óbsident vos, vivet, et erit ei ánima sua quasi spólium.'
  "10": 'Pósui enim fáciem meam super civitátem hanc in malum, et non in bonum, ait Dóminus: in manu regis Babylónis dábitur, et exúret eam igni.'
  "11": 'Et dómui regis Iuda: Audíte verbum Dómini,'
  "12": 'domus David, hæc dicit Dóminus: Iudicáte mane iudícium, et erúite vi oppréssum de manu calumniántis: ne forte egrediátur ut ignis indignátio mea, et succendátur, et non sit qui exstínguat, propter malítiam studiórum vestrórum.'
  "13": 'Ecce ego ad te, habitatrícem vallis sólidæ atque campéstris, ait Dóminus: qui dícitis: Quis percútiet nos? et quis ingrediétur domos nostras?'
  "14": 'Et visitábo super vos iuxta fructum studiórum vestrórum, dicit Dóminus: et succéndam ignem in saltu eius, et devorábit ómnia in circúitu eius.'
