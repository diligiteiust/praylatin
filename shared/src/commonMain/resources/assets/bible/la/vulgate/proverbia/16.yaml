bible: vulgate
lang: la
language: Latina
book: Proverbia
chapter: "16"
verses:
  "1": 'Hóminis est ánimam præparáre: et Dómini gubernáre linguam.'
  "2": 'Omnes viæ hóminis patent óculis eius: spirítuum ponderátor est Dóminus.'
  "3": Revéla Dómino ópera tua, et dirigéntur cogitatiónes tuæ.
  "4": 'Univérsa propter semetípsum operátus est Dóminus: ímpium quoque ad diem malum.'
  "5": 'Abominátio Dómini est omnis árrogans: etiámsi manus ad manum fúerit, non est ínnocens. Inítium viæ bonæ, fácere iustítiam: accépta est autem apud Deum magis, quam immoláre hóstias.'
  "6": 'Misericórdia et veritáte redímitur iníquitas: et in timóre Dómini declinátur a malo.'
  "7": Cum placúerint Dómino viæ hóminis, inimícos quoque eius convértet ad pacem.
  "8": Mélius est parum cum iustítia, quam multi fructus cum iniquitáte.
  "9": 'Cor hóminis dispónit viam suam: sed Dómini est dirígere gressus eius.'
  "10": 'Divinátio in lábiis regis: in iudício non errábit os eius.'
  "11": 'Pondus et statéra iudícia Dómini sunt: et ópera eius omnes lápides sácculi.'
  "12": 'Abominábiles regi qui agunt ímpie: quóniam iustítia firmátur sólium.'
  "13": 'Volúntas regum lábia iusta: qui recta lóquitur, diligétur.'
  "14": 'Indignátio regis, núntii mortis: et vir sápiens placábit eam.'
  "15": 'In hilaritáte vultus regis, vita: et cleméntia eius quasi imber serótinus.'
  "16": 'Pósside sapiéntiam, quia auro mélior est: et acquíre prudéntiam, quia pretiósior est argénto.'
  "17": 'Sémita iustórum declínat mala: custos ánimæ suæ servat viam suam.'
  "18": 'Contritiónem præcédit supérbia: et ante ruínam exaltátur spíritus.'
  "19": Mélius est humiliári cum mítibus, quam divídere spólia cum supérbis.
  "20": 'Erudítus in verbo repériet bona: et qui sperat in Dómino, beátus est.'
  "21": 'Qui sápiens est corde appellábitur prudens: et qui dulcis elóquio, maióra percípiet.'
  "22": 'Fons vitæ erudítio possidéntis: doctrína stultórum fatúitas.'
  "23": 'Cor sapiéntis erúdiet os eius: et lábiis eius addet grátiam.'
  "24": 'Favus mellis, compósita verba: dulcédo ánimæ, sánitas óssium.'
  "25": 'Est via, quæ vidétur hómini recta: et novíssima eius ducunt ad mortem.'
  "26": Anima laborántis labórat sibi, quia cómpulit eum os suum.
  "27": Vir ímpius fodit malum, et in lábiis eius ignis ardéscit.
  "28": 'Homo pervérsus súscitat lites: et verbósus séparat príncipes.'
  "29": 'Vir iníquus lactat amícum suum: et ducit eum per viam non bonam.'
  "30": Qui attónitis óculis cógitat prava, mordens lábia sua pérficit malum.
  "31": Coróna dignitátis senéctus, quæ in viis iustítiæ reperiétur.
  "32": 'Mélior est pátiens viro forti: et qui dominátur ánimo suo, expugnatóre úrbium.'
  "33": Sortes mittúntur in sinum, sed a Dómino temperántur.
