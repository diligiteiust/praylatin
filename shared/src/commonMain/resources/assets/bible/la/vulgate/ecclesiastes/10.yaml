bible: vulgate
lang: la
language: Latina
book: Ecclesiastes
chapter: "10"
verses:
  "1": Muscæ moriéntes perdunt suavitátem unguénti. Pretiósior est sapiéntia et glória, parva et ad tempus stultítia.
  "2": Cor sapiéntis in déxtera eius, et cor stulti in sinístra illíus.
  "3": Sed et in via stultus ámbulans, cum ipse insípiens sit, omnes stultos ǽstimat.
  "4": 'Si spíritus potestátem habéntis ascénderit super te, locum tuum ne dimíseris: quia curátio fáciet cessáre peccáta máxima.'
  "5": 'Est malum quod vidi sub sole, quasi per errórem egrédiens a fácie príncipis:'
  "6": pósitum stultum in dignitáte sublími, et dívites sedére deórsum.
  "7": 'Vidi servos in equis: et príncipes ambulántes super terram quasi servos.'
  "8": 'Qui fodit fóveam, íncidet in eam: et qui díssipat sepem, mordébit eum cóluber.'
  "9": 'Qui transfert lápides, affligétur in eis: et qui scindit ligna, vulnerábitur ab eis.'
  "10": Si retúsum fúerit ferrum, et hoc non ut prius, sed hebetátum fúerit, multo labóre exacuétur, et post indústriam sequétur sapiéntia.
  "11": Si mórdeat serpens in siléntio, nihil eo minus habet qui occúlte détrahit.
  "12": 'Verba oris sapiéntis grátia: et lábia insipiéntis præcipitábunt eum:'
  "13": inítium verbórum eius stultítia, et novíssimum oris illíus error péssimus.
  "14": 'Stultus verba multíplicat. Ignórat homo quid ante se fúerit: et quid post se futúrum sit, quis ei póterit indicáre?'
  "15": Labor stultórum afflíget eos, qui nésciunt in urbem pérgere.
  "16": Væ tibi terra, cuius rex puer est, et cuius príncipes mane cómedunt.
  "17": Beáta terra, cuius rex nóbilis est, et cuius príncipes vescúntur in témpore suo ad reficiéndum, et non ad luxúriam.
  "18": In pigrítiis humiliábitur contignátio, et in infirmitáte mánuum perstillábit domus.
  "19": 'In risum fáciunt panem, et vinum ut epuléntur vivéntes: et pecúniæ obédiunt ómnia.'
  "20": 'In cogitatióne tua regi ne détrahas, et in secréto cubículi tui ne maledíxeris díviti: quia et aves cæli portábunt vocem tuam, et qui habet pennas annuntiábit senténtiam.'
