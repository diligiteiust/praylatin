bible: vulgate
lang: la
language: Latina
book: Ioannes
chapter: "4"
verses:
  "1": Ut ergo cognóvit Iesus quia audiérunt Pharisǽi quod Iesus plures discípulos facit, et baptízat, quam Ioánnes
  "2": (quamquam Iesus non baptizáret, sed discípuli eius),
  "3": relíquit Iudǽam, et ábiit íterum in Galilǽam.
  "4": Oportébat autem eum transíre per Samaríam.
  "5": 'Venit ergo in civitátem Samaríæ, quæ dícitur Sichar: iuxta prǽdium, quod dedit Iacob Ioseph fílio suo.'
  "6": Erat autem ibi fons Iacob. Iesus ergo fatigátus ex itínere, sedébat sic supra fontem. Hora erat quasi sexta.
  "7": 'Venit múlier de Samaría hauríre aquam. Dicit ei Iesus: Da mihi bíbere.'
  "8": (Discípuli enim eius abíerant in civitátem ut cibos émerent.)
  "9": 'Dicit ergo ei múlier illa Samaritána: Quómodo tu, Iudǽus cum sis, bíbere a me poscis, quæ sum múlier Samaritána? non enim coutúntur Iudǽi Samaritánis.'
  "10": 'Respóndit Iesus, et dixit ei: Si scires donum Dei, et quis est, qui dicit tibi: Da mihi bíbere, tu fórsitan petísses ab eo, et dedísset tibi aquam vivam.'
  "11": 'Dicit ei múlier: Dómine, neque in quo háurias habes, et púteus altus est: unde ergo habes aquam vivam?'
  "12": Numquid tu maior es patre nostro Iacob, qui dedit nobis púteum, et ipse ex eo bibit, et fílii eius, et pécora eius?
  "13": 'Respóndit Iesus, et dixit ei: Omnis, qui bibit ex aqua hac, sítiet íterum: qui autem bíberit ex aqua, quam ego dabo ei, non sítiet in ætérnum:'
  "14": sed aqua, quam ego dabo ei, fiet in eo fons aquæ saliéntis in vitam ætérnam.
  "15": 'Dicit ad eum múlier: Dómine, da mihi hanc aquam, ut non sítiam, neque véniam huc hauríre.'
  "16": 'Dicit ei Iesus: Vade, voca virum tuum, et veni huc.'
  "17": 'Respóndit múlier, et dixit: Non hábeo virum. Dicit ei Iesus: Bene dixísti, quia non hábeo virum:'
  "18": 'quinque enim viros habuísti, et nunc, quem habes, non est tuus vir: hoc vere dixísti.'
  "19": 'Dicit ei múlier: Dómine, vídeo quia prophéta es tu.'
  "20": Patres nostri in monte hoc adoravérunt, et vos dícitis, quia Ierosólymis est locus, ubi adoráre opórtet.
  "21": 'Dicit ei Iesus: Múlier, crede mihi, quia venit hora, quando neque in monte hoc, neque in Ierosólymis adorábitis Patrem.'
  "22": 'Vos adorátis quod nescítis: nos adorámus quod scimus, quia salus ex Iudǽis est.'
  "23": Sed venit hora, et nunc est, quando veri adoratóres adorábunt Patrem in spíritu et veritáte. Nam et Pater tales quærit, qui adórent eum.
  "24": 'Spíritus est Deus: et eos, qui adórant eum, in spíritu et veritáte opórtet adoráre.'
  "25": 'Dicit ei múlier: Scio quia Messías venit (qui dícitur Christus): cum ergo vénerit ille, nobis annuntiábit ómnia.'
  "26": 'Dicit ei Iesus: Ego sum, qui loquor tecum.'
  "27": 'Et contínuo venérunt discípuli eius: et mirabántur quia cum mulíere loquebátur. Nemo tamen dixit: Quid quæris? aut quid lóqueris cum ea?'
  "28": 'Relíquit ergo hýdriam suam múlier, et ábiit in civitátem, et dicit illis homínibus:'
  "29": 'Veníte, et vidéte hóminem, qui dixit mihi ómnia quæcúmque feci: numquid ipse est Christus?'
  "30": Exiérunt ergo de civitáte, et veniébant ad eum.
  "31": 'Intérea rogábant eum discípuli, dicéntes: Rabbi, mandúca.'
  "32": 'Ille autem dicit eis: Ego cibum hábeo manducáre, quem vos nescítis.'
  "33": 'Dicébant ergo discípuli ad ínvicem: Numquid áliquis áttulit ei manducáre?'
  "34": 'Dicit eis Iesus: Meus cibus est ut fáciam voluntátem eius, qui misit me, ut perfíciam opus eius.'
  "35": 'Nonne vos dícitis, quod adhuc quátuor menses sunt, et messis venit? Ecce dico vobis: leváte óculos vestros, et vidéte regiónes, quia albæ sunt iam ad messem.'
  "36": 'Et qui metit, mercédem áccipit, et cóngregat fructum in vitam ætérnam: ut et qui séminat, simul gáudeat, et qui metit.'
  "37": 'In hoc enim est verbum verum: quia álius est qui séminat, et álius est qui metit.'
  "38": 'Ego misi vos métere quod vos non laborástis: álii laboravérunt, et vos in labóres eórum introístis.'
  "39": 'Ex civitáte autem illa multi credidérunt in eum Samaritanórum, propter verbum mulíeris testimónium perhibéntis: Quia dixit mihi ómnia quæcúmque feci.'
  "40": Cum veníssent ergo ad illum Samaritáni, rogavérunt eum ut ibi manéret. Et mansit ibi duos dies.
  "41": Et multo plures credidérunt in eum propter sermónem eius.
  "42": 'Et mulíeri dicébant: Quia iam non propter tuam loquélam crédimus: ipsi enim audívimus, et scimus quia hic est vere Salvátor mundi.'
  "43": Post duos autem dies éxiit inde, et ábiit in Galilǽam.
  "44": Ipse enim Iesus testimónium perhíbuit, quia prophéta in sua pátria honórem non habet.
  "45": 'Cum ergo venísset in Galilǽam, excepérunt eum Galilǽi, cum ómnia vidíssent quæ fécerat Ierosólymis in die festo: et ipsi enim vénerant ad diem festum.'
  "46": Venit ergo íterum in Cana Galilǽæ, ubi fecit aquam vinum. Et erat quidam régulus, cuius fílius infirmabátur Caphárnaum.
  "47": 'Hic cum audísset quia Iesus adveníret a Iudǽa in Galilǽam, ábiit ad eum, et rogábat eum ut descénderet, et sanáret fílium eius: incipiébat enim mori.'
  "48": 'Dixit ergo Iesus ad eum: Nisi signa, et prodígia vidéritis, non créditis.'
  "49": 'Dicit ad eum régulus: Dómine, descénde priúsquam moriátur fílius meus.'
  "50": 'Dicit ei Iesus: Vade, fílius tuus vivit. Crédidit homo sermóni, quem dixit ei Iesus, et ibat.'
  "51": Iam autem eo descendénte, servi occurrérunt ei, et nuntiavérunt dicéntes, quia fílius eius víveret.
  "52": 'Interrogábat ergo horam ab eis, in qua mélius habúerit. Et dixérunt ei: Quia heri hora séptima relíquit eum febris.'
  "53": 'Cognóvit ergo pater, quia illa hora erat, in qua dixit ei Iesus: Fílius tuus vivit: et crédidit ipse, et domus eius tota.'
  "54": Hoc íterum secúndum signum fecit Iesus, cum venísset a Iudǽa in Galilǽam.
