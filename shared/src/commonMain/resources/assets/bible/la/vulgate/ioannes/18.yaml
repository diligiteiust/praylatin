bible: vulgate
lang: la
language: Latina
book: Ioannes
chapter: "18"
verses:
  "1": Hæc cum dixísset Iesus, egréssus est cum discípulis suis trans torréntem Cedron, ubi erat hortus, in quem introívit ipse, et discípuli eius.
  "2": 'Sciébat autem et Iudas, qui tradébat eum, locum: quia frequénter Iesus convénerat illuc cum discípulis suis.'
  "3": Iudas ergo cum accepísset cohórtem, et a pontifícibus, et Pharisǽis minístros, venit illuc cum latérnis, et fácibus, et armis.
  "4": 'Iesus ítaque sciens ómnia, quæ ventúra erant super eum, procéssit, et dixit eis: Quem quǽritis?'
  "5": 'Respondérunt ei: Iesum Nazarénum. Dicit eis Iesus: Ego sum. Stabat autem et Iudas, qui tradébat eum, cum ipsis.'
  "6": 'Ut ergo dixit eis: Ego sum: abiérunt retrórsum, et cecidérunt in terram.'
  "7": 'Iterum ergo interrogávit eos: Quem quǽritis? Illi autem dixérunt: Iesum Nazarénum.'
  "8": 'Respóndit Iesus: Dixi vobis, quia ego sum: si ergo me quǽritis, sínite hos abíre.'
  "9": 'Ut implerétur sermo, quem dixit: Quia quos dedísti mihi, non pérdidi ex eis quemquam.'
  "10": 'Simon ergo Petrus habens gládium edúxit eum: et percússit pontíficis servum, et abscídit aurículam eius déxteram. Erat autem nomen servo Malchus.'
  "11": 'Dixit ergo Iesus Petro: Mitte gládium tuum in vagínam. Cálicem, quem dedit mihi Pater, non bibam illum?'
  "12": Cohors ergo, et tribúnus, et minístri Iudæórum comprehendérunt Iesum, et ligavérunt eum.
  "13": 'Et adduxérunt eum ad Annam primum: erat enim socer Caíphæ, qui erat póntifex anni illíus.'
  "14": 'Erat autem Caíphas, qui consílium déderat Iudǽis: Quia éxpedit unum hóminem mori pro pópulo.'
  "15": Sequebátur autem Iesum Simon Petrus, et álius discípulus. Discípulus autem ille erat notus pontífici, et introívit cum Iesu in átrium pontíficis.
  "16": 'Petrus autem stabat ad óstium foris. Exívit ergo discípulus álius, qui erat notus pontífici, et dixit ostiáriæ: et introdúxit Petrum.'
  "17": 'Dicit ergo Petro ancílla ostiária: Numquid et tu ex discípulis es hóminis istíus? Dicit ille: Non sum.'
  "18": 'Stabant autem servi, et minístri ad prunas, quia frigus erat, et calefaciébant se: erat autem cum eis et Petrus stans, et calefáciens se.'
  "19": Póntifex ergo interrogávit Iesum de discípulis suis, et de doctrína eius.
  "20": 'Respóndit ei Iesus: Ego palam locútus sum mundo: ego semper dócui in synagóga, et in templo, quo omnes Iudǽi convéniunt: et in occúlto locútus sum nihil.'
  "21": 'Quid me intérrogas? intérroga eos, qui audiérunt quid locútus sim ipsis: ecce hi sciunt quæ díxerim ego.'
  "22": 'Hæc autem cum dixísset, unus assístens ministrórum dedit álapam Iesu, dicens: Sic respóndes pontífici?'
  "23": 'Respóndit ei Iesus: Si male locútus sum, testimónium pérhibe de malo: si autem bene, quid me cædis?'
  "24": Et misit eum Annas ligátum ad Caípham pontíficem.
  "25": 'Erat autem Simon Petrus stans, et calefáciens se. Dixérunt ergo ei: Numquid et tu ex discípulis eius es? Negávit ille, et dixit: Non sum.'
  "26": 'Dicit ei unus ex servis pontíficis, cognátus eius, cuius abscídit Petrus aurículam: Nonne ego te vidi in horto cum illo?'
  "27": 'Iterum ergo negávit Petrus: et statim gallus cantávit.'
  "28": 'Addúcunt ergo Iesum a Caípha in prætórium. Erat autem mane: et ipsi non introiérunt in prætórium, ut non contaminaréntur, sed ut manducárent Pascha.'
  "29": 'Exívit ergo Pilátus ad eos foras, et dixit: Quam accusatiónem affértis advérsus hóminem hunc?'
  "30": 'Respondérunt, et dixérunt ei: Si non esset hic malefáctor, non tibi tradidissémus eum.'
  "31": 'Dixit ergo eis Pilátus: Accípite eum vos, et secúndum legem vestram iudicáte eum. Dixérunt ergo ei Iudǽi: Nobis non licet interfícere quemquam.'
  "32": Ut sermo Iesu implerétur, quem dixit, signíficans qua morte esset moritúrus.
  "33": 'Introívit ergo íterum in prætórium Pilátus: et vocávit Iesum, et dixit ei: Tu es rex Iudæórum?'
  "34": 'Respóndit Iesus: A temetípso hoc dicis, an álii dixérunt tibi de me?'
  "35": 'Respóndit Pilátus: Numquid ego Iudǽus sum? gens tua, et pontífices tradidérunt te mihi: quid fecísti?'
  "36": 'Respóndit Iesus: Regnum meum non est de hoc mundo. Si ex hoc mundo esset regnum meum, minístri mei útique decertárent ut non tráderer Iudǽis: nunc autem regnum meum non est hinc.'
  "37": 'Dixit ítaque ei Pilátus: Ergo rex es tu? Respóndit Iesus: Tu dicis quia rex sum ego. Ego in hoc natus sum, et ad hoc veni in mundum, ut testimónium perhíbeam veritáti: omnis, qui est ex veritáte, audit vocem meam.'
  "38": 'Dicit ei Pilátus: Quid est véritas? Et cum hoc dixísset, íterum exívit ad Iudǽos, et dicit eis: Ego nullam invénio in eo causam.'
  "39": 'Est autem consuetúdo vobis ut unum dimíttam vobis in Pascha: vultis ergo dimíttam vobis regem Iudæórum?'
  "40": 'Clamavérunt ergo rursum omnes, dicéntes: Non hunc, sed Barábbam. Erat autem Barábbas latro.'
