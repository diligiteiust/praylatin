bible: vulgate
lang: la
language: Latina
book: Ezechiel
chapter: "38"
verses:
  "1": 'Et factus est sermo Dómini ad me, dicens:'
  "2": 'Fili hóminis pone fáciem tuam contra Gog, terram Magog, príncipem cápitis Mosoch et Thubal: et vaticináre de eo,'
  "3": 'et dices ad eum: Hæc dicit Dóminus Deus: Ecce ego ad te Gog príncipem cápitis Mosoch et Thubal.'
  "4": 'Et circúmagam te, et ponam frenum in maxíllis tuis: et edúcam te, et omnem exércitum tuum, equos et équites vestítos lorícis univérsos, multitúdinem magnam, hastam et clýpeum arripiéntium et gládium.'
  "5": Persæ, Æthíopes, et Líbyes cum eis, omnes scutáti et galeáti.
  "6": Gomer et univérsa ágmina eius, domus Thogórma, látera aquilónis, et totum robur eius, populíque multi tecum.
  "7": 'Prǽpara, et ínstrue te, et omnem multitúdinem tuam, quæ coacerváta est ad te: et esto eis in præcéptum.'
  "8": 'Post dies multos visitáberis: in novíssimo annórum vénies ad terram, quæ revérsa est a gládio, et congregáta est de pópulis multis ad montes Israel, qui fuérunt desérti iúgiter: hæc de pópulis edúcta est, et habitábunt in ea confidénter univérsi.'
  "9": Ascéndens autem quasi tempéstas vénies, et quasi nubes, ut opérias terram tu, et ómnia ágmina tua, et pópuli multi tecum.
  "10": 'Hæc dicit Dóminus Deus: In die illa, ascéndent sermónes super cor tuum, et cogitábis cogitatiónem péssimam:'
  "11": 'et dices: Ascéndam ad terram absque muro: véniam ad quiescéntes, habitantésque secúre: hi omnes hábitant sine muro, vectes, et portæ non sunt eis:'
  "12": 'ut dirípias spólia, et invádas prædam: ut ínferas manum tuam super eos, qui desérti fúerant, et póstea restitúti, et super pópulum, qui est congregátus ex géntibus, qui possidére cœpit, et esse habitátor umbilíci terræ.'
  "13": 'Saba, et Dedan, et negotiatóres Tharsis, et omnes leónes eius dicent tibi: Numquid ad suménda spólia tu venis? ecce ad diripiéndam prædam congregásti multitúdinem tuam, ut tollas argéntum, et aurum, et áuferas supelléctilem, atque substántiam, et dirípias manúbias infinítas.'
  "14": 'Proptérea vaticináre fili hóminis, et dices ad Gog: Hæc dicit Dóminus Deus: Numquid non in die illo, cum habitáverit pópulus meus Israel confidénter, scies?'
  "15": Et vénies de loco tuo a latéribus aquilónis, tu et pópuli multi tecum, ascensóres equórum univérsi, cœtus magnus, et exércitus véhemens.
  "16": 'Et ascéndes super pópulum meum Israel quasi nubes, ut opérias terram. In novíssimis diébus eris, et addúcam te super terram meam: ut sciant gentes me, cum sanctificátus fúero in te in óculis eórum, o Gog.'
  "17": 'Hæc dicit Dóminus Deus: Tu ergo ille es, de quo locútus sum in diébus antíquis in manu servórum meórum prophetárum Israel, qui prophetavérunt in diébus illórum témporum, ut addúcerem te super eos.'
  "18": Et erit in die illa, in die advéntus Gog super terram Israel, ait Dóminus Deus, ascéndet indignátio mea in furóre meo.
  "19": 'Et in zelo meo, in igne iræ meæ locútus sum. Quia in die illa erit commótio magna super terram Israel:'
  "20": 'et commovebúntur a fácie mea pisces maris, et vólucres cæli, et béstiæ agri, et omne réptile, quod movétur super humum, cunctíque hómines, qui sunt super fáciem terræ: et subverténtur montes, et cadent sepes, et omnis murus córruet in terram.'
  "21": 'Et convocábo advérsus eum in cunctis móntibus meis gládium, ait Dóminus Deus: gládius uniuscuiúsque in fratrem suum dirigétur.'
  "22": 'Et iudicábo eum peste, et sánguine, et imbre veheménti, et lapídibus imménsis: ignem, et sulphur pluam super eum, et super exércitum eius, et super pópulos multos, qui sunt cum eo.'
  "23": 'Et magnificábor, et sanctificábor, et notus ero in óculis multárum géntium: et scient quia ego Dóminus.'
