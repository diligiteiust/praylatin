bible: vulgate
lang: la
language: Latina
book: Isaias
chapter: "28"
verses:
  "1": Væ corónæ supérbiæ, ébriis Ephraim, et flori decidénti, glóriæ exsultatiónis eius, qui erant in vértice vallis pinguíssimæ, errántes a vino.
  "2": 'Ecce válidus et fortis Dóminus sicut ímpetus grándinis: turbo confríngens, sicut ímpetus aquárum multárum inundántium et emissárum super terram spatiósam.'
  "3": Pédibus conculcábitur coróna supérbiæ ebriórum Ephraim.
  "4": 'Et erit flos décidens glóriæ exsultatiónis eius, qui est super vérticem vallis pínguium, quasi temporáneum ante maturitátem autúmni: quod cum aspéxerit videns, statim ut manu tenúerit, devorábit illud.'
  "5": 'In die illa erit Dóminus exercítuum coróna glóriæ, et sertum exsultatiónis resíduo pópuli sui:'
  "6": et spíritus iudícii sedénti super iudícium, et fortitúdo reverténtibus de bello ad portam.
  "7": 'Verum hi quoque præ vino nesciérunt, et præ ebrietáte erravérunt: sacérdos et prophéta nesciérunt præ ebrietáte, absórpti sunt a vino, erravérunt in ebrietáte, nesciérunt vidéntem, ignoravérunt iudícium.'
  "8": Omnes enim mensæ replétæ sunt vómitu sordiúmque, ita ut non esset ultra locus.
  "9": Quem docébit sciéntiam? et quem intellígere fáciet audítum? ablactátos a lacte, avúlsos ab ubéribus.
  "10": Quia manda remánda, manda remánda, exspécta reexspécta, exspécta reexspécta, módicum ibi, módicum ibi.
  "11": In loquéla enim lábii, et lingua áltera loquétur ad pópulum istum.
  "12": 'Cui dixit: Hæc est réquies mea, refícite lassum, et hoc est meum refrigérium: et noluérunt audíre.'
  "13": 'Et erit eis verbum Dómini: Manda remánda, manda remánda, exspécta reexspécta, exspécta reexspécta, módicum ibi, módicum ibi: ut vadant, et cadant retrórsum, et conterántur, et illaqueéntur, et capiántur.'
  "14": Propter hoc audíte verbum Dómini viri illusóres, qui dominámini super pópulum meum, qui est in Ierúsalem.
  "15": 'Dixístis enim: Percússimus fœdus cum morte, et cum inférno fécimus pactum: flagéllum inúndans cum transíerit, non véniet super nos: quia posúimus mendácium spem nostram, et mendácio protécti sumus.'
  "16": 'Idcírco hæc dicit Dóminus Deus: Ecce ego mittam in fundaméntis Sion lápidem, lápidem probátum, angulárem, pretiósum, in fundaménto fundátum: qui credíderit, non festínet.'
  "17": 'Et ponam in póndere iudícium, et iustítiam in mensúra: et subvértet grando spem mendácii: et protectiónem aquæ inundábunt.'
  "18": 'Et delébitur fœdus vestrum cum morte, et pactum vestrum cum inférno non stabit: flagéllum inúndans cum transíerit, éritis ei in conculcatiónem.'
  "19": 'Quandocúmque pertransíerit, tollet vos: quóniam in mane dilúculo pertransíbit in die et in nocte, et tantúmmodo sola vexátio intelléctum dabit audítui.'
  "20": 'Coangustátum est enim stratum, ita ut alter décidat: et pállium breve utrúmque operíre non potest.'
  "21": 'Sicut enim in monte divisiónum stabit Dóminus: sicut in valle, quæ est in Gábaon, irascétur: ut fáciat opus suum, aliénum opus eius: ut operétur opus suum, peregrínum est opus eius ab eo.'
  "22": 'Et nunc nolíte illúdere, ne forte constringántur víncula vestra: consummatiónem enim et abbreviatiónem audívi a Dómino Deo exercítuum super univérsam terram.'
  "23": 'Auribus percípite, et audíte vocem meam: atténdite, et audíte elóquium meum.'
  "24": Numquid tota die arábit arans ut serat, proscíndet et sárriet humum suam?
  "25": Nonne cum adæquáverit fáciem eius, seret gith, et cymínum sparget, et ponet tríticum per órdinem, et hórdeum, et mílium, et víciam in fínibus suis?
  "26": 'Et erúdiet illum in iudício: Deus suus docébit illum.'
  "27": 'Non enim in serris triturábitur gith, nec rota plaustri super cymínum circuíbit: sed in virga excutiétur gith, et cymínum in báculo.'
  "28": 'Panis autem comminuétur: verum non in perpétuum tritúrans triturábit illum, neque vexábit eum rota plaustri, neque úngulis suis commínuet eum.'
  "29": Et hoc a Dómino Deo exercítuum exívit, ut mirábile fáceret consílium, et magnificáret iustítiam.
