bible: vulgate
lang: la
language: Latina
book: Ezechiel
chapter: "34"
verses:
  "1": 'Et factum est verbum Dómini ad me, dicens:'
  "2": 'Fili hóminis prophéta de pastóribus Israel: prophéta, et dices pastóribus: Hæc dicit Dóminus Deus: Væ pastóribus Israel, qui pascébant semetípsos: nonne greges a pastóribus pascúntur?'
  "3": 'Lac comedebátis, et lanis operiebámini, et quod crassum erat occidebátis: gregem autem meum non pascebátis.'
  "4": 'Quod infírmum fuit non consolidástis, et quod ægrótum non sanástis, quod confráctum est non alligástis, et quod abiéctum est non reduxístis, et quod períerat non quæsístis: sed cum austeritáte imperabátis eis, et cum poténtia.'
  "5": 'Et dispérsæ sunt oves meæ, eo quod non esset pastor: et factæ sunt in devoratiónem ómnium bestiárum agri, et dispérsæ sunt.'
  "6": 'Erravérunt greges mei in cunctis móntibus, et in univérso colle excélso: et super omnem fáciem terræ dispérsi sunt greges mei, et non erat qui requíreret: non erat, inquam, qui requíreret.'
  "7": Proptérea pastóres audíte verbum Dómini.
  "8": 'Vivo ego, dicit Dóminus Deus, quia pro eo quod facti sunt greges mei in rapínam, et oves meæ in devoratiónem ómnium bestiárum agri, eo quod non esset pastor: neque enim quæsiérunt pastóres mei gregem meum, sed pascébant pastóres semetípsos, et greges meos non pascébant:'
  "9": 'proptérea pastóres audíte verbum Dómini:'
  "10": 'Hæc dicit Dóminus Deus: Ecce ego ipse super pastóres: requíram gregem meum de manu eórum, et cessáre fáciam eos, ut ultra non pascant gregem, nec pascant ámplius pastóres semetípsos: et liberábo gregem meum de ore eórum, et non erit ultra eis in escam.'
  "11": 'Quia hæc dicit Dóminus Deus: Ecce ego ipse requíram oves meas, et visitábo eas.'
  "12": Sicut vísitat pastor gregem suum, in die quando fúerit in médio óvium suárum dissipatárum, sic visitábo oves meas, et liberábo eas de ómnibus locis, in quibus dispérsæ fúerant in die nubis et calíginis.
  "13": 'Et edúcam eas de pópulis, et congregábo eas de terris, et indúcam eas in terram suam: et pascam eas in móntibus Israel, in rivis, et in cunctis sédibus terræ.'
  "14": 'In páscuis ubérrimis pascam eas, et in móntibus excélsis Israel erunt páscua eárum: ibi requiéscent in herbis viréntibus, et in páscuis pínguibus pascéntur super montes Israel.'
  "15": Ego pascam oves meas, et ego eas accubáre fáciam, dicit Dóminus Deus.
  "16": 'Quod períerat requíram, et quod abiéctum erat redúcam, et quod confráctum fúerat alligábo, et quod infírmum fúerat consolidábo, et quod pingue et forte custódiam: et pascam illas in iudício.'
  "17": 'Vos autem greges mei, hæc dicit Dóminus Deus: Ecce ego iúdico inter pecus et pecus, aríetum et hircórum.'
  "18": 'Nonne satis vobis erat páscua bona depásci? ínsuper et relíquias pascuárum vestrárum conculcástis pédibus vestris: et cum puríssimam aquam biberétis, réliquam pédibus vestris turbabátis.'
  "19": 'Et oves meæ his, quæ conculcáta pédibus vestris fúerant, pascebántur: et quæ pedes vestri turbáverant, hæc bibébant.'
  "20": 'Proptérea hæc dicit Dóminus Deus ad vos: Ecce ego ipse iúdico inter pecus pingue, et maciléntum:'
  "21": 'pro eo quod latéribus et húmeris impingebátis, et córnibus vestris ventilabátis ómnia infírma pécora, donec dispergeréntur foras:'
  "22": salvábo gregem meum, et non erit ultra in rapínam, et iudicábo inter pecus et pecus.
  "23": 'Et suscitábo super eas pastórem unum, qui pascat eas, servum meum David: ipse pascet eas, et ipse erit eis in pastórem.'
  "24": 'Ego autem Dóminus ero eis in Deum, et servus meus David princeps in médio eórum: ego Dóminus locútus sum.'
  "25": 'Et fáciam cum eis pactum pacis, et cessáre fáciam béstias péssimas de terra: et qui hábitant in desérto, secúri dórmient in sáltibus.'
  "26": 'Et ponam eos in circúitu collis mei benedictiónem: et dedúcam imbrem in témpore suo: plúviæ benedictiónis erunt.'
  "27": 'Et dabit lignum agri fructum suum, et terra dabit germen suum, et erunt in terra sua absque timóre: et scient quia ego Dóminus, cum contrívero caténas iugi eórum, et erúero eos de manu imperántium sibi.'
  "28": 'Et non erunt ultra in rapínam in géntibus, neque béstiæ terræ devorábunt eos: sed habitábunt confidénter absque ullo terróre.'
  "29": 'Et suscitábo eis germen nominátum: et non erunt ultra imminúti fame in terra, neque portábunt ultra oppróbrium géntium.'
  "30": Et scient quia ego Dóminus Deus eórum cum eis, et ipsi pópulus meus domus Israel, ait Dóminus Deus.
  "31": 'Vos autem greges mei, greges páscuæ meæ hómines estis: et ego Dóminus Deus vester, dicit Dóminus Deus.'
