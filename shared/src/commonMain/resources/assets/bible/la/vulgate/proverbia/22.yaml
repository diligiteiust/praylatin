bible: vulgate
lang: la
language: Latina
book: Proverbia
chapter: "22"
verses:
  "1": 'Mélius est nomen bonum, quam divítiæ multæ: super argéntum et aurum, grátia bona.'
  "2": 'Dives et pauper obviavérunt sibi: utriúsque operátor est Dóminus.'
  "3": 'Cállidus vidit malum, et abscóndit se: ínnocens pertránsiit, et afflíctus est damno.'
  "4": Finis modéstiæ timor Dómini, divítiæ, et glória, et vita.
  "5": 'Arma et gládii in via pervérsi: custos autem ánimæ suæ longe recédit ab eis.'
  "6": 'Provérbium est: adoléscens iuxta viam suam, étiam cum senúerit, non recédet ab ea.'
  "7": 'Dives paupéribus ímperat: et qui áccipit mútuum, servus est fœnerántis.'
  "8": Qui séminat iniquitátem, metet mala, et virga iræ suæ consummábitur.
  "9": 'Qui pronus est ad misericórdiam, benedicétur: de pánibus enim suis dedit páuperi. Victóriam et honórem acquíret qui dat múnera: ánimam autem aufert accipiéntium.'
  "10": Eice derisórem, et exíbit cum eo iúrgium, cessabúntque causæ et contuméliæ.
  "11": Qui díligit cordis mundítiam, propter grátiam labiórum suórum habébit amícum regem.
  "12": 'Oculi Dómini custódiunt sciéntiam: et supplantántur verba iníqui.'
  "13": 'Dicit piger: Leo est foris, in médio plateárum occidéndus sum.'
  "14": 'Fóvea profúnda os aliénæ: cui irátus est Dóminus, íncidet in eam.'
  "15": Stultítia colligáta est in corde púeri, et virga disciplínæ fugábit eam.
  "16": Qui calumniátur páuperem, ut áugeat divítias suas, dabit ipse ditióri, et egébit.
  "17": 'Inclína aurem tuam, et audi verba sapiéntium: appóne autem cor ad doctrínam meam:'
  "18": 'quæ pulchra erit tibi, cum serváveris eam in ventre tuo, et redundábit in lábiis tuis:'
  "19": ut sit in Dómino fidúcia tua, unde et osténdi eam tibi hódie.
  "20": 'Ecce descrípsi eam tibi triplíciter, in cogitatiónibus et sciéntia:'
  "21": ut osténderem tibi firmitátem, et elóquia veritátis, respondére ex his illis qui misérunt te.
  "22": 'Non fácias violéntiam páuperi, quia pauper est: neque cónteras egénum in porta:'
  "23": quia iudicábit Dóminus causam eius, et confíget eos, qui confixérunt ánimam eius.
  "24": 'Noli esse amícus hómini iracúndo, neque ámbules cum viro furióso:'
  "25": ne forte discas sémitas eius, et sumas scándalum ánimæ tuæ.
  "26": 'Noli esse cum his, qui defígunt manus suas, et qui vades se ófferunt pro débitis:'
  "27": si enim non habes unde restítuas, quid causæ est ut tollat operiméntum de cubíli tuo?
  "28": Ne transgrediáris términos antíquos, quos posuérunt patres tui.
  "29": Vidísti virum velócem in ópere suo? coram régibus stabit, nec erit ante ignóbiles.
