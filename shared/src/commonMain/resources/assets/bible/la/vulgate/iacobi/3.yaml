bible: vulgate
lang: la
language: Latina
book: Iacobi
chapter: "3"
verses:
  "1": Nolíte plures magístri fíeri fratres mei, sciéntes quóniam maius iudícium súmitis.
  "2": 'In multis enim offéndimus omnes. Si quis in verbo non offéndit, hic perféctus est vir: potest étiam freno circumdúcere totum corpus.'
  "3": Si autem equis frena in ora míttimus ad consentiéndum nobis, et omne corpus illórum circumférimus.
  "4": Ecce et naves, cum magnæ sint, et a ventis válidis minéntur, circumferúntur a módico gubernáculo ubi ímpetus dirigéntis volúerit.
  "5": Ita et lingua módicum quidem membrum est, et magna exáltat. Ecce quantus ignis quam magnam silvam incéndit!
  "6": Et lingua ignis est, univérsitas iniquitátis. Lingua constitúitur in membris nostris, quæ máculat totum corpus, et inflámmat rotam nativitátis nostræ inflammáta a gehénna.
  "7": 'Omnis enim natúra bestiárum, et vólucrum, et serpéntium, et ceterórum domántur, et dómita sunt a natúra humána:'
  "8": 'linguam autem nullus hóminum domáre potest: inquiétum malum, plena venéno mortífero.'
  "9": 'In ipsa benedícimus Deum et Patrem: et in ipsa maledícimus hómines, qui ad similitúdinem Dei facti sunt.'
  "10": Ex ipso ore procédit benedíctio, et maledíctio. Non opórtet, fratres mei, hæc ita fíeri.
  "11": Numquid fons de eódem forámine emánat dulcem, et amáram aquam?
  "12": Numquid potest, fratres mei, ficus uvas fácere, aut vitis ficus? Sic neque salsa dulcem potest fácere aquam.
  "13": Quis sápiens, et disciplinátus inter vos? Osténdat ex bona conversatióne operatiónem suam in mansuetúdine sapiéntiæ.
  "14": 'Quod si zelum amárum habétis, et contentiónes sint in córdibus vestris: nolíte gloriári, et mendáces esse advérsus veritátem.'
  "15": 'Non est enim ista sapiéntia desúrsum descéndens: sed terréna, animális, diabólica.'
  "16": 'Ubi enim zelus et conténtio: ibi inconstántia, et omne opus pravum.'
  "17": Quæ autem desúrsum est sapiéntia, primum quidem pudíca est, deínde pacífica, modésta, suadíbilis, bonis conséntiens, plena misericórdia, et frúctibus bonis, non iúdicans, sine simulatióne.
  "18": Fructus autem iustítiæ, in pace seminátur, faciéntibus pacem.
