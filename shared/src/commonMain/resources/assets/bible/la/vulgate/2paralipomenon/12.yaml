bible: vulgate
lang: la
language: Latina
book: II Paralipomenon
chapter: "12"
verses:
  "1": Cumque roborátum fuísset regnum Róboam et confortátum, derelíquit legem Dómini, et omnis Israel cum eo.
  "2": Anno autem quinto regni Róboam, ascéndit Sesac rex Ægýpti in Ierúsalem (quia peccáverant Dómino)
  "3": 'cum mille ducéntis cúrribus, et sexagínta míllibus équitum: nec erat númerus vulgi quod vénerat cum eo ex Ægýpto, Líbyes scílicet, et Troglódytæ, et Æthíopes.'
  "4": Cepítque civitátes munitíssimas in Iuda, et venit usque in Ierúsalem.
  "5": 'Semeías autem prophéta ingréssus est ad Róboam, et príncipes Iuda, qui congregáti fúerant in Ierúsalem, fugiéntes Sesac: dixítque ad eos: Hæc dicit Dóminus: Vos reliquístis me, et ego relíqui vos in manu Sesac.'
  "6": 'Consternatíque príncipes Israel et rex, dixérunt: Iustus est Dóminus.'
  "7": 'Cumque vidísset Dóminus, quod humiliáti essent, factus est sermo Dómini ad Semeíam, dicens: Quia humiliáti sunt, non dispérdam eos, dabóque eis pauxíllum auxílii, et non stillábit furor meus super Ierúsalem per manum Sesac.'
  "8": Verúmtamen sérvient ei, ut sciant distántiam servitútis meæ, et servitútis regni terrárum.
  "9": 'Recéssit ítaque Sesac rex Ægýpti ab Ierúsalem, sublátis thesáuris domus Dómini, et domus regis: omniáque secum tulit, et clýpeos áureos, quos fécerat Sálomon,'
  "10": pro quibus fecit rex ǽneos, et trádidit illos princípibus scutariórum, qui custodiébant vestíbulum palátii.
  "11": Cumque introíret rex domum Dómini, veniébant scutárii et tollébant eos, iterúmque referébant eos ad armamentárium suum.
  "12": 'Verúmtamen quia humiliáti sunt, avérsa est ab eis ira Dómini, nec deléti sunt pénitus: síquidem et in Iuda invénta sunt ópera bona.'
  "13": 'Confortátus est ergo rex Róboam in Ierúsalem, atque regnávit: quadragínta autem et uníus anni erat cum regnáre cœpísset, et decem et septem annis regnávit in Ierúsalem, urbe, quam elégit Dóminus, ut confirmáret nomen suum ibi, de cunctis tríbubus Israel: nomen autem matris eius Náama Ammanítis.'
  "14": Fecit autem malum, et non præparávit cor suum ut quǽreret Dóminum.
  "15": 'Opera vero Róboam prima et novíssima scripta sunt in libris Semeíæ prophétæ, et Addo vidéntis, et diligénter expósita: pugnaverúntque advérsum se Róboam, et Ieróboam cunctis diébus.'
  "16": 'Et dormívit Róboam cum pátribus suis, sepultúsque est in civitáte David: et regnávit Abía fílius eius pro eo.'
