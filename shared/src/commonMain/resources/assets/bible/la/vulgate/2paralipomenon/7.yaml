bible: vulgate
lang: la
language: Latina
book: II Paralipomenon
chapter: "7"
verses:
  "1": 'Cumque complésset Sálomon fundens preces, ignis descéndit de cælo, et devorávit holocáusta et víctimas: et maiéstas Dómini implévit domum.'
  "2": Nec póterant sacerdótes íngredi templum Dómini, eo quod implésset maiéstas Dómini templum Dómini.
  "3": 'Sed et omnes fílii Israel vidébant descendéntem ignem, et glóriam Dómini super domum: et corruéntes proni in terram super paviméntum stratum lápide, adoravérunt, et laudavérunt Dóminum: Quóniam bonus, quóniam in sǽculum misericórdia eius.'
  "4": Rex autem, et omnis pópulus immolábant víctimas coram Dómino.
  "5": 'Mactávit ígitur rex Sálomon hóstias, boum vigínti duo míllia, aríetum centum vigínti míllia: et dedicávit domum Dei rex, et univérsus pópulus.'
  "6": 'Sacerdótes autem stabant in offíciis suis, et Levítæ in órganis cárminum Dómini, quæ fecit David rex ad laudándum Dóminum: Quóniam in ætérnum misericórdia eius, hymnos David canéntes per manus suas: porro sacerdótes canébant tubis ante eos, cunctúsque Israel stabat.'
  "7": 'Sanctificávit quoque Sálomon médium átrii ante templum Dómini: obtúlerat enim ibi holocáusta et ádipes pacificórum: quia altáre ǽneum, quod fécerat, non póterat sustinére holocáusta et sacrifícia et ádipes.'
  "8": Fecit ergo Sálomon solemnitátem in témpore illo septem diébus, et omnis Israel cum eo, ecclésia magna valde, ab intróitu Emath usque ad torréntem Ægýpti.
  "9": Fecítque die octávo colléctam, eo quod dedicásset altáre septem diébus, et solemnitátem celebrásset diébus septem.
  "10": Igitur in die vigésimo tértio mensis séptimi, dimísit pópulos ad tabernácula sua, lætántes atque gaudéntes super bono, quod fécerat Dóminus Davídi, et Salomóni, et Israéli pópulo suo.
  "11": Complevítque Sálomon domum Dómini, et domum regis, et ómnia quæ disposúerat in corde suo, ut fáceret in domo Dómini, et in domo sua, et prosperátus est.
  "12": 'Appáruit autem ei Dóminus nocte, et ait: Audívi oratiónem tuam, et elégi locum istum mihi in domum sacrifícii.'
  "13": 'Si cláusero cælum, et plúvia non flúxerit, et mandávero et præcépero locústæ ut dévoret terram, et mísero pestiléntiam in pópulum meum:'
  "14": 'convérsus autem pópulus meus, super quos invocátum est nomen meum, deprecátus me fúerit, et exquisíerit fáciem meam, et égerit pœniténtiam a viis suis péssimis: et ego exáudiam de cælo, et propítius ero peccátis eórum, et sanábo terram eórum.'
  "15": Oculi quoque mei erunt apérti, et aures meæ eréctæ ad oratiónem eius, qui in loco isto oráverit.
  "16": Elégi enim, et sanctificávi locum istum, ut sit nomen meum ibi in sempitérnum, et permáneant óculi mei, et cor meum ibi cunctis diébus.
  "17": 'Tu quoque si ambuláveris coram me, sicut ambulávit David pater tuus, et féceris iuxta ómnia, quæ præcépi tibi, et iustítias meas iudiciáque serváveris:'
  "18": 'suscitábo thronum regni tui, sicut pollícitus sum David patri tuo, dicens: Non auferétur de stirpe tua vir, qui sit princeps in Israel.'
  "19": 'Si autem avérsi fuéritis, et dereliquéritis iustítias meas, et præcépta mea, quæ propósui vobis, et abeúntes serviéritis diis aliénis, et adoravéritis eos:'
  "20": 'evéllam vos de terra mea, quam dedi vobis: et domum hanc, quam sanctificávi nómini meo, proíciam a fácie mea, et tradam eam in parábolam, et in exémplum cunctis pópulis.'
  "21": 'Et domus ista erit in provérbium univérsis transeúntibus, et dicent stupéntes: Quare fecit Dóminus sic terræ huic, et dómui huic?'
  "22": 'Respondebúntque: Quia dereliquérunt Dóminum Deum patrum suórum, qui edúxit eos de terra Ægýpti, et apprehendérunt deos aliénos, et adoravérunt eos, et coluérunt: idcírco venérunt super eos univérsa hæc mala.'
