bible: vulgate
lang: la
language: Latina
book: II Machabaeorum
chapter: "5"
verses:
  "1": Eódem témpore, Antíochus secúndam profectiónem parávit in Ægýptum.
  "2": Cóntigit autem per univérsam Ierosolymórum civitátem vidéri diébus quadragínta per áera équites discurréntes, aurátas stolas habéntes, et hastis, quasi cohórtes, armátos,
  "3": et cursus equórum per órdines digéstos, et congressiónes fíeri cóminus, et scutórum motus, et galeatórum multitúdinem gládiis distríctis, et telórum iactus, et aureórum armórum splendórem, omnísque géneris loricárum.
  "4": Quaprópter omnes rogábant in bonum monstra convérti.
  "5": 'Sed cum falsus rumor exísset, tamquam vita excessísset Antíochus, assúmptis Iason non minus mille viris, repénte aggréssus est civitátem: et cívibus ad murum convolántibus ad últimum apprehénsa civitáte, Meneláus fugit in arcem:'
  "6": Iason vero non parcébat in cæde cívibus suis, nec cogitábat prosperitátem advérsum cognátos malum esse máximum, árbitrans hóstium et non cívium se trophǽa captúrum.
  "7": Et principátum quidem non obtínuit, finem vero insidiárum suárum confusiónem accépit, et prófugus íterum ábiit in Ammanítem.
  "8": 'Ad últimum, in exítium sui conclúsus ab Aréta Arabum tyránno fúgiens de civitáte in civitátem, ómnibus odiósus, ut réfuga legum et exsecrábilis, ut pátriæ et cívium hostis, in Ægýptum extrúsus est:'
  "9": 'et qui multos de pátria sua expúlerat, péregre périit, Lacedæmónas proféctus, quasi pro cognatióne ibi refúgium habitúrus:'
  "10": et qui insepúltos multos abiécerat, ipse et illamentátus, et insepúltus abícitur, sepultúra neque peregrína usus, neque pátrio sepúlcro partícipans.
  "11": 'His ítaque gestis, suspicátus est rex societátem desertúros Iudǽos: et ob hoc proféctus ex Ægýpto efferátis ánimis, civitátem quidem armis cepit.'
  "12": Iussit autem milítibus interfícere, nec párcere occursántibus, et per domos ascendéntes trucidáre.
  "13": Fiébant ergo cædes iúvenum, ac seniórum, et mulíerum, et natórum extermínia, virginúmque, et parvulórum neces.
  "14": Erant autem toto tríduo octogínta míllia interfécti, quadragínta míllia vincti, non minus autem venúmdati.
  "15": 'Sed nec ista suffíciunt: ausus est étiam intráre templum univérsa terra sánctius, Meneláo ductóre, qui legum et pátriæ fuit próditor:'
  "16": et sceléstis mánibus sumens sancta vasa, quæ ab áliis régibus, et civitátibus erant pósita ad ornátum loci, et glóriam, contrectábat indígne, et contaminábat.
  "17": 'Ita alienátus mente Antíochus, non considerábat quod propter peccáta habitántium civitátem, módicum Deus fúerat irátus: propter quod et áccidit circa locum despéctio:'
  "18": alióquin nisi contigísset eos multis peccátis esse involútos, sicut Heliodórus, qui missus est a Seléuco rege ad exspoliándum ærárium, étiam hic statim advéniens flagellátus, et repúlsus útique fuísset ab audácia.
  "19": 'Verum non propter locum, gentem: sed propter gentem, locum Deus elégit.'
  "20": 'Ideóque et ipse locus párticeps factus est pópuli malórum: póstea autem fiet sócius bonórum, et qui derelíctus in ira Dei omnipoténtis est, íterum in magni Dómini reconciliatióne cum summa glória exaltábitur.'
  "21": Igitur Antíochus mille et octingéntis ablátis de templo taléntis, velóciter Antiochíam regréssus est, exístimans se præ supérbia terram ad navigándum, pélagus vero ad iter agéndum deductúrum propter mentis elatiónem.
  "22": 'Relíquit autem et præpósitos ad affligéndam gentem: Ierosólymis quidem Philíppum génere Phrygem, móribus crudeliórem eo ipso a quo constitútus est:'
  "23": in Garízim autem Andrónicum, et Meneláum, qui grávius quam céteri imminébant cívibus.
  "24": Cumque appósitus esset contra Iudǽos, misit odiósum príncipem Apollónium cum exércitu vigínti et duóbus míllibus, præcípiens ei omnes perféctæ ætátis interfícere, mulíeres, ac iúvenes véndere.
  "25": 'Qui cum venísset Ierosólymam, pacem símulans, quiévit usque ad diem sanctum sábbati: et tunc feriátis Iudǽis arma cápere suis præcépit.'
  "26": 'Omnésque qui ad spectáculum procésserant, trucidávit: et civitátem cum armátis discúrrens, ingéntem multitúdinem perémit.'
  "27": 'Iudas autem Machabǽus, qui décimus fúerat, secésserat in desértum locum, ibíque inter feras vitam in móntibus cum suis agébat: et fœni cibo vescéntes, demorabántur, ne partícipes essent coinquinatiónis.'
