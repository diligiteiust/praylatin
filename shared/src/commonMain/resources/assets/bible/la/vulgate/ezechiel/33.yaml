bible: vulgate
lang: la
language: Latina
book: Ezechiel
chapter: "33"
verses:
  "1": 'Et factum est verbum Dómini ad me, dicens:'
  "2": 'Fili hóminis lóquere ad fílios pópuli tui, et dices ad eos: Terra, cum indúxero super eam gládium, et túlerit pópulus terræ virum unum de novíssimis suis, et constitúerit eum super se speculatórem:'
  "3": 'et ille víderit gládium veniéntem super terram, et cecínerit búccina, et annuntiáverit pópulo:'
  "4": 'áudiens autem, quisquis ille est, sónitum búccinæ, et non se observáverit, venerítque gládius, et túlerit eum: sanguis ipsíus super caput eius erit.'
  "5": 'Sonum búccinæ audívit, et non se observávit: sanguis eius in ipso erit: si autem se custodíerit, ánimam suam salvábit.'
  "6": 'Quod si speculátor víderit gládium veniéntem, et non insonúerit búccina, et pópulus se non custodíerit, venerítque gládius, et túlerit de eis ánimam: ille quidem in iniquitáte sua captus est, sánguinem autem eius de manu speculatóris requíram.'
  "7": 'Et tu fili hóminis, speculatórem dedi te dómui Israel: áudiens ergo ex ore meo sermónem, annuntiábis eis ex me.'
  "8": 'Si me dicénte ad ímpium: Impie, morte moriéris: non fúeris locútus ut se custódiat ímpius a via sua: ipse ímpius in iniquitáte sua moriétur, sánguinem autem eius de manu tua requíram.'
  "9": 'Si autem annuntiánte te ad ímpium ut a viis suis convertátur, non fúerit convérsus a via sua: ipse in iniquitáte sua moriétur: porro tu ánimam tuam liberásti.'
  "10": 'Tu ergo fili hóminis dic ad domum Israel: Sic locúti estis, dicéntes: Iniquitátes nostræ, et peccáta nostra super nos sunt, et in ipsis nos tabéscimus: quómodo ergo vívere potérimus?'
  "11": 'Dic ad eos: Vivo ego, dicit Dóminus Deus: nolo mortem ímpii, sed ut convertátur ímpius a via sua, et vivat. Convertímini, convertímini a viis vestris péssimis: et quare moriémini domus Israel?'
  "12": 'Tu ítaque fili hóminis dic ad fílios pópuli tui: Iustítia iusti non liberábit eum in quacúmque die peccáverit: et impíetas ímpii non nocébit ei, in quacúmque die convérsus fúerit ab impietáte sua: et iustus non póterit vívere in iustítia sua, in quacúmque die peccáverit.'
  "13": 'Etiámsi díxero iusto quod vita vivat, et confísus in iustítia sua fécerit iniquitátem: omnes iustítiæ eius oblivióni tradéntur, et in iniquitáte sua, quam operátus est, in ipsa moriétur.'
  "14": 'Si autem díxero ímpio: Morte moriéris: et égerit pœniténtiam a peccáto suo, fecerítque iudícium et iustítiam,'
  "15": 'et pignus restitúerit ille ímpius, rapinámque reddíderit, in mandátis vitæ ambuláverit, nec fécerit quidquam iniústum: vita vivet, et non moriétur.'
  "16": 'Omnia peccáta eius, quæ peccávit, non imputabúntur ei: iudícium, et iustítiam fecit, vita vivet.'
  "17": 'Et dixérunt fílii pópuli tui: Non est æqui pónderis via Dómini, et ipsórum via iniústa est.'
  "18": Cum enim recésserit iustus a iustítia sua, fecerítque iniquitátes, moriétur in eis.
  "19": Et cum recésserit ímpius ab impietáte sua, fecerítque iudícium, et iustítiam, vivet in eis.
  "20": 'Et dícitis: Non est recta via Dómini. Unumquémque iuxta vias suas iudicábo de vobis, domus Israel.'
  "21": 'Et factum est in duodécimo anno, in décimo mense, in quinta mensis transmigratiónis nostræ, venit ad me qui fúgerat de Ierúsalem, dicens: Vastáta est cívitas.'
  "22": 'Manus autem Dómini facta fúerat ad me véspere, ántequam veníret qui fúgerat: aperuítque os meum donec veníret ad me mane, et apérto ore meo non sílui ámplius.'
  "23": 'Et factum est verbum Dómini ad me, dicens:'
  "24": 'Fili hóminis, qui hábitant in ruinósis his super humum Israel, loquéntes aiunt: Unus erat Abraham, et hereditáte possédit terram: nos autem multi sumus, nobis data est terra in possessiónem.'
  "25": 'Idcírco dices ad eos: Hæc dicit Dóminus Deus: Qui in sánguine coméditis, et óculos vestros levátis ad immundítias vestras, et sánguinem fúnditis: numquid terram hereditáte possidébitis?'
  "26": 'Stetístis in gládiis vestris, fecístis abominatiónes, et unusquísque uxórem próximi sui pólluit: et terram hereditáte possidébitis?'
  "27": 'Hæc dices ad eos: Sic dicit Dóminus Deus: Vivo ego, quia qui in ruinósis hábitant, gládio cadent: et qui in agro est, béstiis tradétur ad devorándum: qui autem in præsídiis, et spelúncis sunt, peste moriéntur.'
  "28": 'Et dabo terram in solitúdinem, et in desértum, et defíciet supérba fortitúdo eius: et desolabúntur montes Israel, eo quod nullus sit qui per eos tránseat.'
  "29": Et scient quia ego Dóminus, cum dédero terram eórum desolátam et desértam, propter univérsas abominatiónes suas, quas operáti sunt.
  "30": 'Et tu fili hóminis: fílii pópuli tui, qui loquúntur de te iuxta muros et in óstiis domórum, et dicunt unus ad álterum, vir ad próximum suum, loquéntes: Veníte, et audiámus quis sit sermo egrédiens a Dómino.'
  "31": 'Et véniunt ad te, quasi si ingrediátur pópulus, et sedent coram te pópulus meus: et áudiunt sermónes tuos, et non fáciunt eos: quia in cánticum oris sui vertunt illos, et avarítiam suam séquitur cor eórum.'
  "32": 'Et es eis quasi carmen músicum, quod suávi dulcíque sono cánitur: et áudiunt verba tua, et non fáciunt ea.'
  "33": Et cum vénerit quod prædíctum est (ecce enim venit) tunc scient quod prophétes fúerit inter eos.
