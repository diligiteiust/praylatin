bible: vulgate
lang: la
language: Latina
book: Ioel
chapter: "1"
verses:
  "1": Verbum Dómini, quod factum est ad Ioel fílium Phátuel.
  "2": 'Audíte hoc senes, et áuribus percípite omnes habitatóres terræ: si factum est istud in diébus vestris, aut in diébus patrum vestrórum?'
  "3": Super hoc fíliis vestris narráte, et fílii vestri fíliis suis, et fílii eórum generatióni álteræ.
  "4": Resíduum erúcæ comédit locústa, et resíduum locústæ comédit bruchus, et resíduum bruchi comédit rubígo.
  "5": 'Expergiscímini ébrii, et flete, et ululáte omnes, qui bíbitis vinum in dulcédine: quóniam périit ab ore vestro.'
  "6": 'Gens enim ascéndit super terram meam, fortis et innumerábilis: dentes eius ut dentes leónis, et moláres eius ut cátuli leónis.'
  "7": 'Pósuit víneam meam in desértum, et ficum meam decorticávit: nudans spoliávit eam, et proiécit: albi facti sunt rami eius.'
  "8": Plange quasi virgo accíncta sacco super virum pubertátis suæ.
  "9": 'Périit sacrifícium, et libátio de domo Dómini: luxérunt sacerdótes minístri Dómini.'
  "10": 'Depopuláta est régio, luxit humus: quóniam devastátum est tríticum, confúsum est vinum, elánguit óleum.'
  "11": Confúsi sunt agrícolæ, ululavérunt vinitóres super fruménto, et hórdeo, quia périit messis agri.
  "12": 'Vínea confúsa est, et ficus elánguit: malogranátum, et palma, et malum, et ómnia ligna agri aruérunt: quia confúsum est gáudium a fíliis hóminum.'
  "13": 'Accíngite vos, et plángite sacerdótes: ululáte minístri altáris: ingredímini, cubáte in sacco minístri Dei mei: quóniam intériit de domo Dei vestri sacrifícium, et libátio.'
  "14": 'Sanctificáte ieiúnium, vocáte cœtum, congregáte senes omnes habitatóres terræ in domum Dei vestri: et clamáte ad Dóminum:'
  "15": 'A a a, diéi: quia prope est dies Dómini, et quasi vástitas a poténte véniet.'
  "16": Numquid non coram óculis vestris aliménta periérunt de domo Dei nostri, lætítia et exsultátio?
  "17": 'Computruérunt iuménta in stércore suo, demolíta sunt hórrea, dissipátæ sunt apothécæ: quóniam confúsum est tríticum.'
  "18": 'Quid ingémuit ánimal, mugiérunt greges arménti? Quia non est páscua eis: sed et greges pécorum disperiérunt.'
  "19": 'Ad te Dómine clamábo: quia ignis comédit speciósa desérti, et flamma succéndit ómnia ligna regiónis.'
  "20": 'Sed et béstiæ agri, quasi área sítiens imbrem, suspexérunt ad te: quóniam exsiccáti sunt fontes aquárum, et ignis devorávit speciósa desérti.'
