bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "62"
verses:
  "1": Psalmus David, Cum esset in desérto Idumǽæ.
  "2": Deus Deus meus ad te de luce vígilo. Sitívit in te ánima mea, quam multiplíciter tibi caro mea.
  "3": 'In terra desérta, et ínvia, et inaquósa: sic in sancto appárui tibi, ut vidérem virtútem tuam et glóriam tuam.'
  "4": 'Quóniam mélior est misericórdia tua super vitas: lábia mea laudábunt te.'
  "5": 'Sic benedícam te in vita mea: et in nómine tuo levábo manus meas.'
  "6": 'Sicut ádipe et pinguédine repleátur ánima mea: et lábiis exsultatiónis laudábit os meum.'
  "7": 'Si memor fui tui super stratum meum, in matutínis meditábor in te:'
  "8": 'quia fuísti adiútor meus. Et in velaménto alárum tuárum exsultábo:'
  "9": 'adhǽsit ánima mea post te: me suscépit déxtera tua.'
  "10": 'Ipsi vero in vanum quæsiérunt ánimam meam, introíbunt in inferióra terræ:'
  "11": tradéntur in manus gládii, partes vúlpium erunt.
  "12": 'Rex vero lætábitur in Deo, laudabúntur omnes qui iurant in eo: quia obstrúctum est os loquéntium iníqua.'
