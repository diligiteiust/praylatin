bible: vulgate
lang: la
language: Latina
book: Ieremias
chapter: "34"
verses:
  "1": 'Verbum, quod factum est ad Ieremíam a Dómino, quando Nabuchodónosor rex Babylónis, et omnis exércitus eius, universáque regna terræ, quæ erant sub potestáte manus eius, et omnes pópuli, bellábant contra Ierúsalem, et contra omnes urbes eius, dicens:'
  "2": 'Hæc dicit Dóminus Deus Israel: Vade, et lóquere ad Sedecíam regem Iuda, et dices ad eum: Hæc dicit Dóminus: Ecce ego tradam civitátem hanc in manus regis Babylónis, et succéndet eam igni.'
  "3": 'Et tu non effúgies de manu eius, sed comprehensióne capiéris, et in manu eius tradéris: et óculi tui óculos regis Babylónis vidébunt, et os eius cum ore tuo loquétur, et Babylónem introíbis.'
  "4": 'Attamen audi verbum Dómini Sedecía rex Iuda: Hæc dicit Dóminus ad te: Non moriéris in gládio,'
  "5": 'sed in pace moriéris: et secúndum combustiónes patrum tuórum, regum priórum qui fuérunt ante te, sic combúrent te: et væ dómine, plangent te: quia verbum ego locútus sum, dicit Dóminus.'
  "6": Et locútus est Ieremías prophéta ad Sedecíam regem Iuda univérsa verba hæc in Ierúsalem.
  "7": 'Et exércitus regis Babylónis pugnábat contra Ierúsalem, et contra omnes civitátes Iuda, quæ réliquæ erant, contra Lachis et contra Azécha: hæ enim supérerant de civitátibus Iuda, urbes munítæ.'
  "8": 'Verbum, quod factum est ad Ieremíam a Dómino, postquam percússit rex Sedecías fœdus cum omni pópulo in Ierúsalem, prǽdicans:'
  "9": 'ut dimítteret unusquísque servum suum, et unusquísque ancíllam suam, Hebrǽum et Hebrǽam líberos: et nequáquam dominaréntur eis, id est in Iudǽo et fratre suo.'
  "10": 'Audiérunt ergo omnes príncipes et univérsus pópulus, qui iníerant pactum ut dimítteret unusquísque servum suum, et unusquísque ancíllam suam líberos, et ultra non dominaréntur eis: audiérunt ígitur, et dimisérunt.'
  "11": 'Et convérsi sunt deínceps: et retraxérunt servos et ancíllas suas, quos dimíserant líberos, et subiugavérunt in fámulos et fámulas.'
  "12": 'Et factum est verbum Dómini ad Ieremíam a Dómino, dicens:'
  "13": 'Hæc dicit Dóminus Deus Israel: Ego percússi fœdus cum pátribus vestris in die, qua edúxi eos de terra Ægýpti, de domo servitútis, dicens:'
  "14": 'Cum compléti fúerint septem anni, dimíttat unusquísque fratrem suum Hebrǽum, qui vénditus est ei: et sérviet tibi sex annis, et dimíttes eum a te líberum: et non audiérunt patres vestri me, nec inclinavérunt aurem suam.'
  "15": 'Et convérsi estis vos hódie, et fecístis quod rectum est in óculis meis, ut prædicarétis libertátem unusquísque ad amícum suum: et inístis pactum in conspéctu meo, in domo, in qua invocátum est nomen meum super eam.'
  "16": 'Et revérsi estis, et commaculástis nomen meum, et reduxístis unusquísque servum suum et unusquísque ancíllam suam, quos dimiserátis ut essent líberi et suæ potestátis: et subiugástis eos ut sint vobis servi et ancíllæ.'
  "17": 'Proptérea hæc dicit Dóminus: Vos non audístis me, ut prædicarétis libertátem unusquísque fratri suo, et unusquísque amíco suo: ecce ego prædíco vobis libertátem, ait Dóminus, ad gládium, ad pestem, et ad famem: et dabo vos in commotiónem cunctis regnis terræ.'
  "18": 'Et dabo viros, qui prævaricántur fœdus meum, et non observavérunt verba fœ́deris, quibus assénsi sunt in conspéctu meo, vítulum quem concidérunt in duas partes, et transiérunt inter divisiónes eius:'
  "19": 'príncipes Iuda et príncipes Ierúsalem, eunúchi et sacerdótes, et omnis pópulus terræ, qui transiérunt inter divisiónes vítuli:'
  "20": et dabo eos in manus inimicórum suórum, et in manus quæréntium ánimam eórum, et erit morticínum eórum in escam volatílibus cæli, et béstiis terræ.
  "21": Et Sedecíam regem Iuda, et príncipes eius, dabo in manus inimicórum suórum, et in manus quæréntium ánimas eórum, et in manus exercítuum regis Babylónis, qui recessérunt a vobis.
  "22": 'Ecce ego præcípio, dicit Dóminus, et redúcam eos in civitátem hanc, et prœliabúntur advérsus eam, et cápient eam, et incéndent igni: et civitátes Iuda dabo in solitúdinem, eo quod non sit habitátor.'
