bible: vulgate
lang: la
language: Latina
book: Apocalypsis
chapter: "18"
verses:
  "1": 'Et post hæc vidi álium ángelum descendéntem de cælo, habéntem potestátem magnam: et terra illumináta est a glória eius.'
  "2": 'Et exclamávit in fortitúdine, dicens: Cécidit, cécidit Bábylon magna: et facta est habitátio dæmoniórum, et custódia omnis spíritus immúndi, et custódia omnis vólucris immúndæ, et odíbilis:'
  "3": 'quia de vino iræ fornicatiónis eius bibérunt omnes gentes: et reges terræ cum illa fornicáti sunt: et mercatóres terræ de virtúte deliciárum eius dívites facti sunt.'
  "4": 'Et audívi áliam vocem de cælo, dicéntem: Exíte de illa pópulus meus: ut ne partícipes sitis delictórum eius, et de plagis eius non accipiátis.'
  "5": Quóniam pervenérunt peccáta eius usque ad cælum, et recordátus est Dóminus iniquitátum eius.
  "6": 'Réddite illi sicut et ipsa réddidit vobis: et duplicáte duplícia secúndum ópera eius: in póculo, quo míscuit, miscéte illi duplum.'
  "7": 'Quantum glorificávit se, et in delíciis fuit, tantum date illi torméntum et luctum: quia in corde suo dicit: Sédeo regína: et vídua non sum, et luctum non vidébo.'
  "8": 'Ideo in una die vénient plagæ eius, mors, et luctus, et fames, et igne comburétur: quia fortis est Deus, qui iudicábit illam.'
  "9": 'Et flebunt, et plangent se super illam reges terræ, qui cum illa fornicáti sunt, et in delíciis vixérunt, cum víderint fumum incéndii eius:'
  "10": 'longe stantes propter timórem tormentórum eius, dicéntes: Væ, væ cívitas illa magna Bábylon, cívitas illa fortis: quóniam una hora venit iudícium tuum.'
  "11": 'Et negotiatóres terræ flebunt, et lugébunt super illam: quóniam merces eórum nemo emet ámplius:'
  "12": merces auri, et argénti, et lápidis pretiósi, et margarítæ, et byssi, et púrpuræ, et sérici, et cocci (et omne lignum thýinum, et ómnia vasa éboris, et ómnia vasa de lápide pretióso, et æraménto, et ferro, et mármore,
  "13": et cinnamómum), et odoramentórum, et unguénti, et thuris, et vini, et ólei, et símilæ, et trítici, et iumentórum, et óvium, et equórum, et rhedárum, et mancipiórum, et animárum hóminum.
  "14": Et poma desidérii ánimæ tuæ discessérunt a te, et ómnia pínguia, et præclára periérunt a te, et ámplius illa iam non invénient.
  "15": Mercatóres horum, qui dívites facti sunt, ab ea longe stabunt propter timórem tormentórum eius, flentes, ac lugéntes,
  "16": 'et dicéntes: Væ, væ cívitas illa magna, quæ amícta erat bysso, et púrpura, et cocco, et deauráta erat auro, et lápide pretióso, et margarítis:'
  "17": 'quóniam una hora destitútæ sunt tantæ divítiæ: et omnis gubernátor, et omnis, qui in lacum návigat, et nautæ, et qui in mari operántur, longe stetérunt,'
  "18": 'et clamavérunt vidéntes locum incéndii eius, dicéntes: Quæ símilis civitáti huic magnæ?'
  "19": 'et misérunt púlverem super cápita sua, et clamavérunt flentes, et lugéntes, dicéntes: Væ, væ cívitas illa magna, in qua dívites facti sunt omnes, qui habébant naves in mari de prétiis eius: quóniam una hora desoláta est.'
  "20": 'Exsúlta super eam cælum, et sancti apóstoli, et prophétæ: quóniam iudicávit Deus iudícium vestrum de illa.'
  "21": 'Et sústulit unus ángelus fortis lápidem quasi molárem magnum, et misit in mare, dicens: Hoc ímpetu mittétur Bábylon cívitas illa magna, et ultra iam non inveniétur.'
  "22": 'Et vox citharœdórum, et musicórum, et tíbia canéntium, et tuba non audiétur in te ámplius: et omnis ártifex omnis artis non inveniétur in te ámplius: et vox molæ non audiétur in te ámplius:'
  "23": 'et lux lucérnæ non lucébit in te ámplius: et vox sponsi, et sponsæ non audiétur adhuc in te: quia mercatóres tui erant príncipes terræ, quia in venefíciis tuis erravérunt omnes gentes.'
  "24": 'Et in ea sanguis prophetárum et sanctórum invéntus est: et ómnium, qui interfécti sunt in terra.'
