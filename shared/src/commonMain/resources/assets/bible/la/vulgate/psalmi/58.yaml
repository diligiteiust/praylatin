bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "58"
verses:
  "1": In finem, Ne dispérdas, David in títuli inscriptiónem, quando misit Saul, et custodívit domum eius ut eum interfíceret.
  "2": 'Eripe me de inimícis meis Deus meus: et ab insurgéntibus in me líbera me.'
  "3": 'Eripe me de operántibus iniquitátem: et de viris sánguinum salva me.'
  "4": 'Quia ecce cepérunt ánimam meam: irruérunt in me fortes.'
  "5": 'Neque iníquitas mea, neque peccátum meum Dómine: sine iniquitáte cucúrri, et diréxi.'
  "6": 'Exsúrge in occúrsum meum, et vide: et tu Dómine Deus virtútum Deus Israel, inténde ad visitándas omnes gentes: non misereáris ómnibus, qui operántur iniquitátem.'
  "7": 'Converténtur ad vésperam: et famem patiéntur ut canes, et circuíbunt civitátem.'
  "8": 'Ecce loquéntur in ore suo, et gládius in lábiis eórum: quóniam quis audívit?'
  "9": 'Et tu Dómine deridébis eos: ad níhilum dedúces omnes gentes.'
  "10": 'Fortitúdinem meam ad te custódiam, quia Deus suscéptor meus es:'
  "11": Deus meus, misericórdia eius prævéniet me.
  "12": 'Deus osténdet mihi super inimícos meos, ne occídas eos: nequándo obliviscántur pópuli mei. Dispérge illos in virtúte tua: et depóne eos, protéctor meus Dómine:'
  "13": 'delíctum oris eórum, sermónem labiórum ipsórum: et comprehendántur in supérbia sua. Et de exsecratióne et mendácio annuntiabúntur'
  "14": 'in consummatióne: in ira consummatiónis, et non erunt. Et scient quia Deus dominábitur Iacob: et fínium terræ.'
  "15": 'Converténtur ad vésperam, et famem patiéntur ut canes: et circuíbunt civitátem.'
  "16": 'Ipsi dispergéntur ad manducándum: si vero non fúerint saturáti, et murmurábunt.'
  "17": 'Ego autem cantábo fortitúdinem tuam: et exsultábo mane misericórdiam tuam. Quia factus es suscéptor meus, et refúgium meum, in die tribulatiónis meæ.'
  "18": 'Adiútor meus tibi psallam, quia Deus suscéptor meus es: Deus meus misericórdia mea.'
