bible: vulgate
lang: la
language: Latina
book: Sapientia
chapter: "5"
verses:
  "1": Tunc stabunt iusti in magna constántia advérsus eos, qui se angustiavérunt, et qui abstulérunt labóres eórum.
  "2": Vidéntes turbabúntur timóre horríbili, et mirabúntur in subitatióne insperátæ salútis,
  "3": 'dicéntes intra se, pœniténtiam agéntes, et præ angústia spíritus geméntes: Hi sunt, quos habúimus aliquándo in derísum, et in similitúdinem impropérii.'
  "4": 'Nos insensáti, vitam illórum æstimabámus insániam, et finem illórum sine honóre:'
  "5": ecce quómodo computáti sunt inter fílios Dei, et inter sanctos sors illórum est.
  "6": Ergo errávimus a via veritátis, et iustítiæ lumen non luxit nobis, et sol intelligéntiæ non est ortus nobis.
  "7": 'Lassáti sumus in via iniquitátis et perditiónis, et ambulávimus vias diffíciles: viam autem Dómini ignorávimus.'
  "8": Quid nobis prófuit supérbia? aut divitiárum iactántia quid cóntulit nobis?
  "9": Transiérunt ómnia illa tamquam umbra, et tamquam núntius percúrrens,
  "10": 'et tamquam navis, quæ pertránsit fluctuántem aquam, cuius cum præteríerit non est vestígium inveníre, neque sémitam carínæ illíus in flúctibus:'
  "11": 'aut tamquam avis, quæ tránsvolat in áere, cuius nullum invenítur arguméntum itíneris, sed tantum sónitus alárum vérberans levem ventum, et scindens per vim itíneris áerem: commótis alis transvolávit, et post hoc nullum signum invenítur itíneris illíus:'
  "12": 'aut tamquam sagítta emíssa in locum destinátum, divísus aer contínuo in se reclúsus est, ut ignorétur tránsitus illíus:'
  "13": 'sic et nos nati contínuo desívimus esse: et virtútis quidem nullum signum valúimus osténdere: in malignitáte autem nostra consúmpti sumus.'
  "14": 'Tália dixérunt in inférno hi, qui peccavérunt:'
  "15": quóniam spes ímpii tamquam lanúgo est, quæ a vento tóllitur, et tamquam spuma grácilis, quæ a procélla dispérgitur, et tamquam fumus, qui a vento diffúsus est, et tamquam memória hóspitis uníus diéi prætereúntis.
  "16": Iusti autem in perpétuum vivent, et apud Dóminum est merces eórum, et cogitátio illórum apud Altíssimum.
  "17": 'Ideo accípient regnum decóris, et diadéma speciéi de manu Dómini: quóniam déxtera sua teget eos, et bráchio sancto suo deféndet illos.'
  "18": Accípiet armatúram zelus illíus, et armábit creatúram ad ultiónem inimicórum.
  "19": 'Induet pro thoráce iustítiam, et accípiet pro gálea iudícium certum:'
  "20": sumet scutum inexpugnábile, æquitátem.
  "21": Acuet autem duram iram in lánceam, et pugnábit cum illo orbis terrárum contra insensátos.
  "22": Ibunt dirécte emissiónes fúlgurum, et tamquam a bene curváto arcu núbium exterminabúntur, et ad certum locum insílient.
  "23": 'Et a petrósa ira plenæ mitténtur grándines: excandéscet in illos aqua maris, et flúmina concúrrent dúriter.'
  "24": 'Contra illos stabit spíritus virtútis, et tamquam turbo venti dívidet illos: et ad erémum perdúcet omnem terram iníquitas illórum, et malígnitas evértet sedes poténtium.'
