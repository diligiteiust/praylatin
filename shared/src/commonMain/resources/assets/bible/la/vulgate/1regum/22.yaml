bible: vulgate
lang: la
language: Latina
book: I Regum
chapter: "22"
verses:
  "1": Transiérunt ígitur tres anni absque bello inter Sýriam et Israel.
  "2": In anno autem tértio, descéndit Iósaphat rex Iuda ad regem Israel.
  "3": '(Dixítque rex Israel ad servos suos: Ignorátis quod nostra sit Ramoth Gálaad, et neglígimus tóllere eam de manu regis Sýriæ?)'
  "4": 'Et ait ad Iósaphat: Veniésne mecum ad prœliándum in Ramoth Gálaad?'
  "5": 'Dixítque Iósaphat ad regem Israel: Sicut ego sum, ita et tu: pópulus meus, et pópulus tuus unum sunt: et équites mei, équites tui. Dixítque Iósaphat ad regem Israel: Quære, oro te, hódie sermónem Dómini.'
  "6": 'Congregávit ergo rex Israel prophétas, quadringéntos círciter viros, et ait ad eos: Ire débeo in Ramoth Gálaad ad bellándum, an quiéscere? Qui respondérunt: Ascénde, et dabit eam Dóminus in manu regis.'
  "7": 'Dixit autem Iósaphat: Non est hic prophéta Dómini quíspiam, ut interrogémus per eum?'
  "8": 'Et ait rex Israel ad Iósaphat: Remánsit vir unus, per quem póssumus interrogáre Dóminum: sed ego odi eum, quia non prophétat mihi bonum, sed malum: Michǽas fílius Iemla. Cui Iósaphat ait: Ne loquáris ita rex.'
  "9": 'Vocávit ergo rex Israel eunúchum quemdam, et dixit ei: Festína addúcere Michǽam fílium Iemla.'
  "10": Rex autem Israel, et Iósaphat rex Iuda, sedébant unusquísque in sólio suo, vestíti cultu régio, in área iuxta óstium portæ Samaríæ, et univérsi prophétæ prophetábant in conspéctu eórum.
  "11": 'Fecit quoque sibi Sedecías fílius Chanáana córnua férrea, et ait: Hæc dicit Dóminus: His ventilábis Sýriam, donec déleas eam.'
  "12": 'Omnésque prophétæ simíliter prophetábant, dicéntes: Ascénde in Ramoth Gálaad, et vade próspere, et tradet Dóminus in manus regis.'
  "13": 'Núntius vero, qui íerat ut vocáret Michǽam, locútus est ad eum, dicens: Ecce sermónes prophetárum ore uno regi bona prǽdicant: sit ergo sermo tuus símilis eórum, et lóquere bona.'
  "14": 'Cui Michǽas ait: Vivit Dóminus, quia quodcúmque díxerit mihi Dóminus, hoc loquar.'
  "15": 'Venit ítaque ad regem, et ait illi rex: Michǽa, ire debémus in Ramoth Gálaad ad prœliándum, an cessáre? Cui ille respóndit: Ascénde, et vade próspere, et tradet eam Dóminus in manus regis.'
  "16": 'Dixit autem rex ad eum: Iterum atque íterum adiúro te, ut non loquáris mihi nisi quod verum est, in nómine Dómini.'
  "17": 'Et ille ait: Vidi cunctum Israel dispérsum in móntibus, quasi oves non habéntes pastórem: et ait Dóminus: Non habent isti dóminum: revertátur unusquísque in domum suam in pace.'
  "18": '(Dixit ergo rex Israel ad Iósaphat: Numquid non dixi tibi, quia non prophétat mihi bonum, sed semper malum?)'
  "19": 'Ille vero addens, ait: Proptérea audi sermónem Dómini: Vidi Dóminum sedéntem super sólium suum, et omnem exércitum cæli assisténtem ei a dextris et a sinístris:'
  "20": 'et ait Dóminus: Quis decípiet Achab regem Israel, ut ascéndat, et cadat in Ramoth Gálaad? Et dixit unus verba huiuscémodi, et álius áliter.'
  "21": 'Egréssus est autem spíritus, et stetit coram Dómino, et ait: Ego decípiam illum. Cui locútus est Dóminus: In quo?'
  "22": 'Et ille ait: Egrédiar, et ero spíritus mendax in ore ómnium prophetárum eius. Et dixit Dóminus: Decípies, et prævalébis: egrédere, et fac ita.'
  "23": Nunc ígitur ecce dedit Dóminus spíritum mendácii in ore ómnium prophetárum tuórum, qui hic sunt, et Dóminus locútus est contra te malum.
  "24": 'Accéssit autem Sedecías fílius Chanáana, et percússit Michǽam in maxíllam, et dixit: Mene ergo dimísit Spíritus Dómini, et locútus est tibi?'
  "25": 'Et ait Michǽas: Visúrus es in die illa quando ingrediéris cubículum, intra cubículum ut abscondáris.'
  "26": 'Et ait rex Israel: Tóllite Michǽam, et máneat apud Amon príncipem civitátis, et apud Ioas fílium Amelech,'
  "27": 'et dícite eis: Hæc dicit rex: Míttite virum istum in cárcerem, et sustentáte eum pane tribulatiónis, et aqua angústiæ, donec revértar in pace.'
  "28": 'Dixítque Michǽas: Si revérsus fúeris in pace, non est locútus in me Dóminus. Et ait: Audíte pópuli omnes.'
  "29": Ascéndit ítaque rex Israel, et Iósaphat rex Iuda, in Ramoth Gálaad.
  "30": 'Dixit ítaque rex Israel ad Iósaphat: Sume arma, et ingrédere prœ́lium, et indúere véstibus tuis: porro rex Israel mutávit hábitum suum, et ingréssus est bellum.'
  "31": 'Rex autem Sýriæ præcéperat princípibus cúrruum trigínta duóbus, dicens: Non pugnábitis contra minórem, et maiórem quémpiam, nisi contra regem Israel solum.'
  "32": 'Cum ergo vidíssent príncipes cúrruum Iósaphat, suspicáti sunt quod ipse esset rex Israel, et ímpetu facto pugnábant contra eum: et exclamávit Iósaphat.'
  "33": Intellexerúntque príncipes cúrruum quod non esset rex Israel, et cessavérunt ab eo.
  "34": 'Vir autem quidam teténdit arcum, in incértum sagíttam dírigens, et casu percússit regem Israel inter pulmónem et stómachum. At ille dixit aurígæ suo: Verte manum tuam, et éice me de exércitu, quia gráviter vulnerátus sum.'
  "35": 'Commíssum est ergo prœ́lium in die illa, et rex Israel stabat in curru suo contra Syros, et mórtuus est véspere: fluébat autem sanguis plagæ in sinum currus,'
  "36": 'et præco insónuit in univérso exércitu ántequam sol occúmberet, dicens: Unusquísque revertátur in civitátem, et in terram suam.'
  "37": 'Mórtuus est autem rex, et perlátus est in Samaríam: sepelierúntque regem in Samaría,'
  "38": 'et lavérunt currum eius in piscína Samaríæ: et linxérunt canes sánguinem eius, et habénas lavérunt, iuxta verbum Dómini quod locútus fúerat.'
  "39": Réliqua autem sermónum Achab, et univérsa quæ fecit, et domus ebúrnea, quam ædificávit, cunctarúmque úrbium, quas exstrúxit, nonne hæc scripta sunt in Libro sermónum diérum regum Israel?
  "40": Dormívit ergo Achab cum pátribus suis, et regnávit Ochozías fílius eius pro eo.
  "41": Iósaphat vero fílius Asa regnáre cœ́perat super Iudam anno quarto Achab regis Israel.
  "42": 'Trigínta quinque annórum erat cum regnáre cœpísset, et vigínti quinque annis regnávit in Ierúsalem: nomen matris eius Azuba fília Sálai.'
  "43": 'Et ambulávit in omni via Asa patris sui, et non declinávit ex ea: fecítque quod rectum erat in conspéctu Dómini.'
  "44": 'Verúmtamen excélsa non ábstulit: adhuc enim pópulus sacrificábat, et adolébat incénsum in excélsis.'
  "45": Pacémque hábuit Iósaphat cum rege Israel.
  "46": Réliqua autem verbórum Iósaphat, et ópera eius, quæ gessit, et prœ́lia, nonne hæc scripta sunt in Libro verbórum diérum regum Iuda?
  "47": Sed et relíquias effeminatórum, qui remánserant in diébus Asa patris eius, ábstulit de terra.
  "48": Nec erat tunc rex constitútus in Edom.
  "49": 'Rex vero Iósaphat fécerat classes in mari, quæ navigárent in Ophir propter aurum: et ire non potuérunt, quia confráctæ sunt in Asióngaber.'
  "50": 'Tunc ait Ochozías fílius Achab ad Iósaphat: Vadant servi mei cum servis tuis in návibus. Et nóluit Iósaphat.'
  "51": 'Dormivítque Iósaphat cum pátribus suis, et sepúltus est cum eis in civitáte David patris sui: regnavítque Ioram fílius eius pro eo.'
  "52": 'Ochozías autem fílius Achab regnáre cœ́perat super Israel in Samaría, anno séptimo décimo Iósaphat regis Iuda: regnavítque super Israel duóbus annis.'
  "53": Et fecit malum in conspéctu Dómini, et ambulávit in via patris sui et matris suæ, et in via Ieróboam fílii Nabat, qui peccáre fecit Israel.
  "54": Servívit quoque Baal, et adorávit eum, et irritávit Dóminum Deum Israel, iuxta ómnia quæ fécerat pater eius.
