bible: vulgate
lang: la
language: Latina
book: Leviticus
chapter: "20"
verses:
  "1": 'Locutúsque est Dóminus ad Móysen, dicens:'
  "2": 'Hæc loquéris fíliis Israel: Homo de fíliis Israel, et de ádvenis, qui hábitant in Israel, si quis déderit de sémine suo idólo Moloch, morte moriátur: pópulus terræ lapidábit eum.'
  "3": 'Et ego ponam fáciem meam contra illum: succidámque eum de médio pópuli sui, eo quod déderit de sémine suo Moloch, et contamináverit sanctuárium meum, ac pollúerit nomen sanctum meum.'
  "4": 'Quod si négligens pópulus terræ, et quasi parvipéndens impérium meum, dimíserit hóminem qui dedit de sémine suo Moloch, nec volúerit eum occídere:'
  "5": ponam fáciem meam super hóminem illum, et super cognatiónem eius, succidámque et ipsum, et omnes qui consensérunt ei ut fornicarétur cum Moloch, de médio pópuli sui.
  "6": Anima, quæ declináverit ad magos et aríolos, et fornicáta fúerit cum eis, ponam fáciem meam contra eam, et interfíciam illam de médio pópuli sui.
  "7": Sanctificámini et estóte sancti, quia ego sum Dóminus Deus vester.
  "8": Custodíte præcépta mea, et fácite ea. Ego Dóminus qui sanctífico vos.
  "9": 'Qui maledíxerit patri suo, aut matri, morte moriátur: patri matríque maledíxit: sanguis eius sit super eum.'
  "10": Si mœchátus quis fúerit cum uxóre altérius, et adultérium perpetráverit cum cóniuge próximi sui, morte moriántur et mœchus et adúltera.
  "11": 'Qui dormíerit cum novérca sua, et reveláverit ignomíniam patris sui, morte moriántur ambo: sanguis eórum sit super eos.'
  "12": 'Si quis dormíerit cum nuru sua, utérque moriátur, quia scelus operáti sunt: sanguis eórum sit super eos.'
  "13": 'Qui dormíerit cum másculo cóitu femíneo, utérque operátus est nefas, morte moriántur: sit sanguis eórum super eos.'
  "14": 'Qui supra uxórem fíliam, dúxerit matrem eius, scelus operátus est: vivus ardébit cum eis, nec permanébit tantum nefas in médio vestri.'
  "15": 'Qui cum iuménto et pécore coíerit, morte moriátur: pecus quoque occídite.'
  "16": 'Múlier, quæ succubúerit cuílibet iuménto, simul interficiétur cum eo: sanguis eórum sit super eos.'
  "17": 'Qui accéperit sorórem suam fíliam patris sui, vel fíliam matris suæ, et víderit turpitúdinem eius, illáque conspéxerit fratris ignomíniam, nefáriam rem operáti sunt: occidéntur in conspéctu pópuli sui, eo quod turpitúdinem suam mútuo reveláverint, et portábunt iniquitátem suam.'
  "18": Qui coíerit cum mulíere in fluxu ménstruo, et reveláverit turpitúdinem eius, ipsáque aperúerit fontem sánguinis sui, interficiéntur ambo de médio pópuli sui.
  "19": 'Turpitúdinem matérteræ et ámitæ tuæ non discoopéries: qui hoc fécerit, ignomíniam carnis suæ nudávit: portábunt ambo iniquitátem suam.'
  "20": 'Qui coíerit cum uxóre pátrui vel avúnculi sui, et reveláverit ignomíniam cognatiónis suæ, portábunt ambo peccátum suum: absque líberis moriéntur.'
  "21": 'Qui dúxerit uxórem fratris sui, rem facit illícitam: turpitúdinem fratris sui revelávit: absque líberis erunt.'
  "22": 'Custodíte leges meas, atque iudícia, et fácite ea: ne et vos évomat terra quam intratúri estis et habitatúri.'
  "23": Nolíte ambuláre in legítimis natiónum, quas ego expulsúrus sum ante vos. Omnia enim hæc fecérunt, et abominátus sum eas.
  "24": 'Vobis autem loquor: Possidéte terram eórum, quam dabo vobis in hereditátem, terram fluéntem lacte et melle. Ego Dóminus Deus vester, qui separávi vos a céteris pópulis.'
  "25": 'Separáte ergo et vos iuméntum mundum ab immúndo, et avem mundam ab immúnda: ne polluátis ánimas vestras in pécore, et ávibus, et cunctis quæ movéntur in terra, et quæ vobis osténdi esse pollúta.'
  "26": Eritis mihi sancti, quia sanctus sum ego Dóminus, et separávi vos a céteris pópulis, ut essétis mei.
  "27": 'Vir, sive múlier, in quibus pythónicus, vel divinatiónis fúerit spíritus, morte moriántur: lapídibus óbruent eos: sanguis eórum sit super illos.'
