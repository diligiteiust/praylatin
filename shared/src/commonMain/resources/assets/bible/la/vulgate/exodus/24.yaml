bible: vulgate
lang: la
language: Latina
book: Exodus
chapter: "24"
verses:
  "1": 'Móysi quoque dixit: Ascénde ad Dóminum tu, et Aaron, Nadab et Abiu, et septuagínta senes ex Israel, et adorábitis procul.'
  "2": 'Solúsque Móyses ascéndet ad Dóminum, et illi non appropinquábunt: nec pópulus ascéndet cum eo.'
  "3": 'Venit ergo Móyses et narrávit plebi ómnia verba Dómini, atque iudícia: respondítque omnis pópulus una voce: Omnia verba Dómini, quæ locútus est, faciémus.'
  "4": 'Scripsit autem Móyses univérsos sermónes Dómini: et mane consúrgens, ædificávit altáre ad radíces montis, et duódecim títulos per duódecim tribus Israel.'
  "5": Misítque iúvenes de fíliis Israel, et obtulérunt holocáusta, immolaverúntque víctimas pacíficas Dómino, vítulos.
  "6": 'Tulit ítaque Móyses dimídiam partem sánguinis, et misit in cratéras: partem autem resíduam fudit super altáre.'
  "7": 'Assuménsque volúmen fœ́deris, legit audiénte pópulo: qui dixérunt: Omnia quæ locútus est Dóminus, faciémus, et érimus obediéntes.'
  "8": 'Ille vero sumptum sánguinem respérsit in pópulum, et ait: Hic est sanguis fœ́deris quod pépigit Dóminus vobíscum super cunctis sermónibus his.'
  "9": 'Ascenderúntque Móyses et Aaron, Nadab et Abiu, et septuagínta de senióribus Israel:'
  "10": 'et vidérunt Deum Israel: et sub pédibus eius quasi opus lápidis sapphírini, et quasi cælum, cum serénum est.'
  "11": Nec super eos qui procul recésserant de fíliis Israel, misit manum suam, viderúntque Deum, et comedérunt, ac bibérunt.
  "12": 'Dixit autem Dóminus ad Móysen: Ascénde ad me in montem, et esto ibi: dabóque tibi tábulas lapídeas, et legem, ac mandáta quæ scripsi: ut dóceas eos.'
  "13": 'Surrexérunt Móyses et Iósue miníster eius: ascendénsque Móyses in montem Dei,'
  "14": 'senióribus ait: Exspectáte hic donec revertámur ad vos. Habétis Aaron et Hur vobíscum: si quid natum fúerit quæstiónis, referétis ad eos.'
  "15": Cumque ascendísset Móyses, opéruit nubes montem,
  "16": 'et habitávit glória Dómini super Sínai, tegens illum nube sex diébus: séptimo autem die vocávit eum de médio calíginis.'
  "17": Erat autem spécies glóriæ Dómini quasi ignis ardens super vérticem montis in conspéctu filiórum Israel.
  "18": 'Ingressúsque Móyses médium nébulæ, ascéndit in montem: et fuit ibi quadragínta diébus, et quadragínta nóctibus.'
