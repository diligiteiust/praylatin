bible: vulgate
lang: la
language: Latina
book: Ieremias
chapter: "7"
verses:
  "1": 'Verbum, quod factum est ad Ieremíam a Dómino, dicens:'
  "2": 'Sta in porta domus Dómini, et prǽdica ibi verbum istud, et dic: Audíte verbum Dómini omnis Iuda, qui ingredímini per portas has, ut adorétis Dóminum.'
  "3": 'Hæc dicit Dóminus exercítuum, Deus Israel: Bonas fácite vias vestras, et stúdia vestra: et habitábo vobíscum in loco isto.'
  "4": 'Nolíte confídere in verbis mendácii, dicéntes: Templum Dómini, templum Dómini, templum Dómini est.'
  "5": 'Quóniam si bene direxéritis vias vestras, et stúdia vestra: si fecéritis iudícium inter virum et próximum eius,'
  "6": 'ádvenæ, et pupíllo, et víduæ non fecéritis calúmniam, nec sánguinem innocéntem effudéritis in loco hoc, et post deos aliénos non ambulavéritis in malum vobismetípsis:'
  "7": 'habitábo vobíscum in loco isto: in terra, quam dedi pátribus vestris a sǽculo et usque in sǽculum.'
  "8": 'Ecce vos confíditis vobis in sermónibus mendácii, qui non próderunt vobis:'
  "9": furári, occídere, adulterári, iuráre mendáciter, libáre Báalim, et ire post deos aliénos, quos ignorátis.
  "10": 'Et venístis, et stetístis coram me in domo hac, in qua invocátum est nomen meum, et dixístis: Liberáti sumus, eo quod fecérimus omnes abominatiónes istas.'
  "11": 'Numquid ergo spelúnca latrónum facta est domus ista, in qua invocátum est nomen meum in óculis vestris? ego, ego sum: ego vidi, dicit Dóminus.'
  "12": 'Ite ad locum meum in Silo, ubi habitávit nomen meum a princípio: et vidéte quæ fécerim ei propter malítiam pópuli mei Israel:'
  "13": 'et nunc, quia fecístis ómnia ópera hæc, dicit Dóminus, et locútus sum ad vos mane consúrgens, et loquens, et non audístis: et vocávi vos, et non respondístis:'
  "14": fáciam dómui huic, in qua invocátum est nomen meum, et in qua vos habétis fidúciam, et loco, quem dedi vobis et pátribus vestris, sicut feci Silo.
  "15": Et proíciam vos a fácie mea sicut proiéci omnes fratres vestros, univérsum semen Ephraim.
  "16": 'Tu ergo noli oráre pro pópulo hoc, nec assúmas pro eis laudem et oratiónem: et non obsístas mihi, quia non exáudiam te.'
  "17": Nonne vides quid isti fáciunt in civitátibus Iuda, et in platéis Ierúsalem?
  "18": Fílii cólligunt ligna, et patres succéndunt ignem, et mulíeres conspérgunt ádipem, ut fáciant placéntas regínæ cæli, et libent diis aliénis, et me ad iracúndiam próvocent.
  "19": Numquid me ad iracúndiam próvocant, dicit Dóminus? nonne semetípsos in confusiónem vultus sui?
  "20": 'Ideo hæc dicit Dóminus Deus: Ecce furor meus, et indignátio mea conflátur super locum istum, super viros, et super iuménta, et super lignum regiónis, et super fruges terræ, et succendétur, et non exstinguétur.'
  "21": 'Hæc dicit Dóminus exercítuum, Deus Israel: Holocautómata vestra áddite víctimis vestris, et comédite carnes.'
  "22": Quia non sum locútus cum pátribus vestris, et non præcépi eis in die, qua edúxi eos de terra Ægýpti, de verbo holocautómatum et victimárum.
  "23": 'Sed hoc verbum præcépi eis, dicens: Audíte vocem meam, et ero vobis Deus, et vos éritis mihi pópulus: et ambuláte in omni via, quam mandávi vobis, ut bene sit vobis.'
  "24": 'Et non audiérunt, nec inclinavérunt aurem suam: sed abiérunt in voluntátibus, et in pravitáte cordis sui mali: factíque sunt retrórsum et non in ante,'
  "25": a die qua egréssi sunt patres eórum de terra Ægýpti usque ad diem hanc. Et misi ad vos omnes servos meos prophétas per diem, consúrgens dilúculo, et mittens.
  "26": 'Et non audiérunt me, nec inclinavérunt aurem suam: sed induravérunt cervícem suam, et peius operáti sunt, quam patres eórum.'
  "27": 'Et loquéris ad eos ómnia verba hæc, et non áudient te: et vocábis eos, et non respondébunt tibi.'
  "28": 'Et dices ad eos: Hæc est gens, quæ non audívit vocem Dómini Dei sui, nec recépit disciplínam: périit fides, et abláta est de ore eórum.'
  "29": 'Tonde capíllum tuum, et próice, et sume in diréctum planctum: quia proiécit Dóminus et relíquit generatiónem furóris sui,'
  "30": 'quia fecérunt fílii Iuda malum in óculis meis, dicit Dóminus. Posuérunt offendícula sua in domo, in qua invocátum est nomen meum, ut pollúerent eam:'
  "31": 'et ædificavérunt excélsa Topheth, quæ est in valle fílii Ennom: ut incénderent fílios suos et fílias suas igni: quæ non præcépi, nec cogitávi in corde meo.'
  "32": 'Ideo ecce dies vénient, dicit Dóminus, et non dicétur ámplius, Topheth, et Vallis fílii Ennom, sed Vallis interfectiónis: et sepélient in Topheth, eo quod non sit locus.'
  "33": Et erit morticínum pópuli huius in cibos volúcribus cæli, et béstiis terræ, et non erit qui ábigat.
  "34": 'Et quiéscere fáciam de úrbibus Iuda, et de platéis Ierúsalem, vocem gáudii et vocem lætítiæ, vocem sponsi et vocem sponsæ: in desolatiónem enim erit terra.'
