bible: vulgate
lang: la
language: Latina
book: Iob
chapter: "4"
verses:
  "1": 'Respóndens autem Eliphaz Themanítes, dixit:'
  "2": Si cœpérimus loqui tibi, fórsitan moléste accípies, sed concéptum sermónem tenére quis póterit?
  "3": 'Ecce docuísti multos, et manus lassas roborásti:'
  "4": 'vacillántes confirmavérunt sermónes tui, et génua treméntia confortásti:'
  "5": 'nunc autem venit super te plaga, et defecísti: tétigit te, et conturbátus es.'
  "6": Ubi est timor tuus, fortitúdo tua, patiéntia tua, et perféctio viárum tuárum?
  "7": Recordáre, óbsecro te, quis unquam ínnocens périit? aut quando recti deléti sunt?
  "8": Quin pótius vidi eos, qui operántur iniquitátem, et séminant dolóres, et metunt eos,
  "9": 'flante Deo perísse, et spíritu iræ eius esse consúmptos:'
  "10": rugítus leónis, et vox leǽnæ, et dentes catulórum leónum contríti sunt.
  "11": Tigris périit, eo quod non habéret prædam, et cátuli leónis dissipáti sunt.
  "12": Porro ad me dictum est verbum abscónditum, et quasi furtíve suscépit auris mea venas susúrri eius.
  "13": In horróre visiónis noctúrnæ, quando solet sopor occupáre hómines,
  "14": 'pavor ténuit me, et tremor, et ómnia ossa mea pertérrita sunt:'
  "15": et cum spíritus me præsénte transíret, inhorruérunt pili carnis meæ.
  "16": 'Stetit quidam, cuius non agnoscébam vultum, imágo coram óculis meis, et vocem quasi auræ lenis audívi:'
  "17": Numquid homo Dei comparatióne iustificábitur, aut factóre suo púrior erit vir?
  "18": 'Ecce qui sérviunt ei, non sunt stábiles, et in ángelis suis réperit pravitátem:'
  "19": quanto magis hi qui hábitant domos lúteas, qui terrénum habent fundaméntum, consuméntur velut a tínea?
  "20": 'De mane usque ad vésperam succidéntur: et quia nullus intélligit, in ætérnum períbunt.'
  "21": 'Qui autem réliqui fúerint, auferéntur ex eis: moriéntur, et non in sapiéntia.'
