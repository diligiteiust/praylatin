bible: vulgate
lang: la
language: Latina
book: I Machabaeorum
chapter: "2"
verses:
  "1": 'In diébus illis surréxit Mathathías fílius Ioánnis fílii Simeónis, sacérdos ex fíliis Ióarib, ab Ierúsalem, et consédit in monte Modin:'
  "2": 'et habébat fílios quinque: Ioánnem, qui cognominabátur Gaddis:'
  "3": 'et Simónem, qui cognominabátur Thasi:'
  "4": 'et Iudam, qui vocabátur Machabǽus:'
  "5": 'et Eleázarum, qui cognominabátur Abaron: et Iónathan, qui cognominabátur Apphus.'
  "6": Hi vidérunt mala, quæ fiébant in pópulo Iuda, et in Ierúsalem.
  "7": 'Et dixit Mathathías: Væ mihi, ut quid natus sum vidére contritiónem pópuli mei, et contritiónem civitátis sanctæ, et sedére illic, cum datur in mánibus inimicórum?'
  "8": 'Sancta in manu extraneórum facta sunt: templum eius sicut homo ignóbilis.'
  "9": 'Vasa glóriæ eius captíva abdúcta sunt: trucidáti sunt senes eius in platéis, et iúvenes eius cecidérunt in gládio inimicórum.'
  "10": Quæ gens non hereditávit regnum eius, et non obtínuit spólia eius?
  "11": Omnis composítio eius abláta est. Quæ erat líbera, facta est ancílla.
  "12": Et ecce sancta nostra, et pulchritúdo nostra, et cláritas nostra desoláta est, et coinquinavérunt ea gentes.
  "13": Quo ergo nobis adhuc vívere?
  "14": 'Et scidit vestiménta sua Mathathías, et fílii eius: et operuérunt se cilíciis, et planxérunt valde.'
  "15": Et venérunt illuc qui missi erant a rege Antíocho, ut cógerent eos, qui confúgerant in civitátem Modin, immoláre, et accéndere thura, et a lege Dei discédere.
  "16": 'Et multi de pópulo Israel consentiéntes accessérunt ad eos: sed Mathathías, et fílii eius constánter stetérunt.'
  "17": 'Et respondéntes qui missi erant ab Antíocho, dixérunt Mathathíæ: Princeps et claríssimus, et magnus es in hac civitáte, et ornátus fíliis, et frátribus.'
  "18": 'Ergo accéde prior, et fac iussum regis, sicut fecérunt omnes gentes, et viri Iuda, et qui remansérunt in Ierúsalem: et eris tu, et fílii tui inter amícos regis, et amplificátus auro, et argénto, et munéribus multis.'
  "19": 'Et respóndit Mathathías, et dixit magna voce: Etsi omnes gentes regi Antíocho obédiunt, ut discédat unusquísque a servitúte legis patrum suórum, et conséntiat mandátis eius:'
  "20": ego et fílii mei, et fratres mei obediémus legi patrum nostrórum.
  "21": 'Propítius sit nobis Deus: non est nobis útile relínquere legem, et iustítias Dei:'
  "22": non audiémus verba regis Antíochi, nec sacrificábimus transgrediéntes legis nostræ mandáta, ut eámus áltera via.
  "23": 'Et ut cessávit loqui verba hæc, accéssit quidam Iudǽus in ómnium óculis sacrificáre idólis super aram in civitáte Modin, secúndum iussum regis:'
  "24": 'et vidit Mathathías, et dóluit, et contremuérunt renes eius, et accénsus est furor eius secúndum iudícium legis, et insíliens trucidávit eum super aram:'
  "25": 'sed et virum, quem rex Antíochus míserat, qui cogébat immoláre, occídit in ipso témpore, et aram destrúxit:'
  "26": et zelátus est legem, sicut fecit Phínees Zamri fílio Salómi.
  "27": 'Et exclamávit Mathathías voce magna in civitáte, dicens: Omnis, qui zelum habet legis, státuens testaméntum, éxeat post me.'
  "28": Et fugit ipse, et fílii eius in montes, et reliquérunt quæcúmque habébant in civitáte.
  "29": 'Tunc descendérunt multi quæréntes iudícium, et iustítiam, in desértum:'
  "30": 'et sedérunt ibi ipsi, et fílii eórum, et mulíeres eórum, et pécora eórum: quóniam inundavérunt super eos mala.'
  "31": Et renuntiátum est viris regis, et exercítui, qui erat in Ierúsalem civitáte David, quóniam discessíssent viri quidam, qui dissipavérunt mandátum regis, in loca occúlta in desérto, et abiíssent post illos multi.
  "32": Et statim perrexérunt ad eos, et constituérunt advérsus eos prœ́lium in die sabbatórum,
  "33": 'et dixérunt ad eos: Resístitis et nunc adhuc? exíte, et fácite secúndum verbum regis Antíochi, et vivétis.'
  "34": 'Et dixérunt: Non exíbimus, neque faciémus verbum regis, ut polluámus diem sabbatórum.'
  "35": Et concitavérunt advérsus eos prœ́lium.
  "36": Et non respondérunt eis, nec lápidem misérunt in eos, nec oppilavérunt loca occúlta,
  "37": 'dicéntes: Moriámur omnes in simplicitáte nostra: et testes erunt super nos cælum, et terra, quod iniúste pérditis nos.'
  "38": 'Et intulérunt illis bellum sábbatis: et mórtui sunt ipsi, et uxóres eórum, et fílii eórum, et pécora eórum usque ad mille ánimas hóminum.'
  "39": Et cognóvit Mathathías, et amíci eius, et luctum habuérunt super eos valde.
  "40": 'Et dixit vir próximo suo: Si omnes fecérimus sicut fratres nostri fecérunt, et non pugnavérimus advérsus gentes pro animábus nostris, et iustificatiónibus nostris, nunc cítius dispérdent nos a terra.'
  "41": 'Et cogitavérunt in die illa, dicéntes: Omnis homo, quicúmque vénerit ad nos in bello die sabbatórum, pugnémus advérsus eum: et non moriémur omnes, sicut mórtui sunt fratres nostri in occúltis.'
  "42": 'Tunc congregáta est ad eos synagóga Assidæórum fortis víribus ex Israel, omnis voluntárius in lege:'
  "43": et omnes, qui fugiébant a malis, ádditi sunt ad eos, et facti sunt illis ad firmaméntum.
  "44": 'Et collegérunt exércitum, et percussérunt peccatóres in ira sua, et viros iníquos in indignatióne sua: et céteri fugérunt ad natiónes, ut eváderent.'
  "45": 'Et circuívit Mathathías, et amíci eius, et destruxérunt aras:'
  "46": 'et circumcidérunt púeros incircumcísos quotquot invenérunt in fínibus Israel: et in fortitúdine.'
  "47": 'Et persecúti sunt fílios supérbiæ, et prosperátum est opus in mánibus eórum:'
  "48": et obtinuérunt legem de mánibus géntium, et de mánibus regum, et non dedérunt cornu peccatóri.
  "49": 'Et appropinquavérunt dies Mathathíæ moriéndi, et dixit fíliis suis: Nunc confortáta est supérbia, et castigátio, et tempus eversiónis, et ira indignatiónis.'
  "50": Nunc ergo, o fílii, æmulatóres estóte legis, et date ánimas vestras pro testaménto patrum vestrórum,
  "51": 'et mementóte óperum patrum, quæ fecérunt in generatiónibus suis: et accipiétis glóriam magnam, et nomen ætérnum.'
  "52": Abraham nonne in tentatióne invéntus est fidélis, et reputátum est ei ad iustítiam?
  "53": Ioseph in témpore angústiæ suæ custodívit mandátum, et factus est dóminus Ægýpti.
  "54": Phínees pater noster, zelándo zelum Dei, accépit testaméntum sacerdótii ætérni.
  "55": Iesus dum implévit verbum, factus est dux in Israel.
  "56": Caleb dum testificátur in ecclésia, accépit hereditátem.
  "57": David in sua misericórdia consecútus est sedem regni in sǽcula.
  "58": Elías, dum zelat zelum legis, recéptus est in cælum.
  "59": Ananías et Azarías et Mísael credéntes, liberáti sunt de flamma.
  "60": Dániel in sua simplicitáte liberátus est de ore leónum.
  "61": 'Et ita cogitáte per generatiónem, et generatiónem: quia omnes qui sperant in eum, non infirmántur.'
  "62": 'Et a verbis viri peccatóris ne timuéritis, quia glória eius stercus, et vermis est:'
  "63": 'hódie extóllitur, et cras non inveniétur: quia convérsus est in terram suam, et cogitátio eius périit.'
  "64": 'Vos ergo fílii confortámini, et viríliter ágite in lege: quia in ipsa gloriósi éritis.'
  "65": 'Et ecce Simon frater vester, scio quod vir consílii est: ipsum audíte semper, et ipse erit vobis pater.'
  "66": Et Iudas Machabǽus, fortis víribus a iuventúte sua, sit vobis princeps milítiæ, et ipse aget bellum pópuli.
  "67": 'Et adducétis ad vos omnes factóres legis: et vindicáte vindíctam pópuli vestri.'
  "68": Retribúite retributiónem géntibus, et inténdite in præcéptum legis.
  "69": Et benedíxit eos, et appósitus est ad patres suos.
  "70": 'Et defúnctus est anno centésimo et quadragésimo sexto: et sepúltus est a fíliis suis in sepúlcris patrum suórum in Modin, et planxérunt eum omnis Israel planctu magno.'
