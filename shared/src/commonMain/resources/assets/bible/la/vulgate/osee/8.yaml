bible: vulgate
lang: la
language: Latina
book: Osee
chapter: "8"
verses:
  "1": 'In gútture tuo sit tuba quasi áquila super domum Dómini: pro eo quod transgréssi sunt fœdus meum, et legem meam prævaricáti sunt.'
  "2": 'Me invocábunt: Deus meus cognóvimus te Israel.'
  "3": 'Proiécit Israel bonum: inimícus persequétur eum.'
  "4": 'Ipsi regnavérunt, et non ex me: príncipes exstitérunt, et non cognóvi: argéntum suum, et aurum suum fecérunt sibi idóla, ut interírent.'
  "5": Proiéctus est vítulus tuus Samaría, irátus est furor meus in eos. Usquequo non póterunt emundári?
  "6": 'Quia ex Israel et ipse est: ártifex fecit illum, et non est Deus: quóniam in araneárum telas erit vítulus Samaríæ.'
  "7": 'Quia ventum seminábunt, et túrbinem metent: culmus stans non est in eo, germen non fáciet farínam: quod etsi fécerit, aliéni cómedent eam.'
  "8": 'Devorátus est Israel: nunc factus est in natiónibus quasi vas immúndum.'
  "9": 'Quia ipsi ascendérunt ad Assur, ónager solitárius sibi: Ephraim múnera dedérunt amatóribus.'
  "10": 'Sed et cum mercéde condúxerint natiónes, nunc congregábo eos: et quiéscent paulísper ab ónere regis, et príncipum.'
  "11": 'Quia multiplicávit Ephraim altária ad peccándum: factæ sunt ei aræ in delíctum.'
  "12": Scribam ei multíplices leges meas, quæ velut aliénæ computátæ sunt.
  "13": 'Hóstias ófferent, immolábunt carnes, et cómedent, et Dóminus non suscípiet eas: nunc recordábitur iniquitátis eórum, et visitábit peccáta eórum: ipsi in Ægýptum converténtur.'
  "14": 'Et oblítus est Israel factóris sui, et ædificávit delúbra: et Iudas multiplicávit urbes munítas: et mittam ignem in civitátes eius, et devorábit ædes illíus.'
