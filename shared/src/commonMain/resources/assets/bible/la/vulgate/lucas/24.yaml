bible: vulgate
lang: la
language: Latina
book: Lucas
chapter: "24"
verses:
  "1": 'Una autem sábbati valde dilúculo venérunt ad monuméntum, portántes, quæ paráverant arómata:'
  "2": et invenérunt lápidem revolútum a monuménto.
  "3": Et ingréssæ non invenérunt corpus Dómini Iesu.
  "4": Et factum est, dum mente consternátæ essent de isto, ecce duo viri stetérunt secus illas in veste fulgénti.
  "5": 'Cum timérent autem, et declinárent vultum in terram, dixérunt ad illas: Quid quǽritis vivéntem cum mórtuis?'
  "6": 'Non est hic, sed surréxit: recordámini quáliter locútus est vobis, cum adhuc in Galilǽa esset,'
  "7": 'dicens: Quia opórtet Fílium hóminis tradi in manus hóminum peccatórum, et crucifígi, et die tértia resúrgere.'
  "8": Et recordátæ sunt verbórum eius.
  "9": Et regréssæ a monuménto nuntiavérunt hæc ómnia illis úndecim, et céteris ómnibus.
  "10": Erat autem María Magdaléne, et Ioánna, et María Iacóbi, et céteræ, quæ cum eis erant, quæ dicébant ad apóstolos hæc.
  "11": Et visa sunt ante illos sicut deliraméntum verba ista, et non credidérunt illis.
  "12": 'Petrus autem surgens cucúrrit ad monuméntum: et procúmbens vidit linteámina sola pósita, et ábiit secum mirans quod factum fúerat.'
  "13": Et ecce duo ex illis ibant ipsa die in castéllum, quod erat in spátio stadiórum sexagínta ab Ierúsalem, nómine Emmaus.
  "14": Et ipsi loquebántur ad ínvicem de his ómnibus, quæ accíderant.
  "15": 'Et factum est, dum fabularéntur, et secum quǽrerent: et ipse Iesus appropínquans ibat cum illis:'
  "16": óculi autem illórum tenebántur ne eum agnóscerent.
  "17": 'Et ait ad illos: Qui sunt hi sermónes, quos confértis ad ínvicem ambulántes, et estis tristes?'
  "18": 'Et respóndens unus, cui nomen Cléophas, dixit ei: Tu solus peregrínus es in Ierúsalem, et non cognovísti quæ facta sunt in illa his diébus?'
  "19": 'Quibus ille dixit: Quæ? Et dixérunt: De Iesu Nazaréno, qui fuit vir prophéta, potens in ópere, et sermóne coram Deo, et omni pópulo:'
  "20": 'et quómodo eum tradidérunt summi sacerdótes, et príncipes nostri in damnatiónem mortis, et crucifixérunt eum:'
  "21": 'nos autem sperabámus quia ipse esset redemptúrus Israel: et nunc super hæc ómnia, tértia dies est hódie quod hæc facta sunt.'
  "22": Sed et mulíeres quædam ex nostris terruérunt nos, quæ ante lucem fuérunt ad monuméntum,
  "23": et, non invénto córpore eius, venérunt, dicéntes se étiam visiónem angelórum vidísse, qui dicunt eum vívere.
  "24": 'Et abiérunt quidam ex nostris ad monuméntum: et ita invenérunt sicut mulíeres dixérunt, ipsum vero non invenérunt.'
  "25": 'Et ipse dixit ad eos: O stulti, et tardi corde ad credéndum in ómnibus, quæ locúti sunt prophétæ!'
  "26": Nonne hæc opórtuit pati Christum, et ita intráre in glóriam suam?
  "27": Et incípiens a Móyse, et ómnibus prophétis, interpretabátur illis in ómnibus Scriptúris, quæ de ipso erant.
  "28": 'Et appropinquavérunt castéllo quo ibant: et ipse se finxit lóngius ire.'
  "29": 'Et coegérunt illum, dicéntes: Mane nobíscum, quóniam advesperáscit, et inclináta est iam dies. Et intrávit cum illis.'
  "30": Et factum est, dum recúmberet cum eis, accépit panem, et benedíxit, ac fregit, et porrigébat illis.
  "31": 'Et apérti sunt óculi eórum, et cognovérunt eum: et ipse evánuit ex óculis eórum.'
  "32": 'Et dixérunt ad ínvicem: Nonne cor nostrum ardens erat in nobis dum loquerétur in via, et aperíret nobis Scriptúras?'
  "33": 'Et surgéntes eádem hora regréssi sunt in Ierúsalem: et invenérunt congregátos úndecim, et eos, qui cum illis erant,'
  "34": 'dicéntes: Quod surréxit Dóminus vere, et appáruit Simóni.'
  "35": Et ipsi narrábant quæ gesta erant in via, et quómodo cognovérunt eum in fractióne panis.
  "36": 'Dum autem hæc loquúntur, stetit Iesus in médio eórum, et dicit eis: Pax vobis: ego sum, nolíte timére.'
  "37": Conturbáti vero, et contérriti, existimábant se spíritum vidére.
  "38": 'Et dixit eis: Quid turbáti estis, et cogitatiónes ascéndunt in corda vestra?'
  "39": 'Vidéte manus meas, et pedes, quia ego ipse sum: palpáte, et vidéte: quia spíritus carnem, et ossa non habet, sicut me vidétis habére.'
  "40": Et cum hoc dixísset, osténdit eis manus, et pedes.
  "41": 'Adhuc autem illis non credéntibus, et mirántibus præ gáudio, dixit: Habétis hic áliquid quod manducétur?'
  "42": At illi obtulérunt ei partem piscis assi, et favum mellis.
  "43": Et cum manducásset coram eis, sumens relíquias dedit eis.
  "44": 'Et dixit ad eos: Hæc sunt verba, quæ locútus sum ad vos, cum adhuc essem vobíscum, quóniam necésse est impléri ómnia, quæ scripta sunt in lege Móysi, et prophétis, et psalmis de me.'
  "45": Tunc apéruit illis sensum ut intellígerent Scriptúras.
  "46": 'Et dixit eis: Quóniam sic scriptum est, et sic oportébat Christum pati, et resúrgere a mórtuis tértia die:'
  "47": et prædicári in nómine eius pœniténtiam, et remissiónem peccatórum in omnes gentes, incipiéntibus ab Ierosólyma.
  "48": Vos autem testes estis horum.
  "49": 'Et ego mitto promíssum Patris mei in vos: vos autem sedéte in civitáte, quoadúsque induámini virtúte ex alto.'
  "50": 'Edúxit autem eos foras in Bethániam: et elevátis mánibus suis benedíxit eis.'
  "51": Et factum est, dum benedíceret illis, recéssit ab eis, et ferebátur in cælum.
  "52": 'Et ipsi adorántes regréssi sunt in Ierúsalem cum gáudio magno:'
  "53": et erant semper in templo, laudántes, et benedicéntes Deum. Amen.
