bible: vulgate
lang: la
language: Latina
book: Deuteronomium
chapter: "17"
verses:
  "1": 'Non immolábis Dómino Deo tuo ovem, et bovem, in quo est mácula, aut quíppiam vítii: quia abominátio est Dómino Deo tuo.'
  "2": Cum repérti fúerint apud te intra unam portárum tuárum, quas Dóminus Deus tuus dabit tibi, vir aut múlier qui fáciant malum in conspéctu Dómini Dei tui, et transgrediántur pactum illíus,
  "3": 'ut vadant et sérviant diis aliénis, et adórent eos, solem et lunam, et omnem milítiam cæli, quæ non præcépi:'
  "4": 'et hoc tibi fúerit nuntiátum, audiénsque inquisíeris diligénter et verum esse repéreris, et abominátio facta est in Israel:'
  "5": edúces virum ac mulíerem, qui rem sceleratíssimam perpetrárunt, ad portas civitátis tuæ, et lapídibus obruéntur.
  "6": In ore duórum, aut trium téstium períbit qui interficiétur. Nemo occidátur, uno contra se dicénte testimónium.
  "7": 'Manus téstium prima interfíciet eum, et manus réliqui pópuli extréma mittétur: ut áuferas malum de médio tui.'
  "8": 'Si diffícile et ambíguum apud te iudícium esse perspéxeris inter sánguinem et sánguinem, causam et causam, lepram et lepram: et iúdicum intra portas tuas víderis verba variári: surge, et ascénde ad locum, quem elégerit Dóminus Deus tuus.'
  "9": 'Veniésque ad sacerdótes Levítici géneris, et ad iúdicem, qui fúerit illo témpore: quærésque ab eis, qui indicábunt tibi iudícii veritátem.'
  "10": Et fácies quodcúmque díxerint qui præsunt loco, quem elégerit Dóminus, et docúerint te
  "11": 'iuxta legem eius: sequerísque senténtiam eórum: nec declinábis ad déxteram neque ad sinístram.'
  "12": 'Qui autem superbíerit, nolens obedíre sacerdótis império, qui eo témpore minístrat Dómino Deo tuo, et decréto iúdicis, moriétur homo ille, et áuferes malum de Israel:'
  "13": cunctúsque pópulus áudiens timébit, ut nullus deínceps intuméscat supérbia.
  "14": 'Cum ingréssus fúeris terram, quam Dóminus Deus tuus dabit tibi, et posséderis eam, habitaverísque in illa, et díxeris: Constítuam super me regem, sicut habent omnes per circúitum natiónes:'
  "15": eum constítues, quem Dóminus Deus tuus elégerit de número fratrum tuórum. Non póteris altérius gentis hóminem regem fácere, qui non sit frater tuus.
  "16": Cumque fúerit constitútus, non multiplicábit sibi equos, nec redúcet pópulum in Ægýptum, equitátus número sublevátus, præsértim cum Dóminus præcéperit vobis ut nequáquam ámplius per eámdem viam revertámini.
  "17": Non habébit uxóres plúrimas, quæ allíciant ánimum eius, neque argénti et auri imménsa póndera.
  "18": Postquam autem séderit in sólio regni sui, descríbet sibi Deuteronómium legis huius in volúmine, accípiens exémplar a sacerdótibus Levíticæ tribus,
  "19": et habébit secum, legétque illud ómnibus diébus vitæ suæ, ut discat timére Dóminum Deum suum, et custodíre verba et cæremónias eius, quæ in lege præcépta sunt.
  "20": Nec elevétur cor eius in supérbiam super fratres suos, neque declínet in partem déxteram vel sinístram, ut longo témpore regnet ipse et fílii eius super Israel.
