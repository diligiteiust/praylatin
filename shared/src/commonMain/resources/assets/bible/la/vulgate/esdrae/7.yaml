bible: vulgate
lang: la
language: Latina
book: Esdrae
chapter: "7"
verses:
  "1": Post hæc autem verba, in regno Artaxérxis regis Persárum, Esdras fílius Saraíæ, fílii Azaríæ, fílii Helcíæ,
  "2": fílii Sellum, fílii Sadoc, fílii Achitob,
  "3": fílii Amaríæ, fílii Azaríæ, fílii Máraioth,
  "4": fílii Zarahíæ, fílii Ozi, fílii Bocci,
  "5": fílii Abísue, fílii Phínees, fílii Eleázar, fílii Aaron sacerdótis ab inítio.
  "6": 'Ipse Esdras ascéndit de Babylóne, et ipse scriba velox in lege Móysi, quam Dóminus Deus dedit Israel: et dedit ei rex secúndum manum Dómini Dei eius super eum, omnem petitiónem eius.'
  "7": Et ascendérunt de fíliis Israel, et de fíliis sacerdótum, et de fíliis Levitárum, et de cantóribus, et de ianitóribus, et de Nathinǽis, in Ierúsalem, anno séptimo Artaxérxis regis.
  "8": Et venérunt in Ierúsalem mense quinto, ipse est annus séptimus regis.
  "9": Quia in primo die mensis primi cœpit ascéndere de Babylóne, et in primo die mensis quinti venit in Ierúsalem, iuxta manum Dei sui bonam super se.
  "10": Esdras enim parávit cor suum, ut investigáret legem Dómini, et fáceret et docéret in Israel præcéptum et iudícium.
  "11": Hoc est autem exémplar epístolæ edícti, quod dedit rex Artaxérxes Esdræ sacerdóti, scribæ erudíto in sermónibus et præcéptis Dómini, et cæremóniis eius in Israel.
  "12": Artaxérxes rex regum Esdræ sacerdóti, scribæ legis Dei cæli doctíssimo, salútem.
  "13": A me decrétum est, ut cuicúmque placúerit in regno meo de pópulo Israel, et de sacerdótibus eius, et de Levítis, ire in Ierúsalem, tecum vadat.
  "14": 'A fácie enim regis, et septem consiliatórum eius, missus es, ut vísites Iudǽam et Ierúsalem in lege Dei tui, quæ est in manu tua:'
  "15": et ut feras argéntum et aurum quod rex, et consiliatóres eius sponte obtulérunt Deo Israel, cuius in Ierúsalem tabernáculum est.
  "16": Et omne argéntum et aurum quodcúmque invéneris in univérsa província Babylónis, et pópulus offérre volúerit, et de sacerdótibus quæ sponte obtúlerint dómui Dei sui, quæ est in Ierúsalem,
  "17": líbere áccipe, et studióse eme de hac pecúnia vítulos, aríetes, agnos, et sacrifícia, et libámina eórum, et offer ea super altáre templi Dei vestri, quod est in Ierúsalem.
  "18": Sed et si quid tibi, et frátribus tuis placúerit de réliquo argénto et auro ut faciátis, iuxta voluntátem Dei vestri fácite.
  "19": Vasa quoque, quæ dantur tibi in ministérium domus Dei tui, trade in conspéctu Dei in Ierúsalem.
  "20": Sed et cétera, quibus opus fúerit in domum Dei tui, quantumcúmque necésse est ut expéndas, dábitur de thesáuro, et de fisco regis,
  "21": et a me. Ego Artaxérxes rex, státui atque decrévi ómnibus custódibus arcæ públicæ, qui sunt trans flumen, ut quodcúmque petíerit a vobis Esdras sacérdos, scriba legis Dei cæli, absque mora detis,
  "22": usque ad argénti talénta centum, et usque ad fruménti coros centum, et usque ad vini batos centum, et usque ad batos ólei centum, sal vero absque mensúra.
  "23": 'Omne, quod ad ritum Dei cæli pértinet, tribuátur diligénter in domo Dei cæli: ne forte irascátur contra regnum regis, et filiórum eius.'
  "24": Vobis quoque notum fácimus de univérsis sacerdótibus, et Levítis, et cantóribus, et ianitóribus, Nathinǽis, et minístris domus Dei huius, ut vectígal, et tribútum, et annónas non habeátis potestátem imponéndi super eos.
  "25": 'Tu autem Esdra, secúndum sapiéntiam Dei tui, quæ est in manu tua, constítue iúdices et prǽsides, ut iúdicent omni pópulo, qui est trans flumen, his vidélicet qui novérunt legem Dei tui: sed et imperítos docéte líbere.'
  "26": Et omnis qui non fécerit legem Dei tui, et legem regis diligénter, iudícium erit de eo sive in mortem, sive in exílium, sive in condemnatiónem substántiæ eius, vel certe in cárcerem.
  "27": Benedíctus Dóminus Deus patrum nostrórum, qui dedit hoc in corde regis ut glorificáret domum Dómini, quæ est in Ierúsalem,
  "28": 'et in me inclinávit misericórdiam suam coram rege et consiliatóribus eius, et univérsis princípibus regis poténtibus: et ego confortátus manu Dómini Dei mei, quæ erat in me, congregávi de Israel príncipes qui ascénderent mecum.'
