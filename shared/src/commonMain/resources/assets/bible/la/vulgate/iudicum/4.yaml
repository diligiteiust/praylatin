bible: vulgate
lang: la
language: Latina
book: Iudicum
chapter: "4"
verses:
  "1": Addiderúntque fílii Israel fácere malum in conspéctu Dómini post mortem Aod,
  "2": 'et trádidit illos Dóminus in manus Iabin regis Chánaan, qui regnávit in Asor: habuítque ducem exércitus sui nómine Sísaram, ipse autem habitábat in Hároseth géntium.'
  "3": 'Clamaverúntque fílii Israel ad Dóminum: nongéntos enim habébat falcátos currus, et per vigínti annos veheménter opprésserat eos.'
  "4": Erat autem Débbora prophétis uxor Lápidoth, quæ iudicábat pópulum in illo témpore.
  "5": 'Et sedébat sub palma, quæ nómine illíus vocabátur, inter Rama et Bethel in monte Ephraim: ascendebántque ad eam fílii Israel in omne iudícium.'
  "6": 'Quæ misit et vocávit Barac fílium Abínoem de Cedes Néphthali: dixítque ad eum: Præcépit tibi Dóminus Deus Israel: Vade, et duc exércitum in montem Thabor, tollésque tecum decem míllia pugnatórum de fíliis Néphthali, et de fíliis Zábulon:'
  "7": ego autem addúcam ad te in loco torréntis Cison, Sísaram príncipem exércitus Iabin, et currus eius, atque omnem multitúdinem, et tradam eos in manu tua.
  "8": 'Dixítque ad eam Barac: Si venis mecum, vadam: si nolúeris veníre mecum, non pergam.'
  "9": 'Quæ dixit ad eum: Ibo quidem tecum, sed in hac vice victória non reputábitur tibi, quia in manu mulíeris tradétur Sísara. Surréxit ítaque Débbora, et perréxit cum Barac in Cedes.'
  "10": Qui, accítis Zábulon et Néphthali, ascéndit cum decem míllibus pugnatórum, habens Débboram in comitátu suo.
  "11": 'Haber autem Cinǽus recésserat quondam a céteris Cinǽis frátribus suis, fíliis Hobab cognáti Móysi: et teténderat tabernácula usque ad vallem, quæ vocátur Sennim, et erat iuxta Cedes.'
  "12": 'Nuntiatúmque est Sísaræ quod ascendísset Barac fílius Abínoem in montem Thabor:'
  "13": et congregávit nongéntos falcátos currus, et omnem exércitum de Hároseth géntium ad torréntem Cison.
  "14": 'Dixítque Débbora ad Barac: Surge, hæc est enim dies, in qua trádidit Dóminus Sísaram in manus tuas: en ipse ductor est tuus. Descéndit ítaque Barac de monte Thabor, et decem míllia pugnatórum cum eo.'
  "15": 'Perterruítque Dóminus Sísaram, et omnes currus eius, universámque multitúdinem in ore gládii ad conspéctum Barac: in tantum, ut Sísara de curru desíliens, pédibus fúgeret,'
  "16": et Barac persequerétur fugiéntes currus, et exércitum usque ad Hároseth géntium, et omnis hóstium multitúdo usque ad interneciónem cáderet.
  "17": Sísara autem fúgiens pervénit ad tentórium Iahel uxóris Haber Cinǽi. Erat enim pax inter Iabin regem Asor, et domum Haber Cinǽi.
  "18": 'Egréssa ígitur Iahel in occúrsum Sísaræ, dixit ad eum: Intra ad me dómine mi: intra, ne tímeas. Qui ingréssus tabernáculum eius, et opértus ab ea pállio,'
  "19": 'dixit ad eam: Da mihi, óbsecro, páululum aquæ, quia sítio valde. Quæ apéruit utrem lactis, et dedit ei bíbere, et opéruit illum.'
  "20": 'Dixítque Sísara ad eam: Sta ante óstium tabernáculi: et cum vénerit áliquis intérrogans te, et dicens: Numquid hic est áliquis? respondébis: Nullus est.'
  "21": 'Tulit ítaque Iahel uxor Haber clavum tabernáculi, assúmens páriter et málleum: et ingréssa abscóndite et cum siléntio, pósuit supra tempus cápitis eius clavum, percussúmque málleo defíxit in cérebrum usque ad terram: qui sopórem morti consócians defécit, et mórtuus est.'
  "22": 'Et ecce Barac sequens Sísaram veniébat: egressáque Iahel in occúrsum eius, dixit ei: Veni, et osténdam tibi virum, quem quæris. Qui cum intrásset ad eam, vidit Sísaram iacéntem mórtuum, et clavum infíxum in témpore eius.'
  "23": 'Humiliávit ergo Deus in die illo Iabin regem Chánaan coram fíliis Israel:'
  "24": qui crescébant quotídie, et forti manu opprimébant Iabin regem Chánaan, donec delérent eum.
