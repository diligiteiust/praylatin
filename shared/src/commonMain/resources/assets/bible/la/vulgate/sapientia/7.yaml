bible: vulgate
lang: la
language: Latina
book: Sapientia
chapter: "7"
verses:
  "1": 'Sum quidem et ego mortális homo, símilis ómnibus, et ex génere terréni illíus, qui prior factus est: et in ventre matris figurátus sum caro:'
  "2": decem ménsium témpore coagulátus sum in sánguine, ex sémine hóminis, et delectaménto somni conveniénte.
  "3": Et ego natus accépi commúnem áerem, et in simíliter factam décidi terram, et primam vocem símilem ómnibus emísi plorans.
  "4": In involuméntis nutrítus sum, et curis magnis.
  "5": Nemo enim ex régibus áliud hábuit nativitátis inítium.
  "6": Unus ergo intróitus est ómnibus ad vitam, et símilis éxitus.
  "7": 'Propter hoc optávi, et datus est mihi sensus: et invocávi, et venit in me spíritus sapiéntiæ:'
  "8": et præpósui illam regnis et sédibus, et divítias nihil esse duxi in comparatióne illíus.
  "9": Nec comparávi illi lápidem pretiósum, quóniam omne aurum in comparatióne illíus aréna est exígua, et tamquam lutum æstimábitur argéntum in conspéctu illíus.
  "10": 'Super salútem et spéciem diléxi illam, et propósui pro luce habére illam: quóniam inexstinguíbile est lumen illíus.'
  "11": Venérunt autem mihi ómnia bona páriter cum illa, et innumerábilis honéstas per manus illíus,
  "12": 'et lætátus sum in ómnibus: quóniam antecedébat me ista sapiéntia, et ignorábam quóniam horum ómnium mater est.'
  "13": Quam sine fictióne dídici, et sine invídia commúnico, et honestátem illíus non abscóndo.
  "14": 'Infinítus enim thesáurus est homínibus: quo qui usi sunt, partícipes facti sunt amicítiæ Dei, propter disciplínæ dona commendáti.'
  "15": 'Mihi autem dedit Deus dícere ex senténtia, et præsúmere digna horum, quæ mihi dantur: quóniam ipse sapiéntiæ dux est, et sapiéntium emendátor.'
  "16": In manu enim illíus et nos et sermónes nostri, et omnis sapiéntia, et óperum sciéntia, et disciplína.
  "17": 'Ipse enim dedit mihi horum, quæ sunt, sciéntiam veram: ut sciam dispositiónem orbis terrárum, et virtútes elementórum,'
  "18": inítium, et consummatiónem, et medietátem témporum, vicissitúdinum permutatiónes, et commutatiónes témporum,
  "19": anni cursus, et stellárum dispositiónes,
  "20": natúras animálium, et iras bestiárum, vim ventórum, et cogitatiónes hóminum, differéntias virgultórum, et virtútes radícum.
  "21": 'Et quæcúmque sunt abscónsa et improvísa dídici: ómnium enim ártifex dócuit me sapiéntia.'
  "22": Est enim in illa spíritus intelligéntiæ, sanctus, únicus, múltiplex, subtílis, disértus, móbilis, incoinquinátus, certus, suávis, amans bonum, acútus, quem nihil vetat, benefáciens,
  "23": humánus, benígnus, stábilis, certus, secúrus, omnem habens virtútem, ómnia prospíciens, et qui cápiat omnes spíritus, intelligíbilis, mundus, subtílis.
  "24": 'Omnibus enim mobílibus mobílior est sapiéntia: attíngit autem ubíque propter suam mundítiam.'
  "25": 'Vapor est enim virtútis Dei, et emanátio quædam est claritátis omnipoténtis Dei sincéra, et ídeo nihil inquinátum in eam incúrrit:'
  "26": candor est enim lucis ætérnæ, et spéculum sine mácula Dei maiestátis, et imágo bonitátis illíus.
  "27": 'Et cum sit una, ómnia potest: et in se pérmanens ómnia ínnovat: et per natiónes in ánimas sanctas se transfert: amícos Dei et prophétas constítuit.'
  "28": Néminem enim díligit Deus, nisi eum, qui cum sapiéntia inhábitat.
  "29": 'Est enim hæc speciósior sole, et super omnem dispositiónem stellárum: luci comparáta, invenítur prior.'
  "30": 'Illi enim succédit nox: sapiéntiam autem non vincit malítia.'
