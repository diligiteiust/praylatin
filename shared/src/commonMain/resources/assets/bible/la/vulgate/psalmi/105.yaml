bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "105"
verses:
  "1": 'Allelúia. Confitémini Dómino quóniam bonus: quóniam in sǽculum misericórdia eius.'
  "2": Quis loquétur poténtias Dómini, audítas fáciet omnes laudes eius?
  "3": Beáti, qui custódiunt iudícium, et fáciunt iustítiam in omni témpore.
  "4": 'Meménto nostri Dómine in beneplácito pópuli tui: vísita nos in salutári tuo:'
  "5": 'ad vidéndum in bonitáte electórum tuórum, ad lætándum in lætítia gentis tuæ: ut laudéris cum hereditáte tua.'
  "6": 'Peccávimus cum pátribus nostris: iniúste égimus, iniquitátem fécimus.'
  "7": 'Patres nostri in Ægýpto non intellexérunt mirabília tua: non fuérunt mémores multitúdinis misericórdiæ tuæ. Et irritavérunt ascendéntes in mare, mare Rubrum.'
  "8": 'Et salvávit eos propter nomen suum: ut notam fáceret poténtiam suam.'
  "9": 'Et incrépuit mare Rubrum, et exsiccátum est: et dedúxit eos in abýssis sicut in desérto.'
  "10": 'Et salvávit eos de manu odiéntium: et redémit eos de manu inimíci.'
  "11": 'Et opéruit aqua tribulántes eos: unus ex eis non remánsit.'
  "12": 'Et credidérunt verbis eius: et laudavérunt laudem eius.'
  "13": 'Cito fecérunt, oblíti sunt óperum eius: et non sustinuérunt consílium eius.'
  "14": 'Et concupiérunt concupiscéntiam in desérto: et tentavérunt Deum in inaquóso.'
  "15": 'Et dedit eis petitiónem ipsórum: et misit saturitátem in ánimas eórum.'
  "16": 'Et irritavérunt Móysen in castris: Aaron sanctum Dómini.'
  "17": 'Apérta est terra, et deglutívit Dathan: et opéruit super congregatiónem Abiron.'
  "18": 'Et exársit ignis in synagóga eórum: flamma combússit peccatóres.'
  "19": 'Et fecérunt vítulum in Horeb: et adoravérunt scúlptile.'
  "20": Et mutavérunt glóriam suam in similitúdinem vítuli comedéntis fœnum.
  "21": Oblíti sunt Deum, qui salvávit eos, qui fecit magnália in Ægýpto,
  "22": 'mirabília in terra Cham: terribília in mari Rubro.'
  "23": 'Et dixit ut dispérderet eos: si non Móyses eléctus eius stetísset in confractióne in conspéctu eius: ut avérteret iram eius ne dispérderet eos:'
  "24": 'et pro níhilo habuérunt terram desiderábilem: non credidérunt verbo eius,'
  "25": 'et murmuravérunt in tabernáculis suis: non exaudiérunt vocem Dómini.'
  "26": 'Et elevávit manum suam super eos, ut prostérneret eos in desérto:'
  "27": 'et ut deíceret semen eórum in natiónibus: et dispérgeret eos in regiónibus.'
  "28": 'Et initiáti sunt Beélphegor: et comedérunt sacrifícia mortuórum.'
  "29": 'Et irritavérunt eum in adinventiónibus suis: et multiplicáta est in eis ruína.'
  "30": 'Et stetit Phínees, et placávit: et cessávit quassátio.'
  "31": Et reputátum est ei in iustítiam, in generatiónem et generatiónem usque in sempitérnum.
  "32": 'Et irritavérunt eum ad Aquas contradictiónis: et vexátus est Móyses propter eos:'
  "33": quia exacerbavérunt spíritum eius, et distínxit in lábiis suis.
  "34": Non disperdidérunt gentes, quas dixit Dóminus illis.
  "35": 'Et commísti sunt inter gentes, et didicérunt ópera eórum:'
  "36": 'et serviérunt sculptílibus eórum: et factum est illis in scándalum.'
  "37": Et immolavérunt fílios suos, et fílias suas dæmóniis.
  "38": 'Et effudérunt sánguinem innocéntem: sánguinem filiórum suórum et filiárum suárum, quas sacrificavérunt sculptílibus Chánaan. Et infécta est terra in sanguínibus,'
  "39": 'et contamináta est in opéribus eórum: et fornicáti sunt in adinventiónibus suis.'
  "40": 'Et irátus est furóre Dóminus in pópulum suum: et abominátus est hereditátem suam.'
  "41": 'Et trádidit eos in manus géntium: et domináti sunt eórum qui odérunt eos.'
  "42": 'Et tribulavérunt eos inimíci eórum, et humiliáti sunt sub mánibus eórum:'
  "43": 'sæpe liberávit eos. Ipsi autem exacerbavérunt eum in consílio suo: et humiliáti sunt in iniquitátibus suis.'
  "44": 'Et vidit cum tribularéntur: et audívit oratiónem eórum.'
  "45": 'Et memor fuit testaménti sui: et pœnítuit eum secúndum multitúdinem misericórdiæ suæ.'
  "46": Et dedit eos in misericórdias in conspéctu ómnium qui céperant eos.
  "47": 'Salvos nos fac Dómine Deus noster: et cóngrega nos de natiónibus: ut confiteámur nómini sancto tuo: et gloriémur in laude tua.'
  "48": 'Benedíctus Dóminus Deus Israel a sǽculo et usque in sǽculum: et dicet omnis pópulus: Fiat, fiat.'
