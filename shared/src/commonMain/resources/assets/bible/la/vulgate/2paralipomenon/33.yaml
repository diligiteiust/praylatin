bible: vulgate
lang: la
language: Latina
book: II Paralipomenon
chapter: "33"
verses:
  "1": Duódecim annórum erat Manásses cum regnáre cœpísset, et quinquagínta quinque annis regnávit in Ierúsalem.
  "2": 'Fecit autem malum coram Dómino, iuxta abominatiónes géntium, quas subvértit Dóminus coram fíliis Israel:'
  "3": 'et convérsus instaurávit excélsa, quæ demolítus fúerat Ezechías pater eius: construxítque aras Báalim, et fecit lucos, et adorávit omnem milítiam cæli, et cóluit eam.'
  "4": 'Ædificávit quoque altária in domo Dómini, de qua díxerat Dóminus: In Ierúsalem erit nomen meum in ætérnum.'
  "5": Ædificávit autem ea cuncto exercítui cæli in duóbus átriis domus Dómini.
  "6": 'Transiréque fecit fílios suos per ignem in valle Benénnom: observábat sómnia, sectabátur augúria, maléficis ártibus inserviébat, habébat secum magos, et incantatóres: multáque mala operátus est coram Dómino ut irritáret eum.'
  "7": 'Scúlptile quoque, et conflátile signum pósuit in domo Dei, de qua locútus est Deus ad David, et ad Salomónem fílium eius, dicens: In domo hac et in Ierúsalem, quam elégi de cunctis tríbubus Israel, ponam nomen meum in sempitérnum.'
  "8": 'Et movéri non fáciam pedem Israel de terra, quam trádidi pátribus eórum: ita dumtáxat si custodíerint fácere quæ præcépi eis, cunctámque legem, et cæremónias atque iudícia, per manum Móysi.'
  "9": Igitur Manásses sedúxit Iudam, et habitatóres Ierúsalem, ut fácerent malum super omnes gentes, quas subvérterat Dóminus a fácie filiórum Israel.
  "10": Locutúsque est Dóminus ad eum, et ad pópulum illíus, et atténdere noluérunt.
  "11": 'Idcírco superindúxit eis príncipes exércitus regis Assyriórum: ceperúntque Manássen, et vinctum caténis, atque compédibus duxérunt in Babylónem.'
  "12": 'Qui postquam coangustátus est, orávit Dóminum Deum suum: et egit pœniténtiam valde coram Deo patrum suórum.'
  "13": 'Deprecatúsque est eum, et obsecrávit inténte: et exaudívit oratiónem eius, reduxítque eum Ierúsalem in regnum suum, et cognóvit Manásses quod Dóminus ipse esset Deus.'
  "14": 'Post hæc ædificávit murum extra civitátem David ad occidéntem Gihon in conválle, ab intróitu portæ píscium per circúitum usque ad Ophel, et exaltávit illum veheménter: constituítque príncipes exércitus in cunctis civitátibus Iuda munítis:'
  "15": 'et ábstulit deos aliénos, et simulácrum de domo Dómini: aras quoque, quas fécerat in monte domus Dómini, et in Ierúsalem, et proiécit ómnia extra urbem.'
  "16": 'Porro instaurávit altáre Dómini, et immolávit super illud víctimas, et pacífica, et laudem: præcepítque Iudæ ut servíret Dómino Deo Israel.'
  "17": Attamen adhuc pópulus immolábat in excélsis Dómino Deo suo.
  "18": Réliqua autem gestórum Manásse, et obsecrátio eius ad Deum suum, verba quoque vidéntium, qui loquebántur ad eum in nómine Dómini Dei Israel, continéntur in sermónibus regum Israel.
  "19": Orátio quoque eius et exaudítio, et cuncta peccáta, atque contémptus, loca étiam, in quibus ædificávit excélsa, et fecit lucos, et státuas ántequam ágeret pœniténtiam, scripta sunt in sermónibus Hózai.
  "20": 'Dormívit ergo Manásses cum pátribus suis, et sepeliérunt eum in domo sua: regnavítque pro eo fílius eius Amon.'
  "21": Vigínti duórum annórum erat Amon cum regnáre cœpísset, et duóbus annis regnávit in Ierúsalem.
  "22": 'Fecítque malum in conspéctu Dómini, sicut fécerat Manásses pater eius: et cunctis idólis, quæ Manásses fúerat fabricátus, immolávit atque servívit.'
  "23": Et non est revéritus fáciem Dómini, sicut revéritus est Manásses pater eius, et multo maióra delíquit.
  "24": Cumque coniurássent advérsus eum servi sui, interfecérunt eum in domo sua.
  "25": Porro réliqua pópuli multitúdo, cæsis iis, qui Amon percússerant, constítuit regem Iosíam fílium eius pro eo.
