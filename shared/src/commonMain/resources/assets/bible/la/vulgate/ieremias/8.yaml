bible: vulgate
lang: la
language: Latina
book: Ieremias
chapter: "8"
verses:
  "1": 'In illo témpore, ait Dóminus: Eícient ossa regum Iuda, et ossa príncipum eius, et ossa sacerdótum, et ossa prophetárum, et ossa eórum, qui habitavérunt Ierúsalem, de sepúlcris suis:'
  "2": 'et expándent ea ad solem, et lunam, et omnem milítiam cæli, quæ dilexérunt, et quibus serviérunt, et post quæ ambulavérunt, et quæ quæsiérunt, et adoravérunt. Non colligéntur, et non sepeliéntur: in sterquilínium super fáciem terræ erunt.'
  "3": Et éligent magis mortem quam vitam omnes qui resídui fúerint de cognatióne hac péssima, in univérsis locis, quæ derelícta sunt, ad quæ eiéci eos, dicit Dóminus exercítuum.
  "4": 'Et dices ad eos: Hæc dicit Dóminus: Numquid qui cadit, non resúrget? et qui avérsus est, non revertétur?'
  "5": Quare ergo avérsus est pópulus iste in Ierúsalem aversióne contentiósa? Apprehendérunt mendácium, et noluérunt revérti.
  "6": 'Atténdi, et auscultávi: nemo quod bonum est lóquitur, nullus est qui agat pœniténtiam super peccáto suo, dicens: Quid feci? omnes convérsi sunt ad cursum suum, quasi equus ímpetu vadens ad prœ́lium.'
  "7": 'Milvus in cælo cognóvit tempus suum: turtur, et hirúndo, et cicónia custodiérunt tempus advéntus sui: pópulus autem meus non cognóvit iudícium Dómini.'
  "8": 'Quómodo dícitis: Sapiéntes nos sumus, et lex Dómini nobíscum est? vere mendácium operátus est stylus mendax scribárum.'
  "9": 'Confúsi sunt sapiéntes, pertérriti et capti sunt: verbum enim Dómini proiecérunt, et sapiéntia nulla est in eis.'
  "10": 'Proptérea dabo mulíeres eórum éxteris, agros eórum herédibus, quia a mínimo usque ad máximum omnes avarítiam sequúntur: a prophéta usque ad sacerdótem cuncti fáciunt mendácium.'
  "11": 'Et sanábant contritiónem fíliæ pópuli mei ad ignomíniam, dicéntes: Pax, pax: cum non esset pax.'
  "12": 'Confúsi sunt, quia abominatiónem fecérunt: quinímmo confusióne non sunt confúsi, et erubéscere nesciérunt: idcírco cadent inter corruéntes, in témpore visitatiónis suæ córruent, dicit Dóminus.'
  "13": 'Cóngregans congregábo eos, ait Dóminus: non est uva in vítibus, et non sunt ficus in ficúlnea, fólium deflúxit: et dedi eis quæ prætergréssa sunt.'
  "14": 'Quare sedémus? conveníte, et ingrediámur civitátem munítam, et sileámus ibi: quia Dóminus Deus noster silére nos fecit, et potum dedit nobis aquam fellis: peccávimus enim Dómino.'
  "15": 'Exspectávimus pacem, et non erat bonum: tempus medélæ, et ecce formído.'
  "16": 'A Dan audítus est frémitus equórum eius: a voce hinnítuum pugnatórum eius commóta est omnis terra: et venérunt, et devoravérunt terram, et plenitúdinem eius: urbem et habitatóres eius.'
  "17": 'Quia ecce ego mittam vobis serpéntes régulos, quibus non est incantátio: et mordébunt vos, ait Dóminus.'
  "18": Dolor meus super dolórem, in me cor meum mœrens.
  "19": 'Ecce vox clamóris fíliæ pópuli mei de terra longínqua: Numquid Dóminus non est in Sion? aut rex eius non est in ea? Quare ergo me ad iracúndiam concitavérunt in sculptílibus suis, et in vanitátibus aliénis?'
  "20": 'Tránsiit messis, finíta est æstas: et nos salváti non sumus.'
  "21": Super contritióne fíliæ pópuli mei contrítus sum, et contristátus, stupor obtínuit me.
  "22": Numquid resína non est in Gálaad? aut médicus non est ibi? quare ígitur non est obdúcta cicátrix fíliæ pópuli mei?
