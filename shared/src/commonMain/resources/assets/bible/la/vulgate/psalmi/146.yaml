bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "146"
verses:
  "1": 'Allelúia. Laudáte Dóminum, quóniam bonus est psalmus: Deo nostro sit iucúnda, decoráque laudátio.'
  "2": 'Ædíficans Ierúsalem Dóminus: dispersiónes Israélis congregábit.'
  "3": 'Qui sanat contrítos corde: et álligat contritiónes eórum:'
  "4": 'Qui númerat multitúdinem stellárum: et ómnibus eis nómina vocat.'
  "5": 'Magnus Dóminus noster, et magna virtus eius: et sapiéntiæ eius non est númerus.'
  "6": 'Suscípiens mansuétos Dóminus: humílians autem peccatóres usque ad terram.'
  "7": 'Præcínite Dómino in confessióne: psállite Deo nostro in cíthara.'
  "8": 'Qui óperit cælum núbibus: et parat terræ plúviam. Qui prodúcit in móntibus fœnum, et herbam servitúti hóminum.'
  "9": Qui dat iuméntis escam ipsórum, et pullis corvórum invocántibus eum.
  "10": 'Non in fortitúdine equi voluntátem habébit: nec in tíbiis viri beneplácitum erit ei.'
  "11": 'Beneplácitum est Dómino super timéntes eum: et in eis, qui sperant super misericórdia eius.'
