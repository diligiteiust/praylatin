bible: vulgate
lang: la
language: Latina
book: Ezechiel
chapter: "9"
verses:
  "1": 'Et clamávit in áuribus meis voce magna, dicens: Appropinquavérunt visitatiónes urbis, et unusquísque vas interfectiónis habet in manu sua.'
  "2": 'Et ecce sex viri veniébant de via portæ superióris, quæ réspicit ad aquilónem, et uniuscuiúsque vas intéritus in manu eius: vir quoque unus in médio eórum vestítus erat líneis, et atramentárium scriptóris ad renes eius: et ingréssi sunt, et stetérunt iuxta altáre ǽreum.'
  "3": 'Et glória Dómini Israel assúmpta est de cherub, quæ erat super eum ad limen domus: et vocávit virum, qui indútus erat líneis, et atramentárium scriptóris habébat in lumbis suis.'
  "4": 'Et dixit Dóminus ad eum: Transi per médiam civitátem in médio Ierúsalem: et signa thau super frontes virórum geméntium, et doléntium super cunctis abominatiónibus, quæ fiunt in médio eius.'
  "5": 'Et illis dixit, audiénte me: Transíte per civitátem sequéntes eum, et percútite: non parcat óculus vester, neque misereámini.'
  "6": 'Senem, adolescéntulum et vírginem, párvulum et mulíeres interfícite usque ad interneciónem: omnem autem, super quem vidéritis thau, ne occidátis, et a sanctuário meo incípite. Cœpérunt ergo a viris senióribus, qui erant ante fáciem domus.'
  "7": 'Et dixit ad eos: Contamináte domum, et impléte átria interféctis: egredímini. Et egréssi sunt, et percutiébant eos, qui erant in civitáte.'
  "8": 'Et cæde compléta, remánsi ego, ruíque super fáciem meam, et clamans aio: Heu, heu, heu Dómine Deus: ergóne dispérdes omnes relíquias Israel, effúndens furórem tuum super Ierúsalem?'
  "9": 'Et dixit ad me: Iníquitas domus Israel, et Iuda, magna est nimis valde, et repléta est terra sanguínibus, et cívitas repléta est aversióne: dixérunt enim: Derelíquit Dóminus terram, et Dóminus non videt.'
  "10": 'Igitur et meus non parcet óculus, neque miserébor: viam eórum super caput eórum reddam.'
  "11": 'Et ecce vir, qui erat indútus líneis, qui habébat atramentárium in dorso suo, respóndit verbum, dicens: Feci sicut præcepísti mihi.'
