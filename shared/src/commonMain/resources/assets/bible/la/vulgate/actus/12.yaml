bible: vulgate
lang: la
language: Latina
book: Actus Apostolorum
chapter: "12"
verses:
  "1": Eódem autem témpore misit Heródes rex manus, ut afflígeret quosdam de Ecclésia.
  "2": Occídit autem Iacóbum fratrem Ioánnis gládio.
  "3": Videns autem quia placéret Iudǽis, appósuit ut apprehénderet et Petrum. Erant autem dies Azymórum.
  "4": Quem cum apprehendísset, misit in cárcerem, tradens quátuor quaterniónibus mílitum custodiéndum, volens post Pascha prodúcere eum pópulo.
  "5": Et Petrus quidem servabátur in cárcere. Orátio autem fiébat sine intermissióne ab Ecclésia ad Deum pro eo.
  "6": 'Cum autem productúrus eum esset Heródes, in ipsa nocte erat Petrus dórmiens inter duos mílites, vinctus caténis duábus: et custódes ante óstium custodiébant cárcerem.'
  "7": 'Et ecce ángelus Dómini ástitit, et lumen refúlsit in habitáculo: percussóque látere Petri, excitávit eum, dicens: Surge velóciter. Et cecidérunt caténæ de mánibus eius.'
  "8": 'Dixit autem ángelus ad eum: Præcíngere, et cálcea te cáligas tuas. Et fecit sic. Et dixit illi: Circúmda tibi vestiméntum tuum, et séquere me.'
  "9": 'Et éxiens sequebátur eum, et nesciébat quia verum est, quod fiébat per ángelum: existimábat autem se visum vidére.'
  "10": 'Transeúntes autem primam et secúndam custódiam, venérunt ad portam férream, quæ ducit ad civitátem: quæ ultro apérta est eis. Et exeúntes processérunt vicum unum: et contínuo discéssit ángelus ab eo.'
  "11": 'Et Petrus ad se revérsus, dixit: Nunc scio vere quia misit Dóminus ángelum suum, et erípuit me de manu Heródis, et de omni exspectatióne plebis Iudæórum.'
  "12": Consideránsque venit ad domum Maríæ matris Ioánnis, qui cognominátus est Marcus, ubi erant multi congregáti, et orántes.
  "13": Pulsánte autem eo óstium iánuæ, procéssit puélla ad audiéndum, nómine Rhode.
  "14": Et ut cognóvit vocem Petri, præ gáudio non apéruit iánuam, sed intro currens nuntiávit stare Petrum ante iánuam.
  "15": 'At illi dixérunt ad eam: Insánis. Illa autem affirmábat sic se habére. Illi autem dicébant: Angelus eius est.'
  "16": Petrus autem perseverábat pulsans. Cum autem aperuíssent, vidérunt eum, et obstupuérunt.
  "17": 'Annuens autem eis manu ut tacérent, narrávit quómodo Dóminus eduxísset eum de cárcere, dixítque: Nuntiáte Iacóbo, et frátribus hæc. Et egréssus ábiit in álium locum.'
  "18": Facta autem die, erat non parva turbátio inter mílites, quidnam factum esset de Petro.
  "19": 'Heródes autem cum requisísset eum et non invenísset, inquisitióne facta de custódibus, iussit eos duci: descendénsque a Iudǽa in Cæsaréam, ibi commorátus est.'
  "20": Erat autem irátus Týriis, et Sidóniis. At illi unánimes venérunt ad eum, et persuáso Blasto, qui erat super cubículum regis, postulábant pacem, eo quod aleréntur regiónes eórum ab illo.
  "21": Statúto autem die Heródes vestítus veste régia, sedit pro tribunáli, et concionabátur ad eos.
  "22": 'Pópulus autem acclamábat: Dei voces, et non hóminis.'
  "23": 'Conféstim autem percússit eum ángelus Dómini, eo quod non dedísset honórem Deo: et consúmptus a vérmibus, exspirávit.'
  "24": Verbum autem Dómini crescébat, et multiplicabátur.
  "25": Bárnabas autem et Saulus revérsi sunt ab Ierosólymis expléto ministério assúmpto Ioánne, qui cognominátus est Marcus.
