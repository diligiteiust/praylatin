bible: vulgate
lang: la
language: Latina
book: Iob
chapter: "37"
verses:
  "1": Super hoc expávit cor meum, et emótum est de loco suo.
  "2": Audíte auditiónem in terróre vocis eius, et sonum de ore illíus procedéntem.
  "3": Subter omnes cælos ipse consíderat, et lumen illíus super términos terræ.
  "4": 'Post eum rúgiet sónitus, tonábit voce magnitúdinis suæ: et non investigábitur, cum audíta fúerit vox eius.'
  "5": Tonábit Deus in voce sua mirabíliter, qui facit magna et inscrutabília.
  "6": Qui prǽcipit nivi ut descéndat in terram, et híemis plúviis, et imbri fortitúdinis suæ.
  "7": Qui in manu ómnium hóminum signat, ut nóverint sínguli ópera sua.
  "8": Ingrediétur béstia latíbulum, et in antro suo morábitur.
  "9": Ab interióribus egrediétur tempéstas, et ab Arctúro frigus.
  "10": Flante Deo concréscit gelu, et rursum latíssimæ fundúntur aquæ.
  "11": Fruméntum desíderat nubes, et nubes spargunt lumen suum.
  "12": 'Quæ lustrant per circúitum, quocúmque eas volúntas gubernántis dúxerit, ad omne quod præcéperit illis super fáciem orbis terrárum:'
  "13": sive in una tribu, sive in terra sua, sive in quocúmque loco misericórdiæ suæ eas iússerit inveníri.
  "14": 'Auscúlta hæc Iob: sta, et consídera mirabília Dei.'
  "15": Numquid scis quando præcéperit Deus plúviis, ut osténderent lucem núbium eius?
  "16": Numquid nosti sémitas núbium magnas, et perféctas sciéntias?
  "17": Nonne vestiménta tua cálida sunt, cum perfláta fúerit terra austro?
  "18": Tu fórsitan cum eo fabricátus es cælos, qui solidíssimi quasi ære fusi sunt.
  "19": 'Osténde nobis quid dicámus illi: nos quippe invólvimur ténebris.'
  "20": Quis narrábit ei quæ loquor? étiam si locútus fúerit homo, devorábitur.
  "21": 'At nunc non vident lucem: súbito aer cogétur in nubes, et ventus tránsiens fugábit eas.'
  "22": Ab aquilóne aurum venit, et ad Deum formidolósa laudátio.
  "23": 'Digne eum inveníre non póssumus: magnus fortitúdine, et iudício, et iustítia, et enarrári non potest.'
  "24": Ideo timébunt eum viri, et non audébunt contemplári omnes qui sibi vidéntur esse sapiéntes.
