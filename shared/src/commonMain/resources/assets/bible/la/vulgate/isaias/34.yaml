bible: vulgate
lang: la
language: Latina
book: Isaias
chapter: "34"
verses:
  "1": 'Accédite gentes, et audíte: et pópuli atténdite: áudiat terra, et plenitúdo eius, orbis, et omne germen eius.'
  "2": 'Quia indignátio Dómini super omnes gentes, et furor super univérsam milítiam eórum: interfécit eos, et dedit eos in occisiónem.'
  "3": 'Interfécti eórum proiciéntur, et de cadavéribus eórum ascéndet fœtor: tabéscent montes a sánguine eórum.'
  "4": 'Et tabéscet omnis milítia cælórum, et complicabúntur sicut liber cæli: et omnis milítia eórum défluet sicut défluit fólium de vínea et de ficu.'
  "5": 'Quóniam inebriátus est in cælo gládius meus: ecce super Idumǽam descéndet, et super pópulum interfectiónis meæ ad iudícium.'
  "6": 'Gládius Dómini replétus est sánguine, incrassátus est ádipe, de sánguine agnórum et hircórum, de sánguine medullatórum aríetum: víctima enim Dómini in Bosra, et interféctio magna in terra Edom.'
  "7": 'Et descéndent unicórnes cum eis, et tauri cum poténtibus: inebriábitur terra eórum sánguine, et humus eórum ádipe pínguium.'
  "8": Quia dies ultiónis Dómini, annus retributiónum iudícii Sion.
  "9": 'Et converténtur torréntes eius in picem, et humus eius in sulphur: et erit terra eius in picem ardéntem.'
  "10": 'Nocte et die non exstinguétur, in sempitérnum ascéndet fumus eius: a generatióne in generatiónem desolábitur, in sǽcula sæculórum non erit tránsiens per eam.'
  "11": 'Et possidébunt illam onocrótalus et erícius: ibis et corvus habitábunt in ea: et extendétur super eam mensúra, ut redigátur ad níhilum, et perpendículum in desolatiónem.'
  "12": 'Nóbiles eius non erunt ibi: regem pótius invocábunt, et omnes príncipes eius erunt in níhilum.'
  "13": 'Et oriéntur in dómibus eius spinæ et urtícæ, et paliúrus in munitiónibus eius: et erit cubíle dracónum, et páscua struthiónum.'
  "14": 'Et occúrrent dæmónia onocentáuris, et pilósus clamábit alter ad álterum: ibi cubávit lámia, et invénit sibi réquiem.'
  "15": 'Ibi hábuit fóveam erícius, et enutrívit cátulos, et circumfódit, et fovit in umbra eius: illuc congregáti sunt milvi, alter ad álterum.'
  "16": 'Requírite diligénter in libro Dómini, et légite: unum ex eis non défuit, alter álterum non quæsívit: quia quod ex ore meo procédit, ille mandávit, et spíritus eius ipse congregávit ea.'
  "17": 'Et ipse misit eis sortem, et manus eius divísit eam illis in mensúram: usque in ætérnum possidébunt eam, in generatiónem et generatiónem habitábunt in ea.'
