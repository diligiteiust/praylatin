bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "100"
verses:
  "1": 'Psalmus ipsi David. Misericórdiam, et iudícium cantábo tibi Dómine: psallam,'
  "2": et intélligam in via immaculáta, quando vénies ad me. Perambulábam in innocéntia cordis mei, in médio domus meæ.
  "3": 'Non proponébam ante óculos meos rem iniústam: faciéntes prævaricatiónes odívi. Non adhǽsit mihi'
  "4": 'cor pravum: declinántem a me malígnum non cognoscébam.'
  "5": 'Detrahéntem secréto próximo suo, hunc persequébar: supérbo óculo, et insatiábili corde, cum hoc non edébam.'
  "6": 'Oculi mei ad fidéles terræ, ut sédeant mecum: ámbulans in via immaculáta, hic mihi ministrábat.'
  "7": 'Non habitábit in médio domus meæ qui facit supérbiam: qui lóquitur iníqua, non diréxit in conspéctu oculórum meórum.'
  "8": 'In matutíno interficiébam omnes peccatóres terræ: ut dispérderem de civitáte Dómini omnes operántes iniquitátem.'
