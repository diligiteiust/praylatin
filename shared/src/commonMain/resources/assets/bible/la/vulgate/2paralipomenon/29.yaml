bible: vulgate
lang: la
language: Latina
book: II Paralipomenon
chapter: "29"
verses:
  "1": 'Igitur Ezechías regnáre cœpit, cum vigínti quinque esset annórum, et vigínti novem annis regnávit in Ierúsalem: nomen matris eius Abía, fília Zacharíæ.'
  "2": Fecítque quod erat plácitum in conspéctu Dómini, iuxta ómnia quæ fécerat David pater eius.
  "3": Ipse anno et mense primo regni sui apéruit valvas domus Dómini, et instaurávit eas.
  "4": Adduxítque sacerdótes atque Levítas, et congregávit eos in platéam orientálem.
  "5": 'Dixítque ad eos: Audíte me Levítæ, et sanctificámini: mundáte domum Dómini Dei patrum vestrórum, et auférte omnem immundítiam de sanctuário.'
  "6": 'Peccavérunt patres nostri, et fecérunt malum in conspéctu Dómini Dei nostri, derelinquéntes eum: avertérunt fácies suas a tabernáculo Dómini, et præbuérunt dorsum.'
  "7": Clausérunt óstia, quæ erant in pórticu, et exstinxérunt lucérnas, incensúmque non adolevérunt, et holocáusta non obtulérunt in sanctuário Deo Israel.
  "8": Concitátus est ítaque furor Dómini super Iudam et Ierúsalem, tradidítque eos in commotiónem, et in intéritum, et in síbilum, sicut ipsi cérnitis óculis vestris.
  "9": 'En corruérunt patres nostri gládiis: fílii nostri, et fíliæ nostræ, et cóniuges captívæ ductæ sunt propter hoc scelus.'
  "10": Nunc ergo placet mihi ut ineámus fœdus cum Dómino Deo Israel, et avértet a nobis furórem iræ suæ.
  "11": 'Fílii mei nolíte neglígere: vos elégit Dóminus ut stetis coram eo, et ministrétis illi, colatísque eum, et cremétis ei incénsum.'
  "12": 'Surrexérunt ergo Levítæ: Mahath fílius Amásai, et Ioel fílius Azaríæ de fíliis Caath: porro de fíliis Merári, Cis fílius Abdi, et Azarías fílius Ialáleel. De fíliis autem Gersom, Ioah fílius Zemma, et Eden fílius Ioah.'
  "13": 'At vero de fíliis Elísaphan, Samri, et Iáhiel. De fíliis quoque Asaph, Zacharías, et Mathanías:'
  "14": 'necnon de fíliis Heman, Iáhiel, et Sémei: sed et de fíliis Idithun, Semeías, et Oziel.'
  "15": Congregaverúntque fratres suos, et sanctificáti sunt, et ingréssi sunt iuxta mandátum regis et impérium Dómini, ut expiárent domum Dei.
  "16": Sacerdótes quoque ingréssi templum Dómini ut sanctificárent illud, extulérunt omnem immundítiam, quam intro repérerant in vestíbulo domus Dómini, quam tulérunt Levítæ, et asportavérunt ad torréntem Cedron foras.
  "17": Cœpérunt autem prima die mensis primi mundáre, et in die octávo eiúsdem mensis ingréssi sunt pórticum templi Dómini, expiaverúntque templum diébus octo, et in die sextadécima mensis eiúsdem, quod cœ́perant implevérunt.
  "18": 'Ingréssi quoque sunt ad Ezechíam regem, et dixérunt ei: Sanctificávimus omnem domum Dómini, et altáre holocáusti, vasáque eius, necnon et mensam propositiónis cum ómnibus vasis suis,'
  "19": 'cunctámque templi supelléctilem, quam pollúerat rex Achaz in regno suo, postquam prævaricátus est: et ecce expósita sunt ómnia coram altáre Dómini.'
  "20": 'Consurgénsque dilúculo Ezechías rex, adunávit omnes príncipes civitátis, et ascéndit in domum Dómini:'
  "21": obtulerúntque simul tauros septem, et aríetes septem, agnos septem, et hircos septem pro peccáto, pro regno, pro sanctuário, pro Iuda, dixítque sacerdótibus fíliis Aaron, ut offérrent super altáre Dómini.
  "22": 'Mactavérunt ígitur tauros, et suscepérunt sánguinem sacerdótes, et fudérunt illum super altáre: mactavérunt étiam aríetes, et illórum sánguinem super altáre fudérunt, immolaverúntque agnos, et fudérunt super altáre sánguinem.'
  "23": 'Applicuérunt hircos pro peccáto coram rege, et univérsa multitúdine, imposuerúntque manus suas super eos:'
  "24": 'et immolavérunt illos sacerdótes, et aspersérunt sánguinem eórum coram altáre pro piáculo univérsi Israélis: pro omni quippe Israel præcéperat rex ut holocáustum fíeret, et pro peccáto.'
  "25": 'Constítuit quoque Levítas in domo Dómini cum cýmbalis, et psaltériis, et cítharis secúndum dispositiónem David regis, et Gad vidéntis, et Nathan prophétæ: síquidem Dómini præcéptum fuit per manum prophetárum eius.'
  "26": Steterúntque Levítæ tenéntes órgana David, et sacerdótes tubas.
  "27": 'Et iussit Ezechías ut offérrent holocáusta super altáre: cumque offerréntur holocáusta, cœpérunt laudes cánere Dómino, et clángere tubis, atque in divérsis órganis, quæ David rex Israel præparáverat, concrepáre.'
  "28": Omni autem turba adoránte, cantóres, et ii, qui tenébant tubas, erant in offício suo donec complerétur holocáustum.
  "29": Cumque finíta esset oblátio, incurvátus est rex, et omnes qui erant cum eo, et adoravérunt.
  "30": 'Præcepítque Ezechías, et príncipes Levítis, ut laudárent Dóminum sermónibus David, et Asaph vidéntis: qui laudavérunt eum magna lætítia, et incurváto genu adoravérunt.'
  "31": 'Ezechías autem étiam hæc áddidit: Impléstis manus vestras Dómino, accédite, et offérte víctimas, et laudes in domo Dómini. Obtulit ergo univérsa multitúdo hóstias, et laudes, et holocáusta, mente devóta.'
  "32": 'Porro númerus holocaustórum, quæ óbtulit multitúdo, hic fuit: tauros septuagínta, aríetes centum, agnos ducéntos.'
  "33": Sanctificaverúntque Dómino boves sexcéntos, et oves tria míllia.
  "34": 'Sacerdótes vero pauci erant, nec póterant suffícere ut pelles holocaustórum detráherent: unde et Levítæ fratres eórum adiuvérunt eos, donec implerétur opus, et sanctificaréntur antístites: Levítæ quippe facilióri ritu sanctificántur, quam sacerdótes.'
  "35": 'Fuérunt ergo holocáusta plúrima, ádipes pacificórum, et libámina holocaustórum: et complétus est cultus domus Dómini.'
  "36": Lætatúsque est Ezechías, et omnis pópulus, eo quod ministérium Dómini esset explétum. De repénte quippe hoc fíeri placúerat.
