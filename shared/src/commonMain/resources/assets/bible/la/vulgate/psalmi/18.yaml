bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "18"
verses:
  "1": In finem. Psalmus David.
  "2": Cæli enárrant glóriam Dei, et ópera mánuum eius annúntiat firmaméntum.
  "3": Dies diéi erúctat verbum, et nox nocti índicat sciéntiam.
  "4": Non sunt loquélæ, neque sermónes, quorum non audiántur voces eórum.
  "5": 'In omnem terram exívit sonus eórum: et in fines orbis terræ verba eórum.'
  "6": 'In sole pósuit tabernáculum suum: et ipse tamquam sponsus procédens de thálamo suo: exsultávit ut gigas ad curréndam viam,'
  "7": 'a summo cælo egréssio eius: et occúrsus eius usque ad summum eius: nec est qui se abscóndat a calóre eius.'
  "8": 'Lex Dómini immaculáta, convértens ánimas: testimónium Dómini fidéle, sapiéntiam præstans párvulis.'
  "9": 'Iustítiæ Dómini rectæ, lætificántes corda: præcéptum Dómini lúcidum, illúminans óculos.'
  "10": 'Timor Dómini sanctus, pérmanens in sǽculum sǽculi: iudícia Dómini vera, iustificáta in semetípsa.'
  "11": 'Desiderabília super aurum et lápidem pretiósum multum: et dulcióra super mel et favum.'
  "12": 'Etenim servus tuus custódit ea: in custodiéndis illis retribútio multa.'
  "13": 'Delícta quis intélligit? ab occúltis meis munda me:'
  "14": 'et ab aliénis parce servo tuo. Si mei non fúerint domináti, tunc immaculátus ero: et emundábor a delícto máximo.'
  "15": Et erunt ut compláceant elóquia oris mei, et meditátio cordis mei in conspéctu tuo semper. Dómine adiútor meus, et redémptor meus.
