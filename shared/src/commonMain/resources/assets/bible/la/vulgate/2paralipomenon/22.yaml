bible: vulgate
lang: la
language: Latina
book: II Paralipomenon
chapter: "22"
verses:
  "1": 'Constituérunt autem habitatóres Ierúsalem Ochozíam fílium eius mínimum, regem pro eo: omnes enim maióres natu, qui ante eum fúerant, interfécerant latrónes Arabum, qui irrúerant in castra: regnavítque Ochozías fílius Ioram regis Iuda.'
  "2": 'Quadragínta duórum annórum erat Ochozías cum regnáre cœpísset, et uno anno regnávit in Ierúsalem: et nomen matris eius Athalía fília Amri.'
  "3": 'Sed et ipse ingréssus est per vias domus Achab: mater enim eius ímpulit eum ut ímpie ágeret.'
  "4": 'Fecit ígitur malum in conspéctu Dómini, sicut domus Achab: ipsi enim fuérunt ei consiliárii post mortem patris sui, in intéritum eius:'
  "5": 'ambulavítque in consíliis eórum. Et perréxit cum Ioram fílio Achab rege Israel in bellum contra Házael regem Sýriæ in Ramoth Gálaad: vulneraverúntque Syri Ioram.'
  "6": 'Qui revérsus est ut curarétur in Iézrahel: multas enim plagas accéperat in supradícto certámine. Igitur Ochozías fílius Ioram rex Iuda, descéndit ut invíseret Ioram fílium Achab in Iézrahel ægrotántem.'
  "7": 'Voluntátis quippe fuit Dei advérsus Ochozíam, ut veníret ad Ioram: et cum venísset, et egrederétur cum eo advérsum Iehu fílium Namsi, quem unxit Dóminus ut deléret domum Achab.'
  "8": Cum ergo evérteret Iehu domum Achab, invénit príncipes Iuda, et fílios fratrum Ochozíæ, qui ministrábant ei, et interfécit illos.
  "9": 'Ipsum quoque perquírens Ochozíam, comprehéndit latitántem in Samaría: adductúmque ad se, occídit, et sepeliérunt eum: eo quod esset fílius Iósaphat, qui quæsíerat Dóminum in toto corde suo. Nec erat ultra spes áliqua ut de stirpe quis regnáret Ochozíæ:'
  "10": síquidem Athalía mater eius, videns quod mórtuus esset fílius suus, surréxit, et interfécit omnem stirpem régiam domus Ioram.
  "11": 'Porro Iósabeth fília regis tulit Ioas fílium Ochozíæ, et furáta est eum de médio filiórum regis, cum interficeréntur: abscondítque eum cum nutríce sua in cubículo lectulórum: Iósabeth autem, quæ abscónderat eum, erat fília regis Ioram, uxor Ióiadæ pontíficis, soror Ochozíæ, et idcírco Athalía non interfécit eum.'
  "12": Fuit ergo cum eis in domo Dei abscónditus sex annis, quibus regnávit Athalía super terram.
