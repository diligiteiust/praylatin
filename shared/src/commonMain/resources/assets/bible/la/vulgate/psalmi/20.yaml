bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "20"
verses:
  "1": In finem. Psalmus David.
  "2": 'Dómine in virtúte tua lætábitur rex: et super salutáre tuum exsultábit veheménter.'
  "3": 'Desidérium cordis eius tribuísti ei: et voluntáte labiórum eius non fraudásti eum.'
  "4": 'Quóniam prævenísti eum in benedictiónibus dulcédinis: posuísti in cápite eius corónam de lápide pretióso.'
  "5": 'Vitam pétiit a te: et tribuísti ei longitúdinem diérum in sǽculum, et in sǽculum sǽculi.'
  "6": 'Magna est glória eius in salutári tuo: glóriam et magnum decórem impónes super eum.'
  "7": 'Quóniam dabis eum in benedictiónem in sǽculum sǽculi: lætificábis eum in gáudio cum vultu tuo.'
  "8": 'Quóniam rex sperat in Dómino: et in misericórdia Altíssimi non commovébitur.'
  "9": 'Inveniátur manus tua ómnibus inimícis tuis: déxtera tua invéniat omnes qui te odérunt.'
  "10": 'Pones eos ut clíbanum ignis in témpore vultus tui: Dóminus in ira sua conturbábit eos, et devorábit eos ignis.'
  "11": 'Fructum eórum de terra perdes: et semen eórum a fíliis hóminum.'
  "12": 'Quóniam declinavérunt in te mala: cogitavérunt consília, quæ non potuérunt stabilíre.'
  "13": 'Quóniam pones eos dorsum: in relíquiis tuis præparábis vultum eórum.'
  "14": 'Exaltáre Dómine in virtúte tua: cantábimus et psallémus virtútes tuas.'
