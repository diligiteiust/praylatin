bible: vulgate
lang: la
language: Latina
book: Canticum Canticorum
chapter: "7"
verses:
  "1": Quid vidébis in Sulamíte, nisi choros castrórum? Quam pulchri sunt gressus tui in calceaméntis, fília príncipis! Iunctúræ fémorum tuórum sicut monília, quæ fabricáta sunt manu artíficis.
  "2": Umbilícus tuus crater tornátilis, numquam índigens póculis. Venter tuus sicut acérvus trítici vallátus líliis.
  "3": Duo úbera tua sicut duo hínnuli gemélli cápreæ.
  "4": 'Collum tuum sicut turris ebúrnea: óculi tui sicut piscínæ in Hésebon, quæ sunt in porta fíliæ multitúdinis. Nasus tuus sicut turris Líbani, quæ réspicit contra Damáscum.'
  "5": 'Caput tuum ut Carmélus: et comæ cápitis tui sicut púrpura regis vincta canálibus.'
  "6": Quam pulchra es, et quam decóra caríssima, in delíciis!
  "7": Statúra tua assimiláta est palmæ, et úbera tua botris.
  "8": 'Dixi: Ascéndam in palmam, et apprehéndam fructus eius: et erunt úbera tua sicut botri víneæ, et odor oris tui sicut malórum.'
  "9": Guttur tuum sicut vinum óptimum, dignum dilécto meo ad potándum, labiísque et déntibus illíus ad ruminándum.
  "10": Ego dilécto meo, et ad me convérsio eius.
  "11": Veni dilécte mi, egrediámur in agrum, commorémur in villis.
  "12": 'Mane surgámus ad víneas: videámus si flóruit vínea, si flores fructus partúriunt, si floruérunt mala púnica: ibi dabo tibi úbera mea.'
  "13": 'Mandrágoræ dedérunt odórem. In portis nostris ómnia poma: nova et vétera, dilécte mi, servávi tibi.'
