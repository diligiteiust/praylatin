bible: vulgate
lang: la
language: Latina
book: II Samuelis
chapter: "8"
verses:
  "1": Factum est autem post hæc, percússit David Philísthiim, et humiliávit eos, et tulit David frenum tribúti de manu Philísthiim.
  "2": 'Et percússit Moab, et mensus est eos funículo, coǽquans terræ: mensus est autem duos funículos, unum ad occidéndum, et unum ad vivificándum: factúsque est Moab David sérviens sub tribúto.'
  "3": Et percússit David Adarézer fílium Rohob regem Soba, quando proféctus est ut dominarétur super flumen Euphráten.
  "4": 'Et captis David ex parte eius mille septingéntis equítibus, et vigínti míllibus péditum, subnervávit omnes iugáles cúrruum: derelíquit autem ex eis centum currus.'
  "5": 'Venit quoque Sýria Damásci, ut præsídium ferret Adarézer regi Soba: et percússit David de Sýria vigínti duo míllia virórum.'
  "6": 'Et pósuit David præsídium in Sýria Damásci: factáque est Sýria David sérviens sub tribúto: servavítque Dóminus David in ómnibus ad quæcúmque proféctus est.'
  "7": Et tulit David arma áurea, quæ habébant servi Adarézer, et détulit ea in Ierúsalem.
  "8": Et de Bete et de Beroth, civitátibus Adarézer, tulit rex David æs multum nimis.
  "9": Audívit autem Thou rex Emath, quod percussísset David omne robur Adarézer,
  "10": 'et misit Thou Ioram fílium suum ad regem David, ut salutáret eum congrátulans, et grátias ágeret: eo quod expugnásset Adarézer, et percussísset eum. Hostis quippe erat Thou Adarézer, et in manu eius erant vasa áurea, et vasa argéntea, et vasa ǽrea:'
  "11": quæ et ipsa sanctificávit rex David Dómino cum argénto et auro, quæ sanctificáverat de univérsis géntibus, quas subégerat,
  "12": de Sýria, et Moab, et fíliis Ammon, et Philísthiim, et Amalec, et de manúbiis Adarézer fílii Rohob regis Soba.
  "13": 'Fecit quoque sibi David nomen cum reverterétur capta Sýria in valle Salinárum, cæsis decem et octo míllibus:'
  "14": 'et pósuit in Idumǽa custódes, statuítque præsídium: et facta est univérsa Idumǽa sérviens David, et servávit Dóminus David in ómnibus ad quæcúmque proféctus est.'
  "15": 'Et regnávit David super omnem Israel: faciébat quoque David iudícium et iustítiam omni pópulo suo.'
  "16": 'Ioab autem fílius Sárviæ erat super exércitum: porro Iósaphat fílius Ahilud erat a commentáriis:'
  "17": 'et Sadoc fílius Achitob, et Achímelech fílius Abíathar, erant sacerdótes: et Saraías, scriba:'
  "18": 'Banaías autem fílius Ióiadæ super Ceréthi et Pheléthi: fílii autem David sacerdótes erant.'
