bible: vulgate
lang: la
language: Latina
book: ad Romanos
chapter: "16"
verses:
  "1": 'Comméndo autem vobis Phœben sorórem nostram, quæ est in ministério ecclésiæ, quæ est in Cenchris:'
  "2": 'ut eam suscipiátis in Dómino digne sanctis: et assistátis ei in quocúmque negótio vestri indigúerit: étenim ipsa quoque ástitit multis, et mihi ipsi.'
  "3": Salutáte Priscam, et Aquilam adiutóres meos in Christo Iesu
  "4": '(qui pro ánima mea suas cervíces supposuérunt: quibus non solus ego grátias ago, sed et cunctæ ecclésiæ géntium),'
  "5": et domésticam ecclésiam eórum. Salutáte Epǽnetum diléctum mihi, qui est primitívus Asiæ in Christo.
  "6": Salutáte Maríam, quæ multum laborávit in vobis.
  "7": 'Salutáte Andrónicum, et Iúniam cognátos, et concaptívos meos: qui sunt nóbiles in Apóstolis, qui et ante me fuérunt in Christo.'
  "8": Salutáte Ampliátum dilectíssimum mihi in Dómino.
  "9": Salutáte Urbánum adiutórem nostrum in Christo Iesu, et Stachyn diléctum meum.
  "10": Salutáte Apéllen probum in Christo.
  "11": Salutáte eos, qui sunt ex Aristóboli domo. Salutáte Herodiónem cognátum meum. Salutáte eos, qui sunt ex Narcíssi domo, qui sunt in Dómino.
  "12": Salutáte Tryphǽnam, et Tryphósam, quæ labórant in Dómino. Salutáte Pérsidem caríssimam, quæ multum laborávit in Dómino.
  "13": Salutáte Rufum eléctum in Dómino, et matrem eius, et meam.
  "14": Salutáte Asýncritum, Phlegóntem, Hermam, Pátrobam, Hermen, et qui cum eis sunt, fratres.
  "15": Salutáte Philólogum et Iúliam, Néreum, et sorórem eius, et Olympíadem, et omnes, qui cum eis sunt, sanctos.
  "16": Salutáte ínvicem in ósculo sancto. Salútant vos omnes ecclésiæ Christi.
  "17": Rogo autem vos fratres, ut observétis eos, qui dissensiónes, et offendícula præter doctrínam, quam vos didicístis, fáciunt, et declináte ab illis.
  "18": 'Huiuscémodi enim Christo Dómino nostro non sérviunt, sed suo ventri: et per dulces sermónes, et benedictiónes sedúcunt corda innocéntium.'
  "19": Vestra enim obediéntia in omnem locum divulgáta est. Gáudeo ígitur in vobis. Sed volo vos sapiéntes esse in bono, et símplices in malo.
  "20": Deus autem pacis cónterat Sátanam sub pédibus vestris velóciter. Grátia Dómini nostri Iesu Christi vobíscum.
  "21": Salútat vos Timótheus adiútor meus, et Lúcius, et Iason, et Sosípater cognáti mei.
  "22": Salúto vos ego Tértius, qui scripsi epístolam, in Dómino.
  "23": Salútat vos Caius hospes meus, et univérsa ecclésia. Salútat vos Erástus arcárius civitátis, et Quartus, frater.
  "24": Grátia Dómini nostri Iesu Christi cum ómnibus vobis. Amen.
  "25": Ei autem, qui potens est vos confirmáre iuxta Evangélium meum, et prædicatiónem Iesu Christi, secúndum revelatiónem mystérii tempóribus ætérnis táciti
  "26": (quod nunc patefáctum est per Scriptúras prophetárum secúndum præcéptum ætérni Dei, ad obeditiónem fídei), in cunctis géntibus cógniti,
  "27": soli sapiénti Deo, per Iesum Christum, cui honor, et glória in sǽcula sæculórum. Amen.
