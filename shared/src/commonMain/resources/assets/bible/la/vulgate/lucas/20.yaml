bible: vulgate
lang: la
language: Latina
book: Lucas
chapter: "20"
verses:
  "1": Et factum est in una diérum, docénte illo pópulum in templo, et evangelizánte, convenérunt príncipes sacerdótum, et scribæ cum senióribus,
  "2": 'et aiunt dicéntes ad illum: Dic nobis, in qua potestáte hæc facis? aut: Quis est, qui dedit tibi hanc potestátem?'
  "3": 'Respóndens autem Iesus, dixit ad illos: Interrogábo vos et ego unum verbum. Respondéte mihi:'
  "4": Baptísmus Ioánnis de cælo erat, an ex homínibus?
  "5": 'At illi cogitábant intra se, dicéntes: Quia si dixérimus: De cælo, dicet: Quare ergo non credidístis illi?'
  "6": 'Si autem dixérimus: Ex homínibus, plebs univérsa lapidábit nos: certi sunt enim, Ioánnem prophétam esse.'
  "7": Et respondérunt se nescíre unde esset.
  "8": 'Et Iesus ait illis: Neque ego dico vobis, in qua potestáte hæc fácio.'
  "9": 'Cœpit autem dícere ad plebem parábolam hanc: Homo plantávit víneam, et locávit eam colónis: et ipse péregre fuit multis tempóribus.'
  "10": Et in témpore misit ad cultóres servum, ut de fructu víneæ darent illi. Qui cæsum dimisérunt eum inánem.
  "11": Et áddidit álterum servum míttere. Illi autem hunc quoque cædéntes, et afficiéntes contumélia, dimisérunt inánem.
  "12": 'Et áddidit tértium míttere: qui et illum vulnerántes eiecérunt.'
  "13": 'Dixit autem dóminus víneæ: Quid fáciam? Mittam fílium meum diléctum: fórsitan, cum hunc víderint, verebúntur.'
  "14": 'Quem cum vidíssent colóni, cogitavérunt intra se, dicéntes: Hic est heres, occidámus illum, ut nostra fiat heréditas.'
  "15": Et eiéctum illum extra víneam, occidérunt. Quid ergo fáciet illis dóminus víneæ?
  "16": 'Véniet, et perdet colónos istos, et dabit víneam áliis. Quo audíto, dixérunt illi: Absit.'
  "17": 'Ille autem aspíciens eos, ait: Quid est ergo hoc quod scriptum est: Lápidem, quem reprobavérunt ædificántes, hic factus est in caput ánguli?'
  "18": 'Omnis, qui cecíderit super illum lápidem, conquassábitur: super quem autem cecíderit, commínuet illum.'
  "19": 'Et quærébant príncipes sacerdótum, et scribæ míttere in illum manus illa hora, et timuérunt pópulum: cognovérunt enim quod ad ipsos díxerit similitúdinem hanc.'
  "20": Et observántes misérunt insidiatóres, qui se iustos simulárent, ut cáperent eum in sermóne, ut tráderent illum principátui, et potestáti prǽsidis.
  "21": 'Et interrogavérunt eum, dicéntes: Magíster, scimus quia recte dicis, et doces: et non áccipis persónam, sed viam Dei in veritáte doces.'
  "22": Licet nobis tribútum dare Cǽsari, an non?
  "23": 'Consíderans autem dolum illórum, dixit ad eos: Quid me tentátis?'
  "24": 'osténdite mihi denárium. Cuius habet imáginem, et inscriptiónem? Respondéntes dixérunt ei: Cǽsaris.'
  "25": 'Et ait illis: Réddite ergo quæ sunt Cǽsaris, Cǽsari: et quæ sunt Dei, Deo.'
  "26": 'Et non potuérunt verbum eius reprehéndere coram plebe: et miráti in respónso eius, tacuérunt.'
  "27": Accessérunt autem quidam Sadducæórum, qui negant esse resurrectiónem, et interrogavérunt eum,
  "28": 'dicéntes: Magíster, Móyses scripsit nobis: Si frater alicúius mórtuus fúerit habens uxórem, et hic sine líberis fúerit, ut accípiat eam frater eius uxórem, et súscitet semen fratri suo.'
  "29": 'Septem ergo fratres erant: et primus accépit uxórem, et mórtuus est sine fíliis.'
  "30": Et sequens accépit illam, et ipse mórtuus est sine fílio.
  "31": Et tértius accépit illam. Simíliter et omnes septem, et non reliquérunt semen, et mórtui sunt.
  "32": Novíssime ómnium mórtua est et múlier.
  "33": In resurrectióne ergo, cuius eórum erit uxor? síquidem septem habuérunt eam uxórem.
  "34": 'Et ait illis Iesus: Fílii huius sǽculi nubunt, et tradúntur ad núptias:'
  "35": 'illi vero, qui digni habebúntur sǽculo illo, et resurrectióne ex mórtuis, neque nubent, neque ducent uxóres:'
  "36": 'neque enim ultra mori póterunt: æquáles enim ángelis sunt, et fílii sunt Dei, cum sint fílii resurrectiónis.'
  "37": Quia vero resúrgant mórtui, et Móyses osténdit secus rubum, sicut dicit Dóminum, Deum Abraham, et Deum Isaac, et Deum Iacob.
  "38": 'Deus autem non est mortuórum, sed vivórum: omnes enim vivunt ei.'
  "39": 'Respondéntes autem quidam scribárum, dixérunt ei: Magíster, bene dixísti.'
  "40": Et ámplius non audébant eum quidquam interrogáre.
  "41": 'Dixit autem ad illos: Quómodo dicunt Christum, fílium esse David?'
  "42": 'et ipse David dicit in libro Psalmórum: Dixit Dóminus Dómino meo: sede a dextris meis,'
  "43": donec ponam inimícos tuos scabéllum pedum tuórum.
  "44": 'David ergo Dóminum illum vocat: et quómodo fílius eius est?'
  "45": 'Audiénte autem omni pópulo, dixit discípulis suis:'
  "46": 'Atténdite a scribis, qui volunt ambuláre in stolis, et amant salutatiónes in foro, et primas cáthedras in synagógis, et primos discúbitus in convíviis:'
  "47": qui dévorant domos viduárum, simulántes longam oratiónem. Hi accípient damnatiónem maiórem.
