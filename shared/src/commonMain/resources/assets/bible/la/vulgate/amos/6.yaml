bible: vulgate
lang: la
language: Latina
book: Amos
chapter: "6"
verses:
  "1": 'Væ qui opulénti estis in Sion, et confíditis in monte Samaríæ: optimátes cápita populórum, ingrediéntes pompátice domum Israel.'
  "2": 'Transíte in Chaláne, et vidéte, et ite inde in Emath magnam: et descéndite in Geth Palæstinórum, et ad óptima quæque regna horum: si látior términus eórum término vestro est.'
  "3": 'Qui separáti estis in diem malum: et appropinquátis sólio iniquitátis.'
  "4": 'Qui dormítis in lectis ebúrneis, et lascivítis in stratis vestris: qui coméditis agnum de grege, et vítulos de médio arménti.'
  "5": 'Qui cánitis ad vocem psaltérii: sicut David putavérunt se habére vasa cántici.'
  "6": 'Bibéntes vinum in phíalis, et óptimo unguénto delibúti: et nihil patiebántur super contritióne Ioseph.'
  "7": 'Quaprópter nunc migrábunt in cápite transmigrántium: et auferétur fáctio lasciviéntium.'
  "8": 'Iurávit Dóminus Deus in ánima sua, dicit Dóminus Deus exercítuum: Detéstor ego supérbiam Iacob, et domos eius odi, et tradam civitátem cum habitatóribus suis.'
  "9": Quod si réliqui fúerint decem viri in domo una, et ipsi moriéntur.
  "10": 'Et tollet eum propínquus suus, et combúret eum, ut éfferat ossa de domo: et dicet ei, qui in penetrálibus domus est: Numquid adhuc est penes te?'
  "11": 'Et respondébit: Finis est. Et dicet ei: Tace, et non recordéris nóminis Dómini.'
  "12": Quia ecce Dóminus mandábit, et percútiet domum maiórem ruínis, et domum minórem scissiónibus.
  "13": Numquid cúrrere queunt in petris equi, aut arári potest in búbalis, quóniam convertístis in amaritúdinem iudícium, et fructum iustítiæ in absínthium?
  "14": 'Qui lætámini in níhilo: qui dícitis: Numquid non in fortitúdine nostra assúmpsimus nobis córnua?'
  "15": 'Ecce enim suscitábo super vos domus Israel, dicit Dóminus Deus exercítuum, gentem: et cónteret vos ab intróitu Emath, usque ad torréntem desérti.'
