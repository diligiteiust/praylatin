bible: vulgate
lang: la
language: Latina
book: Ieremias
chapter: "32"
verses:
  "1": 'Verbum, quod factum est ad Ieremíam a Dómino, in anno décimo Sedecíæ regis Iuda: ipse est annus décimus octávus Nabuchodónosor.'
  "2": Tunc exércitus regis Babylónis obsidébat Ierúsalem, et Ieremías prophéta erat clausus in átrio cárceris, qui erat in domo regis Iuda.
  "3": 'Cláuserat enim eum Sedecías rex Iuda, dicens: Quare vaticináris, dicens: Hæc dicit Dóminus: Ecce ego dabo civitátem istam in manus regis Babylónis, et cápiet eam?'
  "4": 'Et Sedecías rex Iuda non effúgiet de manu Chaldæórum, sed tradétur in manus regis Babylónis: et loquétur os eius cum ore illíus, et óculi eius óculos illíus vidébunt.'
  "5": 'Et in Babylónem ducet Sedecíam, et ibi erit donec vísitem eum, ait Dóminus: si autem dimicavéritis advérsum Chaldǽos, nihil prósperum habébitis.'
  "6": 'Et dixit Ieremías: Factum est verbum Dómini ad me, dicens:'
  "7": 'Ecce Hanámeel fílius Sellum, patruélis tuus, véniet ad te, dicens: Eme tibi agrum meum, qui est in Anathoth: tibi enim cómpetit ex propinquitáte ut emas.'
  "8": 'Et venit ad me Hanámeel fílius pátrui mei secúndum verbum Dómini, ad vestíbulum cárceris, et ait ad me: Pósside agrum meum, qui est in Anathoth in terra Béniamin: quia tibi cómpetit heréditas, et tu propínquus es ut possídeas. Intelléxi autem quod verbum Dómini esset.'
  "9": 'Et emi agrum ab Hanámeel fílio pátrui mei, qui est in Anathoth: et appéndi ei argéntum septem statéres, et decem argénteos.'
  "10": 'Et scripsi in libro, et signávi, et adhíbui testes: et appéndi argéntum in statéra.'
  "11": Et accépi librum possessiónis signátum, et stipulatiónes, et rata, et signa forínsecus.
  "12": Et dedi librum possessiónis Baruch fílio Neri fílii Maasíæ, in óculis Hanámeel patruélis mei, in óculis téstium, qui scripti erant in libro emptiónis, et in óculis ómnium Iudæórum, qui sedébant in átrio cárceris.
  "13": 'Et præcépi Baruch coram eis, dicens:'
  "14": 'Hæc dicit Dóminus exercítuum, Deus Israel: Sume libros istos, librum emptiónis hunc signátum, et librum hunc, qui apértus est: et pone illos in vase fíctili, ut permanére possint diébus multis.'
  "15": 'Hæc enim dicit Dóminus exercítuum, Deus Israel: Adhuc possidebúntur domus, et agri, et víneæ in terra ista.'
  "16": 'Et orávi ad Dóminum, postquam trádidi librum possessiónis Baruch fílio Neri, dicens:'
  "17": 'Heu, heu, heu, Dómine Deus: ecce tu fecísti cælum et terram in fortitúdine tua magna, et in bráchio tuo exténto: non erit tibi diffícile omne verbum:'
  "18": 'qui facis misericórdiam in míllibus, et reddis iniquitátem patrum in sinum filiórum eórum post eos: Fortíssime, magne, et potens, Dóminus exercítuum nomen tibi.'
  "19": 'Magnus consílio, et incomprehensíbilis cogitátu: cuius óculi apérti sunt super omnes vias filiórum Adam, ut reddas unicuíque secúndum vias suas, et secúndum fructum adinventiónum eius.'
  "20": Qui posuísti signa et porténta in terra Ægýpti usque ad diem hanc, et in Israel, et in homínibus, et fecísti tibi nomen sicut est dies hæc.
  "21": Et eduxísti pópulum tuum Israel de terra Ægýpti, in signis et in porténtis, et in manu robústa et in bráchio exténto, et in terróre magno.
  "22": Et dedísti eis terram hanc, quam iurásti pátribus eórum ut dares eis, terram fluéntem lacte et melle.
  "23": 'Et ingréssi sunt, et possedérunt eam: et non obediérunt voci tuæ, et in lege tua non ambulavérunt: ómnia quæ mandásti eis ut fácerent, non fecérunt, et evenérunt eis ómnia mala hæc.'
  "24": 'Ecce munitiónes exstrúctæ sunt advérsum civitátem ut capiátur: et urbs data est in manus Chaldæórum, qui prœliántur advérsus eam, a fácie gládii, et famis, et pestiléntiæ: et quæcúmque locútus es, accidérunt, ut tu ipse cernis.'
  "25": 'Et tu dicis mihi Dómine Deus: Eme agrum argénto, et ádhibe testes, cum urbs data sit in manus Chaldæórum?'
  "26": 'Et factum est verbum Dómini ad Ieremíam, dicens:'
  "27": 'Ecce ego Dóminus Deus univérsæ carnis: numquid mihi diffícile erit omne verbum?'
  "28": 'Proptérea hæc dicit Dóminus: Ecce ego tradam civitátem istam in manus Chaldæórum, et in manus regis Babylónis, et cápient eam.'
  "29": Et vénient Chaldǽi prœliántes advérsum urbem hanc, et succéndent eam igni, et combúrent eam, et domos in quarum domátibus sacrificábant Baal, et libábant diis aliénis libámina ad irritándum me.
  "30": 'Erant enim fílii Israel et fílii Iuda iúgiter faciéntes malum in óculis meis ab adolescéntia sua: fílii Israel qui usque nunc exacérbant me in ópere mánuum suárum, dicit Dóminus.'
  "31": Quia in furóre et in indignatióne mea facta est mihi cívitas hæc, a die qua ædificavérunt eam, usque ad diem istam, qua auferétur de conspéctu meo.
  "32": Propter malítiam filiórum Israel et filiórum Iuda, quam fecérunt ad iracúndiam me provocántes, ipsi et reges eórum, príncipes eórum, et sacerdótes eórum, et prophétæ eórum, viri Iuda et habitatóres Ierúsalem.
  "33": 'Et vertérunt ad me terga, et non fácies: cum docérem eos dilúculo et erudírem, et nollent audíre, ut accíperent disciplínam.'
  "34": Et posuérunt idóla sua in domo, in qua invocátum est nomen meum, ut pollúerent eam.
  "35": 'Et ædificavérunt excélsa Baal, quæ sunt in valle fílii Ennom, ut initiárent fílios suos et fílias suas Moloch: quod non mandávi eis, nec ascéndit in cor meum ut fácerent abominatiónem hanc, et in peccátum dedúcerent Iudam.'
  "36": Et nunc propter ista, hæc dicit Dóminus Deus Israel ad civitátem hanc, de qua vos dícitis quod tradétur in manus regis Babylónis in gládio, et in fame, et in peste.
  "37": 'Ecce ego congregábo eos de univérsis terris, ad quas eiéci eos in furóre meo, et in ira mea, et in indignatióne grandi: et redúcam eos ad locum istum, et habitáre eos fáciam confidénter.'
  "38": Et erunt mihi in pópulum, et ego ero eis in Deum.
  "39": 'Et dabo eis cor unum, et viam unam, ut tímeant me univérsis diébus: et bene sit eis, et fíliis eórum post eos.'
  "40": 'Et fériam eis pactum sempitérnum, et non désinam eis benefácere: et timórem meum dabo in corde eórum, ut non recédant a me.'
  "41": 'Et lætábor super eis, cum bene eis fécero: et plantábo eos in terra ista in veritáte, in toto corde meo et in tota ánima mea.'
  "42": 'Quia hæc dicit Dóminus: Sicut addúxi super pópulum istum omne malum hoc grande: sic addúcam super eos omne bonum, quod ego loquor ad eos.'
  "43": 'Et possidebúntur agri in terra ista: de qua vos dícitis quod desérta sit, eo quod non remánserit homo et iuméntum, et data sit in manus Chaldæórum.'
  "44": 'Agri eméntur pecúnia, et scribéntur in libro, et imprimétur signum, et testis adhibébitur: in terra Béniamin, et in circúitu Ierúsalem, in civitátibus Iuda, et in civitátibus montánis, et in civitátibus campéstribus, et in civitátibus, quæ ad austrum sunt: quia convértam captivitátem eórum, ait Dóminus.'
