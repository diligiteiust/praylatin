bible: vulgate
lang: la
language: Latina
book: I Paralipomenon
chapter: "17"
verses:
  "1": 'Cum autem habitáret David in domo sua, dixit ad Nathan prophétam: Ecce ego hábito in domo cédrina: arca autem fœ́deris Dómini sub péllibus est.'
  "2": 'Et ait Nathan ad David: Omnia, quæ in corde tuo sunt, fac: Deus enim tecum est.'
  "3": 'Igitur nocte illa factus est sermo Dei ad Nathan, dicens:'
  "4": 'Vade, et lóquere David servo meo: Hæc dicit Dóminus: Non ædificábis tu mihi domum ad habitándum.'
  "5": 'Neque enim mansi in domo ex eo témpore, quo edúxi Israel usque ad diem hanc: sed fui semper mutans loca tabernáculi, et in tentório'
  "6": 'manens cum omni Israel. Numquid locútus sum saltem uni iúdicum Israel, quibus præcéperam ut páscerent pópulum meum, et dixi: Quare non ædificástis mihi domum cédrinam?'
  "7": 'Nunc ítaque sic loquéris ad servum meum David: Hæc dicit Dóminus exercítuum: Ego tuli te, cum in páscuis sequeréris gregem, ut esses dux pópuli mei Israel.'
  "8": Et fui tecum quocúmque perrexísti, et interféci omnes inimícos tuos coram te, fecíque tibi nomen quasi uníus magnórum, qui celebrántur in terra.
  "9": 'Et dedi locum pópulo meo Israel: plantábitur, et habitábit in eo, et ultra non commovébitur: nec fílii iniquitátis átterent eos, sicut a princípio,'
  "10": ex diébus, quibus dedi iúdices pópulo meo Israel, et humiliávi univérsos inimícos tuos. Annúntio ergo tibi, quod ædificatúrus sit tibi Dóminus domum.
  "11": 'Cumque impléveris dies tuos ut vadas ad patres tuos, suscitábo semen tuum post te, quod erit de fíliis tuis: et stabíliam regnum eius.'
  "12": Ipse ædificábit mihi domum, et firmábo sólium eius usque in ætérnum.
  "13": 'Ego ero ei in patrem, et ipse erit mihi in fílium: et misericórdiam meam non áuferam ab eo, sicut ábstuli ab eo, qui ante te fuit.'
  "14": 'Et státuam eum in domo mea, et in regno meo usque in sempitérnum: et thronus eius erit firmíssimus in perpétuum.'
  "15": Iuxta ómnia verba hæc, et iuxta univérsam visiónem istam, sic locútus est Nathan ad David.
  "16": 'Cumque venísset rex David, et sedísset coram Dómino, dixit: Quis ego sum Dómine Deus, et quæ domus mea, ut præstáres mihi tália?'
  "17": 'Sed et hoc parum visum est in conspéctu tuo, ideóque locútus es super domum servi tui étiam in futúrum: et fecísti me spectábilem super omnes hómines Dómine Deus.'
  "18": Quid ultra áddere potest David, cum ita glorificáveris servum tuum, et cognóveris eum?
  "19": Dómine propter fámulum tuum iuxta cor tuum fecísti omnem magnificéntiam hanc, et nota esse voluísti univérsa magnália.
  "20": Dómine non est símilis tui, et non est álius Deus absque te, ex ómnibus, quos audívimus áuribus nostris.
  "21": Quis enim est álius, ut pópulus tuus Israel, gens una in terra, ad quam perréxit Deus, ut liberáret, et fáceret pópulum sibi, et magnitúdine sua atque terróribus eíceret natiónes a fácie eius, quem de Ægýpto liberárat?
  "22": Et posuísti pópulum tuum Israel tibi in pópulum usque in ætérnum, et tu Dómine factus es Deus eius.
  "23": Nunc ígitur Dómine, sermo, quem locútus es fámulo tuo, et super domum eius confirmétur in perpétuum, et fac sicut locútus es.
  "24": 'Permaneátque et magnificétur nomen tuum usque in sempitérnum, et dicátur: Dóminus exercítuum Deus Israel, et domus David servi eius pérmanens coram eo.'
  "25": 'Tu enim Dómine Deus meus revelásti aurículam servi tui, ut ædificáres ei domum: et idcírco invénit servus tuus fidúciam, ut oret coram te.'
  "26": Nunc ergo Dómine, tu es Deus, et locútus es ad servum tuum tanta benefícia.
  "27": 'Et cœpísti benedícere dómui servi tui, ut sit semper coram te: te enim Dómine benedicénte, benedícta erit in perpétuum.'
