bible: vulgate
lang: la
language: Latina
book: Deuteronomium
chapter: "2"
verses:
  "1": 'Profectíque inde, vénimus in solitúdinem, quæ ducit ad mare Rubrum, sicut mihi díxerat Dóminus: et circuívimus montem Seir longo témpore.'
  "2": 'Dixítque Dóminus ad me:'
  "3": 'Súfficit vobis circuíre montem istum: ite contra aquilónem:'
  "4": 'et pópulo prǽcipe, dicens: Transíbitis per términos fratrum vestrórum filiórum Esau, qui hábitant in Seir, et timébunt vos.'
  "5": 'Vidéte ergo diligénter ne moveámini contra eos: neque enim dabo vobis de terra eórum quantum potest uníus pedis calcáre vestígium, quia in possessiónem Esau dedi montem Seir.'
  "6": 'Cibos emétis ab eis pecúnia, et comedétis: aquam emptam hauriétis, et bibétis.'
  "7": 'Dóminus Deus tuus benedíxit tibi in omni ópere mánuum tuárum: novit iter tuum, quómodo transíeris solitúdinem hanc magnam, per quadragínta annos hábitans tecum Dóminus Deus tuus, et nihil tibi défuit.'
  "8": Cumque transissémus fratres nostros fílios Esau, qui habitábant in Seir, per viam campéstrem de Elath, et de Asióngaber, vénimus ad iter, quod ducit in desértum Moab.
  "9": 'Dixítque Dóminus ad me: Non pugnes contra Moabítas, nec íneas advérsus eos prœ́lium: non enim dabo tibi quidquam de terra eórum, quia fíliis Loth trádidi Ar in possessiónem.'
  "10": Emim primi fuérunt habitatóres eius, pópulus magnus, et válidus, et tam excélsus ut de Enacim stirpe,
  "11": quasi gigántes crederéntur, et essent símiles filiórum Enacim. Dénique Moabítæ appéllant eos Emim.
  "12": 'In Seir autem prius habitavérunt Horrhǽi: quibus expúlsis atque delétis, habitavérunt fílii Esau, sicut fecit Israel in terra possessiónis suæ, quam dedit illi Dóminus.'
  "13": Surgéntes ergo ut transirémus torréntem Zared, vénimus ad eum.
  "14": 'Tempus autem, quo ambulávimus de Cadesbárne usque ad tránsitum torréntis Zared, trigínta et octo annórum fuit: donec consumerétur omnis generátio hóminum bellatórum de castris, sicut iuráverat Dóminus:'
  "15": cuius manus fuit advérsum eos, ut interírent de castrórum médio.
  "16": Postquam autem univérsi cecidérunt pugnatóres,
  "17": 'locútus est Dóminus ad me, dicens:'
  "18": 'Tu transíbis hódie términos Moab, urbem nómine Ar:'
  "19": 'et accédens in vicína filiórum Ammon, cave ne pugnes contra eos, nec moveáris ad prœ́lium: non enim dabo tibi de terra filiórum Ammon, quia fíliis Loth dedi eam in possessiónem.'
  "20": 'Terra gigántum reputáta est: et in ipsa olim habitavérunt gigántes, quos Ammonítæ vocant Zomzómmim,'
  "21": 'pópulus magnus, et multus, et procéræ longitúdinis, sicut Enacim, quos delévit Dóminus a fácie eórum: et fecit illos habitáre pro eis,'
  "22": sicut fécerat fíliis Esau, qui hábitant in Seir, delens Horrhǽos, et terram eórum illis tradens, quam póssident usque in præsens.
  "23": 'Hevǽos quoque, qui habitábant in Háserim usque Gazan, Cappádoces expulérunt: qui egréssi de Cappadócia delevérunt eos, et habitavérunt pro illis.'
  "24": 'Súrgite, et transíte torréntem Arnon: ecce trádidi in manu tua Sehon regem Hésebon Amorrhǽum, et terram eius íncipe possidére, et commítte advérsus eum prœ́lium.'
  "25": 'Hódie incípiam míttere terrórem atque formídinem tuam in pópulos, qui hábitant sub omni cælo: ut audíto nómine tuo páveant, et in morem parturiéntium contremíscant, et dolóre teneántur.'
  "26": 'Misi ergo núntios de solitúdine Cádemoth ad Sehon regem Hésebon verbis pacíficis, dicens:'
  "27": 'Transíbimus per terram tuam: pública gradiémur via: non declinábimus neque ad déxteram, neque ad sinístram.'
  "28": 'Aliménta prétio vende nobis, ut vescámur: aquam pecúnia tríbue, et sic bibémus. Tantum est ut nobis concédas tránsitum,'
  "29": 'sicut fecérunt fílii Esau, qui hábitant in Seir, et Moabítæ, qui morántur in Ar: donec veniámus ad Iordánem, et transeámus ad terram, quam Dóminus Deus noster datúrus est nobis.'
  "30": 'Noluítque Sehon rex Hésebon dare nobis tránsitum: quia induráverat Dóminus Deus tuus spíritum eius, et obfirmáverat cor illíus, ut traderétur in manus tuas, sicut nunc vides.'
  "31": 'Dixítque Dóminus ad me: Ecce cœpi tibi trádere Sehon, et terram eius: íncipe possidére eam.'
  "32": Egressúsque est Sehon óbviam nobis cum omni pópulo suo ad prœ́lium in Iasa.
  "33": 'Et trádidit eum Dóminus Deus noster nobis: percussimúsque eum cum fíliis suis et omni pópulo suo.'
  "34": 'Cunctásque urbes in témpore illo cépimus, interféctis habitatóribus eárum, viris ac muliéribus et párvulis: non relíquimus in eis quidquam,'
  "35": 'absque iuméntis, quæ in partem venére prædántium: et spóliis úrbium, quas cépimus'
  "36": 'ab Aroer, quæ est super ripam torréntis Arnon, óppido quod in valle situm est, usque Gálaad. Non fuit vicus et cívitas, quæ nostras effúgeret manus: omnes trádidit Dóminus Deus noster nobis,'
  "37": 'absque terra filiórum Ammon, ad quam non accéssimus: et cunctis quæ ádiacent torrénti Ieboc, et úrbibus montánis, universísque locis, a quibus nos prohíbuit Dóminus Deus noster.'
