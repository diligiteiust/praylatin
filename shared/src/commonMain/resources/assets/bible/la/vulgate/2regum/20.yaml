bible: vulgate
lang: la
language: Latina
book: II Regum
chapter: "20"
verses:
  "1": 'In diébus illis ægrotávit Ezechías usque ad mortem: et venit ad eum Isaías fílius Amos prophéta, dixítque ei: Hæc dicit Dóminus Deus: Prǽcipe dómui tuæ: moriéris enim tu, et non vives.'
  "2": 'Qui convértit fáciem suam ad paríetem, et orávit Dóminum, dicens:'
  "3": 'Obsecro Dómine: meménto, quæso, quómodo ambuláverim coram te in veritáte, et in corde perfécto, et quod plácitum est coram te fécerim. Flevit ítaque Ezechías fletu magno.'
  "4": 'Et ántequam egrederétur Isaías médiam partem átrii, factus est sermo Dómini ad eum, dicens:'
  "5": 'Revértere, et dic Ezechíæ duci pópuli mei: Hæc dicit Dóminus Deus David patris tui: Audívi oratiónem tuam, et vidi lácrymas tuas, et ecce sanávi te: die tértio ascéndes templum Dómini.'
  "6": 'Et addam diébus tuis quíndecim annos: sed et de manu regis Assyriórum liberábo te, et civitátem hanc: et prótegam urbem istam propter me, et propter David servum meum.'
  "7": 'Dixítque Isaías: Afférte massam ficórum. Quam cum attulíssent, et posuíssent super ulcus eius, curátus est.'
  "8": 'Díxerat autem Ezechías ad Isaíam: Quod erit signum, quia Dóminus me sanábit, et quia ascensúrus sum die tértia templum Dómini?'
  "9": 'Cui ait Isaías: Hoc erit signum a Dómino quod factúrus sit Dóminus sermónem, quem locútus est: vis ut ascéndat umbra decem líneis, an ut revertátur tótidem grádibus?'
  "10": 'Et ait Ezechías: Fácile est umbram créscere decem líneis: nec hoc volo ut fiat, sed ut revertátur retrórsum decem grádibus.'
  "11": Invocávit ítaque Isaías prophéta Dóminum, et redúxit umbram per líneas, quibus iam descénderat in horológio Achaz, retrórsum decem grádibus.
  "12": 'In témpore illo misit Bérodach Báladan, fílius Báladan, rex Babyloniórum, lítteras et múnera ad Ezechíam: audíerat enim quod ægrotásset Ezechías.'
  "13": Lætátus est autem in advéntu eórum Ezechías, et osténdit eis domum arómatum, et aurum et argéntum, et pigménta vária, unguénta quoque, et domum vasórum suórum, et ómnia quæ habére póterat in thesáuris suis. Non fuit quod non monstráret eis Ezechías in domo sua, et in omni potestáte sua.
  "14": 'Venit autem Isaías prophéta ad regem Ezechíam, dixítque ei: Quid dixérunt viri isti? aut unde venérunt ad te? Cui ait Ezechías: De terra longínqua venérunt ad me, de Babylóne.'
  "15": 'At ille respóndit: Quid vidérunt in domo tua? Ait Ezechías: Omnia quæcúmque sunt in domo mea, vidérunt: nihil est quod non monstráverim eis in thesáuris meis.'
  "16": 'Dixit ítaque Isaías Ezechíæ: Audi sermónem Dómini:'
  "17": 'Ecce dies vénient, et auferéntur ómnia, quæ sunt in domo tua, et quæ condidérunt patres tui usque in diem hanc, in Babylónem: non remanébit quidquam, ait Dóminus.'
  "18": Sed et de fíliis tuis qui egrediéntur ex te, quos generábis, tolléntur, et erunt eunúchi in palátio regis Babylónis.
  "19": 'Dixit Ezechías ad Isaíam: Bonus sermo Dómini, quem locútus es: sit pax et véritas in diébus meis.'
  "20": Réliqua autem sermónum Ezechíæ, et omnis fortitúdo eius, et quómodo fécerit piscínam et aquædúctum, et introdúxerit aquas in civitátem, nonne hæc scripta sunt in Libro sermónum diérum regum Iuda?
  "21": Dormivítque Ezechías cum pátribus suis, et regnávit Manásses fílius eius pro eo.
