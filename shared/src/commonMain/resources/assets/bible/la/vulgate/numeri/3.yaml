bible: vulgate
lang: la
language: Latina
book: Numeri
chapter: "3"
verses:
  "1": Hæ sunt generatiónes Aaron et Móysi in die qua locútus est Dóminus ad Móysen in monte Sínai.
  "2": 'Et hæc nómina filiórum Aaron: primogénitus eius Nadab, deínde Abiu, et Eleázar, et Ithamar.'
  "3": Hæc nómina filiórum Aaron sacerdótum qui uncti sunt, et quorum replétæ et consecrátæ manus ut sacerdótio fungeréntur.
  "4": 'Mórtui sunt enim Nadab et Abiu cum offérrent ignem aliénum in conspéctu Dómini in desérto Sínai, absque líberis: functíque sunt sacerdótio Eleázar et Ithamar coram Aaron patre suo.'
  "5": 'Locutúsque est Dóminus ad Móysen, dicens:'
  "6": Applica tribum Levi, et fac stare in conspéctu Aaron sacerdótis ut minístrent ei, et éxcubent,
  "7": et obsérvent quidquid ad cultum pértinet multitúdinis coram tabernáculo testimónii,
  "8": et custódiant vasa tabernáculi, serviéntes in ministério eius.
  "9": Dabísque dono Levítas
  "10": Aaron et fíliis eius, quibus tráditi sunt a fíliis Israel. Aaron autem et fílios eius constítues super cultum sacerdótii. Extérnus, qui ad ministrándum accésserit, moriétur.
  "11": 'Locutúsque est Dóminus ad Móysen, dicens:'
  "12": Ego tuli Levítas a fíliis Israel pro omni primogénito, qui áperit vulvam in fíliis Israel, erúntque Levítæ mei.
  "13": 'Meum est enim omne primogénitum: ex quo percússi primogénitos in terra Ægýpti, sanctificávi mihi quidquid primum náscitur in Israel: ab hómine usque ad pecus, mei sunt. Ego Dóminus.'
  "14": 'Locutúsque est Dóminus ad Móysen in desérto Sínai, dicens:'
  "15": Númera fílios Levi per domos patrum suórum et famílias, omnem másculum ab uno mense et supra.
  "16": Numerávit Móyses, ut præcéperat Dóminus,
  "17": et invénti sunt fílii Levi per nómina sua, Gerson et Caath et Merári.
  "18": 'Fílii Gerson: Lebni et Sémei.'
  "19": 'Fílii Caath: Amram et Iésaar, Hebron et Oziel.'
  "20": 'Fílii Merári: Móholi et Musi.'
  "21": 'De Gerson fuére famíliæ duæ, Lebnítica, et Semeítica:'
  "22": quarum numerátus est pópulus sexus masculíni ab uno mense et supra, septem míllia quingénti.
  "23": Hi post tabernáculum metabúntur ad occidéntem,
  "24": sub príncipe Elíasaph fílio Lael.
  "25": Et habébunt excúbias in tabernáculo fœ́deris,
  "26": 'ipsum tabernáculum et operiméntum eius, tentórium quod tráhitur ante fores tecti fœ́deris, et cortínas átrii: tentórium quoque quod appénditur in intróitu átrii tabernáculi, et quidquid ad ritum altáris pértinet, funes tabernáculi et ómnia utensília eius.'
  "27": Cognátio Caath habébit pópulos Amramítas et Iesaarítas et Hebronítas et Ozielítas. Hæ sunt famíliæ Caathitárum recensítæ per nómina sua.
  "28": Omnes géneris masculíni ab uno mense et supra, octo míllia sexcénti habébunt excúbias sanctuárii,
  "29": et castrametabúntur ad meridiánam plagam.
  "30": 'Princépsque eórum erit Elísaphan fílius Oziel:'
  "31": et custódient arcam, mensámque et candelábrum, altária et vasa sanctuárii, in quibus ministrátur, et velum, cunctámque huiuscémodi supelléctilem.
  "32": Princeps autem príncipum Levitárum Eleázar fílius Aaron sacerdótis, erit super excubitóres custódiæ sanctuárii.
  "33": 'At vero de Merári erunt pópuli Moholítæ et Musítæ recensíti per nómina sua:'
  "34": omnes géneris masculíni ab uno mense et supra, sex míllia ducénti.
  "35": 'Princeps eórum Súriel fílius Abiháiel: in plaga septentrionáli castrametabúntur.'
  "36": 'Erunt sub custódia eórum tábulæ tabernáculi et vectes, et colúmnæ ac bases eárum, et ómnia quæ ad cultum huiuscémodi pértinent:'
  "37": columnǽque átrii per circúitum cum básibus suis, et paxílli cum fúnibus.
  "38": Castrametabúntur ante tabernáculum fœ́deris, id est, ad orientálem plagam, Móyses et Aaron cum fíliis suis, habéntes custódiam sanctuárii in médio filiórum Israel. Quisquis aliénus accésserit, moriétur.
  "39": Omnes Levítæ, quos numeravérunt Móyses et Aaron iuxta præcéptum Dómini per famílias suas in génere masculíno a mense uno et supra, fuérunt vigínti duo míllia.
  "40": 'Et ait Dóminus ad Móysen: Númera primogénitos sexus masculíni de fíliis Israel ab uno mense et supra, et habébis summam eórum.'
  "41": 'Tollésque Levítas mihi pro omni primogénito filiórum Israel: ego sum Dóminus: et pécora eórum pro univérsis primogénitis pécorum filiórum Israel.'
  "42": 'Recénsuit Móyses, sicut præcéperat Dóminus, primogénitos filiórum Israel:'
  "43": et fuérunt másculi per nómina sua, a mense uno et supra, vigínti duo míllia ducénti septuagínta tres.
  "44": 'Locutúsque est Dóminus ad Móysen, dicens:'
  "45": Tolle Levítas pro primogénitis filiórum Israel, et pécora Levitárum pro pecóribus eórum, erúntque Levítæ mei. Ego sum Dóminus.
  "46": In prétio autem ducentórum septuagínta trium, qui excédunt númerum Levitárum de primogénitis filiórum Israel,
  "47": accípies quinque siclos per síngula cápita ad mensúram sanctuárii. Siclus habet vigínti óbolos.
  "48": Dabísque pecúniam Aaron et fíliis eius, prétium eórum qui supra sunt.
  "49": Tulit ígitur Móyses pecúniam eórum, qui fúerant ámplius, et quos redémerant a Levítis
  "50": 'pro primogénitis filiórum Israel, mille trecentórum sexagínta quinque siclórum iuxta pondus sanctuárii:'
  "51": et dedit eam Aaron et fíliis eius iuxta verbum quod præcéperat sibi Dóminus.
