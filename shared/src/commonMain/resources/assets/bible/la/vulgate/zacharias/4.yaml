bible: vulgate
lang: la
language: Latina
book: Zacharias
chapter: "4"
verses:
  "1": Et revérsus est ángelus, qui loquebátur in me, et suscitávit me quasi virum, qui suscitátur de somno suo.
  "2": 'Et dixit ad me: Quid tu vides? Et dixi: Vidi, et ecce candelábrum áureum totum, et lampas eius super caput ipsíus, et septem lucérnæ eius super illud: et septem infusória lucérnis, quæ erant super caput eius.'
  "3": 'Et duæ olívæ super illud: una a dextris lámpadis, et una a sinístris eius.'
  "4": 'Et respóndi, et aio ad ángelum, qui loquebátur in me, dicens: Quid sunt hæc, dómine mi?'
  "5": 'Et respóndit ángelus, qui loquebátur in me, et dixit ad me: Numquid nescis quid sunt hæc? Et dixi: Non, dómine mi.'
  "6": 'Et respóndit, et ait ad me, dicens: Hoc est verbum Dómini ad Zoróbabel, dicens: Non in exércitu, nec in róbore, sed in spíritu meo, dicit Dóminus exercítuum.'
  "7": 'Quis tu mons magne coram Zoróbabel? in planum: et edúcet lápidem primárium, et exæquábit grátiam grátiæ eius.'
  "8": 'Et factum est verbum Dómini ad me, dicens:'
  "9": 'Manus Zoróbabel fundavérunt domum istam, et manus eius perfícient eam: et sciétis quia Dóminus exercítuum misit me ad vos.'
  "10": Quis enim despéxit dies parvos? et lætabúntur, et vidébunt lápidem stánneum in manu Zoróbabel. Septem isti óculi sunt Dómini, qui discúrrunt in univérsam terram.
  "11": 'Et respóndi, et dixi ad eum: Quid sunt duæ olívæ istæ, ad déxteram candelábri, et ad sinístram eius?'
  "12": 'Et respóndi secúndo, et dixi ad eum: Quid sunt duæ spicæ olivárum, quæ sunt iuxta duo rostra áurea, in quibus sunt suffusória ex auro?'
  "13": 'Et ait ad me, dicens: Numquid nescis quid sunt hæc? Et dixi: Non, dómine mi.'
  "14": 'Et dixit: Isti sunt duo fílii ólei, qui assístunt Dominatóri univérsæ terræ.'
