bible: vulgate
lang: la
language: Latina
book: Ecclesiastes
chapter: "2"
verses:
  "1": 'Dixi ego in corde meo: Vadam, et áffluam delíciis, et fruar bonis: et vidi quod hoc quoque esset vánitas.'
  "2": 'Risum reputávi errórem, et gáudio dixi: Quid frustra decíperis?'
  "3": Cogitávi in corde meo abstráhere a vino carnem meam, ut ánimam meam transférrem ad sapiéntiam, devitarémque stultítiam, donec vidérem quid esset útile fíliis hóminum, quo facto opus est sub sole número diérum vitæ suæ.
  "4": Magnificávi ópera mea, ædificávi mihi domos, et plantávi víneas,
  "5": feci hortos et pomária, et consévi ea cuncti géneris arbóribus,
  "6": et exstrúxi mihi piscínas aquárum, ut irrigárem silvam lignórum germinántium.
  "7": 'Possédi servos et ancíllas, multámque famíliam hábui: arménta quoque, et magnos óvium greges, ultra omnes qui fuérunt ante me in Ierúsalem:'
  "8": 'coacervávi mihi argéntum et aurum, et substántias regum ac provinciárum: feci mihi cantóres et cantatríces, et delícias filiórum hóminum, scyphos, et úrceos in ministério ad vina fundénda:'
  "9": 'et supergréssus sum ópibus omnes, qui ante me fuérunt in Ierúsalem: sapiéntia quoque perseverávit mecum.'
  "10": 'Et ómnia, quæ desideravérunt óculi mei non negávi eis: nec prohíbui cor meum quin omni voluptáte fruerétur, et oblectáret se in his, quæ præparáveram: et hanc ratus sum partem meam, si úterer labóre meo.'
  "11": Cumque me convertíssem ad univérsa ópera, quæ fécerant manus meæ, et ad labóres, in quibus frustra sudáveram, vidi in ómnibus vanitátem et afflictiónem ánimi, et nihil permanére sub sole.
  "12": Transívi ad contemplándam sapiéntiam, errorésque, et stultítiam (quid est, inquam, homo, ut sequi possit regem Factórem suum?)
  "13": Et vidi quod tantum præcéderet sapiéntia stultítiam, quantum differt lux a ténebris.
  "14": 'Sapiéntis óculi in cápite eius: stultus in ténebris ámbulat: et dídici quod unus utriúsque esset intéritus.'
  "15": 'Et dixi in corde meo: Si unus et stulti et meus occásus erit, quid mihi prodest quod maiórem sapiéntiæ dedi óperam? Locutúsque cum mente mea, animadvérti quod hoc quoque esset vánitas.'
  "16": 'Non enim erit memória sapiéntis simíliter ut stulti in perpétuum, et futúra témpora oblivióne cuncta páriter opérient: móritur doctus simíliter ut indóctus.'
  "17": Et idcírco tǽduit me vitæ meæ, vidéntem mala univérsa esse sub sole, et cuncta vanitátem et afflictiónem spíritus.
  "18": Rursus detestátus sum omnem indústriam meam, qua sub sole studiosíssime laborávi, habitúrus herédem post me,
  "19": 'quem ignóro, utrum sápiens an stultus futúrus sit, et dominábitur in labóribus meis, quibus desudávi et sollícitus fui: et est quidquam tam vanum?'
  "20": Unde cessávi, renuntiavítque cor meum ultra laboráre sub sole.
  "21": 'Nam cum álius labóret in sapiéntia, et doctrína, et sollicitúdine, hómini otióso quæsíta dimíttit: et hoc ergo vánitas, et magnum malum.'
  "22": Quid enim próderit hómini de univérso labóre suo, et afflictióne spíritus, qua sub sole cruciátus est?
  "23": 'Cuncti dies eius dolóribus et ærúmnis pleni sunt, nec per noctem mente requiéscit: et hoc nonne vánitas est?'
  "24": Nonne mélius est comédere et bíbere, et osténdere ánimæ suæ bona de labóribus suis? et hoc de manu Dei est.
  "25": Quis ita devorábit, et delíciis áffluet ut ego?
  "26": 'Hómini bono in conspéctu suo dedit Deus sapiéntiam, et sciéntiam, et lætítiam: peccatóri autem dedit afflictiónem, et curam supérfluam, ut addat, et cóngreget, et tradat ei qui plácuit Deo: sed et hoc vánitas est, et cassa sollicitúdo mentis.'
