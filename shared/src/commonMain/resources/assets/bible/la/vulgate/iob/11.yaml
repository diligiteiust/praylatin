bible: vulgate
lang: la
language: Latina
book: Iob
chapter: "11"
verses:
  "1": 'Respóndens autem Sophar Naamathítes, dixit:'
  "2": Numquid qui multa lóquitur, non et áudiet? aut vir verbósus iustificábitur?
  "3": Tibi soli tacébunt hómines? et cum céteros irríseris, a nullo confutáberis?
  "4": 'Dixísti enim: Purus est sermo meus, et mundus sum in conspéctu tuo.'
  "5": Atque útinam Deus loquerétur tecum, et aperíret lábia sua tibi,
  "6": ut osténderet tibi secréta sapiéntiæ, et quod múltiplex esset lex eius, et intellígeres quod multo minóra exigáris ab eo, quam merétur iníquitas tua.
  "7": Fórsitan vestígia Dei comprehéndes, et usque ad perféctum Omnipoténtem repéries?
  "8": Excélsior cælo est, et quid fácies? profúndior inférno, et unde cognósces?
  "9": lóngior terra mensúra eius, et látior mari.
  "10": Si subvérterit ómnia, vel in unum coarctáverit, quis contradícet ei?
  "11": Ipse enim novit hóminum vanitátem, et videns iniquitátem, nonne consíderat?
  "12": Vir vanus in supérbiam erígitur, et tamquam pullum ónagri se líberum natum putat.
  "13": Tu autem firmásti cor tuum, et expandísti ad eum manus tuas.
  "14": 'Si iniquitátem, quæ est in manu tua abstúleris a te, et non mánserit in tabernáculo tuo iniustítia:'
  "15": tunc leváre póteris fáciem tuam absque mácula, et eris stábilis, et non timébis.
  "16": Misériæ quoque obliviscéris, et quasi aquárum quæ præteriérunt recordáberis.
  "17": 'Et quasi meridiánus fulgor consúrget tibi ad vésperam: et cum te consúmptum putáveris, oriéris ut lúcifer.'
  "18": Et habébis fidúciam, propósita tibi spe, et defóssus secúrus dórmies.
  "19": 'Requiésces, et non erit qui te extérreat: et deprecabúntur fáciem tuam plúrimi.'
  "20": 'Oculi autem impiórum defícient, et effúgium períbit ab eis: et spes illórum abominátio ánimæ.'
