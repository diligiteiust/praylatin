bible: vulgate
lang: la
language: Latina
book: Daniel
chapter: "3"
verses:
  "1": Nabuchodónosor rex fecit státuam áuream, altitúdine cubitórum sexagínta, latitúdine cubitórum sex, et státuit eam in campo Dura provínciæ Babylónis.
  "2": Itaque Nabuchodónosor rex misit ad congregándos sátrapas, magistrátus, et iúdices, duces, et tyránnos, et præféctos, omnésque príncipes regiónum, ut convenírent ad dedicatiónem státuæ, quam eréxerat Nabuchodónosor rex.
  "3": 'Tunc congregáti sunt sátrapæ, magistrátus, et iúdices, duces, et tyránni, et optimátes, qui erant in potestátibus constitúti, et univérsi príncipes regiónum, ut convenírent ad dedicatiónem státuæ, quam eréxerat Nabuchodónosor rex: stabant autem in conspéctu státuæ, quam posúerat Nabuchodónosor rex:'
  "4": 'et præco clamábat valénter: Vobis dícitur pópulis, tríbubus, et linguis:'
  "5": in hora, qua audiéritis sónitum tubæ, et fístulæ, et cítharæ, sambúcæ, et psaltérii, et symphóniæ, et univérsi géneris musicórum, cadéntes adoráte státuam áuream, quam constítuit Nabuchodónosor rex.
  "6": Si quis autem non prostrátus adoráverit, eádem hora mittétur in fornácem ignis ardéntis.
  "7": Post hæc ígitur, statim ut audiérunt omnes pópuli sónitum tubæ, fístulæ, et cítharæ, sambúcæ, et psaltérii, et symphóniæ, et omnis géneris musicórum, cadéntes omnes pópuli, tribus, et linguæ adoravérunt státuam áuream, quam constitúerat Nabuchodónosor rex.
  "8": 'Statímque in ipso témpore accedéntes viri Chaldǽi accusavérunt Iudǽos:'
  "9": 'dixerúntque Nabuchodónosor regi: Rex in ætérnum vive:'
  "10": 'tu rex posuísti decrétum, ut omnis homo, qui audíerit sónitum tubæ, fístulæ, et cítharæ, sambúcæ, et psaltérii, et symphóniæ, et univérsi géneris musicórum, prostérnat se, et adóret státuam áuream:'
  "11": si quis autem non prócidens adoráverit, mittátur in fornácem ignis ardéntis.
  "12": 'Sunt ergo viri Iudǽi, quos constituísti super ópera regiónis Babylónis, Sidrach, Misach, et Abdénago: viri isti contempsérunt, rex, decrétum tuum: deos tuos non colunt, et státuam áuream, quam erexísti, non adórant.'
  "13": 'Tunc Nabuchodónosor in furóre, et in ira præcépit ut adduceréntur Sidrach, Misach, et Abdénago: qui conféstim addúcti sunt in conspéctu regis.'
  "14": 'Pronuntiánsque Nabuchodónosor rex, ait eis: Veréne Sidrach, Misach, et Abdénago, deos meos non cólitis, et státuam áuream, quam constítui, non adorátis?'
  "15": 'Nunc ergo si estis paráti, quacúmque hora audiéritis sónitum tubæ, fístulæ, cítharæ, sambúcæ, et psaltérii, et symphóniæ, omnísque géneris musicórum, prostérnite vos, et adoráte státuam, quam feci: quod si non adoravéritis, eádem hora mittémini in fornácem ignis ardéntis: et quis est Deus, qui erípiet vos de manu mea?'
  "16": 'Respondéntes Sidrach, Misach, et Abdénago, dixérunt regi Nabuchodónosor: Non opórtet nos de hac re respondére tibi.'
  "17": Ecce enim Deus noster, quem cólimus, potest erípere nos de camíno ignis ardéntis, et de mánibus tuis, o rex, liberáre.
  "18": Quod si nolúerit, notum sit tibi, rex, quia deos tuos non cólimus, et státuam áuream, quam erexísti, non adorámus.
  "19": 'Tunc Nabuchodónosor replétus est furóre, et aspéctus faciéi illíus immutátus est super Sidrach, Misach, et Abdénago: et præcépit ut succenderétur fornax séptuplum quam succéndi consuéverat.'
  "20": Et viris fortíssimis de exércitu suo iussit ut ligátis pédibus Sidrach, Misach, et Abdénago, mítterent eos in fornácem ignis ardéntis.
  "21": 'Et conféstim viri illi vincti, cum braccis suis, et tiáris, et calceaméntis, et véstibus, missi sunt in médium fornácis ignis ardéntis:'
  "22": 'nam iússio regis urgébat: fornax autem succénsa erat nimis. Porro viros illos, qui míserant Sidrach, Misach, et Abdénago, interfécit flamma ignis.'
  "23": Viri autem hi tres, id est, Sidrach, Misach, et Abdénago, cecidérunt in médio camíno ignis ardéntis, colligáti.
  "24": '[Quæ sequúntur in Hebrǽis volumínibus non réperi.] Et ambulábant in médio flammæ, laudántes Deum, et benedicéntes Dómino.'
  "25": 'Stans autem Azarías orávit sic, aperiénsque os suum in médio ignis, ait:'
  "26": 'Benedíctus es Dómine Deus patrum nostrórum, et laudábile, et gloriósum nomen tuum in sǽcula:'
  "27": quia iustus es in ómnibus, quæ fecísti nobis, et univérsa ópera tua vera, et viæ tuæ rectæ, et ómnia iudícia tua vera.
  "28": 'Iudícia enim vera fecísti iuxta ómnia, quæ induxísti super nos, et super civitátem sanctam patrum nostrórum Ierúsalem: quia in veritáte, et in iudício induxísti ómnia hæc propter peccáta nostra.'
  "29": 'Peccávimus enim, et iníque égimus recedéntes a te, et delíquimus in ómnibus:'
  "30": et præcépta tua non audívimus, nec observávimus, nec fécimus sicut præcéperas nobis ut bene nobis esset.
  "31": 'Omnia ergo, quæ induxísti super nos, et univérsa, quæ fecísti nobis, in vero iudício fecísti:'
  "32": et tradidísti nos in mánibus inimicórum nostrórum iniquórum, et pessimórum, prævaricatorúmque, et regi iniústo, et péssimo ultra omnem terram.
  "33": 'Et nunc non póssumus aperíre os: confúsio, et oppróbrium facti sumus servis tuis, et his, qui colunt te.'
  "34": 'Ne, quǽsumus, tradas nos in perpétuum propter nomen tuum, et ne díssipes testaméntum tuum:'
  "35": neque áuferas misericórdiam tuam a nobis, propter Abraham, diléctum tuum, et Isaac, servum tuum, et Israel, sanctum tuum,
  "36": 'quibus locútus es póllicens quod multiplicáres semen eórum sicut stellas cæli, et sicut arénam, quæ est in líttore maris:'
  "37": quia Dómine imminúti sumus plus quam omnes gentes, sumúsque húmiles in univérsa terra hódie propter peccáta nostra.
  "38": Et non est in témpore hoc princeps, et dux, et prophéta, neque holocáustum, neque sacrifícium, neque oblátio, neque incénsum, neque locus primitiárum coram te,
  "39": 'ut possímus inveníre misericórdiam tuam: sed in ánimo contríto, et spíritu humilitátis suscipiámur.'
  "40": 'Sicut in holocáusto aríetum, et taurórum, et sicut in míllibus agnórum pínguium: sic fiat sacrifícium nostrum in conspéctu tuo hódie, ut pláceat tibi, quóniam non est confúsio confidéntibus in te.'
  "41": 'Et nunc séquimur te in toto corde: et timémus te, et quǽrimus fáciem tuam.'
  "42": Nec confúndas nos, sed fac nobíscum iuxta mansuetúdinem tuam, et secúndum multitúdinem misericórdiæ tuæ.
  "43": 'Et érue nos in mirabílibus tuis, et da glóriam nómini tuo Dómine:'
  "44": 'et confundántur omnes, qui osténdunt servis tuis mala: confundántur in omni poténtia tua, et robur eórum conterátur:'
  "45": et sciant quia tu es Dóminus Deus solus, et gloriósus super orbem terrárum.
  "46": Et non cessábant qui míserant eos minístri regis succéndere fornácem, naphtha, et stuppa, et pice, et malléolis,
  "47": 'et effundebátur flamma super fornácem cúbitis quadragínta novem:'
  "48": et erúpit, et incéndit quos réperit iuxta fornácem de Chaldǽis.
  "49": 'Angelus autem Dómini descéndit cum Azaría, et sóciis eius in fornácem: et excússit flammam ignis de fornáce,'
  "50": et fecit médium fornácis quasi ventum roris flantem, et non tétigit eos omníno ignis, neque contristávit, nec quidquam moléstiæ íntulit.
  "51": 'Tunc hi tres quasi ex uno ore laudábant, et glorificábant, et benedicébant Deum in fornáce, dicéntes:'
  "52": 'Benedíctus es Dómine Deus patrum nostrórum: et laudábilis, et gloriósus, et superexaltátus in sǽcula. Et benedíctum nomen glóriæ tuæ sanctum: et laudábile, et superexaltátum in ómnibus sǽculis.'
  "53": 'Benedíctus es in templo sancto glóriæ tuæ: et superlaudábilis, et supergloriósus in sǽcula.'
  "54": 'Benedíctus es in throno regni tui: et superlaudábilis, et superexaltátus in sǽcula.'
  "55": 'Benedíctus es, qui intuéris abýssos, et sedes super chérubim: et laudábilis, et superexaltátus in sǽcula.'
  "56": 'Benedíctus es in firmaménto cæli: et laudábilis et gloriósus in sǽcula.'
  "57": 'Benedícite ómnia ópera Dómini Dómino: laudáte et superexaltáte eum in sǽcula.'
  "58": 'Benedícite ángeli Dómini Dómino: laudáte et superexaltáte eum in sǽcula.'
  "59": 'Benedícite cæli Dómino: laudáte et superexaltáte eum in sǽcula.'
  "60": 'Benedícite aquæ omnes, quæ super cælos sunt, Dómino: laudáte et superexaltáte eum in sǽcula.'
  "61": 'Benedícite omnes virtútes Dómini Dómino: laudáte et superexaltáte eum in sǽcula.'
  "62": 'Benedícite sol, et luna Dómino: laudáte et superexaltáte eum in sǽcula.'
  "63": 'Benedícite stellæ cæli Dómino: laudáte et superexaltáte eum in sǽcula.'
  "64": 'Benedícite omnis imber, et ros Dómino: laudáte et superexaltáte eum in sǽcula.'
  "65": 'Benedícite omnes spíritus Dei Dómino: laudáte et superexaltáte eum in sǽcula.'
  "66": 'Benedícite ignis, et æstus Dómino: laudáte et superexaltáte eum in sǽcula.'
  "67": 'Benedícite frigus, et æstus Dómino: laudáte et superexaltáte eum in sǽcula.'
  "68": 'Benedícite rores, et pruína Dómino: laudáte et superexaltáte eum in sǽcula.'
  "69": 'Benedícite gelu, et frigus Dómino: laudáte et superexaltáte eum in sǽcula.'
  "70": 'Benedícite glácies, et nives Dómino: laudáte et superexaltáte eum in sǽcula.'
  "71": 'Benedícite noctes, et dies Dómino: laudáte et superexaltáte eum in sǽcula.'
  "72": 'Benedícite lux, et ténebræ Dómino: laudáte et superexaltáte eum in sǽcula.'
  "73": 'Benedícite fúlgura, et nubes Dómino: laudáte et superexaltáte eum in sǽcula.'
  "74": 'Benedícat terra Dóminum: laudet et superexáltet eum in sǽcula.'
  "75": 'Benedícite montes, et colles Dómino: laudáte et superexaltáte eum in sǽcula.'
  "76": 'Benedícite univérsa germinántia in terra Dómino: laudáte et superexaltáte eum in sǽcula.'
  "77": 'Benedícite fontes Dómino: laudáte et superexaltáte eum in sǽcula.'
  "78": 'Benedícite mária, et flúmina Dómino: laudáte et superexaltáte eum in sǽcula.'
  "79": 'Benedícite cete, et ómnia, quæ movéntur in aquis Dómino: laudáte et superexaltáte eum in sǽcula.'
  "80": 'Benedícite omnes vólucres cæli Dómino: laudáte et superexaltáte eum in sǽcula.'
  "81": 'Benedícite omnes béstiæ, et pécora Dómino: laudáte et superexaltáte eum in sǽcula.'
  "82": 'Benedícite fílii hóminum Dómino: laudáte et superexaltáte eum in sǽcula.'
  "83": 'Benedícat Israel Dóminum: laudet et superexáltet eum in sǽcula.'
  "84": 'Benedícite sacerdótes Dómini Dómino: laudáte et superexaltáte eum in sǽcula.'
  "85": 'Benedícite servi Dómini Dómino: laudáte et superexaltáte eum in sǽcula.'
  "86": 'Benedícite spíritus, et ánimæ iustórum Dómino: laudáte et superexaltáte eum in sǽcula.'
  "87": 'Benedícite sancti, et húmiles corde Dómino: laudáte et superexaltáte eum in sǽcula.'
  "88": 'Benedícite Ananía, Azaría, Mísael Dómino: laudáte et superexaltáte eum in sǽcula: quia éruit nos de inférno, et salvos fecit de manu mortis: et liberávit nos de médio ardéntis flammæ, et de médio ignis éruit nos.'
  "89": 'Confitémini Dómino, quóniam bonus: quóniam in sǽculum misericórdia eius.'
  "90": 'Benedícite omnes religiósi Dómino Deo deórum: laudáte et confitémini ei, quia in ómnia sǽcula misericórdia eius.'
  "91": '[Hucúsque in Hebrǽo non habétur: et quæ posúimus, de Theodotiónis editióne transláta sunt.] Tunc Nabuchodónosor rex obstúpuit, et surréxit própere, et ait optimátibus suis: Nonne tres viros mísimus in médium ignis compedítos? Qui respondéntes regi, dixérunt: Vere rex.'
  "92": 'Respóndit, et ait: Ecce ego vídeo quátuor viros solútos, et ambulántes in médio ignis, et nihil corruptiónis in eis est, et spécies quarti símilis fílio Dei.'
  "93": 'Tunc accéssit Nabuchodónosor ad óstium fornácis ignis ardéntis, et ait: Sidrach, Misach, et Abdénago, servi Dei excélsi, egredímini, et veníte. Statímque egréssi sunt Sidrach, Misach, et Abdénago de médio ignis.'
  "94": Et congregáti sátrapæ, et magistrátus, et iúdices, et poténtes regis contemplabántur viros illos, quóniam nihil potestátis habuísset ignis in corpóribus eórum, et capíllus cápitis eórum non esset adústus, et sarabála eórum non fuíssent immutáta, et odor ignis non transísset per eos.
  "95": 'Et erúmpens Nabuchodónosor, ait: Benedíctus Deus eórum, Sidrach vidélicet, Misach, et Abdénago: qui misit ángelum suum, et éruit servos suos, qui credidérunt in eum: et verbum regis immutavérunt, et tradidérunt córpora sua ne servírent, et ne adorárent omnem deum, excépto Deo suo.'
  "96": 'A me ergo pósitum est hoc decrétum: ut omnis pópulus, tribus, et lingua, quæcúmque locúta fúerit blasphémiam contra Deum Sidrach, Misach, et Abdénago, dispéreat, et domus eius vastétur: neque enim est álius Deus, qui possit ita salváre.'
  "97": Tunc rex promóvit Sidrach, Misach, et Abdénago in província Babylónis.
  "98": Nabuchodónosor rex, ómnibus pópulis, géntibus, et linguis, qui hábitant in univérsa terra, pax vobis multiplicétur.
  "99": Signa, et mirabília fecit apud me Deus excélsus. Plácuit ergo mihi prædicáre
  "100": 'signa eius, quia magna sunt: et mirabília eius, quia fórtia: et regnum eius regnum sempitérnum, et potéstas eius in generatiónem et generatiónem.'
