bible: vulgate
lang: la
language: Latina
book: Ezechiel
chapter: "11"
verses:
  "1": 'Et elevávit me spíritus, et introdúxit me ad portam domus Dómini orientálem, quæ réspicit ad solis ortum: et ecce in intróitu portæ vigínti quinque viri: et vidi in médio eórum Iezoníam fílium Azur, et Pheltíam fílium Banaíæ, príncipes pópuli.'
  "2": 'Dixítque ad me: Fili hóminis, hi sunt viri, qui cógitant iniquitátem, et tractant consílium péssimum in urbe ista,'
  "3": 'dicéntes: Nonne dudum ædificátæ sunt domus? hæc est lebes, nos autem carnes.'
  "4": Idcírco vaticináre de eis, vaticináre fili hóminis.
  "5": 'Et írruit in me spíritus Dómini, et dixit ad me: Lóquere: Hæc dicit Dóminus: Sic locúti estis domus Israel, et cogitatiónes cordis vestri ego novi.'
  "6": Plúrimos occidístis in urbe hac, et impléstis vias eius interféctis.
  "7": 'Proptérea hæc dicit Dóminus Deus: Interfécti vestri, quos posuístis in médio eius, hi sunt carnes, et hæc est lebes: et edúcam vos de médio eius.'
  "8": Gládium metuístis, et gládium indúcam super vos, ait Dóminus Deus.
  "9": Et eíciam vos de médio eius, dabóque vos in manu hóstium, et fáciam in vobis iudícia.
  "10": 'Gládio cadétis: in fínibus Israel iudicábo vos, et sciétis quia ego Dóminus.'
  "11": 'Hæc non erit vobis in lebétem, et vos non éritis in médio eius in carnes: in fínibus Israel iudicábo vos.'
  "12": 'Et sciétis quia ego Dóminus: quia in præcéptis meis non ambulástis, et iudícia mea non fecístis, sed iuxta iudícia géntium, quæ in circúitu vestro sunt, estis operáti.'
  "13": 'Et factum est cum prophetárem, Pheltías fílius Banaíæ mórtuus est: et cécidi in fáciem meam clamans voce magna, et dixi: Heu, heu, heu Dómine Deus: consummatiónem tu facis reliquiárum Israel?'
  "14": 'Et factum est verbum Dómini ad me, dicens:'
  "15": 'Fili hóminis, fratres tui, fratres tui, viri propínqui tui, et omnis domus Israel, univérsi, quibus dixérunt habitatóres Ierúsalem: Longe recédite a Dómino: nobis data est terra in possessiónem.'
  "16": 'Proptérea hæc dicit Dóminus Deus: Quia longe feci eos in géntibus, et quia dispérsi eos in terris: ero eis in sanctificatiónem módicam in terris, ad quas venérunt.'
  "17": 'Proptérea lóquere: Hæc dicit Dóminus Deus: Congregábo vos de pópulis, et adunábo de terris, in quibus dispérsi estis, dabóque vobis humum Israel.'
  "18": Et ingrediéntur illuc, et áuferent omnes offensiónes, cunctásque abominatiónes eius de illa.
  "19": 'Et dabo eis cor unum, et spíritum novum tríbuam in viscéribus eórum: et áuferam cor lapídeum de carne eórum, et dabo eis cor cárneum:'
  "20": 'ut in præcéptis meis ámbulent, et iudícia mea custódiant, faciántque ea: et sint mihi in pópulum, et ego sim eis in Deum.'
  "21": Quorum cor post offendícula et abominatiónes suas ámbulat, horum viam in cápite suo ponam, dicit Dóminus Deus.
  "22": 'Et elevavérunt chérubim alas suas, et rotæ cum eis: et glória Dei Israel erat super ea.'
  "23": Et ascéndit glória Dómini de médio civitátis, stetítque super montem, qui est ad oriéntem urbis.
  "24": 'Et spíritus levávit me, adduxítque in Chaldǽam ad transmigratiónem, in visióne in spíritu Dei: et subláta est a me vísio, quam víderam.'
  "25": Et locútus sum ad transmigratiónem ómnia verba Dómini, quæ osténderat mihi.
