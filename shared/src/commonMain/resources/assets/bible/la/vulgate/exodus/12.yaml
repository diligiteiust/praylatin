bible: vulgate
lang: la
language: Latina
book: Exodus
chapter: "12"
verses:
  "1": 'Dixit quoque Dóminus ad Móysen et Aaron in terra Ægýpti:'
  "2": 'Mensis iste, vobis princípium ménsium: primus erit in ménsibus anni.'
  "3": 'Loquímini ad univérsum cœtum filiórum Israel, et dícite eis: Décima die mensis huius tollat unusquísque agnum per famílias et domos suas.'
  "4": Sin autem minor est númerus ut suffícere possit ad vescéndum agnum, assúmet vicínum suum qui iunctus est dómui suæ, iuxta númerum animárum quæ suffícere possunt ad esum agni.
  "5": 'Erit autem agnus absque mácula, másculus, annículus: iuxta quem ritum tollétis et hædum.'
  "6": 'Et servábitis eum usque ad quartam décimam diem mensis huius: immolabítque eum univérsa multitúdo filiórum Israel ad vésperam.'
  "7": Et sument de sánguine eius, ac ponent super utrúmque postem, et in superlimináribus domórum, in quibus cómedent illum.
  "8": Et edent carnes nocte illa assas igni, et ázymos panes cum lactúcis agréstibus.
  "9": 'Non comedétis ex eo crudum quid, nec coctum aqua, sed tantum assum igni: caput cum pédibus eius et intestínis vorábitis.'
  "10": 'Nec remanébit quidquam ex eo usque mane: si quid resíduum fúerit, igne comburétis.'
  "11": 'Sic autem comedétis illum: renes vestros accingétis, et calceaménta habébitis in pédibus, tenéntes báculos in mánibus, et comedétis festinánter: est enim Phase (id est tránsitus) Dómini.'
  "12": 'Et transíbo per terram Ægýpti nocte illa, percutiámque omne primogénitum in terra Ægýpti ab hómine usque ad pecus: et in cunctis diis Ægýpti fáciam iudícia. Ego Dóminus.'
  "13": 'Erit autem sanguis vobis in signum in ǽdibus in quibus éritis: et vidébo sánguinem, et transíbo vos: nec erit in vobis plaga dispérdens quando percússero terram Ægýpti.'
  "14": 'Habébitis autem hunc diem in monuméntum: et celebrábitis eam solémnem Dómino in generatiónibus vestris cultu sempitérno.'
  "15": 'Septem diébus ázyma comedétis: in die primo non erit ferméntum in dómibus vestris: quicúmque coméderit fermentátum, períbit ánima illa de Israel, a primo die usque ad diem séptimum.'
  "16": 'Dies prima erit sancta atque solémnis, et dies séptima eádem festivitáte venerábilis: nihil óperis faciétis in eis, excéptis his, quæ ad vescéndum pértinent.'
  "17": 'Et observábitis ázyma: in eádem enim ipsa die edúcam exércitum vestrum de terra Ægýpti, et custodiétis diem istum in generatiónes vestras ritu perpétuo.'
  "18": Primo mense, quartadécima die mensis ad vésperam, comedétis ázyma usque ad diem vigésimam primam eiúsdem mensis ad vésperam.
  "19": 'Septem diébus ferméntum non inveniétur in dómibus vestris: qui coméderit fermentátum, períbit ánima eius de cœtu Israel, tam de ádvenis quam de indígenis terræ.'
  "20": 'Omne fermentátum non comedétis: in cunctis habitáculis vestris edétis ázyma.'
  "21": 'Vocávit autem Móyses omnes senióres filiórum Israel, et dixit ad eos: Ite tolléntes ánimal per famílias vestras, et immoláte Phase.'
  "22": 'Fasciculúmque hyssópi tíngite in sánguine qui est in límine, et aspérgite ex eo superlimináre, et utrúmque postem: nullus vestrum egrediátur óstium domus suæ usque mane.'
  "23": 'Transíbit enim Dóminus percútiens Ægýptios: cumque víderit sánguinem in superliminári, et in utróque poste, transcéndet óstium domus, et non sinet percussórem íngredi domos vestras et lǽdere.'
  "24": Custódi verbum istud legítimum tibi et fíliis tuis usque in ætérnum.
  "25": Cumque introiéritis terram, quam Dóminus datúrus est vobis ut pollícitus est, observábitis cæremónias istas.
  "26": 'Et cum díxerint vobis fílii vestri: Quæ est ista relígio?'
  "27": 'Dicétis eis: Víctima tránsitus Dómini est, quando transívit super domos filiórum Israel in Ægýpto, percútiens Ægýptios, et domos nostras líberans. Incurvatúsque pópulus adorávit.'
  "28": Et egréssi fílii Israel fecérunt sicut præcéperat Dóminus Móysi et Aaron.
  "29": Factum est autem in noctis médio, percússit Dóminus omne primogénitum in terra Ægýpti, a primogénito Pharaónis, qui in sólio eius sedébat, usque ad primogénitum captívæ quæ erat in cárcere, et omne primogénitum iumentórum.
  "30": 'Surrexítque Phárao nocte, et omnes servi eius, cunctáque Ægýptus: et ortus est clamor magnus in Ægýpto: neque enim erat domus in qua non iacéret mórtuus.'
  "31": 'Vocatísque Phárao Móyse et Aaron nocte, ait: Súrgite et egredímini a pópulo meo, vos et fílii Israel: ite, immoláte Dómino sicut dícitis.'
  "32": Oves vestras et arménta assúmite ut petierátis, et abeúntes benedícite mihi.
  "33": 'Urgebántque Ægýptii pópulum de terra exíre velóciter, dicéntes: Omnes moriémur.'
  "34": 'Tulit ígitur pópulus conspérsam farínam ántequam fermentarétur: et ligans in pálliis, pósuit super húmeros suos.'
  "35": 'Fecerúntque fílii Israel sicut præcéperat Móyses: et petiérunt ab Ægýptiis vasa argéntea et áurea, vestémque plúrimam.'
  "36": 'Dóminus autem dedit grátiam pópulo coram Ægýptiis ut commodárent eis: et spoliavérunt Ægýptios.'
  "37": Profectíque sunt fílii Israel de Ramésse in Socoth, sexcénta fere míllia péditum virórum, absque párvulis.
  "38": Sed et vulgus promíscuum innumerábile ascéndit cum eis, oves et arménta et animántia divérsi géneris multa nimis.
  "39": 'Coxerúntque farínam, quam dudum de Ægýpto conspérsam túlerant: et fecérunt subcinerícios panes ázymos: neque enim póterant fermentári, cogéntibus exíre Ægýptiis, et nullam fácere sinéntibus moram: nec pulménti quidquam occúrrerat præparáre.'
  "40": Habitátio autem filiórum Israel qua mansérunt in Ægýpto, fuit quadringentórum trigínta annórum.
  "41": Quibus explétis, eádem die egréssus est omnis exércitus Dómini de terra Ægýpti.
  "42": 'Nox ista est observábilis Dómini, quando edúxit eos de terra Ægýpti: hanc observáre debent omnes fílii Israel in generatiónibus suis.'
  "43": 'Dixítque Dóminus ad Móysen et Aaron: Hæc est relígio Phase: Omnis alienígena non cómedet ex eo.'
  "44": Omnis autem servus emptítius circumcidétur, et sic cómedet.
  "45": Advena et mercenárius non edent ex eo.
  "46": In una domo comedétur, nec efferétis de cárnibus eius foras, nec os illíus confringétis.
  "47": Omnis cœtus filiórum Israel fáciet illud.
  "48": 'Quod si quis peregrinórum in vestram volúerit transíre colóniam, et fácere Phase Dómini, circumcidétur prius omne masculínum eius, et tunc rite celebrábit: erítque sicut indígena terræ: si quis autem circumcísus non fúerit, non vescétur ex eo.'
  "49": Eadem lex erit indígenæ et colóno qui peregrinátur apud vos.
  "50": Fecerúntque omnes fílii Israel sicut præcéperat Dóminus Móysi et Aaron.
  "51": Et eádem die edúxit Dóminus fílios Israel de terra Ægýpti per turmas suas.
