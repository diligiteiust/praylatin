bible: vulgate
lang: la
language: Latina
book: Isaias
chapter: "41"
verses:
  "1": 'Táceant ad me ínsulæ, et gentes mutent fortitúdinem: accédant, et tunc loquántur: simul ad iudícium propinquémus.'
  "2": 'Quis suscitávit ab oriénte iustum, vocávit eum ut sequerétur se? dabit in conspéctu eius gentes, et reges obtinébit: dabit quasi púlverem gládio eius, sicut stípulam vento raptam árcui eius.'
  "3": 'Persequétur eos, transíbit in pace: sémita in pédibus eius non apparébit.'
  "4": 'Quis hæc operátus est, et fecit, vocans generatiónes ab exórdio? Ego Dóminus: primus et novíssimus ego sum.'
  "5": Vidérunt ínsulæ, et timuérunt, extréma terræ obstupuérunt, appropinquavérunt, et accessérunt.
  "6": 'Unusquísque próximo suo auxiliábitur, et fratri suo dicet: Confortáre.'
  "7": 'Confortávit faber ærárius percútiens málleo eum, qui cudébat tunc témporis, dicens: Glútino bonum est: et confortávit eum clavis, ut non moverétur.'
  "8": 'Et tu Israel serve meus, Iacob quem elégi, semen Abraham amíci mei:'
  "9": 'in quo apprehéndi te ab extrémis terræ, et a longínquis eius vocávi te, et dixi tibi: Servus meus es tu, elégi te, et non abiéci te.'
  "10": 'Ne tímeas, quia ego tecum sum: ne declínes, quia ego Deus tuus: confortávi te, et auxiliátus sum tibi, et suscépit te déxtera iusti mei.'
  "11": 'Ecce confundéntur et erubéscent omnes, qui pugnant advérsum te: erunt quasi non sint, et períbunt viri, qui contradícunt tibi.'
  "12": 'Quæres eos, et non invénies, viros rebélles tuos: erunt quasi non sint: et véluti consúmptio hómines bellántes advérsum te.'
  "13": 'Quia ego Dóminus Deus tuus, apprehéndens manum tuam, dicénsque tibi: Ne tímeas, ego adiúvi te.'
  "14": 'Noli timére vermis Iacob, qui mórtui estis ex Israel: ego auxiliátus sum tibi, dicit Dóminus, et redémptor tuus Sanctus Israel.'
  "15": 'Ego pósui te quasi plaustrum tritúrans novum, habens rostra serrántia: triturábis montes, et commínues: et colles quasi púlverem pones.'
  "16": 'Ventilábis eos, et ventus tollet, et turbo dispérget eos: et tu exsultábis in Dómino, in sancto Israel lætáberis.'
  "17": 'Egéni et páuperes quærunt aquas, et non sunt: lingua eórum siti áruit. Ego Dóminus exáudiam eos, Deus Israel non derelínquam eos.'
  "18": 'Apériam in supínis cóllibus flúmina, et in médio campórum fontes: ponam desértum in stagna aquárum, et terram ínviam in rivos aquárum.'
  "19": 'Dabo in solitúdinem cedrum, et spinam, et myrtum, et lignum olívæ: ponam in desérto abiétem, ulmum, et buxum simul:'
  "20": ut vídeant, et sciant, et recógitent, et intélligant páriter, quia manus Dómini fecit hoc, et sanctus Israel creávit illud.
  "21": 'Prope fácite iudícium vestrum, dicit Dóminus: Afférte, si quid forte habétis, dicit rex Iacob.'
  "22": 'Accédant, et núntient nobis quæcúmque ventúra sunt: prióra quæ fuérunt nuntiáte: et ponémus cor nostrum, et sciémus novíssima eórum, et quæ ventúra sunt indicáte nobis.'
  "23": 'Annuntiáte quæ ventúra sunt in futúrum, et sciémus quia dii estis vos: bene quoque aut male, si potéstis, fácite: et loquámur, et videámus simul.'
  "24": 'Ecce vos estis ex níhilo, et opus vestrum ex eo, quod non est: abominátio est qui elégit vos.'
  "25": 'Suscitávi ab aquilóne, et véniet ab ortu solis: vocábit nomen meum, et addúcet magistrátus quasi lutum, et velut plastes concúlcans humum.'
  "26": 'Quis annuntiávit ab exórdio ut sciámus: et a princípio ut dicámus: Iustus es? non est neque annúntians, neque prædícens, neque áudiens sermónes vestros.'
  "27": 'Primus ad Sion dicet: Ecce adsunt, et Ierúsalem evangelístam dabo.'
  "28": Et vidi, et non erat neque ex istis quisquam qui iníret consílium, et interrogátus respondéret verbum.
  "29": 'Ecce omnes iniústi, et vana ópera eórum: ventus et ináne simulácra eórum.'
