bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "87"
verses:
  "1": Cánticum Psalmi, fíliis Core, in finem, pro Máheleth ad respondéndum, intelléctus Eman Ezrahítæ.
  "2": Dómine Deus salútis meæ, in die clamávi et nocte coram te.
  "3": 'Intret in conspéctu tuo orátio mea: inclína aurem tuam ad precem meam:'
  "4": 'quia repléta est malis ánima mea: et vita mea inférno appropinquávit.'
  "5": 'Æstimátus sum cum descendéntibus in lacum: factus sum sicut homo sine adiutório,'
  "6": 'inter mórtuos liber: sicut vulneráti dormiéntes in sepúlcris, quorum non es memor ámplius: et ipsi de manu tua repúlsi sunt.'
  "7": 'Posuérunt me in lacu inferióri: in tenebrósis, et in umbra mortis.'
  "8": 'Super me confirmátus est furor tuus: et omnes fluctus tuos induxísti super me.'
  "9": 'Longe fecísti notos meos a me: posuérunt me abominatiónem sibi. Tráditus sum, et non egrediébar:'
  "10": 'óculi mei languérunt præ inópia. Clamávi ad te Dómine tota die: expándi ad te manus meas.'
  "11": 'Numquid mórtuis fácies mirabília: aut médici suscitábunt, et confitebúntur tibi?'
  "12": Numquid narrábit áliquis in sepúlcro misericórdiam tuam, et veritátem tuam in perditióne?
  "13": 'Numquid cognoscéntur in ténebris mirabília tua: et iustítia tua in terra obliviónis?'
  "14": 'Et ego ad te Dómine clamávi: et mane orátio mea prævéniet te.'
  "15": 'Ut quid Dómine repéllis oratiónem meam: avértis fáciem tuam a me?'
  "16": 'Pauper sum ego, et in labóribus a iuventúte mea: exaltátus autem, humiliátus sum et conturbátus.'
  "17": 'In me transiérunt iræ tuæ: et terróres tui conturbavérunt me.'
  "18": 'Circumdedérunt me sicut aqua tota die: circumdedérunt me simul.'
  "19": Elongásti a me amícum et próximum, et notos meos a miséria.
