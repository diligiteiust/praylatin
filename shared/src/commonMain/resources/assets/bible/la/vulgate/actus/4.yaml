bible: vulgate
lang: la
language: Latina
book: Actus Apostolorum
chapter: "4"
verses:
  "1": Loquéntibus autem illis ad pópulum, supervenérunt sacerdótes, et magistrátus templi, et Sadducǽi,
  "2": 'doléntes quod docérent pópulum, et annuntiárent in Iesu resurrectiónem ex mórtuis:'
  "3": 'et iniecérunt in eos manus, et posuérunt eos in custódiam in crástinum: erat enim iam véspera.'
  "4": 'Multi autem eórum, qui audíerant verbum, credidérunt: et factus est númerus virórum quinque míllia.'
  "5": 'Factum est autem in crástinum, ut congregaréntur príncipes eórum, et senióres, et scribæ, in Ierúsalem:'
  "6": et Annas princeps sacerdótum, et Caíphas, et Ioánnes, et Alexánder, et quotquot erant de génere sacerdotáli.
  "7": 'Et statuéntes eos in médio, interrogábant: In qua virtúte, aut in quo nómine fecístis hoc vos?'
  "8": 'Tunc replétus Spíritu sancto Petrus, dixit ad eos: Príncipes pópuli, et senióres audíte:'
  "9": si nos hódie diiudicámur in benefácto hóminis infírmi, in quo iste salvus factus est,
  "10": notum sit ómnibus vobis, et omni plebi Israel, quia in nómine Dómini nostri Iesu Christi Nazaréni, quem vos crucifixístis, quem Deus suscitávit a mórtuis, in hoc iste astat coram vobis sanus.
  "11": 'Hic est lapis, qui reprobátus est a vobis ædificántibus, qui factus est in caput ánguli:'
  "12": et non est in álio áliquo salus. Nec enim áliud nomen est sub cælo datum homínibus, in quo opórteat nos salvos fíeri.
  "13": 'Vidéntes autem Petri constántiam, et Ioánnis, compérto quod hómines essent sine lítteris, et idiótæ, admirabántur, et cognoscébant eos quóniam cum Iesu fúerant:'
  "14": hóminem quoque vidéntes stantem cum eis, qui curátus fúerat, nihil póterant contradícere.
  "15": 'Iussérunt autem eos foras extra concílium secédere: et conferébant ad ínvicem,'
  "16": 'dicéntes: Quid faciémus homínibus istis? quóniam quidem notum signum factum est per eos, ómnibus habitántibus Ierúsalem: maniféstum est, et non póssumus negáre.'
  "17": Sed ne ámplius divulgétur in pópulum, comminémur eis, ne ultra loquántur in nómine hoc ulli hóminum.
  "18": Et vocántes eos, denuntiavérunt ne omníno loqueréntur, neque docérent in nómine Iesu.
  "19": 'Petrus vero, et Ioánnes respondéntes, dixérunt ad eos: Si iustum est in conspéctu Dei vos pótius audíre quam Deum, iudicáte.'
  "20": Non enim póssumus quæ vídimus et audívimus non loqui.
  "21": 'At illi comminántes dimisérunt eos, non inveniéntes quómodo punírent eos propter pópulum: quia omnes clarificábant id, quod factum fúerat in eo quod accíderat.'
  "22": Annórum enim erat ámplius quadragínta homo, in quo factum fúerat signum istud sanitátis.
  "23": Dimíssi autem venérunt ad suos, et annuntiavérunt eis quanta ad eos príncipes sacerdótum, et senióres dixíssent.
  "24": 'Qui cum audíssent, unanímiter levavérunt vocem ad Deum, et dixérunt: Dómine, tu es qui fecísti cælum, et terram, mare, et ómnia, quæ in eis sunt:'
  "25": 'qui Spíritu sancto per os patris nostri David púeri tui dixísti: Quare fremuérunt gentes, et pópuli meditáti sunt inánia?'
  "26": Astitérunt reges terræ, et príncipes convenérunt in unum advérsus Dóminum, et advérsus Christum eius.
  "27": Convenérunt enim vere in civitáte ista advérsus sanctum púerum tuum Iesum, quem unxísti, Heródes, et Póntius Pilátus, cum géntibus, et pópulis Israel,
  "28": fácere quæ manus tua, et consílium tuum decrevérunt fíeri.
  "29": Et nunc Dómine réspice in minas eórum, et da servis tuis cum omni fidúcia loqui verbum tuum,
  "30": in eo quod manum tuam exténdas ad sanitátes, et signa, et prodígia fíeri per nomen sancti Fílii tui Iesu.
  "31": 'Et cum orássent, motus est locus, in quo erant congregáti: et repléti sunt omnes Spíritu sancto, et loquebántur verbum Dei cum fidúcia.'
  "32": 'Multitúdinis autem credéntium erat cor unum, et ánima una: nec quisquam eórum quæ possidébat, áliquid suum esse dicébat, sed erant illis ómnia commúnia.'
  "33": 'Et virtúte magna reddébant Apóstoli testimónium resurrectiónis Iesu Christi Dómini nostri: et grátia magna erat in ómnibus illis.'
  "34": Neque enim quisquam egens erat inter illos. Quotquot enim possessóres agrórum, aut domórum erant, vendéntes afferébant prétia eórum, quæ vendébant,
  "35": et ponébant ante pedes Apostolórum. Dividebátur autem síngulis prout cuíque opus erat.
  "36": Ioseph autem, qui cognominátus est Bárnabas ab Apóstolis (quod est interpretátum, Fílius consolatiónis), Levítes, Cýprius génere,
  "37": cum habéret agrum, véndidit eum, et áttulit prétium, et pósuit ante pedes Apostolórum.
