bible: vulgate
lang: la
language: Latina
book: I Paralipomenon
chapter: "24"
verses:
  "1": 'Porro fíliis Aaron hæ partitiónes erant: Fílii Aaron: Nadab, et Abiu, et Eleázar, et Ithamar.'
  "2": 'Mórtui sunt autem Nadab, et Abiu ante patrem suum absque líberis: sacerdotióque functus est Eleázar, et Ithamar.'
  "3": Et divísit eos David, id est, Sadoc de fíliis Eleázari, et Ahímelech de fíliis Ithamar, secúndum vices suas et ministérium.
  "4": 'Inventíque sunt multo plures fílii Eleázar in princípibus viris, quam fílii Ithamar. Divísit autem eis, hoc est, fíliis Eleázar, príncipes per famílias sédecim: et fíliis Ithamar per famílias et domos suas octo.'
  "5": 'Porro divísit utrásque inter se famílias sórtibus: erant enim príncipes sanctuárii, et príncipes Dei, tam de fíliis Eleázar, quam de fíliis Ithamar.'
  "6": 'Descripsítque eos Semeías fílius Nathánael scriba Levítes, coram rege et princípibus, et Sadoc sacerdóte, et Ahímelech fílio Abíathar, princípibus quoque familiárum sacerdotálium, et Leviticárum: unam domum, quæ céteris prǽerat, Eleázar: et álteram domum, quæ sub se habébat céteros, Ithamar.'
  "7": Exívit autem sors prima Ióiarib, secúnda Iédei,
  "8": tértia Harim, quarta Séorim,
  "9": quinta Melchía, sexta Máiman,
  "10": séptima Accos, octáva Abía,
  "11": nona Iésua, décima Sechenía,
  "12": undécima Elíasib, duodécima Iacim,
  "13": tertiadécima Hoppha, décima quarta Isbaab,
  "14": décima quinta Belga, décima sexta Emmer,
  "15": décima séptima Hezir, décima octáva Aphses,
  "16": décima nona Pheteía, vigésima Hezéchiel,
  "17": vigésima prima Iachin, vigésima secúnda Gamul,
  "18": vigésima tértia Dalaíau, vigésima quarta Maazíau.
  "19": Hæ vices eórum secúndum ministéria sua, ut ingrediántur domum Dómini, et iuxta ritum suum sub manu Aaron patris eórum, sicut præcéperat Dóminus Deus Israel.
  "20": Porro filiórum Levi, qui réliqui fúerant, de fíliis Amram erat Súbael, et de fíliis Súbael, Iehedeía.
  "21": De fíliis quoque Rohobíæ, princeps Iesías.
  "22": 'Isáari vero fílius Sálemoth, filiúsque Sálemoth Iahath:'
  "23": filiúsque eius Ieríau primus, Amarías secúndus, Iaháziel tértius, Iécmaan quartus.
  "24": 'Fílius Oziel, Micha: fílius Micha, Samir.'
  "25": 'Frater Micha, Iesía: filiúsque Iesíæ, Zacharías.'
  "26": 'Fílii Merári: Móholi, et Musi. Fílius Ozíau: Benno.'
  "27": 'Fílius quoque Merári: Ozíau, et Soam, et Zachur, et Hebri.'
  "28": 'Porro Móholi fílius: Eleázar, qui non habébat líberos.'
  "29": Fílius vero Cis, Ierámeel.
  "30": 'Fílii Musi: Móholi, Eder et Iérimoth: isti fílii Levi secúndum domos familiárum suárum.'
  "31": 'Miserúntque et ipsi sortes contra fratres suos fílios Aaron coram David rege, et Sadoc, et Ahímelech, et princípibus familiárum sacerdotálium et Leviticárum, tam maióres quam minóres: omnes sors æquáliter dividébat.'
