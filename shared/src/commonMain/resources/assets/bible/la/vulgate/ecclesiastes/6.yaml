bible: vulgate
lang: la
language: Latina
book: Ecclesiastes
chapter: "6"
verses:
  "1": 'Est et áliud malum, quod vidi sub sole, et quidem frequens apud hómines:'
  "2": 'vir, cui dedit Deus divítias, et substántiam, et honórem, et nihil deest ánimæ suæ ex ómnibus, quæ desíderat: nec tríbuit ei potestátem Deus ut cómedat ex eo, sed homo extráneus vorábit illud: hoc vánitas, et miséria magna est.'
  "3": 'Si genúerit quíspiam centum líberos, et víxerit multos annos, et plures dies ætátis habúerit, et ánima illíus non utátur bonis substántiæ suæ, sepulturáque cáreat: de hoc ego pronúntio quod mélior illo sit abortívus.'
  "4": Frustra enim venit, et pergit ad ténebras, et oblivióne delébitur nomen eius.
  "5": 'Non vidit solem, neque cognóvit distántiam boni et mali:'
  "6": 'étiam si duóbus míllibus annis víxerit, et non fúerit perfrúitus bonis: nonne ad unum locum próperant ómnia?'
  "7": 'Omnis labor hóminis in ore eius: sed ánima eius non implébitur.'
  "8": Quid habet ámplius sápiens a stulto? et quid pauper, nisi ut pergat illuc, ubi est vita?
  "9": Mélius est vidére quod cúpias, quam desideráre quod néscias. Sed et hoc vánitas est, et præsúmptio spíritus.
  "10": 'Qui futúrus est, iam vocátum est nomen eius: et scitur quod homo sit, et non possit contra fortiórem se in iudício conténdere.'
  "11": Verba sunt plúrima, multámque in disputándo habéntia vanitátem.
