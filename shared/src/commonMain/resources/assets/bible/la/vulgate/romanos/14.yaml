bible: vulgate
lang: la
language: Latina
book: ad Romanos
chapter: "14"
verses:
  "1": Infírmum autem in fide assúmite, non in disceptatiónibus cogitatiónum.
  "2": 'Alius enim credit se manducáre ómnia: qui autem infírmus est, olus mandúcet.'
  "3": 'Is, qui mandúcat, non manducántem non spernat: et qui non mandúcat, manducántem non iúdicet: Deus enim illum assúmpsit.'
  "4": 'Tu quis es, qui iúdicas aliénum servum? Dómino suo stat, aut cadit: stabit autem: potens est enim Deus statúere illum.'
  "5": 'Nam álius iúdicat diem inter diem: álius autem iúdicat omnem diem: unusquísque in suo sensu abúndet.'
  "6": 'Qui sapit diem, Dómino sapit: et qui mandúcat, Dómino mandúcat: grátias enim agit Deo. Et qui non mandúcat, Dómino non mandúcat, et grátias agit Deo.'
  "7": Nemo enim nostrum sibi vivit, et nemo sibi móritur.
  "8": 'Sive enim vívimus, Dómino vívimus: sive mórimur, Dómino mórimur. Sive ergo vívimus, sive mórimur, Dómini sumus.'
  "9": 'In hoc enim Christus mórtuus est, et resurréxit: ut et mortuórum et vivórum dominétur.'
  "10": Tu autem quid iúdicas fratrem tuum? aut tu quare spernis fratrem tuum? omnes enim stábimus ante tribúnal Christi.
  "11": 'Scriptum est enim: Vivo ego, dicit Dóminus, quóniam mihi flectétur omne genu: et omnis lingua confitébitur Deo.'
  "12": Itaque unusquísque nostrum pro se ratiónem reddet Deo.
  "13": 'Non ergo ámplius ínvicem iudicémus: sed hoc iudicáte magis, ne ponátis offendículum fratri, vel scándalum.'
  "14": Scio, et confído in Dómino Iesu, quia nihil commúne per ipsum, nisi ei qui exístimat quid commúne esse, illi commúne est.
  "15": Si enim propter cibum frater tuus contristátur, iam non secúndum caritátem ámbulas. Noli cibo tuo illum pérdere, pro quo Christus mórtuus est.
  "16": Non ergo blasphemétur bonum nostrum.
  "17": 'Non est enim regnum Dei esca, et potus: sed iustítia, et pax, et gáudium in Spíritu sancto:'
  "18": qui enim in hoc servit Christo, placet Deo, et probátus est homínibus.
  "19": 'Itaque quæ pacis sunt, sectémur: et quæ ædificatiónis sunt, in ínvicem custodiámus.'
  "20": 'Noli propter escam destrúere opus Dei: ómnia quidem sunt munda: sed malum est hómini, qui per offendículum mandúcat.'
  "21": Bonum est non manducáre carnem, et non bíbere vinum, neque in quo frater tuus offénditur, aut scandalizátur, aut infirmátur.
  "22": Tu fidem habes? penes temetípsum habe coram Deo. Beátus, qui non iúdicat semetípsum in eo, quod probat.
  "23": 'Qui autem discérnit, si manducáverit, damnátus est: quia non ex fide. Omne autem, quod non est ex fide, peccátum est.'
