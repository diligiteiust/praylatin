bible: vulgate
lang: la
language: Latina
book: I Samuelis
chapter: "6"
verses:
  "1": Fuit ergo arca Dómini in regióne Philisthinórum septem ménsibus.
  "2": 'Et vocavérunt Philísthiim sacerdótes et divínos, dicéntes: Quid faciémus de arca Dómini? indicáte nobis quómodo remittámus eam in locum suum. Qui dixérunt:'
  "3": 'Si remíttitis arcam Dei Israel, nolíte dimíttere eam vácuam, sed quod debétis, réddite ei pro peccáto, et tunc curabímini: et sciétis quare non recédat manus eius a vobis.'
  "4": 'Qui dixérunt: Quid est quod pro delícto réddere debeámus ei? Responderúntque illi:'
  "5": 'Iuxta númerum provinciárum Philisthinórum quinque anos áureos faciétis, et quinque mures áureos: quia plaga una fuit ómnibus vobis, et sátrapis vestris. Facietísque similitúdines anórum vestrórum, et similitúdines múrium, qui demolíti sunt terram: et dábitis Deo Israel glóriam, si forte rélevet manum suam a vobis, et a diis vestris, et a terra vestra.'
  "6": Quare aggravátis corda vestra, sicut aggravávit Ægýptus et Phárao cor suum? nonne postquam percússus est, tunc dimísit eos, et abiérunt?
  "7": 'Nunc ergo arrípite et fácite plaustrum novum unum: et duas vaccas fœtas, quibus non est impósitum iugum, iúngite in plaustro, et reclúdite vítulos eárum domi.'
  "8": 'Tolletísque arcam Dómini, et ponétis in plaustro, et vasa áurea, quæ exsolvístis ei pro delícto, ponétis in capséllam ad latus eius: et dimíttite eam ut vadat.'
  "9": 'Et aspiciétis: et si quidem per viam fínium suórum ascénderit contra Béthsames, ipse fecit nobis hoc malum grande: sin autem, mínime: sciémus quia nequáquam manus eius tétigit nos, sed casu áccidit.'
  "10": 'Fecérunt ergo illi hoc modo: et tolléntes duas vaccas, quæ lactábant vítulos, iunxérunt ad plaustrum, vitulósque eárum conclusérunt domi.'
  "11": Et posuérunt arcam Dei super plaustrum, et capséllam, quæ habébat mures áureos et similitúdines anórum.
  "12": 'Ibant autem in diréctum vaccæ per viam, quæ ducit Béthsames, et itínere uno gradiebántur, pergéntes et mugiéntes: et non declinábant neque ad dextram neque ad sinístram: sed et sátrapæ Philísthiim sequebántur usque ad términos Béthsames.'
  "13": 'Porro Bethsamítæ metébant tríticum in valle: et elevántes óculos suos, vidérunt arcam, et gavísi sunt cum vidíssent.'
  "14": Et plaustrum venit in agrum Iósue Bethsamítæ, et stetit ibi. Erat autem ibi lapis magnus, et concidérunt ligna plaustri, vaccásque imposuérunt super ea holocáustum Dómino.
  "15": Levítæ autem deposuérunt arcam Dei, et capséllam, quæ erat iuxta eam, in qua erant vasa áurea, et posuérunt super lápidem grandem. Viri autem Bethsamítæ obtulérunt holocáusta, et immolavérunt víctimas in die illa Dómino.
  "16": Et quinque sátrapæ Philisthinórum vidérunt, et revérsi sunt in Accaron in die illa.
  "17": 'Hi sunt autem ani áurei, quos reddidérunt Philísthiim pro delícto, Dómino: Azótus unum, Gaza unum, Ascalon unum, Geth unum, Accaron unum:'
  "18": et mures áureos secúndum númerum úrbium Philísthiim, quinque provinciárum, ab urbe muráta usque ad villam, quæ erat absque muro, et usque ad Abelmágnum, super quem posuérunt arcam Dómini, quæ erat usque in illum diem in agro Iósue Bethsamítis.
  "19": 'Percússit autem de viris Bethsamítibus, eo quod vidíssent arcam Dómini: et percússit de pópulo septuagínta viros, et quinquagínta míllia plebis. Luxítque pópulus, eo quod Dóminus percussísset plebem plaga magna.'
  "20": 'Et dixérunt viri Bethsamítæ: Quis póterit stare in conspéctu Dómini Dei sancti huius? et ad quem ascéndet a nobis?'
  "21": 'Miserúntque núntios ad habitatóres Cariathíarim, dicéntes: Reduxérunt Philísthiim arcam Dómini: descéndite, et redúcite eam ad vos.'
