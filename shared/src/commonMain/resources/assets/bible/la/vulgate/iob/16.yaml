bible: vulgate
lang: la
language: Latina
book: Iob
chapter: "16"
verses:
  "1": 'Respóndens autem Iob, dixit:'
  "2": Audívi frequénter tália, consolatóres onerósi omnes vos estis.
  "3": Numquid habébunt finem verba ventósa? aut áliquid tibi moléstum est si loquáris?
  "4": 'Póteram et ego simília vestri loqui: atque útinam esset ánima vestra pro ánima mea:'
  "5": 'consolárer et ego vos sermónibus, et movérem caput meum super vos:'
  "6": 'roborárem vos ore meo: et movérem lábia mea, quasi parcens vobis.'
  "7": 'Sed quid agam? Si locútus fúero, non quiéscet dolor meus: et si tacúero, non recédet a me.'
  "8": Nunc autem oppréssit me dolor meus, et in níhilum redácti sunt omnes artus mei.
  "9": Rugæ meæ testimónium dicunt contra me, et suscitátur falsíloquus advérsus fáciem meam contradícens mihi.
  "10": 'Collégit furórem suum in me, et cómminans mihi, infrémuit contra me déntibus suis: hostis meus terribílibus óculis me intúitus est.'
  "11": Aperuérunt super me ora sua, et exprobrántes percussérunt maxíllam meam, satiáti sunt pœnis meis.
  "12": Conclúsit me Deus apud iníquum, et mánibus impiórum me trádidit.
  "13": 'Ego ille quondam opuléntus, repénte contrítus sum: ténuit cervícem meam, confrégit me, et pósuit me sibi quasi in signum.'
  "14": Circúmdedit me lánceis suis, convulnerávit lumbos meos, non pepércit, et effúdit in terra víscera mea.
  "15": Concídit me vúlnere super vulnus, írruit in me quasi gigas.
  "16": Saccum cónsui super cutem meam, et opérui cínere carnem meam.
  "17": Fácies mea intúmuit a fletu, et pálpebræ meæ caligavérunt.
  "18": Hæc passus sum absque iniquitáte manus meæ, cum habérem mundas ad Deum preces.
  "19": Terra ne opérias sánguinem meum, neque invéniat in te locum laténdi clamor meus.
  "20": Ecce enim in cælo testis meus, et cónscius meus in excélsis.
  "21": 'Verbósi amíci mei: ad Deum stillat óculus meus.'
  "22": Atque útinam sic iudicarétur vir cum Deo, quómodo iudicátur fílius hóminis cum colléga suo.
  "23": Ecce enim breves anni tránseunt, et sémitam, per quam non revértar ámbulo.
