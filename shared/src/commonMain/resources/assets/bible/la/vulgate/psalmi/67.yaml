bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "67"
verses:
  "1": In finem, Psalmus cántici ipsi David.
  "2": 'Exsúrgat Deus, et dissipéntur inimíci eius: et fúgiant qui odérunt eum, a fácie eius.'
  "3": 'Sicut déficit fumus, defíciant: sicut fluit cera a fácie ignis, sic péreant peccatóres a fácie Dei.'
  "4": 'Et iusti epuléntur, et exsúltent in conspéctu Dei: et delecténtur in lætítia.'
  "5": 'Cantáte Deo, psalmum dícite nómini eius: iter fácite ei, qui ascéndit super occásum: Dóminus nomen illi. Exsultáte in conspéctu eius, turbabúntur a fácie eius,'
  "6": 'patris orphanórum, et iúdicis viduárum. Deus in loco sancto suo:'
  "7": 'Deus qui inhabitáre facit uníus moris in domo: qui edúcit vinctos in fortitúdine, simíliter eos qui exásperant, qui hábitant in sepúlcris.'
  "8": 'Deus cum egrederéris in conspéctu pópuli tui, cum pertransíres in desérto:'
  "9": terra mota est, étenim cæli distillavérunt a fácie Dei Sínai, a fácie Dei Israel.
  "10": 'Plúviam voluntáriam segregábis Deus hereditáti tuæ: et infirmáta est, tu vero perfecísti eam.'
  "11": 'Animália tua habitábunt in ea: parásti in dulcédine tua páuperi, Deus.'
  "12": Dóminus dabit verbum evangelizántibus, virtúte multa.
  "13": 'Rex virtútum dilécti dilécti: et speciéi domus divídere spólia.'
  "14": Si dormiátis inter médios cleros, pennæ colúmbæ deargentátæ, et posterióra dorsi eius in pallóre auri.
  "15": 'Dum discérnit cæléstis reges super eam, nive dealbabúntur in Selmon:'
  "16": 'mons Dei, mons pinguis. Mons coagulátus, mons pinguis:'
  "17": 'ut quid suspicámini montes coagulátos? mons in quo beneplácitum est Deo habitáre in eo: étenim Dóminus habitábit in finem.'
  "18": 'Currus Dei decem míllibus múltiplex, míllia lætántium: Dóminus in eis in Sina in sancto.'
  "19": 'Ascendísti in altum, cepísti captivitátem: accepísti dona in homínibus: étenim non credéntes, inhabitáre Dóminum Deum.'
  "20": 'Benedíctus Dóminus die quotídie: prósperum iter fáciet nobis Deus salutárium nostrórum.'
  "21": 'Deus noster, Deus salvos faciéndi: et Dómini Dómini éxitus mortis.'
  "22": 'Verúmtamen Deus confrínget cápita inimicórum suórum: vérticem capílli perambulántium in delíctis suis.'
  "23": 'Dixit Dóminus: Ex Basan convértam, convértam in profúndum maris:'
  "24": 'ut intingátur pes tuus in sánguine: lingua canum tuórum ex inimícis, ab ipso.'
  "25": 'Vidérunt ingréssus tuos Deus, ingréssus Dei mei: regis mei, qui est in sancto.'
  "26": Prævenérunt príncipes coniúncti psalléntibus, in médio iuvenculárum tympanistriárum.
  "27": In ecclésiis benedícite Deo Dómino, de fóntibus Israel.
  "28": 'Ibi Béniamin adolescéntulus, in mentis excéssu. Príncipes Iuda, duces eórum: príncipes Zábulon, príncipes Néphthali.'
  "29": 'Manda Deus virtúti tuæ: confírma hoc Deus, quod operátus es in nobis.'
  "30": A templo tuo in Ierúsalem, tibi ófferent reges múnera.
  "31": 'Increpa feras arúndinis: congregátio taurórum in vaccis populórum: ut exclúdant eos, qui probáti sunt argénto. Díssipa gentes, quæ bella volunt:'
  "32": 'vénient legáti ex Ægýpto: Æthiópia prævéniet manus eius Deo.'
  "33": 'Regna terræ, cantáte Deo: psállite Dómino: psállite Deo,'
  "34": 'qui ascéndit super cælum cæli, ad oriéntem. Ecce dabit voci suæ vocem virtútis:'
  "35": date glóriam Deo super Israel, magnificéntia eius, et virtus eius in núbibus.
  "36": 'Mirábilis Deus in sanctis suis, Deus Israel ipse dabit virtútem, et fortitúdinem plebi suæ: benedíctus Deus.'
