bible: vulgate
lang: la
language: Latina
book: I Machabaeorum
chapter: "14"
verses:
  "1": Anno centésimo septuagésimo secúndo, congregávit rex Demétrius exércitum suum, et ábiit in Médiam ad contrahénda sibi auxília, ut expugnáret Tryphónem.
  "2": 'Et audívit Arsaces rex Pérsidis et Médiæ, quia intrávit Demétrius confínes suos: et misit unum de princípibus suis ut comprehénderet eum vivum, et addúceret eum ad se.'
  "3": 'Et ábiit, et percússit castra Demétrii: et comprehéndit eum, et duxit eum ad Arsacem, et pósuit eum in custódiam.'
  "4": 'Et síluit omnis terra Iuda ómnibus diébus Simónis, et quæsívit bona genti suæ: et plácuit illis potéstas eius, et glória eius ómnibus diébus.'
  "5": Et cum omni glória sua accépit Ioppen in portum, et fecit intróitum in ínsulis maris.
  "6": Et dilatávit fines gentis suæ, et obtínuit regiónem.
  "7": 'Et congregávit captivitátem multam, et dominátus est Gázaræ, et Bethsúræ, et arci: et ábstulit immundítias ex ea, et non erat qui resísteret ei.'
  "8": 'Et unusquísque colébat terram suam cum pace: et terra Iuda dabat fructus suos, et ligna campórum fructum suum.'
  "9": Senióres in platéis sedébant omnes, et de bonis terræ tractábant, et iúvenes induébant se glóriam, et stolas belli.
  "10": Et civitátibus tribuébat alimónias, et constituébat eas ut essent vasa munitiónis quoadúsque nominátum est nomen glóriæ eius usque ad extrémum terræ.
  "11": Fecit pacem super terram, et lætátus est Israel lætítia magna.
  "12": 'Et sedit unusquísque sub vite sua, et sub ficúlnea sua: et non erat qui eos terréret.'
  "13": 'Defécit impúgnans eos super terram: reges contríti sunt in diébus illis.'
  "14": 'Et confirmávit omnes húmiles pópuli sui, et legem exquisívit, et ábstulit omnem iníquum et malum:'
  "15": sancta glorificávit, et multiplicávit vasa sanctórum.
  "16": 'Et audítum est Romæ quia defúnctus esset Iónathas, et usque in Spartiátas: et contristáti sunt valde.'
  "17": Ut audiérunt autem quod Simon frater eius factus esset summus sacérdos loco eius, et ipse obtinéret omnem regiónem, et civitátes in ea,
  "18": scripsérunt ad eum in tábulis ǽreis, ut renovárent amicítias, et societátem quam fécerant cum Iuda, et cum Iónatha frátribus eius.
  "19": 'Et lectæ sunt in conspéctu ecclésiæ in Ierúsalem. Et hoc exémplum epistolárum, quas Spartiátæ misérunt:'
  "20": Spartianórum príncipes, et civitátes, Simóni sacerdóti magno, et senióribus, et sacerdótibus, et réliquo pópulo Iudæórum, frátribus, salútem.
  "21": 'Legáti, qui missi sunt ad pópulum nostrum, nuntiavérunt nobis de vestra glória, et honóre, ac lætítia: et gavísi sumus in intróitu eórum.'
  "22": 'Et scrípsimus quæ ab eis erant dicta in concíliis pópuli, sic: Numénius Antíochi, et Antípater Iasónis fílius, legáti Iudæórum, venérunt ad nos, renovántes nobíscum amicítiam prístinam.'
  "23": Et plácuit pópulo excípere viros glorióse, et pónere exémplum sermónum eórum in segregátis pópuli libris, ut sit ad memóriam pópulo Spartiatárum. Exémplum autem horum scrípsimus Simóni magno sacerdóti.
  "24": Post hæc autem misit Simon Numénium Romam, habéntem clýpeum áureum magnum, pondo mnarum mille, ad statuéndam cum eis societátem. Cum autem audísset pópulus Románus
  "25": 'sermónes istos, dixérunt: Quam gratiárum actiónem reddémus Simóni, et fíliis eius?'
  "26": Restítuit enim ipse fratres suos, et expugnávit inimícos Israel ab eis, et statuérunt ei libertátem, et descripsérunt in tábulis ǽreis, et posuérunt in títulis in monte Sion.
  "27": 'Et hoc est exémplum scriptúræ: Octavadécima die mensis Elul, anno centésimo septuagésimo secúndo, anno tértio sub Simóne sacerdóte magno in Asáramel,'
  "28": 'in convéntu magno sacerdótum, et pópuli, et príncipum gentis, et seniórum regiónis, nota facta sunt hæc: quóniam frequénter facta sunt prœ́lia in regióne nostra.'
  "29": 'Simon autem Mathathíæ fílius, ex fíliis Iarib, et fratres eius, dedérunt se perículo, et restitérunt adversáriis gentis suæ, ut starent sancta ipsórum, et lex: et glória magna glorificavérunt gentem suam.'
  "30": Et congregávit Iónathas gentem suam, et factus est illis sacérdos magnus, et appósitus est ad pópulum suum.
  "31": Et voluérunt inimíci eórum calcáre, et attérere regiónem ipsórum, et exténdere manus in sancta eórum.
  "32": 'Tunc réstitit Simon, et pugnávit pro gente sua, et erogávit pecúnias multas, et armávit viros virtútis gentis suæ, et dedit illis stipéndia:'
  "33": 'et munívit civitátes Iudǽæ, et Bethsúram, quæ erat in fínibus Iudǽæ, ubi erant arma hóstium ántea: et pósuit illic præsídium viros Iudǽos.'
  "34": 'Et Ioppen munívit, quæ erat ad mare, et Gázaram, quæ est in fínibus Azóti, in qua hostes ántea habitábant: et collocávit illic Iudǽos, et quæcúmque apta erant ad correptiónem eórum, pósuit in eis.'
  "35": Et vidit pópulus actum Simónis, et glóriam, quam cogitábat fácere genti suæ, et posuérunt eum ducem suum, et príncipem sacerdótum, eo quod ipse fécerat hæc ómnia, et iustítiam, et fidem, quam conservávit genti suæ, et exquisívit omni modo exaltáre pópulum suum.
  "36": 'Et in diébus eius prosperátum est in mánibus eius, ut tolleréntur gentes de regióne ipsórum, et qui in civitáte David erant, in Ierúsalem in arce, de qua procedébant, et contaminábant ómnia, quæ in circúitu sanctórum sunt, et inferébant plagam magnam castitáti:'
  "37": et collocávit in ea viros Iudǽos ad tutaméntum regiónis, et civitátis, et exaltávit muros Ierúsalem.
  "38": Et rex Demétrius státuit illi summum sacerdótium.
  "39": Secúndum hæc fecit eum amícum suum, et glorificávit eum glória magna.
  "40": Audívit enim quod appelláti sunt Iudǽi a Románis amíci, et sócii, et fratres, et quia suscepérunt legátos Simónis glorióse,
  "41": 'et quia Iudǽi, et sacerdótes eórum consensérunt eum esse ducem suum, et summum sacerdótem in ætérnum, donec surgat prophéta fidélis:'
  "42": 'et ut sit super eos dux, et ut cura esset illi pro sanctis, et ut constitúeret præpósitos super ópera eórum, et super regiónem, et super arma, et super præsídia:'
  "43": 'et cura sit illi de sanctis: et ut audiátur ab ómnibus, et scribántur in nómine eius omnes conscriptiónes in regióne: et ut operiátur púrpura, et auro:'
  "44": 'et ne líceat ulli ex pópulo, et ex sacerdótibus írritum fácere áliquid horum, et contradícere his, quæ ab eo dicúntur, aut convocáre convéntum in regióne sine ipso, et vestíri púrpura, et uti fíbula áurea:'
  "45": qui autem fécerit extra hæc, aut írritum fécerit áliquid horum, reus erit.
  "46": Et complácuit omni pópulo statúere Simónem, et fácere secúndum verba ista.
  "47": Et suscépit Simon, et plácuit ei ut summo sacerdótio fungerétur, et esset dux, et princeps gentis Iudæórum, et sacerdótum, et præésset ómnibus.
  "48": 'Et scriptúram istam dixérunt pónere in tábulis ǽreis, et pónere eas in períbolo sanctórum, in loco célebri:'
  "49": exémplum autem eórum pónere in ærário, ut hábeat Simon, et fílii eius.
