bible: vulgate
lang: la
language: Latina
book: I Regum
chapter: "21"
verses:
  "1": Post verba autem hæc, témpore illo vínea erat Naboth Iezrahelítæ, quæ erat in Iézrahel, iuxta palátium Achab regis Samaríæ.
  "2": 'Locútus est ergo Achab ad Naboth, dicens: Da mihi víneam tuam, ut fáciam mihi hortum ólerum, quia vicína est, et prope domum meam: dabóque tibi pro ea víneam meliórem, aut si commódius tibi putas, argénti prétium, quanto digna est.'
  "3": 'Cui respóndit Naboth: Propítius sit mihi Dóminus, ne dem hereditátem patrum meórum tibi.'
  "4": 'Venit ergo Achab in domum suam indígnans, et frendens super verbo, quod locútus fúerat ad eum Naboth Iezrahelítes, dicens: Non dabo tibi hereditátem patrum meórum. Et proíciens se in léctulum suum, avértit fáciem suam ad paríetem, et non comédit panem.'
  "5": 'Ingréssa est autem ad eum Iézabel uxor sua, dixítque ei: Quid est hoc, unde ánima tua contristáta est? et quare non cómedis panem?'
  "6": 'Qui respóndit ei: Locútus sum Naboth Iezrahelítæ, et dixi ei: Da mihi víneam tuam, accépta pecúnia: aut, si tibi placet, dabo tibi víneam meliórem pro ea. Et ille ait: Non dabo tibi víneam meam.'
  "7": 'Dixit ergo ad eum Iézabel uxor eius: Grandis auctoritátis es, et bene regis regnum Israel. Surge, et cómede panem, et æquo ánimo esto: ego dabo tibi víneam Naboth Iezrahelítæ.'
  "8": Scripsit ítaque lítteras ex nómine Achab, et signávit eas ánnulo eius, et misit ad maióres natu, et optimátes, qui erant in civitáte eius, et habitábant cum Naboth.
  "9": 'Litterárum autem hæc erat senténtia: Prædicáte ieiúnium, et sedére fácite Naboth inter primos pópuli:'
  "10": 'et submíttite duos viros fílios Bélial contra eum, et falsum testimónium dicant: Benedíxit Deum et regem: et edúcite eum, et lapidáte, sicque moriátur.'
  "11": 'Fecérunt ergo cives eius maióres natu et optimátes, qui habitábant cum eo in urbe, sicut præcéperat eis Iézabel, et sicut scriptum erat in lítteris quas míserat ad eos:'
  "12": prædicavérunt ieiúnium, et sedére fecérunt Naboth inter primos pópuli.
  "13": 'Et addúctis duóbus viris fíliis diáboli, fecérunt eos sedére contra eum: at illi, scílicet ut viri diabólici, dixérunt contra eum testimónium coram multitúdine: Benedíxit Naboth Deum et regem: quam ob rem eduxérunt eum extra civitátem, et lapídibus interfecérunt.'
  "14": 'Miserúntque ad Iézabel, dicéntes: Lapidátus est Naboth, et mórtuus est.'
  "15": 'Factum est autem, cum audísset Iézabel lapidátum Naboth et mórtuum, locúta est ad Achab: Surge, et pósside víneam Naboth Iezrahelítæ, qui nóluit tibi acquiéscere, et dare eam accépta pecúnia: non enim vivit Naboth, sed mórtuus est.'
  "16": Quod cum audísset Achab, mórtuum vidélicet Naboth, surréxit, et descendébat in víneam Naboth Iezrahelítæ, ut possidéret eam.
  "17": 'Factus est ígitur sermo Dómini ad Elíam Thesbíten, dicens:'
  "18": 'Surge, et descénde in occúrsum Achab regis Israel, qui est in Samaría: ecce ad víneam Naboth descéndit, ut possídeat eam.'
  "19": 'Et loquéris ad eum, dicens: Hæc dicit Dóminus: Occidísti, ínsuper et possedísti. Et post hæc addes: Hæc dicit Dóminus: In loco hoc, in quo linxérunt canes sánguinem Naboth, lambent quoque sánguinem tuum.'
  "20": 'Et ait Achab ad Elíam: Num invenísti me inimícum tibi? Qui dixit: Invéni, eo quod venúmdatus sis, ut fáceres malum in conspéctu Dómini.'
  "21": Ecce ego indúcam super te malum, et demétam posterióra tua, et interfíciam de Achab mingéntem ad paríetem, et clausum et últimum in Israel.
  "22": 'Et dabo domum tuam sicut domum Ieróboam fílii Nabat, et sicut domum Báasa fílii Ahía: quia egísti ut me ad iracúndiam provocáres, et peccáre fecísti Israel.'
  "23": 'Sed et de Iézabel locútus est Dóminus, dicens: Canes cómedent Iézabel in agro Iézrahel.'
  "24": 'Si mórtuus fúerit Achab in civitáte, cómedent eum canes: si autem mórtuus fúerit in agro, cómedent eum vólucres cæli.'
  "25": 'Igitur non fuit alter talis sicut Achab, qui venúmdatus est ut fáceret malum in conspéctu Dómini: concitávit enim eum Iézabel uxor sua,'
  "26": et abominábilis factus est, in tantum ut sequerétur idóla, quæ fécerant Amorrhǽi, quos consúmpsit Dóminus a fácie filiórum Israel.
  "27": Itaque cum audísset Achab sermónes istos, scidit vestiménta sua, et opéruit cilício carnem suam, ieiunavítque et dormívit in sacco, et ambulávit demísso cápite.
  "28": 'Et factus est sermo Dómini ad Elíam Thesbíten, dicens:'
  "29": Nonne vidísti humiliátum Achab coram me? quia ígitur humiliátus est mei causa, non indúcam malum in diébus eius, sed in diébus fílii sui ínferam malum dómui eius.
