bible: vulgate
lang: la
language: Latina
book: Ecclesiasticus
chapter: "10"
verses:
  "1": Iudex sápiens iudicábit pópulum suum, et principátus sensáti stábilis erit.
  "2": 'Secúndum iúdicem pópuli, sic et minístri eius: et qualis rector est civitátis, tales et inhabitántes in ea.'
  "3": 'Rex insípiens perdet pópulum suum: et civitátes inhabitabúntur per sensum poténtium.'
  "4": 'In manu Dei potéstas terræ: et útilem rectórem suscitábit in tempus super illam.'
  "5": In manu Dei prospéritas hóminis, et super fáciem scribæ impónet honórem suum.
  "6": Omnis iniúriæ próximi ne memíneris, et nihil agas in opéribus iniúriæ.
  "7": 'Odíbilis coram Deo est et homínibus supérbia: et exsecrábilis omnis iníquitas géntium.'
  "8": Regnum a gente in gentem transfértur propter iniustítias, et iniúrias, et contumélias, et divérsos dolos.
  "9": Aváro autem nihil est sceléstius. Quid supérbit terra et cinis?
  "10": 'Nihil est iníquius quam amáre pecúniam: hic enim et ánimam suam venálem habet, quóniam in vita sua proiécit íntima sua.'
  "11": 'Omnis potentátus brevis vita: languor prolíxior gravat médicum.'
  "12": 'Brevem languórem præcídit médicus: sic et rex hódie est, et cras moriétur.'
  "13": Cum enim moriétur homo, hereditábit serpéntes, et béstias, et vermes.
  "14": 'Inítium supérbiæ hóminis, apostatáre a Deo:'
  "15": 'quóniam ab eo, qui fecit illum, recéssit cor eius: quóniam inítium omnis peccáti est supérbia: qui tenúerit illam, adimplébitur maledíctis, et subvértet eum in finem.'
  "16": Proptérea exhonorávit Dóminus convéntus malórum, et destrúxit eos usque in finem.
  "17": Sedes ducum superbórum destrúxit Deus, et sedére fecit mites pro eis.
  "18": Radíces géntium superbárum arefécit Deus, et plantávit húmiles ex ipsis géntibus.
  "19": Terras géntium evértit Dóminus, et pérdidit eas usque ad fundaméntum.
  "20": Arefécit ex ipsis, et dispérdidit eos, et cessáre fecit memóriam eórum a terra.
  "21": Memóriam superbórum pérdidit Deus, et relíquit memóriam humílium sensu.
  "22": Non est creáta homínibus supérbia, neque iracúndia natióni mulíerum.
  "23": 'Semen hóminum honorábitur hoc, quod timet Deum: semen autem hoc exhonorábitur, quod prǽterit mandáta Dómini.'
  "24": 'In médio fratrum rector illórum in honóre: et qui timent Dóminum, erunt in óculis illíus.'
  "25": Glória dívitum, honoratórum, et páuperum, timor Dei est.
  "26": Noli despícere hóminem iustum páuperem, et noli magnificáre virum peccatórem dívitem.
  "27": 'Magnus, et iudex, et potens est in honóre: et non est maior illo, qui timet Deum.'
  "28": 'Servo sensáto líberi sérvient: et vir prudens, et disciplinátus non murmurábit corréptus, et ínscius non honorábitur.'
  "29": Noli extóllere te in faciéndo ópere tuo, et noli cunctári in témpore angústiæ.
  "30": Mélior est qui operátur, et abúndat in ómnibus, quam qui gloriátur et eget pane.
  "31": Fili in mansuetúdine serva ánimam tuam, et da illi honórem secúndum méritum suum.
  "32": Peccántem in ánimam suam quis iustificábit? et quis honorificábit exhonorántem ánimam suam?
  "33": 'Pauper gloriátur per disciplínam et timórem suum: et est homo qui honorificátur propter substántiam suam.'
  "34": Qui autem gloriátur in paupertáte, quanto magis in substántia? et qui gloriátur in substántia, paupertátem vereátur.
