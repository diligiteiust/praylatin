bible: vulgate
lang: la
language: Latina
book: Ecclesiasticus
chapter: "29"
verses:
  "1": 'Qui facit misericórdiam, fœnerátur próximo suo: et qui prǽvalet manu, mandáta servat.'
  "2": 'Fœneráre próximo tuo in témpore necessitátis illíus: et íterum redde próximo in témpore suo.'
  "3": 'Confírma verbum, et fidéliter age cum illo: et in omni témpore invénies quod tibi necessárium est.'
  "4": Multi quasi inventiónem æstimavérunt fœnus, et præstitérunt moléstiam his, qui se adiuvérunt.
  "5": 'Donec accípiant, osculántur manus dantis, et in promissiónibus humíliant vocem suam:'
  "6": 'et in témpore redditiónis postulábit tempus, et loquétur verba tǽdii et murmuratiónum, et tempus causábitur:'
  "7": 'si autem potúerit réddere, adversábitur: sólidi vix reddet dimídium, et computábit illud quasi inventiónem:'
  "8": 'sin autem fraudábit illum pecúnia sua, et possidébit illum inimícum gratis:'
  "9": et convítia et maledícta reddet illi, et pro honóre et benefício reddet illi contuméliam.
  "10": Multi non causa nequítiæ non fœneráti sunt, sed fraudári gratis timuérunt.
  "11": Verúmtamen super húmilem ánimo fórtior esto, et pro eleemósyna non trahas illum.
  "12": 'Propter mandátum assúme páuperem: et propter inópiam eius ne dimíttas eum vácuum.'
  "13": Perde pecúniam propter fratrem et amícum tuum, et non abscóndas illam sub lápide in perditiónem.
  "14": Pone thesáurum tuum in præcéptis Altíssimi, et próderit tibi magis quam aurum.
  "15": Conclúde eleemósynam in corde páuperis, et hæc pro te exorábit ab omni malo.
  "16": Super scutum poténtis,
  "17": et super lánceam
  "18": advérsus inimícum tuum pugnábit.
  "19": 'Vir bonus fidem facit pro próximo suo: et qui perdíderit confusiónem, derelínquet sibi.'
  "20": 'Grátiam fideiussóris ne obliviscáris: dedit enim pro te ánimam suam.'
  "21": Repromissórem fugit peccátor et immúndus.
  "22": 'Bona repromissóris sibi ascríbit peccátor: et ingrátus sensu derelínquet liberántem se.'
  "23": 'Vir repromíttit de próximo suo: et cum perdíderit reveréntiam, derelinquétur ab eo.'
  "24": Repromíssio nequíssima multos pérdidit dirigéntes, et commóvit illos quasi fluctus maris.
  "25": Viros poténtes gyrans migráre fecit, et vagáti sunt in géntibus aliénis.
  "26": 'Peccátor transgrédiens mandátum Dómini, íncidet in promissiónem nequam: et qui conátur multa ágere, íncidet in iudícium.'
  "27": Recúpera próximum secúndum virtútem tuam, et atténde tibi ne íncidas.
  "28": Inítium vitæ hóminis aqua et panis, et vestiméntum, et domus prótegens turpitúdinem.
  "29": Mélior est victus páuperis sub tégmine ásserum, quam épulæ spléndidæ in péregre sine domicílio.
  "30": Mínimum pro magno pláceat tibi, et impropérium peregrinatiónis non áudies.
  "31": 'Vita nequam hospitándi de domo in domum: et ubi hospitábitur non fiduciáliter aget, nec apériet os.'
  "32": Hospitábitur, et pascet, et potábit ingrátos, et ad hæc amára áudiet.
  "33": 'Transi hospes, et orna mensam: et quæ in manu habes, ciba céteros.'
  "34": 'Exi a fácie honóris amicórum meórum: necessitúdine domus meæ hospítio mihi factus est frater.'
  "35": 'Grávia hæc hómini habénti sensum: corréptio domus, et impropérium fœneratóris.'
