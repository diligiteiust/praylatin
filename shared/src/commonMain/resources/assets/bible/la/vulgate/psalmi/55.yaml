bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "55"
verses:
  "1": In finem, Pro pópulo, qui a sanctis longe factus est, David in títuli inscriptiónem, cum tenuérunt eum Allophýli in Geth.
  "2": 'Miserére mei Deus, quóniam conculcávit me homo: tota die impúgnans tribulávit me.'
  "3": 'Conculcavérunt me inimíci mei tota die: quóniam multi bellántes advérsum me.'
  "4": 'Ab altitúdine diéi timébo: ego vero in te sperábo.'
  "5": 'In Deo laudábo sermónes meos, in Deo sperávi: non timébo quid fáciat mihi caro.'
  "6": 'Tota die verba mea exsecrabántur: advérsum me omnes cogitatiónes eórum in malum.'
  "7": 'Inhabitábunt et abscóndent: ipsi calcáneum meum observábunt. Sicut sustinuérunt ánimam meam,'
  "8": 'pro níhilo salvos fácies illos: in ira pópulos confrínges. Deus,'
  "9": 'vitam meam annuntiávi tibi: posuísti lácrymas meas in conspéctu tuo, sicut et in promissióne tua:'
  "10": 'tunc converténtur inimíci mei retrórsum: in quacúmque die invocávero te: ecce cognóvi quóniam Deus meus es.'
  "11": 'In Deo laudábo verbum, in Dómino laudábo sermónem: in Deo sperávi, non timébo quid fáciat mihi homo.'
  "12": In me sunt Deus vota tua, quæ reddam, laudatiónes tibi.
  "13": 'Quóniam eripuísti ánimam meam de morte, et pedes meos de lapsu: ut pláceam coram Deo in lúmine vivéntium.'
