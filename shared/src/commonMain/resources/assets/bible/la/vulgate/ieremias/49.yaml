bible: vulgate
lang: la
language: Latina
book: Ieremias
chapter: "49"
verses:
  "1": 'Ad fílios Ammon. Hæc dicit Dóminus: Numquid non fílii sunt Israel? aut heres non est ei? Cur ígitur hereditáte possédit Melchom Gad, et pópulus eius in úrbibus eius habitávit?'
  "2": 'Ideo dies véniunt, dicit Dóminus: et audítum fáciam super Rabbath filiórum Ammon frémitum prœ́lii, et erit in tumúltum dissipáta, filiǽque eius igni succendéntur, et possidébit Israel possessóres suos, ait Dóminus.'
  "3": 'Ulula Hésebon, quóniam vastáta est Hai: clamáte fíliæ Rabbath, accíngite vos cilíciis: plángite et circuíte per sepes: quóniam Melchom in transmigratiónem ducétur, sacerdótes eius et príncipes eius simul.'
  "4": 'Quid gloriáris in vállibus? deflúxit vallis tua fília delicáta, quæ confidébas in thesáuris tuis, et dicébas: Quis véniet ad me?'
  "5": 'Ecce ego indúcam super te terrórem, ait Dóminus Deus exercítuum, ab ómnibus qui sunt in circúitu tuo: et dispergémini sínguli a conspéctu vestro, nec erit qui cóngreget fugiéntes.'
  "6": Et post hæc revérti fáciam captívos filiórum Ammon, ait Dóminus.
  "7": 'Ad Idumǽam. Hæc dicit Dóminus exercítuum: Numquid non ultra est sapiéntia in Theman? Périit consílium a fíliis, inútilis facta est sapiéntia eórum.'
  "8": 'Fúgite, et terga vértite, descéndite in voráginem habitatóres Dedan: quóniam perditiónem Esau addúxi super eum, tempus visitatiónis eius.'
  "9": 'Si vindemiatóres veníssent super te, non reliquíssent racémum: si fures in nocte, rapuíssent quod suffíceret sibi.'
  "10": 'Ego vero discoopérui Esau, revelávi abscóndita eius, et celári non póterit: vastátum est semen eius, et fratres eius, et vicíni eius, et non erit.'
  "11": 'Relínque pupíllos tuos: ego fáciam eos vívere: et víduæ tuæ in me sperábunt.'
  "12": 'Quia hæc dicit Dóminus: Ecce quibus non erat iudícium ut bíberent cálicem, bibéntes bibent: et tu quasi ínnocens relinquéris? non eris ínnocens, sed bibens bibes.'
  "13": 'Quia per memetípsum iurávi, dicit Dóminus, quod in solitúdinem, et in oppróbrium, et in desértum, et in maledictiónem erit Bosra: et omnes civitátes eius erunt in solitúdines sempitérnas.'
  "14": 'Audítum audívi a Dómino, et legátus ad gentes missus est: Congregámini, et veníte contra eam, et consurgámus in prœ́lium.'
  "15": Ecce enim párvulum dedi te in géntibus, contemptíbilem inter hómines.
  "16": 'Arrogántia tua decépit te, et supérbia cordis tui: qui hábitas in cavérnis petræ, et apprehéndere níteris altitúdinem collis: cum exaltáveris quasi áquila nidum tuum, inde détraham te, dicit Dóminus.'
  "17": 'Et erit Idumǽa desérta: omnis qui transíbit per eam, stupébit, et sibilábit super omnes plagas eius.'
  "18": 'Sicut subvérsa est Sódoma et Gomórrha, et vicínæ eius, ait Dóminus: non habitábit ibi vir, et non íncolet eam fílius hóminis.'
  "19": 'Ecce quasi leo ascéndet de supérbia Iordánis ad pulchritúdinem robústam: quia súbito cúrrere fáciam eum ad illam: et quis erit eléctus, quem præpónam ei? quis enim símilis mei? et quis sustinébit me? et quis est iste pastor, qui resístat vúltui meo?'
  "20": 'Proptérea audíte consílium Dómini, quod íniit de Edom: et cogitatiónes eius, quas cogitávit de habitatóribus Theman: Si non deiécerint eos párvuli gregis, nisi dissipáverint cum eis habitáculum eórum.'
  "21": 'A voce ruínæ eórum commóta est terra: clamor in mari Rubro audítus est vocis eius.'
  "22": 'Ecce quasi áquila ascéndet, et avolábit: et expándet alas suas super Bosran: et erit cor fórtium Idumǽæ in die illa, quasi cor mulíeris parturiéntis.'
  "23": 'Ad Damáscum. Confúsa est Emath, et Arphad: quia audítum péssimum audiérunt, turbáti sunt in mari: præ sollicitúdine quiéscere non pótuit.'
  "24": 'Dissolúta est Damáscus, versa est in fugam: tremor apprehéndit eam: angústia et dolóres tenuérunt eam quasi parturiéntem.'
  "25": Quómodo dereliquérunt civitátem laudábilem, urbem lætítiæ?
  "26": 'Ideo cadent iúvenes eius in platéis eius: et omnes viri prœ́lii conticéscent in die illa, ait Dóminus exercítuum.'
  "27": Et succéndam ignem in muro Damásci, et devorábit mœ́nia Bénadad.
  "28": 'Ad Cedar, et ad regna Asor, quæ percússit Nabuchodónosor rex Babylónis. Hæc dicit Dóminus: Súrgite, et ascéndite ad Cedar, et vastáte fílios oriéntis.'
  "29": 'Tabernácula eórum, et greges eórum cápient: pelles eórum, et ómnia vasa eórum, et camélos eórum tollent sibi: et vocábunt super eos formídinem in circúitu.'
  "30": 'Fúgite, abíte veheménter, in voragínibus sedéte, qui habitátis Asor, ait Dóminus: íniit enim contra vos Nabuchodónosor rex Babylónis consílium, et cogitávit advérsum vos cogitatiónes.'
  "31": 'Consúrgite, et ascéndite ad gentem quiétam, et habitántem confidénter, ait Dóminus: non óstia, nec vectes eis: soli hábitant.'
  "32": 'Et erunt caméli eórum in direptiónem, et multitúdo iumentórum in prædam: et dispérgam eos in omnem ventum, qui sunt attónsi in comam, et ex omni confínio eórum addúcam intéritum super eos, ait Dóminus.'
  "33": 'Et erit Asor in habitáculum dracónum, desérta usque in ætérnum: non manébit ibi vir, nec íncolet eam fílius hóminis.'
  "34": 'Quod factum est verbum Dómini ad Ieremíam prophétam advérsus Ælam, in princípio regni Sedecíæ regis Iuda, dicens:'
  "35": 'Hæc dicit Dóminus exercítuum: Ecce ego confríngam arcum Ælam, et summam fortitúdinem eórum.'
  "36": 'Et indúcam super Ælam quátuor ventos a quátuor plagis cæli: et ventilábo eos in omnes ventos istos: et non erit gens, ad quam non pervéniant prófugi Ælam.'
  "37": 'Et pavére fáciam Ælam coram inimícis suis, et in conspéctu quæréntium ánimam eórum: et addúcam super eos malum, iram furóris mei, dicit Dóminus: et mittam post eos gládium donec consúmam eos.'
  "38": Et ponam sólium meum in Ælam, et perdam inde reges et príncipes, ait Dóminus.
  "39": In novíssimis autem diébus revérti fáciam captívos Ælam, dicit Dóminus.
