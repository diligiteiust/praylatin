bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "126"
verses:
  "1": Cánticum gráduum Salomónis. Nisi Dóminus ædificáverit domum, in vanum laboravérunt qui ædíficant eam. Nisi Dóminus custodíerit civitátem, frustra vígilat qui custódit eam.
  "2": 'Vanum est vobis ante lucem súrgere: súrgite postquam sedéritis, qui manducátis panem dolóris. Cum déderit diléctis suis somnum:'
  "3": 'ecce heréditas Dómini, fílii: merces, fructus ventris.'
  "4": 'Sicut sagíttæ in manu poténtis: ita fílii excussórum.'
  "5": 'Beátus vir qui implévit desidérium suum ex ipsis: non confundétur cum loquétur inimícis suis in porta.'
