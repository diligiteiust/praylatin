bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "141"
verses:
  "1": Intelléctus David, Cum esset in spelúnca, orátio.
  "2": 'Voce mea ad Dóminum clamávi: voce mea ad Dóminum deprecátus sum:'
  "3": effúndo in conspéctu eius oratiónem meam, et tribulatiónem meam ante ipsum pronúntio.
  "4": In deficiéndo ex me spíritum meum, et tu cognovísti sémitas meas. In via hac, qua ambulábam, abscondérunt láqueum mihi.
  "5": 'Considerábam ad déxteram, et vidébam: et non erat qui cognósceret me. Périit fuga a me, et non est qui requírat ánimam meam.'
  "6": 'Clamávi ad te Dómine: dixi: Tu es spes mea, pórtio mea in terra vivéntium.'
  "7": 'Inténde ad deprecatiónem meam: quia humiliátus sum nimis. Líbera me a persequéntibus me: quia confortáti sunt super me.'
  "8": 'Educ de custódia ánimam meam ad confiténdum nómini tuo: me exspéctant iusti, donec retríbuas mihi.'
