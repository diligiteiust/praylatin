bible: vulgate
lang: la
language: Latina
book: Canticum Canticorum
chapter: "6"
verses:
  "1": Diléctus meus descéndit in hortum suum ad aréolam arómatum, ut pascátur in hortis, et lília cólligat.
  "2": Ego dilécto meo, et diléctus meus mihi, qui páscitur inter lília.
  "3": 'Pulchra es amíca mea, suávis, et decóra sicut Ierúsalem: terríbilis ut castrórum ácies ordináta.'
  "4": Avérte óculos tuos a me, quia ipsi me avoláre fecérunt. Capílli tui sicut grex caprárum, quæ apparuérunt de Gálaad.
  "5": 'Dentes tui sicut grex óvium, quæ ascendérunt de lavácro: omnes geméllis fœ́tibus, et stérilis non est in eis.'
  "6": Sicut cortex mali púnici, sic genæ tuæ absque occúltis tuis.
  "7": Sexagínta sunt regínæ, et octogínta concubínæ, et adolescentulárum non est númerus.
  "8": 'Una est colúmba mea, perfécta mea, una est matris suæ, elécta genetríci suæ. Vidérunt eam fíliæ, et beatíssimam prædicavérunt: regínæ et concubínæ, et laudavérunt eam.'
  "9": Quæ est ista, quæ progréditur quasi auróra consúrgens, pulchra ut luna, elécta ut sol, terríbilis ut castrórum ácies ordináta?
  "10": Descéndi in hortum nucum, ut vidérem poma convállium, et inspícerem si floruísset vínea, et germinássent mala púnica.
  "11": 'Nescívi: ánima mea conturbávit me propter quadrígas Amínadab.'
  "12": 'Revértere, revértere Sulamítis: revértere, revértere, ut intueámur te.'
