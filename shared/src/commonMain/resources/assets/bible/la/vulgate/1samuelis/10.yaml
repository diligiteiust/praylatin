bible: vulgate
lang: la
language: Latina
book: I Samuelis
chapter: "10"
verses:
  "1": 'Tulit autem Sámuel lentículam ólei, et effúdit super caput eius: et deosculátus est eum, et ait: Ecce unxit te Dóminus super hereditátem suam in príncipem, et liberábis pópulum suum de mánibus inimicórum eius, qui in circúitu eius sunt. Et hoc tibi signum, quia unxit te Deus in príncipem.'
  "2": 'Cum abíeris hódie a me, invénies duos viros iuxta sepúlcrum Rachel in fínibus Béniamin, in merídie: dicéntque tibi: Invéntæ sunt ásinæ, ad quas íeras perquiréndas: et intermíssis pater tuus ásinis, sollícitus est pro vobis, et dicit: Quid fáciam de fílio meo?'
  "3": Cumque abíeris inde, et ultra transíeris, et véneris ad quercum Thabor, invénient te ibi tres viri ascendéntes ad Deum in Bethel, unus portans tres hædos, et álius tres tortas panis, et álius portans lagénam vini.
  "4": Cumque te salutáverint, dabunt tibi duos panes, et accípies de manu eórum.
  "5": 'Post hæc vénies in collem Dei, ubi est státio Philisthinórum: et cum ingréssus fúeris ibi urbem, óbvium habébis gregem prophetárum descendéntium de excélso, et ante eos psaltérium, et týmpanum, et tíbiam, et cítharam, ipsósque prophetántes.'
  "6": Et insíliet in te Spíritus Dómini, et prophetábis cum eis, et mutáberis in virum álium.
  "7": Quando ergo evénerint signa hæc ómnia tibi, fac quæcúmque invénerit manus tua, quia Dóminus tecum est.
  "8": 'Et descéndes ante me in Gálgala (ego quippe descéndam ad te), ut ófferas oblatiónem, et ímmoles víctimas pacíficas: septem diébus exspectábis, donec véniam ad te, et osténdam tibi quid fácias.'
  "9": Itaque cum avertísset húmerum suum ut abíret a Samuéle, immutávit ei Deus cor áliud, et venérunt ómnia signa hæc in die illa.
  "10": 'Venerúntque ad prædíctum collem, et ecce cúneus prophetárum óbvius ei: et insíluit super eum Spíritus Dómini, et prophetávit in médio eórum.'
  "11": 'Vidéntes autem omnes qui nóverant eum heri et nudiustértius, quod esset cum prophétis, et prophetáret, dixérunt ad ínvicem: Quænam res áccidit fílio Cis? num et Saul inter prophétas?'
  "12": 'Respondítque álius ad álterum, dicens: Et quis pater eórum? Proptérea versum est in provérbium: Num et Saul inter prophétas?'
  "13": Cessávit autem prophetáre, et venit ad excélsum.
  "14": 'Dixítque pátruus Saul ad eum, et ad púerum eius: Quo abístis? Qui respondérunt: Quǽrere ásinas: quas cum non reperissémus, vénimus ad Samuélem.'
  "15": 'Et dixit ei pátruus suus: Indica mihi quid díxerit tibi Sámuel.'
  "16": 'Et ait Saul ad pátruum suum: Indicávit nobis quia invéntæ essent ásinæ. De sermóne autem regni non indicávit ei quem locútus fúerat ei Sámuel.'
  "17": 'Et convocávit Sámuel pópulum ad Dóminum in Maspha:'
  "18": 'et ait ad fílios Israel: Hæc dicit Dóminus Deus Israel: Ego edúxi Israel de Ægýpto, et érui vos de manu Ægyptiórum, et de manu ómnium regum qui affligébant vos.'
  "19": 'Vos autem hódie proiecístis Deum vestrum, qui solus salvávit vos de univérsis malis et tribulatiónibus vestris: et dixístis: Nequáquam: sed regem constítue super nos. Nunc ergo state coram Dómino per tribus vestras, et per famílias.'
  "20": Et applícuit Sámuel omnes tribus Israel, et cécidit sors tribus Béniamin.
  "21": 'Et applícuit tribum Béniamin et cognatiónes eius, et cécidit cognátio Metri: et pervénit usque ad Saul fílium Cis. Quæsiérunt ergo eum, et non est invéntus.'
  "22": 'Et consuluérunt post hæc Dóminum utrúmnam ventúrus esset illuc. Respondítque Dóminus: Ecce abscónditus est domi.'
  "23": 'Cucurrérunt ítaque et tulérunt eum inde: stetítque in médio pópuli, et áltior fuit univérso pópulo ab húmero et sursum.'
  "24": 'Et ait Sámuel ad omnem pópulum: Certe vidétis quem elégit Dóminus, quóniam non sit símilis illi in omni pópulo. Et clamávit omnis pópulus, et ait: Vivat rex.'
  "25": 'Locútus est autem Sámuel ad pópulum legem regni, et scripsit in libro, et repósuit coram Dómino: et dimísit Sámuel omnem pópulum, síngulos in domum suam.'
  "26": 'Sed et Saul ábiit in domum suam in Gábaa: et ábiit cum eo pars exércitus, quorum tetígerat Deus corda.'
  "27": 'Fílii vero Bélial dixérunt: Num salváre nos póterit iste? Et despexérunt eum, et non attulérunt ei múnera: ille vero dissimulábat se audíre.'
