bible: vulgate
lang: la
language: Latina
book: I Regum
chapter: "12"
verses:
  "1": 'Venit autem Róboam in Sichem: illuc enim congregátus erat omnis Israel ad constituéndum eum regem.'
  "2": At vero Ieróboam fílius Nabat, cum adhuc esset in Ægýpto prófugus a fácie regis Salomónis, audíta morte eius, revérsus est de Ægýpto.
  "3": 'Miserúntque et vocavérunt eum: venit ergo Ieróboam, et omnis multitúdo Israel, et locúti sunt ad Róboam, dicéntes:'
  "4": 'Pater tuus duríssimum iugum impósuit nobis: tu ítaque nunc immínue páululum de império patris tui duríssimo, et de iugo gravíssimo, quod impósuit nobis, et serviémus tibi.'
  "5": 'Qui ait eis: Ite usque ad tértium diem, et revertímini ad me. Cumque abiísset pópulus,'
  "6": 'íniit consílium rex Róboam cum senióribus, qui assistébant coram Salomóne patre eius cum adhuc víveret, et ait: Quod datis mihi consílium, ut respóndeam pópulo huic?'
  "7": 'Qui dixérunt ei: Si hódie obedíeris pópulo huic, et servíeris, et petitióni eórum césseris, locutúsque fúeris ad eos verba lénia, erunt tibi servi cunctis diébus.'
  "8": Qui derelíquit consílium senum, quod déderant ei, et adhíbuit adolescéntes, qui nutríti fúerant cum eo, et assistébant illi,
  "9": 'dixítque ad eos: Quod mihi datis consílium, ut respóndeam pópulo huic, qui dixérunt mihi: Lévius fac iugum quod impósuit pater tuus super nos?'
  "10": 'Et dixérunt ei iúvenes qui nutríti fúerant cum eo: Sic loquéris pópulo huic, qui locúti sunt ad te, dicéntes: Pater tuus aggravávit iugum nostrum: tu réleva nos. Sic loquéris ad eos: Mínimus dígitus meus gróssior est dorso patris mei.'
  "11": 'Et nunc pater meus pósuit super vos iugum grave, ego autem addam super iugum vestrum: pater meus cecídit vos flagéllis, ego autem cædam vos scorpiónibus.'
  "12": 'Venit ergo Ieróboam, et omnis pópulus ad Róboam die tértia, sicut locútus fúerat rex, dicens: Revertímini ad me die tértia.'
  "13": Respondítque rex pópulo dura, derelícto consílio seniórum, quod ei déderant,
  "14": 'et locútus est eis secúndum consílium iúvenum, dicens: Pater meus aggravávit iugum vestrum, ego autem addam iugo vestro: pater meus cecídit vos flagéllis, ego autem cædam vos scorpiónibus.'
  "15": 'Et non acquiévit rex pópulo: quóniam aversátus fúerat eum Dóminus, ut suscitáret verbum suum, quod locútus fúerat in manu Ahíæ Silonítæ, ad Ieróboam fílium Nabat.'
  "16": 'Videns ítaque pópulus quod noluísset eos audíre rex, respóndit ei dicens: Quæ nobis pars in David? vel quæ heréditas in fílio Isai? vade in tabernácula tua Israel: nunc vide domum tuam David. Et ábiit Israel in tabernácula sua.'
  "17": Super fílios autem Israel, quicúmque habitábant in civitátibus Iuda, regnávit Róboam.
  "18": 'Misit ergo rex Róboam Adúram, qui erat super tribúta: et lapidávit eum omnis Israel, et mórtuus est. Porro rex Róboam festínus ascéndit currum, et fugit in Ierúsalem:'
  "19": recessítque Israel a domo David usque in præséntem diem.
  "20": 'Factum est autem cum audísset omnis Israel quod revérsus esset Ieróboam, misérunt, et vocavérunt eum congregáto cœtu, et constituérunt eum regem super omnem Israel: nec secútus est quisquam domum David præter tribum Iuda solam.'
  "21": Venit autem Róboam Ierúsalem, et congregávit univérsam domum Iuda, et tribum Béniamin, centum octogínta míllia electórum virórum bellatórum, ut pugnárent contra domum Israel, et redúcerent regnum Róboam fílio Salomónis.
  "22": 'Factus est autem sermo Dómini ad Semeíam virum Dei, dicens:'
  "23": 'Lóquere ad Róboam fílium Salomónis regem Iuda, et ad omnem domum Iuda, et Béniamin, et réliquos de pópulo, dicens:'
  "24": 'Hæc dicit Dóminus: Non ascendétis, neque bellábitis contra fratres vestros fílios Israel: revertátur vir in domum suam: a me enim factum est verbum hoc. Audiérunt sermónem Dómini, et revérsi sunt de itínere, sicut eis præcéperat Dóminus.'
  "25": 'Ædificávit autem Ieróboam Sichem in monte Ephraim, et habitávit ibi: et egréssus inde ædificávit Phánuel.'
  "26": 'Dixítque Ieróboam in corde suo: Nunc revertétur regnum ad domum David,'
  "27": 'si ascénderit pópulus iste ut fáciat sacrifícia in domo Dómini in Ierúsalem: et convertétur cor pópuli huius ad dóminum suum Róboam regem Iuda, interficiéntque me, et reverténtur ad eum.'
  "28": 'Et excogitáto consílio fecit duos vítulos áureos, et dixit eis: Nolíte ultra ascéndere in Ierúsalem: ecce dii tui Israel, qui te eduxérunt de terra Ægýpti.'
  "29": 'Posuítque unum in Bethel, et álterum in Dan:'
  "30": 'et factum est verbum hoc in peccátum: ibat enim pópulus ad adorándum vítulum usque in Dan.'
  "31": Et fecit fana in excélsis, et sacerdótes de extrémis pópuli, qui non erant de fíliis Levi.
  "32": 'Constituítque diem solémnem in mense octávo, quintadécima die mensis, in similitúdinem solemnitátis, quæ celebrabátur in Iuda. Et ascéndens altáre, simíliter fecit in Bethel, ut immoláret vítulis, quos fabricátus fúerat: constituítque in Bethel sacerdótes excelsórum, quæ fécerat.'
  "33": 'Et ascéndit super altáre quod exstrúxerat in Bethel, quintadécima die mensis octávi, quem fínxerat de corde suo: et fecit solemnitátem fíliis Israel, et ascéndit super altáre, ut adoléret incénsum.'
