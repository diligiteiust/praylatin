bible: vulgate
lang: la
language: Latina
book: Canticum Canticorum
chapter: "8"
verses:
  "1": Quis mihi det te fratrem meum, sugéntem úbera matris meæ, ut invéniam te foris, et deósculer te, et iam me nemo despíciat?
  "2": 'Apprehéndam te, et ducam in domum matris meæ: ibi me docébis, et dabo tibi póculum ex vino condíto, et mustum malórum granatórum meórum.'
  "3": Læva eius sub cápite meo, et déxtera illíus amplexábitur me.
  "4": Adiúro vos fíliæ Ierúsalem, ne suscitétis, neque evigiláre faciátis diléctam, donec ipsa velit.
  "5": 'Quæ est ista, quæ ascéndit de desérto, delíciis áffluens, inníxa super diléctum suum? Sub árbore malo suscitávi te: ibi corrúpta est mater tua, ibi violáta est génitrix tua.'
  "6": 'Pone me ut signáculum super cor tuum, ut signáculum super bráchium tuum: quia fortis est ut mors diléctio, dura sicut inférnus æmulátio: lámpades eius lámpades ignis atque flammárum.'
  "7": Aquæ multæ non potuérunt exstínguere caritátem, nec flúmina óbruent illam. Si déderit homo omnem substántiam domus suæ pro dilectióne, quasi nihil despíciet eam.
  "8": 'Soror nostra parva, et úbera non habet: quid faciémus soróri nostræ in die quando alloquénda est?'
  "9": 'Si murus est, ædificémus super eum propugnácula argéntea: si óstium est, compingámus illud tábulis cédrinis.'
  "10": Ego murus, et úbera mea sicut turris, ex quo facta sum coram eo quasi pacem repériens.
  "11": 'Vínea fuit pacífico in ea, quæ habet pópulos: trádidit eam custódibus, vir affert pro fructu eius mille argénteos.'
  "12": Vínea mea coram me est. Mille tui pacífici, et ducénti his, qui custódiunt fructus eius.
  "13": 'Quæ hábitas in hortis, amíci auscúltant: fac me audíre vocem tuam.'
  "14": Fuge dilécte mi, et assimiláre cápreæ, hinnulóque cervórum super montes arómatum.
