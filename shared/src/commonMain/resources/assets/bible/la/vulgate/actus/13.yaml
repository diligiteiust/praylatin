bible: vulgate
lang: la
language: Latina
book: Actus Apostolorum
chapter: "13"
verses:
  "1": Erant autem in Ecclésia, quæ erat Antiochíæ, prophétæ, et doctóres, in quibus Bárnabas, et Simon, qui vocabátur Niger, et Lúcius Cyrenénsis, et Mánahen, qui erat Heródis Tetrárchæ collactáneus, et Saulus.
  "2": 'Ministrántibus autem illis Dómino, et ieiunántibus, dixit illis Spíritus sanctus: Segregáte mihi Saulum, et Bárnabam in opus, ad quod assúmpsi eos.'
  "3": Tunc ieiunántes, et orántes, imponentésque eis manus, dimisérunt illos.
  "4": 'Et ipsi quidem missi a Spíritu sancto abiérunt Seléuciam: et inde navigavérunt Cyprum.'
  "5": Et cum veníssent Salamínam, prædicábant verbum Dei in synagógis Iudæórum. Habébant autem et Ioánnem in ministério.
  "6": Et cum perambulássent univérsam ínsulam usque Paphum, invenérunt quemdam virum magum pseudoprophétam, Iudǽum, cui nomen erat Bariésu,
  "7": qui erat cum procónsule Sérgio Paulo viro prudénte. Hic, accersítis Bárnaba, et Saulo, desiderábat audíre verbum Dei.
  "8": Resistébat autem illis Elymas magus (sic enim interpretátur nomen eius), quærens avértere procónsulem a fide.
  "9": Saulus autem, qui et Paulus, replétus Spíritu sancto, íntuens in eum,
  "10": 'dixit: O plene omni dolo, et omni fallácia, fili diáboli, inimíce omnis iustítiæ, non désinis subvértere vias Dómini rectas.'
  "11": 'Et nunc ecce manus Dómini super te, et eris cæcus, non videns solem usque ad tempus. Et conféstim cécidit in eum calígo, et ténebræ: et circúiens quærébat qui ei manum daret.'
  "12": Tunc procónsul cum vidísset factum, crédidit admírans super doctrína Dómini.
  "13": Et cum a Papho navigássent Paulus, et qui cum eo erant, venérunt Pergen Pamphýliæ. Ioánnes autem discédens ab eis, revérsus est Ierosólymam.
  "14": 'Illi vero pertranseúntes Pergen, venérunt Antiochíam Pisídiæ: et ingréssi synagógam die sabbatórum, sedérunt.'
  "15": 'Post lectiónem autem legis, et prophetárum, misérunt príncipes synagógæ ad eos, dicéntes: Viri fratres, si quis est in vobis sermo exhortatiónis ad plebem, dícite.'
  "16": 'Surgens autem Paulus, et manu siléntium indícens, ait: Viri Israelítæ, et qui timétis Deum, audíte:'
  "17": Deus plebis Israel elégit patres nostros, et plebem exaltávit cum essent íncolæ in terra Ægýpti, et in bráchio excélso edúxit eos ex ea,
  "18": et per quadragínta annórum tempus mores eórum sustínuit in desérto.
  "19": Et déstruens gentes septem in terra Chánaan, sorte distríbuit eis terram eórum,
  "20": 'quasi post quadringéntos et quinquagínta annos: et post hæc dedit iúdices, usque ad Sámuel prophétam.'
  "21": 'Et exínde postulavérunt regem: et dedit illis Deus Saul fílium Cis, virum de tribu Béniamin, annis quadragínta:'
  "22": 'et amóto illo, suscitávit illis David regem: cui testimónium pérhibens, dixit: Invéni David fílium Iesse, virum secúndum cor meum, qui fáciet omnes voluntátes meas.'
  "23": Huius Deus ex sémine secúndum promissiónem edúxit Israel salvatórem Iesum,
  "24": prædicánte Ioánne ante fáciem advéntus eius baptísmum pœniténtiæ omni pópulo Israel.
  "25": 'Cum impléret autem Ioánnes cursum suum, dicébat: Quem me arbitrámini esse, non sum ego: sed ecce venit post me, cuius non sum dignus calceaménta pedum sólvere.'
  "26": Viri fratres, fílii géneris Abraham, et qui in vobis timent Deum, vobis verbum salútis huius missum est.
  "27": Qui enim habitábant Ierúsalem, et príncipes eius hunc ignorántes, et voces prophetárum, quæ per omne sábbatum legúntur, iudicántes implevérunt,
  "28": et nullam causam mortis inveniéntes in eo, petiérunt a Piláto, ut interfícerent eum.
  "29": Cumque consummássent ómnia, quæ de eo scripta erant, deponéntes eum de ligno, posuérunt eum in monuménto.
  "30": 'Deus vero suscitávit eum a mórtuis tértia die: qui visus est per dies multos his,'
  "31": 'qui simul ascénderant cum eo de Galilǽa in Ierúsalem: qui usque nunc sunt testes eius ad plebem.'
  "32": 'Et nos vobis annuntiámus eam, quæ ad patres nostros repromíssio facta est:'
  "33": 'quóniam hanc Deus adimplévit fíliis nostris resúscitans Iesum, sicut et in psalmo secúndo scriptum est: Fílius meus es tu, ego hódie génui te.'
  "34": 'Quod autem suscitávit eum a mórtuis, ámplius iam non reversúrum in corruptiónem, ita dixit: Quia dabo vobis sancta David fidélia.'
  "35": 'Ideóque et álias dicit: Non dabis sanctum tuum vidére corruptiónem.'
  "36": 'David enim in sua generatióne cum administrásset, voluntáti Dei dormívit: et appósitus est ad patres suos, et vidit corruptiónem.'
  "37": Quem vero Deus suscitávit a mórtuis, non vidit corruptiónem.
  "38": Notum ígitur sit vobis viri fratres, quia per hunc vobis remíssio peccatórum annuntiátur, et ab ómnibus, quibus non potuístis in lege Móysi iustificári,
  "39": in hoc omnis, qui credit, iustificátur.
  "40": 'Vidéte ergo ne supervéniat vobis quod dictum est in prophétis:'
  "41": 'Vidéte contemptóres, et admirámini, et disperdímini: quia opus óperor ego in diébus vestris, opus quod non credétis, si quis enarráverit vobis.'
  "42": Exeúntibus autem illis rogábant ut sequénti sábbato loqueréntur sibi verba hæc.
  "43": 'Cumque dimíssa esset synagóga, secúti sunt multi Iudæórum, et coléntium advenárum, Paulum, et Bárnabam: qui loquéntes suadébant eis ut permanérent in grátia Dei.'
  "44": Sequénti vero sábbato pene univérsa cívitas convénit audíre verbum Dei.
  "45": Vidéntes autem turbas Iudǽi, repléti sunt zelo, et contradicébant his, quæ a Paulo dicebántur, blasphemántes.
  "46": 'Tunc constánter Paulus, et Bárnabas dixérunt: Vobis oportébat primum loqui verbum Dei: sed quóniam repéllitis illud, et indígnos vos iudicátis ætérnæ vitæ, ecce convértimur ad gentes.'
  "47": 'Sic enim præcépit nobis Dóminus: Pósui te in lucem géntium, ut sis in salútem usque ad extrémum terræ.'
  "48": 'Audiéntes autem gentes, gavísæ sunt, et glorificábant verbum Dómini: et credidérunt quotquot erant præordináti ad vitam ætérnam.'
  "49": Disseminabátur autem verbum Dómini per univérsam regiónem.
  "50": 'Iudǽi autem concitavérunt mulíeres religiósas, et honéstas, et primos civitátis, et excitavérunt persecutiónem in Paulum, et Bárnabam: et eiecérunt eos de fínibus suis.'
  "51": At illi excússo púlvere pedum in eos, venérunt Icónium.
  "52": Discípuli quoque replebántur gáudio, et Spíritu sancto.
