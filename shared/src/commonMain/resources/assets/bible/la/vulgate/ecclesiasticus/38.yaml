bible: vulgate
lang: la
language: Latina
book: Ecclesiasticus
chapter: "38"
verses:
  "1": 'Honóra médicum propter necessitátem: étenim illum creávit Altíssimus.'
  "2": A Deo est enim omnis medéla, et a rege accípiet donatiónem.
  "3": Disciplína médici exaltábit caput illíus, et in conspéctu magnatórum collaudábitur.
  "4": Altíssimus creávit de terra medicaménta, et vir prudens non abhorrébit illa.
  "5": Nonne a ligno indulcáta est aqua amára?
  "6": 'Ad agnitiónem hóminum virtus illórum: et dedit homínibus sciéntiam Altíssimus, honorári in mirabílibus suis.'
  "7": 'In his curans mitigábit dolórem: et unguentárius fáciet pigménta suavitátis, et unctiónes confíciet sanitátis: et non consummabúntur ópera eius.'
  "8": Pax enim Dei super fáciem terræ.
  "9": Fili in tua infirmitáte ne despícias teípsum, sed ora Dóminum, et ipse curábit te.
  "10": Avérte a delícto, et dírige manus, et ab omni delícto munda cor tuum.
  "11": 'Da suavitátem et memóriam similáginis, et impíngua oblatiónem, et da locum médico:'
  "12": étenim illum Dóminus creávit, et non discédat a te, quia ópera eius sunt necessária.
  "13": 'Est enim tempus quando in manus illórum incúrras:'
  "14": ipsi vero Dóminum deprecabúntur, ut dírigat réquiem eórum, et sanitátem, propter conversatiónem illórum.
  "15": Qui delínquit in conspéctu eius, qui fecit eum, íncidet in manus médici.
  "16": 'Fili in mórtuum produc lácrymas, et quasi dira passus íncipe ploráre: et secúndum iudícium cóntege corpus illíus, et non despícias sepultúram illíus.'
  "17": 'Propter delatúram autem amáre fer luctum illíus uno die, et consoláre propter tristítiam:'
  "18": et fac luctum secúndum méritum eius uno die, vel duóbus, propter detractiónem.
  "19": A tristítia enim festínat mors, et coóperit virtútem, et tristítia cordis flectit cervícem.
  "20": In abductióne pérmanet tristítia, et substántia ínopis secúndum cor eius.
  "21": Ne déderis in tristítia cor tuum, sed repélle eam a te, et meménto novissimórum,
  "22": 'noli oblivísci: neque enim est convérsio, et huic nihil próderis, et teípsum pessimábis.'
  "23": 'Memor esto iudícii mei: sic enim erit et tuum: mihi heri, et tibi hódie.'
  "24": In réquie mórtui requiéscere fac memóriam eius, et consoláre illum in éxitu spíritus sui.
  "25": 'Sapiéntia scribæ in témpore vacuitátis, et qui minorátur actu sapiéntiam percípiet: qua sapiéntia replébitur'
  "26": qui tenet arátrum, et qui gloriátur in iáculo, stímulo boves ágitat, et conversátur in opéribus eórum, et enarrátio eius in fíliis taurórum.
  "27": Cor suum dabit ad versándos sulcos, et vigília eius in sagína vaccárum.
  "28": 'Sic omnis faber et architéctus, qui noctem tamquam diem tránsigit: qui sculpit signácula sculptília, et assidúitas eius váriat pictúram: cor suum dabit in similitúdinem pictúræ, et vigília sua perfíciet opus.'
  "29": 'Sic faber ferrárius sedens iuxta incúdem, et consíderans opus ferri: vapor ignis uret carnes eius, et in calóre fornácis concertátur:'
  "30": 'vox mállei ínnovat aurem eius, et contra similitúdinem vasis óculus eius:'
  "31": cor suum dabit in consummatiónem óperum, et vigília sua ornábit in perfectiónem.
  "32": 'Sic fígulus sedens ad opus suum, convértens pédibus suis rotam, qui in sollicitúdine pósitus est semper propter opus suum, et in número est omnis operátio eius:'
  "33": 'in bráchio suo formábit lutum, et ante pedes suos curvábit virtútem suam:'
  "34": cor suum dabit ut consúmmet linitiónem, et vigília sua mundábit fornácem.
  "35": 'Omnes hi in mánibus suis speravérunt, et unusquísque in arte sua sápiens est:'
  "36": sine his ómnibus non ædificátur cívitas.
  "37": Et non inhabitábunt, nec inambulábunt, et in ecclésiam non transílient.
  "38": 'Super sellam iúdicis non sedébunt, et testaméntum iudícii non intélligent, neque palam fácient disciplínam et iudícium, et in parábolis non inveniéntur:'
  "39": sed creatúram ævi confirmábunt, et deprecátio illórum in operatióne artis, accomodántes ánimam suam, et conquiréntes in lege Altíssimi.
