bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "111"
verses:
  "1": 'Allelúia, Reversiónis Aggǽi et Zacharíæ. Beátus vir, qui timet Dóminum: in mandátis eius volet nimis.'
  "2": 'Potens in terra erit semen eius: generátio rectórum benedicétur.'
  "3": 'Glória, et divítiæ in domo eius: et iustítia eius manet in sǽculum sǽculi.'
  "4": 'Exórtum est in ténebris lumen rectis: miséricors, et miserátor, et iustus.'
  "5": 'Iucúndus homo qui miserétur et cómmodat, dispónet sermónes suos in iudício:'
  "6": quia in ætérnum non commovébitur.
  "7": 'In memória ætérna erit iustus: ab auditióne mala non timébit. Parátum cor eius speráre in Dómino,'
  "8": 'confirmátum est cor eius: non commovébitur donec despíciat inimícos suos.'
  "9": 'Dispérsit, dedit paupéribus: iustítia eius manet in sǽculum sǽculi, cornu eius exaltábitur in glória.'
  "10": 'Peccátor vidébit, et irascétur, déntibus suis fremet et tabéscet: desidérium peccatórum períbit.'
