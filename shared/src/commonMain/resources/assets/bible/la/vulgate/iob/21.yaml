bible: vulgate
lang: la
language: Latina
book: Iob
chapter: "21"
verses:
  "1": 'Respóndens autem Iob, dixit:'
  "2": Audíte quæso sermónes meos, et ágite pœniténtiam.
  "3": Sustinéte me, et ego loquar, et post mea, si vidébitur, verba ridéte.
  "4": Numquid contra hóminem disputátio mea est, ut mérito non débeam contristári?
  "5": Atténdite me et obstupéscite, et superpónite dígitum ori vestro.
  "6": Et ego, quando recordátus fúero, pertimésco, et cóncutit carnem meam tremor.
  "7": Quare ergo ímpii vivunt, subleváti sunt, confortatíque divítiis?
  "8": Semen eórum pérmanet coram eis, propinquórum turba, et nepótum in conspéctu eórum.
  "9": Domus eórum secúræ sunt et pacátæ, et non est virga Dei super illos.
  "10": 'Bos eórum concépit, et non abortívit: vacca péperit, et non est priváta fœtu suo.'
  "11": Egrediúntur quasi greges párvuli eórum, et infántes eórum exsúltant lúsibus.
  "12": Tenent týmpanum et cítharam, et gaudent ad sónitum órgani.
  "13": Ducunt in bonis dies suos, et in puncto ad inférna descéndunt.
  "14": 'Qui dixérunt Deo: Recéde a nobis, et sciéntiam viárum tuárum nólumus.'
  "15": Quis est Omnípotens, ut serviámus ei? et quid nobis prodest si oravérimus illum?
  "16": Verúmtamen quia non sunt in manu eórum bona sua, consílium impiórum longe sit a me.
  "17": Quóties lucérna impiórum exstinguétur, et supervéniet eis inundátio, et dolóres dívidet furóris sui?
  "18": Erunt sicut páleæ ante fáciem venti, et sicut favílla quam turbo dispérgit.
  "19": 'Deus servábit fíliis illíus dolórem patris: et cum reddíderit, tunc sciet.'
  "20": Vidébunt óculi eius interfectiónem suam, et de furóre Omnipoténtis bibet.
  "21": Quid enim ad eum pértinet de domo sua post se? et si númerus ménsium eius dimidiétur?
  "22": Numquid Deus docébit quíspiam sciéntiam, qui excélsos iúdicat?
  "23": Iste móritur robústus et sanus, dives et felix.
  "24": 'Víscera eius plena sunt ádipe, et medúllis ossa illíus irrigántur:'
  "25": 'álius vero móritur in amaritúdine ánimæ absque ullis ópibus:'
  "26": et tamen simul in púlvere dórmient, et vermes opérient eos.
  "27": Certe novi cogitatiónes vestras, et senténtias contra me iníquas.
  "28": 'Dícitis enim: Ubi est domus príncipis? et ubi tabernácula impiórum?'
  "29": Interrogáte quémlibet de viatóribus, et hæc éadem illum intellígere cognoscétis.
  "30": Quia in diem perditiónis servátur malus, et ad diem furóris ducétur.
  "31": Quis árguet coram eo viam eius? et quæ fecit, quis reddet illi?
  "32": Ipse ad sepúlcra ducétur, et in congérie mortuórum vigilábit.
  "33": Dulcis fuit gláreis Cocýti, et post se omnem hóminem trahet, et ante se innumerábiles.
  "34": Quómodo ígitur consolámini me frustra, cum respónsio vestra repugnáre osténsa sit veritáti?
