bible: vulgate
lang: la
language: Latina
book: Proverbia
chapter: "25"
verses:
  "1": Hæ quoque parábolæ Salomónis, quas transtulérunt viri Ezechíæ regis Iuda.
  "2": Glória Dei est celáre verbum, et glória regum investigáre sermónem.
  "3": Cælum sursum, et terra deórsum, et cor regum inscrutábile.
  "4": Aufer rubíginem de argénto, et egrediétur vas puríssimum.
  "5": Aufer impietátem de vultu regis, et firmábitur iustítia thronus eius.
  "6": Ne gloriósus appáreas coram rege, et in loco magnórum ne stéteris.
  "7": 'Mélius est enim ut dicátur tibi: Ascénde huc, quam ut humiliéris coram príncipe.'
  "8": 'Quæ vidérunt óculi tui, ne próferas in iúrgio cito: ne póstea emendáre non possis, cum dehonestáveris amícum tuum.'
  "9": 'Causam tuam tracta cum amíco tuo, et secrétum extráneo ne revéles:'
  "10": 'ne forte insúltet tibi cum audíerit, et exprobráre non cesset. Grátia et amicítia líberant: quas tibi serva, ne exprobrábilis fias.'
  "11": Mala áurea in lectis argénteis, qui lóquitur verbum in témpore suo.
  "12": Ináuris áurea, et margarítum fulgens, qui árguit sapiéntem et aurem obediéntem.
  "13": Sicut frigus nivis in die messis, ita legátus fidélis ei, qui misit eum, ánimam ipsíus requiéscere facit.
  "14": Nubes, et ventus, et plúviæ non sequéntes, vir gloriósus et promíssa non complens.
  "15": Patiéntia leniétur princeps, et lingua mollis confrínget durítiam.
  "16": 'Mel invenísti: cómede quod súfficit tibi, ne forte satiátus évomas illud.'
  "17": Súbtrahe pedem tuum de domo próximi tui, nequándo satiátus óderit te.
  "18": Iáculum, et gládius, et sagítta acúta, homo qui lóquitur contra próximum suum falsum testimónium.
  "19": Dens pútridus, et pes lassus, qui sperat super infidéli in die angústiæ,
  "20": et amíttit pállium in die frígoris. Acétum in nitro, qui cantat cármina cordi péssimo. Sicut tínea vestiménto, et vermis ligno, ita tristítia viri nocet cordi.
  "21": 'Si esuríerit inimícus tuus, ciba illum: si sitíerit, da ei aquam bíbere:'
  "22": prunas enim congregábis super caput eius, et Dóminus reddet tibi.
  "23": Ventus áquilo díssipat plúvias, et fácies tristis linguam detrahéntem.
  "24": Mélius est sedére in ángulo dómatis, quam cum mulíere litigiósa et in domo commúni.
  "25": Aqua frígida ánimæ sitiénti, et núntius bonus de terra longínqua.
  "26": Fons turbátus pede, et vena corrúpta, iustus cadens coram ímpio.
  "27": 'Sicut qui mel multum cómedit, non est ei bonum: sic qui scrutátor est maiestátis, opprimétur a glória.'
  "28": Sicut urbs patens et absque murórum ámbitu, ita vir qui non potest in loquéndo cohibére spíritum suum.
