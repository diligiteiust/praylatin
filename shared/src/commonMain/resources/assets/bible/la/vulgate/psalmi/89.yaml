bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "89"
verses:
  "1": Orátio Móysi hóminis Dei. Dómine, refúgium factus es nobis, a generatióne in generatiónem.
  "2": 'Priúsquam montes fíerent, aut formarétur terra et orbis: a sǽculo et usque in sǽculum tu es Deus.'
  "3": 'Ne avértas hóminem in humilitátem: et dixísti: Convertímini fílii hóminum.'
  "4": 'Quóniam mille anni ante óculos tuos, tamquam dies hestérna quæ prætériit: et custódia in nocte,'
  "5": quæ pro níhilo habéntur, eórum anni erunt.
  "6": 'Mane sicut herba tránseat, mane flóreat, et tránseat: véspere décidat, indúret, et aréscat.'
  "7": Quia defécimus in ira tua, et in furóre tuo turbáti sumus.
  "8": 'Posuísti iniquitátes nostras in conspéctu tuo: sǽculum nostrum in illuminatióne vultus tui.'
  "9": 'Quóniam omnes dies nostri defecérunt: et in ira tua defécimus. Anni nostri sicut aránea meditabúntur:'
  "10": 'dies annórum nostrórum in ipsis, septuagínta anni. Si autem in potentátibus octogínta anni: et ámplius eórum, labor et dolor. Quóniam supervénit mansuetúdo: et corripiémur.'
  "11": 'Quis novit potestátem iræ tuæ: et præ timóre tuo iram tuam'
  "12": dinumeráre? Déxteram tuam sic notam fac, et erudítos corde in sapiéntia.
  "13": Convértere Dómine úsquequo? et deprecábilis esto super servos tuos.
  "14": 'Repléti sumus mane misericórdia tua: et exsultávimus, et delectáti sumus ómnibus diébus nostris.'
  "15": 'Lætáti sumus pro diébus, quibus nos humiliásti: annis quibus vídimus mala.'
  "16": 'Réspice in servos tuos, et in ópera tua: et dírige fílios eórum.'
  "17": 'Et sit splendor Dómini Dei nostri super nos, et ópera mánuum nostrárum dírige super nos: et opus mánuum nostrárum dírige.'
