bible: vulgate
lang: la
language: Latina
book: ad Hebraeos
chapter: "7"
verses:
  "1": 'Hic enim Melchísedech, rex Salem, sacérdos Dei summi, qui obviávit Abrahæ regrésso a cæde regum, et benedíxit ei:'
  "2": 'cui et décimas ómnium divísit Abraham: primum quidem qui interpretátur rex iustítiæ: deínde autem et rex Salem, quod est, rex pacis,'
  "3": sine patre, sine matre, sine genealógia, neque inítium diérum, neque finem vitæ habens, assimilátus autem Fílio Dei, manet sacérdos in perpétuum.
  "4": Intuémini autem quantus sit hic, cui et décimas dedit de præcípuis Abraham patriárcha.
  "5": 'Et quidem de fíliis Levi sacerdótium accipiéntes, mandátum habent décimas súmere a pópulo secúndum legem, id est, a frátribus suis: quamquam et ipsi exíerint de lumbis Abrahæ.'
  "6": Cuius autem generátio non annumerátur in eis, décimas sumpsit ab Abraham, et hunc, qui habébat repromissiónes, benedíxit.
  "7": Sine ulla autem contradictióne, quod minus est, a melióre benedícitur.
  "8": 'Et hic quidem, décimas moriéntes hómines accípiunt: ibi autem contestátur, quia vivit.'
  "9": 'Et (ut ita dictum sit) per Abraham, et Levi, qui décimas accépit, decimátus est:'
  "10": adhuc enim in lumbis patris erat, quando obviávit ei Melchísedech.
  "11": Si ergo consummátio per sacerdótium Levíticum erat (pópulus enim sub ipso legem accépit), quid adhuc necessárium fuit secúndum órdinem Melchísedech, álium súrgere sacerdótem, et non secúndum órdinem Aaron dici?
  "12": Transláto enim sacerdótio, necésse est ut et legis translátio fiat.
  "13": In quo enim hæc dicúntur, de ália tribu est, de qua nullus altári præsto fuit.
  "14": 'Maniféstum est enim quod ex Iuda ortus sit Dóminus noster: in qua tribu nihil de sacerdótibus Móyses locútus est.'
  "15": 'Et ámplius adhuc maniféstum est: si secúndum similitúdinem Melchísedech exsúrgat álius sacérdos,'
  "16": qui non secúndum legem mandáti carnális factus est, sed secúndum virtútem vitæ insolúbilis.
  "17": 'Contestátur enim: Quóniam tu es sacérdos in ætérnum, secúndum órdinem Melchísedech.'
  "18": 'Reprobátio quidem fit præcedéntis mandáti, propter infirmitátem eius, et inutilitátem:'
  "19": 'nihil enim ad perféctum addúxit lex: introdúctio vero melióris spei, per quam proximámus ad Deum.'
  "20": Et quantum est non sine iureiurándo (álii quidem sine iureiurándo sacerdótes facti sunt,
  "21": 'hic autem cum iureiurándo per eum, qui dixit ad illum: Iurávit Dóminus, et non pœnitébit eum: tu es sacérdos in ætérnum):'
  "22": in tantum melióris testaménti sponsor factus est Iesus.
  "23": 'Et álii quidem plures facti sunt sacerdótes, idcírco quod morte prohiberéntur permanére:'
  "24": hic autem eo quod máneat in ætérnum, sempitérnum habet sacerdótium.
  "25": 'Unde et salváre in perpétuum potest accedéntes per semetípsum ad Deum: semper vivens ad interpellándum pro nobis.'
  "26": 'Talis enim decébat ut nobis esset póntifex, sanctus, ínnocens, impollútus, segregátus a peccatóribus, et excélsior cælis factus:'
  "27": 'qui non habet necessitátem quotídie, quemádmodum sacerdótes, prius pro suis delíctis hóstias offérre, deínde pro pópuli: hoc enim fecit semel, seípsum offeréndo.'
  "28": 'Lex enim hómines constítuit sacerdótes infirmitátem habéntes: sermo autem iurisiurándi, qui post legem est, Fílium in ætérnum perféctum.'
