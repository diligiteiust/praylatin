bible: vulgate
lang: la
language: Latina
book: Ecclesiasticus
chapter: "39"
verses:
  "1": Sapiéntiam ómnium antiquórum exquíret sápiens, et in prophétis vacábit.
  "2": Narratiónem virórum nominatórum conservábit, et in versútias parabolárum simul introíbit.
  "3": Occúlta proverbiórum exquíret, et in abscónditis parabolárum conversábitur.
  "4": In médio magnatórum ministrábit, et in conspéctu prǽsidis apparébit.
  "5": 'In terram alienigenárum géntium pertránsiet: bona enim et mala in homínibus tentábit.'
  "6": Cor suum tradet ad vigilándum dilúculo ad Dóminum, qui fecit illum, et in conspéctu Altíssimi deprecábitur.
  "7": Apériet os suum in oratióne, et pro delíctis suis deprecábitur.
  "8": 'Si enim Dóminus magnus volúerit, spíritu intelligéntiæ replébit illum:'
  "9": 'et ipse tamquam imbres mittet elóquia sapiéntiæ suæ, et in oratióne confitébitur Dómino:'
  "10": et ipse díriget consílium eius, et disciplínam, et in abscónditis suis consiliábitur.
  "11": Ipse palam fáciet disciplínam doctrínæ suæ, et in lege testaménti Dómini gloriábitur.
  "12": Collaudábunt multi sapiéntiam eius, et usque in sǽculum non delébitur.
  "13": Non recédet memória eius, et nomen eius requirétur a generatióne in generatiónem.
  "14": Sapiéntiam eius enarrábunt gentes, et laudem eius enuntiábit ecclésia.
  "15": 'Si permánserit, nomen derelínquet plus quam mille: et si requiéverit, próderit illi.'
  "16": 'Adhuc consiliábor, ut enárrem: ut furóre enim replétus sum.'
  "17": 'In voce dicit: Obaudíte me, divíni fructus, et quasi rosa plantáta super rivos aquárum fructificáte.'
  "18": Quasi Líbanus odórem suavitátis habéte.
  "19": Floréte flores, quasi lílium, et date odórem, et frondéte in grátiam, et collaudáte cánticum, et benedícite Dóminum in opéribus suis.
  "20": 'Date nómini eius magnificéntiam, et confitémini illi in voce labiórum vestrórum, et in cánticis labiórum, et cítharis, et sic dicétis in confessióne:'
  "21": Opera Dómini univérsa bona valde.
  "22": 'In verbo eius stetit aqua sicut congéries: et in sermóne oris illíus sicut exceptória aquárum:'
  "23": quóniam in præcépto ipsíus placor fit, et non est minorátio in salúte ipsíus.
  "24": Opera omnis carnis coram illo, et non est quidquam abscónditum ab óculis eius.
  "25": A sǽculo usque in sǽculum réspicit, et nihil est mirábile in conspéctu eius.
  "26": 'Non est dícere: Quid est hoc, aut quid est istud? ómnia enim in témpore suo quæréntur.'
  "27": Benedíctio illíus quasi flúvius inundávit.
  "28": Quómodo cataclýsmus áridam inebriávit, sic ira ipsíus gentes, quæ non exquisiérunt eum, hereditábit.
  "29": 'Quómodo convértit aquas in siccitátem, et siccáta est terra: et viæ illíus viis illórum diréctæ sunt: sic peccatóribus offensiónes in ira eius.'
  "30": 'Bona bonis creáta sunt ab inítio: sic nequíssimis bona et mala.'
  "31": Inítium necessáriæ rei vitæ hóminum, aqua, ignis, et ferrum, sal, lac, et panis similagíneus, et mel, et botrus uvæ, et óleum, et vestiméntum.
  "32": Hæc ómnia sanctis in bona, sic et ímpiis et peccatóribus in mala converténtur.
  "33": 'Sunt spíritus, qui ad vindíctam creáti sunt, et in furóre suo confirmavérunt torménta sua:'
  "34": 'in témpore consummatiónis effúndent virtútem: et furórem eius, qui fecit illos, placábunt.'
  "35": 'Ignis, grando, fames, et mors, ómnia hæc ad vindíctam creáta sunt:'
  "36": bestiárum dentes, et scórpii, et serpéntes, et rhomphǽa víndicans in extermínium ímpios.
  "37": 'In mandátis eius epulabúntur: et super terram in necessitátem præparabúntur, et in tempóribus suis non prætérient verbum.'
  "38": Proptérea ab inítio confirmátus sum, et consiliátus sum, et cogitávi, et scripta dimísi.
  "39": Omnia ópera Dómini bona, et omne opus hora sua subministrábit.
  "40": 'Non est dícere: Hoc illo néquius est: ómnia enim in témpore suo comprobabúntur.'
  "41": Et nunc in omni corde et ore collaudáte, et benedícite nomen Dómini.
