bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "117"
verses:
  "1": 'Allelúia. Confitémini Dómino quóniam bonus: quóniam in sǽculum misericórdia eius.'
  "2": 'Dicat nunc Israel quóniam bonus: quóniam in sǽculum misericórdia eius.'
  "3": 'Dicat nunc domus Aaron: quóniam in sǽculum misericórdia eius.'
  "4": 'Dicant nunc qui timent Dóminum: quóniam in sǽculum misericórdia eius.'
  "5": 'De tribulatióne invocávi Dóminum: et exaudívit me in latitúdine Dóminus.'
  "6": 'Dóminus mihi adiútor: non timébo quid fáciat mihi homo.'
  "7": 'Dóminus mihi adiútor: et ego despíciam inimícos meos.'
  "8": 'Bonum est confídere in Dómino, quam confídere in hómine:'
  "9": bonum est speráre in Dómino, quam speráre in princípibus.
  "10": 'Omnes gentes circuiérunt me: et in nómine Dómini quia ultus sum in eos.'
  "11": 'Circumdántes circumdedérunt me: et in nómine Dómini quia ultus sum in eos.'
  "12": 'Circumdedérunt me sicut apes, et exarsérunt sicut ignis in spinis: et in nómine Dómini quia ultus sum in eos.'
  "13": 'Impúlsus evérsus sum ut cáderem: et Dóminus suscépit me.'
  "14": 'Fortitúdo mea, et laus mea Dóminus: et factus est mihi in salútem.'
  "15": Vox exsultatiónis et salútis in tabernáculis iustórum.
  "16": 'Déxtera Dómini fecit virtútem: déxtera Dómini exaltávit me, déxtera Dómini fecit virtútem.'
  "17": 'Non móriar, sed vivam: et narrábo ópera Dómini.'
  "18": 'Castígans castigávit me Dóminus: et morti non trádidit me.'
  "19": 'Aperíte mihi portas iustítiæ, ingréssus in eas confitébor Dómino:'
  "20": hæc porta Dómini, iusti intrábunt in eam.
  "21": 'Confitébor tibi quóniam exaudísti me: et factus es mihi in salútem.'
  "22": Lápidem quem reprobavérunt ædificántes, hic factus est in caput ánguli.
  "23": 'A Dómino factum est istud: et est mirábile in óculis nostris.'
  "24": 'Hæc est dies, quam fecit Dóminus: exsultémus, et lætémur in ea.'
  "25": 'O Dómine salvum me fac, o Dómine bene prosperáre:'
  "26": 'benedíctus qui venit in nómine Dómini. Benedíximus vobis de domo Dómini:'
  "27": Deus Dóminus, et illúxit nobis. Constitúite diem solémnem in condénsis, usque ad cornu altáris.
  "28": 'Deus meus es tu, et confitébor tibi: Deus meus es tu, et exaltábo te. Confitébor tibi quóniam exaudísti me: et factus es mihi in salútem.'
  "29": 'Confitémini Dómino quóniam bonus: quóniam in sǽculum misericórdia eius.'
