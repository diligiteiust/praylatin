bible: vulgate
lang: la
language: Latina
book: Sapientia
chapter: "13"
verses:
  "1": 'Vani autem sunt omnes hómines, in quibus non subest sciéntia Dei: et de his, quæ vidéntur bona, non potuérunt intellígere eum, qui est, neque opéribus attendéntes agnovérunt quis esset ártifex:'
  "2": sed aut ignem, aut spíritum, aut citátum áerem, aut gyrum stellárum, aut nímiam aquam, aut solem et lunam, rectóres orbis terrárum deos putavérunt.
  "3": 'Quorum si spécie delectáti, deos putavérunt: sciant quanto his dominátor eórum speciósior est: speciéi enim generátor hæc ómnia constítuit.'
  "4": 'Aut si virtútem et ópera eórum miráti sunt, intélligant ab illis quóniam qui hæc fecit, fórtior est illis:'
  "5": a magnitúdine enim speciéi et creatúræ cognoscibíliter póterit creátor horum vidéri.
  "6": Sed tamen adhuc in his minor est queréla. Et hi enim fortásse errant, Deum quæréntes, et voléntes inveníre.
  "7": 'Etenim cum in opéribus illíus converséntur, inquírunt: et persuásum habent quóniam bona sunt quæ vidéntur.'
  "8": Iterum autem nec his debet ignósci.
  "9": 'Si enim tantum potuérunt scire, ut possent æstimáre sǽculum: quómodo huius Dóminum non facílius invenérunt?'
  "10": 'Infelíces autem sunt, et inter mórtuos spes illórum est, qui appellavérunt deos ópera mánuum hóminum: aurum et argéntum, artis inventiónem, et similitúdines animálium, aut lápidem inútilem, opus manus antíquæ.'
  "11": 'Aut si quis ártifex faber de silva lignum rectum secúerit, et huius docte erádat omnem córticem, et arte sua usus diligénter fábricet vas útile in conversatiónem vitæ:'
  "12": 'relíquiis autem eius óperis ad præparatiónem escæ abutátur:'
  "13": et réliquum horum, quod ad nullos usus facit, lignum curvum, et vortícibus plenum, sculpat diligénter per vacuitátem suam, et per sciéntiam suæ artis figúret illud, et assímilet illud imágini hóminis,
  "14": 'aut alícui ex animálibus illud cómparet, perlíniens rubríca, et rubicúndum fáciens fuco colórem illíus, et omnem máculam, quæ in illo est, perlíniens:'
  "15": et fáciat ei dignam habitatiónem, et in paríete ponens illud, et confírmans ferro,
  "16": 'ne forte cadat, prospíciens illi: sciens quóniam non potest adiuváre se: imágo enim est, et opus est illi adiutórium.'
  "17": 'Et de substántia sua, et de fíliis suis, et de núptiis votum fáciens inquírit: non erubéscit loqui cum illo, qui sine ánima est.'
  "18": Et pro sanitáte quidem infírmum deprecátur, et pro vita rogat mórtuum, et in adiutórium inútilem ínvocat.
  "19": 'Et pro itínere petit ab eo, qui ambuláre non potest: et de acquiréndo, et de operándo, et de ómnium rerum evéntu, petit ab eo, qui in ómnibus est inútilis.'
