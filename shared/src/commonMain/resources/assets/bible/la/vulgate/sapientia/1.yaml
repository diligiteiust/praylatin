bible: vulgate
lang: la
language: Latina
book: Sapientia
chapter: "1"
verses:
  "1": 'Dilígite iustítiam, qui iudicátis terram. Sentíte de Dómino in bonitáte, et in simplicitáte cordis quǽrite illum:'
  "2": 'quóniam invenítur ab his, qui non tentant illum: appáret autem eis, qui fidem habent in illum.'
  "3": 'Pervérsæ enim cogitatiónes séparant a Deo: probáta autem virtus córripit insipiéntes.'
  "4": Quóniam in malévolam ánimam non introíbit sapiéntia, nec habitábit in córpore súbdito peccátis.
  "5": Spíritus enim sanctus disciplínæ effúgiet fictum, et áuferet se a cogitatiónibus, quæ sunt sine intelléctu, et corripiétur a superveniénte iniquitáte.
  "6": 'Benígnus est enim spíritus sapiéntiæ, et non liberábit malédicum a lábiis suis: quóniam renum illíus testis est Deus, et cordis illíus scrutátor est verus, et linguæ eius audítor.'
  "7": 'Quóniam Spíritus Dómini replévit orbem terrárum: et hoc, quod cóntinet ómnia, sciéntiam habet vocis.'
  "8": Propter hoc qui lóquitur iníqua, non potest latére, nec prætériet illum corrípiens iudícium.
  "9": 'In cogitatiónibus enim ímpii interrogátio erit: sermónum autem illíus audítio ad Deum véniet, ad correptiónem iniquitátum illíus.'
  "10": Quóniam auris zeli audit ómnia, et tumúltus murmuratiónum non abscondétur.
  "11": 'Custodíte ergo vos a murmuratióne, quæ nihil prodest, et a detractióne párcite linguæ, quóniam sermo obscúrus in vácuum non ibit: os autem quod mentítur, occídit ánimam.'
  "12": Nolíte zeláre mortem in erróre vitæ vestræ, neque acquirátis perditiónem in opéribus mánuum vestrárum.
  "13": Quóniam Deus mortem non fecit, nec lætátur in perditióne vivórum.
  "14": 'Creávit enim ut essent ómnia, et sanábiles fecit natiónes orbis terrárum: et non est in illis medicaméntum extermínii, nec inferórum regnum in terra.'
  "15": Iustítia enim perpétua est, et immortális.
  "16": 'Impii autem mánibus et verbis accersiérunt illam, et æstimántes illam amícam, defluxérunt: et sponsiónes posuérunt ad illam: quóniam digni sunt qui sint ex parte illíus.'
