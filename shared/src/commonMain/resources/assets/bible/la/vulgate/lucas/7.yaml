bible: vulgate
lang: la
language: Latina
book: Lucas
chapter: "7"
verses:
  "1": Cum autem implésset ómnia verba sua in aures plebis, intrávit Caphárnaum.
  "2": 'Centuriónis autem cuiúsdam servus male habens, erat moritúrus: qui illi erat pretiósus.'
  "3": Et cum audísset de Iesu, misit ad eum senióres Iudæórum, rogans eum ut veníret, et salváret servum eius.
  "4": 'At illi cum veníssent ad Iesum, rogábant eum sollícite, dicéntes ei: Quia dignus est ut hoc illi præstes:'
  "5": díligit enim gentem nostram, et synagógam ipse ædificávit nobis.
  "6": 'Iesus autem ibat cum illis. Et cum iam non longe esset a domo, misit ad eum centúrio amícos, dicens: Dómine, noli vexári: non enim sum dignus ut sub tectum meum intres:'
  "7": 'propter quod et meípsum non sum dignum arbitrátus ut venírem ad te: sed dic verbo, et sanábitur puer meus.'
  "8": 'Nam et ego homo sum sub potestáte constitútus, habens sub me mílites: et dico huic, Vade, et vadit: et álii, Veni, et venit: et servo meo, Fac hoc, et facit.'
  "9": 'Quo audíto Iesus mirátus est: et convérsus sequéntibus se turbis, dixit: Amen dico vobis, nec in Israel tantam fidem invéni.'
  "10": Et revérsi, qui missi fúerant, domum, invenérunt servum, qui langúerat, sanum.
  "11": 'Et factum est: deínceps ibat in civitátem, quæ vocátur Naim: et ibant cum eo discípuli eius, et turba copiósa.'
  "12": 'Cum autem appropinquáret portæ civitátis, ecce defúnctus efferebátur fílius únicus matris suæ: et hæc vídua erat: et turba civitátis multa cum illa.'
  "13": 'Quam cum vidísset Dóminus, misericórdia motus super eam, dixit illi: Noli flere.'
  "14": 'Et accéssit, et tétigit lóculum. (Hi autem, qui portábant, stetérunt.) Et ait: Adoléscens, tibi dico, surge.'
  "15": Et resédit qui erat mórtuus, et cœpit loqui. Et dedit illum matri suæ.
  "16": 'Accépit autem omnes timor: et magnificábant Deum, dicéntes: Quia prophéta magnus surréxit in nobis: et quia Deus visitávit plebem suam.'
  "17": Et éxiit hic sermo in univérsam Iudǽam de eo, et in omnem circa regiónem.
  "18": Et nuntiavérunt Ioánni discípuli eius de ómnibus his.
  "19": 'Et convocávit duos de discípulis suis Ioánnes, et misit ad Iesum, dicens: Tu es qui ventúrus es, an álium exspectámus?'
  "20": 'Cum autem veníssent ad eum viri, dixérunt: Ioánnes Baptísta misit nos ad te dicens: Tu es qui ventúrus es, an álium exspectámus?'
  "21": (In ipsa autem hora multos curávit a languóribus, et plagis, et spirítibus malis, et cæcis multis donávit visum.)
  "22": 'Et respóndens, dixit illis: Eúntes renuntiáte Ioánni quæ audístis, et vidístis: quia cæci vident, claudi ámbulant, leprósi mundántur, surdi áudiunt, mórtui resúrgunt, páuperes evangelizántur:'
  "23": et beátus est quicúmque non fúerit scandalizátus in me.
  "24": 'Et cum discessíssent núntii Ioánnis, cœpit de Ioánne dícere ad turbas: Quid exístis in desértum vidére? arúndinem vento agitátam?'
  "25": Sed quid exístis vidére? hóminem móllibus véstibus indútum? Ecce qui in veste pretiósa sunt et delíciis, in dómibus regum sunt.
  "26": 'Sed quid exístis vidére? prophétam? Utique dico vobis, et plus quam prophétam:'
  "27": 'hic est, de quo scriptum est: Ecce mitto ángelum meum ante fáciem tuam, qui præparábit viam tuam ante te.'
  "28": 'Dico enim vobis: maior inter natos mulíerum prophéta Ioánne Baptísta nemo est: qui autem minor est in regno Dei, maior est illo.'
  "29": Et omnis pópulus áudiens et publicáni, iustificavérunt Deum, baptizáti baptísmo Ioánnis.
  "30": Pharisǽi autem, et legisperíti consílium Dei sprevérunt in semetípsos, non baptizáti ab eo.
  "31": 'Ait autem Dóminus: Cui ergo símiles dicam hómines generatiónis huius? et cui símiles sunt?'
  "32": 'Símiles sunt púeris sedéntibus in foro, et loquéntibus ad ínvicem, et dicéntibus: Cantávimus vobis tíbiis, et non saltástis: lamentávimus, et non plorástis.'
  "33": 'Venit enim Ioánnes Baptísta, neque mandúcans panem, neque bibens vinum, et dícitis: Dæmónium habet.'
  "34": 'Venit Fílius hóminis mandúcans, et bibens, et dícitis: Ecce homo devorátor, et bibens vinum, amícus publicanórum, et peccatórum.'
  "35": Et iustificáta est sapiéntia ab ómnibus fíliis suis.
  "36": Rogábat autem illum quidam de Pharisǽis, ut manducáret cum illo. Et ingréssus domum Pharisǽi discúbuit.
  "37": 'Et ecce múlier, quæ erat in civitáte peccátrix, ut cognóvit quod accubuísset in domo Pharisǽi, áttulit alabástrum unguénti:'
  "38": et stans retro secus pedes eius, lácrymis cœpit rigáre pedes eius, et capíllis cápitis sui tergébat, et osculabátur pedes eius, et unguénto ungébat.
  "39": 'Videns autem Pharisǽus, qui vocáverat eum, ait intra se dicens: Hic si esset prophéta, sciret útique, quæ, et qualis est múlier, quæ tangit eum: quia peccátrix est.'
  "40": 'Et respóndens Iesus, dixit ad illum: Simon, hábeo tibi áliquid dícere. At ille ait: Magíster, dic.'
  "41": 'Duo debitóres erant cuídam fœneratóri: unus debébat denários quingéntos, et álius quinquagínta.'
  "42": Non habéntibus illis unde rédderent, donávit utrísque. Quis ergo eum plus díligit?
  "43": 'Respóndens Simon dixit: Æstimo quia is, cui plus donávit. At ille dixit ei: Recte iudicásti.'
  "44": 'Et convérsus ad mulíerem, dixit Simóni: Vides hanc mulíerem? Intrávi in domum tuam, aquam pédibus meis non dedísti: hæc autem lácrymis rigávit pedes meos, et capíllis suis tersit.'
  "45": 'Osculum mihi non dedísti: hæc autem ex quo intrávit, non cessávit osculári pedes meos.'
  "46": 'Oleo caput meum non unxísti: hæc autem unguénto unxit pedes meos.'
  "47": 'Propter quod dico tibi: remittúntur ei peccáta multa, quóniam diléxit multum. Cui autem minus dimíttitur, minus díligit.'
  "48": 'Dixit autem ad illam: Remittúntur tibi peccáta.'
  "49": 'Et cœpérunt qui simul accumbébant, dícere intra se: Quis est hic, qui étiam peccáta dimíttit?'
  "50": 'Dixit autem ad mulíerem: Fides tua te salvam fecit: vade in pace.'
