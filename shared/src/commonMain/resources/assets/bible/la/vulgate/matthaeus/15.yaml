bible: vulgate
lang: la
language: Latina
book: Matthaeus
chapter: "15"
verses:
  "1": 'Tunc accessérunt ad eum ab Ierosólymis scribæ, et Pharisǽi, dicéntes:'
  "2": Quare discípuli tui transgrediúntur traditiónem seniórum? non enim lavant manus suas cum panem mandúcant.
  "3": 'Ipse autem respóndens ait illis: Quare et vos transgredímini mandátum Dei propter traditiónem vestram? Nam Deus dixit:'
  "4": 'Honóra patrem, et matrem: et, Qui maledíxerit patri, vel matri, morte moriátur.'
  "5": 'Vos autem dícitis: Quicúmque díxerit patri, vel matri: Munus, quodcúmque est ex me, tibi próderit:'
  "6": 'et non honorificábit patrem suum, aut matrem suam: et írritum fecístis mandátum Dei propter traditiónem vestram.'
  "7": 'Hypócritæ, bene prophetávit de vobis Isaías, dicens:'
  "8": 'Pópulus hic lábiis me honórat: cor autem eórum longe est a me.'
  "9": Sine causa autem colunt me, docéntes doctrínas, et mandáta hóminum.
  "10": 'Et convocátis ad se turbis, dixit eis: Audíte, et intellígite.'
  "11": 'Non quod intrat in os, coínquinat hóminem: sed quod procédit ex ore, hoc coínquinat hóminem.'
  "12": 'Tunc accedéntes discípuli eius, dixérunt ei: Scis quia Pharisǽi audíto verbo hoc, scandalizáti sunt?'
  "13": 'At ille respóndens ait: Omnis plantátio, quam non plantávit Pater meus cæléstis, eradicábitur.'
  "14": 'Sínite illos: cæci sunt, et duces cæcórum: cæcus autem si cæco ducátum præstet, ambo in fóveam cadunt.'
  "15": 'Respóndens autem Petrus dixit ei: Edíssere nobis parábolam istam.'
  "16": 'At ille dixit: Adhuc et vos sine intelléctu estis?'
  "17": Non intellígitis quia omne, quod in os intrat, in ventrem vadit, et in secéssum emíttitur?
  "18": 'Quæ autem procédunt de ore, de corde éxeunt, et ea coínquinant hóminem:'
  "19": 'de corde enim éxeunt cogitatiónes malæ, homicídia, adultéria, fornicatiónes, furta, falsa testimónia, blasphémiæ:'
  "20": hæc sunt, quæ coínquinant hóminem. Non lotis autem mánibus manducáre, non coínquinat hóminem.
  "21": Et egréssus inde Iesus secéssit in partes Tyri, et Sidónis.
  "22": 'Et ecce múlier Chananǽa a fínibus illis egréssa clamávit, dicens ei: Miserére mei Dómine fili David: fília mea male a dæmónio vexátur.'
  "23": 'Qui non respóndit ei verbum. Et accedéntes discípuli eius rogábant eum dicéntes: Dimítte eam: quia clamat post nos.'
  "24": 'Ipse autem respóndens ait: Non sum missus nisi ad oves, quæ periérunt domus Israel.'
  "25": 'At illa venit, et adorávit eum, dicens: Dómine, ádiuva me.'
  "26": 'Qui respóndens ait: Non est bonum súmere panem filiórum, et míttere cánibus.'
  "27": 'At illa dixit: Etiam Dómine: nam et catélli edunt de micis, quæ cadunt de mensa dominórum suórum.'
  "28": 'Tunc respóndens Iesus, ait illi: O múlier, magna est fides tua: fiat tibi sicut vis. Et sanáta est fília eius ex illa hora.'
  "29": 'Et cum transísset inde Iesus, venit secus mare Galilǽæ: et ascéndens in montem, sedébat ibi.'
  "30": 'Et accessérunt ad eum turbæ multæ, habéntes secum mutos, cæcos, claudos, débiles, et álios multos: et proiecérunt eos ad pedes eius, et curávit eos:'
  "31": 'ita ut turbæ miraréntur, vidéntes mutos loquéntes, claudos ambulántes, cæcos vidéntes: et magnificábant Deum Israel.'
  "32": 'Iesus autem, convocátis discípulis suis, dixit: Miséreor turbæ, quia tríduo iam persevérant mecum, et non habent quod mandúcent: et dimíttere eos ieiúnos nolo, ne defíciant in via.'
  "33": 'Et dicunt ei discípuli: Unde ergo nobis in desérto panes tantos, ut saturémus turbam tantam?'
  "34": 'Et ait illis Iesus: Quot habétis panes? At illi dixérunt: Septem, et paucos piscículos.'
  "35": Et præcépit turbæ, ut discúmberent super terram.
  "36": Et accípiens septem panes, et pisces, et grátias agens, fregit, et dedit discípulis suis, et discípuli dedérunt pópulo.
  "37": Et comedérunt omnes, et saturáti sunt. Et quod supérfuit de fragméntis, tulérunt septem sportas plenas.
  "38": Erant autem qui manducavérunt, quátuor míllia hóminum, extra párvulos et mulíeres.
  "39": 'Et, dimíssa turba, ascéndit in navículam: et venit in fines Mágedan.'
