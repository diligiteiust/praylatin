bible: vulgate
lang: la
language: Latina
book: Ezechiel
chapter: "21"
verses:
  "1": 'Et factus est sermo Dómini ad me, dicens:'
  "2": Fili hóminis pone fáciem tuam ad Ierúsalem, et stilla ad sanctuária, et prophéta contra humum Israel.
  "3": 'Et dices terræ Israel: Hæc dicit Dóminus Deus: Ecce ego ad te, et eíciam gládium meum de vagína sua, et occídam in te iustum et ímpium.'
  "4": 'Pro eo autem quod occídi in te iustum, et ímpium, idcírco egrediétur gládius meus de vagína sua ad omnem carnem, ab austro usque ad aquilónem:'
  "5": ut sciat omnis caro quia ego Dóminus, edúxi gládium meum de vagína sua irrevocábilem.
  "6": Et tu fili hóminis, ingemísce in contritióne lumbórum, et in amaritudínibus ingemísce coram eis.
  "7": 'Cumque díxerint ad te: Quare tu gemis? dices: Pro audítu: quia venit, et tabéscet omne cor, et dissolvéntur univérsæ manus, et infirmábitur omnis spíritus, et per cuncta génua fluent aquæ: ecce venit, et fiet, ait Dóminus Deus.'
  "8": 'Et factus est sermo Dómini ad me, dicens:'
  "9": 'Fili hóminis prophéta, et dices: Hæc dicit Dóminus Deus: Lóquere: Gládius, gládius exacútus est, et limátus.'
  "10": 'Ut cædat víctimas, exacútus est: ut spléndeat, limátus est: qui moves sceptrum fílii mei, succidísti omne lignum.'
  "11": 'Et dedi eum ad levigándum, ut teneátur manu: iste exacútus est gládius, et iste limátus est, ut sit in manu interficiéntis.'
  "12": 'Clama et úlula fili hóminis, quia hic factus est in pópulo meo, hic in cunctis dúcibus Israel, qui fúgerant: gládio tráditi sunt cum pópulo meo, idcírco plaude super femur,'
  "13": 'quia probátus est: et hoc, cum sceptrum subvérterit, et non erit, dicit Dóminus Deus.'
  "14": 'Tu ergo fili hóminis prophéta, et pércute manu ad manum: et duplicétur gládius, ac triplicétur gládius interfectórum: hic est gládius occisiónis magnæ, qui obstupéscere eos facit,'
  "15": et corde tabéscere, et multíplicat ruínas. In ómnibus portis eórum dedi conturbatiónem gládii acúti, et limáti ad fulgéndum, amícti ad cædem.
  "16": Exacúere, vade ad déxteram sive ad sinístram, quocúmque faciéi tuæ est appetítus.
  "17": 'Quin et ego plaudam manu ad manum, et implébo indignatiónem meam: ego Dóminus locútus sum.'
  "18": 'Et factus est sermo Dómini ad me, dicens:'
  "19": 'Et tu fili hóminis pone tibi duas vias, ut véniat gládius regis Babylónis: de terra una egrediéntur ambæ: et manu cápiet coniectúram, in cápite viæ civitátis coníciet.'
  "20": Viam pones ut véniat gládius ad Rabbath filiórum Ammon, et ad Iudam in Ierúsalem munitíssimam.
  "21": 'Stetit enim rex Babylónis in bívio, in cápite duárum viárum, divinatiónem quærens, commíscens sagíttas: interrogávit idóla, exta consúluit.'
  "22": Ad déxteram eius facta est divinátio super Ierúsalem, ut ponat aríetes, ut apériat os in cæde, ut élevet vocem in ululátu, ut ponat aríetes contra portas, ut compórtet ággerem, ut ædíficet munitiónes.
  "23": 'Erítque quasi cónsulens frustra oráculum in óculis eórum, et sabbatórum ótium ímitans: ipse autem recordábitur iniquitátis ad capiéndum.'
  "24": 'Idcírco hæc dicit Dóminus Deus: Pro eo quod recordáti estis iniquitátis vestræ, et revelástis prævaricatiónes vestras, et apparuérunt peccáta vestra in ómnibus cogitatiónibus vestris: pro eo, inquam, quod recordáti estis, manu capiémini.'
  "25": 'Tu autem profáne, ímpie dux Israel, cuius venit dies in témpore iniquitátis præfiníta:'
  "26": 'hæc dicit Dóminus Deus: Aufer cídarim, tolle corónam: nonne hæc est, quæ húmilem sublevávit, et sublímem humiliávit?'
  "27": 'Iniquitátem, iniquitátem, iniquitátem ponam eam: et hoc non factum est, donec veníret cuius est iudícium, et tradam ei.'
  "28": 'Et tu fili hóminis prophéta, et dic: Hæc dicit Dóminus Deus ad fílios Ammon, et ad oppróbrium eórum: et dices: Mucro, mucro evagináte ad occidéndum: limáte ut interfícias, et fúlgeas,'
  "29": 'cum tibi videréntur vana, et divinaréntur mendácia: ut daréris super colla vulneratórum impiórum, quorum venit dies in témpore iniquitátis præfiníta.'
  "30": 'Revértere ad vagínam tuam, in loco, in quo creátus es: in terra nativitátis tuæ iudicábo te,'
  "31": 'et effúndam super te indignatiónem meam: in igne furóris mei sufflábo in te, dabóque te in manus hóminum insipiéntium, et fabricántium intéritum.'
  "32": 'Igni eris cibus, sanguis tuus erit in médio terræ, oblivióni tradéris: quia ego Dóminus locútus sum.'
