bible: vulgate
lang: la
language: Latina
book: Matthaeus
chapter: "2"
verses:
  "1": Cum ergo natus esset Iesus in Béthlehem Iuda in diébus Heródis regis, ecce magi ab oriénte venérunt Ierosólymam,
  "2": 'dicéntes: Ubi est qui natus est rex Iudæórum? vídimus enim stellam eius in oriénte, et vénimus adoráre eum.'
  "3": Audiens autem Heródes rex, turbátus est, et omnis Ierosólyma cum illo.
  "4": Et cóngregans omnes príncipes sacerdótum, et scribas pópuli, sciscitabátur ab eis ubi Christus nascerétur.
  "5": 'At illi dixérunt: In Béthlehem Iudæ: sic enim scriptum est per prophétam:'
  "6": 'Et tu Béthlehem terra Iuda, nequáquam mínima es in princípibus Iuda: ex te enim éxiet dux, qui regat pópulum meum Israel.'
  "7": 'Tunc Heródes clam vocátis magis diligénter dídicit ab eis tempus stellæ, quæ appáruit eis:'
  "8": 'et mittens illos in Béthlehem, dixit: Ite, et interrogáte diligénter de púero: et cum invenéritis, renuntiáte mihi, ut et ego véniens adórem eum.'
  "9": 'Qui cum audíssent regem, abiérunt: et ecce stella, quam víderant in oriénte, antecedébat eos, usque dum véniens staret supra, ubi erat puer.'
  "10": Vidéntes autem stellam gavísi sunt gáudio magno valde.
  "11": 'Et intrántes domum, invenérunt púerum cum María matre eius, et procidéntes adoravérunt eum: et apértis thesáuris suis obtulérunt ei múnera, aurum, thus, et myrrham.'
  "12": Et respónso accépto in somnis ne redírent ad Heródem, per áliam viam revérsi sunt in regiónem suam.
  "13": 'Qui cum recessíssent, ecce ángelus Dómini appáruit in somnis Ioseph, dicens: Surge, et áccipe púerum, et matrem eius, et fuge in Ægýptum, et esto ibi usque dum dicam tibi. Futúrum est enim ut Heródes quærat púerum ad perdéndum eum.'
  "14": 'Qui consúrgens accépit púerum, et matrem eius nocte, et secéssit in Ægýptum:'
  "15": 'et erat ibi usque ad óbitum Heródis: ut adimplerétur quod dictum est a Dómino per prophétam dicéntem: Ex Ægýpto vocávi fílium meum.'
  "16": Tunc Heródes videns quóniam illúsus esset a magis, irátus est valde, et mittens occídit omnes púeros, qui erant in Béthlehem, et in ómnibus fínibus eius, a bimátu et infra secúndum tempus, quod exquisíerat a magis.
  "17": 'Tunc adimplétum est quod dictum est per Ieremíam prophétam dicéntem:'
  "18": 'Vox in Rama audíta est plorátus, et ululátus multus: Rachel plorans fílios suos, et nóluit consolári, quia non sunt.'
  "19": Defúncto autem Heróde, ecce ángelus Dómini appáruit in somnis Ioseph in Ægýpto,
  "20": 'dicens: Surge, et áccipe púerum, et matrem eius, et vade in terram Israel: defúncti sunt enim, qui quærébant ánimam púeri.'
  "21": Qui consúrgens, accépit púerum, et matrem eius, et venit in terram Israel.
  "22": 'Audiens autem quod Archeláus regnáret in Iudǽa pro Heróde patre suo, tímuit illo ire: et admónitus in somnis, secéssit in partes Galilǽæ.'
  "23": 'Et véniens habitávit in civitáte, quæ vocátur Názareth: ut adimplerétur quod dictum est per prophétas: Quóniam Nazarǽus vocábitur.'
