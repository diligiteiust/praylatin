bible: vulgate
lang: la
language: Latina
book: II Regum
chapter: "7"
verses:
  "1": 'Dixit autem Eliséus: Audíte verbum Dómini: Hæc dicit Dóminus: In témpore hoc cras módius símilæ uno statére erit, et duo módii hórdei statére uno, in porta Samaríæ.'
  "2": 'Respóndens unus de dúcibus, super cuius manum rex incumbébat, hómini Dei, ait: Si Dóminus fécerit étiam cataráctas in cælo, numquid póterit esse quod lóqueris? Qui ait: Vidébis óculis tuis, et inde non cómedes.'
  "3": 'Quátuor ergo viri erant leprósi iuxta intróitum portæ: qui dixérunt ad ínvicem: Quid hic esse vólumus donec moriámur?'
  "4": 'Sive íngredi voluérimus civitátem, fame moriémur: sive mansérimus hic, moriéndum nobis est: veníte ergo, et transfugiámus ad castra Sýriæ: si pepércerint nobis, vivémus: si autem occídere volúerint, nihilóminus moriémur.'
  "5": Surrexérunt ergo vésperi, ut venírent ad castra Sýriæ. Cumque veníssent ad princípium castrórum Sýriæ, nullum ibídem reperérunt.
  "6": 'Síquidem Dóminus sónitum audíri fécerat in castris Sýriæ, cúrruum, et equórum, et exércitus plúrimi: dixerúntque ad ínvicem: Ecce mercéde condúxit advérsum nos rex Israel reges Hethæórum, et Ægyptiórum, et venérunt super nos.'
  "7": Surrexérunt ergo, et fugérunt in ténebris, et dereliquérunt tentória sua, et equos et ásinos, in castris, fugerúntque, ánimas tantum suas salváre cupiéntes.
  "8": 'Igitur cum veníssent leprósi illi ad princípium castrórum, ingréssi sunt unum tabernáculum, et comedérunt et bibérunt: tulerúntque inde argéntum, et aurum, et vestes, et abiérunt, et abscondérunt: et rursum revérsi sunt ad áliud tabernáculum, et inde simíliter auferéntes abscondérunt.'
  "9": 'Dixerúntque ad ínvicem: Non recte fácimus: hæc enim dies boni núntii est. Si tacuérimus, et noluérimus nuntiáre usque mane, scéleris arguémur: veníte, eámus, et nuntiémus in aula regis.'
  "10": 'Cumque veníssent ad portam civitátis, narravérunt eis, dicéntes: Ivimus ad castra Sýriæ, et nullum ibídem repérimus hóminem, nisi equos, et ásinos alligátos, et fixa tentória.'
  "11": Iérunt ergo portárii, et nuntiavérunt in palátio regis intrínsecus.
  "12": 'Qui surréxit nocte, et ait ad servos suos: Dico vobis quid fécerint nobis Syri: Sciunt quia fame laborámus, et idcírco egréssi sunt de castris, et látitant in agris, dicéntes: Cum egréssi fúerint de civitáte, capiémus eos vivos, et tunc civitátem íngredi potérimus.'
  "13": 'Respóndit autem unus servórum eius: Tollámus quinque equos, qui remansérunt in urbe (quia ipsi tantum sunt in univérsa multitúdine Israel, álii enim consúmpti sunt), et mitténtes, exploráre potérimus.'
  "14": 'Adduxérunt ergo duos equos, misítque rex in castra Syrórum, dicens: Ite, et vidéte.'
  "15": 'Qui abiérunt post eos usque ad Iordánem: ecce autem omnis via plena erat véstibus, et vasis, quæ proiécerant Syri cum turbaréntur: reversíque núntii indicavérunt regi.'
  "16": 'Et egréssus pópulus dirípuit castra Sýriæ: factúsque est módius símilæ statére uno, et duo módii hórdei statére uno, iuxta verbum Dómini.'
  "17": 'Porro rex ducem illum, in cuius manu incumbébat, constítuit ad portam: quem conculcávit turba in intróitu portæ, et mórtuus est, iuxta quod locútus fúerat vir Dei, quando descénderat rex ad eum.'
  "18": 'Factúmque est secúndum sermónem viri Dei, quem díxerat regi, quando ait: Duo módii hórdei statére uno erunt, et módius símilæ statére uno, hoc eódem témpore cras in porta Samaríæ:'
  "19": 'quando respónderat dux ille viro Dei, et díxerat: Etiámsi Dóminus fécerit cataráctas in cælo, numquid póterit fíeri quod lóqueris? Et dixit ei: Vidébis óculis tuis, et inde non cómedes.'
  "20": Evénit ergo ei sicut prædíctum fúerat, et conculcávit eum pópulus in porta, et mórtuus est.
