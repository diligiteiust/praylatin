bible: vulgate
lang: la
language: Latina
book: Lucas
chapter: "1"
verses:
  "1": 'Quóniam quidem multi conáti sunt ordináre narratiónem, quæ in nobis complétæ sunt, rerum:'
  "2": 'sicut tradidérunt nobis, qui ab inítio ipsi vidérunt, et minístri fuérunt sermónis:'
  "3": visum est et mihi, assecúto ómnia a princípio diligénter, ex órdine tibi scríbere, óptime Theóphile,
  "4": ut cognóscas eórum verbórum, de quibus erudítus es, veritátem.
  "5": Fuit in diébus Heródis, regis Iudǽæ, sacérdos quidam nómine Zacharías de vice Abía, et uxor illíus de filiábus Aaron, et nomen eius Elísabeth.
  "6": Erant autem iusti ambo ante Deum, incedéntes in ómnibus mandátis, et iustificatiónibus Dómini sine queréla.
  "7": Et non erat illis fílius, eo quod esset Elísabeth stérilis, et ambo processíssent in diébus suis.
  "8": Factum est autem, cum sacerdótio fungerétur in órdine vicis suæ ante Deum,
  "9": 'secúndum consuetúdinem sacerdótii, sorte éxiit ut incénsum póneret, ingréssus in templum Dómini:'
  "10": et omnis multitúdo pópuli erat orans foris hora incénsi.
  "11": Appáruit autem illi ángelus Dómini, stans a dextris altáris incénsi.
  "12": Et Zacharías turbátus est videns, et timor írruit super eum.
  "13": 'Ait autem ad illum ángelus: Ne tímeas Zacharía, quóniam exaudíta est deprecátio tua: et uxor tua Elísabeth páriet tibi fílium, et vocábis nomen eius Ioánnem:'
  "14": 'et erit gáudium tibi, et exsultátio, et multi in nativitáte eius gaudébunt:'
  "15": 'erit enim magnus coram Dómino: et vinum, et síceram non bibet, et Spíritu sancto replébitur adhuc ex útero matris suæ:'
  "16": 'et multos filiórum Israel convértet ad Dóminum Deum ipsórum:'
  "17": 'et ipse præcédet ante illum in spíritu, et virtúte Elíæ: ut convértat corda patrum in fílios, et incrédulos ad prudéntiam iustórum, paráre Dómino plebem perféctam.'
  "18": 'Et dixit Zacharías ad ángelum: Unde hoc sciam? ego enim sum senex, et uxor mea procéssit in diébus suis.'
  "19": 'Et respóndens ángelus dixit ei: Ego sum Gábriel, qui asto ante Deum: et missus sum loqui ad te, et hæc tibi evangelizáre.'
  "20": Et ecce eris tacens, et non póteris loqui usque in diem, quo hæc fiant, pro eo quod non credidísti verbis meis, quæ implebúntur in témpore suo.
  "21": 'Et erat plebs exspéctans Zacharíam: et mirabántur quod tardáret ipse in templo.'
  "22": Egréssus autem non póterat loqui ad illos, et cognovérunt quod visiónem vidísset in templo. Et ipse erat ínnuens illis, et permánsit mutus.
  "23": 'Et factum est, ut impléti sunt dies offícii eius, ábiit in domum suam:'
  "24": 'post hos autem dies concépit Elísabeth uxor eius, et occultábat se ménsibus quinque, dicens:'
  "25": Quia sic fecit mihi Dóminus in diébus, quibus respéxit auférre oppróbrium meum inter hómines.
  "26": In mense autem sexto, missus est ángelus Gábriel a Deo in civitátem Galilǽæ, cui nomen Názareth,
  "27": 'ad vírginem desponsátam viro, cui nomen erat Ioseph, de domo David: et nomen vírginis María.'
  "28": 'Et ingréssus ángelus ad eam dixit: Ave grátia plena: Dóminus tecum: benedícta tu in muliéribus.'
  "29": Quæ cum audísset, turbáta est in sermóne eius, et cogitábat qualis esset ista salutátio.
  "30": 'Et ait ángelus ei: Ne tímeas María: invenísti enim grátiam apud Deum.'
  "31": Ecce concípies in útero, et páries fílium, et vocábis nomen eius Iesum.
  "32": 'Hic erit magnus, et Fílius Altíssimi vocábitur, et dabit illi Dóminus Deus sedem David patris eius: et regnábit in domo Iacob in ætérnum,'
  "33": et regni eius non erit finis.
  "34": 'Dixit autem María ad ángelum: Quómodo fiet istud, quóniam virum non cognósco?'
  "35": 'Et respóndens ángelus dixit ei: Spíritus sanctus supervéniet in te, et virtus Altíssimi obumbrábit tibi. Ideóque et quod nascétur ex te sanctum, vocábitur Fílius Dei.'
  "36": 'Et ecce Elísabeth cognáta tua, et ipsa concépit fílium in senectúte sua: et hic mensis sextus est illi, quæ vocátur stérilis:'
  "37": quia non erit impossíbile apud Deum omne verbum.
  "38": 'Dixit autem María: Ecce ancílla Dómini: fiat mihi secúndum verbum tuum. Et discéssit ab illa ángelus.'
  "39": 'Exsúrgens autem María in diébus illis, ábiit in montána cum festinatióne, in civitátem Iuda:'
  "40": et intrávit in domum Zacharíæ, et salutávit Elísabeth.
  "41": 'Et factum est, ut audívit salutatiónem Maríæ Elísabeth, exsultávit infans in útero eius: et repléta est Spíritu sancto Elísabeth:'
  "42": 'et exclamávit voce magna, et dixit: Benedícta tu inter mulíeres, et benedíctus fructus ventris tui.'
  "43": Et unde hoc mihi, ut véniat mater Dómini mei ad me?
  "44": Ecce enim ut facta est vox salutatiónis tuæ in áuribus meis, exsultávit in gáudio infans in útero meo.
  "45": Et beáta, quæ credidísti, quóniam perficiéntur ea, quæ dicta sunt tibi a Dómino.
  "46": 'Et ait María: Magníficat ánima mea Dóminum:'
  "47": et exsultávit spíritus meus in Deo salutári meo.
  "48": 'Quia respéxit humilitátem ancíllæ suæ: ecce enim ex hoc beátam me dicent omnes generatiónes,'
  "49": 'quia fecit mihi magna qui potens est: et sanctum nomen eius.'
  "50": Et misericórdia eius a progénie in progénies timéntibus eum.
  "51": 'Fecit poténtiam in bráchio suo: dispérsit supérbos mente cordis sui.'
  "52": Depósuit poténtes de sede, et exaltávit húmiles.
  "53": 'Esuriéntes implévit bonis: et dívites dimísit inánes.'
  "54": Suscépit Israel púerum suum, recordátus misericórdiæ suæ.
  "55": Sicut locútus est ad patres nostros, Abraham et sémini eius in sǽcula.
  "56": 'Mansit autem María cum illa quasi ménsibus tribus: et revérsa est in domum suam.'
  "57": Elísabeth autem implétum est tempus pariéndi, et péperit fílium.
  "58": Et audiérunt vicíni, et cognáti eius quia magnificávit Dóminus misericórdiam suam cum illa, et congratulabántur ei.
  "59": Et factum est in die octávo, venérunt circumcídere púerum, et vocábant eum nómine patris sui Zacharíam.
  "60": 'Et respóndens mater eius, dixit: Nequáquam, sed vocábitur Ioánnes.'
  "61": 'Et dixérunt ad illam: Quia nemo est in cognatióne tua, qui vocétur hoc nómine.'
  "62": Innuébant autem patri eius, quem vellet vocári eum.
  "63": 'Et póstulans pugillárem scripsit, dicens: Ioánnes est nomen eius. Et miráti sunt univérsi.'
  "64": Apértum est autem íllico os eius, et lingua eius, et loquebátur benedícens Deum.
  "65": 'Et factus est timor super omnes vicínos eórum: et super ómnia montána Iudǽæ divulgabántur ómnia verba hæc:'
  "66": 'et posuérunt omnes, qui audíerant in corde suo, dicéntes: Quis putas, puer iste erit? étenim manus Dómini erat cum illo.'
  "67": 'Et Zacharías pater eius replétus est Spíritu sancto: et prophetávit, dicens:'
  "68": 'Benedíctus Dóminus Deus Israel, quia visitávit, et fecit redemptiónem plebis suæ:'
  "69": et eréxit cornu salútis nobis in domo David púeri sui,
  "70": 'sicut locútus est per os sanctórum, qui a sǽculo sunt, prophetárum eius:'
  "71": 'salútem ex inimícis nostris, et de manu ómnium, qui odérunt nos:'
  "72": 'ad faciéndam misericórdiam cum pátribus nostris: et memorári testaménti sui sancti.'
  "73": 'Iusiurándum, quod iurávit ad Abraham patrem nostrum, datúrum se nobis:'
  "74": ut sine timóre, de manu inimicórum nostrórum liberáti, serviámus illi,
  "75": in sanctitáte et iustítia coram ipso, ómnibus diébus nostris.
  "76": 'Et tu puer, prophéta Altíssimi vocáberis: præíbis enim ante fáciem Dómini paráre vias eius:'
  "77": 'ad dandam sciéntiam salútis plebi eius: in remissiónem peccatórum eórum:'
  "78": 'per víscera misericórdiæ Dei nostri: in quibus visitávit nos, óriens ex alto:'
  "79": 'illumináre his, qui in ténebris, et in umbra mortis sedent: ad dirigéndos pedes nostros in viam pacis.'
  "80": 'Puer autem crescébat, et confortabátur spíritu: et erat in desértis usque in diem ostensiónis suæ ad Israel.'
