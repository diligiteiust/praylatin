bible: vulgate
lang: la
language: Latina
book: Deuteronomium
chapter: "3"
verses:
  "1": 'Itaque convérsi ascéndimus per iter Basan: egressúsque est Og rex Basan in occúrsum nobis cum pópulo suo ad bellándum in Edrai.'
  "2": 'Dixítque Dóminus ad me: Ne tímeas eum: quia in manu tua tráditus est cum omni pópulo ac terra sua: faciésque ei sicut fecísti Sehon regi Amorrhæórum, qui habitávit in Hésebon.'
  "3": 'Trádidit ergo Dóminus Deus noster in mánibus nostris étiam Og regem Basan, et univérsum pópulum eius: percussimúsque eos usque ad interneciónem,'
  "4": 'vastántes cunctas civitátes illíus uno témpore. Non fuit óppidum, quod nos effúgeret: sexagínta urbes, omnem regiónem Argob regni Og in Basan.'
  "5": Cunctæ urbes erant munítæ muris altíssimis, portísque et véctibus, absque óppidis innúmeris, quæ non habébant muros.
  "6": 'Et delévimus eos, sicut fecerámus Sehon regi Hésebon, disperdéntes omnem civitátem, virósque ac mulíeres et párvulos:'
  "7": iuménta autem et spólia úrbium diripúimus.
  "8": 'Tulimúsque illo in témpore terram de manu duórum regum Amorrhæórum, qui erant trans Iordánem: a torrénte Arnon usque ad montem Hermon,'
  "9": 'quem Sidónii Sárion vocant, et Amorrhǽi Sanir:'
  "10": omnes civitátes, quæ sitæ sunt in planítie, et univérsam terram Gálaad et Basan usque ad Selcha, et Edrai civitátes regni Og in Basan.
  "11": Solus quippe Og rex Basan restíterat de stirpe gigántum. Monstrátur lectus eius férreus, qui est in Rabbath filiórum Ammon, novem cúbitos habens longitúdinis, et quátuor latitúdinis ad mensúram cúbiti virílis manus.
  "12": 'Terrámque possédimus témpore illo ab Aroer, quæ est super ripam torréntis Arnon, usque ad médiam partem montis Gálaad: et civitátes illíus dedi Ruben et Gad.'
  "13": 'Réliquam autem partem Gálaad, et omnem Basan regni Og, trádidi médiæ tríbui Manásse, omnem regiónem Argob: cunctáque Basan vocátur Terra gigántum.'
  "14": Iair fílius Manásse possédit omnem regiónem Argob usque ad términos Géssuri et Macháti. Vocavítque ex nómine suo Basan, Havoth Iair, id est, Villas Iair, usque in præséntem diem.
  "15": Machir quoque dedi Gálaad.
  "16": 'Et tríbubus Ruben et Gad dedi de terra Gálaad usque ad torréntem Arnon médium torréntis, et confínium usque ad torréntem Ieboc, qui est términus filiórum Ammon:'
  "17": et planítiem solitúdinis, atque Iordánem, et términos Cénereth usque ad mare desérti, quod est salsíssimum, ad radíces montis Phasga contra oriéntem.
  "18": 'Præcepíque vobis in témpore illo, dicens: Dóminus Deus vester dat vobis terram hanc in hereditátem: expedíti præcédite fratres vestros fílios Israel omnes viri robústi:'
  "19": absque uxóribus, et párvulis, atque iuméntis. Novi enim quod plura habeátis pécora, et in úrbibus remanére debébunt, quas trádidi vobis,
  "20": 'donec réquiem tríbuat Dóminus frátribus vestris, sicut vobis tríbuit: et possídeant ipsi étiam terram, quam datúrus est eis trans Iordánem: tunc revertétur unusquísque in possessiónem suam, quam dedi vobis.'
  "21": 'Iósue quoque in témpore illo præcépi, dicens: Oculi tui vidérunt quæ fecit Dóminus Deus vester duóbus his régibus: sic fáciet ómnibus regnis, ad quæ transitúrus es.'
  "22": 'Ne tímeas eos: Dóminus enim Deus vester pugnábit pro vobis.'
  "23": 'Precatúsque sum Dóminum in témpore illo, dicens:'
  "24": 'Dómine Deus, tu cœpísti osténdere servo tuo magnitúdinem tuam, manúmque fortíssimam: neque enim est álius Deus vel in cælo, vel in terra, qui possit fácere ópera tua, et comparári fortitúdini tuæ.'
  "25": Transíbo ígitur, et vidébo terram hanc óptimam trans Iordánem, et montem istum egrégium, et Líbanum.
  "26": 'Iratúsque est Dóminus mihi propter vos, nec exaudívit me, sed dixit mihi: Súfficit tibi: nequáquam ultra loquáris de hac re ad me.'
  "27": 'Ascénde cacúmen Phasgæ, et óculos tuos circúmfer ad occidéntem, et ad aquilónem, austrúmque et oriéntem, et áspice: nec enim transíbis Iordánem istum.'
  "28": 'Prǽcipe Iósue, et corróbora eum atque confórta: quia ipse præcédet pópulum istum, et dívidet eis terram, quam visúrus es.'
  "29": Mansimúsque in valle contra fanum Phogor.
