bible: vulgate
lang: la
language: Latina
book: Ecclesiasticus
chapter: "41"
verses:
  "1": 'O mors quam amára est memória tua hómini pacem habénti in substántiis suis:'
  "2": viro quiéto, et cuius viæ diréctæ sunt in ómnibus, et adhuc valénti accípere cibum!
  "3": O mors, bonum est iudícium tuum hómini indigénti, et qui minorátur víribus,
  "4": defécto ætáte, et cui de ómnibus cura est, et incredíbili, qui perdit patiéntiam!
  "5": 'Noli metúere iudícium mortis. Meménto quæ ante te fuérunt, et quæ superventúra sunt tibi: hoc iudícium a Dómino omni carni:'
  "6": et quid supervéniet tibi in beneplácito Altíssimi? sive decem, sive centum, sive mille anni.
  "7": Non est enim in inférno accusátio vitæ.
  "8": Fílii abominatiónum fiunt fílii peccatórum, et qui conversántur secus domos impiórum.
  "9": Filiórum peccatórum périet heréditas, et cum sémine illórum assidúitas oppróbrii.
  "10": De patre ímpio querúntur fílii, quóniam propter illum sunt in oppróbrio.
  "11": Væ vobis viri ímpii, qui dereliquístis legem Dómini Altíssimi.
  "12": 'Et si nati fuéritis, in maledictióne nascémini: et si mórtui fuéritis, in maledictióne erit pars vestra.'
  "13": 'Omnia, quæ de terra sunt, in terram converténtur: sic ímpii a maledícto in perditiónem.'
  "14": 'Luctus hóminum in córpore ipsórum: nomen autem impiórum delébitur.'
  "15": 'Curam habe de bono nómine: hoc enim magis permanébit tibi, quam mille thesáuri pretiósi et magni.'
  "16": 'Bonæ vitæ númerus diérum: bonum autem nomen permanébit in ævum.'
  "17": 'Disciplínam in pace conserváte fílii: sapiéntia enim abscóndita, et thesáurus invísus, quæ utílitas in utrísque?'
  "18": Mélior est homo, qui abscóndit stultítiam suam, quam homo, qui abscóndit sapiéntiam suam.
  "19": Verúmtamen reverémini in his, quæ procédunt de ore meo.
  "20": 'Non est enim bonum omnem reveréntiam observáre: et non ómnia ómnibus bene placent in fide.'
  "21": 'Erubéscite a patre et a matre de fornicatióne: et a præsidénte et a poténte de mendácio:'
  "22": 'a príncipe et a iúdice de delícto: a synagóga et plebe de iniquitáte:'
  "23": 'a sócio et amíco de iniustítia: et de loco, in quo hábitas,'
  "24": 'de furto, de veritáte Dei, et testaménto: de discúbitu in pánibus, et ab obfuscatióne dati et accépti:'
  "25": 'a salutántibus de siléntio: a respéctu mulíeris fornicáriæ: et ab aversióne vultus cognáti.'
  "26": Ne avértas fáciem a próximo tuo, et ab auferéndo partem et non restituéndo.
  "27": Ne respícias mulíerem aliéni viri, et ne scrutéris ancíllam eius, neque stéteris ad lectum eius.
  "28": 'Ab amícis de sermónibus impropérii: et cum déderis, ne impróperes.'
