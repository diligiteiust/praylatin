bible: vulgate
lang: la
language: Latina
book: Iosue
chapter: "24"
verses:
  "1": 'Congregavítque Iósue omnes tribus Israel in Sichem, et vocávit maióres natu, ac príncipes, et iúdices, et magístros: steterúntque in conspéctu Dómini:'
  "2": 'et ad pópulum sic locútus est: Hæc dicit Dóminus Deus Israel: Trans flúvium habitavérunt patres vestri ab inítio, Thare pater Abraham, et Nachor: servierúntque diis aliénis.'
  "3": Tuli ergo patrem vestrum Abraham de Mesopotámiæ fínibus, et addúxi eum in terram Chánaan, multiplicavíque semen eius,
  "4": 'et dedi ei Isaac: illíque rursum dedi Iacob et Esau. E quibus, Esau dedi montem Seir ad possidéndum: Iacob vero, et fílii eius descendérunt in Ægýptum.'
  "5": Misíque Móysen et Aaron, et percússi Ægýptum multis signis atque porténtis.
  "6": 'Eduxíque vos et patres vestros de Ægýpto, et venístis ad mare: persecutíque sunt Ægýptii patres vestros cum cúrribus et equitátu, usque ad mare Rubrum.'
  "7": 'Clamavérunt autem ad Dóminum fílii Israel: qui pósuit ténebras inter vos et Ægýptios, et addúxit super eos mare, et opéruit eos. Vidérunt óculi vestri cuncta quæ in Ægýpto fécerim, et habitástis in solitúdine multo témpore:'
  "8": et introdúxi vos in terram Amorrhǽi, qui habitábat trans Iordánem. Cumque pugnárent contra vos, trádidi eos in manus vestras, et possedístis terram eórum, atque interfecístis eos.
  "9": 'Surréxit autem Balac fílius Sephor rex Moab, et pugnávit contra Israélem. Misítque et vocávit Bálaam fílium Beor, ut maledíceret vobis:'
  "10": et ego nólui audíre eum, sed e contrário per illum benedíxi vobis, et liberávi vos de manu eius.
  "11": 'Transistísque Iordánem, et venístis ad Iéricho. Pugnaverúntque contra vos viri civitátis eius, Amorrhǽus et Pherezǽus, et Chananǽus, et Hethǽus, et Gergezǽus, et Hevǽus, et Iebusǽus: et trádidi illos in manus vestras.'
  "12": 'Misíque ante vos crabrónes: et eiéci eos de locis suis, duos reges Amorrhæórum, non in gládio nec in arcu tuo.'
  "13": 'Dedíque vobis terram, in qua non laborástis, et urbes quas non ædificástis, ut habitarétis in eis: víneas, et olivéta, quæ non plantástis.'
  "14": 'Nunc ergo timéte Dóminum, et servíte ei perfécto corde atque veríssimo: et auférte deos, quibus serviérunt patres vestri in Mesopotámia et in Ægýpto, ac servíte Dómino.'
  "15": 'Sin autem malum vobis vidétur ut Dómino serviátis, óptio vobis datur: elígite hódie quod placet, cui servíre potíssimum debeátis: utrum diis, quibus serviérunt patres vestri in Mesopotámia, an diis Amorrhæórum, in quorum terra habitátis: ego autem et domus mea serviémus Dómino.'
  "16": 'Respondítque pópulus, et ait: Absit a nobis ut relinquámus Dóminum, et serviámus diis aliénis.'
  "17": 'Dóminus Deus noster, ipse edúxit nos et patres nostros de terra Ægýpti, de domo servitútis: fecítque vidéntibus nobis signa ingéntia, et custodívit nos in omni via, per quam ambulávimus, et in cunctis pópulis, per quos transívimus.'
  "18": Et eiécit univérsas gentes, Amorrhǽum habitatórem terræ, quam nos intrávimus. Serviémus ígitur Dómino, quia ipse est Deus noster.
  "19": 'Dixítque Iósue ad pópulum: Non potéritis servíre Dómino: Deus enim sanctus et fortis æmulátor est, nec ignóscet sceléribus vestris atque peccátis.'
  "20": Si dimiséritis Dóminum, et serviéritis diis aliénis, convértet se, et afflíget vos atque subvértet, postquam vobis præstíterit bona.
  "21": 'Dixítque pópulus ad Iósue: Nequáquam ita ut lóqueris erit, sed Dómino serviémus.'
  "22": 'Et Iósue ad pópulum: Testes, inquit, vos estis, quia ipsi elegéritis vobis Dóminum ut serviátis ei. Responderúntque: Testes.'
  "23": Nunc ergo, ait, auférte deos aliénos de médio vestri, et inclináte corda vestra ad Dóminum Deum Israel.
  "24": 'Dixítque pópulus ad Iósue: Dómino Deo nostro serviémus, et obediéntes érimus præcéptis eius.'
  "25": Percússit ergo Iósue in die illo fœdus, et propósuit pópulo præcépta atque iudícia in Sichem.
  "26": 'Scripsit quoque ómnia verba hæc in volúmine legis Dómini: et tulit lápidem pergrándem, posuítque eum subter quercum, quæ erat in sanctuário Dómini:'
  "27": 'et dixit ad omnem pópulum: En lapis iste erit vobis in testimónium, quod audíerit ómnia verba Dómini, quæ locútus est vobis: ne forte póstea negáre velítis, et mentíri Dómino Deo vestro.'
  "28": Dimisítque pópulum, síngulos in possessiónem suam.
  "29": 'Et post hæc mórtuus est Iósue fílius Nun servus Dómini, centum et decem annórum:'
  "30": sepelierúntque eum in fínibus possessiónis suæ in Thamnáthsare, quæ est sita in monte Ephraim, a septentrionáli parte montis Gaas.
  "31": Servivítque Israel Dómino cunctis diébus Iósue et seniórum, qui longo vixérunt témpore post Iósue, et qui novérunt ómnia ópera Dómini quæ fécerat in Israel.
  "32": Ossa quoque Ioseph, quæ túlerant fílii Israel de Ægýpto, sepeliérunt in Sichem, in parte agri, quem émerat Iacob a fíliis Hemor patris Sichem, centum novéllis óvibus, et fuit in possessiónem filiórum Ioseph.
  "33": 'Eleázar quoque fílius Aaron mórtuus est: et sepeliérunt eum in Gábaath Phínees fílii eius, quæ data est ei in monte Ephraim.'
