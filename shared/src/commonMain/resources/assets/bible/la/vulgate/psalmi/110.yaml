bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "110"
verses:
  "1": 'Allelúia. Confitébor tibi Dómine in toto corde meo: in consílio iustórum, et congregatióne.'
  "2": 'Magna ópera Dómini: exquisíta in omnes voluntátes eius.'
  "3": 'Conféssio et magnificéntia opus eius: et iustítia eius manet in sǽculum sǽculi.'
  "4": 'Memóriam fecit mirabílium suórum, miséricors et miserátor Dóminus:'
  "5": 'escam dedit timéntibus se. Memor erit in sǽculum testaménti sui:'
  "6": 'virtútem óperum suórum annuntiábit pópulo suo:'
  "7": 'ut det illis hereditátem géntium: ópera mánuum eius véritas et iudícium.'
  "8": 'Fidélia ómnia mandáta eius: confirmáta in sǽculum sǽculi, facta in veritáte et æquitáte.'
  "9": 'Redemptiónem misit pópulo suo: mandávit in ætérnum testaméntum suum. Sanctum et terríbile nomen eius:'
  "10": 'Inítium sapiéntiæ timor Dómini. Intelléctus bonus ómnibus faciéntibus eum: laudátio eius manet in sǽculum sǽculi.'
