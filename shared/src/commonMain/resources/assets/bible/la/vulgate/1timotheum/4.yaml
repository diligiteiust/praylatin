bible: vulgate
lang: la
language: Latina
book: ad Timotheum I
chapter: "4"
verses:
  "1": Spíritus autem maniféste dicit, quia in novíssimis tempóribus discédent quidam a fide, attendéntes spirítibus erróris, et doctrínis dæmoniórum,
  "2": in hypócrisi loquéntium mendácium, et cauteriátam habéntium suam consciéntiam,
  "3": prohibéntium núbere, abstinére a cibis, quos Deus creávit ad percipiéndum cum gratiárum actióne fidélibus, et iis, qui cognovérunt veritátem.
  "4": 'Quia omnis creatúra Dei bona est, et nihil reiciéndum quod cum gratiárum actióne percípitur:'
  "5": sanctificátur enim per verbum Dei, et oratiónem.
  "6": Hæc propónens frátribus, bonus eris miníster Christi Iesu enutrítus verbis fídei, et bonæ doctrínæ, quam assecútus es.
  "7": 'Inéptas autem, et aníles fábulas devíta: exérce autem teípsum ad pietátem.'
  "8": 'Nam corporális exercitátio, ad módicum útilis est: píetas autem ad ómnia útilis est, promissiónem habens vitæ, quæ nunc est, et futúræ.'
  "9": Fidélis sermo, et omni acceptióne dignus.
  "10": In hoc enim laborámus, et maledícimur, quia sperámus in Deum vivum, qui est Salvátor ómnium hóminum, máxime fidélium.
  "11": Prǽcipe hæc, et doce.
  "12": 'Nemo adolescéntiam tuam contémnat: sed exémplum esto fidélium in verbo, in conversatióne, in caritáte, in fide, in castitáte.'
  "13": Dum vénio, atténde lectióni, exhortatióni, et doctrínæ.
  "14": Noli neglígere grátiam, quæ in te est, quæ data est tibi per prophetíam, cum impositióne mánuum presbytérii.
  "15": 'Hæc meditáre, in his esto: ut proféctus tuus maniféstus sit ómnibus.'
  "16": 'Atténde tibi, et doctrínæ: insta in illis. Hoc enim fáciens, et teípsum salvum fácies, et eos, qui te áudiunt.'
