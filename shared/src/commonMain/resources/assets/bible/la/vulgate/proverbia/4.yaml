bible: vulgate
lang: la
language: Latina
book: Proverbia
chapter: "4"
verses:
  "1": Audíte fílii disciplínam patris, et atténdite ut sciátis prudéntiam.
  "2": 'Donum bonum tríbuam vobis: legem meam ne derelinquátis.'
  "3": Nam et ego fílius fui patris mei, tenéllus et unigénitus coram matre mea.
  "4": 'Et docébat me, atque dicébat: Suscípiat verba mea cor tuum: custódi præcépta mea, et vives.'
  "5": 'Pósside sapiéntiam, pósside prudéntiam: ne obliviscáris, neque declínes a verbis oris mei.'
  "6": 'Ne dimíttas eam, et custódiet te: dílige eam, et conservábit te.'
  "7": 'Princípium sapiéntiæ, pósside sapiéntiam, et in omni possessióne tua, acquíre prudéntiam:'
  "8": 'árripe illam, et exaltábit te: glorificáberis ab ea, cum eam fúeris amplexátus:'
  "9": dabit cápiti tuo augménta gratiárum, et coróna ínclyta próteget te.
  "10": Audi fili mi, et súscipe verba mea, ut multiplicéntur tibi anni vitæ.
  "11": 'Viam sapiéntiæ monstrábo tibi: ducam te per sémitas æquitátis:'
  "12": quas cum ingréssus fúeris, non arctabúntur gressus tui, et currens non habébis offendículum.
  "13": 'Tene disciplínam, ne dimíttas eam: custódi illam, quia ipsa est vita tua.'
  "14": Ne delectéris in sémitis impiórum, nec tibi pláceat malórum via.
  "15": 'Fuge ab ea, nec tránseas per illam: declína, et désere eam.'
  "16": 'Non enim dórmiunt nisi malefécerint: et rápitur somnus ab eis nisi supplantáverint:'
  "17": cómedunt panem impietátis, et vinum iniquitátis bibunt.
  "18": Iustórum autem sémita quasi lux splendens procédit, et crescit usque ad perféctam diem.
  "19": 'Via impiórum tenebrósa: nésciunt ubi córruant.'
  "20": Fili mi, auscúlta sermónes meos, et ad elóquia mea inclína aurem tuam.
  "21": 'Ne recédant ab óculis tuis: custódi ea in médio cordis tui:'
  "22": vita enim sunt inveniéntibus ea, et univérsæ carni sánitas.
  "23": Omni custódia serva cor tuum, quia ex ipso vita procédit.
  "24": Rémove a te os pravum, et detrahéntia lábia sint procul a te.
  "25": Oculi tui recta vídeant, et pálpebræ tuæ præcédant gressus tuos.
  "26": Dírige sémitam pédibus tuis, et omnes viæ tuæ stabiliéntur.
  "27": 'Ne declínes ad déxteram, neque ad sinístram: avérte pedem tuum a malo: vias enim, quæ a dextris sunt, novit Dóminus: pervérsæ vero sunt quæ a sinístris sunt. Ipse autem rectos fáciet cursus tuos, itínera autem tua in pace prodúcet.'
