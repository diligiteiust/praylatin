bible: vulgate
lang: la
language: Latina
book: Ecclesiasticus
chapter: "43"
verses:
  "1": Altitúdinis firmaméntum pulchritúdo eius est, spécies cæli in visióne glóriæ.
  "2": Sol in aspéctu annúntians in éxitu, vas admirábile opus Excélsi.
  "3": 'In meridiáno exúrit terram, et in conspéctu ardóris eius quis póterit sustinére? Fornácem custódiens in opéribus ardóris:'
  "4": triplíciter sol exúrens montes, rádios ígneos exsúfflans, et refúlgens rádiis suis obcǽcat óculos.
  "5": Magnus Dóminus qui fecit illum, et in sermónibus eius festinávit iter.
  "6": Et luna in ómnibus in témpore suo, osténsio témporis, et signum ævi.
  "7": A luna signum diéi festi, lumináre quod minúitur in consummatióne.
  "8": Mensis secúndum nomen eius est, crescens mirabíliter in consummatióne.
  "9": Vas castrórum in excélsis, in firmaménto cæli respléndens glorióse.
  "10": Spécies cæli glória stellárum, mundum illúminans in excélsis Dóminus.
  "11": In verbis sancti stabunt ad iudícium, et non defícient in vigíliis suis.
  "12": 'Vide arcum, et bénedic eum, qui fecit illum: valde speciósus est in splendóre suo.'
  "13": Gyrávit cælum in circúitu glóriæ suæ, manus Excélsi aperuérunt illum.
  "14": Império suo accelerávit nivem, et accélerat coruscatiónes emíttere iudícii sui.
  "15": Proptérea apérti sunt thesáuri, et evolavérunt nébulæ sicut aves.
  "16": In magnitúdine sua pósuit nubes, et confrácti sunt lápides grándinis.
  "17": In conspéctu eius commovebúntur montes, et in voluntáte eius aspirábit notus.
  "18": 'Vox tonítrui eius verberávit terram, tempéstas aquilónis, et congregátio spíritus:'
  "19": et sicut avis depónens ad sedéndum, aspérgit nivem, et sicut locústa demérgens descénsus eius.
  "20": Pulchritúdinem candóris eius admirábitur óculus, et super imbrem eius expavéscet cor.
  "21": 'Gelu sicut salem effúndet super terram: et dum geláverit, fiet tamquam cacúmina tríbuli.'
  "22": 'Frígidus ventus áquilo flavit, et gelávit crystállus ab aqua, super omnem congregatiónem aquárum requiéscet, et sicut loríca índuet se aquis:'
  "23": et devorábit montes, et exúret desértum, et exstínguet víride, sicut igne.
  "24": 'Medicína ómnium in festinatióne nébulæ: et ros óbvians ab ardóre veniénti húmilem effíciet eum.'
  "25": In sermóne eius síluit ventus, et cogitatióne sua placávit abýssum, et plantávit in illa Dóminus ínsulas.
  "26": Qui návigant mare enárrent perícula eius, et audiéntes áuribus nostris admirábimur.
  "27": 'Illic præclára ópera, et mirabília: vária bestiárum génera, et ómnium pécorum, et creatúra belluárum.'
  "28": Propter ipsum confirmátus est itíneris finis, et in sermóne eius compósita sunt ómnia.
  "29": 'Multa dicémus, et deficiémus in verbis: consummátio autem sermónum, ipse est in ómnibus.'
  "30": Gloriántes ad quid valébimus? ipse enim omnípotens super ómnia ópera sua.
  "31": Terríbilis Dóminus, et magnus veheménter, et mirábilis poténtia ipsíus.
  "32": Glorificántes Dóminum quantumcúmque potuéritis, supervalébit enim adhuc, et admirábilis magnificéntia eius.
  "33": 'Benedicéntes Dóminum, exaltáte illum quantum potéstis: maior enim est omni laude.'
  "34": 'Exaltántes eum replémini virtúte, ne laborétis: non enim comprehendétis.'
  "35": Quis vidébit eum, et enarrábit? et quis magnificábit eum sicut est ab inítio?
  "36": 'Multa abscóndita sunt maióra his: pauca enim vídimus óperum eius.'
  "37": Omnia autem Dóminus fecit, et pie agéntibus dedit sapiéntiam.
