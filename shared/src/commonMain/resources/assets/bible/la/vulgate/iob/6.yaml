bible: vulgate
lang: la
language: Latina
book: Iob
chapter: "6"
verses:
  "1": 'Respóndens autem Iob, dixit:'
  "2": 'Utinam appenderéntur peccáta mea, quibus iram mérui: et calámitas, quam pátior, in statéra.'
  "3": 'Quasi aréna maris hæc grávior apparéret: unde et verba mea dolóre sunt plena:'
  "4": quia sagíttæ Dómini in me sunt, quarum indignátio ébibit spíritum meum, et terróres Dómini mílitant contra me.
  "5": Numquid rúgiet ónager cum habúerit herbam? aut múgiet bos cum ante præsépe plenum stéterit?
  "6": aut póterit cómedi insúlsum, quod non est sale condítum? aut potest áliquis gustáre, quod gustátum affert mortem?
  "7": Quæ prius nolébat tángere ánima mea, nunc præ angústia, cibi mei sunt.
  "8": Quis det ut véniat petítio mea, et quod exspécto tríbuat mihi Deus?
  "9": 'Et qui cœpit, ipse me cónterat: solvat manum suam, et succídat me?'
  "10": Et hæc mihi sit consolátio, ut afflígens me dolóre, non parcat, nec contradícam sermónibus Sancti.
  "11": Quæ est enim fortitúdo mea, ut sustíneam? aut quis finis meus, ut patiénter agam?
  "12": Nec fortitúdo lápidum fortitúdo mea, nec caro mea ǽnea est.
  "13": Ecce non est auxílium mihi in me, et necessárii quoque mei recessérunt a me.
  "14": Qui tollit ab amíco suo misericórdiam, timórem Dómini derelínquit.
  "15": Fratres mei præteriérunt me, sicut torrens qui raptim transit in convállibus.
  "16": Qui timent pruínam, írruet super eos nix.
  "17": 'Témpore, quo fúerint dissipáti, períbunt: et ut incalúerit, solvéntur de loco suo.'
  "18": 'Involútæ sunt sémitæ gréssuum eórum: ambulábunt in vácuum, et períbunt.'
  "19": Consideráte sémitas Thema, itínera Saba, et exspectáte paulísper.
  "20": 'Confúsi sunt, quia sperávi: venérunt quoque usque ad me, et pudóre coopérti sunt.'
  "21": 'Nunc venístis: et modo vidéntes plagam meam timétis.'
  "22": 'Numquid dixi: Afférte mihi, et de substántia vestra donáte mihi?'
  "23": vel, Liberáte me de manu hostis, et de manu robustórum erúite me?
  "24": 'Docéte me, et ego tacébo: et si quid forte ignorávi, instrúite me.'
  "25": Quare detraxístis sermónibus veritátis, cum e vobis nullus sit qui possit argúere me?
  "26": Ad increpándum tantum elóquia concinnátis, et in ventum verba profértis.
  "27": Super pupíllum irrúitis, et subvértere nitímini amícum vestrum.
  "28": 'Verúmtamen quod cœpístis expléte: præbéte aurem, et vidéte an méntiar.'
  "29": 'Respondéte, óbsecro, absque contentióne: et loquéntes id quod iustum est, iudicáte.'
  "30": Et non inveniétis in lingua mea iniquitátem, nec in fáucibus meis stultítia personábit.
