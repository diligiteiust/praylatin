bible: vulgate
lang: la
language: Latina
book: Leviticus
chapter: "25"
verses:
  "1": 'Locutúsque est Dóminus ad Móysen in monte Sínai, dicens:'
  "2": 'Lóquere fíliis Israel, et dices ad eos: Quando ingréssi fuéritis terram quam ego dabo vobis, sabbatízes sábbatum Dómino.'
  "3": 'Sex annis seres agrum tuum, et sex annis putábis víneam tuam, colligésque fructus eius:'
  "4": 'séptimo autem anno sábbatum erit terræ, requietiónis Dómini: agrum non seres, et víneam non putábis.'
  "5": 'Quæ sponte gignet humus, non metes: et uvas primitiárum tuárum non cólliges quasi vindémiam: annus enim requietiónis terræ est:'
  "6": 'sed erunt vobis in cibum, tibi et servo tuo, ancíllæ et mercenário tuo, et ádvenæ qui peregrinántur apud te:'
  "7": iuméntis tuis et pecóribus, ómnia quæ nascúntur præbébunt cibum.
  "8": 'Numerábis quoque tibi septem hebdómadas annórum, id est, sépties septem, quæ simul fáciunt annos quadragínta novem:'
  "9": et clanges búccina mense séptimo, décima die mensis, propitiatiónis témpore, in univérsa terra vestra.
  "10": 'Sanctificabísque annum quinquagésimum, et vocábis remissiónem cunctis habitatóribus terræ tuæ: ipse est enim iubilǽus. Revertétur homo ad possessiónem suam, et unusquísque rédiet ad famíliam prístinam:'
  "11": quia iubilǽus est, et quinquagésimus annus. Non serétis neque metétis sponte in agro nascéntia, et primítias vindémiæ non colligétis,
  "12": ob sanctificatiónem iubilǽi, sed statim obláta comedétis.
  "13": Anno iubilǽi, rédient omnes ad possessiónes suas.
  "14": Quando vendes quíppiam civi tuo, vel emes ab eo, ne contrístes fratrem tuum, sed iuxta númerum annórum iubilǽi emes ab eo,
  "15": et iuxta supputatiónem frugum vendet tibi.
  "16": 'Quanto plures anni remánserint post iubilǽum, tanto crescet et prétium: et quanto minus témporis numeráveris, tanto minóris et émptio constábit: tempus enim frugum vendet tibi.'
  "17": Nolíte afflígere contribúles vestros, sed tímeat unusquísque Deum suum, quia ego Dóminus Deus vester.
  "18": 'Fácite præcépta mea, et iudícia custodíte, et impléte ea: ut habitáre possítis in terra absque ullo pavóre,'
  "19": et gignat vobis humus fructus suos, quibus vescámini usque ad saturitátem, nullíus ímpetum formidántes.
  "20": 'Quod si dixéritis: Quid comedémus anno séptimo, si non sevérimus, neque collegérimus fruges nostras?'
  "21": 'Dabo benedictiónem meam vobis anno sexto, et fáciet fructus trium annórum:'
  "22": 'seretísque anno octávo, et comedétis véteres fruges usque ad nonum annum: donec nova nascántur, edétis vétera.'
  "23": 'Terra quoque non vendétur in perpétuum, quia mea est, et vos ádvenæ et colóni mei estis:'
  "24": unde cuncta régio possessiónis vestræ sub redemptiónis conditióne vendétur.
  "25": Si attenuátus frater tuus vendíderit possessiúnculam suam, et volúerit propínquus eius, potest redímere quod ille vendíderat.
  "26": Sin autem non habúerit próximum, et ipse prétium ad rediméndum potúerit inveníre,
  "27": 'computabúntur fructus ex eo témpore quo véndidit: et quod réliquum est, reddet emptóri, sicque recípiet possessiónem suam.'
  "28": Quod si non invénerit manus eius ut reddat prétium, habébit emptor quod émerat, usque ad annum iubilǽum. In ipso enim omnis vendítio redíbit ad dóminum et ad possessórem prístinum.
  "29": Qui vendíderit domum intra urbis muros, habébit licéntiam rediméndi, donec unus impleátur annus.
  "30": Si non redémerit, et anni círculus fúerit evolútus, emptor possidébit eam, et pósteri eius in perpétuum, et rédimi non póterit, étiam in iubilǽo.
  "31": 'Sin autem in villa fúerit domus, quæ muros non habet, agrórum iure vendétur: si ante redémpta non fúerit, in iubilǽo revertétur ad dóminum.'
  "32": 'Ædes Levitárum, quæ in úrbibus sunt, semper possunt rédimi:'
  "33": si redémptæ non fúerint, in iubilǽo reverténtur ad dóminos, quia domus úrbium Levitárum pro possessiónibus sunt inter fílios Israel.
  "34": Suburbána autem eórum non véneant, quia posséssio sempitérna est.
  "35": Si attenuátus fúerit frater tuus, et infírmus manu, et suscéperis eum quasi ádvenam et peregrínum, et víxerit tecum,
  "36": 'ne accípias usúras ab eo, nec ámplius quam dedísti: time Deum tuum, ut vívere possit frater tuus apud te.'
  "37": Pecúniam tuam non dabis ei ad usúram, et frugum superabundántiam non éxiges.
  "38": Ego Dóminus Deus vester, qui edúxi vos de terra Ægýpti, ut darem vobis terram Chánaan, et essem vester Deus.
  "39": Si paupertáte compúlsus vendíderit se tibi frater tuus, non eum ópprimes servitúte famulórum,
  "40": 'sed quasi mercenárius et colónus erit: usque ad annum iubilǽum operábitur apud te,'
  "41": et póstea egrediétur cum líberis suis, et revertétur ad cognatiónem et ad possessiónem patrum suórum.
  "42": 'Mei enim servi sunt, et ego edúxi eos de terra Ægýpti: non véneant conditióne servórum:'
  "43": ne afflígas eum per poténtiam, sed metúito Deum tuum.
  "44": Servus et ancílla sint vobis de natiónibus quæ in circúitu vestro sunt.
  "45": 'Et de ádvenis qui peregrinántur apud vos, vel qui ex his nati fúerint in terra vestra, hos habébitis fámulos:'
  "46": 'et hereditário iure transmittétis ad pósteros, ac possidébitis in ætérnum: fratres autem vestros fílios Israel ne opprimátis per poténtiam.'
  "47": 'Si invalúerit apud vos manus ádvenæ atque peregríni, et attenuátus frater tuus vendíderit se ei, aut cuíquam de stirpe eius:'
  "48": post venditiónem potest rédimi. Qui volúerit ex frátribus suis, rédimet eum,
  "49": et pátruus, et patruélis, et consanguíneus, et affínis. Sin autem et ipse potúerit, rédimet se,
  "50": 'supputátis dumtáxat annis a témpore venditiónis suæ usque ad annum iubilǽum: et pecúnia, qua vénditus fúerat, iuxta annórum númerum, et ratiónem mercenárii supputáta.'
  "51": 'Si plures fúerint anni qui rémanent usque ad iubilǽum, secúndum hos reddet et prétium:'
  "52": si pauci, ponet ratiónem cum eo iuxta annórum númerum, et reddet emptóri quod réliquum est annórum,
  "53": 'quibus ante servívit mercédibus imputátis: non afflíget eum violénter in conspéctu tuo.'
  "54": Quod si per hæc rédimi non potúerit, anno iubilǽo egrediétur cum líberis suis.
  "55": Mei enim sunt servi fílii Israel, quos edúxi de terra Ægýpti.
