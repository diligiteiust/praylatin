bible: vulgate
lang: la
language: Latina
book: Isaias
chapter: "44"
verses:
  "1": 'Et nunc audi Iacob serve meus, et Israel quem elégi:'
  "2": 'hæc dicit Dóminus fáciens et formans te, ab útero auxiliátor tuus: noli timére serve meus Iacob, et rectíssime, quem elégi.'
  "3": 'Effúndam enim aquas super sitiéntem, et fluénta super áridam: effúndam spíritum meum super semen tuum, et benedictiónem meam super stirpem tuam:'
  "4": et germinábunt inter herbas, quasi sálices iuxta præterfluéntes aquas.
  "5": 'Iste dicet: Dómini ego sum: et ille vocábit in nómine Iacob: et hic scribet manu sua: Dómino: et in nómine Israel assimilábitur.'
  "6": 'Hæc dicit Dóminus rex Israel, et redémptor eius Dóminus exercítuum: Ego primus, et ego novíssimus, et absque me non est Deus.'
  "7": 'Quis símilis mei? vocet, et annúntiet: et órdinem expónat mihi, ex quo constítui pópulum antíquum: ventúra et quæ futúra sunt annúntient eis.'
  "8": 'Nolíte timére, neque conturbémini: ex tunc audíre te feci, et annuntiávi: vos estis testes mei: numquid est Deus absque me, et formátor, quem ego non nóverim?'
  "9": Plastæ idóli omnes nihil sunt, et amantíssima eórum non próderunt eis. Ipsi sunt testes eórum, quia non vident, neque intélligunt, ut confundántur.
  "10": Quis formávit deum, et scúlptile conflávit ad nihil útile?
  "11": 'Ecce omnes partícipes eius confundéntur, fabri enim sunt ex homínibus: convénient omnes, stabunt et pavébunt, et confundéntur simul.'
  "12": 'Faber ferrárius lima operátus est, in prunis et in málleis formávit illud, et operátus est in bráchio fortitúdinis suæ: esúriet et defíciet, non bibet aquam et lasséscet.'
  "13": Artifex lignárius exténdit normam, formávit illud in runcína, fecit illud in anguláribus, et in círcino tornávit illud, et fecit imáginem viri quasi speciósum hóminem habitántem in domo.
  "14": 'Succídit cedros, tulit ílicem, et quercum, quæ stéterat inter ligna saltus: plantávit pinum, quam plúvia nutrívit.'
  "15": 'Et facta est homínibus in focum: sumpsit ex eis, et calefáctus est: et succéndit et coxit panes: de réliquo autem operátus est deum et adorávit: fecit scúlptile, et curvátus est ante illud.'
  "16": 'Médium eius combússit igni, et de médio eius carnes comédit: coxit pulméntum, et saturátus est, et calefáctus est, et dixit: Vah, calefáctus sum, vidi focum.'
  "17": 'Réliquum autem eius deum fecit et scúlptile sibi: curvátur ante illud, et adórat illud, et óbsecrat, dicens: Líbera me, quia deus meus es tu.'
  "18": 'Nesciérunt, neque intellexérunt: oblíti enim sunt ne vídeant óculi eórum, et ne intélligant corde suo.'
  "19": 'Non recógitant in mente sua, neque cognóscunt, neque séntiunt, ut dicant: Medietátem eius combússi igni, et coxi super carbónes eius panes: coxi carnes et comédi, et de réliquo eius idólum fáciam? ante truncum ligni prócidam?'
  "20": 'Pars eius cinis est: cor insípiens adorávit illud, et non liberábit ánimam suam, neque dicet: Forte mendácium est in déxtera mea.'
  "21": 'Meménto horum Iacob, et Israel, quóniam servus meus es tu: formávi te, servus meus es tu Israel, ne obliviscáris mei.'
  "22": 'Delévi ut nubem iniquitátes tuas, et quasi nébulam peccáta tua: revértere ad me, quóniam redémi te.'
  "23": 'Laudáte cæli, quóniam misericórdiam fecit Dóminus: iubiláte extréma terræ, resonáte montes laudatiónem, saltus et omne lignum eius: quóniam redémit Dóminus Iacob, et Israel gloriábitur.'
  "24": 'Hæc dicit Dóminus redémptor tuus, et formátor tuus ex útero: Ego sum Dóminus, fáciens ómnia, exténdens cælos solus, stabíliens terram, et nullus mecum.'
  "25": 'Irrita fáciens signa divinórum, et aríolos in furórem vertens: convértens sapiéntes retrórsum, et sciéntiam eórum stultam fáciens.'
  "26": 'Súscitans verbum servi sui, et consílium nuntiórum suórum complens. Qui dico Ierúsalem: Habitáberis: et civitátibus Iuda: Ædificabímini, et desérta eius suscitábo.'
  "27": 'Qui dico profúndo: Desoláre, et flúmina tua arefáciam.'
  "28": 'Qui dico Cyro: Pastor meus es, et omnem voluntátem meam complébis. Qui dico Ierúsalem: Ædificáberis: et templo: Fundáberis.'
