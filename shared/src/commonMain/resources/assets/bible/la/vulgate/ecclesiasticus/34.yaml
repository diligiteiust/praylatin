bible: vulgate
lang: la
language: Latina
book: Ecclesiasticus
chapter: "34"
verses:
  "1": 'Vana spes, et mendácium viro insensáto: et sómnia extóllunt imprudéntes.'
  "2": 'Quasi qui apprehéndit umbram, et perséquitur ventum: sic et qui atténdit ad visa mendácia.'
  "3": 'Hoc secúndum hoc vísio somniórum: ante fáciem hóminis similitúdo hóminis.'
  "4": Ab immúndo quid mundábitur? et a mendáce quid verum dicétur?
  "5": Divinátio erróris, et augúria mendácia, et sómnia malefaciéntium, vánitas est.
  "6": 'Et sicut parturiéntis, cor tuum phantásias pátitur: nisi ab Altíssimo fúerit emíssa visitátio, ne déderis in illis cor tuum:'
  "7": multos enim erráre fecérunt sómnia, et excidérunt sperántes in illis.
  "8": Sine mendácio consummábitur verbum legis, et sapiéntia in ore fidélis complanábitur.
  "9": 'Qui non est tentátus, quid scit? Vir in multis expértus, cogitábit multa: et qui multa dídicit, enarrábit intelléctum.'
  "10": 'Qui non est expértus, pauca recognóscit: qui autem in multis factus est, multíplicat malítiam.'
  "11": Qui tentátus non est, quália scit? qui implanátus est, abundábit nequítia.
  "12": Multa vidi errándo, et plúrimas verbórum consuetúdines.
  "13": Aliquóties usque ad mortem periclitátus sum horum causa, et liberátus sum grátia Dei.
  "14": Spíritus timéntium Deum quǽritur, et in respéctu illíus benedicétur.
  "15": Spes enim illórum in salvántem illos, et óculi Dei in diligéntes se.
  "16": 'Qui timet Dóminum nihil trepidábit, et non pavébit: quóniam ipse est spes eius.'
  "17": Timéntis Dóminum beáta est ánima eius.
  "18": Ad quem réspicit, et quis est fortitúdo eius?
  "19": 'Oculi Dómini super timéntes eum: protéctor poténtiæ, firmaméntum virtútis, tégimen ardóris, et umbráculum meridiáni,'
  "20": deprecátio offensiónis, et adiutórium casus, exáltans ánimam, et illúminans óculos, dans sanitátem, et vitam, et benedictiónem.
  "21": Immolántis ex iníquo oblátio est maculáta, et non sunt beneplácitæ subsannatiónes iniustórum.
  "22": Dóminus solus sustinéntibus se in via veritátis et iustítiæ.
  "23": 'Dona iniquórum non probat Altíssimus, nec réspicit in oblatiónes iniquórum: nec in multitúdine sacrificiórum eórum propitiábitur peccátis.'
  "24": Qui offert sacrifícium ex substántia páuperum, quasi qui víctimat fílium in conspéctu patris sui.
  "25": 'Panis egéntium vita páuperum est: qui defráudat illum, homo sánguinis est.'
  "26": Qui aufert in sudóre panem, quasi qui occídit próximum suum.
  "27": Qui effúndit sánguinem, et qui fraudem facit mercenário, fratres sunt.
  "28": 'Unus ædíficans, et unus déstruens: quid prodest illis, nisi labor?'
  "29": 'Unus orans, et unus maledícens: cuius vocem exáudiet Deus?'
  "30": Qui baptizátur a mórtuo, et íterum tangit eum, quid próficit lavátio illíus?
  "31": Sic homo qui ieiúnat in peccátis suis, et íterum éadem fáciens, quid próficit humiliándo se? oratiónem illíus quis exáudiet?
