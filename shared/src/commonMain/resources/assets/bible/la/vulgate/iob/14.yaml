bible: vulgate
lang: la
language: Latina
book: Iob
chapter: "14"
verses:
  "1": Homo natus de mulíere, brevi vivens témpore, replétur multis misériis.
  "2": Qui quasi flos egréditur et contéritur, et fugit velut umbra, et numquam in eódem statu pérmanet.
  "3": Et dignum ducis super huiuscémodi aperíre óculos tuos, et addúcere eum tecum in iudícium?
  "4": Quis potest fácere mundum de immúndo concéptum sémine? nonne tu qui solus es?
  "5": 'Breves dies hóminis sunt, númerus ménsium eius apud te est: constituísti términos eius, qui præteríri non póterunt.'
  "6": Recéde páululum ab eo, ut quiéscat, donec optáta véniat, sicut mercenárii dies eius.
  "7": 'Lignum habet spem: si præcísum fúerit, rursum viréscit, et rami eius púllulant.'
  "8": Si senúerit in terra radix eius, et in púlvere emórtuus fúerit truncus illíus,
  "9": ad odórem aquæ germinábit, et fáciet comam quasi cum primum plantátum est.
  "10": Homo vero cum mórtuus fúerit, et nudátus atque consúmptus, ubi quæso est?
  "11": 'Quómodo si recédant aquæ de mari, et flúvius vacuefáctus aréscat:'
  "12": 'sic homo, cum dormíerit, non resúrget: donec atterátur cælum, non evigilábit, nec consúrget de somno suo.'
  "13": Quis mihi hoc tríbuat, ut in inférno prótegas me, et abscóndas me donec pertránseat furor tuus, et constítuas mihi tempus, in quo recordéris mei?
  "14": Putásne mórtuus homo rursum vivat? cunctis diébus, quibus nunc mílito, exspécto donec véniat immutátio mea.
  "15": 'Vocábis me, et ego respondébo tibi: óperi mánuum tuárum porríges déxteram.'
  "16": Tu quidem gressus meos dinumerásti, sed parce peccátis meis.
  "17": Signásti quasi in sácculo delícta mea, sed curásti iniquitátem meam.
  "18": Mons cadens défluit, et saxum transfértur de loco suo.
  "19": 'Lápides éxcavant aquæ, et alluvióne paulátim terra consúmitur: et hóminem ergo simíliter perdes.'
  "20": 'Roborásti eum páululum ut in perpétuum transíret: immutábis fáciem eius, et emíttes eum.'
  "21": Sive nóbiles fúerint fílii eius, sive ignóbiles, non intélliget.
  "22": Attamen caro eius dum vivet dolébit, et ánima illíus super semetípso lugébit.
