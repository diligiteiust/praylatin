bible: vulgate
lang: la
language: Latina
book: Iob
chapter: "19"
verses:
  "1": 'Respóndens autem Iob, dixit:'
  "2": Usquequo afflígitis ánimam meam, et attéritis me sermónibus?
  "3": En, décies confúnditis me, et non erubéscitis oppriméntes me.
  "4": Nempe, etsi ignorávi, mecum erit ignorántia mea.
  "5": At vos contra me erigímini, et argúitis me oppróbriis meis.
  "6": Saltem nunc intellígite, quia Deus non æquo iudício afflíxerit me, et flagéllis suis me cínxerit.
  "7": 'Ecce clamábo vim pátiens, et nemo áudiet: vociferábor, et non est qui iúdicet.'
  "8": Sémitam meam circumsépsit, et transíre non possum, et in calle meo ténebras pósuit.
  "9": Spoliávit me glória mea, et ábstulit corónam de cápite meo.
  "10": Destrúxit me úndique, et péreo, et quasi evúlsæ árbori ábstulit spem meam.
  "11": Irátus est contra me furor eius, et sic me hábuit quasi hostem suum.
  "12": Simul venérunt latrónes eius, et fecérunt sibi viam per me, et obsedérunt in gyro tabernáculum meum.
  "13": Fratres meos longe fecit a me, et noti mei quasi aliéni recessérunt a me.
  "14": 'Dereliquérunt me propínqui mei: et qui me nóverant, oblíti sunt mei.'
  "15": Inquilíni domus meæ, et ancíllæ meæ sicut aliénum habuérunt me, et quasi peregrínus fui in óculis eórum.
  "16": Servum meum vocávi, et non respóndit, ore próprio deprecábar illum.
  "17": Hálitum meum exhórruit uxor mea, et orábam fílios úteri mei.
  "18": Stulti quoque despiciébant me, et cum ab eis recessíssem, detrahébant mihi.
  "19": 'Abomináti sunt me quondam consiliárii mei: et quem máxime diligébam, aversátus est me.'
  "20": Pelli meæ, consúmptis cárnibus, adhǽsit os meum, et derelícta sunt tantúmmodo lábia circa dentes meos.
  "21": Miserémini mei, miserémini mei, saltem vos amíci mei, quia manus Dómini tétigit me.
  "22": Quare persequímini me sicut Deus, et cárnibus meis saturámini?
  "23": Quis mihi tríbuat ut scribántur sermónes mei? quis mihi det ut exaréntur in libro
  "24": stylo férreo, et plumbi lámina, vel celte sculpántur in sílice?
  "25": 'Scio enim quod redémptor meus vivit, et in novíssimo die de terra surrectúrus sum:'
  "26": et rursum circúmdabor pelle mea, et in carne mea vidébo Deum meum.
  "27": 'Quem visúrus sum ego ipse, et óculi mei conspectúri sunt, et non álius: repósita est hæc spes mea in sinu meo.'
  "28": 'Quare ergo nunc dícitis: Persequámur eum, et radícem verbi inveniámus contra eum?'
  "29": 'Fúgite ergo a fácie gládii, quóniam ultor iniquitátum gládius est: et scitóte esse iudícium.'
