bible: vulgate
lang: la
language: Latina
book: I Regum
chapter: "18"
verses:
  "1": 'Post dies multos factum est verbum Dómini ad Elíam, in anno tértio, dicens: Vade, et osténde te Achab, ut dem plúviam super fáciem terræ.'
  "2": 'Ivit ergo Elías, ut osténderet se Achab: erat autem fames véhemens in Samaría.'
  "3": 'Vocavítque Achab Abdíam dispensatórem domus suæ: Abdías autem timébat Dóminum valde.'
  "4": Nam cum interfíceret Iézabel prophétas Dómini, tulit ille centum prophétas, et abscóndit eos quinquagénos et quinquagénos in spelúncis, et pavit eos pane et aqua.
  "5": 'Dixit ergo Achab ad Abdíam: Vade in terram ad univérsos fontes aquárum, et in cunctas valles, si forte possímus inveníre herbam, et salváre equos et mulos, et non pénitus iuménta intéreant.'
  "6": 'Diviserúntque sibi regiónes, ut circuírent eas: Achab ibat per viam unam, et Abdías per viam álteram seórsum.'
  "7": 'Cumque esset Abdías in via, Elías occúrrit ei: qui cum cognovísset eum, cécidit super fáciem suam, et ait: Num tu es, dómine mi, Elías?'
  "8": 'Cui ille respóndit: Ego. Vade, et dic dómino tuo: Adest Elías.'
  "9": 'Et ille: Quid peccávi, inquit, quóniam tradis me servum tuum in manu Achab, ut interfíciat me?'
  "10": 'Vivit Dóminus Deus tuus, quia non est gens aut regnum quo non míserit dóminus meus te requírens: et respondéntibus cunctis: Non est hic: adiurávit regna síngula et gentes, eo quod mínime reperiréris.'
  "11": 'Et nunc tu dicis mihi: Vade, et dic dómino tuo: Adest Elías.'
  "12": 'Cumque recéssero a te, Spíritus Dómini asportábit te in locum, quem ego ignóro: et ingréssus nuntiábo Achab, et non invéniens te, interfíciet me: servus autem tuus timet Dóminum ab infántia sua.'
  "13": Numquid non indicátum est tibi dómino meo, quid fécerim cum interfíceret Iézabel prophétas Dómini, quod abscónderim de prophétis Dómini centum viros, quinquagénos et quinquagénos in spelúncis, et páverim eos pane et aqua?
  "14": 'Et nunc tu dicis: Vade, et dic dómino tuo: Adest Elías: ut interfíciat me?'
  "15": 'Et dixit Elías: Vivit Dóminus exercítuum, ante cuius vultum sto, quia hódie apparébo ei.'
  "16": 'Abiit ergo Abdías in occúrsum Achab, et indicávit ei: venítque Achab in occúrsum Elíæ.'
  "17": 'Et cum vidísset eum, ait: Tune es ille, qui contúrbas Israel?'
  "18": 'Et ille ait: Non ego turbávi Israel, sed tu, et domus patris tui, qui dereliquístis mandáta Dómini, et secúti estis Báalim.'
  "19": Verúmtamen nunc mitte, et cóngrega ad me univérsum Israel in monte Carméli, et prophétas Baal quadringéntos quinquagínta, prophetásque lucórum quadringéntos, qui cómedunt de mensa Iézabel.
  "20": Misit Achab ad omnes fílios Israel, et congregávit prophétas in monte Carméli.
  "21": 'Accédens autem Elías ad omnem pópulum, ait: Usquequo claudicátis in duas partes? si Dóminus est Deus, sequímini eum: si autem Baal, sequímini illum. Et non respóndit ei pópulus verbum.'
  "22": 'Et ait rursus Elías ad pópulum: Ego remánsi prophéta Dómini solus: prophétæ autem Baal quadringénti et quinquagínta viri sunt.'
  "23": 'Dentur nobis duo boves, et illi éligant sibi bovem unum, et in frusta cædéntes ponant super ligna, ignem autem non suppónant: et ego fáciam bovem álterum, et impónam super ligna, ignem autem non suppónam.'
  "24": 'Invocáte nómina deórum vestrórum, et ego invocábo nomen Dómini mei: et Deus qui exaudíerit per ignem, ipse sit Deus. Respóndens omnis pópulus ait: Optima proposítio.'
  "25": 'Dixit ergo Elías prophétis Baal: Elígite vobis bovem unum, et fácite primi, quia vos plures estis: et invocáte nómina deórum vestrórum, ignémque non supponátis.'
  "26": 'Qui cum tulíssent bovem, quem déderat eis, fecérunt: et invocábant nomen Baal de mane usque ad merídiem, dicéntes: Baal exáudi nos. Et non erat vox, nec qui respondéret: transiliebántque altáre quod fécerant.'
  "27": 'Cumque esset iam merídies, illudébat illis Elías, dicens: Clamáte voce maióre: deus enim est, et fórsitan lóquitur, aut in diversório est, aut in itínere, aut certe dormit, ut excitétur.'
  "28": Clamábant ergo voce magna, et incidébant se iuxta ritum suum cultris et lancéolis, donec perfunderéntur sánguine.
  "29": 'Postquam autem tránsiit merídies, et illis prophetántibus vénerat tempus, quo sacrifícium offérri solet, nec audiebátur vox, nec áliquis respondébat, nec attendébat orántes:'
  "30": 'dixit Elías omni pópulo: Veníte ad me. Et accedénte ad se pópulo, curávit altáre Dómini, quod destrúctum fúerat.'
  "31": 'Et tulit duódecim lápides iuxta númerum tríbuum filiórum Iacob, ad quem factus est sermo Dómini, dicens: Israel erit nomen tuum.'
  "32": 'Et ædificávit de lapídibus altáre in nómine Dómini: fecítque aquædúctum, quasi per duas aratiúnculas in circúitu altáris,'
  "33": 'et compósuit ligna: divisítque per membra bovem, et pósuit super ligna,'
  "34": 'et ait: Impléte quátuor hýdrias aqua, et fúndite super holocáustum, et super ligna. Rursúmque dixit: Etiam secúndo hoc fácite. Qui cum fecíssent secúndo, ait: Etiam tértio idípsum fácite. Fecerúntque tértio,'
  "35": et currébant aquæ circum altáre, et fossa aquædúctus repléta est.
  "36": 'Cumque iam tempus esset ut offerrétur holocáustum, accédens Elías prophéta ait: Dómine Deus Abraham, et Isaac, et Israel, osténde hódie quia tu es Deus Israel, et ego servus tuus, et iuxta præcéptum tuum feci ómnia verba hæc.'
  "37": 'Exáudi me Dómine, exáudi me: ut discat pópulus iste, quia tu es Dóminus Deus, et tu convertísti cor eórum íterum.'
  "38": Cécidit autem ignis Dómini, et vorávit holocáustum, et ligna, et lápides, púlverem quoque, et aquam, quæ erat in aquædúctu lambens.
  "39": 'Quod cum vidísset omnis pópulus, cécidit in fáciem suam, et ait: Dóminus ipse est Deus, Dóminus ipse est Deus.'
  "40": 'Dixítque Elías ad eos: Apprehéndite prophétas Baal, et ne unus quidem effúgiat ex eis. Quos cum apprehendíssent, duxit eos Elías ad torréntem Cison, et interfécit eos ibi.'
  "41": 'Et ait Elías ad Achab: Ascénde, cómede, et bibe:: quia sonus multæ plúviæ est.'
  "42": 'Ascéndit Achab ut coméderet et bíberet: Elías autem ascéndit in vérticem Carméli, et pronus in terram pósuit fáciem suam inter génua sua,'
  "43": 'et dixit ad púerum suum: Ascénde, et próspice contra mare. Qui cum ascendísset, et contemplátus esset, ait: Non est quidquam. Et rursum ait illi: Revértere septem vícibus.'
  "44": 'In séptima autem vice, ecce nubécula parva quasi vestígium hóminis ascendébat de mari. Qui ait: Ascénde, et dic Achab: Iunge currum tuum et descénde, ne óccupet te plúvia.'
  "45": 'Cumque se vérteret huc atque illuc, ecce cæli contenebráti sunt, et nubes, et ventus, et facta est plúvia grandis. Ascéndens ítaque Achab, ábiit in Iézrahel:'
  "46": et manus Dómini facta est super Elíam, accinctísque lumbis currébat ante Achab, donec veníret in Iézrahel.
