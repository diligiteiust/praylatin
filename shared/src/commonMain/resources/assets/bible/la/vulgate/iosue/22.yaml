bible: vulgate
lang: la
language: Latina
book: Iosue
chapter: "22"
verses:
  "1": Eódem témpore vocávit Iósue Rubenítas, et Gadítas, et dimídiam tribum Manásse,
  "2": 'dixítque ad eos: Fecístis ómnia quæ præcépit vobis Móyses fámulus Dómini: mihi quoque in ómnibus obedístis,'
  "3": nec reliquístis fratres vestros longo témpore, usque in præséntem diem, custodiéntes impérium Dómini Dei vestri.
  "4": 'Quia ígitur dedit Dóminus Deus vester frátribus vestris quiétem et pacem, sicut pollícitus est: revertímini, et ite in tabernácula vestra, et in terram possessiónis, quam trádidit vobis Móyses fámulus Dómini trans Iordánem:'
  "5": ita dumtáxat ut custodiátis atténte, et ópere compleátis mandátum et legem quam præcépit vobis Móyses fámulus Dómini, ut diligátis Dóminum Deum vestrum, et ambulétis in ómnibus viis eius, et observétis mandáta illíus, adhæreatísque ei, ac serviátis in omni corde, et in omni ánima vestra.
  "6": Benedixítque eis Iósue, et dimísit eos. Qui revérsi sunt in tabernácula sua.
  "7": 'Dimídiæ autem tríbui Manásse possessiónem Móyses déderat in Basan: et idcírco médiæ, quæ supérfuit, dedit Iósue sortem inter céteros fratres suos trans Iordánem ad occidentálem plagam. Cumque dimítteret eos in tabernácula sua, et benedixísset eis,'
  "8": 'dixit ad eos: In multa substántia atque divítiis revertímini ad sedes vestras, cum argénto et auro, ære ac ferro, et veste multíplici: divídite prædam hóstium cum frátribus vestris.'
  "9": Reversíque sunt, et abiérunt fílii Ruben, et fílii Gad, et dimídia tribus Manásse, a fíliis Israel de Silo, quæ sita est in Chánaan, ut intrárent Gálaad terram possessiónis suæ, quam obtinúerant iuxta impérium Dómini in manu Móysi.
  "10": Cumque veníssent ad túmulos Iordánis in terram Chánaan, ædificavérunt iuxta Iordánem altáre infinítæ magnitúdinis.
  "11": 'Quod cum audíssent fílii Israel, et ad eos certi núntii detulíssent, ædificásse fílios Ruben, et Gad, et dimídiæ tribus Manásse, altáre in terra Chánaan, super Iordánis túmulos, contra fílios Israel:'
  "12": convenérunt omnes in Silo, ut ascénderent, et dimicárent contra eos.
  "13": Et ínterim misérunt ad illos in terram Gálaad Phínees fílium Eleázari sacerdótis,
  "14": et decem príncipes cum eo, síngulos de síngulis tríbubus.
  "15": 'Qui venérunt ad fílios Ruben, et Gad, et dimídiæ tribus Manásse in terram Gálaad, dixerúntque ad eos:'
  "16": 'Hæc mandat omnis pópulus Dómini: Quæ est ista transgréssio? cur reliquístis Dóminum Deum Israel, ædificántes altáre sacrílegum, et a cultu illíus recedéntes?'
  "17": An parum vobis est quod peccástis in Beélphegor, et usque in præséntem diem mácula huius scéleris in nobis pérmanet, multíque de pópulo corruérunt?
  "18": Et vos hódie reliquístis Dóminum, et cras in univérsum Israel ira eius desǽviet.
  "19": 'Quod si putátis immúndam esse terram possessiónis vestræ, transíte ad terram, in qua tabernáculum Dómini est, et habitáte inter nos: tantum ut a Dómino et a nostro consórtio non recedátis, ædificáto altári præter altáre Dómini Dei nostri.'
  "20": Nonne Achan fílius Zare prætériit mandátum Dómini, et super omnem pópulum Israel ira eius incúbuit? et ille erat unus homo, atque útinam solus periísset in scélere suo.
  "21": 'Responderúntque fílii Ruben, et Gad, et dimídia tribus Manásse, princípibus legatiónis Israel:'
  "22": 'Fortíssimus Deus Dóminus, fortíssimus Deus Dóminus, ipse novit, et Israel simul intélliget: si prævaricatiónis ánimo hoc altáre constrúximus, non custódiat nos, sed púniat nos in præsénti:'
  "23": 'et si ea mente fécimus ut holocáusta, et sacrifícium, et pacíficas víctimas super eo imponerémus, ipse quærat et iúdicet:'
  "24": 'et non ea magis cogitatióne atque tractátu, ut dicerémus: Cras dicent fílii vestri fíliis nostris: Quid vobis et Dómino Deo Israel?'
  "25": 'Términum pósuit Dóminus inter nos et vos, o fílii Ruben, et fílii Gad, Iordánem flúvium, et idcírco partem non habétis in Dómino: et per hanc occasiónem avértent fílii vestri fílios nostros a timóre Dómini. Putávimus ítaque mélius,'
  "26": 'et díximus: Exstruámus nobis altáre, non in holocáusta, neque ad víctimas offeréndas,'
  "27": 'sed in testimónium inter nos et vos, et sóbolem nostram vestrámque progéniem, ut serviámus Dómino, et iuris nostri sit offérre et holocáusta, et víctimas, et pacíficas hóstias: et nequáquam dicant cras fílii vestri fíliis nostris: Non est vobis pars in Dómino.'
  "28": 'Quod si volúerint dícere, respondébunt eis: Ecce altáre Dómini, quod fecérunt patres nostri, non in holocáusta, neque in sacrifícium, sed in testimónium nostrum ac vestrum.'
  "29": Absit a nobis hoc scelus, ut recedámus a Dómino, et eius vestígia relinquámus, exstrúcto altári ad holocáusta, et sacrifícia, et víctimas offeréndas, præter altáre Dómini Dei nostri, quod exstrúctum est ante tabernáculum eius.
  "30": 'Quibus audítis, Phínees sacérdos, et príncipes legatiónis Israel, qui erant cum eo, placáti sunt: et verba filiórum Ruben, et Gad, et dimídiæ tribus Manásse, libentíssime suscepérunt.'
  "31": 'Dixítque Phínees fílius Eleázari sacérdos ad eos: Nunc scimus quod nobíscum sit Dóminus, quóniam aliéni estis a prævaricatióne hac, et liberástis fílios Israel de manu Dómini.'
  "32": Reversúsque est cum princípibus a fíliis Ruben et Gad de terra Gálaad, fínium Chánaan, ad fílios Israel, et rétulit eis.
  "33": Placuítque sermo cunctis audiéntibus. Et laudavérunt Deum fílii Israel, et nequáquam ultra dixérunt, ut ascénderent contra eos, atque pugnárent, et delérent terram possessiónis eórum.
  "34": Vocaverúntque fílii Ruben, et fílii Gad, altáre quod exstrúxerant, Testimónium nostrum, quod Dóminus ipse sit Deus.
