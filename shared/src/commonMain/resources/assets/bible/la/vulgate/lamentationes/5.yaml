bible: vulgate
lang: la
language: Latina
book: Lamentationes
chapter: "5"
verses:
  "1": '[Orátio Jeremíæ prophétæ] Recordáre Dómine quid accíderit nobis: intuére et réspice oppróbrium nostrum.'
  "2": Heréditas nostra versa est ad aliénos, domus nostræ ad extráneos.
  "3": Pupílli facti sumus absque patre, matres nostræ quasi víduæ.
  "4": 'Aquam nostram pecúnia bíbimus: ligna nostra prétio comparávimus.'
  "5": Cervícibus nostris minabámur, lassis non dabátur réquies.
  "6": Ægýpto dédimus manum, et Assýriis ut saturarémur pane.
  "7": 'Patres nostri peccavérunt, et non sunt: et nos iniquitátes eórum portávimus.'
  "8": 'Servi domináti sunt nostri: non fuit qui redímeret de manu eórum.'
  "9": In animábus nostris afferebámus panem nobis, a fácie gládii in desérto.
  "10": Pellis nostra, quasi clíbanus exústa est a fácie tempestátum famis.
  "11": Mulíeres in Sion humiliavérunt, et vírgines in civitátibus Iuda.
  "12": 'Príncipes manu suspénsi sunt: fácies senum non erubuérunt.'
  "13": 'Adolescéntibus impudíce abúsi sunt: et púeri in ligno corruérunt.'
  "14": Senes defecérunt de portis, iúvenes de choro psalléntium.
  "15": 'Defécit gáudium cordis nostri: versus est in luctum chorus noster.'
  "16": 'Cécidit coróna cápitis nostri: væ nobis, quia peccávimus.'
  "17": Proptérea mœstum factum est cor nostrum, ídeo contenebráti sunt óculi nostri.
  "18": Propter montem Sion quia dispériit, vulpes ambulavérunt in eo.
  "19": Tu autem Dómine in ætérnum permanébis, sólium tuum in generatiónem et generatiónem.
  "20": Quare in perpétuum obliviscéris nostri, derelínques nos in longitúdine diérum?
  "21": 'Convérte nos Dómine ad te, et convertémur: ínnova dies nostros, sicut a princípio.'
  "22": Sed proíciens repulísti nos, irátus es contra nos veheménter.
