bible: vulgate
lang: la
language: Latina
book: Iob
chapter: "39"
verses:
  "1": Numquid nosti tempus partus íbicum in petris, vel parturiéntes cervas observásti?
  "2": Dinumerásti menses concéptus eárum, et scisti tempus partus eárum?
  "3": Incurvántur ad fœtum, et páriunt, et rugítus emíttunt.
  "4": 'Separántur fílii eárum, et pergunt ad pastum: egrediúntur, et non revertúntur ad eas.'
  "5": Quis dimísit ónagrum líberum, et víncula eius quis solvit?
  "6": Cui dedi in solitúdine domum, et tabernácula eius in terra salsúginis.
  "7": Contémnit multitúdinem civitátis, clamórem exactóris non audit.
  "8": Circúmspicit montes páscuæ suæ, et viréntia quæque perquírit.
  "9": Numquid volet rhinóceros servíre tibi, aut morábitur ad præsépe tuum?
  "10": Numquid alligábis rhinoceróta ad arándum loro tuo? aut confrínget glebas vállium post te?
  "11": Numquid fidúciam habébis in magna fortitúdine eius, et derelínques ei labóres tuos?
  "12": Numquid credes illi quod seméntem reddat tibi, et áream tuam cóngreget?
  "13": Penna struthiónis símilis est pennis heródii, et accípitris.
  "14": Quando derelínquit ova sua in terra, tu fórsitan in púlvere calefácies ea?
  "15": Oblivíscitur quod pes concúlcet ea, aut béstia agri cónterat.
  "16": Durátur ad fílios suos quasi non sint sui, frustra laborávit nullo timóre cogénte.
  "17": Privávit enim eam Deus sapiéntia, nec dedit illi intelligéntiam.
  "18": 'Cum tempus fúerit, in altum alas érigit: derídet equum et ascensórem eius.'
  "19": Numquid præbébis equo fortitúdinem, aut circúmdabis collo eius hinnítum?
  "20": Numquid suscitábis eum quasi locústas? glória nárium eius terror.
  "21": 'Terram úngula fodit, exsúltat audácter: in occúrsum pergit armátis.'
  "22": Contémnit pavórem, nec cedit gládio.
  "23": Super ipsum sonábit pháretra, vibrábit hasta et clýpeus.
  "24": Fervens et fremens sorbet terram, nec réputat tubæ sonáre clangórem.
  "25": 'Ubi audíerit búccinam, dicit: Vah, procul odorátur bellum, exhortatiónem ducum, et ululátum exércitus.'
  "26": Numquid per sapiéntiam tuam pluméscit accípiter, expándens alas suas ad austrum?
  "27": Numquid ad præcéptum tuum elevábitur áquila, et in árduis ponet nidum suum?
  "28": In petris manet, et in prærúptis silícibus commorátur, atque inaccéssis rúpibus.
  "29": Inde contemplátur escam, et de longe óculi eius prospíciunt.
  "30": 'Pulli eius lambent sánguinem: et ubicúmque cadáver fúerit, statim adest.'
  "31": 'Et adiécit Dóminus, et locútus est ad Iob:'
  "32": Numquid qui conténdit cum Deo, tam fácile conquiéscit? útique qui árguit Deum, debet respondére ei.
  "33": 'Respóndens autem Iob Dómino, dixit:'
  "34": Qui léviter locútus sum, respondére quid possum? manum meam ponam super os meum.
  "35": 'Unum locútus sum, quod útinam non dixíssem: et álterum, quibus ultra non addam.'
