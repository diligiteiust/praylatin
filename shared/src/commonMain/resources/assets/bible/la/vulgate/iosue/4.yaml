bible: vulgate
lang: la
language: Latina
book: Iosue
chapter: "4"
verses:
  "1": 'Quibus transgréssis, dixit Dóminus ad Iósue:'
  "2": 'Elige duódecim viros síngulos per síngulas tribus:'
  "3": et prǽcipe eis ut tollant de médio Iordánis álveo, ubi stetérunt pedes sacerdótum, duódecim duríssimos lápides, quos ponétis in loco castrórum, ubi fixéritis hac nocte tentória.
  "4": Vocavítque Iósue duódecim viros, quos elégerat de fíliis Israel, síngulos de síngulis tríbubus,
  "5": 'et ait ad eos: Ite ante arcam Dómini Dei vestri ad Iordánis médium, et portáte inde sínguli síngulos lápides in húmeris vestris, iuxta númerum filiórum Israel,'
  "6": 'ut sit signum inter vos: et quando interrogáverint vos fílii vestri cras, dicéntes: Quid sibi volunt isti lápides?'
  "7": 'respondébitis eis: Defecérunt aquæ Iordánis ante arcam fœ́deris Dómini, cum transíret eum: idcírco pósiti sunt lápides isti in monuméntum filiórum Israel usque in ætérnum.'
  "8": Fecérunt ergo fílii Israel sicut præcépit eis Iósue, portántes de médio Iordánis álveo duódecim lápides, ut Dóminus ei imperárat, iuxta númerum filiórum Israel, usque ad locum, in quo castrametáti sunt, ibíque posuérunt eos.
  "9": 'Alios quoque duódecim lápides pósuit Iósue in médio Iordánis álveo, ubi stetérunt sacerdótes, qui portábant arcam fœ́deris: et sunt ibi usque in præséntem diem.'
  "10": Sacerdótes autem, qui portábant arcam, stabant in Iordánis médio, donec ómnia compleréntur, quæ Iósue, ut loquerétur ad pópulum, præcéperat Dóminus, et díxerat ei Móyses. Festinavítque pópulus, et tránsiit.
  "11": Cumque transíssent omnes, transívit et arca Dómini, sacerdotésque pergébant ante pópulum.
  "12": 'Fílii quoque Ruben, et Gad, et dimídia tribus Manásse, armáti præcedébant fílios Israel, sicut eis præcéperat Móyses:'
  "13": et quadragínta pugnatórum míllia per turmas, et cúneos, incedébant per plana atque campéstria urbis Iéricho.
  "14": In die illo magnificávit Dóminus Iósue coram omni Israel, ut timérent eum, sicut timúerant Móysen, dum advíveret.
  "15": 'Dixítque ad eum:'
  "16": Prǽcipe sacerdótibus, qui portant arcam fœ́deris, ut ascéndant de Iordáne.
  "17": 'Qui præcépit eis, dicens: Ascéndite de Iordáne.'
  "18": Cumque ascendíssent portántes arcam fœ́deris Dómini, et siccam humum calcáre cœpíssent, revérsæ sunt aquæ in álveum suum, et fluébant sicut ante consuéverant.
  "19": Pópulus autem ascéndit de Iordáne décimo die mensis primi, et castrametáti sunt in Gálgalis contra orientálem plagam urbis Iéricho.
  "20": Duódecim quoque lápides, quos de Iordánis álveo súmpserant, pósuit Iósue in Gálgalis,
  "21": 'et dixit ad fílios Israel: Quando interrogáverint fílii vestri cras patres suos, et díxerint eis: Quid sibi volunt lápides isti?'
  "22": 'docébitis eos, atque dicétis: Per aréntem álveum transívit Israel Iordánem istum,'
  "23": siccánte Dómino Deo vestro aquas eius in conspéctu vestro, donec transirétis,
  "24": 'sicut fécerat prius in mari Rubro, quod siccávit donec transirémus:'
  "25": ut discant omnes terrárum pópuli fortíssimam Dómini manum, ut et vos timeátis Dóminum Deum vestrum omni témpore.
