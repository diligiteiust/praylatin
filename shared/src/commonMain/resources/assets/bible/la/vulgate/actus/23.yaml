bible: vulgate
lang: la
language: Latina
book: Actus Apostolorum
chapter: "23"
verses:
  "1": 'Inténdens autem in concílium Paulus, ait: Viri fratres, ego omni consciéntia bona conversátus sum ante Deum usque in hodiérnum diem.'
  "2": Princeps autem sacerdótum Ananías præcépit astántibus sibi percútere os eius.
  "3": 'Tunc Paulus dixit ad eum: Percútiet te Deus, páries dealbáte. Et tu sedens iúdicas me secúndum legem, et contra legem iubes me pércuti?'
  "4": 'Et qui astábant dixérunt: Summum sacerdótem Dei maledícis?'
  "5": 'Dixit autem Paulus: Nesciébam fratres quia princeps est sacerdótum. Scriptum est enim: Príncipem pópuli tui non maledíces.'
  "6": 'Sciens autem Paulus quia una pars esset Sadducæórum, et áltera Pharisæórum, exclamávit in concílio: Viri fratres, ego Pharisǽus sum, fílius Pharisæórum, de spe et resurrectióne mortuórum ego iúdicor.'
  "7": Et cum hæc dixísset, facta est dissénsio inter Pharisǽos, et Sadducǽos, et solúta est multitúdo.
  "8": 'Sadducǽi enim dicunt non esse resurrectiónem, neque ángelum, neque spíritum: Pharisǽi autem útraque confiténtur.'
  "9": 'Factus est autem clamor magnus. Et surgéntes quidam Pharisæórum, pugnábant, dicéntes: Nihil mali invenímus in hómine isto: quid si spíritus locútus est ei, aut ángelus?'
  "10": Et cum magna dissénsio facta esset, timens tribúnus ne discerperétur Paulus ab ipsis, iussit mílites descéndere, et rápere eum de médio eórum, ac dedúcere eum in castra.
  "11": 'Sequénti autem nocte assístens ei Dóminus, ait: Constans esto: sicut enim testificátus es de me in Ierúsalem, sic te opórtet et Romæ testificári.'
  "12": Facta autem die collegérunt se quidam ex Iudǽis, et devovérunt se dicéntes, neque manducatúros, neque bibitúros donec occíderent Paulum.
  "13": 'Erant autem plus quam quadragínta viri, qui hanc coniuratiónem fécerant:'
  "14": 'qui accessérunt ad príncipes sacerdótum, et senióres, et dixérunt: Devotióne devóvimus nos nihil gustatúros, donec occidámus Paulum.'
  "15": Nunc ergo vos notum fácite tribúno cum concílio, ut prodúcat illum ad vos, tamquam áliquid cértius cognitúri de eo. Nos vero priúsquam apprópiet, paráti sumus interfícere illum.
  "16": Quod cum audísset fílius soróris Pauli insídias, venit, et intrávit in castra, nuntiavítque Paulo.
  "17": 'Vocans autem Paulus ad se unum ex centuriónibus, ait: Adolescéntem hunc perduc ad tribúnum, habet enim áliquid indicáre illi.'
  "18": 'Et ille quidem assúmens eum duxit ad tribúnum, et ait: Vinctus Paulus rogávit me hunc adolescéntem perdúcere ad te, habéntem áliquid loqui tibi.'
  "19": 'Apprehéndens autem tribúnus manum illíus, secéssit cum eo seórsum, et interrogávit illum: Quid est, quod habes indicáre mihi?'
  "20": 'Ille autem dixit: Iudǽis convénit rogáre te, ut crástina die prodúcas Paulum in concílium, quasi áliquid cértius inquisitúri sint de illo:'
  "21": 'tu vero ne credíderis illis: insidiántur enim ei ex eis viri ámplius quam quadragínta, qui se devovérunt non manducáre, neque bíbere donec interfíciant eum: et nunc paráti sunt, exspectántes promíssum tuum.'
  "22": Tribúnus ígitur dimísit adolescéntem, præcípiens ne cui loquerétur quóniam hæc nota sibi fecísset.
  "23": 'Et vocátis duóbus centuriónibus, dixit illis: Paráte mílites ducéntos ut eant usque Cæsaréam, et équites septuagínta, et lanceários ducéntos a tértia hora noctis:'
  "24": et iuménta præparáte ut imponéntes Paulum, salvum perdúcerent ad Felícem prǽsidem.
  "25": (Tímuit enim ne forte ráperent eum Iudǽi, et occíderent, et ipse póstea calúmniam sustinéret, tamquam acceptúrus pecúniam.)
  "26": 'Scribens epístolam continéntem hæc: Cláudius Lýsias óptimo prǽsidi Felíci, salútem.'
  "27": Virum hunc comprehénsum a Iudǽis, et incipiéntem intérfici ab eis, supervéniens cum exércitu erípui, cógnito quia Románus est.
  "28": Volénsque scire causam, quam obiciébant illi, dedúxi eum in concílium eórum.
  "29": Quem invéni accusári de quæstiónibus legis ipsórum, nihil vero dignum morte aut vínculis habéntem críminis.
  "30": Et cum mihi perlátum esset de insídiis, quas paráverant illi, misi eum ad te, denúntians et accusatóribus ut dicant apud te. Vale.
  "31": Mílites ergo secúndum præcéptum sibi assuméntes Paulum, duxérunt per noctem in Antipátridem.
  "32": Et póstera die dimíssis equítibus ut cum eo irent, revérsi sunt ad castra.
  "33": Qui cum veníssent Cæsaréam, et tradidíssent epístolam prǽsidi, statuérunt ante illum et Paulum.
  "34": 'Cum legísset autem, et interrogásset de qua província esset, et cognóscens quia de Cilícia:'
  "35": Audiam te, inquit, cum accusatóres tui vénerint. Iussítque in prætório Heródis custodíri eum.
