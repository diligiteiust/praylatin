bible: vulgate
lang: la
language: Latina
book: Apocalypsis
chapter: "16"
verses:
  "1": 'Et audívi vocem magnam de templo, dicéntem septem ángelis: Ite, et effúndite septem phíalas iræ Dei in terram.'
  "2": Et ábiit primus, et effúdit phíalam suam in terram, et factum est vulnus sævum et péssimum in hómines, qui habébant charactérem béstiæ, et in eos, qui adoravérunt imáginem eius.
  "3": 'Et secúndus ángelus effúdit phíalam suam in mare, et factus est sanguis tamquam mórtui: et omnis ánima vivens mórtua est in mari.'
  "4": Et tértius effúdit phíalam suam super flúmina, et super fontes aquárum, et factus est sanguis.
  "5": 'Et audívi ángelum aquárum dicéntem: Iustus es Dómine, qui es, et qui eras sanctus, qui hæc iudicásti:'
  "6": 'quia sánguinem sanctórum, et prophetárum effudérunt, et sánguinem eis dedísti bíbere: digni enim sunt.'
  "7": 'Et audívi álterum ab altári dicéntem: Etiam Dómine Deus omnípotens, vera et iusta iudícia tua.'
  "8": 'Et quartus ángelus effúdit phíalam suam in solem, et datum est illi æstu afflígere hómines, et igni:'
  "9": et æstuavérunt hómines æstu magno, et blasphemavérunt nomen Dei habéntis potestátem super has plagas, neque egérunt pœniténtiam ut darent illi glóriam.
  "10": 'Et quintus ángelus effúdit phíalam suam super sedem béstiæ: et factum est regnum eius tenebrósum, et commanducavérunt linguas suas præ dolóre:'
  "11": et blasphemavérunt Deum cæli præ dolóribus, et vulnéribus suis, et non egérunt pœniténtiam ex opéribus suis.
  "12": 'Et sextus ángelus effúdit phíalam suam in flumen illud magnum Euphráten: et siccávit aquam eius, ut præpararétur via régibus ab ortu solis.'
  "13": Et vidi de ore dracónis, et de ore béstiæ, et de ore pseudoprophétæ spíritus tres immúndos in modum ranárum.
  "14": Sunt enim spíritus dæmoniórum faciéntes signa, et procédunt ad reges totíus terræ congregáre illos in prœ́lium ad diem magnum omnipoténtis Dei.
  "15": Ecce vénio sicut fur. Beátus qui vígilat, et custódit vestiménta sua, ne nudus ámbulet, et vídeant turpitúdinem eius.
  "16": Et congregábit illos in locum, qui vocátur hebráice Armagédon.
  "17": 'Et séptimus ángelus effúdit phíalam suam in áerem, et exívit vox magna de templo a throno, dicens: Factum est.'
  "18": 'Et facta sunt fúlgura, et voces, et tonítrua, et terræmótus factus est magnus, qualis numquam fuit ex quo hómines fuérunt super terram: talis terræmótus, sic magnus.'
  "19": 'Et facta est cívitas magna in tres partes: et civitátes géntium cecidérunt. Et Bábylon magna venit in memóriam ante Deum, dare illi cálicem vini indignatiónis iræ eius.'
  "20": Et omnis ínsula fugit, et montes non sunt invénti.
  "21": 'Et grando magna sicut taléntum descéndit de cælo in hómines: et blasphemavérunt Deum hómines propter plagam grándinis: quóniam magna facta est veheménter.'
