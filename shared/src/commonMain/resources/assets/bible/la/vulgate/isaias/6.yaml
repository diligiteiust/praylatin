bible: vulgate
lang: la
language: Latina
book: Isaias
chapter: "6"
verses:
  "1": 'In anno quo mórtuus est rex Ozías, vidi Dóminum sedéntem super sólium excélsum et elevátum: et ea, quæ sub ipso erant, replébant templum.'
  "2": 'Séraphim stabant super illud: sex alæ uni, et sex alæ álteri: duábus velábant fáciem eius, et duábus velábant pedes eius, et duábus volábant.'
  "3": 'Et clamábant alter ad álterum, et dicébant: Sanctus, sanctus, sanctus, Dóminus Deus exercítuum, plena est omnis terra glória eius.'
  "4": Et commóta sunt superliminária cárdinum a voce clamántis, et domus repléta est fumo.
  "5": 'Et dixi: Væ mihi, quia tácui, quia vir pollútus lábiis ego sum, et in médio pópuli pollúta lábia habéntis ego hábito, et regem Dóminum exercítuum vidi óculis meis.'
  "6": Et volávit ad me unus de Séraphim, et in manu eius cálculus, quem fórcipe túlerat de altári.
  "7": 'Et tétigit os meum, et dixit: Ecce tétigit hoc lábia tua, et auferétur iníquitas tua, et peccátum tuum mundábitur.'
  "8": 'Et audívi vocem Dómini dicéntis: Quem mittam? et quis ibit nobis? Et dixi: Ecce ego, mitte me.'
  "9": 'Et dixit: Vade, et dices pópulo huic: Audíte audiéntes, et nolíte intellígere: et vidéte visiónem, et nolíte cognóscere.'
  "10": 'Excǽca cor pópuli huius, et aures eius ággrava: et óculos eius claude: ne forte vídeat óculis suis, et áuribus suis áudiat, et corde suo intélligat, et convertátur, et sanem eum.'
  "11": 'Et dixi: Usquequo Dómine? et dixit: Donec desoléntur civitátes absque habitatóre, et domus sine hómine, et terra relinquétur desérta.'
  "12": Et longe fáciet Dóminus hómines, et multiplicábitur quæ derelícta fúerat in médio terræ.
  "13": 'Et adhuc in ea decimátio, et convertétur, et erit in ostensiónem sicut terebínthus, et sicut quercus, quæ expándit ramos suos: semen sanctum erit id, quod stéterit in ea.'
