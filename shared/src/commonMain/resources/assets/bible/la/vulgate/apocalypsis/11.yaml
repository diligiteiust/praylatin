bible: vulgate
lang: la
language: Latina
book: Apocalypsis
chapter: "11"
verses:
  "1": 'Et datus est mihi cálamus símilis virgæ, et dictum est mihi: Surge, et metíre templum Dei, et altáre, et adorántes in eo:'
  "2": 'átrium autem, quod est foris templum, éice foras, et ne metiáris illud: quóniam datum est géntibus, et civitátem sanctam calcábunt ménsibus quadragínta duóbus:'
  "3": et dabo duóbus téstibus meis, et prophetábunt diébus mille ducéntis sexagínta, amícti saccis.
  "4": Hi sunt duæ olívæ, et duo candelábra in conspéctu Dómini terræ stantes.
  "5": 'Et si quis volúerit eos nocére, ignis éxiet de ore eórum, et devorábit inimícos eórum: et si quis volúerit eos lǽdere, sic opórtet eum occídi.'
  "6": 'Hi habent potestátem claudéndi cælum, ne pluat diébus prophetíæ ipsórum: et potestátem habent super aquas converténdi eas in sánguinem, et percútere terram omni plaga quotiescúmque volúerint.'
  "7": Et cum finíerint testimónium suum, béstia, quæ ascéndit de abýsso, fáciet advérsum eos bellum, et vincet illos, et occídet eos.
  "8": Et córpora eórum iacébunt in platéis civitátis magnæ, quæ vocátur spirituáliter Sódoma, et Ægýptus, ubi et Dóminus eórum crucifíxus est.
  "9": 'Et vidébunt de tríbubus, et pópulis, et linguis, et géntibus córpora eórum per tres dies, et dimídium: et córpora eórum non sinent poni in monuméntis:'
  "10": 'et inhabitántes terram gaudébunt super illos, et iucundabúntur: et múnera mittent ínvicem, quóniam hi duo prophétæ cruciavérunt eos, qui habitábant super terram.'
  "11": Et post dies tres, et dimídium, spíritus vitæ a Deo intrávit in eos. Et stetérunt super pedes suos, et timor magnus cécidit super eos, qui vidérunt eos.
  "12": 'Et audiérunt vocem magnam de cælo, dicéntem eis: Ascéndite huc. Et ascendérunt in cælum in nube: et vidérunt illos inimíci eórum.'
  "13": 'Et in illa hora factus est terræmótus magnus, et décima pars civitátis cécidit: et occísa sunt in terræmótu nómina hóminum septem míllia: et réliqui in timórem sunt missi, et dedérunt glóriam Deo cæli.'
  "14": 'Væ secúndum ábiit: et ecce væ tértium véniet cito.'
  "15": 'Et séptimus ángelus tuba cécinit: et factæ sunt voces magnæ in cælo dicéntes: Factum est regnum huius mundi, Dómini nostri et Christi eius, et regnábit in sǽcula sæculórum. Amen.'
  "16": 'Et vigínti quátuor senióres, qui in conspéctu Dei sedent in sédibus suis, cecidérunt in fácies suas, et adoravérunt Deum, dicéntes:'
  "17": 'Grátias ágimus tibi, Dómine Deus omnípotens, qui es, et qui eras, et qui ventúrus es: quia accepísti virtútem tuam magnam, et regnásti.'
  "18": Et irátæ sunt gentes, et advénit ira tua, et tempus mortuórum iudicári, et réddere mercédem servis tuis prophétis, et sanctis, et timéntibus nomen tuum pusíllis, et magnis, et exterminándi eos, qui corrupérunt terram.
  "19": 'Et apértum est templum Dei in cælo: et visa est arca testaménti eius in templo eius, et facta sunt fúlgura, et voces, et terræmótus, et grando magna.'
