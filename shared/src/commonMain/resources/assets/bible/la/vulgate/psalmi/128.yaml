bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "128"
verses:
  "1": 'Cánticum gráduum. Sæpe expugnavérunt me a iuventúte mea, dicat nunc Israel:'
  "2": 'sæpe expugnavérunt me a iuventúte mea: étenim non potuérunt mihi.'
  "3": 'Supra dorsum meum fabricavérunt peccatóres: prolongavérunt iniquitátem suam.'
  "4": 'Dóminus iustus concídit cervíces peccatórum:'
  "5": confundántur et convertántur retrórsum omnes, qui odérunt Sion.
  "6": 'Fiant sicut fœnum tectórum: quod priúsquam evellátur, exáruit:'
  "7": de quo non implévit manum suam qui metit, et sinum suum qui manípulos cólligit.
  "8": 'Et non dixérunt qui præteríbant: Benedíctio Dómini super vos: benedíximus vobis in nómine Dómini.'
