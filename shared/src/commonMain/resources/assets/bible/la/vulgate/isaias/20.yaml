bible: vulgate
lang: la
language: Latina
book: Isaias
chapter: "20"
verses:
  "1": 'In anno, quo ingréssus est Tharthan in Azótum, cum misísset eum Sargon, rex Assyriórum, et pugnásset contra Azótum, et cepísset eam:'
  "2": 'in témpore illo locútus est Dóminus in manu Isaíæ, fílii Amos, dicens: Vade, et solve saccum de lumbis tuis, et calceaménta tua tolle de pédibus tuis. Et fecit sic, vadens nudus, et discalceátus.'
  "3": 'Et dixit Dóminus: Sicut ambulávit servus meus Isaías nudus, et discalceátus, trium annórum signum et porténtum erit super Ægýptum, et super Æthiópiam,'
  "4": sic minábit rex Assyriórum captivitátem Ægýpti, et transmigratiónem Æthiópiæ, iúvenum et senum, nudam et discalceátam, discoopértis nátibus, ad ignomíniam Ægýpti.
  "5": Et timébunt, et confundéntur ab Æthiópia spe sua, et ab Ægýpto glória sua.
  "6": 'Et dicet habitátor ínsulæ huius in die illa: Ecce hæc erat spes nostra, ad quos confúgimus in auxílium, ut liberárent nos a fácie regis Assyriórum: et quómodo effúgere potérimus nos?'
