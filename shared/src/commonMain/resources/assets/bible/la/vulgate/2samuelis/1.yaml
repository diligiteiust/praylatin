bible: vulgate
lang: la
language: Latina
book: II Samuelis
chapter: "1"
verses:
  "1": Factum est autem, postquam mórtuus est Saul, ut David reverterétur a cæde Amalec, et manéret in Síceleg duos dies.
  "2": 'In die autem tértia appáruit homo véniens de castris Saul veste conscíssa, et púlvere conspérsus caput: et ut venit ad David, cécidit super fáciem suam, et adorávit.'
  "3": 'Dixítque ad eum David: Unde venis? Qui ait ad eum: De castris Israel fugi.'
  "4": 'Et dixit ad eum David: Quod est verbum quod factum est? índica mihi. Qui ait: Fugit pópulus ex prœ́lio, et multi corruéntes e pópulo mórtui sunt: sed et Saul et Iónathas fílius eius interiérunt.'
  "5": 'Dixítque David ad adolescéntem, qui nuntiábat ei: Unde scis quia mórtuus est Saul, et Iónathas fílius eius?'
  "6": 'Et ait adoléscens, qui nuntiábat ei: Casu veni in montem Gélboe, et Saul incumbébat super hastam suam: porro currus et équites appropinquábant ei,'
  "7": 'et convérsus post tergum suum, vidénsque me vocávit. Cui cum respondíssem: Adsum:'
  "8": 'dixit mihi: Quisnam es tu? Et aio ad eum: Amalecítes ego sum.'
  "9": 'Et locútus est mihi: Sta super me, et intérfice me: quóniam tenent me angústiæ, et adhuc tota ánima mea in me est.'
  "10": 'Stansque super eum, occídi illum: sciébam enim quod vívere non póterat post ruínam: et tuli diadéma quod erat in cápite eius, et armíllam de bráchio illíus, et áttuli ad te dóminum meum huc.'
  "11": Apprehéndens autem David vestiménta sua scidit, omnésque viri, qui erant cum eo,
  "12": et planxérunt, et flevérunt, et ieiunavérunt usque ad vésperam super Saul, et super Iónathan fílium eius, et super pópulum Dómini, et super domum Israel, eo quod corruíssent gládio.
  "13": 'Dixítque David ad iúvenem qui nuntiáverat ei: Unde es tu? Qui respóndit: Fílius hóminis ádvenæ Amalecítæ ego sum.'
  "14": 'Et ait ad eum David: Quare non timuísti míttere manum tuam ut occíderes christum Dómini?'
  "15": 'Vocánsque David unum de púeris suis, ait: Accédens írrue in eum. Qui percússit illum, et mórtuus est.'
  "16": 'Et ait ad eum David: Sanguis tuus super caput tuum: os enim tuum locútum est advérsum te, dicens: Ego interféci christum Dómini.'
  "17": Planxit autem David planctum huiuscémodi super Saul, et super Iónathan fílium eius
  "18": '(et præcépit ut docérent fílios Iuda arcum, sicut scriptum est in Libro iustórum), et ait: Consídera Israel, pro his, qui mórtui sunt, super excélsa tua vulneráti.'
  "19": 'Inclyti Israel super montes tuos interfécti sunt: quómodo cecidérunt fortes?'
  "20": 'Nolíte annuntiáre in Geth, neque annuntiétis in cómpitis Ascalónis: ne forte læténtur fíliæ Philísthiim: ne exsúltent fíliæ incircumcisórum.'
  "21": 'Montes Gélboe, nec ros, nec plúvia véniant super vos, neque sint agri primitiárum: quia ibi abiéctus est clýpeus fórtium, clýpeus Saul, quasi non esset unctus óleo.'
  "22": A sánguine interfectórum, ab ádipe fórtium, sagítta Iónathæ numquam rédiit retrórsum, et gládius Saul non est revérsus inánis.
  "23": 'Saul et Iónathas amábiles, et decóri in vita sua, in morte quoque non sunt divísi: áquilis velocióres, leónibus fortióres.'
  "24": Fíliæ Israel super Saul flete, qui vestiébat vos cóccino in delíciis, qui præbébat ornaménta áurea cúltui vestro.
  "25": Quómodo cecidérunt fortes in prœ́lio? Iónathas in excélsis tuis occísus est?
  "26": Dóleo super te frater mi Iónatha decóre nimis, et amábilis super amórem mulíerum. Sicut mater únicum amat fílium suum, ita ego te diligébam.
  "27": Quómodo cecidérunt robústi, et periérunt arma béllica?
