bible: vulgate
lang: la
language: Latina
book: Isaias
chapter: "22"
verses:
  "1": Onus vallis Visiónis. Quidnam quoque tibi est, quia ascendísti et tu omnis in tecta?
  "2": 'Clamóris plena, urbs frequens, cívitas exsúltans: interfécti tui, non interfécti gládio, nec mórtui in bello.'
  "3": 'Cuncti príncipes tui fugérunt simul, duréque ligáti sunt: omnes, qui invénti sunt, vincti sunt páriter, procul fugérunt.'
  "4": 'Proptérea dixi: Recédite a me, amáre flebo: nolíte incúmbere ut consolémini me super vastitáte fíliæ pópuli mei.'
  "5": Dies enim interfectiónis, et conculcatiónis, et flétuum Dómino Deo exercítuum in valle visiónis scrutans murum, et magníficus super montem.
  "6": Et Ælam sumpsit pháretram, currum hóminis équitis, et paríetem nudávit clýpeus.
  "7": Et erunt eléctæ valles tuæ plenæ quadrigárum, et équites ponent sedes suas in porta.
  "8": Et revelábitur operiméntum Iudæ, et vidébis in die illa armamentárium domus saltus.
  "9": 'Et scissúras civitátis David vidébitis, quia multiplicátæ sunt: et congregástis aquas piscínæ inferióris,'
  "10": et domos Ierúsalem numerástis, et destruxístis domos ad muniéndum murum.
  "11": 'Et lacum fecístis inter duos muros ad aquam piscínæ véteris: et non suspexístis ad eum, qui fécerat eam, et operatórem eius de longe non vidístis.'
  "12": 'Et vocábit Dóminus Deus exercítuum in die illa ad fletum, et ad planctum, ad calvítium, et ad cíngulum sacci:'
  "13": 'et ecce gáudium et lætítia, occídere vítulos et iuguláre aríetes, comédere carnes, et bíbere vinum: Comedámus, et bibámus: cras enim moriémur.'
  "14": 'Et reveláta est in áuribus meis vox Dómini exercítuum: Si dimittétur iníquitas hæc vobis donec moriámini, dicit Dóminus Deus exercítuum.'
  "15": 'Hæc dicit Dóminus Deus exercítuum: Vade, ingrédere ad eum, qui hábitat in tabernáculo, ad Sobnam præpósitum templi, et dices ad eum:'
  "16": Quid tu hic, aut quasi quis hic? quia excidísti tibi hic sepúlcrum, excidísti in excélso memoriále diligénter, in petra tabernáculum tibi.
  "17": Ecce Dóminus asportári te fáciet, sicut asportátur gallus gallináceus, et quasi amíctum sic sublevábit te.
  "18": 'Corónans coronábit te tribulatióne, quasi pilam mittet te in terram latam et spatiósam: ibi moriéris, et ibi erit currus glóriæ tuæ, ignomínia domus Dómini tui.'
  "19": Et expéllam te de statióne tua, et de ministério tuo depónam te.
  "20": 'Et erit in die illa: vocábo servum meum Elíacim fílium Helcíæ,'
  "21": 'et índuam illum túnica tua, et cíngulo tuo confortábo eum, et potestátem tuam dabo in manu eius: et erit quasi pater habitántibus Ierúsalem et dómui Iuda.'
  "22": 'Et dabo clavem domus David super húmerum eius: et apériet, et non erit qui claudat: et claudet, et non erit qui apériat.'
  "23": Et figam illum paxíllum in loco fidéli, et erit in sólium glóriæ dómui patris eius.
  "24": 'Et suspéndent super eum omnem glóriam domus patris eius: vasórum divérsa génera, omne vas párvulum, a vasis craterárum usque ad omne vas musicórum.'
  "25": 'In die illa, dicit Dóminus exercítuum: Auferétur paxíllus, qui fixus fúerat in loco fidéli, et frangétur, et cadet, et períbit quod pepénderat in eo, quia Dóminus locútus est.'
