bible: vulgate
lang: la
language: Latina
book: Zacharias
chapter: "9"
verses:
  "1": 'Onus verbi Dómini in terra Hadrach, et Damásci requiéi eius: quia Dómini est óculus hóminis, et ómnium tríbuum Israel.'
  "2": 'Emath quoque in términis eius, et Tyrus, et Sidon: assumpsérunt quippe sibi sapiéntiam valde.'
  "3": Et ædificávit Tyrus munitiónem suam, et coacervávit argéntum quasi humum, et aurum ut lutum plateárum.
  "4": 'Ecce Dóminus possidébit eam: et percútiet in mari fortitúdinem eius, et hæc igni devorábitur.'
  "5": 'Vidébit Ascalon, et timébit: et Gaza, et dolébit nimis: et Accaron, quóniam confúsa est spes eius: et períbit rex de Gaza, et Ascalon non habitábitur.'
  "6": Et sedébit separátor in Azóto, et dispérdam supérbiam Philisthinórum.
  "7": 'Et áuferam sánguinem eius de ore eius, et abominatiónes eius de médio déntium eius: et relinquétur étiam ipse Deo nostro, et erit quasi dux in Iuda, et Accaron quasi Iebusǽus.'
  "8": 'Et circúmdabo domum meam ex his, qui mílitant mihi eúntes et reverténtes, et non transíbit super eos ultra exáctor: quia nunc vidi in óculis meis.'
  "9": 'Exsúlta satis fília Sion, iúbila fília Ierúsalem: ecce rex tuus véniet tibi iustus, et salvátor: ipse pauper, et ascéndens super ásinam, et super pullum fílium ásinæ.'
  "10": 'Et dispérdam quadrígam ex Ephraim, et equum de Ierúsalem, et dissipábitur arcus belli: et loquétur pacem géntibus, et potéstas eius a mari usque ad mare, et a flumínibus usque ad fines terræ.'
  "11": Tu quoque in sánguine testaménti tui emisísti vinctos tuos de lacu, in quo non est aqua.
  "12": Convertímini ad munitiónem vincti spei, hódie quoque annúntians duplícia reddam tibi.
  "13": 'Quóniam exténdi mihi Iudam quasi arcum, implévi Ephraim: et suscitábo fílios tuos Sion super fílios tuos Grǽcia: et ponam te quasi gládium fórtium.'
  "14": 'Et Dóminus Deus super eos vidébitur, et exíbit ut fulgur iáculum eius: et Dóminus Deus in tuba canet, et vadet in túrbine austri.'
  "15": 'Dóminus exercítuum próteget eos: et devorábunt, et subícient lapídibus fundæ: et bibéntes inebriabúntur quasi a vino, et replebúntur ut phíalæ, et quasi córnua altáris.'
  "16": 'Et salvábit eos Dóminus Deus eórum in die illa, ut gregem pópuli sui: quia lápides sancti elevabúntur super terram eius.'
  "17": Quid enim bonum eius est, et quid pulchrum eius, nisi fruméntum electórum, et vinum gérminans vírgines?
