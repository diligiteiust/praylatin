bible: vulgate
lang: la
language: Latina
book: I Regum
chapter: "1"
verses:
  "1": 'Et rex David senúerat, habebátque ætátis plúrimos dies: cumque operirétur véstibus, non calefiébat.'
  "2": 'Dixérunt ergo ei servi sui: Quærámus dómino nostro regi adolescéntulam vírginem, et stet coram rege, et fóveat eum, dormiátque in sinu suo, et calefáciat dóminum nostrum regem.'
  "3": Quæsiérunt ígitur adolescéntulam speciósam in ómnibus fínibus Israel, et invenérunt Abisag Sunamítidem, et adduxérunt eam ad regem.
  "4": 'Erat autem puélla pulchra nimis, dormiebátque cum rege, et ministrábat ei: rex vero non cognóvit eam.'
  "5": 'Adonías autem fílius Haggith elevabátur, dicens: Ego regnábo. Fecítque sibi currus et équites, et quinquagínta viros, qui cúrrerent ante eum.'
  "6": 'Nec corrípuit eum pater suus aliquándo, dicens: Quare hoc fecísti? Erat autem et ipse pulcher valde, secúndus natu post Absalom.'
  "7": Et sermo ei cum Ioab fílio Sárviæ, et cum Abíathar sacerdóte, qui adiuvábant partes Adoníæ.
  "8": Sadoc vero sacérdos, et Banaías fílius Ióiadæ, et Nathan prophéta, et Sémei et Rei, et robur exércitus David, non erat cum Adonía.
  "9": Immolátis ergo Adonías ariétibus et vítulis, et univérsis pínguibus, iuxta lápidem Zóheleth, qui erat vicínus fonti Rogel, vocávit univérsos fratres suos fílios regis, et omnes viros Iuda servos regis.
  "10": Nathan autem prophétam, et Banaíam, et robústos quosque, et Salomónem fratrem suum non vocávit.
  "11": 'Dixit ítaque Nathan ad Bethsabée matrem Salomónis: Num audísti quod regnáverit Adonías fílius Haggith, et dóminus noster David hoc ignórat?'
  "12": Nunc ergo veni, áccipe consílium a me, et salva ánimam tuam, filiíque tui Salomónis.
  "13": 'Vade, et ingrédere ad regem David, et dic ei: Nonne tu dómine mi rex iurásti mihi ancíllæ tuæ, dicens: Sálomon fílius tuus regnábit post me, et ipse sedébit in sólio meo? quare ergo regnat Adonías?'
  "14": Et adhuc ibi te loquénte cum rege, ego véniam post te, et complébo sermónes tuos.
  "15": 'Ingréssa est ítaque Bethsabée ad regem in cubículum: rex autem senúerat nimis, et Abisag Sunamítis ministrábat ei.'
  "16": 'Inclinávit se Bethsabée, et adorávit regem. Ad quam rex: Quid tibi, inquit, vis?'
  "17": 'Quæ respóndens, ait: Dómine mi, tu iurásti per Dóminum Deum tuum ancíllæ tuæ: Sálomon fílius tuus regnábit post me, et ipse sedébit in sólio meo.'
  "18": Et ecce nunc Adonías regnat, te, dómine mi rex, ignoránte.
  "19": 'Mactávit boves, et pínguia quæque, et aríetes plúrimos, et vocávit omnes fílios regis, Abíathar quoque sacerdótem, et Ioab príncipem milítiæ: Salomónem autem servum tuum non vocávit.'
  "20": Verúmtamen dómine mi rex, in te óculi respíciunt totíus Israel, ut índices eis, quis sedére débeat in sólio tuo, dómine mi rex, post te.
  "21": Erítque, cum dormíerit dóminus meus rex cum pátribus suis, érimus ego et fílius meus Sálomon peccatóres.
  "22": Adhuc illa loquénte cum rege, Nathan prophéta venit.
  "23": 'Et nuntiavérunt regi, dicéntes: Adest Nathan prophéta. Cumque introísset in conspéctu regis, et adorásset eum pronus in terram,'
  "24": 'dixit Nathan: Dómine mi rex, tu dixísti: Adonías regnet post me, et ipse sédeat super thronum meum?'
  "25": 'Quia descéndit hódie, et immolávit boves, et pínguia, et aríetes plúrimos, et vocávit univérsos fílios regis et príncipes exércitus, Abíathar quoque sacerdótem: illísque vescéntibus, et bibéntibus coram eo, et dicéntibus: Vivat rex Adonías:'
  "26": me servum tuum, et Sadoc sacerdótem, et Banaíam fílium Ióiadæ, et Salomónem fámulum tuum non vocávit.
  "27": Numquid a dómino meo rege exívit hoc verbum, et mihi non indicásti servo tuo quis sessúrus esset super thronum dómini mei regis post eum?
  "28": 'Et respóndit rex David, dicens: Vocáte ad me Bethsabée. Quæ cum fuísset ingréssa coram rege, et stetísset ante eum,'
  "29": 'iurávit rex, et ait: Vivit Dóminus, qui éruit ánimam meam de omni angústia,'
  "30": 'quia sicut iurávi tibi per Dóminum Deum Israel, dicens: Sálomon fílius tuus regnábit post me, et ipse sedébit super sólium meum pro me: sic fáciam hódie.'
  "31": 'Summissóque Bethsabée in terram vultu, adorávit regem, dicens: Vivat dóminus meus David in ætérnum.'
  "32": 'Dixit quoque rex David: Vocáte mihi Sadoc sacerdótem, et Nathan prophétam, et Banaíam fílium Ióiadæ. Qui cum ingréssi fuíssent coram rege,'
  "33": 'dixit ad eos: Tóllite vobíscum servos dómini vestri, et impónite Salomónem fílium meum super mulam meam, et dúcite eum in Gihon.'
  "34": 'Et ungat eum ibi Sadoc sacérdos, et Nathan prophéta in regem super Israel: et canétis búccina, atque dicétis: Vivat rex Sálomon.'
  "35": 'Et ascendétis post eum, et véniet, et sedébit super sólium meum, et ipse regnábit pro me: illíque præcípiam ut sit dux super Israel, et super Iudam.'
  "36": 'Et respóndit Banaías fílius Ióiadæ regi, dicens: Amen: sic loquátur Dóminus Deus dómini mei regis.'
  "37": Quómodo fuit Dóminus cum dómino meo rege, sic sit cum Salomóne, et sublímius fáciat sólium eius a sólio dómini mei regis David.
  "38": 'Descéndit ergo Sadoc sacérdos, et Nathan prophéta, et Banaías fílius Ióiadæ, et Ceréthi, et Pheléthi: et imposuérunt Salomónem super mulam regis David, et adduxérunt eum in Gihon.'
  "39": 'Sumpsítque Sadoc sacérdos cornu ólei de tabernáculo, et unxit Salomónem: et cecinérunt búccina, et dixit omnis pópulus: Vivat rex Sálomon.'
  "40": 'Et ascéndit univérsa multitúdo post eum, et pópulus canéntium tíbiis, et lætántium gáudio magno: et insónuit terra a clamóre eórum.'
  "41": 'Audívit autem Adonías, et omnes, qui invitáti fúerant ab eo: iamque convívium finítum erat: sed et Ioab, audíta voce tubæ, ait: Quid sibi vult clamor civitátis tumultuántis?'
  "42": 'Adhuc illo loquénte, Iónathas fílius Abíathar sacerdótis venit: cui dixit Adonías: Ingrédere, quia vir fortis es, et bona núntians.'
  "43": 'Respondítque Iónathas Adoníæ: Nequáquam: dóminus enim noster rex David regem constítuit Salomónem:'
  "44": misítque cum eo Sadoc sacerdótem, et Nathan prophétam, et Banaíam fílium Ióiadæ, et Ceréthi, et Pheléthi, et imposuérunt eum super mulam regis.
  "45": 'Unxerúntque eum Sadoc sacérdos, et Nathan prophéta regem in Gihon: et ascendérunt inde lætántes, et insónuit cívitas: hæc est vox, quam audístis.'
  "46": Sed et Sálomon sedet super sólium regni.
  "47": 'Et ingréssi servi regis benedixérunt dómino nostro regi David, dicéntes: Amplíficet Deus nomen Salomónis super nomen tuum, et magníficet thronus eius super thronum tuum. Et adorávit rex in léctulo suo:'
  "48": 'et locútus est: Benedíctus Dóminus Deus Israel, qui dedit hódie sedéntem in sólio meo, vidéntibus óculis meis.'
  "49": Térriti sunt ergo, et surrexérunt omnes, qui invitáti fúerant ab Adonía, et ivit unusquísque in viam suam.
  "50": Adonías autem timens Salomónem, surréxit, et ábiit, tenuítque cornu altáris.
  "51": 'Et nuntiavérunt Salomóni, dicéntes: Ecce Adonías timens regem Salomónem, ténuit cornu altáris, dicens: Iuret mihi rex Sálomon hódie, quod non interfíciat servum suum gládio.'
  "52": 'Dixítque Sálomon: Si fúerit vir bonus, non cadet ne unus quidem capíllus eius in terram: sin autem malum invéntum fúerit in eo, moriétur.'
  "53": 'Misit ergo rex Sálomon, et edúxit eum ab altári: et ingréssus adorávit regem Salomónem: dixítque ei Sálomon: Vade in domum tuam.'
