bible: vulgate
lang: la
language: Latina
book: Isaias
chapter: "42"
verses:
  "1": 'Ecce servus meus, suscípiam eum: eléctus meus, complácuit sibi in illo ánima mea: dedi spíritum meum super eum, iudícium géntibus próferet.'
  "2": Non clamábit, neque accípiet persónam, nec audiétur vox eius foris.
  "3": 'Cálamum quassátum non cónteret, et linum fúmigans non exstínguet: in veritáte edúcet iudícium.'
  "4": 'Non erit tristis, neque turbuléntus, donec ponat in terra iudícium: et legem eius ínsulæ exspectábunt.'
  "5": 'Hæc dicit Dóminus Deus, creans cælos, et exténdens eos: formans terram, et quæ gérminant ex ea: dans flatum pópulo, qui est super eam, et spíritum calcántibus eam.'
  "6": 'Ego Dóminus vocávi te in iustítia, et apprehéndi manum tuam, et servávi te. Et dedi te in fœdus pópuli, in lucem géntium:'
  "7": ut aperíres óculos cæcórum, et edúceres de conclusióne vinctum, de domo cárceris sedéntes in ténebris.
  "8": 'Ego Dóminus, hoc est nomen meum: glóriam meam álteri non dabo, et laudem meam sculptílibus.'
  "9": 'Quæ prima fuérunt, ecce venérunt: nova quoque ego annúntio: ántequam oriántur, audíta vobis fáciam.'
  "10": 'Cantáte Dómino cánticum novum, laus eius ab extrémis terræ: qui descénditis in mare, et plenitúdo eius: ínsulæ, et habitatóres eárum.'
  "11": 'Sublevétur desértum et civitátes eius: in dómibus habitábit Cedar: laudáte habitatóres Petræ, de vértice móntium clamábunt.'
  "12": Ponent Dómino glóriam, et laudem eius in ínsulis nuntiábunt.
  "13": 'Dóminus sicut fortis egrediétur, sicut vir prœliátor suscitábit zelum: vociferábitur, et clamábit: super inimícos suos confortábitur.'
  "14": 'Tácui semper, sílui, pátiens fui, sicut partúriens loquar: dissipábo, et absorbébo simul.'
  "15": 'Desértos fáciam montes, et colles, et omne gramen eórum exsiccábo: et ponam flúmina in ínsulas, et stagna arefáciam.'
  "16": 'Et ducam cæcos in viam, quam nésciunt, et in sémitis, quas ignoravérunt, ambuláre eos fáciam: ponam ténebras coram eis in lucem, et prava in recta: hæc verba feci eis, et non derelíqui eos.'
  "17": 'Convérsi sunt retrórsum, confundántur confusióne, qui confídunt in scúlptili: qui dicunt conflátili: Vos dii nostri.'
  "18": Surdi audíte, et cæci intuémini ad vidéndum.
  "19": Quis cæcus, nisi servus meus? et surdus, nisi ad quem núntios meos misi? quis cæcus, nisi qui venúmdatus est? et quis cæcus, nisi servus Dómini?
  "20": Qui vides multa, nonne custódies? qui apértas habes aures, nonne áudies?
  "21": Et Dóminus vóluit ut sanctificáret eum, et magnificáret legem, et extólleret.
  "22": 'Ipse autem pópulus diréptus, et vastátus: láqueus iúvenum omnes, et in dómibus cárcerum abscónditi sunt: facti sunt in rapínam, nec est qui éruat: in direptiónem, nec est qui dicat: Redde.'
  "23": Quis est in vobis qui áudiat hoc, atténdat et auscúltet futúra?
  "24": Quis dedit in direptiónem Iacob, et Israel vastántibus? nonne Dóminus ipse, cui peccávimus? Et noluérunt in viis eius ambuláre, et non audiérunt legem eius.
  "25": 'Et effúdit super eum indignatiónem furóris sui, et forte bellum: et combússit eum in circúitu, et non cognóvit: et succéndit eum, et non intelléxit.'
