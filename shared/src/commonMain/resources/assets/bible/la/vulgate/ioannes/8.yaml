bible: vulgate
lang: la
language: Latina
book: Ioannes
chapter: "8"
verses:
  "1": 'Iesus autem perréxit in montem Olivéti:'
  "2": et dilúculo íterum venit in templum, et omnis pópulus venit ad eum, et sedens docébat eos.
  "3": 'Addúcunt autem scribæ, et Pharisǽi mulíerem in adultério deprehénsam: et statuérunt eam in médio,'
  "4": 'et dixérunt ei: Magíster, hæc múlier modo deprehénsa est in adultério.'
  "5": In lege autem Móyses mandávit nobis huiúsmodi lapidáre. Tu ergo quid dicis?
  "6": Hoc autem dicébant tentántes eum, ut possent accusáre eum. Iesus autem inclínans se deórsum, dígito scribébat in terra.
  "7": 'Cum ergo perseverárent interrogántes eum, eréxit se, et dixit eis: Qui sine peccáto est vestrum, primus in illam lápidem mittat.'
  "8": Et íterum se inclínans, scribébat in terra.
  "9": 'Audiéntes autem unus post unum exíbant, incipiéntes a senióribus: et remánsit solus Iesus, et múlier in médio stans.'
  "10": 'Erigens autem se Iesus, dixit ei: Múlier, ubi sunt, qui te accusábant? nemo te condemnávit?'
  "11": 'Quæ dixit: Nemo, Dómine. Dixit autem Iesus: Nec ego te condemnábo: vade, et iam ámplius noli peccáre.'
  "12": 'Iterum ergo locútus est eis Iesus, dicens: Ego sum lux mundi: qui séquitur me, non ámbulat in ténebris, sed habébit lumen vitæ.'
  "13": 'Dixérunt ergo ei Pharisǽi: Tu de teípso testimónium pérhibes: testimónium tuum non est verum.'
  "14": 'Respóndit Iesus, et dixit eis: Et si ego testimónium perhíbeo de meípso, verum est testimónium meum: quia scio unde veni, et quo vado: vos autem nescítis unde vénio, aut quo vado.'
  "15": 'Vos secúndum carnem iudicátis: ego non iúdico quemquam:'
  "16": 'et si iúdico ego, iudícium meum verum est, quia solus non sum: sed ego, et qui misit me, Pater.'
  "17": Et in lege vestra scriptum est, quia duórum hóminum testimónium verum est.
  "18": 'Ego sum, qui testimónium perhíbeo de meípso: et testimónium pérhibet de me, qui misit me, Pater.'
  "19": 'Dicébant ergo ei: Ubi est Pater tuus? Respóndit Iesus: Neque me scitis, neque Patrem meum: si me scirétis, fórsitan et Patrem meum scirétis.'
  "20": 'Hæc verba locútus est Iesus in gazophylácio, docens in templo: et nemo apprehéndit eum, quia necdum vénerat hora eius.'
  "21": 'Dixit ergo íterum eis Iesus: Ego vado, et quærétis me, et in peccáto vestro moriémini. Quo ego vado, vos non potéstis veníre.'
  "22": 'Dicébant ergo Iudǽi: Numquid interfíciet semetípsum, quia dixit: Quo ego vado, vos non potéstis veníre?'
  "23": 'Et dicébat eis: Vos de deórsum estis, ego de supérnis sum. Vos de mundo hoc estis, ego non sum de hoc mundo.'
  "24": 'Dixi ergo vobis quia moriémini in peccátis vestris: si enim non credidéritis quia ego sum, moriémini in peccáto vestro.'
  "25": 'Dicébant ergo ei: Tu quis es? Dixit eis Iesus: Princípium, qui et loquor vobis.'
  "26": 'Multa hábeo de vobis loqui, et iudicáre: sed qui me misit, verax est: et ego quæ audívi ab eo, hæc loquor in mundo.'
  "27": Et non cognovérunt quia Patrem eius dicébat Deum.
  "28": 'Dixit ergo eis Iesus: Cum exaltavéritis Fílium hóminis, tunc cognoscétis quia ego sum, et a meípso fácio nihil, sed sicut dócuit me Pater, hæc loquor:'
  "29": 'et qui me misit, mecum est, et non relíquit me solum: quia ego quæ plácita sunt ei, fácio semper.'
  "30": Hæc illo loquénte, multi credidérunt in eum.
  "31": 'Dicébat ergo Iesus ad eos, qui credidérunt ei, Iudǽos: Si vos manséritis in sermóne meo, vere discípuli mei éritis,'
  "32": et cognoscétis veritátem, et véritas liberábit vos.
  "33": 'Respondérunt ei: Semen Abrahæ sumus, et némini servívimus unquam: quómodo tu dicis: Líberi éritis?'
  "34": 'Respóndit eis Iesus: Amen, amen dico vobis: quia omnis, qui facit peccátum, servus est peccáti.'
  "35": 'Servus autem non manet in domo in ætérnum: fílius autem manet in ætérnum:'
  "36": si ergo vos Fílius liberáverit, vere líberi éritis.
  "37": 'Scio quia fílii Abrahæ estis: sed quǽritis me interfícere, quia sermo meus non capit in vobis.'
  "38": 'Ego quod vidi apud Patrem meum, loquor: et vos quæ vidístis apud patrem vestrum, fácitis.'
  "39": 'Respondérunt, et dixérunt ei: Pater noster Abraham est. Dicit eis Iesus: Si fílii Abrahæ estis, ópera Abrahæ fácite.'
  "40": 'Nunc autem quǽritis me interfícere, hóminem, qui veritátem vobis locútus sum, quam audívi a Deo: hoc Abraham non fecit.'
  "41": 'Vos fácitis ópera patris vestri. Dixérunt ítaque ei: Nos ex fornicatióne non sumus nati: unum patrem habémus Deum.'
  "42": 'Dixit ergo eis Iesus: Si Deus pater vester esset, diligerétis útique me: ego enim ex Deo procéssi, et veni: neque enim a meípso veni, sed ille me misit.'
  "43": Quare loquélam meam non cognóscitis? Quia non potéstis audíre sermónem meum.
  "44": 'Vos ex patre diábolo estis: et desidéria patris vestri vultis fácere. Ille homicída erat ab inítio, et in veritáte non stetit: quia non est véritas in eo: cum lóquitur mendácium, ex própriis lóquitur, quia mendax est, et pater eius.'
  "45": Ego autem si veritátem dico, non créditis mihi.
  "46": Quis ex vobis árguet me de peccáto? Si veritátem dico vobis, quare non créditis mihi?
  "47": Qui ex Deo est, verba Dei audit. Proptérea vos non audítis, quia ex Deo non estis.
  "48": 'Respondérunt ergo Iudǽi, et dixérunt ei: Nonne bene dícimus nos quia Samaritánus es tu, et dæmónium habes?'
  "49": 'Respóndit Iesus: Ego dæmónium non hábeo: sed honorífico Patrem meum, et vos inhonorástis me.'
  "50": 'Ego autem non quæro glóriam meam: est qui quærat, et iúdicet.'
  "51": 'Amen, amen dico vobis: si quis sermónem meum serváverit, mortem non vidébit in ætérnum.'
  "52": 'Dixérunt ergo Iudǽi: Nunc cognóvimus quia dæmónium habes. Abraham mórtuus est, et prophétæ: et tu dicis: Si quis sermónem meum serváverit, non gustábit mortem in ætérnum.'
  "53": Numquid tu maior es patre nostro Abraham, qui mórtuus est? et prophétæ mórtui sunt. Quem teípsum facis?
  "54": 'Respóndit Iesus: Si ego glorífico meípsum, glória mea nihil est: est Pater meus, qui gloríficat me, quem vos dícitis quia Deus vester est,'
  "55": 'et non cognovístis eum: ego autem novi eum. Et si díxero quia non scio eum, ero símilis vobis, mendax. Sed scio eum, et sermónem eius servo.'
  "56": 'Abraham pater vester exsultávit ut vidéret diem meum: vidit, et gavísus est.'
  "57": 'Dixérunt ergo Iudǽi ad eum: Quinquagínta annos nondum habes, et Abraham vidísti?'
  "58": 'Dixit eis Iesus: Amen, amen dico vobis, ántequam Abraham fíeret, ego sum.'
  "59": 'Tulérunt ergo lápides, ut iácerent in eum: Iesus autem abscóndit se, et exívit de templo.'
