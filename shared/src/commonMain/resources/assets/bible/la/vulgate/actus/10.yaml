bible: vulgate
lang: la
language: Latina
book: Actus Apostolorum
chapter: "10"
verses:
  "1": Vir autem quidam erat in Cæsaréa, nómine Cornélius, centúrio cohórtis, quæ dícitur Itálica,
  "2": religiósus, ac timens Deum cum omni domo sua, fáciens eleemósynas multas plebi, et déprecans Deum semper.
  "3": 'Is vidit in visu maniféste, quasi hora diéi nona, ángelum Dei introeúntem ad se, et dicéntem sibi: Cornéli.'
  "4": 'At ille íntuens eum, timóre corréptus, dixit: Quid est, Dómine? Dixit autem illi: Oratiónes tuæ, et eleemósynæ tuæ ascendérunt in memóriam in conspéctu Dei.'
  "5": 'Et nunc mitte viros in Ioppen, et accérsi Simónem quemdam, qui cognominátur Petrus:'
  "6": 'hic hospitátur apud Simónem quemdam coriárium, cuius est domus iuxta mare: hic dicet tibi quid te opórteat fácere.'
  "7": Et cum discessísset ángelus, qui loquebátur illi, vocávit duos domésticos suos, et mílitem metuéntem Dóminum ex his, qui illi parébant.
  "8": Quibus cum narrásset ómnia, misit illos in Ioppen.
  "9": Póstera autem die, iter illis faciéntibus, et appropinquántibus civitáti, ascéndit Petrus in superióra ut oráret circa horam sextam.
  "10": 'Et cum esuríret, vóluit gustáre. Parántibus autem illis, cécidit super eum mentis excéssus:'
  "11": et vidit cælum apértum, et descéndens vas quoddam, velut línteum magnum, quátuor inítiis submítti de cælo in terram,
  "12": in quo erant ómnia quadrupédia, et serpéntia terræ, et volatília cæli.
  "13": 'Et facta est vox ad eum: Surge Petre: occíde, et mandúca.'
  "14": 'Ait autem Petrus: Absit Dómine, quia numquam manducávi omne commúne, et immúndum.'
  "15": 'Et vox íterum secúndo ad eum: Quod Deus purificávit, tu commúne ne díxeris.'
  "16": 'Hoc autem factum est per ter: et statim recéptum est vas in cælum.'
  "17": 'Et dum intra se hæsitáret Petrus quidnam esset vísio, quam vidísset: ecce viri, qui missi erant a Cornélio, inquiréntes domum Simónis astitérunt ad iánuam.'
  "18": Et cum vocássent, interrogábant, si Simon, qui cognominátur Petrus, illic habéret hospítium.
  "19": 'Petro autem cogitánte de visióne, dixit Spíritus ei: Ecce viri tres quærunt te.'
  "20": 'Surge ítaque, descénde, et vade cum eis nihil dúbitans: quia ego misi illos.'
  "21": 'Descéndens autem Petrus ad viros, dixit: Ecce ego sum, quem quǽritis: quæ causa est, propter quam venístis?'
  "22": 'Qui dixérunt: Cornélius centúrio, vir iustus, et timens Deum, et testimónium habens ab univérsa gente Iudæórum, respónsum accépit ab ángelo sancto accersíre te in domum suam, et audíre verba abs te.'
  "23": Introdúcens ergo eos, recépit hospítio. Sequénti autem die, surgens proféctus est cum illis, et quidam ex frátribus ab Ioppe comitáti sunt eum.
  "24": Altera autem die introívit Cæsaréam. Cornélius vero exspectábat illos, convocátis cognátis suis, et necessáriis amícis.
  "25": Et factum est cum introísset Petrus, óbvius venit ei Cornélius, et prócidens ad pedes eius adorávit.
  "26": 'Petrus vero elevávit eum, dicens: Surge, et ego ipse homo sum.'
  "27": 'Et loquens cum illo intrávit, et invénit multos, qui convénerant:'
  "28": 'dixítque ad illos: Vos scitis quómodo abominátum sit viro Iudǽo coniúngi, aut accédere ad alienígenam: sed mihi osténdit Deus néminem commúnem aut immúndum dícere hóminem.'
  "29": Propter quod sine dubitatióne veni accersítus. Intérrogo ergo, quam ob causam accersístis me?
  "30": 'Et Cornélius ait: A nudiusquárta die usque ad hanc horam, orans eram hora nona in domo mea, et ecce vir stetit ante me in veste cándida, et ait:'
  "31": Cornéli, exaudíta est orátio tua, et eleemósynæ tuæ commemorátæ sunt in conspéctu Dei.
  "32": 'Mitte ergo in Ioppen, et accérsi Simónem, qui cognominátur Petrus: hic hospitátur in domo Simónis coriárii iuxta mare.'
  "33": 'Conféstim ergo misi ad te: et tu benefecísti veniéndo. Nunc ergo omnes nos in conspéctu tuo ádsumus audíre ómnia quæcúmque tibi præcépta sunt a Dómino.'
  "34": 'Apériens autem Petrus os suum, dixit: In veritáte cómperi quia non est personárum accéptor Deus:'
  "35": sed in omni gente, qui timet eum, et operátur iustítiam, accéptus est illi.
  "36": Verbum misit Deus fíliis Israel, annúntians pacem per Iesum Christum (hic est ómnium Dóminus).
  "37": 'Vos scitis quod factum est verbum per univérsam Iudǽam: incípiens enim a Galilǽa post baptísmum, quod prædicávit Ioánnes,'
  "38": 'Iesum a Názareth: quómodo unxit eum Deus Spíritu sancto, et virtúte, qui pertránsiit benefaciéndo, et sanándo omnes oppréssos a diábolo, quóniam Deus erat cum illo.'
  "39": Et nos testes sumus ómnium, quæ fecit in regióne Iudæórum, et Ierúsalem, quem occidérunt suspendéntes in ligno.
  "40": Hunc Deus suscitávit tértia die, et dedit eum maniféstum fíeri,
  "41": 'non omni pópulo, sed téstibus præordinátis a Deo: nobis, qui manducávimus, et bíbimus cum illo postquam resurréxit a mórtuis.'
  "42": Et præcépit nobis prædicáre pópulo, et testificári, quia ipse est, qui constitútus est a Deo iudex vivórum, et mortuórum.
  "43": Huic omnes prophétæ testimónium pérhibent remissiónem peccatórum accípere per nomen eius omnes, qui credunt in eum.
  "44": Adhuc loquénte Petro verba hæc, cécidit Spíritus sanctus super omnes, qui audiébant verbum.
  "45": 'Et obstupuérunt ex circumcisióne fidéles, qui vénerant cum Petro: quia et in natiónes grátia Spíritus sancti effúsa est.'
  "46": Audiébant enim illos loquéntes linguis, et magnificántes Deum.
  "47": 'Tunc respóndit Petrus: Numquid aquam quis prohibére potest ut non baptizéntur hi, qui Spíritum sanctum accepérunt sicut et nos?'
  "48": Et iussit eos baptizári in nómine Dómini Iesu Christi. Tunc rogavérunt eum ut manéret apud eos áliquot diébus.
