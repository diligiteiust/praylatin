bible: vulgate
lang: la
language: Latina
book: Daniel
chapter: "2"
verses:
  "1": In anno secúndo regni Nabuchodónosor, vidit Nabuchodónosor sómnium, et contérritus est spíritus eius, et sómnium eius fugit ab eo.
  "2": 'Præcépit autem rex, ut convocaréntur aríoli, et magi, et maléfici, et Chaldǽi, ut indicárent regi sómnia sua: qui cum veníssent, stetérunt coram rege.'
  "3": 'Et dixit ad eos rex: Vidi sómnium: et mente confúsus ignóro quid víderim.'
  "4": 'Responderúntque Chaldǽi regi Syríace: Rex in sempitérnum vive: dic sómnium servis tuis, et interpretatiónem eius indicábimus.'
  "5": 'Et respóndens rex ait Chaldǽis: Sermo recéssit a me: nisi indicavéritis mihi sómnium, et coniectúram eius, períbitis vos, et domus vestræ publicabúntur.'
  "6": 'Si autem sómnium, et coniectúram eius narravéritis, prǽmia, et dona, et honórem multum accipiétis a me: sómnium ígitur, et interpretatiónem eius indicáte mihi.'
  "7": 'Respondérunt secúndo, atque dixérunt: Rex sómnium dicat servis suis, et interpretatiónem illíus indicábimus.'
  "8": 'Respóndit rex, et ait: Certe novi quod tempus redímitis, sciéntes quod recésserit a me sermo.'
  "9": Si ergo sómnium non indicavéritis mihi, una est de vobis senténtia, quod interpretatiónem quoque fallácem, et deceptióne plenam composuéritis, ut loquámini mihi donec tempus pertránseat. Sómnium ítaque dícite mihi, ut sciam quod interpretatiónem quoque eius veram loquámini.
  "10": 'Respondéntes ergo Chaldǽi coram rege, dixérunt: Non est homo super terram, qui sermónem tuum, rex, possit implére: sed neque regum quisquam magnus et potens verbum huiuscémodi sciscitátur ab omni aríolo, et mago, et Chaldǽo.'
  "11": 'Sermo enim, quem tu quæris, rex, gravis est: nec reperiétur quisquam, qui índicet illum in conspéctu regis, excéptis diis, quorum non est cum homínibus conversátio.'
  "12": Quo audíto, rex in furóre, et in ira magna præcépit ut perírent omnes sapiéntes Babylónis.
  "13": 'Et egréssa senténtia, sapiéntes interficiebántur: quærebantúrque Dániel, et sócii eius, ut perírent.'
  "14": Tunc Dániel requisívit de lege atque senténtia ab Arioch príncipe milítiæ regis, qui egréssus fúerat ad interficiéndos sapiéntes Babylónis.
  "15": Et interrogávit eum, qui a rege potestátem accéperat, quam ob causam tam crudélis senténtia a fácie regis esset egréssa. Cum ergo rem indicásset Arioch Daniéli,
  "16": Dániel ingréssus rogávit regem ut tempus daret sibi ad solutiónem indicándam regi.
  "17": 'Et ingréssus est domum suam, Ananiǽque et Misaéli et Azaríæ sóciis suis indicávit negótium:'
  "18": ut quǽrerent misericórdiam a fácie Dei cæli super sacraménto isto, et non perírent Dániel et sócii eius cum céteris sapiéntibus Babylónis.
  "19": 'Tunc Daniéli mystérium per visiónem nocte revelátum est: et benedíxit Dániel Deum cæli,'
  "20": 'et locútus ait: Sit nomen Dómini benedíctum a sǽculo et usque in sǽculum: quia sapiéntia et fortitúdo eius sunt.'
  "21": 'Et ipse mutat témpora, et ætátes: transfert regna, atque constítuit: dat sapiéntiam sapiéntibus, et sciéntiam intelligéntibus disciplínam.'
  "22": 'Ipse revélat profúnda, et abscóndita, et novit in ténebris constitúta: et lux cum eo est.'
  "23": 'Tibi Deus patrum nostrórum confíteor, teque laudo: quia sapiéntiam, et fortitúdinem dedísti mihi: et nunc ostendísti mihi quæ rogávimus te, quia sermónem regis aperuísti nobis.'
  "24": 'Post hæc Dániel ingréssus ad Arioch, quem constitúerat rex ut pérderet sapiéntes Babylónis, sic ei locútus est: Sapiéntes Babylónis ne perdas: intróduc me in conspéctu regis, et solutiónem regi narrábo.'
  "25": 'Tunc Arioch festínus introdúxit Daniélem ad regem, et dixit ei: Invéni hóminem de fíliis transmigratiónis Iuda, qui solutiónem regi annúntiet.'
  "26": 'Respóndit rex, et dixit Daniéli, cuius nomen erat Baltássar: Putásne vere potes mihi indicáre sómnium, quod vidi, et interpretatiónem eius?'
  "27": 'Et respóndens Dániel coram rege, ait: Mystérium, quod rex intérrogat, sapiéntes, magi, aríoli, et arúspices néqueunt indicáre regi:'
  "28": 'sed est Deus in cælo revélans mystéria, qui indicávit tibi rex Nabuchodónosor, quæ ventúra sunt in novíssimis tempóribus. Sómnium tuum, et visiónes cápitis tui in cubíli tuo huiuscémodi sunt:'
  "29": 'Tu rex cogitáre cœpísti in strato tuo, quid esset futúrum post hæc: et qui revélat mystéria, osténdit tibi quæ ventúra sunt.'
  "30": 'Mihi quoque non in sapiéntia, quæ est in me plus quam in cunctis vivéntibus, sacraméntum hoc revelátum est: sed ut interpretátio regi manifésta fíeret, et cogitatiónes mentis tuæ scires.'
  "31": 'Tu rex vidébas, et ecce quasi státua una grandis: státua illa magna, et statúra sublímis stabat contra te, et intúitus eius erat terríbilis.'
  "32": Huius státuæ caput ex auro óptimo erat, pectus autem et bráchia de argénto, porro venter, et fémora ex ære,
  "33": tíbiæ autem férreæ, pedum quædam pars erat férrea, quædam autem fíctilis.
  "34": 'Vidébas ita, donec abscíssus est lapis de monte sine mánibus: et percússit státuam in pédibus eius férreis, et fictílibus, et commínuit eos.'
  "35": 'Tunc contríta sunt páriter ferrum, testa, æs, argéntum, et aurum, et redácta quasi in favíllam æstívæ áreæ, quæ rapta sunt vento: nullúsque locus invéntus est eis: lapis autem, qui percússerat státuam, factus est mons magnus, et implévit univérsam terram.'
  "36": 'Hoc est sómnium: interpretatiónem quoque eius dicémus coram te, rex.'
  "37": 'Tu rex regum es: et Deus cæli, regnum, et fortitúdinem, et impérium, et glóriam dedit tibi:'
  "38": 'et ómnia, in quibus hábitant fílii hóminum, et béstiæ agri: vólucres quoque cæli dedit in manu tua, et sub ditióne tua univérsa constítuit: tu es ergo caput áureum.'
  "39": 'Et post te consúrget regnum áliud minus te argénteum: et regnum tértium áliud ǽreum, quod imperábit univérsæ terræ.'
  "40": 'Et regnum quartum erit velut ferrum: quómodo ferrum commínuit, et domat ómnia, sic commínuet, et cónteret ómnia hæc.'
  "41": 'Porro quia vidísti pedum, et digitórum partem testæ fíguli, et partem férream: regnum divísum erit, quod tamen de plantário ferri oriétur, secúndum quod vidísti ferrum mistum testæ ex luto.'
  "42": 'Et dígitos pedum ex parte férreos, et ex parte fíctiles: ex parte regnum erit sólidum, et ex parte contrítum.'
  "43": Quod autem vidísti ferrum mistum testæ ex luto, commiscebúntur quidem humáno sémine, sed non adhærébunt sibi, sicut ferrum miscéri non potest testæ.
  "44": 'In diébus autem regnórum illórum suscitábit Deus cæli regnum, quod in ætérnum non dissipábitur, et regnum eius álteri pópulo non tradétur: commínuet autem, et consúmet univérsa regna hæc, et ipsum stabit in ætérnum.'
  "45": 'Secúndum quod vidísti, quod de monte abscíssus est lapis sine mánibus, et commínuit testam, et ferrum, et æs, et argéntum, et aurum, Deus magnus osténdit regi quæ ventúra sunt póstea: et verum est sómnium, et fidélis interpretátio eius.'
  "46": Tunc rex Nabuchodónosor cécidit in fáciem suam, et Daniélem adorávit, et hóstias, et incénsum præcépit ut sacrificárent ei.
  "47": 'Loquens ergo rex, ait Daniéli: Vere Deus vester Deus deórum est, et Dóminus regum, et revélans mystéria: quóniam tu potuísti aperíre hoc sacraméntum.'
  "48": 'Tunc rex Daniélem in sublíme éxtulit, et múnera multa, et magna dedit ei: et constítuit eum príncipem super omnes províncias Babylónis, et præféctum magistrátuum super cunctos sapiéntes Babylónis.'
  "49": 'Dániel autem postulávit a rege, et constítuit super ópera provínciæ Babylónis Sidrach, Misach, et Abdénago: ipse autem Dániel erat in fóribus regis.'
