bible: vulgate
lang: la
language: Latina
book: Ezechiel
chapter: "22"
verses:
  "1": 'Et factum est verbum Dómini ad me, dicens:'
  "2": Et tu fili hóminis, nonne iúdicas, nonne iúdicas civitátem sánguinum?
  "3": 'Et osténdes ei omnes abominatiónes suas, et dices: Hæc dicit Dóminus Deus: Cívitas effúndens sánguinem in médio sui, ut véniat tempus eius: et quæ fecit idóla contra semetípsam, ut polluerétur.'
  "4": 'In sánguine tuo, qui a te effúsus est, deliquísti: et in idólis tuis, quæ fecísti, pollúta es: et appropinquáre fecísti dies tuos, et adduxísti tempus annórum tuórum: proptérea dedi te oppróbrium géntibus, et irrisiónem univérsis terris.'
  "5": 'Quæ iuxta sunt, et quæ procul a te, triumphábunt de te: sórdida, nóbilis, grandis intéritu.'
  "6": Ecce príncipes Israel sínguli in bráchio suo fuérunt in te, ad effundéndum sánguinem.
  "7": Patrem, et matrem contuméliis affecérunt, in te ádvenam calumniáti sunt in médio tui, pupíllum et víduam contristavérunt apud te.
  "8": Sanctuária mea sprevísti, et sábbata mea polluísti.
  "9": Viri detractóres fuérunt in te ad effundéndum sánguinem, et super montes comedérunt in te, scelus operáti sunt in médio tui.
  "10": 'Verecundióra patris discooperuérunt in te: immundítiam menstruátæ humiliavérunt in te:'
  "11": et unusquísque in uxórem próximi sui operátus est abominatiónem, et socer nurum suam pólluit nefárie, frater sorórem suam fíliam patris sui oppréssit in te.
  "12": 'Múnera accepérunt apud te ad effundéndum sánguinem: usúram, et superabundántiam accepísti, et aváre próximos tuos calumniabáris: meíque oblíta es, ait Dóminus Deus.'
  "13": Ecce complósi manus meas super avarítiam tuam, quam fecísti, et super sánguinem, qui effúsus est in médio tui.
  "14": Numquid sustinébit cor tuum, aut prævalébunt manus tuæ in diébus, quos ego fáciam tibi? ego Dóminus locútus sum, et fáciam.
  "15": Et dispérgam te in natiónes, et ventilábo te in terras, et defícere fáciam immundítiam tuam a te.
  "16": 'Et possidébo te in conspéctu géntium: et scies quia ego Dóminus.'
  "17": 'Et factum est verbum Dómini ad me, dicens:'
  "18": 'Fili hóminis, versa est mihi domus Israel in scóriam: omnes isti æs, et stannum, et ferrum, et plumbum in médio fornácis: scória argénti facti sunt.'
  "19": 'Proptérea hæc dicit Dóminus Deus: Eo quod versi estis omnes in scóriam, proptérea ecce ego congregábo vos in médio Ierúsalem,'
  "20": 'congregatióne argénti, et æris, et stanni, et ferri, et plumbi, in médio fornácis: ut succéndam in ea ignem ad conflándum: sic congregábo in furóre meo, et in ira mea, et requiéscam: et conflábo vos.'
  "21": Et congregábo vos, et succéndam vos in igne furóris mei, et conflabímini in médio eius.
  "22": 'Ut conflátur argéntum in médio fornácis, sic éritis in médio eius: et sciétis quia ego Dóminus, cum effúderim indignatiónem meam super vos.'
  "23": 'Et factum est verbum Dómini ad me, dicens:'
  "24": 'Fili hóminis, dic ei: Tu es terra immúnda, et non complúta in die furóris.'
  "25": Coniurátio prophetárum in médio eius, sicut leo rúgiens, rapiénsque prædam, ánimas devoravérunt, opes et prétium accepérunt, víduas eius multiplicavérunt in médio illíus.
  "26": 'Sacerdótes eius contempsérunt legem meam, et polluérunt sanctuária mea: inter sanctum et profánum non habuérunt distántiam: et inter pollútum et mundum non intellexérunt: et a sábbatis meis avertérunt óculos suos, et coinquinábar in médio eórum.'
  "27": Príncipes eius in médio illíus quasi lupi rapiéntes prædam ad effundéndum sánguinem, et ad perdéndas ánimas, et aváre ad sectánda lucra.
  "28": 'Prophétæ autem eius liniébant eos absque temperaménto, vidéntes vana, et divinántes eis mendácium, dicéntes: Hæc dicit Dóminus Deus, cum Dóminus non sit locútus.'
  "29": 'Pópuli terræ calumniabántur calúmniam, et rapiébant violénter: egénum, et páuperem affligébant, et ádvenam opprimébant calúmnia absque iudício.'
  "30": 'Et quæsívi de eis virum, qui interpóneret sepem, et staret oppósitus contra me pro terra, ne dissipárem eam: et non invéni.'
  "31": 'Et effúdi super eos indignatiónem meam, in igne iræ meæ consúmpsi eos: viam eórum in caput eórum réddidi, ait Dóminus Deus.'
