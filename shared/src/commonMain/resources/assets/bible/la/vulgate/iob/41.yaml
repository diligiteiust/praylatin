bible: vulgate
lang: la
language: Latina
book: Iob
chapter: "41"
verses:
  "1": 'Non quasi crudélis suscitábo eum: quis enim resístere potest vúltui meo?'
  "2": Quis ante dedit mihi, ut reddam ei? ómnia quæ sub cælo sunt, mea sunt.
  "3": Non parcam ei, et verbis poténtibus, et ad deprecándum compósitis.
  "4": Quis revelábit fáciem induménti eius? et in médium oris eius quis intrábit?
  "5": Portas vultus eius quis apériet? per gyrum déntium eius formído.
  "6": Corpus illíus quasi scuta fusília, compáctum squamis se preméntibus.
  "7": 'Una uni coniúngitur, et ne spiráculum quidem incédit per eas:'
  "8": una álteri adhærébit, et tenéntes se nequáquam separabúntur.
  "9": Sternutátio eius splendor ignis, et óculi eius, ut pálpebræ dilúculi.
  "10": De ore eius lámpades procédunt, sicut tædæ ignis accénsæ.
  "11": De náribus eius procédit fumus, sicut ollæ succénsæ atque fervéntis.
  "12": Hálitus eius prunas ardére facit, et flamma de ore eius egréditur.
  "13": In collo eius morábitur fortitúdo, et fáciem eius præcédit egéstas.
  "14": 'Membra cárnium eius cohæréntia sibi: mittet contra eum fúlmina, et ad locum álium non feréntur.'
  "15": Cor eius indurábitur tamquam lapis, et stringétur quasi malleatóris incus.
  "16": Cum sublátus fúerit, timébunt ángeli, et térriti purgabúntur.
  "17": 'Cum apprehénderit eum gládius, subsístere non póterit neque hasta, neque thorax:'
  "18": reputábit enim quasi páleas ferrum, et quasi lignum pútridum, æs.
  "19": Non fugábit eum vir sagittárius, in stípulam versi sunt ei lápides fundæ.
  "20": Quasi stípulam æstimábit málleum, et deridébit vibrántem hastam.
  "21": Sub ipso erunt rádii solis, et sternet sibi aurum quasi lutum.
  "22": Fervéscere fáciet quasi ollam profúndum mare, et ponet quasi cum unguénta búlliunt.
  "23": Post eum lucébit sémita, æstimábit abýssum quasi senescéntem.
  "24": Non est super terram potéstas, quæ comparétur ei, qui factus est ut nullum timéret.
  "25": Omne sublíme videt, ipse est rex super univérsos fílios supérbiæ.
