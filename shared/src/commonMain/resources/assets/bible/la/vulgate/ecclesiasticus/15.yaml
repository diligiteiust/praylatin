bible: vulgate
lang: la
language: Latina
book: Ecclesiasticus
chapter: "15"
verses:
  "1": 'Qui timet Deum, fáciet bona: et qui cóntinens est iustítiæ, apprehéndet illam,'
  "2": et obviábit illi quasi mater honorificáta, et quasi múlier a virginitáte suscípiet illum.
  "3": 'Cibábit illum pane vitæ et intelléctus, et aqua sapiéntiæ salutáris potábit illum: et firmábitur in illo, et non flectétur:'
  "4": 'et continébit illum, et non confundétur: et exaltábit illum apud próximos suos:'
  "5": et in médio ecclésiæ apériet os eius, et adimplébit illum spíritu sapiéntiæ et intelléctus, et stola glóriæ véstiet illum.
  "6": Iucunditátem et exsultatiónem thesaurizábit super illum, et nómine ætérno hereditábit illum.
  "7": 'Hómines stulti non apprehéndent illam, et hómines sensáti obviábunt illi. Hómines stulti non vidébunt eam: longe enim abest a supérbia et dolo.'
  "8": 'Viri mendáces non erunt illíus mémores: et viri veráces inveniéntur in illa, et succéssum habébunt usque ad inspectiónem Dei.'
  "9": 'Non est speciósa laus in ore peccatóris:'
  "10": 'quóniam a Deo profécta est sapiéntia: sapiéntiæ enim Dei astábit laus, et in ore fidéli abundábit, et Dominátor dabit eam illi.'
  "11": 'Non díxeris: Per Deum abest: quæ enim odit ne féceris.'
  "12": 'Non dicas: Ille me implanávit: non enim necessárii sunt ei hómines ímpii.'
  "13": Omne exsecraméntum erróris odit Dóminus, et non erit amábile timéntibus eum.
  "14": Deus ab inítio constítuit hóminem, et relíquit illum in manu consílii sui.
  "15": 'Adiécit mandáta et præcépta sua:'
  "16": si volúeris mandáta serváre, conservábunt te, et in perpétuum fidem plácitam fácere.
  "17": 'Appósuit tibi aquam et ignem: ad quod volúeris porríge manum tuam.'
  "18": 'Ante hóminem vita et mors, bonum et malum: quod placúerit ei, dábitur illi:'
  "19": quóniam multa sapiéntia Dei, et fortis in poténtia, videns omnes sine intermissióne.
  "20": Oculi Dómini ad timéntes eum, et ipse agnóscit omnem óperam hóminis.
  "21": 'Némini mandávit ímpie ágere, et némini dedit spátium peccándi:'
  "22": non enim concupíscit multitúdinem filiórum infidélium et inutílium.
