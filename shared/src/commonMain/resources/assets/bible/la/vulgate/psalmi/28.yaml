bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "28"
verses:
  "1": 'Psalmus David. In consummatióne tabernáculi. Afférte Dómino fílii Dei: afférte Dómino fílios aríetum.'
  "2": 'Afférte Dómino glóriam et honórem, afférte Dómino glóriam nómini eius: adoráte Dóminum in átrio sancto eius.'
  "3": 'Vox Dómini super aquas, Deus maiestátis intónuit: Dóminus super aquas multas.'
  "4": 'Vox Dómini in virtúte: vox Dómini in magnificéntia.'
  "5": 'Vox Dómini confringéntis cedros: et confrínget Dóminus cedros Líbani:'
  "6": 'et commínuet eas tamquam vítulum Líbani: et diléctus quemádmodum fílius unicórnium.'
  "7": 'Vox Dómini intercidéntis flammam ignis:'
  "8": 'vox Dómini concutiéntis desértum: et commovébit Dóminus desértum Cades.'
  "9": 'Vox Dómini præparántis cervos, et revelábit condénsa: et in templo eius omnes dicent glóriam.'
  "10": 'Dóminus dilúvium inhabitáre facit: et sedébit Dóminus rex in ætérnum.'
  "11": 'Dóminus virtútem pópulo suo dabit: Dóminus benedícet pópulo suo in pace.'
