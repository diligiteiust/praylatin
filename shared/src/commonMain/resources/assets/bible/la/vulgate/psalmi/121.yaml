bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "121"
verses:
  "1": 'Cánticum gráduum. Lætátus sum in his, quæ dicta sunt mihi: In domum Dómini íbimus.'
  "2": Stantes erant pedes nostri, in átriis tuis Ierúsalem.
  "3": 'Ierúsalem, quæ ædificátur ut cívitas: cuius participátio eius in idípsum.'
  "4": 'Illuc enim ascendérunt tribus, tribus Dómini: testimónium Israel ad confiténdum nómini Dómini.'
  "5": Quia illic sedérunt sedes in iudício, sedes super domum David.
  "6": 'Rogáte quæ ad pacem sunt Ierúsalem: et abundántia diligéntibus te.'
  "7": 'Fiat pax in virtúte tua: et abundántia in túrribus tuis.'
  "8": 'Propter fratres meos et próximos meos, loquébar pacem de te:'
  "9": propter domum Dómini Dei nostri, quæsívi bona tibi.
