bible: vulgate
lang: la
language: Latina
book: Marcus
chapter: "16"
verses:
  "1": Et cum transísset sábbatum, María Magdaléne, et María Iacóbi, et Salóme emérunt arómata ut veniéntes úngerent Iesum.
  "2": Et valde mane una sabbatórum, véniunt ad monuméntum, orto iam sole.
  "3": 'Et dicébant ad ínvicem: Quis revólvet nobis lápidem ab óstio monuménti?'
  "4": Et respiciéntes vidérunt revolútum lápidem. Erat quippe magnus valde.
  "5": Et introeúntes in monuméntum vidérunt iúvenem sedéntem in dextris, coopértum stola cándida, et obstupuérunt.
  "6": 'Qui dicit illis: Nolíte expavéscere: Iesum quǽritis Nazarénum, crucifíxum: surréxit, non est hic, ecce locus ubi posuérunt eum.'
  "7": 'Sed ite, dícite discípulis eius, et Petro, quia præcédit vos in Galilǽam: ibi eum vidébitis, sicut dixit vobis.'
  "8": 'At illæ exeúntes, fugérunt de monuménto: inváserat enim eas tremor et pavor: et némini quidquam dixérunt: timébant enim.'
  "9": Surgens autem mane prima sábbati, appáruit primo Maríæ Magdaléne, de qua eiécerat septem dæmónia.
  "10": Illa vadens nuntiávit his, qui cum eo fúerant, lugéntibus, et fléntibus.
  "11": Et illi audiéntes quia víveret, et visus esset ab ea, non credidérunt.
  "12": 'Post hæc autem duóbus ex his ambulántibus osténsus est in ália effígie, eúntibus in villam:'
  "13": 'et illi eúntes nuntiavérunt céteris: nec illis credidérunt.'
  "14": 'Novíssime recumbéntibus illis úndecim appáruit: et exprobrávit incredulitátem eórum et durítiam cordis: quia iis, qui víderant eum resurrexísse, non credidérunt.'
  "15": 'Et dixit eis: Eúntes in mundum univérsum prædicáte Evangélium omni creatúræ.'
  "16": 'Qui credíderit, et baptizátus fúerit, salvus erit: qui vero non credíderit, condemnábitur.'
  "17": 'Signa autem eos, qui credíderint, hæc sequéntur: In nómine meo dæmónia eícient: linguis loquéntur novis:'
  "18": 'serpéntes tollent: et si mortíferum quid bíberint, non eis nocébit: super ægros manus impónent, et bene habébunt.'
  "19": Et Dóminus quidem Iesus postquam locútus est eis, assúmptus est in cælum, et sedet a dextris Dei.
  "20": Illi autem profécti prædicavérunt ubíque, Dómino cooperánte, et sermónem confirmánte, sequéntibus signis.
