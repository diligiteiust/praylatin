bible: vulgate
lang: la
language: Latina
book: Proverbia
chapter: "10"
verses:
  "1": '[Parábolæ Salomónis] Fílius sápiens lætíficat patrem: fílius vero stultus mœstítia est matris suæ.'
  "2": 'Nil próderunt thesáuri impietátis: iustítia vero liberábit a morte.'
  "3": Non afflíget Dóminus fame ánimam iusti, et insídias impiórum subvértet.
  "4": 'Egestátem operáta est manus remíssa: manus autem fórtium divítias parat. Qui nítitur mendáciis, hic pascit ventos: idem autem ipse séquitur aves volántes.'
  "5": 'Qui cóngregat in messe, fílius sápiens est: qui autem stertit æstáte, fílius confusiónis.'
  "6": 'Benedíctio Dómini super caput iusti: os autem impiórum óperit iníquitas.'
  "7": Memória iusti cum láudibus, et nomen impiórum putréscet.
  "8": 'Sápiens corde præcépta súscipit: stultus cǽditur lábiis.'
  "9": 'Qui ámbulat simplíciter, ámbulat confidénter: qui autem deprávat vias suas, maniféstus erit.'
  "10": 'Qui ánnuit óculo dabit dolórem: et stultus lábiis verberábitur.'
  "11": 'Vena vitæ, os iusti: et os impiórum óperit iniquitátem.'
  "12": 'Odium súscitat rixas: et univérsa delícta óperit cáritas.'
  "13": 'In lábiis sapiéntis invenítur sapiéntia: et virga in dorso eius qui índiget corde.'
  "14": 'Sapiéntes abscóndunt sciéntiam: os autem stulti confusióni próximum est.'
  "15": 'Substántia dívitis, urbs fortitúdinis eius: pavor páuperum, egéstas eórum.'
  "16": 'Opus iusti ad vitam: fructus autem ímpii ad peccátum.'
  "17": 'Via vitæ custodiénti disciplínam: qui autem increpatiónes relínquit, errat.'
  "18": 'Abscóndunt ódium lábia mendácia: qui profert contuméliam, insípiens est.'
  "19": 'In multilóquio non déerit peccátum: qui autem moderátur lábia sua prudentíssimus est.'
  "20": 'Argéntum eléctum, lingua iusti: cor autem impiórum pro níhilo.'
  "21": 'Lábia iusti erúdiunt plúrimos: qui autem indócti sunt, in cordis egestáte moriéntur.'
  "22": Benedíctio Dómini dívites facit, nec sociábitur eis afflíctio.
  "23": 'Quasi per risum stultus operátur scelus: sapiéntia autem est viro prudéntia.'
  "24": 'Quod timet ímpius véniet super eum: desidérium suum iustis dábitur.'
  "25": 'Quasi tempéstas tránsiens non erit ímpius: iustus autem quasi fundaméntum sempitérnum.'
  "26": Sicut acétum déntibus, et fumus óculis, sic piger his qui misérunt eum.
  "27": 'Timor Dómini appónet dies: et anni impiórum breviabúntur.'
  "28": 'Exspectátio iustórum lætítia: spes autem impiórum períbit.'
  "29": 'Fortitúdo símplicis via Dómini: et pavor his, qui operántur malum.'
  "30": 'Iustus in ætérnum non commovébitur: ímpii autem non habitábunt super terram.'
  "31": 'Os iusti partúriet sapiéntiam: lingua pravórum períbit.'
  "32": Lábia iusti consíderant plácita, et os impiórum pervérsa.
