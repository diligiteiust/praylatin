bible: vulgate
lang: la
language: Latina
book: Genesis
chapter: "36"
verses:
  "1": Hæ sunt autem generatiónes Esau, ipse est Edom.
  "2": 'Esau accépit uxóres de filiábus Chánaan: Ada fíliam Elon Hethǽi, et Oolíbama fíliam Anæ fíliæ Sébeon Hevǽi:'
  "3": Básemath quoque fíliam Ismael sorórem Nábaioth.
  "4": 'Péperit autem Ada Eliphaz: Básemath génuit Ráhuel:'
  "5": 'Oolíbama génuit Iehus et Ihelon et Core: hi fílii Esau qui nati sunt ei in terra Chánaan.'
  "6": 'Tulit autem Esau uxóres suas et fílios et fílias, et omnem ánimam domus suæ, et substántiam, et pécora, et cuncta quæ habére póterat in terra Chánaan: et ábiit in álteram regiónem, recessítque a fratre suo Iacob.'
  "7": 'Dívites enim erant valde, et simul habitáre non póterant: nec sustinébat eos terra peregrinatiónis eórum præ multitúdine gregum.'
  "8": Habitavítque Esau in monte Seir, ipse est Edom.
  "9": Hæ autem sunt generatiónes Esau patris Edom in monte Seir,
  "10": 'et hæc nómina filiórum eius: Eliphaz fílius Ada uxóris Esau: Ráhuel quoque fílius Básemath uxóris eius.'
  "11": 'Fuerúntque Eliphaz fílii: Theman, Omar, Sepho, et Gatham, et Cenez.'
  "12": 'Erat autem Thamna concubína Eliphaz fílii Esau: quæ péperit ei Amalech. Hi sunt fílii Ada uxóris Esau.'
  "13": 'Fílii autem Ráhuel: Nahath et Zara, Samma et Meza: hi fílii Básemath uxóris Esau.'
  "14": Isti quoque erant fílii Oolíbama fíliæ Anæ fíliæ Sébeon, uxóris Esau, quos génuit ei, Iehus et Ihelon et Core.
  "15": 'Hi duces filiórum Esau: fílii Eliphaz primogéniti Esau: dux Theman, dux Omra, dux Sepho, dux Cenez,'
  "16": dux Core, dux Gathan, dux Amalech. Hi fílii Eliphaz in terra Edom, et hi fílii Ada.
  "17": 'Hi quoque fílii Ráhuel fílii Esau: dux Nahath, dux Zara, dux Samma, dux Meza: hi autem duces Ráhuel in terra Edom: isti fílii Básemath uxóris Esau.'
  "18": 'Hi autem fílii Oolíbama uxóris Esau: dux Iehus, dux Ihelon, dux Core: hi duces Oolíbama fíliæ Anæ uxóris Esau.'
  "19": 'Isti sunt fílii Esau, et hi duces eórum: ipse est Edom.'
  "20": 'Isti sunt fílii Seir Horrǽi, habitatóres terræ: Lotan, et Sobal, et Sébeon, et Ana,'
  "21": 'et Dison, et Eser, et Disan: hi duces Horrǽi, fílii Seir in terra Edom.'
  "22": 'Facti sunt autem fílii Lotan: Hori et Heman. Erat autem soror Lotan, Thamna.'
  "23": 'Et isti fílii Sobal: Alvan et Mánahat et Ebal, et Sepho et Onam.'
  "24": 'Et hi fílii Sébeon: Aia et Ana. Iste est Ana qui invénit aquas cálidas in solitúdine, cum pásceret ásinos Sébeon patris sui:'
  "25": habuítque fílium Dison, et fíliam Oolíbama.
  "26": 'Et isti fílii Dison: Hamdan, et Eseban, et Iethram, et Charan.'
  "27": 'Hi quoque fílii Eser: Bálaan, et Zavan, et Acan.'
  "28": 'Hábuit autem fílios Disan: Hus et Aram.'
  "29": 'Hi duces Horræórum: dux Lotan, dux Sobal, dux Sébeon, dux Ana,'
  "30": 'dux Dison, dux Eser, dux Disan: isti duces Horræórum qui imperavérunt in terra Seir.'
  "31": 'Reges autem qui regnavérunt in terra Edom ántequam habérent regem fílii Israel, fuérunt hi:'
  "32": Bela fílius Beor, noménque urbis eius Dénaba.
  "33": Mórtuus est autem Bela, et regnávit pro eo Iobab fílius Zaræ de Bosra.
  "34": Cumque mórtuus esset Iobab, regnávit pro eo Husam de terra Themanórum.
  "35": 'Hoc quoque mórtuo, regnávit pro eo Adad fílius Badad, qui percússit Mádian in regióne Moab: et nomen urbis eius Avith.'
  "36": Cumque mórtuus esset Adad, regnávit pro eo Semla de Másreca.
  "37": Hoc quoque mórtuo regnávit pro eo Saul de flúvio Róhoboth.
  "38": Cumque et hic obiísset, succéssit in regnum Bálanan fílius Achobor.
  "39": 'Isto quoque mórtuo regnávit pro eo Adar, noménque urbis eius Phau: et appellabátur uxor eius Meétabel, fília Matred fíliæ Mézaab.'
  "40": 'Hæc ergo nómina ducum Esau in cognatiónibus, et locis, et vocábulis suis: dux Thamna, dux Alva, dux Ietheth,'
  "41": dux Oolíbama, dux Ela, dux Phinon,
  "42": dux Cenez, dux Theman, dux Mabsar,
  "43": 'dux Mágdiel, dux Hiram: hi duces Edom habitántes in terra impérii sui, ipse est Esau pater Idumæórum.'
