bible: vulgate
lang: la
language: Latina
book: Sapientia
chapter: "12"
verses:
  "1": O quam bonus et suávis est Dómine spíritus tuus in ómnibus!
  "2": 'Ideóque eos, qui exérrant, pártibus córripis: et de quibus peccant, ádmones et allóqueris: ut relícta malítia, credant in te Dómine.'
  "3": Illos enim antíquos inhabitatóres terræ sanctæ tuæ, quos exhorruísti,
  "4": quóniam odibília ópera tibi faciébant per medicámina, et sacrifícia iniústa,
  "5": et filiórum suórum necatóres sine misericórdia, et comestóres víscerum hóminum, et devoratóres sánguinis a médio sacraménto tuo,
  "6": 'et auctóres paréntes animárum inauxiliatárum, pérdere voluísti per manus paréntum nostrórum:'
  "7": ut dignam percíperent peregrinatiónem puerórum Dei, quæ tibi ómnium cárior est terra.
  "8": Sed et his tamquam homínibus pepercísti, et misísti antecessóres exércitus tui vespas, ut illos paulátim exterminárent.
  "9": 'Non quia ímpotens eras in bello subícere ímpios iustis, aut béstiis sævis, aut verbo duro simul extermináre:'
  "10": sed pártibus iúdicans, dabas locum pœniténtiæ, non ignórans quóniam nequam est nátio eórum, et naturális malítia ipsórum, et quóniam non póterat mutári cogitátio illórum in perpétuum.
  "11": 'Semen enim erat maledíctum ab inítio: nec timens áliquem, véniam dabas peccátis illórum.'
  "12": 'Quis enim dicet tibi: Quid fecísti? aut quis stabit contra iudícium tuum? aut quis in conspéctu tuo véniet vindex iniquórum hóminum? aut quis tibi imputábit, si períerint natiónes, quas tu fecísti?'
  "13": Non enim est álius Deus quam tu, cui cura est de ómnibus, ut osténdas quóniam non iniúste iúdicas iudícium.
  "14": Neque rex, neque tyránnus in conspéctu tuo inquírent de his, quos perdidísti.
  "15": 'Cum ergo sis iustus, iuste ómnia dispónis: ipsum quoque, qui non debet puníri, condemnáre, éxterum ǽstimas a tua virtúte.'
  "16": 'Virtus enim tua iustítiæ inítium est: et ob hoc quod Dóminus es, ómnibus te párcere facis.'
  "17": Virtútem enim osténdis tu, qui non créderis esse in virtúte consummátus, et horum qui te nésciunt audáciam tradúcis.
  "18": 'Tu autem dominátor virtútis, cum tranquillitáte iúdicas, et cum magna reveréntia dispónis nos: subest enim tibi, cum volúeris, posse.'
  "19": 'Docuísti autem pópulum tuum per tália ópera, quóniam opórtet iustum esse et humánum: et bonæ spei fecísti fílios tuos, quóniam iúdicans das locum in peccátis pœniténtiæ.'
  "20": 'Si enim inimícos servórum tuórum, et débitos morti, cum tanta cruciásti attentióne, dans tempus et locum, per quæ possent mutári a malítia:'
  "21": cum quanta diligéntia iudicásti fílios tuos, quorum paréntibus iuraménta et conventiónes dedísti bonárum promissiónum?
  "22": 'Cum ergo das nobis disciplínam, inimícos nostros multiplíciter flagéllas, ut bonitátem tuam cogitémus iudicántes: et cum de nobis iudicátur, sperémus misericórdiam tuam.'
  "23": Unde et illis, qui in vita sua insensáte et iniúste vixérunt, per hæc quæ coluérunt dedísti summa torménta.
  "24": Etenim in erróris via diútius erravérunt, deos æstimántes hæc, quæ in animálibus sunt supervácua, infántium insensatórum more vivéntes.
  "25": Propter hoc tamquam púeris insensátis iudícium in derísum dedísti.
  "26": Qui autem ludíbriis et increpatiónibus non sunt corrécti, dignum Dei iudícium expérti sunt.
  "27": 'In quibus enim patiéntes indignabántur, per hæc quos putábant deos, in ipsis cum exterminaréntur vidéntes, illum quem olim negábant se nosse, verum Deum agnovérunt: propter quod et finis condemnatiónis eórum venit super illos.'
