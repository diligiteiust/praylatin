bible: vulgate
lang: la
language: Latina
book: Osee
chapter: "7"
verses:
  "1": 'Cum sanáre vellem Israel, reveláta est iníquitas Ephraim, et malítia Samaríæ, quia operáti sunt mendácium: et fur ingréssus est spólians, latrúnculus foris.'
  "2": 'Et ne forte dicant in córdibus suis, omnem malítiam eórum me recordátum: nunc circumdedérunt eos adinventiónes suæ, coram fácie mea factæ sunt.'
  "3": 'In malítia sua lætificavérunt regem: et in mendáciis suis príncipes.'
  "4": 'Omnes adulterántes, quasi clíbanus succénsus a coquénte: quiévit páululum cívitas a commistióne ferménti, donec fermentarétur totum.'
  "5": 'Dies regis nostri: cœpérunt príncipes fúrere a vino: exténdit manum suam cum illusóribus.'
  "6": 'Quia applicuérunt quasi clíbanum cor suum, cum insidiarétur eis: tota nocte dormívit coquens eos, mane ipse succénsus quasi ignis flammæ.'
  "7": 'Omnes calefácti sunt quasi clíbanus, et devoravérunt iúdices suos: omnes reges eórum cecidérunt: non est qui clamet in eis ad me.'
  "8": 'Ephraim in pópulis ipse commiscebátur: Ephraim factus est subcinerícius panis, qui non reversátur.'
  "9": 'Comedérunt aliéni robur eius, et ipse nescívit: sed et cani effúsi sunt in eo, et ipse ignorávit.'
  "10": 'Et humiliábitur supérbia Israel in fácie eius: nec revérsi sunt ad Dóminum Deum suum, et non quæsiérunt eum in ómnibus his.'
  "11": 'Et factus est Ephraim quasi colúmba sedúcta non habens cor: Ægýptum invocábant, ad Assýrios abiérunt.'
  "12": 'Et cum profécti fúerint, expándam super eos rete meum: quasi vólucrem cæli détraham eos, cædam eos secúndum auditiónem cœtus eórum.'
  "13": 'Væ eis, quóniam recessérunt a me: vastabúntur, quia prævaricáti sunt in me, et ego redémi eos: et ipsi locúti sunt contra me mendácia.'
  "14": 'Et non clamavérunt ad me in corde suo, sed ululábant in cubílibus suis: super tríticum et vinum ruminábant, recessérunt a me.'
  "15": 'Et ego erudívi eos, et confortávi bráchia eórum: et in me cogitavérunt malítiam.'
  "16": 'Revérsi sunt ut essent absque iugo: facti sunt quasi arcus dolósus: cadent in gládio príncipes eórum, a furóre linguæ suæ. Ista subsannátio eórum in terra Ægýpti.'
