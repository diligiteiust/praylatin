bible: vulgate
lang: la
language: Latina
book: I Samuelis
chapter: "8"
verses:
  "1": Factum est autem cum senuísset Sámuel, pósuit fílios suos iúdices Israel.
  "2": 'Fuítque nomen fílii eius primogéniti Ioel: et nomen secúndi Abía, iúdicum in Bersabée.'
  "3": 'Et non ambulavérunt fílii illíus in viis eius: sed declinavérunt post avarítiam, acceperúntque múnera, et pervertérunt iudícium.'
  "4": Congregáti ergo univérsi maióres natu Israel, venérunt ad Samuélem in Rámatha.
  "5": 'Dixerúntque ei: Ecce tu senuísti, et fílii tui non ámbulant in viis tuis: constítue nobis regem, ut iúdicet nos, sicut et univérsæ habent natiónes.'
  "6": 'Displícuit sermo in óculis Samuélis, eo quod dixíssent: Da nobis regem, ut iúdicet nos. Et orávit Sámuel ad Dóminum.'
  "7": 'Dixit autem Dóminus ad Samuélem: Audi vocem pópuli in ómnibus quæ loquúntur tibi: non enim te abiecérunt, sed me, ne regnem super eos.'
  "8": 'Iuxta ómnia ópera sua, quæ fecérunt a die qua edúxi eos de Ægýpto usque ad diem hanc: sicut dereliquérunt me, et serviérunt diis aliénis, sic fáciunt étiam tibi.'
  "9": 'Nunc ergo vocem eórum audi: verúmtamen contestáre eos, et prædic eis ius regis, qui regnatúrus est super eos.'
  "10": Dixit ítaque Sámuel ómnia verba Dómini ad pópulum, qui petíerat a se regem.
  "11": 'Et ait: Hoc erit ius regis, qui imperatúrus est vobis: fílios vestros tollet, et ponet in cúrribus suis: faciétque sibi équites et præcursóres quadrigárum suárum,'
  "12": et constítuet sibi tribúnos, et centuriónes, et aratóres agrórum suórum, et messóres ségetum, et fabros armórum et cúrruum suórum.
  "13": Fílias quoque vestras fáciet sibi unguentárias, et focárias, et paníficas.
  "14": Agros quoque vestros, et víneas, et olivéta óptima tollet, et dabit servis suis.
  "15": Sed et ségetes vestras, et vineárum réditus addecimábit, ut det eunúchis et fámulis suis.
  "16": Servos étiam vestros, et ancíllas, et iúvenes óptimos, et ásinos áuferet, et ponet in ópere suo.
  "17": Greges quoque vestros addecimábit, vosque éritis ei servi.
  "18": 'Et clamábitis in die illa a fácie regis vestri, quem elegístis vobis: et non exáudiet vos Dóminus in die illa, quia petístis vobis regem.'
  "19": 'Nóluit autem pópulus audíre vocem Samuélis, sed dixérunt: Nequáquam: rex enim erit super nos,'
  "20": 'et érimus nos quoque sicut omnes gentes: et iudicábit nos rex noster, et egrediétur ante nos, et pugnábit bella nostra pro nobis.'
  "21": Et audívit Sámuel ómnia verba pópuli, et locútus est ea in áuribus Dómini.
  "22": 'Dixit autem Dóminus ad Samuélem: Audi vocem eórum, et constítue super eos regem. Et ait Sámuel ad viros Israel: Vadat unusquísque in civitátem suam.'
