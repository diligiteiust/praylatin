bible: vulgate
lang: la
language: Latina
book: Sapientia
chapter: "8"
verses:
  "1": Attíngit ergo a fine usque ad finem fórtiter, et dispónit ómnia suáviter.
  "2": Hanc amávi, et exquisívi a iuventúte mea, et quæsívi sponsam mihi eam assúmere, et amátor factus sum formæ illíus.
  "3": 'Generositátem illíus gloríficat, contubérnium habens Dei: sed et ómnium Dóminus diléxit illam.'
  "4": Doctrix enim est disciplínæ Dei, et eléctrix óperum illíus.
  "5": Et si divítiæ appetúntur in vita, quid sapiéntia locuplétius, quæ operátur ómnia?
  "6": 'Si autem sensus operátur: quis horum, quæ sunt, magis quam illa est ártifex?'
  "7": 'Et si iustítiam quis díligit, labóres huius magnas habent virtútes: sobrietátem enim, et prudéntiam docet, et iustítiam, et virtútem, quibus utílius nihil est in vita homínibus.'
  "8": 'Et si multitúdinem sciéntiæ desíderat quis, scit prætérita, et de futúris ǽstimat: scit versútias sermónum, et dissolutiónes argumentórum: signa et monstra scit ántequam fiant, et evéntus témporum et sæculórum.'
  "9": 'Propósui ergo hanc addúcere mihi ad convivéndum: sciens quóniam mecum communicábit de bonis, et erit allocútio cogitatiónis et tǽdii mei.'
  "10": 'Habébo propter hanc claritátem ad turbas, et honórem apud senióres iúvenis:'
  "11": 'et acútus invéniar in iudício, et in conspéctu poténtium admirábilis ero, et fácies príncipum mirabúntur me:'
  "12": tacéntem me sustinébunt, et loquéntem me respícient, et sermocinánte me plura, manus ori suo impónent.
  "13": Prætérea habébo per hanc immortalitátem, et memóriam ætérnam his, qui post me futúri sunt, relínquam.
  "14": Dispónam pópulos, et natiónes mihi erunt súbditæ.
  "15": 'Timébunt me audiéntes reges horréndi: in multitúdine vidébor bonus, et in bello fortis.'
  "16": 'Intrans in domum meam, conquiéscam cum illa: non enim habet amaritúdinem conversátio illíus, nec tǽdium convíctus illíus, sed lætítiam et gáudium.'
  "17": 'Hæc cógitans apud me, et commémorans in corde meo: quóniam immortálitas est in cognatióne sapiéntiæ,'
  "18": 'et in amicítia illíus delectátio bona, et in opéribus mánuum illíus honéstas sine defectióne, et in certámine loquélæ illíus sapiéntia, et præcláritas in communicatióne sermónum ipsíus: circuíbam quærens, ut mihi illam assúmerem.'
  "19": Puer autem eram ingeniósus, et sortítus sum ánimam bonam.
  "20": Et cum essem magis bonus, veni ad corpus incoinquinátum.
  "21": 'Et ut scivi quóniam áliter non possem esse cóntinens, nisi Deus det: et hoc ipsum erat sapiéntiæ, scire cuius esset hoc donum: ádii Dóminum, et deprecátus sum illum, et dixi ex totis præcórdiis meis:'
