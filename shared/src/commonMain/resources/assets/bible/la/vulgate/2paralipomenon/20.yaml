bible: vulgate
lang: la
language: Latina
book: II Paralipomenon
chapter: "20"
verses:
  "1": Post hæc congregáti sunt fílii Moab, et fílii Ammon, et cum eis de Ammonítis, ad Iósaphat, ut pugnárent contra eum.
  "2": 'Venerúntque núntii, et indicavérunt Iósaphat, dicéntes: Venit contra te multitúdo magna de his locis, quæ trans mare sunt, et de Sýria: et ecce consístunt in Asasónthamar, quæ est Engáddi.'
  "3": Iósaphat autem timóre pertérritus, totum se cóntulit ad rogándum Dóminum, et prædicávit ieiúnium univérso Iuda.
  "4": 'Congregatúsque est Iudas ad deprecándum Dóminum: sed et omnes de úrbibus suis venérunt ad obsecrándum eum.'
  "5": Cumque stetísset Iósaphat in médio cœtu Iuda, et Ierúsalem, in domo Dómini ante átrium novum,
  "6": 'ait: Dómine Deus patrum nostrórum, tu es Deus in cælo, et domináris cunctis regnis géntium, in manu tua est fortitúdo et poténtia, nec quisquam tibi potest resístere.'
  "7": Nonne tu Deus noster interfecísti omnes habitatóres terræ huius coram pópulo tuo Israel, et dedísti eam sémini Abraham amíci tui in sempitérnum?
  "8": 'Habitaverúntque in ea, et exstruxérunt in illa sanctuárium nómini tuo, dicéntes:'
  "9": 'Si irrúerint super nos mala, gládius iudícii, pestiléntia, et fames, stábimus coram domo hac in conspéctu tuo, in qua invocátum est nomen tuum: et clamábimus ad te in tribulatiónibus nostris, et exáudies, salvósque fácies.'
  "10": 'Nunc ígitur ecce fílii Ammon, et Moab, et mons Seir, per quos non concessísti Israel ut transírent quando egrediebántur de Ægýpto, sed declinavérunt ab eis, et non interfecérunt illos:'
  "11": e contrário agunt, et nitúntur eícere nos de possessióne, quam tradidísti nobis.
  "12": Deus noster, ergo non iudicábis eos? in nobis quidem non est tanta fortitúdo, ut possímus huic multitúdini resístere. Sed cum ignorémus quid ágere debeámus, hoc solum habémus resídui, ut óculos nostros dirigámus ad te.
  "13": Omnis vero Iuda stabat coram Dómino cum párvulis, et uxóribus, et líberis suis.
  "14": Erat autem Iaháziel fílius Zacharíæ fílii Banaíæ fílii Iéhiel fílii Mathaníæ, Levítes de fíliis Asaph, super quem factus est Spíritus Dómini in médio turbæ,
  "15": 'et ait: Atténdite omnis Iuda, et qui habitátis Ierúsalem, et tu rex Iósaphat: hæc dicit Dóminus vobis: Nolíte timére, nec paveátis hanc multitúdinem: non est enim vestra pugna, sed Dei.'
  "16": 'Cras descendétis contra eos: ascensúri enim sunt per clivum nómine Sis, et inveniétis illos in summitáte torréntis, qui est contra solitúdinem Iéruel.'
  "17": 'Non éritis vos qui dimicábitis, sed tantúmmodo confidénter state, et vidébitis auxílium Dómini super vos, o Iuda, et Ierúsalem: nolíte timére, nec paveátis: cras egrediémini contra eos, et Dóminus erit vobíscum.'
  "18": Iósaphat ergo, et Iuda, et omnes habitatóres Ierúsalem cecidérunt proni in terram coram Dómino, et adoravérunt eum.
  "19": Porro Levítæ de fíliis Caath, et de fíliis Core laudábant Dóminum Deum Israel voce magna in excélsum.
  "20": 'Cumque mane surrexíssent, egréssi sunt per desértum Thécue: profectísque eis, stans Iósaphat in médio eórum, dixit: Audíte me viri Iuda, et omnes habitatóres Ierúsalem: crédite in Dómino Deo vestro, et secúri éritis: crédite prophétis eius, et cuncta evénient próspera.'
  "21": 'Dedítque consílium pópulo, et státuit cantóres Dómini, ut laudárent eum in turmis suis, et antecéderent exércitum, ac voce cónsona dícerent: Confitémini Dómino, quóniam in ætérnum misericórdia eius.'
  "22": 'Cumque cœpíssent laudes cánere, vertit Dóminus insídias eórum in semetípsos, filiórum scílicet Ammon, et Moab, et montis Seir, qui egréssi fúerant ut pugnárent contra Iudam: et percússi sunt.'
  "23": 'Namque fílii Ammon, et Moab consurrexérunt advérsum habitatóres montis Seir, ut interfícerent et delérent eos: cumque hoc ópere perpetrássent, étiam in semetípsos versi, mútuis concidére vulnéribus.'
  "24": Porro Iuda cum venísset ad spéculam, quæ réspicit solitúdinem, vidit procul omnem late regiónem plenam cadavéribus, nec superésse quemquam, qui necem potuísset evádere.
  "25": 'Venit ergo Iósaphat, et omnis pópulus cum eo, ad detrahénda spólia mortuórum: invenerúntque inter cadávera váriam supelléctilem, vestes quoque, et vasa pretiosíssima, et diripuérunt, ita ut ómnia portáre non possent, nec per tres dies spólia auférre præ prædæ magnitúdine.'
  "26": 'Die autem quarto congregáti sunt in Valle benedictiónis: étenim quóniam ibi benedíxerant Dómino, vocavérunt locum illum Vallis benedictiónis usque in præséntem diem.'
  "27": Reversúsque est omnis vir Iuda, et habitatóres Ierúsalem, et Iósaphat ante eos in Ierúsalem cum lætítia magna, eo quod dedísset eis Dóminus gáudium de inimícis suis.
  "28": Ingressíque sunt in Ierúsalem cum psaltériis, et cítharis, et tubis in domum Dómini.
  "29": Irruit autem pavor Dómini super univérsa regna terrárum, cum audíssent quod pugnásset Dóminus contra inimícos Israel.
  "30": Quievítque regnum Iósaphat, et prǽbuit ei Deus pacem per circúitum.
  "31": 'Regnávit ígitur Iósaphat super Iudam, et erat trigínta quinque annórum cum regnáre cœpísset: vigínti autem et quinque annis regnávit in Ierúsalem, et nomen matris eius Azuba fília Sélahi.'
  "32": Et ambulávit in via patris sui Asa, nec declinávit ab ea, fáciens quæ plácita erant coram Dómino.
  "33": Verúmtamen excélsa non ábstulit, et adhuc pópulus non diréxerat cor suum ad Dóminum Deum patrum suórum.
  "34": Réliqua autem gestórum Iósaphat priórum et novissimórum scripta sunt in verbis Iehu fílii Hánani, quæ digéssit in Libros regum Israel.
  "35": Post hæc íniit amicítias Iósaphat rex Iuda cum Ochozía rege Israel, cuius ópera fuérunt impiíssima.
  "36": 'Et párticeps fuit, ut fácerent naves, quæ irent in Tharsis: fecerúntque classem in Asióngaber.'
  "37": 'Prophetávit autem Eliézer fílius Dodau de Marésa ad Iósaphat, dicens: Quia habuísti fœdus cum Ochozía, percússit Dóminus ópera tua, contritǽque sunt naves, nec potuérunt ire in Tharsis.'
