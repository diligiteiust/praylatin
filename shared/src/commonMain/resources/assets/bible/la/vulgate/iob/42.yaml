bible: vulgate
lang: la
language: Latina
book: Iob
chapter: "42"
verses:
  "1": 'Respóndens autem Iob Dómino, dixit:'
  "2": Scio quia ómnia potes, et nulla te latet cogitátio.
  "3": Quis est iste, qui celat consílium absque sciéntia? ídeo insipiénter locútus sum, et quæ ultra modum excéderent sciéntiam meam.
  "4": 'Audi, et ego loquar: interrogábo te, et respónde mihi.'
  "5": Audítu auris audívi te, nunc autem óculus meus videt te.
  "6": Idcírco ipse me reprehéndo, et ago pœniténtiam in favílla et cínere.
  "7": 'Postquam autem locútus est Dóminus verba hæc ad Iob, dixit ad Eliphaz Themanítem: Irátus est furor meus in te, et in duos amícos tuos, quóniam non estis locúti coram me rectum, sicut servus meus Iob.'
  "8": 'Súmite ergo vobis septem tauros, et septem aríetes, et ite ad servum meum Iob, et offérte holocáustum pro vobis: Iob autem servus meus orábit pro vobis: fáciem eius suscípiam ut non vobis imputétur stultítia: neque enim locúti estis ad me recta, sicut servus meus Iob.'
  "9": Abiérunt ergo Eliphaz Themanítes, et Baldad Suhítes, et Sophar Naamathítes, et fecérunt sicut locútus fúerat Dóminus ad eos, et suscépit Dóminus fáciem Iob.
  "10": Dóminus quoque convérsus est ad pœniténtiam Iob, cum oráret ille pro amícis suis. Et áddidit Dóminus ómnia quæcúmque fúerant Iob, duplícia.
  "11": 'Venérunt autem ad eum omnes fratres sui, et univérsæ soróres suæ, et cuncti qui nóverant eum prius, et comedérunt cum eo panem in domo eius: et movérunt super eum caput, et consoláti sunt eum super omni malo quod intúlerat Dóminus super eum: et dedérunt ei unusquísque ovem unam, et ináurem áuream unam.'
  "12": Dóminus autem benedíxit novíssimis Iob magis quam princípio eius. Et facta sunt ei quatuórdecim míllia óvium, et sex míllia camelórum, et mille iuga boum, et mille ásinæ.
  "13": Et fuérunt ei septem fílii, et tres fíliæ.
  "14": Et vocávit nomen uníus Diem, et nomen secúndæ Cássiam, et nomen tértiæ Cornustíbii.
  "15": 'Non sunt autem invéntæ mulíeres speciósæ sicut fíliæ Iob in univérsa terra: dedítque eis pater suus hereditátem inter fratres eárum.'
  "16": Vixit autem Iob post hæc centum quadragínta annis, et vidit fílios suos, et fílios filiórum suórum usque ad quartam generatiónem, et mórtuus est senex, et plenus diérum.
