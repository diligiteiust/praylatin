bible: vulgate
lang: la
language: Latina
book: Proverbia
chapter: "30"
verses:
  "1": 'Verba Congregántis, fílii Voméntis. Vísio, quam locútus est vir cum quo est Deus, et qui Deo secum moránte confortátus, ait:'
  "2": Stultíssimus sum virórum, et sapiéntia hóminum non est mecum.
  "3": Non dídici sapiéntiam, et non novi sciéntiam sanctórum.
  "4": Quis ascéndit in cælum, atque descéndit? quis contínuit spíritum in mánibus suis? quis colligávit aquas quasi in vestiménto? quis suscitávit omnes términos terræ? quod nomen est eius, et quod nomen fílii eius, si nosti?
  "5": 'Omnis sermo Dei ignítus: clýpeus est sperántibus in se:'
  "6": ne addas quidquam verbis illíus, et arguáris inveniarísque mendax.
  "7": 'Duo rogávi te: ne déneges mihi ántequam móriar:'
  "8": 'vanitátem et verba mendácia longe fac a me: mendicitátem et divítias ne déderis mihi: tríbue tantum víctui meo necessária:'
  "9": 'ne forte satiátus illíciar ad negándum, et dicam: Quis est Dóminus? aut egestáte compúlsus, furer, et periúrem nomen Dei mei.'
  "10": Ne accúses servum ad dóminum suum, ne forte maledícat tibi, et córruas.
  "11": Generátio, quæ patri suo maledícit, et quæ matri suæ non benedícit.
  "12": Generátio, quæ sibi munda vidétur, et tamen non est lota a sórdibus suis.
  "13": Generátio, cuius excélsi sunt óculi, et pálpebræ eius in alta surréctæ.
  "14": Generátio, quæ pro déntibus gládios habet, et commándit moláribus suis, ut cómedat ínopes de terra, et páuperes ex homínibus.
  "15": 'Sanguisúgæ duæ sunt fíliæ, dicéntes: Affer, affer. Tria sunt insaturabília, et quartum quod numquam dicit: Súfficit.'
  "16": 'Inférnus, et os vulvæ, et terra, quæ non satiátur aqua: ignis vero numquam dicit: Súfficit.'
  "17": Oculum, qui subsánnat patrem, et qui déspicit partum matris suæ, effódiant eum corvi de torréntibus, et cómedant eum fílii áquilæ.
  "18": 'Tria sunt difficília mihi, et quartum pénitus ignóro:'
  "19": viam áquilæ in cælo, viam cólubri super petram, viam navis in médio mari, et viam viri in adolescéntia.
  "20": 'Talis est et via mulíeris adúlteræ, quæ cómedit, et tergens os suum dicit: Non sum operáta malum.'
  "21": 'Per tria movétur terra, et quartum non potest sustinére:'
  "22": 'per servum, cum regnáverit: per stultum, cum saturátus fúerit cibo:'
  "23": 'per odiósam mulíerem, cum in matrimónio fúerit assúmpta: et per ancíllam, cum fúerit heres dóminæ suæ.'
  "24": 'Quátuor sunt mínima terræ, et ipsa sunt sapientióra sapiéntibus:'
  "25": 'formícæ, pópulus infírmus, qui prǽparat in messe cibum sibi:'
  "26": 'lepúsculus, plebs inválida, qui cóllocat in petra cubíle suum:'
  "27": 'regem locústa non habet, et egréditur univérsa per turmas suas:'
  "28": stéllio mánibus nítitur, et morátur in ǽdibus regis.
  "29": 'Tria sunt, quæ bene gradiúntur, et quartum, quod incédit felíciter:'
  "30": 'leo fortíssimus bestiárum, ad nullíus pavébit occúrsum:'
  "31": 'gallus succínctus lumbos: et áries: nec est rex, qui resístat ei.'
  "32": 'Est qui stultus appáruit postquam elevátus est in sublíme: si enim intellexísset, ori suo imposuísset manum.'
  "33": 'Qui autem fórtiter premit úbera ad eliciéndum lac, éxprimit butýrum: et qui veheménter emúngit, élicit sánguinem: et qui próvocat iras prodúcit discórdias.'
