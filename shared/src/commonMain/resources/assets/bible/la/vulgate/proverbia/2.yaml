bible: vulgate
lang: la
language: Latina
book: Proverbia
chapter: "2"
verses:
  "1": Fili mi, si suscéperis sermónes meos, et mandáta mea abscónderis penes te,
  "2": 'ut áudiat sapiéntiam auris tua: inclína cor tuum ad cognoscéndam prudéntiam.'
  "3": 'Si enim sapiéntiam invocáveris, et inclináveris cor tuum prudéntiæ:'
  "4": 'si quæsíeris eam quasi pecúniam, et sicut thesáuros effóderis illam:'
  "5": 'tunc intélliges timórem Dómini, et sciéntiam Dei invénies:'
  "6": quia Dóminus dat sapiéntiam, et ex ore eius prudéntia et sciéntia.
  "7": Custódiet rectórum salútem, et próteget gradiéntes simplíciter,
  "8": servans sémitas iustítiæ, et vias sanctórum custódiens.
  "9": Tunc intélliges iustítiam, et iudícium, et æquitátem, et omnem sémitam bonam.
  "10": Si intráverit sapiéntia cor tuum, et sciéntia ánimæ tuæ placúerit,
  "11": 'consílium custódiet te, et prudéntia servábit te:'
  "12": 'ut eruáris a via mala, et ab hómine qui pervérsa lóquitur:'
  "13": 'qui relínquunt iter rectum, et ámbulant per vias tenebrósas:'
  "14": 'qui lætántur cum malefécerint, et exsúltant in rebus péssimis:'
  "15": quorum viæ pervérsæ sunt, et infámes gressus eórum.
  "16": Ut eruáris a mulíere aliéna, et ab extránea, quæ mollit sermónes suos,
  "17": et relínquit ducem pubertátis suæ,
  "18": 'et pacti Dei sui oblíta est. Inclináta est enim ad mortem domus eius, et ad ínferos sémitæ ipsíus:'
  "19": omnes, qui ingrediúntur ad eam non reverténtur, nec apprehéndent sémitas vitæ.
  "20": Ut ámbules in via bona, et calles iustórum custódias.
  "21": Qui enim recti sunt habitábunt in terra, et símplices permanébunt in ea.
  "22": 'Impii vero de terra perdéntur: et qui iníque agunt auferéntur ex ea.'
