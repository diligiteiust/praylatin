bible: vulgate
lang: la
language: Latina
book: Sapientia
chapter: "6"
verses:
  "1": 'Mélior est sapiéntia quam vires: et vir prudens quam fortis.'
  "2": 'Audíte ergo reges, et intellígite: díscite iúdices fínium terræ.'
  "3": 'Præbéte aures vos, qui continétis multitúdines, et placétis vobis in turbis natiónum:'
  "4": 'quóniam data est a Dómino potéstas vobis, et virtus ab Altíssimo, qui interrogábit ópera vestra, et cogitatiónes scrutábitur:'
  "5": quóniam cum essétis minístri regni illíus, non recte iudicástis, nec custodístis legem iustítiæ, neque secúndum voluntátem Dei ambulástis.
  "6": 'Horrénde et cito apparébit vobis: quóniam iudícium duríssimum his, qui præsunt, fiet.'
  "7": 'Exíguo enim concéditur misericórdia: poténtes autem poténter torménta patiéntur.'
  "8": 'Non enim súbtrahet persónam cuiúsquam Deus, nec verébitur magnitúdinem cuiúsquam: quóniam pusíllum et magnum ipse fecit, et æquáliter cura est illi de ómnibus.'
  "9": Fortióribus autem fórtior instat cruciátio.
  "10": 'Ad vos ergo reges sunt hi sermónes mei: ut discátis sapiéntiam, et non excidátis.'
  "11": 'Qui enim custodíerint iusta iuste, iustificabúntur: et qui didícerint ista, invénient quid respóndeant.'
  "12": 'Concupíscite ergo sermónes meos: dilígite illos, et habébitis disciplínam.'
  "13": Clara est, et quæ numquam marcéscit sapiéntia, et fácile vidétur ab his qui díligunt eam, et invenítur ab his qui quærunt illam.
  "14": Præóccupat qui se concupíscunt, ut illis se prior osténdat.
  "15": 'Qui de luce vigiláverit ad illam, non laborábit: assidéntem enim illam fóribus suis invéniet.'
  "16": 'Cogitáre ergo de illa, sensus est consummátus: et qui vigiláverit propter illam, cito secúrus erit.'
  "17": Quóniam dignos se ipsa círcuit quærens, et in viis osténdit se hiláriter, et in omni providéntia occúrrit illis.
  "18": Inítium enim illíus veríssima est disciplínæ concupiscéntia.
  "19": 'Cura ergo disciplínæ, diléctio est: et diléctio, custódia legum illíus est: custodítio autem legum, consummátio incorruptiónis est:'
  "20": incorrúptio autem facit esse próximum Deo.
  "21": Concupiscéntia ítaque sapiéntiæ dedúcit ad regnum perpétuum.
  "22": 'Si ergo delectámini sédibus et sceptris, o reges pópuli, dilígite sapiéntiam, ut in perpétuum regnétis:'
  "23": dilígite lumen sapiéntiæ omnes qui præéstis pópulis.
  "24": 'Quid est autem sapiéntia, et quemádmodum facta sit, réferam, et non abscóndam a vobis sacraménta Dei: sed ab inítio nativitátis investigábo, et ponam in lucem sciéntiam illíus, et non præteríbo veritátem.'
  "25": Neque cum invídia tabescénte iter habébo, quóniam talis homo non erit párticeps sapiéntiæ.
  "26": 'Multitúdo autem sapiéntium sánitas est orbis terrárum: et rex sápiens stabiliméntum pópuli est.'
  "27": Ergo accípite disciplínam per sermónes meos, et próderit vobis.
