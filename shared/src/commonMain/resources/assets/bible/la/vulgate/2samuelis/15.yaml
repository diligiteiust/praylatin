bible: vulgate
lang: la
language: Latina
book: II Samuelis
chapter: "15"
verses:
  "1": Igitur post hæc fecit sibi Absalom currus, et équites, et quinquagínta viros, qui præcéderent eum.
  "2": 'Et mane consúrgens Absalom, stabat iuxta intróitum portæ, et omnem virum, qui habébat negótium ut veníret ad regis iudícium, vocábat Absalom ad se, et dicébat: De qua civitáte es tu? Qui respóndens aiébat: Ex una tribu Israel ego sum servus tuus.'
  "3": 'Respondebátque ei Absalom: Vidéntur mihi sermónes tui boni et iusti. Sed non est qui te áudiat constitútus a rege. Dicebátque Absalom:'
  "4": Quis me constítuat iúdicem super terram, ut ad me véniant omnes, qui habent negótium, et iuste iúdicem?
  "5": Sed et cum accéderet ad eum homo ut salutáret illum, extendébat manum suam, et apprehéndens osculabátur eum.
  "6": Faciebátque hoc omni Israel veniénti ad iudícium ut audirétur a rege, et sollicitábat corda virórum Israel.
  "7": 'Post quadragínta autem annos, dixit Absalom ad regem David: Vadam, et reddam vota mea quæ vovi Dómino in Hebron.'
  "8": 'Vovens enim vovit servus tuus cum esset in Gessur Sýriæ, dicens: Si redúxerit me Dóminus in Ierúsalem, sacrificábo Dómino.'
  "9": 'Dixítque ei rex David: Vade in pace. Et surréxit, et ábiit in Hebron.'
  "10": 'Misit autem Absalom exploratóres in univérsas tribus Israel, dicens: Statim ut audiéritis clangórem búccinæ, dícite: Regnávit Absalom in Hebron.'
  "11": Porro cum Absalom iérunt ducénti viri de Ierúsalem vocáti, eúntes símplici corde, et causam pénitus ignorántes.
  "12": Accersívit quoque Absalom Achítophel Gilonítem consiliárium David, de civitáte sua Gilo. Cumque immoláret víctimas, facta est coniurátio válida, populúsque concúrrens augebátur cum Absalom.
  "13": 'Venit ígitur núntius ad David, dicens: Toto corde univérsus Israel séquitur Absalom.'
  "14": 'Et ait David servis suis, qui erant cum eo in Ierúsalem: Súrgite, fugiámus: neque enim erit nobis effúgium a fácie Absalom: festináte égredi, ne forte véniens óccupet nos, et impéllat super nos ruínam, et percútiat civitátem in ore gládii.'
  "15": 'Dixerúntque servi regis ad eum: Omnia quæcúmque præcéperit dóminus noster rex, libénter exsequémur servi tui.'
  "16": 'Egréssus est ergo rex, et univérsa domus eius pédibus suis: et derelíquit rex decem mulíeres concubínas ad custodiéndam domum.'
  "17": 'Egressúsque rex et omnis Israel pédibus suis, stetit procul a domo:'
  "18": et univérsi servi eius ambulábant iuxta eum, et legiónes Ceréthi, et Pheléthi, et omnes Gethǽi, pugnatóres válidi, sexcénti viri qui secúti eum fúerant de Geth pédites, præcedébant regem.
  "19": 'Dixit autem rex ad Ethái Gethǽum: Cur venis nobíscum? revértere, et hábita cum rege, quia peregrínus es, et egréssus es de loco tuo.'
  "20": 'Heri venísti, et hódie compélleris nobíscum égredi? Ego autem vadam quo itúrus sum: revértere, et reduc tecum fratres tuos, et Dóminus fáciet tecum misericórdiam, et veritátem, quia ostendísti grátiam et fidem.'
  "21": 'Et respóndit Ethái regi dicens: Vivit Dóminus, et vivit dóminus meus rex: quóniam in quocúmque loco fúeris dómine mi rex, sive in morte, sive in vita, ibi erit servus tuus.'
  "22": 'Et ait David Ethái: Veni, et transi. Et transívit Ethái Gethǽus, et omnes viri, qui cum eo erant, et réliqua multitúdo.'
  "23": 'Omnésque flebant voce magna, et univérsus pópulus transíbat: rex quoque transgrediebátur torréntem Cedron, et cunctus pópulus incedébat contra viam, quæ réspicit ad desértum.'
  "24": 'Venit autem et Sadoc sacérdos, et univérsi Levítæ cum eo, portántes arcam fœ́deris Dei: et deposuérunt arcam Dei. Et ascéndit Abíathar, donec explétus esset omnis pópulus, qui egréssus fúerat de civitáte.'
  "25": 'Et dixit rex ad Sadoc: Repórta arcam Dei in urbem: si invénero grátiam in óculis Dómini, redúcet me, et osténdet mihi eam, et tabernáculum suum.'
  "26": 'Si autem díxerit mihi: Non places: præsto sum, fáciat quod bonum est coram se.'
  "27": 'Et dixit rex ad Sadoc sacerdótem: O videns, revértere in civitátem in pace: et Achímaas fílius tuus, et Iónathas fílius Abíathar, duo fílii vestri, sint vobíscum.'
  "28": Ecce ego abscóndar in campéstribus desérti, donec véniat sermo a vobis índicans mihi.
  "29": 'Reportavérunt ergo Sadoc, et Abíathar arcam Dei in Ierúsalem: et mansérunt ibi.'
  "30": 'Porro David ascendébat clivum Olivárum, scandens et flens, nudis pédibus incédens, et opérto cápite: sed et omnis pópulus, qui erat cum eo, opérto cápite ascendébat plorans.'
  "31": 'Nuntiátum est autem David quod et Achítophel esset in coniuratióne cum Absalom: dixítque David: Infátua, quæso, Dómine, consílium Achítophel.'
  "32": Cumque ascénderet David summitátem montis, in quo adoratúrus erat Dóminum, ecce occúrrit ei Chúsai Arachítes, scissa veste, et terra pleno cápite.
  "33": 'Et dixit ei David: Si véneris mecum, eris mihi óneri:'
  "34": 'si autem in civitátem revertáris, et díxeris Absalom: Servus tuus sum, rex: sicut fui servus patris tui, sic ero servus tuus: dissipábis consílium Achítophel.'
  "35": 'Habes autem tecum Sadoc, et Abíathar sacerdótes: et omne verbum quodcúmque audíeris de domo regis, indicábis Sadoc, et Abíathar sacerdótibus.'
  "36": 'Sunt autem cum eis duo fílii eórum Achímaas fílius Sadoc, et Iónathas fílius Abíathar: et mittétis per eos ad me omne verbum quod audiéritis.'
  "37": Veniénte ergo Chúsai amíco David in civitátem, Absalom quoque ingréssus est Ierúsalem.
