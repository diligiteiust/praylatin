bible: vulgate
lang: la
language: Latina
book: Amos
chapter: "7"
verses:
  "1": 'Hæc osténdit mihi Dóminus Deus: et ecce fictor locústæ in princípio germinántium serótini imbris, et ecce serótinus post tonsiónem regis.'
  "2": 'Et factum est: cum consummásset comédere herbam terræ, dixi: Dómine Deus propítius esto, óbsecro: quis suscitábit Iacob, quia párvulus est?'
  "3": 'Misértus est Dóminus super hoc: Non erit, dixit Dóminus.'
  "4": 'Hæc osténdit mihi Dóminus Deus: et ecce vocábat iudícium ad ignem Dóminus Deus: et devorávit abýssum multam, et comédit simul partem.'
  "5": 'Et dixi: Dómine Deus quiésce, óbsecro: quis suscitábit Iacob, quia párvulus est?'
  "6": 'Misértus est Dóminus super hoc: Sed et istud non erit, dixit Dóminus Deus.'
  "7": 'Hæc osténdit mihi Dóminus: et ecce Dóminus stans super murum litum, et in manu eius trulla cæmentárii.'
  "8": 'Et dixit Dóminus ad me: Quid tu vides Amos? Et dixi: Trullam cæmentárii. Et dixit Dóminus: Ecce ego ponam trullam in médio pópuli mei Israel: non adíciam ultra superindúcere eum.'
  "9": 'Et demoliéntur excélsa idóli, et sanctificatiónes Israel desolabúntur: et consúrgam super domum Ieróboam in gládio.'
  "10": 'Et misit Amasías sacérdos Bethel ad Ieróboam regem Israel, dicens: Rebellávit contra te Amos in médio domus Israel: non póterit terra sustinére univérsos sermónes eius.'
  "11": 'Hæc enim dicit Amos: In gládio moriétur Ieróboam, et Israel captívus migrábit de terra sua.'
  "12": 'Et dixit Amasías ad Amos: Qui vides, grádere, fuge in terram Iuda: et cómede ibi panem, et prophetábis ibi.'
  "13": 'Et in Bethel non adícies ultra ut prophétes: quia sanctificátio regis est, et domus regni est.'
  "14": 'Respondítque Amos, et dixit ad Amasíam: Non sum prophéta, et non sum fílius prophétæ: sed armentárius ego sum véllicans sycómoros.'
  "15": 'Et tulit me Dóminus cum séquerer gregem, et dixit Dóminus ad me: Vade prophéta ad pópulum meum Israel.'
  "16": 'Et nunc audi verbum Dómini: Tu dicis: Non prophetábis super Israel, et non stillábis super domum idóli.'
  "17": 'Propter hoc hæc dicit Dóminus: Uxor tua in civitáte fornicábitur: et fílii tui, et fíliæ tuæ in gládio cadent, et humus tua funículo metiétur: et tu in terra pollúta moriéris, et Israel captívus migrábit de terra sua.'
