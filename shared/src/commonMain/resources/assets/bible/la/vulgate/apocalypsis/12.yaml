bible: vulgate
lang: la
language: Latina
book: Apocalypsis
chapter: "12"
verses:
  "1": 'Et signum magnum appáruit in cælo: múlier amícta sole, et luna sub pédibus eius, et in cápite eius coróna stellárum duódecim:'
  "2": et in útero habens, clamábat partúriens, et cruciabátur ut páriat.
  "3": 'Et visum est áliud signum in cælo: et ecce draco magnus rufus habens cápita septem, et córnua decem: et in capítibus eius diadémata septem,'
  "4": 'et cauda eius trahébat tértiam partem stellárum cæli, et misit eas in terram: et draco stetit ante mulíerem, quæ erat paritúra, ut cum peperísset, fílium eius devoráret.'
  "5": 'Et péperit fílium másculum, qui rectúrus erat omnes gentes in virga férrea: et raptus est fílius eius ad Deum, et ad thronum eius,'
  "6": et múlier fugit in solitúdinem ubi habébat locum parátum a Deo, ut ibi pascant eam diébus mille ducéntis sexagínta.
  "7": 'Et factum est prœ́lium magnum in cælo: Míchael, et ángeli eius prœliabántur cum dracóne, et draco pugnábat, et ángeli eius:'
  "8": et non valuérunt, neque locus invéntus est eórum ámplius in cælo.
  "9": 'Et proiéctus est draco ille magnus, serpens antíquus, qui vocátur diábolus, et Sátanas, qui sedúcit univérsum orbem: et proiéctus est in terram, et ángeli eius cum illo missi sunt.'
  "10": 'Et audívi vocem magnam in cælo dicéntem: Nunc facta est salus, et virtus, et regnum Dei nostri, et potéstas Christi eius: quia proiéctus est accusátor fratrum nostrórum, qui accusábat illos ante conspéctum Dei nostri die ac nocte.'
  "11": Et ipsi vicérunt eum propter sánguinem Agni, et propter verbum testimónii sui, et non dilexérunt ánimas suas usque ad mortem.
  "12": Proptérea lætámini cæli, et qui habitátis in eis. Væ terræ, et mari, quia descéndit diábolus ad vos habens iram magnam, sciens quod módicum tempus habet.
  "13": 'Et postquam vidit draco quod proiéctus esset in terram, persecútus est mulíerem, quæ péperit másculum:'
  "14": et datæ sunt mulíeri alæ duæ áquilæ magnæ ut voláret in desértum in locum suum, ubi álitur per tempus et témpora, et dimídium témporis a fácie serpéntis.
  "15": Et misit serpens ex ore suo post mulíerem, aquam tamquam flumen, ut eam fáceret trahi a flúmine.
  "16": Et adiúvit terra mulíerem, et apéruit terra os suum, et absórbuit flumen, quod misit draco de ore suo.
  "17": 'Et irátus est draco in mulíerem: et ábiit fácere prœ́lium cum réliquis de sémine eius, qui custódiunt mandáta Dei, et habent testimónium Iesu Christi.'
  "18": Et stetit supra arénam maris.
