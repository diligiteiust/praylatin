bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "122"
verses:
  "1": Cánticum gráduum. Ad te levávi óculos meos, qui hábitas in cælis.
  "2": 'Ecce sicut óculi servórum, in mánibus dominórum suórum, sicut óculi ancíllæ in mánibus dóminæ suæ: ita óculi nostri ad Dóminum Deum nostrum, donec misereátur nostri.'
  "3": 'Miserére nostri Dómine, miserére nostri: quia multum repléti sumus despectióne:'
  "4": 'quia multum repléta est ánima nostra: oppróbrium abundántibus, et despéctio supérbis.'
