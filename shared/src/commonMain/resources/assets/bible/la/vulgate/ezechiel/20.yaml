bible: vulgate
lang: la
language: Latina
book: Ezechiel
chapter: "20"
verses:
  "1": Et factum est in anno séptimo, in quinto, in décima mensis, venérunt viri de senióribus Israel ut interrogárent Dóminum, et sedérunt coram me.
  "2": 'Et factus est sermo Dómini ad me, dicens:'
  "3": 'Fili hóminis lóquere senióribus Israel, et dices ad eos: Hæc dicit Dóminus Deus: Numquid ad interrogándum me vos venístis? vivo ego quia non respondébo vobis, ait Dóminus Deus.'
  "4": Si iúdicas eos, si iúdicas fili hóminis, abominatiónes patrum eórum osténde eis.
  "5": 'Et dices ad eos: Hæc dicit Dóminus Deus: In die, qua elégi Israel, et levávi manum meam pro stirpe domus Iacob, et appárui eis in terra Ægýpti, et levávi manum meam pro eis, dicens: Ego Dóminus Deus vester:'
  "6": in die illa levávi manum meam pro eis, ut edúcerem eos de terra Ægýpti, in terram, quam províderam eis, fluéntem lacte et melle, quæ est egrégia inter omnes terras.
  "7": 'Et dixi ad eos: Unusquísque offensiónes oculórum suórum abíciat, et in idólis Ægýpti nolíte póllui: ego Dóminus Deus vester.'
  "8": 'Et irritavérunt me, noluerúntque me audíre: unusquísque abominatiónes oculórum suórum non proiécit, nec idóla Ægýpti reliquérunt. Et dixi ut effúnderem indignatiónem meam super eos, et implérem iram meam in eis, in médio terræ Ægýpti.'
  "9": Et feci propter nomen meum, ut non violarétur coram géntibus, in quarum médio erant, et inter quas appárui eis ut edúcerem eos de terra Ægýpti.
  "10": Eiéci ergo eos de terra Ægýpti, et edúxi eos in desértum.
  "11": Et dedi eis præcépta mea, et iudícia mea osténdi eis, quæ fáciens homo vivet in eis.
  "12": 'Insuper et sábbata mea dedi eis, ut essent signum inter me et eos: et scirent quia ego Dóminus sanctíficans eos.'
  "13": 'Et irritavérunt me domus Israel in desérto, in præcéptis meis non ambulavérunt, et iudícia mea proiecérunt, quæ fáciens homo vivet in eis: et sábbata mea violavérunt veheménter: dixi ergo ut effúnderem furórem meum super eos in desérto, et consúmerem eos.'
  "14": Et feci propter nomen meum, ne violarétur coram géntibus, de quibus eiéci eos in conspéctu eárum.
  "15": 'Ego ígitur levávi manum meam super eos in desérto, ne indúcerem eos in terram, quam dedi eis, fluéntem lacte et melle, præcípuam terrárum ómnium:'
  "16": 'quia iudícia mea proiecérunt, et in præcéptis meis non ambulavérunt, et sábbata mea violavérunt: post idóla enim cor eórum gradiebátur.'
  "17": 'Et pepércit óculus meus super eos, ut non interfícerem eos: nec consúmpsi eos in desérto.'
  "18": 'Dixi autem ad fílios eórum in solitúdine: In præcéptis patrum vestrórum nolíte incédere, nec iudícia eórum custodiátis, nec in idólis eórum polluámini.'
  "19": 'Ego Dóminus Deus vester: in præcéptis meis ambuláte, iudícia mea custodíte, et fácite ea:'
  "20": et sábbata mea sanctificáte, ut sint signum inter me et vos, et sciátis quia ego sum Dóminus Deus vester.
  "21": 'Et exacerbavérunt me fílii, in præcéptis meis non ambulavérunt: et iudícia mea non custodiérunt ut fácerent ea: quæ cum fécerit homo, vivet in eis: et sábbata mea violavérunt: et comminátus sum ut effúnderem furórem meum super eos, et implérem iram meam in eis in desérto.'
  "22": Avérti autem manum meam, et feci propter nomen meum, ut non violarétur coram géntibus, de quibus eiéci eos in óculis eárum.
  "23": 'Iterum levávi manum meam in eos in solitúdine, ut dispérgerem illos in natiónes, et ventilárem in terras:'
  "24": eo quod iudícia mea non fecíssent, et præcépta mea reprobássent, et sábbata mea violássent, et post idóla patrum suórum fuíssent óculi eórum.
  "25": Ergo et ego dedi eis præcépta non bona, et iudícia, in quibus non vivent.
  "26": 'Et póllui eos in munéribus suis cum offérrent omne, quod áperit vulvam, propter delícta sua: et scient quia ego Dóminus.'
  "27": 'Quam ob rem lóquere ad domum Israel, fili hóminis: et dices ad eos: Hæc dicit Dóminus Deus: Adhuc et in hoc blasphemavérunt me patres vestri, cum sprevíssent me contemnéntes:'
  "28": 'et induxíssem eos in terram, super quam levávi manum meam ut darem eis: vidérunt omnem collem excélsum, et omne lignum nemorósum, et immolavérunt ibi víctimas suas: et dedérunt ibi irritatiónem oblatiónis suæ, et posuérunt ibi odórem suavitátis suæ, et libavérunt libatiónes suas.'
  "29": 'Et dixi ad eos: Quid est excélsum, ad quod vos ingredímini? et vocátum est nomen eius Excélsum usque ad hanc diem.'
  "30": 'Proptérea dic ad domum Israel: Hæc dicit Dóminus Deus: Certe in via patrum vestrórum vos polluímini, et post offendícula eórum vos fornicámini:'
  "31": 'et in oblatióne donórum vestrórum, cum tradúcitis fílios vestros per ignem, vos polluímini in ómnibus idólis vestris usque hódie: et ego respondébo vobis, domus Israel? Vivo ego, dicit Dóminus Deus, quia non respondébo vobis.'
  "32": 'Neque cogitátio mentis vestræ fiet, dicéntium: Erimus sicut gentes, et sicut cognatiónes terræ, ut colámus ligna, et lápides.'
  "33": Vivo ego, dicit Dóminus Deus, quóniam in manu forti, et in bráchio exténto, et in furóre effúso regnábo super vos.
  "34": 'Et edúcam vos de pópulis, et congregábo vos de terris, in quibus dispérsi estis: in manu válida, et in bráchio exténto, et in furóre effúso regnábo super vos.'
  "35": Et addúcam vos in desértum populórum, et iudicábor vobíscum ibi fácie ad fáciem.
  "36": Sicut iudício conténdi advérsum patres vestros in desérto terræ Ægýpti, sic iudicábo vos, dicit Dóminus Deus.
  "37": Et subíciam vos sceptro meo, et indúcam vos in vínculis fœ́deris.
  "38": 'Et éligam de vobis transgressóres et ímpios, et de terra incolátus eórum edúcam eos, et in terram Israel non ingrediéntur: et sciétis quia ego Dóminus.'
  "39": 'Et vos domus Israel, hæc dicit Dóminus Deus: Sínguli post idóla vestra ambuláte, et servíte eis. Quod si et in hoc non audiéritis me, et nomen meum sanctum polluéritis ultra in munéribus vestris, et in idólis vestris:'
  "40": 'in monte sancto meo, in monte excélso Israel, ait Dóminus Deus, ibi sérviet mihi omnis domus Israel: omnes, inquam, in terra, in qua placébunt mihi: et ibi quæram primítias vestras, et inítium decimárum vestrárum, in ómnibus sanctificatiónibus vestris.'
  "41": In odórem suavitátis suscípiam vos, cum edúxero vos de pópulis, et congregávero vos de terris, in quas dispérsi estis, et sanctificábor in vobis in óculis natiónum.
  "42": Et sciétis quia ego Dóminus, cum indúxero vos ad terram Israel, in terram, pro qua levávi manum meam ut darem eam pátribus vestris.
  "43": 'Et recordabímini ibi viárum vestrárum, et ómnium scélerum vestrórum, quibus pollúti estis in eis: et displicébitis vobis in conspéctu vestro, in ómnibus malítiis vestris, quas fecístis.'
  "44": Et sciétis quia ego Dóminus, cum benefécero vobis propter nomen meum, et non secúndum vias vestras malas, neque secúndum scélera vestra péssima domus Israel, ait Dóminus Deus.
  "45": 'Et factus est sermo Dómini ad me, dicens:'
  "46": Fili hóminis, pone fáciem tuam contra viam austri, et stilla ad áfricum, et prophéta ad saltum agri meridiáni.
  "47": 'Et dices sáltui meridiáno: Audi verbum Dómini: Hæc dicit Dóminus Deus: Ecce ego succéndam in te ignem, et combúram in te omne lignum víride, et omne lignum áridum: non exstinguétur flamma succensiónis: et comburétur in ea omnis fácies ab austro usque ad aquilónem.'
  "48": Et vidébit univérsa caro, quia ego Dóminus succéndi eam, nec exstinguétur.
  "49": 'Et dixi: A a a, Dómine Deus: ipsi dicunt de me: Numquid non per parábolas lóquitur iste?'
