bible: vulgate
lang: la
language: Latina
book: Ieremias
chapter: "52"
verses:
  "1": 'Fílius vigínti et uníus anni erat Sedecías cum regnáre cœpísset: et úndecim annis regnávit in Ierúsalem, et nomen matris eius Amítal fília Ieremíæ de Lobna.'
  "2": Et fecit malum in óculis Dómini, iuxta ómnia quæ fécerat Ióakim.
  "3": 'Quóniam furor Dómini erat in Ierúsalem et in Iuda, úsquequo proíceret eos a fácie sua: et recéssit Sedecías a rege Babylónis.'
  "4": 'Factum est autem in anno nono regni eius, in mense décimo, décima mensis, venit Nabuchodónosor rex Babylónis, ipse et omnis exércitus eius, advérsus Ierúsalem: et obsedérunt eam, et ædificavérunt contra eam munitiónes in circúitu.'
  "5": Et fuit cívitas obséssa usque ad undécimum annum regis Sedecíæ.
  "6": Mense autem quarto, nona mensis, obtínuit fames civitátem, et non erant aliménta pópulo terræ.
  "7": Et dirúpta est cívitas, et omnes viri bellatóres eius fugérunt, exierúntque de civitáte nocte, per viam portæ, quæ est inter duos muros, et ducit ad hortum regis (Chaldǽis obsidéntibus urbem in gyro) et abiérunt per viam, quæ ducit in erémum.
  "8": 'Persecútus est autem Chaldæórum exércitus regem, et apprehendérunt Sedecíam in desérto, quod est iuxta Iéricho: et omnis comitátus eius diffúgit ab eo.'
  "9": 'Cumque comprehendíssent regem, adduxérunt eum ad regem Babylónis in Réblatha, quæ est in terra Emath: et locútus est ad eum iudícia.'
  "10": Et iugulávit rex Babylónis fílios Sedecíæ in óculis eius, sed et omnes príncipes Iuda occídit in Réblatha.
  "11": 'Et óculos Sedecíæ éruit, et vinxit eum compédibus, et addúxit eum rex Babylónis in Babylónem: et pósuit eum in domo cárceris usque ad diem mortis eius.'
  "12": 'In mense autem quinto, décima mensis, ipse est annus nonus décimus Nabuchodónosor regis Babylónis: venit Nabuzárdan princeps milítiæ, qui stabat coram rege Babylónis in Ierúsalem.'
  "13": 'Et incéndit domum Dómini, et domum regis, et omnes domos Ierúsalem: et omnem domum magnam igni combússit.'
  "14": Et totum murum Ierúsalem per circúitum destrúxit cunctus exércitus Chaldæórum, qui erat cum magístro milítiæ.
  "15": De paupéribus autem pópuli, et de réliquo vulgo, quod remánserat in civitáte, et de pérfugis, qui transfúgerant ad regem Babylónis, et céteros de multitúdine tránstulit Nabuzárdan princeps milítiæ.
  "16": De paupéribus vero terræ relíquit Nabuzárdan princeps milítiæ vinitóres et agrícolas.
  "17": Colúmnas quoque ǽreas, quæ erant in domo Dómini, et bases, et mare ǽneum, quod erat in domo Dómini, confregérunt Chaldǽi, et tulérunt omne æs eórum in Babylónem.
  "18": 'Et lebétes, et créagras, et psaltéria, et phíalas, et mortaríola, et ómnia vasa ǽrea, quæ in ministério fúerant, tulérunt:'
  "19": 'et hýdrias, et thymiamatéria, et úrceos, et pelves, et candelábra, et mortária, et cýathos: quotquot áurea, áurea, et quotquot argéntea, argéntea, tulit magíster milítiæ:'
  "20": 'et colúmnas duas, et mare unum, et vítulos duódecim ǽreos, qui erant sub básibus, quas fécerat rex Sálomon in domo Dómini: non erat pondus æris ómnium horum vasórum.'
  "21": 'De colúmnis autem, decem et octo cúbiti altitúdinis erant in colúmna una, et funículus duódecim cubitórum circuíbat eam: porro grossitúdo eius quátuor digitórum, et intrínsecus cava erat.'
  "22": 'Et capitélla super utrámque ǽrea: altitúdo capitélli uníus quinque cubitórum: et retiácula et malogranáta super corónam in circúitu, ómnia ǽrea. Simíliter colúmnæ secúndæ, et malogranáta.'
  "23": 'Et fuérunt malogranáta nonagínta sex dependéntia: et ómnia malogranáta centum, retiáculis circumdabántur.'
  "24": Et tulit magíster milítiæ Saraíam sacerdótem primum, et Sophoníam sacerdótem secúndum, et tres custódes vestíbuli.
  "25": 'Et de civitáte tulit eunúchum unum, qui erat præpósitus super viros bellatóres: et septem viros de his, qui vidébant fáciem regis, qui invénti sunt in civitáte: et scribam príncipem mílitum, qui probábat tyrónes: et sexagínta viros de pópulo terræ, qui invénti sunt in médio civitátis.'
  "26": Tulit autem eos Nabuzárdan magíster milítiæ, et duxit eos ad regem Babylónis in Réblatha.
  "27": 'Et percússit eos rex Babylónis, et interfécit eos in Réblatha in terra Emath: et translátus est Iuda de terra sua.'
  "28": 'Iste est pópulus, quem tránstulit Nabuchodónosor: In anno séptimo, Iudǽos tria míllia et vigínti tres:'
  "29": 'in anno octávo décimo Nabuchodónosor, de Ierúsalem ánimas octingéntas trigínta duas:'
  "30": 'in anno vigésimo tértio Nabuchodónosor, tránstulit Nabuzárdan magíster milítiæ ánimas Iudæórum septingéntas quadragínta quinque: omnes ergo ánimæ, quátuor míllia sexcéntæ.'
  "31": Et factum est in trigésimo séptimo anno transmigratiónis Ióachin regis Iuda, duodécimo mense, vigésima quinta mensis, elevávit Evilmérodach rex Babylónis, ipso anno regni sui, caput Ióachin regis Iuda, et edúxit eum de domo cárceris.
  "32": Et locútus est cum eo bona, et pósuit thronum eius super thronos regum, qui erant post se in Babylóne.
  "33": 'Et mutávit vestiménta cárceris eius, et comedébat panem coram eo semper cunctis diébus vitæ suæ:'
  "34": et cibária eius, cibária perpétua dabántur ei a rege Babylónis, statúta per síngulos dies, usque ad diem mortis suæ, cunctis diébus vitæ eius.
