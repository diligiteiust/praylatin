bible: vulgate
lang: la
language: Latina
book: Ieremias
chapter: "11"
verses:
  "1": 'Verbum, quod factum est a Dómino ad Ieremíam, dicens:'
  "2": Audíte verba pacti huius, et loquímini ad viros Iuda, et ad habitatóres Ierúsalem,
  "3": 'et dices ad eos: Hæc dicit Dóminus Deus Israel: Maledíctus vir, qui non audíerit verba pacti huius,'
  "4": 'quod præcépi pátribus vestris in die, qua edúxi eos de terra Ægýpti, de fornáce férrea, dicens: Audíte vocem meam, et fácite ómnia, quæ præcípio vobis, et éritis mihi in pópulum, et ego ero vobis in Deum:'
  "5": 'ut súscitem iuraméntum, quod iurávi pátribus vestris, datúrum me eis terram fluéntem lacte et melle, sicut est dies hæc. Et respóndi, et dixi: Amen Dómine.'
  "6": 'Et dixit Dóminus ad me: Vociferáre ómnia verba hæc in civitátibus Iuda, et foris Ierúsalem, dicens: Audíte verba pacti huius, et fácite illa:'
  "7": 'quia contéstans contestátus sum patres vestros in die, qua edúxi eos de terra Ægýpti, usque ad diem hanc: mane consúrgens contestátus sum, et dixi: Audíte vocem meam:'
  "8": 'et non audiérunt, nec inclinavérunt aurem suam: sed abiérunt unusquísque in pravitáte cordis sui mali, et indúxi super eos ómnia verba pacti huius, quod præcépi ut fácerent, et non fecérunt.'
  "9": 'Et dixit Dóminus ad me: Invénta est coniurátio in viris Iuda et in habitatóribus Ierúsalem.'
  "10": 'Revérsi sunt ad iniquitátes patrum suórum prióres, qui noluérunt audíre verba mea: et hi ergo abiérunt post deos aliénos, ut servírent eis: írritum fecérunt domus Israel et domus Iuda pactum meum, quod pépigi cum pátribus eórum.'
  "11": 'Quam ob rem hæc dicit Dóminus: Ecce ego indúcam super eos mala, de quibus exíre non póterunt: et clamábunt ad me, et non exáudiam eos.'
  "12": Et ibunt civitátes Iuda et habitatóres Ierúsalem, et clamábunt ad deos, quibus libant, et non salvábunt eos in témpore afflictiónis eórum.
  "13": 'Secúndum númerum enim civitátum tuárum erant dii tui Iuda: et secúndum númerum viárum Ierúsalem, posuísti aras confusiónis, aras ad libándum Báalim.'
  "14": 'Tu ergo noli oráre pro pópulo hoc, et ne assúmas pro eis laudem et oratiónem: quia non exáudiam in témpore clamóris eórum ad me, in témpore afflictiónis eórum.'
  "15": Quid est, quod diléctus meus in domo mea fecit scélera multa? numquid carnes sanctæ áuferent a te malítias tuas, in quibus gloriáta es?
  "16": 'Olívam úberem, pulchram, fructíferam, speciósam vocávit Dóminus nomen tuum: ad vocem loquélæ, grandis exársit ignis in ea, et combústa sunt frutéta eius.'
  "17": Et Dóminus exercítuum qui plantávit te, locútus est super te malum, pro malis domus Israel, et domus Iuda, quæ fecérunt sibi ad irritándum me, libántes Báalim.
  "18": 'Tu autem Dómine demonstrásti mihi, et cognóvi: tunc ostendísti mihi stúdia eórum.'
  "19": 'Et ego quasi agnus mansuétus, qui portátur ad víctimam: et non cognóvi quia cogitavérunt super me consília, dicéntes: Mittámus lignum in panem eius, et eradámus eum de terra vivéntium, et nomen eius non memorétur ámplius.'
  "20": 'Tu autem Dómine Sábaoth, qui iúdicas iuste, et probas renes et corda, vídeam ultiónem tuam ex eis: tibi enim revelávi causam meam.'
  "21": 'Proptérea hæc dicit Dóminus ad viros Anathoth, qui quærunt ánimam tuam, et dicunt: Non prophetábis in nómine Dómini, et non moriéris in mánibus nostris.'
  "22": 'Proptérea hæc dicit Dóminus exercítuum: Ecce ego visitábo super eos: iúvenes moriéntur in gládio, fílii eórum, et fíliæ eórum moriéntur in fame.'
  "23": 'Et relíquiæ non erunt ex eis: indúcam enim malum super viros Anathoth, annum visitatiónis eórum.'
