bible: vulgate
lang: la
language: Latina
book: Iob
chapter: "25"
verses:
  "1": 'Respóndens autem Baldad Suhítes, dixit:'
  "2": Potéstas et terror apud eum est, qui facit concórdiam in sublímibus suis.
  "3": Numquid est númerus mílitum eius? et super quem non surget lumen illíus?
  "4": Numquid iustificári potest homo comparátus Deo, aut apparére mundus natus de mulíere?
  "5": 'Ecce luna étiam non splendet, et stellæ non sunt mundæ in conspéctu eius:'
  "6": quanto magis homo putrédo, et fílius hóminis vermis?
