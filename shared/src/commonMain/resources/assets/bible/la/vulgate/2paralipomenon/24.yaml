bible: vulgate
lang: la
language: Latina
book: II Paralipomenon
chapter: "24"
verses:
  "1": 'Septem annórum erat Ioas cum regnáre cœpísset, et quadragínta annis regnávit in Ierúsalem: nomen matris eius Sebía de Bersabée.'
  "2": Fecítque quod bonum est coram Dómino cunctis diébus Ióiadæ sacerdótis.
  "3": Accépit autem ei Ióiada uxóres duas, e quibus génuit fílios et fílias.
  "4": Post quæ plácuit Ioas ut instauráret domum Dómini.
  "5": 'Congregavítque sacerdótes, et Levítas, et dixit eis: Egredímini ad civitátes Iuda, et collígite de univérso Israel pecúniam ad sartatécta templi Dei vestri per síngulos annos, festinatóque hoc fácite. Porro Levítæ egére negligéntius.'
  "6": 'Vocavítque rex Ióiadam príncipem, et dixit ei: Quare tibi non fuit curæ, ut cógeres Levítas inférre de Iuda et de Ierúsalem pecúniam, quæ constitúta est a Móyse servo Dómini, ut inférret eam omnis multitúdo Israel in tabernáculum testimónii?'
  "7": 'Athalía enim impiíssima, et fílii eius, destruxérunt domum Dei: et de univérsis, quæ sanctificáta fúerant in templo Dómini, ornavérunt fanum Báalim.'
  "8": 'Præcépit ergo rex, et fecérunt arcam: posuerúntque eam iuxta portam domus Dómini forínsecus.'
  "9": Et prædicátum est in Iuda et Ierúsalem ut deférrent sínguli prétium Dómino, quod constítuit Móyses servus Dei super omnem Israel in desérto.
  "10": Lætatíque sunt cuncti príncipes, et omnis pópulus, et ingréssi contulérunt in arcam Dómini, atque misérunt ita ut implerétur.
  "11": 'Cumque tempus esset ut deférrent arcam coram rege per manus Levitárum (vidébant enim multam pecúniam), ingrediebátur scriba regis, et quem primus sacérdos constitúerat: effundebántque pecúniam quæ erat in arca: porro arcam reportábant ad locum suum: sicque faciébant per síngulos dies. Et congregáta est infiníta pecúnia.'
  "12": 'Quam dedérunt rex et Ióiada his, qui prǽerant opéribus domus Dómini: at illi conducébant ex ea cæsóres lápidum, et artífices óperum singulórum ut instaurárent domum Dómini: fabros quoque ferri et æris, ut quod cádere cœ́perat, fulcirétur.'
  "13": Egerúntque hi qui operabántur indústrie, et obducebátur paríetum cicátrix per manus eórum, ac suscitavérunt domum Dómini in statum prístinum, et fírmiter eam stare fecérunt.
  "14": 'Cumque compléssent ómnia ópera, detulérunt coram rege, et Ióiada réliquam partem pecúniæ: de qua facta sunt vasa templi in ministérium, et ad holocáusta, phíalæ quoque, et cétera vasa áurea et argéntea: et offerebántur holocáusta in domo Dómini iúgiter cunctis diébus Ióiadæ.'
  "15": 'Sénuit autem Ióiada plenus diérum, et mórtuus est cum esset centum trigínta annórum:'
  "16": sepelierúntque eum in civitáte David cum régibus, eo quod fecísset bonum cum Israel, et cum domo eius.
  "17": 'Postquam autem óbiit Ióiada, ingréssi sunt príncipes Iuda, et adoravérunt regem: qui delinítus obséquiis eórum, acquiévit eis.'
  "18": Et dereliquérunt templum Dómini Dei patrum suórum, servierúntque lucis et sculptílibus, et facta est ira contra Iudam, et Ierúsalem propter hoc peccátum.
  "19": Mittebátque eis prophétas ut reverteréntur ad Dóminum, quos protestántes illi audíre nolébant.
  "20": 'Spíritus ítaque Dei índuit Zacharíam fílium Ióiadæ sacerdótem, et stetit in conspéctu pópuli, et dixit eis: Hæc dicit Dóminus Deus: Quare transgredímini præcéptum Dómini, quod vobis non próderit, et dereliquístis Dóminum ut derelínqueret vos?'
  "21": Qui congregáti advérsus eum, misérunt lápides iuxta regis impérium in átrio domus Dómini.
  "22": 'Et non est recordátus Ioas rex misericórdiæ, quam fécerat Ióiada pater illíus secum, sed interfécit fílium eius. Qui cum morerétur, ait: Vídeat Dóminus, et requírat.'
  "23": 'Cumque evolútus esset annus, ascéndit contra eum exércitus Sýriæ: venítque in Iudam et Ierúsalem, et interfécit cunctos príncipes pópuli, atque univérsam prædam misérunt regi in Damáscum.'
  "24": 'Et certe cum permódicus venísset númerus Syrórum, trádidit Dóminus in mánibus eórum infinítam multitúdinem, eo quod dereliquíssent Dóminum Deum patrum suórum: in Ioas quoque ignominiósa exercuére iudícia.'
  "25": 'Et abeúntes dimisérunt eum in languóribus magnis: surrexérunt autem contra eum servi sui in ultiónem sánguinis fílii Ióiadæ sacerdótis, et occidérunt eum in léctulo suo, et mórtuus est: sepelierúntque eum in civitáte David, sed non in sepúlcris regum.'
  "26": Insidiáti vero sunt ei Zabad fílius Sémmaath Ammanítidis, et Iózabad fílius Sémarith Moabítidis.
  "27": 'Porro fílii eius, ac summa pecúniæ, quæ adunáta fúerat sub eo, et instaurátio domus Dei, scripta sunt diligéntius in Libro regum: regnávit autem Amasías fílius eius pro eo.'
