bible: vulgate
lang: la
language: Latina
book: Tobiae
chapter: "9"
verses:
  "1": 'Tunc vocávit Tobías ángelum ad se, quem quidem hóminem existimábat, dixítque ei: Azaría frater, peto ut auscúltes verba mea.'
  "2": Si meípsum tradam tibi servum, non ero condígnus providéntiæ tuæ.
  "3": Tamen óbsecro te, ut assúmas tibi animália sive servítia, et vadas ad Gabélum in Rages civitátem Medórum, reddásque ei chirógraphum suum, et recípias ab eo pecúniam, et roges eum veníre ad núptias meas.
  "4": 'Scis enim ipse quóniam númerat pater meus dies: et si tardávero una die plus, contristátur ánima eius.'
  "5": Et certe vides quómodo adiurávit me Ráguel, cuius adiuraméntum spérnere non possum.
  "6": 'Tunc Ráphael assúmens quátuor ex servis Raguélis, et duos camélos, in Rages civitátem Medórum perréxit: et invéniens Gabélum, réddidit ei chirógraphum suum, et recépit ab eo omnem pecúniam.'
  "7": 'Indicavítque ei de Tobía fílio Tobíæ, ómnia quæ gesta sunt: fecítque eum secum veníre ad núptias.'
  "8": 'Cumque ingréssus esset domum Raguélis, invénit Tobíam discumbéntem: et exsíliens, osculáti sunt se ínvicem: et flevit Gabélus, benedixítque Deum,'
  "9": 'et dixit: Benedícat te Deus Israel, quia fílius es óptimi viri, et iusti, et timéntis Deum, et eleemósynas faciéntis:'
  "10": 'et dicátur benedíctio super uxórem tuam, et super paréntes vestros:'
  "11": 'et videátis fílios vestros, et fílios filiórum vestrórum, usque in tértiam et quartam generatiónem: et sit semen vestrum benedíctum a Deo Israel, qui regnat in sǽcula sæculórum.'
  "12": 'Cumque omnes dixíssent: Amen, accessérunt ad convívium: sed et cum timóre Dómini nuptiárum convívium exercébant.'
