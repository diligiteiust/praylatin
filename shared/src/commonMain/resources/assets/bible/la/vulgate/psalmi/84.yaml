bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "84"
verses:
  "1": In finem, fíliis Core, Psalmus.
  "2": 'Benedixísti Dómine terram tuam: avertísti captivitátem Iacob.'
  "3": 'Remisísti iniquitátem plebis tuæ: operuísti ómnia peccáta eórum.'
  "4": 'Mitigásti omnem iram tuam: avertísti ab ira indignatiónis tuæ.'
  "5": 'Convérte nos Deus salutáris noster: et avérte iram tuam a nobis.'
  "6": Numquid in ætérnum irascéris nobis? aut exténdes iram tuam a generatióne in generatiónem?
  "7": 'Deus tu convérsus vivificábis nos: et plebs tua lætábitur in te.'
  "8": 'Osténde nobis Dómine misericórdiam tuam: et salutáre tuum da nobis.'
  "9": 'Audiam quid loquátur in me Dóminus Deus: quóniam loquétur pacem in plebem suam: et super sanctos suos: et in eos qui convertúntur ad cor.'
  "10": 'Verúmtamen prope timéntes eum salutáre ipsíus: ut inhábitet glória in terra nostra.'
  "11": 'Misericórdia et véritas obviavérunt sibi: iustítia et pax osculátæ sunt.'
  "12": 'Véritas de terra orta est: et iustítia de cælo prospéxit.'
  "13": 'Etenim Dóminus dabit benignitátem: et terra nostra dabit fructum suum.'
  "14": 'Iustítia ante eum ambulábit: et ponet in via gressus suos.'
