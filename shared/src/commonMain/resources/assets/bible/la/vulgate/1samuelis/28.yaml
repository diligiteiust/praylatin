bible: vulgate
lang: la
language: Latina
book: I Samuelis
chapter: "28"
verses:
  "1": 'Factum est autem in diébus illis, congregavérunt Philísthiim ágmina sua, ut præpararéntur ad bellum contra Israel: dixítque Achis ad David: Sciens nunc scito quóniam mecum egrediéris in castris tu, et viri tui.'
  "2": 'Dixítque David ad Achis: Nunc scies quæ factúrus est servus tuus. Et ait Achis ad David: Et ego custódem cápitis mei ponam te cunctis diébus.'
  "3": Sámuel autem mórtuus est, planxítque eum omnis Israel, et sepeliérunt eum in Rámatha urbe sua. Et Saul ábstulit magos, et haríolos de terra.
  "4": 'Congregatíque sunt Philísthiim, et venérunt, et castrametáti sunt in Sunam: congregávit autem et Saul univérsum Israel, et venit in Gélboe.'
  "5": Et vidit Saul castra Philísthiim, et tímuit, et expávit cor eius nimis.
  "6": Consuluítque Dóminum, et non respóndit ei neque per sómnia, neque per sacerdótes, neque per prophétas.
  "7": 'Dixítque Saul servis suis: Quǽrite mihi mulíerem habéntem pythónem, et vadam ad eam, et sciscitábor per illam. Et dixérunt servi eius ad eum: Est múlier pythónem habens in Endor.'
  "8": 'Mutávit ergo hábitum suum, vestitúsque est áliis vestiméntis, et ábiit ipse, et duo viri cum eo: venerúntque ad mulíerem nocte, et ait illi: Divína mihi in pythóne, et súscita mihi quem díxero tibi.'
  "9": 'Et ait múlier ad eum: Ecce, tu nosti quanta fécerit Saul, et quómodo eráserit magos et haríolos de terra: quare ergo insidiáris ánimæ meæ, ut occídar?'
  "10": 'Et iurávit ei Saul in Dómino, dicens: Vivit Dóminus, quia non evéniet tibi quidquam mali propter hanc rem.'
  "11": 'Dixítque ei múlier: Quem suscitábo tibi? Qui ait: Samuélem mihi súscita.'
  "12": 'Cum autem vidísset múlier Samuélem, exclamávit voce magna, et dixit ad Saul: Quare imposuísti mihi? tu es enim Saul.'
  "13": 'Dixítque ei rex: Noli timére: quid vidísti? Et ait múlier ad Saul: Deos vidi ascendéntes de terra.'
  "14": 'Dixítque ei: Qualis est forma eius? Quæ ait: Vir senex ascéndit, et ipse amíctus est pállio. Et intelléxit Saul quod Sámuel esset, et inclinávit se super fáciem suam in terra, et adorávit.'
  "15": 'Dixit autem Sámuel ad Saul: Quare inquietásti me ut suscitárer? Et ait Saul: Coárctor nimis: síquidem Philísthiim pugnant advérsum me, et Deus recéssit a me, et exaudíre me nóluit neque in manu prophetárum, neque per sómnia: vocávi ergo te, ut osténderes mihi quid fáciam.'
  "16": 'Et ait Sámuel: Quid intérrogas me, cum Dóminus recésserit a te, et transíerit ad ǽmulum tuum?'
  "17": 'Fáciet enim tibi Dóminus sicut locútus est in manu mea, et scindet regnum tuum de manu tua, et dabit illud próximo tuo David:'
  "18": 'quia non obedísti voci Dómini, neque fecísti iram furóris eius in Amalec: idcírco quod páteris, fecit tibi Dóminus hódie.'
  "19": 'Et dabit Dóminus étiam Israel tecum in manus Philísthiim: cras autem tu et fílii tui mecum éritis: sed et castra Israel tradet Dóminus in manus Philísthiim.'
  "20": 'Statímque Saul cécidit porréctus in terram: extimúerat enim verba Samuélis, et robur non erat in eo, quia non coméderat panem tota die illa.'
  "21": 'Ingréssa est ítaque múlier illa ad Saul (conturbátus enim erat valde), dixítque ad eum: Ecce obedívit ancílla tua voci tuæ, et pósui ánimam meam in manu mea: et audívi sermónes tuos, quos locútus es ad me.'
  "22": Nunc ígitur audi et tu vocem ancíllæ tuæ, et ponam coram te buccéllam panis, ut cómedens convaléscas, et possis iter ágere.
  "23": 'Qui rénuit, et ait: Non cómedam. Coegérunt autem eum servi sui et múlier, et tandem audíta voce eórum surréxit de terra, et sedit super lectum.'
  "24": 'Múlier autem illa habébat vítulum pascuálem in domo, et festinávit, et occídit eum: tollénsque farínam, míscuit eam, et coxit ázyma,'
  "25": et pósuit ante Saul et ante servos eius. Qui cum comedíssent, surrexérunt, et ambulavérunt per totam noctem illam.
