bible: vulgate
lang: la
language: Latina
book: Numeri
chapter: "20"
verses:
  "1": 'Venerúntque fílii Israel, et omnis multitúdo in desértum Sin, mense primo: et mansit pópulus in Cades. Mortuáque est ibi María, et sepúlta in eódem loco.'
  "2": 'Cumque indigéret aqua pópulus, convenérunt advérsum Móysen et Aaron:'
  "3": 'et versi in seditiónem, dixérunt: Utinam periissémus inter fratres nostros coram Dómino.'
  "4": Cur eduxístis ecclésiam Dómini in solitúdinem, ut et nos et nostra iuménta moriámur?
  "5": Quare nos fecístis ascéndere de Ægýpto, et adduxístis in locum istum péssimum, qui seri non potest, qui nec ficum gignit, nec víneas, nec malogranáta, ínsuper et aquam non habet ad bibéndum?
  "6": 'Ingressúsque Móyses et Aaron, dimíssa multitúdine, tabernáculum fœ́deris, corruérunt proni in terram, clamaverúntque ad Dóminum, atque dixérunt: Dómine Deus, audi clamórem huius pópuli, et áperi eis thesáurum tuum fontem aquæ vivæ, ut satiáti, cesset murmurátio eórum. Et appáruit glória Dómini super eos.'
  "7": 'Locutúsque est Dóminus ad Móysen, dicens:'
  "8": Tolle virgam, et cóngrega pópulum, tu et Aaron frater tuus, et loquímini ad petram coram eis, et illa dabit aquas. Cumque edúxeris aquam de petra, bibet omnis multitúdo et iuménta eius.
  "9": Tulit ígitur Móyses virgam, quæ erat in conspéctu Dómini, sicut præcéperat ei,
  "10": 'congregáta multitúdine ante petram, dixítque eis: Audíte rebélles et incréduli: Num de petra hac vobis aquam potérimus eícere?'
  "11": Cumque elevásset Móyses manum, percútiens virga bis sílicem, egréssæ sunt aquæ largíssimæ, ita ut pópulus bíberet et iuménta.
  "12": 'Dixítque Dóminus ad Móysen et Aaron: Quia non credidístis mihi, ut sanctificarétis me coram fíliis Israel, non introducétis hos pópulos in terram, quam dabo eis.'
  "13": Hæc est aqua contradictiónis, ubi iurgáti sunt fílii Israel contra Dóminum, et sanctificátus est in eis.
  "14": 'Misit intérea núntios Móyses de Cades ad regem Edom, qui dícerent: Hæc mandat frater tuus Israel: Nosti omnem labórem, qui apprehéndit nos,'
  "15": 'quo modo descénderint patres nostri in Ægýptum, et habitavérimus ibi multo témpore, afflixeríntque nos Ægýptii, et patres nostros:'
  "16": et quo modo clamavérimus ad Dóminum, et exaudíerit nos, miserítque ángelum, qui edúxerit nos de Ægýpto. Ecce in urbe Cades, quæ est in extrémis fínibus tuis, pósiti,
  "17": 'obsecrámus ut nobis transíre líceat per terram tuam. Non íbimus per agros, nec per víneas: non bibémus aquas de púteis tuis: sed gradiémur via pública, nec ad déxteram nec ad sinístram declinántes, donec transeámus términos tuos.'
  "18": 'Cui respóndit Edom: Non transíbis per me, alióquin armátus occúrram tibi.'
  "19": 'Dixerúntque fílii Israel: Per tritam gradiémur viam: et si bibérimus aquas tuas, nos et pécora nostra, dábimus quod iustum est: nulla erit in prétio difficúltas, tantum velóciter transeámus.'
  "20": 'At ille respóndit: Non transíbis. Statímque egréssus est óbvius, cum infiníta multitúdine, et manu forti,'
  "21": nec vóluit acquiéscere deprecánti, ut concéderet tránsitum per fines suos. Quam ob rem divértit ab eo Israel.
  "22": 'Cumque castra movíssent de Cades, venérunt in montem Hor, qui est in fínibus terræ Edom:'
  "23": 'ubi locútus est Dóminus ad Móysen:'
  "24": 'Pergat, inquit, Aaron ad pópulos suos: non enim intrábit terram, quam dedi fíliis Israel, eo quod incrédulus fúerit ori meo, ad Aquas contradictiónis.'
  "25": Tolle Aaron et fílium eius cum eo, et duces eos in montem Hor.
  "26": 'Cumque nudáveris patrem veste sua, índues ea Eleázarum fílium eius: Aaron colligétur, et moriétur ibi.'
  "27": 'Fecit Móyses ut præcéperat Dóminus: et ascendérunt in montem Hor coram omni multitúdine.'
  "28": Cumque Aaron spoliásset véstibus suis, índuit eis Eleázarum fílium eius.
  "29": Illo mórtuo in montis supercílio, descéndit cum Eleázaro.
  "30": Omnis autem multitúdo videns occubuísse Aaron, flevit super eo trigínta diébus per cunctas famílias suas.
