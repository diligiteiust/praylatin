bible: vulgate
lang: la
language: Latina
book: Ecclesiasticus
chapter: "28"
verses:
  "1": Qui vindicári vult, a Dómino invéniet vindíctam, et peccáta illíus servans servábit.
  "2": Relínque próximo tuo nocénti te, et tunc deprecánti tibi peccáta solvéntur.
  "3": Homo hómini resérvat iram, et a Deo quærit medélam?
  "4": In hóminem símilem sibi non habet misericórdiam, et de peccátis suis deprecátur?
  "5": Ipse cum caro sit, resérvat iram, et propitiatiónem petit a Deo? quis exorábit pro delíctis illíus?
  "6": 'Meménto novissimórum, et désine inimicári:'
  "7": tabitúdo enim et mors ímminent in mandátis eius.
  "8": Memoráre timórem Dei, et non irascáris próximo.
  "9": Memoráre testaméntum Altíssimi, et déspice ignorántiam próximi.
  "10": Abstine te a lite, et mínues peccáta.
  "11": Homo enim iracúndus incéndit litem, et vir peccátor turbábit amícos, et in médio pacem habéntium immíttet inimicítiam.
  "12": 'Secúndum enim ligna silvæ sic ignis exardéscit: et secúndum virtútem hóminis, sic iracúndia illíus erit, et secúndum substántiam suam exaltábit iram suam.'
  "13": 'Certámen festinátum incéndit ignem, et lis festínans effúndit sánguinem: et lingua testíficans addúcit mortem.'
  "14": 'Si suffláveris in scintíllam, quasi ignis exardébit: et si exspúeris super illam, exstinguétur: útraque ex ore proficiscúntur.'
  "15": 'Susúrro et bilínguis maledíctus: multos enim turbábit pacem habéntes.'
  "16": 'Lingua tértia multos commóvit, et dispérsit illos de gente in gentem:'
  "17": civitátes murátas dívitum destrúxit, et domus magnatórum effódit.
  "18": Virtútes populórum concídit, et gentes fortes dissólvit.
  "19": Lingua tértia mulíeres virátas eiécit, et privávit illas labóribus suis.
  "20": Qui réspicit illam non habébit réquiem, nec habébit amícum in quo requiéscat.
  "21": 'Flagélli plaga livórem facit: plaga autem linguæ commínuet ossa.'
  "22": Multi cecidérunt in ore gládii, sed non sic quasi qui interiérunt per linguam suam.
  "23": 'Beátus qui tectus est a lingua nequam, qui in iracúndiam illíus non transívit, et qui non attráxit iugum illíus, et in vínculis eius non est ligátus:'
  "24": 'iugum enim illíus, iugum férreum est: et vínculum illíus, vínculum ǽreum est.'
  "25": 'Mors illíus mors nequíssima: et útilis pótius inférnus quam illa.'
  "26": 'Perseverántia illíus non permanébit, sed obtinébit vias iniustórum: et in flamma sua non combúret iustos.'
  "27": Qui relínquunt Deum íncident in illam, et exardébit in illis, et non exstinguétur, et immittétur in illos quasi leo, et quasi pardus lædet illos.
  "28": Sepi aures tuas spinis, linguam nequam noli audíre, et ori tuo fácito óstia et seras.
  "29": 'Aurum tuum et argéntum tuum confla, et verbis tuis fácito statéram, et frenos ori tuo rectos:'
  "30": et atténde ne forte labáris in lingua, et cadas in conspéctu inimicórum insidiántium tibi, et sit casus tuus insanábilis in mortem.
