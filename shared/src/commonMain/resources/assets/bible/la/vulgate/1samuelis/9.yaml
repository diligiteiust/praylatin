bible: vulgate
lang: la
language: Latina
book: I Samuelis
chapter: "9"
verses:
  "1": Et erat vir de Béniamin nómine Cis, fílius Abiel, fílii Seror, fílii Béchorath, fílii Aphia, fílii viri Iémini, fortis róbore.
  "2": 'Et erat ei fílius vocábulo Saul, eléctus et bonus: et non erat vir de fíliis Israel mélior illo: ab húmero et sursum eminébat super omnem pópulum.'
  "3": 'Períerant autem ásinæ Cis patris Saul: et dixit Cis ad Saul fílium suum: Tolle tecum unum de púeris, et consúrgens vade, et quære ásinas. Qui cum transíssent per montem Ephraim,'
  "4": 'et per terram Sálisa, et non inveníssent, transiérunt étiam per terram Salim, et non erant: sed et per terram Iémini, et mínime reperérunt.'
  "5": 'Cum autem veníssent in terram Suph, dixit Saul ad púerum, qui erat cum eo: Veni et revertámur, ne forte dimíserit pater meus ásinas, et sollícitus sit pro nobis.'
  "6": 'Qui ait ei: Ecce vir Dei est in civitáte hac, vir nóbilis: omne, quod lóquitur, sine ambiguitáte venit. Nunc ergo eámus illuc, si forte índicet nobis de via nostra, propter quam vénimus.'
  "7": 'Dixítque Saul ad púerum suum: Ecce íbimus: quid ferémus ad virum Dei? panis defécit in sitárciis nostris, et spórtulam non habémus ut demus hómini Dei, nec quidquam áliud.'
  "8": 'Rursum puer respóndit Sauli, et ait: Ecce invénta est in manu mea quarta pars statéris argénti: demus hómini Dei, ut índicet nobis viam nostram.'
  "9": '(Olim in Israel sic loquebátur unusquísque vadens consúlere Deum: Veníte, et eámus ad Vidéntem. Qui enim prophéta dícitur hódie, vocabátur olim Videns.)'
  "10": 'Et dixit Saul ad púerum suum: Optimus sermo tuus. Veni, eámus. Et iérunt in civitátem, in qua erat vir Dei.'
  "11": 'Cumque ascénderent clivum civitátis, invenérunt puéllas egrediéntes ad hauriéndam aquam, et dixérunt eis: Num hic est Videns?'
  "12": 'Quæ respondéntes, dixérunt illis: Hic est: ecce ante te, festína nunc: hódie enim venit in civitátem, quia sacrifícium est hódie pópuli in excélso.'
  "13": 'Ingrediéntes urbem, statim inveniétis eum ántequam ascéndat excélsum ad vescéndum, neque enim comesúrus est pópulus donec ille véniat: quia ipse benedícit hóstiæ, et deínceps cómedunt qui vocáti sunt. Nunc ergo conscéndite, quia hódie reperiétis eum.'
  "14": Et ascendérunt in civitátem. Cumque illi ambulárent in médio urbis, appáruit Sámuel egrédiens óbviam eis, ut ascénderet in excélsum.
  "15": 'Dóminus autem reveláverat aurículam Samuélis ante unam diem quam veníret Saul, dicens:'
  "16": 'Hac ipsa hora, quæ nunc est, cras mittam virum ad te de terra Béniamin, et unges eum ducem super pópulum meum Israel: et salvábit pópulum meum de manu Philisthinórum, quia respéxi pópulum meum: venit enim clamor eórum ad me.'
  "17": 'Cumque aspexísset Sámuel Saulem, Dóminus dixit ei: Ecce vir, quem díxeram tibi: iste dominábitur pópulo meo.'
  "18": 'Accéssit autem Saul ad Samuélem in médio portæ, et ait: Indica, oro, mihi, ubi est domus Vidéntis.'
  "19": 'Et respóndit Sámuel Sauli, dicens: Ego sum Videns: ascénde ante me in excélsum, ut comedátis mecum hódie, et dimíttam te mane: et ómnia, quæ sunt in corde tuo indicábo tibi.'
  "20": Et de ásinis, quas nudiustértius perdidísti, ne sollícitus sis, quia invéntæ sunt. Et cuius erunt óptima quæque Israel? nonne tibi et omni dómui patris tui?
  "21": 'Respóndens autem Saul, ait: Numquid non fílius Iémini ego sum de mínima tribu Israel, et cognátio mea novíssima inter omnes famílias de tribu Béniamin? quare ergo locútus es mihi sermónem istum?'
  "22": 'Assúmens ítaque Sámuel Saulem, et púerum eius, introdúxit eos in triclínium, et dedit eis locum in cápite eórum, qui fúerant invitáti: erant enim quasi trigínta viri.'
  "23": 'Dixítque Sámuel coco: Da partem, quam dedi tibi, et præcépi ut repóneres seórsum apud te.'
  "24": 'Levávit autem cocus armum, et pósuit ante Saul. Dixítque Sámuel: Ecce quod remánsit: pone ante te, et cómede, quia de indústria servátum est tibi quando pópulum vocávi. Et comédit Saul cum Samuéle in die illa.'
  "25": 'Et descendérunt de excélso in óppidum, et locútus est cum Saule in solário: stravítque Saul in solário, et dormívit.'
  "26": 'Cumque mane surrexíssent, et iam elucésceret, vocávit Sámuel Saulem in solário, dicens: Surge, et dimíttam te. Et surréxit Saul: egressíque sunt ambo, ipse vidélicet, et Sámuel.'
  "27": 'Cumque descénderent in extréma parte civitátis, Sámuel dixit ad Saul: Dic púero ut antecédat nos, et tránseat: tu autem subsíste paulísper, ut índicem tibi verbum Dómini.'
