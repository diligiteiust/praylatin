bible: vulgate
lang: la
language: Latina
book: Actus Apostolorum
chapter: "5"
verses:
  "1": Vir autem quidam nómine Ananías, cum Saphíra uxóre suo véndidit agrum,
  "2": 'et fraudávit de prétio agri, cónscia uxóre sua: et áfferens partem quamdam, ad pedes Apostolórum pósuit.'
  "3": 'Dixit autem Petrus: Ananía, cur tentávit Sátanas cor tuum, mentíri te Spirítui sancto, et fraudáre de prétio agri?'
  "4": Nonne manens tibi manébat, et venúmdatum in tua erat potestáte? quare posuísti in corde tuo hanc rem? non es mentítus homínibus, sed Deo.
  "5": Audiens autem Ananías hæc verba, cécidit, et exspirávit. Et factus est timor magnus super omnes, qui audiérunt.
  "6": Surgéntes autem iúvenes amovérunt eum, et efferéntes sepeliérunt.
  "7": Factum est autem quasi horárum trium spátium, et uxor ipsíus, nésciens quod factum fúerat, introívit.
  "8": 'Dixit autem ei Petrus: Dic mihi múlier, si tanti agrum vendidístis? At illa dixit: Etiam tanti.'
  "9": 'Petrus autem ad eam: Quid útique convénit vobis tentáre Spíritum Dómini? Ecce pedes eórum, qui sepeliérunt virum tuum ad óstium, et éfferent te.'
  "10": 'Conféstim cécidit ante pedes eius, et exspirávit. Intrántes autem iúvenes invenérunt illam mórtuam: et extulérunt, et sepeliérunt ad virum suum.'
  "11": Et factus est timor magnus in univérsa Ecclésia, et in omnes, qui audiérunt hæc.
  "12": Per manus autem Apostolórum fiébant signa, et prodígia multa in plebe. Et erant unanímiter omnes in pórticu Salomónis.
  "13": 'Ceterórum autem nemo audébat se coniúngere illis: sed magnificábat eos pópulus.'
  "14": Magis autem augebátur credéntium in Dómino multitúdo virórum, ac mulíerum,
  "15": ita ut in platéas eícerent infírmos, et pónerent in léctulis ac grabátis, ut, veniénte Petro, saltem umbra illíus obumbráret quemquam illórum, et liberaréntur ab infirmitátibus suis.
  "16": 'Concurrébat autem et multitúdo vicinárum civitátum Ierúsalem, afferéntes ægros, et vexátos a spirítibus immúndis: qui curabántur omnes.'
  "17": 'Exsúrgens autem princeps sacerdótum, et omnes, qui cum illo erant (quæ est hǽresis Sadducæórum), repléti sunt zelo:'
  "18": et iniecérunt manus in Apóstolos, et posuérunt eos in custódia pública.
  "19": 'Angelus autem Dómini per noctem apériens iánuas cárceris, et edúcens eos, dixit:'
  "20": Ite, et stantes loquímini in templo plebi ómnia verba vitæ huius.
  "21": 'Qui cum audíssent, intravérunt dilúculo in templum, et docébant. Advéniens autem princeps sacerdótum, et qui cum eo erant, convocavérunt concílium, et omnes senióres filiórum Israel: et misérunt ad cárcerem ut adduceréntur.'
  "22": Cum autem veníssent minístri, et apérto cárcere non inveníssent illos, revérsi nuntiavérunt,
  "23": 'dicéntes: Cárcerem quidem invénimus clausum cum omni diligéntia, et custódes stantes ante iánuas: aperiéntes autem néminem intus invénimus.'
  "24": Ut autem audiérunt hos sermónes magistrátus templi, et príncipes sacerdótum, ambigébant de illis quidnam fíeret.
  "25": 'Advéniens autem quidam, nuntiávit eis: Quia ecce viri, quos posuístis in cárcerem, sunt in templo stantes, et docéntes pópulum.'
  "26": 'Tunc ábiit magistrátus cum minístris, et addúxit illos sine vi: timébant enim pópulum ne lapidaréntur.'
  "27": 'Et cum adduxíssent illos, statuérunt in concílio: et interrogávit eos princeps sacerdótum,'
  "28": 'dicens: Præcipiéndo præcépimus vobis ne docerétis in nómine isto: et ecce repléstis Ierúsalem doctrína vestra: et vultis indúcere super nos sánguinem hóminis istíus.'
  "29": 'Respóndens autem Petrus, et Apóstoli, dixérunt: Obedíre opórtet Deo magis, quam homínibus.'
  "30": Deus patrum nostrórum suscitávit Iesum, quem vos interemístis, suspendéntes in ligno.
  "31": 'Hunc príncipem, et salvatórem Deus exaltávit déxtera sua ad dandam pœniténtiam Israéli, et remissiónem peccatórum:'
  "32": et nos sumus testes horum verbórum, et Spíritus sanctus, quem dedit Deus ómnibus obediéntibus sibi.
  "33": Hæc cum audíssent, dissecabántur, et cogitábant interfícere illos.
  "34": 'Surgens autem quidam in concílio Pharisǽus, nómine Gamáliel, legis doctor, honorábilis univérsæ plebi, iussit foras ad breve hómines fíeri:'
  "35": 'dixítque ad illos: Viri Israelítæ, atténdite vobis super homínibus istis quid actúri sitis.'
  "36": 'Ante hos enim dies éxtitit Théodas, dicens se esse áliquem, cui consénsit númerus virórum círciter quadringentórum: qui occísus est: et omnes, qui credébant ei, dissipáti sunt, et redácti ad níhilum.'
  "37": 'Post hunc éxtitit Iudas Galilǽus in diébus professiónis, et avértit pópulum post se, et ipse périit: et omnes, quotquot consensérunt ei, dispérsi sunt.'
  "38": 'Et nunc ítaque dico vobis, discédite ab homínibus istis, et sínite illos: quóniam si est ex homínibus consílium hoc, aut opus, dissolvétur:'
  "39": si vero ex Deo est, non potéritis dissólvere illud, ne forte et Deo repugnáre inveniámini. Consensérunt autem illi.
  "40": Et convocántes Apóstolos, cæsis denuntiavérunt ne omníno loqueréntur in nómine Iesu, et dimisérunt eos.
  "41": Et illi quidem ibant gaudéntes a conspéctu concílii, quóniam digni hábiti sunt pro nómine Iesu contuméliam pati.
  "42": Omni autem die non cessábant in templo, et circa domos docéntes, et evangelizántes Christum Iesum.
