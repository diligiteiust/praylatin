bible: vulgate
lang: la
language: Latina
book: Ezechiel
chapter: "12"
verses:
  "1": 'Et factus est sermo Dómini ad me, dicens:'
  "2": 'Fili hóminis, in médio domus exasperántis tu hábitas: qui óculos habent ad vidéndum, et non vident: et aures ad audiéndum, et non áudiunt: quia domus exásperans est.'
  "3": 'Tu ergo fili hóminis, fac tibi vasa transmigratiónis, et transmigrábis per diem coram eis: transmigrábis autem de loco tuo ad locum álterum in conspéctu eórum, si forte aspíciant: quia domus exásperans est.'
  "4": 'Et éfferes foras vasa tua quasi vasa transmigrántis per diem in conspéctu eórum: tu autem egrediéris véspere coram eis, sicut egréditur migrans.'
  "5": Ante óculos eórum pérfode tibi paríetem, et egrediéris per eum.
  "6": 'In conspéctu eórum in húmeris portáberis, in calígine efferéris: fáciem tuam velábis, et non vidébis terram: quia porténtum dedi te dómui Israel.'
  "7": 'Feci ergo sicut præcéperat mihi Dóminus: vasa mea prótuli quasi vasa transmigrántis per diem, et véspere perfódi mihi paríetem manu: et in calígine egréssus sum, in húmeris portátus in conspéctu eórum.'
  "8": 'Et factus est sermo Dómini mane ad me, dicens:'
  "9": 'Fili hóminis, numquid non dixérunt ad te domus Israel, domus exásperans: Quid tu facis?'
  "10": 'Dic ad eos: Hæc dicit Dóminus Deus: Super ducem onus istud, qui est in Ierúsalem, et super omnem domum Israel, quæ est in médio eórum.'
  "11": 'Dic: Ego porténtum vestrum: quómodo feci, sic fiet illis: in transmigratiónem, et in captivitátem ibunt.'
  "12": 'Et dux, qui est in médio eórum, in húmeris portábitur, in calígine egrediétur: paríetem perfódient, ut edúcant eum: fácies eius operiétur, ut non vídeat óculo terram.'
  "13": 'Et exténdam rete meum super eum, et capiétur in sagéna mea: et addúcam eum in Babylónem, in terram Chaldæórum: et ipsam non vidébit, ibíque moriétur.'
  "14": 'Et omnes, qui circa eum sunt, præsídium eius, et ágmina eius, dispérgam in omnem ventum: et gládium evaginábo post eos.'
  "15": Et scient quia ego Dóminus, quando dispérsero illos in géntibus, et disseminávero eos in terris.
  "16": 'Et relínquam ex eis viros paucos a gládio, et fame, et pestiléntia: ut enárrent ómnia scélera eórum in géntibus, ad quas ingrediéntur: et scient quia ego Dóminus.'
  "17": 'Et factus est sermo Dómini ad me, dicens:'
  "18": 'Fili hóminis, panem tuum in conturbatióne cómede: sed et aquam tuam in festinatióne et mœróre bibe.'
  "19": 'Et dices ad pópulum terræ: Hæc dicit Dóminus Deus ad eos, qui hábitant in Ierúsalem, in terra Israel: Panem suum in sollicitúdine cómedent, et aquam suam in desolatióne bibent: ut desolétur terra a multitúdine sua, propter iniquitátem ómnium qui hábitant in ea.'
  "20": 'Et civitátes, quæ nunc habitántur, desolátæ erunt, terráque desérta: et sciétis quia ego Dóminus.'
  "21": 'Et factus est sermo Dómini ad me, dicens:'
  "22": 'Fili hóminis, quod est provérbium istud vobis in terra Israel, dicéntium: In longum differéntur dies, et períbit omnis vísio?'
  "23": 'Ideo dic ad eos: Hæc dicit Dóminus Deus: Quiéscere fáciam provérbium istud, neque vulgo dicétur ultra in Israel: et lóquere ad eos quod appropinquáverint dies, et sermo omnis visiónis.'
  "24": Non enim erit ultra omnis vísio cassa, neque divinátio ambígua in médio filiórum Israel.
  "25": 'Quia ego Dóminus loquar, et quodcúmque locútus fúero verbum, fiet, et non prolongábitur ámplius: sed in diébus vestris domus exásperans loquar verbum, et fáciam illud, dicit Dóminus Deus.'
  "26": 'Et factus est sermo Dómini ad me, dicens:'
  "27": 'Fili hóminis, ecce domus Israel dicéntium: Vísio, quam hic videt, in dies multos: et in témpora longa iste prophétat.'
  "28": 'Proptérea dic ad eos: Hæc dicit Dóminus Deus: Non prolongábitur ultra omnis sermo meus: verbum, quod locútus fúero, complébitur, dicit Dóminus Deus.'
