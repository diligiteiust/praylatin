bible: vulgate
lang: la
language: Latina
book: Apocalypsis
chapter: "6"
verses:
  "1": 'Et vidi quod aperuísset Agnus unum de septem sigíllis, et audívi unum de quátuor animálibus, dicens, tamquam vocem tonítrui: Veni, et vide.'
  "2": 'Et vidi: et ecce equus albus, et qui sedébat super illum, habébat arcum, et data est ei coróna, et exívit vincens ut vínceret.'
  "3": 'Et cum aperuísset sigíllum secúndum, audívi secúndum ánimal, dicens: Veni, et vide.'
  "4": 'Et exívit álius equus rufus: et qui sedébat super illum, datum est ei ut súmeret pacem de terra, et ut ínvicem se interfíciant, et datus est ei gládius magnus.'
  "5": 'Et cum aperuísset sigíllum tértium, audívi tértium ánimal, dicens: Veni, et vide. Et ecce equus niger: et qui sedébat super illum, habébat statéram in manu sua.'
  "6": 'Et audívi tamquam vocem in médio quátuor animálium dicéntium: Bílibris trítici denário, et tres bílibres hórdei denário, et vinum, et óleum ne lǽseris.'
  "7": 'Et cum aperuísset sigíllum quartum, audívi vocem quarti animális dicéntis: Veni, et vide.'
  "8": 'Et ecce equus pállidus: et qui sedébat super eum, nomen illi Mors, et inférnus sequebátur eum, et data est illi potéstas super quátuor partes terræ, interfícere gládio, fame, et morte, et béstiis terræ.'
  "9": 'Et cum aperuísset sigíllum quintum, vidi subtus altáre ánimas interfectórum propter verbum Dei, et propter testimónium, quod habébant:'
  "10": 'et clamábant voce magna, dicéntes: Usquequo Dómine (sanctus, et verus), non iúdicas, et non víndicas sánguinem nostrum de iis, qui hábitant in terra?'
  "11": 'Et datæ sunt illis síngulæ stolæ albæ: et dictum est illis ut requiéscerent adhuc tempus módicum donec compleántur consérvi eórum, et fratres eórum, qui interficiéndi sunt sicut et illi.'
  "12": 'Et vidi cum aperuísset sigíllum sextum: et ecce terræmótus magnus factus est, et sol factus est niger tamquam saccus cilicínus: et luna tota facta est sicut sanguis:'
  "13": 'et stellæ de cælo cecidérunt super terram, sicut ficus emíttit grossos suos cum a vento magno movétur:'
  "14": 'et cælum recéssit sicut liber involútus: et omnis mons, et ínsulæ de locis suis motæ sunt:'
  "15": 'et reges terræ, et príncipes, et tribúni, et dívites, et fortes, et omnis servus, et liber abscondérunt se in spelúncis, et in petris móntium:'
  "16": 'et dicunt móntibus, et petris: Cádite super nos, et abscóndite nos a fácie sedéntis super thronum, et ab ira Agni:'
  "17": 'quóniam venit dies magnus iræ ipsórum: et quis póterit stare?'
