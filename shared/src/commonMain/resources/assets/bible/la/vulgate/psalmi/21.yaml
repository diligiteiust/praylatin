bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "21"
verses:
  "1": In finem pro susceptióne matutína, Psalmus David.
  "2": 'Deus Deus meus, réspice in me: quare me dereliquísti? longe a salúte mea verba delictórum meórum.'
  "3": 'Deus meus clamábo per diem, et non exáudies: et nocte, et non ad insipiéntiam mihi.'
  "4": Tu autem in sancto hábitas, laus Israel.
  "5": 'In te speravérunt patres nostri: speravérunt, et liberásti eos.'
  "6": 'Ad te clamavérunt, et salvi facti sunt: in te speravérunt, et non sunt confúsi.'
  "7": 'Ego autem sum vermis, et non homo: oppróbrium hóminum, et abiéctio plebis.'
  "8": 'Omnes vidéntes me derisérunt me: locúti sunt lábiis, et movérunt caput.'
  "9": 'Sperávit in Dómino, erípiat eum: salvum fáciat eum, quóniam vult eum.'
  "10": 'Quóniam tu es qui extraxísti me de ventre: spes mea ab ubéribus matris meæ.'
  "11": 'In te proiéctus sum ex útero: de ventre matris meæ Deus meus es tu,'
  "12": 'ne discésseris a me: quóniam tribulátio próxima est: quóniam non est qui ádiuvet.'
  "13": 'Circumdedérunt me vítuli multi: tauri pingues obsedérunt me.'
  "14": Aperuérunt super me os suum, sicut leo rápiens et rúgiens.
  "15": 'Sicut aqua effúsus sum: et dispérsa sunt ómnia ossa mea. Factum est cor meum tamquam cera liquéscens in médio ventris mei.'
  "16": 'Aruit tamquam testa virtus mea, et lingua mea adhǽsit fáucibus meis: et in púlverem mortis deduxísti me.'
  "17": 'Quóniam circumdedérunt me canes multi: concílium malignántium obsédit me. Fodérunt manus meas et pedes meos:'
  "18": 'dinumeravérunt ómnia ossa mea. Ipsi vero consideravérunt et inspexérunt me:'
  "19": divisérunt sibi vestiménta mea, et super vestem meam misérunt sortem.
  "20": 'Tu autem Dómine ne elongáveris auxílium tuum a me: ad defensiónem meam cónspice.'
  "21": 'Erue a frámea Deus ánimam meam: et de manu canis únicam meam.'
  "22": 'Salva me ex ore leónis: et a córnibus unicórnium humilitátem meam.'
  "23": 'Narrábo nomen tuum frátribus meis: in médio ecclésiæ laudábo te.'
  "24": 'Qui timétis Dóminum laudáte eum: univérsum semen Iacob glorificáte eum:'
  "25": 'tímeat eum omne semen Israel: quóniam non sprevit, neque despéxit deprecatiónem páuperis: nec avértit fáciem suam a me: et cum clamárem ad eum exaudívit me.'
  "26": 'Apud te laus mea in ecclésia magna: vota mea reddam in conspéctu timéntium eum.'
  "27": 'Edent páuperes, et saturabúntur: et laudábunt Dóminum qui requírunt eum: vivent corda eórum in sǽculum sǽculi.'
  "28": 'Reminiscéntur et converténtur ad Dóminum univérsi fines terræ: et adorábunt in conspéctu eius univérsæ famíliæ géntium.'
  "29": 'Quóniam Dómini est regnum: et ipse dominábitur géntium.'
  "30": 'Manducavérunt et adoravérunt omnes pingues terræ: in conspéctu eius cadent omnes qui descéndunt in terram.'
  "31": 'Et ánima mea illi vivet: et semen meum sérviet ipsi.'
  "32": 'Annuntiábitur Dómino generátio ventúra: et annuntiábunt cæli iustítiam eius pópulo qui nascétur, quem fecit Dóminus.'
