bible: vulgate
lang: la
language: Latina
book: Marcus
chapter: "12"
verses:
  "1": 'Et cœpit illis in parábolis loqui: Víneam pastinávit homo, et circúmdedit sepem, et fodit lacum, et ædificávit turrim, et locávit eam agrícolis, et péregre proféctus est.'
  "2": Et misit ad agrícolas in témpore servum ut ab agrícolis accíperet de fructu víneæ.
  "3": Qui apprehénsum eum cecidérunt, et dimisérunt vácuum.
  "4": 'Et íterum misit ad illos álium servum: et illum in cápite vulneravérunt, et contuméliis affecérunt.'
  "5": 'Et rursum álium misit, et illum occidérunt: et plures álios: quosdam cædéntes, álios vero occidéntes.'
  "6": 'Adhuc ergo unum habens fílium caríssimum, et illum misit ad eos novíssimum, dicens: Quia reverebúntur fílium meum.'
  "7": 'Colóni autem dixérunt ad ínvicem: Hic est heres: veníte, occidámus eum: et nostra erit heréditas.'
  "8": 'Et apprehendéntes eum, occidérunt: et eiecérunt extra víneam.'
  "9": Quid ergo fáciet dóminus víneæ? Véniet, et perdet colónos, et dabit víneam áliis.
  "10": 'Nec scriptúram hanc legístis: Lápidem, quem reprobavérunt ædificántes, hic factus est in caput ánguli:'
  "11": a Dómino factum est istud, et est mirábile in óculis nostris?
  "12": 'Et quærébant eum tenére: et timuérunt turbam: cognovérunt enim quóniam ad eos parábolam hanc díxerit. Et relícto eo abiérunt.'
  "13": Et mittunt ad eum quosdam ex Pharisǽis, et Herodiánis, ut eum cáperent in verbo.
  "14": 'Qui veniéntes dicunt ei: Magíster, scimus quia verax es, et non curas quemquam: nec enim vides in fáciem hóminum, sed in veritáte viam Dei doces. Licet dari tribútum Cǽsari, an non dábimus?'
  "15": 'Qui sciens versútiam illórum, ait illis: Quid me tentátis? afférte mihi denárium ut vídeam.'
  "16": 'At illi attulérunt ei. Et ait illis: Cuius est imágo hæc, et inscríptio? Dicunt ei: Cǽsaris.'
  "17": 'Respóndens autem Iesus dixit illis: Réddite ígitur quæ sunt Cǽsaris, Cǽsari: et quæ sunt Dei, Deo. Et mirabántur super eo.'
  "18": 'Et venérunt ad eum Sadducǽi, qui dicunt resurrectiónem non esse: et interrogábant eum, dicéntes:'
  "19": Magíster, Móyses nobis scripsit, ut si cuius frater mórtuus fúerit, et dimíserit uxórem, et fílios non relíquerit, accípiat frater eius uxórem ipsíus, et resúscitet semen fratri suo.
  "20": 'Septem ergo fratres erant: et primus accépit uxórem, et mórtuus est non relícto sémine.'
  "21": 'Et secúndus accépit eam, et mórtuus est: et nec iste relíquit semen. Et tértius simíliter.'
  "22": 'Et accepérunt eam simíliter septem: et non reliquérunt semen. Novíssima ómnium defúncta est et múlier.'
  "23": In resurrectióne ergo cum resurréxerint, cuius de his erit uxor? septem enim habuérunt eam uxórem.
  "24": 'Et respóndens Iesus, ait illis: Nonne ídeo errátis, non sciéntes Scriptúras, neque virtútem Dei?'
  "25": Cum enim a mórtuis resurréxerint, neque nubent, neque nubéntur, sed sunt sicut ángeli in cælis.
  "26": 'De mórtuis autem quod resúrgant, non legístis in libro Móysi, super rubum, quómodo díxerit illi Deus, ínquiens: Ego sum Deus Abraham, et Deus Isaac, et Deus Iacob?'
  "27": Non est Deus mortuórum, sed vivórum. Vos ergo multum errátis.
  "28": Et accéssit unus de scribis, qui audíerat illos conquiréntes, et videns quóniam bene illis respónderit, interrogávit eum quod esset primum ómnium mandátum.
  "29": 'Iesus autem respóndit ei: Quia primum ómnium mandátum est: Audi Israel, Dóminus Deus tuus, Deus unus est:'
  "30": et díliges Dóminum Deum tuum ex toto corde tuo, et ex tota ánima tua, et ex tota mente tua, et ex tota virtúte tua. Hoc est primum mandátum.
  "31": 'Secúndum autem símile est illi: Díliges próximum tuum tamquam teípsum. Maius horum áliud mandátum non est.'
  "32": 'Et ait illi scriba: Bene Magíster, in veritáte dixísti, quia unus est Deus, et non est álius præter eum.'
  "33": Et ut diligátur ex toto corde, et ex toto intelléctu, et ex tota ánima, et ex tota fortitúdine, et dilígere próximum tamquam seípsum, maius est ómnibus holocautomátibus, et sacrifíciis.
  "34": 'Iesus autem videns quod sapiénter respondísset, dixit illi: Non es longe a regno Dei. Et nemo iam audébat eum interrogáre.'
  "35": 'Et respóndens Iesus dicébat, docens in templo: Quómodo dicunt scribæ Christum fílium esse David?'
  "36": 'Ipse enim David dicit in Spíritu sancto: Dixit Dóminus Dómino meo: Sede a dextris meis, donec ponam inimícos tuos scabéllum pedum tuórum.'
  "37": Ipse ergo David dicit eum Dóminum, et unde est fílius eius? Et multa turba eum libénter audívit.
  "38": 'Et dicébat eis in doctrína sua: Cavéte a scribis, qui volunt in stolis ambuláre, et salutári in foro,'
  "39": 'et in primis cáthedris sedére in synagógis, et primos discúbitus in cœnis:'
  "40": 'qui dévorant domos viduárum sub obténtu prolíxæ oratiónis: hi accípient prolíxius iudícium.'
  "41": Et sedens Iesus contra gazophylácium, aspiciébat quómodo turba iactáret æs in gazophylácium, et multi dívites iactábant multa.
  "42": Cum venísset autem vídua una pauper, misit duo minúta, quod est quadrans,
  "43": 'et cónvocans discípulos suos, ait illis: Amen dico vobis, quóniam vídua hæc pauper plus ómnibus misit, qui misérunt in gazophylácium.'
  "44": 'Omnes enim ex eo, quod abundábat illis, misérunt: hæc vero de penúria sua ómnia quæ hábuit misit totum victum suum.'
