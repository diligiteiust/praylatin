bible: vulgate
lang: la
language: Latina
book: Ieremias
chapter: "3"
verses:
  "1": 'Vulgo dícitur: Si dimíserit vir uxórem suam, et recédens ab eo, dúxerit virum álterum: numquid revertétur ad eam ultra? numquid non pollúta, et contamináta erit múlier illa? tu autem fornicáta es cum amatóribus multis: tamen revértere ad me, dicit Dóminus, et ego suscípiam te.'
  "2": 'Leva óculos tuos in diréctum, et vide ubi non prostráta sis: in viis sedébas, exspéctans eos quasi latro in solitúdine: et polluísti terram in fornicatiónibus tuis, et in malítiis tuis.'
  "3": 'Quam ob rem prohíbitæ sunt stillæ pluviárum, et serótinus imber non fuit: frons mulíeris meretrícis facta est tibi, noluísti erubéscere.'
  "4": 'Ergo saltem ámodo voca me: Pater meus, dux virginitátis meæ tu es:'
  "5": numquid irascéris in perpétuum, aut perseverábis in finem? Ecce locúta es, et fecísti mala, et potuísti.
  "6": 'Et dixit Dóminus ad me in diébus Iosíæ regis: Numquid vidísti quæ fécerit aversátrix Israel? ábiit sibímet super omnem montem excélsum, et sub omni ligno frondóso, et fornicáta est ibi.'
  "7": 'Et dixi, cum fecísset hæc ómnia: Ad me revértere: et non est revérsa. Et vidit prævaricátrix soror eius Iuda,'
  "8": 'quia pro eo, quod mœcháta esset aversátrix Israel, dimisíssem eam, et dedíssem ei libéllum repúdii: et non tímuit prævaricátrix Iuda soror eius, sed ábiit, et fornicáta est étiam ipsa.'
  "9": Et facilitáte fornicatiónis suæ contaminávit terram, et mœcháta est cum lápide et ligno.
  "10": Et in ómnibus his non est revérsa ad me prævaricátrix soror eius Iuda in toto corde suo, sed in mendácio, ait Dóminus.
  "11": 'Et dixit Dóminus ad me: Iustificávit ánimam suam aversátrix Israel, comparatióne prævaricatrícis Iudæ.'
  "12": 'Vade, et clama sermónes istos contra aquilónem, et dices: Revértere aversátrix Israel, ait Dóminus, et non avértam fáciem meam a vobis: quia sanctus ego sum, dicit Dóminus, et non iráscar in perpétuum.'
  "13": 'Verúmtamen scito iniquitátem tuam, quia in Dóminum Deum tuum prævaricáta es: et dispersísti vias tuas aliénis sub omni ligno frondóso, et vocem meam non audísti, ait Dóminus.'
  "14": 'Convertímini fílii reverténtes, dicit Dóminus: quia ego vir vester: et assúmam vos unum de civitáte, et duos de cognatióne, et introdúcam vos in Sion.'
  "15": Et dabo vobis pastóres iuxta cor meum, et pascent vos sciéntia et doctrína.
  "16": 'Cumque multiplicáti fuéritis, et crevéritis in terra in diébus illis, ait Dóminus, non dicent ultra: Arca testaménti Dómini: neque ascéndet super cor, neque recordabúntur illíus: nec visitábitur, nec fiet ultra.'
  "17": 'In témpore illo vocábunt Ierúsalem sólium Dómini: et congregabúntur ad eam omnes gentes in nómine Dómini in Ierúsalem, et non ambulábunt post pravitátem cordis sui péssimi.'
  "18": In diébus illis ibit domus Iuda ad domum Israel, et vénient simul de terra aquilónis ad terram, quam dedi pátribus vestris.
  "19": 'Ego autem dixi: Quómodo ponam te in fílios, et tríbuam tibi terram desiderábilem, hereditátem præcláram exercítuum géntium? Et dixi: Patrem vocábis me, et post me íngredi non cessábis.'
  "20": Sed quómodo si contémnat múlier amatórem suum, sic contémpsit me domus Israel, dicit Dóminus.
  "21": 'Vox in viis audíta est, plorátus et ululátus filiórum Israel: quóniam iníquam fecérunt viam suam, oblíti sunt Dómini Dei sui.'
  "22": 'Convertímini fílii reverténtes, et sanábo aversiónes vestras. Ecce nos venímus ad te: tu enim es Dóminus Deus noster.'
  "23": 'Vere mendáces erant colles, et multitúdo móntium: vere in Dómino Deo nostro salus Israel.'
  "24": Confúsio comédit labórem patrum nostrórum ab adolescéntia nostra, greges eórum, et arménta eórum, fílios eórum, et fílias eórum.
  "25": 'Dormiémus in confusióne nostra, et opériet nos ignomínia nostra: quóniam Dómino Deo nostro peccávimus nos, et patres nostri, ab adolescéntia nostra usque ad diem hanc: et non audívimus vocem Dómini Dei nostri.'
