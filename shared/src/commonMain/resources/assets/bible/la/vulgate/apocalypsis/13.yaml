bible: vulgate
lang: la
language: Latina
book: Apocalypsis
chapter: "13"
verses:
  "1": Et vidi de mari béstiam ascendéntem habéntem cápita septem, et córnua decem, et super córnua eius decem diadémata, et super cápita eius nómina blasphémiæ.
  "2": Et béstia, quam vidi, símilis erat pardo, et pedes eius sicut pedes ursi, et os eius sicut os leónis. Et dedit illi draco virtútem suam, et potestátem magnam.
  "3": 'Et vidi unum de capítibus suis quasi occísum in mortem: et plaga mortis eius curáta est. Et admiráta est univérsa terra post béstiam.'
  "4": 'Et adoravérunt dracónem, qui dedit potestátem béstiæ: et adoravérunt béstiam, dicéntes: Quis símilis béstiæ? et quis póterit pugnáre cum ea?'
  "5": 'Et datum est ei os loquens magna, et blasphémias: et data est ei potéstas fácere menses quadragínta duos.'
  "6": Et apéruit os suum in blasphémias ad Deum, blasphemáre nomen eius, et tabernáculum eius, et eos, qui in cælo hábitant.
  "7": 'Et est datum illi bellum fácere cum sanctis, et víncere eos. Et data est illi potéstas in omnem tribum, et pópulum, et linguam, et gentem:'
  "8": 'et adoravérunt eam omnes, qui inhábitant terram: quorum non sunt scripta nómina in libro vitæ Agni, qui occísus est ab orígine mundi.'
  "9": Si quis habet aurem, áudiat.
  "10": 'Qui in captivitátem dúxerit, in captivitátem vadet: qui in gládio occíderit, opórtet eum gládio occídi. Hic est patiéntia, et fides sanctórum.'
  "11": Et vidi áliam béstiam ascendéntem de terra, et habébat córnua duo simília Agni, et loquebátur sicut draco.
  "12": 'Et potestátem prióris béstiæ omnem faciébat in conspéctu eius: et fecit terram, et habitántes in ea, adoráre béstiam primam, cuius curáta est plaga mortis.'
  "13": Et fecit signa magna, ut étiam ignem fáceret de cælo descéndere in terram in conspéctu hóminum.
  "14": Et sedúxit habitántes in terra propter signa, quæ data sunt illi fácere in conspéctu béstiæ, dicens habitántibus in terra, ut fáciant imáginem béstiæ, quæ habet plagam gládii, et vixit.
  "15": 'Et datum est illi ut daret spíritum imágini béstiæ, et ut loquátur imágo béstiæ: et fáciat ut quicúmque non adoráverint imáginem béstiæ, occidántur.'
  "16": 'Et fáciet omnes pusíllos, et magnos, et dívites, et páuperes, et líberos, et servos habére charactérem in déxtera manu sua, aut in fróntibus suis:'
  "17": et ne quis possit émere, aut véndere, nisi qui habet charactérem, aut nomen béstiæ, aut númerum nóminis eius.
  "18": 'Hic sapiéntia est. Qui habet intelléctum, cómputet númerum béstiæ. Númerus enim hóminis est: et númerus eius sexcénti sexagínta sex.'
