bible: vulgate
lang: la
language: Latina
book: Deuteronomium
chapter: "11"
verses:
  "1": Ama ítaque Dóminum Deum tuum, et obsérva præcépta eius et cæremónias, iudícia atque mandáta, omni témpore.
  "2": Cognóscite hódie quæ ignórant fílii vestri, qui non vidérunt disciplínam Dómini Dei vestri, magnália eius et robústam manum, extentúmque bráchium,
  "3": signa et ópera quæ fecit in médio Ægýpti Pharaóni regi, et univérsæ terræ eius,
  "4": 'omníque exercítui Ægyptiórum, et equis ac cúrribus: quómodo operúerint eos aquæ maris Rubri, cum vos persequeréntur, et deléverit eos Dóminus usque in præséntem diem:'
  "5": 'vobísque quæ fécerit in solitúdine donec venirétis ad hunc locum:'
  "6": 'et Dathan atque Abiron fíliis Eliab, qui fuit fílius Ruben: quos apérto ore suo terra absórbuit, cum dómibus et tabernáculis, et univérsa substántia eórum, quam habébant in médio Israel.'
  "7": Oculi vestri vidérunt ópera Dómini magna quæ fecit,
  "8": ut custodiátis univérsa mandáta illíus, quæ ego hódie præcípio vobis, et possítis introíre, et possidére terram, ad quam ingredímini,
  "9": 'multóque in ea vivátis témpore: quam sub iuraménto pollícitus est Dóminus pátribus vestris, et sémini eórum, lacte et melle manántem.'
  "10": 'Terra enim, ad quam ingréderis possidéndam, non est sicut terra Ægýpti, de qua exísti, ubi iacto sémine in hortórum morem aquæ ducúntur irríguæ:'
  "11": sed montuósa est et campéstris, de cælo exspéctans plúvias,
  "12": quam Dóminus Deus tuus semper invísit, et óculi illíus in ea sunt a princípio anni usque ad finem eius.
  "13": 'Si ergo obediéritis mandátis meis, quæ ego hódie præcípio vobis, ut diligátis Dóminum Deum vestrum, et serviátis ei in toto corde vestro, et in tota ánima vestra:'
  "14": dabit plúviam terræ vestræ temporáneam et serótinam, ut colligátis fruméntum, et vinum, et óleum,
  "15": fœnúmque ex agris ad pascénda iuménta, et ut ipsi comedátis ac saturémini.
  "16": 'Cavéte ne forte decipiátur cor vestrum, et recedátis a Dómino, serviatísque diis aliénis, et adorétis eos:'
  "17": iratúsque Dóminus claudat cælum, et plúviæ non descéndant, nec terra det germen suum, pereatísque velóciter de terra óptima, quam Dóminus datúrus est vobis.
  "18": Pónite hæc verba mea in córdibus et in ánimis vestris, et suspéndite ea pro signo in mánibus, et inter óculos vestros collocáte.
  "19": 'Docéte fílios vestros ut illa mediténtur: quando séderis in domo tua, et ambuláveris in via, et accubúeris atque surréxeris.'
  "20": 'Scribes ea super postes et iánuas domus tuæ:'
  "21": ut multiplicéntur dies tui, et filiórum tuórum in terra, quam iurávit Dóminus pátribus tuis, ut daret eis quámdiu cælum ímminet terræ.
  "22": Si enim custodiéritis mandáta quæ ego præcípio vobis, et fecéritis ea, ut diligátis Dóminum Deum vestrum, et ambulétis in ómnibus viis eius, adhæréntes ei,
  "23": dispérdet Dóminus omnes gentes istas ante fáciem vestram, et possidébitis eas, quæ maióres et fortióres vobis sunt.
  "24": Omnis locus, quem calcáverit pes vester, vester erit. A desérto, et a Líbano, a flúmine magno Euphráte usque ad mare occidentále erunt términi vestri.
  "25": 'Nullus stabit contra vos: terrórem vestrum et formídinem dabit Dóminus Deus vester super omnem terram quam calcatúri estis, sicut locútus est vobis.'
  "26": 'En propóno in conspéctu vestro hódie benedictiónem et maledictiónem:'
  "27": 'benedictiónem, si obediéritis mandátis Dómini Dei vestri, quæ ego hódie præcípio vobis:'
  "28": maledictiónem, si non obediéritis mandátis Dómini Dei vestri, sed recesséritis de via, quam ego nunc osténdo vobis, et ambulavéritis post deos aliénos, quos ignorátis.
  "29": 'Cum vero introdúxerit te Dóminus Deus tuus in terram, ad quam pergis habitándam, pones benedictiónem super montem Garízim, maledictiónem super montem Hebal:'
  "30": qui sunt trans Iordánem, post viam quæ vergit ad solis occúbitum in terra Chananǽi, qui hábitat in campéstribus contra Gálgalam, quæ est iuxta vallem tendéntem et intrántem procul.
  "31": Vos enim transíbitis Iordánem, ut possideátis terram, quam Dóminus Deus vester datúrus est vobis, ut habeátis et possideátis illam.
  "32": Vidéte ergo ut impleátis cæremónias atque iudícia, quæ ego hódie ponam in conspéctu vestro.
