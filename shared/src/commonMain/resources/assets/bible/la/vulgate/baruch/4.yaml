bible: vulgate
lang: la
language: Latina
book: Baruch
chapter: "4"
verses:
  "1": 'Hic liber mandatórum Dei, et lex, quæ est in ætérnum: omnes, qui tenent eam, pervénient ad vitam: qui autem dereliquérunt eam, in mortem.'
  "2": 'Convértere Iacob, et apprehénde eam: ámbula per viam ad splendórem eius contra lumen eius.'
  "3": Ne tradas álteri glóriam tuam, et dignitátem tuam genti aliénæ.
  "4": 'Beáti sumus Israel: quia quæ Deo placent, manifésta sunt nobis.'
  "5": 'Animǽquior esto pópulus Dei, memorábilis Israel:'
  "6": 'venúmdati estis géntibus non in perditiónem: sed propter quod in ira ad iracúndiam provocástis Deum, tráditi estis adversáriis.'
  "7": Exacerbástis enim eum, qui fecit vos, Deum ætérnum, immolántes dæmóniis, et non Deo.
  "8": Oblíti enim estis Deum, qui nutrívit vos, et contristástis nutrícem vestram Ierúsalem.
  "9": 'Vidit enim iracúndiam a Deo veniéntem vobis, et dixit: Audíte confínes Sion, addúxit enim mihi Deus luctum magnum:'
  "10": vidi enim captivitátem pópuli mei, filiórum meórum et filiárum, quam superdúxit illis ætérnus.
  "11": 'Nutrívi enim illos cum iucunditáte: dimísi autem illos cum fletu et luctu.'
  "12": 'Nemo gáudeat super me víduam, et desolátam: a multis derelícta sum propter peccáta filiórum meórum, quia declinavérunt a lege Dei.'
  "13": Iustítias autem ipsíus nesciérunt, nec ambulavérunt per vias mandatórum Dei, neque per sémitas veritátis eius cum iustítia ingréssi sunt.
  "14": Véniant confínes Sion, et memoréntur captivitátem filiórum, et filiárum meárum, quam superdúxit illis ætérnus.
  "15": 'Addúxit enim super illos gentem de longínquo, gentem ímprobam, et altérius linguæ:'
  "16": qui non sunt reveríti senem, neque puerórum misérti sunt, et abduxérunt diléctos víduæ, et a fíliis únicam desolavérunt.
  "17": Ego autem quid possum adiuváre vos?
  "18": Qui enim addúxit super vos mala, ipse vos erípiet de mánibus inimicórum vestrórum.
  "19": 'Ambuláte fílii, ambuláte: ego enim derelícta sum sola.'
  "20": Exui me stola pacis, índui autem me sacco obsecratiónis, et clamábo ad Altíssimum in diébus meis.
  "21": Animæquióres estóte fílii, clamáte ad Dóminum, et erípiet vos de manu príncipum inimicórum.
  "22": 'Ego enim sperávi in ætérnum salútem vestram: et venit mihi gáudium a sancto super misericórdia, quæ véniet vobis ab ætérno salutári nostro.'
  "23": 'Emísi enim vos cum luctu et plorátu: redúcet autem vos mihi Dóminus cum gáudio et iucunditáte in sempitérnum.'
  "24": Sicut enim vidérunt vicínæ Sion captivitátem vestram a Deo, sic vidébunt et in celeritáte salútem vestram a Deo, quæ supervéniet vobis cum honóre magno et splendóre ætérno.
  "25": 'Fílii patiénter sustinéte iram, quæ supervénit vobis: persecútus est enim te inimícus tuus, sed cito vidébis perditiónem ipsíus: et super cervíces ipsíus ascéndes.'
  "26": 'Delicáti mei ambulavérunt vias ásperas: ducti sunt enim ut grex diréptus ab inimícis.'
  "27": 'Animæquióres estóte fílii, et proclamáte ad Dóminum: erit enim memória vestra ab eo, qui duxit vos.'
  "28": Sicut enim fuit sensus vester ut errarétis a Deo, décies tantum íterum converténtes requirétis eum.
  "29": Qui enim indúxit vobis mala, ipse rursum addúcet vobis sempitérnam iucunditátem cum salúte vestra.
  "30": Animǽquior esto Ierúsalem, exhortátur enim te, qui te nominávit.
  "31": 'Nocéntes períbunt, qui te vexavérunt: et qui gratuláti sunt in tua ruína, puniéntur:'
  "32": 'civitátes, quibus serviérunt fílii tui, puniéntur: et quæ accépit fílios tuos.'
  "33": Sicut enim gavísa est in tua ruína, et lætáta est in casu tuo, sic contristábitur in sua desolatióne.
  "34": Et amputábitur exsultátio multitúdinis eius, et gaudimónium eius erit in luctum.
  "35": Ignis enim supervéniet ei ab ætérno in longitúrnis diébus, et habitábitur a dæmóniis in multitúdine témporis.
  "36": Circúmspice Ierúsalem ad oriéntem, et vide iucunditátem a Deo tibi veniéntem.
  "37": 'Ecce enim véniunt fílii tui, quos dimisísti dispérsos: véniunt collécti ab oriénte usque ad occidéntem, in verbo sancti gaudéntes in honórem Dei.'
