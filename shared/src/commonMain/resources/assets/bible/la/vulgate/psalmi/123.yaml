bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "123"
verses:
  "1": 'Cánticum gráduum. Nisi quia Dóminus erat in nobis, dicat nunc Israel:'
  "2": nisi quia Dóminus erat in nobis, cum exsúrgerent hómines in nos,
  "3": 'forte vivos deglutíssent nos: cum irascerétur furor eórum in nos,'
  "4": fórsitan aqua absorbuísset nos.
  "5": 'Torréntem pertransívit ánima nostra: fórsitan pertransísset ánima nostra aquam intolerábilem.'
  "6": Benedíctus Dóminus, qui non dedit nos in captiónem déntibus eórum.
  "7": 'Anima nostra sicut passer erépta est de láqueo venántium: láqueus contrítus est, et nos liberáti sumus.'
  "8": Adiutórium nostrum in nómine Dómini, qui fecit cælum et terram.
