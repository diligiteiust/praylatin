bible: vulgate
lang: la
language: Latina
book: Leviticus
chapter: "6"
verses:
  "1": 'Locútus est Dóminus ad Móysen, dicens:'
  "2": Anima quæ peccáverit, et contémpto Dómino, negáverit próximo suo depósitum quod fídei eius créditum fúerat, vel vi áliquid extórserit, aut calúmniam fécerit,
  "3": sive rem pérditam invénerit, et infícians ínsuper peieráverit, et quódlibet áliud ex plúribus fécerit, in quibus solent peccáre hómines,
  "4": convícta delícti,
  "5": reddet ómnia, quæ per fraudem vóluit obtinére, íntegra, et quintam ínsuper partem dómino cui damnum intúlerat.
  "6": 'Pro peccáto autem suo ófferet aríetem immaculátum de grege, et dabit eum sacerdóti, iuxta æstimatiónem mensurámque delícti:'
  "7": qui rogábit pro eo coram Dómino, et dimittétur illi pro síngulis quæ faciéndo peccávit.
  "8": 'Locutúsque est Dóminus ad Móysen, dicens:'
  "9": 'Prǽcipe Aaron et fíliis eius: Hæc est lex holocáusti: cremábitur in altári tota nocte usque mane: ignis ex eódem altári erit.'
  "10": 'Vestiétur túnica sacérdos et feminálibus líneis: tollétque cíneres, quos vorans ignis exússit, et ponens iuxta altáre,'
  "11": spoliábitur prióribus vestiméntis, indutúsque áliis, efférret eos extra castra, et in loco mundíssimo usque ad favíllam consúmi fáciet.
  "12": Ignis autem in altári semper ardébit, quem nútriet sacérdos subíciens ligna mane per síngulos dies, et impósito holocáusto, désuper adolébit ádipes pacificórum.
  "13": Ignis est iste perpétuus, qui numquam defíciet in altári.
  "14": Hæc est lex sacrifícii et libamentórum, quæ ófferent fílii Aaron coram Dómino, et coram altári.
  "15": 'Tollet sacérdos pugíllum símilæ, quæ conspérsa est óleo, et totum thus, quod super símilam pósitum est: adolebítque illud in altári in moniméntum odóris suavíssimi Dómino:'
  "16": 'réliquam autem partem símilæ cómedet Aaron cum fíliis suis, absque ferménto: et cómedet in loco sancto átrii tabernáculi.'
  "17": Ideo autem non fermentábitur, quia pars eius in Dómini offértur incénsum. Sanctum sanctórum erit, sicut pro peccáto atque delícto.
  "18": 'Mares tantum stirpis Aaron cómedent illud. Legítimum ac sempitérnum erit in generatiónibus vestris de sacrifíciis Dómini: omnis, qui tetígerit illa, sanctificábitur.'
  "19": 'Locutúsque est Dóminus ad Móysen, dicens:'
  "20": 'Hæc est oblátio Aaron, et filiórum eius, quam offérre debent Dómino in die unctiónis suæ. Décimam partem ephi ófferent símilæ in sacrifício sempitérno, médium eius mane, et médium eius véspere:'
  "21": quæ in sartágine óleo conspérsa frigétur. Offeret autem eam cálidam in odórem suavíssimum Dómino
  "22": sacérdos, qui iure patri succésserit, et tota cremábitur in altári.
  "23": Omne enim sacrifícium sacerdótum igne consumétur, nec quisquam cómedet ex eo.
  "24": 'Locútus est autem Dóminus ad Móysen, dicens:'
  "25": 'Lóquere Aaron et fíliis eius: Ista est lex hóstiæ pro peccáto: in loco ubi offértur holocáustum, immolábitur coram Dómino. Sanctum sanctórum est.'
  "26": Sacérdos qui offert, cómedet eam in loco sancto, in átrio tabernáculi.
  "27": Quidquid tetígerit carnes eius, sanctificábitur. Si de sánguine illíus vestis fúerit aspérsa, lavábitur in loco sancto.
  "28": 'Vas autem fíctile, in quo cocta est, confringétur: quod si vas ǽneum fúerit, defricábitur, et lavábitur aqua.'
  "29": Omnis másculus de génere sacerdotáli vescétur de cárnibus eius, quia Sanctum sanctórum est.
  "30": Hóstia enim quæ cǽditur pro peccáto, cuius sanguis infértur in tabernáculum testimónii ad expiándum in sanctuário, non comedétur, sed comburétur igni.
