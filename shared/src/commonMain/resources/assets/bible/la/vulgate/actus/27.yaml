bible: vulgate
lang: la
language: Latina
book: Actus Apostolorum
chapter: "27"
verses:
  "1": Ut autem iudicátum est navigáre eum in Itáliam, et tradi Paulum cum réliquis custódiis centurióni nómine Iúlio cohórtis Augústæ,
  "2": ascendéntes navem Adrumetínam, incipiéntes navigáre circa Asiæ loca, sustúlimus, perseveránte nobíscum Aristárcho Macédone Thessalonicénsi.
  "3": Sequénti autem die devénimus Sidónem. Humáne autem tractans Iúlius Paulum, permísit ad amícos ire, et curam sui ágere.
  "4": Et inde cum sustulissémus, subnavigávimus Cyprum, proptérea quod essent venti contrárii.
  "5": 'Et pélagus Cilíciæ, et Pamphýliæ navigántes, vénimus Lystram, quæ est Lýciæ:'
  "6": et ibi invéniens centúrio navem Alexandrínam navigántem in Itáliam, transpósuit nos in eam.
  "7": 'Et cum multis diébus tarde navigarémus, et vix devenissémus contra Gnidum, prohibénte nos vento, adnavigávimus Cretæ iuxta Salmónem:'
  "8": et vix iuxta navigántes, vénimus in locum quemdam, qui vocátur Bonipórtus, cui iuxta erat cívitas Thalássa.
  "9": Multo autem témpore perácto, et cum iam non esset tuta navigátio, eo quod et ieiúnium iam præteriísset, consolabátur eos Paulus,
  "10": 'dicens eis: Viri, vídeo quóniam cum iniúria, et multo damno non solum óneris, et navis, sed étiam animárum nostrárum íncipit esse navigátio.'
  "11": Centúrio autem gubernatóri et naucléro magis credébat, quam his, quæ a Paulo dicebántur.
  "12": Et cum aptus portus non esset ad hiemándum, plúrimi statuérunt consílium navigáre inde, si quómodo possent, deveniéntes Phœnícen, hiemáre, portum Cretæ respiciéntem ad Africum, et ad Corum.
  "13": Aspiránte autem austro, æstimántes propósitum se tenére, cum sustulíssent de Asson, legébant Cretam.
  "14": Non post multum autem misit se contra ipsam ventus typhónicus, qui vocátur Euroáquilo.
  "15": Cumque arrépta esset navis, et non posset conári in ventum, data nave flátibus, ferebámur.
  "16": In ínsulam autem quamdam decurréntes, quæ vocátur Cauda, potúimus vix obtinére scapham.
  "17": Qua subláta, adiutóriis utebántur, accingéntes navem, timéntes ne in Syrtim incíderent, summísso vase sic ferebántur.
  "18": 'Válida autem nobis tempestáte iactátis, sequénti die iactum fecérunt:'
  "19": et tértia die suis mánibus armaménta navis proiecérunt.
  "20": Neque autem sole, neque sidéribus apparéntibus per plures dies, et tempestáte non exígua imminénte, iam abláta erat spes omnis salútis nostræ.
  "21": 'Et cum multa ieiunátio fuísset, tunc stans Paulus in médio eórum, dixit: Oportébat quidem, o viri, audíto me, non tóllere a Creta, lucríque fácere iniúriam hanc, et iactúram.'
  "22": 'Et nunc suádeo vobis bono ánimo esse: amíssio enim nullíus ánimæ erit ex vobis, prætérquam navis.'
  "23": Astitit enim mihi hac nocte ángelus Dei, cuius sum ego, et cui desérvio,
  "24": 'dicens: Ne tímeas Paule: Cǽsari te opórtet assístere: et ecce donávit tibi Deus omnes, qui návigant tecum.'
  "25": 'Propter quod bono ánimo estóte viri: credo enim Deo quia sic erit, quemádmodum dictum est mihi.'
  "26": In ínsulam autem quamdam opórtet nos deveníre.
  "27": Sed posteáquam quartadécima nox supervénit, navigántibus nobis in Adria circa médiam noctem, suspicabántur nautæ apparére sibi áliquam regiónem.
  "28": 'Qui et summitténtes bólidem, invenérunt passus vigínti: et pusíllum inde separáti, invenérunt passus quíndecim.'
  "29": Timéntes autem ne in áspera loca inciderémus, de puppi mitténtes ánchoras quátuor, optábant diem fíeri.
  "30": Nautis vero quæréntibus fúgere de navi, cum misíssent scapham in mare, sub obténtu quasi incíperent a prora ánchoras exténdere,
  "31": 'dixit Paulus centurióni, et milítibus: Nisi hi in navi mánserint, vos salvi fíeri non potéstis.'
  "32": Tunc abscidérunt mílites funes scaphæ, et passi sunt eam excídere.
  "33": 'Et cum lux incíperet fíeri, rogábat Paulus omnes súmere cibum, dicens: Quartadécima die hódie exspectántes ieiúni permanétis, nihil accipiéntes.'
  "34": 'Propter quod rogo vos accípere cibum pro salúte vestra: quia nullíus vestrum capíllus de cápite períbit.'
  "35": 'Et cum hæc dixísset, sumens panem, grátias egit Deo in conspéctu ómnium: et cum fregísset, cœpit manducáre.'
  "36": Animæquióres autem facti omnes, et ipsi sumpsérunt cibum.
  "37": Erámus vero univérsæ ánimæ in navi ducéntæ septuagínta sex.
  "38": Et satiáti cibo alleviábant navem, iactántes tríticum in mare.
  "39": 'Cum autem dies factus esset, terram non agnoscébant: sinum vero quemdam considerábant habéntem littus, in quem cogitábant, si possent, eícere navem.'
  "40": 'Et cum ánchoras sustulíssent, committébant se mari, simul laxántes iunctúras gubernaculórum: et leváto artemóne secúndum auræ flatum, tendébant ad littus.'
  "41": 'Et cum incidissémus in locum dithalássum, impegérunt navem: et prora quidem fixa manébat immóbilis, puppis vero solvebátur a vi maris.'
  "42": Mílitum autem consílium fuit ut custódias occíderent, ne quis cum enatásset, effúgeret.
  "43": 'Centúrio autem volens serváre Paulum, prohíbuit fíeri: iussítque eos, qui possent natáre, emíttere se primos, et evádere, et ad terram exíre:'
  "44": 'et céteros, álios in tábulis ferébant: quosdam super ea, quæ de navi erant. Et sic factum est, ut omnes ánimæ eváderent ad terram.'
