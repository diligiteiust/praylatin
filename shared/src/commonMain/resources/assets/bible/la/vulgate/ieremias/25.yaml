bible: vulgate
lang: la
language: Latina
book: Ieremias
chapter: "25"
verses:
  "1": Verbum, quod factum est ad Ieremíam de omni pópulo Iuda, in anno quarto Ióakim fílii Iosíæ regis Iuda (ipse est annus primus Nabuchodónosor regis Babylónis),
  "2": 'quod locútus est Ieremías prophéta ad omnem pópulum Iuda, et ad univérsos habitatóres Ierúsalem, dicens:'
  "3": A tertiodécimo anno Iosíæ fílii Amon regis Iuda, usque ad diem hanc, iste tértius et vigésimus annus, factum est verbum Dómini ad me, et locútus sum ad vos, de nocte consúrgens et loquens, et non audístis.
  "4": 'Et misit Dóminus ad vos omnes servos suos prophétas, consúrgens dilúculo, mitténsque: et non audístis, neque inclinástis aures vestras ut audirétis,'
  "5": 'cum díceret: Revertímini unusquísque a via sua mala, et a péssimis cogitatiónibus vestris: et habitábitis in terra, quam dedit Dóminus vobis, et pátribus vestris, a sǽculo et usque in sǽculum.'
  "6": 'Et nolíte ire post deos aliénos, ut serviátis eis, adoretísque eos: neque me ad iracúndiam provocétis in opéribus mánuum vestrárum, et non afflígam vos.'
  "7": Et non audístis me, dicit Dóminus, ut me ad iracúndiam provocarétis in opéribus mánuum vestrárum, in malum vestrum.
  "8": 'Proptérea hæc dicit Dóminus exercítuum: Pro eo quod non audístis verba mea,'
  "9": 'ecce ego mittam et assúmam univérsas cognatiónes aquilónis, ait Dóminus, et Nabuchodónosor regem Babylónis servum meum: et addúcam eos super terram istam, et super habitatóres eius, et super omnes natiónes, quæ in circúitu illíus sunt: et interfíciam eos, et ponam eos in stupórem et in síbilum, et in solitúdines sempitérnas.'
  "10": Perdámque ex eis vocem gáudii, et vocem lætítiæ, vocem sponsi, et vocem sponsæ, vocem molæ, et lumen lucérnæ.
  "11": 'Et erit univérsa terra hæc in solitúdinem, et in stupórem: et sérvient omnes gentes istæ regi Babylónis septuagínta annis.'
  "12": 'Cumque impléti fúerint septuagínta anni, visitábo super regem Babylónis, et super gentem illam, dicit Dóminus, iniquitátem eórum, et super terram Chaldæórum: et ponam illam in solitúdines sempitérnas.'
  "13": 'Et addúcam super terram illam ómnia verba mea, quæ locútus sum contra eam, omne quod scriptum est in libro isto, quæcúmque prophetávit Ieremías advérsum omnes gentes:'
  "14": 'quia serviérunt eis, cum essent gentes multæ, et reges magni: et reddam eis secúndum ópera eórum, et secúndum facta mánuum suárum.'
  "15": 'Quia sic dicit Dóminus exercítuum, Deus Israel: Sume cálicem vini furóris huius de manu mea, et propinábis de illo cunctis géntibus, ad quas ego mittam te.'
  "16": Et bibent, et turbabúntur, et insánient a fácie gládii, quem ego mittam inter eos.
  "17": 'Et accépi cálicem de manu Dómini, et propinávi cunctis géntibus, ad quas misit me Dóminus:'
  "18": 'Ierúsalem, et civitátibus Iuda, et régibus eius, et princípibus eius: ut darem eos in solitúdinem, et in stupórem, et in síbilum, et in maledictiónem, sicut est dies ista:'
  "19": 'Pharaóni regi Ægýpti, et servis eius, et princípibus eius, et omni pópulo eius:'
  "20": 'et univérsis generáliter: cunctis régibus terræ Ausítidis, et cunctis régibus terræ Philísthiim, et Ascalóni, et Gazæ, et Accaron, et relíquiis Azóti,'
  "21": 'et Idumǽæ, et Moab, et fíliis Ammon:'
  "22": 'et cunctis régibus Tyri, et univérsis régibus Sidónis, et régibus terræ insulárum, qui sunt trans mare:'
  "23": 'et Dedan, et Thema, et Buz, et univérsis, qui attónsi sunt in comam:'
  "24": 'et cunctis régibus Arábiæ, et cunctis régibus occidéntis, qui hábitant in desérto:'
  "25": 'et cunctis régibus Zambri, et cunctis régibus Elam, et cunctis régibus Medórum:'
  "26": 'cunctis quoque régibus aquilónis, de prope et de longe, unicuíque contra fratrem suum: et ómnibus regnis terræ, quæ super fáciem eius sunt: et rex Sesach bibet post eos.'
  "27": 'Et dices ad eos: Hæc dicit Dóminus exercítuum, Deus Israel: Bíbite, et inebriámini, et vómite: et cádite, neque surgátis a fácie gládii, quem ego mittam inter vos.'
  "28": 'Cumque nolúerint accípere cálicem de manu tua ut bibant, dices ad eos: Hæc dicit Dóminus exercítuum: Bibéntes bibétis:'
  "29": 'quia ecce in civitáte, in qua invocátum est nomen meum, ego incípiam afflígere, et vos quasi innocéntes et immúnes éritis? non éritis immúnes: gládium enim ego voco super omnes habitatóres terræ, dicit Dóminus exercítuum.'
  "30": 'Et tu prophetábis ad eos ómnia verba hæc, et dices ad illos: Dóminus de excélso rúgiet, et de habitáculo sancto suo dabit vocem suam: rúgiens rúgiet super decórem suum: celéuma quasi calcántium concinétur advérsus omnes habitatóres terræ.'
  "31": 'Pervénit sónitus usque ad extréma terræ, quia iudícium Dómino cum géntibus: iudicátur ipse cum omni carne, ímpios trádidi gládio, dicit Dóminus.'
  "32": 'Hæc dicit Dóminus exercítuum: Ecce afflíctio egrediétur de gente in gentem, et turbo magnus egrediétur a summitátibus terræ.'
  "33": 'Et erunt interfécti Dómini in die illa, a summo terræ usque ad summum eius: non plangéntur, et non colligéntur, neque sepeliéntur: in sterquilínium super fáciem terræ iacébunt.'
  "34": 'Ululáte pastóres, et clamáte, et aspérgite vos cínere, optimátes gregis: quia compléti sunt dies vestri ut interficiámini, et dissipatiónes vestræ, et cadétis quasi vasa pretiósa.'
  "35": Et períbit fuga a pastóribus, et salvátio ab optimátibus gregis.
  "36": 'Vox clamóris pastórum, et ululátus optimátum gregis: quia vastávit Dóminus páscua eórum.'
  "37": Et conticuérunt arva pacis a fácie iræ furóris Dómini.
  "38": Derelíquit quasi leo umbráculum suum, quia facta est terra eórum in desolatiónem a fácie iræ colúmbæ, et a fácie iræ furóris Dómini.
