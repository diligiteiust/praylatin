bible: vulgate
lang: la
language: Latina
book: Ecclesiasticus
chapter: "7"
verses:
  "1": Noli fácere mala, et non te apprehéndent.
  "2": Discéde ab iníquo, et defícient mala abs te.
  "3": Fili, non sémines mala in sulcis iniustítiæ, et non metes ea in séptuplum.
  "4": Noli quǽrere a Dómino ducátum, neque a rege cáthedram honóris.
  "5": 'Non te iustífices ante Deum, quóniam ágnitor cordis ipse est: et penes regem noli velle vidéri sápiens.'
  "6": 'Noli quǽrere fíeri iudex, nisi váleas virtúte irrúmpere iniquitátes: ne forte extiméscas fáciem poténtis, et ponas scándalum in æquitáte tua.'
  "7": Non pecces in multitúdinem civitátis, nec te immíttas in pópulum,
  "8": 'neque álliges duplícia peccáta: nec enim in uno eris immúnis.'
  "9": 'Noli esse pusillánimis in ánimo tuo:'
  "10": exoráre, et fácere eleemósynam ne despícias.
  "11": 'Ne dicas: In multitúdine múnerum meórum respíciet Deus, et offerénte me Deo altíssimo, múnera mea suscípiet.'
  "12": 'Non irrídeas hóminem in amaritúdine ánimæ: est enim qui humíliat et exáltat, circumspéctor Deus.'
  "13": 'Noli amáre mendácium advérsus fratrem tuum: neque in amícum simíliter fácias.'
  "14": 'Noli velle mentíri omne mendácium: assidúitas enim illíus non est bona.'
  "15": Noli verbósus esse in multitúdine presbyterórum, et non íteres verbum in oratióne tua.
  "16": Non óderis laboriósa ópera, et rusticatiónem creátam ab Altíssimo.
  "17": Non te réputes in multitúdine indisciplinatórum.
  "18": Meménto iræ, quóniam non tardábit.
  "19": 'Humília valde spíritum tuum: quóniam vindícta carnis ímpii, ignis et vermis.'
  "20": Noli prævaricári in amícum pecúniam differéntem, neque fratrem caríssimum auro spréveris.
  "21": 'Noli discédere a mulíere sensáta et bona, quam sortítus es in timóre Dómini: grátia enim verecúndiæ illíus super aurum.'
  "22": Non lædas servum in veritáte operántem, neque mercenárium dantem ánimam suam.
  "23": 'Servus sensátus sit tibi diléctus quasi ánima tua: non defráudes illum libertáte, neque ínopem derelínquas illum.'
  "24": 'Pécora tibi sunt? atténde illis: et si sunt utília, persevérent apud te.'
  "25": Fílii tibi sunt? érudi illos, et curva illos a puerítia illórum.
  "26": Fíliæ tibi sunt? serva corpus illárum, et non osténdas hílarem fáciem tuam ad illas.
  "27": 'Trade fíliam, et grande opus féceris: et hómini sensáto da illam.'
  "28": 'Múlier si est tibi secúndum ánimam tuam, non proícias illam: et odíbili non credas te. In toto corde tuo'
  "29": 'honóra patrem tuum, et gémitus matris tuæ ne obliviscáris:'
  "30": 'meménto quóniam nisi per illos natus non fuísses: et retríbue illis, quómodo et illi tibi.'
  "31": In tota ánima tua time Dóminum, et sacerdótes illíus sanctífica.
  "32": 'In omni virtúte tua dílige eum qui te fecit: et minístros eius ne derelínquas.'
  "33": Honóra Deum ex tota ánima tua, et honorífica sacerdótes, et propúrga te cum bráchiis.
  "34": 'Da illis partem, sicut mandátum est tibi, primitiárum et purgatiónis: et de negligéntia tua purga te cum paucis.'
  "35": 'Datum brachiórum tuórum, et sacrifícium sanctificatiónis ófferes Dómino, et inítia sanctórum:'
  "36": et páuperi porríge manum tuam, ut perficiátur propitiátio et benedíctio tua.
  "37": Grátia dati in conspéctu omnis vivéntis, et mórtuo non prohíbeas grátiam.
  "38": Non desis plorántibus in consolatióne, et cum lugéntibus ámbula.
  "39": 'Non te pígeat visitáre infírmum: ex his enim in dilectióne firmáberis.'
  "40": In ómnibus opéribus tuis memoráre novíssima tua, et in ætérnum non peccábis.
