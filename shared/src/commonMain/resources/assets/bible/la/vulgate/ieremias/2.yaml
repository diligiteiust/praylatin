bible: vulgate
lang: la
language: Latina
book: Ieremias
chapter: "2"
verses:
  "1": 'Et factum est verbum Dómini ad me, dicens:'
  "2": 'Vade, et clama in áuribus Ierúsalem, dicens: Hæc dicit Dóminus: Recordátus sum tui, míserans adolescéntiam tuam, et caritátem desponsatiónis tuæ, quando secúta es me in desérto, in terra, quæ non seminátur.'
  "3": 'Sanctus Israel Dómino, primítiæ frugum eius: omnes, qui dévorant eum, delínquunt: mala vénient super eos, dicit Dóminus.'
  "4": 'Audíte verbum Dómini domus Iacob, et omnes cognatiónes domus Israel:'
  "5": 'Hæc dicit Dóminus: Quid invenérunt patres vestri in me iniquitátis, quia elongavérunt a me, et ambulavérunt post vanitátem, et vani facti sunt?'
  "6": 'Et non dixérunt: Ubi est Dóminus, qui ascéndere nos fecit de terra Ægýpti: qui tradúxit nos per desértum, per terram inhabitábilem et ínviam, per terram sitis, et imáginem mortis, per terram, in qua non ambulávit vir, neque habitávit homo?'
  "7": 'Et indúxi vos in terram Carméli, ut comederétis fructum eius et óptima illíus: et ingréssi contaminástis terram meam, et hereditátem meam posuístis in abominatiónem.'
  "8": 'Sacerdótes non dixérunt: Ubi est Dóminus? et tenéntes legem nesciérunt me, et pastóres prævaricáti sunt in me, et prophétæ prophetavérunt in Baal, et idóla secúti sunt.'
  "9": Proptérea adhuc iudício conténdam vobíscum, ait Dóminus, et cum fíliis vestris disceptábo.
  "10": 'Transíte ad ínsulas Cethim, et vidéte: et in Cedar míttite, et consideráte veheménter: et vidéte si factum est huiuscémodi.'
  "11": 'Si mutávit gens deos suos, et certe ipsi non sunt dii: pópulus vero meus mutávit glóriam suam in idólum.'
  "12": Obstupéscite cæli super hoc, et portæ eius desolámini veheménter, dicit Dóminus.
  "13": 'Duo enim mala fecit pópulus meus: me dereliquérunt fontem aquæ vivæ, et fodérunt sibi cistérnas, cistérnas dissipátas, quæ continére non valent aquas.'
  "14": Numquid servus est Israel, aut vernáculus? quare ergo factus est in prædam?
  "15": 'Super eum rugiérunt leónes, et dedérunt vocem suam: posuérunt terram eius in solitúdinem: civitátes eius exústæ sunt, et non est qui hábitet in eis.'
  "16": Fílii quoque Mémpheos et Taphnes constupravérunt te usque ad vérticem.
  "17": Numquid non istud factum est tibi, quia dereliquísti Dóminum Deum tuum eo témpore, quo ducébat te per viam?
  "18": Et nunc quid tibi vis in via Ægýpti, ut bibas aquam túrbidam? et quid tibi cum via Assyriórum, ut bibas aquam flúminis?
  "19": Arguet te malítia tua, et avérsio tua increpábit te. Scito, et vide quia malum et amárum est reliquísse te Dóminum Deum tuum, et non esse timórem mei apud te, dicit Dóminus Deus exercítuum.
  "20": 'A sǽculo confregísti iugum meum: rupísti víncula mea, et dixísti: Non sérviam. In omni enim colle sublími, et sub omni ligno frondóso tu prosternebáris méretrix.'
  "21": 'Ego autem plantávi te víneam eléctam, omne semen verum: quómodo ergo convérsa es mihi in pravum vínea aliéna?'
  "22": Si láveris te nitro, et multiplicáveris tibi herbam borith, maculáta es in iniquitáte tua coram me, dicit Dóminus Deus.
  "23": 'Quómodo dicis: Non sum pollúta, post Báalim non ambulávi? vide vias tuas in conválle, scito quid féceris: cursor levis éxplicans vias suas.'
  "24": 'Onager assuétus in solitúdine, in desidério ánimæ suæ attráxit ventum amóris sui: nullus avértet eam: omnes, qui quærunt eam, non defícient: in ménstruis eius invénient eam.'
  "25": 'Próhibe pedem tuum a nuditáte, et guttur tuum a siti. Et dixísti: Desperávi, nequáquam fáciam: adamávi quippe aliénos, et post eos ambulábo.'
  "26": Quómodo confúnditur fur quando deprehénditur, sic confúsi sunt domus Israel, ipsi et reges eórum, príncipes, et sacerdótes, et prophétæ eórum,
  "27": 'dicéntes ligno: Pater meus es tu: et lápidi: Tu me genuísti: vertérunt ad me tergum et non fáciem, et in témpore afflictiónis suæ dicent: Surge, et líbera nos.'
  "28": 'Ubi sunt dii tui, quos fecísti tibi? surgant, et líberent te in témpore afflictiónis tuæ: secúndum númerum quippe civitátum tuárum erant dii tui Iuda.'
  "29": Quid vultis mecum iudício conténdere? omnes dereliquístis me, dicit Dóminus.
  "30": 'Frustra percússi fílios vestros: disciplínam non recepérunt: devorávit gládius vester prophétas vestros, quasi leo vastátor'
  "31": 'generátio vestra. Vidéte verbum Dómini: numquid solitúdo factus sum Israéli, aut terra serótina? quare ergo dixit pópulus meus: Recéssimus, non veniémus ultra ad te?'
  "32": Numquid obliviscétur virgo ornaménti sui, aut sponsa fásciæ pectorális suæ? pópulus vero meus oblítus est mei diébus innúmeris.
  "33": Quid níteris bonam osténdere viam tuam ad quæréndam dilectiónem, quæ ínsuper et malítias tuas docuísti vias tuas,
  "34": et in alis tuis invéntus est sanguis animárum páuperum et innocéntum? non in fossis invéni eos, sed in ómnibus, quæ supra memorávi.
  "35": 'Et dixísti: Absque peccáto et ínnocens ego sum, et proptérea avertátur furor tuus a me. Ecce ego iudício conténdam tecum, eo quod díxeris: Non peccávi.'
  "36": Quam vilis facta es nimis, íterans vias tuas! et ab Ægýpto confundéris, sicut confúsa es ab Assur.
  "37": 'Nam et ab ista egrediéris, et manus tuæ erunt super caput tuum: quóniam obtrívit Dóminus confidéntiam tuam, et nihil habébis prósperum in ea.'
