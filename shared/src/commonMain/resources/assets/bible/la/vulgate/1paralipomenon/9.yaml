bible: vulgate
lang: la
language: Latina
book: I Paralipomenon
chapter: "9"
verses:
  "1": 'Univérsus ergo Israel dinumerátus est, et summa eórum scripta est in Libro regum Israel et Iuda: translatíque sunt in Babylónem propter delíctum suum.'
  "2": 'Qui autem habitavérunt primi in possessiónibus, et in úrbibus suis: Israel, et sacerdótes, et Levítæ, et Nathinǽi.'
  "3": Commoráti sunt in Ierúsalem de fíliis Iuda, et de fíliis Béniamin, de fíliis quoque Ephraim, et Manásse.
  "4": Othei fílius Ammiud, fílii Amri, fílii Omrai, fílii Bonni, de fíliis Phares fílii Iuda.
  "5": 'Et de Síloni: Asaía primogénitus, et fílii eius.'
  "6": 'De fíliis autem Zara: Iéhuel, et fratres eórum, sexcénti nonagínta.'
  "7": 'Porro de fíliis Béniamin: Salo fílius Mosóllam, fílii Oduía, fílii Asana,'
  "8": et Iobanía fílius Iéroham, et Ela fílius Ozi, fílii Móchori, et Mosóllam fílius Saphatíæ, fílii Ráhuel, fílii Iebaníæ,
  "9": et fratres eórum per famílias suas, nongénti quinquagínta sex. Omnes hi príncipes cognatiónum per domos patrum suórum.
  "10": 'De sacerdótibus autem: Iedaía, Ióiarib, et Iachin:'
  "11": Azarías quoque fílius Helcíæ, fílii Mosóllam, fílii Sadoc, fílii Máraioth, fílii Achitob, póntifex domus Dei.
  "12": Porro Adaías fílius Iéroham, fílii Phassur, fílii Melchíæ, et Maásai fílius Adiel fílii Iezra, fílii Mosóllam, fílii Mosóllamith, fílii Emmer.
  "13": Fratres quoque eórum príncipes per famílias suas, mille septingénti sexagínta, fortíssimi róbore ad faciéndum opus ministérii in domo Dei.
  "14": 'De Levítis autem: Semeía fílius Hassub fílii Ezricam, fílii Hasebía de fíliis Merári.'
  "15": 'Bácbacar quoque carpentárius, et Galal, et Mathanía fílius Micha, fílii Zechri, fílii Asaph:'
  "16": 'et Obdía fílius Semeíæ, fílii Galal, fílii Idithun: et Barachía fílius Asa, fílii Elcana, qui habitávit in átriis Netóphati.'
  "17": 'Ianitóres autem: Sellum, et Accub, et Telmon, et Ahimam: et frater eórum Sellum princeps,'
  "18": usque ad illud tempus, in porta regis ad oriéntem, observábant per vices suas de fíliis Levi.
  "19": 'Sellum vero fílius Core fílii Abíasaph, fílii Core, cum frátribus suis, et domo patris sui, hi sunt Corítæ super ópera ministérii, custódes vestibulórum tabernáculi: et famíliæ eórum per vices castrórum Dómini custodiéntes intróitum.'
  "20": Phínees autem fílius Eleázari erat dux eórum coram Dómino.
  "21": Porro Zacharías fílius Mosollamía, iánitor portæ tabernáculi testimónii.
  "22": 'Omnes hi elécti in ostiários per portas, ducénti duódecim: et descrípti in villis própriis, quos constituérunt David, et Sámuel Videns, in fide sua,'
  "23": tam ipsos quam fílios eórum, in óstiis domus Dómini et in tabernáculo vícibus suis.
  "24": 'Per quátuor ventos erant ostiárii: id est, ad oriéntem, et ad occidéntem, et ad aquilónem, et ad austrum.'
  "25": Fratres autem eórum in vículis morabántur, et veniébant in sábbatis suis de témpore usque ad tempus.
  "26": His quátuor Levítis créditus erat omnis númerus ianitórum, et erant super éxedras et thesáuros domus Dómini.
  "27": 'Per gyrum quoque templi Dómini morabántur in custódiis suis: ut cum tempus fuísset, ipsi mane aperírent fores.'
  "28": 'De horum génere erant et super vasa ministérii: ad númerum enim et inferebántur vasa, et efferebántur.'
  "29": De ipsis et qui crédita habébant utensília sanctuárii, prǽerant símilæ, et vino, et óleo, et thuri, et aromátibus.
  "30": Fílii autem sacerdótum unguénta ex aromátibus conficiébant.
  "31": Et Mathathías Levítes primogénitus Sellum Corítæ, præféctus erat eórum, quæ in sartágine frigebántur.
  "32": Porro de fíliis Caath frátribus eórum, super panes erant propositiónis, ut semper novos per síngula sábbata præparárent.
  "33": Hi sunt príncipes cantórum per famílias Levitárum, qui in éxedris morabántur, ut die ac nocte iúgiter suo ministério deservírent.
  "34": Cápita Levitárum, per famílias suas príncipes, mansérunt in Ierúsalem.
  "35": In Gábaon autem commoráti sunt pater Gábaon Iéhiel, et nomen uxóris eius Máacha.
  "36": Fílius primogénitus eius Abdon, et Sur, et Cis, et Baal, et Ner, et Nadab,
  "37": Gedor quoque, et Ahio, et Zacharías, et Macélloth.
  "38": 'Porro Macélloth génuit Sámaan: isti habitavérunt e regióne fratrum suórum in Ierúsalem cum frátribus suis.'
  "39": 'Ner autem génuit Cis: et Cis génuit Saul: et Saul génuit Iónathan, et Melchísua, et Abínadab, et Esbaal.'
  "40": 'Fílius autem Iónathan, Meríbbaal: et Meríbbaal génuit Micha.'
  "41": Porro fílii Micha, Phithon, et Melech, et Tháraa, et Ahaz.
  "42": Ahaz autem génuit Iara, et Iara génuit Alamath, et Azmoth, et Zamri. Zamri autem génuit Mosa.
  "43": Mosa vero génuit Bánaa, cuius fílius Raphaía génuit Elasa, de quo ortus est Asel.
  "44": 'Porro Asel sex fílios hábuit, his nomínibus: Ezricam, Bocru, Ismahel, Saría, Obdía, Hanan: hi sunt fílii Asel.'
