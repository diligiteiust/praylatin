bible: vulgate
lang: la
language: Latina
book: Ieremias
chapter: "39"
verses:
  "1": Anno nono Sedecíæ regis Iuda, mense décimo, venit Nabuchodónosor rex Babylónis, et omnis exércitus eius, ad Ierúsalem, et obsidébant eam.
  "2": Undécimo autem anno Sedecíæ, mense quarto, quinta mensis, apérta est cívitas.
  "3": 'Et ingréssi sunt omnes príncipes regis Babylónis, et sedérunt in porta média: Néregel, Seréser, Semegarnábu, Sársachim, Rábsares, Néregel, Seréser, Rebmag, et omnes réliqui príncipes regis Babylónis.'
  "4": 'Cumque vidísset eos Sedecías rex Iuda, et omnes viri bellatóres, fugérunt: et egréssi sunt nocte de civitáte per viam horti regis, et per portam, quæ erat inter duos muros, et egréssi sunt ad viam desérti.'
  "5": 'Persecútus est autem eos exércitus Chaldæórum, et comprehendérunt Sedecíam in campo solitúdinis Ierichontínæ, et captum adduxérunt ad Nabuchodónosor regem Babylónis in Réblatha, quæ est in terra Emath: et locútus est ad eum iudícia.'
  "6": 'Et occídit rex Babylónis fílios Sedecíæ in Réblatha, in óculis eius: et omnes nóbiles Iuda occídit rex Babylónis.'
  "7": Oculos quoque Sedecíæ éruit, et vinxit eum compédibus ut ducerétur in Babylónem.
  "8": Domum quoque regis, et domum vulgi succendérunt Chaldǽi igni, et murum Ierúsalem subvertérunt.
  "9": Et relíquias pópuli, qui remánserant in civitáte, et pérfugas, qui transfúgerant ad eum, et supérfluos vulgi, qui remánserant, tránstulit Nabuzárdan magíster mílitum in Babylónem.
  "10": 'Et de plebe páuperum, qui nihil pénitus habébant, dimísit Nabuzárdan magíster mílitum in terra Iuda: et dedit eis víneas, et cistérnas in die illa.'
  "11": 'Præcéperat autem Nabuchodónosor rex Babylónis de Ieremía Nabuzárdan magístro mílitum, dicens:'
  "12": 'Tolle illum, et pone super eum óculos tuos, nihílque ei mali fácias: sed ut volúerit, sic fácias ei.'
  "13": Misit ergo Nabuzárdan princeps milítiæ, et Nabusézban, et Rábsares, et Néregel, et Seréser, et Rebmag, et omnes optimátes regis Babylónis,
  "14": misérunt, et tulérunt Ieremíam de vestíbulo cárceris, et tradidérunt eum Godolíæ fílio Ahicam fílii Saphan, ut intráret in domum, et habitáret in pópulo.
  "15": 'Ad Ieremíam autem factus fúerat sermo Dómini, cum clausus esset in vestíbulo cárceris, dicens:'
  "16": 'Vade, et dic Abdémelech Æthíopi, dicens: Hæc dicit Dóminus exercítuum, Deus Israel: Ecce ego indúcam sermónes meos super civitátem hanc in malum, et non in bonum, et erunt in conspéctu tuo in die illa.'
  "17": 'Et liberábo te in die illa, ait Dóminus, et non tradéris in manus virórum, quos tu formídas:'
  "18": sed éruens liberábo te, et gládio non cades, sed erit tibi ánima tua in salútem, quia in me habuísti fidúciam, ait Dóminus.
