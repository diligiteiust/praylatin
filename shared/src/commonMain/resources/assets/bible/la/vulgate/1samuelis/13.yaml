bible: vulgate
lang: la
language: Latina
book: I Samuelis
chapter: "13"
verses:
  "1": 'Fílius uníus anni erat Saul cum regnáre cœpísset: duóbus autem annis regnávit super Israel.'
  "2": 'Et elégit sibi Saul tria míllia de Israel: et erant cum Saul duo míllia in Machmas, et in monte Bethel: mille autem cum Iónatha in Gábaa Béniamin: porro céterum pópulum remísit unumquémque in tabernácula sua.'
  "3": 'Et percússit Iónathas statiónem Philisthinórum, quæ erat in Gábaa. Quod cum audíssent Philísthiim, Saul cécinit búccina in omni terra, dicens: Audiant Hebrǽi.'
  "4": 'Et univérsus Israel audívit huiuscémodi famam: Percússit Saul statiónem Philisthinórum, et eréxit se Israel advérsus Philísthiim. Clamávit ergo pópulus post Saul in Gálgala.'
  "5": Et Philísthiim congregáti sunt ad prœliándum contra Israel, trigínta míllia cúrruum, et sex míllia équitum, et réliquum vulgus, sicut aréna quæ est in líttore maris plúrima. Et ascendéntes castrametáti sunt in Machmas ad oriéntem Betháven.
  "6": Quod cum vidíssent viri Israel se in arcto pósitos (afflíctus enim erat pópulus), abscondérunt se in spelúncis, et in ábditis, in petris quoque, et in antris, et in cistérnis.
  "7": Hebrǽi autem transiérunt Iordánem in terram Gad et Gálaad. Cumque adhuc esset Saul in Gálgala, univérsus pópulus pertérritus est, qui sequebátur eum.
  "8": Et exspectávit septem diébus iuxta plácitum Samuélis, et non venit Sámuel in Gálgala, dilapsúsque est pópulus ab eo.
  "9": 'Ait ergo Saul: Afférte mihi holocáustum, et pacífica. Et óbtulit holocáustum.'
  "10": 'Cumque complésset ófferens holocáustum, ecce Sámuel veniébat: et egréssus est Saul óbviam ei ut salutáret eum.'
  "11": 'Locutúsque est ad eum Sámuel: Quid fecísti? Respóndit Saul: Quia vidi quod pópulus dilaberétur a me, et tu non véneras iuxta plácitos dies, porro Philísthiim congregáti fúerant in Machmas,'
  "12": 'dixi: Nunc descéndent Philísthiim ad me in Gálgala, et fáciem Dómini non placávi. Necessitáte compúlsus, óbtuli holocáustum.'
  "13": 'Dixítque Sámuel ad Saul: Stulte egísti, nec custodísti mandáta Dómini Dei tui, quæ præcépit tibi. Quod si non fecísses, iam nunc præparásset Dóminus regnum tuum super Israel in sempitérnum:'
  "14": 'sed nequáquam regnum tuum ultra consúrget. Quæsívit Dóminus sibi virum iuxta cor suum: et præcépit ei Dóminus ut esset dux super pópulum suum, eo quod non serváveris quæ præcépit Dóminus.'
  "15": Surréxit autem Sámuel, et ascéndit de Gálgalis in Gábaa Béniamin. Et réliqui pópuli ascendérunt post Saul óbviam pópulo, qui expugnábant eos veniéntes de Gálgala in Gábaa, in colle Béniamin. Et recénsuit Saul pópulum, qui invénti fúerant cum eo, quasi sexcéntos viros.
  "16": 'Et Saul et Iónathas fílius eius, populúsque qui invéntus fúerat cum eis, erat in Gábaa Béniamin: porro Philísthiim conséderant in Machmas.'
  "17": 'Et egréssi sunt ad prædándum de castris Philisthinórum tres cúnei. Unus cúneus pergébat contra viam Ephra ad terram Sual:'
  "18": 'porro álius ingrediebátur per viam Béthoron: tértius autem vérterat se ad iter términi imminéntis valli Séboim contra desértum.'
  "19": 'Porro faber ferrárius non inveniebátur in omni terra Israel: cáverant enim Philísthiim, ne forte fácerent Hebrǽi gládium aut lánceam.'
  "20": Descendébat ergo omnis Israel ad Philísthiim, ut exacúeret unusquísque vómerem suum, et ligónem, et secúrim, et sárculum.
  "21": Retúsæ ítaque erant ácies vómerum, et ligónum, et tridéntum, et secúrium, usque ad stímulum corrigéndum.
  "22": Cumque venísset dies prœ́lii, non est invéntus ensis et láncea in manu totíus pópuli, qui erat cum Saule et Iónatha, excépto Saul et Iónatha fílio eius.
  "23": Egréssa est autem státio Philísthiim, ut transcénderet in Machmas.
