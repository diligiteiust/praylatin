bible: vulgate
lang: la
language: Latina
book: Iosue
chapter: "9"
verses:
  "1": Quibus audítis, cuncti reges trans Iordánem, qui versabántur in montánis et campéstribus, in marítimis ac líttore magni maris, hi quoque qui habitábant iuxta Líbanum, Hethǽus et Amorrhǽus, Chananǽus, Pherezǽus, et Hevǽus, et Iebusǽus,
  "2": congregáti sunt páriter, ut pugnárent contra Iósue et Israel uno ánimo, eadémque senténtia.
  "3": 'At hi, qui habitábant in Gábaon, audiéntes cuncta quæ fécerat Iósue, Iéricho et Hai:'
  "4": et cállide cogitántes, tulérunt sibi cibária, saccos véteres ásinis imponéntes, et utres vinários scissos atque consútos,
  "5": 'calceamentáque perantíqua quæ ad indícium vetustátis pittáciis consúta erant, indúti vetéribus vestiméntis: panes quoque, quos portábant ob viáticum, duri erant, et in frusta comminúti:'
  "6": 'perrexerúntque ad Iósue, qui tunc morabátur in castris Gálgalæ, et dixérunt ei, atque simul omni Israéli: De terra longínqua vénimus, pacem vobíscum fácere cupiéntes. Responderúntque viri Israel ad eos, atque dixérunt:'
  "7": Ne forte in terra, quæ nobis sorte debétur, habitétis, et non possímus fœdus iníre vobíscum.
  "8": 'At illi ad Iósue: Servi, ínquiunt, tui sumus. Quibus Iósue ait: Quinam estis vos? et unde venístis?'
  "9": 'Respondérunt: De terra longínqua valde venérunt servi tui in nómine Dómini Dei tui. Audívimus enim famam poténtiæ eius, cuncta quæ fecit in Ægýpto,'
  "10": 'et duóbus régibus Amorrhæórum qui fuérunt trans Iordánem, Sehon regi Hésebon, et Og regi Basan, qui erat in Astaroth:'
  "11": 'dixerúntque nobis senióres, et omnes habitatóres terræ nostræ: Tóllite in mánibus cibária ob longíssimam viam, et occúrrite eis, et dícite: Servi vestri sumus, fœdus iníte nobíscum.'
  "12": 'En, panes quando egréssi sumus de dómibus nostris, ut venirémus ad vos, cálidos súmpsimus: nunc sicci facti sunt, et vetustáte nímia comminúti.'
  "13": 'Utres vini novos implévimus: nunc rupti sunt et solúti: vestes et calceaménta quibus indúimur, et quæ habémus in pédibus, ob longitúdinem longióris viæ trita sunt, et pene consúmpta.'
  "14": Suscepérunt ígitur de cibáriis eórum, et os Dómini non interrogavérunt.
  "15": 'Fecítque Iósue cum eis pacem, et ínito fœ́dere pollícitus est quod non occideréntur: príncipes quoque multitúdinis iuravérunt eis.'
  "16": Post dies autem tres íniti fœ́deris, audiérunt quod in vicíno habitárent, et inter eos futúri essent.
  "17": 'Moverúntque castra fílii Israel, et venérunt in civitátes eórum die tértio, quarum hæc vocábula sunt: Gábaon, et Caphíra, et Beroth, et Cariathíarim.'
  "18": Et non percussérunt eos, eo quod iurássent eis príncipes multitúdinis in nómine Dómini Dei Israel. Murmurávit ítaque omne vulgus contra príncipes.
  "19": 'Qui respondérunt eis: Iurávimus illis in nómine Dómini Dei Israel, et idcírco non póssumus eos contíngere.'
  "20": 'Sed hoc faciémus eis: reservéntur quidem ut vivant, ne contra nos ira Dómini concitétur, si peieravérimus:'
  "21": sed sic vivant, ut in usus univérsæ multitúdinis ligna cædant, aquásque compórtent. Quibus hæc loquéntibus,
  "22": 'vocávit Gabaonítas Iósue, et dixit eis: Cur nos decípere fraude voluístis, ut dicerétis: Procul valde habitámus a vobis, cum in médio nostri sitis?'
  "23": Itaque sub maledictióne éritis, et non defíciet de stirpe vestra ligna cædens, aquásque compórtans in domum Dei mei.
  "24": 'Qui respondérunt: Nuntiátum est nobis servis tuis, quod promisísset Dóminus Deus tuus Móysi servo suo ut tráderet vobis omnem terram, et dispérderet cunctos habitatóres eius. Timúimus ígitur valde, et provídimus animábus nostris, vestro terróre compúlsi, et hoc consílium inívimus.'
  "25": 'Nunc autem in manu tua sumus: quod tibi bonum et rectum vidétur, fac nobis.'
  "26": Fecit ergo Iósue ut díxerat, et liberávit eos de manu filiórum Israel, ut non occideréntur.
  "27": Decrevítque in illo die eos esse in ministério cuncti pópuli, et altáris Dómini, cædéntes ligna, et aquas comportántes, usque in præsens tempus, in loco, quem Dóminus elegísset.
