bible: vulgate
lang: la
language: Latina
book: ad Colossenses
chapter: "2"
verses:
  "1": 'Volo enim vos scire qualem sollicitúdinem hábeam pro vobis, et pro iis, qui sunt Laodicíæ, et quicúmque non vidérunt fáciem meam in carne:'
  "2": 'ut consoléntur corda ipsórum, instrúcti in caritáte, et in omnes divítias plenitúdinis intelléctus, in agnitiónem mystérii Dei Patris et Christi Iesu:'
  "3": in quo sunt omnes thesáuri sapiéntiæ, et sciéntiæ abscónditi.
  "4": Hoc autem dico, ut nemo vos decípiat in sublimitáte sermónum.
  "5": 'Nam etsi córpore absens sum, sed spíritu vobíscum sum: gaudens, et videns órdinem vestrum, et firmaméntum eius, quæ in Christo est, fídei vestræ.'
  "6": Sicut ergo accepístis Iesum Christum Dóminum, in ipso ambuláte,
  "7": radicáti, et superædificáti in ipso, et confirmáti fide, sicut et didicístis, abundántes in illo in gratiárum actióne.
  "8": 'Vidéte ne quis vos decípiat per philosóphiam, et inánem falláciam secúndum traditiónem hóminum, secúndum eleménta mundi, et non secúndum Christum:'
  "9": 'quia in ipso inhábitat omnis plenitúdo divinitátis corporáliter:'
  "10": 'et estis in illo repléti, qui est caput omnis principátus, et potestátis:'
  "11": 'in quo et circumcísi estis circumcisióne non manu facta in exspoliatióne córporis carnis, sed in circumcisióne Christi:'
  "12": consepúlti ei in baptísmo, in quo et resurrexístis per fidem operatiónis Dei, qui suscitávit illum a mórtuis.
  "13": 'Et vos cum mórtui essétis in delíctis, et præpútio carnis vestræ, convivificávit cum illo, donans vobis ómnia delícta:'
  "14": 'delens quod advérsus nos erat chirógraphum decréti, quod erat contrárium nobis, et ipsum tulit de médio, affígens illud cruci:'
  "15": et exspólians principátus, et potestátes tradúxit confidénter, palam triúmphans illos in semetípso.
  "16": 'Nemo ergo vos iúdicet in cibo, aut in potu, aut in parte diéi festi, aut neoméniæ, aut sabbatórum:'
  "17": 'quæ sunt umbra futurórum: corpus autem Christi.'
  "18": Nemo vos sedúcat, volens in humilitáte, et religióne angelórum, quæ non vidit ámbulans, frustra inflátus sensu carnis suæ,
  "19": et non tenens caput, ex quo totum corpus per nexus, et coniunctiónes subministrátum, et constrúctum crescit in augméntum Dei.
  "20": 'Si ergo mórtui estis cum Christo ab eleméntis huius mundi: quid adhuc tamquam vivéntes in mundo decérnitis?'
  "21": 'Ne tetigéritis, neque gustavéritis, neque contrectavéritis:'
  "22": 'quæ sunt ómnia in intéritum ipso usu, secúndum præcépta, et doctrínas hóminum:'
  "23": quæ sunt ratiónem quidem habéntia sapiéntiæ in superstitióne, et humilitáte, et non ad parcéndum córpori, non in honóre áliquo ad saturitátem carnis.
