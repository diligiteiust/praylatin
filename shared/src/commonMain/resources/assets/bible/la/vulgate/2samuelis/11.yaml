bible: vulgate
lang: la
language: Latina
book: II Samuelis
chapter: "11"
verses:
  "1": 'Factum est autem, verténte anno, eo témpore quo solent reges ad bella procédere, misit David Ioab, et servos suos cum eo, et univérsum Israel, et vastavérunt fílios Ammon, et obsedérunt Rabba: David autem remánsit in Ierúsalem.'
  "2": 'Dum hæc ageréntur, áccidit ut súrgeret David de strato suo post merídiem, et deambuláret in solário domus régiæ: vidítque mulíerem se lavántem ex advérso super solárium suum: erat autem múlier pulchra valde.'
  "3": Misit ergo rex, et requisívit quæ esset múlier. Nuntiatúmque est ei quod ipsa esset Bethsabée fília Elíam, uxor Uríæ Hethǽi.
  "4": 'Missis ítaque David núntiis, tulit eam: quæ cum ingréssa esset ad illum, dormívit cum ea: statímque sanctificáta est ab immundítia sua:'
  "5": 'et revérsa est domum suam concépto fœtu. Mitténsque nuntiávit David, et ait: Concépi.'
  "6": 'Misit autem David ad Ioab, dicens: Mitte ad me Uríam Hethǽum. Misítque Ioab Uríam ad David.'
  "7": Et venit Urías ad David. Quæsivítque David quam recte ágeret Ioab, et pópulus, et quómodo administrarétur bellum.
  "8": 'Et dixit David ad Uríam: Vade in domum tuam, et lava pedes tuos. Et egréssus est Urías de domo regis, secutúsque est eum cibus régius.'
  "9": Dormívit autem Urías ante portam domus régiæ cum áliis servis dómini sui, et non descéndit ad domum suam.
  "10": 'Nuntiatúmque est David a dicéntibus: Non ivit Urías in domum suam. Et ait David ad Uríam: Numquid non de via venísti? quare non descendísti in domum tuam?'
  "11": 'Et ait Urías ad David: Arca Dei et Israel et Iuda hábitant in papiliónibus, et dóminus meus Ioab, et servi dómini mei super fáciem terræ manent: et ego ingrédiar domum meam, ut cómedam et bibam, et dórmiam cum uxóre mea? Per salútem tuam, et per salútem ánimæ tuæ, non fáciam rem hanc.'
  "12": 'Ait ergo David ad Uríam: Mane hic étiam hódie, et cras dimíttam te. Mansit Urías in Ierúsalem in die illa et áltera:'
  "13": 'et vocávit eum David ut coméderet coram se et bíberet, et inebriávit eum: qui egréssus véspere, dormívit in strato suo cum servis dómini sui, et in domum suam non descéndit.'
  "14": 'Factum est ergo mane, et scripsit David epístolam ad Ioab: misítque per manum Uríæ,'
  "15": 'scribens in epístola: Pónite Uríam ex advérso belli, ubi fortíssimum est prœ́lium: et derelínquite eum, ut percússus intéreat.'
  "16": Igitur cum Ioab obsidéret urbem, pósuit Uríam in loco ubi sciébat viros esse fortíssimos.
  "17": Egressíque viri de civitáte, bellábant advérsum Ioab, et cecidérunt de pópulo servórum David, et mórtuus est étiam Urías Hethǽus.
  "18": 'Misit ítaque Ioab, et nuntiávit David ómnia verba prœ́lii:'
  "19": 'præcepítque núntio, dicens: Cum compléveris univérsos sermónes belli ad regem,'
  "20": 'si eum víderis indignári, et díxerit: Quare accessístis ad murum, ut prœliarémini? an ignorabátis quod multa désuper ex muro tela mittántur?'
  "21": 'Quis percússit Abímelech fílium Ieróbaal? nonne múlier misit super eum fragmen molæ de muro, et interfécit eum in Thebes? quare iuxta murum accessístis? dices: Etiam servus tuus Urías Hethǽus occúbuit.'
  "22": Abiit ergo núntius, et venit, et narrávit David ómnia quæ ei præcéperat Ioab.
  "23": 'Et dixit núntius ad David: Prævaluérunt advérsum nos viri, et egréssi sunt ad nos in agrum: nos autem facto ímpetu persecúti eos sumus usque ad portam civitátis.'
  "24": 'Et direxérunt iácula sagittárii ad servos tuos ex muro désuper, mortuíque sunt de servis regis: quin étiam servus tuus Urías Hethǽus mórtuus est.'
  "25": 'Et dixit David ad núntium: Hæc dices Ioab: Non te frangat ista res: várius enim evéntus est belli, nunc hunc, et nunc illum consúmit gládius: confórta bellatóres tuos advérsus urbem ut déstruas eam, et exhortáre eos.'
  "26": Audívit autem uxor Uríæ, quod mórtuus esset Urías vir suus, et planxit eum.
  "27": 'Transácto autem luctu, misit David, et introdúxit eam in domum suam, et facta est ei uxor, peperítque ei fílium: et displícuit verbum hoc, quod fécerat David, coram Dómino.'
