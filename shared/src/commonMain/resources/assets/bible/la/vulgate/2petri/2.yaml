bible: vulgate
lang: la
language: Latina
book: II Petri
chapter: "2"
verses:
  "1": Fuérunt vero et pseudoprophétæ in pópulo, sicut et in vobis erunt magístri mendáces, qui introdúcent sectas perditiónis, et eum, qui emit eos, Dóminum negant, superducéntes sibi célerem perditiónem.
  "2": 'Et multi sequéntur eórum luxúrias, per quos via veritátis blasphemábitur:'
  "3": 'et in avarítia fictis verbis de vobis negotiabúntur: quibus iudícium iam olim non cessat: et perdítio eórum non dormítat.'
  "4": Si enim Deus ángelis peccántibus non pepércit, sed rudéntibus inférni detráctos in tártarum trádidit cruciándos, in iudícium reservári.
  "5": Et origináli mundo non pepércit, sed octávum Noe iustítiæ præcónem custodívit, dilúvium mundo impiórum indúcens.
  "6": 'Et civitátes Sodomórum, et Gomorrhæórum in cínerem rédigens, eversióne damnávit: exémplum eórum, qui ímpie actúri sunt, ponens:'
  "7": 'et iustum Lot oppréssum a nefandórum iniúria, ac luxuriósa conversatióne erípuit:'
  "8": 'aspéctu enim, et audítu iustus erat: hábitans apud eos, qui de die in diem ánimam iustam iníquis opéribus cruciábant.'
  "9": 'Novit Dóminus pios de tentatióne erípere: iníquos vero in diem iudícii reserváre cruciándos.'
  "10": 'Magis autem eos, qui post carnem in concupiscéntia immundítiæ ámbulant, dominationémque contémnunt, audáces, sibi placéntes, sectas non métuunt introdúcere blasphemántes:'
  "11": ubi ángeli fortitúdine, et virtúte cum sint maióres, non portant advérsum se exsecrábile iudícium.
  "12": Hi vero velut irrationabília pécora, naturáliter in captiónem, et in perníciem in his quæ ignórant blasphemántes in corruptióne sua períbunt,
  "13": 'percipiéntes mercédem iniustítiæ, voluptátem existimántes diéi delícias: coinquinatiónes, et máculæ delíciis affluéntes, in convíviis suis luxuriántes vobíscum,'
  "14": 'óculos habéntes plenos adultérii, et incessábilis delícti. Pelliciéntes ánimas instábiles, cor exercitátum avarítia habéntes, maledictiónis fílii:'
  "15": 'derelinquéntes rectam viam erravérunt, secúti viam Bálaam ex Bosor, qui mercédem iniquitátis amávit:'
  "16": 'correptiónem vero hábuit suæ vesániæ: subiugále mutum ánimal, hóminis voce loquens, prohíbuit prophétæ insipiéntiam.'
  "17": Hi sunt fontes sine aqua, et nébulæ turbínibus exagitátæ, quibus calígo tenebrárum reservátur.
  "18": 'Supérba enim vanitátis loquéntes, pellíciunt in desidériis carnis luxúriæ eos, qui páululum effúgiunt, qui in erróre conversántur:'
  "19": 'libertátem illis promitténtes, cum ipsi servi sint corruptiónis: a quo enim quis superátus est, huius et servus est.'
  "20": 'Si enim refugiéntes coinquinatiónes mundi in cognitióne Dómini nostri, et Salvatóris Iesu Christi, his rursus implicáti superántur: facta sunt eis posterióra deterióra prióribus.'
  "21": Mélius enim erat illis non cognóscere viam iustítiæ, quam post agnitiónem, retrórsum convérti ab eo, quod illis tráditum est, sancto mandáto.
  "22": 'Cóntigit enim eis illud veri provérbii: Canis revérsus ad suum vómitum: et, Sus lota in volutábro luti.'
