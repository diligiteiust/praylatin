bible: vulgate
lang: la
language: Latina
book: Iudicum
chapter: "8"
verses:
  "1": 'Dixerúntque ad eum viri Ephraim: Quid est hoc quod fácere voluísti, ut nos non vocáres, cum ad pugnam pérgeres contra Mádian? iurgántes fórtiter, et prope vim inferéntes.'
  "2": 'Quibus ille respóndit: Quid enim tale fácere pótui, quale vos fecístis? nonne mélior est racémus Ephraim, vindémiis Abiézer?'
  "3": 'In manus vestras Dóminus trádidit príncipes Mádian, Oreb et Zeb: quid tale fácere pótui, quale vos fecístis? Quod cum locútus esset, requiévit spíritus eórum, quo tumébant contra eum.'
  "4": 'Cumque venísset Gédeon ad Iordánem, transívit eum cum trecéntis viris, qui secum erant: et præ lassitúdine, fugiéntes pérsequi non póterant.'
  "5": 'Dixítque ad viros Soccoth: Date, óbsecro, panes pópulo, qui mecum est, quia valde defecérunt: ut possímus pérsequi Zébee, et Sálmana reges Mádian.'
  "6": 'Respondérunt príncipes Soccoth: Fórsitan palmæ mánuum Zébee et Sálmana in manu tua sunt, et idcírco póstulas ut demus exercítui tuo panes.'
  "7": 'Quibus ille ait: Cum ergo tradíderit Dóminus Zébee et Sálmana in manus meas, cónteram carnes vestras cum spinis, tribulísque desérti.'
  "8": 'Et inde conscéndens, venit in Phánuel: locutúsque est ad viros loci illíus simília. Cui et illi respondérunt, sicut respónderant viri Soccoth.'
  "9": 'Dixit ítaque et eis: Cum revérsus fúero victor in pace, déstruam turrim hanc.'
  "10": Zébee autem et Sálmana requiescébant cum omni exércitu suo. Quíndecim enim míllia viri remánserant ex ómnibus turmis orientálium populórum, cæsis centum vigínti míllibus bellatórum educéntium gládium.
  "11": Ascendénsque Gédeon per viam eórum, qui in tabernáculis morabántur, ad orientálem partem Nobe et Iégbaa, percússit castra hóstium, qui secúri erant, et nihil advérsi suspicabántur.
  "12": Fugerúntque Zébee et Sálmana, quos pérsequens Gédeon comprehéndit, turbáto omni exércitu eórum.
  "13": Reverténsque de bello ante solis ortum,
  "14": 'apprehéndit púerum de viris Soccoth: interrogavítque eum nómina príncipum et seniórum Soccoth, et descrípsit septuagínta septem viros.'
  "15": 'Venítque ad Soccoth, et dixit eis: En Zébee et Sálmana, super quibus exprobrástis mihi, dicéntes: Fórsitan manus Zébee et Sálmana in mánibus tuis sunt, et idcírco póstulas ut demus viris, qui lassi sunt et defecérunt, panes.'
  "16": Tulit ergo senióres civitátis et spinas desérti ac tríbulos, et contrívit cum eis, atque commínuit viros Soccoth.
  "17": Turrim quoque Phánuel subvértit, occísis habitatóribus civitátis.
  "18": 'Dixítque ad Zébee et Sálmana: Quales fuérunt viri, quos occidístis in Thabor? Qui respondérunt: Símiles tui, et unus ex eis quasi fílius regis.'
  "19": 'Quibus ille respóndit: Fratres mei fuérunt, fílii matris meæ. Vivit Dóminus, quia si servassétis eos, non vos occíderem.'
  "20": 'Dixítque Iether primogénito suo: Surge, et intérfice eos. Qui non edúxit gládium: timébat enim, quia adhuc puer erat.'
  "21": 'Dixerúntque Zébee et Sálmana: Tu surge, et írrue in nos: quia iuxta ætátem robur est hóminis. Surréxit Gédeon, et interfécit Zébee et Sálmana: et tulit ornaménta ac bullas, quibus colla regálium camelórum decorári solent.'
  "22": 'Dixerúntque omnes viri Israel ad Gédeon: Domináre nostri tu, et fílius tuus, et fílius fílii tui: quia liberásti nos de manu Mádian.'
  "23": 'Quibus ille ait: Non dominábor vestri, nec dominábitur in vos fílius meus, sed dominábitur vobis Dóminus.'
  "24": 'Dixítque ad eos: Unam petitiónem póstulo a vobis: date mihi ináures ex præda vestra. Ináures enim áureas Ismaelítæ habére consuéverant.'
  "25": 'Qui respondérunt: Libentíssime dábimus. Expandentésque super terram pállium, proiecérunt in eo ináures de præda:'
  "26": et fuit pondus postulatárum ináurium, mille septingénti auri sicli, absque ornaméntis, et monílibus, et veste purpúrea, quibus reges Mádian uti sóliti erant, et præter torques áureas camelórum.
  "27": Fecítque ex eo Gédeon ephod, et pósuit illud in civitáte sua Ephra. Fornicatúsque est omnis Israel in eo, et factum est Gedeóni et omni dómui eius in ruínam.
  "28": 'Humiliátus est autem Mádian coram fíliis Israel, nec potuérunt ultra cervíces eleváre: sed quiévit terra per quadragínta annos, quibus Gédeon prǽfuit.'
  "29": 'Abiit ítaque Ieróbaal fílius Ioas, et habitávit in domo sua:'
  "30": 'habuítque septuagínta fílios, qui egréssi sunt de fémore eius: eo quod plures habéret uxóres.'
  "31": Concubína autem illíus, quam habébat in Sichem, génuit ei fílium nómine Abímelech.
  "32": Mortuúsque est Gédeon fílius Ioas in senectúte bona, et sepúltus est in sepúlcro Ioas patris sui in Ephra de família Ezri.
  "33": 'Postquam autem mórtuus est Gédeon, avérsi sunt fílii Israel, et fornicáti sunt cum Báalim. Percusserúntque cum Baal fœdus, ut esset eis in deum:'
  "34": 'nec recordáti sunt Dómini Dei sui, qui éruit eos de mánibus inimicórum suórum ómnium per circúitum:'
  "35": nec fecérunt misericórdiam cum domo Ieróbaal Gédeon, iuxta ómnia bona, quæ fécerat Israéli.
