bible: vulgate
lang: la
language: Latina
book: Ieremias
chapter: "12"
verses:
  "1": 'Iustus quidem tu es Dómine, si dísputem tecum: verúmtamen iusta loquar ad te: Quare via impiórum prosperátur: bene est ómnibus, qui prævaricántur, et iníque agunt?'
  "2": 'Plantásti eos, et radícem misérunt: profíciunt, et fáciunt fructum: prope es tu ori eórum, et longe a rénibus eórum.'
  "3": 'Et tu Dómine nosti me, vidísti me, et probásti cor meum tecum: cóngrega eos quasi gregem ad víctimam, et sanctífica eos in die occisiónis.'
  "4": 'Usquequo lugébit terra, et herba omnis regiónis siccábitur, propter malítiam habitántium in ea? consúmptum est ánimal, et vólucre, quóniam dixérunt: Non vidébit novíssima nostra.'
  "5": Si cum pedítibus currens laborásti, quómodo conténdere póteris cum equis? cum autem in terra pacis secúrus fúeris, quid fácies in supérbia Iordánis?
  "6": 'Nam et fratres tui, et domus patris tui, étiam ipsi pugnavérunt advérsum te, et clamavérunt post te plena voce: ne credas eis, cum locúti fúerint tibi bona.'
  "7": 'Relíqui domum meam, dimísi hereditátem meam: dedi diléctam ánimam meam in manu inimicórum eius.'
  "8": 'Facta est mihi heréditas mea quasi leo in silva: dedit contra me vocem, ídeo odívi eam.'
  "9": Numquid avis díscolor heréditas mea mihi? numquid avis tincta per totum? veníte, congregámini omnes béstiæ terræ, properáte ad devorándum.
  "10": 'Pastóres multi demolíti sunt víneam meam, conculcavérunt partem meam: dedérunt portiónem meam desiderábilem in desértum solitúdinis.'
  "11": 'Posuérunt eam in dissipatiónem, luxítque super me: desolatióne desoláta est omnis terra: quia nullus est qui recógitet corde.'
  "12": 'Super omnes vias desérti venérunt vastatóres, quia gládius Dómini devorábit: ab extrémo terræ usque ad extrémum eius, non est pax univérsæ carni.'
  "13": 'Seminavérunt tríticum, et spinas messuérunt: hereditátem accepérunt, et non eis próderit: confundémini a frúctibus vestris, propter iram furóris Dómini.'
  "14": 'Hæc dicit Dóminus advérsum omnes vicínos meos péssimos, qui tangunt hereditátem, quam distríbui pópulo meo Israel: Ecce ego evéllam eos de terra sua, et domum Iuda evéllam de médio eórum.'
  "15": 'Et cum evúlsero eos, convértar, et miserébor eórum, et redúcam eos: virum ad hereditátem suam, et virum in terram suam.'
  "16": 'Et erit: si erudíti didícerint vias pópuli mei, ut iurent in nómine meo: Vivit Dóminus, sicut docuérunt pópulum meum iuráre in Baal: ædificabúntur in médio pópuli mei.'
  "17": Quod si non audíerint, evéllam gentem illam evulsióne et perditióne, ait Dóminus.
