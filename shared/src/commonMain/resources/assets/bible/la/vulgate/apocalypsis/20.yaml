bible: vulgate
lang: la
language: Latina
book: Apocalypsis
chapter: "20"
verses:
  "1": Et vidi ángelum descendéntem de cælo, habéntem clavem abýssi, et caténam magnam in manu sua.
  "2": 'Et apprehéndit dracónem, serpéntem antíquum, qui est diábolus, et Sátanas, et ligávit eum per annos mille:'
  "3": 'et misit eum in abýssum, et clausit, et signávit super illum ut non sedúcat ámplius gentes, donec consumméntur mille anni: et post hæc opórtet illum solvi módico témpore.'
  "4": 'Et vidi sedes, et sedérunt super eas, et iudícium datum est illis: et ánimas decollatórum propter testimónium Iesu, et propter verbum Dei, et qui non adoravérunt béstiam, neque imáginem eius, nec accepérunt charactérem eius in fróntibus, aut in mánibus suis, et vixérunt, et regnavérunt cum Christo mille annis.'
  "5": Céteri mortuórum non vixérunt, donec consumméntur mille anni. Hæc est resurréctio prima.
  "6": 'Beátus, et sanctus, qui habet partem in resurrectióne prima: in his secúnda mors non habet potestátem: sed erunt sacerdótes Dei et Christi, et regnábunt cum illo mille annis.'
  "7": Et cum consummáti fúerint mille anni, solvétur Sátanas de cárcere suo, et exíbit, et sedúcet gentes, quæ sunt super quátuor ángulos terræ, Gog, et Magog, et congregábit eos in prœ́lium, quorum númerus est sicut aréna maris.
  "8": Et ascendérunt super latitúdinem terræ, et circuiérunt castra sanctórum, et civitátem diléctam.
  "9": 'Et descéndit ignis a Deo de cælo, et devorávit eos: et diábolus, qui seducébat eos, missus est in stagnum ignis, et súlphuris, ubi et béstia,'
  "10": et pseudoprophéta cruciabúntur die ac nocte in sǽcula sæculórum.
  "11": Et vidi thronum magnum cándidum, et sedéntem super eum, a cuius conspéctu fugit terra, et cælum, et locus non est invéntus eis.
  "12": 'Et vidi mórtuos magnos, et pusíllos, stantes in conspéctu throni, et libri apérti sunt: et álius Liber apértus est, qui est vitæ: et iudicáti sunt mórtui ex his, quæ scripta erant in libris, secúndum ópera ipsórum.'
  "13": 'Et dedit mare mórtuos, qui in eo erant: et mors, et inférnus dedérunt mórtuos suos, qui in ipsis erant: et iudicátum est de síngulis secúndum ópera ipsórum.'
  "14": Et inférnus, et mors missi sunt in stagnum ignis. Hæc est mors secúnda.
  "15": Et qui non invéntus est in Libro vitæ scriptus, missus est in stagnum ignis.
