bible: vulgate
lang: la
language: Latina
book: Ecclesiasticus
chapter: "32"
verses:
  "1": 'Rectórem te posuérunt? noli extólli: esto in illis quasi unus ex ipsis.'
  "2": 'Curam illórum habe, et sic cónside, et omni cura tua explícita recúmbe:'
  "3": ut lætéris propter illos, et ornaméntum grátiæ accípias corónam, et dignatiónem consequáris corrogatiónis.
  "4": 'Lóquere maior natu: decet enim te'
  "5": primum verbum diligénti sciéntia, et non impédias músicam.
  "6": Ubi audítus non est, non effúndas sermónem, et importúne noli extólli in sapiéntia tua.
  "7": Gémmula carbúnculi in ornaménto auri, et comparátio musicórum in convívio vini.
  "8": Sicut in fabricatióne auri signum est smarágdi, sic númerus musicórum in iucúndo et moderáto vino.
  "9": Audi tacens, et pro reveréntia accédet tibi bona grátia.
  "10": Adoléscens lóquere in tua causa vix.
  "11": Si bis interrogátus fúeris, hábeat caput respónsum tuum.
  "12": In multis esto quasi ínscius, et audi tacens simul et quærens.
  "13": 'In médio magnatórum non præsúmas: et ubi sunt senes, non multum loquáris.'
  "14": 'Ante grándinem præíbit coruscátio: et ante verecúndiam præíbit grátia, et pro reveréntia accédet tibi bona grátia.'
  "15": 'Et hora surgéndi non te trices: præcúrre autem prior in domum tuam, et illic avocáre, et illic lude,'
  "16": et age conceptiónes tuas, et non in delíctis et verbo supérbo.
  "17": Et super his ómnibus benedícito Dóminum, qui fecit te, et inebriántem te ab ómnibus bonis suis.
  "18": 'Qui timet Dóminum, excípiet doctrínam eius: et qui vigiláverint ad illum, invénient benedictiónem.'
  "19": 'Qui quærit legem, replébitur ab ea: et qui insidióse agit, scandalizábitur in ea.'
  "20": Qui timent Dóminum, invénient iudícium iustum, et iustítias quasi lumen accéndent.
  "21": Peccátor homo vitábit correptiónem, et secúndum voluntátem suam invéniet comparatiónem.
  "22": 'Vir consílii non dispérdet intelligéntiam, aliénus et supérbus non pertiméscet timórem:'
  "23": étiam postquam fecit cum eo sine consílio, et suis insectatiónibus arguétur.
  "24": Fili sine consílio nihil fácias, et post factum non pœnitébis.
  "25": 'In via ruínæ non eas, et non offéndes in lápides: nec credas te viæ laboriósæ, ne ponas ánimæ tuæ scándalum:'
  "26": et a fíliis tuis cave, et a domésticis tuis atténde.
  "27": 'In omni ópere tuo crede ex fide ánimæ tuæ: hoc est enim conservátio mandatórum.'
  "28": 'Qui credit Deo, atténdit mandátis: et qui confídit in illo, non minorábitur.'
