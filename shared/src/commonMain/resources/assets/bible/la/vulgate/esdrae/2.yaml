bible: vulgate
lang: la
language: Latina
book: Esdrae
chapter: "2"
verses:
  "1": Hi sunt autem provínciæ fílii, qui ascendérunt de captivitáte, quam transtúlerat Nabuchodónosor rex Babylónis in Babylónem, et revérsi sunt in Ierúsalem et Iudam, unusquísque in civitátem suam.
  "2": 'Qui venérunt cum Zoróbabel, Iósue, Nehemía, Saraía, Rahelaía, Mardochái, Belsan, Mesphar, Beguái, Rehum, Báana. Númerus virórum pópuli Israel:'
  "3": fílii Pharos duo míllia centum septuagínta duo.
  "4": Fílii Sephatía, trecénti septuagínta duo.
  "5": Fílii Area, septingénti septuagínta quinque.
  "6": 'Fílii Phahath Moab, filiórum Iósue: Ioab, duo míllia octingénti duódecim.'
  "7": Fílii Ælam, mille ducénti quinquagínta quátuor.
  "8": Fílii Zéthua, nongénti quadragínta quinque.
  "9": Fílii Zachái, septingénti sexagínta.
  "10": Fílii Bani, sexcénti quadragínta duo.
  "11": Fílii Bebái, sexcénti vigínti tres.
  "12": Fílii Azgad, mille ducénti vigínti duo.
  "13": Fílii Adónicam, sexcénti sexagínta sex.
  "14": Fílii Beguái, duo míllia quinquagínta sex.
  "15": Fílii Adin, quadringénti quinquagínta quátuor.
  "16": Fílii Ather, qui erant ex Ezechía, nonagínta octo.
  "17": Fílii Besái, trecénti vigínti tres.
  "18": Fílii Iora, centum duódecim.
  "19": Fílii Hasum, ducénti vigínti tres.
  "20": Fílii Gebbar, nonagínta quinque.
  "21": Fílii Béthlehem, centum vigínti tres.
  "22": Viri Nétupha, quinquagínta sex.
  "23": Viri Anathoth, centum vigínti octo.
  "24": Fílii Azmaveth, quadragínta duo.
  "25": Fílii Cariathíarim, Cephíra, et Beroth, septingénti quadragínta tres.
  "26": Fílii Rama et Gábaa, sexcénti vigínti unus.
  "27": Viri Machmas, centum vigínti duo.
  "28": Viri Bethel et Hai, ducénti vigínti tres.
  "29": Fílii Nebo, quinquagínta duo.
  "30": Fílii Megbis, centum quinquagínta sex.
  "31": Fílii Ælam altérius, mille ducénti quinquagínta quátuor.
  "32": Fílii Harim, trecénti vigínti.
  "33": Fílii Lod Hadid, et Ono, septingénti vigínti quinque.
  "34": Fílii Iéricho, trecénti quadragínta quinque.
  "35": Fílii Sénaa, tria míllia sexcénti trigínta.
  "36": 'Sacerdótes: fílii Iadaía in domo Iósue, nongénti septuagínta tres.'
  "37": Fílii Emmer, mille quinquagínta duo.
  "38": Fílii Pheshur, mille ducénti quadragínta septem.
  "39": Fílii Harim, mille decem et septem.
  "40": 'Levítæ: Fílii Iósue et Cédmihel filiórum Odovíæ, septuagínta quátuor.'
  "41": 'Cantóres: Fílii Asaph, centum vigínti octo.'
  "42": 'Fílii ianitórum: fílii Sellum, fílii Ater, fílii Telmon, fílii Accub, fílii Hátitha, fílii Sobái: univérsi centum trigínta novem.'
  "43": 'Nathinǽi: fílii Siha, fílii Hasúpha, fílii Tábbaoth,'
  "44": fílii Ceros, fílii Síaa, fílii Phadon,
  "45": fílii Lébana, fílii Hágaba, fílii Accub,
  "46": fílii Hagab, fílii Semlái, fílii Hanan,
  "47": fílii Gaddel, fílii Gaher, fílii Raaía,
  "48": fílii Rasin, fílii Necóda, fílii Gazam,
  "49": fílii Aza, fílii Phásea, fílii Besée,
  "50": fílii Asena, fílii Munim, fílii Néphusim,
  "51": fílii Bacbuc, fílii Hacúpha, fílii Harhur,
  "52": fílii Besluth, fílii Mahída, fílii Harsa,
  "53": fílii Bercos, fílii Sísara, fílii Thema,
  "54": fílii Násia, fílii Hatípha,
  "55": fílii servórum Salomónis, fílii Sotái, fílii Sóphereth, fílii Pharúda,
  "56": fílii Iala, fílii Dercon, fílii Geddel,
  "57": 'fílii Saphatía, fílii Hatil, fílii Phóchereth, qui erant de Asébaim, fílii Ami:'
  "58": omnes Nathinǽi, et fílii servórum Salomónis, trecénti nonagínta duo.
  "59": 'Et hi qui ascendérunt de Thélmala, Thelhársa, Cherub, et Adon, et Emer: et non potuérunt indicáre domum patrum suórum et semen suum, utrum ex Israel essent.'
  "60": Fílii Dalaía, fílii Tobía, fílii Necóda, sexcénti quinquagínta duo.
  "61": 'Et de fíliis sacerdótum: fílii Hobía, fílii Accos, fílii Berzellái, qui accépit de filiábus Berzellái Galaadítis, uxórem, et vocátus est nómine eórum:'
  "62": hi quæsiérunt scriptúram genealógiæ suæ, et non invenérunt, et eiécti sunt de sacerdótio.
  "63": Et dixit Athérsatha eis, ut non coméderent de Sancto sanctórum, donec súrgeret sacérdos doctus atque perféctus.
  "64": 'Omnis multitúdo quasi unus, quadragínta duo míllia trecénti sexagínta:'
  "65": 'excéptis servis eórum, et ancíllis, qui erant septem míllia trecénti trigínta septem: et in ipsis cantóres atque cantatríces ducénti.'
  "66": Equi eórum septingénti trigínta sex, muli eórum, ducénti quadragínta quinque,
  "67": caméli eórum, quadringénti trigínta quinque, ásini eórum, sex míllia septingénti vigínti.
  "68": Et de princípibus patrum, cum ingrederéntur templum Dómini, quod est in Ierúsalem, sponte obtulérunt in domum Dei ad exstruéndam eam in loco suo.
  "69": Secúndum vires suas dedérunt impénsas óperis, auri sólidos sexagínta míllia et mille, argénti mnas quinque míllia, et vestes sacerdotáles centum.
  "70": Habitavérunt ergo sacerdótes, et Levítæ, et de pópulo, et cantóres, et ianitóres, et Nathinǽi, in úrbibus suis, universúsque Israel in civitátibus suis.
