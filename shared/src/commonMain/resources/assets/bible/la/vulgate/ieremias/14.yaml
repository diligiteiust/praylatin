bible: vulgate
lang: la
language: Latina
book: Ieremias
chapter: "14"
verses:
  "1": Quod factum est verbum Dómini ad Ieremíam de sermónibus siccitátis.
  "2": Luxit Iudǽa, et portæ eius corruérunt, et obscurátæ sunt in terra, et clamor Ierúsalem ascéndit.
  "3": 'Maióres misérunt minóres suos ad aquam: venérunt ad hauriéndum, non invenérunt aquam, reportavérunt vasa sua vácua: confúsi sunt et afflícti, et operuérunt cápita sua.'
  "4": 'Propter terræ vastitátem, quia non venit plúvia in terram, confúsi sunt agrícolæ: operuérunt cápita sua.'
  "5": Nam et cerva in agro péperit, et relíquit, quia non erat herba.
  "6": Et ónagri stetérunt in rúpibus, traxérunt ventum quasi dracónes, defecérunt óculi eórum, quia non erat herba.
  "7": 'Si iniquitátes nostræ respónderint nobis: Dómine fac propter nomen tuum, quóniam multæ sunt aversiónes nostræ, tibi peccávimus.'
  "8": 'Exspectátio Israel, salvátor eius in témpore tribulatiónis: quare quasi colónus futúrus es in terra, et quasi viátor declínans ad manéndum?'
  "9": Quare futúrus es velut vir vagus, ut fortis qui non potest salváre? tu autem in nobis es Dómine, et nomen tuum invocátum est super nos, ne derelínquas nos.
  "10": 'Hæc dicit Dóminus pópulo huic, qui diléxit movére pedes suos, et non quiévit, et Dómino non plácuit: Nunc recordábitur iniquitátum eórum, et visitábit peccáta eórum.'
  "11": 'Et dixit Dóminus ad me: Noli oráre pro pópulo isto in bonum.'
  "12": 'Cum ieiunáverint, non exáudiam preces eórum: et si obtúlerint holocautómata, et víctimas, non suscípiam ea: quóniam gládio, et fame, et peste consúmam eos.'
  "13": 'Et dixi, A a a, Dómine Deus: prophétæ dicunt eis: Non vidébitis gládium, et fames non erit in vobis: sed pacem veram dabit vobis in loco isto.'
  "14": 'Et dicit Dóminus ad me: Falso prophétæ vaticinántur in nómine meo: non misi eos, et non præcépi eis, neque locútus sum ad eos. Visiónem mendácem, et divinatiónem, et frauduléntiam, et seductiónem cordis sui prophétant vobis.'
  "15": 'Idcírco hæc dicit Dóminus de prophétis, qui prophétant in nómine meo, quos ego non misi, dicéntes: Gládius, et fames non erit in terra hac: In gládio et fame consuméntur prophétæ illi.'
  "16": 'Et pópuli, quibus prophétant erunt proiécti in viis Ierúsalem præ fame et gládio, et non erit qui sepéliat eos: ipsi et uxóres eórum, fílii et fíliæ eórum: et effúndam super eos malum suum.'
  "17": 'Et dices ad eos verbum istud: Dedúcant óculi mei lácrymam per noctem et diem, et non táceant: quóniam contritióne magna contríta est virgo fília pópuli mei, plaga péssima veheménter.'
  "18": 'Si egréssus fúero ad agros, ecce occísi gládio: et si introíero in civitátem, ecce attenuáti fame. Prophéta quoque et sacérdos abiérunt in terram, quam ignorábant.'
  "19": 'Numquid proíciens abiecísti Iudam? aut Sion abomináta est ánima tua? quare ergo percussísti nos, ita ut nulla sit sánitas? exspectávimus pacem, et non est bonum: et tempus curatiónis, et ecce turbátio.'
  "20": Cognóvimus Dómine impietátes nostras, iniquitátes patrum nostrórum, quia peccávimus tibi.
  "21": 'Ne des nos in oppróbrium propter nomen tuum, neque fácias nobis contuméliam sólii glóriæ tuæ: recordáre, ne írritum fácias fœdus tuum nobíscum.'
  "22": Numquid sunt in sculptílibus géntium qui pluant? aut cæli possunt dare imbres? nonne tu es Dóminus Deus noster, quem exspectávimus? tu enim fecísti ómnia hæc.
