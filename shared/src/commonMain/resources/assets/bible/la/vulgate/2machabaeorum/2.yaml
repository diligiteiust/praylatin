bible: vulgate
lang: la
language: Latina
book: II Machabaeorum
chapter: "2"
verses:
  "1": 'Invenítur autem in descriptiónibus Ieremíæ prophétæ, quod iussit eos ignem accípere qui transmigrábant: ut significátum est, et ut mandávit transmigrátis.'
  "2": Et dedit illis legem, ne oblivisceréntur præcépta Dómini, et non exerrárent méntibus, vidéntes simulácra áurea, et argéntea, et ornaménta eórum.
  "3": Et ália huiúsmodi dicens, hortabátur ne legem amovérent a corde suo.
  "4": Erat autem in ipsa scriptúra, quómodo tabernáculum, et arcam iussit prophéta divíno respónso ad se facto comitári secum, úsquequo éxiit in montem, in quo Móyses ascéndit, et vidit Dei hereditátem.
  "5": 'Et véniens ibi Ieremías, invénit locum spelúncæ: et tabernáculum, et arcam, et altáre incénsi íntulit illuc, et óstium obstrúxit.'
  "6": 'Et accessérunt quidam simul, qui sequebántur, ut notárent sibi locum: et non potuérunt inveníre.'
  "7": 'Ut autem cognóvit Ieremías, culpans illos dixit: Quod ignótus erit locus donec cóngreget Deus congregatiónem pópuli, et propítius fiat:'
  "8": et tunc Dóminus osténdet hæc, et apparébit maiéstas Dómini, et nubes erit, sicut et Móysi manifestabátur, et sicut cum Sálomon pétiit ut locus sanctificarétur magno Deo, manifestábat hæc.
  "9": 'Magnífice étenim sapiéntiam tractábat: et ut sapiéntiam habens, óbtulit sacrifícium dedicatiónis, et consummatiónis templi.'
  "10": Sicut et Móyses orábat ad Dóminum, et descéndit ignis de cælo, et consúmpsit holocáustum, sic et Sálomon orávit, et descéndit ignis de cælo, et consúmpsit holocáustum.
  "11": Et dixit Móyses, eo quod non sit coméstum quod erat pro peccáto, consúmptum est.
  "12": Simíliter et Sálomon octo diébus celebrávit dedicatiónem.
  "13": 'Inferebántur autem in descriptiónibus, et commentáriis Nehemíæ hæc éadem: et ut cónstruens bibliothécam congregávit de regiónibus libros, et prophetárum, et David, et epístolas regum, et de donáriis.'
  "14": Simíliter autem et Iudas ea, quæ decíderant per bellum quod nobis accíderat, congregávit ómnia, et sunt apud nos.
  "15": Si ergo desiderátis hæc, míttite qui pérferant vobis.
  "16": 'Actúri ítaque purificatiónem scrípsimus vobis: bene ergo faciétis, si egéritis hos dies.'
  "17": Deus autem, qui liberávit pópulum suum, et réddidit hereditátem ómnibus, et regnum, et sacerdótium, et sanctificatiónem,
  "18": sicut promísit in lege, sperámus quod cito nostri miserébitur, et congregábit de sub cælo in locum sanctum.
  "19": Erípuit enim nos de magnis perículis, et locum purgávit.
  "20": 'De Iuda vero Machabǽo, et frátribus eius, et de templi magni purificatióne, et de aræ dedicatióne:'
  "21": 'sed et de prœ́liis, quæ pértinent ad Antíochum Nóbilem, et fílium eius Eupátorem:'
  "22": et de illuminatiónibus, quæ de cælo factæ sunt ad eos, qui pro Iudǽis fórtiter fecérunt, ita ut univérsam regiónem, cum pauci essent, vindicárent, et bárbaram multitúdinem fugárent,
  "23": 'et famosíssimum in toto orbe templum recuperárent, et civitátem liberárent, et leges, quæ abólitæ erant, restitueréntur, Dómino cum omni tranquillitáte propítio facto illis:'
  "24": itémque ab Iasóne Cyrenǽo quinque libris comprehénsa tentávimus nos uno volúmine breviáre.
  "25": Considerántes enim multitúdinem librórum, et difficultátem voléntibus ággredi narratiónes historiárum propter multitúdinem rerum,
  "26": 'curávimus voléntibus quidem légere ut esset ánimi oblectátio: studiósis vero, ut facílius possint memóriæ commendáre: ómnibus autem legéntibus utílitas conferátur.'
  "27": Et nobis quidem ipsis, qui hoc opus breviándi causa suscépimus, non fácilem labórem, immo vero negótium plenum vigiliárum, et sudóris assúmpsimus.
  "28": Sicut hi, qui prǽparant convívium, et quærunt aliórum voluntáti parére propter multórum grátiam, libénter labórem sustinémus.
  "29": Veritátem quidem de síngulis auctóribus concedéntes, ipsi autem secúndum datam formam brevitáti studéntes.
  "30": 'Sicut enim novæ domus architécto de univérsa structúra curándum est: ei vero, qui píngere curat, quæ apta sunt ad ornátum exquirénda sunt: ita æstimándum est et in nobis.'
  "31": 'Etenim intelléctum collígere, et ordináre sermónem, et curiósius partes síngulas quasque disquírere, históriæ cóngruit auctóri:'
  "32": brevitátem vero dictiónis sectári, et exsecutiónes rerum vitáre, breviánti concedéndum est.
  "33": 'Hinc ergo narratiónem incipiémus: de præfatióne tantum dixísse suffíciat: stultum étenim est ante históriam efflúere, in ipsa autem história succíngi.'
