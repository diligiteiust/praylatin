bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "1"
verses:
  "1": 'Beátus vir, qui non ábiit in consílio impiórum, et in via peccatórum non stetit, et in cáthedra pestiléntiæ non sedit:'
  "2": sed in lege Dómini volúntas eius, et in lege eius meditábitur die ac nocte.
  "3": 'Et erit tamquam lignum, quod plantátum est secus decúrsus aquárum, quod fructum suum dabit in témpore suo: et fólium eius non défluet: et ómnia quæcúmque fáciet prosperabúntur.'
  "4": 'Non sic ímpii, non sic: sed tamquam pulvis, quem próicit ventus a fácie terræ.'
  "5": Ideo non resúrgent ímpii in iudício, neque peccatóres in concílio iustórum.
  "6": 'Quóniam novit Dóminus viam iustórum: et iter impiórum períbit.'
