bible: vulgate
lang: la
language: Latina
book: Ecclesiastes
chapter: "8"
verses:
  "1": Sapiéntia hóminis lucet in vultu eius, et potentíssimus fáciem illíus commutábit.
  "2": Ego os regis obsérvo, et præcépta iuraménti Dei.
  "3": 'Ne festínes recédere a fácie eius, neque permáneas in ópere malo: quia omne, quod volúerit, fáciet:'
  "4": 'et sermo illíus potestáte plenus est: nec dícere ei quisquam potest: Quare ita facis?'
  "5": Qui custódit præcéptum, non experiétur quidquam mali. Tempus et responsiónem cor sapiéntis intélligit.
  "6": 'Omni negótio tempus est, et opportúnitas, et multa hóminis afflíctio:'
  "7": quia ignórat prætérita, et futúra nullo scire potest núntio.
  "8": Non est in hóminis potestáte prohibére spíritum, nec habet potestátem in die mortis, nec sínitur quiéscere ingruénte bello, neque salvábit impíetas ímpium.
  "9": Omnia hæc considerávi, et dedi cor meum in cunctis opéribus, quæ fiunt sub sole. Intérdum dominátur homo hómini in malum suum.
  "10": 'Vidi ímpios sepúltos: qui étiam cum adhuc víverent, in loco sancto erant, et laudabántur in civitáte quasi iustórum óperum: sed et hoc vánitas est.'
  "11": Etenim quia non profértur cito contra malos senténtia, absque timóre ullo fílii hóminum pérpetrant mala.
  "12": 'Attamen peccátor ex eo quod cénties facit malum, et per patiéntiam sustentátur: ego cognóvi quod erit bonum timéntibus Deum, qui veréntur fáciem eius.'
  "13": Non sit bonum ímpio, nec prolongéntur dies eius, sed quasi umbra tránseant qui non timent fáciem Dómini.
  "14": 'Est et ália vánitas, quæ fit super terram: sunt iusti, quibus mala provéniunt quasi ópera égerint impiórum: et sunt ímpii, qui ita secúri sunt, quasi iustórum facta hábeant: sed et hoc vaníssimum iúdico.'
  "15": 'Laudávi ígitur lætítiam: quod non esset hómini bonum sub sole, nisi quod coméderet, et bíberet, atque gaudéret: et hoc solum secum auférret de labóre suo in diébus vitæ suæ, quos dedit ei Deus sub sole.'
  "16": Et appósui cor meum ut scirem sapiéntiam, et intellígerem distentiónem quæ versátur in terra. Est homo, qui diébus et nóctibus somnum non capit óculis.
  "17": 'Et intelléxi quod ómnium óperum Dei nullam possit homo inveníre ratiónem eórum, quæ fiunt sub sole: et quanto plus laboráverit ad quæréndum, tanto minus invéniat: étiam si díxerit sápiens se nosse, non póterit reperíre.'
