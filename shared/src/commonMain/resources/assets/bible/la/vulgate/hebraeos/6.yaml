bible: vulgate
lang: la
language: Latina
book: ad Hebraeos
chapter: "6"
verses:
  "1": Quaprópter intermitténtes inchoatiónis Christi sermónem, ad perfectióra ferámur, non rursum iaciéntes fundaméntum pœniténtiæ ab opéribus mórtuis, et fídei ad Deum,
  "2": baptísmatum doctrínæ, impositiónis quoque mánuum, ac resurrectiónis mortuórum, et iudícii ætérni.
  "3": Et hoc faciémus, síquidem permíserit Deus.
  "4": Impossíbile est enim eos, qui semel sunt illumináti, gustavérunt étiam donum cæléste, et partícipes facti sunt Spíritus sancti,
  "5": gustavérunt nihilóminus bonum Dei verbum, virtutésque sǽculi ventúri,
  "6": 'et prolápsi sunt: rursus renovári ad pœniténtiam, rursum crucifigéntes sibimetípsis Fílium Dei, et osténtui habéntes.'
  "7": 'Terra enim sæpe veniéntem super se bibens imbrem, et génerans herbam opportúnam illis, a quibus cólitur, áccipit benedictiónem a Deo:'
  "8": 'próferens autem spinas, ac tríbulos, réproba est, et maledícto próxima: cuius consummátio in combustiónem.'
  "9": 'Confídimus autem de vobis dilectíssimi melióra, et vicinióra salúti: tamétsi ita lóquimur.'
  "10": Non enim iniústus Deus, ut obliviscátur óperis vestri, et dilectiónis, quam ostendístis in nómine ipsíus, qui ministrástis sanctis, et ministrátis.
  "11": 'Cúpimus autem unumquémque vestrum eámdem ostentáre sollicitúdinem ad expletiónem spei usque in finem:'
  "12": ut non segnes efficiámini, verum imitatóres eórum, qui fide, et patiéntia hereditábunt promissiónes.
  "13": Abrahæ namque promíttens Deus, quóniam néminem hábuit, per quem iuráret, maiórem, iurávit per semetípsum,
  "14": 'dicens: Nisi benedícens benedícam te, et multíplicans multiplicábo te.'
  "15": Et sic longanímiter ferens, adéptus est repromissiónem.
  "16": 'Hómines enim per maiórem sui iurant: et omnis controvérsiæ eórum finis, ad confirmatiónem, est iuraméntum.'
  "17": 'In quo abundántius volens Deus osténdere pollicitatiónis herédibus immobilitátem consílii sui, interpósuit iusiurándum:'
  "18": ut per duas res immóbiles, quibus impossíbile est mentíri Deum, fortíssimum solátium habeámus, qui confúgimus ad tenéndam propósitam spem,
  "19": quam sicut ánchoram habémus ánimæ tutam ac firmam, et incedéntem usque ad interióra veláminis,
  "20": ubi præcúrsor pro nobis introívit Iesus, secúndum órdinem Melchísedech póntifex factus in ætérnum.
