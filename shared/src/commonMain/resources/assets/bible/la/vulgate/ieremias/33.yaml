bible: vulgate
lang: la
language: Latina
book: Ieremias
chapter: "33"
verses:
  "1": 'Et factum est verbum Dómini ad Ieremíam secúndo, cum adhuc clausus esset in átrio cárceris, dicens:'
  "2": Hæc dicit Dóminus qui factúrus est, et formatúrus illud, et paratúrus, Dóminus nomen eius.
  "3": 'Clama ad me, et exáudiam te: et annuntiábo tibi grándia, et firma quæ nescis.'
  "4": Quia hæc dicit Dóminus Deus Israel ad domos urbis huius, et ad domos regis Iuda, quæ destrúctæ sunt, et ad munitiónes, et ad gládium
  "5": veniéntium ut dímicent cum Chaldǽis, et ímpleant eas cadavéribus hóminum, quos percússi in furóre meo et in indignatióne mea, abscóndens fáciem meam a civitáte hac, propter omnem malítiam eórum.
  "6": 'Ecce ego obdúcam eis cicatrícem et sanitátem, et curábo eos: et revelábo illis deprecatiónem pacis et veritátis.'
  "7": 'Et convértam conversiónem Iuda, et conversiónem Ierúsalem: et ædificábo eos sicut a princípio.'
  "8": 'Et emundábo illos ab omni iniquitáte sua, in qua peccavérunt mihi: et propítius ero cunctis iniquitátibus eórum, in quibus dereliquérunt mihi, et sprevérunt me.'
  "9": 'Et erit mihi in nomen, et in gáudium, et in laudem, et in exsultatiónem cunctis géntibus terræ, quæ audíerint ómnia bona, quæ ego factúrus sum eis: et pavébunt, et turbabúntur in univérsis bonis, et in omni pace, quam ego fáciam eis.'
  "10": 'Hæc dicit Dóminus: Adhuc audiétur in loco isto (quem vos dícitis esse desértum, eo quod non sit homo nec iuméntum: in civitátibus Iuda, et foris Ierúsalem, quæ desolátæ sunt absque hómine, et absque habitatóre, et absque pécore)'
  "11": 'vox gáudii et vox lætítiæ, vox sponsi et vox sponsæ, vox dicéntium: Confitémini Dómino exercítuum, quóniam bonus Dóminus, quóniam in ætérnum misericórdia eius: et portántium vota in domum Dómini: redúcam enim conversiónem terræ sicut a princípio, dicit Dóminus.'
  "12": 'Hæc dicit Dóminus exercítuum: Adhuc erit in loco isto desérto, absque hómine et absque iuménto, et in cunctis civitátibus eius, habitáculum pastórum accubántium gregum.'
  "13": In civitátibus montuósis, et in civitátibus campéstribus, et in civitátibus quæ ad austrum sunt, et in terra Béniamin, et in circúitu Ierúsalem, et in civitátibus Iuda, adhuc transíbunt greges ad manum numerántis, ait Dóminus.
  "14": Ecce dies véniunt, dicit Dóminus, et suscitábo verbum bonum, quod locútus sum ad domum Israel et ad domum Iuda.
  "15": In diébus illis et in témpore illo germináre fáciam David germen iustítiæ, et fáciet iudícium et iustítiam in terra.
  "16": 'In diébus illis salvábitur Iuda, et Ierúsalem habitábit confidénter: et hoc est nomen, quod vocábunt eum, Dóminus iustus noster.'
  "17": 'Quia hæc dicit Dóminus: Non interíbit de David vir, qui sédeat super thronum domus Israel.'
  "18": Et de sacerdótibus et de Levítis non interíbit vir a fácie mea, qui ófferat holocautómata, et incéndat sacríficum, et cædat víctimas ómnibus diébus.
  "19": 'Et factum est verbum Dómini ad Ieremíam, dicens:'
  "20": 'Hæc dicit Dóminus: Si írritum potest fíeri pactum meum cum die, et pactum meum cum nocte, ut non sit dies et nox in témpore suo:'
  "21": et pactum meum írritum esse póterit cum David servo meo, ut non sit ex eo fílius qui regnet in throno eius, et Levítæ et sacerdótes minístri mei.
  "22": 'Sícuti enumerári non possunt stellæ cæli, et metíri aréna maris: sic multiplicábo semen David servi mei, et Levítas minístros meos.'
  "23": 'Et factum est verbum Dómini ad Ieremíam, dicens:'
  "24": 'Numquid non vidísti quid pópulus hic locútus sit, dicens: Duæ cognatiónes, quas elégerat Dóminus, abiéctæ sunt: et pópulum meum despexérunt, eo quod non sit ultra gens coram eis?'
  "25": 'Hæc dicit Dóminus: Si pactum meum inter diem et noctem, et leges cælo et terræ non pósui:'
  "26": 'équidem et semen Iacob et David servi mei proíciam, ut non assúmam de sémine eius príncipes séminis Abraham, Isaac, et Iacob: redúcam enim conversiónem eórum, et miserébor eis.'
