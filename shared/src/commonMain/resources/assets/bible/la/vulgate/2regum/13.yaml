bible: vulgate
lang: la
language: Latina
book: II Regum
chapter: "13"
verses:
  "1": Anno vigésimo tértio Ioas fílii Ochozíæ regis Iuda, regnávit Ióachaz fílius Iehu super Israel in Samaría decem et septem annis.
  "2": Et fecit malum coram Dómino, secutúsque est peccáta Ieróboam fílii Nabat, qui peccáre fecit Israel, et non declinávit ab eis.
  "3": Iratúsque est furor Dómini contra Israel, et trádidit eos in manu Házael regis Sýriæ, et in manu Bénadad fílii Házael, cunctis diébus.
  "4": 'Deprecátus est autem Ióachaz fáciem Dómini, et audívit eum Dóminus: vidit enim angústiam Israel, quia attríverat eos rex Sýriæ:'
  "5": 'et dedit Dóminus salvatórem Israéli, et liberátus est de manu regis Sýriæ: habitaverúntque fílii Israel in tabernáculis suis sicut heri et nudiustértius.'
  "6": 'Verúmtamen non recessérunt a peccátis domus Ieróboam, qui peccáre fecit Israel, sed in ipsis ambulavérunt: síquidem et lucus permánsit in Samaría.'
  "7": 'Et non sunt derelícti Ióachaz de pópulo nisi quinquagínta équites, et decem currus, et decem míllia péditum: interfécerat enim eos rex Sýriæ, et redégerat quasi púlverem in tritúra áreæ.'
  "8": Réliqua autem sermónum Ióachaz, et univérsa quæ fecit, et fortitúdo eius, nonne hæc scripta sunt in Libro sermónum diérum regum Israel?
  "9": 'Dormivítque Ióachaz cum pátribus suis, et sepeliérunt eum in Samaría: regnavítque Ioas fílius eius pro eo.'
  "10": Anno trigésimo séptimo Ioas regis Iuda, regnávit Ioas fílius Ióachaz super Israel in Samaría sédecim annis.
  "11": 'Et fecit quod malum est in conspéctu Dómini: non declinávit ab ómnibus peccátis Ieróboam fílii Nabat, qui peccáre fecit Israel, sed in ipsis ambulávit.'
  "12": Réliqua autem sermónum Ioas, et univérsa quæ fecit, et fortitúdo eius, quómodo pugnáverit contra Amasíam regem Iuda, nonne hæc scripta sunt in Libro sermónum diérum regum Israel?
  "13": 'Et dormívit Ioas cum pátribus suis: Ieróboam autem sedit super sólium eius. Porro Ioas sepúltus est in Samaría cum régibus Israel.'
  "14": 'Eliséus autem ægrotábat infirmitáte, qua et mórtuus est: descendítque ad eum Ioas rex Israel, et flebat coram eo, dicebátque: Pater mi, pater mi, currus Israel et auríga eius.'
  "15": 'Et ait illi Eliséus: Affer arcum, et sagíttas. Cumque attulísset ad eum arcum, et sagíttas,'
  "16": 'dixit ad regem Israel: Pone manum tuam super arcum. Et cum posuísset ille manum suam, superpósuit Eliséus manus suas mánibus regis,'
  "17": 'et ait: Aperi fenéstram orientálem. Cumque aperuísset, dixit Eliséus: Iace sagíttam. Et iecit. Et ait Eliséus: Sagítta salútis Dómini, et sagítta salútis contra Sýriam: percutiésque Sýriam in Aphec, donec consúmas eam.'
  "18": 'Et ait: Tolle sagíttas. Qui cum tulísset, rursum dixit ei: Pércute iáculo terram. Et cum percussísset tribus vícibus, et stetísset,'
  "19": 'irátus est vir Dei contra eum, et ait: Si percussísses quínquies, aut séxies, sive sépties, percussísses Sýriam usque ad consumptiónem: nunc autem tribus vícibus percúties eam.'
  "20": Mórtuus est ergo Eliséus, et sepeliérunt eum. Latrúnculi autem de Moab venérunt in terram in ipso anno.
  "21": Quidam autem sepeliéntes hóminem, vidérunt latrúnculos, et proiecérunt cadáver in sepúlcro Eliséi. Quod cum tetigísset ossa Eliséi, revíxit homo, et stetit super pedes suos.
  "22": 'Igitur Házael rex Sýriæ afflíxit Israel cunctis diébus Ióachaz:'
  "23": 'et misértus est Dóminus eórum, et revérsus est ad eos propter pactum suum, quod habébat cum Abraham, et Isaac, et Iacob: et nóluit dispérdere eos, neque proícere pénitus usque in præsens tempus.'
  "24": Mórtuus est autem Házael rex Sýriæ, et regnávit Bénadad fílius eius pro eo.
  "25": 'Porro Ioas fílius Ióachaz tulit urbes de manu Bénadad fílii Házael, quas túlerat de manu Ióachaz patris sui iure prœ́lii: tribus vícibus percússit eum Ioas, et réddidit civitátes Israel.'
