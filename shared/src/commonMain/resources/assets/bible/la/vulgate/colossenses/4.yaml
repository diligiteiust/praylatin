bible: vulgate
lang: la
language: Latina
book: ad Colossenses
chapter: "4"
verses:
  "1": 'Dómini, quod iustum est et æquum, servis præstáte: sciéntes quod et vos Dóminum habétis in cælo.'
  "2": 'Oratióni instáte, vigilántes in ea in gratiárum actióne:'
  "3": orántes simul et pro nobis, ut Deus apériat nobis óstium sermónis ad loquéndum mystérium Christi (propter quod étiam vinctus sum),
  "4": ut maniféstem illud ita ut opórtet me loqui.
  "5": 'In sapiéntia ambuláte ad eos, qui foris sunt: tempus rediméntes.'
  "6": Sermo vester semper in grátia sale sit condítus, ut sciátis quómodo opórteat vos unicuíque respondére.
  "7": 'Quæ circa me sunt, ómnia vobis nota fáciet Týchicus, caríssimus frater, et fidélis miníster, et consérvus in Dómino:'
  "8": quem misi ad vos ad hoc ipsum, ut cognóscat quæ circa vos sunt, et consolétur corda vestra,
  "9": cum Onésimo caríssimo, et fidéli fratre, qui ex vobis est. Omnia, quæ hic agúntur, nota fácient vobis.
  "10": 'Salútat vos Aristárchus concaptívus meus, et Marcus consobrínus Bárnabæ, de quo accepístis mandáta: si vénerit ad vos, excípite illum:'
  "11": 'et Iesus, qui dícitur Iustus: qui sunt ex circumcisióne: hi soli sunt adiutóres mei in regno Dei, qui mihi fuérunt solátio.'
  "12": Salútat vos Epaphras, qui ex vobis est, servus Christi Iesu, semper sollícitus pro vobis in oratiónibus, ut stetis perfécti, et pleni in omni voluntáte Dei.
  "13": Testimónium enim illi perhíbeo quod habet multum labórem pro vobis, et pro iis, qui sunt Laodicíæ, et qui Hierápoli.
  "14": Salútat vos Lucas, médicus caríssimus, et Demas.
  "15": Salutáte fratres, qui sunt Laodicíæ, et Nympham, et quæ in domo eius est, ecclésiam.
  "16": 'Et cum lecta fúerit apud vos epístola hæc, fácite ut et in Laodicénsium ecclésia legátur: et eam, quæ Laodicénsium est, vos legátis.'
  "17": 'Et dícite Archíppo: Vide ministérium, quod accepísti in Dómino, ut illud ímpleas.'
  "18": Salutátio, mea manu Pauli. Mémores estóte vinculórum meórum. Grátia vobíscum. Amen.
