bible: vulgate
lang: la
language: Latina
book: Isaias
chapter: "45"
verses:
  "1": Hæc dicit Dóminus christo meo Cyro, cuius apprehéndi déxteram, ut subíciam ante fáciem eius gentes, et dorsa regum vertam, et apériam coram eo iánuas, et portæ non claudéntur.
  "2": 'Ego ante te ibo, et gloriósos terræ humiliábo: portas ǽreas cónteram, et vectes férreos confríngam.'
  "3": 'Et dabo tibi thesáuros abscónditos, et arcána secretórum: ut scias quia ego Dóminus, qui voco nomen tuum, Deus Israel.'
  "4": 'Propter servum meum Iacob, et Israel eléctum meum, et vocávi te nómine tuo: assimilávi te, et non cognovísti me.'
  "5": 'Ego Dóminus, et non est ámplius: extra me non est Deus: accínxi te, et non cognovísti me:'
  "6": ut sciant hi, qui ab ortu solis, et qui ab occidénte, quóniam absque me non est. Ego Dóminus, et non est alter,
  "7": 'formans lucem, et creans ténebras, fáciens pacem, et creans malum: ego Dóminus fáciens ómnia hæc.'
  "8": 'Roráte cæli désuper, et nubes pluant iustum: aperiátur terra, et gérminet salvatórem: et iustítia oriátur simul: ego Dóminus creávi eum.'
  "9": 'Væ qui contradícit fictóri suo, testa de sámiis terræ: numquid dicet lutum fígulo suo: Quid facis, et opus tuum absque mánibus est?'
  "10": 'Væ qui dicit patri: Quid géneras? et mulíeri: Quid párturis?'
  "11": 'Hæc dicit Dóminus sanctus Israel plastes eius: Ventúra interrogáte me: super fílios meos, et super opus mánuum meárum mandáte mihi.'
  "12": 'Ego feci terram, et hóminem super eam creávi ego: manus meæ tetendérunt cælos, et omni milítiæ eórum mandávi.'
  "13": 'Ego suscitávi eum ad iustítiam, et omnes vias eius dírigam: ipse ædificábit civitátem meam, et captivitátem meam dimíttet, non in prétio neque in munéribus, dicit Dóminus Deus exercítuum.'
  "14": 'Hæc dicit Dóminus: Labor Ægýpti, et negotiátio Æthiópiæ, et Sábaim viri sublímes ad te transíbunt, et tui erunt: post te ambulábunt, vincti mánicis pergent: et te adorábunt, teque deprecabúntur: Tantum in te est Deus, et non est absque te Deus.'
  "15": Vere tu es Deus abscónditus, Deus Israel salvátor.
  "16": 'Confúsi sunt, et erubuérunt omnes: simul abiérunt in confusiónem fabricatóres errórum.'
  "17": 'Israel salvátus est in Dómino salúte ætérna: non confundémini, et non erubescétis usque in sǽculum sǽculi.'
  "18": 'Quia hæc dicit Dóminus creans cælos, ipse Deus formans terram, et fáciens eam, ipse plastes eius: non in vanum creávit eam: ut habitarétur, formávit eam: ego Dóminus, et non est álius.'
  "19": 'Non in abscóndito locútus sum, in loco terræ tenebróso: non dixi sémini Iacob: Frustra quǽrite me: ego Dóminus loquens iustítiam, annúntians recta.'
  "20": 'Congregámini, et veníte, et accédite simul qui salváti estis ex géntibus: nesciérunt qui levant lignum sculptúræ suæ, et rogant deum non salvántem.'
  "21": 'Annuntiáte, et veníte, et consiliámini simul: quis audítum fecit hoc ab inítio, ex tunc prædíxit illud? numquid non ego Dóminus, et non est ultra Deus absque me? Deus iustus, et salvans non est præter me.'
  "22": 'Convertímini ad me, et salvi éritis omnes fines terræ: quia ego Deus, et non est álius.'
  "23": 'In memetípso iurávi, egrediétur de ore meo iustítiæ verbum, et non revertétur: quia mihi curvábitur omne genu, et iurábit omnis lingua.'
  "24": 'Ergo in Dómino, dicet, meæ sunt iustítiæ et impérium: ad eum vénient, et confundéntur omnes qui repúgnant ei.'
  "25": In Dómino iustificábitur, et laudábitur omne semen Israel.
