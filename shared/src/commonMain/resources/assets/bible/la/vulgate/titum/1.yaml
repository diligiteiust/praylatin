bible: vulgate
lang: la
language: Latina
book: ad Titum
chapter: "1"
verses:
  "1": Paulus servus Dei, Apóstolus autem Iesu Christi secúndum fidem electórum Dei, et agnitiónem veritátis, quæ secúndum pietátem est
  "2": 'in spem vitæ ætérnæ, quam promísit qui non mentítur, Deus, ante témpora sæculária:'
  "3": 'manifestávit autem tempóribus suis verbum suum in prædicatióne, quæ crédita est mihi secúndum præcéptum Salvatóris nostri Dei:'
  "4": Tito dilécto fílio secúndum commúnem fidem, grátia, et pax a Deo Patre, et Christo Iesu Salvatóre nostro.
  "5": Huius rei grátia relíqui te Cretæ, ut ea, quæ desunt, córrigas, et constítuas per civitátes presbýteros, sicut et ego dispósui tibi,
  "6": si quis sine crímine est, uníus uxóris vir, fílios habens fidéles, non in accusatióne luxúriæ, aut non súbditos.
  "7": 'Opórtet enim epíscopum sine crímine esse, sicut Dei dispensatórem: non supérbum, non iracúndum, non vinoléntum, non percussórem, non turpis lucri cúpidum:'
  "8": sed hospitálem, benígnum, sóbrium, iustum, sanctum, continéntem,
  "9": 'amplecténtem eum, qui secúndum doctrínam est, fidélem sermónem: ut potens sit exhortári in doctrína sana, et eos, qui contradícunt, argúere.'
  "10": 'Sunt enim multi étiam inobediéntes, vaníloqui, et seductóres: máxime qui de circumcisióne sunt:'
  "11": 'quos opórtet redárgui: qui univérsas domos subvértunt, docéntes quæ non opórtet, turpis lucri grátia.'
  "12": 'Dixit quidam ex illis, próprius ipsórum prophéta: Creténses semper mendáces, malæ béstiæ, ventres pigri.'
  "13": Testimónium hoc verum est. Quam ob causam íncrepa illos dure, ut sani sint in fide,
  "14": non intendéntes Iudáicis fábulis, et mandátis hóminum, aversántium se a veritáte.
  "15": 'Omnia munda mundis: coinquinátis autem, et infidélibus, nihil est mundum, sed inquinátæ sunt eórum et mens, et consciéntia.'
  "16": 'Confiténtur se nosse Deum, factis autem negant: cum sint abomináti, et incredíbiles, et ad omne opus bonum réprobi.'
