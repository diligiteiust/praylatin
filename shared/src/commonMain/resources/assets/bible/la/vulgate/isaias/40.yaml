bible: vulgate
lang: la
language: Latina
book: Isaias
chapter: "40"
verses:
  "1": Consolámini, consolámini pópule meus, dicit Deus vester.
  "2": 'Loquímini ad cor Ierúsalem, et advocáte eam, quóniam compléta est malítia eius, dimíssa est iníquitas illíus: suscépit de manu Dómini duplícia pro ómnibus peccátis suis.'
  "3": 'Vox clamántis in desérto: Paráte viam Dómini, rectas fácite in solitúdine sémitas Dei nostri.'
  "4": Omnis vallis exaltábitur, et omnis mons et collis humiliábitur, et erunt prava in dirécta, et áspera in vias planas.
  "5": Et revelábitur glória Dómini, et vidébit omnis caro páriter quod os Dómini locútum est.
  "6": 'Vox dicéntis: Clama. Et dixi: Quid clamábo? Omnis caro fœnum, et omnis glória eius quasi flos agri.'
  "7": 'Exsiccátum est fœnum, et cécidit flos, quia spíritus Dómini sufflávit in eo. Vere fœnum est pópulus:'
  "8": 'exsiccátum est fœnum, et cécidit flos: verbum autem Dómini nostri manet in ætérnum.'
  "9": 'Super montem excélsum ascénde tu, qui evangelízas Sion: exálta in fortitúdine vocem tuam, qui evangelízas Ierúsalem: exálta, noli timére. Dic civitátibus Iuda: Ecce Deus vester:'
  "10": 'ecce Dóminus Deus in fortitúdine véniet, et bráchium eius dominábitur: ecce merces eius cum eo, et opus illíus coram illo.'
  "11": 'Sicut pastor gregem suum pascet: in bráchio suo congregábit agnos, et in sinu suo levábit, fœtas ipse portábit.'
  "12": Quis mensus est pugíllo aquas, et cælos palmo ponderávit? quis appéndit tribus dígitis molem terræ, et librávit in póndere montes, et colles in statéra?
  "13": Quis adiúvit spíritum Dómini? aut quis consiliárius eius fuit, et osténdit illi?
  "14": Cum quo íniit consílium, et instrúxit eum, et dócuit eum sémitam iustítiæ, et erudívit eum sciéntiam, et viam prudéntiæ osténdit illi?
  "15": 'Ecce gentes quasi stilla sítulæ, et quasi moméntum statéræ reputátæ sunt: ecce ínsulæ quasi pulvis exíguus.'
  "16": Et Líbanus non suffíciet ad succendéndum, et animália eius non suffícient ad holocáustum.
  "17": Omnes gentes quasi non sint, sic sunt coram eo, et quasi níhilum et ináne reputátæ sunt ei.
  "18": Cui ergo símilem fecístis Deum? aut quam imáginem ponétis ei?
  "19": Numquid scúlptile conflávit faber? aut áurifex auro figurávit illud, et láminis argénteis argentárius?
  "20": 'Forte lignum et imputríbile elégit: ártifex sápiens quærit quómodo státuat simulácrum, quod non moveátur.'
  "21": Numquid non scitis? numquid non audístis? numquid non annuntiátum est vobis ab inítio? numquid non intellexístis fundaménta terræ?
  "22": 'Qui sedet super gyrum terræ, et habitatóres eius sunt quasi locústæ: qui exténdit velut níhilum cælos, et expándit eos sicut tabernáculum ad inhabitándum.'
  "23": 'Qui dat secretórum scrutatóres quasi non sint, iúdices terræ velut ináne fecit:'
  "24": 'et quidem neque plantátus, neque satus, neque radicátus in terra truncus eórum: repénte flavit in eos, et aruérunt, et turbo quasi stípulam áuferet eos.'
  "25": Et cui assimilástis me, et adæquástis, dicit sanctus?
  "26": 'Leváte in excélsum óculos vestros, et vidéte quis creávit hæc: qui edúcit in número milítiam eórum, et omnes ex nómine vocat: præ multitúdine fortitúdinis et róboris, virtutísque eius, neque unum réliquum fuit.'
  "27": 'Quare dicis Iacob, et lóqueris Israel: Abscóndita est via mea a Dómino, et a Deo meo iudícium meum transívit?'
  "28": 'Numquid nescis, aut non audísti? Deus sempitérnus Dóminus, qui creávit términos terræ: non defíciet, neque laborábit, nec est investigátio sapiéntiæ eius.'
  "29": 'Qui dat lasso virtútem: et his, qui non sunt, fortitúdinem et robur multíplicat.'
  "30": Defícient púeri, et laborábunt, et iúvenes in infirmitáte cadent.
  "31": 'Qui autem sperant in Dómino mutábunt fortitúdinem, assúment pennas sicut áquilæ: current et non laborábunt, ambulábunt et non defícient.'
