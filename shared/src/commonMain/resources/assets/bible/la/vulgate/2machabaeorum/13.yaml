bible: vulgate
lang: la
language: Latina
book: II Machabaeorum
chapter: "13"
verses:
  "1": Anno centésimo quadragésimo nono, cognóvit Iudas Antíochum Eupátorem veníre cum multitúdine advérsus Iudǽam,
  "2": et cum eo Lýsiam procuratórem, et præpósitum negotiórum, secum habéntem péditum centum decem míllia, et équitum quinque míllia, et elephántos vigínti duos, currus cum fálcibus trecéntos.
  "3": 'Commíscuit autem se illis et Meneláus: et cum multa fallácia deprecabátur Antíochum, non pro pátriæ salúte, sed sperans se constítui in principátum.'
  "4": 'Sed Rex regum suscitávit ánimos Antíochi in peccatórem: et suggerénte Lýsia hunc esse causam ómnium malórum, iussit (ut eis est consuetúdo) apprehénsum in eódem loco necári.'
  "5": 'Erat autem in eódem loco turris quinquagínta cubitórum, aggéstum úndique habens cíneris: hæc prospéctum habébat in præceps.'
  "6": Inde in cínerem déici iussit sacrílegum, ómnibus eum propelléntibus ad intéritum.
  "7": Et tali lege prævaricatórem legis cóntigit mori, nec terræ dari Meneláum.
  "8": 'Et quidem satis iuste: nam quia multa erga aram Dei delícta commísit, cuius ignis, et cinis erat sanctus: ipse in cíneris morte damnátus est.'
  "9": Sed rex mente effrenátus veniébat, nequiórem se patre suo Iudǽis ostensúrus.
  "10": 'Quibus Iudas cógnitis, præcépit pópulo ut die ac nocte Dóminum invocárent, quo, sicut semper, et nunc adiuváret eos:'
  "11": 'quippe qui lege, et pátria, sanctóque templo privári vereréntur: ac pópulum, qui nuper páululum respirásset, ne síneret blasphémis rursus natiónibus subdi.'
  "12": Omnibus ítaque simul id faciéntibus, et peténtibus a Dómino misericórdiam cum fletu, et ieiúniis, per tríduum contínuum prostrátis, hortátus est eos Iudas ut se præparárent.
  "13": Ipse vero cum senióribus cogitávit priúsquam rex admovéret exércitum ad Iudǽam, et obtinéret civitátem, exíre, et Dómini iudício commíttere éxitum rei.
  "14": Dans ítaque potestátem ómnium Deo mundi creatóri, et exhortátus suos ut fórtiter dimicárent, et usque ad mortem pro légibus, templo, civitáte, pátria, et cívibus starent, circa Modin exércitum constítuit.
  "15": 'Et dato signo suis Dei victóriæ, iuvénibus fortíssimis eléctis, nocte aggréssus aulam régiam, in castris interfécit viros quátuor míllia, et máximum elephantórum cum his, qui superpósiti fúerant:'
  "16": summóque metu, ac perturbatióne hóstium castra repléntes, rebus próspere gestis, abiérunt.
  "17": Hoc autem factum est die illucescénte, adiuvánte eum Dómini protectióne.
  "18": 'Sed rex, accépto gustu audáciæ Iudæórum, arte difficultátem locórum tentábat:'
  "19": 'et Bethsúræ, quæ erat Iudæórum præsídium munítum, castra admovébat: sed fugabátur, impingébat, minorabátur.'
  "20": His autem, qui intus erant, Iudas necessária mittébat.
  "21": Enuntiávit autem mystéria hóstibus Rhódocus quidam de Iudáico exércitu, qui requisítus comprehénsus est, et conclúsus.
  "22": 'Iterum rex sermónem hábuit ad eos, qui erant in Bethsúris: dextram dedit, accépit, ábiit:'
  "23": 'commísit cum Iuda, superátus est. Ut autem cognóvit rebellásse Philíppum Antiochíæ, qui relíctus erat super negótia, mente consternátus, Iudǽos déprecans, subditúsque eis, iurat de ómnibus, quibus iustum visum est: et reconciliátus óbtulit sacrifícium, honorávit templum, et múnera pósuit.'
  "24": Machabǽum amplexátus est, et fecit eum a Ptolemáide usque ad Gerrénos ducem et príncipem.
  "25": Ut autem venit Ptolemáidam, gráviter ferébant Ptoleménses amicítiæ conventiónem, indignántes ne forte fœdus irrúmperent.
  "26": 'Tunc ascéndit Lýsias tribúnal, et expósuit ratiónem, et pópulum sedávit, regressúsque est Antiochíam: et hoc modo regis proféctio, et réditus procéssit.'
