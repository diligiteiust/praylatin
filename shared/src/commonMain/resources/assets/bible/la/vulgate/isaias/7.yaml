bible: vulgate
lang: la
language: Latina
book: Isaias
chapter: "7"
verses:
  "1": 'Et factum est in diébus Achaz fílii Ióathan, fílii Ozíæ regis Iuda, ascéndit Rasin rex Sýriæ, et Phácee fílius Romelíæ rex Israel, in Ierúsalem, ad prœliándum contra eam: et non potuérunt debelláre eam.'
  "2": 'Et nuntiavérunt dómui David, dicéntes: Requiévit Sýria super Ephraim. Et commótum est cor eius, et cor pópuli eius, sicut movéntur ligna silvárum a fácie venti.'
  "3": 'Et dixit Dóminus ad Isaíam: Egrédere in occúrsum Achaz, tu et qui derelíctus est Iasub, fílius tuus, ad extrémum aquædúctus piscínæ superióris in via Agri fullónis.'
  "4": 'Et dices ad eum: Vide ut síleas: noli timére, et cor tuum ne formídet a duábus caudis titiónum fumigántium istórum in ira furóris Rasin regis Sýriæ, et fílii Romelíæ:'
  "5": 'eo quod consílium iníerit contra te Sýria in malum Ephraim, et fílius Romelíæ, dicéntes:'
  "6": Ascendámus ad Iudam, et suscitémus eum, et avellámus eum ad nos, et ponámus regem in médio eius fílium Tábeel.
  "7": 'Hæc dicit Dóminus Deus: Non stabit, et non erit istud:'
  "8": 'sed caput Sýriæ Damáscus, et caput Damásci Rasin: et adhuc sexagínta et quinque anni, et désinet Ephraim esse pópulus:'
  "9": et caput Ephraim Samaría, et caput Samaríæ fílius Romelíæ. Si non credidéritis, non permanébitis.
  "10": 'Et adiécit Dóminus loqui ad Achaz, dicens:'
  "11": Pete tibi signum a Dómino Deo tuo, in profúndum inférni, sive in excélsum supra.
  "12": 'Et dixit Achaz: Non petam, et non tentábo Dóminum.'
  "13": 'Et dixit: Audíte ergo domus David: Numquid parum vobis est moléstos esse homínibus, quia molésti estis et Deo meo?'
  "14": Propter hoc dabit Dóminus ipse vobis signum. Ecce virgo concípiet, et páriet fílium, et vocábitur nomen eius Emmánuel.
  "15": Butýrum et mel cómedet, ut sciat reprobáre malum, et elígere bonum.
  "16": Quia ántequam sciat puer reprobáre malum, et elígere bonum, derelinquétur terra, quam tu detestáris a fácie duórum regum suórum.
  "17": Addúcet Dóminus super te, et super pópulum tuum, et super domum patris tui dies, qui non venérunt a diébus separatiónis Ephraim a Iuda cum rege Assyriórum.
  "18": 'Et erit in die illa: sibilábit Dóminus muscæ, quæ est in extrémo flúminum Ægýpti, et api, quæ est in terra Assur:'
  "19": et vénient, et requiéscent omnes in torréntibus vállium, et in cavérnis petrárum, et in ómnibus frutétis, et in univérsis foramínibus.
  "20": In die illa radet Dóminus in novácula condúcta in his, qui trans flumen sunt, in rege Assyriórum, caput et pilos pedum, et barbam univérsam.
  "21": 'Et erit in die illa: nútriet homo vaccam boum, et duas oves,'
  "22": 'et præ ubertáte lactis cómedet butýrum: butýrum enim et mel manducábit omnis qui relíctus fúerit in médio terræ.'
  "23": 'Et erit in die illa: omnis locus ubi fúerint mille vites, mille argénteis, in spinas et in vepres erunt.'
  "24": 'Cum sagíttis et arcu ingrediéntur illuc: vepres enim et spinæ erunt in univérsa terra.'
  "25": Et omnes montes, qui in sárculo sarriéntur, non véniet illuc terror spinárum et véprium, et erit in páscua bovis, et in conculcatiónem pécoris.
