bible: vulgate
lang: la
language: Latina
book: Isaias
chapter: "51"
verses:
  "1": 'Audíte me qui sequímini quod iustum est, et quǽritis Dóminum: atténdite ad petram unde excísi estis, et ad cavérnam laci, de qua præcísi estis.'
  "2": 'Atténdite ad Abraham patrem vestrum, et ad Saram, quæ péperit vos: quia unum vocávi eum, et benedíxi ei, et multiplicávi eum.'
  "3": 'Consolábitur ergo Dóminus Sion, et consolábitur omnes ruínas eius: et ponet desértum eius quasi delícias, et solitúdinem eius quasi hortum Dómini. Gáudium et lætítia inveniétur in ea, gratiárum áctio et vox laudis.'
  "4": 'Atténdite ad me pópule meus, et tribus mea me audíte: quia lex a me éxiet, et iudícium meum in lucem populórum requiéscet.'
  "5": 'Prope est iustus meus, egréssus est salvátor meus, et bráchia mea pópulos iudicábunt: me ínsulæ exspectábunt, et bráchium meum sustinébunt.'
  "6": 'Leváte in cælum óculos vestros, et vidéte sub terra deórsum: quia cæli sicut fumus liquéscent, et terra sicut vestiméntum atterétur, et habitatóres eius sicut hæc interíbunt: salus autem mea in sempitérnum erit, et iustítia mea non defíciet.'
  "7": 'Audíte me qui scitis iustum, pópulus meus lex mea in corde eórum: nolíte timére oppróbrium hóminum, et blasphémias eórum ne metuátis.'
  "8": 'Sicut enim vestiméntum, sic cómedet eos vermis, et sicut lanam, sic devorábit eos tínea: salus autem mea in sempitérnum erit, et iustítia mea in generatiónes generatiónum.'
  "9": 'Consúrge, consúrge, indúere fortitúdinem bráchium Dómini: consúrge sicut in diébus antíquis, in generatiónibus sæculórum. Numquid non tu percussísti supérbum, vulnerásti dracónem?'
  "10": 'Numquid non tu siccásti mare, aquam abýssi veheméntis: qui posuísti profúndum maris viam, ut transírent liberáti?'
  "11": Et nunc qui redémpti sunt a Dómino, reverténtur, et vénient in Sion laudántes, et lætítia sempitérna super cápita eórum, gáudium et lætítiam tenébunt, fúgiet dolor et gémitus.
  "12": 'Ego, ego ipse consolábor vos: quis tu ut timéres ab hómine mortáli, et a fílio hóminis, qui quasi fœnum ita aréscet?'
  "13": 'Et oblítus es Dómini factóris tui, qui teténdit cælos et fundávit terram: et formidásti iúgiter tota die a fácie furóris eius, qui te tribulábat, et paráverat ad perdéndum: ubi nunc est furor tribulántis?'
  "14": Cito véniet grádiens ad aperiéndum, et non interfíciet usque ad interneciónem, nec defíciet panis eius.
  "15": 'Ego autem sum Dóminus Deus tuus, qui contúrbo mare, et intuméscunt fluctus eius: Dóminus exercítuum nomen meum.'
  "16": 'Pósui verba mea in ore tuo, et in umbra manus meæ protéxi te, ut plantes cælos, et fundes terram, et dicas ad Sion: Pópulus meus es tu.'
  "17": 'Eleváre, eleváre, consúrge Ierúsalem, quæ bibísti de manu Dómini cálicem iræ eius: usque ad fundum cálicis sopóris bibísti, et potásti usque ad fæces.'
  "18": 'Non est qui susténtet eam ex ómnibus fíliis, quos génuit: et non est qui apprehéndat manum eius ex ómnibus fíliis, quos enutrívit.'
  "19": 'Duo sunt quæ occurrérunt tibi: quis contristábitur super te? Vástitas, et contrítio, et fames, et gládius: quis consolábitur te?'
  "20": 'Fílii tui proiécti sunt, dormiérunt in cápite ómnium viárum, sicut oryx illaqueátus: pleni indignatióne Dómini, increpatióne Dei tui.'
  "21": Idcírco audi hoc paupércula, et ébria non a vino.
  "22": 'Hæc dicit dominátor tuus Dóminus, et Deus tuus, qui pugnábit pro pópulo suo: Ecce tuli de manu tua cálicem sopóris, fundum cálicis indignatiónis meæ, non adícies ut bibas illum ultra.'
  "23": 'Et ponam illum in manu eórum, qui te humiliavérunt, et dixérunt ánimæ tuæ: Incurváre, ut transeámus: et posuísti ut terram corpus tuum, et quasi viam transeúntibus.'
