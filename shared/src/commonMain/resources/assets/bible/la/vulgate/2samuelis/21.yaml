bible: vulgate
lang: la
language: Latina
book: II Samuelis
chapter: "21"
verses:
  "1": 'Facta est quoque fames in diébus David tribus annis iúgiter: et consúluit David oráculum Dómini. Dixítque Dóminus: Propter Saul, et domum eius sánguinum, quia occídit Gabaonítas.'
  "2": 'Vocátis ergo Gabaonítis rex, dixit ad eos. (Porro Gabaonítæ non erant de fíliis Israel, sed relíquiæ Amorrhæórum: fílii quippe Israel iuráverant eis, et vóluit Saul percútere eos zelo, quasi pro fíliis Israel et Iuda.)'
  "3": 'Dixit ergo David ad Gabaonítas: Quid fáciam vobis? et quod erit vestri piáculum, ut benedicátis hereditáti Dómini?'
  "4": 'Dixerúntque ei Gabaonítæ: Non est nobis super argénto et auro quǽstio, sed contra Saul, et contra domum eius: neque vólumus ut interficiátur homo de Israel. Ad quos rex ait: Quid ergo vultis ut fáciam vobis?'
  "5": 'Qui dixérunt regi: Virum, qui attrívit nos et oppréssit iníque, ita delére debémus, ut ne unus quidem resíduus sit de stirpe eius in cunctis fínibus Israel.'
  "6": 'Dentur nobis septem viri de fíliis eius, ut crucifigámus eos Dómino in Gábaa Saul, quondam elécti Dómini. Et ait rex: Ego dabo.'
  "7": Pepercítque rex Miphíboseth fílio Iónathæ fílii Saul, propter iusiurándum Dómini, quod fúerat inter David et inter Iónathan fílium Saul.
  "8": 'Tulit ítaque rex duos fílios Respha fíliæ Aia, quos péperit Sauli, Armóni, et Miphíboseth: et quinque fílios Michol fíliæ Saul, quos genúerat Hadriéli fílio Berzellái, qui fuit de Moláthi,'
  "9": 'et dedit eos in manus Gabaonitárum: qui crucifixérunt eos in monte coram Dómino: et cecidérunt hi septem simul occísi in diébus messis primis, incipiénte messióne hórdei.'
  "10": 'Tollens autem Respha fília Aia cilícium, substrávit sibi supra petram ab inítio messis, donec stilláret aqua super eos de cælo: et non dimísit aves laceráre eos per diem, neque béstias per noctem.'
  "11": Et nuntiáta sunt David quæ fécerat Respha fília Aia, concubína Saul.
  "12": 'Et ábiit David, et tulit ossa Saul, et ossa Iónathæ fílii eius, a viris Iabes Gálaad, qui furáti fúerant ea de platéa Bethsan, in qua suspénderant eos Philísthiim cum interfecíssent Saul in Gélboe:'
  "13": 'et asportávit inde ossa Saul, et ossa Iónathæ fílii eius: et colligéntes ossa eórum, qui affíxi fúerant,'
  "14": 'sepeliérunt ea cum óssibus Saul et Iónathæ fílii eius in terra Béniamin, in látere, in sepúlcro Cis patris eius: fecerúntque ómnia, quæ præcéperat rex, et repropitiátus est Deus terræ post hæc.'
  "15": Factum est autem rursum prœ́lium Philisthinórum advérsum Israel, et descéndit David, et servi eius cum eo, et pugnábant contra Philísthiim. Deficiénte autem David,
  "16": Iesbibénob, qui fuit de génere Arapha, cuius ferrum hastæ trecéntas úncias appendébat, et accínctus erat ense novo, nisus est percútere David.
  "17": 'Præsidióque ei fuit Abísai fílius Sárviæ, et percússum Philisthǽum interfécit. Tunc iuravérunt viri David, dicéntes: Iam non egrediéris nobíscum in bellum, ne exstínguas lucérnam Israel.'
  "18": 'Secúndum quoque bellum fuit in Gob contra Philisthǽos: tunc percússit Sobóchai et Husáti, Saph de stirpe Arapha de génere gigántum.'
  "19": Tértium quoque fuit bellum in Gob contra Philisthǽos, in quo percússit Adeódatus fílius Saltus polymitárius Bethlehemítes Góliath Gethǽum, cuius hastíle hastæ erat quasi liciatórium texéntium.
  "20": 'Quartum bellum fuit in Geth: in quo vir fuit excélsus, qui senos in mánibus pedibúsque habébat dígitos, id est, vigínti quátuor: et erat de orígine Arapha.'
  "21": 'Et blasphemávit Israel: percússit autem eum Iónathan fílius Sámaa fratris David.'
  "22": Hi quátuor nati sunt de Arapha in Geth, et cecidérunt in manu David et servórum eius.
