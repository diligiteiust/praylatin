bible: vulgate
lang: la
language: Latina
book: Ionas
chapter: "4"
verses:
  "1": 'Et afflíctus est Ionas afflictióne magna, et irátus est:'
  "2": 'et orávit ad Dóminum, et dixit: Obsecro Dómine, numquid non hoc est verbum meum, cum adhuc essem in terra mea? propter hoc præoccupávi ut fúgerem in Tharsis: scio enim quia tu Deus clemens, et miséricors es, pátiens et multæ miseratiónis, et ignóscens super malítia.'
  "3": 'Et nunc Dómine tolle quæso ánimam meam a me: quia mélior est mihi mors quam vita.'
  "4": 'Et dixit Dóminus: Putásne bene irásceris tu?'
  "5": 'Et egréssus est Ionas de civitáte, et sedit contra oriéntem civitátis: et fecit sibímet umbráculum ibi, et sedébat subter illud in umbra, donec vidéret quid accíderet civitáti.'
  "6": 'Et præparávit Dóminus Deus héderam, et ascéndit super caput Ionæ, ut esset umbra super caput eius, et protégeret eum: laboráverat enim: et lætátus est Ionas super hédera lætítia magna.'
  "7": 'Et parávit Deus vermem ascénsu dilúculi in crástinum: et percússit héderam, et exáruit.'
  "8": 'Et cum ortus fuísset sol, præcépit Dóminus vento cálido et urénti: et percússit sol super caput Ionæ, et æstuábat: et petívit ánimæ suæ ut morerétur, et dixit: Mélius est mihi mori quam vívere.'
  "9": 'Et dixit Dóminus ad Ionam: Putásne bene irásceris tu super hédera? Et dixit: Bene iráscor ego usque ad mortem.'
  "10": 'Et dixit Dóminus: Tu doles super héderam, in qua non laborásti, neque fecísti ut crésceret: quæ sub una nocte nata est, et sub una nocte périit.'
  "11": Et ego non parcam Nínive civitáti magnæ, in qua sunt plus quam centum vigínti míllia hóminum, qui nésciunt quid sit inter déxteram et sinístram suam, et iuménta multa?
