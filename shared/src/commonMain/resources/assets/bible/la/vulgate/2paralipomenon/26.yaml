bible: vulgate
lang: la
language: Latina
book: II Paralipomenon
chapter: "26"
verses:
  "1": Omnis autem pópulus Iuda fílium eius Ozíam, annórum sédecim, constítuit regem pro Amasía patre suo.
  "2": Ipse ædificávit Ailath, et restítuit eam ditióni Iuda, postquam dormívit rex cum pátribus suis.
  "3": 'Sédecim annórum erat Ozías cum regnáre cœpísset, et quinquagínta duóbus annis regnávit in Ierúsalem: nomen matris eius Iechelía de Ierúsalem.'
  "4": Fecítque quod erat rectum in óculis Dómini, iuxta ómnia quæ fécerat Amasías pater eius.
  "5": 'Et exquisívit Dóminum in diébus Zacharíæ intelligéntis et vidéntis Deum: cumque requíreret Dóminum, diréxit eum in ómnibus.'
  "6": 'Dénique egréssus est, et pugnávit contra Philísthiim, et destrúxit murum Geth, et murum Iábniæ, murúmque Azóti: ædificávit quoque óppida in Azóto et in Philísthiim.'
  "7": Et adiúvit eum Deus contra Philísthiim, et contra Arabes, qui habitábant in Gúrbaal, et contra Ammonítas.
  "8": 'Appendebántque Ammonítæ múnera Ozíæ: et divulgátum est nomen eius usque ad intróitum Ægýpti propter crebras victórias.'
  "9": Ædificavítque Ozías turres in Ierúsalem super portam ánguli, et super portam vallis, et réliquas in eódem muri látere, firmavítque eas.
  "10": 'Exstrúxit étiam turres in solitúdine, et effódit cistérnas plúrimas, eo quod habéret multa pécora, tam in campéstribus, quam in erémi vastitáte: víneas quoque hábuit et vinitóres in móntibus, et in Carmélo: erat quippe homo agricultúræ déditus.'
  "11": Fuit autem exércitus bellatórum eius, qui procedébant ad prœ́lia sub manu Iéhiel scribæ, Maasiǽque doctóris, et sub manu Hananíæ, qui erat de dúcibus regis.
  "12": Omnísque númerus príncipum per famílias, virórum fórtium duórum míllium sexcentórum.
  "13": Et sub eis univérsus exércitus trecentórum et septem míllium quingentórum, qui erant apti ad bella, et pro rege contra adversários dimicábant.
  "14": Præparávit quoque eis Ozías, id est, cuncto exercítui, clýpeos, et hastas, et gáleas, et lorícas, arcúsque et fundas ad iaciéndos lápides.
  "15": 'Et fecit in Ierúsalem divérsi géneris máchinas, quas in túrribus collocávit, et in ángulis murórum, ut mítterent sagíttas, et saxa grándia: egressúmque est nomen eius procul, eo quod auxiliarétur ei Dóminus, et corroborásset illum.'
  "16": 'Sed cum roborátus esset, elevátum est cor eius in intéritum suum, et negléxit Dóminum Deum suum: ingressúsque templum Dómini, adolére vóluit incénsum super altáre thymiámatis.'
  "17": Statímque ingréssus post eum Azarías sacérdos, et cum eo sacerdótes Dómini octogínta, viri fortíssimi,
  "18": 'restitérunt regi, atque dixérunt: Non est tui offícii Ozía, ut adóleas incénsum Dómino, sed sacerdótum, hoc est, filiórum Aaron, qui consecráti sunt ad huiuscémodi ministérium: egrédere de sanctuário, ne contémpseris: quia non reputábitur tibi in glóriam hoc a Dómino Deo.'
  "19": Iratúsque Ozías, tenens in manu thuríbulum ut adoléret incénsum, minabátur sacerdótibus. Statímque orta est lepra in fronte eius coram sacerdótibus, in domo Dómini super altáre thymiámatis.
  "20": Cumque respexísset eum Azarías póntifex, et omnes réliqui sacerdótes, vidérunt lepram in fronte eius, et festináto expulérunt eum. Sed et ipse pertérritus, accelerávit égredi, eo quod sensísset íllico plagam Dómini.
  "21": Fuit ígitur Ozías rex leprósus usque ad diem mortis suæ, et habitávit in domo separáta plenus lepra, ob quam eiéctus fúerat de domo Dómini. Porro Ióatham fílius eius rexit domum regis, et iudicábat pópulum terræ.
  "22": Réliqua autem sermónum Ozíæ priórum et novissimórum scripsit Isaías fílius Amos prophéta.
  "23": 'Dormivítque Ozías cum pátribus suis, et sepeliérunt eum in agro regálium sepulcrórum, eo quod esset leprósus: regnavítque Ióatham fílius eius pro eo.'
