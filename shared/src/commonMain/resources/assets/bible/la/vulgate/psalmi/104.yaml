bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "104"
verses:
  "1": 'Allelúia. Confitémini Dómino, et invocáte nomen eius: annuntiáte inter gentes ópera eius.'
  "2": 'Cantáte ei, et psállite ei: narráte ómnia mirabília eius.'
  "3": 'Laudámini in nómine sancto eius: lætétur cor quæréntium Dóminum.'
  "4": 'Quǽrite Dóminum, et confirmámini: quǽrite fáciem eius semper.'
  "5": 'Mementóte mirabílium eius, quæ fecit: prodígia eius, et iudícia oris eius.'
  "6": 'Semen Abraham, servi eius: fílii Iacob elécti eius.'
  "7": 'Ipse Dóminus Deus noster: in univérsa terra iudícia eius.'
  "8": 'Memor fuit in sǽculum testaménti sui: verbi, quod mandávit in mille generatiónes:'
  "9": 'quod dispósuit ad Abraham: et iuraménti sui ad Isaac:'
  "10": 'et státuit illud Iacob in præcéptum: et Israel in testaméntum ætérnum:'
  "11": 'dicens: Tibi dabo terram Chánaan, funículum hereditátis vestræ.'
  "12": 'Cum essent número brevi, paucíssimi, et íncolæ eius:'
  "13": 'et pertransiérunt de gente in gentem, et de regno ad pópulum álterum:'
  "14": 'non relíquit hóminem nocére eis: et corrípuit pro eis reges.'
  "15": 'Nolíte tángere christos meos: et in prophétis meis nolíte malignári.'
  "16": 'Et vocávit famem super terram: et omne firmaméntum panis contrívit.'
  "17": 'Misit ante eos virum: in servum venúmdatus est Ioseph.'
  "18": 'Humiliavérunt in compédibus pedes eius: ferrum pertránsiit ánimam eius,'
  "19": 'donec veníret verbum eius. Elóquium Dómini inflammávit eum:'
  "20": 'misit rex, et solvit eum: princeps populórum, et dimísit eum.'
  "21": 'Constítuit eum dóminum domus suæ: et príncipem omnis possessiónis suæ:'
  "22": 'ut erudíret príncipes eius sicut semetípsum: et senes eius prudéntiam docéret.'
  "23": 'Et intrávit Israel in Ægýptum: et Iacob áccola fuit in terra Cham.'
  "24": 'Et auxit pópulum suum veheménter: et firmávit eum super inimícos eius.'
  "25": 'Convértit cor eórum ut odírent pópulum eius: et dolum fácerent in servos eius.'
  "26": 'Misit Móysen servum suum: Aaron, quem elégit ipsum.'
  "27": Pósuit in eis verba signórum suórum, et prodigiórum in terra Cham.
  "28": 'Misit ténebras, et obscurávit: et non exacerbávit sermónes suos.'
  "29": 'Convértit aquas eórum in sánguinem: et occídit pisces eórum.'
  "30": Edidit terra eórum ranas in penetrálibus regum ipsórum.
  "31": 'Dixit, et venit cœnomýia: et cíniphes in ómnibus fínibus eórum.'
  "32": 'Pósuit plúvias eórum grándinem: ignem comburéntem in terra ipsórum.'
  "33": 'Et percússit víneas eórum, et ficúlneas eórum: et contrívit lignum fínium eórum.'
  "34": 'Dixit, et venit locústa, et bruchus cuius non erat númerus:'
  "35": 'et comédit omne fœnum in terra eórum: et comédit omnem fructum terræ eórum.'
  "36": 'Et percússit omne primogénitum in terra eórum: primítias omnis labóris eórum.'
  "37": 'Et edúxit eos cum argénto et auro: et non erat in tríbubus eórum infírmus.'
  "38": 'Lætáta est Ægýptus in profectióne eórum: quia incúbuit timor eórum super eos.'
  "39": Expándit nubem in protectiónem eórum, et ignem ut lucéret eis per noctem.
  "40": 'Petiérunt, et venit cotúrnix: et pane cæli saturávit eos.'
  "41": 'Dirúpit petram, et fluxérunt aquæ: abiérunt in sicco flúmina:'
  "42": quóniam memor fuit verbi sancti sui, quod hábuit ad Abraham púerum suum.
  "43": Et edúxit pópulum suum in exsultatióne, et eléctos suos in lætítia.
  "44": 'Et dedit illis regiónes géntium: et labóres populórum possedérunt:'
  "45": ut custódiant iustificatiónes eius, et legem eius requírant.
