bible: vulgate
lang: la
language: Latina
book: Isaias
chapter: "15"
verses:
  "1": 'Onus Moab. Quia nocte vastáta est Ar Moab, contícuit: quia nocte vastátus est murus Moab, contícuit.'
  "2": 'Ascéndit domus et Dibon ad excélsa in planctum super Nabo, et super Médaba. Moab ululávit: in cunctis capítibus eius calvítium, et omnis barba radétur.'
  "3": 'In tríviis eius accíncti sunt sacco: super tecta eius, et in platéis eius omnis ululátus descéndit in fletum.'
  "4": 'Clamábit Hésebon, et Eleále, usque Iasa audíta est vox eórum: super hoc expedíti Moab ululábunt, ánima eius ululábit sibi.'
  "5": 'Cor meum ad Moab clamábit: vectes eius usque ad Segor, vítulam conternántem: per ascénsum enim Luith flens ascéndet, et in via Orónaim clamórem contritiónis levábunt.'
  "6": Aquæ enim Nemrim desértæ erunt, quia áruit herba, defécit germen, viror omnis intériit.
  "7": 'Secúndum magnitúdinem óperis, et visitátio eórum: ad torréntem sálicum ducent eos.'
  "8": 'Quóniam circuívit clamor términum Moab: usque ad Gallim ululátus eius, et usque ad púteum Elim clamor eius.'
  "9": 'Quia aquæ Dibon replétæ sunt sánguine: ponam enim super Dibon additaménta: his, qui fúgerint de Moab leónem, et relíquiis terræ.'
