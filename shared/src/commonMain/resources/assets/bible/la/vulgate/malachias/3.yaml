bible: vulgate
lang: la
language: Latina
book: Malachias
chapter: "3"
verses:
  "1": 'Ecce ego mitto ángelum meum, et præparábit viam ante fáciem meam: et statim véniet ad templum suum Dominátor, quem vos quǽritis, et ángelus testaménti, quem vos vultis. Ecce venit, dicit Dóminus exercítuum:'
  "2": 'et quis póterit cogitáre diem advéntus eius, et quis stabit ad vidéndum eum? Ipse enim quasi ignis conflans, et quasi herba fullónum:'
  "3": 'et sedébit conflans, et emúndans argéntum: et purgábit fílios Levi, et colábit eos quasi aurum, et quasi argéntum, et erunt Dómino offeréntes sacrifícia in iustítia.'
  "4": Et placébit Dómino sacrifícium Iuda, et Ierúsalem, sicut dies sǽculi, et sicut anni antíqui.
  "5": Et accédam ad vos in iudício, et ero testis velox maléficis, et adúlteris, et periúris, et qui calumniántur mercédem mercenárii, víduas et pupíllos, et ópprimunt peregrínum, nec timuérunt me, dicit Dóminus exercítuum.
  "6": 'Ego enim Dóminus, et non mutor: et vos fílii Iacob non estis consúmpti.'
  "7": 'A diébus enim patrum vestrórum recessístis a legítimis meis, et non custodístis. Revertímini ad me, et revértar ad vos, dicit Dóminus exercítuum. Et dixístis: In quo revertémur?'
  "8": 'Si afflíget homo Deum, quia vos confígitis me? Et dixístis: In quo confígimus te? In décimis, et in primítiis.'
  "9": Et in penúria vos maledícti estis, et me vos confígitis gens tota.
  "10": 'Inférte omnem décimam in hórreum, et sit cibus in domo mea, et probáte me super hoc, dicit Dóminus: si non aperúero vobis cataráctas cæli, et effúdero vobis benedictiónem usque ad abundántiam,'
  "11": 'et increpábo pro vobis devorántem, et non corrúmpet fructum terræ vestræ: nec erit stérilis vínea in agro, dicit Dóminus exercítuum.'
  "12": 'Et beátos vos dicent omnes gentes: éritis enim vos terra desiderábilis, dicit Dóminus exercítuum.'
  "13": Invaluérunt super me verba vestra, dicit Dóminus.
  "14": 'Et dixístis: Quid locúti sumus contra te? Dixístis: Vanus est, qui servit Deo: et quod emoluméntum quia custodívimus præcépta eius, et quia ambulávimus tristes coram Dómino exercítuum?'
  "15": 'Ergo nunc beátos dícimus arrogántes: síquidem ædificáti sunt faciéntes impietátem, et tentavérunt Deum, et salvi facti sunt.'
  "16": 'Tunc locúti sunt timéntes Dóminum, unusquísque cum próximo suo: Et atténdit Dóminus, et audívit: et scriptus est liber monuménti coram eo timéntibus Dóminum, et cogitántibus nomen eius.'
  "17": 'Et erunt mihi, ait Dóminus exercítuum, in die qua ego fácio, in pecúlium: et parcam eis, sicut parcit vir fílio suo serviénti sibi.'
  "18": 'Et convertémini, et vidébitis quid sit inter iustum, et ímpium: et inter serviéntem Deo, et non serviéntem ei.'
