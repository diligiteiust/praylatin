bible: vulgate
lang: la
language: Latina
book: Ionas
chapter: "3"
verses:
  "1": 'Et factum est verbum Dómini ad Ionam secúndo, dicens:'
  "2": 'Surge, et vade in Níniven, civitátem magnam: et prǽdica in ea prædicatiónem, quam ego loquor ad te.'
  "3": 'Et surréxit Ionas, et ábiit in Níniven iuxta verbum Dómini: et Nínive erat cívitas magna itínere trium diérum.'
  "4": 'Et cœpit Ionas introíre in civitátem itínere diéi uníus: et clamávit, et dixit: Adhuc quadragínta dies, et Nínive subvertétur.'
  "5": 'Et credidérunt viri Ninivítæ in Deum: et prædicavérunt ieiúnium, et vestíti sunt saccis, a maióre usque ad minórem.'
  "6": 'Et pervénit verbum ad regem Nínive: et surréxit de sólio suo, et abiécit vestiméntum suum a se, et indútus est sacco, et sedit in cínere.'
  "7": 'Et clamávit, et dixit in Nínive ex ore regis et príncipum eius, dicens: Hómines, et iuménta, et boves, et pécora non gustent quidquam: nec pascántur, et aquam non bibant.'
  "8": 'Et operiántur saccis hómines, et iuménta, et clament ad Dóminum in fortitúdine: et convertátur vir a via sua mala, et ab iniquitáte, quæ est in mánibus eórum.'
  "9": 'Quis scit si convertátur, et ignóscat Deus: et revertátur a furóre iræ suæ, et non períbimus?'
  "10": 'Et vidit Deus ópera eórum, quia convérsi sunt de via sua mala: et misértus est Deus super malítiam, quam locútus fúerat ut fáceret eis, et non fecit.'
