bible: vulgate
lang: la
language: Latina
book: Leviticus
chapter: "3"
verses:
  "1": Quod si hóstia pacificórum fúerit eius oblátio, et de bobus volúerit offérre, marem sive féminam, immaculáta ófferet coram Dómino.
  "2": Ponétque manum super caput víctimæ suæ, quæ immolábitur in intróitu tabernáculi testimónii, fundéntque fílii Aaron sacerdótes sánguinem per altáris circúitum.
  "3": 'Et ófferent de hóstia pacificórum in oblatiónem Dómino, ádipem qui óperit vitália, et quidquid pinguédinis est intrínsecus:'
  "4": duos renes cum ádipe quo tegúntur ília, et retículum iécoris cum renúnculis.
  "5": Adolebúntque ea super altáre in holocáustum, lignis igne suppósito, in oblatiónem suavíssimi odóris Dómino.
  "6": Si vero de óvibus fúerit eius oblátio et pacificórum hóstia, sive másculum obtúlerit, sive féminam, immaculáta erunt.
  "7": Si agnum obtúlerit coram Dómino,
  "8": 'ponet manum suam super caput víctimæ suæ: quæ immolábitur in vestíbulo tabernáculi testimónii: fundéntque fílii Aaron sánguinem eius per circúitum altáris.'
  "9": 'Et ófferent de pacificórum hóstia sacrifícium Dómino: ádipem et caudam totam'
  "10": cum rénibus, et pinguédinem quæ óperit ventrem atque univérsa vitália, et utrúmque renúnculum cum ádipe qui est iuxta ília, reticulúmque iécoris cum renúnculis.
  "11": Et adolébit ea sacérdos super altáre in pábulum ignis et oblatiónis Dómini.
  "12": Si capra fúerit eius oblátio, et obtúlerit eam Dómino,
  "13": 'ponet manum suam super caput eius: immolabítque eam in intróitu tabernáculi testimónii, et fundent fílii Aaron sánguinem eius per altáris circúitum.'
  "14": 'Tolléntque ex ea in pastum ignis domínici, ádipem qui óperit ventrem, et qui tegit univérsa vitália:'
  "15": 'duos renúnculos cum retículo, quod est super eos iuxta ília, et arvínam iécoris cum renúnculis:'
  "16": adolebítque ea super altáre sacérdos in alimóniam ignis, et suavíssimi odóris. Omnis adeps Dómini erit
  "17": 'iure perpétuo in generatiónibus, et cunctis habitáculis vestris: nec sánguinem nec ádipem omníno comedétis.'
