bible: vulgate
lang: la
language: Latina
book: Ieremias
chapter: "9"
verses:
  "1": Quis dabit cápiti meo aquam, et óculis meis fontem lacrymárum? et plorábo die ac nocte interféctos fíliæ pópuli mei.
  "2": Quis dabit me in solitúdine diversórium viatórum, et derelínquam pópulum meum, et recédam ab eis? quia omnes adúlteri sunt, cœtus prævaricatórum.
  "3": 'Et extendérunt linguam suam quasi arcum mendácii et non veritátis: confortáti sunt in terra, quia de malo ad malum egréssi sunt, et me non cognovérunt, dicit Dóminus.'
  "4": 'Unusquísque se a próximo suo custódiat, et in omni fratre suo non hábeat fidúciam: quia omnis frater supplántans supplantábit, et omnis amícus fraudulénter incédet.'
  "5": 'Et vir fratrem suum deridébit, et veritátem non loquéntur: docuérunt enim linguam suam loqui mendácium: ut iníque ágerent laboravérunt.'
  "6": 'Habitátio tua in médio doli: in dolo renuérunt scire me, dicit Dóminus.'
  "7": 'Proptérea hæc dicit Dóminus exercítuum: Ecce ego conflábo, et probábo eos: quid enim áliud fáciam a fácie fíliæ pópuli mei?'
  "8": 'Sagítta vúlnerans lingua eórum, dolum locúta est: in ore suo pacem cum amíco suo lóquitur, et occúlte ponit ei insídias.'
  "9": Numquid super his non visitábo, dicit Dóminus? aut in gente huiúsmodi non ulciscétur ánima mea?
  "10": 'Super montes assúmam fletum ac laméntum, et super speciósa desérti planctum, quóniam incénsa sunt, eo quod non sit vir pertránsiens, et non audiérunt vocem possidéntis: a vólucre cæli usque ad pécora transmigravérunt et recessérunt.'
  "11": 'Et dabo Ierúsalem in acérvos arénæ, et cubília dracónum: et civitátes Iuda dabo in desolatiónem, eo quod non sit habitátor.'
  "12": Quis est vir sápiens qui intélligat hoc, et ad quem verbum oris Dómini fiat, ut annúntiet istud, quare períerit terra, et exústa sit quasi desértum, eo quod non sit qui pertránseat?
  "13": 'Et dixit Dóminus: Quia dereliquérunt legem meam quam dedi eis, et non audiérunt vocem meam, et non ambulavérunt in ea:'
  "14": et abiérunt post pravitátem cordis sui, et post Báalim, quod didicérunt a pátribus suis.
  "15": 'Idcírco hæc dicit Dóminus exercítuum, Deus Israel: Ecce ego cibábo pópulum istum absínthio, et potum dabo eis aquam fellis.'
  "16": 'Et dispérgam eos in géntibus, quas non novérunt ipsi et patres eórum: et mittam post eos gládium, donec consumántur.'
  "17": 'Hæc dicit Dóminus exercítuum, Deus Israel: Contemplámini, et vocáte lamentatríces, et véniant: et ad eas, quæ sapiéntes sunt, míttite, et próperent:'
  "18": 'festínent, et assúmant super nos laméntum: dedúcant óculi nostri lácrymas, et pálpebræ nostræ défluant aquis.'
  "19": 'Quia vox lamentatiónis audíta est de Sion: Quómodo vastáti sumus, et confúsi veheménter? quia derelíquimus terram, quóniam deiécta sunt tabernácula nostra.'
  "20": Audíte ergo mulíeres verbum Dómini, et assúmant aures vestræ sermónem oris eius, et docéte fílias vestras laméntum, et unaquǽque próximam suam planctum.
  "21": 'Quia ascéndit mors per fenéstras nostras: ingréssa est domos nostras, dispérdere párvulos déforis, iúvenes de platéis.'
  "22": 'Lóquere: Hæc dicit Dóminus: Et cadet morticínum hóminis quasi stercus super fáciem regiónis, et quasi fœnum post tergum meténtis, et non est qui cólligat.'
  "23": 'Hæc dicit Dóminus: Non gloriétur sápiens in sapiéntia sua, et non gloriétur fortis in fortitúdine sua, et non gloriétur dives in divítiis suis:'
  "24": 'sed in hoc gloriétur, qui gloriátur, scire et nosse me, quia ego sum Dóminus, qui fácio misericórdiam, et iudícium, et iustítiam in terra: hæc enim placent mihi, ait Dóminus.'
  "25": 'Ecce dies véniunt, dicit Dóminus: et visitábo super omnem, qui circumcísum habet præpútium,'
  "26": 'super Ægýptum, et super Iuda, et super Edom, et super fílios Ammon, et super Moab, et super omnes qui attónsi sunt in comam, habitántes in desérto: quia omnes gentes habent præpútium, omnis autem domus Israel incircumcísi sunt corde.'
