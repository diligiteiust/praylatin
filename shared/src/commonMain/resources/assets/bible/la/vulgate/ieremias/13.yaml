bible: vulgate
lang: la
language: Latina
book: Ieremias
chapter: "13"
verses:
  "1": 'Hæc dicit Dóminus ad me: Vade, et pósside tibi lumbáre líneum, et pones illud super lumbos tuos, et in aquam non ínferes illud.'
  "2": Et possédi lumbáre iuxta verbum Dómini, et pósui circa lumbos meos.
  "3": 'Et factus est sermo Dómini ad me secúndo, dicens:'
  "4": 'Tolle lumbáre, quod possedísti, quod est circa lumbos tuos: et surgens vade ad Euphráten, et abscónde ibi illud in forámine petræ.'
  "5": Et ábii, et abscóndi illud in Euphráte, sicut præcéperat mihi Dóminus.
  "6": 'Et factum est post dies plúrimos, dixit Dóminus ad me: Surge, vade ad Euphráten: et tolle inde lumbáre, quod præcépi tibi ut abscónderes illud ibi.'
  "7": 'Et ábii ad Euphráten, et fodi, et tuli lumbáre de loco, ubi abscónderam illud: et ecce computrúerat lumbáre, ita ut nulli úsui aptum esset.'
  "8": 'Et factum est verbum Dómini ad me, dicens:'
  "9": 'Hæc dicit Dóminus: Sic putréscere fáciam supérbiam Iuda, et supérbiam Ierúsalem multam:'
  "10": 'pópulum istum péssimum, qui nolunt audíre verba mea, et ámbulant in pravitáte cordis sui: abierúntque post deos aliénos ut servírent eis, et adorárent eos: et erunt sicut lumbáre istud, quod nulli úsui aptum est.'
  "11": 'Sicut enim adhǽret lumbáre ad lumbos viri, sic agglutinávi mihi omnem domum Israel, et omnem domum Iuda, dicit Dóminus: ut essent mihi in pópulum, et in nomen, et in laudem, et in glóriam: et non audiérunt.'
  "12": 'Dices ergo ad eos sermónem istum: Hæc dicit Dóminus Deus Israel: Omnis lagúncula implébitur vino. Et dicent ad te: Numquid ignorámus quia omnis lagúncula implébitur vino?'
  "13": 'Et dices ad eos: Hæc dicit Dóminus: Ecce ego implébo omnes habitatóres terræ huius, et reges, qui sedent de stirpe David super thronum eius, et sacerdótes, et prophétas, et omnes habitatóres Ierúsalem, ebrietáte:'
  "14": 'et dispérgam eos virum a fratre suo, et patres et fílios páriter, ait Dóminus: non parcam, et non concédam: neque miserébor, ut non dispérdam eos.'
  "15": Audíte, et áuribus percípite. Nolíte elevári, quia Dóminus locútus est.
  "16": 'Date Dómino Deo vestro glóriam ántequam contenebréscat, et ántequam offéndant pedes vestri ad montes caliginósos: exspectábitis lucem, et ponet eam in umbram mortis, et in calíginem.'
  "17": 'Quod si hoc non audiéritis, in abscóndito plorábit ánima mea a fácie supérbiæ: plorans plorábit, et dedúcet óculus meus lácrymam, quia captus est grex Dómini.'
  "18": 'Dic regi et dominatríci: Humiliámini, sedéte, quóniam descéndit de cápite vestro coróna glóriæ vestræ.'
  "19": 'Civitátes austri clausæ sunt, et non est qui apériat: transláta est omnis Iuda transmigratióne perfécta.'
  "20": 'Leváte óculos vestros et vidéte, qui venítis ab aquilóne: ubi est grex qui datus est tibi, pecus ínclytum tuum?'
  "21": 'Quid dices cum visitáverit te? tu enim docuísti eos advérsum te, et erudísti in caput tuum: numquid non dolóres apprehéndent te, quasi mulíerem parturiéntem?'
  "22": 'Quod si díxeris in corde tuo: Quare venérunt mihi hæc? Propter multitúdinem iniquitátis tuæ reveláta sunt verecundióra tua, pollútæ sunt plantæ tuæ.'
  "23": 'Si mutáre potest Æthiops pellem suam, aut pardus varietátes suas: et vos potéritis benefácere, cum didicéritis malum.'
  "24": Et disseminábo eos quasi stípulam, quæ vento raptátur in desérto.
  "25": Hæc sors tua, parsque mensúræ tuæ a me, dicit Dóminus, quia oblíta es mei, et confísa es in mendácio.
  "26": Unde et ego nudávi fémora tua contra fáciem tuam, et appáruit ignomínia tua,
  "27": 'adultéria tua, et hinnítus tuus, scelus fornicatiónis tuæ: super colles in agro vidi abominatiónes tuas. Væ tibi, Ierúsalem, non mundáberis post me: úsquequo adhuc?'
