bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "34"
verses:
  "1": Ipsi David. Iúdica Dómine nocéntes me, expúgna impugnántes me.
  "2": 'Apprehénde arma et scutum: et exsúrge in adiutórium mihi.'
  "3": 'Effúnde frámeam, et conclúde advérsus eos, qui persequúntur me: dic ánimæ meæ: Salus tua ego sum.'
  "4": 'Confundántur et revereántur quæréntes ánimam meam: avertántur retrórsum et confundántur cogitántes mihi mala.'
  "5": 'Fiant tamquam pulvis ante fáciem venti: et ángelus Dómini coárctans eos.'
  "6": 'Fiat via illórum ténebræ et lúbricum: et ángelus Dómini pérsequens eos.'
  "7": 'Quóniam gratis abscondérunt mihi intéritum láquei sui: supervácue exprobravérunt ánimam meam.'
  "8": 'Véniat illi láqueus, quem ignórat: et cáptio, quam abscóndit, apprehéndat eum: et in láqueum cadat in ipsum.'
  "9": 'Anima autem mea exsultábit in Dómino: et delectábitur super salutári suo.'
  "10": 'Omnia ossa mea dicent: Dómine, quis símilis tibi? erípiens ínopem de manu fortiórum eius: egénum et páuperem a diripiéntibus eum.'
  "11": Surgéntes testes iníqui, quæ ignorábam interrogábant me.
  "12": 'Retribuébant mihi mala pro bonis: sterilitátem ánimæ meæ.'
  "13": 'Ego autem cum mihi molésti essent, induébar cilício. Humiliábam in ieiúnio ánimam meam: et orátio mea in sinu meo convertétur.'
  "14": 'Quasi próximum, et quasi fratrem nostrum, sic complacébam: quasi lugens, et contristátus, sic humiliábar.'
  "15": 'Et advérsum me lætáti sunt, et convenérunt: congregáta sunt super me flagélla, et ignorávi.'
  "16": 'Dissipáti sunt, nec compúncti, tentavérunt me, subsannavérunt me subsannatióne: frenduérunt super me déntibus suis.'
  "17": 'Dómine quando respícies? restítue ánimam meam a malignitáte eórum: a leónibus únicam meam.'
  "18": 'Confitébor tibi in ecclésia magna: in pópulo gravi laudábo te.'
  "19": 'Non supergáudeant mihi qui adversántur mihi iníque: qui odérunt me gratis, et ánnuunt óculis.'
  "20": 'Quóniam mihi quidem pacífice loquebántur: et in iracúndia terræ loquéntes, dolos cogitábant.'
  "21": 'Et dilatavérunt super me os suum: dixérunt: Euge, euge, vidérunt óculi nostri.'
  "22": 'Vidísti Dómine, ne síleas: Dómine ne discédas a me.'
  "23": 'Exsúrge et inténde iudício meo: Deus meus, et Dóminus meus in causam meam.'
  "24": Iúdica me secúndum iustítiam tuam Dómine Deus meus, et non supergáudeant mihi.
  "25": 'Non dicant in córdibus suis: Euge, euge, ánimæ nostræ: nec dicant: Devorávimus eum.'
  "26": 'Erubéscant et revereántur simul, qui gratulántur malis meis: induántur confusióne et reveréntia, qui magna loquúntur super me.'
  "27": 'Exsúltent et læténtur qui volunt iustítiam meam: et dicant semper: Magnificétur Dóminus, qui volunt pacem servi eius.'
  "28": Et lingua mea meditábitur iustítiam tuam, tota die laudem tuam.
