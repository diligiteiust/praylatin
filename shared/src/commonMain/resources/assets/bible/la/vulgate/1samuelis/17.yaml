bible: vulgate
lang: la
language: Latina
book: I Samuelis
chapter: "17"
verses:
  "1": 'Congregántes autem Philísthiim ágmina sua in prœ́lium, convenérunt in Socho Iudæ: et castrametáti sunt inter Socho et Azéca in fínibus Dommim.'
  "2": Porro Saul et fílii Israel congregáti venérunt in Vallem terebínthi, et direxérunt áciem ad pugnándum contra Philísthiim.
  "3": 'Et Philísthiim stabant super montem ex parte hac, et Israel stabat supra montem ex áltera parte: vallísque erat inter eos.'
  "4": 'Et egréssus est vir spúrius de castris Philisthinórum nómine Góliath, de Geth, altitúdinis sex cubitórum et palmi:'
  "5": 'et cassis ǽrea super caput eius, et loríca squamáta induebátur. Porro pondus lorícæ eius, quinque míllia siclórum æris erat:'
  "6": et ócreas ǽreas habébat in crúribus, et clýpeus ǽreus tegébat húmeros eius.
  "7": 'Hastíle autem hastæ eius erat quasi liciatórium texéntium: ipsum autem ferrum hastæ eius sexcéntos siclos habébat ferri: et ármiger eius antecedébat eum.'
  "8": 'Stansque clamábat advérsum phalángas Israel, et dicébat eis: Quare venístis paráti ad prœ́lium? Numquid ego non sum Philisthǽus, et vos servi Saul? Elígite ex vobis virum, et descéndat ad singuláre certámen.'
  "9": 'Si quíverit pugnáre mecum, et percússerit me, érimus vobis servi: si autem ego prævalúero, et percússero eum, vos servi éritis, et serviétis nobis.'
  "10": 'Et aiébat Philisthǽus: Ego exprobrávi agmínibus Israel hódie: Date mihi virum, et íneat mecum singuláre certámen.'
  "11": Audiens autem Saul, et omnes Israelítæ sermónes Philisthǽi huiuscémodi, stupébant, et metuébant nimis.
  "12": David autem erat fílius viri Ephrathǽi, de quo supra dictum est, de Béthlehem Iuda, cui nomen erat Isai, qui habébat octo fílios, et erat vir in diébus Saul senex, et grandǽvus inter viros.
  "13": 'Abiérunt autem tres fílii eius maióres post Saul in prœ́lium: et nómina trium filiórum eius, qui perrexérunt ad bellum, Eliab primogénitus, et secúndus Abínadab, tertiúsque Samma.'
  "14": David autem erat mínimus. Tribus ergo maióribus secútis Saulem,
  "15": ábiit David, et revérsus est a Saul ut pásceret gregem patris sui in Béthlehem.
  "16": Procedébat vero Philisthǽus mane et véspere, et stabat quadragínta diébus.
  "17": 'Dixit autem Isai ad David fílium suum: Accipe frátribus tuis ephi poléntæ, et decem panes istos, et curre in castra ad fratres tuos,'
  "18": 'et decem forméllas cásei has déferes ad tribúnum: et fratres tuos visitábis, si recte agant: et cum quibus ordináti sunt, disce.'
  "19": Saul autem, et illi, et omnes fílii Israel, in Valle terebínthi pugnábant advérsum Philísthiim.
  "20": 'Surréxit ítaque David mane, et commendávit gregem custódi: et onústus ábiit, sicut præcéperat ei Isai. Et venit ad locum Mágala, et ad exércitum, qui egréssus ad pugnam vociferátus erat in certámine.'
  "21": Diréxerat enim áciem Israel, sed et Philísthiim ex advérso fúerant præparáti.
  "22": Derelínquens ergo David vasa, quæ attúlerat sub manu custódis ad sárcinas, cucúrrit ad locum certáminis, et interrogábat si ómnia recte ageréntur erga fratres suos.
  "23": 'Cumque adhuc ille loquerétur eis, appáruit vir ille spúrius ascéndens, Góliath nómine, Philisthǽus de Geth, de castris Philisthinórum: et loquénte eo hæc éadem verba audívit David.'
  "24": Omnes autem Israelítæ, cum vidíssent virum, fugérunt a fácie eius, timéntes eum valde.
  "25": 'Et dixit unus quíspiam de Israel: Num vidístis virum hunc, qui ascéndit? ad exprobrándum enim Israéli ascéndit. Virum ergo, qui percússerit eum, ditábit rex divítiis magnis, et fíliam suam dabit ei, et domum patris eius fáciet absque tribúto in Israel.'
  "26": 'Et ait David ad viros, qui stabant secum, dicens: Quid dábitur viro, qui percússerit Philisthǽum hunc, et túlerit oppróbrium de Israel? quis enim est hic Philisthǽus incircumcísus, qui exprobrávit ácies Dei vivéntis?'
  "27": 'Referébat autem ei pópulus eúmdem sermónem, dicens: Hæc dabúntur viro, qui percússerit eum.'
  "28": 'Quod cum audísset Eliab frater eius maior, loquénte eo cum áliis, irátus est contra David, et ait: Quare venísti, et quare dereliquísti páuculas oves illas in desérto? Ego novi supérbiam tuam, et nequítiam cordis tui: quia ut vidéres prœ́lium, descendísti.'
  "29": 'Et dixit David: Quid feci? numquid non verbum est?'
  "30": 'Et declinávit páululum ab eo ad álium: dixítque eúmdem sermónem. Et respóndit ei pópulus verbum sicut prius.'
  "31": Audíta sunt autem verba, quæ locútus est David, et annuntiáta in conspéctu Saul.
  "32": 'Ad quem cum fuísset addúctus, locútus est ei: Non cóncidat cor cuiúsquam in eo: ego servus tuus vadam, et pugnábo advérsus Philisthǽum.'
  "33": 'Et ait Saul ad David: Non vales resístere Philisthǽo isti, nec pugnáre advérsus eum, quia puer es: hic autem vir bellátor est ab adolescéntia sua.'
  "34": 'Dixítque David ad Saul: Pascébat servus tuus patris sui gregem, et veniébat leo vel ursus, et tollébat aríetem de médio gregis:'
  "35": 'et persequébar eos, et percutiébam, eruebámque de ore eórum: et illi consurgébant advérsum me, et apprehendébam mentum eórum, et suffocábam, interficiebámque eos.'
  "36": 'Nam et leónem, et ursum interféci ego servus tuus: erit ígitur et Philisthǽus hic incircumcísus quasi unus ex eis. Nunc vadam, et áuferam oppróbrium pópuli: quóniam quis est iste Philisthǽus incircumcísus, qui ausus est maledícere exercítui Dei vivéntis?'
  "37": 'Et ait David: Dóminus qui erípuit me de manu leónis, et de manu ursi, ipse me liberábit de manu Philisthǽi huius. Dixit autem Saul ad David: Vade, et Dóminus tecum sit.'
  "38": Et índuit Saul David vestiméntis suis, et impósuit gáleam ǽream super caput eius, et vestívit eum loríca.
  "39": 'Accínctus ergo David gládio eius super vestem suam, cœpit tentáre si armátus posset incédere: non enim habébat consuetúdinem. Dixítque David ad Saul: Non possum sic incédere, quia non usum hábeo. Et depósuit ea,'
  "40": 'et tulit báculum suum, quem semper habébat in mánibus: et elégit sibi quinque limpidíssimos lápides de torrénte, et misit eos in peram pastorálem, quam habébat secum, et fundam manu tulit: et procéssit advérsum Philisthǽum.'
  "41": Ibat autem Philisthǽus incédens, et appropínquans advérsum David, et ármiger eius ante eum.
  "42": Cumque inspexísset Philisthǽus, et vidísset David, despéxit eum. Erat enim adoléscens, rufus, et pulcher aspéctu.
  "43": 'Et dixit Philisthǽus ad David: Numquid ego canis sum, quod tu venis ad me cum báculo? Et maledíxit Philisthǽus David in diis suis:'
  "44": 'dixítque ad David: Veni ad me, et dabo carnes tuas volatílibus cæli et béstiis terræ.'
  "45": 'Dixit autem David ad Philisthǽum: Tu venis ad me cum gládio, et hasta, et clýpeo: ego autem vénio ad te in nómine Dómini exercítuum, Dei ágminum Israel, quibus exprobrásti'
  "46": 'hódie, et dabit te Dóminus in manu mea, et percútiam te, et áuferam caput tuum a te: et dabo cadávera castrórum Philísthiim hódie volatílibus cæli, et béstiis terræ: ut sciat omnis terra quia est Deus in Israel.'
  "47": 'Et nóverit univérsa ecclésia hæc, quia non in gládio, nec in hasta salvat Dóminus: ipsíus enim est bellum, et tradet vos in manus nostras.'
  "48": Cum ergo surrexísset Philisthǽus, et veníret, et appropinquáret contra David, festinávit David, et cucúrrit ad pugnam ex advérso Philisthǽi.
  "49": 'Et misit manum suam in peram, tulítque unum lápidem, et funda iecit, et circumdúcens percússit Philisthǽum in fronte: et infíxus est lapis in fronte eius, et cécidit in fáciem suam super terram.'
  "50": Prævaluítque David advérsum Philisthǽum in funda et lápide, percussúmque Philisthǽum interfécit. Cumque gládium non habéret in manu David,
  "51": 'cucúrrit, et stetit super Philisthǽum, et tulit gládium eius, et edúxit eum de vagína sua: et interfécit eum, præcidítque caput eius. Vidéntes autem Philísthiim, quod mórtuus esset fortíssimus eórum, fugérunt.'
  "52": 'Et consurgéntes viri Israel et Iuda vociferáti sunt, et persecúti sunt Philisthǽos usque dum venírent in vallem, et usque ad portas Accaron: ceciderúntque vulneráti de Philísthiim in via Sáraim, et usque ad Geth, et usque ad Accaron.'
  "53": Et reverténtes fílii Israel postquam persecúti fúerant Philisthǽos, invasérunt castra eórum.
  "54": 'Assúmens autem David caput Philisthǽi, áttulit illud in Ierúsalem: arma vero eius pósuit in tabernáculo suo.'
  "55": 'Eo autem témpore, quo víderat Saul David egrediéntem contra Philisthǽum, ait ad Abner príncipem milítiæ: De qua stirpe descéndit hic adoléscens, Abner? Dixítque Abner: Vivit ánima tua, rex, si novi.'
  "56": 'Et ait rex: Intérroga tu, cuius fílius sit iste puer.'
  "57": Cumque regréssus esset David, percússo Philisthǽo, tulit eum Abner, et introdúxit coram Saule, caput Philisthǽi habéntem in manu.
  "58": 'Et ait ad eum Saul: De qua progénie es o adoléscens? Dixítque David: Fílius servi tui Isai Bethlehemítæ ego sum.'
