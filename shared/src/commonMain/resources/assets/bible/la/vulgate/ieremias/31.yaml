bible: vulgate
lang: la
language: Latina
book: Ieremias
chapter: "31"
verses:
  "1": In témpore illo, dicit Dóminus, ero Deus univérsis cognatiónibus Israel, et ipsi erunt mihi in pópulum.
  "2": 'Hæc dicit Dóminus: Invénit grátiam in desérto pópulus, qui remánserat a gládio: vadet ad réquiem suam Israel.'
  "3": Longe Dóminus appáruit mihi. Et in caritáte perpétua diléxi te, ídeo attráxi te, míserans.
  "4": 'Rursúmque ædificábo te, et ædificáberis virgo Israel: adhuc ornáberis týmpanis tuis, et egrediéris in choro ludéntium.'
  "5": 'Adhuc plantábis víneas in móntibus Samaríæ: plantábunt plantántes, et donec tempus véniat, non vindemiábunt:'
  "6": 'quia erit dies, in qua clamábunt custódes in monte Ephraim: Súrgite, et ascendámus in Sion ad Dóminum Deum nostrum.'
  "7": 'Quia hæc dicit Dóminus: Exsultáte in lætítia Iacob, et hinníte contra caput géntium: personáte, et cánite, et dícite: Salva Dómine pópulum tuum relíquias Israel.'
  "8": 'Ecce ego addúcam eos de terra aquilónis, et congregábo eos ab extrémis terræ: inter quos erunt cæcus et claudus, prægnans et páriens simul, cœtus magnus reverténtium huc.'
  "9": 'In fletu vénient, et in misericórdia redúcam eos: et addúcam eos per torréntes aquárum in via recta, et non impíngent in ea, quia factus sum Israéli pater, et Ephraim primogénitus meus est.'
  "10": 'Audíte verbum Dómini gentes, et annuntiáte in ínsulis, quæ procul sunt, et dícite: Qui dispérsit Israel, congregábit eum: et custódiet eum sicut pastor gregem suum.'
  "11": Redémit enim Dóminus Iacob, et liberávit eum de manu potentióris.
  "12": 'Et vénient, et laudábunt in monte Sion: et cónfluent ad bona Dómini, super fruménto, et vino, et óleo, et fœtu pécorum et armentórum: erítque ánima eórum quasi hortus irríguus, et ultra non esúrient.'
  "13": 'Tunc lætábitur virgo in choro, iúvenes et senes simul: et convértam luctum eórum in gáudium, et consolábor eos, et lætificábo a dolóre suo.'
  "14": 'Et inebriábo ánimam sacerdótum pinguédine: et pópulus meus bonis meis adimplébitur, ait Dóminus.'
  "15": 'Hæc dicit Dóminus: Vox in excélso audíta est lamentatiónis, luctus, et fletus Rachel plorántis fílios suos, et noléntis consolári super eis, quia non sunt.'
  "16": 'Hæc dicit Dóminus: Quiéscat vox tua a plorátu, et óculi tui a lácrymis, quia est merces óperi tuo, ait Dóminus: et reverténtur de terra inimíci.'
  "17": 'Et est spes novíssimis tuis, ait Dóminus: et reverténtur fílii ad términos suos.'
  "18": 'Audiens audívi Ephraim transmigrántem: Castigásti me, et erudítus sum, quasi iuvénculus indómitus: convérte me, et convértar: quia tu Dóminus Deus meus.'
  "19": 'Postquam enim convertísti me, egi pœniténtiam: et postquam ostendísti mihi, percússi femur meum. Confúsus sum, et erúbui, quóniam sustínui oppróbrium adolescéntiæ meæ.'
  "20": 'Si fílius honorábilis mihi Ephraim, si puer delicátus: quia ex quo locútus sum de eo, adhuc recordábor eius. Idcírco conturbáta sunt víscera mea super eum: míserans miserébor eius, ait Dóminus.'
  "21": 'Státue tibi spéculam, pone tibi amaritúdines: dírige cor tuum in viam rectam, in qua ambulásti: revértere virgo Israel, revértere ad civitátes tuas istas.'
  "22": 'Usquequo delíciis dissolvéris fília vaga? quia creávit Dóminus novum super terram: fémina circúmdabit virum.'
  "23": 'Hæc dicit Dóminus exercítuum, Deus Israel: Adhuc dicent verbum istud in terra Iuda et in úrbibus eius, cum convértero captivitátem eórum: Benedícat tibi Dóminus pulchritúdo iustítiæ, mons sanctus:'
  "24": et habitábunt in eo Iudas, et omnes civitátes eius simul, agrícolæ et minántes greges.
  "25": Quia inebriávi ánimam lassam, et omnem ánimam esuriéntem saturávi.
  "26": 'Ideo quasi de somno suscitátus sum: et vidi, et somnus meus dulcis mihi.'
  "27": Ecce dies véniunt, dicit Dóminus, et seminábo domum Israel et domum Iuda sémine hóminum et sémine iumentórum.
  "28": 'Et sicut vigilávi super eos ut evéllerem, et demolírer, et dissipárem, et dispérderem, et afflígerem: sic vigilábo super eos ut ædíficem, et plantem, ait Dóminus.'
  "29": 'In diébus illis non dicent ultra: Patres comedérunt uvam acérbam, et dentes filiórum obstupuérunt.'
  "30": 'Sed unusquísque in iniquitáte sua moriétur: omnis homo, qui coméderit uvam acérbam, obstupéscent dentes eius.'
  "31": 'Ecce dies vénient, dicit Dóminus, et fériam dómui Israel et dómui Iuda fœdus novum:'
  "32": 'non secúndum pactum, quod pépigi cum pátribus eórum in die, qua apprehéndi manum eórum ut edúcerem eos de terra Ægýpti: pactum, quod írritum fecérunt, et ego dominátus sum eórum, dicit Dóminus.'
  "33": 'Sed hoc erit pactum, quod fériam cum domo Israel, post dies illos, dicit Dóminus: dabo legem meam in viscéribus eórum, et in corde eórum scribam eam, et ero eis in Deum, et ipsi erunt mihi in pópulum.'
  "34": 'Et non docébit ultra vir próximum suum, et vir fratrem suum, dicens: Cognósce Dóminum: omnes enim cognóscent me a mínimo eórum usque ad máximum, ait Dóminus: quia propitiábor iniquitáti eórum, et peccáti eórum non memorábor ámplius.'
  "35": 'Hæc dicit Dóminus, qui dat solem in lúmine diéi, órdinem lunæ et stellárum in lúmine noctis: qui turbat mare, et sonant fluctus eius: Dóminus exercítuum nomen illi.'
  "36": Si defécerint leges istæ coram me, dicit Dóminus, tunc et semen Israel defíciet, ut non sit gens coram me cunctis diébus.
  "37": 'Hæc dicit Dóminus: Si mensurári potúerint cæli sursum, et investigári fundaménta terræ deórsum: et ego abíciam univérsum semen Israel, propter ómnia quæ fecérunt, dicit Dóminus.'
  "38": 'Ecce dies véniunt, dicit Dóminus: et ædificábitur cívitas Dómino, a turre Hanáneel usque ad portam ánguli.'
  "39": Et exíbit ultra norma mensúræ in conspéctu eius super collem Gareb, et circuíbit Góatha,
  "40": 'et omnem vallem cadáverum, et cíneris, et univérsam regiónem mortis usque ad torréntem Cedron, et usque ad ángulum portæ equórum orientális, Sanctum Dómini: non evellétur, et non destruétur ultra in perpétuum.'
