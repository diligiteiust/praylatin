bible: vulgate
lang: la
language: Latina
book: Actus Apostolorum
chapter: "9"
verses:
  "1": Saulus autem adhuc spirans minárum et cædis in discípulos Dómini, accéssit ad príncipem sacerdótum,
  "2": 'et pétiit ab eo epístolas in Damáscum ad synagógas: ut si quos invenísset huius viæ viros, ac mulíeres, vinctos perdúceret in Ierúsalem.'
  "3": 'Et cum iter fáceret, cóntigit ut appropinquáret Damásco: et súbito circumfúlsit eum lux de cælo.'
  "4": 'Et cadens in terram audívit vocem dicéntem sibi: Saule, Saule, quid me perséqueris?'
  "5": 'Qui dixit: Quis es Dómine? Et ille: Ego sum Iesus, quem tu perséqueris: durum est tibi contra stímulum calcitráre.'
  "6": 'Et tremens, ac stupens dixit: Dómine, quid me vis fácere? Et Dóminus ad eum: Surge, et ingrédere civitátem, et ibi dicétur tibi quid te opórteat fácere.'
  "7": Viri autem illi, qui comitabántur cum eo, stabant stupefácti, audiéntes quidem vocem, néminem autem vidéntes.
  "8": Surréxit autem Saulus de terra, apertísque óculis nihil vidébat. Ad manus autem illum trahéntes, introduxérunt Damáscum.
  "9": Et erat ibi tribus diébus non videns, et non manducávit, neque bibit.
  "10": 'Erat autem quidam discípulus Damásci, nómine Ananías: et dixit ad illum in visu Dóminus: Ananía. At ille ait: Ecce ego, Dómine.'
  "11": 'Et Dóminus ad eum: Surge, et vade in vicum, qui vocátur rectus: et quære in domo Iudæ Saulum nómine Tarsénsem: ecce enim orat.'
  "12": (Et vidit virum Ananíam nómine, introeúntem, et imponéntem sibi manus ut visum recípiat.)
  "13": 'Respóndit autem Ananías: Dómine, audívi a multis de viro hoc, quanta mala fécerit sanctis tuis in Ierúsalem:'
  "14": et hic habet potestátem a princípibus sacerdótum alligándi omnes, qui ínvocant nomen tuum.
  "15": 'Dixit autem ad eum Dóminus: Vade, quóniam vas electiónis est mihi iste, ut portet nomen meum coram géntibus, et régibus, et fíliis Israel.'
  "16": Ego enim osténdam illi quanta opórteat eum pro nómine meo pati.
  "17": 'Et ábiit Ananías, et introívit in domum: et impónens ei manus, dixit: Saule frater, Dóminus misit me Iesus, qui appáruit tibi in via, qua veniébas, ut vídeas, et impleáris Spíritu sancto.'
  "18": 'Et conféstim cecidérunt ab óculis eius tamquam squamæ, et visum recépit: et surgens baptizátus est.'
  "19": Et cum accepísset cibum, confortátus est. Fuit autem cum discípulis, qui erant Damásci per dies áliquot.
  "20": Et contínuo in synagógis prædicábat Iesum, quóniam hic est Fílius Dei.
  "21": 'Stupébant autem omnes, qui audiébant, et dicébant: Nonne hic est, qui expugnábat in Ierúsalem eos, qui invocábant nomen istud: et huc ad hoc venit ut vinctos illos dúceret ad príncipes sacerdótum?'
  "22": Saulus autem multo magis convalescébat, et confundébat Iudǽos, qui habitábant Damásci, affírmans quóniam hic est Christus.
  "23": Cum autem impleréntur dies multi, consílium fecérunt in unum Iudǽi ut eum interfícerent.
  "24": Notæ autem factæ sunt Saulo insídiæ eórum. Custodiébant autem et portas die ac nocte, ut eum interfícerent.
  "25": Accipiéntes autem eum discípuli nocte, per murum dimisérunt eum, submitténtes in sporta.
  "26": Cum autem venísset in Ierúsalem, tentábat se iúngere discípulis, et omnes timébant eum, non credéntes quod esset discípulus.
  "27": 'Bárnabas autem apprehénsum illum duxit ad Apóstolos: et narrávit illis quómodo in via vidísset Dóminum, et quia locútus est ei, et quómodo in Damásco fiduciáliter égerit in nómine Iesu.'
  "28": Et erat cum illis intrans et éxiens in Ierúsalem, et fiduciáliter agens in nómine Dómini.
  "29": 'Loquebátur quoque géntibus, et disputábat cum Græcis: illi autem quærébant occídere eum.'
  "30": Quod cum cognovíssent fratres, deduxérunt eum Cæsaréam, et dimisérunt Tarsum.
  "31": Ecclésia quidem per totam Iudǽam, et Galilǽam, et Samaríam habébat pacem, et ædificabátur ámbulans in timóre Dómini, et consolatióne sancti Spíritus replebátur.
  "32": Factum est autem, ut Petrus dum pertransíret univérsos, deveníret ad sanctos, qui habitábant Lyddæ.
  "33": Invénit autem ibi hóminem quemdam, nómine Ænéam, ab annis octo iacéntem in grabáto, qui erat paralýticus.
  "34": 'Et ait illi Petrus: Ænéa, sanat te Dóminus Iesus Christus: surge, et sterne tibi. Et contínuo surréxit.'
  "35": 'Et vidérunt eum omnes, qui habitábant Lyddæ, et Sarónæ: qui convérsi sunt ad Dóminum.'
  "36": In Ioppe autem fuit quædam discípula, nómine Tábitha, quæ interpretáta dícitur Dorcas. Hæc erat plena opéribus bonis, et eleemósynis, quas faciébat.
  "37": Factum est autem in diébus illis ut infirmáta morerétur. Quam cum lavíssent, posuérunt eam in cœnáculo.
  "38": 'Cum autem prope esset Lydda ad Ioppen, discípuli audiéntes quia Petrus esset in ea, misérunt duos viros ad eum, rogántes: Ne pigritéris veníre ad nos.'
  "39": 'Exsúrgens autem Petrus, venit cum illis. Et cum advenísset, duxérunt illum in cœnáculum: et circumstetérunt illum omnes víduæ flentes, et ostendéntes ei túnicas, et vestes, quas faciébat illis Dorcas.'
  "40": 'Eiéctis autem ómnibus foras, Petrus ponens génua orávit: et convérsus ad corpus, dixit: Tábitha, surge. At illa apéruit óculos suos: et viso Petro, resédit.'
  "41": Dans autem illi manum, eréxit eam. Et cum vocásset sanctos, et víduas, assignávit eam vivam.
  "42": 'Notum autem factum est per univérsam Ioppen: et credidérunt multi in Dómino.'
  "43": Factum est autem ut dies multos morarétur in Ioppe, apud Simónem quemdam coriárium.
