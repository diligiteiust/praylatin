bible: vulgate
lang: la
language: Latina
book: Ezechiel
chapter: "39"
verses:
  "1": 'Tu autem fili hóminis vaticináre advérsum Gog, et dices: Hæc dicit Dóminus Deus: Ecce ego super te Gog príncipem cápitis Mosoch et Thubal:'
  "2": 'et circúmagam te, et edúcam te, et ascéndere te fáciam de latéribus aquilónis: et addúcam te super montes Israel.'
  "3": Et percútiam arcum tuum in manu sinístra tua, et sagíttas tuas de manu déxtera tua deíciam.
  "4": 'Super montes Israel cades tu, et ómnia ágmina tua, et pópuli tui, qui sunt tecum: feris, ávibus, omníque volátili, et béstiis terræ dedi te ad devorándum.'
  "5": 'Super fáciem agri cades: quia ego locútus sum, ait Dóminus Deus.'
  "6": 'Et immíttam ignem in Magog, et in his, qui hábitant in ínsulis confidénter: et scient quia ego Dóminus.'
  "7": 'Et nomen sanctum meum notum fáciam in médio pópuli mei Israel, et non pólluam nomen sanctum meum ámplius: et scient gentes quia ego Dóminus sanctus Israel.'
  "8": 'Ecce venit, et factum est, ait Dóminus Deus: hæc est dies, de qua locútus sum.'
  "9": 'Et egrediéntur habitatóres de civitátibus Israel, et succéndent et combúrent arma, clýpeum, et hastas, arcum, et sagíttas, et báculos mánuum, et contos: et succéndent ea igni septem annis.'
  "10": 'Et non portábunt ligna de regiónibus, neque succídent de sáltibus: quóniam arma succéndent igni, et deprædabúntur eos, quibus prædæ fúerant, et dirípient vastatóres suos, ait Dóminus Deus.'
  "11": 'Et erit in die illa: dabo Gog locum nominátum sepúlcrum in Israel: vallem viatórum ad oriéntem maris, quæ obstupéscere fáciet prætereúntes: et sepélient ibi Gog, et omnem multitúdinem eius, et vocábitur vallis multitúdinis Gog.'
  "12": Et sepélient eos domus Israel, ut mundent terram septem ménsibus.
  "13": 'Sepéliet autem eum omnis pópulus terræ: et erit eis nomináta dies, in qua glorificátus sum, ait Dóminus Deus.'
  "14": 'Et viros iúgiter constítuent lustrántes terram, qui sepéliant, et requírant eos, qui remánserant super fáciem terræ, ut emúndent eam: post menses autem septem quǽrere incípient.'
  "15": 'Et circuíbunt peragrántes terram: cumque víderint os hóminis, státuent iuxta illud títulum, donec sepéliant illud pollinctóres in valle multitúdinis Gog.'
  "16": Nomen autem civitátis Amona, et mundábunt terram.
  "17": 'Tu ergo fili hóminis, hæc dicit Dóminus Deus: Dic omni vólucri, et univérsis ávibus, cunctísque béstiis agri: Conveníte, properáte, concúrrite úndique ad víctimam meam, quam ego ímmolo vobis, víctimam grandem super montes Israel: ut comedátis carnem, et bibátis sánguinem.'
  "18": 'Carnes fórtium comedétis, et sánguinem príncipum terræ bibétis: aríetum, et agnórum, et hircórum, taurorúmque, et altílium, et pínguium ómnium.'
  "19": 'Et comedétis ádipem in saturitátem, et bibétis sánguinem in ebrietátem, de víctima, quam ego immolábo vobis:'
  "20": et saturabímini super mensam meam de equo, et équite forti, et de univérsis viris bellatóribus, ait Dóminus Deus.
  "21": 'Et ponam glóriam meam in géntibus: et vidébunt omnes gentes iudícium meum, quod fécerim, et manum meam, quam posúerim super eos.'
  "22": Et scient domus Israel quia ego Dóminus Deus eórum, a die illa et deínceps.
  "23": 'Et scient gentes quóniam in iniquitáte sua capta sit domus Israel, eo quod derelíquerint me, et abscónderim fáciem meam ab eis: et tradíderim eos in manus hóstium, et cecíderint in gládio univérsi.'
  "24": Iuxta immundítiam eórum, et scelus feci eis, et abscóndi fáciem meam ab illis.
  "25": 'Proptérea hæc dicit Dóminus Deus: Nunc redúcam captivitátem Iacob, et miserébor omnis domus Israel, et assúmam zelum pro nómine sancto meo.'
  "26": 'Et portábunt confusiónem suam, et omnem prævaricatiónem, qua prævaricáti sunt in me, cum habitáverint in terra sua confidénter, néminem formidántes:'
  "27": et redúxero eos de pópulis, et congregávero de terris inimicórum suórum, et sanctificátus fúero in eis, in óculis géntium plurimárum.
  "28": Et scient quia ego Dóminus Deus eórum, eo quod transtúlerim eos in natiónes, et congregáverim eos super terram suam, et non derelíquerim quemquam ex eis ibi.
  "29": Et non abscóndam ultra fáciem meam ab eis, eo quod effúderim spíritum meum super omnem domum Israel, ait Dóminus Deus.
