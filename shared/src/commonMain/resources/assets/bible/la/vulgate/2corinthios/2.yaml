bible: vulgate
lang: la
language: Latina
book: ad Corinthios II
chapter: "2"
verses:
  "1": Státui autem hoc ipsum apud me, ne íterum in tristítia venírem ad vos.
  "2": 'Si enim ego contrísto vos: et quis est, qui me lætíficet, nisi qui contristátur ex me?'
  "3": 'Et hoc ipsum scripsi vobis, ut non cum vénero, tristítiam super tristítiam hábeam, de quibus oportúerat me gaudére: confídens in ómnibus vobis, quia meum gáudium, ómnium vestrum est.'
  "4": 'Nam ex multa tribulatióne, et angústia cordis scripsi vobis per multas lácrymas: non ut contristémini, sed ut sciátis, quam caritátem hábeam abundántius in vobis.'
  "5": 'Si quis autem contristávit, non me contristávit: sed ex parte, ut non ónerem omnes vos.'
  "6": 'Súfficit illi, qui eiúsmodi est, obiurgátio hæc, quæ fit a plúribus:'
  "7": ita ut e contrário magis donétis, et consolémini, ne forte abundantióri tristítia absorbeátur qui eiúsmodi est.
  "8": Propter quod óbsecro vos, ut confirmétis in illum caritátem.
  "9": Ideo enim et scripsi, ut cognóscam experiméntum vestrum, an in ómnibus obediéntes sitis.
  "10": 'Cui autem áliquid donástis, et ego: nam et ego quod donávi, si quid donávi, propter vos in persóna Christi,'
  "11": 'ut non circumveniámur a Sátana: non enim ignorámus cogitatiónes eius.'
  "12": Cum veníssem autem Tróadem propter Evangélium Christi, et óstium mihi apértum esset in Dómino,
  "13": non hábui réquiem spirítui meo, eo quod non invénerim Titum fratrem meum, sed valefáciens eis, proféctus sum in Macedóniam.
  "14": 'Deo autem grátias, qui semper triúmphat nos in Christo Iesu, et odórem notítiæ suæ maniféstat per nos in omni loco:'
  "15": 'quia Christi bonus odor sumus Deo in iis, qui salvi fiunt, et in iis, qui péreunt:'
  "16": 'áliis quidem odor mortis in mortem: áliis autem odor vitæ in vitam. Et ad hæc quis tam idóneus?'
  "17": Non enim sumus sicut plúrimi, adulterántes verbum Dei, sed ex sinceritáte, sed sicut ex Deo, coram Deo, in Christo lóquimur.
