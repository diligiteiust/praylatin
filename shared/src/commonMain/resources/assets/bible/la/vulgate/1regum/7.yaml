bible: vulgate
lang: la
language: Latina
book: I Regum
chapter: "7"
verses:
  "1": Domum autem suam ædificávit Sálomon trédecim annis, et ad perféctum usque perdúxit.
  "2": 'Ædificávit quoque domum saltus Líbani centum cubitórum longitúdinis, et quinquagínta cubitórum latitúdinis, et trigínta cubitórum altitúdinis: et quátuor deambulácra inter colúmnas cédrinas: ligna quippe cédrina excíderat in colúmnas.'
  "3": Et tabulátis cédrinis vestívit totam cámeram, quæ quadragínta quinque colúmnis sustentabátur. Unus autem ordo habébat colúmnas quíndecim
  "4": contra se ínvicem pósitas,
  "5": et e regióne se respiciéntes, æquáli spátio inter colúmnas, et super colúmnas quadranguláta ligna in cunctis æquália.
  "6": 'Et pórticum columnárum fecit quinquagínta cubitórum longitúdinis, et trigínta cubitórum latitúdinis: et álteram pórticum in fácie maióris pórticus: et colúmnas, et epistýlia super colúmnas.'
  "7": 'Pórticum quoque sólii, in qua tribúnal est, fecit: et texit lignis cédrinis a paviménto usque ad summitátem.'
  "8": Et domúncula, in qua sedebátur ad iudicándum, erat in média pórticu símili ópere. Domum quoque fecit fíliæ Pharaónis (quam uxórem dúxerat Sálomon) tali ópere, quali et hanc pórticum.
  "9": 'Omnia lapídibus pretiósis, qui ad normam quamdam atque mensúram tam intrínsecus quam extrínsecus serráti erant: a fundaménto usque ad summitátem paríetum, et extrínsecus usque ad átrium maius.'
  "10": Fundaménta autem de lapídibus pretiósis, lapídibus magnis decem sive octo cubitórum.
  "11": Et désuper lápides pretiósi æquális mensúræ secti erant, similitérque de cedro.
  "12": 'Et átrium maius rotúndum trium órdinum de lapídibus sectis, et uníus órdinis de doláta cedro: necnon et in átrio domus Dómini interióri, et in pórticu domus.'
  "13": Misit quoque rex Sálomon, et tulit Hiram de Tyro,
  "14": fílium mulíeris víduæ de tribu Néphthali, patre Týrio, artíficem ærárium, et plenum sapiéntia, et intelligéntia, et doctrína, ad faciéndum omne opus ex ære. Qui cum venísset ad regem Salomónem, fecit omne opus eius.
  "15": 'Et finxit duas colúmnas ǽreas, decem et octo cubitórum altitúdinis colúmnam unam: et línea duódecim cubitórum ambiébat colúmnam utrámque.'
  "16": 'Duo quoque capitélla fecit, quæ poneréntur super cápita columnárum, fusília ex ære: quinque cubitórum altitúdinis capitéllum unum, et quinque cubitórum altitúdinis capitéllum álterum:'
  "17": 'et quasi in modum retis, et catenárum sibi ínvicem miro ópere contextárum. Utrúmque capitéllum columnárum fúsile erat: septéna vérsuum retiácula in capitéllo uno, et septéna retiácula in capitéllo áltero.'
  "18": 'Et perfécit colúmnas, et duos órdines per circúitum retiaculórum singulórum, ut tégerent capitélla, quæ erant super summitátem, malogranatórum: eódem modo fecit et capitéllo secúndo.'
  "19": Capitélla autem, quæ erant super cápita columnárum, quasi ópere lílii fabricáta erant in pórticu quátuor cubitórum.
  "20": 'Et rursum ália capitélla in summitáte columnárum désuper iuxta mensúram colúmnæ contra retiácula: malogranatórum autem ducénti órdines erant in circúitu capitélli secúndi.'
  "21": 'Et státuit duas colúmnas in pórticu templi: cumque statuísset colúmnam déxteram, vocávit eam nómine Iachin: simíliter eréxit colúmnam secúndam, et vocávit nomen eius Booz.'
  "22": 'Et super cápita columnárum opus in modum lílii pósuit: perfectúmque est opus columnárum.'
  "23": 'Fecit quoque mare fúsile decem cubitórum a lábio usque ad lábium, rotúndum in circúitu: quinque cubitórum altitúdo eius, et restícula trigínta cubitórum cingébat illud per circúitum.'
  "24": 'Et sculptúra subter lábium circuíbat illud decem cúbitis ámbiens mare: duo órdines sculpturárum striatárum erant fúsiles.'
  "25": 'Et stabat super duódecim boves, e quibus tres respiciébant ad aquilónem, et tres ad occidéntem, et tres ad merídiem, et tres ad oriéntem: et mare super eos désuper erat: quorum posterióra univérsa intrínsecus latitábant.'
  "26": 'Grossitúdo autem lutéris, trium unciárum erat: labiúmque eius quasi lábium cálicis, et fólium repándi lílii: duo míllia batos capiébat.'
  "27": Et fecit decem bases ǽneas, quátuor cubitórum longitúdinis bases síngulas, et quátuor cubitórum latitúdinis, et trium cubitórum altitúdinis.
  "28": 'Et ipsum opus básium, interrásile erat: et sculptúræ inter iunctúras.'
  "29": 'Et inter corónulas et plectas, leónes et boves et chérubim, et in iunctúris simíliter désuper: et subter leónes et boves, quasi lora ex ære dependéntia.'
  "30": 'Et quátuor rotæ per bases síngulas, et axes ǽrei: et per quátuor partes quasi huméruli subter lutérem fúsiles, contra se ínvicem respectántes.'
  "31": 'Os quoque lutéris intrínsecus erat in cápitis summitáte: et quod forínsecus apparébat, uníus cúbiti erat totum rotúndum, paritérque habébat unum cúbitum et dimídium: in ángulis autem columnárum váriæ cælatúræ erant: et média intercolúmnia, quadráta non rotúnda.'
  "32": 'Quátuor quoque rotæ, quæ per quátuor ángulos basis erant, cohærébant sibi subter basim: una rota habébat altitúdinis cúbitum et semis.'
  "33": 'Tales autem rotæ erant quales solent in curru fíeri: et axes eárum, et rádii, et canthi, et modíoli, ómnia fusília.'
  "34": Nam et huméruli illi quátuor per síngulos ángulos basis uníus, ex ipsa basi fúsiles et coniúncti erant.
  "35": In summitáte autem basis erat quædam rotúnditas dimídii cúbiti, ita fabrefácta ut luter désuper posset impóni, habens cælatúras suas, variásque sculptúras ex semetípsa.
  "36": Sculpsit quoque in tabulátis illis, quæ erant ex ære, et in ángulis, chérubim, et leónes, et palmas, quasi in similitúdinem hóminis stantis, ut non cæláta, sed appósita per circúitum videréntur.
  "37": In hunc modum fecit decem bases, fusúra una, et mensúra, sculpturáque consímili.
  "38": 'Fecit quoque decem lutéres ǽneos: quadragínta batos capiébat luter unus, erátque quátuor cubitórum: síngulos quoque lutéres per síngulas, id est, decem bases, pósuit.'
  "39": 'Et constítuit decem bases, quinque ad déxteram partem templi, et quinque ad sinístram: mare autem pósuit ad déxteram partem templi contra oriéntem ad merídiem.'
  "40": Fecit ergo Hiram lebétes, et scutras, et hámulas, et perfécit omne opus regis Salomónis in templo Dómini.
  "41": 'Colúmnas duas, et funículos capitellórum super capitélla columnárum duos: et retiácula duo, ut operírent duos funículos, qui erant super cápita columnárum.'
  "42": 'Et malogranáta quadringénta in duóbus retiáculis: duos versus malogranatórum in retiáculis síngulis, ad operiéndos funículos capitellórum, qui erant super cápita columnárum.'
  "43": Et bases decem, et lutéres decem super bases.
  "44": Et mare unum, et boves duódecim subter mare.
  "45": 'Et lebétes, et scutras, et hámulas: ómnia vasa, quæ fecit Hiram regi Salomóni in domo Dómini, de aurichálco erant.'
  "46": In campéstri regióne Iordánis fudit ea rex in argillósa terra, inter Sochoth et Sarthan.
  "47": 'Et pósuit Sálomon ómnia vasa: propter multitúdinem autem nímiam non erat pondus æris.'
  "48": 'Fecítque Sálomon ómnia vasa in domo Dómini: altáre áureum, et mensam super quam poneréntur panes propositiónis, áuream:'
  "49": 'et candelábra áurea, quinque ad déxteram, et quinque ad sinístram contra oráculum, ex auro puro: et quasi lílii flores, et lucérnas désuper áureas: et fórcipes áureos,'
  "50": 'et hýdrias, et fuscínulas, et phíalas, et mortaríola, et thuríbula, de auro puríssimo: et cárdines ostiórum domus interióris Sancti sanctórum, et ostiórum domus templi, ex auro erant.'
  "51": Et perfécit omne opus quod faciébat Sálomon in domo Dómini, et íntulit quæ sanctificáverat David pater suus, argéntum, et aurum, et vasa, reposuítque in thesáuris domus Dómini.
