bible: vulgate
lang: la
language: Latina
book: II Paralipomenon
chapter: "14"
verses:
  "1": 'Dormívit autem Abía cum pátribus suis, et sepeliérunt eum in civitáte David: regnavítque Asa fílius eius pro eo, in cuius diébus quiévit terra annis decem.'
  "2": Fecit autem Asa quod bonum et plácitum erat in conspéctu Dei sui, et subvértit altária peregríni cultus, et excélsa.
  "3": 'Et confrégit státuas, lucósque succídit:'
  "4": 'et præcépit Iudæ ut quǽreret Dóminum Deum patrum suórum, et fáceret legem, et univérsa mandáta:'
  "5": et ábstulit de cunctis úrbibus Iuda aras, et fana, et regnávit in pace.
  "6": Ædificávit quoque urbes munítas in Iuda, quia quiétus erat, et nulla tempóribus eius bella surréxerant, pacem Dómino largiénte.
  "7": 'Dixit autem Iudæ: Ædificémus civitátes istas, et vallémus muris, et roborémus túrribus, et portis, et seris, donec a bellis quiéta sunt ómnia, eo quod quæsiérimus Dóminum Deum patrum nostrórum, et déderit nobis pacem per gyrum. Ædificavérunt ígitur, et nullum in exstruéndo impediméntum fuit.'
  "8": 'Hábuit autem Asa in exércitu suo portántium scuta et hastas de Iuda trecénta míllia, de Béniamin vero scutariórum et sagittariórum ducénta octogínta míllia: omnes isti viri fortíssimi.'
  "9": 'Egréssus est autem contra eos Zara Æthiops cum exércitu suo, décies centéna míllia, et cúrribus trecéntis: et venit usque Marésa.'
  "10": 'Porro Asa perréxit óbviam ei, et instrúxit áciem ad bellum in valle Séphata, quæ est iuxta Marésa:'
  "11": 'et invocávit Dóminum Deum, et ait: Dómine non est apud te ulla distántia, utrum in paucis auxiliéris, an in plúribus. Adiuva nos Dómine Deus noster: in te enim, et in tuo nómine habéntes fidúciam, venímus contra hanc multitúdinem. Dómine, Deus noster tu es, non præváleat contra te homo.'
  "12": 'Extérruit ítaque Dóminus Æthíopes coram Asa et Iuda: fugerúntque Æthíopes.'
  "13": 'Et persecútus est eos Asa, et pópulus, qui cum eo erat, usque Gerára: et ruérunt Æthíopes usque ad interneciónem, quia Dómino cædénte contríti sunt, et exércitu illíus prœliánte. Tulérunt ergo spólia multa,'
  "14": 'et percussérunt civitátes omnes per circúitum Geráræ: grandis quippe cunctos terror inváserat: et diripuérunt urbes, et multam prædam asportavérunt.'
  "15": 'Sed et caulas óvium destruéntes, tulérunt pécorum infinítam multitúdinem, et camelórum: reversíque sunt in Ierúsalem.'
