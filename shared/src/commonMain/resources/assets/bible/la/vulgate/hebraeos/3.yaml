bible: vulgate
lang: la
language: Latina
book: ad Hebraeos
chapter: "3"
verses:
  "1": 'Unde fratres sancti, vocatiónis cæléstis partícipes, consideráte Apóstolum, et pontíficem confessiónis nostræ Iesum:'
  "2": qui fidélis est ei, qui fecit illum, sicut et Móyses in omni domo eius.
  "3": Amplióris enim glóriæ iste præ Móyse dignus est hábitus, quanto ampliórem honórem habet domus, qui fabricávit illam.
  "4": 'Omnis namque domus fabricátur ab áliquo: qui autem ómnia creávit, Deus est.'
  "5": 'Et Móyses quidem fidélis erat in tota domo eius tamquam fámulus, in testimónium eórum, quæ dicénda erant:'
  "6": 'Christus vero tamquam fílius in domo sua: quæ domus sumus nos, si fidúciam, et glóriam spei usque ad finem, firmam retineámus.'
  "7": 'Quaprópter sicut dicit Spíritus sanctus: Hódie si vocem eius audiéritis,'
  "8": nolíte obduráre corda vestra, sicut in exacerbatióne secúndum diem tentatiónis in desérto,
  "9": 'ubi tentavérunt me patres vestri: probavérunt, et vidérunt ópera mea'
  "10": 'quadragínta annis: propter quod infénsus fui generatióni huic, et dixi: Semper errant corde. Ipsi autem non cognovérunt vias meas,'
  "11": 'sicut iurávi in ira mea: Si introíbunt in réquiem meam.'
  "12": 'Vidéte fratres, ne forte sit in áliquo vestrum cor malum incredulitátis, discedéndi a Deo vivo:'
  "13": sed adhortámini vosmetípsos per síngulos dies, donec Hódie cognominátur, ut non obdurétur quis ex vobis fallácia peccáti.
  "14": Partícipes enim Christi effécti sumus, si tamen inítium substántiæ eius usque ad finem firmum retineámus.
  "15": 'Dum dícitur: Hódie si vocem eius audiéritis, nolíte obduráre corda vestra, quemádmodum in illa exacerbatióne.'
  "16": 'Quidam enim audiéntes exacerbavérunt: sed non univérsi qui profécti sunt ex Ægýpto per Móysen.'
  "17": Quibus autem infénsus est quadragínta annis? Nonne illis, qui peccavérunt, quorum cadávera prostráta sunt in desérto?
  "18": Quibus autem iurávit non introíre in réquiem ipsíus, nisi illis, qui incréduli fuérunt?
  "19": Et vidémus, quia non potuérunt introíre propter incredulitátem.
