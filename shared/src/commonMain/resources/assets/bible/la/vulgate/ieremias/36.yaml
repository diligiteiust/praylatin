bible: vulgate
lang: la
language: Latina
book: Ieremias
chapter: "36"
verses:
  "1": 'Et factum est in anno quarto Ióakim fílii Iosíæ regis Iuda, factum est verbum hoc ad Ieremíam a Dómino, dicens:'
  "2": 'Tolle volúmen libri, et scribes in eo ómnia verba, quæ locútus sum tibi advérsum Israel et Iudam, et advérsum omnes gentes: a die, qua locútus sum ad te ex diébus Iosíæ usque ad diem hanc:'
  "3": 'si forte audiénte domo Iuda univérsa mala, quæ ego cógito fácere eis, revertátur unusquísque a via sua péssima: et propítius ero iniquitáti, et peccáto eórum.'
  "4": 'Vocávit ergo Ieremías Baruch fílium Neríæ: et scripsit Baruch ex ore Ieremíæ omnes sermónes Dómini, quos locútus est ad eum in volúmine libri:'
  "5": 'et præcépit Ieremías Baruch, dicens: Ego clausus sum, nec váleo íngredi domum Dómini.'
  "6": 'Ingrédere ergo tu, et lege de volúmine, in quo scripsísti ex ore meo verba Dómini, audiénte pópulo in domo Dómini, in die ieiúnii: ínsuper et audiénte univérso Iuda, qui véniunt de civitátibus suis, leges eis:'
  "7": 'si forte cadat orátio eórum in conspéctu Dómini, et revertátur unusquísque a via sua péssima: quóniam magnus furor et indignátio est, quam locútus est Dóminus advérsus pópulum hunc.'
  "8": Et fecit Baruch fílius Neríæ iuxta ómnia, quæ præcéperat ei Ieremías prophéta, legens ex volúmine sermónes Dómini in domo Dómini.
  "9": 'Factum est autem in anno quinto Ióakim fílii Iosíæ regis Iuda, in mense nono: prædicavérunt ieiúnium in conspéctu Dómini omni pópulo in Ierúsalem, et univérsæ multitúdini, quæ conflúxerat de civitátibus Iuda in Ierúsalem.'
  "10": Legítque Baruch ex volúmine sermónes Ieremíæ in domo Dómini, in gazophylácio Gamaríæ fílii Saphan scribæ, in vestíbulo superióri, in intróitu portæ novæ domus Dómini, audiénte omni pópulo.
  "11": Cumque audísset Michǽas fílius Gamaríæ fílii Saphan omnes sermónes Dómini ex libro,
  "12": 'descéndit in domum regis, ad gazophylácium scribæ, et ecce ibi omnes príncipes sedébant: Elísama scriba, et Dalaías fílius Semeíæ, et Elnathan fílius Achobor, et Gamarías fílius Saphan, et Sedecías fílius Hananíæ, et univérsi príncipes.'
  "13": Et nuntiávit eis Michǽas ómnia verba, quæ audívit legénte Baruch ex volúmine in áuribus pópuli.
  "14": 'Misérunt ítaque omnes príncipes ad Baruch, Iudi fílium Nathaníæ fílii Selemíæ fílii Chusi, dicéntes: Volúmen ex quo legísti, audiénte pópulo, sume in manu tua, et veni. Tulit ergo Baruch fílius Neríæ volúmen in manu sua, et venit ad eos.'
  "15": 'Et dixérunt ad eum: Sede, et lege hæc in áuribus nostris. Et legit Baruch in áuribus eórum.'
  "16": 'Igitur cum audíssent ómnia verba, obstupuérunt unusquísque ad próximum suum, et dixérunt ad Baruch: Nuntiáre debémus regi omnes sermónes istos.'
  "17": 'Et interrogavérunt eum, dicéntes: Indica nobis quómodo scripsísti omnes sermónes istos ex ore eius.'
  "18": 'Dixit autem eis Baruch: Ex ore suo loquebátur quasi legens ad me omnes sermónes istos, et ego scribébam in volúmine atraménto.'
  "19": 'Et dixérunt príncipes ad Baruch: Vade, et abscóndere tu et Ieremías, et nemo sciat ubi sitis.'
  "20": 'Et ingréssi sunt ad regem in átrium: porro volúmen commendavérunt in gazophylácio Elísamæ scribæ, et nuntiavérunt audiénte rege omnes sermónes.'
  "21": 'Misítque rex Iudi ut súmeret volúmen: qui tollens illud de gazophylácio Elísamæ scribæ, legit audiénte rege, et univérsis princípibus, qui stabant circa regem.'
  "22": Rex autem sedébat in domo hiemáli, in mense nono, et pósita erat árula coram eo plena prunis.
  "23": Cumque legísset Iudi tres pagéllas vel quátuor, scidit illud scalpéllo scribæ, et proiécit in ignem, qui erat super árulam, donec consumerétur omne volúmen igni, qui erat in árula.
  "24": Et non timuérunt, neque scidérunt vestiménta sua, rex et omnes servi eius, qui audiérunt univérsos sermónes istos.
  "25": 'Verúmtamen Elnathan, et Dalaías, et Gamarías, contradixérunt regi, ne combúreret librum: et non audívit eos.'
  "26": 'Et præcépit rex Ierémiel fílio Amelech, et Saraíæ fílio Ezriel, et Selemíæ fílio Abdeel, ut comprehénderent Baruch scribam, et Ieremíam prophétam: abscóndit autem eos Dóminus.'
  "27": 'Et factum est verbum Dómini ad Ieremíam prophétam, postquam combússerat rex volúmen et sermónes, quos scrípserat Baruch ex ore Jeremíæ, dicens:'
  "28": Rursum tolle volúmen áliud, et scribe in eo omnes sermónes prióres, qui erant in primo volúmine, quod combússit Ióakim rex Iuda.
  "29": 'Et ad Ióakim regem Iuda dices: Hæc dicit Dóminus: Tu combussísti volúmen illud, dicens: Quare scripsísti in eo annúntians: Festínus véniet rex Babylónis, et vastábit terram hanc, et cessáre fáciet ex illa hóminem et iuméntum?'
  "30": 'Proptérea hæc dicit Dóminus contra Ióakim regem Iuda: Non erit ex eo, qui sédeat super sólium David: et cadáver eius proiciétur ad æstum per diem, et ad gelu per noctem.'
  "31": 'Et visitábo contra eum, et contra semen eius, et contra servos eius, iniquitátes suas: et addúcam super eos, et super habitatóres Ierúsalem, et super viros Iuda, omne malum, quod locútus sum ad eos, et non audiérunt.'
  "32": 'Ieremías autem tulit volúmen áliud, et dedit illud Baruch fílio Neríæ scribæ: qui scripsit in eo ex ore Ieremíæ omnes sermónes libri, quem combússerat Ióakim rex Iuda igni: et ínsuper ádditi sunt sermónes multo plures, quam ántea fúerant.'
