bible: vulgate
lang: la
language: Latina
book: Proverbia
chapter: "20"
verses:
  "1": 'Luxuriósa res vinum, et tumultuósa ebríetas: quicúmque his delectátur, non erit sápiens.'
  "2": 'Sicut rugítus leónis, ita et terror regis: qui próvocat eum, peccat in ánimam suam.'
  "3": 'Honor est hómini, qui séparat se a contentiónibus: omnes autem stulti miscéntur contuméliis.'
  "4": 'Propter frigus piger aráre nóluit: mendicábit ergo æstáte, et non dábitur illi.'
  "5": 'Sicut aqua profúnda, sic consílium in corde viri: sed homo sápiens exháuriet illud.'
  "6": 'Multi hómines misericórdes vocántur: virum autem fidélem quis invéniet?'
  "7": Iustus qui ámbulat in simplicitáte sua, beátos post se fílios derelínquet.
  "8": Rex, qui sedet in sólio iudícii, díssipat omne malum intúitu suo.
  "9": 'Quis potest dícere: Mundum est cor meum, purus sum a peccáto?'
  "10": 'Pondus et pondus, mensúra et mensúra: utrúmque abominábile est apud Deum.'
  "11": Ex stúdiis suis intellígitur puer, si munda et recta sint ópera eius.
  "12": 'Aurem audiéntem, et óculum vidéntem: Dóminus fecit utrúmque.'
  "13": 'Noli dilígere somnum, ne te egéstas ópprimat: áperi óculos tuos, et saturáre pánibus.'
  "14": 'Malum est, malum est, dicit omnis emptor: et cum recésserit, tunc gloriábitur.'
  "15": Est aurum et multitúdo gemmárum, et vas pretiósum lábia sciéntiæ.
  "16": Tolle vestiméntum eius, qui fideiússor éxtitit aliéni, et pro extráneis aufer pignus ab eo.
  "17": 'Suávis est hómini panis mendácii: et póstea implébitur os eius cálculo.'
  "18": 'Cogitatiónes consíliis roborántur: et gubernáculis tractánda sunt bella.'
  "19": Ei, qui revélat mystéria, et ámbulat fraudulénter, et dilátat lábia sua, ne commisceáris.
  "20": Qui maledícit patri suo et matri, exstinguétur lucérna eius in médiis ténebris.
  "21": Heréditas, ad quam festinátur in princípio, in novíssimo benedictióne carébit.
  "22": 'Ne dicas: Reddam malum: exspécta Dóminum, et liberábit te.'
  "23": 'Abominátio est apud Dóminum pondus et pondus: statéra dolósa non est bona.'
  "24": 'A Dómino dirigúntur gressus viri: quis autem hóminum intellígere potest viam suam?'
  "25": Ruína est hómini devoráre sanctos, et post vota retractáre.
  "26": Díssipat ímpios rex sápiens, et incúrvat super eos fórnicem.
  "27": Lucérna Dómini spiráculum hóminis, quæ investígat ómnia secréta ventris.
  "28": Misericórdia et véritas custódiunt regem, et roborátur cleméntia thronus eius.
  "29": 'Exsultátio iúvenum, fortitúdo eórum: et dígnitas senum caníties.'
  "30": 'Livor vúlneris abstérget mala: et plagæ in secretióribus ventris.'
