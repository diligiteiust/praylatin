bible: vulgate
lang: la
language: Latina
book: II Machabaeorum
chapter: "9"
verses:
  "1": Eódem témpore, Antíochus inhonéste revertebátur de Pérside.
  "2": 'Intráverat enim in eam, quæ dícitur Persépolis, et tentávit exspoliáre templum, et civitátem opprímere: sed multitúdine ad arma concurrénte, in fugam versi sunt: et ita cóntigit ut Antíochus post fugam túrpiter redíret.'
  "3": Et cum venísset circa Ecbátanam, recognóvit quæ erga Nicánorem, et Timótheum gesta sunt.
  "4": 'Elátus autem in ira, arbitrabátur se iniúriam illórum, qui se fugáverant posse in Iudǽos retorquére: ideóque iussit agitári currum suum sine intermissióne agens iter, cælésti eum iudício perurgénte, eo quod ita supérbe locútus est se ventúrum Ierosólymam, et congériem sepúlcri Iudæórum eam factúrum.'
  "5": 'Sed qui univérsa cónspicit Dóminus Deus Israel, percússit eum insanábili, et invisíbili plaga. Ut enim finívit hunc ipsum sermónem, apprehéndit eum dolor dirus víscerum, et amára internórum torménta:'
  "6": et quidem satis iuste, quippe qui multis, et novis cruciátibus aliórum tórserat víscera, licet ille nullo modo a sua malítia cessáret.
  "7": Super hoc autem supérbia replétus, ignem spirans ánimo in Iudǽos, et præcípiens accelerári negótium, cóntigit illum ímpetu eúntem de curru cádere, et gravi córporis collisióne membra vexári.
  "8": 'Isque qui sibi videbátur étiam flúctibus maris imperáre, supra humánum modum supérbia replétus, et móntium altitúdines in statéra appéndere, nunc humiliátus ad terram in gestatório portabátur, maniféstam Dei virtútem in semetípso contéstans:'
  "9": 'ita ut de córpore ímpii vermes scaturírent, ac vivéntis in dolóribus carnes eius efflúerent, odóre étiam illíus et fœtóre exércitus gravarétur:'
  "10": et qui paulo ante sídera cæli contíngere se arbitrabátur, eum nemo póterat propter intolerántiam fœtóris portáre.
  "11": Hinc ígitur cœpit ex gravi supérbia dedúctus ad agnitiónem sui veníre, divína admónitus plaga, per moménta síngula dolóribus suis augménta capiéntibus.
  "12": 'Et cum nec ipse iam fœtórem suum ferre posset, ita ait: Iustum est súbditum esse Deo, et mortálem non pária Deo sentíre.'
  "13": Orábat autem hic sceléstus Dóminum, a quo non esset misericórdiam consecutúrus.
  "14": 'Et civitátem, ad quam festínans veniébat ut eam ad solum dedúceret, ac sepúlcrum congestórum fáceret, nunc optat líberam réddere:'
  "15": 'et Iudǽos, quos nec sepultúra quidem se dignos habitúrum, sed ávibus ac feris diripiéndos traditúrum, et cum párvulis exterminatúrum díxerat, æquáles nunc Atheniénsibus factúrum pollicétur:'
  "16": 'templum étiam sanctum, quod prius exspoliáverat, óptimis donis ornatúrum, et sancta vasa multiplicatúrum, et pertinéntes ad sacrifícia sumptus de reddítibus suis præstatúrum:'
  "17": super hæc, et Iudǽum se futúrum, et omnem locum terræ perambulatúrum, et prædicatúrum Dei potestátem.
  "18": 'Sed non cessántibus dolóribus (supervénerat enim in eum iustum Dei iudícium), despérans scripsit ad Iudǽos in modum deprecatiónis epístolam hæc continéntem:'
  "19": Optimis cívibus Iudǽis plúrimam salútem, et bene valére, et esse felíces, rex et princeps Antíochus.
  "20": Si bene valétis, et fílii vestri, et ex senténtia vobis cuncta sunt, máximas ágimus grátias.
  "21": 'Et ego in infirmitáte constitútus, vestri autem memor benígne revérsus de Pérsidis locis, et infirmitáte gravi apprehénsus, necessárium duxi pro commúni utilitáte curam habére:'
  "22": non despérans memetípsum, sed spem multam habens effugiéndi infirmitátem.
  "23": 'Respíciens autem quod et pater meus, quibus tempóribus in locis superióribus ducébat exércitum, osténdit qui post se suscíperet principátum:'
  "24": ut si quid contrárium accíderet, aut diffícile nuntiarétur, sciéntes hi, qui in regiónibus erant, cui esset rerum summa derelícta, non turbaréntur.
  "25": 'Ad hæc, consíderans de próximo poténtes quosque et vicínos tempóribus insidiántes, et evéntum exspectántes, designávi fílium meum Antíochum regem, quem sæpe recúrrens in superióra regna multis vestrum commendábam: et scripsi ad eum quæ subiécta sunt.'
  "26": Oro ítaque vos, et peto mémores beneficiórum públice et privátim, ut unusquísque consérvet fidem ad me et ad fílium meum.
  "27": Confído enim eum modéste et humáne actúrum, et sequéntem propósitum meum, et commúnem vobis fore.
  "28": Igitur homicída et blasphémus péssime percússus, et ut ipse álios tractáverat, péregre in móntibus miserábili óbitu vita functus est.
  "29": 'Transferébat autem corpus Philíppus collactáneus eius: qui, métuens fílium Antíochi, ad Ptolemǽum Philométorem in Ægýptum ábiit.'
