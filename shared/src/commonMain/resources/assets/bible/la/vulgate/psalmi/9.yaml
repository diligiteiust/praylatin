bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "9"
verses:
  "1": In finem, pro occúltis fílii, Psalmus David.
  "2": 'Confitébor tibi Dómine in toto corde meo: narrábo ómnia mirabília tua.'
  "3": 'Lætábor et exsultábo in te: psallam nómini tuo Altíssime,'
  "4": 'in converténdo inimícum meum retrórsum: infirmabúntur, et períbunt a fácie tua.'
  "5": 'Quóniam fecísti iudícium meum et causam meam: sedísti super thronum, qui iúdicas iustítiam.'
  "6": 'Increpásti gentes, et périit ímpius: nomen eórum delésti in ætérnum, et in sǽculum sǽculi.'
  "7": 'Inimíci defecérunt frámeæ in finem, et civitátes eórum destruxísti. Périit memória eórum cum sónitu:'
  "8": et Dóminus in ætérnum pérmanet. Parávit in iudício thronum suum,
  "9": 'et ipse iudicábit orbem terræ in æquitáte: iudicábit pópulos in iustítia.'
  "10": 'Et factus est Dóminus refúgium páuperi: adiútor in opportunitátibus, in tribulatióne.'
  "11": 'Et sperent in te qui novérunt nomen tuum: quóniam non dereliquísti quæréntes te Dómine.'
  "12": 'Psállite Dómino qui hábitat in Sion: annuntiáte inter gentes stúdia eius:'
  "13": 'quóniam requírens sánguinem eórum recordátus est: non est oblítus clamórem páuperum.'
  "14": 'Miserére mei Dómine: vide humilitátem meam de inimícis meis.'
  "15": Qui exáltas me de portis mortis, ut annúntiem omnes laudatiónes tuas in portis fíliæ Sion.
  "16": 'Exsultábo in salutári tuo: infíxæ sunt gentes in intéritu, quem fecérunt. In láqueo isto, quem abscondérunt, comprehénsus est pes eórum.'
  "17": 'Cognoscétur Dóminus iudícia fáciens: in opéribus mánuum suárum comprehénsus est peccátor.'
  "18": Convertántur peccatóres in inférnum, omnes gentes quæ obliviscúntur Deum.
  "19": 'Quóniam non in finem oblívio erit páuperis: patiéntia páuperum non períbit in finem.'
  "20": 'Exsúrge Dómine, non confortétur homo: iudicéntur gentes in conspéctu tuo.'
  "21": 'Constítue Dómine legislatórem super eos: ut sciant gentes quóniam hómines sunt.'
  "22": 'Ut quid Dómine recessísti longe: déspicis in opportunitátibus, in tribulatióne?'
  "23": 'Dum supérbit ímpius, incénditur pauper: comprehendúntur in consíliis, quibus cógitant.'
  "24": 'Quóniam laudátur peccátor in desidériis ánimæ suæ: et iníquus benedícitur.'
  "25": 'Exacerbávit Dóminum peccátor: secúndum multitúdinem iræ suæ non quæret.'
  "26": 'Non est Deus in conspéctu eius: inquinátæ sunt viæ illíus in omni témpore. Auferúntur iudícia tua a fácie eius: ómnium inimicórum suórum dominábitur.'
  "27": 'Dixit enim in corde suo: Non movébor a generatióne in generatiónem, sine malo.'
  "28": 'Cuius maledictióne os plenum est, et amaritúdine, et dolo: sub lingua eius labor et dolor.'
  "29": Sedet in insídiis cum divítibus in occúltis, ut interfíciat innocéntem.
  "30": 'Oculi eius in páuperem respíciunt: insidiátur in abscóndito, quasi leo in spelúnca sua. Insidiátur ut rápiat páuperem: rápere páuperem dum áttrahit eum.'
  "31": 'In láqueo suo humiliábit eum: inclinábit se, et cadet cum dominátus fúerit páuperum.'
  "32": 'Dixit enim in corde suo: Oblítus est Deus, avértit fáciem suam ne vídeat in finem.'
  "33": 'Exsúrge Dómine Deus, exaltétur manus tua: ne obliviscáris páuperum.'
  "34": 'Propter quid irritávit ímpius Deum? dixit enim in corde suo: Non requíret.'
  "35": 'Vides, quóniam tu labórem et dolórem consíderas, ut tradas eos in manus tuas. Tibi derelíctus est pauper: órphano tu eris adiútor.'
  "36": 'Cóntere bráchium peccatóris et malígni: quærétur peccátum illíus, et non inveniétur.'
  "37": 'Dóminus regnábit in ætérnum, et in sǽculum sǽculi: períbitis gentes de terra illíus.'
  "38": 'Desidérium páuperum exaudívit Dóminus: præparatiónem cordis eórum audívit auris tua.'
  "39": Iudicáre pupíllo et húmili, ut non appónat ultra magnificáre se homo super terram.
