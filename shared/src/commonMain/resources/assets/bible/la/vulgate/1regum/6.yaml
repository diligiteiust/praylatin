bible: vulgate
lang: la
language: Latina
book: I Regum
chapter: "6"
verses:
  "1": Factum est ergo quadringentésimo et octogésimo anno egressiónis filiórum Israel de terra Ægýpti, in anno quarto, mense Zio (ipse est mensis secúndus), regni Salomónis super Israel, ædificári cœpit domus Dómino.
  "2": Domus autem, quam ædificábat rex Sálomon Dómino, habébat sexagínta cúbitos in longitúdine, et vigínti cúbitos in latitúdine, et trigínta cúbitos in altitúdine.
  "3": 'Et pórticus erat ante templum vigínti cubitórum longitúdinis, iuxta mensúram latitúdinis templi: et habébat decem cúbitos latitúdinis ante fáciem templi.'
  "4": Fecítque in templo fenéstras oblíquas.
  "5": Et ædificávit super paríetem templi tabuláta per gyrum, in pariétibus domus per circúitum templi et oráculi, et fecit látera in circúitu.
  "6": Tabulátum, quod subter erat, quinque cúbitos habébat latitúdinis, et médium tabulátum sex cubitórum latitúdinis, et tértium tabulátum septem habens cúbitos latitúdinis. Trabes autem pósuit in domo per circúitum forínsecus, ut non hærérent muris templi.
  "7": 'Domus autem cum ædificarétur, de lapídibus dolátis atque perféctis ædificáta est: et málleus, et secúris, et omne ferraméntum non sunt audíta in domo cum ædificarétur.'
  "8": 'Ostium láteris médii in parte erat domus dextræ: et per cóchleam ascendébant in médium cœnáculum, et a médio in tértium.'
  "9": 'Et ædificávit domum, et consummávit eam: texit quoque domum laqueáribus cédrinis.'
  "10": Et ædificávit tabulátum super omnem domum quinque cúbitis altitúdinis, et opéruit domum lignis cédrinis.
  "11": 'Et factus est sermo Dómini ad Salomónem, dicens:'
  "12": 'Domus hæc, quam ædíficas, si ambuláveris in præcéptis meis, et iudícia mea féceris, et custodíeris ómnia mandáta mea, grádiens per ea: firmábo sermónem meum tibi, quem locútus sum ad David patrem tuum.'
  "13": Et habitábo in médio filiórum Israel, et non derelínquam pópulum meum Israel.
  "14": Igitur ædificávit Sálomon domum, et consummávit eam.
  "15": 'Et ædificávit paríetes domus intrínsecus tabulátis cédrinis: a paviménto domus usque ad summitátem paríetum, et usque ad laqueária, opéruit lignis cédrinis intrínsecus: et texit paviméntum domus tábulis abiégnis.'
  "16": 'Ædificavítque vigínti cubitórum ad posteriórem partem templi tabuláta cédrina, a paviménto usque ad superióra: et fecit interiórem domum oráculi in Sanctum sanctórum.'
  "17": Porro quadragínta cubitórum erat ipsum templum pro fóribus oráculi.
  "18": 'Et cedro omnis domus intrínsecus vestiebátur, habens tornatúras, et iunctúras suas fabrefáctas, et cælatúras eminéntes: ómnia cédrinis tábulis vestiebántur: nec omníno lapis apparére póterat in paríete.'
  "19": Oráculum autem in médio domus, in interióri parte fécerat, ut póneret ibi arcam fœ́deris Dómini.
  "20": 'Porro oráculum habébat vigínti cúbitos longitúdinis, et vigínti cúbitos latitúdinis, et vigínti cúbitos altitúdinis: et opéruit illud atque vestívit auro puríssimo: sed et altáre vestívit cedro.'
  "21": Domum quoque ante oráculum opéruit auro puríssimo, et affíxit láminas clavis áureis.
  "22": 'Nihílque erat in templo quod non auro tegerétur: sed et totum altáre oráculi texit auro.'
  "23": Et fecit in oráculo duos chérubim de lignis olivárum, decem cubitórum altitúdinis.
  "24": 'Quinque cubitórum ala cherub una, et quinque cubitórum ala cherub áltera: id est, decem cúbitos habéntes, a summitáte alæ uníus usque ad alæ altérius summitátem.'
  "25": 'Decem quoque cubitórum erat cherub secúndus: in mensúra pari, et opus unum erat in duóbus chérubim,'
  "26": id est, altitúdinem habébat unus cherub decem cubitórum, et simíliter cherub secúndus.
  "27": 'Posuítque chérubim in médio templi interióris: extendébant autem alas suas chérubim, et tangébat ala una paríetem, et ala cherub secúndi tangébat paríetem álterum: alæ autem álteræ in média parte templi se ínvicem contingébant.'
  "28": Texit quoque chérubim auro.
  "29": 'Et omnes paríetes templi per circúitum sculpsit váriis cælatúris et torno: et fecit in eis chérubim, et palmas, et pictúras várias, quasi prominéntes de paríete, et egrediéntes.'
  "30": Sed et paviméntum domus texit auro intrínsecus et extrínsecus.
  "31": Et in ingréssu oráculi fecit ostíola de lignis olivárum, postésque angulórum quinque.
  "32": 'Et duo óstia de lignis olivárum: et sculpsit in eis pictúram chérubim, et palmárum spécies, et anáglypha valde prominéntia: et texit ea auro, et opéruit tam chérubim quam palmas, et cétera, auro.'
  "33": 'Fecítque in intróitu templi postes de lignis olivárum quadrangulátos:'
  "34": 'et duo óstia de lignis abiégnis altrínsecus: et utrúmque óstium duplex erat, et se ínvicem tenens aperiebátur.'
  "35": 'Et sculpsit chérubim, et palmas, et cælatúras valde eminéntes: operuítque ómnia láminis áureis ópere quadro ad régulam.'
  "36": Et ædificávit átrium intérius tribus ordínibus lápidum politórum, et uno órdine lignórum cedri.
  "37": 'Anno quarto fundáta est domus Dómini in mense Zio:'
  "38": 'et in anno undécimo, mense Bul (ipse est mensis octávus), perfécta est domus in omni ópere suo, et in univérsis utensílibus suis: ædificavítque eam annis septem.'
