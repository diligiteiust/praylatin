bible: vulgate
lang: la
language: Latina
book: II Paralipomenon
chapter: "36"
verses:
  "1": Tulit ergo pópulus terræ Ióachaz fílium Iosíæ, et constítuit regem pro patre suo in Ierúsalem.
  "2": Vigínti trium annórum erat Ióachaz cum regnáre cœpísset, et tribus ménsibus regnávit in Ierúsalem.
  "3": Amóvit autem eum rex Ægýpti cum venísset in Ierúsalem, et condemnávit terram centum taléntis argénti, et talénto auri.
  "4": 'Constituítque pro eo regem, Elíakim fratrem eius, super Iudam et Ierúsalem: et vertit nomen eius Ióakim: ipsum vero Ióachaz tulit secum, et abdúxit in Ægýptum.'
  "5": 'Vigínti quinque annórum erat Ióakim cum regnáre cœpísset, et úndecim annis regnávit in Ierúsalem: fecítque malum coram Dómino Deo suo.'
  "6": Contra hunc ascéndit Nabuchodónosor rex Chaldæórum, et vinctum caténis duxit in Babylónem.
  "7": Ad quam et vasa Dómini tránstulit, et pósuit ea in templo suo.
  "8": Réliqua autem verbórum Ióakim, et abominatiónum eius, quas operátus est, et quæ invénta sunt in eo, continéntur in Libro regum Iuda et Israel. Regnávit autem Ióachin fílius eius pro eo.
  "9": 'Octo annórum erat Ióachin cum regnáre cœpísset, et tribus ménsibus, ac decem diébus regnávit in Ierúsalem: fecítque malum in conspéctu Dómini.'
  "10": Cumque anni círculus volverétur, misit Nabuchodónosor rex, qui adduxérunt eum in Babylónem, asportátis simul pretiosíssimis vasis domus Dómini. Regem vero constítuit Sedecíam pátruum eius super Iudam et Ierúsalem.
  "11": 'Vigínti et uníus anni erat Sedecías cum regnáre cœpísset, et úndecim annis regnávit in Ierúsalem:'
  "12": fecítque malum in óculis Dómini Dei sui, nec erúbuit fáciem Ieremíæ prophétæ, loquéntis ad se ex ore Dómini.
  "13": 'A rege quoque Nabuchodónosor recéssit, qui adiuráverat eum per Deum: et indurávit cervícem suam et cor ut non reverterétur ad Dóminum Deum Israel.'
  "14": Sed et univérsi príncipes sacerdótum, et pópulus, prævaricáti sunt iníque iuxta univérsas abominatiónes géntium, et polluérunt domum Dómini, quam sanctificáverat sibi in Ierúsalem.
  "15": 'Mittébat autem Dóminus Deus patrum suórum ad illos per manum nuntiórum suórum de nocte consúrgens, et quotídie cómmonens: eo quod párceret pópulo et habitáculo suo.'
  "16": At illi subsannábant núntios Dei, et parvipendébant sermónes eius, illudebántque prophétis, donec ascénderet furor Dómini in pópulum eius, et esset nulla curátio.
  "17": 'Addúxit enim super eos regem Chaldæórum, et interfécit iúvenes eórum gládio in domo sanctuárii sui: non est misértus adolescéntis, et vírginis, et senis, nec decrépiti quidem, sed omnes trádidit in mánibus eius.'
  "18": Universáque vasa domus Dómini, tam maióra, quam minóra, et thesáuros templi, et regis, et príncipum tránstulit in Babylónem.
  "19": 'Incendérunt hostes domum Dei, destruxerúntque murum Ierúsalem: univérsas turres combussérunt, et quidquid pretiósum fúerat, demolíti sunt.'
  "20": Si quis eváserat gládium, ductus in Babylónem servívit regi et fíliis eius, donec imperáret rex Persárum,
  "21": 'et complerétur sermo Dómini ex ore Ieremíæ, et celebráret terra sábbata sua: cunctis enim diébus desolatiónis egit sábbatum usque dum compleréntur septuagínta anni.'
  "22": 'Anno autem primo Cyri regis Persárum, ad expléndum sermónem Dómini, quem locútus fúerat per os Ieremíæ, suscitávit Dóminus spíritum Cyri regis Persárum: qui iussit prædicári in univérso regno suo, étiam per scriptúram, dicens:'
  "23": 'Hæc dicit Cyrus rex Persárum: Omnia regna terræ dedit mihi Dóminus Deus cæli, et ipse præcépit mihi ut ædificárem ei domum in Ierúsalem, quæ est in Iudǽa: quis ex vobis est in omni pópulo eius? sit Dóminus Deus suus cum eo, et ascéndat.'
