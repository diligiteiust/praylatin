bible: vulgate
lang: la
language: Latina
book: Iosue
chapter: "5"
verses:
  "1": Postquam ergo audiérunt omnes reges Amorrhæórum, qui habitábant trans Iordánem ad occidentálem plagam, et cuncti reges Chánaan, qui propínqua possidébant magni maris loca, quod siccásset Dóminus fluénta Iordánis coram fíliis Israel donec transírent, dissolútum est cor eórum, et non remánsit in eis spíritus, timéntium intróitum filiórum Israel.
  "2": 'Eo témpore ait Dóminus ad Iósue: Fac tibi cultros lapídeos, et circumcíde secúndo fílios Israel.'
  "3": Fecit quod iússerat Dóminus, et circumcídit fílios Israel in colle præputiórum.
  "4": 'Hæc autem causa est secúndæ circumcisiónis: omnis pópulus, qui egréssus est de Ægýpto géneris masculíni, univérsi bellatóres viri, mórtui sunt in desérto per longíssimos viæ circúitus,'
  "5": qui omnes circumcísi erant. Pópulus autem qui natus est in desérto,
  "6": 'per quadragínta annos itíneris latíssimæ solitúdinis incircumcísus fuit: donec consumeréntur qui non audíerant vocem Dómini, et quibus ante iuráverat ut non osténderet eis terram lacte et melle manántem.'
  "7": 'Horum fílii in locum successérunt patrum, et circumcísi sunt a Iósue: quia sicut nati fúerant, in præpútio erant, nec eos in via áliquis circumcíderat.'
  "8": Postquam autem omnes circumcísi sunt, mansérunt in eódem castrórum loco, donec sanaréntur.
  "9": 'Dixítque Dóminus ad Iósue: Hódie ábstuli oppróbrium Ægýpti a vobis. Vocatúmque est nomen loci illíus Gálgala, usque in præséntem diem.'
  "10": 'Manserúntque fílii Israel in Gálgalis, et fecérunt Phase quartadécima die mensis ad vésperum in campéstribus Iéricho:'
  "11": et comedérunt de frúgibus terræ die áltero, ázymos panes, et poléntam eiúsdem anni.
  "12": Defecítque manna postquam comedérunt de frúgibus terræ, nec usi sunt ultra cibo illo fílii Israel, sed comedérunt de frúgibus præséntis anni terræ Chánaan.
  "13": 'Cum autem esset Iósue in agro urbis Iéricho, levávit óculos, et vidit virum stantem contra se, evaginátum tenéntem gládium: perrexítque ad eum, et ait: Noster es, an adversariórum?'
  "14": 'Qui respóndit: Nequáquam: sed sum princeps exércitus Dómini, et nunc vénio.'
  "15": 'Cécidit Iósue pronus in terram, et adórans ait: Quid Dóminus meus lóquitur ad servum suum?'
  "16": 'Solve, inquit, calceaméntum tuum de pédibus tuis: locus enim, in quo stas, sanctus est. Fecítque Iósue ut sibi fúerat imperátum.'
