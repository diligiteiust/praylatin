bible: vulgate
lang: la
language: Latina
book: Numeri
chapter: "30"
verses:
  "1": 'Narravítque Móyses fíliis Israel ómnia quæ ei Dóminus imperárat:'
  "2": 'et locútus est ad príncipes tríbuum filiórum Israel: Iste est sermo quem præcépit Dóminus:'
  "3": 'Si quis virórum votum Dómino vóverit, aut se constrínxerit iuraménto: non fáciet írritum verbum suum, sed omne quod promísit, implébit.'
  "4": 'Múlier si quíppiam vóverit, et se constrínxerit iuraménto, quæ est in domo patris sui, et in ætáte adhuc puellári: si cognóverit pater votum quod pollícita est, et iuraméntum quo obligávit ánimam suam, et tacúerit, voti rea erit:'
  "5": quidquid pollícita est et iurávit, ópere complébit.
  "6": 'Sin autem statim ut audíerit, contradíxerit pater: et vota et iuraménta eius írrita erunt, nec obnóxia tenébitur sponsióni, eo quod contradíxerit pater.'
  "7": 'Si marítum habúerit, et vóverit áliquid, et semel de ore eius verbum egrédiens ánimam eius obligáverit iuraménto:'
  "8": quo die audíerit vir, et non contradíxerit, voti rea erit, reddétque quodcúmque promíserat.
  "9": 'Sin autem áudiens statim contradíxerit, et írritas fécerit pollicitatiónes eius, verbáque quibus obstrínxerat ánimam suam: propítius erit ei Dóminus.'
  "10": Vídua et repudiáta quidquid vóverint, reddent.
  "11": Uxor in domo viri cum se voto constrínxerit et iuraménto,
  "12": si audíerit vir, et tacúerit, nec contradíxerit sponsióni, reddet quodcúmque promíserat.
  "13": 'Sin autem extémplo contradíxerit, non tenébitur promissiónis rea: quia marítus contradíxit, et Dóminus ei propítius erit.'
  "14": Si vóverit, et iuraménto se constrínxerit, ut per ieiúnium, vel ceterárum rerum abstinéntiam afflígat ánimam suam, in arbítrio viri erit ut fáciat, sive non fáciat.
  "15": 'Quod si áudiens vir tacúerit, et in álteram diem distúlerit senténtiam, quidquid vóverat atque promíserat, reddet: quia statim ut audívit, tácuit.'
  "16": Sin autem contradíxerit postquam rescívit, portábit ipse iniquitátem eius.
  "17": Istæ sunt leges, quas constítuit Dóminus Móysi inter virum et uxórem, inter patrem et fíliam, quæ in puellári adhuc ætáte est, vel quæ manet in paréntis domo.
