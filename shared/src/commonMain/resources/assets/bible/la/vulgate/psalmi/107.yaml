bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "107"
verses:
  "1": Cánticum Psalmi ipsi David.
  "2": 'Parátum cor meum Deus, parátum cor meum: cantábo, et psallam in glória mea.'
  "3": 'Exsúrge glória mea, exsúrge psaltérium et cíthara: exsúrgam dilúculo.'
  "4": 'Confitébor tibi in pópulis Dómine: et psallam tibi in natiónibus.'
  "5": 'Quia magna est super cælos misericórdia tua: et usque ad nubes véritas tua.'
  "6": 'Exaltáre super cælos Deus, et super omnem terram glória tua:'
  "7": 'ut liberéntur dilécti tui. Salvum fac déxtera tua, et exáudi me:'
  "8": 'Deus locútus est in sancto suo: Exsultábo, et dívidam Síchimam, et convállem tabernaculórum dimétiar.'
  "9": 'Meus est Gálaad, et meus est Manásses: et Ephraim suscéptio cápitis mei. Iuda rex meus:'
  "10": 'Moab lebes spei meæ. In Idumǽam exténdam calceaméntum meum: mihi alienígenæ amíci facti sunt.'
  "11": Quis dedúcet me in civitátem munítam? quis dedúcet me usque in Idumǽam?
  "12": Nonne tu Deus, qui repulísti nos? et non exíbis Deus in virtútibus nostris?
  "13": 'Da nobis auxílium de tribulatióne: quia vana salus hóminis.'
  "14": 'In Deo faciémus virtútem: et ipse ad níhilum dedúcet inimícos nostros.'
