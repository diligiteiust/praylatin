bible: vulgate
lang: la
language: Latina
book: Sapientia
chapter: "16"
verses:
  "1": Propter hæc, et per his simília passi sunt digne torménta, et per multitúdinem bestiárum extermináti sunt.
  "2": 'Pro quibus torméntis bene disposuísti pópulum tuum, quibus dedísti concupiscéntiam delectaménti sui novum sapórem, escam parans eis ortygométram:'
  "3": ut illi quidem, concupiscéntes escam propter ea, quæ illis osténsa et missa sunt, étiam a necessária concupiscéntia averteréntur. Hi autem in brevi ínopes facti, novam gustavérunt escam.
  "4": 'Oportébat enim illis sine excusatióne quidem superveníre intéritum exercéntibus tyránnidem: his autem tantum osténdere quemádmodum inimíci eórum exterminabántur.'
  "5": Etenim cum illis supervénit sæva bestiárum ira, mórsibus perversórum colubrórum exterminabántur.
  "6": Sed non in perpétuum ira tua permánsit, sed ad correptiónem in brevi turbáti sunt, signum habéntes salútis ad commemoratiónem mandáti legis tuæ.
  "7": 'Qui enim convérsus est, non per hoc, quod vidébat, sanabátur, sed per te, ómnium salvatórem:'
  "8": in hoc autem ostendísti inimícis nostris, quia tu es, qui líberas ab omni malo.
  "9": Illos enim locustárum et muscárum occidérunt morsus, et non est invénta sánitas ánimæ illórum, quia digni erant ab huiuscémodi exterminári.
  "10": 'Fílios autem tuos, nec dracónum venenatórum vicérunt dentes: misericórdia enim tua advéniens sanábat illos.'
  "11": In memória enim sermónum tuórum examinabántur, et velóciter salvabántur, ne in altam incidéntes obliviónem, non possent tuo uti adiutório.
  "12": 'Etenim neque herba, neque malágma sanávit eos: sed tuus, Dómine, sermo, qui sanat ómnia.'
  "13": 'Tu es enim, Dómine, qui vitæ et mortis habes potestátem, et dedúcis ad portas mortis, et redúcis:'
  "14": 'homo autem occídit quidem per malítiam, et cum exíerit spíritus, non revertétur, nec revocábit ánimam quæ recépta est:'
  "15": sed tuam manum effúgere impossíbile est.
  "16": 'Negántes enim te nosse ímpii, per fortitúdinem bráchii tui flagelláti sunt: novis aquis, et grandínibus, et plúviis persecutiónem passi, et per ignem consúmpti.'
  "17": 'Quod enim mirábile erat, in aqua, quæ ómnia exstínguit, plus ignis valébat: vindex est enim orbis iustórum.'
  "18": 'Quodam enim témpore mansuetabátur ignis, ne combureréntur quæ ad ímpios missa erant animália: sed ut ipsi vidéntes scirent, quóniam Dei iudício patiúntur persecutiónem.'
  "19": Et quodam témpore in aqua supra virtútem ignis exardescébat úndique, ut iníquæ terræ natiónem extermináret.
  "20": Pro quibus angelórum esca nutrivísti pópulum tuum, et parátum panem de cælo præstitísti illis sine labóre, omne delectaméntum in se habéntem, et omnis sapóris suavitátem.
  "21": 'Substántia enim tua dulcédinem tuam, quam in fílios habes, ostendébat: et desérviens uniuscuiúsque voluntáti, ad quod quisque volébat, convertebátur.'
  "22": 'Nix autem et glácies sustinébant vim ignis, et non tabescébant: ut scirent quóniam fructus inimicórum exterminábat ignis ardens in grándine et plúvia corúscans.'
  "23": Hic autem íterum ut nutriréntur iusti, étiam suæ virtútis oblítus est.
  "24": 'Creatúra enim tibi Factóri desérviens, exardéscit in torméntum advérsus iniústos: et lénior fit ad benefaciéndum pro his, qui in te confídunt.'
  "25": 'Propter hoc et tunc in ómnia transfiguráta, ómnium nutríci grátiæ tuæ deserviébat, ad voluntátem eórum, qui a te desiderábant:'
  "26": ut scirent fílii tui, quos dilexísti Dómine, quóniam non nativitátis fructus pascunt hómines, sed sermo tuus hos, qui in te credíderint, consérvat.
  "27": 'Quod enim ab igne non póterat exterminári, statim ab exíguo rádio solis calefáctum tabescébat:'
  "28": ut notum ómnibus esset, quóniam opórtet præveníre solem ad benedictiónem tuam, et ad ortum lucis te adoráre.
  "29": Ingráti enim spes tamquam hibernális glácies tabéscet, et dispériet tamquam aqua supervácua.
