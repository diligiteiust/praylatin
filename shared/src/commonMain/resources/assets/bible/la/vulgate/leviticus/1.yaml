bible: vulgate
lang: la
language: Latina
book: Leviticus
chapter: "1"
verses:
  "1": 'Vocávit autem Móysen, et locútus est ei Dóminus de tabernáculo testimónii, dicens:'
  "2": 'Lóquere fíliis Israel, et dices ad eos: Homo, qui obtúlerit ex vobis hóstiam Dómino de pecóribus, id est, de bobus et óvibus ófferens víctimas,'
  "3": 'si holocáustum fúerit eius oblátio, ac de arménto: másculum immaculátum ófferet ad óstium tabernáculi testimónii, ad placándum sibi Dóminum:'
  "4": ponétque manum super caput hóstiæ, et acceptábilis erit, atque in expiatiónem eius profíciens.
  "5": 'Immolabítque vítulum coram Dómino, et ófferent fílii Aaron sacerdótes sánguinem eius, fundéntes per altáris circúitum, quod est ante óstium tabernáculi:'
  "6": detractáque pelle hóstiæ, artus in frusta concídent,
  "7": 'et subícient in altári ignem, strue lignórum ante compósita:'
  "8": et membra quæ sunt cæsa, désuper ordinántes, caput vidélicet, et cuncta quæ adhǽrent iécori,
  "9": 'intestínis et pédibus lotis aqua: adolebítque ea sacérdos super altáre in holocáustum et suávem odórem Dómino.'
  "10": 'Quod si de pecóribus oblátio est, de óvibus sive de capris holocáustum, másculum absque mácula ófferet:'
  "11": 'immolabítque ad latus altáris, quod réspicit ad aquilónem, coram Dómino: sánguinem vero illíus fundent super altáre fílii Aaron per circúitum:'
  "12": 'dividéntque membra, caput, et ómnia quæ adhǽrent iécori: et ponent super ligna, quibus subiciéndus est ignis:'
  "13": intestína vero et pedes lavábunt aqua. Et obláta ómnia adolébit sacérdos super altáre in holocáustum et odórem suavíssimum Dómino.
  "14": Si autem de ávibus, holocáusti oblátio fúerit Dómino, de turtúribus, aut pullis colúmbæ,
  "15": 'ófferet eam sacérdos ad altáre: et retórto ad collum cápite, ac rupto vúlneris loco, decúrrere fáciet sánguinem super crepídinem altáris:'
  "16": vesículam vero gútturis, et plumas proíciet prope altáre ad orientálem plagam, in loco in quo cíneres effúndi solent,
  "17": confringétque ascéllas eius, et non secábit, neque ferro dívidet eam, et adolébit super altáre, lignis igne suppósito. Holocáustum est et oblátio suavíssimi odóris Dómino.
