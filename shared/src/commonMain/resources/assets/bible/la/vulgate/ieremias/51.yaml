bible: vulgate
lang: la
language: Latina
book: Ieremias
chapter: "51"
verses:
  "1": 'Hæc dicit Dóminus: Ecce ego suscitábo super Babylónem et super habitatóres eius, qui cor suum levavérunt contra me, quasi ventum pestiléntem.'
  "2": 'Et mittam in Babylónem ventilatóres, et ventilábunt eam, et demoliéntur terram eius: quóniam venérunt super eam úndique in die afflictiónis eius.'
  "3": Non tendat qui tendit arcum suum, et non ascéndat loricátus, nolíte párcere iuvénibus eius, interfícite omnem milítiam eius.
  "4": Et cadent interfécti in terra Chaldæórum, et vulneráti in regiónibus eius.
  "5": 'Quóniam non fuit viduátus Israel et Iuda a Deo suo Dómino exercítuum: terra autem eórum repléta est delícto a sancto Israel.'
  "6": 'Fúgite de médio Babylónis, et salvet unusquísque ánimam suam: nolíte tacére super iniquitátem eius: quóniam tempus ultiónis est a Dómino, vicissitúdinem ipse retríbuet ei.'
  "7": 'Calix áureus Bábylon in manu Dómini, inébrians omnem terram: de vino eius bibérunt gentes, et ídeo commótæ sunt.'
  "8": 'Súbito cécidit Bábylon, et contríta est. Ululáte super eam: tóllite resínam ad dolórem eius, si forte sanétur.'
  "9": 'Curávimus Babylónem, et non est sanáta: derelinquámus eam, et eámus unusquísque in terram suam: quóniam pervénit usque ad cælos iudícium eius, et elevátum est usque ad nubes.'
  "10": 'Prótulit Dóminus iustítias nostras: veníte, et narrémus in Sion opus Dómini Dei nostri.'
  "11": 'Acúite sagíttas, impléte pháretras: suscitávit Dóminus spíritum regum Medórum: et contra Babylónem mens eius est ut perdat eam, quóniam últio Dómini est, últio templi sui.'
  "12": 'Super muros Babylónis leváte signum, augéte custódiam: leváte custódes, præparáte insídias: quia cogitávit Dóminus, et fecit quæcúmque locútus est contra habitatóres Babylónis.'
  "13": 'Quæ hábitas super aquas multas, lócuples in thesáuris: venit finis tuus, pedális præcisiónis tuæ.'
  "14": 'Iurávit Dóminus exercítuum per ánimam suam: Quóniam replébo te homínibus quasi brucho, et super te celéuma cantábitur.'
  "15": Qui fecit terram in fortitúdine sua, præparávit orbem in sapiéntia sua, et prudéntia sua exténdit cælos.
  "16": 'Dante eo vocem, multiplicántur aquæ in cælo: qui levat nubes ab extrémo terræ, fúlgura in plúviam fecit: et prodúxit ventum de thesáuris suis.'
  "17": 'Stultus factus est omnis homo a sciéntia: confúsus est omnis conflátor in scúlptili: quia mendax est conflátio eórum, nec est spíritus in eis.'
  "18": 'Vana sunt ópera, et risu digna: in témpore visitatiónis suæ períbunt.'
  "19": 'Non sicut hæc pars Iacob: quia qui fecit ómnia, ipse est, et Israel sceptrum hereditátis eius: Dóminus exercítuum nomen eius.'
  "20": 'Collídis tu mihi vasa belli, et ego collídam in te gentes, et dispérdam in te regna:'
  "21": 'et collídam in te equum, et équitem eius: et collídam in te currum, et ascensórem eius:'
  "22": 'et collídam in te virum et mulíerem: et collídam in te senem et púerum: et collídam in te iúvenem et vírginem:'
  "23": 'et collídam in te pastórem et gregem eius: et collídam in te agrícolam et iugáles eius: et collídam in te duces et magistrátus.'
  "24": Et reddam Babylóni, et cunctis habitatóribus Chaldǽæ, omne malum suum, quod fecérunt in Sion, in óculis vestris, ait Dóminus.
  "25": 'Ecce ego ad te mons péstifer, ait Dóminus, qui corrúmpis univérsam terram: et exténdam manum meam super te, et evólvam te de petris, et dabo te in montem combustiónis.'
  "26": 'Et non tollent de te lápidem in ángulum, et lápidem in fundaménta: sed pérditus in ætérnum eris, ait Dóminus.'
  "27": 'Leváte signum in terra: clángite búccina in géntibus, sanctificáte super eam gentes: annuntiáte contra illam régibus Ararat, Menni, et Ascenez: numeráte contra eam Taphsar, addúcite equum quasi bruchum aculeátum.'
  "28": Sanctificáte contra eam gentes, reges Médiæ, duces eius, et univérsos magistrátus eius, cunctámque terram potestátis eius.
  "29": Et commovébitur terra, et conturbábitur, quia evigilábit contra Babylónem cogitátio Dómini, ut ponat terram Babylónis desértam et inhabitábilem.
  "30": 'Cessavérunt fortes Babylónis a prœ́lio, habitavérunt in præsídiis: devorátum est robur eórum, et facti sunt quasi mulíeres: incénsa sunt tabernácula eius, contríti sunt vectes eius.'
  "31": 'Currens óbviam currénti véniet, et núntius óbvius nuntiánti: ut annúntiet regi Babylónis, quia capta est cívitas eius a summo usque ad summum:'
  "32": et vada præoccupáta sunt, et palúdes incénsæ sunt igni, et viri bellatóres conturbáti sunt.
  "33": 'Quia hæc dicit Dóminus exercítuum, Deus Israel: Fília Babylónis quasi área, tempus tritúræ eius: adhuc módicum, et véniet tempus messiónis eius.'
  "34": 'Comédit me, devorávit me Nabuchodónosor rex Babylónis: réddidit me quasi vas ináne, absórbuit me quasi draco, replévit ventrem suum teneritúdine mea, et eiécit me.'
  "35": 'Iníquitas advérsum me, et caro mea super Babylónem, dicit habitátio Sion: et sanguis meus super habitatóres Chaldǽæ, dicit Ierúsalem.'
  "36": 'Proptérea hæc dicit Dóminus: Ecce ego iudicábo causam tuam, et ulcíscar ultiónem tuam: et desértum fáciam mare eius, et siccábo venam eius.'
  "37": Et erit Bábylon in túmulos, habitátio dracónum, stupor, et síbilus, eo quod non sit habitátor.
  "38": Simul ut leónes rúgient, excútient comas véluti cátuli leónum.
  "39": In calóre eórum ponam potus eórum, et inebriábo eos ut sopiántur, et dórmiant somnum sempitérnum, et non consúrgant, dicit Dóminus.
  "40": Dedúcam eos quasi agnos ad víctimam, et quasi aríetes cum hædis.
  "41": Quómodo capta est Sesach, et comprehénsa est ínclyta univérsæ terræ? quómodo facta est in stupórem Bábylon inter gentes?
  "42": Ascéndit super Babylónem mare, multitúdine flúctuum eius opérta est.
  "43": Factæ sunt civitátes eius in stupórem, terra inhabitábilis et desérta, terra in qua nullus hábitet, nec tránseat per eam fílius hóminis.
  "44": Et visitábo super Bel in Babylóne, et eíciam quod absorbúerat de ore eius, et non cónfluent ad eum ultra gentes, síquidem et murus Babylónis córruet.
  "45": 'Egredímini de médio eius pópulus meus: ut salvet unusquísque ánimam suam ab ira furóris Dómini.'
  "46": 'Et ne forte molléscat cor vestrum, et timeátis audítum, qui audiétur in terra: et véniet in anno audítio, et post hunc annum audítio: et iníquitas in terra, et dominátor super dominatórem.'
  "47": 'Proptérea ecce dies véniunt, et visitábo super sculptília Babylónis: et omnis terra eius confundétur, et univérsi interfécti eius cadent in médio eius.'
  "48": 'Et laudábunt super Babylónem cæli et terra, et ómnia quæ in eis sunt: quia ab aquilóne vénient ei prædónes, ait Dóminus.'
  "49": 'Et quómodo fecit Bábylon, ut cáderent occísi in Israel: sic de Babylóne cadent occísi in univérsa terra.'
  "50": 'Qui fugístis gládium, veníte, nolíte stare: recordámini procul Dómini, et Ierúsalem ascéndat super cor vestrum.'
  "51": 'Confúsi sumus, quóniam audívimus oppróbrium: opéruit ignomínia fácies nostras, quia venérunt aliéni super sanctificatiónem domus Dómini.'
  "52": 'Proptérea ecce dies véniunt, ait Dóminus: et visitábo super sculptília eius, et in omni terra eius múgiet vulnerátus.'
  "53": 'Si ascénderit Bábylon in cælum, et firmáverit in excélso robur suum: a me vénient vastatóres eius, ait Dóminus.'
  "54": 'Vox clamóris de Babylóne, et contrítio magna de terra Chaldæórum:'
  "55": 'quóniam vastávit Dóminus Babylónem, et pérdidit ex ea vocem magnam: et sonábunt fluctus eórum quasi aquæ multæ: dedit sónitum vox eórum:'
  "56": 'quia venit super eam, id est super Babylónem prædo, et apprehénsi sunt fortes eius, et emárcuit arcus eórum: quia fortis ultor Dóminus reddens retríbuet.'
  "57": 'Et inebriábo príncipes eius, et sapiéntes eius, et duces eius, et magistrátus eius, et fortes eius: et dórmient somnum sempitérnum, et non expergiscéntur, ait rex, Dóminus exercítuum nomen eius.'
  "58": 'Hæc dicit Dóminus exercítuum: Murus Babylónis ille latíssimus suffossióne suffodiétur, et portæ eius excélsæ igni comburéntur, et labóres populórum ad níhilum, et géntium in ignem erunt, et disperíbunt.'
  "59": 'Verbum, quod præcépit Ieremías prophéta Saraíæ fílio Neríæ fílii Maasíæ, cum pérgeret cum Sedecía rege in Babylónem, in anno quarto regni eius: Saraías autem erat princeps prophetíæ.'
  "60": 'Et scripsit Ieremías omne malum, quod ventúrum erat super Babylónem, in libro uno: ómnia verba hæc, quæ scripta sunt contra Babylónem.'
  "61": 'Et dixit Ieremías ad Saraíam: Cum véneris in Babylónem, et víderis, et légeris ómnia verba hæc,'
  "62": 'dices: Dómine tu locútus es contra locum istum, ut dispérderes eum: ne sit qui in eo hábitet ab hómine usque ad pecus, et ut sit perpétua solitúdo.'
  "63": 'Cumque compléveris légere librum istum, ligábis ad eum lápidem, et proícies illum in médium Euphráten:'
  "64": 'et dices: Sic submergétur Bábylon, et non consúrget a fácie afflictiónis, quam ego addúco super eam, et dissolvétur. Hucúsque verba Ieremíæ.'
