bible: vulgate
lang: la
language: Latina
book: Isaias
chapter: "1"
verses:
  "1": Vísio Isaíæ, fílii Amos, quam vidit super Iudam et Ierúsalem, in diébus Ozíæ, Ióathan, Achaz, et Ezechíæ, regum Iuda.
  "2": 'Audíte cæli, et áuribus pércipe terra, quóniam Dóminus locútus est. Fílios enutrívi, et exaltávi: ipsi autem sprevérunt me.'
  "3": 'Cognóvit bos possessórem suum, et ásinus præsépe dómini sui: Israel autem me non cognóvit, et pópulus meus non intelléxit.'
  "4": 'Væ genti peccatríci, pópulo gravi iniquitáte, sémini nequam, fíliis scelerátis: dereliquérunt Dóminum, blasphemavérunt sanctum Israel, abalienáti sunt retrórsum.'
  "5": Super quo percútiam vos ultra, addéntes prævaricatiónem? omne caput lánguidum, et omne cor mœrens.
  "6": 'A planta pedis usque ad vérticem, non est in eo sánitas: vulnus, et livor, et plaga tumens, non est circumligáta, nec curáta medicámine, neque fota óleo.'
  "7": 'Terra vestra desérta, civitátes vestræ succénsæ igni: regiónem vestram coram vobis aliéni dévorant, et desolábitur sicut in vastitáte hostíli.'
  "8": Et derelinquétur fília Sion ut umbráculum in vínea, et sicut tugúrium in cucumerário, et sicut cívitas, quæ vastátur.
  "9": Nisi Dóminus exercítuum reliquísset nobis semen, quasi Sódoma fuissémus, et quasi Gomórrha símiles essémus.
  "10": 'Audíte verbum Dómini príncipes Sodomórum: percípite áuribus legem Dei nostri pópulus Gomórrhæ.'
  "11": 'Quo mihi multitúdinem victimárum vestrárum? dicit Dóminus. Plenus sum: holocáusta aríetum, et ádipem pínguium, et sánguinem vitulórum, et agnórum, et hircórum nólui.'
  "12": Cum venirétis ante conspéctum meum, quis quæsívit hæc de mánibus vestris, ut ambularétis in átriis meis?
  "13": 'Ne offerátis ultra sacrifícium frustra: incénsum abominátio est mihi. Neoméniam et sábbatum, et festivitátes álias non feram, iníqui sunt cœtus vestri:'
  "14": 'caléndas vestras, et solemnitátes vestras odívit ánima mea: facta sunt mihi molésta, laborávi sústinens.'
  "15": 'Et cum extendéritis manus vestras, avértam óculos meos a vobis, et cum multiplicavéritis oratiónem, non exáudiam: manus enim vestræ sánguine plenæ sunt.'
  "16": 'Lavámini, mundi estóte, auférte malum cogitatiónum vestrárum ab óculis meis: quiéscite ágere pervérse,'
  "17": 'díscite benefácere: quǽrite iudícium, subveníte opprésso, iudicáte pupíllo, deféndite víduam.'
  "18": 'Et veníte, et argúite me, dicit Dóminus: si fúerint peccáta vestra ut cóccinum, quasi nix dealbabúntur: et si fúerint rubra quasi vermículus, velut lana alba erunt.'
  "19": Si voluéritis, et audiéritis me, bona terræ comedétis.
  "20": Quod si noluéritis, et me ad iracúndiam provocavéritis, gládius devorábit vos, quia os Dómini locútum est.
  "21": Quómodo facta est méretrix cívitas fidélis, plena iudícii? iustítia habitávit in ea, nunc autem homicídæ.
  "22": 'Argéntum tuum versum est in scóriam: vinum tuum mistum est aqua.'
  "23": 'Príncipes tui infidéles, sócii furum: omnes díligunt múnera, sequúntur retributiónes. Pupíllo non iúdicant: et causa víduæ non ingréditur ad illos.'
  "24": 'Propter hoc ait Dóminus Deus exercítuum fortis Israel: Heu, consolábor super hóstibus meis, et vindicábor de inimícis meis.'
  "25": Et convértam manum meam ad te, et éxcoquam ad purum scóriam tuam, et áuferam omne stannum tuum.
  "26": 'Et restítuam iúdices tuos ut fuérunt prius, et consiliários tuos sicut antíquitus: post hæc vocáberis cívitas iusti, urbs fidélis.'
  "27": 'Sion in iudício redimétur, et redúcent eam in iustítia:'
  "28": 'et cónteret sceléstos, et peccatóres simul: et qui dereliquérunt Dóminum consuméntur.'
  "29": 'Confundéntur enim ab idólis, quibus sacrificavérunt: et erubescétis super hortis, quos elegerátis,'
  "30": cum fuéritis velut quercus defluéntibus fóliis, et velut hortus absque aqua.
  "31": 'Et erit fortitúdo vestra ut favílla stuppæ, et opus vestrum quasi scintílla: et succendétur utrúmque simul, et non erit qui exstínguat.'
