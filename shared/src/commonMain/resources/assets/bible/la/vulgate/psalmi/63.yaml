bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "63"
verses:
  "1": In finem, Psalmus David.
  "2": 'Exáudi Deus oratiónem meam cum déprecor: a timóre inimíci éripe ánimam meam.'
  "3": 'Protexísti me a convéntu malignántium: a multitúdine operántium iniquitátem.'
  "4": 'Quia exacuérunt ut gládium linguas suas, intendérunt arcum rem amáram:'
  "5": ut sagíttent in occúltis immaculátum.
  "6": 'Súbito sagittábunt eum, et non timébunt: firmavérunt sibi sermónem nequam. Narravérunt ut abscónderent láqueos: dixérunt: Quis vidébit eos?'
  "7": 'Scrutáti sunt iniquitátes: defecérunt scrutántes scrutínio. Accédet homo ad cor altum:'
  "8": 'et exaltábitur Deus. Sagíttæ parvulórum factæ sunt plagæ eórum:'
  "9": 'et infirmátæ sunt contra eos linguæ eórum. Conturbáti sunt omnes qui vidébant eos:'
  "10": 'et tímuit omnis homo. Et annuntiavérunt ópera Dei: et facta eius intellexérunt.'
  "11": Lætábitur iustus in Dómino, et sperábit in eo, et laudabúntur omnes recti corde.
