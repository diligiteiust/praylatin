bible: vulgate
lang: la
language: Latina
book: Sophonias
chapter: "1"
verses:
  "1": Verbum Dómini, quod factum est ad Sophoníam fílium Chusi, fílii Godolíæ, fílii Amaríæ, fílii Ezecíæ, in diébus Iosíæ, fílii Amon, regis Iudæ.
  "2": 'Cóngregans congregábo ómnia a fácie terræ, dicit Dóminus:'
  "3": 'cóngregans hóminem, et pecus, cóngregans volatília cæli, et pisces maris: et ruínæ impiórum erunt: et dispérdam hómines a fácie terræ, dicit Dóminus.'
  "4": 'Et exténdam manum meam super Iudam, et super omnes habitántes Ierúsalem: et dispérdam de loco hoc relíquias Baal, et nómina ædituórum cum sacerdótibus:'
  "5": et eos, qui adórant super tecta milítiam cæli, et adórant, et iurant in Dómino, et iurant in Melchom.
  "6": Et qui avertúntur de post tergum Dómini, et qui non quæsiérunt Dóminum, nec investigavérunt eum.
  "7": 'Siléte a fácie Dómini Dei: quia iuxta est dies Dómini, quia præparávit Dóminus hóstiam, sanctificávit vocátos suos.'
  "8": 'Et erit: in die hóstiæ Dómini, visitábo super príncipes, et super fílios regis, et super omnes, qui indúti sunt veste peregrína:'
  "9": 'et visitábo super omnem, qui arrogánter ingréditur super limen in die illa: qui complent domum Dómini Dei sui iniquitáte, et dolo.'
  "10": Et erit in die illa, dicit Dóminus, vox clamóris a porta píscium, et ululátus a Secúnda, et contrítio magna a cóllibus.
  "11": 'Ululáte habitatóres Pilæ: contícuit omnis pópulus Chánaan, disperiérunt omnes involúti argénto.'
  "12": 'Et erit in témpore illo: scrutábor Ierúsalem in lucérnis, et visitábo super viros defíxos in fǽcibus suis: qui dicunt in córdibus suis: Non fáciet bene Dóminus, et non fáciet male.'
  "13": 'Et erit fortitúdo eórum in direptiónem, et domus eórum in desértum: et ædificábunt domos, et non habitábunt: et plantábunt víneas, et non bibent vinum eárum.'
  "14": 'Iuxta est dies Dómini magnus: iuxta est, et velox nimis: vox diéi Dómini amára, tribulábitur ibi fortis.'
  "15": Dies iræ dies illa, dies tribulatiónis et angústiæ, dies calamitátis et misériæ, dies tenebrárum et calíginis, dies nébulæ et túrbinis,
  "16": dies tubæ et clangóris super civitátes munítas, et super ángulos excélsos.
  "17": 'Et tribulábo hómines, et ambulábunt ut cæci, quia Dómino peccavérunt: et effundétur sanguis eórum sicut humus, et córpora eórum sicut stércora.'
  "18": 'Sed et argéntum eórum, et aurum eórum non póterit liberáre eos in die iræ Dómini: in igne zeli eius devorábitur omnis terra, quia consummatiónem cum festinatióne fáciet cunctis habitántibus terram.'
