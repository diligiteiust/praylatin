bible: vulgate
lang: la
language: Latina
book: Canticum Canticorum
chapter: "3"
verses:
  "1": 'In léctulo meo per noctes quæsívi quem díligit ánima mea: quæsívi illum, et non invéni.'
  "2": 'Surgam, et circuíbo civitátem: per vicos et platéas quæram quem díligit ánima mea: quæsívi illum, et non invéni.'
  "3": 'Invenérunt me vígiles, qui custódiunt civitátem: Num quem díligit ánima mea vidístis?'
  "4": 'Páululum cum pertransíssem eos, invéni quem díligit ánima mea: ténui eum: nec dimíttam, donec introdúcam illum in domum matris meæ, et in cubículum genetrícis meæ.'
  "5": Adiúro vos fíliæ Ierúsalem per cápreas cervósque campórum, ne suscitétis, neque evigiláre faciátis diléctam, donec ipsa velit.
  "6": Quæ est ista, quæ ascéndit per desértum sicut vírgula fumi ex aromátibus myrrhæ, et thuris, et univérsi púlveris pigmentárii?
  "7": 'En léctulum Salomónis sexagínta fortes ámbiunt ex fortíssimis Israel:'
  "8": 'omnes tenéntes gládios, et ad bella doctíssimi: uniuscuiúsque ensis super femur suum propter timóres noctúrnos.'
  "9": 'Férculum fecit sibi rex Sálomon de lignis Líbani:'
  "10": 'colúmnas eius fecit argénteas, reclinatórium áureum, ascénsum purpúreum: média caritáte constrávit, propter fílias Ierúsalem.'
  "11": Egredímini et vidéte fíliæ Sion regem Salomónem in diadémate, quo coronávit illum mater sua in die desponsatiónis illíus, et in die lætítiæ cordis eius.
