bible: vulgate
lang: la
language: Latina
book: Isaias
chapter: "36"
verses:
  "1": Et factum est in quartodécimo anno regis Ezechíæ, ascéndit Sennácherib, rex Assyriórum, super omnes civitátes Iuda munítas, et cepit eas.
  "2": 'Et misit rex Assyriórum Rábsacen de Lachis in Ierúsalem, ad regem Ezechíam in manu gravi: et stetit in aquædúctu piscínæ superióris in via Agri fullónis.'
  "3": Et egréssus est ad eum Elíacim, fílius Helcíæ, qui erat super domum, et Sobna scriba, et Ióahe fílius Asaph a commentáriis.
  "4": 'Et dixit ad eos Rábsaces: Dícite Ezechíæ: Hæc dicit rex magnus, rex Assyriórum: Quæ est ista fidúcia, qua confídis?'
  "5": aut quo consílio vel fortitúdine rebelláre dispónis? super quem habes fidúciam, quia recessísti a me?
  "6": 'Ecce confídis super báculum arundíneum confráctum istum, super Ægýptum: cui si inníxus fúerit homo, intrábit in manum eius, et perforábit eam: sic Phárao rex Ægýpti ómnibus, qui confídunt in eo.'
  "7": 'Quod si respondéris mihi: In Dómino Deo nostro confídimus: nonne ipse est, cuius ábstulit Ezechías excélsa et altária, et dixit Iudæ et Ierúsalem: Coram altári isto adorábitis?'
  "8": Et nunc trade te dómino meo, regi Assyriórum, et dabo tibi duo míllia equórum, nec póteris ex te præbére ascensóres eórum.
  "9": 'Et quómodo sustinébis fáciem iúdicis uníus loci ex servis dómini mei minóribus? Quod si confídis in Ægýpto, in quadrígis, et in equítibus:'
  "10": 'et nunc numquid sine Dómino ascéndi ad terram istam, ut dispérderem eam? Dóminus dixit ad me: Ascénde super terram istam, et dispérde eam.'
  "11": 'Et dixit Elíacim, et Sobna, et Ióahe ad Rábsacen: Lóquere ad servos tuos Syra lingua: intellígimus enim: ne loquáris ad nos Iudáice in áuribus pópuli, qui est super murum.'
  "12": 'Et dixit ad eos Rábsaces: Numquid ad dóminum tuum et ad te misit me dóminus meus, ut lóquerer ómnia verba ista: et non pótius ad viros, qui sedent in muro, ut cómedant stércora sua, et bibant urínam pedum suórum vobíscum?'
  "13": 'Et stetit Rábsaces, et clamávit voce magna Iudáice, et dixit: Audíte verba regis magni, regis Assyriórum.'
  "14": 'Hæc dicit rex: Non sedúcat vos Ezechías, quia non póterit erúere vos.'
  "15": 'Et non vobis tríbuat fidúciam Ezechías super Dómino, dicens: Eruens liberábit nos Dóminus: non dábitur cívitas ista in manu regis Assyriórum.'
  "16": 'Nolíte audíre Ezechíam: hæc enim dicit rex Assyriórum: Fácite mecum benedictiónem, et egredímini ad me, et comédite unusquísque víneam suam, et unusquísque ficum suam: et bíbite unusquísque aquam cistérnæ suæ,'
  "17": donec véniam, et tollam vos ad terram, quæ est ut terra vestra, terram fruménti et vini, terram panum et vineárum.
  "18": 'Nec contúrbet vos Ezechías, dicens: Dóminus liberábit nos. Numquid liberavérunt dii géntium unusquísque terram suam de manu regis Assyriórum?'
  "19": Ubi est deus Emath, et Arphad? ubi est deus Sephárvaim? numquid liberavérunt Samaríam de manu mea?
  "20": Quis est ex ómnibus diis terrárum istárum, qui erúerit terram suam de manu mea, ut éruat Dóminus Ierúsalem de manu mea?
  "21": 'Et siluérunt, et non respondérunt ei verbum. Mandáverat enim rex, dicens: Ne respondeátis ei.'
  "22": Et ingréssus est Elíacim, fílius Helcíæ, qui erat super domum, et Sobna scriba, et Ióahe fílius Asaph a commentáriis, ad Ezechíam scissis véstibus, et nuntiavérunt ei verba Rábsacis.
