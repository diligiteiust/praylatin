bible: vulgate
lang: la
language: Latina
book: ad Thessalonicenses II
chapter: "1"
verses:
  "1": Paulus, et Sylvánus, et Timótheus, ecclésiæ Thessalonicénsium in Deo Patre nostro, et Dómino Iesu Christo.
  "2": Grátia vobis, et pax a Deo Patre nostro, et Dómino Iesu Christo.
  "3": 'Grátias ágere debémus semper Deo pro vobis, fratres, ita ut dignum est, quóniam supercréscit fides vestra, et abúndat cáritas uniuscuiúsque vestrum in ínvicem:'
  "4": ita ut et nos ipsi in vobis gloriémur in ecclésiis Dei, pro patiéntia vestra, et fide, et in ómnibus persecutiónibus vestris, et tribulatiónibus, quas sustinétis
  "5": in exémplum iusti iudícii Dei, ut digni habeámini in regno Dei, pro quo et patímini.
  "6": 'Si tamen iustum est apud Deum retribúere tribulatiónem iis, qui vos tríbulant:'
  "7": et vobis, qui tribulámini, réquiem nobíscum in revelatióne Dómini Iesu de cælo cum ángelis virtútis eius,
  "8": in flamma ignis dantis vindíctam iis, qui non novérunt Deum, et qui non obédiunt Evangélio Dómini nostri Iesu Christi,
  "9": 'qui pœnas dabunt in intéritu ætérnas a fácie Dómini, et a glória virtútis eius:'
  "10": cum vénerit glorificári in sanctis suis, et admirábilis fíeri in ómnibus, qui credidérunt, quia créditum est testimónium nostrum super vos in die illo.
  "11": 'In quo étiam orámus semper pro vobis: ut dignétur vos vocatióne sua Deus noster, et ímpleat omnem voluntátem bonitátis, et opus fídei in virtúte,'
  "12": ut clarificétur nomen Dómini nostri Iesu Christi in vobis, et vos in illo secúndum grátiam Dei nostri, et Dómini Iesu Christi.
