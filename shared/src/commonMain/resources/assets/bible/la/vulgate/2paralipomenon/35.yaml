bible: vulgate
lang: la
language: Latina
book: II Paralipomenon
chapter: "35"
verses:
  "1": 'Fecit autem Iosías in Ierúsalem Phase Dómino, quod immolátum est quartadécima die mensis primi:'
  "2": et constítuit sacerdótes in offíciis suis, hortatúsque est eos ut ministrárent in domo Dómini.
  "3": 'Levítis quoque, ad quorum eruditiónem omnis Israel sanctificabátur Dómino, locútus est: Pónite arcam in sanctuário templi, quod ædificávit Sálomon fílius David rex Israel, nequáquam enim eam ultra portábitis: nunc autem ministráte Dómino Deo vestro, et pópulo eius Israel.'
  "4": Et præparáte vos per domos, et cognatiónes vestras in divisiónibus singulórum, sicut præcépit David rex Israel, et descrípsit Sálomon fílius eius.
  "5": Et ministráte in sanctuário per famílias turmásque Levíticas,
  "6": 'et sanctificáti immoláte Phase: fratres étiam vestros, ut possint iuxta verba, quæ locútus est Dóminus in manu Móysi fácere, præparáte.'
  "7": 'Dedit prætérea Iosías omni pópulo, qui ibi fúerat invéntus in solemnitáte Phase, agnos et hædos de grégibus, et réliqui pécoris trigínta míllia, boum quoque tria míllia: hæc de regis univérsa substántia.'
  "8": Duces quoque eius sponte quod vóverant, obtulérunt, tam pópulo, quam sacerdótibus et Levítis. Porro Helcías, et Zacharías, et Iáhiel príncipes domus Dómini dedérunt sacerdótibus ad faciéndum Phase pécora commíxtim duo míllia sexcénta, et boves trecéntos.
  "9": Chonenías autem, et Semeías, étiam Nathánael fratres eius, necnon Hasabías, et Iéhiel, et Iózabad príncipes Levitárum, dedérunt céteris Levítis ad celebrándum Phase quinque míllia pécorum, et boves quingéntos.
  "10": 'Præparatúmque est ministérium, et stetérunt sacerdótes in offício suo: Levítæ quoque in turmis, iuxta regis impérium.'
  "11": 'Et immolátum est Phase: asperserúntque sacerdótes manu sua sánguinem, et Levítæ detraxérunt pelles holocaustórum:'
  "12": 'et separavérunt ea ut darent per domos et famílias singulórum, et offerréntur Dómino, sicut scriptum est in Libro Móysi: de bobus quoque fecérunt simíliter.'
  "13": 'Et assavérunt Phase super ignem, iuxta quod in lege scriptum est: pacíficas vero hóstias coxérunt in lebétibus, et cácabis, et ollis, et festináto distribuérunt univérsæ plebi:'
  "14": 'sibi autem, et sacerdótibus póstea paravérunt, nam in oblatióne holocaustórum et ádipum usque ad noctem sacerdótes fuérunt occupáti: unde Levítæ sibi, et sacerdótibus fíliis Aaron paravérunt novíssimis.'
  "15": 'Porro cantóres fílii Asaph stabant in órdine suo, iuxta præcéptum David, et Asaph, et Heman, et Idithun prophetárum regis: ianitóres vero per portas síngulas observábant, ita ut nec puncto quidem discéderent a ministério: quam ob rem et fratres eórum Levítæ paravérunt eis cibos.'
  "16": Omnis ígitur cultúra Dómini rite compléta est in die illa, ut fácerent Phase, et offérrent holocáusta super altáre Dómini, iuxta præcéptum regis Iosíæ.
  "17": Fecerúntque fílii Israel, qui repérti fúerant ibi, Phase in témpore illo, et solemnitátem azymórum septem diébus.
  "18": 'Non fuit Phase símile huic in Israel a diébus Samuélis prophétæ: sed nec quisquam de cunctis régibus Israel fecit Phase sicut Iosías, sacerdótibus, et Levítis, et omni Iudæ, et Israel qui repértus fúerat, et habitántibus in Ierúsalem.'
  "19": Octávo décimo anno regni Iosíæ hoc Phase celebrátum est.
  "20": 'Postquam instauráverat Iosías templum, ascéndit Néchao rex Ægýpti ad pugnándum in Chárcamis iuxta Euphráten: et procéssit in occúrsum eius Iosías.'
  "21": 'At ille, missis ad eum núntiis, ait: Quid mihi et tibi est rex Iuda? non advérsum te hódie vénio, sed contra áliam pugno domum, ad quam me Deus festináto ire præcépit: désine advérsum Deum fácere, qui mecum est, ne interfíciat te.'
  "22": 'Nóluit Iosías revérti, sed præparávit contra eum bellum, nec acquiévit sermónibus Néchao ex ore Dei: verum perréxit ut dimicáret in campo Magéddo.'
  "23": 'Ibíque vulnerátus a sagittáriis, dixit púeris suis: Edúcite me de prœ́lio, quia óppido vulnerátus sum.'
  "24": 'Qui transtulérunt eum de curru in álterum currum, qui sequebátur eum more régio, et asportavérunt eum in Ierúsalem, mortuúsque est, et sepúltus in mausoléo patrum suórum: et univérsus Iuda et Ierúsalem luxérunt eum:'
  "25": 'Ieremías máxime: cuius omnes cantóres atque cantatríces, usque in præséntem diem, lamentatiónes super Iosíam réplicant, et quasi lex obtínuit in Israel: Ecce scriptum fertur in lamentatiónibus.'
  "26": 'Réliqua autem sermónum Iosíæ, et misericordiárum eius, quæ lege præcépta sunt Dómini:'
  "27": ópera quoque illíus prima et novíssima, scripta sunt in Libro regum Iuda et Israel.
