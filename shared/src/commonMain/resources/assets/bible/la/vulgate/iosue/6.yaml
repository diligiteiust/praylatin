bible: vulgate
lang: la
language: Latina
book: Iosue
chapter: "6"
verses:
  "1": Iéricho autem clausa erat atque muníta, timóre filiórum Israel, et nullus égredi audébat aut íngredi.
  "2": 'Dixítque Dóminus ad Iósue: Ecce dedi in manu tua Iéricho, et regem eius, omnésque fortes viros.'
  "3": 'Circuíte urbem cuncti bellatóres semel per diem: sic faciétis sex diébus.'
  "4": 'Séptimo autem die, sacerdótes tollant septem búccinas, quarum usus est in iubilǽo, et præcédant arcam fœ́deris: septiésque circuíbitis civitátem, et sacerdótes clangent búccinis.'
  "5": Cumque insonúerit vox tubæ lóngior atque concísior, et in áuribus vestris increpúerit, conclamábit omnis pópulus vociferatióne máxima, et muri fúnditus córruent civitátis, ingredientúrque sínguli per locum contra quem stéterint.
  "6": 'Vocávit ergo Iósue fílius Nun sacerdótes, et dixit ad eos: Tóllite arcam fœ́deris: et septem álii sacerdótes tollant septem iubilæórum búccinas, et incédant ante arcam Dómini.'
  "7": 'Ad pópulum quoque ait: Ite, et circuíte civitátem, armáti, præcedéntes arcam Dómini.'
  "8": Cumque Iósue verba finísset, et septem sacerdótes septem búccinis clángerent ante arcam fœ́deris Dómini,
  "9": omnísque præcéderet armátus exércitus, réliquum vulgus arcam sequebátur, ac búccinis ómnia concrepábant.
  "10": 'Præcéperat autem Iósue pópulo, dicens: Non clamábitis, nec audiétur vox vestra, neque ullus sermo ex ore vestro egrediétur, donec véniat dies in quo dicam vobis: Clamáte, et vociferámini.'
  "11": Circuívit ergo arca Dómini civitátem semel per diem, et revérsa in castra mansit ibi.
  "12": Igitur Iósue de nocte consurgénte, tulérunt sacerdótes arcam Dómini,
  "13": 'et septem ex eis septem búccinas, quarum in iubilǽo usus est: præcedebántque arcam Dómini ambulántes atque clangéntes: et armátus pópulus ibat ante eos, vulgus autem réliquum sequebátur arcam, et búccinis personábat.'
  "14": Circuierúntque civitátem secúndo die semel, et revérsi sunt in castra. Sic fecérunt sex diébus.
  "15": Die autem séptimo, dilúculo consurgéntes, circuiérunt urbem, sicut dispósitum erat, sépties.
  "16": 'Cumque séptimo circúitu clángerent búccinis sacerdótes, dixit Iósue ad omnem Israel: Vociferámini: trádidit enim vobis Dóminus civitátem:'
  "17": 'sitque cívitas hæc anáthema: et ómnia quæ in ea sunt, Dómino: sola Rahab méretrix vivat cum univérsis, qui cum ea in domo sunt: abscóndit enim núntios quos diréximus.'
  "18": Vos autem cavéte ne de his, quæ præcépta sunt, quíppiam contingátis, et sitis prævaricatiónis rei, et ómnia castra Israel sub peccáto sint atque turbéntur.
  "19": Quidquid autem auri et argénti fúerit, et vasórum æneórum ac ferri, Dómino consecrétur, repósitum in thesáuris eius.
  "20": 'Igitur omni pópulo vociferánte, et clangéntibus tubis, postquam in aures multitúdinis vox sonitúsque incrépuit, muri íllico corruérunt: et ascéndit unusquísque per locum, qui contra se erat: ceperúntque civitátem,'
  "21": et interfecérunt ómnia quæ erant in ea, a viro usque ad mulíerem, ab infánte usque ad senem. Boves quoque et oves et ásinos in ore gládii percussérunt.
  "22": 'Duóbus autem viris, qui exploratóres missi fúerant, dixit Iósue: Ingredímini domum mulíeris meretrícis, et prodúcite eam, et ómnia quæ illíus sunt, sicut illi iuraménto firmástis.'
  "23": Ingressíque iúvenes eduxérunt Rahab, et paréntes eius, fratres quoque, et cunctam supelléctilem ac cognatiónem illíus, et extra castra Israel manére fecérunt.
  "24": 'Urbem autem, et ómnia, quæ erant in ea, succendérunt: absque auro et argénto, et vasis ǽneis, ac ferro, quæ in ærárium Dómini consecrárunt.'
  "25": 'Rahab vero meretrícem, et domum patris eius, et ómnia quæ habébat, fecit Iósue vívere, et habitavérunt in médio Israel, usque in præséntem diem: eo quod abscónderit núntios, quos míserat ut explorárent Iéricho. In témpore illo, imprecátus est Iósue, dicens:'
  "26": Maledíctus vir coram Dómino, qui suscitáverit et ædificáverit civitátem Iéricho. In primogénito suo fundaménta illíus iáciat, et in novíssimo liberórum ponat portas eius.
  "27": Fuit ergo Dóminus cum Iósue, et nomen eius vulgátum est in omni terra.
