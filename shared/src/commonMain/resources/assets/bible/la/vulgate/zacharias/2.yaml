bible: vulgate
lang: la
language: Latina
book: Zacharias
chapter: "2"
verses:
  "1": 'Et levávi óculos meos, et vidi: et ecce vir, et in manu eius funículus mensórum.'
  "2": 'Et dixi: Quo tu vadis? Et dixit ad me: Ut métiar Ierúsalem, et vídeam quanta sit latitúdo eius, et quanta longitúdo eius.'
  "3": Et ecce ángelus, qui loquebátur in me, egrediebátur, et ángelus álius egrediebátur in occúrsum eius.
  "4": 'Et dixit ad eum: Curre, lóquere ad púerum istum, dicens: Absque muro habitábitur Ierúsalem, præ multitúdine hóminum, et iumentórum in médio eius.'
  "5": 'Et ego ero ei, ait Dóminus, murus ignis in circúitu: et in glória ero in médio eius.'
  "6": 'O, o fúgite de terra aquilónis, dicit Dóminus: quóniam in quátuor ventos cæli dispérsi vos, dicit Dóminus.'
  "7": 'O Sion, fuge quæ hábitas apud fíliam Babylónis:'
  "8": 'quia hæc dicit Dóminus exercítuum: Post glóriam misit me ad gentes, quæ spoliavérunt vos: qui enim tetígerit vos, tangit pupíllam óculi mei:'
  "9": 'quia ecce ego levo manum meam super eos, et erunt prædæ his, qui serviébant sibi: et cognoscétis quia Dóminus exercítuum misit me.'
  "10": 'Lauda, et lætáre fília Sion: quia ecce ego vénio, et habitábo in médio tui, ait Dóminus.'
  "11": 'Et applicabúntur gentes multæ ad Dóminum in die illa, et erunt mihi in pópulum, et habitábo in médio tui: et scies quia Dóminus exercítuum misit me ad te.'
  "12": 'Et possidébit Dóminus Iudam partem suam in terra sanctificáta: et éliget adhuc Ierúsalem.'
  "13": 'Síleat omnis caro a fácie Dómini: quia consurréxit de habitáculo sancto suo.'
