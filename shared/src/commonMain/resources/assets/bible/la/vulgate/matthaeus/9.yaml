bible: vulgate
lang: la
language: Latina
book: Matthaeus
chapter: "9"
verses:
  "1": Et ascéndens in navículam, transfretávit, et venit in civitátem suam.
  "2": 'Et ecce offerébant ei paralýticum iacéntem in lecto. Et videns Iesus fidem illórum, dixit paralýtico: Confíde fili, remittúntur tibi peccáta tua.'
  "3": 'Et ecce quidam de scribis dixérunt intra se: Hic blasphémat.'
  "4": 'Et cum vidísset Iesus cogitatiónes eórum, dixit: Ut quid cogitátis mala in córdibus vestris?'
  "5": 'Quid est facílius dícere: Dimittúntur tibi peccáta tua: an dícere: Surge, et ámbula?'
  "6": 'Ut autem sciátis, quia Fílius hóminis habet potestátem in terra dimitténdi peccáta, tunc ait paralýtico: Surge, tolle lectum tuum, et vade in domum tuam.'
  "7": Et surréxit, et ábiit in domum suam.
  "8": Vidéntes autem turbæ timuérunt, et glorificavérunt Deum, qui dedit potestátem talem homínibus.
  "9": 'Et, cum transíret inde Iesus, vidit hóminem sedéntem in telónio, Matthǽum nómine. Et ait illi: Séquere me. Et surgens, secútus est eum.'
  "10": Et factum est, discumbénte eo in domo, ecce multi publicáni, et peccatóres veniéntes, discumbébant cum Iesu, et discípulis eius.
  "11": 'Et vidéntes Pharisǽi, dicébant discípulis eius: Quare cum publicánis, et peccatóribus mandúcat magíster vester?'
  "12": 'At Iesus áudiens, ait: Non est opus valéntibus médicus, sed male habéntibus.'
  "13": 'Eúntes autem díscite quid est: Misericórdiam volo, et non sacrifícium. Non enim veni vocáre iustos, sed peccatóres.'
  "14": 'Tunc accessérunt ad eum discípuli Ioánnis, dicéntes: Quare nos, et Pharisǽi, ieiunámus frequénter: discípuli autem tui non ieiúnant?'
  "15": 'Et ait illis Iesus: Numquid possunt fílii sponsi lugére, quámdiu cum illis est sponsus? Vénient autem dies cum auferétur ab eis sponsus: et tunc ieiunábunt.'
  "16": 'Nemo autem immíttit commissúram panni rudis in vestiméntum vetus: tollit enim plenitúdinem eius a vestiménto, et peior scissúra fit.'
  "17": 'Neque mittunt vinum novum in utres véteres: alióquin rumpúntur utres, et vinum effúnditur, et utres péreunt. Sed vinum novum in utres novos mittunt: et ambo conservántur.'
  "18": 'Hæc illo loquénte ad eos, ecce princeps unus accéssit, et adorábat eum, dicens: Dómine, fília mea modo defúncta est: sed veni, impóne manum tuam super eam, et vivet.'
  "19": Et surgens Iesus, sequebátur eum, et discípuli eius.
  "20": Et ecce múlier, quæ sánguinis fluxum patiebátur duódecim annis, accéssit retro, et tétigit fímbriam vestiménti eius.
  "21": 'Dicébat enim intra se: Si tetígero tantum vestiméntum eius, salva ero.'
  "22": 'At Iesus convérsus, et videns eam, dixit: Confíde fília, fides tua te salvam fecit. Et salva facta est múlier ex illa hora.'
  "23": 'Et cum venísset Iesus in domum príncipis, et vidísset tibícines et turbam tumultuántem, dicébat:'
  "24": 'Recédite: non est enim mórtua puélla, sed dormit. Et deridébant eum.'
  "25": 'Et cum eiécta esset turba, intrávit: et ténuit manum eius, et surréxit puélla.'
  "26": Et éxiit fama hæc in univérsam terram illam.
  "27": 'Et transeúnte inde Iesu, secúti sunt eum duo cæci, clamántes, et dicéntes: Miserére nostri, Fili David.'
  "28": 'Cum autem venísset domum, accessérunt ad eum cæci. Et dicit eis Iesus: Créditis quia hoc possum fácere vobis? Dicunt ei: Utique, Dómine.'
  "29": 'Tunc tétigit óculos eórum, dicens: Secúndum fidem vestram, fiat vobis.'
  "30": 'Et apérti sunt óculi eórum: et comminátus est illis Iesus, dicens: Vidéte ne quis sciat.'
  "31": Illi autem exeúntes, diffamavérunt eum in tota terra illa.
  "32": Egréssis autem illis, ecce obtulérunt ei hóminem mutum, dæmónium habéntem.
  "33": 'Et eiécto dæmónio, locútus est mutus, et mirátæ sunt turbæ, dicéntes: Numquam appáruit sic in Israel.'
  "34": 'Pharisǽi autem dicébant: In príncipe dæmoniórum éicit dǽmones.'
  "35": Et circuíbat Iesus omnes civitátes, et castélla, docens in synagógis eórum, et prǽdicans Evangélium regni, et curans omnem languórem, et omnem infirmitátem.
  "36": 'Videns autem turbas, misértus est eis: quia erant vexáti, et iacéntes sicut oves non habéntes pastórem.'
  "37": 'Tunc dicit discípulis suis: Messis quidem multa, operárii autem pauci.'
  "38": Rogáte ergo Dóminum messis, ut mittat operários in messem suam.
