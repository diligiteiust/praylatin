bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "65"
verses:
  "1": In finem, Cánticum Psalmi resurrectiónis. Iubiláte Deo omnis terra,
  "2": 'psalmum dícite nómini eius: date glóriam laudi eius.'
  "3": 'Dícite Deo: Quam terribília sunt ópera tua Dómine! in multitúdine virtútis tuæ mentiéntur tibi inimíci tui.'
  "4": 'Omnis terra adóret te, et psallat tibi: psalmum dicat nómini tuo.'
  "5": 'Veníte, et vidéte ópera Dei: terríbilis in consíliis super fílios hóminum.'
  "6": 'Qui convértit mare in áridam, in flúmine pertransíbunt pede: ibi lætábimur in ipso.'
  "7": 'Qui dominátur in virtúte sua in ætérnum, óculi eius super gentes respíciunt: qui exásperant non exalténtur in semetípsis.'
  "8": 'Benedícite gentes Deum nostrum: et audítam fácite vocem laudis eius.'
  "9": 'Qui pósuit ánimam meam ad vitam: et non dedit in commotiónem pedes meos.'
  "10": 'Quóniam probásti nos Deus: igne nos examinásti, sicut examinátur argéntum.'
  "11": 'Induxísti nos in láqueum, posuísti tribulatiónes in dorso nostro:'
  "12": 'imposuísti hómines super cápita nostra. Transívimus per ignem et aquam: et eduxísti nos in refrigérium.'
  "13": 'Introíbo in domum tuam in holocáustis: reddam tibi vota mea,'
  "14": quæ distinxérunt lábia mea, et locútum est os meum, in tribulatióne mea.
  "15": 'Holocáusta medulláta ófferam tibi cum incénso aríetum: ófferam tibi boves cum hircis.'
  "16": Veníte, audíte, et narrábo, omnes qui timétis Deum, quanta fecit ánimæ meæ.
  "17": Ad ipsum ore meo clamávi, et exaltávi sub lingua mea.
  "18": Iniquitátem si aspéxi in corde meo, non exáudiet Dóminus.
  "19": Proptérea exaudívit Deus, et atténdit voci deprecatiónis meæ.
  "20": Benedíctus Deus, qui non amóvit oratiónem meam, et misericórdiam suam a me.
