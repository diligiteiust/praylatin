bible: vulgate
lang: la
language: Latina
book: Zacharias
chapter: "1"
verses:
  "1": 'In mense octávo, in anno secúndo Daríi regis, factum est verbum Dómini ad Zacharíam, fílium Barachíæ fílii Addo prophétam, dicens:'
  "2": Irátus est Dóminus super patres vestros iracúndia.
  "3": 'Et dices ad eos: Hæc dicit Dóminus exercítuum: Convertímini ad me, ait Dóminus exercítuum: et convértar ad vos, dicit Dóminus exercítuum.'
  "4": 'Ne sitis sicut patres vestri, ad quos clamábant prophétæ prióres, dicéntes: Hæc dicit Dóminus exercítuum: Convertímini de viis vestris malis, et de cogitatiónibus vestris péssimis: et non audiérunt, neque attendérunt ad me, dicit Dóminus.'
  "5": Patres vestri ubi sunt? et prophétæ numquid in sempitérnum vivent?
  "6": 'Verúmtamen verba mea, et legítima mea, quæ mandávi servis meis prophétis, numquid non comprehendérunt patres vestros, et convérsi sunt, et dixérunt: Sicut cogitávit Dóminus exercítuum fácere nobis secúndum vias nostras, et secúndum adinventiónes nostras, fecit nobis?'
  "7": 'In die vigésima et quarta undécimi mensis Sabath, in anno secúndo Daríi, factum est verbum Dómini ad Zacharíam fílium Barachíæ, fílii Addo, prophétam, dicens:'
  "8": 'Vidi per noctem, et ecce vir ascéndens super equum rufum, et ipse stabat inter myrtéta, quæ erant in profúndo: et post eum equi rufi, várii, et albi.'
  "9": 'Et dixi: Quid sunt isti, Dómine mi? Et dixit ad me ángelus, qui loquebátur in me: Ego osténdam tibi quid sint hæc.'
  "10": 'Et respóndit vir, qui stabat inter myrtéta, et dixit: Isti sunt, quos misit Dóminus ut perámbulent terram.'
  "11": 'Et respondérunt ángelo Dómini, qui stabat inter myrtéta, et dixérunt: Perambulávimus terram, et ecce omnis terra habitátur, et quiéscit.'
  "12": 'Et respóndit ángelus Dómini, et dixit: Dómine exercítuum úsquequo tu non miseréberis Ierúsalem, et úrbium Iuda, quibus irátus es? Iste iam septuagésimus annus est.'
  "13": Et respóndit Dóminus ángelo, qui loquebátur in me verba bona, verba consolatória.
  "14": 'Et dixit ad me ángelus, qui loquebátur in me: Clama, dicens: Hæc dicit Dóminus exercítuum: Zelátus sum Ierúsalem, et Sion zelo magno.'
  "15": 'Et ira magna ego iráscor super gentes opuléntas: quia ego irátus sum parum, ipsi vero adiuvérunt in malum.'
  "16": 'Proptérea hæc dicit Dóminus: Revértar ad Ierúsalem in misericórdiis: et domus mea ædificábitur in ea, ait Dóminus exercítuum, et perpendículum extendétur super Ierúsalem.'
  "17": 'Adhuc clama, dicens: Hæc dicit Dóminus exercítuum: Adhuc áffluent civitátes meæ bonis: et consolábitur adhuc Dóminus Sion, et éliget adhuc Ierúsalem.'
  "18": Et levávi óculos meos, et vidi, et ecce quátuor córnua.
  "19": 'Et dixi ad ángelum, qui loquebátur in me: Quid sunt hæc? Et dixit ad me: Hæc sunt córnua, quæ ventilavérunt Iudam, et Israel, et Ierúsalem.'
  "20": Et osténdit mihi Dóminus quátuor fabros.
  "21": 'Et dixi: Quid isti véniunt fácere? Qui ait, dicens: Hæc sunt córnua, quæ ventilavérunt Iudam per síngulos viros, et nemo eórum levávit caput suum: et venérunt isti deterrére ea, ut deíciant córnua géntium, quæ levavérunt cornu super terram Iuda ut dispérgerent eam.'
