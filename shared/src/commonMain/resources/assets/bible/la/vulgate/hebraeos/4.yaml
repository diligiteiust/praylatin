bible: vulgate
lang: la
language: Latina
book: ad Hebraeos
chapter: "4"
verses:
  "1": Timeámus ergo ne forte relícta pollicitatióne introeúndi in réquiem eius, existimétur áliquis ex vobis deésse.
  "2": 'Etenim et nobis nuntiátum est, quemádmodum et illis: sed non prófuit illis sermo audítus, non admístus fídei ex iis, quæ audiérunt.'
  "3": 'Ingrediémur enim in réquiem, qui credídimus: quemádmodum dixit: Sicut iurávi in ira mea: Si introíbunt in réquiem meam: et quidem opéribus ab institutióne mundi perféctis.'
  "4": 'Dixit enim in quodam loco de die séptima sic: Et requiévit Deus die séptima ab ómnibus opéribus suis.'
  "5": 'Et in isto rursum: Si introíbunt in réquiem meam.'
  "6": 'Quóniam ergo súperest introíre quosdam in illam, et ii, quibus prióribus annuntiátum est, non introiérunt propter incredulitátem:'
  "7": 'íterum términat diem quemdam, Hódie, in David dicéndo, post tantum témporis, sicut supra dictum est: Hódie si vocem eius audiéritis, nolíte obduráre corda vestra.'
  "8": Nam si eis Iesus réquiem præstitísset, numquam de ália loquerétur, posthac, die.
  "9": Itaque relínquitur sabbatísmus pópulo Dei.
  "10": Qui enim ingréssus est in réquiem eius, étiam ipse requiévit ab opéribus suis, sicut a suis Deus.
  "11": 'Festinémus ergo íngredi in illam réquiem: ut ne in idípsum quis íncidat incredulitátis exémplum.'
  "12": 'Vivus est enim sermo Dei, et éfficax, et penetrabílior omni gládio ancípiti: et pertíngens usque ad divisiónem ánimæ ac spíritus, compágum quoque ac medullárum, et discrétor cogitatiónum et intentiónum cordis.'
  "13": 'Et non est ulla creatúra invisíbilis in conspéctu eius: ómnia autem nuda et apérta sunt óculis eius, ad quem nobis sermo.'
  "14": Habéntes ergo pontíficem magnum, qui penetrávit cælos, Iesum Fílium Dei, teneámus confessiónem.
  "15": 'Non enim habémus pontíficem, qui non possit cómpati infirmitátibus nostris: tentátum autem per ómnia pro similitúdine absque peccáto.'
  "16": 'Adeámus ergo cum fidúcia ad thronum grátiæ: ut misericórdiam consequámur, et grátiam inveniámus in auxílio opportúno.'
