bible: vulgate
lang: la
language: Latina
book: I Regum
chapter: "17"
verses:
  "1": 'Et dixit Elías Thesbítes de habitatóribus Gálaad ad Achab: Vivit Dóminus Deus Israel, in cuius conspéctu sto, si erit annis his ros et plúvia, nisi iuxta oris mei verba.'
  "2": 'Et factum est verbum Dómini ad eum, dicens:'
  "3": Recéde hinc, et vade contra oriéntem, et abscóndere in torrénte Carith, qui est contra Iordánem,
  "4": 'et ibi de torrénte bibes: corvísque præcépi ut pascant te ibi.'
  "5": 'Abiit ergo, et fecit iuxta verbum Dómini: cumque abiísset, sedit in torrénte Carith, qui est contra Iordánem.'
  "6": Corvi quoque deferébant ei panem et carnes mane, simíliter panem et carnes vésperi, et bibébat de torrénte.
  "7": 'Post dies autem siccátus est torrens: non enim plúerat super terram.'
  "8": 'Factus est ergo sermo Dómini ad eum, dicens:'
  "9": 'Surge, et vade in Saréphta Sidoniórum, et manébis ibi: præcépi enim ibi mulíeri víduæ ut pascat te.'
  "10": 'Surréxit, et ábiit in Saréphta. Cumque venísset ad portam civitátis, appáruit ei múlier vídua cólligens ligna, et vocávit eam, dixítque ei: Da mihi páululum aquæ in vase ut bibam.'
  "11": 'Cumque illa pérgeret ut afférret, clamávit post tergum eius, dicens: Affer mihi, óbsecro, et buccéllam panis in manu tua.'
  "12": 'Quæ respóndit: Vivit Dóminus Deus tuus, quia non hábeo panem, nisi quantum pugíllus cápere potest farínæ in hýdria, et páululum ólei in lécytho: en cólligo duo ligna ut ingrédiar et fáciam illum mihi et fílio meo, ut comedámus, et moriámur.'
  "13": 'Ad quam Elías ait: Noli timére, sed vade, et fac sicut dixísti: verúmtamen mihi primum fac de ipsa farínula subcinerícium panem párvulum, et affer ad me: tibi autem et fílio tuo fácies póstea.'
  "14": 'Hæc autem dicit Dóminus Deus Israel: Hýdria farínæ non defíciet, nec lécythus ólei minuétur, usque ad diem in qua Dóminus datúrus est plúviam super fáciem terræ.'
  "15": 'Quæ ábiit, et fecit iuxta verbum Elíæ: et comédit ipse, et illa, et domus eius: et ex illa die'
  "16": hýdria farínæ non defécit, et lécythus ólei non est imminútus, iuxta verbum Dómini, quod locútus fúerat in manu Elíæ.
  "17": Factum est autem post hæc, ægrotávit fílius mulíeris matrisfamílias, et erat languor fortíssimus, ita ut non remanéret in eo hálitus.
  "18": 'Dixit ergo ad Elíam: Quid mihi et tibi vir Dei? ingréssus es ad me, ut rememoraréntur iniquitátes meæ, et interfíceres fílium meum?'
  "19": 'Et ait ad eam Elías: Da mihi fílium tuum. Tulítque eum de sinu eius, et portávit in cœnáculum ubi ipse manébat, et pósuit super léctulum suum.'
  "20": 'Et clamávit ad Dóminum, et dixit: Dómine Deus meus, etiámne víduam, apud quam ego utcúmque susténtor, afflixísti ut interfíceres fílium eius?'
  "21": 'Et expándit se, atque mensus est super púerum tribus vícibus, et clamávit ad Dóminum, et ait: Dómine Deus meus, revertátur, óbsecro, ánima púeri huius in víscera eius.'
  "22": 'Et exaudívit Dóminus vocem Elíæ: et revérsa est ánima púeri intra eum, et revíxit.'
  "23": 'Tulítque Elías púerum, et depósuit eum de cœnáculo in inferiórem domum, et trádidit matri suæ, et ait illi: En vivit fílius tuus.'
  "24": 'Dixítque múlier ad Elíam: Nunc in isto cognóvi quóniam vir Dei es tu, et verbum Dómini in ore tuo verum est.'
