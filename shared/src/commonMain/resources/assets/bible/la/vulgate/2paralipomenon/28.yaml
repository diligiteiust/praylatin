bible: vulgate
lang: la
language: Latina
book: II Paralipomenon
chapter: "28"
verses:
  "1": 'Vigínti annórum erat Achaz cum regnáre cœpísset, et sédecim annis regnávit in Ierúsalem. Non fecit rectum in conspéctu Dómini sicut David pater eius:'
  "2": sed ambulávit in viis regum Israel, ínsuper et státuas fudit Báalim.
  "3": Ipse est, qui adolévit incénsum in valle Benénnom, et lustrávit fílios suos in igne, iuxta ritum géntium, quas interfécit Dóminus in advéntu filiórum Israel.
  "4": Sacrificábat quoque, et thymiáma succendébat in excélsis, et in cóllibus, et sub omni ligno frondóso.
  "5": 'Tradidítque eum Dóminus Deus eius in manu regis Sýriæ, qui percússit eum, magnámque prædam cepit de eius império, et addúxit in Damáscum: mánibus quoque regis Israel tráditus est, et percússus plaga grandi.'
  "6": 'Occidítque Phácee fílius Romelíæ de Iuda centum vigínti míllia in die uno, omnes viros bellatóres: eo quod reliquíssent Dóminum Deum patrum suórum.'
  "7": Eódem témpore occídit Zechri, vir potens ex Ephraim, Maasíam fílium regis, et Ezricam ducem domus eius, Elcanam quoque secúndum a rege.
  "8": 'Ceperúntque fílii Israel de frátribus suis ducénta míllia mulíerum, puerórum, et puellárum, et infinítam prædam: pertulerúntque eam in Samaríam.'
  "9": 'Ea tempestáte erat ibi prophéta Dómini, nómine Oded: qui egréssus óbviam exercítui veniénti in Samaríam, dixit eis: Ecce irátus Dóminus Deus patrum vestrórum contra Iuda, trádidit eos in mánibus vestris, et occidístis eos atróciter, ita ut ad cælum pertíngeret vestra crudélitas.'
  "10": 'Insuper fílios Iuda et Ierúsalem vultis vobis subícere in servos et ancíllas: quod nequáquam facto opus est: peccástis enim super hoc Dómino Deo vestro.'
  "11": Sed audíte consílium meum, et redúcite captívos, quos adduxístis de frátribus vestris, quia magnus furor Dómini ímminet vobis.
  "12": Stetérunt ítaque viri de princípibus filiórum Ephraim, Azarías fílius Ióhanan, Barachías fílius Mosóllamoth, Ezechías fílius Sellum, et Amasa fílius Adali, contra eos, qui veniébant de prœ́lio,
  "13": 'et dixérunt eis: Non introducétis huc captívos, ne peccémus Dómino. Quare vultis adícere super peccáta nostra, et vétera cumuláre delícta? grande quippe peccátum est, et ira furóris Dómini ímminet super Israel.'
  "14": Dimiserúntque viri bellatóres prædam, et univérsa quæ céperant, coram princípibus, et omni multitúdine.
  "15": 'Steterúntque viri, quos supra memorávimus, et apprehendéntes captívos, omnésque qui nudi erant, vestiérunt de spóliis: cumque vestíssent eos, et calceássent, et refecíssent cibo ac potu, unxisséntque propter labórem, et adhibuíssent eis curam: quicúmque ambuláre non póterant, et erant imbecíllo córpore, imposuérunt eos iuméntis, et adduxérunt Iéricho civitátem palmárum ad fratres eórum, ipsíque revérsi sunt in Samaríam.'
  "16": Témpore illo misit rex Achaz ad regem Assyriórum, póstulans auxílium.
  "17": Venerúntque Idumǽi, et percussérunt multos ex Iuda, et cepérunt prædam magnam.
  "18": 'Philísthiim quoque diffúsi sunt per urbes campéstres, et ad merídiem Iuda: ceperúntque Béthsames, et Aialon, et Gáderoth, Socho quoque, et Thamnan, et Gamzo, cum vículis suis, et habitavérunt in eis.'
  "19": Humiliáverat enim Dóminus Iudam propter Achaz regem Iuda, eo quod nudásset eum auxílio, et contémptui habuísset Dóminum.
  "20": Adduxítque contra eum Thelgathphálnasar regem Assyriórum, qui et afflíxit eum, et nullo resisténte vastávit.
  "21": Igitur Achaz, spoliáta domo Dómini, et domo regum ac príncipum, dedit regi Assyriórum múnera, et tamen nihil ei prófuit.
  "22": Insuper et témpore angústiæ suæ auxit contémptum in Dóminum, ipse per se rex Achaz,
  "23": 'immolávit diis Damásci víctimas percussóribus suis, et dixit: Dii regum Sýriæ auxiliántur eis, quos ego placábo hóstiis, et áderunt mihi, cum e contrário ipsi fúerint ruínæ ei, et univérso Israel.'
  "24": Diréptis ítaque Achaz ómnibus vasis domus Dei, atque confráctis, clausit iánuas templi Dei, et fecit sibi altária in univérsis ángulis Ierúsalem.
  "25": In ómnibus quoque úrbibus Iuda exstrúxit aras ad cremándum thus, atque ad iracúndiam provocávit Dóminum Deum patrum suórum.
  "26": Réliqua autem sermónum eius, et ómnium óperum suórum priórum et novissimórum, scripta sunt in Libro regum Iuda et Israel.
  "27": 'Dormivítque Achaz cum pátribus suis, et sepeliérunt eum in civitáte Ierúsalem: neque enim recepérunt eum in sepúlcra regum Israel. Regnavítque Ezechías fílius eius pro eo.'
