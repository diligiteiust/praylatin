bible: vulgate
lang: la
language: Latina
book: Iudicum
chapter: "5"
verses:
  "1": 'Cecinerúntque Débbora et Barac fílius Abínoem in illo die, dicéntes:'
  "2": Qui sponte obtulístis de Israel ánimas vestras ad perículum, benedícite Dómino.
  "3": 'Audíte reges, áuribus percípite príncipes: ego sum, ego sum quæ Dómino canam, psallam Dómino Deo Israel.'
  "4": Dómine cum exíres de Seir, et transíres per regiónes Edom, terra mota est, cælíque ac nubes distillavérunt aquis.
  "5": Montes fluxérunt a fácie Dómini, et Sínai a fácie Dómini Dei Israel.
  "6": 'In diébus Samgar fílii Anath, in diébus Iahel quievérunt sémitæ: et qui ingrediebántur per eas, ambulavérunt per calles dévios.'
  "7": 'Cessavérunt fortes in Israel, et quievérunt: donec súrgeret Débbora, súrgeret mater in Israel.'
  "8": 'Nova bella elégit Dóminus, et portas hóstium ipse subvértit: clýpeus et hasta si apparúerint in quadragínta míllibus Israel.'
  "9": 'Cor meum díligit príncipes Israel: qui própria voluntáte obtulístis vos discrímini, benedícite Dómino.'
  "10": Qui ascénditis super niténtes ásinos, et sedétis in iudício, et ambulátis in via, loquímini.
  "11": 'Ubi collísi sunt currus, et hóstium suffocátus est exércitus, ibi narréntur iustítiæ Dómini, et cleméntia in fortes Israel: tunc descéndit pópulus Dómini ad portas, et obtínuit principátum.'
  "12": 'Surge, surge Débbora, surge, surge, et lóquere cánticum: surge Barac, et apprehénde captívos tuos fili Abínoem.'
  "13": 'Salvátæ sunt relíquiæ pópuli: Dóminus in fórtibus dimicávit.'
  "14": 'Ex Ephraim delévit eos in Amalec, et post eum ex Béniamin in pópulos tuos, o Amalec: de Machir príncipes descendérunt, et de Zábulon qui exércitum dúcerent ad bellándum.'
  "15": 'Duces Issachar fuére cum Débbora, et Barac vestígia sunt secúti, qui quasi in præceps ac bárathrum se discrímini dedit: divíso contra se Ruben, magnanimórum repérta est conténtio.'
  "16": Quare hábitas inter duos términos, ut áudias síbilos gregum? divíso contra se Ruben, magnanimórum repérta est conténtio.
  "17": 'Gálaad trans Iordánem quiescébat, et Dan vacábat návibus: Aser habitábat in líttore maris, et in pórtubus morabátur.'
  "18": Zábulon vero et Néphthali obtulérunt ánimas suas morti in regióne Meróme.
  "19": 'Venérunt reges et pugnavérunt: pugnavérunt reges Chánaan in Thanach iuxta aquas Magéddo, et tamen nihil tulére prædántes.'
  "20": 'De cælo dimicátum est contra eos: stellæ manéntes in órdine et cursu suo, advérsus Sísaram pugnavérunt.'
  "21": 'Torrens Cison traxit cadávera eórum, torrens Cádumim, torrens Cison: concúlca ánima mea robústos.'
  "22": Ungulæ equórum cecidérunt, fugiéntibus ímpetu, et per præceps ruéntibus fortíssimis hóstium.
  "23": 'Maledícite terræ Meroz, dixit ángelus Dómini: maledícite habitatóribus eius, quia non venérunt ad auxílium Dómini, in adiutórium fortissimórum eius.'
  "24": Benedícta inter mulíeres Iahel uxor Haber Cinǽi, et benedicátur in tabernáculo suo.
  "25": Aquam peténti lac dedit, et in phíala príncipum óbtulit butýrum.
  "26": Sinístram manum misit ad clavum, et déxteram ad fabrórum málleos, percussítque Sísaram quærens in cápite vúlneri locum, et tempus válide pérforans.
  "27": 'Inter pedes eius ruit: defécit, et mórtuus est: volvebátur ante pedes eius, et iacébat exánimis et miserábilis.'
  "28": 'Per fenéstram respíciens, ululábat mater eius: et de cœnáculo loquebátur: Cur morátur régredi currus eius? quare tardavérunt pedes quadrigárum illíus?'
  "29": 'Una sapiéntior céteris uxóribus eius, hæc sócrui verba respóndit:'
  "30": 'Fórsitan nunc dívidit spólia, et pulchérrima feminárum elígitur ei: vestes diversórum Sísaræ tradúntur in prædam, et supéllex vária ad ornánda colla congéritur.'
  "31": 'Sic péreant omnes inimíci tui Dómine: qui autem díligunt te, sicut sol in ortu suo splendet, ita rútilent.'
  "32": Quievítque terra per quadragínta annos.
