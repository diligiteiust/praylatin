bible: vulgate
lang: la
language: Latina
book: Ecclesiastes
chapter: "9"
verses:
  "1": 'Omnia hæc tractávi in corde meo, ut curióse intellígerem. Sunt iusti atque sapiéntes, et ópera eórum in manu Dei: et tamen nescit homo utrum amóre, an ódio dignus sit:'
  "2": 'sed ómnia in futúrum servántur incérta, eo quod univérsa æque evéniant iusto et ímpio, bono et malo, mundo et immúndo, immolánti víctimas et sacrifícia contemnénti. Sicut bonus, sic et peccátor: ut periúrus, ita et ille qui verum déierat.'
  "3": 'Hoc est péssimum inter ómnia, quæ sub sole fiunt: quia éadem cunctis evéniunt. Unde et corda filiórum hóminum impléntur malítia, et contémptu in vita sua, et post hæc ad ínferos deducéntur.'
  "4": 'Nemo est qui semper vivat, et qui huius rei hábeat fidúciam: mélior est canis vivus leóne mórtuo.'
  "5": 'Vivéntes enim sciunt se esse moritúros: mórtui vero nihil novérunt ámplius, nec habent ultra mercédem, quia oblivióni trádita est memória eórum.'
  "6": 'Amor quoque, et ódium, et invídiæ simul periérunt: nec habent partem in hoc sǽculo, et in ópere, quod sub sole géritur.'
  "7": Vade ergo, et cómede in lætítia panem tuum, et bibe cum gáudio vinum tuum, quia Deo placent ópera tua.
  "8": Omni témpore sint vestiménta tua cándida, et óleum de cápite tuo non defíciat.
  "9": 'Perfrúere vita cum uxóre, quam díligis, cunctis diébus vitæ instabilitátis tuæ, qui dati sunt tibi sub sole omni témpore vanitátis tuæ: hæc est enim pars in vita, et in labóre tuo, quo labóras sub sole.'
  "10": Quodcúmque fácere potest manus tua, instánter operáre, quia nec opus, nec rátio, nec sapiéntia, nec sciéntia erunt apud ínferos, quo tu próperas.
  "11": 'Verti me ad áliud, et vidi sub sole nec velócium esse cursum, nec fórtium bellum, nec sapiéntium panem, nec doctórum divítias, nec artíficum grátiam: sed tempus casúmque in ómnibus.'
  "12": 'Nescit homo finem suum: sed sicut pisces capiúntur hamo, et sicut aves láqueo comprehendúntur, sic capiúntur hómines in témpore malo, cum eis extémplo supervénerit.'
  "13": 'Hanc quoque sub sole vidi sapiéntiam, et probávi máximam:'
  "14": 'cívitas parva, et pauci in ea viri: venit contra eam rex magnus, et vallávit eam, exstruxítque munitiónes per gyrum, et perfécta est obsídio.'
  "15": 'Inventúsque est in ea vir pauper et sápiens, et liberávit urbem per sapiéntiam suam: et nullus deínceps recordátus est hóminis illíus páuperis.'
  "16": 'Et dicébam ego, meliórem esse sapiéntiam fortitúdine: quómodo ergo sapiéntia páuperis contémpta est, et verba eius non sunt audíta?'
  "17": Verba sapiéntium audiúntur in siléntio, plus quam clamor príncipis inter stultos.
  "18": 'Mélior est sapiéntia, quam arma béllica: et qui in uno peccáverit, multa bona perdet.'
