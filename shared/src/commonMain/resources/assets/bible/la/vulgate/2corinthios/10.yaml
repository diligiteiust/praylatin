bible: vulgate
lang: la
language: Latina
book: ad Corinthios II
chapter: "10"
verses:
  "1": Ipse autem ego Paulus óbsecro vos per mansuetúdinem, et modéstiam Christi, qui in fácie quidem húmilis sum inter vos, absens autem confído in vobis.
  "2": Rogo autem vos ne præsens áudeam per eam confidéntiam, qua exístimor audére in quosdam, qui arbitrántur nos tamquam secúndum carnem ambulémus.
  "3": In carne enim ambulántes, non secúndum carnem militámus.
  "4": Nam arma milítiæ nostræ non carnália sunt, sed poténtia Deo ad destructiónem munitiónum, consília destruéntes,
  "5": et omnem altitúdinem extolléntem se advérsus sciéntiam Dei, et in captivitátem redigéntes omnem intelléctum in obséquium Christi,
  "6": et in promptu habéntes ulcísci omnem inobediéntiam, cum impléta fúerit vestra obediéntia.
  "7": 'Quæ secúndum fáciem sunt, vidéte. Si quis confídit sibi Christi se esse, hoc cógitet íterum apud se: quia sicut ipse Christi est, ita et nos.'
  "8": Nam etsi ámplius áliquid gloriátus fúero de potestáte nostra, quam dedit nobis Dóminus in ædificatiónem, et non in destructiónem vestram, non erubéscam.
  "9": 'Ut autem non exístimer tamquam terrére vos per epístolas:'
  "10": 'quóniam quidem epístolæ, ínquiunt, graves sunt et fortes: præséntia autem córporis infírma, et sermo contemptíbilis:'
  "11": hoc cógitet qui eiúsmodi est, quia quales sumus verbo per epístolas abséntes, tales et præséntes in facto.
  "12": 'Non enim audémus insérere, aut comparáre nos quibúsdam, qui seípsos comméndant: sed ipsi in nobis nosmetípsos metiéntes, et comparántes nosmetípsos nobis.'
  "13": Nos autem non in imménsum gloriábimur, sed secúndum mensúram régulæ, qua mensus est nobis Deus, mensúram pertingéndi usque ad vos.
  "14": 'Non enim quasi non pertingéntes ad vos, superexténdimus nos: usque ad vos enim pervénimus in Evangélio Christi.'
  "15": 'Non in imménsum gloriántes in aliénis labóribus: spem autem habéntes crescéntis fídei vestræ, in vobis magnificári secúndum régulam nostram in abundántiam,'
  "16": étiam in illa, quæ ultra vos sunt, evangelizáre, non in aliéna régula in iis quæ præparáta sunt gloriári.
  "17": Qui autem gloriátur, in Dómino gloriétur.
  "18": 'Non enim qui seípsum comméndat, ille probátus est: sed quem Deus comméndat.'
