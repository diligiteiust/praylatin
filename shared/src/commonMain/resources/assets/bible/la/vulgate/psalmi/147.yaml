bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "147"
verses:
  "1": 'Allelúia. Lauda Ierúsalem Dóminum: lauda Deum tuum Sion.'
  "2": 'Quóniam confortávit seras portárum tuárum: benedíxit fíliis tuis in te.'
  "3": 'Qui pósuit fines tuos pacem: et ádipe fruménti sátiat te.'
  "4": 'Qui emíttit elóquium suum terræ: velóciter currit sermo eius.'
  "5": 'Qui dat nivem sicut lanam: nébulam sicut cínerem spargit.'
  "6": 'Mittit crystállum suam sicut buccéllas: ante fáciem frígoris eius quis sustinébit?'
  "7": 'Emíttet verbum suum, et liquefáciet ea: flabit spíritus eius, et fluent aquæ.'
  "8": 'Qui annúntiat verbum suum Iacob: iustítias et iudícia sua Israel.'
  "9": 'Non fecit táliter omni natióni: et iudícia sua non manifestávit eis. Allelúia.'
