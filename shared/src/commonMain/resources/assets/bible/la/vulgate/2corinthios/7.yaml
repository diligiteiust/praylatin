bible: vulgate
lang: la
language: Latina
book: ad Corinthios II
chapter: "7"
verses:
  "1": Has ergo habéntes promissiónes, caríssimi, mundémus nos ab omni inquinaménto carnis et spíritus, perficiéntes sanctificatiónem in timóre Dei.
  "2": Cápite nos. Néminem lǽsimus, néminem corrúpimus, néminem circumvénimus.
  "3": 'Non ad condemnatiónem vestram dico: prædíximus enim quod in córdibus nostris estis ad commoriéndum, et ad convivéndum.'
  "4": 'Multa mihi fidúcia est apud vos, multa mihi gloriátio pro vobis: replétus sum consolatióne: superabúndo gáudio in omni tribulatióne nostra.'
  "5": 'Nam et cum venissémus in Macedóniam, nullam réquiem hábuit caro nostra, sed omnem tribulatiónem passi sumus: foris pugnæ, intus timóres.'
  "6": Sed qui consolátur húmiles, consolátus est nos Deus in advéntu Titi.
  "7": Non solum autem in advéntu eius, sed étiam in consolatióne, qua consolátus est in vobis, réferens nobis vestrum desidérium, vestrum fletum, vestram æmulatiónem pro me, ita ut magis gaudérem.
  "8": 'Quóniam etsi contristávi vos in epístola, non me pœ́nitet: etsi pœnitéret, videns quod epístola illa (etsi ad horam) vos contristávit,'
  "9": 'nunc gáudeo: non quia contristáti estis, sed quia contristáti estis ad pœniténtiam. Contristáti enim estis ad Deum, ut in nullo detriméntum patiámini ex nobis.'
  "10": 'Quæ enim secúndum Deum tristítia est, pœniténtiam in salútem stábilem operátur: sǽculi autem tristítia mortem operátur.'
  "11": 'Ecce enim hoc ipsum, secúndum Deum contristári vos, quantam in vobis operátur sollicitúdinem: sed defensiónem, sed indignatiónem, sed timórem, sed desidérium, sed æmulatiónem, sed vindíctam: in ómnibus exhibuístis vos, incontaminátos esse negótio.'
  "12": 'Igitur, etsi scripsi vobis, non propter eum, qui fecit iniúriam, nec propter eum, qui passus est: sed ad manifestándam sollicitúdinem nostram, quam habémus pro vobis'
  "13": 'coram Deo: ídeo consoláti sumus. In consolatióne autem nostra, abundántius magis gavísi sumus super gáudio Titi, quia reféctus est spíritus eius ab ómnibus vobis.'
  "14": 'Et si quid apud illum de vobis gloriátus sum, non sum confúsus: sed sicut ómnia vobis in veritáte locúti sumus, ita et gloriátio nostra, quæ fuit ad Titum, véritas facta est,'
  "15": 'et víscera eius abundántius in vobis sunt, reminiscéntis ómnium vestrum obediéntiam: quómodo cum timóre, et tremóre excepístis illum.'
  "16": Gáudeo quod in ómnibus confído in vobis.
