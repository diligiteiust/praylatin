bible: vulgate
lang: la
language: Latina
book: Ioannes
chapter: "3"
verses:
  "1": Erat autem homo ex Pharisǽis, Nicodémus nómine, princeps Iudæórum.
  "2": 'Hic venit ad Iesum nocte, et dixit ei: Rabbi, scimus quia a Deo venísti magíster, nemo enim potest hæc signa fácere, quæ tu facis, nisi fúerit Deus cum eo.'
  "3": 'Respóndit Iesus, et dixit ei: Amen, amen dico tibi, nisi quis renátus fúerit dénuo, non potest vidére regnum Dei.'
  "4": 'Dicit ad eum Nicodémus: Quómodo potest homo nasci, cum sit senex? numquid potest in ventrem matris suæ iteráto introíre, et renásci?'
  "5": 'Respóndit Iesus: Amen, amen dico tibi, nisi quis renátus fúerit ex aqua, et Spíritu sancto, non potest introíre in regnum Dei.'
  "6": 'Quod natum est ex carne, caro est: et quod natum est ex spíritu, spíritus est.'
  "7": 'Non miréris quia dixi tibi: opórtet vos nasci dénuo.'
  "8": 'Spíritus ubi vult spirat: et vocem eius audis, sed nescis unde véniat, aut quo vadat: sic est omnis, qui natus est ex Spíritu.'
  "9": 'Respóndit Nicodémus, et dixit ei: Quómodo possunt hæc fíeri?'
  "10": 'Respóndit Iesus, et dixit ei: Tu es magíster in Israel, et hæc ignóras?'
  "11": Amen, amen dico tibi, quia quod scimus lóquimur, et quod vídimus testámur, et testimónium nostrum non accípitis.
  "12": 'Si terréna dixi vobis, et non créditis: quómodo, si díxero vobis cæléstia, credétis?'
  "13": Et nemo ascéndit in cælum, nisi qui descéndit de cælo, Fílius hóminis, qui est in cælo.
  "14": 'Et sicut Móyses exaltávit serpéntem in desérto, ita exaltári opórtet Fílium hóminis:'
  "15": ut omnis, qui credit in ipsum, non péreat, sed hábeat vitam ætérnam.
  "16": 'Sic enim Deus diléxit mundum, ut Fílium suum unigénitum daret: ut omnis, qui credit in eum, non péreat, sed hábeat vitam ætérnam.'
  "17": Non enim misit Deus Fílium suum in mundum, ut iúdicet mundum, sed ut salvétur mundus per ipsum.
  "18": 'Qui credit in eum, non iudicátur: qui autem non credit, iam iudicátus est: quia non credit in nómine unigéniti Fílii Dei.'
  "19": 'Hoc est autem iudícium: quia lux venit in mundum, et dilexérunt hómines magis ténebras, quam lucem: erant enim eórum mala ópera.'
  "20": 'Omnis enim, qui male agit, odit lucem, et non venit ad lucem, ut non arguántur ópera eius:'
  "21": qui autem facit veritátem, venit ad lucem, ut manifesténtur ópera eius, quia in Deo sunt facta.
  "22": 'Post hæc venit Iesus, et discípuli eius in terram Iudǽam: et illic demorabátur cum eis, et baptizábat.'
  "23": 'Erat autem et Ioánnes baptízans in Ænnon, iuxta Salim: quia aquæ multæ erant illic, et veniébant, et baptizabántur.'
  "24": Nondum enim missus fúerat Ioánnes in cárcerem.
  "25": Facta est autem quǽstio ex discípulis Ioánnis cum Iudǽis de purificatióne.
  "26": 'Et venérunt ad Ioánnem, et dixérunt ei: Rabbi, qui erat tecum trans Iordánem, cui tu testimónium perhibuísti, ecce hic baptízat, et omnes véniunt ad eum.'
  "27": 'Respóndit Ioánnes, et dixit: Non potest homo accípere quidquam, nisi fúerit ei datum de cælo.'
  "28": 'Ipsi vos mihi testimónium perhibétis, quod díxerim: Non sum ego Christus: sed quia missus sum ante illum.'
  "29": 'Qui habet sponsam, sponsus est: amícus autem sponsi, qui stat, et audit eum, gáudio gaudet propter vocem sponsi. Hoc ergo gáudium meum implétum est.'
  "30": Illum opórtet créscere, me autem mínui.
  "31": Qui desúrsum venit, super omnes est. Qui est de terra, de terra est, et de terra lóquitur. Qui de cælo venit, super omnes est.
  "32": 'Et quod vidit, et audívit, hoc testátur: et testimónium eius nemo áccipit.'
  "33": Qui accépit eius testimónium, signávit quia Deus verax est.
  "34": 'Quem enim misit Deus, verba Dei lóquitur: non enim ad mensúram dat Deus Spíritum.'
  "35": 'Pater díligit Fílium: et ómnia dedit in manu eius.'
  "36": 'Qui credit in Fílium, habet vitam ætérnam: qui autem incrédulus est Fílio, non vidébit vitam, sed ira Dei manet super eum.'
