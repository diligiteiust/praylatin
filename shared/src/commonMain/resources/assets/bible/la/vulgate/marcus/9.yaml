bible: vulgate
lang: la
language: Latina
book: Marcus
chapter: "9"
verses:
  "1": Et post dies sex assúmit Iesus Petrum, et Iacóbum, et Ioánnem, et ducit illos in montem excélsum seórsum solos, et transfigurátus est coram ipsis.
  "2": Et vestiménta eius facta sunt splendéntia, et cándida nimis velut nix, quália fullo non potest super terram cándida fácere.
  "3": 'Et appáruit illis Elías cum Móyse: et erant loquéntes cum Iesu.'
  "4": 'Et respóndens Petrus, ait Iesu: Rabbi, bonum est nos hic esse: et faciámus tria tabernácula, tibi unum, et Móysi unum, et Elíæ unum.'
  "5": 'Non enim sciébat quid díceret: erant enim timóre extérriti.'
  "6": 'Et facta est nubes obúmbrans eos: et venit vox de nube, dicens: Hic est Fílius meus caríssimus: audíte illum.'
  "7": Et statim circumspiciéntes, néminem ámplius vidérunt, nisi Iesum tantum secum.
  "8": 'Et descendéntibus illis de monte, præcépit illis ne cuíquam quæ vidíssent, narrárent: nisi cum Fílius hóminis a mórtuis resurréxerit.'
  "9": 'Et verbum continuérunt apud se: conquiréntes quid esset, cum a mórtuis resurréxerit.'
  "10": 'Et interrogábant eum, dicéntes: Quid ergo dicunt Pharisǽi, et scribæ, quia Elíam opórtet veníre primum?'
  "11": 'Qui respóndens, ait illis: Elías cum vénerit primo, restítuet ómnia: et quómodo scriptum est in Fílium hóminis, ut multa patiátur et contemnátur.'
  "12": Sed dico vobis quia et Elías venit (et fecérunt illi quæcúmque voluérunt) sicut scriptum est de eo.
  "13": Et véniens ad discípulos suos, vidit turbam magnam circa eos, et scribas conquiréntes cum illis.
  "14": Et conféstim omnis pópulus videns Iesum, stupefáctus est, et expavérunt, et accurréntes salutábant eum.
  "15": 'Et interrogávit eos: Quid inter vos conquíritis?'
  "16": 'Et respóndens unus de turba, dixit: Magíster, áttuli fílium meum ad te habéntem spíritum mutum:'
  "17": 'qui ubicúmque eum apprehénderit, allídit illum, et spumat, et stridet déntibus, et aréscit: et dixi discípulis tuis ut eícerent illum, et non potuérunt.'
  "18": 'Qui respóndens eis, dixit: O generátio incrédula, quámdiu apud vos ero? quámdiu vos pátiar? afférte illum ad me.'
  "19": 'Et attulérunt eum. Et cum vidísset eum, statim spíritus conturbávit illum: et elísus in terram, volutabátur spumans.'
  "20": 'Et interrogávit patrem eius: Quantum témporis est ex quo ei hoc áccidit? At ille ait: Ab infántia:'
  "21": 'et frequénter eum in ignem, et in aquas misit ut eum pérderet: sed si quid potes, ádiuva nos, misértus nostri.'
  "22": 'Iesus autem ait illi: Si potes crédere, ómnia possibília sunt credénti.'
  "23": 'Et contínuo exclámans pater púeri, cum lácrymis aiébat: Credo, Dómine: ádiuva incredulitátem meam.'
  "24": 'Et cum vidéret Iesus concurréntem turbam, comminátus est spirítui immúndo, dicens illi: Surde, et mute spíritus, ego præcípio tibi, exi ab eo: et ámplius ne intróeas in eum.'
  "25": 'Et exclámans, et multum discérpens eum, éxiit ab eo, et factus est sicut mórtuus, ita ut multi dícerent: Quia mórtuus est.'
  "26": Iesus autem tenens manum eius, elevávit eum, et surréxit.
  "27": 'Et cum introísset in domum, discípuli eius secréto interrogábant eum: Quare nos non potúimus eícere eum?'
  "28": 'Et dixit illis: Hoc genus in nullo potest exíre, nisi in oratióne, et ieiúnio.'
  "29": 'Et inde profécti prætergrediebántur Galilǽam: nec volébat quemquam scire.'
  "30": 'Docébat autem discípulos suos, et dicébat illis: Quóniam Fílius hóminis tradétur in manus hóminum, et occídent eum, et occísus tértia die resúrget.'
  "31": 'At illi ignorábant verbum: et timébant interrogáre eum.'
  "32": 'Et venérunt Caphárnaum. Qui cum domi essent, interrogábat eos: Quid in via tractabátis?'
  "33": 'At illi tacébant: síquidem in via inter se disputáverant, quis eórum maior esset.'
  "34": 'Et résidens vocávit duódecim, et ait illis: Si quis vult primus esse, erit ómnium novíssimus, et ómnium miníster.'
  "35": 'Et accípiens púerum, státuit eum in médio eórum: quem cum compléxus esset, ait illis:'
  "36": 'Quisquis unum ex huiúsmodi púeris recéperit in nómine meo, me récipit: et quicúmque me suscéperit, non me súscipit, sed eum, qui misit me.'
  "37": 'Respóndit illi Ioánnes, dicens: Magíster, vídimus quemdam in nómine tuo eiciéntem dæmónia, qui non séquitur nos, et prohibúimus eum.'
  "38": 'Iesus autem ait: Nolíte prohibére eum: nemo est enim qui fáciat virtútem in nómine meo, et possit cito male loqui de me:'
  "39": qui enim non est advérsum vos, pro vobis est.
  "40": 'Quisquis enim potum déderit vobis cálicem aquæ in nómine meo, quia Christi estis: amen dico vobis, non perdet mercédem suam.'
  "41": 'Et quisquis scandalizáverit unum ex his pusíllis credéntibus in me: bonum est ei magis si circumdarétur mola asinária collo eius, et in mare mitterétur.'
  "42": 'Et si scandalizáverit te manus tua, abscíde illam: bonum est tibi débilem introíre in vitam, quam duas manus habéntem ire in gehénnam, in ignem inexstinguíbilem:'
  "43": ubi vermis eórum non móritur, et ignis non exstínguitur.
  "44": 'Et si pes tuus te scandalízat, ámputa illum: bonum est tibi claudum introíre in vitam ætérnam, quam duos pedes habéntem mitti in gehénnam ignis inexstinguíbilis:'
  "45": ubi vermis eórum non móritur, et ignis non exstínguitur.
  "46": 'Quod si óculus tuus scandalízat te, éice eum: bonum est tibi luscum introíre in regnum Dei, quam duos óculos habéntem mitti in gehénnam ignis:'
  "47": ubi vermis eórum non móritur, et ignis non exstínguitur.
  "48": Omnis enim igne saliétur, et omnis víctima sale saliétur.
  "49": 'Bonum est sal: quod si sal insúlsum fúerit, in quo illud condiétis? Habéte in vobis sal, et pacem habéte inter vos.'
