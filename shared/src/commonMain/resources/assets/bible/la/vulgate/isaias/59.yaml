bible: vulgate
lang: la
language: Latina
book: Isaias
chapter: "59"
verses:
  "1": 'Ecce non est abbreviáta manus Dómini, ut salváre néqueat, neque aggraváta est auris eius, ut non exáudiat:'
  "2": sed iniquitátes vestræ divisérunt inter vos et Deum vestrum, et peccáta vestra abscondérunt fáciem eius a vobis, ne exaudíret.
  "3": 'Manus enim vestræ pollútæ sunt sánguine, et dígiti vestri iniquitáte: lábia vestra locúta sunt mendácium, et lingua vestra iniquitátem fatur.'
  "4": 'Non est qui ínvocet iustítiam, neque est qui iúdicet vere: sed confídunt in níhilo, et loquúntur vanitátes: concepérunt labórem, et peperérunt iniquitátem.'
  "5": 'Ova áspidum rupérunt, et telas aráneæ texuérunt: qui coméderit de ovis eórum, moriétur: et quod confótum est, erúmpet in régulum.'
  "6": 'Telæ eórum non erunt in vestiméntum, neque operiéntur opéribus suis: ópera eórum ópera inutília, et opus iniquitátis in mánibus eórum.'
  "7": 'Pedes eórum ad malum currunt, et festínant ut effúndant sánguinem innocéntem: cogitatiónes eórum cogitatiónes inútiles: vástitas et contrítio in viis eórum.'
  "8": 'Viam pacis nesciérunt, et non est iudícium in gréssibus eórum: sémitæ eórum incurvátæ sunt eis: omnis qui calcat in eis, ignórat pacem.'
  "9": 'Propter hoc elongátum est iudícium a nobis, et non apprehéndet nos iustítia: exspectávimus lucem, et ecce ténebræ: splendórem, et in ténebris ambulávimus.'
  "10": 'Palpávimus sicut cæci paríetem, et quasi absque óculis attrectávimus: impégimus merídie quasi in ténebris, in caliginósis quasi mórtui.'
  "11": 'Rugiémus quasi ursi omnes, et quasi colúmbæ meditántes gemémus: exspectávimus iudícium, et non est: salútem, et elongáta est a nobis.'
  "12": 'Multiplicátæ sunt enim iniquitátes nostræ coram te, et peccáta nostra respondérunt nobis: quia scélera nostra nobíscum, et iniquitátes nostras cognóvimus,'
  "13": 'peccáre et mentíri contra Dóminum, et avérsi sumus ne irémus post tergum Dei nostri, ut loquerémur calúmniam et transgressiónem: concépimus, et locúti sumus de corde verba mendácii.'
  "14": 'Et convérsum est retrórsum iudícium, et iustítia longe stetit: quia córruit in platéa véritas, et ǽquitas non pótuit íngredi.'
  "15": 'Et facta est véritas in obliviónem: et qui recéssit a malo, prædæ pátuit: et vidit Dóminus, et malum appáruit in óculis eius, quia non est iudícium.'
  "16": 'Et vidit quia non est vir: et aporiátus est, quia non est qui occúrrat: et salvávit sibi bráchium suum, et iustítia eius ipsa confirmávit eum.'
  "17": 'Indútus est iustítia ut loríca, et gálea salútis in cápite eius: indútus est vestiméntis ultiónis, et opértus est quasi pállio zeli.'
  "18": 'Sicut ad vindíctam quasi ad retributiónem indignatiónis hóstibus suis, et vicissitúdinem inimícis suis: ínsulis vicem reddet.'
  "19": 'Et timébunt qui ab occidénte, nomen Dómini: et qui ab ortu solis, glóriam eius: cum vénerit quasi flúvius violéntus, quem spíritus Dómini cogit:'
  "20": et vénerit Sion redémptor, et eis qui rédeunt ab iniquitáte in Iacob, dicit Dóminus.
  "21": 'Hoc fœdus meum cum eis, dicit Dóminus: Spíritus meus, qui est in te, et verba mea, quæ pósui in ore tuo, non recédent de ore tuo, et de ore séminis tui, et de ore séminis séminis tui, dicit Dóminus, ámodo et usque in sempitérnum.'
