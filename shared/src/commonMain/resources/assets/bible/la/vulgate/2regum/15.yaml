bible: vulgate
lang: la
language: Latina
book: II Regum
chapter: "15"
verses:
  "1": Anno vigésimo séptimo Ieróboam regis Israel, regnávit Azarías fílius Amasíæ regis Iuda.
  "2": 'Sédecim annórum erat cum regnáre cœpísset, et quinquagínta duóbus annis regnávit in Ierúsalem: nomen matris eius Iechelía de Ierúsalem.'
  "3": Fecítque quod erat plácitum coram Dómino, iuxta ómnia quæ fecit Amasías pater eius.
  "4": 'Verúmtamen excélsa non est demolítus: adhuc pópulus sacrificábat, et adolébat incénsum in excélsis.'
  "5": 'Percússit autem Dóminus regem, et fuit leprósus usque in diem mortis suæ, et habitábat in domo líbera seórsum: Ióatham vero fílius regis gubernábat palátium, et iudicábat pópulum terræ.'
  "6": Réliqua autem sermónum Azaríæ, et univérsa quæ fecit, nonne hæc scripta sunt in Libro verbórum diérum regum Iuda?
  "7": 'Et dormívit Azarías cum pátribus suis: sepelierúntque eum cum maióribus suis in civitáte David, et regnávit Ióatham fílius eius pro eo.'
  "8": Anno trigésimo octávo Azaríæ regis Iuda, regnávit Zacharías fílius Ieróboam super Israel in Samaría sex ménsibus.
  "9": 'Et fecit quod malum est coram Dómino, sicut fécerant patres eius: non recéssit a peccátis Ieróboam fílii Nabat, qui peccáre fecit Israel.'
  "10": 'Coniurávit autem contra eum Sellum fílius Iabes: percussítque eum palam, et interfécit, regnavítque pro eo.'
  "11": Réliqua autem verbórum Zacharíæ, nonne hæc scripta sunt in Libro sermónum diérum regum Israel?
  "12": 'Iste est sermo Dómini, quem locútus est ad Iehu, dicens: Fílii tui usque ad quartam generatiónem sedébunt super thronum Israel. Factúmque est ita.'
  "13": 'Sellum fílius Iabes regnávit trigésimo nono anno Azaríæ regis Iuda: regnávit autem uno mense in Samaría.'
  "14": Et ascéndit Mánahem fílius Gadi de Thersa, venítque in Samaríam, et percússit Sellum fílium Iabes in Samaría, et interfécit eum, regnavítque pro eo.
  "15": Réliqua autem verbórum Sellum, et coniurátio eius, per quam teténdit insídias, nonne hæc scripta sunt in Libro sermónum diérum regum Israel?
  "16": 'Tunc percússit Mánahem Thapsam, et omnes qui erant in ea, et términos eius de Thersa: nolúerant enim aperíre ei: et interfécit omnes prægnántes eius, et scidit eas.'
  "17": Anno trigésimo nono Azaríæ regis Iuda, regnávit Mánahem fílius Gadi super Israel decem annis in Samaría.
  "18": 'Fecítque quod erat malum coram Dómino: non recéssit a peccátis Ieróboam fílii Nabat, qui peccáre fecit Israel, cunctis diébus eius.'
  "19": Veniébat Phul rex Assyriórum in terram, et dabat Mánahem Phul mille talénta argénti, ut esset ei in auxílium, et firmáret regnum eius.
  "20": 'Indixítque Mánahem argéntum super Israel cunctis poténtibus et divítibus, ut daret regi Assyriórum quinquagínta siclos argénti per síngulos: reversúsque est rex Assyriórum, et non est morátus in terra.'
  "21": Réliqua autem sermónum Mánahem, et univérsa quæ fecit, nonne hæc scripta sunt in Libro sermónum diérum regum Israel?
  "22": 'Et dormívit Mánahem cum pátribus suis: regnavítque Phaceía fílius eius pro eo.'
  "23": Anno quinquagésimo Azaríæ regis Iuda, regnávit Phaceía fílius Mánahem super Israel in Samaría biénnio.
  "24": 'Et fecit quod erat malum coram Dómino: non recéssit a peccátis Ieróboam fílii Nabat, qui peccáre fecit Israel.'
  "25": 'Coniurávit autem advérsus eum Phácee fílius Romelíæ, dux eius, et percússit eum in Samaría in turre domus régiæ, iuxta Argob et iuxta Arie, et cum eo quinquagínta viros de fíliis Galaaditárum: et interfécit eum, regnavítque pro eo.'
  "26": Réliqua autem sermónum Phaceía, et univérsa quæ fecit, nonne hæc scripta sunt in Libro sermónum diérum regum Israel?
  "27": Anno quinquagésimo secúndo Azaríæ regis Iuda, regnávit Phácee fílius Romelíæ super Israel in Samaría vigínti annis.
  "28": 'Et fecit quod erat malum coram Dómino: non recéssit a peccátis Ieróboam fílii Nabat, qui peccáre fecit Israel.'
  "29": 'In diébus Phácee regis Israel, venit Theglathphálasar rex Assur, et cepit Aion, et Abel Domum, Máacha et Iánoe, et Cedes, et Asor, et Gálaad, et Galilǽam, et univérsam terram Néphthali: et tránstulit eos in Assýrios.'
  "30": 'Coniurávit autem, et teténdit insídias Osée fílius Ela contra Phácee fílium Romelíæ, et percússit eum, et interfécit: regnavítque pro eo vigésimo anno Ióatham fílii Ozíæ.'
  "31": Réliqua autem sermónum Phácee, et univérsa quæ fecit, nonne hæc scripta sunt in Libro sermónum diérum regum Israel?
  "32": Anno secúndo Phácee, fílii Romelíæ regis Israel, regnávit Ióatham fílius Ozíæ regis Iuda.
  "33": 'Vigínti quinque annórum erat cum regnáre cœpísset, et sédecim annis regnávit in Ierúsalem: nomen matris eius Iérusa, fília Sadoc.'
  "34": 'Fecítque quod erat plácitum coram Dómino: iuxta ómnia, quæ fécerat Ozías pater suus, operátus est.'
  "35": 'Verúmtamen excélsa non ábstulit: adhuc pópulus immolábat, et adolébat incénsum in excélsis: ipse ædificávit portam domus Dómini sublimíssimam.'
  "36": Réliqua autem sermónum Ióatham, et univérsa quæ fecit, nonne hæc scripta sunt in Libro verbórum diérum regum Iuda?
  "37": In diébus illis cœpit Dóminus míttere in Iudam Rasin regem Sýriæ, et Phácee fílium Romelíæ.
  "38": 'Et dormívit Ióatham cum pátribus suis, sepultúsque est cum eis in civitáte David patris sui: et regnávit Achaz fílius eius pro eo.'
