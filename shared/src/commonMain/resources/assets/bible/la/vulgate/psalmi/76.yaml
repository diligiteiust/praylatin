bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "76"
verses:
  "1": In finem, pro Idithun, Psalmus Asaph.
  "2": 'Voce mea ad Dóminum clamávi: voce mea ad Deum, et inténdit mihi.'
  "3": 'In die tribulatiónis meæ Deum exquisívi, mánibus meis nocte contra eum: et non sum decéptus. Rénuit consolári ánima mea,'
  "4": 'memor fui Dei et delectátus sum, et exercitátus sum: et defécit spíritus meus.'
  "5": 'Anticipavérunt vigílias óculi mei: turbátus sum, et non sum locútus.'
  "6": 'Cogitávi dies antíquos: et annos ætérnos in mente hábui.'
  "7": Et meditátus sum nocte cum corde meo, et exercitábar, et scopébam spíritum meum.
  "8": 'Numquid in ætérnum proíciet Deus: aut non appónet ut complacítior sit adhuc?'
  "9": Aut in finem misericórdiam suam abscíndet, a generatióne in generatiónem?
  "10": Aut obliviscétur miseréri Deus? aut continébit in ira sua misericórdias suas?
  "11": 'Et dixi: Nunc cœpi: hæc mutátio déxteræ Excélsi.'
  "12": 'Memor fui óperum Dómini: quia memor ero ab inítio mirabílium tuórum,'
  "13": 'et meditábor in ómnibus opéribus tuis: et in adinventiónibus tuis exercébor.'
  "14": 'Deus in sancto via tua: quis Deus magnus sicut Deus noster?'
  "15": 'Tu es Deus qui facis mirabília. Notam fecísti in pópulis virtútem tuam:'
  "16": redemísti in bráchio tuo pópulum tuum, fílios Iacob, et Ioseph.
  "17": 'Vidérunt te aquæ Deus, vidérunt te aquæ: et timuérunt, et turbátæ sunt abýssi.'
  "18": 'Multitúdo sónitus aquárum: vocem dedérunt nubes. Etenim sagíttæ tuæ tránseunt:'
  "19": 'vox tonítrui tui in rota. Illuxérunt coruscatiónes tuæ orbi terræ: commóta est et contrémuit terra.'
  "20": 'In mari via tua, et sémitæ tuæ in aquis multis: et vestígia tua non cognoscéntur.'
  "21": Deduxísti sicut oves pópulum tuum, in manu Móysi et Aaron.
