bible: vulgate
lang: la
language: Latina
book: Numeri
chapter: "8"
verses:
  "1": 'Locutúsque est Dóminus ad Móysen, dicens:'
  "2": 'Lóquere Aaron, et dices ad eum: Cum posúeris septem lucérnas, candelábrum in austráli parte erigátur. Hoc ígitur prǽcipe ut lucérnæ contra bóream e regióne respíciant ad mensam panum propositiónis, contra eam partem, quam candelábrum réspicit, lucére debébunt.'
  "3": Fecítque Aaron, et impósuit lucérnas super candelábrum, ut præcéperat Dóminus Móysi.
  "4": 'Hæc autem erat factúra candelábri, ex auro dúctili, tam médius stipes, quam cuncta quæ ex utróque calamórum látere nascebántur: iuxta exémplum quod osténdit Dóminus Móysi, ita operátus est candelábrum.'
  "5": 'Et locútus est Dóminus ad Móysen, dicens:'
  "6": Tolle Levítas de médio filiórum Israel, et purificábis eos
  "7": 'iuxta hunc ritum: Aspergántur aqua lustratiónis, et radant omnes pilos carnis suæ. Cumque láverint vestiménta sua, et mundáti fúerint,'
  "8": 'tollent bovem de arméntis, et libaméntum eius símilam óleo conspérsam: bovem autem álterum de arménto tu accípies pro peccáto:'
  "9": et applicábis Levítas coram tabernáculo fœ́deris, convocáta omni multitúdine filiórum Israel.
  "10": Cumque Levítæ fúerint coram Dómino, ponent fílii Israel manus suas super eos.
  "11": Et ófferet Aaron Levítas, munus in conspéctu Dómini a fíliis Israel, ut sérviant in ministério eius.
  "12": Levítæ quoque ponent manus suas super cápita boum, e quibus unum fácies pro peccáto, et álterum in holocáustum Dómini, ut deprecéris pro eis.
  "13": Statuésque Levítas in conspéctu Aaron et filiórum eius, et consecrábis oblátos Dómino,
  "14": ac separábis de médio filiórum Israel, ut sint mei.
  "15": 'Et póstea ingrediéntur tabernáculum fœ́deris, ut sérviant mihi. Sicque purificábis et consecrábis eos in oblatiónem Dómini: quóniam dono donáti sunt mihi a fíliis Israel.'
  "16": Pro primogénitis quæ apériunt omnem vulvam in Israel, accépi eos.
  "17": 'Mea sunt enim ómnia primogénita filiórum Israel, tam ex homínibus quam ex iuméntis. Ex die quo percússi omne primogénitum in terra Ægýpti, sanctificávi eos mihi:'
  "18": 'et tuli Levítas pro cunctis primogénitis filiórum Israel:'
  "19": tradidíque eos dono Aaron et fíliis eius de médio pópuli, ut sérviant mihi pro Israel in tabernáculo fœ́deris, et orent pro eis ne sit in pópulo plaga, si ausi fúerint accédere ad sanctuárium.
  "20": 'Fecerúntque Móyses et Aaron et omnis multitúdo filiórum Israel super Levítis quæ præcéperat Dóminus Móysi:'
  "21": purificatíque sunt, et lavérunt vestiménta sua. Elevavítque eos Aaron in conspéctu Dómini, et orávit pro eis,
  "22": ut purificáti ingrederéntur ad offícia sua in tabernáculum fœ́deris coram Aaron et fíliis eius. Sicut præcéperat Dóminus Móysi de Levítis, ita factum est.
  "23": 'Locutúsque est Dóminus ad Móysen, dicens:'
  "24": 'Hæc est lex Levitárum: a vigínti quinque annis et supra, ingrediéntur ut minístrent in tabernáculo fœ́deris.'
  "25": 'Cumque quinquagésimum annum ætátis impléverint, servíre cessábunt:'
  "26": 'erúntque minístri fratrum suórum in tabernáculo fœ́deris, ut custódiant quæ sibi fúerint commendáta: ópera autem ipsa non fáciant. Sic dispónes Levítis in custódiis suis.'
