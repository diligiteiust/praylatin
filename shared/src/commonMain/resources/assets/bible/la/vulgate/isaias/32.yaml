bible: vulgate
lang: la
language: Latina
book: Isaias
chapter: "32"
verses:
  "1": Ecce in iustítia regnábit rex, et príncipes in iudício prǽerunt.
  "2": Et erit vir sicut qui abscónditur a vento, et celat se a tempestáte, sicut rivi aquárum in siti, et umbra petræ prominéntis in terra desérta.
  "3": Non caligábunt óculi vidéntium, et aures audiéntium diligénter auscultábunt.
  "4": Et cor stultórum intélliget sciéntiam, et lingua balbórum velóciter loquétur et plane.
  "5": 'Non vocábitur ultra is, qui insípiens est, princeps: neque frauduléntus appellábitur maior:'
  "6": stultus enim fátua loquétur, et cor eius fáciet iniquitátem, ut perfíciat simulatiónem, et loquátur ad Dóminum fraudulénter, et vácuam fáciat ánimam esuriéntis, et potum sitiénti áuferat.
  "7": 'Fraudulénti vasa péssima sunt: ipse enim cogitatiónes concinnávit ad perdéndos mites in sermóne mendácii, cum loquerétur pauper iudícium.'
  "8": Princeps vero ea, quæ digna sunt príncipe, cogitábit, et ipse super duces stabit.
  "9": 'Mulíeres opuléntæ súrgite, et audíte vocem meam: fíliæ confidéntes percípite áuribus elóquium meum.'
  "10": 'Post dies enim et annum, vos conturbabímini confidéntes: consummáta est enim vindémia, colléctio ultra non véniet.'
  "11": 'Obstupéscite opuléntæ, conturbámini confidéntes: exúite vos, et confundímini, accíngite lumbos vestros.'
  "12": Super úbera plángite, super regióne desiderábili, super vínea fértili.
  "13": 'Super humum pópuli mei spinæ et vepres ascéndent: quanto magis super omnes domos gáudii civitátis exsultántis?'
  "14": Domus enim dimíssa est, multitúdo urbis relícta est, ténebræ et palpátio factæ sunt super spelúncas usque in ætérnum. Gáudium onagrórum páscua gregum,
  "15": 'donec effundátur super nos spíritus de excélso: et erit desértum in charmel, et charmel in saltum reputábitur.'
  "16": Et habitábit in solitúdine iudícium, et iustítia in charmel sedébit.
  "17": Et erit opus iustítiæ pax, et cultus iustítiæ siléntium, et secúritas usque in sempitérnum.
  "18": Et sedébit pópulus meus in pulchritúdine pacis, et in tabernáculis fidúciæ, et in réquie opulénta.
  "19": Grando autem in descensióne saltus, et humilitáte humiliábitur cívitas.
  "20": Beáti, qui seminátis super omnes aquas, immitténtes pedem bovis et ásini.
