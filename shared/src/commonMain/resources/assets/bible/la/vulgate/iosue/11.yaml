bible: vulgate
lang: la
language: Latina
book: Iosue
chapter: "11"
verses:
  "1": 'Quæ cum audísset Iabin rex Asor, misit ad Iobab regem Madon, et ad regem Sémeron, atque ad regem Achsaph:'
  "2": 'ad reges quoque aquilónis, qui habitábant in montánis et in planítie contra merídiem Céneroth, in campéstribus quoque et in regiónibus Dor iuxta mare:'
  "3": 'Chananǽum quoque ab oriénte et occidénte, et Amorrhǽum atque Hethǽum ac Pherezǽum et Iebusǽum in montánis: Hevǽum quoque qui habitábat ad radíces Hermon in terra Maspha.'
  "4": Egressíque sunt omnes cum turmis suis, pópulus multus nimis sicut aréna, quæ est in líttore maris, equi quoque et currus imménsæ multitúdinis.
  "5": Convenerúntque omnes reges isti in unum ad Aquas Merom, ut pugnárent contra Israel.
  "6": 'Dixítque Dóminus ad Iósue: Ne tímeas eos: cras enim hac eádem hora ego tradam omnes istos vulnerándos in conspéctu Israel: equos eórum subnervábis, et currus igne combúres.'
  "7": Venítque Iósue, et omnis exércitus cum eo, advérsus illos ad Aquas Merom súbito, et irruérunt super eos,
  "8": 'tradidítque illos Dóminus in manus Israel. Qui percussérunt eos, et persecúti sunt usque ad Sidónem magnam, et aquas Masérephoth, campúmque Masphe, qui est ad orientálem illíus partem. Ita percússit omnes, ut nullas dimítteret ex eis relíquias:'
  "9": 'fecítque sicut præcéperat ei Dóminus: equos eórum subnervávit, currúsque combússit igni.'
  "10": 'Reversúsque statim cepit Asor: et regem eius percússit gládio. Asor enim antíquitus inter ómnia regna hæc principátum tenébat.'
  "11": 'Percussítque omnes ánimas, quæ ibídem morabántur: non dimísit in ea ullas relíquias, sed usque ad interneciónem univérsa vastávit, ipsámque urbem perémit incéndio.'
  "12": Et omnes per circúitum civitátes, regésque eárum, cepit, percússit atque delévit, sicut præcéperat ei Móyses fámulus Dómini.
  "13": 'Absque úrbibus, quæ erant in cóllibus et in túmulis sitæ, céteras succéndit Israel: unam tantum Asor munitíssimam flamma consúmpsit.'
  "14": Omnémque prædam istárum úrbium ac iuménta divisérunt sibi fílii Israel, cunctis homínibus interféctis.
  "15": 'Sicut præcéperat Dóminus Móysi servo suo, ita præcépit Móyses Iósue, et ille univérsa complévit: non prætériit de univérsis mandátis, nec unum quidem verbum quod iússerat Dóminus Móysi.'
  "16": 'Cepit ítaque Iósue omnem terram montánam, et meridiánam, terrámque Gosen, et planítiem, et occidentálem plagam, montémque Israel, et campéstria eius:'
  "17": 'et partem montis, quæ ascéndit Seir usque Baálgad, per planítiem Líbani subter montem Hermon: omnes reges eórum cepit, percússit, et occídit.'
  "18": Multo témpore pugnávit Iósue contra reges istos.
  "19": 'Non fuit cívitas quæ se tráderet fíliis Israel, præter Hevǽum, qui habitábat in Gábaon: omnes enim bellándo cepit.'
  "20": Dómini enim senténtia fúerat, ut induraréntur corda eórum, et pugnárent contra Israel, et cáderent, et non mereréntur ullam cleméntiam, ac perírent, sicut præcéperat Dóminus Móysi.
  "21": In illo témpore venit Iósue, et interfécit Enacim de montánis, Hebron, et Dabir, et Anab, et de omni monte Iuda et Israel, urbésque eórum delévit.
  "22": 'Non relíquit ullum de stirpe Enacim, in terra filiórum Israel: absque civitátibus Gaza, et Geth, et Azóto, in quibus solis relícti sunt.'
  "23": 'Cepit ergo Iósue omnem terram, sicut locútus est Dóminus ad Móysen, et trádidit eam in possessiónem fíliis Israel secúndum partes et tribus suas: quievítque terra a prœ́liis.'
