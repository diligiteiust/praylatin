bible: vulgate
lang: la
language: Latina
book: Ieremias
chapter: "43"
verses:
  "1": 'Factum est autem, cum complésset Ieremías loquens ad pópulum univérsos sermónes Dómini Dei eórum, pro quibus míserat eum Dóminus Deus eórum ad illos, ómnia verba hæc:'
  "2": 'dixit Azarías fílius Osaíæ, et Ióhanan fílius Carée, et omnes viri supérbi, dicéntes ad Ieremíam: Mendácium tu lóqueris: non misit te Dóminus Deus noster, dicens: Ne ingrediámini Ægýptum ut habitétis illuc.'
  "3": Sed Baruch fílius Neríæ íncitat te advérsum nos, ut tradat nos in manus Chaldæórum, ut interfíciat nos, et tradúci fáciat in Babylónem.
  "4": Et non audívit Ióhanan fílius Carée, et omnes príncipes bellatórum, et univérsus pópulus, vocem Dómini, ut manérent in terra Iuda.
  "5": 'Sed tollens Ióhanan fílius Carée, et univérsi príncipes bellatórum, univérsos reliquiárum Iuda, qui revérsi fúerant de cunctis géntibus, ad quas fúerant ante dispérsi, ut habitárent in terra Iuda:'
  "6": viros, et mulíeres, et párvulos, et fílias regis, et omnem ánimam, quam relíquerat Nabuzárdan princeps milítiæ cum Godolía fílio Ahicam fílii Saphan, et Ieremíam prophétam, et Baruch fílium Neríæ.
  "7": Et ingréssi sunt terram Ægýpti, quia non obediérunt voci Dómini, et venérunt usque ad Taphnis.
  "8": 'Et factus est sermo Dómini ad Ieremíam in Taphnis, dicens:'
  "9": 'Sume lápides grandes in manu tua, et abscóndes eos in crypta, quæ est sub muro laterício in porta domus Pharaónis in Taphnis, cernéntibus viris Iudǽis:'
  "10": 'et dices ad eos: Hæc dicit Dóminus exercítuum, Deus Israel: Ecce ego mittam et assúmam Nabuchodónosor regem Babylónis, servum meum: et ponam thronum eius super lápides istos, quos abscóndi, et státuet sólium suum super eos.'
  "11": 'Veniénsque percútiet terram Ægýpti: quos in mortem, in mortem: et quos in captivitátem, in captivitátem: et quos in gládium, in gládium.'
  "12": 'Et succéndet ignem in delúbris deórum Ægýpti, et combúret ea, et captívos ducet illos: et amiciétur terra Ægýpti sicut amicítur pastor pállio suo, et egrediétur inde in pace.'
  "13": 'Et cónteret státuas domus solis, quæ sunt in terra Ægýpti: et delúbra deórum Ægýpti combúret igni.'
