bible: vulgate
lang: la
language: Latina
book: Iacobi
chapter: "1"
verses:
  "1": Iacóbus, Dei et Dómini nostri Iesu Christi servus, duódecim tríbubus, quæ sunt in dispersióne, salútem.
  "2": 'Omne gáudium existimáte fratres mei, cum in tentatiónes várias incidéritis:'
  "3": sciéntes quod probátio fídei vestræ patiéntiam operátur.
  "4": 'Patiéntia autem opus perféctum habet: ut sitis perfécti et íntegri in nullo deficiéntes.'
  "5": 'Si quis autem vestrum índiget sapiéntia, póstulet a Deo, qui dat ómnibus affluénter, et non impróperat: et dábitur ei.'
  "6": 'Póstulet autem in fide nihil hǽsitans: qui enim hǽsitat, símilis est flúctui maris, qui a vento movétur et circumfértur.'
  "7": Non ergo ǽstimet homo ille quod accípiat áliquid a Dómino.
  "8": Vir duplex ánimo incónstans est in ómnibus viis suis.
  "9": 'Gloriétur autem frater húmilis in exaltatióne sua:'
  "10": 'dives autem in humilitáte sua, quóniam sicut flos fœni transíbit:'
  "11": 'exórtus est enim sol cum ardóre, et arefécit fœnum, et flos eius décidit, et decor vultus eius depériit: ita et dives in itinéribus suis marcéscet.'
  "12": 'Beátus vir, qui suffert tentatiónem: quóniam cum probátus fúerit, accípiet corónam vitæ, quam repromísit Deus diligéntibus se.'
  "13": 'Nemo cum tentátur, dicat quóniam a Deo tentátur: Deus enim intentátor malórum est: ipse autem néminem tentat.'
  "14": Unusquísque vero tentátur a concupiscéntia sua abstráctus, et illéctus.
  "15": 'Deínde concupiscéntia cum concéperit, parit peccátum: peccátum vero cum consummátum fúerit, génerat mortem.'
  "16": Nolíte ítaque erráre fratres mei dilectíssimi.
  "17": Omne datum óptimum, et omne donum perféctum desúrsum est, descéndens a Patre lúminum, apud quem non est transmutátio, nec vicissitúdinis obumbrátio.
  "18": Voluntárie enim génuit nos verbo veritátis, ut simus inítium áliquod creatúræ eius.
  "19": 'Scitis fratres mei dilectíssimi. Sit autem omnis homo velox ad audiéndum: tardus autem ad loquéndum, et tardus ad iram.'
  "20": Ira enim viri iustítiam Dei non operátur.
  "21": Propter quod abiciéntes omnem immundítiam, et abundántiam malítiæ, in mansuetúdine suscípite ínsitum verbum, quod potest salváre ánimas vestras.
  "22": 'Estóte autem factóres verbi, et non auditóres tantum: falléntes vosmetípsos.'
  "23": 'Quia si quis audítor est verbi, et non factor: hic comparábitur viro consideránti vultum nativitátis suæ in spéculo:'
  "24": considerávit enim se, et ábiit, et statim oblítus est qualis fúerit.
  "25": 'Qui autem perspéxerit in legem perféctam libertátis, et permánserit in ea, non audítor obliviósus factus, sed factor óperis: hic beátus in facto suo erit.'
  "26": Si quis autem putat se religiósum esse, non refrénans linguam suam, sed sedúcens cor suum, huius vana est relígio.
  "27": 'Relígio munda, et immaculáta apud Deum et Patrem, hæc est: Visitáre pupíllos, et víduas in tribulatióne eórum, et immaculátum se custodíre ab hoc sǽculo.'
