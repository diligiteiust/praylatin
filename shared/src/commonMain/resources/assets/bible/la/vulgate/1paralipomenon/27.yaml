bible: vulgate
lang: la
language: Latina
book: I Paralipomenon
chapter: "27"
verses:
  "1": Fílii autem Israel secúndum númerum suum, príncipes familiárum, tribúni, et centuriónes, et præfécti, qui ministrábant regi iuxta turmas suas, ingrediéntes et egrediéntes per síngulos menses in anno, vigínti quátuor míllibus sínguli prǽerant.
  "2": Primæ turmæ in primo mense Iésboam prǽerat fílius Zábdiel, et sub eo vigínti quátuor míllia.
  "3": De fíliis Phares, princeps cunctórum príncipum in exércitu mense primo.
  "4": Secúndi mensis habébat turmam Dudía Ahohítes, et post se alter nómine Macélloth, qui regébat partem exércitus vigínti quátuor míllium.
  "5": 'Dux quoque turmæ tértiæ in mense tértio erat Banaías fílius Ióiadæ sacérdos: et in divisióne sua vigínti quátuor míllia.'
  "6": 'Ipse est Banaías fortíssimus inter trigínta, et super trigínta: prǽerat autem turmæ ipsíus Amízabad fílius eius.'
  "7": 'Quartus, mense quarto, Asahel frater Ioab, et Zabadías fílius eius post eum: et in turma eius vigínti quátuor míllia.'
  "8": 'Quintus, mense quinto, princeps Sámaoth Iezerítes: et in turma eius vigínti quátuor míllia.'
  "9": 'Sextus, mense sexto, Hira fílius Acces Thecuítes: et in turma eius vigínti quátuor míllia.'
  "10": 'Séptimus, mense séptimo, Helles Phallonítes de fíliis Ephraim: et in turma eius vigínti quátuor míllia.'
  "11": 'Octávus, mense octávo, Sobóchai Husathítes de stirpe Zárahi: et in turma eius vigínti quátuor míllia.'
  "12": 'Nonus, mense nono, Abiézer Anathothítes de fíliis Iémini: et in turma eius vigínti quátuor míllia.'
  "13": 'Décimus, mense décimo, Márai, et ipse Netophathítes de stirpe Zárai: et in turma eius vigínti quátuor míllia.'
  "14": 'Undécimus, mense undécimo, Banaías Pharathonítes de fíliis Ephraim: et in turma eius vigínti quátuor míllia.'
  "15": 'Duodécimus, mense duodécimo, Hóldai Netophathítes, de stirpe Gothóniel: et in turma eius vigínti quátuor míllia.'
  "16": 'Porro tríbubus prǽerant Israel, Rubenítis, dux Eliézer fílius Zechri: Simeonítis, dux Saphatías fílius Máacha:'
  "17": 'Levítis, Hasabías fílius Cámuel: Aaronítis, Sadoc:'
  "18": 'Iuda, Eliu frater David: Issachar, Amri fílius Míchael:'
  "19": 'Zabulonítis, Iesmaías fílius Abdíæ: Nephthalítibus, Iérimoth fílius Ozriel:'
  "20": 'fíliis Ephraim, Osée fílius Ozáziu: dimídiæ tríbui Manásse, Ioel fílius Phadaíæ:'
  "21": 'et dimídiæ tríbui Manásse in Gálaad, Iaddo fílius Zacharíæ: Béniamin autem, Iásiel fílius Abner:'
  "22": 'Dan vero, Ezrihel fílius Iéroham: hi príncipes filiórum Israel.'
  "23": 'Nóluit autem David numeráre eos a vigínti annis inférius: quia díxerat Dóminus ut multiplicáret Israel quasi stellas cæli.'
  "24": 'Ioab fílius Sárviæ cœ́perat numeráre, nec complévit: quia super hoc ira irrúerat in Israel, et idcírco númerus eórum, qui fúerant recensíti, non est relátus in fastos regis David.'
  "25": 'Super thesáuros autem regis fuit Azmoth fílius Adiel: his autem thesáuris, qui erant in úrbibus, et in vicis, et in túrribus, præsidébat Iónathan fílius Ozíæ.'
  "26": 'Operi autem rústico, et agrícolis, qui exercébant terram, prǽerat Ezri fílius Chelub:'
  "27": 'vinearúmque cultóribus, Semeías Romathítes: cellis autem vináriis, Zabdías Aphonítes.'
  "28": 'Nam super olivéta et ficéta, quæ erant in campéstribus, Bálanam Gederítes: super apothécas autem ólei, Ioas.'
  "29": 'Porro arméntis, quæ pascebántur in Saron, præpósitus fuit Sétrai Saronítes: et super boves in vállibus, Saphat fílius Adli:'
  "30": 'super camélos vero, Ubil Ismahelítes: et super ásinos, Iadías Meronathítes:'
  "31": 'super oves quoque, Iaziz Agaréus: omnes hi, príncipes substántiæ regis David.'
  "32": 'Iónathan autem pátruus David, consiliárius, vir prudens et litterátus: ipse et Iáhiel fílius Hachamóni erant cum fíliis regis.'
  "33": Achítophel étiam consiliárius regis, et Chúsai Arachítes amícus regis.
  "34": Post Achítophel fuit Ióiada fílius Banaíæ, et Abíathar. Princeps autem exércitus regis erat Ioab.
