bible: vulgate
lang: la
language: Latina
book: Ieremias
chapter: "15"
verses:
  "1": 'Et dixit Dóminus ad me: Si stéterit Móyses, et Sámuel coram me, non est ánima mea ad pópulum istum: éice illos a fácie mea, et egrediántur.'
  "2": 'Quod si díxerint ad te: Quo egrediémur? dices ad eos: Hæc dicit Dóminus: Qui ad mortem, ad mortem: et qui ad gládium, ad gládium: et qui ad famem, ad famem: et qui ad captivitátem, ad captivitátem.'
  "3": 'Et visitábo super eos quátuor spécies, dicit Dóminus: gládium ad occisiónem, et canes ad lacerándum, et volatília cæli et béstias terræ ad devorándum et dissipándum.'
  "4": Et dabo eos in fervórem univérsis regnis terræ, propter Manássen fílium Ezechíæ regis Iuda, super ómnibus quæ fecit in Ierúsalem.
  "5": Quis enim miserébitur tui Ierúsalem? aut quis contristábitur pro te? aut quis ibit ad rogándum pro pace tua?
  "6": 'Tu reliquísti me, dicit Dóminus, retrórsum abiísti: et exténdam manum meam super te, et interfíciam te: laborávi rogans.'
  "7": 'Et dispérgam eos ventilábro in portis terræ: interféci et dispérdidi pópulum meum, et tamen a viis suis non sunt revérsi.'
  "8": 'Multiplicátæ sunt mihi víduæ eius super arénam maris: indúxi eis super matrem adolescéntis vastatórem merídie: misi super civitátes repénte terrórem.'
  "9": 'Infirmáta est quæ péperit septem, defécit ánima eius: óccidit ei sol, cum adhuc esset dies: confúsa est, et erúbuit: et resíduos eius in gládium dabo in conspéctu inimicórum eórum, ait Dóminus.'
  "10": 'Væ mihi mater mea: quare genuísti me virum rixæ, virum discórdiæ in univérsa terra? non fœnerávi, nec fœnerávit mihi quisquam: omnes maledícunt mihi.'
  "11": 'Dicit Dóminus: Si non relíquiæ tuæ in bonum, si non occúrri tibi in témpore afflictiónis, et in témpore tribulatiónis advérsus inimícum.'
  "12": Numquid fœderábitur ferrum ferro ab aquilóne, et æs?
  "13": Divítias tuas et thesáuros tuos in direptiónem dabo gratis, in ómnibus peccátis tuis, et in ómnibus términis tuis.
  "14": 'Et addúcam inimícos tuos de terra, quam nescis: quia ignis succénsus est in furóre meo, super vos ardébit.'
  "15": 'Tu scis Dómine, recordáre mei, et vísita me, et tuére me ab his, qui persequúntur me: noli in patiéntia tua suscípere me: scito quóniam sustínui propter te oppróbrium.'
  "16": 'Invénti sunt sermónes tui, et comédi eos, et factum est mihi verbum tuum in gáudium et in lætítiam cordis mei: quóniam invocátum est nomen tuum super me, Dómine Deus exercítuum.'
  "17": 'Non sedi in concílio ludéntium, et gloriátus sum a fácie manus tuæ: solus sedébam, quóniam comminatióne replésti me.'
  "18": Quare factus est dolor meus perpétuus, et plaga mea desperábilis rénuit curári? facta est mihi quasi mendácium aquárum infidélium.
  "19": 'Propter hoc hæc dicit Dóminus: Si convérteris, convértam te, et ante fáciem meam stabis: et si separáveris pretiósum a vili, quasi os meum eris: converténtur ipsi ad te, et tu non convertéris ad eos.'
  "20": 'Et dabo te pópulo huic in murum ǽreum fortem: et bellábunt advérsum te, et non prævalébunt: quia ego tecum sum ut salvem te, et éruam te, dicit Dóminus.'
  "21": Et liberábo te de manu pessimórum, et rédimam te de manu fórtium.
