bible: vulgate
lang: la
language: Latina
book: Marcus
chapter: "11"
verses:
  "1": Et cum appropinquárent Ierosólymæ, et Bethániæ ad montem Olivárum, mittit duos ex discípulis suis,
  "2": 'et ait illis: Ite in castéllum, quod contra vos est, et statim introeúntes illuc, inveniétis pullum ligátum, super quem nemo adhuc hóminum sedit: sólvite illum, et addúcite.'
  "3": 'Et si quis vobis díxerit: Quid fácitis? dícite, quia Dómino necessárius est: et contínuo illum dimíttet huc.'
  "4": 'Et abeúntes invenérunt pullum ligátum ante iánuam foris in bívio: et solvunt eum.'
  "5": 'Et quidam de illic stántibus dicébant illis: Quid fácitis solvéntes pullum?'
  "6": Qui dixérunt eis sicut præcéperat illis Iesus, et dimisérunt eis.
  "7": 'Et duxérunt pullum ad Iesum: et impónunt illi vestiménta sua, et sedit super eum.'
  "8": 'Multi autem vestiménta sua stravérunt in via: álii autem frondes cædébant de arbóribus, et sternébant in via.'
  "9": 'Et qui præíbant, et qui sequebántur, clamábant, dicéntes: Hosánna:'
  "10": 'benedíctus, qui venit in nómine Dómini: benedíctum quod venit regnum patris nostri David: hosánna in excélsis.'
  "11": 'Et introívit Ierosólymam in templum: et circumspéctis ómnibus, cum iam véspera esset hora, éxiit in Bethániam cum duódecim.'
  "12": Et ália die cum exírent a Bethánia, esúriit.
  "13": 'Cumque vidísset a longe ficum habéntem fólia, venit si quid forte inveníret in ea: et cum venísset ad eam, nihil invénit præter fólia: non enim erat tempus ficórum.'
  "14": 'Et respóndens dixit ei: Iam non ámplius in ætérnum ex te fructum quisquam mandúcet. Et audiébant discípuli eius.'
  "15": 'Et véniunt in Ierosólymam. Et cum introísset in templum, cœpit eícere vendéntes, et eméntes in templo: et mensas nummulariórum, et cáthedras vendéntium colúmbas evértit:'
  "16": 'et non sinébat ut quisquam transférret vas per templum:'
  "17": 'et docébat, dicens eis: Nonne scriptum est: Quia domus mea, domus oratiónis vocábitur ómnibus géntibus? vos autem fecístis eam spelúncam latrónum.'
  "18": 'Quo audíto príncipes sacerdótum, et scribæ, quærébant quómodo eum pérderent: timébant enim eum, quóniam univérsa turba admirabátur super doctrína eius.'
  "19": Et cum véspera facta esset, egrediebátur de civitáte.
  "20": Et cum mane transírent, vidérunt ficum áridam factam a radícibus.
  "21": 'Et recordátus Petrus, dixit ei: Rabbi, ecce ficus, cui maledixísti, áruit.'
  "22": 'Et respóndens Iesus ait illis: Habéte fidem Dei.'
  "23": 'Amen dico vobis, quia quicúmque díxerit huic monti: Tóllere, et míttere in mare, et non hæsitáverit in corde suo, sed credíderit, quia quodcúmque díxerit fiat, fiet ei.'
  "24": Proptérea dico vobis, ómnia quæcúmque orántes pétitis, crédite quia accipiétis, et evénient vobis.
  "25": 'Et cum stábitis ad orándum, dimíttite si quid habétis advérsus áliquem: ut et Pater vester, qui in cælis est, dimíttat vobis peccáta vestra.'
  "26": 'Quod si vos non dimiséritis: nec Pater vester, qui in cælis est, dimíttet vobis peccáta vestra.'
  "27": 'Et véniunt rursus Ierosólymam. Et cum ambuláret in templo, accédunt ad eum summi sacerdótes, et scribæ, et senióres:'
  "28": 'et dicunt ei: In qua potestáte hæc facis? et quis dedit tibi hanc potestátem ut ista fácias?'
  "29": 'Iesus autem respóndens, ait illis: Interrogábo vos et ego unum verbum, et respondéte mihi: et dicam vobis in qua potestáte hæc fáciam.'
  "30": Baptísmus Ioánnis, de cælo erat, an ex homínibus? Respondéte mihi.
  "31": 'At illi cogitábant secum, dicéntes: Si dixérimus: De cælo, dicet: Quare ergo non credidístis ei?'
  "32": 'Si dixérimus: Ex homínibus, timémus pópulum: omnes enim habébant Ioánnem quia vere prophéta esset.'
  "33": 'Et respondéntes dicunt Iesu: Nescímus. Et respóndens Iesus ait illis: Neque ego dico vobis in qua potestáte hæc fáciam.'
