bible: vulgate
lang: la
language: Latina
book: II Samuelis
chapter: "12"
verses:
  "1": 'Misit ergo Dóminus Nathan ad David: qui cum venísset ad eum, dixit ei: Duo viri erant in civitáte una, unus dives, et alter pauper.'
  "2": Dives habébat oves, et boves plúrimos valde.
  "3": 'Pauper autem nihil habébat omníno, præter ovem unam párvulam, quam émerat et nutríerat, et quæ créverat apud eum cum fíliis eius simul, de pane illíus cómedens, et de cálice eius bibens, et in sinu illíus dórmiens: erátque illi sicut fília.'
  "4": Cum autem peregrínus quidam venísset ad dívitem, parcens ille súmere de óvibus et de bobus suis, ut exhibéret convívium peregríno illi, qui vénerat ad se, tulit ovem viri páuperis, et præparávit cibos hómini qui vénerat ad se.
  "5": 'Irátus autem indignatióne David advérsus hóminem illum nimis, dixit ad Nathan: Vivit Dóminus, quóniam fílius mortis est vir qui fecit hoc.'
  "6": Ovem reddet in quádruplum, eo quod fécerit verbum istud, et non pepércerit.
  "7": 'Dixit autem Nathan ad David: Tu es ille vir. Hæc dicit Dóminus Deus Israel: Ego unxi te in regem super Israel, et ego érui te de manu Saul,'
  "8": 'et dedi tibi domum dómini tui, et uxóres dómini tui in sinu tuo, dedíque tibi domum Israel et Iuda: et si parva sunt ista, adíciam tibi multo maióra.'
  "9": Quare ergo contempsísti verbum Dómini, ut fáceres malum in conspéctu meo? Uríam Hethǽum percussísti gládio, et uxórem illíus accepísti in uxórem tibi, et interfecísti eum gládio filiórum Ammon.
  "10": Quam ob rem non recédet gládius de domo tua usque in sempitérnum, eo quod despéxeris me, et túleris uxórem Uríæ Hethǽi ut esset uxor tua.
  "11": 'Itaque hæc dicit Dóminus: Ecce ego suscitábo super te malum de domo tua, et tollam uxóres tuas in óculis tuis, et dabo próximo tuo: et dórmiet cum uxóribus tuis in óculis solis huius.'
  "12": 'Tu enim fecísti abscóndite: ego autem fáciam verbum istud in conspéctu omnis Israel, et in conspéctu solis.'
  "13": 'Et dixit David ad Nathan: Peccávi Dómino. Dixítque Nathan ad David: Dóminus quoque tránstulit peccátum tuum: non moriéris.'
  "14": Verúmtamen, quóniam blasphemáre fecísti inimícos Dómini, propter verbum hoc, fílius, qui natus est tibi, morte moriétur.
  "15": Et revérsus est Nathan in domum suam. Percússit quoque Dóminus párvulum, quem pepérerat uxor Uríæ David, et desperátus est.
  "16": 'Deprecatúsque est David Dóminum pro párvulo: et ieiunávit David ieiúnio, et ingréssus seórsum, iácuit super terram.'
  "17": 'Venérunt autem senióres domus eius, cogéntes eum ut súrgeret de terra: qui nóluit, nec comédit cum eis cibum.'
  "18": 'Accidit autem die séptima ut morerétur infans: timuerúntque servi David nuntiáre ei quod mórtuus esset párvulus: dixérunt enim: Ecce cum párvulus adhuc víveret, loquebámur ad eum, et non audiébat vocem nostram: quanto magis si dixérimus: Mórtuus est puer, se afflíget?'
  "19": 'Cum ergo David vidísset servos suos mussitántes, intelléxit quod mórtuus esset infántulus: dixítque ad servos suos: Num mórtuus est puer? Qui respondérunt ei: Mórtuus est.'
  "20": 'Surréxit ergo David de terra, et lotus unctúsque est: cumque mutásset vestem, ingréssus est domum Dómini: et adorávit, et venit in domum suam, petivítque ut pónerent ei panem, et comédit.'
  "21": 'Dixérunt autem ei servi sui: Quis est sermo, quem fecísti? propter infántem, cum adhuc víveret, ieiunásti et flebas: mórtuo autem púero, surrexísti, et comedísti panem.'
  "22": 'Qui ait: Propter infántem, dum adhuc víveret, ieiunávi et flevi: dicébam enim: Quis scit si forte donet eum mihi Dóminus, et vivat infans?'
  "23": 'Nunc autem quia mórtuus est, quare ieiúnem? numquid pótero revocáre eum ámplius? ego vadam magis ad eum: ille vero non revertétur ad me.'
  "24": 'Et consolátus est David Bethsabée uxórem suam, ingressúsque ad eam dormívit cum ea: quæ génuit fílium, et vocávit nomen eius Sálomon: et Dóminus diléxit eum.'
  "25": Misítque in manu Nathan prophétæ, et vocávit nomen eius, Amábilis Dómino, eo quod dilígeret eum Dóminus.
  "26": Igitur pugnábat Ioab contra Rabbath filiórum Ammon, et expugnábat urbem régiam.
  "27": 'Misítque Ioab núntios ad David, dicens: Dimicávi advérsum Rabbath, et capiénda est Urbs aquárum.'
  "28": 'Nunc ígitur cóngrega réliquam partem pópuli, et óbside civitátem, et cape eam: ne cum a me vastáta fúerit urbs, nómini meo ascribátur victória.'
  "29": 'Congregávit ítaque David omnem pópulum, et proféctus est advérsum Rabbath: cumque dimicásset, cepit eam.'
  "30": 'Et tulit diadéma regis eórum de cápite eius, pondo auri taléntum, habens gemmas pretiosíssimas: et impósitum est super caput David. Sed et prædam civitátis asportávit multam valde:'
  "31": 'pópulum quoque eius addúcens serrávit, et circumégit super eos ferráta carpénta: divisítque cultris, et tradúxit in typo láterum: sic fecit univérsis civitátibus filiórum Ammon. Et revérsus est David, et omnis exércitus in Ierúsalem.'
