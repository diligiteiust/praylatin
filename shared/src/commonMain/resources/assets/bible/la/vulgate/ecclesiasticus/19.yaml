bible: vulgate
lang: la
language: Latina
book: Ecclesiasticus
chapter: "19"
verses:
  "1": 'Operárius ebriósus non locupletábitur: et qui spernit módica, paulátim décidet.'
  "2": 'Vinum et mulíeres apostatáre fáciunt sapiéntes, et árguent sensátos:'
  "3": 'et qui se iungit fornicáriis, erit nequam: putrédo et vermes hereditábunt illum, et extollétur in exémplum maius, et tollétur de número ánima eius.'
  "4": 'Qui credit cito, levis corde est, et minorábitur: et qui delínquit in ánimam suam, ínsuper habébitur.'
  "5": 'Qui gaudet iniquitáte, denotábitur: et qui odit correptiónem, minuétur vita: et qui odit loquacitátem, exstínguit malítiam.'
  "6": 'Qui peccat in ánimam suam, pœnitébit: et qui iucundátur in malítia, denotábitur.'
  "7": Ne íteres verbum nequam et durum, et non minoráberis.
  "8": 'Amíco et inimíco noli narráre sensum tuum: et si est tibi delíctum, noli denudáre:'
  "9": áudiet enim te, et custódiet te, et quasi deféndens peccátum ódiet te, et sic áderit tibi semper.
  "10": Audísti verbum advérsus próximum tuum? commoriátur in te, fidens quóniam non te dirúmpet.
  "11": A fácie verbi párturit fátuus, tamquam gémitus partus infántis.
  "12": Sagítta infíxa fémori carnis, sic verbum in corde stulti.
  "13": 'Córripe amícum, ne forte non intelléxerit, et dicat: Non feci: aut, si fécerit, ne íterum addat fácere.'
  "14": 'Córripe próximum, ne forte non díxerit: et si díxerit, ne forte íteret.'
  "15": 'Córripe amícum: sæpe enim fit commíssio.'
  "16": 'Et non omni verbo credas: est qui lábitur lingua, sed non ex ánimo.'
  "17": Quis est enim qui non delíquerit in lingua sua? Córripe próximum ántequam comminéris.
  "18": 'Et da locum timóri Altíssimi: quia omnis sapiéntia timor Dei, et in illa timére Deum, et in omni sapiéntia disposítio legis.'
  "19": 'Et non est sapiéntia nequítiæ disciplína: et non est cogitátus peccatórum prudéntia.'
  "20": 'Est nequítia, et in ipsa exsecrátio: et est insípiens qui minúitur sapiéntia.'
  "21": Mélior est homo, qui minúitur sapiéntia, et defíciens sensu in timóre, quam qui abúndat sensu, et transgréditur legem Altíssimi.
  "22": Est solértia certa, et ipsa iníqua.
  "23": 'Et est qui emíttit verbum certum enárrans veritátem. Est qui néquiter humíliat se, et interióra eius plena sunt dolo:'
  "24": 'et est qui se nímium submíttit a multa humilitáte: et est qui inclínat fáciem suam, et fingit se non vidére quod ignorátum est:'
  "25": et si ab imbecillitáte vírium vetétur peccáre, si invénerit tempus malefaciéndi, malefáciet.
  "26": Ex visu cognóscitur vir, et ab occúrsu faciéi cognóscitur sensátus.
  "27": Amíctus córporis, et risus déntium, et ingréssus hóminis enúntiant de illo.
  "28": 'Est corréptio mendax in ira contumeliósi: et est iudícium, quod non probátur esse bonum: et est tacens, et ipse est prudens.'
