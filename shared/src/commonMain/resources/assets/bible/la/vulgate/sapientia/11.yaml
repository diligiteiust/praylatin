bible: vulgate
lang: la
language: Latina
book: Sapientia
chapter: "11"
verses:
  "1": Diréxit ópera eórum in mánibus prophétæ sancti.
  "2": 'Iter fecérunt per desérta, quæ non habitabántur: et in locis desértis fixérunt casas.'
  "3": Stetérunt contra hostes, et de inimícis se vindicavérunt.
  "4": Sitiérunt, et invocavérunt te, et data est illis aqua de petra altíssima, et réquies sitis de lápide duro.
  "5": 'Per quæ enim pœnas passi sunt inimíci illórum a defectióne potus sui, et in eis cum abundárent fílii Israel, lætáti sunt:'
  "6": per hæc, cum illis deéssent, bene cum illis actum est.
  "7": Nam pro fonte quidem sempitérni flúminis, humánum sánguinem dedísti iniústis.
  "8": Qui cum minueréntur in traductióne infántium occisórum, dedísti illis abundántem aquam insperáte,
  "9": osténdens per sitim, quæ tunc fuit, quemádmodum tuos exaltáres, et adversários illórum necáres.
  "10": Cum enim tentáti sunt, et quidem cum misericórdia disciplínam accipiéntes, sciérunt quemádmodum cum ira iudicáti ímpii torménta pateréntur.
  "11": 'Hos quidem tamquam pater monens probásti: illos autem tamquam durus rex intérrogans condemnásti.'
  "12": Abséntes enim, et præséntes, simíliter torquebántur.
  "13": Duplex enim illos accéperat tǽdium et gémitus, cum memória præteritórum.
  "14": Cum enim audírent per sua torménta bene secum agi, commemoráti sunt Dóminum, admirántes in finem éxitus.
  "15": Quem enim in expositióne prava proiéctum derisérunt, in finem evéntus miráti sunt, non simíliter iustis sitiéntes.
  "16": 'Pro cogitatiónibus autem insensátis iniquitátis illórum, quod quidam errántes colébant mutos serpéntes et béstias supervácuas, immisísti illis multitúdinem mutórum animálium in vindíctam:'
  "17": ut scirent quia per quæ peccat quis, per hæc et torquétur.
  "18": Non enim impossíbilis erat omnípotens manus tua, quæ creávit orbem terrárum ex matéria invísa, immíttere illis multitúdinem ursórum, aut audáces leónes,
  "19": 'aut novi géneris ira plenas ignótas béstias, aut vapórem ígnium spirántes, aut fumi odórem proferéntes, aut horréndas ab óculis scintíllas emitténtes:'
  "20": quarum non solum læsúra póterat illos extermináre, sed et aspéctus per timórem occídere.
  "21": 'Sed et sine his uno spíritu póterant occídi, persecutiónem passi ab ipsis factis suis, et dispérsi per spíritum virtútis tuæ: sed ómnia in mensúra, et número, et póndere disposuísti.'
  "22": 'Multum enim valére, tibi soli supérerat semper: et virtúti bráchii tui quis resístet?'
  "23": Quóniam tamquam moméntum statéræ, sic est ante te orbis terrárum, et tamquam gutta roris antelucáni, quæ descéndit in terram.
  "24": Sed miseréris ómnium, quia ómnia potes, et dissímulas peccáta hóminum propter pœniténtiam.
  "25": 'Díligis enim ómnia quæ sunt, et nihil odísti eórum quæ fecísti: nec enim ódiens áliquid constituísti aut fecísti.'
  "26": Quómodo autem posset áliquid permanére, nisi tu voluísses? aut quod a te vocátum non esset, conservarétur?
  "27": 'Parcis autem ómnibus: quóniam tua sunt Dómine, qui amas ánimas.'
