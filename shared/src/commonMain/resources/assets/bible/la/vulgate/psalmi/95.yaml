bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "95"
verses:
  "1": 'Cánticum ipsi David, Quando domus ædificabátur post captivitátem. Cantáte Dómino cánticum novum: cantáte Dómino omnis terra.'
  "2": 'Cantáte Dómino, et benedícite nómini eius: annuntiáte de die in diem salutáre eius.'
  "3": Annuntiáte inter gentes glóriam eius, in ómnibus pópulis mirabília eius.
  "4": 'Quóniam magnus Dóminus, et laudábilis nimis: terríbilis est super omnes deos.'
  "5": 'Quóniam omnes dii géntium dæmónia: Dóminus autem cælos fecit.'
  "6": 'Conféssio, et pulchritúdo in conspéctu eius: sanctimónia, et magnificéntia in sanctificatióne eius.'
  "7": 'Afférte Dómino pátriæ géntium, afférte Dómino glóriam et honórem:'
  "8": 'afférte Dómino glóriam nómini eius. Tóllite hóstias, et introíte in átria eius:'
  "9": 'adoráte Dóminum in átrio sancto eius. Commoveátur a fácie eius univérsa terra:'
  "10": 'dícite in géntibus quia Dóminus regnávit. Etenim corréxit orbem terræ qui non commovébitur: iudicábit pópulos in æquitáte.'
  "11": 'Læténtur cæli, et exsúltet terra: commoveátur mare et plenitúdo eius:'
  "12": gaudébunt campi, et ómnia quæ in eis sunt. Tunc exsultábunt ómnia ligna silvárum
  "13": 'a fácie Dómini, quia venit: quóniam venit iudicáre terram. Iudicábit orbem terræ in æquitáte, et pópulos in veritáte sua.'
