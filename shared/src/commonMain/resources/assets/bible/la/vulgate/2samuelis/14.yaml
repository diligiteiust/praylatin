bible: vulgate
lang: la
language: Latina
book: II Samuelis
chapter: "14"
verses:
  "1": Intélligens autem Ioab fílius Sárviæ quod cor regis versum esset ad Absalom,
  "2": 'misit Thécuam, et tulit inde mulíerem sapiéntem: dixítque ad eam: Lugére te símula, et indúere veste lúgubri, et ne ungáris óleo, ut sis quasi múlier iam plúrimo témpore lugens mórtuum:'
  "3": et ingrediéris ad regem, et loquéris ad eum sermónes huiuscémodi. Pósuit autem Ioab verba in ore eius.
  "4": 'Itaque cum ingréssa fuísset múlier Thecuítis ad regem, cécidit coram eo super terram, et adorávit, et dixit: Serva me rex.'
  "5": 'Et ait ad eam rex: Quid causæ habes? Quæ respóndit: Heu, múlier vídua ego sum: mórtuus est enim vir meus.'
  "6": 'Et ancíllæ tuæ erant duo fílii: qui rixáti sunt advérsum se in agro, nullúsque erat, qui eos prohibére posset: et percússit alter álterum, et interfécit eum.'
  "7": 'Et ecce consúrgens univérsa cognátio advérsum ancíllam tuam, dicit: Trade eum, qui percússit fratrem suum, ut occidámus eum pro ánima fratris sui, quem interfécit, et deleámus herédem: et quærunt exstínguere scintíllam meam, quæ relícta est, ut non supérsit viro meo nomen, et relíquiæ super terram.'
  "8": 'Et ait rex ad mulíerem: Vade in domum tuam, et ego iubébo pro te.'
  "9": 'Dixítque múlier Thecuítis ad regem: In me, dómine mi rex, sit iníquitas, et in domum patris mei: rex autem et thronus eius sit ínnocens.'
  "10": 'Et ait rex: Qui contradíxerit tibi, adduc eum ad me, et ultra non addet ut tangat te.'
  "11": 'Quæ ait: Recordétur rex Dómini Dei sui, ut non multiplicéntur próximi sánguinis ad ulciscéndum, et nequáquam interfíciant fílium meum. Qui ait: Vivit Dóminus, quia non cadet de capíllis fílii tui super terram.'
  "12": 'Dixit ergo múlier: Loquátur ancílla tua ad dóminum meum regem verbum. Et ait: Lóquere.'
  "13": 'Dixítque múlier: Quare cogitásti huiuscémodi rem contra pópulum Dei, et locútus est rex verbum istud, ut peccet, et non redúcat eiéctum suum?'
  "14": 'Omnes mórimur, et quasi aquæ dilábimur in terram, quæ non revertúntur: nec vult Deus períre ánimam, sed retráctat cógitans ne pénitus péreat qui abiéctus est.'
  "15": 'Nunc ígitur veni, ut loquar ad dóminum meum regem verbum hoc, præsénte pópulo. Et dixit ancílla tua: Loquar ad regem, si quo modo fáciat rex verbum ancíllæ suæ.'
  "16": Et audívit rex, ut liberáret ancíllam suam de manu ómnium, qui volébant de hereditáte Dei delére me, et fílium meum simul.
  "17": 'Dicat ergo ancílla tua, ut fiat verbum dómini mei regis sicut sacrifícium. Sicut enim ángelus Dei, sic est dóminus meus rex, ut nec benedictióne, nec maledictióne moveátur: unde et Dóminus Deus tuus est tecum.'
  "18": 'Et respóndens rex, dixit ad mulíerem: Ne abscóndas a me verbum, quod te intérrogo. Dixítque ei múlier: Lóquere dómine mi rex.'
  "19": 'Et ait rex: Numquid manus Ioab tecum est in ómnibus istis? Respóndit múlier, et ait: Per salútem ánimæ tuæ, dómine mi rex, nec ad sinístram, nec ad déxteram est ex ómnibus his, quæ locútus est dóminus meus rex: servus enim tuus Ioab, ipse præcépit mihi, et ipse pósuit in os ancíllæ tuæ ómnia verba hæc.'
  "20": 'Ut vérterem figúram sermónis huius, servus tuus Ioab præcépit istud: tu autem dómine mi rex, sápiens es, sicut habet sapiéntiam ángelus Dei, ut intélligas ómnia super terram.'
  "21": 'Et ait rex ad Ioab: Ecce placátus feci verbum tuum: vade ergo, et révoca púerum Absalom.'
  "22": 'Cadénsque Ioab super fáciem suam in terram, adorávit, et benedíxit regi: et dixit Ioab: Hódie intelléxit servus tuus, quia invéni grátiam in óculis tuis, dómine mi rex: fecísti enim sermónem servi tui.'
  "23": Surréxit ergo Ioab et ábiit in Gessur, et addúxit Absalom in Ierúsalem.
  "24": 'Dixit autem rex: Revertátur in domum suam, et fáciem meam non vídeat. Revérsus est ítaque Absalom in domum suam, et fáciem regis non vidit.'
  "25": 'Porro sicut Absalom, vir non erat pulcher in omni Israel, et decórus nimis: a vestígio pedis usque ad vérticem non erat in eo ulla mácula.'
  "26": Et quando tondébat capíllum (semel autem in anno tondebátur, quia gravábat eum cæsáries), ponderábat capíllos cápitis sui ducéntis siclis, póndere público.
  "27": Nati sunt autem Absalom fílii tres, et fília una nómine Thamar, elegántis formæ.
  "28": Mansítque Absalom in Ierúsalem duóbus annis, et fáciem regis non vidit.
  "29": 'Misit ítaque ad Ioab, ut mítteret eum ad regem: qui nóluit veníre ad eum. Cumque secúndo misísset, et ille noluísset veníre ad eum,'
  "30": 'dixit servis suis: Scitis agrum Ioab iuxta agrum meum, habéntem messem hórdei: ite ígitur, et succéndite eum igni. Succendérunt ergo servi Absalom ségetem igni. Et veniéntes servi Ioab, scissis véstibus suis, dixérunt: Succendérunt servi Absalom partem agri igni.'
  "31": 'Surrexítque Ioab, et venit ad Absalom in domum eius, et dixit: Quare succendérunt servi tui ségetem meam igni?'
  "32": 'Et respóndit Absalom ad Ioab: Misi ad te óbsecrans ut veníres ad me, et mítterem te ad regem, et díceres ei: Quare veni de Gessur? mélius mihi erat ibi esse: óbsecro ergo ut vídeam fáciem regis: quod si memor est iniquitátis meæ, interfíciat me.'
  "33": 'Ingréssus ítaque Ioab ad regem, nuntiávit ei ómnia: vocatúsque est Absalom, et intrávit ad regem, et adorávit super fáciem terræ coram eo: osculatúsque est rex Absalom.'
