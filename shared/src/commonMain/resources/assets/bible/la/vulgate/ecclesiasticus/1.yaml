bible: vulgate
lang: la
language: Latina
book: Ecclesiasticus
chapter: "1"
verses:
  "1": '[Prólogus. Multórum nobis, et magnórum per legem, et prophétas, aliósque qui secúti sunt illos, sapiéntia demonstráta est: in quibus opórtet laudáre Israel doctrínæ et sapiéntiæ causa, quia non solum ipsos loquéntes necésse est esse perítos, sed étiam extráneos posse et dicéntes et scribéntes doctíssimos fíeri. Avus meus Iesus, postquam se ámplius dedit ad diligéntiam lectiónis legis, et prophetárum, et aliórum librórum qui nobis a paréntibus nostris tráditi sunt: vóluit et ipse scríbere áliquid horum, quæ ad doctrínam et sapiéntiam pértinent: ut desiderántes díscere, et illórum períti facti, magis magísque atténdant ánimo, et confirméntur ad legítimam vitam. Hortor ítaque veníre vos cum benevoléntia, et attentióri stúdio lectiónem fácere, et véniam habére in illis, in quibus vidémur, sequéntes imáginem sapiéntiæ, defícere in verbórum compositióne. Nam defíciunt verba hebráica, quando fúerint transláta ad álteram linguam: non autem solum hæc, sed et ipsa lex, et prophétæ, ceteráque aliórum librórum non parvam habent differéntiam quando inter se dicúntur. Nam in octávo et trigésimo anno tempóribus Ptolemǽi Evérgetis regis, postquam pervéni in Ægýptum, et cum multum témporis ibi fuíssem, invéni ibi libros relíctos, non parvæ neque contemnéndæ doctrínæ. Itaque bonum et necessárium putávi et ipse áliquam áddere diligéntiam et labórem interpretándi librum istum: et multa vigília áttuli doctrínam in spátio témporis, ad illa quæ ad finem ducunt, librum istum dare, et illis qui volunt ánimum inténdere, et díscere quemádmodum opórteat institúere mores, qui secúndum legem Dómini proposúerint vitam ágere.] Omnis sapiéntia a Dómino Deo est: et cum illo fuit semper, et est ante ævum.'
  "2": Arénam maris, et plúviæ guttas, et dies sǽculi, quis dinumerávit? Altitúdinem cæli, et latitúdinem terræ, et profúndum abýssi, quis diménsus est?
  "3": Sapiéntiam Dei præcedéntem ómnia quis investigávit?
  "4": Prior ómnium creáta est sapiéntia, et intelléctus prudéntiæ ab ævo.
  "5": Fons sapiéntiæ verbum Dei in excélsis, et ingréssus illíus mandáta ætérna.
  "6": Radix sapiéntiæ cui reveláta est, et astútias illíus quis agnóvit?
  "7": Disciplína sapiéntiæ cui reveláta est, et manifestáta? et multiplicatiónem ingréssus illíus quis intelléxit?
  "8": Unus est altíssimus Creátor omnípotens, et rex potens et metuéndus nimis, sedens super thronum illíus, et dóminans Deus.
  "9": Ipse creávit illam in Spíritu sancto, et vidit, et dinumerávit, et mensus est.
  "10": Et effúdit illam super ómnia ópera sua, et super omnem carnem, secúndum datum suum, et prǽbuit illam diligéntibus se.
  "11": Timor Dómini glória, et gloriátio, et lætítia, et coróna exsultatiónis.
  "12": Timor Dómini delectábit cor, et dabit lætítiam, et gáudium, et longitúdinem diérum.
  "13": Timénti Dóminum bene erit in extrémis, et in die defunctiónis suæ benedicétur.
  "14": Diléctio Dei honorábilis sapiéntia.
  "15": Quibus autem apparúerit in visu, díligunt eam in visióne, et in agnitióne magnálium suórum.
  "16": Inítium sapiéntiæ timor Dómini, et cum fidélibus in vulva concreátus est, cum eléctis féminis gráditur, et cum iustis et fidélibus agnóscitur.
  "17": Timor Dómini, sciéntiæ religiósitas.
  "18": Religiósitas custódiet et iustificábit cor, iucunditátem atque gáudium dabit.
  "19": Timénti Dóminum bene erit, et in diébus consummatiónis illíus benedicétur.
  "20": Plenitúdo sapiéntiæ est timére Deum, et plenitúdo a frúctibus illíus.
  "21": Omnem domum illíus implébit a generatiónibus, et receptácula a thesáuris illíus.
  "22": 'Coróna sapiéntiæ, timor Dómini, replens pacem, et salútis fructum:'
  "23": 'et vidit, et dinumerávit eam: útraque autem sunt dona Dei.'
  "24": 'Sciéntiam, et intelléctum prudéntiæ sapiéntia compartiétur: et glóriam tenéntium se, exáltat.'
  "25": Radix sapiéntiæ est timére Dóminum, et rami illíus longǽvi.
  "26": 'In thesáuris sapiéntiæ intelléctus, et sciéntiæ religiósitas: exsecrátio autem peccatóribus sapiéntia.'
  "27": 'Timor Dómini expéllit peccátum:'
  "28": 'nam qui sine timóre est, non póterit iustificári: iracúndia enim animositátis illíus, subvérsio illíus est.'
  "29": Usque in tempus sustinébit pátiens, et póstea reddítio iucunditátis.
  "30": Bonus sensus usque in tempus abscóndet verba illíus, et lábia multórum enarrábunt sensum illíus.
  "31": 'In thesáuris sapiéntiæ significátio disciplínæ:'
  "32": exsecrátio autem peccatóri, cultúra Dei.
  "33": Fili concupíscens sapiéntiam, consérva iustítiam, et Deus præbébit illam tibi.
  "34": 'Sapiéntia enim et disciplína timor Dómini: et quod beneplácitum est illi,'
  "35": fides, et mansuetúdo, et adimplébit thesáuros illíus.
  "36": Ne sis incredíbilis timóri Dómini, et ne accésseris ad illum dúplici corde.
  "37": Ne fúeris hypócrita in conspéctu hóminum, et non scandalizéris in lábiis tuis.
  "38": Atténde in illis, ne forte cadas, et addúcas ánimæ tuæ inhonoratiónem,
  "39": 'et revélet Deus abscónsa tua, et in médio synagógæ elídat te:'
  "40": quóniam accessísti malígne ad Dóminum, et cor tuum plenum est dolo et fallácia.
