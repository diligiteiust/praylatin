bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "31"
verses:
  "1": 'Ipsi David intelléctus. Beáti quorum remíssæ sunt iniquitátes: et quorum tecta sunt peccáta.'
  "2": Beátus vir, cui non imputávit Dóminus peccátum, nec est in spíritu eius dolus.
  "3": Quóniam tácui, inveteravérunt ossa mea, dum clamárem tota die.
  "4": 'Quóniam die ac nocte graváta est super me manus tua: convérsus sum in ærúmna mea, dum confígitur spina.'
  "5": 'Delíctum meum cógnitum tibi feci: et iniustítiam meam non abscóndi. Dixi: Confitébor advérsum me iniustítiam meam Dómino: et tu remisísti impietátem peccáti mei.'
  "6": Pro hac orábit ad te omnis sanctus, in témpore opportúno. Verúmtamen in dilúvio aquárum multárum, ad eum non approximábunt.
  "7": 'Tu es refúgium meum a tribulatióne, quæ circúmdedit me: exsultátio mea, érue me a circumdántibus me.'
  "8": 'Intelléctum tibi dabo, et ínstruam te in via hac, qua gradiéris: firmábo super te óculos meos.'
  "9": Nolíte fíeri sicut equus et mulus, quibus non est intelléctus. In camo et freno maxíllas eórum constrínge, qui non appróximant ad te.
  "10": 'Multa flagélla peccatóris: sperántem autem in Dómino misericórdia circúmdabit.'
  "11": Lætámini in Dómino, et exsultáte iusti, et gloriámini omnes recti corde.
