bible: vulgate
lang: la
language: Latina
book: Ecclesiasticus
chapter: "37"
verses:
  "1": 'Omnis amícus dicet: Et ego amicítiam copulávi: sed est amícus solo nómine amícus. Nonne tristítia inest usque ad mortem?'
  "2": Sodális autem et amícus ad inimicítiam converténtur.
  "3": O præsúmptio nequíssima, unde creáta es cooperíre áridam malítia et dolositáte illíus?
  "4": Sodális amíco coniucundátur in oblectatiónibus, et in témpore tribulatiónis adversárius erit.
  "5": Sodális amíco cóndolet causa ventris, et contra hostem accípiet scutum.
  "6": Non obliviscáris amíci tui in ánimo tuo, et non ímmemor sis illíus in ópibus tuis.
  "7": Noli consiliári cum eo, qui tibi insidiátur, et a zelántibus te abscónde consílium.
  "8": Omnis consiliárius prodit consílium, sed est consiliárius in semetípso.
  "9": 'A consiliário serva ánimam tuam: prius scito quæ sit illíus necéssitas: et ipse enim ánimo suo cogitábit:'
  "10": 'ne forte mittat sudem in terram, et dicat tibi:'
  "11": 'Bona est via tua: et stet e contrário vidére quid tibi evéniat.'
  "12": 'Cum viro irreligióso tracta de sanctitáte, et cum iniústo de iustítia, et cum mulíere de ea, quæ æmulátur: cum tímido de bello, cum negotiatóre de traiectióne, cum emptóre de venditióne, cum viro lívido de grátiis agéndis,'
  "13": cum ímpio de pietáte, cum inhonésto de honestáte, cum operário agrário de omni ópere,
  "14": 'cum operário annuáli de consummatióne anni, cum servo pigro de multa operatióne: non atténdas his in omni consílio.'
  "15": Sed cum viro sancto assíduus esto, quemcúmque cognóveris observántem timórem Dei,
  "16": 'cuius ánima est secúndum ánimam tuam: et qui, cum titubáveris in ténebris, condolébit tibi.'
  "17": 'Cor boni consílii státue tecum: non est enim tibi áliud pluris illo.'
  "18": Anima viri sancti enúntiat aliquándo vera, quam septem circumspectóres sedéntes in excélso ad speculándum.
  "19": Et in his ómnibus deprecáre Altíssimum, ut dírigat in veritáte viam tuam.
  "20": Ante ómnia ópera verbum verax præcédat te, et ante omnem actum consílium stábile.
  "21": 'Verbum nequam immutábit cor: ex quo partes quátuor oriúntur: bonum et malum, vita et mors: et dominátrix illórum est assídua lingua. Est vir astútus multórum erudítor, et ánimæ suæ inútilis est.'
  "22": Vir perítus multos erudívit, et ánimæ suæ suávis est.
  "23": 'Qui sophístice lóquitur, odíbilis est: in omni re defraudábitur.'
  "24": Non est illi data a Dómino grátia, omni enim sapiéntia defraudátus est.
  "25": Est sápiens ánimæ suæ sápiens, et fructus sensus illíus laudábilis.
  "26": Vir sápiens plebem suam érudit, et fructus sensus illíus fidéles sunt.
  "27": Vir sápiens implébitur benedictiónibus, et vidéntes illum laudábunt.
  "28": 'Vita viri in número diérum: dies autem Israel innumerábiles sunt.'
  "29": Sápiens in pópulo hereditábit honórem, et nomen illíus erit vivens in ætérnum.
  "30": 'Fili in vita tua tenta ánimam tuam: et si fúerit nequam, non des illi potestátem:'
  "31": non enim ómnia ómnibus expédiunt, et non omni ánimæ omne genus placet.
  "32": 'Noli ávidus esse in omni epulatióne, et non te effúndas super omnem escam:'
  "33": in multis enim escis erit infírmitas, et avíditas appropinquábit usque ad chóleram.
  "34": 'Propter crápulam multi obiérunt: qui autem ábstinens est, adíciet vitam.'
