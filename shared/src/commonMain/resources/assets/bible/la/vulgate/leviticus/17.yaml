bible: vulgate
lang: la
language: Latina
book: Leviticus
chapter: "17"
verses:
  "1": 'Et locútus est Dóminus ad Móysen, dicens:'
  "2": 'Lóquere Aaron et fíliis eius, et cunctis fíliis Israel, dicens ad eos: Iste est sermo, quem mandávit Dóminus, dicens:'
  "3": Homo quílibet de domo Israel, si occíderit bovem aut ovem, sive capram, in castris vel extra castra,
  "4": 'et non obtúlerit ad óstium tabernáculi oblatiónem Dómino, sánguinis reus erit: quasi si sánguinem fúderit, sic períbit de médio pópuli sui.'
  "5": Ideo sacerdóti offérre debent fílii Israel hóstias suas, quas occídent in agro, ut sanctificéntur Dómino ante óstium tabernáculi testimónii, et ímmolent eas hóstias pacíficas Dómino.
  "6": 'Fundétque sacérdos sánguinem super altáre Dómini ad óstium tabernáculi testimónii, et adolébit ádipem in odórem suavitátis Dómino:'
  "7": et nequáquam ultra immolábunt hóstias suas dæmónibus, cum quibus fornicáti sunt. Legítimum sempitérnum erit illis et pósteris eórum.
  "8": 'Et ad ipsos dices: Homo de domo Israel, et de ádvenis qui peregrinántur apud vos, qui obtúlerit holocáustum sive víctimam,'
  "9": et ad óstium tabernáculi testimónii non addúxerit eam, ut offerátur Dómino, interíbit de pópulo suo.
  "10": Homo quílibet de domo Israel et de ádvenis qui peregrinántur inter eos, si coméderit sánguinem, obfirmábo fáciem meam contra ánimam illíus, et dispérdam eam de pópulo suo,
  "11": 'quia ánima carnis in sánguine est: et ego dedi illum vobis, ut super altáre in eo expiétis pro animábus vestris, et sanguis pro ánimæ piáculo sit.'
  "12": 'Idcírco dixi fíliis Israel: Omnis ánima ex vobis non cómedet sánguinem, nec ex ádvenis, qui peregrinántur apud vos.'
  "13": Homo quicúmque de fíliis Israel, et de ádvenis qui peregrinántur apud vos, si venatióne atque aucúpio céperit feram, vel avem, quibus vesci lícitum est, fundat sánguinem eius, et opériat illum terra.
  "14": 'Anima enim omnis carnis in sánguine est: unde dixi fíliis Israel: Sánguinem univérsæ carnis non comedétis, quia ánima carnis in sánguine est: et quicúmque coméderit illum, interíbit.'
  "15": 'Anima, quæ coméderit morticínum, vel captum a béstia, tam de indígenis, quam de ádvenis, lavábit vestiménta sua et semetípsum aqua, et contaminátus erit usque ad vésperum: et hoc órdine mundus fiet.'
  "16": Quod si non láverit vestiménta sua et corpus, portábit iniquitátem suam.
