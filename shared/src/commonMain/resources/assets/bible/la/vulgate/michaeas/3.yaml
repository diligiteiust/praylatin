bible: vulgate
lang: la
language: Latina
book: Michaeas
chapter: "3"
verses:
  "1": 'Et dixi: Audíte príncipes Iacob, et duces domus Israel: Numquid non vestrum est scire iudícium,'
  "2": 'qui ódio habétis bonum, et dilígitis malum: qui violénter tóllitis pelles eórum désuper eis, et carnem eórum désuper óssibus eórum?'
  "3": 'Qui comedérunt carnem pópuli mei, et pellem eórum désuper excoriavérunt: et ossa eórum confregérunt, et concidérunt sicut in lebéte, et quasi carnem in médio ollæ.'
  "4": 'Tunc clamábunt ad Dóminum, et non exáudiet eos: et abscóndet fáciem suam ab eis in témpore illo, sicut néquiter egérunt in adinventiónibus suis.'
  "5": 'Hæc dicit Dóminus super prophétas, qui sedúcunt pópulum meum: qui mordent déntibus suis, et prǽdicant pacem: et si quis non déderit in ore eórum quíppiam, sanctíficant super eum prœ́lium.'
  "6": 'Proptérea nox vobis pro visióne erit, et ténebræ vobis pro divinatióne: et occúmbet sol super prophétas, et obtenebrábitur super eos dies.'
  "7": 'Et confundéntur qui vident visiónes, et confundéntur divíni: et opérient omnes vultos suos, quia non est respónsum Dei.'
  "8": 'Verúmtamen ego replétus sum fortitúdine spíritus Dómini, iudício, et virtúte: ut annúntiem Iacob scelus suum, et Israel peccátum suum.'
  "9": 'Audíte hoc príncipes domus Iacob, et iúdices domus Israel: qui abominámini iudícium, et ómnia recta pervértitis.'
  "10": Qui ædificátis Sion in sanguínibus, et Ierúsalem in iniquitáte.
  "11": 'Príncipes eius in munéribus iudicábant, et sacerdótes eius in mercéde docébant, et prophétæ eius in pecúnia divinábant: et super Dóminum requiescébant, dicéntes: Numquid non Dóminus in médio nostrum? non vénient super nos mala.'
  "12": Propter hoc, causa vestri, Sion quasi ager arábitur, et Ierúsalem quasi acérvus lápidum erit, et mons templi in excélsa silvárum.
