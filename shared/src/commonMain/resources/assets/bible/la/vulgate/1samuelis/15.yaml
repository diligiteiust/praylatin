bible: vulgate
lang: la
language: Latina
book: I Samuelis
chapter: "15"
verses:
  "1": 'Et dixit Sámuel ad Saul: Me misit Dóminus ut úngerem te in regem super pópulum eius Israel: nunc ergo audi vocem Dómini.'
  "2": 'Hæc dicit Dóminus exercítuum: Recénsui quæcúmque fecit Amalec Israéli: quómodo réstitit ei in via cum ascénderet de Ægýpto.'
  "3": 'Nunc ergo vade, et pércute Amalec, et demolíre univérsa eius: non parcas ei, et non concupíscas ex rebus ipsíus áliquid, sed intérfice a viro usque ad mulíerem, et párvulum atque lacténtem, bovem et ovem, camélum et ásinum.'
  "4": 'Præcépit ítaque Saul pópulo, et recénsuit eos quasi agnos: ducénta míllia péditum, et decem míllia virórum Iuda.'
  "5": Cumque venísset Saul usque ad civitátem Amalec, teténdit insídias in torrénte.
  "6": 'Dixítque Saul Cinǽo: Abíte, recédite, atque descéndite ab Amalec, ne forte invólvam te cum eo: tu enim fecísti misericórdiam cum ómnibus fíliis Israel, cum ascénderent de Ægýpto. Et recéssit Cinǽus de médio Amalec.'
  "7": Percussítque Saul Amalec ab Hevíla donec vénias ad Sur, quæ est e regióne Ægýpti.
  "8": 'Et apprehéndit Agag regem Amalec vivum: omne autem vulgus interfécit in ore gládii.'
  "9": 'Et pepércit Saul et pópulus Agag, et óptimis grégibus óvium et armentórum, et véstibus et ariétibus, et univérsis, quæ pulchra erant, nec voluérunt dispérdere ea: quidquid vero vile fuit et réprobum, hoc demolíti sunt.'
  "10": 'Factum est autem verbum Dómini ad Sámuel, dicens:'
  "11": 'Pœ́nitet me quod constitúerim Saul regem: quia derelíquit me, et verba mea ópere non implévit. Contristatúsque est Sámuel, et clamávit ad Dóminum tota nocte.'
  "12": Cumque de nocte surrexísset Sámuel ut iret ad Saul mane, nuntiátum est Samuéli, eo quod venísset Saul in Carmélum, et erexísset sibi fórnicem triumphálem, et revérsus transísset, descendissétque in Gálgala. Venit ergo Sámuel ad Saul, et Saul offerébat holocáustum Dómino de inítiis prædárum, quæ attúlerat ex Amalec.
  "13": 'Et cum venísset Sámuel ad Saul, dixit ei Saul: Benedíctus tu Dómino: implévi verbum Dómini.'
  "14": 'Dixítque Sámuel: Et quæ est hæc vox gregum, quæ résonat in áuribus meis, et armentórum, quam ego áudio?'
  "15": 'Et ait Saul: De Amalec adduxérunt ea: pepércit enim pópulus melióribus óvibus et arméntis, ut immolaréntur Dómino Deo tuo: réliqua vero occídimus.'
  "16": 'Ait autem Sámuel ad Saul: Sine me, et indicábo tibi quæ locútus sit Dóminus ad me nocte. Dixítque ei: Lóquere.'
  "17": 'Et ait Sámuel: Nonne cum párvulus esses in óculis tuis, caput in tríbubus Israel factus es? unxítque te Dóminus in regem super Israel,'
  "18": 'et misit te Dóminus in viam, et ait: Vade, et intérfice peccatóres Amalec, et pugnábis contra eos usque ad interneciónem eórum.'
  "19": 'Quare ergo non audísti vocem Dómini: sed versus ad prædam es, et fecísti malum in óculis Dómini?'
  "20": 'Et ait Saul ad Samuélem: Immo audívi vocem Dómini, et ambulávi in via per quam misit me Dóminus, et addúxi Agag regem Amalec, et Amalec interféci.'
  "21": Tulit autem de præda pópulus oves et boves, primítias eórum quæ cæsa sunt, ut ímmolet Dómino Deo suo in Gálgalis.
  "22": 'Et ait Sámuel: Numquid vult Dóminus holocáusta et víctimas, et non pótius ut obediátur voci Dómini? mélior est enim obediéntia quam víctimæ: et auscultáre magis quam offérre ádipem aríetum.'
  "23": 'Quóniam quasi peccátum ariolándi est, repugnáre: et quasi scelus idololatríæ, nolle acquiéscere. Pro eo ergo quod abiecísti sermónem Dómini, abiécit te Dóminus ne sis rex.'
  "24": 'Dixítque Saul ad Samuélem: Peccávi, quia prævaricátus sum sermónem Dómini et verba tua, timens pópulum, et obédiens voci eórum.'
  "25": Sed nunc porta, quæso, peccátum meum, et revértere mecum, ut adórem Dóminum.
  "26": 'Et ait Sámuel ad Saul: Non revértar tecum, quia proiecísti sermónem Dómini, et proiécit te Dóminus ne sis rex super Israel.'
  "27": 'Et convérsus est Sámuel ut abíret: ille autem apprehéndit summitátem pállii eius, quæ et scissa est.'
  "28": 'Et ait ad eum Sámuel: Scidit Dóminus regnum Israel a te hódie, et trádidit illud próximo tuo melióri te.'
  "29": 'Porro triumphátor in Israel non parcet, et pœnitúdine non flectétur: neque enim homo est ut agat pœniténtiam.'
  "30": 'At ille ait: Peccávi: sed nunc honóra me coram senióribus pópuli mei et coram Israel, et revértere mecum, ut adórem Dóminum Deum tuum.'
  "31": 'Revérsus ergo Sámuel secútus est Saulem: et adorávit Saul Dóminum.'
  "32": 'Dixítque Sámuel: Addúcite ad me Agag regem Amalec. Et oblátus est ei Agag pinguíssimus, et tremens. Et dixit Agag: Síccine séparat amára mors?'
  "33": 'Et ait Sámuel: Sicut fecit absque líberis mulíeres gládius tuus, sic absque líberis erit inter mulíeres mater tua. Et in frusta concídit eum Sámuel coram Dómino in Gálgalis.'
  "34": 'Abiit autem Sámuel in Rámatha: Saul vero ascéndit in domum suam in Gábaa.'
  "35": 'Et non vidit Sámuel ultra Saul usque ad diem mortis suæ: verúmtamen lugébat Sámuel Saulem, quóniam Dóminum pœnitébat quod constituísset eum regem super Israel.'
