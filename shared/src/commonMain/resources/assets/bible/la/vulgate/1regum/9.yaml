bible: vulgate
lang: la
language: Latina
book: I Regum
chapter: "9"
verses:
  "1": Factum est autem cum perfecísset Sálomon ædifícium domus Dómini, et ædifícium regis, et omne quod optáverat et volúerat fácere,
  "2": appáruit ei Dóminus secúndo, sicut apparúerat ei in Gábaon.
  "3": 'Dixítque Dóminus ad eum: Exaudívi oratiónem tuam et deprecatiónem tuam, quam deprecátus es coram me: sanctificávi domum hanc, quam ædificásti, ut pónerem nomen meum ibi in sempitérnum, et erunt óculi mei et cor meum ibi cunctis diébus.'
  "4": 'Tu quoque si ambuláveris coram me, sicut ambulávit pater tuus, in simplicitáte cordis, et in æquitáte: et féceris ómnia, quæ præcépi tibi, et legítima mea et iudícia mea serváveris,'
  "5": 'ponam thronum regni tui super Israel in sempitérnum, sicut locútus sum David patri tuo, dicens: Non auferétur vir de génere tuo de sólio Israel.'
  "6": 'Si autem aversióne avérsi fuéritis vos et fílii vestri, non sequéntes me, nec custodiéntes mandáta mea, et cæremónias meas, quas propósui vobis, sed abiéritis et coluéritis deos aliénos, et adoravéritis eos:'
  "7": 'áuferam Israel de superfície terræ, quam dedi eis: et templum, quod sanctificávi nómini meo, proíciam a conspéctu meo: erítque Israel in provérbium, et in fábulam cunctis pópulis.'
  "8": 'Et domus hæc erit in exémplum: omnis, qui transíerit per eam, stupébit, et sibilábit, et dicet: Quare fecit Dóminus sic terræ huic, et dómui huic?'
  "9": 'Et respondébunt: Quia dereliquérunt Dóminum Deum suum, qui edúxit patres eórum de terra Ægýpti, et secúti sunt deos aliénos, et adoravérunt eos, et coluérunt eos: idcírco indúxit Dóminus super eos omne malum hoc.'
  "10": Explétis autem annis vigínti postquam ædificáverat Sálomon duas domos, id est, domum Dómini, et domum regis
  "11": (Hiram rege Tyri præbénte Salomóni ligna cédrina et abiégna, et aurum iuxta omne quod opus habúerat), tunc dedit Sálomon Hiram vigínti óppida in terra Galilǽæ.
  "12": Et egréssus est Hiram de Tyro ut vidéret óppida, quæ déderat ei Sálomon, et non placuérunt ei.
  "13": 'Et ait: Hǽccine sunt civitátes, quas dedísti mihi, frater? Et appellávit eas terram Chabul, usque in diem hanc.'
  "14": Misit quoque Hiram ad regem Salomónem centum vigínti talénta auri.
  "15": Hæc est summa expensárum, quam óbtulit rex Sálomon ad ædificándam domum Dómini et domum suam, et Mello, et murum Ierúsalem, et Heser, et Magéddo, et Gazer.
  "16": 'Phárao rex Ægýpti ascéndit, et cepit Gazer, succendítque eam igni, et Chananǽum, qui habitábat in civitáte, interfécit: et dedit eam in dotem fíliæ suæ uxóri Salomónis.'
  "17": Ædificávit ergo Sálomon Gazer, et Béthoron inferiórem,
  "18": et Báalath, et Palmíram in terra solitúdinis.
  "19": Et omnes vicos, qui ad se pertinébant, et erant absque muro, munívit, et civitátes cúrruum et civitátes équitum, et quodcúmque ei plácuit ut ædificáret in Ierúsalem, et in Líbano, et in omni terra potestátis suæ.
  "20": 'Univérsum pópulum, qui remánserat de Amorrhǽis, et Hethǽis, et Pherezǽis, et Hevǽis, et Iebusǽis, qui non sunt de fíliis Israel:'
  "21": horum fílios, qui remánserant in terra, quos scílicet non potúerant fílii Israel extermináre, fecit Sálomon tributários usque in diem hanc.
  "22": De fíliis autem Israel non constítuit Sálomon servíre quemquam, sed erant viri bellatóres, et minístri eius, et príncipes, et duces, et præfécti cúrruum et equórum.
  "23": Erant autem príncipes super ómnia ópera Salomónis præpósiti quingénti quinquagínta, qui habébant subiéctum pópulum, et statútis opéribus imperábant.
  "24": 'Fília autem Pharaónis ascéndit de civitáte David in domum suam, quam ædificáverat ei Sálomon: tunc ædificávit Mello.'
  "25": 'Offerébat quoque Sálomon tribus vícibus per annos síngulos holocáusta, et pacíficas víctimas super altáre, quod ædificáverat Dómino, et adolébat thymiáma coram Dómino: perfectúmque est templum.'
  "26": Classem quoque fecit rex Sálomon in Asióngaber, quæ est iuxta Ailath in líttore maris Rubri, in terra Idumǽæ.
  "27": Misítque Hiram in classe illa servos suos viros náuticos et gnaros maris, cum servis Salomónis.
  "28": Qui cum veníssent in Ophir, sumptum inde aurum quadringentórum vigínti talentórum, detulérunt ad regem Salomónem.
