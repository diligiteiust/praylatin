bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "49"
verses:
  "1": 'Psalmus Asaph. Deus deórum Dóminus locútus est: et vocávit terram, a solis ortu usque ad occásum:'
  "2": ex Sion spécies decóris eius.
  "3": 'Deus maniféste véniet: Deus noster, et non silébit. Ignis in conspéctu eius exardéscet: et in circúitu eius tempéstas válida.'
  "4": 'Advocábit cælum desúrsum: et terram discérnere pópulum suum.'
  "5": 'Congregáte illi sanctos eius: qui órdinant testaméntum eius super sacrifícia.'
  "6": 'Et annuntiábunt cæli iustítiam eius: quóniam Deus iudex est.'
  "7": 'Audi pópulus meus, et loquar: Israel, et testificábor tibi: Deus Deus tuus ego sum.'
  "8": 'Non in sacrifíciis tuis árguam te: holocáusta autem tua in conspéctu meo sunt semper.'
  "9": 'Non accípiam de domo tua vítulos: neque de grégibus tuis hircos.'
  "10": Quóniam meæ sunt omnes feræ silvárum, iuménta in móntibus et boves.
  "11": 'Cognóvi ómnia volatília cæli: et pulchritúdo agri mecum est.'
  "12": 'Si esuríero, non dicam tibi: meus est enim orbis terræ, et plenitúdo eius.'
  "13": Numquid manducábo carnes taurórum? aut sánguinem hircórum potábo?
  "14": 'Immola Deo sacrifícium laudis: et redde Altíssimo vota tua.'
  "15": 'Et ínvoca me in die tribulatiónis: éruam te, et honorificábis me.'
  "16": 'Peccatóri autem dixit Deus: Quare tu enárras iustítias meas? et assúmis testaméntum meum per os tuum?'
  "17": 'Tu vero odísti disciplínam: et proiecísti sermónes meos retrórsum.'
  "18": 'Si vidébas furem, currébas cum eo: et cum adúlteris portiónem tuam ponébas.'
  "19": Os tuum abundávit malítia, et lingua tua concinnábat dolos.
  "20": 'Sedens advérsus fratrem tuum loquebáris, et advérsus fílium matris tuæ ponébas scándalum:'
  "21": 'hæc fecísti, et tácui. Existimásti iníque quod ero tui símilis: árguam te, et státuam contra fáciem tuam.'
  "22": 'Intellígite hæc qui obliviscímini Deum: nequándo rápiat, et non sit qui erípiat.'
  "23": 'Sacrifícium laudis honorificábit me: et illic iter quo osténdam illi salutáre Dei.'
