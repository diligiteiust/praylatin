bible: vulgate
lang: la
language: Latina
book: ad Corinthios I
chapter: "12"
verses:
  "1": De spirituálibus autem, nolo vos ignoráre fratres.
  "2": Scitis quóniam cum gentes essétis, ad simulácra muta prout ducebámini eúntes.
  "3": Ideo notum vobis fácio, quod nemo in Spíritu Dei loquens, dicit anáthema Iesu. Et nemo potest dícere, Dóminus Iesus, nisi in Spíritu sancto.
  "4": 'Divisiónes vero gratiárum sunt, idem autem Spíritus:'
  "5": 'et divisiónes ministratiónum sunt, idem autem Dóminus:'
  "6": et divisiónes operatiónum sunt, idem vero Deus, qui operátur ómnia in ómnibus.
  "7": Unicuíque autem datur manifestátio Spíritus ad utilitátem.
  "8": 'Alii quidem per Spíritum datur sermo sapiéntiæ: álii autem sermo sciéntiæ secúndum eúmdem Spíritum:'
  "9": 'álteri fides in eódem Spíritu: álii grátia sanitátum in uno Spíritu:'
  "10": álii operátio virtútum, álii prophetía, álii discrétio spirítuum, álii génera linguárum, álii interpretátio sermónum.
  "11": Hæc autem ómnia operátur unus atque idem Spíritus, dívidens síngulis prout vult.
  "12": 'Sicut enim corpus unum est, et membra habet multa, ómnia autem membra córporis cum sint multa, unum tamen corpus sunt: ita et Christus.'
  "13": 'Etenim in uno Spíritu omnes nos in unum corpus baptizáti sumus, sive Iudǽi, sive gentíles, sive servi, sive líberi: et omnes in uno Spíritu potáti sumus.'
  "14": Nam et corpus non est unum membrum, sed multa.
  "15": 'Si díxerit pes: Quóniam non sum manus, non sum de córpore: num ídeo non est de córpore?'
  "16": 'Et si díxerit auris: Quóniam non sum óculus, non sum de córpore: num ídeo non est de córpore?'
  "17": 'Si totum corpus óculus: ubi audítus? Si totum audítus: ubi odorátus?'
  "18": Nunc autem pósuit Deus membra, unumquódque eórum in córpore sicut vóluit.
  "19": Quod si essent ómnia unum membrum, ubi corpus?
  "20": Nunc autem multa quidem membra, unum autem corpus.
  "21": 'Non potest autem óculus dícere mánui: Opera tua non indígeo: aut íterum caput pédibus: Non estis mihi necessárii.'
  "22": 'Sed multo magis quæ vidéntur membra córporis infirmióra esse, necessarióra sunt:'
  "23": 'et quæ putámus ignobilióra membra esse córporis, his honórem abundantiórem circúmdamus: et quæ inhonésta sunt nostra, abundantiórem honestátem habent.'
  "24": 'Honésta autem nostra nullíus egent: sed Deus temperávit corpus, ei, cui déerat, abundantiórem tribuéndo honórem,'
  "25": ut non sit schisma in córpore, sed idípsum pro ínvicem sollícita sint membra.
  "26": 'Et si quid pátitur unum membrum, compatiúntur ómnia membra: sive gloriátur unum membrum, congáudent ómnia membra.'
  "27": Vos autem estis corpus Christi, et membra de membro.
  "28": Et quosdam quidem pósuit Deus in Ecclésia primum apóstolos, secúndo prophétas, exínde doctóres, deínde virtútes, exínde grátias curatiónum, opitulatiónes, gubernatiónes, génera linguárum, interpretatiónes sermónum.
  "29": Numquid omnes apóstoli? numquid omnes prophétæ? numquid omnes doctóres?
  "30": numquid omnes virtútes? numquid omnes grátiam habent curatiónum? numquid omnes linguis loquúntur? numquid omnes interpretántur?
  "31": Æmulámini autem charísmata melióra. Et adhuc excellentiórem viam vobis demónstro.
