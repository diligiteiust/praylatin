bible: vulgate
lang: la
language: Latina
book: Baruch
chapter: "5"
verses:
  "1": 'Exue te Ierúsalem stola luctus, et vexatiónis tuæ: et índue te decóre, et honóre eius, quæ a Deo tibi est, sempitérnæ glóriæ.'
  "2": Circúmdabit te Deus diplóide iustítiæ, et impónet mitram cápiti honóris ætérni.
  "3": Deus enim osténdet splendórem suum in te omni, qui sub cælo est.
  "4": 'Nominábitur enim tibi nomen tuum a Deo in sempitérnum: Pax iustítiæ, et honor pietátis.'
  "5": 'Exsúrge Ierúsalem, et sta in excélso: et circúmspice ad oriéntem, et vide colléctos fílios tuos ab oriénte sole usque ad occidéntem, in verbo sancti gaudéntes Dei memória.'
  "6": 'Exiérunt enim abs te pédibus ducti ab inimícis: addúcet autem illos Dóminus ad te portátos in honóre sicut fílios regni.'
  "7": 'Constítuit enim Deus humiliáre omnem montem excélsum et rupes perénnes, et conválles replére in æqualitátem terræ: ut ámbulet Israel diligénter in honórem Dei.'
  "8": Obumbravérunt autem et silvæ, et omne lignum suavitátis Israel ex mandáto Dei.
  "9": Addúcet enim Deus Israel cum iucunditáte in lúmine maiestátis suæ, cum misericórdia, et iustítia, quæ est ex ipso.
