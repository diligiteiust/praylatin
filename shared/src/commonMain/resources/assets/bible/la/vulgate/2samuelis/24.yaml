bible: vulgate
lang: la
language: Latina
book: II Samuelis
chapter: "24"
verses:
  "1": 'Et áddidit furor Dómini irásci contra Israel, commovítque David in eis dicéntem: Vade, númera Israel et Iudam.'
  "2": 'Dixítque rex ad Ioab príncipem exércitus sui: Perámbula omnes tribus Israel a Dan usque Bersabée, et numeráte pópulum, ut sciam númerum eius.'
  "3": 'Dixítque Ioab regi: Adáugeat Dóminus Deus tuus ad pópulum tuum, quantus nunc est, iterúmque centúplicet in conspéctu dómini mei regis: sed quid sibi dóminus meus rex vult in re huiuscémodi?'
  "4": 'Obtínuit autem sermo regis verba Ioab, et príncipum exércitus: egressúsque est Ioab, et príncipes mílitum a fácie regis, ut numerárent pópulum Israel.'
  "5": 'Cumque pertransíssent Iordánem, venérunt in Aroer ad déxteram urbis, quæ est in valle Gad:'
  "6": et per Iazer transiérunt in Gálaad, et in terram inferiórem Hodsi, et venérunt in Dan silvéstria. Circumeuntésque iuxta Sidónem,
  "7": 'transiérunt prope mœ́nia Tyri, et omnem terram Hevǽi et Chananǽi, venerúntque ad merídiem Iuda in Bersabée:'
  "8": et lustráta univérsa terra, affuérunt post novem menses et vigínti dies in Ierúsalem.
  "9": Dedit ergo Ioab númerum descriptiónis pópuli regi, et invénta sunt de Israel octingénta míllia virórum fórtium, qui edúcerent gládium, et de Iuda quingénta míllia pugnatórum.
  "10": 'Percússit autem cor David eum, postquam numerátus est pópulus: et dixit David ad Dóminum: Peccávi valde in hoc facto: sed precor Dómine, ut tránsferas iniquitátem servi tui, quia stulte egi nimis.'
  "11": 'Surréxit ítaque David mane, et sermo Dómini factus est ad Gad prophétam et Vidéntem David, dicens:'
  "12": 'Vade, et lóquere ad David: Hæc dicit Dóminus: Trium tibi datur óptio: élige unum quod volúeris ex his, ut fáciam tibi.'
  "13": 'Cumque venísset Gad ad David, nuntiávit ei, dicens: Aut septem annis véniet tibi fames in terra tua: aut tribus ménsibus fúgies adversários tuos, et illi te persequéntur: aut certe tribus diébus erit pestiléntia in terra tua. Nunc ergo delíbera, et vide quem respóndeam ei, qui me misit, sermónem.'
  "14": 'Dixit autem David ad Gad: Coárctor nimis: sed mélius est ut íncidam in manus Dómini (multæ enim misericórdiæ eius sunt) quam in manus hóminum.'
  "15": Immisítque Dóminus pestiléntiam in Israel, de mane usque ad tempus constitútum, et mórtui sunt ex pópulo a Dan usque ad Bersabée septuagínta míllia virórum.
  "16": 'Cumque extendísset manum suam ángelus Dómini super Ierúsalem ut dispérderet eam, misértus est Dóminus super afflictióne, et ait ángelo percutiénti pópulum: Súfficit: nunc cóntine manum tuam: erat autem ángelus Dómini iuxta áream Aréuna Iebusǽi.'
  "17": 'Dixítque David ad Dóminum cum vidísset ángelum cædéntem pópulum: Ego sum qui peccávi, ego iníque egi: isti qui oves sunt, quid fecérunt? vertátur, óbsecro, manus tua contra me, et contra domum patris mei.'
  "18": 'Venit autem Gad ad David in die illa, et dixit ei: Ascénde, et constítue altáre Dómino in área Aréuna Iebusǽi.'
  "19": Et ascéndit David iuxta sermónem Gad, quem præcéperat ei Dóminus.
  "20": 'Conspiciénsque Aréuna, animadvértit regem et servos eius transíre ad se:'
  "21": 'et egréssus adorávit regem prono vultu in terram, et ait: Quid causæ est ut véniat dóminus meus rex ad servum suum? Cui David ait: Ut emam a te áream, et ædíficem altáre Dómino, et cesset interféctio quæ grassátur in pópulo.'
  "22": 'Et ait Aréuna ad David: Accípiat, et ófferat dóminus meus rex sicut placet ei: habes boves in holocáustum, et plaustrum, et iuga boum in usum lignórum.'
  "23": 'Omnia dedit Aréuna rex regi: dixítque Aréuna ad regem: Dóminus Deus tuus suscípiat votum tuum.'
  "24": 'Cui respóndens rex, ait: Nequáquam ut vis, sed emam prétio a te, et non ófferam Dómino Deo meo holocáusta gratuíta. Emit ergo David áream, et boves, argénti siclis quinquagínta:'
  "25": 'et ædificávit ibi David altáre Dómino, et óbtulit holocáusta et pacífica: et propitiátus est Dóminus terræ, et cohíbita est plaga ab Israel.'
