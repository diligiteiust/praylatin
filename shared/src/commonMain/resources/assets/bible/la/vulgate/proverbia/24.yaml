bible: vulgate
lang: la
language: Latina
book: Proverbia
chapter: "24"
verses:
  "1": 'Ne æmuléris viros malos, nec desíderes esse cum eis:'
  "2": quia rapínas meditátur mens eórum, et fraudes lábia eórum loquúntur.
  "3": Sapiéntia ædificábitur domus, et prudéntia roborábitur.
  "4": In doctrína replebúntur cellária, univérsa substántia pretiósa et pulchérrima.
  "5": 'Vir sápiens fortis est: et vir doctus robústus et válidus.'
  "6": 'Quia cum dispositióne inítur bellum: et erit salus ubi multa consília sunt.'
  "7": 'Excélsa stulto sapiéntia: in porta non apériet os suum.'
  "8": Qui cógitat mala fácere, stultus vocábitur.
  "9": Cogitátio stulti peccátum est, et abominátio hóminum detráctor.
  "10": 'Si desperáveris lassus in die angústiæ: imminuétur fortitúdo tua.'
  "11": 'Erue eos, qui ducúntur ad mortem: et qui trahúntur ad intéritum liberáre ne cesses.'
  "12": 'Si díxeris: Vires non súppetunt: qui inspéctor est cordis ipse intélligit, et servatórem ánimæ tuæ nihil fallit, reddétque hómini iuxta ópera sua.'
  "13": 'Cómede, fili mi, mel, quia bonum est, et favum dulcíssimum gútturi tuo:'
  "14": 'sic et doctrína sapiéntiæ ánimæ tuæ: quam cum invéneris, habébis in novíssimis spem, et spes tua non períbit.'
  "15": Ne insidiéris, et quæras impietátem in domo iusti, neque vastes réquiem eius.
  "16": 'Sépties enim cadet iustus, et resúrget: ímpii autem córruent in malum.'
  "17": 'Cum cecíderit inimícus tuus ne gáudeas, et in ruína eius ne exsúltet cor tuum:'
  "18": ne forte vídeat Dóminus, et displíceat ei, et áuferat ab eo iram suam.
  "19": 'Ne conténdas cum péssimis, nec æmuléris ímpios:'
  "20": quóniam non habent futurórum spem mali, et lucérna impiórum exstinguétur.
  "21": 'Time Dóminum, fili mi, et regem: et cum detractóribus non commisceáris:'
  "22": 'quóniam repénte consúrget perdítio eórum: et ruínam utriúsque quis novit?'
  "23": 'Hæc quoque sapiéntibus: Cognóscere persónam in iudício non est bonum.'
  "24": 'Qui dicunt ímpio: Iustus es: maledícent eis pópuli, et detestabúntur eos tribus.'
  "25": 'Qui árguunt eum laudabúntur: et super ipsos véniet benedíctio.'
  "26": Lábia deosculábitur, qui recta verba respóndet.
  "27": 'Prǽpara foris opus tuum, et diligénter exérce agrum tuum: ut póstea ædífices domum tuam.'
  "28": 'Ne sis testis frustra contra próximum tuum: nec lactes quemquam lábiis tuis.'
  "29": 'Ne dicas: Quómodo fecit mihi, sic fáciam ei: reddam unicuíque secúndum opus suum.'
  "30": 'Per agrum hóminis pigri transívi, et per víneam viri stulti:'
  "31": et ecce totum repléverant urtícæ, et operúerant superfíciem eius spinæ, et macéria lápidum destrúcta erat.
  "32": Quod cum vidíssem, pósui in corde meo, et exémplo dídici disciplínam.
  "33": 'Parum, inquam, dórmies, módicum dormitábis, pauxíllum manus cónseres, ut quiéscas:'
  "34": et véniet tibi quasi cursor egéstas, et mendícitas quasi vir armátus.
