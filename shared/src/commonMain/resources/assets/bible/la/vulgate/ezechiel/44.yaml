bible: vulgate
lang: la
language: Latina
book: Ezechiel
chapter: "44"
verses:
  "1": 'Et convértit me ad viam portæ sanctuárii exterióris, quæ respiciébat ad oriéntem: et erat clausa.'
  "2": 'Et dixit Dóminus ad me: Porta hæc clausa erit: non aperiétur, et vir non transíbit per eam: quóniam Dóminus Deus Israel ingréssus est per eam: erítque clausa'
  "3": 'príncipi. Princeps ipse sedébit in ea, ut cómedat panem coram Dómino: per viam portæ vestíbuli ingrediétur, et per viam eius egrediétur.'
  "4": 'Et addúxit me per viam portæ aquilónis in conspéctu domus: et vidi, et ecce implévit glória Dómini domum Dómini: et cécidi in fáciem meam.'
  "5": 'Et dixit ad me Dóminus: Fili hóminis pone cor tuum, et vide óculis tuis, et áuribus tuis audi ómnia, quæ ego loquor ad te de univérsis cæremóniis domus Dómini, et de cunctis légibus eius: et pones cor tuum in viis templi per omnes éxitus sanctuárii.'
  "6": 'Et dices ad exasperántem me domum Israel: Hæc dicit Dóminus Deus: Suffíciant vobis ómnia scélera vestra domus Israel:'
  "7": 'eo quod indúcitis fílios aliénos incircumcísos corde, et incircumcísos carne, ut sint in sanctuário meo, et pólluant domum meam: et offértis panes meos, ádipem et sánguinem, et dissólvitis pactum meum in ómnibus sceléribus vestris.'
  "8": Et non servástis præcépta sanctuárii mei, et posuístis custódes observatiónum meárum in sanctuário meo vobismetípsis.
  "9": 'Hæc dicit Dóminus Deus: Omnis alienígena incircumcísus corde, et incircumcísus carne, non ingrediétur sanctuárium meum: omnis fílius aliénus, qui est in médio filiórum Israel.'
  "10": Sed et Levítæ, qui longe recessérunt a me in erróre filiórum Israel, et erravérunt a me post idóla sua, et portavérunt iniquitátem suam,
  "11": 'erunt in sanctuário meo ædítui, et ianitóres portárum domus, et minístri domus: ipsi mactábunt holocáusta, et víctimas pópuli: et ipsi stabunt in conspéctu eórum, ut minístrent eis.'
  "12": 'Pro eo quod ministravérunt illis in conspéctu idolórum suórum, et facti sunt dómui Israel in offendículum iniquitátis: idcírco levávi manum meam super eos, ait Dóminus Deus, et portábunt iniquitátem suam:'
  "13": 'et non appropinquábunt ad me ut sacerdótio fungántur mihi, neque accédent ad omne sanctuárium meum iuxta sancta sanctórum: sed portábunt confusiónem suam, et scélera sua, quæ fecérunt.'
  "14": Et dabo eos ianitóres domus in omni ministério eius, et in univérsis, quæ fient in ea.
  "15": 'Sacerdótes autem et Levítæ, fílii Sadoc, qui custodiérunt cæremónias sanctuárii mei, cum errárent fílii Israel a me, ipsi accédent ad me ut minístrent mihi: et stabunt in conspéctu meo, ut ófferant mihi ádipem et sánguinem, ait Dóminus Deus.'
  "16": Ipsi ingrediéntur sanctuárium meum, et ipsi accédent ad mensam meam, ut minístrent mihi, et custódiant cæremónias meas.
  "17": 'Cumque ingrediéntur portas átrii interióris, véstibus líneis induéntur: nec ascéndet super eos quidquam láneum, quando minístrant in portis átrii interióris et intrínsecus.'
  "18": Vittæ líneæ erunt in capítibus eórum, et feminália línea erunt in lumbis eórum, et non accingéntur in sudóre.
  "19": 'Cumque egrediéntur átrium extérius ad pópulum, éxuent se vestiméntis suis, in quibus ministráverant, et repónent ea in gazophylácio sanctuárii: et véstient se vestiméntis áliis, et non sanctificábunt pópulum in véstibus suis.'
  "20": 'Caput autem suum non radent, neque comam nútrient: sed tondéntes attóndent cápita sua.'
  "21": Et vinum non bibet omnis sacérdos, quando ingressúrus est átrium intérius.
  "22": 'Et víduam, et repudiátam non accípient uxóres, sed vírgines de sémine domus Israel: sed et víduam, quæ fúerit vídua a sacerdóte, accípient.'
  "23": Et pópulum meum docébunt quid sit inter sanctum et pollútum, et inter mundum et immúndum osténdent eis.
  "24": 'Et cum fúerit controvérsia, stabunt in iudíciis meis, et iudicábunt: leges meas, et præcépta mea in ómnibus solemnitátibus meis custódient, et sábbata mea sanctificábunt.'
  "25": 'Et ad mórtuum hóminem non ingrediéntur, ne polluántur, nisi ad patrem et matrem, et fílium et fíliam, et fratrem et sorórem, quæ álterum virum non habúerit: in quibus contaminabúntur.'
  "26": Et postquam fúerit emundátus, septem dies numerabúntur ei.
  "27": Et in die intróitus sui in sanctuárium ad átrium intérius, ut minístret mihi in sanctuário, ófferet pro peccáto suo, ait Dóminus Deus.
  "28": 'Non erit autem eis heréditas, ego heréditas eórum: et possessiónem non dábitis eis in Israel, ego enim posséssio eórum.'
  "29": 'Víctimam et pro peccáto et pro delícto ipsi cómedent: et omne votum in Israel ipsórum erit.'
  "30": 'Et primitíva ómnium primogenitórum, et ómnia libaménta ex ómnibus, quæ offerúntur, sacerdótum erunt: et primitíva cibórum vestrórum dábitis sacerdóti, ut repónat benedictiónem dómui tuæ.'
  "31": Omne morticínum, et captum a béstia, de ávibus et de pecóribus, non cómedent sacerdótes.
