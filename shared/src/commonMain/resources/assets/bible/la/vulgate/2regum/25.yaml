bible: vulgate
lang: la
language: Latina
book: II Regum
chapter: "25"
verses:
  "1": 'Factum est autem anno nono regni eius, mense décimo, décima die mensis, venit Nabuchodónosor rex Babylónis, ipse et omnis exércitus eius, in Ierúsalem, et circumdedérunt eam: et exstruxérunt in circúitu eius munitiónes.'
  "2": Et clausa est cívitas atque valláta usque ad undécimum annum regis Sedecíæ,
  "3": 'nona die mensis: prævaluítque fames in civitáte, nec erat panis pópulo terræ.'
  "4": 'Et interrúpta est cívitas: et omnes viri bellatóres nocte fugérunt per viam portæ, quæ est inter dúplicem murum ad hortum regis. Porro Chaldǽi obsidébant in circúitu civitátem. Fugit ítaque Sedecías per viam, quæ ducit ad campéstria solitúdinis.'
  "5": 'Et persecútus est exércitus Chaldæórum regem, comprehendítque eum in planítie Iéricho: et omnes bellatóres, qui erant cum eo, dispérsi sunt, et reliquérunt eum.'
  "6": 'Apprehénsum ergo regem duxérunt ad regem Babylónis in Réblatha: qui locútus est cum eo iudícium.'
  "7": Fílios autem Sedecíæ occídit coram eo, et óculos eius effódit, vinxítque eum caténis, et addúxit in Babylónem.
  "8": Mense quinto, séptima die mensis, ipse est annus nonusdécimus regis Babylónis, venit Nabuzárdan princeps exércitus, servus regis Babylónis, in Ierúsalem.
  "9": 'Et succéndit domum Dómini, et domum regis: et domos Ierúsalem, omnémque domum combússit igni.'
  "10": Et muros Ierúsalem in circúitu destrúxit omnis exércitus Chaldæórum, qui erat cum príncipe mílitum.
  "11": Réliquam autem pópuli partem, quæ remánserat in civitáte, et pérfugas, qui transfúgerant ad regem Babylónis, et réliquum vulgus tránstulit Nabuzárdan princeps milítiæ.
  "12": Et de paupéribus terræ relíquit vinitóres et agrícolas.
  "13": Colúmnas autem ǽreas, quæ erant in templo Dómini, et bases, et mare ǽreum, quod erat in domo Dómini, confregérunt Chaldǽi, et transtulérunt æs omne in Babylónem.
  "14": Ollas quoque ǽreas, et trullas, et tridéntes, et scyphos, et mortaríola, et ómnia vasa ǽrea, in quibus ministrábant, tulérunt.
  "15": 'Necnon et thuríbula, et phíalas: quæ áurea, áurea: et quæ argéntea, argéntea tulit princeps milítiæ,'
  "16": 'id est, colúmnas duas, mare unum, et bases quas fécerat Sálomon in templo Dómini: non erat pondus æris ómnium vasórum.'
  "17": 'Decem et octo cúbitos altitúdinis habébat colúmna una: et capitéllum ǽreum super se altitúdinis trium cubitórum: et retiáculum, et malogranáta super capitéllum colúmnæ, ómnia ǽrea: símilem et colúmna secúnda habébat ornátum.'
  "18": Tulit quoque princeps milítiæ Saraíam sacerdótem primum, et Sophoníam sacerdótem secúndum, et tres ianitóres.
  "19": 'Et de civitáte eunúchum unum, qui erat præféctus super bellatóres viros: et quinque viros de his, qui stéterant coram rege, quos réperit in civitáte: et Sopher príncipem exércitus, qui probábat tyrónes de pópulo terræ: et sexagínta viros e vulgo, qui invénti fúerant in civitáte.'
  "20": Quos tollens Nabuzárdan princeps mílitum, duxit ad regem Babylónis in Réblatha.
  "21": 'Percussítque eos rex Babylónis, et interfécit eos in Réblatha in terra Emath: et translátus est Iuda de terra sua.'
  "22": Pópulo autem, qui relíctus erat in terra Iuda, quem dimíserat Nabuchodónosor rex Babylónis, præfécit Godolíam fílium Ahicam fílii Saphan.
  "23": 'Quod cum audíssent omnes duces mílitum, ipsi et viri qui erant cum eis, vidélicet quod constituísset rex Babylónis Godolíam: venérunt ad Godolíam in Maspha, Ismahel fílius Nathaníæ, et Ióhanan fílius Carée, et Saraía fílius Thanéhumeth Netophathítes, et Iezonías fílius Maáchathi, ipsi et sócii eórum.'
  "24": 'Iuravítque Godolías ipsis et sóciis eórum, dicens: Nolíte timére servíre Chaldǽis: manéte in terra, et servíte regi Babylónis, et bene erit vobis.'
  "25": 'Factum est autem in mense séptimo, venit Ismahel fílius Nathaníæ fílii Elísama de sémine régio, et decem viri cum eo: percusserúntque Godolíam, qui et mórtuus est: sed et Iudǽos et Chaldǽos, qui erant cum eo in Maspha.'
  "26": Consurgénsque omnis pópulus a parvo usque ad magnum, et príncipes mílitum, venérunt in Ægýptum, timéntes Chaldǽos.
  "27": 'Factum est vero in anno trigésimo séptimo transmigratiónis Ióachin regis Iuda, mense duodécimo, vigésima séptima die mensis: sublevávit Evilmérodach rex Babylónis, anno quo regnáre cœ́perat, caput Ióachin regis Iuda de cárcere.'
  "28": 'Et locútus est ei benígne: et pósuit thronum eius super thronum regum, qui erant cum eo in Babylóne.'
  "29": Et mutávit vestes eius, quas habúerat in cárcere, et comedébat panem semper in conspéctu eius cunctis diébus vitæ suæ.
  "30": Annónam quoque constítuit ei sine intermissióne, quæ et dabátur ei a rege per síngulos dies ómnibus diébus vitæ suæ.
