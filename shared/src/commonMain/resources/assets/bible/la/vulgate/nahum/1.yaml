bible: vulgate
lang: la
language: Latina
book: Nahum
chapter: "1"
verses:
  "1": Onus Nínive. Liber visiónis Nahum Elcesǽi.
  "2": 'Deus æmulátor, et ulcíscens Dóminus: ulcíscens Dóminus, et habens furórem: ulcíscens Dóminus in hostes suos, et iráscens ipse inimícis suis.'
  "3": Dóminus pátiens, et magnus fortitúdine, et mundans non fáciet innocéntem. Dóminus in tempestáte, et túrbine viæ eius, et nébulæ pulvis pedum eius.
  "4": 'Increpans mare, et exsíccans illud, et ómnia flúmina ad desértum dedúcens. Infirmátus est Basan, et Carmélus: et flos Líbani elánguit.'
  "5": 'Montes commóti sunt ab eo, et colles desoláti sunt: et contrémuit terra a fácie eius, et orbis, et omnes habitántes in eo.'
  "6": 'Ante fáciem indignatiónis eius quis stabit? et quis resístet in ira furóris eius? indignátio eius effúsa est ut ignis: et petræ dissolútæ sunt ab eo.'
  "7": 'Bonus Dóminus, et confórtans in die tribulatiónis: et sciens sperántes in se.'
  "8": 'Et in dilúvio prætereúnte consummatiónem fáciet loci eius: et inimícos eius persequéntur ténebræ.'
  "9": 'Quid cogitátis contra Dóminum? consummatiónem ipse fáciet: non consúrget duplex tribulátio.'
  "10": 'Quia sicut spinæ se ínvicem complectúntur, sic convívium eórum páriter potántium: consuméntur quasi stípula ariditáte plena.'
  "11": 'Ex te exíbit cógitans contra Dóminum malítiam: mente pertráctans prævaricatiónem.'
  "12": 'Hæc dicit Dóminus: Si perfécti fúerint, et ita plures, sic quoque attondéntur, et pertransíbit: afflíxi te, et non afflígam te ultra.'
  "13": Et nunc cónteram virgam eius de dorso tuo, et víncula tua disrúmpam.
  "14": 'Et præcípiet super te Dóminus, non seminábitur ex nómine tuo ámplius: de domo Dei tui interfíciam scúlptile, et conflátile, ponam sepúlcrum tuum, quia inhonorátus es.'
  "15": 'Ecce super montes pedes evangelizántis, et annuntiántis pacem: célebra Iuda festivitátes tuas, et redde vota tua: quia non adíciet ultra ut pertránseat in te Bélial: univérsus intériit.'
