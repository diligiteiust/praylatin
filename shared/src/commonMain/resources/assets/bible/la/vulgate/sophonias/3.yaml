bible: vulgate
lang: la
language: Latina
book: Sophonias
chapter: "3"
verses:
  "1": Væ provocátrix, et redémpta cívitas, colúmba.
  "2": 'Non audívit vocem, et non suscépit disciplínam: in Dómino non est confísa, ad Deum suum non appropinquávit.'
  "3": 'Príncipes eius in médio eius quasi leónes rugiéntes: iúdices eius lupi véspere, non relinquébant in mane.'
  "4": 'Prophétæ eius vesáni, viri infidéles: sacerdótes eius polluérunt sanctum, iniúste egérunt contra legem.'
  "5": 'Dóminus iustus in médio eius non fáciet iniquitátem: mane mane iudícium suum dabit in lucem, et non abscondétur: nescívit autem iníquus confusiónem.'
  "6": 'Dispérdidi gentes, et dissipáti sunt ánguli eárum: desértas feci vias eórum, dum non est qui tránseat: desolátæ sunt civitátes eórum, non remanénte viro, neque ullo habitatóre.'
  "7": 'Dixi: Attamen timébis me, suscípies disciplínam: et non períbit habitáculum eius propter ómnia, in quibus visitávi eam: verúmtamen dilúculo surgéntes corrupérunt omnes cogitatiónes suas.'
  "8": 'Quaprópter exspécta me, dicit Dóminus, in die resurrectiónis meæ in futúrum, quia iudícium meum ut cóngregem gentes, et cólligam regna: et effúndam super eos indignatiónem meam, omnem iram furóris mei: in igne enim zeli mei devorábitur omnis terra.'
  "9": Quia tunc reddam pópulis lábium eléctum, ut ínvocent omnes in nómine Dómini, et sérviant ei húmero uno.
  "10": Ultra flúmina Æthiópiæ, inde súpplices mei, fílii dispersórum meórum déferent munus mihi.
  "11": 'In die illa non confundéris super cunctis adinventiónibus tuis, quibus prævaricáta es in me: quia tunc áuferam de médio tui magníloquos supérbiæ tuæ, et non adícies exaltári ámplius in monte sancto meo.'
  "12": 'Et derelínquam in médio tui pópulum páuperem, et egénum: et sperábunt in nómine Dómini.'
  "13": 'Relíquiæ Israel non fácient iniquitátem, nec loquéntur mendácium, et non inveniétur in ore eórum lingua dolósa: quóniam ipsi pascéntur, et accubábunt, et non erit qui extérreat.'
  "14": 'Lauda fília Sion: iúbila Israel: lætáre, et exsúlta in omni corde fília Ierúsalem.'
  "15": 'Abstulit Dóminus iudícium tuum, avértit inimícos tuos: rex Israel Dóminus in médio tui, non timébis malum ultra.'
  "16": 'In die illa dicétur Ierúsalem: Noli timére: Sion, Non dissolvántur manus tuæ.'
  "17": 'Dóminus Deus tuus in médio tui fortis, ipse salvábit: gaudébit super te in lætítia, silébit in dilectióne sua, exsultábit super te in laude.'
  "18": 'Nugas, qui a lege recésserant, congregábo, quia ex te erant: ut non ultra hábeas super eis oppróbrium.'
  "19": 'Ecce ego interfíciam omnes, qui afflixérunt te in témpore illo: et salvábo claudicántem: et eam, quæ eiécta fúerat congregábo: et ponam eos in laudem, et in nomen, in omni terra confusiónis eórum.'
  "20": 'In témpore illo, quo addúcam vos: et in témpore, quo congregábo vos: dabo enim vos in nomen, et in laudem ómnibus pópulis terræ, cum convértero captivitátem vestram coram óculis vestris, dicit Dóminus.'
