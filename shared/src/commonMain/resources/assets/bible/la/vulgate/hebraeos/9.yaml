bible: vulgate
lang: la
language: Latina
book: ad Hebraeos
chapter: "9"
verses:
  "1": Hábuit quidem et prius iustificatiónes cultúræ, et Sanctum sæculáre.
  "2": Tabernáculum enim factum est primum, in quo erant candelábra, et mensa, et proposítio panum, quæ dícitur Sancta.
  "3": 'Post velaméntum autem secúndum, tabernáculum, quod dícitur Sancta sanctórum:'
  "4": áureum habens thuríbulum, et arcam testaménti circumtéctam ex omni parte auro, in qua urna áurea habens manna, et virga Aaron, quæ frondúerat, et tábulæ testaménti,
  "5": 'supérque eam erant chérubim glóriæ obumbrántia propitiatórium: de quibus non est modo dicéndum per síngula.'
  "6": 'His vero ita compósitis, in prióri quidem tabernáculo semper introíbant sacerdótes, sacrificiórum offícia consummántes:'
  "7": 'in secúndo autem semel in anno solus póntifex non sine sánguine, quem offert pro sua, et pópuli ignorántia:'
  "8": 'hoc significánte Spíritu sancto, nondum propalátam esse sanctórum viam, adhuc prióre tabernáculo habénte statum:'
  "9": 'quæ parábola est témporis instántis: iuxta quam múnera, et hóstiæ offerúntur, quæ non possunt iuxta consciéntiam perféctum fácere serviéntem, solúmmodo in cibis, et in pótibus,'
  "10": et váriis baptismátibus, et iustítiis carnis usque ad tempus correctiónis impósitis.
  "11": 'Christus autem assístens póntifex futurórum bonórum, per ámplius et perféctius tabernáculum, non manufáctum, id est, non huius creatiónis:'
  "12": neque per sánguinem hircórum, aut vitulórum, sed per próprium sánguinem introívit semel in Sancta, ætérna redemptióne invénta.
  "13": 'Si enim sanguis hircórum, et taurórum, et cinis vítulæ aspérsus inquinátos sanctíficat ad emundatiónem carnis:'
  "14": quanto magis sanguis Christi, qui per Spíritum sanctum semetípsum óbtulit immaculátum Deo, emundábit consciéntiam nostram ab opéribus mórtuis, ad serviéndum Deo vivénti?
  "15": 'Et ídeo novi testaménti mediátor est: ut morte intercedénte, in redemptiónem eárum prævaricatiónum, quæ erant sub prióri testaménto, repromissiónem accípiant qui vocáti sunt ætérnæ hereditátis.'
  "16": Ubi enim testaméntum est, mors necésse est intercédat testatóris.
  "17": 'Testaméntum enim in mórtuis confirmátum est: alióquin nondum valet, dum vivit qui testátus est.'
  "18": Unde nec primum quidem sine sánguine dedicátum est.
  "19": 'Lecto enim omni mandáto legis a Móyse univérso pópulo: accípiens sánguinem vitulórum, et hircórum cum aqua, et lana coccínea, et hyssópo: ipsum quoque librum, et omnem pópulum aspérsit,'
  "20": 'dicens: Hic sanguis testaménti, quod mandávit ad vos Deus.'
  "21": Etiam tabernáculum, et ómnia vasa ministérii sánguine simíliter aspérsit.
  "22": 'Et ómnia pene in sánguine secúndum legem mundántur: et sine sánguinis effusióne non fit remíssio.'
  "23": 'Necésse est ergo exemplária quidem cæléstium his mundári: ipsa autem cæléstia melióribus hóstiis quam istis.'
  "24": 'Non enim in manufácta Sancta Iesus introívit exemplária verórum: sed in ipsum cælum, ut appáreat nunc vúltui Dei pro nobis:'
  "25": 'neque ut sæpe ófferat semetípsum, quemádmodum póntifex intrat in Sancta per síngulos annos in sánguine aliéno:'
  "26": 'alióquin oportébat eum frequénter pati ab orígine mundi: nunc autem semel in consummatióne sæculórum, ad destitutiónem peccáti, per hóstiam suam appáruit.'
  "27": 'Et quemádmodum statútum est homínibus semel mori, post hoc autem iudícium:'
  "28": 'sic et Christus semel oblátus est ad multórum exhauriénda peccáta: secúndo sine peccáto apparébit exspectántibus se, in salútem.'
