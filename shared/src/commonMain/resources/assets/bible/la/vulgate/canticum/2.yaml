bible: vulgate
lang: la
language: Latina
book: Canticum Canticorum
chapter: "2"
verses:
  "1": Ego flos campi, et lílium convállium.
  "2": Sicut lílium inter spinas, sic amíca mea inter fílias.
  "3": 'Sicut malus inter ligna silvárum, sic diléctus meus inter fílios. Sub umbra illíus, quem desideráveram, sedi: et fructus eius dulcis gútturi meo.'
  "4": 'Introdúxit me in cellam vináriam: ordinávit in me caritátem.'
  "5": 'Fulcíte me flóribus, stipáte me malis: quia amóre lángueo.'
  "6": Læva eius sub cápite meo, et déxtera illíus amplexábitur me.
  "7": Adiúro vos fíliæ Ierúsalem, per cápreas cervósque campórum, ne suscitétis, neque evigiláre faciátis diléctam, quoadúsque ipsa velit.
  "8": 'Vox dilécti mei: ecce iste venit, sáliens in móntibus, transíliens colles.'
  "9": Símilis est diléctus meus cápreæ, hinnulóque cervórum. En ipse stat post paríetem nostrum, respíciens per fenéstras, prospíciens per cancéllos.
  "10": 'En diléctus meus lóquitur mihi: Surge, própera amíca mea, colúmba mea, formósa mea, et veni.'
  "11": 'Iam enim hiems tránsiit: imber ábiit, et recéssit.'
  "12": 'Flores apparuérunt in terra nostra, tempus putatiónis advénit: vox túrturis audíta est in terra nostra:'
  "13": 'ficus prótulit grossos suos: víneæ floréntes dedérunt odórem suum. Surge, amíca mea, speciósa mea, et veni:'
  "14": 'colúmba mea in foramínibus petræ, in cavérna macériæ, osténde mihi fáciem tuam, sonet vox tua in áuribus meis: vox enim tua dulcis, et fácies tua decóra.'
  "15": 'Cápite nobis vulpes párvulas, quæ demoliúntur víneas: nam vínea nostra flóruit.'
  "16": 'Diléctus meus mihi, et ego illi, qui páscitur inter lília:'
  "17": 'donec aspíret dies, et inclinéntur umbræ. Revértere: símilis esto, dilécte mi, cápreæ, hinnulóque cervórum super montes Bether.'
