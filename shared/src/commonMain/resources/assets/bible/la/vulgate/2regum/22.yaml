bible: vulgate
lang: la
language: Latina
book: II Regum
chapter: "22"
verses:
  "1": 'Octo annórum erat Iosías cum regnáre cœpísset, trigínta et uno anno regnávit in Ierúsalem: nomen matris eius Idída fília Hadaía de Bésecath.'
  "2": 'Fecítque quod plácitum erat coram Dómino, et ambulávit per omnes vias David patris sui: non declinávit ad déxteram, sive ad sinístram.'
  "3": 'Anno autem octávo décimo regis Iosíæ, misit rex Saphan fílium Aslía fílii Méssulam scribam templi Dómini, dicens ei:'
  "4": Vade ad Helcíam sacerdótem magnum, ut conflétur pecúnia, quæ illáta est in templum Dómini, quam collegérunt ianitóres templi a pópulo,
  "5": 'detúrque fabris per præpósitos domus Dómini, qui et distríbuant eam his, qui operántur in templo Dómini, ad instauránda sartatécta templi:'
  "6": 'tignáriis vidélicet et cæmentáriis, et iis, qui interrúpta compónunt: et ut emántur ligna, et lápides de lapicidínis, ad instaurándum templum Dómini.'
  "7": Verúmtamen non supputétur eis argéntum quod accípiunt, sed in potestáte hábeant, et in fide.
  "8": 'Dixit autem Helcías póntifex ad Saphan scribam: Librum legis réperi in domo Dómini. Dedítque Helcías volúmen Saphan, qui et legit illud.'
  "9": 'Venit quoque Saphan scriba ad regem, et renuntiávit ei quod præcéperat, et ait: Conflavérunt servi tui pecúniam, quæ repérta est in domo Dómini, et dedérunt ut distribuerétur fabris a præféctis óperum templi Dómini.'
  "10": 'Narrávit quoque Saphan scriba regi, dicens: Librum dedit mihi Helcías sacérdos. Quem cum legísset Saphan coram rege,'
  "11": et audísset rex verba libri legis Dómini, scidit vestiménta sua.
  "12": 'Et præcépit Helcíæ sacerdóti, et Ahicam fílio Saphan, et Achobor fílio Micha, et Saphan scribæ, et Asaíæ servo regis, dicens:'
  "13": 'Ite et consúlite Dóminum super me, et super pópulo, et super omni Iuda, de verbis volúminis istíus, quod invéntum est: magna enim ira Dómini succénsa est contra nos, quia non audiérunt patres nostri verba libri huius, ut fácerent omne quod scriptum est nobis.'
  "14": 'Iérunt ítaque Helcías sacérdos, et Ahicam, et Achobor, et Sapham, et Asaía, ad Holdam prophétidem, uxórem Sellum fílii Thécuæ fílii Araas custódis véstium, quæ habitábat in Ierúsalem in Secúnda: locutíque sunt ad eam.'
  "15": 'Et illa respóndit eis: Hæc dicit Dóminus Deus Israel: Dícite viro, qui misit vos ad me:'
  "16": 'Hæc dicit Dóminus: Ecce ego addúcam mala super locum istum, et super habitatóres eius, ómnia verba legis quæ legit rex Iuda:'
  "17": 'quia dereliquérunt me, et sacrificavérunt diis aliénis, irritántes me in cunctis opéribus mánuum suárum: et succendétur indignátio mea in loco hoc, et non exstinguétur.'
  "18": 'Regi autem Iuda, qui misit vos ut consulerétis Dóminum, sic dicétis: Hæc dicit Dóminus Deus Israel: Pro eo quod audísti verba volúminis,'
  "19": 'et pertérritum est cor tuum, et humiliátus es coram Dómino, audítis sermónibus contra locum istum, et habitatóres eius, quod vidélicet fíerent in stupórem et in maledíctum: et scidísti vestiménta tua, et flevísti coram me, et ego audívi, ait Dóminus:'
  "20": idcírco cólligam te ad patres tuos, et colligéris ad sepúlcrum tuum in pace, ut non vídeant óculi tui ómnia mala, quæ inductúrus sum super locum istum.
