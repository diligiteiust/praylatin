bible: vulgate
lang: la
language: Latina
book: Ruth
chapter: "3"
verses:
  "1": 'Postquam autem revérsa est ad socrum suam, audívit ab ea: Fília mea, quæram tibi réquiem, et providébo ut bene sit tibi.'
  "2": Booz iste, cuius puéllis in agro iuncta es, propínquus noster est, et hac nocte áream hórdei véntilat.
  "3": 'Laváre ígitur, et úngere, et indúere cultióribus vestiméntis, et descénde in áream: non te vídeat homo, donec esum potúmque finíerit.'
  "4": 'Quando autem íerit ad dormiéndum, nota locum in quo dórmiat: veniésque et discoopéries pállium, quo operítur a parte pedum, et proícies te, et ibi iacébis: ipse autem dicet quid ágere débeas.'
  "5": 'Quæ respóndit: Quidquid præcéperis, fáciam.'
  "6": Descendítque in áream, et fecit ómnia, quæ sibi imperáverat socrus.
  "7": Cumque comedísset Booz, et bibísset, et factus esset hilárior, issétque ad dormiéndum iuxta acérvum manipulórum, venit abscóndite, et discoopérto pállio, a pédibus eius se proiécit.
  "8": 'Et ecce, nocte iam média expávit homo, et conturbátus est: vidítque mulíerem iacéntem ad pedes suos,'
  "9": 'et ait illi: Quæ es? Illáque respóndit: Ego sum Ruth ancílla tua: expánde pállium tuum super fámulam tuam, quia propínquus es.'
  "10": 'Et ille: Benedícta, inquit, es a Dómino fília, et priórem misericórdiam posterióre superásti: quia non es secúta iúvenes páuperes, sive dívites.'
  "11": Noli ergo metúere, sed quidquid díxeris mihi, fáciam tibi. Scit enim omnis pópulus, qui hábitat intra portas urbis meæ, mulíerem te esse virtútis.
  "12": Nec ábnuo me propínquum, sed est álius me propínquior.
  "13": 'Quiésce hac nocte: et facto mane, si te volúerit propinquitátis iure retinére, bene res acta est: sin autem ille nolúerit, ego te absque ulla dubitatióne suscípiam, vivit Dóminus: dormi usque mane.'
  "14": 'Dormívit ítaque ad pedes eius, usque ad noctis abscéssum. Surréxit ítaque ántequam hómines se cognóscerent mútuo, et dixit Booz: Cave ne quis nóverit quod huc véneris.'
  "15": 'Et rursum: Expánde, inquit, pállium tuum, quo operíris, et tene utráque manu. Qua extendénte, et tenénte, mensus est sex módios hórdei, et pósuit super eam. Quæ portans ingréssa est civitátem,'
  "16": 'et venit ad socrum suam. Quæ dixit ei: Quid egísti fília? Narravítque ei ómnia, quæ sibi fecísset homo.'
  "17": 'Et ait: Ecce sex módios hórdei dedit mihi, et ait: Nolo vácuam te revérti ad socrum tuam.'
  "18": 'Dixítque Nóemi: Exspécta fília, donec videámus quem res éxitum hábeat: neque enim cessábit homo, nisi compléverit quod locútus est.'
