bible: vulgate
lang: la
language: Latina
book: Proverbia
chapter: "27"
verses:
  "1": Ne gloriéris in crástinum, ignórans quid superventúra páriat dies.
  "2": 'Laudet te aliénus, et non os tuum: extráneus, et non lábia tua.'
  "3": 'Grave est saxum, et onerósa aréna: sed ira stulti utróque grávior.'
  "4": 'Ira non habet misericórdiam, nec erúmpens furor: et ímpetum concitáti ferre quis póterit?'
  "5": Mélior est manifésta corréptio, quam amor abscónditus.
  "6": Melióra sunt vúlnera diligéntis, quam fraudulénta óscula odiéntis.
  "7": 'Anima saturáta calcábit favum: et ánima esúriens étiam amárum pro dulci sumet.'
  "8": Sicut avis tránsmigrans de nido suo, sic vir qui derelínquit locum suum.
  "9": Unguénto et váriis odóribus delectátur cor, et bonis amíci consíliis ánima dulcorátur.
  "10": 'Amícum tuum et amícum patris tui ne dimíseris: et domum fratris tui ne ingrediáris in die afflictiónis tuæ. Mélior est vicínus iuxta, quam frater procul.'
  "11": 'Stude sapiéntiæ fili mi, et lætífica cor meum: ut possis exprobránti respondére sermónem.'
  "12": 'Astútus videns malum, abscónditus est: párvuli transeúntes sustinuérunt dispéndia.'
  "13": 'Tolle vestiméntum eius, qui spopóndit pro extráneo: et pro aliénis aufer ei pignus.'
  "14": Qui benedícit próximo suo voce grandi, de nocte consúrgens maledicénti símilis erit.
  "15": 'Tecta perstillántia in die frígoris, et litigiósa múlier comparántur:'
  "16": qui rétinet eam, quasi qui ventum téneat, et óleum déxteræ suæ vocábit.
  "17": Ferrum ferro exacúitur, et homo exácuit fáciem amíci sui.
  "18": 'Qui servat ficum, cómedet fructus eius: et qui custos est dómini sui, glorificábitur.'
  "19": Quómodo in aquis respléndent vultus prospiciéntium, sic corda hóminum manifésta sunt prudéntibus.
  "20": 'Inférnus et perdítio numquam impléntur: simíliter et óculi hóminum insatiábiles.'
  "21": 'Quómodo probátur in conflatório argéntum, et in fornáce aurum: sic probátur homo ore laudántis. Cor iníqui inquírit mala, cor autem rectum inquírit sciéntiam.'
  "22": Si contúderis stultum in pila quasi ptísanas feriénte désuper pilo, non auferétur ab eo stultítia eius.
  "23": 'Diligénter agnósce vultum pécoris tui, tuósque greges consídera:'
  "24": 'non enim habébis iúgiter potestátem: sed coróna tribuétur in generatiónem et generatiónem.'
  "25": Apérta sunt prata, et apparuérunt herbæ viréntes, et collécta sunt fœna de móntibus.
  "26": 'Agni ad vestiméntum tuum: et hædi, ad agri prétium.'
  "27": 'Suffíciat tibi lac caprárum in cibos tuos, et in necessária domus tuæ: et ad victum ancíllis tuis.'
