bible: vulgate
lang: la
language: Latina
book: Matthaeus
chapter: "4"
verses:
  "1": Tunc Iesus ductus est in desértum a Spíritu, ut tentarétur a diábolo.
  "2": Et cum ieiunásset quadragínta diébus, et quadragínta nóctibus, póstea esúriit.
  "3": 'Et accédens tentátor dixit ei: Si Fílius Dei es, dic ut lápides isti panes fiant.'
  "4": 'Qui respóndens dixit: Scriptum est: Non in solo pane vivit homo, sed in omni verbo, quod procédit de ore Dei.'
  "5": Tunc assúmpsit eum diábolus in sanctam civitátem, et státuit eum super pinnáculum templi,
  "6": 'et dixit ei: Si Fílius Dei es, mitte te deórsum. Scriptum est enim: Quia ángelis suis mandávit de te, et in mánibus tollent te, ne forte offéndas ad lápidem pedem tuum.'
  "7": 'Ait illi Iesus: Rursum scriptum est: Non tentábis Dóminum Deum tuum.'
  "8": 'Iterum assúmpsit eum diábolus in montem excélsum valde: et osténdit ei ómnia regna mundi, et glóriam eórum,'
  "9": 'et dixit ei: Hæc ómnia tibi dabo, si cadens adoráveris me.'
  "10": 'Tunc dicit ei Iesus: Vade Sátana: Scriptum est enim: Dóminum Deum tuum adorábis, et illi soli sérvies.'
  "11": 'Tunc relíquit eum diábolus: et ecce ángeli accessérunt, et ministrábant ei.'
  "12": 'Cum autem audísset Iesus quod Ioánnes tráditus esset, secéssit in Galilǽam:'
  "13": 'et relícta civitáte Názareth, venit, et habitávit in Caphárnaum marítima, in fínibus Zábulon, et Néphthalim:'
  "14": 'ut adimplerétur quod dictum est per Isaíam prophétam:'
  "15": 'Terra Zábulon, et terra Néphthalim, via maris trans Iordánem, Galilǽa géntium:'
  "16": 'pópulus, qui sedébat in ténebris, vidit lucem magnam: et sedéntibus in regióne umbræ mortis, lux orta est eis.'
  "17": 'Exínde cœpit Iesus prædicáre, et dícere: Pœniténtiam ágite: appropinquávit enim regnum cælórum.'
  "18": Ambulans autem Iesus iuxta mare Galilǽæ, vidit duos fratres, Simónem, qui vocátur Petrus, et Andréam fratrem eius, mitténtes rete in mare (erant enim piscatóres),
  "19": 'et ait illis: Veníte post me, et fáciam vos fíeri piscatóres hóminum.'
  "20": At illi contínuo relíctis rétibus secúti sunt eum.
  "21": 'Et procédens inde, vidit álios duos fratres, Iacóbum Zebedǽi, et Ioánnem fratrem eius, in navi cum Zebedǽo patre eórum, reficiéntes rétia sua: et vocávit eos.'
  "22": Illi autem statim relíctis rétibus et patre, secúti sunt eum.
  "23": 'Et circuíbat Iesus totam Galilǽam, docens in synagógis eórum, et prǽdicans Evangélium regni: et sanans omnem languórem, et omnem infirmitátem in pópulo.'
  "24": 'Et ábiit opínio eius in totam Sýriam, et obtulérunt ei omnes male habéntes, váriis languóribus, et torméntis comprehénsos, et qui dæmónia habébant, et lunáticos, et paralýticos, et curávit eos:'
  "25": et secútæ sunt eum turbæ multæ de Galilǽa, et Decápoli, et de Ierosólymis, et de Iudǽa, et de trans Iordánem.
