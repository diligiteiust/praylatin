bible: vulgate
lang: la
language: Latina
book: Ecclesiasticus
chapter: "48"
verses:
  "1": Et surréxit Elías prophéta quasi ignis, et verbum ipsíus quasi fácula ardébat.
  "2": 'Qui indúxit in illos famem, et irritántes illum invídia sua pauci facti sunt: non enim póterant sustinére præcépta Dómini.'
  "3": 'Verbo Dómini contínuit cælum, et deiécit de cælo ignem ter:'
  "4": sic amplificátus est Elías in mirabílibus suis. Et quis potest simíliter sic gloriári tibi?
  "5": Qui sustulísti mórtuum ab ínferis de sorte mortis, in verbo Dómini Dei.
  "6": Qui deiecísti reges ad pernícem, et confregísti fácile poténtiam ipsórum, et gloriósos de lecto suo.
  "7": Qui audis in Sina iudícium, et in Horeb iudícia defensiónis.
  "8": Qui ungis reges ad pœniténtiam, et prophétas facis successóres post te.
  "9": Qui recéptus es in túrbine ignis, in curru equórum igneórum.
  "10": 'Qui scriptus es in iudíciis témporum, leníre iracúndiam Dómini: conciliáre cor patris ad fílium, et restitúere tribus Iacob.'
  "11": 'Beáti sunt, qui te vidérunt, et in amicítia tua decoráti sunt:'
  "12": nam nos vita vívimus tantum, post mortem autem non erit tale nomen nostrum.
  "13": 'Elías quidem in túrbine tectus est, et in Eliséo complétus est spíritus eius: in diébus suis non pertímuit príncipem, et poténtia nemo vicit illum:'
  "14": nec superávit illum verbum áliquod, et mórtuum prophetávit corpus eius.
  "15": In vita sua fecit monstra, et in morte mirabília operátus est.
  "16": 'In ómnibus istis non pœnítuit pópulus, et non recessérunt a peccátis suis, usque dum eiécti sunt de terra sua, et dispérsi sunt in omnem terram:'
  "17": et relícta est gens perpáuca, et princeps in domo David.
  "18": 'Quidam ipsórum fecérunt quod placéret Deo: álii autem multa commisérunt peccáta.'
  "19": 'Ezechías munívit civitátem suam, et indúxit in médium ipsíus aquam: et fodit ferro rupem, et ædificávit ad aquam púteum.'
  "20": 'In diébus ipsíus ascéndit Sennácherib, et misit Rábsacen, et sústulit manum suam contra illos: et éxtulit manum suam in Sion, et supérbus factus est poténtia sua.'
  "21": 'Tunc mota sunt corda et manus ipsórum: et doluérunt quasi parturiéntes mulíeres.'
  "22": 'Et invocavérunt Dóminum misericórdem, et expandéntes manus suas extulérunt ad cælum: et Sanctus Dóminus Deus audívit cito vocem ipsórum.'
  "23": 'Non est commemorátus peccatórum illórum, neque dedit illos inimícis suis: sed purgávit eos in manu Isaíæ sancti prophétæ.'
  "24": 'Deiécit castra Assyriórum, et contrívit illos ángelus Dómini:'
  "25": nam fecit Ezechías quod plácuit Deo, et fórtiter ivit in via David patris sui, quam mandávit illi Isaías prophéta magnus, et fidélis in conspéctu Dei.
  "26": In diébus ipsíus retro rédiit sol, et áddidit regi vitam.
  "27": Spíritu magno vidit última, et consolátus est lugéntes in Sion usque in sempitérnum.
  "28": Osténdit futúra, et abscóndita ántequam evenírent.
