bible: vulgate
lang: la
language: Latina
book: Ieremias
chapter: "35"
verses:
  "1": 'Verbum, quod factum est ad Ieremíam a Dómino in diébus Ióakim fílii Iosíæ regis Iuda, dicens:'
  "2": Vade ad domum Rechabitárum, et lóquere eis, et introdúces eos in domum Dómini, in unam éxedram thesaurórum, et dabis eis bíbere vinum.
  "3": 'Et assúmpsi Iezoníam fílium Ieremíæ fílii Habsaníæ, et fratres eius, et omnes fílios eius, et univérsam domum Rechabitárum:'
  "4": et introdúxi eos in domum Dómini, ad gazophylácium filiórum Hanan fílii Iegedelíæ hóminis Dei, quod erat iuxta gazophylácium príncipum, super thesáurum Maasíæ fílii Sellum, qui erat custos vestíbuli.
  "5": 'Et pósui coram fíliis domus Rechabitárum scyphos plenos vino, et cálices, et dixi ad eos: Bíbite vinum.'
  "6": 'Qui respondérunt: Non bibémus vinum, quia Iónadab fílius Rechab, pater noster, præcépit nobis, dicens: Non bibétis vinum, vos et fílii vestri, usque in sempitérnum:'
  "7": 'et domum non ædificábitis, et seméntem non serétis, et víneas non plantábitis, nec habébitis: sed in tabernáculis habitábitis cunctis diébus vestris, ut vivátis diébus multis super fáciem terræ, in qua vos peregrinámini.'
  "8": 'Obedívimus ergo voci Iónadab fílii Rechab, patris nostri, in ómnibus quæ præcépit nobis, ita ut non biberémus vinum cunctis diébus nostris nos, et mulíeres nostræ, fílii, et fíliæ nostræ:'
  "9": 'et non ædificarémus domos ad habitándum: et víneam, et agrum, et seméntem non habúimus:'
  "10": sed habitávimus in tabernáculis, et obediéntes fúimus iuxta ómnia, quæ præcépit nobis Iónadab pater noster.
  "11": 'Cum autem ascendísset Nabuchodónosor rex Babylónis ad terram nostram, díximus: Veníte, et ingrediámur Ierúsalem a fácie exércitus Chaldæórum, et a fácie exércitus Sýriæ: et mánsimus in Ierúsalem.'
  "12": 'Et factum est verbum Dómini ad Ieremíam, dicens:'
  "13": 'Hæc dicit Dóminus exercítuum, Deus Israel: Vade, et dic viris Iuda et habitatóribus Ierúsalem: Numquid non recipiétis disciplínam, ut obediátis verbis meis, dicit Dóminus?'
  "14": 'Prævaluérunt sermónes Iónadab fílii Rechab, quos præcépit fíliis suis ut non bíberent vinum: et non bibérunt usque ad diem hanc, quia obediérunt præcépto patris sui: ego autem locútus sum ad vos, de mane consúrgens et loquens, et non obedístis mihi.'
  "15": 'Misíque ad vos omnes servos meos prophétas, consúrgens dilúculo, mitténsque et dicens: Convertímini unusquísque a via sua péssima, et bona fácite stúdia vestra: et nolíte sequi deos aliénos, neque colátis eos: et habitábitis in terra, quam dedi vobis et pátribus vestris: et non inclinástis aurem vestram, neque audístis me.'
  "16": 'Firmavérunt ígitur fílii Iónadab fílii Rechab præcéptum patris sui, quod præcéperat eis: pópulus autem iste non obedívit mihi.'
  "17": 'Idcírco hæc dicit Dóminus exercítuum, Deus Israel: Ecce ego addúcam super Iudam et super omnes habitatóres Ierúsalem univérsam afflictiónem, quam locútus sum advérsum illos, eo quod locútus sum ad illos, et non audiérunt: vocávi illos, et non respondérunt mihi.'
  "18": 'Dómui autem Rechabitárum dixit Ieremías: Hæc dicit Dóminus exercítuum, Deus Israel: Pro eo quod obedístis præcépto Iónadab patris vestri, et custodístis ómnia mandáta eius, et fecístis univérsa, quæ præcépit vobis:'
  "19": 'proptérea hæc dicit Dóminus exercítuum, Deus Israel: Non defíciet vir de stirpe Iónadab fílii Rechab, stans in conspéctu meo cunctis diébus.'
