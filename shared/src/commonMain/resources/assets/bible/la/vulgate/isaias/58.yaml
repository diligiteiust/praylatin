bible: vulgate
lang: la
language: Latina
book: Isaias
chapter: "58"
verses:
  "1": Clama, ne cesses, quasi tuba exálta vocem tuam, et annúntia pópulo meo scélera eórum, et dómui Iacob peccáta eórum.
  "2": 'Me étenim de die in diem quærunt, et scire vias meas volunt: quasi gens, quæ iustítiam fécerit, et iudícium Dei sui non derelíquerit: rogant me iudícia iustítiæ: appropinquáre Deo volunt.'
  "3": 'Quare ieiunávimus, et non aspexísti: humiliávimus ánimas nostras, et nescísti? Ecce in die ieiúnii vestri invenítur volúntas vestra, et omnes debitóres vestros repétitis.'
  "4": Ecce ad lites et contentiónes ieiunátis, et percútitis pugno ímpie. Nolíte ieiunáre sicut usque ad hanc diem, ut audiátur in excélso clamor vester.
  "5": Numquid tale est ieiúnium quod elégi, per diem afflígere hóminem ánimam suam? numquid contorquére quasi círculum caput suum, et saccum et cínerem stérnere? numquid istud vocábis ieiúnium, et diem acceptábilem Dómino?
  "6": Nonne hoc est magis ieiúnium, quod elégi? dissólve colligatiónes impietátis, solve fascículos depriméntes, dimítte eos, qui confrácti sunt, líberos, et omne onus dirúmpe.
  "7": 'Frange esuriénti panem tuum, et egénos vagósque induc in domum tuam: cum víderis nudum, óperi eum, et carnem tuam ne despéxeris.'
  "8": Tunc erúmpet quasi mane lumen tuum, et sánitas tua cítius oriétur, et anteíbit fáciem tuam iustítia tua, et glória Dómini cólliget te.
  "9": 'Tunc invocábis, et Dóminus exáudiet: clamábis, et dicet: Ecce adsum: si abstúleris de médio tui caténam, et desíeris exténdere dígitum, et loqui quod non prodest.'
  "10": Cum effúderis esuriénti ánimam tuam, et ánimam afflíctam repléveris, oriétur in ténebris lux tua, et ténebræ tuæ erunt sicut merídies.
  "11": 'Et réquiem tibi dabit Dóminus semper, et implébit splendóribus ánimam tuam, et ossa tua liberábit: et eris quasi hortus irríguus, et sicut fons aquárum cuius non defícient aquæ.'
  "12": 'Et ædificabúntur in te desérta sæculórum, fundaménta generatiónis et generatiónis suscitábis: et vocáberis ædificátor sépium, avértens sémitas in quiétem.'
  "13": 'Si avérteris a sábbato pedem tuum, fácere voluntátem tuam in die sancto meo, et vocáveris sábbatum delicátum, et sanctum Dómini gloriósum, et glorificáveris eum dum non facis vias tuas, et non invenítur volúntas tua, ut loquáris sermónem:'
  "14": 'tunc delectáberis super Dómino, et sustóllam te super altitúdines terræ, et cibábo te hereditáte Iacob patris tui: os enim Dómini locútum est.'
