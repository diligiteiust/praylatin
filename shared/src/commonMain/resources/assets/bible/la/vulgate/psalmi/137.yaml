bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "137"
verses:
  "1": 'Ipsi David. Confitébor tibi Dómine in toto corde meo: quóniam audísti verba oris mei. In conspéctu angelórum psallam tibi:'
  "2": 'adorábo ad templum sanctum tuum, et confitébor nómini tuo, super misericórdia tua et veritáte tua: quóniam magnificásti super omne, nomen sanctum tuum.'
  "3": 'In quacúmque die invocávero te, exáudi me: multiplicábis in ánima mea virtútem.'
  "4": 'Confiteántur tibi Dómine omnes reges terræ: quia audiérunt ómnia verba oris tui.'
  "5": 'Et cantent in viis Dómini: quóniam magna est glória Dómini.'
  "6": 'Quóniam excélsus Dóminus, et humília réspicit: et alta a longe cognóscit.'
  "7": 'Si ambulávero in médio tribulatiónis, vivificábis me: et super iram inimicórum meórum extendísti manum tuam, et salvum me fecit déxtera tua.'
  "8": 'Dóminus retríbuet pro me: Dómine misericórdia tua in sǽculum: ópera mánuum tuárum ne despícias.'
