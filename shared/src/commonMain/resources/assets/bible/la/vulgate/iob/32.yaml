bible: vulgate
lang: la
language: Latina
book: Iob
chapter: "32"
verses:
  "1": Omisérunt autem tres viri isti respondére Iob, eo quod iustus sibi viderétur.
  "2": 'Et irátus indignatúsque est Eliu fílius Bárachel Buzítes, de cognatióne Ram: irátus est autem advérsum Iob, eo quod iustum se esse díceret coram Deo.'
  "3": Porro advérsum amícos eius indignátus est, eo quod non inveníssent responsiónem rationábilem, sed tantúmmodo condemnássent Iob.
  "4": 'Igitur Eliu exspectávit Iob loquéntem: eo quod senióres essent qui loquebántur.'
  "5": Cum autem vidísset quod tres respondére non potuíssent, irátus est veheménter.
  "6": 'Respondénsque Eliu fílius Bárachel Buzítes, dixit: Iúnior sum témpore, vos autem antiquióres, idcírco demísso cápite, véritus sum vobis indicáre meam senténtiam.'
  "7": Sperábam enim quod ætas prolíxior loquerétur, et annórum multitúdo docéret sapiéntiam.
  "8": Sed, ut vídeo, Spíritus est in homínibus, et inspirátio Omnipoténtis dat intelligéntiam.
  "9": Non sunt longǽvi sapiéntes, nec senes intélligunt iudícium.
  "10": 'Ideo dicam: Audíte me, osténdam vobis étiam ego meam sapiéntiam.'
  "11": 'Exspectávi enim sermónes vestros, audívi prudéntiam vestram, donec disceptarémini sermónibus:'
  "12": 'et donec putábam vos áliquid dícere, considerábam: sed, ut vídeo, non est qui possit argúere Iob, et respondére ex vobis sermónibus eius.'
  "13": 'Ne forte dicátis: Invénimus sapiéntiam, Deus proiécit eum, non homo.'
  "14": Nihil locútus est mihi, et ego non secúndum sermónes vestros respondébo illi.
  "15": Extimuérunt, nec respondérunt ultra, abstulerúntque a se elóquia.
  "16": 'Quóniam ígitur exspectávi, et non sunt locúti: stetérunt, nec ultra respondérunt:'
  "17": respondébo et ego partem meam, et osténdam sciéntiam meam.
  "18": Plenus sum enim sermónibus, et coárctat me spíritus úteri mei.
  "19": En venter meus quasi mustum absque spiráculo, quod lagúnculas novas disrúmpit.
  "20": 'Loquar, et respirábo páululum: apériam lábia mea, et respondébo.'
  "21": Non accípiam persónam viri, et Deum hómini non æquábo.
  "22": Néscio enim quámdiu subsístam, et si post módicum tollat me Factor meus.
