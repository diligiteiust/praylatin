bible: vulgate
lang: la
language: Latina
book: II Paralipomenon
chapter: "18"
verses:
  "1": Fuit ergo Iósaphat dives et ínclytus multum, et affinitáte coniúnctus est Achab.
  "2": 'Descendítque post annos ad eum in Samaríam: ad cuius advéntum mactávit Achab aríetes, et boves plúrimos, ipsi, et pópulo qui vénerat cum eo: persuasítque illi ut ascénderet in Ramoth Gálaad.'
  "3": 'Dixítque Achab rex Israel ad Iósaphat regem Iuda: Veni mecum in Ramoth Gálaad. Cui ille respóndit: Ut ego, et tu: sicut pópulus tuus, sic et pópulus meus: tecúmque érimus in bello.'
  "4": 'Dixítque Iósaphat ad regem Israel: Cónsule óbsecro impræsentiárum sermónem Dómini.'
  "5": 'Congregávit ígitur rex Israel prophetárum quadringéntos viros, et dixit ad eos: In Ramoth Gálaad ad bellándum ire debémus, an quiéscere? At illi: Ascénde, ínquiunt, et tradet Deus in manu regis.'
  "6": 'Dixítque Iósaphat: Numquid non est hic prophétes Dómini, ut ab illo étiam requirámus?'
  "7": 'Et ait rex Israel ad Iósaphat: Est vir unus a quo póssumus quǽrere Dómini voluntátem: sed ego odi eum, quia non prophétat mihi bonum, sed malum omni témpore: est autem Michǽas fílius Iemla. Dixítque Iósaphat: Ne loquáris rex hoc modo.'
  "8": 'Vocávit ergo rex Israel unum de eunúchis, et dixit ei: Voca cito Michǽam fílium Iemla.'
  "9": 'Porro rex Israel, et Iósaphat rex Iuda, utérque sedébant in sólio suo, vestíti cultu régio: sedébant autem in área iuxta portam Samaríæ, omnésque prophétæ vaticinabántur coram eis.'
  "10": 'Sedecías vero fílius Chanáana fecit sibi córnua férrea, et ait: Hæc dicit Dóminus: His ventilábis Sýriam, donec cónteras eam.'
  "11": 'Omnésque prophétæ simíliter prophetábant, atque dicébant: Ascénde in Ramoth Gálaad, et prosperáberis, et tradet eos Dóminus in manu regis.'
  "12": 'Núntius autem, qui íerat ad vocándum Michǽam, ait illi: En verba ómnium prophetárum uno ore bona regi annúntiant: quæso ergo te ut et sermo tuus ab eis non disséntiat, loquarísque próspera.'
  "13": 'Cui respóndit Michǽas: Vivit Dóminus, quia quodcúmque díxerit mihi Deus meus, hoc loquar.'
  "14": 'Venit ergo ad regem. Cui rex ait: Michǽa, ire debémus in Ramoth Gálaad ad bellándum, an quiéscere? Cui ille respóndit: Ascéndite: cuncta enim próspera evénient, et tradéntur hostes in manus vestras.'
  "15": 'Dixítque rex: Iterum atque íterum te adiúro, ut mihi non loquáris, nisi quod verum est in nómine Dómini.'
  "16": 'At ille ait: Vidi univérsum Israel dispérsum in móntibus, sicut oves absque pastóre: et dixit Dóminus: Non habent isti dóminos: revertátur unusquísque in domum suam in pace.'
  "17": 'Et ait rex Israel ad Iósaphat: Nonne dixi tibi, quod non prophetáret iste mihi quidquam boni, sed ea, quæ mala sunt?'
  "18": 'At ille, Idcírco, ait, audíte verbum Dómini: Vidi Dóminum sedéntem in sólio suo, et omnem exércitum cæli assisténtem ei a dextris et a sinístris.'
  "19": 'Et dixit Dóminus: Quis decípiet Achab regem Israel, ut ascéndat et córruat in Ramoth Gálaad? Cumque díceret unus hoc modo, et alter álio,'
  "20": 'procéssit spíritus, et stetit coram Dómino, et ait: Ego decípiam eum. Cui Dóminus: In quo, inquit, decípies?'
  "21": 'At ille respóndit: Egrédiar, et ero spíritus mendax in ore ómnium prophetárum eius. Dixítque Dóminus: Decípies, et prævalébis: egrédere, et fac ita.'
  "22": Nunc ígitur, ecce Dóminus dedit spíritum mendácii in ore ómnium prophetárum tuórum, et Dóminus locútus est de te mala.
  "23": 'Accéssit autem Sedecías fílius Chanáana, et percússit Michǽæ maxíllam, et ait: Per quam viam transívit spíritus Dómini a me, ut loquerétur tibi?'
  "24": 'Dixítque Michǽas: Tu ipse vidébis in die illo, quando ingréssus fúeris cubículum de cubículo ut abscondáris.'
  "25": 'Præcépit autem rex Israel, dicens: Tóllite Michǽam, et dúcite eum ad Amon príncipem civitátis, et ad Ioas fílium Amelech.'
  "26": 'Et dicétis: Hæc dicit rex: Míttite hunc in cárcerem, et date ei panis módicum, et aquæ pauxíllum, donec revértar in pace.'
  "27": 'Dixítque Michǽas: Si revérsus fúeris in pace, non est locútus Dóminus in me. Et ait: Audíte omnes pópuli.'
  "28": Igitur ascendérunt rex Israel, et Iósaphat rex Iuda in Ramoth Gálaad.
  "29": 'Dixítque rex Israel ad Iósaphat: Mutábo hábitum, et sic ad pugnam vadam: tu autem indúere véstibus tuis. Mutatóque rex Israel hábitu, venit ad bellum.'
  "30": 'Rex autem Sýriæ præcéperat dúcibus equitátus sui, dicens: Ne pugnétis contra mínimum, aut contra máximum, nisi contra solum regem Israel.'
  "31": 'Itaque cum vidíssent príncipes equitátus Iósaphat, dixérunt: Rex Israel est iste. Et circumdedérunt eum dimicántes: at ille clamávit ad Dóminum, et auxiliátus est ei, atque avértit eos ab illo.'
  "32": Cum enim vidíssent duces equitátus, quod non esset rex Israel, reliquérunt eum.
  "33": 'Accidit autem ut unus e pópulo sagíttam in incértum iáceret, et percúteret regem Israel inter cervícem et scápulas: at ille aurígæ suo ait: Convérte manum tuam, et educ me de ácie, quia vulnerátus sum.'
  "34": 'Et finíta est pugna in die illo: porro rex Israel stabat in curru suo contra Syros usque ad vésperam, et mórtuus est occidénte sole.'
