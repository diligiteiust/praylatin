bible: vulgate
lang: la
language: Latina
book: Apocalypsis
chapter: "14"
verses:
  "1": 'Et vidi: et ecce Agnus stabat supra montem Sion, et cum eo centum quadragínta quátuor míllia, habéntes nomen eius, et nomen Patris eius scriptum in fróntibus suis.'
  "2": 'Et audívi vocem de cælo, tamquam vocem aquárum multárum, et tamquam vocem tonítrui magni: et vocem, quam audívi, sicut citharœdórum citharizántium in cítharis suis.'
  "3": 'Et cantábant quasi cánticum novum ante sedem, et ante quátuor animália, et senióres: et nemo póterat dícere cánticum, nisi illa centum quadragínta quátuor míllia, qui empti sunt de terra.'
  "4": 'Hi sunt, qui cum muliéribus non sunt coinquináti: vírgines enim sunt. Hi sequúntur Agnum quocúmque íerit. Hi empti sunt ex homínibus primítiæ Deo, et Agno:'
  "5": 'et in ore eórum non est invéntum mendácium: sine mácula enim sunt ante thronum Dei.'
  "6": 'Et vidi álterum ángelum volántem per médium cæli, habéntem Evangélium ætérnum, ut evangelizáret sedéntibus super terram, et super omnem gentem, et tribum, et linguam, et pópulum:'
  "7": 'dicens magna voce: Timéte Dóminum, et date illi honórem, quia venit hora iudícii eius: et adoráte eum, qui fecit cælum, et terram, mare, et fontes aquárum.'
  "8": 'Et álius ángelus secútus est dicens: Cécidit, cécidit Bábylon illa magna: quæ a vino iræ fornicatiónis suæ potávit omnes gentes.'
  "9": 'Et tértius ángelus secútus est illos, dicens voce magna: Si quis adoráverit béstiam, et imáginem eius, et accéperit charactérem in fronte sua, aut in manu sua:'
  "10": 'et hic bibet de vino iræ Dei, quod mistum est mero in cálice iræ ipsíus, et cruciábitur igne, et súlphure in conspéctu angelórum sanctórum, et ante conspéctum Agni:'
  "11": 'et fumus tormentórum eórum ascéndet in sǽcula sæculórum: nec habent réquiem die ac nocte, qui adoravérunt béstiam, et imáginem eius, et si quis accéperit charactérem nóminis eius.'
  "12": Hic patiéntia sanctórum est, qui custódiunt mandáta Dei, et fidem Iesu.
  "13": 'Et audívi vocem de cælo, dicéntem mihi: Scribe: Beáti mórtui, qui in Dómino moriúntur. Amodo iam dicit Spíritus, ut requiéscant a labóribus suis: ópera enim illórum sequúntur illos.'
  "14": 'Et vidi: et ecce nubem cándidam, et super nubem sedéntem símilem Fílio hóminis, habéntem in cápite suo corónam áuream, et in manu sua falcem acútam.'
  "15": 'Et álius ángelus exívit de templo, clamans voce magna ad sedéntem super nubem: Mitte falcem tuam, et mete, quia venit hora ut metátur, quóniam áruit messis terræ.'
  "16": Et misit qui sedébat super nubem, falcem suam in terram, et deméssa est terra.
  "17": Et álius ángelus exívit de templo, quod est in cælo, habens et ipse falcem acútam.
  "18": 'Et álius ángelus exívit de altári, qui habébat potestátem supra ignem: et clamávit voce magna ad eum, qui habébat falcem acútam, dicens: Mitte falcem tuam acútam, et vindémia botros víneæ terræ: quóniam matúræ sunt uvæ eius.'
  "19": 'Et misit ángelus falcem suam acútam in terram, et vindemiávit víneam terræ, et misit in lacum iræ Dei magnum:'
  "20": et calcátus est lacus extra civitátem, et exívit sanguis de lacu usque ad frenos equórum per stádia mille sexcénta.
