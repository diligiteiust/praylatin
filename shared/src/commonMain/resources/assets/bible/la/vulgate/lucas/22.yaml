bible: vulgate
lang: la
language: Latina
book: Lucas
chapter: "22"
verses:
  "1": 'Appropinquábat autem dies festus azymórum, qui dícitur Pascha:'
  "2": 'et quærébant príncipes sacerdótum, et scribæ, quómodo Iesum interfícerent: timébant vero plebem.'
  "3": 'Intrávit autem Sátanas in Iudam, qui cognominabátur Iscariótes, unum de duódecim:'
  "4": et ábiit, et locútus est cum princípibus sacerdótum, et magistrátibus, quemádmodum illum tráderet eis.
  "5": Et gavísi sunt, et pacti sunt pecúniam illi dare.
  "6": Et spopóndit, et quærébat opportunitátem ut tráderet illum sine turbis.
  "7": Venit autem dies azymórum, in qua necésse erat occídi pascha.
  "8": 'Et misit Petrum, et Ioánnem, dicens: Eúntes paráte nobis pascha, ut manducémus.'
  "9": 'At illi dixérunt: Ubi vis parémus?'
  "10": 'Et dixit ad eos: Ecce introeúntibus vobis in civitátem occúrret vobis homo quidam ámphoram aquæ portans: sequímini eum in domum, in quam intrat,'
  "11": 'et dicétis patrifamílias domus: Dicit tibi Magíster: Ubi est diversórium, ubi pascha cum discípulis meis mandúcem?'
  "12": Et ipse osténdet vobis cœnáculum magnum stratum, et ibi paráte.
  "13": Eúntes autem invenérunt sicut dixit illis, et paravérunt pascha.
  "14": Et cum facta esset hora, discúbuit, et duódecim apóstoli cum eo.
  "15": 'Et ait illis: Desidério desiderávi hoc pascha manducáre vobíscum, ántequam pátiar.'
  "16": Dico enim vobis, quia ex hoc non manducábo illud, donec impleátur in regno Dei.
  "17": 'Et accépto cálice grátias egit, et dixit: Accípite, et divídite inter vos.'
  "18": Dico enim vobis quod non bibam de generatióne vitis donec regnum Dei véniat.
  "19": 'Et accépto pane grátias egit, et fregit, et dedit eis, dicens: Hoc est corpus meum, quod pro vobis datur: hoc fácite in meam commemoratiónem.'
  "20": 'Simíliter et cálicem, postquam cœnávit, dicens: Hic est calix novum testaméntum in sánguine meo, qui pro vobis fundétur.'
  "21": Verúmtamen ecce manus tradéntis me, mecum est in mensa.
  "22": 'Et quidem Fílius hóminis, secúndum quod definítum est, vadit: verúmtamen væ hómini illi, per quem tradétur.'
  "23": Et ipsi cœpérunt quǽrere inter se, quis esset ex eis, qui hoc factúrus esset.
  "24": Facta est autem et conténtio inter eos, quis eórum viderétur esse maior.
  "25": 'Dixit autem eis: Reges géntium dominántur eórum: et qui potestátem habent super eos, benéfici vocántur.'
  "26": 'Vos autem non sic: sed qui maior est in vobis, fiat sicut minor: et qui præcéssor est, sicut ministrátor.'
  "27": 'Nam quis maior est, qui recúmbit, an qui minístrat? nonne qui recúmbit? Ego autem in médio vestrum sum, sicut qui minístrat:'
  "28": vos autem estis, qui permansístis mecum in tentatiónibus meis.
  "29": Et ego dispóno vobis sicut dispósuit mihi Pater meus regnum,
  "30": ut edátis, et bibátis super mensam meam in regno meo, et sedeátis super thronos iudicántes duódecim tribus Israel.
  "31": 'Ait autem Dóminus: Simon, Simon, ecce Sátanas expetívit vos ut cribráret sicut tríticum:'
  "32": 'ego autem rogávi pro te ut non defíciat fides tua: et tu aliquándo convérsus, confírma fratres tuos.'
  "33": 'Qui dixit ei: Dómine, tecum parátus sum et in cárcerem, et in mortem ire.'
  "34": 'At ille dixit: Dico tibi, Petre, non cantábit hódie gallus, donec ter ábneges nosse me. Et dixit eis:'
  "35": Quando misi vos sine sácculo, et pera, et calceaméntis, numquid áliquid défuit vobis?
  "36": 'At illi dixérunt: Nihil. Dixit ergo eis: Sed nunc qui habet sácculum, tollat: simíliter et peram: et qui non habet, vendat túnicam suam, et emat gládium.'
  "37": 'Dico enim vobis, quóniam adhuc hoc, quod scriptum est, opórtet impléri in me: Et cum iníquis deputátus est. Etenim ea, quæ sunt de me, finem habent.'
  "38": 'At illi dixérunt: Dómine, ecce duo gládii hic. At ille dixit eis: Satis est.'
  "39": Et egréssus ibat secúndum consuetúdinem in montem Olivárum. Secúti sunt autem illum et discípuli.
  "40": 'Et cum pervenísset ad locum, dixit illis: Oráte ne intrétis in tentatiónem.'
  "41": 'Et ipse avúlsus est ab eis quantum iactus est lápidis: et pósitis génibus orábat,'
  "42": 'dicens: Pater, si vis, transfer cálicem istum a me: verúmtamen non mea volúntas, sed tua fiat.'
  "43": Appáruit autem illi ángelus de cælo, confórtans eum. Et factus in agónia, prolíxius orábat.
  "44": Et factus est sudor eius sicut guttæ sánguinis decurréntis in terram.
  "45": Et cum surrexísset ab oratióne, et venísset ad discípulos suos, invénit eos dormiéntes præ tristítia.
  "46": 'Et ait illis: Quid dormítis? súrgite, oráte, ne intrétis in tentatiónem.'
  "47": 'Adhuc eo loquénte, ecce turba: et qui vocabátur Iudas, unus de duódecim, antecedébat eos, et appropinquávit Iesu ut oscularétur eum.'
  "48": 'Iesus autem dixit illi: Iuda, ósculo Fílium hóminis tradis?'
  "49": 'Vidéntes autem hi, qui circa ipsum erant, quod futúrum erat, dixérunt ei: Dómine, si percútimus in gládio?'
  "50": Et percússit unus ex illis servum príncipis sacerdótum, et amputávit aurículam eius déxteram.
  "51": 'Respóndens autem Iesus, ait: Sínite usque huc. Et cum tetigísset aurículam eius, sanávit eum.'
  "52": 'Dixit autem Iesus ad eos, qui vénerant ad se príncipes sacerdótum, et magistrátus templi, et senióres: Quasi ad latrónem exístis cum gládiis, et fústibus?'
  "53": 'Cum quotídie vobíscum fúerim in templo, non extendístis manus in me: sed hæc est hora vestra, et potéstas tenebrárum.'
  "54": 'Comprehendéntes autem eum, duxérunt ad domum príncipis sacerdótum: Petrus vero sequebátur a longe.'
  "55": Accénso autem igne in médio átrii, et circumsedéntibus illis, erat Petrus in médio eórum.
  "56": 'Quem cum vidísset ancílla quædam sedéntem ad lumen, et eum fuísset intúita, dixit: Et hic cum illo erat.'
  "57": 'At ille negávit eum, dicens: Múlier, non novi illum.'
  "58": 'Et post pusíllum álius videns eum, dixit: Et tu de illis es. Petrus vero ait: O homo, non sum.'
  "59": 'Et intervállo facto quasi horæ uníus, álius quidam affirmábat, dicens: Vere et hic cum illo erat: nam et Galilǽus est.'
  "60": 'Et ait Petrus: Homo, néscio quid dicis. Et contínuo, adhuc illo loquénte, cantávit gallus.'
  "61": 'Et convérsus Dóminus respéxit Petrum, et recordátus est Petrus verbi Dómini, sicut díxerat: Quia priúsquam gallus cantet, ter me negábis.'
  "62": Et egréssus foras Petrus flevit amáre.
  "63": Et viri qui tenébant illum, illudébant ei, cædéntes.
  "64": 'Et velavérunt eum, et percutiébant fáciem eius: et interrogábant eum, dicéntes: Prophetíza, quis est, qui te percússit?'
  "65": Et ália multa blasphemántes dicébant in eum.
  "66": 'Et ut factus est dies, convenérunt senióres plebis, et príncipes sacerdótum, et scribæ, et duxérunt illum in concílium suum, dicéntes: Si tu es Christus, dic nobis.'
  "67": 'Et ait illis: Si vobis díxero, non credétis mihi:'
  "68": si autem et interrogávero, non respondébitis mihi, neque dimittétis.
  "69": Ex hoc autem erit Fílius hóminis sedens a dextris virtútis Dei.
  "70": 'Dixérunt autem omnes: Tu ergo es Fílius Dei? Qui ait: Vos dícitis, quia ego sum.'
  "71": 'At illi dixérunt: Quid adhuc desiderámus testimónium? ipsi enim audívimus de ore eius.'
