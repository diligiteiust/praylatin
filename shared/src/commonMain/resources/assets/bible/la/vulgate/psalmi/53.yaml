bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "53"
verses:
  "1": In finem, In carmínibus intelléctus David,
  "2": 'cum veníssent Ziphǽi, et dixíssent ad Saul: Nonne David abscónditus est apud nos?'
  "3": 'Deus in nómine tuo salvum me fac: et in virtúte tua iúdica me.'
  "4": 'Deus exáudi oratiónem meam: áuribus pércipe verba oris mei.'
  "5": 'Quóniam aliéni insurrexérunt advérsum me, et fortes quæsiérunt ánimam meam: et non proposuérunt Deum ante conspéctum suum.'
  "6": 'Ecce enim Deus ádiuvat me: et Dóminus suscéptor est ánimæ meæ.'
  "7": 'Avérte mala inimícis meis: et in veritáte tua dispérde illos.'
  "8": 'Voluntárie sacrificábo tibi, et confitébor nómini tuo Dómine: quóniam bonum est.'
  "9": 'Quóniam ex omni tribulatióne eripuísti me: et super inimícos meos despéxit óculus meus.'
