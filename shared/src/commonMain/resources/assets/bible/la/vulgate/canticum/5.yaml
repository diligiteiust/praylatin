bible: vulgate
lang: la
language: Latina
book: Canticum Canticorum
chapter: "5"
verses:
  "1": 'Véniat diléctus meus in hortum suum, et cómedat fructum pomórum suórum. Veni in hortum meum soror mea sponsa, méssui myrrham meam cum aromátibus meis: comédi favum cum melle meo, bibi vinum meum cum lacte meo: comédite amíci, et bíbite, et inebriámini caríssimi.'
  "2": 'Ego dórmio, et cor meum vígilat: vox dilécti mei pulsántis: Aperi mihi soror mea, amíca mea, colúmba mea, immaculáta mea: quia caput meum plenum est rore, et cincínni mei guttis nóctium.'
  "3": Exspoliávi me túnica mea, quómodo índuar illa? lavi pedes meos, quómodo inquinábo illos?
  "4": Diléctus meus misit manum suam per forámen, et venter meus intrémuit ad tactum eius.
  "5": 'Surréxi ut aperírem dilécto meo: manus meæ stillavérunt myrrham, et dígiti mei pleni myrrha probatíssima.'
  "6": 'Péssulum óstii mei apérui dilécto meo, at ille declináverat, atque transíerat. Anima mea liquefácta est, ut locútus est: quæsívi, et non invéni illum: vocávi, et non respóndit mihi.'
  "7": 'Invenérunt me custódes qui circúmeunt civitátem: percussérunt me, et vulneravérunt me. Tulérunt pállium meum mihi custódes murórum.'
  "8": Adiúro vos fíliæ Ierúsalem si invenéritis diléctum meum, ut nuntiétis ei quia amóre lángueo.
  "9": Qualis est diléctus tuus ex dilécto, o pulchérrima mulíerum? qualis est diléctus tuus ex dilécto, quia sic adiurásti nos?
  "10": 'Diléctus meus cándidus et rubicúndus: eléctus ex míllibus.'
  "11": 'Caput eius aurum óptimum: comæ eius sicut elátæ palmárum, nigræ quasi corvus.'
  "12": Oculi eius sicut colúmbæ super rívulos aquárum, quæ lacte sunt lotæ, et résident iuxta fluénta pleníssima.
  "13": Genæ illíus sicut aréolæ arómatum, cónsitæ a pigmentáriis. Lábia eius lília, distillántia myrrham primam.
  "14": Manus illíus tornátiles áureæ, plenæ hyacínthis. Venter eius ebúrneus, distínctus sapphíris.
  "15": Crura illíus colúmnæ marmóreæ, quæ fundátæ sunt super bases áureas. Spécies eius ut Líbani, eléctus ut cedri.
  "16": Guttur illíus suavíssimum, et totus desiderábilis. Talis est diléctus meus, et ipse est amícus meus, fíliæ Ierúsalem.
  "17": Quo ábiit diléctus tuus, o pulchérrima mulíerum? quo declinávit diléctus tuus, et quærémus eum tecum?
