bible: vulgate
lang: la
language: Latina
book: I Machabaeorum
chapter: "1"
verses:
  "1": 'Et factum est, postquam percússit Alexánder Philíppi Mácedo, qui primus regnávit in Grǽcia, egréssus de terra Cethim, Daríum regem Persárum et Medórum:'
  "2": constítuit prœ́lia multa, et obtínuit ómnium munitiónes, et interfécit reges terræ,
  "3": 'et pertránsiit usque ad fines terræ: et accépit spólia multitúdinis géntium, et síluit terra in conspéctu eius.'
  "4": 'Et congregávit virtútem, et exércitum fortem nimis: et exaltátum est, et elevátum cor eius:'
  "5": 'et obtínuit regiónes géntium, et tyránnos: et facti sunt illi in tribútum.'
  "6": Et post hæc décidit in lectum, et cognóvit quia morerétur.
  "7": 'Et vocávit púeros suos nóbiles, qui secum erant nutríti a iuventúte: et divísit illis regnum suum, cum adhuc víveret.'
  "8": Et regnávit Alexánder annis duódecim, et mórtuus est.
  "9": 'Et obtinuérunt púeri eius regnum, unusquísque in loco suo:'
  "10": et imposuérunt omnes sibi diadémata post mortem eius, et fílii eórum post eos annis multis, et multiplicáta sunt mala in terra.
  "11": 'Et éxiit ex eis radix peccátrix, Antíochus illústris, fílius Antíochi regis, qui fúerat Romæ obses: et regnávit in anno centésimo trigésimo séptimo regni Græcórum.'
  "12": 'In diébus illis, exiérunt ex Israel fílii iníqui, et suasérunt multis, dicéntes: Eámus, et disponámus testaméntum cum géntibus, quæ circa nos sunt: quia ex quo recéssimus ab eis, invenérunt nos multa mala.'
  "13": Et bonus visus est sermo in óculis eórum.
  "14": 'Et destinavérunt áliqui de pópulo, et abiérunt ad regem: et dedit illis potestátem ut fácerent iustítiam géntium.'
  "15": 'Et ædificavérunt gymnásium in Ierosólymis secúndum leges natiónum:'
  "16": et fecérunt sibi præpútia, et recessérunt a testaménto sancto, et iuncti sunt natiónibus, et venúmdati sunt ut fácerent malum.
  "17": Et parátum est regnum in conspéctu Antíochi, et cœpit regnáre in terra Ægýpti ut regnáret super duo regna.
  "18": 'Et intrávit in Ægýptum in multitúdine gravi, in cúrribus, et elephántis, et equítibus, et copiósa návium multitúdine:'
  "19": et constítuit bellum advérsus Ptolemǽum regem Ægýpti, et véritus est Ptolemǽus a fácie eius, et fugit, et cecidérunt vulneráti multi.
  "20": Et comprehéndit civitátes munítas in terra Ægýpti, et accépit spólia terræ Ægýpti.
  "21": 'Et convértit Antíochus, postquam percússit Ægýptum in centésimo et quadragésimo tértio anno: et ascéndit ad Israel,'
  "22": et ascéndit Ierosólymam in multitúdine gravi.
  "23": 'Et intrávit in sanctificatiónem cum supérbia, et accépit altáre áureum, et candelábrum lúminis, et univérsa vasa eius, et mensam propositiónis, et libatória, et phíalas, et mortaríola áurea, et velum, et corónas, et ornaméntum áureum, quod in fácie templi erat: et commínuit ómnia.'
  "24": 'Et accépit argéntum, et aurum, et vasa concupiscibília: et accépit thesáuros occúltos, quos invénit: et sublátis ómnibus, ábiit in terram suam.'
  "25": Et fecit cædem hóminum, et locútus est in supérbia magna.
  "26": 'Et factus est planctus magnus in Israel, et in omni loco eórum:'
  "27": 'et ingemuérunt príncipes, et senióres: vírgines, et iúvenes infirmáti sunt: et speciósitas mulíerum immutáta est.'
  "28": 'Omnis marítus sumpsit laméntum, et quæ sedébant in thoro maritáli, lugébant:'
  "29": et commóta est terra super habitántes in ea, et univérsa domus Iacob índuit confusiónem.
  "30": Et post duos annos diérum, misit rex príncipem tributórum in civitátes Iuda, et venit Ierúsalem cum turba magna.
  "31": 'Et locútus est ad eos verba pacífica in dolo: et credidérunt ei.'
  "32": Et írruit super civitátem repénte, et percússit eam plaga magna, et pérdidit pópulum multum ex Israel.
  "33": 'Et accépit spólia civitátis: et succéndit eam igni, et destrúxit domos eius, et muros eius in circúitu:'
  "34": 'et captívas duxérunt mulíeres: et natos, et pécora possedérunt.'
  "35": 'Et ædificavérunt civitátem David muro magno, et firmo, et túrribus firmis, et facta est illis in arcem:'
  "36": 'et posuérunt illic gentem peccatrícem, viros iníquos, et convaluérunt in ea: et posuérunt arma, et escas, et congregavérunt spólia Ierúsalem:'
  "37": 'et reposuérunt illic: et facti sunt in láqueum magnum.'
  "38": 'Et factum est hoc ad insídias sanctificatióni, et in diábolum malum in Israel:'
  "39": et effudérunt sánguinem innocéntem per circúitum sanctificatiónis, et contaminavérunt sanctificatiónem.
  "40": Et fugérunt habitatóres Ierúsalem propter eos, et facta est habitátio exterórum, et facta est éxtera sémini suo, et nati eius reliquérunt eam.
  "41": 'Sanctificátio eius desoláta est sicut solitúdo: dies festi eius convérsi sunt in luctum, sábbata eius in oppróbrium, honóres eius in níhilum.'
  "42": 'Secúndum glóriam eius multiplicáta est ignomínia eius: et sublímitas eius convérsa est in luctum.'
  "43": 'Et scripsit rex Antíochus omni regno suo ut esset omnis pópulus unus: et relínqueret unusquísque legem suam.'
  "44": 'Et consensérunt omnes gentes secúndum verbum regis Antíochi:'
  "45": et multi ex Israel consensérunt servitúti eius, et sacrificavérunt idólis, et coinquinavérunt sábbatum.
  "46": Et misit rex libros per manus nuntiórum in Ierúsalem, et in omnes civitátes Iuda, ut sequeréntur leges géntium terræ,
  "47": et prohibérent holocáusta, et sacrifícia, et placatiónes fíeri in templo Dei,
  "48": 'et prohibérent celebrári sábbatum, et dies solémnes:'
  "49": et iussit coinquinári sancta, et sanctum pópulum Israel.
  "50": Et iussit ædificári aras, et templa, et idóla, et immolári carnes suíllas, et pécora commúnia,
  "51": 'et relínquere fílios suos incircumcísos, et coinquinári ánimas eórum in ómnibus immúndis, et abominatiónibus, ita ut oblivisceréntur legem, et immutárent omnes iustificatiónes Dei:'
  "52": et quicúmque non fecíssent secúndum verbum regis Antíochi, moreréntur.
  "53": 'Secúndum ómnia verba hæc scripsit omni regno suo: et præpósuit príncipes pópulo, qui hæc fíeri cógerent.'
  "54": Et iussérunt civitátibus Iuda sacrificáre.
  "55": 'Et congregáti sunt multi de pópulo ad eos, qui derelíquerant legem Dómini: et fecérunt mala super terram:'
  "56": et effugavérunt pópulum Israel in ábditis, et in abscónditis fugitivórum locis.
  "57": 'Die quintadécima mensis Casleu, quinto et quadragésimo et centésimo anno, ædificávit rex Antíochus abominándum idólum desolatiónis super altáre Dei, et per univérsas civitátes Iuda in circúitu ædificavérunt aras:'
  "58": 'et ante iánuas domórum, et in platéis incendébant thura, et sacrificábant:'
  "59": 'et libros legis Dei combussérunt igni, scindéntes eos:'
  "60": et apud quemcúmque inveniebántur libri testaménti Dómini, et quicúmque observábat legem Dómini, secúndum edíctum regis trucidábant eum.
  "61": In virtúte sua faciébant hæc pópulo Israel, qui inveniebátur in omni mense et mense in civitátibus.
  "62": Et quinta et vigésima die mensis sacrificábant super aram, quæ erat contra altáre.
  "63": Et mulíeres, quæ circumcidébant fílios suos, trucidabántur secúndum iussum regis Antíochi,
  "64": 'et suspendébant púeros a cervícibus per univérsas domos eórum: et eos, qui circumcíderant illos, trucidábant.'
  "65": 'Et multi de pópulo Israel definiérunt apud se, ut non manducárent immúnda: et elegérunt magis mori, quam cibis coinquinári immúndis:'
  "66": 'et noluérunt infríngere legem Dei sanctam, et trucidáti sunt:'
  "67": et facta est ira magna super pópulum valde.
