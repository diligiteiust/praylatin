bible: vulgate
lang: la
language: Latina
book: I Paralipomenon
chapter: "2"
verses:
  "1": 'Fílii autem Israel: Ruben, Símeon, Levi, Iuda, Issachar, et Zábulon,'
  "2": Dan, Ioseph, Béniamin, Néphthali, Gad, et Aser.
  "3": 'Fílii Iuda: Her, Onan, et Sela: hi tres nati sunt ei de fília Sue Chananítide. Fuit autem Her primogénitus Iuda malus coram Dómino, et occídit eum.'
  "4": 'Thamar autem nurus eius péperit ei Phares et Zara: omnes ergo fílii Iuda, quinque.'
  "5": 'Fílii autem Phares: Hesron et Hamul.'
  "6": 'Fílii quoque Zaræ: Zamri, et Ethan, et Eman, Chalchal quoque, et Dara, simul quinque.'
  "7": 'Fílii Charmi: Achar, qui turbávit Israel, et peccávit in furto anathématis.'
  "8": 'Fílii Ethan: Azarías.'
  "9": 'Fílii autem Hesron qui nati sunt ei: Ierámeel, et Ram, et Cálubi.'
  "10": Porro Ram génuit Amínadab. Amínadab autem génuit Nahásson, príncipem filiórum Iuda.
  "11": Nahásson quoque génuit Salma, de quo ortus est Booz.
  "12": Booz vero génuit Obed, qui et ipse génuit Isai.
  "13": Isai autem génuit primogénitum Eliab, secúndum Abínadab, tértium Símmaa,
  "14": quartum Nathánael, quintum Ráddai,
  "15": sextum Asom, séptimum David.
  "16": 'Quorum soróres fuérunt Sárvia et Abígail. Fílii Sárviæ: Abísai, Ioab, et Asael, tres.'
  "17": Abígail autem génuit Amasa, cuius pater fuit Iether Ismahelítes.
  "18": 'Caleb vero fílius Hesron accépit uxórem nómine Azuba, de qua génuit Iérioth: fuerúntque fílii eius Iaser, et Sobab, et Ardon.'
  "19": Cumque mórtua fuísset Azuba, accépit uxórem Caleb Ephratha, quæ péperit ei Hur.
  "20": Porro Hur génuit Uri, et Uri génuit Bezéleel.
  "21": 'Post hæc ingréssus est Hesron ad fíliam Machir patris Gálaad, et accépit eam cum esset annórum sexagínta: quæ péperit ei Segub.'
  "22": Sed et Segub génuit Iair, et possédit vigínti tres civitátes in terra Gálaad.
  "23": 'Cepítque Gessur et Aram óppida Iair, et Canath, et vículos eius sexagínta civitátum: omnes isti fílii Machir patris Gálaad.'
  "24": Cum autem mórtuus esset Hesron, ingréssus est Caleb ad Ephratha. Hábuit quoque Hesron uxórem Abía, quæ péperit ei Assur patrem Thécuæ.
  "25": Nati sunt autem fílii Ierámeel primogéniti Hesron, Ram primogénitus eius, et Buna, et Aram, et Asom, et Achía.
  "26": Duxit quoque uxórem álteram Ierámeel, nómine Atara, quæ fuit mater Onam.
  "27": Sed et fílii Ram primogéniti Ierámeel fuérunt Moos, Iamin, et Achar.
  "28": 'Onam autem hábuit fílios Sémei et Iada. Fílii autem Sémei: Nadab, et Abisur.'
  "29": Nomen vero uxóris Abisur, Abíhail, quæ péperit ei Ahóbban, et Molid.
  "30": Fílii autem Nadab fuérunt Saled, et Apphaim. Mórtuus est autem Saled absque líberis.
  "31": 'Fílius vero Apphaim, Iesi: qui Iesi génuit Sesan. Porro Sesan génuit Ohólai.'
  "32": 'Fílii autem Iada fratris Sémei: Iether, et Iónathan. Sed et Iether mórtuus est absque líberis.'
  "33": Porro Iónathan génuit Phaleth, et Ziza. Isti fuérunt fílii Ierámeel.
  "34": 'Sesan autem non hábuit fílios, sed fílias: et servum Ægýptium nómine Iéraa.'
  "35": 'Dedítque ei fíliam suam uxórem: quæ péperit ei Ethei.'
  "36": Ethei autem génuit Nathan, et Nathan génuit Zabad.
  "37": Zabad quoque génuit Ophlal, et Ophlal génuit Obed.
  "38": Obed génuit Iehu, Iehu génuit Azaríam,
  "39": Azarías génuit Helles, et Helles génuit Elasa.
  "40": Elasa génuit Sisámoi, Sisámoi génuit Sellum,
  "41": Sellum génuit Icamíam, Icamía autem génuit Elísama.
  "42": 'Fílii autem Caleb fratris Ierámeel: Mesa primogénitus eius, ipse est pater Ziph: et fílii Marésa patris Hebron.'
  "43": Porro fílii Hebron, Core, et Táphua, et Recem, et Samma.
  "44": Samma autem génuit Raham, patrem Iércaam, et Recem génuit Sámmai.
  "45": 'Fílius Sámmai, Maon: et Maon pater Bethsur.'
  "46": Epha autem concubína Caleb péperit Haran, et Mosa, et Gezez. Porro Haran génuit Gezez.
  "47": Fílii autem Iaháddai, Regom, et Ióathan, et Gesan, et Phalet, et Epha, et Saaph.
  "48": Concubína Caleb Máacha, péperit Saber, et Thárana.
  "49": Génuit autem Saaph pater Madména Sue, patrem Machbéna et patrem Gábaa. Fília vero Caleb fuit Achsa.
  "50": Hi erant fílii Caleb, fílii Hur primogéniti Ephratha, Sobal pater Cariathíarim.
  "51": Salma pater Béthlehem, Hariph pater Béthgader.
  "52": Fuérunt autem fílii Sobal patris Cariathíarim, Qui vidébat dimídium requietiónum.
  "53": Et de cognatióne Cariathíarim, Iethréi, et Aphuthéi, et Semathéi, et Maseréi. Ex his egréssi sunt Saraítæ, et Esthaolítæ.
  "54": Fílii Salma, Béthlehem, et Netóphathi, corónæ domus Ioab, et Dimídium requietiónis Sárai.
  "55": Cognatiónes quoque scribárum habitántium in Iabes, Canéntes atque Resonántes, et in tabernáculis commorántes. Hi sunt Cinǽi, qui venérunt de Calóre patris domus Rechab.
