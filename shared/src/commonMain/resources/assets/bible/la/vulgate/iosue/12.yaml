bible: vulgate
lang: la
language: Latina
book: Iosue
chapter: "12"
verses:
  "1": Hi sunt reges, quos percussérunt fílii Israel, et possedérunt terram eórum trans Iordánem ad solis ortum, a torrénte Arnon usque ad montem Hermon, et omnem orientálem plagam, quæ réspicit solitúdinem.
  "2": Sehon rex Amorrhæórum, qui habitávit in Hésebon, dominátus est ab Aroer, quæ sita est super ripam torréntis Arnon, et médiæ partis in valle, dimidiǽque Gálaad, usque ad torréntem Iaboc, qui est términus filiórum Ammon.
  "3": 'Et a solitúdine usque ad mare Céneroth contra oriéntem, et usque ad mare desérti, quod est mare salsíssimum, ad orientálem plagam per viam quæ ducit Béthsimoth: et ab austráli parte, quæ súbiacet Asedoth, Phasga.'
  "4": Términus Og regis Basan, de relíquiis Ráphaim, qui habitávit in Astaroth, et in Edrai, et dominátus est in monte Hermon, et in Sálecha, atque in univérsa Basan, usque ad términos
  "5": 'Géssuri, et Macháti, et dimídiæ partis Gálaad: términos Sehon regis Hésebon.'
  "6": Móyses fámulus Dómini, et fílii Israel percussérunt eos, tradidítque terram eórum Móyses in possessiónem Rubenítis, et Gadítis, et dimídiæ tríbui Manásse.
  "7": 'Hi sunt reges terræ, quos percússit Iósue et fílii Israel trans Iordánem ad occidentálem plagam, a Baálgad in campo Líbani, usque ad montem, cuius pars ascéndit in Seir: tradidítque eam Iósue in possessiónem tríbubus Israel, síngulis partes suas,'
  "8": tam in montánis quam in planis atque campéstribus. In Asedoth, et in solitúdine, ac in merídie, Hethǽus fuit et Amorrhǽus, Chananǽus, et Pherezǽus, Hevǽus et Iebusǽus.
  "9": 'Rex Iéricho unus: rex Hai, quæ est ex látere Bethel, unus:'
  "10": rex Ierúsalem unus, rex Hebron unus,
  "11": rex Iérimoth unus, rex Lachis unus,
  "12": rex Eglon unus, rex Gazer unus,
  "13": rex Dabir unus, rex Gader unus,
  "14": rex Herma unus, rex Hered unus,
  "15": rex Lebna unus, rex Odúllam unus,
  "16": rex Macéda unus, rex Bethel unus,
  "17": rex Táphua unus, rex Opher unus,
  "18": rex Aphec unus, rex Saron unus,
  "19": rex Madon unus, rex Asor unus,
  "20": rex Sémeron unus, rex Achsaph unus,
  "21": rex Thenac unus, rex Magéddo unus,
  "22": rex Cades unus, rex Iáchanan Carméli unus,
  "23": rex Dor, et provínciæ Dor unus, rex géntium Galgal unus,
  "24": 'rex Thersa unus: omnes reges trigínta unus.'
