bible: vulgate
lang: la
language: Latina
book: Proverbia
chapter: "17"
verses:
  "1": Mélior est buccélla sicca cum gáudio, quam domus plena víctimis cum iúrgio.
  "2": Servus sápiens dominábitur fíliis stultis, et inter fratres hereditátem dívidet.
  "3": 'Sicut igne probátur argéntum, et aurum camíno: ita corda probat Dóminus.'
  "4": 'Malus obédit linguæ iníquæ: et fallax obtémperat lábiis mendácibus.'
  "5": 'Qui déspicit páuperem éxprobrat factóri eius: et qui ruína lætátur altérius, non erit impunítus.'
  "6": 'Coróna senum fílii filiórum: et glória filiórum patres eórum.'
  "7": 'Non decent stultum verba compósita: nec príncipem lábium méntiens.'
  "8": 'Gemma gratíssima exspectátio præstolántis: quocúmque se vertit, prudénter intélligit.'
  "9": 'Qui celat delíctum quærit amicítias: qui áltero sermóne répetit, séparat fœderátos.'
  "10": Plus próficit corréptio apud prudéntem, quam centum plagæ apud stultum.
  "11": 'Semper iúrgia quærit malus: ángelus autem crudélis mittétur contra eum.'
  "12": Expedit magis ursæ occúrrere raptis fœ́tibus, quam fátuo confidénti in stultítia sua.
  "13": Qui reddit mala pro bonis, non recédet malum de domo eius.
  "14": 'Qui dimíttit aquam, caput est iurgiórum: et ántequam patiátur contuméliam, iudícium déserit.'
  "15": Qui iustíficat ímpium, et qui condémnat iustum, abominábilis est utérque apud Deum.
  "16": 'Quid prodest stulto habére divítias, cum sapiéntiam émere non possit? Qui altam facit domum suam, quærit ruínam: et qui evítat díscere, íncidet in mala.'
  "17": 'Omni témpore díligit qui amícus est: et frater in angústiis comprobátur.'
  "18": Stultus homo plaudet mánibus, cum spopónderit pro amíco suo.
  "19": 'Qui meditátur discórdias, díligit rixas: et qui exáltat óstium, quærit ruínam.'
  "20": 'Qui pervérsi cordis est, non invéniet bonum: et qui vertit linguam, íncidet in malum.'
  "21": 'Natus est stultus in ignomíniam suam: sed nec pater in fátuo lætábitur.'
  "22": 'Animus gaudens ætátem flóridam facit: spíritus tristis exsíccat ossa.'
  "23": Múnera de sinu ímpius áccipit, ut pervértat sémitas iudícii.
  "24": 'In fácie prudéntis lucet sapiéntia: óculi stultórum in fínibus terræ.'
  "25": 'Ira patris, fílius stultus: et dolor matris quæ génuit eum.'
  "26": 'Non est bonum damnum inférre iusto: nec percútere príncipem, qui recta iúdicat.'
  "27": 'Qui moderátur sermónes suos, doctus et prudens est: et pretiósi spíritus vir erudítus.'
  "28": 'Stultus quoque si tacúerit, sápiens reputábitur: et si comprésserit lábia sua, intélligens.'
