bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "35"
verses:
  "1": In finem, servo Dómini ipsi David.
  "2": 'Dixit iniústus ut delínquat in semetípso: non est timor Dei ante óculos eius.'
  "3": 'Quóniam dolóse egit in conspéctu eius: ut inveniátur iníquitas eius ad ódium.'
  "4": 'Verba oris eius iníquitas, et dolus: nóluit intellígere ut bene ágeret.'
  "5": 'Iniquitátem meditátus est in cubíli suo: ástitit omni viæ non bonæ, malítiam autem non odívit.'
  "6": 'Dómine in cælo misericórdia tua: et véritas tua usque ad nubes.'
  "7": 'Iustítia tua sicut montes Dei: iudícia tua abýssus multa. Hómines, et iuménta salvábis Dómine:'
  "8": quemádmodum multiplicásti misericórdiam tuam Deus. Fílii autem hóminum in tégmine alárum tuárum sperábunt.
  "9": 'Inebriabúntur ab ubertáte domus tuæ: et torrénte voluptátis tuæ potábis eos.'
  "10": 'Quóniam apud te est fons vitæ: et in lúmine tuo vidébimus lumen.'
  "11": Præténde misericórdiam tuam sciéntibus te, et iustítiam tuam his, qui recto sunt corde.
  "12": 'Non véniat mihi pes supérbiæ: et manus peccatóris non móveat me.'
  "13": 'Ibi cecidérunt qui operántur iniquitátem: expúlsi sunt, nec potuérunt stare.'
