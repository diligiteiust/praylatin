bible: vulgate
lang: la
language: Latina
book: Ecclesiasticus
chapter: "3"
verses:
  "1": 'Fílii sapiéntiæ, ecclésia iustórum: et nátio illórum, obediéntia et diléctio.'
  "2": Iudícium patris audíte fílii, et sic fácite ut salvi sitis.
  "3": 'Deus enim honorávit patrem in fíliis: et iudícium matris exquírens, firmávit in fílios.'
  "4": Qui díligit Deum, exorábit pro peccátis, et continébit se ab illis, et in oratióne diérum exaudiétur.
  "5": Et sicut qui thesaurízat, ita et qui honoríficat matrem suam.
  "6": Qui honórat patrem suum, iucundábitur in fíliis, et in die oratiónis suæ exaudiétur.
  "7": 'Qui honórat patrem suum, vita vivet longióre: et qui obédit patri, refrigerábit matrem.'
  "8": Qui timet Dóminum honórat paréntes, et quasi dóminis sérviet his, qui se genuérunt.
  "9": In ópere et sermóne, et omni patiéntia honóra patrem tuum,
  "10": ut supervéniat tibi benedíctio ab eo, et benedíctio illíus in novíssimo máneat.
  "11": 'Benedíctio patris firmat domos filiórum: maledíctio autem matris eradícat fundaménta.'
  "12": 'Ne gloriéris in contumélia patris tui: non enim est tibi glória eius confúsio.'
  "13": Glória enim hóminis ex honóre patris sui, et dédecus fílii pater sine honóre.
  "14": 'Fili súscipe senéctam patris tui, et non contrístes eum in vita illíus:'
  "15": 'et si defécerit sensu, véniam da, et ne spernas eum in virtúte tua: eleemósyna enim patris non erit in oblivióne.'
  "16": 'Nam pro peccáto matris restituétur tibi bonum:'
  "17": 'et in iustítia ædificábitur tibi, et in die tribulatiónis commemorábitur tui: et sicut in seréno glácies, solvéntur peccáta tua.'
  "18": 'Quam malæ famæ est, qui derelínquit patrem: et est maledíctus a Deo qui exásperat matrem.'
  "19": Fili in mansuetúdine ópera tua pérfice, et super hóminum glóriam diligéris.
  "20": 'Quanto magnus es, humília te in ómnibus, et coram Deo invénies grátiam:'
  "21": quóniam magna poténtia Dei solíus, et ab humílibus honorátur.
  "22": 'Altióra te ne quæsíeris, et fortióra te ne scrutátus fúeris: sed quæ præcépit tibi Deus, illa cógita semper, et in plúribus opéribus eius ne fúeris curiósus.'
  "23": Non est enim tibi necessárium ea, quæ abscóndita sunt, vidére óculis tuis.
  "24": In supervácuis rebus noli scrutári multiplíciter, et in plúribus opéribus eius non eris curiósus.
  "25": Plúrima enim super sensum hóminum osténsa sunt tibi.
  "26": Multos quoque supplantávit suspício illórum, et in vanitáte detínuit sensus illórum.
  "27": 'Cor durum habébit male in novíssimo: et qui amat perículum in illo períbit.'
  "28": Cor ingrédiens duas vias non habébit succéssus, et pravus corde in illis scandalizábitur.
  "29": Cor nequam gravábitur in dolóribus, et peccátor adíciet ad peccándum.
  "30": 'Synagógæ superbórum non erit sánitas: frutex enim peccáti radicábitur in illis, et non intelligétur.'
  "31": Cor sapiéntis intellígitur in sapiéntia, et auris bona áudiet cum omni concupiscéntia sapiéntiam.
  "32": Sápiens cor, et intelligíbile abstinébit se a peccátis, et in opéribus iustítiæ succéssus habébit.
  "33": 'Ignem ardéntem exstínguit aqua, et eleemósyna resístit peccátis:'
  "34": 'et Deus prospéctor est eius qui reddit grátiam: méminit eius in pósterum, et in témpore casus sui invéniet firmaméntum.'
