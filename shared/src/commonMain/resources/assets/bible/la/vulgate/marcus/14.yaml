bible: vulgate
lang: la
language: Latina
book: Marcus
chapter: "14"
verses:
  "1": 'Erat autem Pascha et ázyma post bíduum: et quærébant summi sacerdótes, et scribæ quómodo eum dolo tenérent, et occíderent.'
  "2": 'Dicébant autem: Non in die festo, ne forte tumúltus fíeret in pópulo.'
  "3": 'Et cum esset Bethániæ in domo Simónis leprósi, et recúmberet, venit múlier habens alabástrum unguénti nardi spicáti pretiósi: et fracto alabástro, effúdit super caput eius.'
  "4": 'Erant autem quidam indígne feréntes intra semetípsos, et dicéntes: Ut quid perdítio ista unguénti facta est?'
  "5": póterat enim unguéntum istud venúmdari plus quam trecéntis denáriis, et dari paupéribus. Et fremébant in eam.
  "6": 'Iesus autem dixit: Sínite eam, quid illi molésti estis? Bonum opus operáta est in me:'
  "7": 'semper enim páuperes habétis vobíscum: et cum voluéritis, potéstis illis benefácere: me autem non semper habétis.'
  "8": 'Quod hábuit hæc, fecit: prævénit úngere corpus meum in sepultúram.'
  "9": 'Amen dico vobis: Ubicúmque prædicátum fúerit Evangélium istud in univérso mundo, et quod fecit hæc, narrábitur in memóriam eius.'
  "10": Et Iudas Iscariótes, unus de duódecim, ábiit ad summos sacerdótes, ut próderet eum illis.
  "11": 'Qui audiéntes gavísi sunt: et promisérunt ei pecúniam se datúros. Et quærébat quómodo illum opportúne tráderet.'
  "12": 'Et primo die azymórum quando Pascha immolábant, dicunt ei discípuli: Quo vis eámus, et parémus tibi ut mandúces Pascha?'
  "13": 'Et mittit duos ex discípulis suis, et dicit eis: Ite in civitátem, et occúrret vobis homo lagénam aquæ báiulans, sequímini eum:'
  "14": 'et quocúmque introíerit, dícite dómino domus, quia magíster dicit: Ubi est reféctio mea, ubi Pascha cum discípulis meis mandúcem?'
  "15": 'Et ipse vobis demonstrábit cœnáculum grande, stratum: et illic paráte nobis.'
  "16": 'Et abiérunt discípuli eius, et venérunt in civitátem: et invenérunt sicut díxerat illis, et paravérunt Pascha.'
  "17": Véspere autem facto, venit cum duódecim.
  "18": 'Et discumbéntibus eis, et manducántibus, ait Iesus: Amen dico vobis, quia unus ex vobis tradet me, qui mandúcat mecum.'
  "19": 'At illi cœpérunt contristári, et dícere ei singulátim: Numquid ego?'
  "20": 'Qui ait illis: Unus ex duódecim, qui intíngit mecum manum in catíno.'
  "21": 'Et Fílius quidem hóminis vadit sicut scriptum est de eo: væ autem hómini illi, per quem Fílius hóminis tradétur: bonum erat ei, si non esset natus homo ille.'
  "22": 'Et manducántibus illis, accépit Iesus panem: et benedícens fregit, et dedit eis, et ait: Súmite, hoc est corpus meum.'
  "23": 'Et accépto cálice, grátias agens dedit eis: et bibérunt ex illo omnes.'
  "24": 'Et ait illis: Hic est sanguis meus novi testaménti, qui pro multis effundétur.'
  "25": Amen dico vobis, quia iam non bibam de hoc genímine vitis usque in diem illum, cum illud bibam novum in regno Dei.
  "26": Et hymno dicto exiérunt in montem Olivárum.
  "27": 'Et ait eis Iesus: Omnes scandalizabímini in me in nocte ista: quia scriptum est: Percútiam pastórem, et dispergéntur oves.'
  "28": Sed postquam resurréxero, præcédam vos in Galilǽam.
  "29": 'Petrus autem ait illi: Et si omnes scandalizáti fúerint in te, sed non ego.'
  "30": 'Et ait illi Iesus: Amen dico tibi, quia tu hódie in nocte hac, priúsquam gallus vocem bis déderit, ter me es negatúrus.'
  "31": 'At ille ámplius loquebátur: Et si oportúerit me simul cómmori tibi, non te negábo. Simíliter autem et omnes dicébant.'
  "32": 'Et véniunt in prǽdium, cui nomen Gethsémani. Et ait discípulis suis: Sedéte hic donec orem.'
  "33": 'Et assúmit Petrum, et Iacóbum, et Ioánnem secum: et cœpit pavére, et tædére.'
  "34": 'Et ait illis: Tristis est ánima mea usque ad mortem: sustinéte hic, et vigiláte.'
  "35": Et cum processísset páululum, prócidit super terram, et orábat ut, si fíeri posset, transíret ab eo hora.
  "36": 'Et dixit: Abba pater, ómnia tibi possibília sunt: transfer cálicem hunc a me: sed non quod ego volo, sed quod tu.'
  "37": 'Et venit, et invénit eos dormiéntes. Et ait Petro: Simon, dormis? non potuísti una hora vigiláre?'
  "38": Vigiláte, et oráte, ut non intrétis in tentatiónem. Spíritus quidem promptus est, caro vero infírma.
  "39": Et íterum ábiens orávit, eúmdem sermónem dicens.
  "40": Et revérsus, dénuo invénit eos dormiéntes (erant enim óculi eórum graváti), et ignorábant quid respondérent ei.
  "41": 'Et venit tértio, et ait illis: Dormíte iam, et requiéscite. Súfficit: venit hora: ecce Fílius hóminis tradétur in manus peccatórum.'
  "42": 'Súrgite, eámus: ecce qui me tradet, prope est.'
  "43": Et, adhuc eo loquénte, venit Iudas Iscariótes unus de duódecim, et cum eo turba multa cum gládiis, et lignis, a summis sacerdótibus, et scribis, et senióribus.
  "44": 'Déderat autem tráditor eius signum eis, dicens: Quemcúmque osculátus fúero, ipse est, tenéte eum, et dúcite caute.'
  "45": 'Et cum venísset, statim accédens ad eum, ait: Ave Rabbi: et osculátus est eum.'
  "46": At illi manus iniecérunt in eum, et tenuérunt eum.
  "47": Unus autem quidam de circumstántibus edúcens gládium, percússit servum summi sacerdótis, et amputávit illi aurículam.
  "48": 'Et respóndens Iesus, ait illis: Tamquam ad latrónem exístis cum gládiis, et lignis comprehéndere me?'
  "49": Quotídie eram apud vos in templo docens, et non me tenuístis. Sed ut impleántur Scriptúræ.
  "50": Tunc discípuli eius relinquéntes eum, omnes fugérunt.
  "51": 'Adoléscens autem quidam sequebátur eum amíctus síndone super nudo: et tenuérunt eum.'
  "52": At ille reiécta síndone, nudus profúgit ab eis.
  "53": 'Et adduxérunt Iesum ad summum sacerdótem: et convenérunt omnes sacerdótes, et scribæ, et senióres.'
  "54": 'Petrus autem a longe secútus est eum usque intro in átrium summi sacerdótis: et sedébat cum minístris ad ignem, et calefaciébat se.'
  "55": 'Summi vero sacerdótes, et omne concílium quærébant advérsus Iesum testimónium, ut eum morti tráderent: nec inveniébant.'
  "56": 'Multi enim testimónium falsum dicébant advérsus eum: et conveniéntia testimónia non erant.'
  "57": 'Et quidam surgéntes, falsum testimónium ferébant advérsus eum, dicéntes:'
  "58": 'Quóniam nos audívimus eum dicéntem: Ego dissólvam templum hoc manu factum, et per tríduum áliud non manu factum ædificábo.'
  "59": Et non erat convéniens testimónium illórum.
  "60": 'Et exsúrgens summus sacérdos in médium, interrogávit Iesum, dicens: Non respóndes quidquam ad ea, quæ tibi obiciúntur ab his?'
  "61": 'Ille autem tacébat, et nihil respóndit. Rursum summus sacérdos interrogábat eum, et dixit ei: Tu es Christus Fílius Dei benedícti?'
  "62": 'Iesus autem dixit illi: Ego sum: et vidébitis Fílium hóminis sedéntem a dextris virtútis Dei, et veniéntem cum núbibus cæli.'
  "63": 'Summus autem sacérdos scindens vestiménta sua, ait: Quid adhuc desiderámus testes?'
  "64": 'Audístis blasphémiam: quid vobis vidétur? Qui omnes condemnavérunt eum esse reum mortis.'
  "65": 'Et cœpérunt quidam conspúere eum, et veláre fáciem eius, et cólaphis eum cǽdere, et dícere ei: Prophetíza: et minístri álapis eum cædébant.'
  "66": 'Et cum esset Petrus in átrio deórsum, venit una ex ancíllis summi sacerdótis:'
  "67": 'et cum vidísset Petrum calefaciéntem se, aspíciens illum, ait: Et tu cum Iesu Nazaréno eras.'
  "68": 'At ille negávit, dicens: Neque scio, neque novi quid dicas. Et éxiit foras ante átrium, et gallus cantávit.'
  "69": 'Rursus autem cum vidísset illum ancílla, cœpit dícere circumstántibus: Quia hic ex illis est.'
  "70": 'At ille íterum negávit. Et post pusíllum rursus qui astábant, dicébant Petro: Vere ex illis es: nam et Galilǽus es.'
  "71": 'Ille autem cœpit anathematizáre, et iuráre: Quia néscio hóminem istum, quem dícitis.'
  "72": 'Et statim gallus íterum cantávit. Et recordátus est Petrus verbi, quod díxerat ei Iesus: Priúsquam gallus cantet bis, ter me negábis. Et cœpit flere.'
