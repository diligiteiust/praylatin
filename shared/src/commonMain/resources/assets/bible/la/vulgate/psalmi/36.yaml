bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "36"
verses:
  "1": 'Psalmus ipsi David. Noli æmulári in malignántibus: neque zeláveris faciéntes iniquitátem.'
  "2": 'Quóniam tamquam fœnum velóciter aréscent: et quemádmodum ólera herbárum cito décident.'
  "3": 'Spera in Dómino, et fac bonitátem: et inhábita terram, et pascéris in divítiis eius.'
  "4": 'Delectáre in Dómino: et dabit tibi petitiónes cordis tui.'
  "5": 'Revéla Dómino viam tuam, et spera in eo: et ipse fáciet.'
  "6": 'Et edúcet quasi lumen iustítiam tuam, et iudícium tuum tamquam merídiem:'
  "7": 'súbditus esto Dómino, et ora eum. Noli æmulári in eo, qui prosperátur in via sua: in hómine faciénte iniustítias.'
  "8": 'Désine ab ira, et derelínque furórem: noli æmulári ut malignéris.'
  "9": 'Quóniam qui malignántur, exterminabúntur: sustinéntes autem Dóminum, ipsi hereditábunt terram.'
  "10": 'Et adhuc pusíllum, et non erit peccátor: et quæres locum eius, et non invénies.'
  "11": Mansuéti autem hereditábunt terram, et delectabúntur in multitúdine pacis.
  "12": 'Observábit peccátor iustum: et stridébit super eum déntibus suis.'
  "13": 'Dóminus autem irridébit eum: quóniam próspicit quod véniet dies eius.'
  "14": 'Gládium evaginavérunt peccatóres: intendérunt arcum suum, ut deíciant páuperem et ínopem, ut trucídent rectos corde.'
  "15": 'Gládius eórum intret in corda ipsórum: et arcus eórum confringátur.'
  "16": Mélius est módicum iusto, super divítias peccatórum multas.
  "17": 'Quóniam bráchia peccatórum conteréntur: confírmat autem iustos Dóminus.'
  "18": 'Novit Dóminus dies immaculatórum: et heréditas eórum in ætérnum erit.'
  "19": 'Non confundéntur in témpore malo, et in diébus famis saturabúntur:'
  "20": 'quia peccatóres períbunt. Inimíci vero Dómini mox ut honorificáti fúerint et exaltáti: deficiéntes, quemádmodum fumus defícient.'
  "21": 'Mutuábitur peccátor, et non solvet: iustus autem miserétur et tríbuet.'
  "22": 'Quia benedicéntes ei hereditábunt terram: maledicéntes autem ei disperíbunt.'
  "23": 'Apud Dóminum gressus hóminis dirigéntur: et viam eius volet.'
  "24": 'Cum cecíderit, non collidétur: quia Dóminus suppónit manum suam.'
  "25": 'Iúnior fui, étenim sénui: et non vidi iustum derelíctum, nec semen eius quærens panem.'
  "26": 'Tota die miserétur et cómmodat: et semen illíus in benedictióne erit.'
  "27": 'Declína a malo, et fac bonum: et inhábita in sǽculum sǽculi.'
  "28": 'Quia Dóminus amat iudícium, et non derelínquet sanctos suos: in ætérnum conservabúntur. Iniústi puniéntur, et semen impiórum períbit.'
  "29": 'Iusti autem hereditábunt terram: et inhabitábunt in sǽculum sǽculi super eam.'
  "30": Os iusti meditábitur sapiéntiam, et lingua eius loquétur iudícium.
  "31": 'Lex Dei eius in corde ipsíus: et non supplantabúntur gressus eius.'
  "32": 'Consíderat peccátor iustum: et quærit mortificáre eum.'
  "33": 'Dóminus autem non derelínquet eum in mánibus eius: nec damnábit eum cum iudicábitur illi.'
  "34": 'Exspécta Dóminum, et custódi viam eius: et exaltábit te ut hereditáte cápias terram: cum períerint peccatóres, vidébis.'
  "35": Vidi ímpium superexaltátum, et elevátum sicut cedros Líbani.
  "36": 'Et transívi, et ecce non erat: et quæsívi eum, et non est invéntus locus eius.'
  "37": 'Custódi innocéntiam, et vide æquitátem: quóniam sunt relíquiæ hómini pacífico.'
  "38": 'Iniústi autem disperíbunt simul: relíquiæ impiórum interíbunt.'
  "39": 'Salus autem iustórum a Dómino: et protéctor eórum in témpore tribulatiónis.'
  "40": 'Et adiuvábit eos Dóminus, et liberábit eos: et éruet eos a peccatóribus, et salvábit eos: quia speravérunt in eo.'
