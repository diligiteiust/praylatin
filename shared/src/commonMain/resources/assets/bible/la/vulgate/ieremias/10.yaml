bible: vulgate
lang: la
language: Latina
book: Ieremias
chapter: "10"
verses:
  "1": Audíte verbum, quod locútus est Dóminus super vos domus Israel.
  "2": 'Hæc dicit Dóminus: Iuxta vias géntium nolíte díscere, et a signis cæli nolíte metúere, quæ timent gentes:'
  "3": 'quia leges populórum vanæ sunt: quia lignum de saltu præcídit opus manus artíficis in áscia.'
  "4": 'Argénto et auro decorávit illud: clavis et málleis compégit, ut non dissolvátur.'
  "5": 'In similitúdinem palmæ fabricáta sunt, et non loquéntur: portáta tolléntur, quia incédere non valent: nolíte ergo timére ea, quia nec male possunt fácere, nec bene.'
  "6": 'Non est símilis tui Dómine: magnus es tu, et magnum nomen tuum in fortitúdine.'
  "7": 'Quis non timébit te, o Rex géntium? tuum est enim decus: inter cunctos sapiéntes géntium, et in univérsis regnis eórum, nullus est símilis tui.'
  "8": 'Páriter insipiéntes et fátui probabúntur: doctrína vanitátis eórum lignum est.'
  "9": 'Argéntum involútum de Tharsis affértur, et aurum de Ophaz: opus artíficis et manus ærárii: hyacínthus et púrpura induméntum eórum: opus artíficum univérsa hæc.'
  "10": 'Dóminus autem Deus verus est: ipse Deus vivens, et rex sempitérnus: ab indignatióne eius commovébitur terra: et non sustinébunt gentes comminatiónem eius.'
  "11": 'Sic ergo dicétis eis: Dii, qui cælos et terram non fecérunt, péreant de terra, et de his, quæ sub cælo sunt.'
  "12": Qui facit terram in fortitúdine sua, prǽparat orbem in sapiéntia sua, et prudéntia sua exténdit cælos.
  "13": 'Ad vocem suam dat multitúdinem aquárum in cælo, et élevat nébulas ab extremitátibus terræ: fúlgura in plúviam facit, et edúcit ventum de thesáuris suis.'
  "14": 'Stultus factus est omnis homo a sciéntia, confúsus est ártifex omnis in scúlptili: quóniam falsum est quod conflávit, et non est spíritus in eis.'
  "15": 'Vana sunt, et opus risu dignum: in témpore visitatiónis suæ períbunt.'
  "16": 'Non est his símilis pars Iacob: qui enim formávit ómnia, ipse est: et Israel virga hereditátis eius: Dóminus exercítuum nomen illi.'
  "17": 'Cóngrega de terra confusiónem tuam, quæ hábitas in obsidióne:'
  "18": 'quia hæc dicit Dóminus: Ecce ego longe proíciam habitatóres terræ in hac vice: et tribulábo eos ita ut inveniántur.'
  "19": 'Væ mihi super contritióne mea, péssima plaga mea. Ego autem dixi: Plane hæc infírmitas mea est, et portábo illam.'
  "20": 'Tabernáculum meum vastátum est: omnes funículi mei dirúpti sunt, fílii mei exiérunt a me, et non subsístunt: non est qui exténdat ultra tentórium meum, et érigat pelles meas.'
  "21": 'Quia stulte egérunt pastóres, et Dóminum non quæsiérunt: proptérea non intellexérunt, et omnis grex eórum dispérsus est.'
  "22": 'Vox auditiónis ecce venit, et commótio magna de terra aquilónis: ut ponat civitátes Iuda solitúdinem, et habitáculum dracónum.'
  "23": Scio Dómine quia non est hóminis via eius, nec viri est ut ámbulet, et dírigat gressus suos.
  "24": 'Córripe me Dómine, verúmtamen in iudício: et non in furóre tuo, ne forte ad níhilum rédigas me.'
  "25": 'Effúnde indignatiónem tuam super gentes, quæ non cognovérunt te, et super províncias, quæ nomen tuum non invocavérunt: quia comedérunt Iacob, et devoravérunt eum, et consumpsérunt illum, et decus eius dissipavérunt.'
