bible: vulgate
lang: la
language: Latina
book: Ecclesiasticus
chapter: "18"
verses:
  "1": Qui vivit in ætérnum, creávit ómnia simul. Deus solus iustificábitur, et manet invíctus rex in ætérnum.
  "2": Quis súfficit enarráre ópera illíus?
  "3": Quis enim investigábit magnália eius?
  "4": Virtútem autem magnitúdinis eius quis enuntiábit? aut quis adíciet enarráre misericórdiam eius?
  "5": Non est minúere neque adícere, nec est inveníre magnália Dei.
  "6": 'Cum consummáverit homo, tunc incípiet: et cum quiéverit, aporiábitur.'
  "7": Quid est homo? et quæ est grátia illíus? et quid bonum aut quid nequam illíus?
  "8": 'Númerus diérum hóminum, ut multum centum anni, quasi gutta aquæ maris deputáti sunt: et sicut cálculus arénæ, sic exígui anni in die ævi.'
  "9": Propter hoc pátiens est Deus in illis, et effúndit super eos misericórdiam suam.
  "10": 'Vidit præsumptiónem cordis eórum, quóniam mala est: et cognóvit subversiónem illórum, quóniam nequam est.'
  "11": Ideo adimplévit propitiatiónem suam in illis, et osténdit eis viam æquitátis.
  "12": 'Miserátio hóminis circa próximum suum: misericórdia autem Dei super omnem carnem.'
  "13": Qui misericórdiam habet, docet et érudit quasi pastor gregem suum.
  "14": Miserétur excipiéntis doctrínam miseratiónis, et qui festínat in iudíciis eius.
  "15": Fili in bonis non des querélam, et in omni dato non des tristítiam verbi mali.
  "16": Nonne ardórem refrigerábit ros? sic et verbum mélius quam datum.
  "17": Nonne ecce verbum super datum bonum? sed útraque cum hómine iustificáto.
  "18": 'Stultus ácriter improperábit: et datus indisciplináti tabéscere facit óculos.'
  "19": Ante iudícium para iustítiam tibi, et ántequam loquáris disce.
  "20": 'Ante languórem ádhibe medicínam: et ante iudícium intérroga teípsum, et in conspéctu Dei invénies propitiatiónem.'
  "21": Ante languórem humília te, et in témpore infirmitátis osténde conversatiónem tuam.
  "22": 'Non impediáris oráre semper, et ne vereáris usque ad mortem iustificári: quóniam merces Dei manet in ætérnum.'
  "23": Ante oratiónem prǽpara ánimam tuam, et noli esse quasi homo qui tentat Deum.
  "24": Meménto iræ in die consummatiónis, et tempus retributiónis in conversatióne faciéi.
  "25": Meménto paupertátis in témpore abundántiæ, et necessitátum paupertátis in die divitiárum.
  "26": A mane usque ad vésperam immutábitur tempus, et hæc ómnia citáta in óculis Dei.
  "27": Homo sápiens in ómnibus métuet, et in diébus delictórum atténdet ab inértia.
  "28": Omnis astútus agnóscit sapiéntiam, et inveniénti eam dabit confessiónem.
  "29": Sensáti in verbis et ipsi sapiénter egérunt, et intellexérunt veritátem et iustítiam, et implevérunt provérbia et iudícia.
  "30": Post concupiscéntias tuas non eas, et a voluntáte tua avértere.
  "31": Si præstes ánimæ tuæ concupiscéntias eius, fáciet te in gáudium inimícis tuis.
  "32": 'Ne oblectéris in turbis nec in módicis: assídua enim est commíssio illórum.'
  "33": 'Ne fúeris medíocris in contentióne ex fœ́nore, et est tibi nihil in sácculo: eris enim ínvidus vitæ tuæ.'
