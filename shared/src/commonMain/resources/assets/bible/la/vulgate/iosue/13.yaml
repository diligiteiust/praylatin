bible: vulgate
lang: la
language: Latina
book: Iosue
chapter: "13"
verses:
  "1": 'Iósue senex provectǽque ætátis erat, et dixit Dóminus ad eum: Senuísti, et longǽvus es, terráque latíssima derelícta est, quæ necdum sorte divísa est:'
  "2": omnis vidélicet Galilǽa, Philísthiim, et univérsa Géssuri.
  "3": 'A flúvio túrbido, qui írrigat Ægýptum, usque ad términos Accaron contra aquilónem: terra Chánaan, quæ in quinque régulos Philísthiim divíditur, Gazǽos, et Azótios, Ascalonítas, Gethǽos, et Accaronítas.'
  "4": Ad merídiem vero sunt Hevǽi, omnis terra Chánaan, et Maára Sidoniórum, usque Aphéca et términos Amorrhǽi,
  "5": 'eiúsque confínia. Líbani quoque régio contra oriéntem, a Baálgad sub monte Hermon, donec ingrediáris Emath:'
  "6": ómnium qui hábitant in monte a Líbano usque ad aquas Masérephoth, universíque Sidónii. Ego sum qui delébo eos a fácie filiórum Israel. Véniat ergo in partem hereditátis Israel, sicut præcépi tibi.
  "7": Et nunc dívide terram in possessiónem novem tríbubus, et dimídiæ tríbui Manásse,
  "8": cum qua Ruben et Gad possedérunt terram, quam trádidit eis Móyses fámulus Dómini trans fluénta Iordánis, ad orientálem plagam.
  "9": Ab Aroer, quæ sita est in ripa torréntis Arnon, et in vallis médio, universáque campéstria Médaba, usque Dibon,
  "10": 'et cunctas civitátes Sehon regis Amorrhǽi, qui regnávit in Hésebon, usque ad términos filiórum Ammon:'
  "11": et Gálaad, ac términum Géssuri et Macháti, et omnem montem Hermon, et univérsam Basan, usque ad Salécha,
  "12": 'omne regnum Og in Basan, qui regnávit in Astaroth et Edrai, ipse fuit de relíquiis Ráphaim: percussítque eos Móyses, atque delévit.'
  "13": 'Noluerúntque dispérdere fílii Israel Géssuri et Macháti: et habitavérunt in médio Israel usque in præséntem diem.'
  "14": 'Tríbui autem Levi non dedit possessiónem: sed sacrifícia et víctimæ Dómini Dei Israel, ipsa est eius heréditas, sicut locútus est illi.'
  "15": Dedit ergo Móyses possessiónem tríbui filiórum Ruben iuxta cognatiónes suas.
  "16": 'Fuítque términus eórum ab Aroer, quæ sita est in ripa torréntis Arnon, et in valle eiúsdem torréntis média: univérsam planítiem, quæ ducit Médaba,'
  "17": 'et Hésebon, cunctósque vículos eárum, qui sunt in campéstribus: Dibon quoque et Bamóthbaal, et óppidum Baálmaon,'
  "18": et Iassa, et Cédimoth, et Méphaath,
  "19": et Cariáthaim, et Sábama, et Saráthasar in monte convállis.
  "20": Béthphogor et Asedoth, Phasga et Bethiésimoth,
  "21": 'et omnes urbes campéstres, universáque regna Sehon regis Amorrhǽi, qui regnávit in Hésebon, quem percússit Móyses cum princípibus Mádian: Hevǽum, et Recem, et Sur, et Hur, et Rebe duces Sehon habitatóres terræ.'
  "22": Et Bálaam fílium Beor aríolum occidérunt fílii Israel gládio cum céteris interféctis.
  "23": Factúsque est términus filiórum Ruben Iordánis flúvius. Hæc est posséssio Rubenitárum per cognatiónes suas úrbium et viculórum.
  "24": Dedítque Móyses tríbui Gad et fíliis eius per cognatiónes suas possessiónem, cuius hæc divísio est.
  "25": Términus Iaser, et omnes civitátes Gálaad, et dimídiam partem terræ filiórum Ammon, usque ad Aroer, quæ est contra Rabba,
  "26": 'et ab Hésebon usque Ramoth, Masphe et Bétonim: et a Mánaim usque ad términos Dabir.'
  "27": 'In valle quoque Bétharan, et Bethnémra, et Socoth, et Saphon réliquam partem regni Sehon regis Hésebon: huius quoque finis, Iordánis est, usque ad extrémam partem maris Cénereth trans Iordánem ad orientálem plagam.'
  "28": Hæc est posséssio filiórum Gad per famílias suas, civitátes et villæ eárum.
  "29": Dedit et dimídiæ tríbui Manásse, filiísque eius iuxta cognatiónes suas possessiónem,
  "30": 'cuius hoc princípium est: a Mánaim univérsam Basan, et cuncta regna Og regis Basan, omnésque vicos Iair, qui sunt in Basan, sexagínta óppida:'
  "31": 'et dimídiam partem Gálaad, et Astaroth, et Edrai, urbes regni Og in Basan: fíliis Machir, fílii Manásse, dimídiæ parti filiórum Machir iuxta cognatiónes suas.'
  "32": Hanc possessiónem divísit Móyses in campéstribus Moab trans Iordánem contra Iéricho ad orientálem plagam.
  "33": 'Tríbui autem Levi non dedit possessiónem: quóniam Dóminus Deus Israel ipse est posséssio eius, ut locútus est illi.'
