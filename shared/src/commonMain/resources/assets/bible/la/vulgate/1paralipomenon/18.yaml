bible: vulgate
lang: la
language: Latina
book: I Paralipomenon
chapter: "18"
verses:
  "1": Factum est autem post hæc, ut percúteret David Philísthiim, et humiliáret eos, et tólleret Geth, et fílias eius de manu Philísthiim,
  "2": percuterétque Moab, et fíerent Moabítæ servi David, offeréntes ei múnera.
  "3": Eo témpore percússit David étiam Adarézer regem Soba regiónis Hemath, quando perréxit ut dilatáret impérium suum usque ad flumen Euphráten.
  "4": Cepit ergo David mille quadrígas eius, et septem míllia équitum, ac vigínti míllia virórum péditum, subnervavítque omnes equos cúrruum, excéptis centum quadrígis, quas reservávit sibi.
  "5": 'Supervénit autem et Syrus Damascénus, ut auxílium præbéret Adarézer regi Soba: sed et huius percússit David vigínti duo míllia virórum.'
  "6": Et pósuit mílites in Damásco, ut Sýria quoque servíret sibi, et offérret múnera. Adiuvítque eum Dóminus in cunctis, ad quæ perréxerat.
  "7": Tulit quoque David pháretras áureas, quas habúerant servi Adarézer, et áttulit eas in Ierúsalem.
  "8": Necnon de Thebath, et Chun úrbibus Adarézer æris plúrimum, de quo fecit Sálomon mare ǽneum, et colúmnas, et vasa ǽnea.
  "9": Quod cum audísset Thou rex Hemath, percussísse vidélicet David omnem exércitum Adarézer regis Soba,
  "10": 'misit Adóram fílium suum ad regem David, ut postuláret ab eo pacem, et congratularétur ei quod percussísset, et expugnásset Adarézer: adversárius quippe erat Thou Adarézer.'
  "11": Sed et ómnia vasa áurea, et argéntea, et ǽnea consecrávit David rex Dómino, cum argénto et auro, quod túlerat ex univérsis géntibus, tam de Idumǽa, et Moab, et fíliis Ammon, quam de Philísthiim et Amalec.
  "12": 'Abísai vero fílius Sárviæ percússit Edom in valle Salinárum, decem et octo míllia:'
  "13": 'et constítuit in Edom præsídium, ut servíret Idumǽa David: salvavítque Dóminus David in cunctis, ad quæ perréxerat.'
  "14": Regnávit ergo David super univérsum Israel, et faciébat iudícium atque iustítiam cuncto pópulo suo.
  "15": Porro Ioab fílius Sárviæ erat super exércitum, et Iósaphat fílius Ahilud a commentáriis.
  "16": 'Sadoc autem fílius Achitob, et Ahímelech fílius Abíathar, sacerdótes: et Susa, scriba.'
  "17": 'Banaías quoque fílius Ióiadæ super legiónes Ceréthi, et Pheléthi: porro fílii David, primi ad manum regis.'
