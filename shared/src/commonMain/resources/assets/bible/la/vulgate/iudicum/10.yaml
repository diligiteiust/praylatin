bible: vulgate
lang: la
language: Latina
book: Iudicum
chapter: "10"
verses:
  "1": 'Post Abímelech surréxit dux in Israel Thola fílius Phua pátrui Abímelech, vir de Issachar, qui habitávit in Samir montis Ephraim:'
  "2": et iudicávit Israélem vigínti et tribus annis, mortuúsque est, ac sepúltus in Samir.
  "3": Huic succéssit Iair Galaadítes, qui iudicávit Israel per vigínti et duos annos,
  "4": habens trigínta fílios sedéntes super trigínta pullos asinárum, et príncipes trigínta civitátum, quæ ex nómine eius sunt appellátæ Havoth Iair, id est, óppida Iair, usque in præséntem diem, in terra Gálaad.
  "5": Mortuúsque est Iair, ac sepúltus in loco, cui est vocábulum Camon.
  "6": 'Fílii autem Israel peccátis vetéribus iungéntes nova, fecérunt malum in conspéctu Dómini, et serviérunt idólis, Báalim et Astaroth, et diis Sýriæ ac Sidónis et Moab et filiórum Ammon et Philísthiim: dimiserúntque Dóminum, et non coluérunt eum.'
  "7": Contra quos Dóminus irátus, trádidit eos in manus Philísthiim et filiórum Ammon.
  "8": 'Afflictíque sunt, et veheménter oppréssi per annos decem et octo, omnes qui habitábant trans Iordánem in terra Amorrhǽi, qui est in Gálaad:'
  "9": 'in tantum, ut fílii Ammon, Iordáne transmísso, vastárent Iudam et Béniamin et Ephraim: afflictúsque est Israel nimis.'
  "10": 'Et clamántes ad Dóminum, dixérunt: Peccávimus tibi, quia derelíquimus Dóminum Deum nostrum, et servívimus Báalim.'
  "11": 'Quibus locútus est Dóminus: Numquid non Ægýptii et Amorrhǽi, filiíque Ammon et Philísthiim,'
  "12": Sidónii quoque et Amalec et Chánaan oppressérunt vos, et clamástis ad me, et érui vos de manu eórum?
  "13": 'Et tamen reliquístis me, et coluístis deos aliénos: idcírco non addam ut ultra vos líberem.'
  "14": 'Ite, et invocáte deos quos elegístis: ipsi vos líberent in témpore angústiæ.'
  "15": 'Dixerúntque fílii Israel ad Dóminum: Peccávimus, redde tu nobis quidquid tibi placet: tantum nunc líbera nos.'
  "16": 'Quæ dicéntes, ómnia de fínibus suis alienórum deórum idóla proiecérunt, et serviérunt Dómino Deo: qui dóluit super misériis eórum.'
  "17": Itaque fílii Ammon conclamántes in Gálaad fixére tentória, contra quos congregáti fílii Israel in Maspha castrametáti sunt.
  "18": 'Dixerúntque príncipes Gálaad sínguli ad próximos suos: Qui primus ex nobis contra fílios Ammon cœ́perit dimicáre, erit dux pópuli Gálaad.'
