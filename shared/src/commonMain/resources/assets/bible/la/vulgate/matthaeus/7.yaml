bible: vulgate
lang: la
language: Latina
book: Matthaeus
chapter: "7"
verses:
  "1": Nolíte iudicáre, ut non iudicémini.
  "2": 'In quo enim iudício iudicavéritis, iudicabímini: et in qua mensúra mensi fuéritis, remetiétur vobis.'
  "3": Quid autem vides festúcam in óculo fratris tui, et trabem in óculo tuo non vides?
  "4": 'Aut quómodo dicis fratri tuo: Sine eíciam festúcam de óculo tuo, et ecce trabs est in óculo tuo?'
  "5": Hypócrita, éice primum trabem de óculo tuo, et tunc vidébis eícere festúcam de óculo fratris tui.
  "6": 'Nolíte dare sanctum cánibus: neque mittátis margarítas vestras ante porcos, ne forte concúlcent eas pédibus suis, et convérsi dirúmpant vos.'
  "7": 'Pétite, et dábitur vobis: quǽrite, et inveniétis: pulsáte, et aperiétur vobis.'
  "8": 'Omnis enim qui petit, áccipit: et qui quærit, ínvenit: et pulsánti aperiétur.'
  "9": Aut quis est ex vobis homo, quem si petíerit fílius suus panem, numquid lápidem porríget ei?
  "10": Aut si piscem petíerit, numquid serpéntem porríget ei?
  "11": 'Si ergo vos, cum sitis mali, nostis bona data dare fíliis vestris: quanto magis Pater vester, qui in cælis est, dabit bona peténtibus se?'
  "12": Omnia ergo quæcúmque vultis ut fáciant vobis hómines, et vos fácite illis. Hæc est enim lex, et prophétæ.
  "13": 'Intráte per angústam portam: quia lata porta, et spatiósa via est, quæ ducit ad perditiónem, et multi sunt qui intrant per eam.'
  "14": 'Quam angústa porta, et arcta via est, quæ ducit ad vitam: et pauci sunt, qui invéniunt eam!'
  "15": 'Atténdite a falsis prophétis, qui véniunt ad vos in vestiméntis óvium, intrínsecus autem sunt lupi rapáces:'
  "16": a frúctibus eórum cognoscétis eos. Numquid cólligunt de spinis uvas, aut de tríbulis ficus?
  "17": 'Sic omnis arbor bona fructus bonos facit: mala autem arbor malos fructus facit.'
  "18": 'Non potest arbor bona malos fructus fácere: neque arbor mala bonos fructus fácere.'
  "19": Omnis arbor, quæ non facit fructum bonum, excidétur, et in ignem mittétur.
  "20": Igitur ex frúctibus eórum cognoscétis eos.
  "21": 'Non omnis, qui dicit mihi, Dómine, Dómine, intrábit in regnum cælórum: sed qui facit voluntátem Patris mei, qui in cælis est, ipse intrábit in regnum cælórum.'
  "22": 'Multi dicent mihi in illa die: Dómine, Dómine, nonne in nómine tuo prophetávimus, et in nómine tuo dæmónia eiécimus, et in nómine tuo virtútes multas fécimus?'
  "23": 'Et tunc confitébor illis: Quia numquam novi vos: discédite a me, qui operámini iniquitátem.'
  "24": Omnis ergo, qui audit verba mea hæc, et facit ea, assimilábitur viro sapiénti, qui ædificávit domum suam supra petram,
  "25": 'et descéndit plúvia, et venérunt flúmina, et flavérunt venti, et irruérunt in domum illam, et non cécidit: fundáta enim erat super petram.'
  "26": 'Et omnis, qui audit verba mea hæc, et non facit ea, símilis erit viro stulto, qui ædificávit domum suam super arénam:'
  "27": et descéndit plúvia, et venérunt flúmina, et flavérunt venti, et irruérunt in domum illam, et cécidit, et fuit ruína illíus magna.
  "28": 'Et factum est: cum consummásset Iesus verba hæc, admirabántur turbæ super doctrína eius.'
  "29": Erat enim docens eos sicut potestátem habens, et non sicut scribæ eórum, et Pharisǽi.
