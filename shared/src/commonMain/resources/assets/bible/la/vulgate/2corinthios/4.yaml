bible: vulgate
lang: la
language: Latina
book: ad Corinthios II
chapter: "4"
verses:
  "1": Ideo habéntes administratiónem, iuxta quod misericórdiam consecúti sumus, non defícimus,
  "2": sed abdicámus occúlta dedécoris, non ambulántes in astútia, neque adulterántes verbum Dei, sed in manifestatióne veritátis commendántes nosmetípsos ad omnem consciéntiam hóminum coram Deo.
  "3": 'Quod si étiam opértum est Evangélium nostrum: in iis, qui péreunt, est opértum:'
  "4": in quibus Deus huius sǽculi excæcávit mentes infidélium, ut non fúlgeat illis illuminátio Evangélii glóriæ Christi, qui est imágo Dei.
  "5": 'Non enim nosmetípsos prædicámus, sed Iesum Christum Dóminum nostrum: nos autem servos vestros per Iesum:'
  "6": quóniam Deus, qui dixit de ténebris lucem splendéscere, ipse illúxit in córdibus nostris ad illuminatiónem sciéntiæ claritátis Dei, in fácie Christi Iesu.
  "7": 'Habémus autem thesáurum istum in vasis fictílibus: ut sublímitas sit virtútis Dei, et non ex nobis.'
  "8": 'In ómnibus tribulatiónem pátimur, sed non angustiámur: aporiámur, sed non destitúimur:'
  "9": 'persecutiónem pátimur, sed non derelínquimur: deícimur, sed non perímus:'
  "10": semper mortificatiónem Iesu in córpore nostro circumferéntes, ut et vita Iesu manifestétur in corpóribus nostris.
  "11": 'Semper enim nos, qui vívimus, in mortem trádimur propter Iesum: ut et vita Iesu manifestétur in carne nostra mortáli.'
  "12": Ergo mors in nobis operátur, vita autem in vobis.
  "13": 'Habéntes autem eúmdem spíritum fídei, sicut scriptum est: Crédidi, propter quod locútus sum: et nos crédimus, propter quod et lóquimur:'
  "14": sciéntes quóniam qui suscitávit Iesum, et nos cum Iesu suscitábit, et constítuet vobíscum.
  "15": 'Omnia enim propter vos: ut grátia abúndans, per multos in gratiárum actióne, abúndet in glóriam Dei.'
  "16": 'Propter quod non defícimus: sed licet is, qui foris est, noster homo corrumpátur, tamen is, qui intus est, renovátur de die in diem.'
  "17": Id enim, quod in præsénti est momentáneum et leve tribulatiónis nostræ, supra modum in sublimitáte ætérnum glóriæ pondus operátur in nobis,
  "18": 'non contemplántibus nobis quæ vidéntur, sed quæ non vidéntur. Quæ enim vidéntur, temporália sunt: quæ autem non vidéntur, ætérna sunt.'
