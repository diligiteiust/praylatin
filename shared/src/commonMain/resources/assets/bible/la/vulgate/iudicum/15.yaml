bible: vulgate
lang: la
language: Latina
book: Iudicum
chapter: "15"
verses:
  "1": 'Post aliquántulum autem témporis, cum dies tritíceæ messis instárent, venit Samson, invísere volens uxórem suam, et áttulit ei hædum de capris. Cumque cubículum eius sólito vellet intráre, prohíbuit eum pater illíus, dicens:'
  "2": 'Putávi quod odísses eam, et ídeo trádidi illam amíco tuo: sed habet sorórem, quæ iúnior et púlchrior illa est: sit tibi pro ea uxor.'
  "3": 'Cui Samson respóndit: Ab hac die non erit culpa in me contra Philisthǽos: fáciam enim vobis mala.'
  "4": 'Perrexítque et cepit trecéntas vulpes, caudásque eárum iunxit ad caudas, et faces ligávit in médio:'
  "5": quas igne succéndens, dimísit ut huc illúcque discúrrerent. Quæ statim perrexérunt in ségetes Philisthinórum. Quibus succénsis, et comportátæ iam fruges, et adhuc stantes in stípula, concremátæ sunt, in tantum ut víneas quoque et olivéta flamma consúmeret.
  "6": 'Dixerúntque Philísthiim: Quis fecit hanc rem? Quibus dictum est: Samson gener Thamnathǽi: quia tulit uxórem eius, et álteri trádidit, hæc operátus est. Ascenderúntque Philísthiim, et combussérunt tam mulíerem quam patrem eius.'
  "7": 'Quibus ait Samson: Licet hæc fecéritis, tamen adhuc ex vobis éxpetam ultiónem, et tunc quiéscam.'
  "8": Percussítque eos ingénti plaga, ita ut stupéntes suram fémori impónerent. Et descéndens habitávit in spelúnca petræ Etam.
  "9": Igitur ascendéntes Philísthiim in terram Iuda, castrametáti sunt in loco, qui póstea vocátus est Lechi, id est, Maxílla, ubi eórum effúsus est exércitus.
  "10": 'Dixerúntque ad eos de tribu Iuda: Cur ascendístis advérsum nos? Qui respondérunt: Ut ligémus Samson, vénimus, et reddámus ei quæ in nos operátus est.'
  "11": 'Descendérunt ergo tria míllia virórum de Iuda, ad specum sílicis Etam, dixerúntque ad Samson: Nescis quod Philísthiim ímperent nobis? quare hoc fácere voluísti? Quibus ille ait: Sicut fecérunt mihi, sic feci eis.'
  "12": 'Ligáre, ínquiunt, te vénimus, et trádere in manus Philisthinórum. Quibus Samson: Iuráte, ait, et spondéte mihi quod non occidátis me.'
  "13": 'Dixérunt: Non te occidémus, sed vinctum tradémus. Ligaverúntque eum duóbus novis fúnibus, et tulérunt eum de petra Etam.'
  "14": 'Qui cum venísset ad locum Maxíllæ, et Philísthiim vociferántes occurríssent ei, írruit Spíritus Dómini in eum: et sicut solent ad odórem ignis lina consúmi, ita víncula, quibus ligátus erat, dissipáta sunt et solúta.'
  "15": Inventámque maxíllam, id est, mandíbulam ásini, quæ iacébat, arrípiens interfécit in ea mille viros,
  "16": 'et ait: In maxílla ásini, in mandíbula pulli asinárum delévi eos, et percússi mille viros.'
  "17": Cumque hæc verba canens complésset, proiécit mandíbulam de manu, et vocávit nomen loci illíus Ramáthlechi, quod interpretátur, Elevátio maxíllæ.
  "18": 'Sitiénsque valde, clamávit ad Dóminum, et ait: Tu dedísti in manu servi tui salútem hanc máximam atque victóriam: en siti mórior, incidámque in manus incircumcisórum.'
  "19": Apéruit ítaque Dóminus molárem dentem in maxílla ásini, et egréssæ sunt ex eo aquæ. Quibus haustis, refocillávit spíritum, et vires recépit. Idcírco appellátum est nomen loci illíus, Fons invocántis de maxílla, usque in præséntem diem.
  "20": Iudicavítque Israel in diébus Philísthiim vigínti annis.
