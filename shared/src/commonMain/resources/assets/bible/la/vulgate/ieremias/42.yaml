bible: vulgate
lang: la
language: Latina
book: Ieremias
chapter: "42"
verses:
  "1": 'Et accessérunt omnes príncipes bellatórum, et Ióhanan fílius Carée, et Iezonías fílius Osaíæ, et réliquum vulgus, a parvo usque ad magnum:'
  "2": 'dixerúntque ad Ieremíam prophétam: Cadat orátio nostra in conspéctu tuo, et ora pro nobis ad Dóminum Deum tuum, pro univérsis relíquiis istis, quia derelícti sumus pauci de plúribus, sicut óculi tui nos intuéntur:'
  "3": et annúntiet nobis Dóminus Deus tuus viam, per quam pergámus, et verbum, quod faciámus.
  "4": 'Dixit autem ad eos Ieremías prophéta: Audívi: ecce ego oro ad Dóminum Deum vestrum secúndum verba vestra: omne verbum quodcúmque respónderit mihi indicábo vobis, nec celábo vos quidquam.'
  "5": 'Et illi dixérunt ad Ieremíam: Sit Dóminus inter nos testis veritátis et fídei, si non iuxta omne verbum, in quo míserit te Dóminus Deus tuus ad nos, sic faciémus.'
  "6": 'Sive bonum est, sive malum, voci Dómini Dei nostri, ad quem míttimus te, obediémus: ut bene sit nobis cum audiérimus vocem Dómini Dei nostri.'
  "7": Cum autem compléti essent decem dies, factum est verbum Dómini ad Ieremíam.
  "8": Vocavítque Ióhanan fílium Carée, et omnes príncipes bellatórum, qui erant cum eo, et univérsum pópulum, a mínimo usque ad magnum.
  "9": 'Et dixit ad eos: Hæc dicit Dóminus Deus Israel, ad quem misístis me ut prostérnerem preces vestras in conspéctu eius:'
  "10": 'Si quiescéntes manséritis in terra hac, ædificábo vos, et non déstruam: plantábo, et non evéllam: iam enim placátus sum super malo quod feci vobis.'
  "11": 'Nolíte timére a fácie regis Babylónis, quem vos pávidi formidátis: nolíte metúere eum, dicit Dóminus, quia vobíscum sum ego ut salvos vos fáciam, et éruam de manu eius.'
  "12": Et dabo vobis misericórdias, et miserébor vestri, et habitáre vos fáciam in terra vestra.
  "13": 'Si autem dixéritis vos: Non habitábimus in terra ista, nec audiémus vocem Dómini Dei nostri,'
  "14": 'dicéntes: Nequáquam, sed ad terram Ægýpti pergémus, ubi non vidébimus bellum, et clangórem tubæ non audiémus, et famem non sustinébimus, et ibi habitábimus.'
  "15": 'Propter hoc nunc audíte verbum Dómini relíquiæ Iuda: Hæc dicit Dóminus exercítuum, Deus Israel: Si posuéritis fáciem vestram ut ingrediámini Ægýptum, et intravéritis ut ibi habitétis:'
  "16": 'gládius, quem vos formidátis, ibi comprehéndet vos in terra Ægýpti: et fames, pro qua estis sollíciti, adhærébit vobis in Ægýpto, et ibi moriémini.'
  "17": 'Omnésque viri, qui posuérunt fáciem suam ut ingrediántur Ægýptum, ut hábitent ibi, moriéntur gládio, et fame, et peste: nullus de eis remanébit, nec effúgiet a fácie mali, quod ego áfferam super eos.'
  "18": 'Quia hæc dicit Dóminus exercítuum, Deus Israel: Sicut conflátus est furor meus, et indignátio mea super habitatóres Ierúsalem, sic conflábitur indignátio mea super vos cum ingréssi fuéritis Ægýptum: et éritis in iusiurándum, et in stupórem, et in maledíctum, et in oppróbrium, et nequáquam ultra vidébitis locum istum.'
  "19": 'Verbum Dómini super vos relíquiæ Iuda: Nolíte intráre Ægýptum: sciéntes sciétis quia obtestátus sum vos hódie,'
  "20": 'quia decepístis ánimas vestras: vos enim misístis me ad Dóminum Deum nostrum, dicéntes: Ora pro nobis ad Dóminum Deum nostrum, et iuxta ómnia quæcúmque díxerit tibi Dóminus Deus noster, sic annúntia nobis, et faciémus.'
  "21": Et annuntiávi vobis hódie, et non audístis vocem Dómini Dei vestri super univérsis, pro quibus misit me ad vos.
  "22": Nunc ergo sciéntes sciétis quia gládio, et fame, et peste moriémini in loco, ad quem voluístis intráre ut habitarétis ibi.
