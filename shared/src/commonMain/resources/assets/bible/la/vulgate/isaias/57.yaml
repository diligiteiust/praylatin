bible: vulgate
lang: la
language: Latina
book: Isaias
chapter: "57"
verses:
  "1": 'Iustus perit, et non est qui recógitet in corde suo: et viri misericórdiæ colligúntur, quia non est qui intélligat: a fácie enim malítiæ colléctus est iustus.'
  "2": 'Véniat pax: requiéscat in cubíli suo qui ambulávit in directióne sua.'
  "3": 'Vos autem accédite huc fílii auguratrícis: semen adúlteri, et fornicáriæ.'
  "4": Super quem lusístis? super quem dilatástis os, et eiecístis linguam? numquid non vos fílii scelésti, semen mendax?
  "5": Qui consolámini in diis subter omne lignum frondósum, immolántes párvulos in torréntibus, subter eminéntes petras?
  "6": 'In pártibus torréntis pars tua, hæc est sors tua: et ipsis effudísti libámen, obtulísti sacrifícium: numquid super his non indignábor?'
  "7": Super montem excélsum et sublímem posuísti cubíle tuum, et illuc ascendísti ut immoláres hóstias.
  "8": 'Et post óstium, et retro postem posuísti memoriále tuum. Quia iuxta me discooperuísti, et suscepísti adúlterum, dilatásti cubíle tuum, et pepigísti cum eis fœdus: dilexísti stratum eórum manu apérta.'
  "9": Et ornásti te regi unguénto, et multiplicásti pigménta tua. Misísti legátos tuos procul, et humiliáta es usque ad ínferos.
  "10": 'In multitúdine viæ tuæ laborásti: non dixísti: Quiéscam: vitam manus tuæ invenísti, proptérea non rogásti.'
  "11": Pro quo sollícita timuísti, quia mentíta es, et mei non es recordáta, neque cogitásti in corde tuo? quia ego tacens et quasi non videns, et mei oblíta es.
  "12": Ego annuntiábo iustítiam tuam, et ópera tua non próderunt tibi.
  "13": Cum clamáveris, líberent te congregáti tui, et omnes eos áuferet ventus, tollet aura. Qui autem fidúciam habet mei, hereditábit terram, et possidébit montem sanctum meum.
  "14": 'Et dicam: Viam fácite, præbéte iter: declináte de sémita, auférte offendícula de via pópuli mei.'
  "15": 'Quia hæc dicit Excélsus, et sublímis hábitans æternitátem, et sanctum nomen eius: in excélso et in sancto hábitans, et cum contríto et húmili spíritu: ut vivíficet spíritum humílium, et vivíficet cor contritórum.'
  "16": 'Non enim in sempitérnum litigábo, neque usque ad finem iráscar: quia spíritus a fácie mea egrediétur, et flatus ego fáciam.'
  "17": 'Propter iniquitátem avarítiæ eius irátus sum, et percússi eum: abscóndi a te fáciem meam, et indignátus sum: et ábiit vagus in via cordis sui.'
  "18": 'Vias eius vidi, et sanávi eum: et redúxi eum, et réddidi consolatiónes ipsi, et lugéntibus eius.'
  "19": Creávi fructum labiórum pacem, pacem ei, qui longe est, et qui prope, dixit Dóminus, et sanávi eum.
  "20": Impii autem quasi mare fervens, quod quiéscere non potest, et redúndant fluctus eius in conculcatiónem et lutum.
  "21": Non est pax ímpiis, dicit Dóminus Deus.
