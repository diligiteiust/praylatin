bible: vulgate
lang: la
language: Latina
book: Ioel
chapter: "3"
verses:
  "1": 'Quia ecce in diébus illis, et in témpore illo, cum convértero captivitátem Iuda, et Ierúsalem:'
  "2": 'congregábo omnes gentes, et dedúcam eas in vallem Iósaphat: et disceptábo cum eis ibi super pópulo meo, et hereditáte mea Israel, quos dispersérunt in natiónibus, et terram meam divisérunt.'
  "3": 'Et super pópulum meum misérunt sortem: et posuérunt púerum in prostíbulo, et puéllam vendidérunt pro vino ut bíberent.'
  "4": Verum quid mihi et vobis Tyrus, et Sidon, et omnis términus Palæstinórum? numquid ultiónem vos reddétis mihi? et si ulciscímini vos contra me, cito velóciter reddam vicissitúdinem vobis super caput vestrum.
  "5": 'Argéntum enim meum, et aurum tulístis: et desiderabília mea, et pulchérrima intulístis in delúbra vestra.'
  "6": Et fílios Iuda, et fílios Ierúsalem vendidístis fíliis Græcórum, ut longe facerétis eos de fínibus suis.
  "7": 'Ecce ego suscitábo eos de loco, in quo vendidístis eos: et convértam retributiónem vestram in caput vestrum.'
  "8": Et vendam fílios vestros, et fílias vestras in mánibus filiórum Iuda, et venúmdabunt eos Sabǽis, genti longínquæ, quia Dóminus locútus est.
  "9": 'Clamáte hoc in géntibus, sanctificáte bellum, suscitáte robústos: accédant, ascéndant omnes viri bellatóres.'
  "10": 'Concídite arátra vestra in gládios, et ligónes vestros in lánceas. Infírmus dicat: Quia fortis ego sum.'
  "11": 'Erúmpite, et veníte omnes gentes de circúitu, et congregámini: ibi occúmbere fáciet Dóminus robústos tuos.'
  "12": 'Consúrgant, et ascéndant gentes in vallem Iósaphat: quia ibi sedébo ut iúdicem omnes gentes in circúitu.'
  "13": 'Míttite falces, quóniam maturávit messis: veníte, et descéndite, quia plenum est tórcular, exúberant torculária: quia multiplicáta est malítia eórum.'
  "14": 'Pópuli pópuli in valle concisiónis: quia iuxta est dies Dómini in valle concisiónis.'
  "15": Sol et luna obtenebráti sunt, et stellæ retraxérunt splendórem suum.
  "16": 'Et Dóminus de Sion rúgiet, et de Ierúsalem dabit vocem suam: et movebúntur cæli, et terra: et Dóminus spes pópuli sui, et fortitúdo filiórum Israel.'
  "17": 'Et sciétis quia ego Dóminus Deus vester, hábitans in Sion monte sancto meo: et erit Ierúsalem sancta, et aliéni non transíbunt per eam ámplius.'
  "18": 'Et erit in die illa: stillábunt montes dulcédinem, et colles fluent lacte: et per omnes rivos Iuda ibunt aquæ: et fons de domo Dómini egrediétur, et irrigábit torréntem spinárum.'
  "19": 'Ægýptus in desolatiónem erit, et Idumǽa in desértum perditiónis: pro eo quod iníque égerint in fílios Iuda, et effúderint sánguinem innocéntem in terra sua.'
  "20": Et Iudǽa in ætérnum habitábitur, et Ierúsalem in generatiónem et generatiónem.
  "21": 'Et mundábo sánguinem eórum, quem non mundáveram: et Dóminus commorábitur in Sion.'
