bible: vulgate
lang: la
language: Latina
book: Isaias
chapter: "56"
verses:
  "1": 'Hæc dicit Dóminus: Custodíte iudícium, et fácite iustítiam, quia iuxta est salus mea ut véniat, et iustítia mea ut revelétur.'
  "2": 'Beátus vir, qui facit hoc, et fílius hóminis, qui apprehéndet istud: custódiens sábbatum ne pólluat illud, custódiens manus suas ne fáciat omne malum.'
  "3": 'Et non dicat fílius ádvenæ qui adhǽret Dómino, dicens: Separatióne dívidet me Dóminus a pópulo suo: et non dicat eunúchus: Ecce ego lignum áridum.'
  "4": 'Quia hæc dicit Dóminus eunúchis: Qui custodíerint sábbata mea, et elégerint quæ ego vólui, et tenúerint fœdus meum,'
  "5": 'dabo eis in domo mea et in muris meis locum, et nomen mélius a fíliis et filiábus: nomen sempitérnum dabo eis, quod non períbit.'
  "6": 'Et fílios ádvenæ, qui adhǽrent Dómino, ut colant eum, et díligant nomen eius, ut sint ei in servos: omnem custodiéntem sábbatum ne pólluat illud, et tenéntem fœdus meum:'
  "7": 'addúcam eos in montem sanctum meum, et lætificábo eos in domo oratiónis meæ: holocáusta eórum, et víctimæ eórum placébunt mihi super altári meo: quia domus mea domus oratiónis vocábitur cunctis pópulis.'
  "8": 'Ait Dóminus Deus, qui cóngregat dispérsos Israel: Adhuc congregábo ad eum congregátos eius.'
  "9": Omnes béstiæ agri veníte ad devorándum, univérsæ béstiæ saltus.
  "10": 'Speculatóres eius cæci omnes: nesciérunt univérsi: canes muti non valéntes latráre, vidéntes vana, dormiéntes, et amántes sómnia.'
  "11": 'Et canes imprudentíssimi nesciérunt saturitátem: ipsi pastóres ignoravérunt intelligéntiam: omnes in viam suam declinavérunt, unusquísque ad avarítiam suam, a summo usque ad novíssimum.'
  "12": 'Veníte, sumámus vinum, et impleámur ebrietáte: et erit sicut hódie, sic et cras, et multo ámplius.'
