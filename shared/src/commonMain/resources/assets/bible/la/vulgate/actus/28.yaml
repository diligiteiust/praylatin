bible: vulgate
lang: la
language: Latina
book: Actus Apostolorum
chapter: "28"
verses:
  "1": Et cum evasissémus, tunc cognóvimus quia Mélita ínsula vocabátur. Bárbari vero præstábant non módicam humanitátem nobis.
  "2": Accénsa enim pyra, reficiébant nos omnes propter imbrem, qui imminébat, et frigus.
  "3": Cum congregásset autem Paulus sarmentórum aliquántam multitúdinem, et imposuísset super ignem, vípera a calóre cum processísset, invásit manum eius.
  "4": 'Ut vero vidérunt bárbari pendéntem béstiam de manu eius, ad ínvicem dicébant: Utique homicída est homo hic, qui cum eváserit de mari, últio non sinit eum vívere.'
  "5": Et ille quidem excútiens béstiam in ignem, nihil mali passus est.
  "6": At illi existimábant eum in tumórem converténdum, et súbito casúrum, et mori. Diu autem illis exspectántibus, et vidéntibus nihil mali in eo fíeri, converténtes se, dicébant eum esse deum.
  "7": In locis autem illis erant prǽdia príncipis ínsulæ, nómine Públii, qui nos suscípiens, tríduo benígne exhíbuit.
  "8": 'Cóntigit autem, patrem Públii fébribus, et dysentéria vexátum iacére. Ad quem Paulus intrávit: et cum orásset, et imposuísset ei manus, salvávit eum.'
  "9": 'Quo facto, omnes, qui in ínsula habébant infirmitátes, accedébant, et curabántur:'
  "10": qui étiam multis honóribus nos honoravérunt, et navigántibus imposuérunt quæ necessária erant.
  "11": Post menses autem tres navigávimus in navi Alexandrína, quæ in ínsula hiemáverat, cui erat insígne Castórum.
  "12": Et cum venissémus Syracúsam, mánsimus ibi tríduo.
  "13": 'Inde circumlegéntes devénimus Rhégium: et post unum diem, flante austro, secúnda die vénimus Putéolos:'
  "14": 'ubi invéntis frátribus rogáti sumus manére apud eos dies septem: et sic vénimus Romam.'
  "15": Et inde cum audíssent fratres, occurrérunt nobis usque ad Appii forum, ac tres Tabérnas. Quos cum vidísset Paulus, grátias agens Deo, accépit fidúciam.
  "16": Cum autem venissémus Romam, permíssum est Paulo manére sibímet cum custodiénte se mílite.
  "17": 'Post tértium autem diem convocávit primos Iudæórum. Cumque conveníssent, dicébat eis: Ego, viri fratres, nihil advérsus plebem fáciens, aut morem patérnum, vinctus ab Ierosólymis tráditus sum in manus Romanórum,'
  "18": qui cum interrogatiónem de me habuíssent, voluérunt me dimíttere, eo quod nulla esset causa mortis in me.
  "19": Contradicéntibus autem Iudǽis, coáctus sum appelláre Cǽsarem, non quasi gentem meam habens áliquid accusáre.
  "20": Propter hanc ígitur causam rogávi vos vidére, et álloqui. Propter spem enim Israel caténa hac circúmdatus sum.
  "21": 'At illi dixérunt ad eum: Nos neque lítteras accépimus de te a Iudǽa, neque advéniens áliquis fratrum nuntiávit, aut locútus est quid de te malum.'
  "22": 'Rogámus autem a te audíre quæ sentis: nam de secta hac notum est nobis, quia ubíque ei contradícitur.'
  "23": Cum constituíssent autem illi diem, venérunt ad eum in hospítium plúrimi, quibus exponébat testíficans regnum Dei, suadénsque eis de Iesu ex lege Móysi, et prophétis a mane usque ad vésperam.
  "24": 'Et quidam credébant his, quæ dicebántur: quidam vero non credébant.'
  "25": 'Cumque ínvicem non essent consentiéntes, discedébant, dicénte Paulo unum verbum: Quia bene Spíritus sanctus locútus est per Isaíam prophétam ad patres nostros,'
  "26": 'dicens: Vade ad pópulum istum, et dic ad eos: Aure audiétis, et non intelligétis: et vidéntes vidébitis, et non perspiciétis.'
  "27": 'Incrassátum est enim cor pópuli huius, et áuribus gráviter audiérunt, et óculos suos compressérunt: ne forte vídeant óculis, et áuribus áudiant, et corde intélligant, et convertántur, et sanem eos.'
  "28": Notum ergo sit vobis, quóniam géntibus missum est hoc salutáre Dei, et ipsi áudient.
  "29": Et cum hæc dixísset, exiérunt ab eo Iudǽi, multam habéntes inter se quæstiónem.
  "30": 'Mansit autem biénnio toto in suo condúcto: et suscipiébat omnes, qui ingrediebántur ad eum,'
  "31": prǽdicans regnum Dei, et docens quæ sunt de Dómino Iesu Christo cum omni fidúcia, sine prohibitióne.
