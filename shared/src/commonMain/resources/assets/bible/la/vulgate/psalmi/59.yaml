bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "59"
verses:
  "1": In finem, Pro his qui immutabúntur, in títuli inscriptiónem ipsi David, in doctrínam,
  "2": cum succéndit Mesopotámiam Sýriæ et Sobal, et convértit Ioab, et percússit Idumǽam in valle Salinárum duódecim míllia.
  "3": 'Deus repulísti nos, et destruxísti nos: irátus es, et misértus es nobis.'
  "4": 'Commovísti terram, et conturbásti eam: sana contritiónes eius, quia commóta est.'
  "5": 'Ostendísti pópulo tuo dura: potásti nos vino compunctiónis.'
  "6": 'Dedísti metuéntibus te significatiónem: ut fúgiant a fácie arcus: ut liberéntur dilécti tui:'
  "7": salvum fac déxtera tua, et exáudi me.
  "8": 'Deus locútus est in sancto suo: lætábor, et partíbor Síchimam: et convállem tabernaculórum metíbor.'
  "9": 'Meus est Gálaad, et meus est Manásses: et Ephraim fortitúdo cápitis mei. Iuda rex meus:'
  "10": 'Moab olla spei meæ. In Idumǽam exténdam calceaméntum meum: mihi alienígenæ súbditi sunt.'
  "11": Quis dedúcet me in civitátem munítam? quis dedúcet me usque in Idumǽam?
  "12": 'Nonne tu Deus, qui repulísti nos: et non egrediéris Deus in virtútibus nostris?'
  "13": 'Da nobis auxílium de tribulatióne: quia vana salus hóminis.'
  "14": 'In Deo faciémus virtútem: et ipse ad níhilum dedúcet tribulántes nos.'
