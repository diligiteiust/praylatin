bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "135"
verses:
  "1": 'Allelúia. Confitémini Dómino quóniam bonus: quóniam in ætérnum misericórdia eius.'
  "2": 'Confitémini Deo deórum: quóniam in ætérnum misericórdia eius.'
  "3": 'Confitémini Dómino dominórum: quóniam in ætérnum misericórdia eius.'
  "4": 'Qui facit mirabília magna solus: quóniam in ætérnum misericórdia eius.'
  "5": 'Qui fecit cælos in intelléctu: quóniam in ætérnum misericórdia eius.'
  "6": 'Qui firmávit terram super aquas: quóniam in ætérnum misericórdia eius.'
  "7": 'Qui fecit luminária magna: quóniam in ætérnum misericórdia eius.'
  "8": 'Solem in potestátem diéi: quóniam in ætérnum misericórdia eius.'
  "9": 'Lunam et stellas in potestátem noctis: quóniam in ætérnum misericórdia eius.'
  "10": 'Qui percússit Ægýptum cum primogénitis eórum: quóniam in ætérnum misericórdia eius.'
  "11": 'Qui edúxit Israel de médio eórum: quóniam in ætérnum misericórdia eius.'
  "12": 'In manu poténti et bráchio excélso: quóniam in ætérnum misericórdia eius.'
  "13": 'Qui divísit mare Rubrum in divisiónes: quóniam in ætérnum misericórdia eius.'
  "14": 'Et edúxit Israel per médium eius: quóniam in ætérnum misericórdia eius.'
  "15": 'Et excússit Pharaónem, et virtútem eius in mari Rubro: quóniam in ætérnum misericórdia eius.'
  "16": 'Qui tradúxit pópulum suum per desértum: quóniam in ætérnum misericórdia eius.'
  "17": 'Qui percússit reges magnos: quóniam in ætérnum misericórdia eius.'
  "18": 'Et occídit reges fortes: quóniam in ætérnum misericórdia eius.'
  "19": 'Sehon regem Amorrhæórum: quóniam in ætérnum misericórdia eius.'
  "20": 'Et Og regem Basan: quóniam in ætérnum misericórdia eius.'
  "21": 'Et dedit terram eórum hereditátem: quóniam in ætérnum misericórdia eius.'
  "22": 'Hereditátem Israel servo suo: quóniam in ætérnum misericórdia eius.'
  "23": 'Quia in humilitáte nostra memor fuit nostri: quóniam in ætérnum misericórdia eius.'
  "24": 'Et redémit nos ab inimícis nostris: quóniam in ætérnum misericórdia eius.'
  "25": 'Qui dat escam omni carni: quóniam in ætérnum misericórdia eius.'
  "26": 'Confitémini Deo cæli: quóniam in ætérnum misericórdia eius. Confitémini Dómino dominórum: quóniam in ætérnum misericórdia eius.'
