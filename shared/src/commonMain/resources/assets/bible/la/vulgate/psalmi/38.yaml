bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "38"
verses:
  "1": In finem, ipsi Idithun, Cánticum David.
  "2": 'Dixi: Custódiam vias meas: ut non delínquam in lingua mea. Pósui ori meo custódiam, cum consísteret peccátor advérsum me.'
  "3": 'Obmútui, et humiliátus sum, et sílui a bonis: et dolor meus renovátus est.'
  "4": 'Concáluit cor meum intra me: et in meditatióne mea exardéscet ignis.'
  "5": 'Locútus sum in lingua mea: Notum fac mihi Dómine finem meum, et númerum diérum meórum quis est: ut sciam quid desit mihi.'
  "6": 'Ecce mensurábiles posuísti dies meos: et substántia mea tamquam níhilum ante te. Verúmtamen univérsa vánitas, omnis homo vivens.'
  "7": 'Verúmtamen in imágine pertránsit homo: sed et frustra conturbátur. Thesaurízat: et ignórat cui congregábit ea.'
  "8": Et nunc quæ est exspectátio mea? nonne Dóminus? et substántia mea apud te est.
  "9": 'Ab ómnibus iniquitátibus meis érue me: oppróbrium insipiénti dedísti me.'
  "10": 'Obmútui, et non apérui os meum, quóniam tu fecísti:'
  "11": ámove a me plagas tuas.
  "12": 'A fortitúdine manus tuæ ego deféci in increpatiónibus: propter iniquitátem corripuísti hóminem. Et tabéscere fecísti sicut aráneam ánimam eius: verúmtamen vane conturbátur omnis homo.'
  "13": 'Exáudi oratiónem meam Dómine, et deprecatiónem meam: áuribus pércipe lácrymas meas. Ne síleas, quóniam ádvena ego sum apud te, et peregrínus, sicut omnes patres mei.'
  "14": Remítte mihi, ut refrígerer priúsquam ábeam, et ámplius non ero.
