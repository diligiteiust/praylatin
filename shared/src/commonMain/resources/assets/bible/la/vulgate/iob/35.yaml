bible: vulgate
lang: la
language: Latina
book: Iob
chapter: "35"
verses:
  "1": 'Igitur Eliu hæc rursum locútus est:'
  "2": 'Numquid æqua tibi vidétur tua cogitátio, ut díceres: Iústior sum Deo?'
  "3": 'Dixísti enim: Non tibi placet quod rectum est: vel quid tibi próderit, si ego peccávero?'
  "4": Itaque ego respondébo sermónibus tuis, et amícis tuis tecum.
  "5": Súspice cælum, et intuére, et contempláre ǽthera quod áltior te sit.
  "6": Si peccáveris, quid ei nocébis? et si multiplicátæ fúerint iniquitátes tuæ, quid fácies contra eum?
  "7": Porro si iuste égeris, quid donábis ei? aut quid de manu tua accípiet?
  "8": 'Hómini, qui símilis tui est, nocébit impíetas tua: et fílium hóminis adiuvábit iustítia tua.'
  "9": 'Propter multitúdinem calumniatórum clamábunt: et eiulábunt propter vim bráchii tyrannórum.'
  "10": 'Et non dixit: Ubi est Deus, qui fecit me, qui dedit cármina in nocte?'
  "11": qui docet nos super iuménta terræ, et super vólucres cæli érudit nos?
  "12": Ibi clamábunt, et non exáudiet, propter supérbiam malórum.
  "13": Non ergo frustra áudiet Deus, et Omnípotens causas singulórum intuébitur.
  "14": 'Etiam cum díxeris: Non consíderat: iudicáre coram illo, et exspécta eum.'
  "15": Nunc enim non infert furórem suum, nec ulcíscitur scelus valde.
  "16": Ergo Iob frustra áperit os suum, et absque sciéntia verba multíplicat.
