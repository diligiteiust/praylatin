bible: vulgate
lang: la
language: Latina
book: Deuteronomium
chapter: "33"
verses:
  "1": Hæc est benedíctio, qua benedíxit Móyses, homo Dei, fíliis Israel ante mortem suam.
  "2": 'Et ait: Dóminus de Sínai venit, et de Seir ortus est nobis: appáruit de monte Pharan, et cum eo sanctórum míllia. In déxtera eius ígnea lex.'
  "3": 'Diléxit pópulos, omnes sancti in manu illíus sunt: et qui appropínquant pédibus eius, accípient de doctrína illíus.'
  "4": Legem præcépit nobis Móyses, hereditátem multitúdinis Iacob.
  "5": Erit apud rectíssimum rex, congregátis princípibus pópuli cum tríbubus Israel.
  "6": Vivat Ruben, et non moriátur, et sit parvus in número.
  "7": 'Hæc est Iudæ benedíctio: Audi Dómine vocem Iudæ, et ad pópulum suum intróduc eum: manus eius pugnábunt pro eo, et adiútor illíus contra adversários eius erit.'
  "8": 'Levi quoque ait: Perféctio tua, et doctrína tua viro sancto tuo, quem probásti in tentatióne, et iudicásti ad Aquas contradictiónis.'
  "9": 'Qui dixit patri suo, et matri suæ: Néscio vos: et frátribus suis: Ignóro vos: et nesciérunt fílios suos. Hi custodiérunt elóquium tuum, et pactum tuum servavérunt.'
  "10": 'Iudícia tua o Iacob, et legem tuam o Israel: ponent thymiáma in furóre tuo, et holocáustum super altáre tuum.'
  "11": 'Bénedic Dómine fortitúdini eius, et ópera mánuum illíus súscipe. Pércute dorsa inimicórum eius: et qui odérunt eum, non consúrgant.'
  "12": 'Et Béniamin ait: Amantíssimus Dómini habitábit confidénter in eo: quasi in thálamo tota die morábitur, et inter húmeros illíus requiéscet.'
  "13": 'Ioseph quoque ait: De benedictióne Dómini terra eius, de pomis cæli, et rore, atque abýsso subiacénte.'
  "14": De pomis frúctuum solis ac lunæ,
  "15": 'de vértice antiquórum móntium, de pomis cóllium æternórum:'
  "16": et de frúgibus terræ, et de plenitúdine eius. Benedíctio illíus, qui appáruit in rubo, véniat super caput Ioseph, et super vérticem Nazarǽi inter fratres suos.
  "17": 'Quasi primogéniti tauri pulchritúdo eius, córnua rhinocerótis córnua illíus: in ipsis ventilábit gentes usque ad términos terræ. Hæ sunt multitúdines Ephraim: et hæc míllia Manásse.'
  "18": 'Et Zábulon ait: Lætáre Zábulon in éxitu tuo, et Issachar in tabernáculis tuis.'
  "19": 'Pópulos vocábunt ad montem: ibi immolábunt víctimas iustítiæ. Qui inundatiónem maris quasi lac sugent, et thesáuros abscónditos arenárum.'
  "20": 'Et Gad ait: Benedíctus in latitúdine Gad: quasi leo requiévit, cepítque bráchium et vérticem.'
  "21": 'Et vidit principátum suum, quod in parte sua doctor esset repósitus: qui fuit cum princípibus pópuli, et fecit iustítias Dómini, et iudícium suum cum Israel.'
  "22": 'Dan quoque ait: Dan cátulus leónis, fluet lárgiter de Basan.'
  "23": 'Et Néphthali dixit: Néphthali abundántia perfruétur, et plenus erit benedictiónibus Dómini: mare et merídiem possidébit.'
  "24": 'Aser quoque ait: Benedíctus in fíliis Aser, sit placens frátribus suis, et tingat in óleo pedem suum.'
  "25": Ferrum et æs calceaméntum eius. Sicut dies iuventútis tuæ, ita et senéctus tua.
  "26": 'Non est Deus álius ut Deus rectíssimi: ascénsor cæli auxiliátor tuus. Magnificéntia eius discúrrunt nubes,'
  "27": 'habitáculum eius sursum, et subter bráchia sempitérna: eíciet a fácie tua inimícum, dicétque: Contérere.'
  "28": Habitábit Israel confidénter, et solus. Oculus Iacob in terra fruménti et vini, cælíque caligábunt rore.
  "29": 'Beátus es tu Israel: quis símilis tui pópule, qui salváris in Dómino? scutum auxílii tui, et gládius glóriæ tuæ: negábunt te inimíci tui, et tu eórum colla calcábis.'
