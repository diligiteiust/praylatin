bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "54"
verses:
  "1": In finem, In carmínibus intelléctus David.
  "2": 'Exáudi Deus oratiónem meam, et ne despéxeris deprecatiónem meam:'
  "3": 'inténde mihi, et exáudi me. Contristátus sum in exercitatióne mea: et conturbátus sum'
  "4": 'a voce inimíci, et a tribulatióne peccatóris. Quóniam declinavérunt in me iniquitátes: et in ira molésti erant mihi.'
  "5": 'Cor meum conturbátum est in me: et formído mortis cécidit super me.'
  "6": 'Timor et tremor venérunt super me: et contexérunt me ténebræ.'
  "7": 'Et dixi: Quis dabit mihi pennas sicut colúmbæ, et volábo, et requiéscam?'
  "8": 'Ecce elongávi fúgiens: et mansi in solitúdine.'
  "9": Exspectábam eum, qui salvum me fecit a pusillanimitáte spíritus, et tempestáte.
  "10": 'Præcípita Dómine, dívide linguas eórum: quóniam vidi iniquitátem, et contradictiónem in civitáte.'
  "11": 'Die ac nocte circúmdabit eam super muros eius iníquitas: et labor in médio eius,'
  "12": et iniustítia. Et non defécit de platéis eius usúra, et dolus.
  "13": 'Quóniam si inimícus meus maledixísset mihi, sustinuíssem útique. Et si is qui óderat me super me magna locútus fuísset: abscondíssem me fórsitan ab eo.'
  "14": 'Tu vero homo unánimis, dux meus, et notus meus:'
  "15": 'qui simul mecum dulces capiébas cibos: in domo Dei ambulávimus cum consénsu.'
  "16": 'Véniat mors super illos: et descéndant in inférnum vivéntes: quóniam nequítiæ in habitáculis eórum, in médio eórum.'
  "17": 'Ego autem ad Deum clamávi: et Dóminus salvábit me.'
  "18": 'Véspere, et mane, et merídie, narrábo, et annuntiábo: et exáudiet vocem meam.'
  "19": 'Rédimet in pace ánimam meam ab his, qui appropínquant mihi: quóniam inter multos erant mecum.'
  "20": 'Exáudiet Deus, et humiliábit illos, qui est ante sǽcula. Non enim est illis commutátio, et non timuérunt Deum:'
  "21": 'exténdit manum suam in retribuéndo. Contaminavérunt testaméntum eius:'
  "22": 'divísi sunt ab ira vultus eius: et appropinquávit cor illíus. Mollíti sunt sermónes eius super óleum: et ipsi sunt iácula.'
  "23": 'Iacta super Dóminum curam tuam, et ipse te enútriet: non dabit in ætérnum fluctuatiónem iusto.'
  "24": 'Tu vero Deus dedúces eos in púteum intéritus. Viri sánguinum et dolósi non dimidiábunt dies suos: ego autem sperábo in te Dómine.'
