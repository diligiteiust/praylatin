bible: vulgate
lang: la
language: Latina
book: I Samuelis
chapter: "24"
verses:
  "1": 'Ascéndit ergo David inde: et habitávit in locis tutíssimis Engáddi.'
  "2": 'Cumque revérsus esset Saul, postquam persecútus est Philisthǽos, nuntiavérunt ei, dicéntes: Ecce David in desérto est Engáddi.'
  "3": Assúmens ergo Saul tria míllia electórum virórum ex omni Israel, perréxit ad investigándum David et viros eius, étiam super abruptíssimas petras, quæ solis ibícibus pérviæ sunt.
  "4": 'Et venit ad caulas óvium, quæ se offerébant viánti: erátque ibi spelúnca, quam ingréssus est Saul ut purgáret ventrem: porro David et viri eius in interióre parte spelúncæ latébant.'
  "5": 'Et dixérunt servi David ad eum: Ecce dies, de qua locútus est Dóminus ad te: Ego tradam tibi inimícum tuum, ut fácias ei sicut placúerit in óculis tuis. Surréxit ergo David, et præcídit oram chlámydis Saul silénter.'
  "6": Post hæc percússit cor suum David, eo quod abscidísset oram chlámydis Saul.
  "7": 'Dixítque ad viros suos: Propítius sit mihi Dóminus, ne fáciam hanc rem dómino meo, christo Dómini, ut mittam manum meam in eum: quia christus Dómini est.'
  "8": 'Et confrégit David viros suos sermónibus, et non permísit eos ut consúrgerent in Saul: porro Saul exsúrgens de spelúnca, pergébat cœpto itínere.'
  "9": 'Surréxit autem et David post eum: et egréssus de spelúnca, clamávit post tergum Saul, dicens: Dómine mi rex. Et respéxit Saul post se: et inclínans se David pronus in terram adorávit,'
  "10": 'dixítque ad Saul: Quare audis verba hóminum loquéntium: David quærit malum advérsum te?'
  "11": 'Ecce hódie vidérunt óculi tui quod tradíderit te Dóminus in manu mea in spelúnca: et cogitávi ut occíderem te, sed pepércit tibi óculus meus: dixi enim: Non exténdam manum meam in dóminum meum, quia christus Dómini est.'
  "12": 'Quin pótius pater mi, vide, et cognósce oram chlámydis tuæ in manu mea: quóniam cum præscínderem summitátem chlámydis tuæ, nólui exténdere manum meam in te: animadvérte, et vide, quóniam non est in manu mea malum, neque iníquitas, neque peccávi in te: tu autem insidiáris ánimæ meæ ut áuferas eam.'
  "13": 'Iúdicet Dóminus inter me et te, et ulciscátur me Dóminus ex te: manus autem mea non sit in te.'
  "14": 'Sicut et in provérbio antíquo dícitur: Ab ímpiis egrediétur impíetas: manus ergo mea non sit in te.'
  "15": Quem perséqueris, rex Israel? quem perséqueris? canem mórtuum perséqueris, et púlicem unum.
  "16": 'Sit Dóminus iudex, et iúdicet inter me et te: et vídeat, et iúdicet causam meam, et éruat me de manu tua.'
  "17": 'Cum autem complésset David loquens sermónes huiuscémodi ad Saul, dixit Saul: Numquid vox hæc tua est, fili mi David? Et levávit Saul vocem suam, et flevit:'
  "18": 'dixítque ad David: Iústior tu es quam ego: tu enim tribuísti mihi bona, ego autem réddidi tibi mala.'
  "19": 'Et tu indicásti hódie quæ féceris mihi bona: quómodo tradíderit me Dóminus in manum tuam, et non occíderis me.'
  "20": Quis enim cum invénerit inimícum suum, dimíttet eum in via bona? sed Dóminus reddat tibi vicissitúdinem hanc pro eo quod hódie operátus es in me.
  "21": 'Et nunc quia scio quod certíssime regnatúrus sis, et habitúrus in manu tua regnum Israel:'
  "22": iura mihi in Dómino, ne déleas semen meum post me, neque áuferas nomen meum de domo patris mei.
  "23": 'Et iurávit David Sauli. Abiit ergo Saul in domum suam: et David et viri eius ascendérunt ad tutióra loca.'
