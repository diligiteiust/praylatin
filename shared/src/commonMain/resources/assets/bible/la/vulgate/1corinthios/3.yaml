bible: vulgate
lang: la
language: Latina
book: ad Corinthios I
chapter: "3"
verses:
  "1": Et ego, fratres, non pótui vobis loqui quasi spirituálibus, sed quasi carnálibus. Tamquam párvulis in Christo,
  "2": 'lac vobis potum dedi, non escam: nondum enim poterátis: sed nec nunc quidem potéstis: adhuc enim carnáles estis.'
  "3": 'Cum enim sit inter vos zelus, et conténtio: nonne carnáles estis, et secúndum hóminem ambulátis?'
  "4": 'Cum enim quis dicat: Ego quidem sum Pauli: álius autem: Ego Apóllo: nonne hómines estis? Quid ígitur est Apóllo? quid vero Paulus?'
  "5": Minístri eius, cui credidístis, et unicuíque sicut Dóminus dedit.
  "6": 'Ego plantávi, Apóllo rigávit: sed Deus increméntum dedit.'
  "7": 'Itaque neque qui plantat est áliquid, neque qui rigat: sed, qui increméntum dat, Deus.'
  "8": Qui autem plantat, et qui rigat, unum sunt. Unusquísque autem própriam mercédem accípiet, secúndum suum labórem.
  "9": 'Dei enim sumus adiutóres: Dei agricultúra estis, Dei ædificátio estis.'
  "10": 'Secúndum grátiam Dei, quæ data est mihi, ut sápiens architéctus fundaméntum pósui: álius autem superædíficat. Unusquísque autem vídeat quómodo superædíficet.'
  "11": Fundaméntum enim áliud nemo potest pónere præter id, quod pósitum est, quod est Christus Iesus.
  "12": Si quis autem superædíficat super fundaméntum hoc, aurum, argéntum, lápides pretiósos, ligna, fœnum, stípulam,
  "13": 'uniuscuiúsque opus maniféstum erit: dies enim Dómini declarábit, quia in igne revelábitur: et uniuscuiúsque opus quale sit, ignis probábit.'
  "14": Si cuius opus mánserit quod superædificávit, mercédem accípiet.
  "15": 'Si cuius opus árserit, detriméntum patiétur: ipse autem salvus erit, sic tamen quasi per ignem.'
  "16": Nescítis quia templum Dei estis, et Spíritus Dei hábitat in vobis?
  "17": Si quis autem templum Dei violáverit, dispérdet illum Deus. Templum enim Dei sanctum est, quod estis vos.
  "18": 'Nemo se sedúcat: si quis vidétur inter vos sápiens esse in hoc sǽculo, stultus fiat ut sit sápiens.'
  "19": 'Sapiéntia enim huius mundi, stultítia est apud Deum. Scriptum est enim: Comprehéndam sapiéntes in astútia eórum.'
  "20": 'Et íterum: Dóminus novit cogitatiónes sapiéntium, quóniam vanæ sunt.'
  "21": Nemo ítaque gloriétur in homínibus.
  "22": 'Omnia enim vestra sunt, sive Paulus, sive Apóllo, sive Cephas, sive mundus, sive vita, sive mors, sive præséntia, sive futúra: ómnia enim vestra sunt:'
  "23": 'vos autem Christi: Christus autem Dei.'
