bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "83"
verses:
  "1": In finem, Pro torculáribus fíliis Core, Psalmus.
  "2": 'Quam dilécta tabernácula tua Dómine virtútum:'
  "3": concupíscit, et déficit ánima mea in átria Dómini. Cor meum, et caro mea exsultavérunt in Deum vivum.
  "4": 'Etenim passer invénit sibi domum: et turtur nidum sibi, ubi ponat pullos suos. Altária tua Dómine virtútum: rex meus, et Deus meus.'
  "5": 'Beáti, qui hábitant in domo tua Dómine: in sǽcula sæculórum laudábunt te.'
  "6": 'Beátus vir, cuius est auxílium abs te: ascensiónes in corde suo dispósuit,'
  "7": in valle lacrymárum, in loco quem pósuit.
  "8": 'Etenim benedictiónem dabit legislátor, ibunt de virtúte in virtútem: vidébitur Deus deórum in Sion.'
  "9": 'Dómine Deus virtútum exáudi oratiónem meam: áuribus pércipe Deus Iacob.'
  "10": 'Protéctor noster áspice Deus: et réspice in fáciem christi tui:'
  "11": quia mélior est dies una in átriis tuis super míllia. Elégi abiéctus esse in domo Dei mei, magis quam habitáre in tabernáculis peccatórum.
  "12": 'Quia misericórdiam et veritátem díligit Deus: grátiam, et glóriam dabit Dóminus.'
  "13": 'Non privábit bonis eos qui ámbulant in innocéntia: Dómine virtútum, beátus homo qui sperat in te.'
