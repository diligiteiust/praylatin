bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "130"
verses:
  "1": 'Cánticum gráduum David. Dómine non est exaltátum cor meum: neque eláti sunt óculi mei. Neque ambulávi in magnis: neque in mirabílibus super me.'
  "2": 'Si non humíliter sentiébam: sed exaltávi ánimam meam: sicut ablactátus est super matre sua, ita retribútio in ánima mea.'
  "3": Speret Israel in Dómino, ex hoc nunc et usque in sǽculum.
