bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "14"
verses:
  "1": Psalmus David. Dómine quis habitábit in tabernáculo tuo? aut quis requiéscet in monte sancto tuo?
  "2": 'Qui ingréditur sine mácula, et operátur iustítiam:'
  "3": 'qui lóquitur veritátem in corde suo, qui non egit dolum in lingua sua: nec fecit próximo suo malum, et oppróbrium non accépit advérsus próximos suos.'
  "4": 'Ad níhilum dedúctus est in conspéctu eius malígnus: timéntes autem Dóminum gloríficat: qui iurat próximo suo, et non décipit:'
  "5": 'qui pecúniam suam non dedit ad usúram, et múnera super innocéntem non accépit: qui facit hæc, non movébitur in ætérnum.'
