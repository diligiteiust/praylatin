bible: vulgate
lang: la
language: Latina
book: Habacuc
chapter: "1"
verses:
  "1": Onus, quod vidit Hábacuc prophéta.
  "2": Usquequo Dómine clamábo, et non exáudies? vociferábor ad te vim pátiens, et non salvábis?
  "3": Quare ostendísti mihi iniquitátem, et labórem, vidére prædam et iniustítiam contra me? et factum est iudícium, et contradíctio poténtior.
  "4": 'Propter hoc laceráta est lex, et non pervénit usque ad finem iudícium: quia ímpius prǽvalet advérsus iustum, proptérea egréditur iudícium pervérsum.'
  "5": 'Aspícite in géntibus, et vidéte: admirámini, et obstupéscite: quia opus factum est in diébus vestris, quod nemo credet cum narrábitur.'
  "6": Quia ecce ego suscitábo Chaldǽos, gentem amáram, et velócem, ambulántem super latitúdinem terræ, ut possídeat tabernácula non sua.
  "7": 'Horríbilis, et terríbilis est: ex semetípsa iudícium, et onus eius egrediétur.'
  "8": 'Levióres pardis equi eius, et velocióres lupis vespertínis: et diffundéntur équites eius: équites namque eius de longe vénient, volábunt quasi áquila festínans ad comedéndum.'
  "9": 'Omnes ad prædam vénient, fácies eórum ventus urens: et congregábit quasi arénam captivitátem.'
  "10": 'Et ipse de régibus triumphábit, et tyránni ridículi eius erunt: ipse super omnem munitiónem ridébit, et comportábit ággerem, et cápiet eam.'
  "11": 'Tunc mutábitur spíritus, et pertransíbit, et córruet: hæc est fortitúdo eius dei sui.'
  "12": 'Numquid non tu a princípio Dómine Deus meus, sancte meus, et non moriémur? Dómine in iudícium posuísti eum: et fortem ut corríperes, fundásti eum.'
  "13": 'Mundi sunt óculi tui, ne vídeas malum, et respícere ad iniquitátem non póteris: quare réspicis super iníqua agéntes, et taces devoránte ímpio iustiórem se?'
  "14": Et fácies hómines quasi pisces maris, et quasi réptile non habens príncipem.
  "15": Totum in hamo sublevávit, traxit illud in sagéna sua, et congregávit in rete suum. Super hoc lætábitur, et exsultábit.
  "16": 'Proptérea immolábit sagénæ suæ, et sacrificábit reti suo: quia in ipsis incrassáta est pars eius, et cibus eius eléctus.'
  "17": Propter hoc ergo expándit sagénam suam, et semper interfícere gentes non parcet.
