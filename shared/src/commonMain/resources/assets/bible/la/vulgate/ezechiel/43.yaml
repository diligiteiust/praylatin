bible: vulgate
lang: la
language: Latina
book: Ezechiel
chapter: "43"
verses:
  "1": Et duxit me ad portam, quæ respiciébat ad viam orientálem.
  "2": 'Et ecce glória Dei Israel ingrediebátur per viam orientálem: et vox erat ei quasi vox aquárum multárum, et terra splendébat a maiestáte eius.'
  "3": 'Et vidi visiónem secúndum spéciem, quam víderam quando venit ut dispérderet civitátem: et spécies secúndum aspéctum, quem víderam iuxta flúvium Chobar: et cécidi super fáciem meam.'
  "4": Et maiéstas Dómini ingréssa est templum per viam portæ, quæ respiciébat ad oriéntem.
  "5": 'Et elevávit me spíritus, et introdúxit me in átrium intérius: et ecce repléta erat glória Dómini domus.'
  "6": 'Et audívi loquéntem ad me de domo: et vir, qui stabat iuxta me,'
  "7": 'dixit ad me: Fili hóminis, locus sólii mei, et locus vestigiórum pedum meórum, ubi hábito in médio filiórum Israel in ætérnum: et non pólluent ultra domus Israel nomen sanctum meum, ipsi et reges eórum, in fornicatiónibus suis, et in ruínis regum suórum, et in excélsis.'
  "8": 'Qui fabricáti sunt limen suum iuxta limen meum, et postes suos iuxta postes meos: et murus erat inter me et eos: et polluérunt nomen sanctum meum in abominatiónibus, quas fecérunt: propter quod consúmpsi eos in ira mea.'
  "9": 'Nunc ergo repéllant procul fornicatiónem suam, et ruínas regum suórum a me: et habitábo in médio eórum semper.'
  "10": 'Tu autem fili hóminis osténde dómui Israel templum, et confundántur ab iniquitátibus suis, et metiántur fábricam:'
  "11": 'et erubéscant ex ómnibus, quæ fecérunt: figúram domus, et fábricæ eius éxitus, et intróitus, et omnem descriptiónem eius, et univérsa præcépta eius, cunctúmque órdinem eius, et omnes leges eius osténde eis, et scribes in óculis eórum: ut custódiant omnes descriptiónes eius, et præcépta illíus, et fáciant ea.'
  "12": 'Ista est lex domus in summitáte montis: omnis finis eius in circúitu, sanctum sanctórum est: hæc est ergo lex domus.'
  "13": 'Istæ autem mensúræ altáris in cúbito veríssimo, qui habébat cúbitum, et palmum: in sinu eius erat cúbitus, et cúbitus in latitúdine, et definítio eius usque ad lábium eius, et in circúitu, palmus unus: hæc quoque erat fossa altáris.'
  "14": 'Et de sinu terræ usque ad crepídinem novíssimam duo cúbiti, et latitúdo cúbiti uníus: et a crepídine minóre usque ad crepídinem maiórem quátuor cúbiti, et latitúdo cúbiti uníus.'
  "15": 'Ipse autem Ariel quátuor cubitórum: et ab Ariel usque ad sursum córnua quátuor.'
  "16": 'Et Ariel duódecim cubitórum in longitúdine per duódecim cúbitos latitúdinis: quadrangulátum æquis latéribus.'
  "17": 'Et crepído quatuórdecim cubitórum longitúdinis per quatuórdecim cúbitos latitúdinis in quátuor ángulis eius: et coróna in circúitu eius dimídii cúbiti, et sinus eius uníus cúbiti per circúitum: gradus autem eius versi ad oriéntem.'
  "18": 'Et dixit ad me: Fili hóminis, hæc dicit Dóminus Deus: Hi sunt ritus altáris, in quacúmque die fúerit fabricátum, ut offerátur super illud holocáustum, et effundátur sanguis.'
  "19": Et dabis sacerdótibus et Levítis, qui sunt de sémine Sadoc, qui accédunt ad me, ait Dóminus Deus, ut ófferant mihi vítulum de arménto pro peccáto.
  "20": 'Et assúmens de sánguine eius, pones super quátuor córnua eius, et super quátuor ángulos crepídinis, et super corónam in circúitu: et mundábis illud, et expiábis.'
  "21": 'Et tolles vítulum, qui oblátus fúerit pro peccáto: et combúres eum in separáto loco domus, extra sanctuárium.'
  "22": 'Et in die secúnda ófferes hircum caprárum immaculátum pro peccáto: et expiábunt altáre sicut expiavérunt in vítulo.'
  "23": Cumque compléveris éxpians illud, ófferes vítulum de arménto immaculátum, et aríetem de grege immaculátum.
  "24": 'Et ófferes eos in conspéctu Dómini: et mittent sacerdótes super eos sal, et ófferent eos holocáustum Dómino.'
  "25": 'Septem diébus fácies hircum pro peccáto quotídie: et vítulum de arménto, et aríetem de pecóribus immaculátos ófferent.'
  "26": 'Septem diébus expiábunt altáre, et mundábunt illud: et implébunt manum eius.'
  "27": 'Explétis autem diébus, in die octáva et ultra, fácient sacerdótes super altáre holocáusta vestra, et quæ pro pace ófferunt: et placátus ero vobis, ait Dóminus Deus.'
