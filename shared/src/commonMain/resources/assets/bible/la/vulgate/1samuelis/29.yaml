bible: vulgate
lang: la
language: Latina
book: I Samuelis
chapter: "29"
verses:
  "1": 'Congregáta sunt ergo Philísthiim univérsa ágmina in Aphec: sed et Israel castrametátus est super fontem, qui erat in Iézrahel.'
  "2": 'Et sátrapæ quidem Philísthiim incedébant in centúriis et míllibus: David autem et viri eius erant in novíssimo ágmine cum Achis.'
  "3": 'Dixerúntque príncipes Philísthiim ad Achis: Quid sibi volunt Hebrǽi isti? Et ait Achis ad príncipes Philísthiim: Num ignorátis David, qui fuit servus Saul regis Israel, et est apud me multis diébus, vel annis, et non invéni in eo quidquam ex die qua transfúgit ad me, usque ad diem hanc?'
  "4": 'Iráti sunt autem advérsus eum príncipes Philísthiim, et dixérunt ei: Revertátur vir iste, et sédeat in loco suo, in quo constituísti eum, et non descéndat nobíscum in prœ́lium, ne fiat nobis adversárius, cum prœliári cœpérimus: quómodo enim áliter póterit placáre dóminum suum, nisi in capítibus nostris?'
  "5": 'Nonne iste est David, cui cantábant in choris, dicéntes: Percússit Saul in míllibus suis, et David in decem míllibus suis?'
  "6": 'Vocávit ergo Achis David, et ait ei: Vivit Dóminus, quia rectus es tu, et bonus in conspéctu meo: et éxitus tuus, et intróitus tuus mecum est in castris: et non invéni in te quidquam mali ex die qua venísti ad me, usque in diem hanc: sed sátrapis non places.'
  "7": Revértere ergo, et vade in pace, et non offéndas óculos satrapárum Philísthiim.
  "8": 'Dixítque David ad Achis: Quid enim feci, et quid invenísti in me servo tuo, a die qua fui in conspéctu tuo usque in diem hanc, ut non véniam, et pugnem contra inimícos dómini mei regis?'
  "9": 'Respóndens autem Achis, locútus est ad David: Scio quia bonus es tu in óculis meis, sicut ángelus Dei: sed príncipes Philisthinórum dixérunt: Non ascéndet nobíscum in prœ́lium.'
  "10": 'Igitur consúrge mane tu, et servi dómini tui, qui venérunt tecum: et cum de nocte surrexéritis, et cœ́perit dilucéscere, pérgite.'
  "11": 'Surréxit ítaque de nocte David, ipse et viri eius, ut proficisceréntur mane, et reverteréntur ad terram Philísthiim: Philísthiim autem ascendérunt in Iézrahel.'
