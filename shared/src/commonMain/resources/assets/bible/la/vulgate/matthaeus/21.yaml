bible: vulgate
lang: la
language: Latina
book: Matthaeus
chapter: "21"
verses:
  "1": 'Et cum appropinquássent Ierosólymis, et veníssent Béthphage ad montem Olivéti: tunc Iesus misit duos discípulos,'
  "2": 'dicens eis: Ite in castéllum, quod contra vos est, et statim inveniétis ásinam alligátam, et pullum cum ea: sólvite, et addúcite mihi:'
  "3": 'et si quis vobis áliquid díxerit, dícite quia Dóminus his opus habet: et conféstim dimíttet eos.'
  "4": 'Hoc autem totum factum est, ut adimplerétur quod dictum est per prophétam dicéntem:'
  "5": 'Dícite fíliæ Sion: Ecce rex tuus venit tibi mansuétus, sedens super ásinam, et pullum fílium subiugális.'
  "6": Eúntes autem discípuli fecérunt sicut præcépit illis Iesus.
  "7": 'Et adduxérunt ásinam, et pullum: et imposuérunt super eos vestiménta sua, et eum désuper sedére fecérunt.'
  "8": 'Plúrima autem turba stravérunt vestiménta sua in via: álii autem cædébant ramos de arbóribus, et sternébant in via:'
  "9": 'turbæ autem, quæ præcedébant, et quæ sequebántur, clamábant, dicéntes: Hosánna fílio David: benedíctus, qui venit in nómine Dómini: hosánna in altíssimis.'
  "10": 'Et cum intrásset Ierosólymam, commóta est univérsa cívitas, dicens: Quis est hic?'
  "11": 'Pópuli autem dicébant: Hic est Iesus prophéta a Názareth Galilǽæ.'
  "12": 'Et intrávit Iesus in templum Dei, et eiciébat omnes vendéntes, et eméntes in templo, et mensas nummulariórum, et cáthedras vendéntium colúmbas evértit:'
  "13": 'et dicit eis: Scriptum est: Domus mea domus oratiónis vocábitur: vos autem fecístis illam spelúncam latrónum.'
  "14": 'Et accessérunt ad eum cæci, et claudi in templo: et sanávit eos.'
  "15": 'Vidéntes autem príncipes sacerdótum, et scribæ mirabília quæ fecit, et púeros clamántes in templo, et dicéntes: Hosánna fílio David: indignáti sunt,'
  "16": 'et dixérunt ei: Audis quid isti dicunt? Iesus autem dixit eis: Utique. Numquam legístis: Quia ex ore infántium, et lacténtium perfecísti laudem?'
  "17": 'Et relíctis illis, ábiit foras extra civitátem in Bethániam: ibíque mansit.'
  "18": Mane autem revértens in civitátem, esúriit.
  "19": 'Et videns fici árborem unam secus viam, venit ad eam: et nihil invénit in ea nisi fólia tantum, et ait illi: Numquam ex te fructus nascátur in sempitérnum. Et arefácta est contínuo ficúlnea.'
  "20": 'Et vidéntes discípuli, miráti sunt, dicéntes: Quómodo contínuo áruit?'
  "21": 'Respóndens autem Iesus, ait eis: Amen dico vobis, si habuéritis fidem, et non hæsitavéritis, non solum de ficúlnea faciétis, sed et si monti huic dixéritis: Tolle, et iacta te in mare, fiet.'
  "22": Et ómnia quæcúmque petiéritis in oratióne credéntes, accipiétis.
  "23": 'Et cum venísset in templum, accessérunt ad eum docéntem príncipes sacerdótum, et senióres pópuli, dicéntes: In qua potestáte hæc facis? Et quis tibi dedit hanc potestátem?'
  "24": 'Respóndens Iesus dixit eis: Interrogábo vos et ego unum sermónem: quem si dixéritis mihi, et ego vobis dicam in qua potestáte hæc fácio.'
  "25": 'Baptísmus Ioánnis unde erat? e cælo, an ex homínibus? At illi cogitábant inter se, dicéntes:'
  "26": 'Si dixérimus, e cælo, dicet nobis: Quare ergo non credidístis illi? Si autem dixérimus, ex homínibus, timémus turbam: omnes enim habébant Ioánnem sicut prophétam.'
  "27": 'Et respondéntes Iesu, dixérunt: Nescímus. Ait illis et ipse: Nec ego dico vobis in qua potestáte hæc fácio.'
  "28": 'Quid autem vobis vidétur? Homo quidam habébat duos fílios, et accédens ad primum, dixit: Fili, vade hódie, operáre in vínea mea.'
  "29": 'Ille autem respóndens, ait: Nolo. Póstea autem, pœniténtia motus, ábiit.'
  "30": 'Accédens autem ad álterum, dixit simíliter. At ille respóndens, ait: Eo, dómine, et non ivit.'
  "31": 'Quis ex duóbus fecit voluntátem patris? Dicunt ei: Primus. Dicit illis Iesus: Amen dico vobis, quia publicáni, et meretríces præcédent vos in regnum Dei.'
  "32": 'Venit enim ad vos Ioánnes in via iustítiæ, et non credidístis ei: publicáni autem, et meretríces credidérunt ei: vos autem vidéntes nec pœniténtiam habuístis póstea, ut crederétis ei.'
  "33": 'Aliam parábolam audíte: Homo erat paterfamílias, qui plantávit víneam, et sepem circúmdedit ei, et fodit in ea tórcular, et ædificávit turrim, et locávit eam agrícolis, et péregre proféctus est.'
  "34": Cum autem tempus frúctuum appropinquásset, misit servos suos ad agrícolas, ut accíperent fructus eius.
  "35": Et agrícolæ, apprehénsis servis eius, álium cecidérunt, álium occidérunt, álium vero lapidavérunt.
  "36": Iterum misit álios servos plures prióribus, et fecérunt illis simíliter.
  "37": 'Novíssime autem misit ad eos fílium suum, dicens: Verebúntur fílium meum.'
  "38": 'Agrícolæ autem vidéntes fílium dixérunt intra se: Hic est heres, veníte, occidámus eum, et habébimus hereditátem eius.'
  "39": Et apprehénsum eum eiecérunt extra víneam, et occidérunt.
  "40": Cum ergo vénerit dóminus víneæ, quid fáciet agrícolis illis?
  "41": 'Aiunt illi: Malos male perdet: et víneam suam locábit áliis agrícolis, qui reddant ei fructum tempóribus suis.'
  "42": 'Dicit illis Iesus: Numquam legístis in Scriptúris: Lápidem, quem reprobavérunt ædificántes, hic factus est in caput ánguli: a Dómino factum est istud, et est mirábile in óculis nostris?'
  "43": Ideo dico vobis, quia auferétur a vobis regnum Dei, et dábitur genti faciénti fructus eius.
  "44": 'Et qui cecíderit super lápidem istum, confringétur: super quem vero cecíderit, cónteret eum.'
  "45": Et cum audíssent príncipes sacerdótum, et Pharisǽi parábolas eius, cognovérunt quod de ipsis díceret.
  "46": 'Et quæréntes eum tenére, timuérunt turbas: quóniam sicut prophétam eum habébant.'
