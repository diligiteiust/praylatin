bible: vulgate
lang: la
language: Latina
book: ad Corinthios II
chapter: "1"
verses:
  "1": Paulus, Apóstolus Iesu Christi per voluntátem Dei, et Timótheus frater, ecclésiæ Dei, quæ est Corínthi cum ómnibus sanctis, qui sunt in univérsa Acháia.
  "2": Grátia vobis, et pax a Deo Patre nostro, et Dómino Iesu Christo.
  "3": Benedíctus Deus et Pater Dómini nostri Iesu Christi, Pater misericordiárum, et Deus totíus consolatiónis,
  "4": 'qui consolátur nos in omni tribulatióne nostra: ut possímus et ipsi consolári eos, qui in omni pressúra sunt, per exhortatiónem, qua exhortámur et ipsi a Deo.'
  "5": 'Quóniam sicut abúndant passiónes Christi in nobis: ita et per Christum abúndat consolátio nostra.'
  "6": 'Sive autem tribulámur pro vestra exhortatióne et salúte, sive consolámur pro vestra consolatióne, sive exhortámur pro vestra exhortatióne et salúte, quæ operátur tolerántiam earúmdem passiónum, quas et nos pátimur:'
  "7": 'ut spes nostra firma sit pro vobis: sciéntes quod sicut sócii passiónum estis, sic éritis et consolatiónis.'
  "8": Non enim vólumus ignoráre vos fratres de tribulatióne nostra, quæ facta est in Asia, quóniam supra modum graváti sumus supra virtútem, ita ut tædéret nos étiam vívere.
  "9": 'Sed ipsi in nobismetípsis respónsum mortis habúimus, ut non simus fidéntes in nobis, sed in Deo, qui súscitat mórtuos:'
  "10": 'qui de tantis perículis nos erípuit, et éruit: in quem sperámus quóniam et adhuc erípiet,'
  "11": 'adiuvántibus et vobis in oratióne pro nobis: ut ex multórum persónis, eius quæ in nobis est donatiónis, per multos grátiæ agántur pro nobis.'
  "12": 'Nam glória nostra hæc est, testimónium consciéntiæ nostræ, quod in simplicitáte cordis et sinceritáte Dei, et non in sapiéntia carnáli, sed in grátia Dei, conversáti sumus in hoc mundo: abundántius autem ad vos.'
  "13": Non enim ália scríbimus vobis, quam quæ legístis, et cognovístis. Spero autem quod usque in finem cognoscétis,
  "14": sicut et cognovístis nos ex parte, quod glória vestra sumus, sicut et vos nostra, in die Dómini nostri Iesu Christi.
  "15": 'Et hac confidéntia vólui prius veníre ad vos, ut secúndam grátiam haberétis:'
  "16": et per vos transíre in Macedóniam, et íterum a Macedónia veníre ad vos, et a vobis dedúci in Iudǽam.
  "17": Cum ergo hoc voluíssem, numquid levitáte usus sum? aut quæ cógito, secúndum carnem cógito, ut sit apud me Est, et Non?
  "18": Fidélis autem Deus, quia sermo noster, qui fuit apud vos, non est in illo Est, et Non.
  "19": Dei enim Fílius Iesus Christus, qui in vobis per nos prædicátus est, per me, et Silvánum, et Timótheum, non fuit Est et Non, sed Est in illo fuit.
  "20": 'Quotquot enim promissiónes Dei sunt, in illo Est: ídeo et per ipsum Amen Deo ad glóriam nostram.'
  "21": 'Qui autem confírmat nos vobíscum in Christo, et qui unxit nos Deus:'
  "22": qui et signávit nos, et dedit pignus Spíritus in córdibus nostris.
  "23": 'Ego autem testem Deum ínvoco in ánimam meam, quod parcens vobis, non veni ultra Corínthum: non quia dominámur fídei vestræ, sed adiutóres sumus gáudii vestri: nam fide statis.'
