bible: vulgate
lang: la
language: Latina
book: Iob
chapter: "36"
verses:
  "1": 'Addens quoque Eliu, hæc locútus est:'
  "2": 'Sústine me páululum, et indicábo tibi: adhuc enim hábeo quod pro Deo loquar.'
  "3": Répetam sciéntiam meam a princípio, et operatórem meum probábo iustum.
  "4": Vere enim absque mendácio sermónes mei, et perfécta sciéntia probábitur tibi.
  "5": Deus poténtes non ábicit, cum et ipse sit potens.
  "6": Sed non salvat ímpios, et iudícium paupéribus tríbuit.
  "7": Non áuferet a iusto óculos suos, et reges in sólio cóllocat in perpétuum, et illi erigúntur.
  "8": Et si fúerint in caténis, et vinciántur fúnibus paupertátis,
  "9": indicábit eis ópera eórum, et scélera eórum, quia violénti fuérunt.
  "10": 'Revelábit quoque aurem eórum, ut corrípiat: et loquétur, ut revertántur ab iniquitáte.'
  "11": 'Si audíerint et observáverint, complébunt dies suos in bono, et annos suos in glória:'
  "12": si autem non audíerint, transíbunt per gládium, et consuméntur in stultítia.
  "13": Simulatóres et cállidi próvocant iram Dei, neque clamábunt cum vincti fúerint.
  "14": Moriétur in tempestáte ánima eórum, et vita eórum inter effeminátos.
  "15": Erípiet de angústia sua páuperem, et revelábit in tribulatióne aurem eius.
  "16": 'Igitur salvábit te de ore angústo latíssime, et non habénte fundaméntum subter se: réquies autem mensæ tuæ erit plena pinguédine.'
  "17": Causa tua quasi ímpii iudicáta est, causam iudiciúmque recípies.
  "18": 'Non te ergo súperet ira, ut áliquem ópprimas: nec multitúdo donórum inclínet te.'
  "19": Depóne magnitúdinem tuam absque tribulatióne, et omnes robústos fortitúdine.
  "20": Ne prótrahas noctem, ut ascéndant pópuli pro eis.
  "21": 'Cave ne declínes ad iniquitátem: hanc enim cœpísti sequi post misériam.'
  "22": Ecce Deus excélsus in fortitúdine sua, et nullus ei símilis in legislatóribus.
  "23": 'Quis póterit scrutári vias eius? aut quis potest ei dícere: Operátus es iniquitátem?'
  "24": Meménto quod ignóres opus eius, de quo cecinérunt viri.
  "25": Omnes hómines vident eum, unusquísque intuétur procul.
  "26": 'Ecce Deus magnus vincens sciéntiam nostram: númerus annórum eius inæstimábilis.'
  "27": Qui aufert stillas plúviæ, et effúndit imbres ad instar gúrgitum,
  "28": qui de núbibus fluunt, quæ prætéxunt cuncta désuper.
  "29": Si volúerit exténdere nubes quasi tentórium suum,
  "30": et fulguráre lúmine suo désuper, cárdines quoque maris opériet.
  "31": Per hæc enim iúdicat pópulos, et dat escas multis mortálibus.
  "32": In mánibus abscóndit lucem, et præcépit ei ut rursus advéniat.
  "33": Annúntiat de ea amíco suo, quod posséssio eius sit, et ad eam possit ascéndere.
