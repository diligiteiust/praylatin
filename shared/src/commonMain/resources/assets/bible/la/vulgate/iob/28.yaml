bible: vulgate
lang: la
language: Latina
book: Iob
chapter: "28"
verses:
  "1": 'Habet argéntum venárum suárum princípia: et auro locus est, in quo conflátur.'
  "2": Ferrum de terra tóllitur, et lapis solútus calóre in æs vértitur.
  "3": Tempus pósuit ténebris, et universórum finem ipse consíderat, lápidem quoque calíginis, et umbram mortis.
  "4": Dívidit torrens a pópulo peregrinánte, eos, quos oblítus est pes egéntis hóminis, et ínvios.
  "5": Terra, de qua oriebátur panis, in loco suo igni subvérsa est.
  "6": Locus sapphíri lápides eius, et glebæ illíus aurum.
  "7": Sémitam ignorávit avis, nec intúitus est eam óculus vúlturis.
  "8": Non calcavérunt eam fílii institórum, nec pertransívit per eam leǽna.
  "9": Ad sílicem exténdit manum suam, subvértit a radícibus montes.
  "10": In petris rivos excídit, et omne pretiósum vidit óculus eius.
  "11": Profúnda quoque fluviórum scrutátus est, et abscóndita in lucem prodúxit.
  "12": Sapiéntia vero ubi invenítur? et quis est locus intelligéntiæ?
  "13": Nescit homo prétium eius, nec invenítur in terra suáviter vivéntium.
  "14": 'Abýssus dicit: Non est in me: et mare lóquitur: Non est mecum.'
  "15": Non dábitur aurum obrízum pro ea, nec appendétur argéntum in commutatióne eius.
  "16": Non conferétur tinctis Indiæ colóribus, nec lápidi sardónycho pretiosíssimo, vel sapphíro.
  "17": 'Non adæquábitur ei aurum vel vitrum, nec commutabúntur pro ea vasa auri:'
  "18": 'excélsa et eminéntia non memorabúntur comparatióne eius: tráhitur autem sapiéntia de occúltis.'
  "19": Non adæquábitur ei topázius de Æthiópia, nec tinctúræ mundíssimæ componétur.
  "20": Unde ergo sapiéntia venit? et quis est locus intelligéntiæ?
  "21": Abscóndita est ab óculis ómnium vivéntium, vólucres quoque cæli latet.
  "22": 'Perdítio et mors dixérunt: Auribus nostris audívimus famam eius.'
  "23": Deus intélligit viam eius, et ipse novit locum illíus.
  "24": 'Ipse enim fines mundi intuétur: et ómnia, quæ sub cælo sunt, réspicit.'
  "25": Qui fecit ventis pondus, et aquas appéndit in mensúra.
  "26": 'Quando ponébat plúviis legem, et viam procéllis sonántibus:'
  "27": tunc vidit illam, et enarrávit, et præparávit, et investigávit.
  "28": 'Et dixit hómini: Ecce timor Dómini, ipsa est sapiéntia: et recédere a malo, intelligéntia.'
