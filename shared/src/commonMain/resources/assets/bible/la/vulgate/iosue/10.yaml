bible: vulgate
lang: la
language: Latina
book: Iosue
chapter: "10"
verses:
  "1": Quæ cum audísset Adonísedec rex Ierúsalem, quod scílicet cepísset Iósue Hai, et subvertísset eam (sicut enim fécerat Iéricho et regi eius, sic fecit Hai et regi illíus), et quod transfugíssent Gabaonítæ ad Israel, et essent fœderáti eórum,
  "2": tímuit valde. Urbs enim magna erat Gábaon, et una civitátum regálium, et maior óppido Hai, omnésque bellatóres eius fortíssimi.
  "3": 'Misit ergo Adonísedec rex Ierúsalem ad Oham regem Hebron, et ad Pharam regem Iérimoth, ad Iáphia quoque regem Lachis, et ad Dabir regem Eglon, dicens:'
  "4": Ad me ascéndite, et ferte præsídium, ut expugnémus Gábaon, quare transfúgerit ad Iósue, et ad fílios Israel.
  "5": 'Congregáti ígitur ascendérunt quinque reges Amorrhæórum: rex Ierúsalem, rex Hebron, rex Iérimoth, rex Lachis, rex Eglon, simul cum exercítibus suis: et castrametáti sunt circa Gábaon, oppugnántes eam.'
  "6": 'Habitatóres autem Gábaon urbis obséssæ misérunt ad Iósue, qui tunc morabátur in castris apud Gálgalam, et dixérunt ei: Ne rétrahas manus tuas ab auxílio servórum tuórum: ascénde cito, et líbera nos, ferque præsídium: convenérunt enim advérsum nos omnes reges Amorrhæórum, qui hábitant in montánis.'
  "7": Ascendítque Iósue de Gálgalis, et omnis exércitus bellatórum cum eo, viri fortíssimi.
  "8": 'Dixítque Dóminus ad Iósue: Ne tímeas eos: in manus enim tuas trádidi illos: nullus ex eis tibi resístere póterit.'
  "9": Irruit ítaque Iósue super eos repénte, tota nocte ascéndens de Gálgalis.
  "10": 'Et conturbávit eos Dóminus a fácie Israel: contrivítque plaga magna in Gábaon, ac persecútus est eos per viam ascénsus Béthoron, et percússit usque Azéca et Macéda.'
  "11": 'Cumque fúgerent fílios Israel, et essent in descénsu Béthoron, Dóminus misit super eos lápides magnos de cælo usque ad Azéca: et mórtui sunt multo plures lapídibus grándinis, quam quos gládio percússerant fílii Israel.'
  "12": 'Tunc locútus est Iósue Dómino in die, qua trádidit Amorrhǽum in conspéctu filiórum Israel, dixítque coram eis: Sol contra Gábaon ne moveáris, et luna contra vallem Aialon.'
  "13": Steterúntque sol et luna, donec ulciscerétur se gens de inimícis suis. Nonne scriptum est hoc in libro iustórum? Stetit ítaque sol in médio cæli, et non festinávit occúmbere spátio uníus diéi.
  "14": Non fuit ántea nec póstea tam longa dies, obediénte Dómino voci hóminis, et pugnánte pro Israel.
  "15": Reversúsque est Iósue cum omni Israel in castra Gálgalæ.
  "16": Fúgerant enim quinque reges et se abscónderant in spelúnca urbis Macéda.
  "17": Nuntiatúmque est Iósue quod invénti essent quinque reges laténtes in spelúnca urbis Macéda.
  "18": 'Qui præcépit sóciis, et ait: Vólvite saxa ingéntia ad os spelúncæ, et pónite viros indústrios, qui clausos custódiant:'
  "19": 'vos autem nolíte stare, sed persequímini hostes, et extrémos quosque fugiéntium cǽdite: nec dimittátis eos úrbium suárum intráre præsídia, quos trádidit Dóminus Deus in manus vestras.'
  "20": Cæsis ergo adversáriis plaga magna, et usque ad interneciónem pene consúmptis, hi, qui Israel effúgere potuérunt, ingréssi sunt civitátes munítas.
  "21": 'Reversúsque est omnis exércitus ad Iósue in Macéda, ubi tunc erant castra, sani et íntegro número: nullúsque contra fílios Israel mutíre ausus est.'
  "22": 'Præcepítque Iósue, dicens: Aperíte os spelúncæ, et prodúcite ad me quinque reges, qui in ea látitant.'
  "23": 'Fecerúntque minístri ut sibi fúerat imperátum: et eduxérunt ad eum quinque reges de spelúnca, regem Ierúsalem, regem Hebron, regem Iérimoth, regem Lachis, regem Eglon.'
  "24": 'Cumque edúcti essent ad eum, vocávit omnes viros Israel, et ait ad príncipes exércitus qui secum erant: Ite, et pónite pedes super colla regum istórum. Qui cum perrexíssent, et subiectórum colla pédibus calcárent,'
  "25": 'rursum ait ad eos: Nolíte timére, nec paveátis: confortámini, et estóte robústi: sic enim fáciet Dóminus cunctis hóstibus vestris, advérsum quos dimicátis.'
  "26": 'Percussítque Iósue, et interfécit eos, atque suspéndit super quinque stípites: fuerúntque suspénsi usque ad vésperum.'
  "27": Cumque occúmberet sol, præcépit sóciis ut depónerent eos de patíbulis. Qui depósitos proiecérunt in spelúncam, in qua latúerant, et posuérunt super os eius saxa ingéntia, quæ pérmanent usque in præsens.
  "28": 'Eódem quoque die, Macédam cepit Iósue, et percússit eam in ore gládii, regémque illíus interfécit, et omnes habitatóres eius: non dimísit in ea saltem parvas relíquias. Fecítque regi Macéda sicut fécerat regi Iéricho.'
  "29": 'Transívit autem cum omni Israel de Macéda in Lebna, et pugnábat contra eam:'
  "30": 'quam trádidit Dóminus cum rege suo in manus Israel: percusserúntque urbem in ore gládii, et omnes habitatóres eius: non dimisérunt in ea ullas relíquias. Fecerúntque regi Lebna sicut fécerant regi Iéricho.'
  "31": 'De Lebna transívit in Lachis cum omni Israel: et exércitu per gyrum dispósito, oppugnábat eam.'
  "32": Tradidítque Dóminus Lachis in manus Israel, et cepit eam die áltero, atque percússit in ore gládii, omnémque ánimam, quæ fúerat in ea, sicut fécerat Lebna.
  "33": 'Eo témpore ascéndit Horam rex Gazer, ut auxiliarétur Lachis: quem percússit Iósue cum omni pópulo eius usque ad interneciónem.'
  "34": Transivítque de Lachis in Eglon, et circúmdedit,
  "35": 'atque expugnávit eam eádem die: percussítque in ore gládii omnes ánimas, quæ erant in ea, iuxta ómnia quæ fécerat Lachis.'
  "36": 'Ascéndit quoque cum omni Israel de Eglon in Hebron, et pugnávit contra eam:'
  "37": 'cepit eam, et percússit in ore gládii, regem quoque eius, et ómnia óppida regiónis illíus, universásque ánimas, quæ in ea fúerant commorátæ: non relíquit in ea ullas relíquias: sicut fécerat Eglon, sic fecit et Hebron, cuncta quæ in ea réperit consúmens gládio.'
  "38": Inde revérsus in Dabir,
  "39": 'cepit eam atque vastávit: regem quoque eius atque ómnia per circúitum óppida percússit in ore gládii: non dimísit in ea ullas relíquias: sicut fécerat Hebron et Lebna et régibus eárum, sic fecit Dabir et regi illíus.'
  "40": 'Percússit ítaque Iósue omnem terram montánam et meridiánam atque campéstrem, et Asedoth cum régibus suis: non dimísit in ea ullas relíquias, sed omne quod spiráre póterat interfécit, sicut præcéperat ei Dóminus Deus Israel,'
  "41": a Cadesbárne usque Gazam. Omnem terram Gosen usque Gábaon,
  "42": 'universósque reges, et regiónes eórum uno ímpetu cepit atque vastávit: Dóminus enim Deus Israel pugnávit pro eo.'
  "43": Reversúsque est cum omni Israel ad locum castrórum in Gálgala.
