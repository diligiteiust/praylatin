bible: vulgate
lang: la
language: Latina
book: ad Romanos
chapter: "2"
verses:
  "1": 'Propter quod inexcusábilis es o homo omnis, qui iúdicas. In quo enim iúdicas álterum, teípsum condémnas: éadem enim agis quæ iúdicas.'
  "2": Scimus enim quóniam iudícium Dei est secúndum veritátem in eos, qui tália agunt.
  "3": Exístimas autem hoc o homo, qui iúdicas eos, qui tália agunt, et facis ea, quia tu effúgies iudícium Dei?
  "4": An divítias bonitátis eius, et patiéntiæ, et longanimitátis contémnis? ignóras quóniam benígnitas Dei ad pœniténtiam te addúcit?
  "5": Secúndum autem durítiam tuam, et impœ́nitens cor, thesaurízas tibi iram in die iræ, et revelatiónis iusti iudícii Dei,
  "6": 'qui reddet unicuíque secúndum ópera eius:'
  "7": 'iis quidem, qui secúndum patiéntiam boni óperis, glóriam, et honórem, et incorruptiónem quærunt, vitam ætérnam:'
  "8": iis autem, qui sunt ex contentióne, et qui non acquiéscunt veritáti, credunt autem iniquitáti, ira, et indignátio.
  "9": 'Tribulátio, et angústia in omnem ánimam hóminis operántis malum, Iudǽi primum, et Græci:'
  "10": 'glória autem, et honor, et pax omni operánti bonum, Iudǽo primum, et Græco:'
  "11": non enim est accéptio personárum apud Deum.
  "12": 'Quicúmque enim sine lege peccavérunt, sine lege períbunt: et quicúmque in lege peccavérunt, per legem iudicabúntur.'
  "13": Non enim auditóres legis iusti sunt apud Deum, sed factóres legis iustificabúntur.
  "14": 'Cum autem gentes, quæ legem non habent, naturáliter ea, quæ legis sunt, fáciunt, eiúsmodi legem non habéntes, ipsi sibi sunt lex:'
  "15": qui osténdunt opus legis scriptum in córdibus suis, testimónium reddénte illis consciéntia ipsórum, et inter se ínvicem cogitatiónibus accusántibus, aut étiam defendéntibus,
  "16": in die, cum iudicábit Deus occúlta hóminum, secúndum Evangélium meum per Iesum Christum.
  "17": Si autem tu Iudǽus cognomináris, et requiéscis in lege, et gloriáris in Deo,
  "18": et nosti voluntátem eius, et probas utilióra, instrúctus per legem,
  "19": confídis teípsum esse ducem cæcórum, lumen eórum, qui in ténebris sunt,
  "20": eruditórem insipiéntium, magístrum infántium, habéntem formam sciéntiæ, et veritátis in lege.
  "21": 'Qui ergo álium doces, teípsum non doces: qui prǽdicas non furándum, furáris:'
  "22": 'qui dicis non mœchándum, mœcháris: qui abomináris idóla, sacrilégium facis:'
  "23": qui in lege gloriáris, per prævaricatiónem legis Deum inhonóras.
  "24": (Nomen enim Dei per vos blasphemátur inter gentes, sicut scriptum est.)
  "25": 'Circumcísio quidem prodest, si legem obsérves: si autem prævaricátor legis sis, circumcísio tua præpútium facta est.'
  "26": Si ígitur præpútium iustítias legis custódiat, nonne præpútium illíus in circumcisiónem reputábitur?
  "27": Et iudicábit id, quod ex natúra est præpútium, legem consúmmans, te, qui per lítteram, et circumcisiónem prævaricátor legis es?
  "28": 'Non enim qui in manifésto, Iudǽus est: neque quæ in manifésto, in carne, est circumcísio:'
  "29": 'sed qui in abscóndito, Iudǽus est: et circumcísio cordis in spíritu, non líttera: cuius laus non ex homínibus, sed ex Deo est.'
