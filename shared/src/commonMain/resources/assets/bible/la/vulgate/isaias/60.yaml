bible: vulgate
lang: la
language: Latina
book: Isaias
chapter: "60"
verses:
  "1": 'Surge illumináre Ierúsalem: quia venit lumen tuum, et glória Dómini super te orta est.'
  "2": 'Quia ecce ténebræ opérient terram, et calígo pópulos: super te autem oriétur Dóminus, et glória eius in te vidébitur.'
  "3": Et ambulábunt gentes in lúmine tuo, et reges in splendóre ortus tui.
  "4": 'Leva in circúitu óculos tuos, et vide: omnes isti congregáti sunt, venérunt tibi: fílii tui de longe vénient, et fíliæ tuæ de látere surgent.'
  "5": Tunc vidébis, et áfflues, mirábitur et dilatábitur cor tuum, quando convérsa fúerit ad te multitúdo maris, fortitúdo géntium vénerit tibi.
  "6": 'Inundátio camelórum opériet te, dromedárii Mádian et Epha: omnes de Saba vénient, aurum et thus deferéntes, et laudem Dómino annuntiántes.'
  "7": 'Omne pecus Cedar congregábitur tibi, aríetes Nábaioth ministrábunt tibi: offeréntur super placábili altári meo, et domum maiestátis meæ glorificábo.'
  "8": Qui sunt isti, qui ut nubes volant, et quasi colúmbæ ad fenéstras suas?
  "9": 'Me enim ínsulæ exspéctant, et naves maris in princípio, ut addúcam fílios tuos de longe: argéntum eórum, et aurum eórum cum eis, nómini Dómini Dei tui, et sancto Israel, quia glorificávit te.'
  "10": 'Et ædificábunt fílii peregrinórum muros tuos, et reges eórum ministrábunt tibi: in indignatióne enim mea percússi te, et in reconciliatióne mea misértus sum tui.'
  "11": 'Et aperiéntur portæ tuæ iúgiter: die ac nocte non claudéntur, ut afferátur ad te fortitúdo géntium, et reges eárum adducántur.'
  "12": 'Gens enim et regnum, quod non servíerit tibi, períbit: et gentes solitúdine vastabúntur.'
  "13": 'Glória Líbani ad te véniet, ábies et buxus, et pinus simul, ad ornándum locum sanctificatiónis meæ: et locum pedum meórum glorificábo.'
  "14": Et vénient ad te curvi fílii eórum, qui humiliavérunt te, et adorábunt vestígia pedum tuórum omnes, qui detrahébant tibi, et vocábunt te Civitátem Dómini, Sion sancti Israel.
  "15": 'Pro eo quod fuísti derelícta, et ódio hábita, et non erat qui per te transíret, ponam te in supérbiam sæculórum, gáudium in generatiónem et generatiónem:'
  "16": 'et suges lac géntium, et mamílla regum lactáberis: et scies quia ego Dóminus salvans te, et redémptor tuus fortis Iacob.'
  "17": 'Pro ære áfferam aurum, et pro ferro áfferam argéntum, et pro lignis æs, et pro lapídibus ferrum: et ponam visitatiónem tuam pacem, et præpósitos tuos iustítiam.'
  "18": Non audiétur ultra iníquitas in terra tua, vástitas et contrítio in términis tuis, et occupábit salus muros tuos, et portas tuas laudátio.
  "19": 'Non erit tibi ámplius sol ad lucéndum per diem, nec splendor lunæ illuminábit te: sed erit tibi Dóminus in lucem sempitérnam, et Deus tuus in glóriam tuam.'
  "20": 'Non óccidet ultra sol tuus, et luna tua non minuétur: quia erit tibi Dóminus in lucem sempitérnam, et complebúntur dies luctus tui.'
  "21": Pópulus autem tuus omnes iusti, in perpétuum hereditábunt terram, germen plantatiónis meæ, opus manus meæ ad glorificándum.
  "22": 'Mínimus erit in mille, et párvulus in gentem fortíssimam: ego Dóminus in témpore eius súbito fáciam istud.'
