bible: vulgate
lang: la
language: Latina
book: I Machabaeorum
chapter: "9"
verses:
  "1": Intérea, ut audívit Demétrius quia cécidit Nicánor, et exércitus eius in prœ́lio, appósuit Bácchidem, et Alcimum rursum míttere in Iudǽam, et dextrum cornu cum illis.
  "2": 'Et abiérunt viam, quæ ducit in Gálgala, et castra posuérunt in Másaloth, quæ est in Arbéllis: et occupavérunt eam, et peremérunt ánimas hóminum multas.'
  "3": 'In mense primo anni centésimi et quinquagésimi secúndi, applicuérunt exércitum ad Ierúsalem:'
  "4": et surrexérunt, et abiérunt in Béream vigínti míllia virórum, et duo míllia équitum.
  "5": 'Et Iudas posúerat castra in Láisa, et tria míllia viri elécti cum eo:'
  "6": 'et vidérunt multitúdinem exércitus, quia multi sunt, et timuérunt valde: et multi subtraxérunt se de castris, et non remansérunt ex eis nisi octingénti viri.'
  "7": Et vidit Iudas quod deflúxit exércitus suus, et bellum perurgébat eum, et confráctus est corde, quia non habébat tempus congregándi eos, et dissolútus est.
  "8": 'Et dixit his, qui resídui erant: Surgámus, et eámus ad adversários nostros, si potérimus pugnáre advérsus eos.'
  "9": 'Et avertébant eum, dicéntes: Non potérimus, sed liberémus ánimas nostras modo, et revertámur ad fratres nostros, et tunc pugnábimus advérsus eos: nos autem pauci sumus.'
  "10": 'Et ait Iudas: Absit istam rem fácere ut fugiámus ab eis: et si appropiávit tempus nostrum, moriámur in virtúte propter fratres nostros, et non inferámus crimen glóriæ nostræ.'
  "11": 'Et movit exércitus de castris, et stetérunt illis óbviam: et divísi sunt équites in duas partes, et fundibulárii et sagittárii præíbant exércitum, et primi certáminis omnes poténtes.'
  "12": 'Bácchides autem erat in dextro cornu, et proximávit légio ex duábus pártibus, et clamábant tubis:'
  "13": 'exclamavérunt autem et hi, qui erant ex parte Iudæ étiam ipsi, et commóta est terra a voce exercítuum: et commíssum est prœ́lium a mane usque ad vésperam.'
  "14": 'Et vidit Iudas, quod fírmior est pars exércitus Bácchidis in dextris, et convenérunt cum ipso omnes constántes corde:'
  "15": et contríta est déxtera pars ab eis, et persecútus est eos usque ad montem Azóti.
  "16": 'Et qui in sinístro cornu erant, vidérunt quod contrítum est dextrum cornu, et secúti sunt post Iudam, et eos, qui cum ipso erant, a tergo:'
  "17": et ingravátum est prœ́lium, et cecidérunt vulneráti multi ex his, et ex illis.
  "18": Et Iudas cécidit, et céteri fugérunt.
  "19": Et Iónathas, et Simon tulérunt Iudam fratrem suum, et sepeliérunt eum in sepúlcro patrum suórum in civitáte Modin.
  "20": Et flevérunt eum omnis pópulus Israel planctu magno, et lugébant dies multos,
  "21": 'et dixérunt: Quómodo cécidit potens, qui salvum faciébat pópulum Israel!'
  "22": 'Et cétera verba bellórum Iudæ, et virtútum, quas fecit, et magnitúdinis eius, non sunt descrípta: multa enim erant valde.'
  "23": 'Et factum est: post óbitum Iudæ emersérunt iníqui in ómnibus fínibus Israel, et exórti sunt omnes, qui operabántur iniquitátem.'
  "24": In diébus illis facta est fames magna valde, et trádidit se Bácchidi omnis régio eórum cum ipsis.
  "25": 'Et elégit Bácchides viros ímpios, et constítuit eos dóminos regiónis:'
  "26": et exquirébant, et perscrutabántur amícos Iudæ, et adducébant eos ad Bácchidem, et vindicábat in illos, et illudébat.
  "27": Et facta est tribulátio magna in Israel, qualis non fuit ex die, qua non est visus prophéta in Israel.
  "28": 'Et congregáti sunt omnes amíci Iudæ, et dixérunt Iónathæ:'
  "29": Ex quo frater tuus Iudas defúnctus est, vir símilis ei non est, qui éxeat contra inimícos nostros, Bácchidem, et eos, qui inimíci sunt gentis nostræ.
  "30": Nunc ítaque, te hódie elégimus esse pro eo nobis in príncipem, et ducem ad bellándum bellum nostrum.
  "31": Et suscépit Iónathas témpore illo principátum, et surréxit loco Iudæ fratris sui.
  "32": Et cognóvit Bácchides, et quærébat eum occídere.
  "33": 'Et cognóvit Iónathas, et Simon frater eius, et omnes, qui cum eo erant: et fugérunt in desértum Thécuæ, et consedérunt ad aquam lacus Asphar.'
  "34": Et cognóvit Bácchides, et die sabbatórum venit ipse, et omnis exércitus eius trans Iordánem.
  "35": Et Iónathas misit fratrem suum ducem pópuli, et rogávit Nabuthǽos amícos suos, ut commodárent illis apparátum suum, qui erat copiósus.
  "36": Et exiérunt fílii Iambri ex Mádaba, et comprehendérunt Ioánnem, et ómnia, quæ habébat, et abiérunt habéntes ea.
  "37": Post hæc verba, renuntiátum est Iónathæ, et Simóni fratri eius, quia fílii Iambri fáciunt núptias magnas, et ducunt sponsam ex Mádaba fíliam uníus de magnis princípibus Chánaan cum ambitióne magna.
  "38": 'Et recordáti sunt sánguinis Ioánnis fratris sui: et ascendérunt, et abscondérunt se sub teguménto montis.'
  "39": 'Et elevavérunt óculos suos, et vidérunt: et ecce tumúltus, et apparátus multus: et sponsus procéssit, et amíci eius, et fratres eius óbviam illis cum týmpanis, et músicis, et armis multis.'
  "40": 'Et surrexérunt ad eos ex insídiis, et occidérunt eos, et cecidérunt vulneráti multi, et resídui fugérunt in montes: et accepérunt ómnia spólia eórum:'
  "41": et convérsæ sunt núptiæ in luctum, et vox musicórum ipsórum in laméntum.
  "42": 'Et vindicavérunt vindíctam sánguinis fratris sui: et revérsi sunt ad ripam Iordánis.'
  "43": Et audívit Bácchides, et venit die sabbatórum usque ad oram Iordánis in virtúte magna.
  "44": 'Et dixit ad suos Iónathas: Surgámus, et pugnémus contra inimícos nostros: non est enim hódie sicut heri, et nudiustértius:'
  "45": 'ecce enim bellum ex advérso, aqua vero Iordánis hinc et inde, et ripæ, et palúdes, et saltus: et non est locus diverténdi.'
  "46": Nunc ergo, clamáte in cælum, ut liberémini de manu inimicórum vestrórum. Et commíssum est bellum.
  "47": 'Et exténdit Iónathas manum suam percútere Bácchidem, et divértit ab eo retro:'
  "48": et desíliit Iónathas, et qui cum eo erant, in Iordánem, et transnatavérunt ad eos Iordánem.
  "49": 'Et cecidérunt de parte Bácchidis die illa mille viri: et revérsi sunt in Ierúsalem,'
  "50": et ædificavérunt civitátes munítas in Iudǽa, munitiónem, quæ erat in Iéricho, et in Ammaum, et in Béthoron, et in Bethel, et Thámnata, et Phara, et Thopo muris excélsis, et portis, et seris.
  "51": 'Et pósuit custódiam in eis, ut inimicítias exercérent in Israel:'
  "52": 'et munívit civitátem Bethsúram, et Gázaram, et arcem, et pósuit in eis auxília, et apparátum escárum:'
  "53": et accépit fílios príncipum regiónis óbsides, et pósuit eos in arce in Ierúsalem in custódiam.
  "54": 'Et anno centésimo quinquagésimo tértio, mense secúndo, præcépit Alcimus déstrui muros domus sanctæ interióris, et déstrui ópera prophetárum: et cœpit destrúere.'
  "55": 'In témpore illo percússus est Alcimus: et impedíta sunt ópera illíus, et occlúsum est os eius, et dissolútus est parálysi, nec ultra pótuit loqui verbum, et mandáre de domo sua.'
  "56": Et mórtuus est Alcimus in témpore illo cum torménto magno.
  "57": 'Et vidit Bácchides quóniam mórtuus est Alcimus: et revérsus est ad regem, et síluit terra annis duóbus.'
  "58": 'Et cogitavérunt omnes iníqui, dicéntes: Ecce Iónathas, et qui cum eo sunt, in siléntio hábitant confidénter: nunc ergo adducámus Bácchidem, et comprehéndet eos omnes una nocte.'
  "59": Et abiérunt, et consílium ei dedérunt.
  "60": 'Et surréxit ut veníret cum exércitu multo: et misit occúlte epístolas sóciis suis, qui erant in Iudǽa, ut comprehénderent Iónathan, et eos, qui cum eo erant: sed non potuérunt, quia innótuit eis consílium eórum.'
  "61": 'Et apprehéndit de viris regiónis, qui príncipes erant malítiæ, quinquagínta viros, et occídit eos:'
  "62": 'et secéssit Iónathas, et Simon, et qui cum eo erant, in Bethbéssen, quæ est in desérto: et exstrúxit díruta eius, et firmavérunt eam.'
  "63": 'Et cognóvit Bácchides, et congregávit univérsam multitúdinem suam: et his, qui de Iudǽa erant, denuntiávit.'
  "64": 'Et venit, et castra pósuit désuper Bethbéssen: et oppugnávit eam dies multos, et fecit máchinas.'
  "65": Et relíquit Iónathas Simónem fratrem suum in civitáte, et éxiit in regiónem, et venit cum número,
  "66": 'et percússit Odaren, et fratres eius, et fílios Pháseron in tabernáculis ipsórum: et cœpit cǽdere, et créscere in virtútibus.'
  "67": Simon vero, et qui cum ipso erant, exiérunt de civitáte, et succendérunt máchinas,
  "68": 'et pugnavérunt contra Bácchidem, et contrítus est ab eis: et afflixérunt eum valde, quóniam consílium eius, et congréssus eius erat inánis.'
  "69": 'Et irátus contra viros iníquos, qui ei consílium déderant ut veníret in regiónem ipsórum, multos ex eis occídit: ipse autem cogitávit cum réliquis abíre in regiónem suam.'
  "70": 'Et cognóvit Iónathas: et misit ad eum legátos compónere pacem cum ipso, et réddere ei captivitátem.'
  "71": Et libénter accépit, et fecit secúndum verba eius, et iurávit se nihil factúrum ei mali ómnibus diébus vitæ eius.
  "72": 'Et réddidit ei captivitátem, quam prius erat prædátus de terra Iuda: et convérsus ábiit in terram suam, et non appósuit ámplius veníre in fines eius.'
  "73": 'Et cessávit gládius ex Israel: et habitávit Iónathas in Machmas, et cœpit Iónathas ibi iudicáre pópulum, et exterminávit ímpios ex Israel.'
