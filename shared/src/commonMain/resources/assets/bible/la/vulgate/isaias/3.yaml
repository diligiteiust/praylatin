bible: vulgate
lang: la
language: Latina
book: Isaias
chapter: "3"
verses:
  "1": 'Ecce enim dominátor Dóminus exercítuum áuferet a Ierúsalem et a Iuda válidum et fortem, omne robur panis, et omne robur aquæ:'
  "2": 'fortem, et virum bellatórem, iúdicem, et prophétam, et aríolum, et senem:'
  "3": príncipem super quinquagínta, et honorábilem vultu et consiliárium, et sapiéntem de architéctis, et prudéntem elóquii mýstici.
  "4": Et dabo púeros príncipes eórum, et effemináti dominabúntur eis.
  "5": 'Et írruet pópulus, vir ad virum, et unusquísque ad próximum suum: tumultuábitur puer contra senem, et ignóbilis contra nóbilem.'
  "6": 'Apprehéndet enim vir fratrem suum, domésticum patris sui: Vestiméntum tibi est, princeps esto noster, ruína autem hæc sub manu tua.'
  "7": 'Respondébit in die illa, dicens: Non sum médicus, et in domo mea non est panis neque vestiméntum: nolíte constitúere me príncipem pópuli.'
  "8": Ruit enim Ierúsalem, et Iudas cóncidit, quia lingua eórum et adinventiónes eórum contra Dóminum, ut provocárent óculos maiestátis eius.
  "9": 'Agnítio vultus eórum respóndit eis: et peccátum suum quasi Sódoma prædicavérunt, nec abscondérunt. Væ ánimæ eórum, quóniam réddita sunt eis mala.'
  "10": Dícite iusto quóniam bene, quóniam fructum adinventiónum suárum cómedet.
  "11": 'Væ ímpio in malum: retribútio enim mánuum eius fiet ei.'
  "12": Pópulum meum exactóres sui spoliavérunt, et mulíeres dominátæ sunt eis. Pópule meus, qui te beátum dicunt, ipsi te decípiunt, et viam gréssuum tuórum díssipant.
  "13": Stat ad iudicándum Dóminus, et stat ad iudicándos pópulos.
  "14": 'Dóminus ad iudícium véniet cum sénibus pópuli sui, et princípibus eius: vos enim depásti estis víneam, et rapína páuperis in domo vestra.'
  "15": Quare attéritis pópulum meum, et fácies páuperum commólitis? dicit Dóminus Deus exercítuum.
  "16": 'Et dixit Dóminus: Pro eo quod elevátæ sunt fíliæ Sion, et ambulavérunt exténto collo, et nútibus oculórum ibant, et plaudébant, ambulábant pédibus suis, et compósito gradu incedébant:'
  "17": decalvábit Dóminus vérticem filiárum Sion, et Dóminus crinem eárum nudábit.
  "18": In die illa áuferet Dóminus ornaméntum calceamentórum,
  "19": et lúnulas, et torques, et monília, et armíllas, et mitras,
  "20": et discriminália, et periscélidas, et murénulas, et olfactoríola, et ináures,
  "21": et ánnulos, et gemmas in fronte pendéntes,
  "22": et mutatória, et pallíola, et linteámina, et acus,
  "23": et spécula, et síndones, et vittas, et therístra.
  "24": Et erit pro suávi odóre fœtor, et pro zona funículus, et pro crispánti crine calvítium, et pro fáscia pectoráli cilícium.
  "25": Pulchérrimi quoque viri tui gládio cadent, et fortes tui in prœ́lio.
  "26": Et mœrébunt atque lugébunt portæ eius, et desoláta in terra sedébit.
