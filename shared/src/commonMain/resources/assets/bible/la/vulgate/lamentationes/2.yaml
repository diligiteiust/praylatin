bible: vulgate
lang: la
language: Latina
book: Lamentationes
chapter: "2"
verses:
  "1": 'Aleph. Quómodo obtéxit calígine in furóre suo Dóminus fíliam Sion: proiécit de cælo in terram ínclytam Israel, et non est recordátus scabélli pedum suórum in die furóris sui.'
  "2": 'Beth. Præcipitávit Dóminus, nec pepércit, ómnia speciósa Iacob: destrúxit in furóre suo munitiónes vírginis Iuda, et deiécit in terram: pólluit regnum, et príncipes eius.'
  "3": 'Ghimel. Confrégit in ira furóris sui omne cornu Israel: avértit retrórsum déxteram suam a fácie inimíci: et succéndit in Iacob quasi ignem flammæ devorántis in gyro.'
  "4": 'Daleth. Teténdit arcum suum quasi inimícus, firmávit déxteram suam quasi hostis: et occídit omne, quod pulchrum erat visu in tabernáculo fíliæ Sion, effúdit quasi ignem indignatiónem suam.'
  "5": 'He. Factus est Dóminus velut inimícus: præcipitávit Israel, præcipitávit ómnia mœ́nia eius: dissipávit munitiónes eius, et replévit in fília Iuda humiliátum et humiliátam.'
  "6": 'Vau. Et dissipávit quasi hortum tentórium suum, demolítus est tabernáculum suum: oblivióni trádidit Dóminus in Sion festivitátem, et sábbatum: et in oppróbrium, et in indignatiónem furóris sui, regem et sacerdótem.'
  "7": 'Zain. Répulit Dóminus altáre suum, maledíxit sanctificatióni suæ: trádidit in manu inimíci muros túrrium eius: vocem dedérunt in domo Dómini sicut in die solémni.'
  "8": 'Heth. Cogitávit Dóminus dissipáre murum fíliæ Sion: teténdit funículum suum, et non avértit manum suam a perditióne: luxítque antemurále, et murus páriter dissipátus est.'
  "9": 'Teth. Defíxæ sunt in terra portæ eius, pérdidit et contrívit vectes eius: regem eius et príncipes eius in géntibus: non est lex, et prophétæ eius non invenérunt visiónem a Dómino.'
  "10": 'Iod. Sedérunt in terra, conticuérunt senes fíliæ Sion: conspersérunt cínere cápita sua, accíncti sunt cilíciis: abiecérunt in terram cápita sua vírgines Ierúsalem.'
  "11": 'Caph. Defecérunt præ lácrymis óculi mei, conturbáta sunt víscera mea: effúsum est in terra iecur meum super contritióne fíliæ pópuli mei, cum defíceret párvulus, et lactens in platéis óppidi.'
  "12": 'Lamed. Mátribus suis dixérunt: Ubi est tríticum et vinum? cum defícerent quasi vulneráti in platéis civitátis: cum exhalárent ánimas suas in sinu matrum suárum.'
  "13": 'Mem. Cui comparábo te? vel cui assimilábo te fília Ierúsalem? cui exæquábo te, et consolábor te virgo fília Sion? magna est enim velut mare contrítio tua: quis medébitur tui?'
  "14": 'Nun. Prophétæ tui vidérunt tibi falsa, et stulta, nec aperiébant iniquitátem tuam, ut te ad pœniténtiam provocárent: vidérunt autem tibi assumptiónes falsas, et eiectiónes.'
  "15": 'Samech. Plausérunt super te mánibus omnes transeúntes per viam: sibilavérunt, et movérunt caput suum super fíliam Ierúsalem: Hǽccine est urbs, dicéntes, perfécti decóris, gáudium univérsæ terræ?'
  "16": 'Phe. Aperuérunt super te os suum omnes inimíci tui: sibilavérunt, et fremuérunt déntibus, et dixérunt: Devorábimus: en ista est dies, quam exspectabámus: invénimus, vídimus.'
  "17": 'Ain. Fecit Dóminus quæ cogitávit, complévit sermónem suum, quem præcéperat a diébus antíquis: destrúxit, et non pepércit, et lætificávit super te inimícum, et exaltávit cornu hóstium tuórum.'
  "18": 'Sade. Clamávit cor eórum ad Dóminum super muros fíliæ Sion: Deduc quasi torréntem lácrymas per diem, et noctem: non des réquiem tibi, neque táceat pupílla óculi tui.'
  "19": 'Coph. Consúrge, lauda in nocte in princípio vigiliárum: effúnde sicut aquam cor tuum ante conspéctum Dómini: leva ad eum manus tuas pro ánima parvulórum tuórum, qui defecérunt in fame in cápite ómnium compitórum.'
  "20": 'Res. Vide Dómine, et consídera quem vindemiáveris ita: ergóne cómedent mulíeres fructum suum, párvulos ad mensúram palmæ? si occíditur in sanctuário Dómini sacérdos, et prophéta?'
  "21": 'Sin. Iacuérunt in terra foris puer, et senex: vírgines meæ, et iúvenes mei cecidérunt in gládio: interfecísti in die furóris tui: percussísti, nec misértus es.'
  "22": 'Thau. Vocásti quasi ad diem solémnem, qui terrérent me de circúitu: et non fuit in die furóris Dómini qui effúgeret, et relinquerétur: quos educávi et enutrívi, inimícus meus consúmpsit eos.'
