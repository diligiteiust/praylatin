bible: vulgate
lang: la
language: Latina
book: II Samuelis
chapter: "6"
verses:
  "1": Congregávit autem rursum David omnes eléctos ex Israel, trigínta míllia.
  "2": Surrexítque David, et ábiit, et univérsus pópulus, qui erat cum eo de viris Iuda, ut addúcerent arcam Dei, super quam invocátum est nomen Dómini exercítuum, sedéntis in chérubim super eam.
  "3": 'Et imposuérunt arcam Dei super plaustrum novum: tulerúntque eam de domo Abínadab, qui erat in Gábaa: Oza autem et Ahio, fílii Abínadab, minábant plaustrum novum.'
  "4": Cumque tulíssent eam de domo Abínadab, qui erat in Gábaa, custódiens arcam Dei, Ahio præcedébat arcam.
  "5": David autem, et omnis Israel ludébant coram Dómino in ómnibus lignis fabrefáctis, et cítharis et lyris et týmpanis et sistris et cýmbalis.
  "6": 'Postquam autem venérunt ad áream Nachon, exténdit Oza manum ad arcam Dei, et ténuit eam: quóniam calcitrábant boves, et declinavérunt eam.'
  "7": 'Iratúsque est indignatióne Dóminus contra Ozam, et percússit eum super temeritáte: qui mórtuus est ibi iuxta arcam Dei.'
  "8": Contristátus est autem David, eo quod percussísset Dóminus Ozam, et vocátum est nomen loci illíus, Percússio Ozæ, usque in diem hanc.
  "9": 'Et extímuit David Dóminum in die illa, dicens: Quómodo ingrediétur ad me arca Dómini?'
  "10": 'Et nóluit divértere ad se arcam Dómini in civitátem David: sed divértit eam in domum Obédedom Gethǽi.'
  "11": 'Et habitávit arca Dómini in domo Obédedom Gethǽi tribus ménsibus: et benedíxit Dóminus Obédedom, et omnem domum eius.'
  "12": 'Nuntiatúmque est regi David quod benedixísset Dóminus Obédedom, et ómnia eius, propter arcam Dei. Abiit ergo David, et addúxit arcam Dei de domo Obédedom in civitátem David cum gáudio: et erant cum David septem chori, et víctima vítuli.'
  "13": Cumque transcendíssent qui portábant arcam Dómini sex passus, immolábat bovem et aríetem,
  "14": 'et David saltábat totis víribus ante Dóminum: porro David erat accínctus ephod líneo.'
  "15": Et David, et omnis domus Israel ducébant arcam testaménti Dómini in iúbilo, et in clangóre búccinæ.
  "16": 'Cumque intrásset arca Dómini in civitátem David, Michol fília Saul, prospíciens per fenéstram, vidit regem David subsiliéntem, atque saltántem coram Dómino: et despéxit eum in corde suo.'
  "17": 'Et introduxérunt arcam Dómini, et imposuérunt eam in loco suo in médio tabernáculi, quod teténderat ei David: et óbtulit David holocáusta, et pacífica coram Dómino.'
  "18": Cumque complésset ófferens holocáusta et pacífica, benedíxit pópulo in nómine Dómini exercítuum.
  "19": 'Et partítus est univérsæ multitúdini Israel tam viro quam mulíeri síngulis collýridam panis unam, et assatúram búbulæ carnis unam, et símilam frixam óleo: et ábiit omnis pópulus, unusquísque in domum suam.'
  "20": 'Reversúsque est David ut benedíceret dómui suæ: et egréssa Michol fília Saul in occúrsum David, ait: Quam gloriósus fuit hódie rex Israel discoopériens se ante ancíllas servórum suórum, et nudátus est, quasi si nudétur unus de scurris.'
  "21": 'Dixítque David ad Michol: Ante Dóminum, qui elégit me pótius quam patrem tuum, et quam omnem domum eius, et præcépit mihi ut essem dux super pópulum Dómini in Israel,'
  "22": 'et ludam, et vílior fiam plus quam factus sum: et ero húmilis in óculis meis, et cum ancíllis de quibus locúta es, gloriósior apparébo.'
  "23": Igitur Michol fíliæ Saul non est natus fílius usque in diem mortis suæ.
