bible: vulgate
lang: la
language: Latina
book: I Paralipomenon
chapter: "10"
verses:
  "1": Philísthiim autem pugnábant contra Israel, fugerúntque viri Israel Palæsthínos, et cecidérunt vulneráti in monte Gélboe.
  "2": Cumque appropinquássent Philisthǽi, persequéntes Saul, et fílios eius, percussérunt Iónathan, et Abínadab, et Melchísua fílios Saul.
  "3": Et aggravátum est prœ́lium contra Saul, invenerúntque eum sagittárii, et vulneravérunt iáculis.
  "4": 'Et dixit Saul ad armígerum suum: Evagína gládium tuum, et intérfice me, ne forte véniant incircumcísi isti, et illúdant mihi. Nóluit autem ármiger eius hoc fácere, timóre pertérritus: arrípuit ergo Saul ensem, et írruit in eum.'
  "5": Quod cum vidísset ármiger eius, vidélicet mórtuum esse Saul, írruit étiam ipse in gládium suum, et mórtuus est.
  "6": 'Intériit ergo Saul: et tres fílii eius, et omnis domus illíus páriter cóncidit.'
  "7": 'Quod cum vidíssent viri Israel qui habitábant in campéstribus, fugérunt: et Saul ac fíliis eius mórtuis, dereliquérunt urbes suas, et huc illúcque dispérsi sunt: venerúntque Philísthiim, et habitavérunt in eis.'
  "8": Die ígitur áltero detrahéntes Philísthiim spólia cæsórum, invenérunt Saul, et fílios eius iacéntes in monte Gélboe.
  "9": 'Cumque spoliássent eum, et amputássent caput, armísque nudássent, misérunt in terram suam, ut circumferrétur, et ostenderétur idolórum templis, et pópulis:'
  "10": arma autem eius consecravérunt in fano dei sui, et caput affixérunt in templo Dagon.
  "11": Hoc cum audíssent viri Iabes Gálaad, ómnia scílicet quæ Philísthiim fécerant super Saul,
  "12": 'consurrexérunt sínguli virórum fórtium, et tulérunt cadávera Saul et filiórum eius: attulerúntque ea in Iabes, et sepeliérunt ossa eórum subter quercum, quæ erat in Iabes, et ieiunavérunt septem diébus.'
  "13": 'Mórtuus est ergo Saul propter iniquitátes suas, eo quod prævaricátus sit mandátum Dómini quod præcéperat, et non custodíerit illud: sed ínsuper étiam pythoníssam consulúerit,'
  "14": 'nec speráverit in Dómino: propter quod interfécit eum, et tránstulit regnum eius ad David fílium Isai.'
