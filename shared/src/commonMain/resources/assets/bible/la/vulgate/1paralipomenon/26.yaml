bible: vulgate
lang: la
language: Latina
book: I Paralipomenon
chapter: "26"
verses:
  "1": 'Divisiónes autem ianitórum: de Corítis Meselemía, fílius Core, de fíliis Asaph.'
  "2": 'Fílii Meselemíæ: Zacharías primogénitus, Iádihel secúndus, Zabadías tértius, Iathánael quartus,'
  "3": Ælam quintus, Ióhanan sextus, Elioénai séptimus.
  "4": 'Fílii autem Obédedom: Semeías primogénitus, Iózabad secúndus, Ióaha tértius, Sachar quartus, Nathánael quintus,'
  "5": 'Ammiel sextus, Issachar séptimus, Phóllathi octávus: quia benedíxit illi Dóminus.'
  "6": 'Sémei autem fílio eius nati sunt fílii, præfécti familiárum suárum: erant enim viri fortíssimi.'
  "7": 'Fílii ergo Semeíæ: Othni, et Ráphael, et Obed, Elzabad, fratres eius viri fortíssimi: Eliu quoque et Samachías.'
  "8": 'Omnes hi, de fíliis Obédedom: ipsi, et fílii, et fratres eórum, fortíssimi ad ministrándum, sexagínta duo de Obédedom.'
  "9": Porro Meselemíæ fílii, et fratres eórum robustíssimi, decem et octo.
  "10": 'De Hosa autem, id est, de fíliis Merári: Semri princeps (non enim habúerat primogénitum, et idcírco posúerat eum pater eius in príncipem),'
  "11": 'Helcías secúndus, Tabelías tértius, Zacharías quartus: omnes hi fílii, et fratres Hosa, trédecim.'
  "12": Hi divísi sunt in ianitóres, ut semper príncipes custodiárum, sicut et fratres eórum ministrárent in domo Dómini.
  "13": Missæ sunt ergo sortes ex æquo, et parvis, et magnis, per famílias suas in unamquámque portárum.
  "14": Cécidit ergo sors orientális, Selemíæ. Porro Zacharíæ fílio eius, viro prudentíssimo, et erudíto, sortíto óbtigit plaga septentrionális.
  "15": 'Obédedom vero et fíliis eius ad austrum: in qua parte domus erat seniórum concílium.'
  "16": 'Sephim et Hosa ad occidéntem, iuxta portam, quæ ducit ad viam ascensiónis: custódia contra custódiam.'
  "17": 'Ad oriéntem vero Levítæ sex: et ad aquilónem, quátuor per diem: atque ad merídiem simíliter in die quátuor: et ubi erat concílium bini et bini.'
  "18": In céllulis quoque ianitórum ad occidéntem quátuor in via, biníque per céllulas.
  "19": Hæ sunt divisiónes ianitórum filiórum Core et Merári.
  "20": Porro Achías erat super thesáuros domus Dei, et vasa sanctórum.
  "21": 'Fílii Ledan, fílii Gersónni: de Ledan príncipes familiárum Ledan, et Gersónni, Iehiéli.'
  "22": 'Fílii Iehiéli: Zathan, et Ioel fratres eius super thesáuros domus Dómini.'
  "23": Amramítis, et Isaarítis, et Hebronítis, et Ozihelítis.
  "24": Súbael autem fílius Gersom fílii Móysi, præpósitus thesáuris.
  "25": Fratres quoque eius Eliézer, cuius fílius Rahabía, et huius fílius Isaías, et huius fílius Ioram, huius quoque fílius Zechri, et huius fílius Sélemith.
  "26": Ipse Sélemith, et fratres eius, super thesáuros sanctórum, quæ sanctificávit David rex, et príncipes familiárum, et tribúni, et centuriónes, et duces exércitus,
  "27": de bellis, et manúbiis prœliórum, quæ consecráverant ad instauratiónem, et supelléctilem templi Dómini.
  "28": 'Hæc autem univérsa sanctificávit Sámuel videns, et Saul fílius Cis, et Abner fílius Ner, et Ioab fílius Sárviæ: omnes, qui sanctificáverant ea per manum Sélemith et fratrum eius.'
  "29": Isaarítis vero prǽerat Chonenías, et fílii eius ad ópera forínsecus super Israel ad docéndum et iudicándum eos.
  "30": Porro de Hebronítis Hasabías, et fratres eius viri fortíssimi, mille septingénti prǽerant Israéli trans Iordánem contra occidéntem, in cunctis opéribus Dómini, et in ministérium regis.
  "31": Hebronitárum autem princeps fuit Iería secúndum famílias et cognatiónes eórum. Quadragésimo anno regni David recensíti sunt, et invénti sunt viri fortíssimi in Iazer Gálaad,
  "32": fratrésque eius robustióris ætátis, duo míllia septingénti príncipes familiárum. Præpósuit autem eos David rex Rubenítis, et Gaddítis, et dimídiæ tríbui Manásse, in omne ministérium Dei et regis.
