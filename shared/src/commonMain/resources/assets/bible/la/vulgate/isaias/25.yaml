bible: vulgate
lang: la
language: Latina
book: Isaias
chapter: "25"
verses:
  "1": 'Dómine Deus meus es tu, exaltábo te, et confitébor nómini tuo: quóniam fecísti mirabília, cogitatiónes antíquas fidéles, amen.'
  "2": 'Quia posuísti civitátem in túmulum, urbem fortem in ruínam, domum alienórum: ut non sit cívitas, et in sempitérnum non ædificétur.'
  "3": Super hoc laudábit te pópulus fortis, cívitas géntium robustárum timébit te.
  "4": 'Quia factus es fortitúdo páuperi, fortitúdo egéno in tribulatióne sua: spes a túrbine, umbráculum ab æstu: spíritus enim robustórum quasi turbo impéllens paríetem.'
  "5": 'Sicut æstus in siti, tumúltum alienórum humiliábis: et quasi calóre sub nube torrénte propáginem fórtium marcéscere fácies.'
  "6": Et fáciet Dóminus exercítuum ómnibus pópulis in monte hoc convívium pínguium, convívium vindémiæ, pínguium medullatórum, vindémiæ defæcátæ.
  "7": Et præcipitábit in monte isto fáciem vínculi colligáti super omnes pópulos, et telam quam ordítus est super omnes natiónes.
  "8": 'Præcipitábit mortem in sempitérnum: et áuferet Dóminus Deus lácrymam ab omni fácie, et oppróbrium pópuli sui áuferet de univérsa terra: quia Dóminus locútus est.'
  "9": 'Et dicet in die illa: Ecce Deus noster iste, exspectávimus eum, et salvábit nos: iste Dóminus, sustinúimus eum, exsultábimus, et lætábimur in salutári eius.'
  "10": 'Quia requiéscet manus Dómini in monte isto: et triturábitur Moab sub eo, sícuti terúntur páleæ in plaustro.'
  "11": 'Et exténdet manus suas sub eo, sicut exténdit natans ad natándum: et humiliábit glóriam eius cum allisióne mánuum eius.'
  "12": Et muniménta sublímium murórum tuórum cóncident, et humiliabúntur, et detrahéntur in terram usque ad púlverem.
