bible: vulgate
lang: la
language: Latina
book: ad Corinthios I
chapter: "14"
verses:
  "1": 'Sectámini caritátem, æmulámini spirituália: magis autem ut prophetétis.'
  "2": 'Qui enim lóquitur lingua, non homínibus lóquitur, sed Deo: nemo enim audit. Spíritu autem lóquitur mystéria.'
  "3": Nam qui prophétat, homínibus lóquitur ad ædificatiónem, et exhortatiónem, et consolatiónem.
  "4": 'Qui lóquitur lingua, semetípsum ædíficat: qui autem prophétat, ecclésiam Dei ædíficat.'
  "5": 'Volo autem omnes vos loqui linguis: magis autem prophetáre. Nam maior est qui prophétat, quam qui lóquitur linguis: nisi forte interpretétur, ut ecclésia ædificatiónem accípiat.'
  "6": 'Nunc autem, fratres, si vénero ad vos linguis loquens: quid vobis pródero, nisi vobis loquar aut in revelatióne, aut in sciéntia, aut in prophetía, aut in doctrína?'
  "7": 'Tamen quæ sine ánima sunt vocem dántia, sive tíbia, sive cíthara: nisi distinctiónem sonítuum déderint, quómodo sciétur id, quod cánitur, aut quod citharizátur?'
  "8": Etenim si incértam vocem det tuba, quis parábit se ad bellum?
  "9": 'Ita et vos per linguam nisi maniféstum sermónem dedéritis: quómodo sciétur id, quod dícitur? éritis enim in áera loquéntes.'
  "10": 'Tam multa, ut puta génera linguárum sunt in hoc mundo: et nihil sine voce est.'
  "11": 'Si ergo nescíero virtútem vocis, ero ei, cui loquor, bárbarus: et qui lóquitur, mihi bárbarus.'
  "12": Sic et vos, quóniam æmulatóres estis spirítuum, ad ædificatiónem ecclésiæ quǽrite ut abundétis.
  "13": Et ídeo qui lóquitur lingua, oret ut interpretétur.
  "14": Nam si orem lingua, spíritus meus orat, mens autem mea sine fructu est.
  "15": 'Quid ergo est? Orábo spíritu, orábo et mente: psallam spíritu, psallam et mente.'
  "16": 'Céterum si benedíxeris spíritu, qui supplet locum idiótæ, quómodo dicet: Amen, super tuam benedictiónem? quóniam quid dicas, nescit.'
  "17": Nam tu quidem bene grátias agis, sed alter non ædificátur.
  "18": Grátias ago Deo meo, quod ómnium vestrum lingua loquor.
  "19": 'Sed in ecclésia volo quinque verba sensu meo loqui, ut et álios ínstruam: quam decem míllia verbórum in lingua.'
  "20": 'Fratres, nolíte púeri éffici sénsibus, sed malítia párvuli estóte: sénsibus autem perfécti estóte.'
  "21": 'In lege scriptum est: Quóniam in áliis linguis et lábiis áliis loquar pópulo huic: et nec sic exáudient me, dicit Dóminus.'
  "22": 'Itaque linguæ in signum sunt non fidélibus, sed infidélibus: prophetíæ autem non infidélibus, sed fidélibus.'
  "23": 'Si ergo convéniat univérsa ecclésia in unum, et omnes linguis loquántur, intrent autem idiótæ, aut infidéles: nonne dicent quod insanítis?'
  "24": 'Si autem omnes prophétent, intret autem quis infidélis, vel idióta, convíncitur ab ómnibus, diiudicátur ab ómnibus:'
  "25": 'occúlta cordis eius manifésta fiunt: et ita cadens in fáciem adorábit Deum, pronúntians quod vere Deus in vobis sit.'
  "26": 'Quid ergo est, fratres? Cum convenítis, unusquísque vestrum psalmum habet, doctrínam habet, apocalýpsim habet, linguam habet, interpretatiónem habet: ómnia ad ædificatiónem fiant.'
  "27": Sive lingua quis lóquitur, secúndum duos, aut ut multum tres, et per partes, et unus interpretétur.
  "28": 'Si autem non fúerit intérpres, táceat in ecclésia: sibi autem loquátur, et Deo.'
  "29": Prophétæ autem duo, aut tres dicant, et céteri diiúdicent.
  "30": Quod si álii revelátum fúerit sedénti, prior táceat.
  "31": 'Potéstis enim omnes per síngulos prophetáre: ut omnes discant, et omnes exhorténtur:'
  "32": et spíritus prophetárum prophétis subiécti sunt.
  "33": 'Non enim est dissensiónis Deus, sed pacis: sicut et in ómnibus ecclésiis sanctórum dóceo.'
  "34": Mulíeres in ecclésiis táceant, non enim permíttitur eis loqui, sed súbditas esse, sicut et lex dicit.
  "35": Si quid autem volunt díscere, domi viros suos intérrogent. Turpe est enim mulíeri loqui in ecclésia.
  "36": An a vobis verbum Dei procéssit? aut in vos solos pervénit?
  "37": Si quis vidétur prophéta esse, aut spirituális, cognóscat quæ scribo vobis, quia Dómini sunt mandáta.
  "38": Si quis autem ignórat, ignorábitur.
  "39": 'Itaque fratres æmulámini prophetáre: et loqui linguis nolíte prohibére.'
  "40": Omnia autem honéste, et secúndum órdinem fiant.
