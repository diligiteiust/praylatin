bible: vulgate
lang: la
language: Latina
book: Lamentationes
chapter: "1"
verses:
  "1": '[Et factum est, postquam in captivitátem redáctus est Israel, et Ierúsalem desérta est, sedit Jeremías prophéta flens, et planxit lamentatióne hac in Ierúsalem, et amáro ánimo suspírans, et éjulans, dixit:] Aleph. Quómodo sedet sola cívitas plena pópulo: facta est quasi vídua dómina géntium: princeps provinciárum facta est sub tribúto.'
  "2": 'Beth. Plorans plorávit in nocte, et lácrymæ eius in maxíllis eius: non est qui consolétur eam ex ómnibus caris eius: omnes amíci eius sprevérunt eam, et facti sunt ei inimíci.'
  "3": 'Ghimel. Migrávit Iudas propter afflictiónem, et multitúdinem servitútis: habitávit inter gentes, nec invénit réquiem: omnes persecutóres eius apprehendérunt eam inter angústias.'
  "4": 'Daleth. Viæ Sion lugent, eo quod non sint qui véniant ad solemnitátem: omnes portæ eius destrúctæ, sacerdótes eius geméntes: vírgines eius squálidæ, et ipsa oppréssa amaritúdine.'
  "5": 'He. Facti sunt hostes eius in cápite, inimíci eius locupletáti sunt: quia Dóminus locútus est super eam propter multitúdinem iniquitátum eius: párvuli eius ducti sunt in captivitátem ante fáciem tribulántis.'
  "6": 'Vau. Et egréssus est a fília Sion omnis decor eius: facti sunt príncipes eius velut aríetes non inveniéntes páscua: et abiérunt absque fortitúdine ante fáciem subsequéntis.'
  "7": 'Zain. Recordáta est Ierúsalem diérum afflictiónis suæ, et prævaricatiónis ómnium desiderabílium suórum, quæ habúerat a diébus antíquis, cum cáderet pópulus eius in manu hostíli, et non esset auxiliátor: vidérunt eam hostes, et derisérunt sábbata eius.'
  "8": 'Heth. Peccátum peccávit Ierúsalem, proptérea instábilis facta est: omnes, qui glorificábant eam sprevérunt illam, quia vidérunt ignomíniam eius: ipsa autem gemens convérsa est retrórsum.'
  "9": 'Teth. Sordes eius in pédibus eius, nec recordáta est finis sui: depósita est veheménter, non habens consolatórem: vide Dómine afflictiónem meam, quóniam eréctus est inimícus.'
  "10": 'Iod. Manum suam misit hostis ad ómnia desiderabília eius: quia vidit gentes ingréssas sanctuárium suum, de quibus præcéperas ne intrárent in ecclésiam tuam.'
  "11": 'Caph. Omnis pópulus eius gemens, et quærens panem: dedérunt pretiósa quæque pro cibo ad refocillándam ánimam: vide Dómine et consídera, quóniam facta sum vilis.'
  "12": 'Lamed. O vos omnes, qui transítis per viam, atténdite, et vidéte si est dolor sicut dolor meus: quóniam vindemiávit me ut locútus est Dóminus in die iræ furóris sui.'
  "13": 'Mem. De excélso misit ignem in óssibus meis, et erudívit me: expándit rete pédibus meis, convértit me retrórsum: pósuit me desolátam, tota die mœróre conféctam.'
  "14": 'Nun. Vigilávit iugum iniquitátum meárum: in manu eius convolútæ sunt, et impósitæ collo meo: infirmáta est virtus mea: dedit me Dóminus in manu, de qua non pótero súrgere.'
  "15": 'Samech. Abstulit omnes magníficos meos Dóminus de médio mei: vocávit advérsum me tempus, ut contéreret eléctos meos: tórcular calcávit Dóminus vírgini fíliæ Iuda.'
  "16": 'Ain. Idcírco ego plorans, et óculus meus dedúcens aquas: quia longe factus est a me consolátor, convértens ánimam meam: facti sunt fílii mei pérditi, quóniam inváluit inimícus.'
  "17": 'Phe. Expándit Sion manus suas, non est qui consolétur eam: mandávit Dóminus advérsum Iacob in circúitu eius hostes eius: facta est Ierúsalem quasi pollúta ménstruis inter eos.'
  "18": 'Sade. Iustus est Dóminus, quia os eius ad iracúndiam provocávi: audíte óbsecro univérsi pópuli, et vidéte dolórem meum: vírgines meæ, et iúvenes mei abiérunt in captivitátem.'
  "19": 'Coph. Vocávi amícos meos, et ipsi decepérunt me: sacerdótes mei, et senes mei in urbe consúmpti sunt: quia quæsiérunt cibum sibi ut refocillárent ánimam suam.'
  "20": 'Res. Vide Dómine quóniam tríbulor, conturbátus est venter meus: subvérsum est cor meum in memetípsa, quóniam amaritúdine plena sum: foris interfécit gládius, et domi mors símilis est.'
  "21": 'Sin. Audiérunt quia ingemísco ego, et non est qui consolétur me: omnes inimíci mei audiérunt malum meum, lætáti sunt, quóniam tu fecísti: adduxísti diem consolatiónis, et fient símiles mei.'
  "22": 'Thau. Ingrediátur omne malum eórum coram te: et vindémia eos, sicut vindemiásti me propter omnes iniquitátes meas: multi enim gémitus mei, et cor meum mœrens.'
