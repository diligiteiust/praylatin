bible: vulgate
lang: la
language: Latina
book: Ieremias
chapter: "38"
verses:
  "1": 'Audívit autem Saphatías fílius Mathan, et Gedelías fílius Phassur, et Iuchal fílius Selemíæ, et Phassur fílius Melchíæ, sermónes, quos Ieremías loquebátur ad omnem pópulum, dicens:'
  "2": 'Hæc dicit Dóminus: Quicúmque mánserit in civitáte hac, moriétur gládio, et fame, et peste: qui autem profúgerit ad Chaldǽos, vivet, et erit ánima eius sospes et vivens.'
  "3": 'Hæc dicit Dóminus: Tradéndo tradétur cívitas hæc in manu exércitus regis Babylónis, et cápiet eam.'
  "4": 'Et dixérunt príncipes regi: Rogámus ut occidátur homo iste: de indústria enim dissólvit manus virórum bellántium, qui remansérunt in civitáte hac, et manus univérsi pópuli, loquens ad eos iuxta verba hæc: síquidem homo iste non quærit pacem pópulo huic, sed malum.'
  "5": 'Et dixit rex Sedecías: Ecce ipse in mánibus vestris est: nec enim fas est regem vobis quidquam negáre.'
  "6": 'Tulérunt ergo Ieremíam, et projecérunt eum in lacum Melchíæ fílii Amelech, qui erat in vestíbulo cárceris: et submisérunt Ieremíam fúnibus in lacum, in quo non erat aqua, sed lutum: descéndit ítaque Ieremías in cœnum.'
  "7": 'Audívit autem Abdémelech Æthiops, vir eunúchus, qui erat in domo regis, quod misíssent Ieremíam in lacum: porro rex sedébat in porta Béniamin.'
  "8": 'Et egréssus est Abdémelech de domo regis, et locútus est ad regem, dicens:'
  "9": 'Dómine mi rex, male fecérunt viri isti ómnia quæcúmque perpetrárunt contra Ieremíam prophétam, mitténtes eum in lacum, ut moriátur ibi fame: non sunt enim panes ultra in civitáte.'
  "10": 'Præcépit ítaque rex Abdémelech Æthíopi, dicens: Tolle tecum hinc trigínta viros, et leva Ieremíam prophétam de lacu, ántequam moriátur.'
  "11": 'Assúmptis ergo Abdémelech secum viris, ingréssus est domum regis, quæ erat sub cellário: et tulit inde véteres pannos et antíqua, quæ computrúerant, et submísit ea ad Ieremíam in lacum per funículos.'
  "12": 'Dixítque Abdémelech Æthiops ad Ieremíam: Pone véteres pannos, et hæc scissa et pútrida, sub cúbito mánuum tuárum, et super funes. Fecit ergo Ieremías sic.'
  "13": 'Et extraxérunt Ieremíam fúnibus, et eduxérunt eum de lacu: mansit autem Ieremías in vestíbulo cárceris.'
  "14": 'Et misit rex Sedecías, et tulit ad se Ieremíam prophétam ad óstium tértium, quod erat in domo Dómini: et dixit rex ad Ieremíam: Intérrogo ego te sermónem, ne abscóndas a me áliquid.'
  "15": 'Dixit autem Ieremías ad Sedecíam: Si annuntiávero tibi, numquid non interfícies me? et si consílium dédero tibi, non me áudies.'
  "16": 'Iurávit ergo rex Sedecías Ieremíæ clam, dicens: Vivit Dóminus, qui fecit nobis ánimam hanc, si occídero te, et si tradídero te in manus virórum istórum, qui quærunt ánimam tuam.'
  "17": 'Et dixit Ieremías ad Sedecíam: Hæc dicit Dóminus exercítuum, Deus Israel: Si proféctus exíeris ad príncipes regis Babylónis, vivet ánima tua, et cívitas hæc non succendétur igni: et salvus eris tu, et domus tua.'
  "18": 'Si autem non exíeris ad príncipes regis Babylónis, tradétur cívitas hæc in manus Chaldæórum, et succéndent eam igni: et tu non effúgies de manu eórum.'
  "19": 'Et dixit rex Sedecías ad Ieremíam: Sollícitus sum propter Iudǽos, qui transfugérunt ad Chaldǽos: ne forte tradar in manus eórum, et illúdant mihi.'
  "20": 'Respóndit autem Ieremías: Non te tradent: audi quæso vocem Dómini, quam ego loquor ad te, et bene tibi erit, et vivet ánima tua.'
  "21": 'Quod si nolúeris égredi: iste est sermo, quem osténdit mihi Dóminus:'
  "22": 'Ecce omnes mulíeres, quæ remansérunt in domo regis Iuda, educéntur ad príncipes regis Babylónis, et ipsæ dicent: Seduxérunt te, et prævaluérunt advérsum te viri pacífici tui, demersérunt in cœno et in lúbrico pedes tuos, et recessérunt a te.'
  "23": 'Et omnes uxóres tuæ et fílii tui educéntur ad Chaldǽos: et non effúgies manus eórum, sed in manu regis Babylónis capiéris, et civitátem hanc combúret igni.'
  "24": 'Dixit ergo Sedecías ad Ieremíam: Nullus sciat verba hæc, et non moriéris.'
  "25": 'Si autem audíerint príncipes quia locútus sum tecum, et vénerint ad te, et díxerint tibi: Indica nobis quid locútus sis cum rege, ne celes nos, et non te interficiémus: et quid locútus est tecum rex:'
  "26": 'dices ad eos: Prostrávi ego preces meas coram rege, ne me redúci iubéret in domum Iónathan, et ibi mórerer.'
  "27": 'Venérunt ergo omnes príncipes ad Ieremíam, et interrogavérunt eum: et locútus est eis iuxta ómnia verba, quæ præcéperat ei rex: et cessavérunt ab eo: nihil enim fúerat audítum.'
  "28": 'Mansit vero Ieremías in vestíbulo cárceris usque ad diem, quo capta est Ierúsalem: et factum est ut caperétur Ierúsalem.'
