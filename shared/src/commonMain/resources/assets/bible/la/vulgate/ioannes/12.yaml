bible: vulgate
lang: la
language: Latina
book: Ioannes
chapter: "12"
verses:
  "1": Iesus ergo ante sex dies Paschæ venit Bethániam, ubi Lázarus fúerat mórtuus, quem suscitávit Iesus.
  "2": 'Fecérunt autem ei cœnam ibi: et Martha ministrábat, Lázarus vero unus erat ex discumbéntibus cum eo.'
  "3": 'María ergo accépit libram unguénti nardi pístici pretiósi, et unxit pedes Iesu, et extérsit pedes eius capíllis suis: et domus impléta est ex odóre unguénti.'
  "4": 'Dixit ergo unus ex discípulis eius, Iudas Iscariótes, qui erat eum traditúrus:'
  "5": Quare hoc unguéntum non véniit trecéntis denáriis, et datum est egénis?
  "6": Dixit autem hoc, non quia de egénis pertinébat ad eum, sed quia fur erat, et lóculos habens, ea, quæ mittebántur, portábat.
  "7": 'Dixit ergo Iesus: Sínite illam ut in diem sepultúræ meæ servet illud.'
  "8": 'Páuperes enim semper habétis vobíscum: me autem non semper habétis.'
  "9": Cognóvit ergo turba multa ex Iudǽis quia illic est, et venérunt, non propter Iesum tantum, sed ut Lázarum vidérent, quem suscitávit a mórtuis.
  "10": 'Cogitavérunt autem príncipes sacerdótum ut et Lázarum interfícerent:'
  "11": quia multi propter illum abíbant ex Iudǽis, et credébant in Iesum.
  "12": In crástinum autem turba multa, quæ vénerat ad diem festum, cum audíssent quia venit Iesus Ierosólymam,
  "13": 'accepérunt ramos palmárum, et processérunt óbviam ei, et clamábant: Hosánna, benedíctus, qui venit in nómine Dómini, rex Israel.'
  "14": 'Et invénit Iesus aséllum, et sedit super eum, sicut scriptum est:'
  "15": 'Noli timére fília Sion: ecce rex tuus venit sedens super pullum ásinæ.'
  "16": 'Hæc non cognovérunt discípuli eius primum: sed quando glorificátus est Iesus, tunc recordáti sunt quia hæc erant scripta de eo, et hæc fecérunt ei.'
  "17": Testimónium ergo perhibébat turba, quæ erat cum eo quando Lázarum vocávit de monuménto, et suscitávit eum a mórtuis.
  "18": 'Proptérea et óbviam venit ei turba: quia audiérunt fecísse hoc signum.'
  "19": 'Pharisǽi ergo dixérunt ad semetípsos: Vidétis quia nihil profícimus? ecce mundus totus post eum ábiit.'
  "20": Erant autem quidam gentíles ex his, qui ascénderant ut adorárent in die festo.
  "21": 'Hi ergo accessérunt ad Philíppum, qui erat a Bethsáida Galilǽæ, et rogábant eum, dicéntes: Dómine, vólumus Iesum vidére.'
  "22": 'Venit Philíppus, et dicit Andréæ: Andréas rursum, et Philíppus dixérunt Iesu.'
  "23": 'Iesus autem respóndit eis, dicens: Venit hora, ut clarificétur Fílius hóminis.'
  "24": Amen, amen dico vobis, nisi granum fruménti cadens in terram, mórtuum fúerit,
  "25": 'ipsum solum manet: si autem mórtuum fúerit, multum fructum affert. Qui amat ánimam suam, perdet eam: et qui odit ánimam suam in hoc mundo, in vitam ætérnam custódit eam.'
  "26": 'Si quis mihi minístrat, me sequátur: et ubi sum ego, illic et miníster meus erit. Si quis mihi ministráverit, honorificábit eum Pater meus.'
  "27": Nunc ánima mea turbáta est. Et quid dicam? Pater, salvífica me ex hac hora. Sed proptérea veni in horam hanc.
  "28": 'Pater, clarífica nomen tuum. Venit ergo vox de cælo: Et clarificávi, et íterum clarificábo.'
  "29": 'Turba ergo, quæ stabat, et audíerat, dicébat tonítruum esse factum. Alii dicébant: Angelus ei locútus est.'
  "30": 'Respóndit Iesus, et dixit: Non propter me hæc vox venit, sed propter vos.'
  "31": 'Nunc iudícium est mundi: nunc princeps huius mundi eiciétur foras.'
  "32": Et ego, si exaltátus fúero a terra, ómnia traham ad meípsum.
  "33": (Hoc autem dicébat, signíficans qua morte esset moritúrus.)
  "34": 'Respóndit ei turba: Nos audívimus ex lege, quia Christus manet in ætérnum: et quómodo tu dicis: Opórtet exaltári Fílium hóminis? quis est iste Fílius hóminis?'
  "35": 'Dixit ergo eis Iesus: Adhuc módicum, lumen in vobis est. Ambuláte dum lucem habétis, ut non vos ténebræ comprehéndant: et qui ámbulat in ténebris, nescit quo vadat.'
  "36": 'Dum lucem habétis, crédite in lucem, ut fílii lucis sitis. Hæc locútus est Iesus: et ábiit, et abscóndit se ab eis.'
  "37": 'Cum autem tanta signa fecísset coram eis, non credébant in eum:'
  "38": 'ut sermo Isaíæ prophétæ implerétur, quem dixit: Dómine, quis crédidit audítui nostro? et bráchium Dómini cui revelátum est?'
  "39": 'Proptérea non póterant crédere, quia íterum dixit Isaías:'
  "40": Excæcávit óculos eórum, et indurávit cor eórum ut non vídeant óculis, et non intélligant corde, et convertántur, et sanem eos.
  "41": Hæc dixit Isaías, quando vidit glóriam eius, et locútus est de eo.
  "42": 'Verúmtamen et ex princípibus multi credidérunt in eum: sed propter Pharisǽos non confitebántur, ut e synagóga non eiceréntur.'
  "43": Dilexérunt enim glóriam hóminum magis, quam glóriam Dei.
  "44": 'Iesus autem clamávit, et dixit: Qui credit in me, non credit in me, sed in eum, qui misit me.'
  "45": Et qui videt me, videt eum, qui misit me.
  "46": 'Ego lux in mundum veni: ut omnis, qui credit in me, in ténebris non máneat.'
  "47": 'Et si quis audíerit verba mea, et non custodíerit, ego non iúdico eum: non enim veni ut iúdicem mundum, sed ut salvíficem mundum.'
  "48": Qui spernit me, et non áccipit verba mea, habet qui iúdicet eum. Sermo, quem locútus sum, ille iudicábit eum in novíssimo die.
  "49": Quia ego ex meípso non sum locútus, sed qui misit me Pater, ipse mihi mandátum dedit quid dicam, et quid loquar.
  "50": Et scio quia mandátum eius vita ætérna est. Quæ ergo ego loquor, sicut dixit mihi Pater, sic loquor.
