bible: vulgate
lang: la
language: Latina
book: Isaias
chapter: "2"
verses:
  "1": Verbum, quod vidit Isaías, fílius Amos, super Iuda et Ierúsalem.
  "2": Et erit in novíssimis diébus præparátus mons domus Dómini in vértice móntium, et elevábitur super colles, et fluent ad eum omnes gentes.
  "3": 'Et ibunt pópuli multi, et dicent: Veníte, et ascendámus ad montem Dómini, et ad domum Dei Iacob, et docébit nos vias suas, et ambulábimus in sémitis eius: quia de Sion exíbit lex, et verbum Dómini de Ierúsalem.'
  "4": 'Et iudicábit gentes, et árguet pópulos multos: et conflábunt gládios suos in vómeres, et lánceas suas in falces: non levábit gens contra gentem gládium, nec exercebúntur ultra ad prœ́lium.'
  "5": Domus Iacob veníte, et ambulémus in lúmine Dómini.
  "6": 'Proiecísti enim pópulum tuum, domum Iacob: quia repléti sunt ut olim, et áugures habuérunt ut Philísthiim, et púeris aliénis adhæsérunt.'
  "7": 'Repléta est terra argénto et auro, et non est finis thesaurórum eius:'
  "8": 'et repléta est terra eius equis, et innumerábiles quadrígæ eius. Et repléta est terra eius idólis: opus mánuum suárum adoravérunt, quod fecérunt dígiti eórum.'
  "9": 'Et incurvávit se homo, et humiliátus est vir: ne ergo dimíttas eis.'
  "10": Ingrédere in petram, et abscóndere in fossa humo a fácie timóris Dómini, et a glória maiestátis eius.
  "11": 'Oculi sublímes hóminis humiliáti sunt, et incurvábitur altitúdo virórum: exaltábitur autem Dóminus solus in die illa.'
  "12": 'Quia dies Dómini exercítuum super omnem supérbum, et excélsum, et super omnem arrogántem: et humiliábitur.'
  "13": Et super omnes cedros Líbani sublímes et eréctas, et super omnes quercus Basan.
  "14": Et super omnes montes excélsos, et super omnes colles elevátos.
  "15": Et super omnem turrim excélsam, et super omnem murum munítum,
  "16": et super omnes naves Tharsis, et super omne, quod visu pulchrum est.
  "17": 'Et incurvábitur sublímitas hóminum, et humiliábitur altitúdo virórum, et elevábitur Dóminus solus in die illa:'
  "18": 'et idóla pénitus conteréntur:'
  "19": et introíbunt in spelúncas petrárum, et in vorágines terræ, a fácie formídinis Dómini, et a glória maiestátis eius, cum surréxerit percútere terram.
  "20": In die illa proíciet homo idóla argénti sui, et simulácra auri sui, quæ fécerat sibi ut adoráret, talpas et vespertiliónes.
  "21": Et ingrediétur scissúras petrárum et in cavérnas saxórum, a fácie formídinis Dómini, et a glória maiestátis eius, cum surréxerit percútere terram.
  "22": Quiéscite ergo ab hómine, cuius spíritus in náribus eius est, quia excélsus reputátus est ipse.
