bible: vulgate
lang: la
language: Latina
book: Proverbia
chapter: "8"
verses:
  "1": Numquid non sapiéntia clámitat, et prudéntia dat vocem suam?
  "2": In summis excelsísque vertícibus supra viam, in médiis sémitis stans,
  "3": 'iuxta portas civitátis, in ipsis fóribus lóquitur, dicens:'
  "4": O viri, ad vos clámito, et vox mea ad fílios hóminum.
  "5": Intellígite párvuli astútiam, et insipiéntes animadvértite.
  "6": Audíte, quóniam de rebus magnis locutúra sum, et aperiéntur lábia mea, ut recta prǽdicent.
  "7": Veritátem meditábitur guttur meum, et lábia mea detestabúntur ímpium.
  "8": 'Iusti sunt omnes sermónes mei: non est in eis pravum quid, neque pervérsum.'
  "9": Recti sunt intelligéntibus, et æqui inveniéntibus sciéntiam.
  "10": 'Accípite disciplínam meam, et non pecúniam: doctrínam magis quam aurum elígite.'
  "11": Mélior est enim sapiéntia cunctis pretiosíssimis, et omne desiderábile ei non potest comparári.
  "12": Ego sapiéntia hábito in consílio, et erudítis intérsum cogitatiónibus.
  "13": 'Timor Dómini odit malum: arrogántiam, et supérbiam, et viam pravam, et os bilíngue detéstor.'
  "14": 'Meum est consílium et ǽquitas: mea est prudéntia, mea est fortitúdo.'
  "15": 'Per me reges regnant, et legum conditóres iusta decérnunt:'
  "16": per me príncipes ímperant, et poténtes decérnunt iustítiam.
  "17": 'Ego diligéntes me díligo: et qui mane vígilant ad me, invénient me.'
  "18": Mecum sunt divítiæ et glória, opes supérbæ et iustítia.
  "19": Mélior est enim fructus meus auro et lápide pretióso, et genímina mea argénto elécto.
  "20": In viis iustítiæ ámbulo, in médio semitárum iudícii,
  "21": ut ditem diligéntes me, et thesáuros eórum répleam.
  "22": Dóminus possédit me in inítio viárum suárum, ántequam quidquam fáceret a princípio.
  "23": Ab ætérno ordináta sum, et ex antíquis ántequam terra fíeret.
  "24": 'Nondum erant abýssi, et ego iam concépta eram: necdum fontes aquárum erúperant:'
  "25": 'necdum montes gravi mole constíterant: ante colles ego parturiébar:'
  "26": adhuc terram non fécerat, et flúmina, et cárdines orbis terræ.
  "27": 'Quando præparábat cælos, áderam: quando certa lege, et gyro vallábat abýssos:'
  "28": 'quando ǽthera firmábat sursum, et librábat fontes aquárum:'
  "29": 'quando circúmdabat mari términum suum, et legem ponébat aquis, ne transírent fines suos: quando appendébat fundaménta terræ.'
  "30": 'Cum eo eram cuncta compónens: et delectábar per síngulos dies, ludens coram eo omni témpore,'
  "31": 'ludens in orbe terrárum: et delíciæ meæ esse cum fíliis hóminum.'
  "32": 'Nunc ergo fílii audíte me: Beáti, qui custódiunt vias meas.'
  "33": Audíte disciplínam, et estóte sapiéntes, et nolíte abícere eam.
  "34": Beátus homo qui audit me, et qui vígilat ad fores meas quotídie, et obsérvat ad postes óstii mei.
  "35": 'Qui me invénerit, invéniet vitam, et háuriet salútem a Dómino:'
  "36": qui autem in me peccáverit, lædet ánimam suam. Omnes, qui me odérunt, díligunt mortem.
