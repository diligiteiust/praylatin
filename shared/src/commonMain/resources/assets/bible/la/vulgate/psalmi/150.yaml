bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "150"
verses:
  "1": 'Allelúia. Laudáte Dóminum in sanctis eius: laudáte eum in firmaménto virtútis eius.'
  "2": 'Laudáte eum in virtútibus eius: laudáte eum secúndum multitúdinem magnitúdinis eius.'
  "3": 'Laudáte eum in sono tubæ: laudáte eum in psaltério, et cíthara.'
  "4": 'Laudáte eum in týmpano, et choro: laudáte eum in chordis, et órgano.'
  "5": 'Laudáte eum in cýmbalis benesonántibus: laudáte eum in cýmbalis iubilatiónis:'
  "6": omnis spíritus laudet Dóminum. Allelúia.
