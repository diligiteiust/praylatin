bible: vulgate
lang: la
language: Latina
book: II Regum
chapter: "1"
verses:
  "1": Prævaricátus est autem Moab in Israel, postquam mórtuus est Achab.
  "2": 'Cecidítque Ochozías per cancéllos cœnáculi sui, quod habébat in Samaría, et ægrotávit: misítque núntios, dicens ad eos: Ite, consúlite Beélzebub deum Accaron, utrum vívere queam de infirmitáte mea hac.'
  "3": 'Angelus autem Dómini locútus est ad Elíam Thesbíten, dicens: Surge, et ascénde in occúrsum nuntiórum regis Samaríæ, et dices ad eos: Numquid non est Deus in Israel, ut eátis ad consuléndum Beélzebub deum Accaron?'
  "4": 'Quam ob rem hæc dicit Dóminus: De léctulo, super quem ascendísti, non descéndes, sed morte moriéris. Et ábiit Elías.'
  "5": 'Reversíque sunt núntii ad Ochozíam. Qui dixit eis: Quare revérsi estis?'
  "6": 'At illi respondérunt ei: Vir occúrrit nobis, et dixit ad nos: Ite, et revertímini ad regem, qui misit vos, et dicétis ei: Hæc dicit Dóminus: Numquid quia non erat Deus in Israel, mittis ut consulátur Beélzebub deus Accaron? Idcírco de léctulo, super quem ascendísti, non descéndes, sed morte moriéris.'
  "7": 'Qui dixit eis: Cuius figúræ et hábitus est vir ille, qui occúrrit vobis, et locútus est verba hæc?'
  "8": 'At illi dixérunt: Vir pilósus, et zona pellícea accínctus rénibus. Qui ait: Elías Thesbítes est.'
  "9": 'Misítque ad eum quinquagenárium príncipem, et quinquagínta qui erant sub eo. Qui ascéndit ad eum: sedentíque in vértice montis, ait: Homo Dei, rex præcépit ut descéndas.'
  "10": 'Respondénsque Elías, dixit quinquagenário: Si homo Dei sum, descéndat ignis de cælo, et dévoret te, et quinquagínta tuos. Descéndit ítaque ignis de cælo, et devorávit eum, et quinquagínta qui erant cum eo.'
  "11": 'Rursúmque misit ad eum príncipem quinquagenárium álterum, et quinquagínta cum eo. Qui locútus est illi: Homo Dei, hæc dicit rex: Festína, descénde.'
  "12": 'Respóndens Elías, ait: Si homo Dei ego sum, descéndat ignis de cælo, et dévoret te, et quinquagínta tuos. Descéndit ergo ignis de cælo, et devorávit illum, et quinquagínta eius.'
  "13": 'Iterum misit príncipem quinquagenárium tértium, et quinquagínta qui erant cum eo. Qui cum venísset, curvávit génua contra Elíam, et precátus est eum, et ait: Homo Dei, noli despícere ánimam meam, et ánimas servórum tuórum qui mecum sunt.'
  "14": 'Ecce descéndit ignis de cælo, et devorávit duos príncipes quinquagenários primos, et quinquagénos, qui cum eis erant: sed nunc óbsecro ut misereáris ánimæ meæ.'
  "15": 'Locútus est autem ángelus Dómini ad Elíam, dicens: Descénde cum eo: ne tímeas. Surréxit ígitur, et descéndit cum eo ad regem,'
  "16": 'et locútus est ei: Hæc dicit Dóminus: Quia misísti núntios ad consuléndum Beélzebub deum Accaron, quasi non esset Deus in Israel, a quo posses interrogáre sermónem, ídeo de léctulo, super quem ascendísti, non descéndes, sed morte moriéris.'
  "17": 'Mórtuus est ergo iuxta sermónem Dómini, quem locútus est Elías, et regnávit Ioram frater eius pro eo, anno secúndo Ioram fílii Iósaphat regis Iudæ: non enim habébat fílium.'
  "18": Réliqua autem verbórum Ochozíæ, quæ operátus est, nonne hæc scripta sunt in Libro sermónum diérum regum Israel?
