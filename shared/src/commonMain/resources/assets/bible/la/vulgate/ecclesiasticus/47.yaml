bible: vulgate
lang: la
language: Latina
book: Ecclesiasticus
chapter: "47"
verses:
  "1": Post hæc surréxit Nathan, prophéta in diébus David.
  "2": Et quasi adeps separátus a carne, sic David a fíliis Israel.
  "3": 'Cum leónibus lusit quasi cum agnis: et in ursis simíliter fecit sicut in agnis óvium, in iuventúte sua.'
  "4": Numquid non occídit gigántem, et ábstulit oppróbrium de gente?
  "5": 'In tolléndo manum, saxo fundæ deiécit exsultatiónem Góliæ:'
  "6": nam invocávit Dóminum omnipoténtem, et dedit in déxtera eius tóllere hóminem fortem in bello, et exaltáre cornu gentis suæ.
  "7": 'Sic in decem míllibus glorificávit eum, et laudávit eum in benedictiónibus Dómini, in offeréndo illi corónam glóriæ:'
  "8": 'contrívit enim inimícos úndique, et exstirpávit Philísthiim contrários usque in hodiérnum diem: contrívit cornu ipsórum usque in ætérnum.'
  "9": In omni ópere dedit confessiónem Sancto, et Excélso in verbo glóriæ.
  "10": 'De omni corde suo laudávit Dóminum, et diléxit Deum, qui fecit illum: et dedit illi contra inimícos poténtiam:'
  "11": et stare fecit cantóres contra altáre, et in sono eórum dulces fecit modos.
  "12": Et dedit in celebratiónibus decus, et ornávit témpora usque ad consummatiónem vitæ, ut laudárent nomen sanctum Dómini, et amplificárent mane Dei sanctitátem.
  "13": 'Dóminus purgávit peccáta ipsíus, et exaltávit in ætérnum cornu eius: et dedit illi testaméntum regni, et sedem glóriæ in Israel.'
  "14": Post ipsum surréxit fílius sensátus, et propter illum deiécit omnem poténtiam inimicórum.
  "15": 'Sálomon imperávit in diébus pacis, cui subiécit Deus omnes hostes, ut cónderet domum in nómine suo, et paráret sanctitátem in sempitérnum: quemádmodum erudítus es in iuventúte tua,'
  "16": et implétus es, quasi flumen, sapiéntia, et terram retéxit ánima tua.
  "17": 'Et replésti in comparatiónibus ænígmata: ad ínsulas longe divulgátum est nomen tuum, et diléctus es in pace tua.'
  "18": In cantilénis, et provérbiis, et comparatiónibus, et interpretatiónibus, mirátæ sunt terræ,
  "19": et in nómine Dómini Dei, cui est cognómen Deus Israel.
  "20": Collegísti quasi aurichálcum aurum, et ut plumbum complésti argéntum,
  "21": 'et inclinásti fémora tua muliéribus: potestátem habuísti in córpore tuo,'
  "22": dedísti máculam in glória tua, et profanásti semen tuum, indúcere iracúndiam ad líberos tuos, et incitári stultítiam tuam,
  "23": ut fáceres impérium bipartítum, et ex Ephraim imperáre impérium durum.
  "24": 'Deus autem non derelínquet misericórdiam suam, et non corrúmpet, nec delébit ópera sua, neque perdet a stirpe nepótes elécti sui: et semen eius, qui díligit Dóminum, non corrúmpet.'
  "25": Dedit autem réliquum Iacob, et David de ipsa stirpe.
  "26": Et finem hábuit Sálomon cum pátribus suis.
  "27": Et derelíquit post se de sémine suo, gentis stultítiam,
  "28": 'et imminútum a prudéntia, Róboam, qui avértit gentem consílio suo:'
  "29": et Ieróboam fílium Nabat, qui peccáre fecit Israel, et dedit viam peccándi Ephraim, et plúrima redundavérunt peccáta ipsórum.
  "30": Valde avertérunt illos a terra sua.
  "31": Et quæsívit omnes nequítias, usque dum perveníret ad illos defénsio, et ab ómnibus peccátis liberávit eos.
