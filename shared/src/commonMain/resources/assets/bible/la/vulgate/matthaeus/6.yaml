bible: vulgate
lang: la
language: Latina
book: Matthaeus
chapter: "6"
verses:
  "1": 'Atténdite ne iustítiam vestram faciátis coram homínibus, ut videámini ab eis: alióquin mercédem non habébitis apud Patrem vestrum, qui in cælis est.'
  "2": Cum ergo facis eleemósynam, noli tuba cánere ante te, sicut hypócritæ fáciunt in synagógis, et in vicis, ut honorificéntur ab homínibus. Amen dico vobis, recepérunt mercédem suam.
  "3": 'Te autem faciénte eleemósynam, nésciat sinístra tua quid fáciat déxtera tua:'
  "4": ut sit eleemósyna tua in abscóndito, et Pater tuus, qui videt in abscóndito, reddet tibi.
  "5": 'Et cum orátis, non éritis sicut hypócritæ, qui amant in synagógis, et in ángulis plateárum stantes oráre, ut videántur ab homínibus: amen dico vobis, recepérunt mercédem suam.'
  "6": 'Tu autem cum oráveris, intra in cubículum tuum, et clauso óstio, ora Patrem tuum in abscóndito: et Pater tuus, qui videt in abscóndito, reddet tibi.'
  "7": 'Orántes autem, nolíte multum loqui, sicut éthnici: putant enim quod in multilóquio suo exaudiántur.'
  "8": 'Nolíte ergo assimilári eis: scit enim Pater vester, quid opus sit vobis, ántequam petátis eum.'
  "9": 'Sic ergo vos orábitis: Pater noster, qui es in cælis, sanctificétur nomen tuum.'
  "10": Advéniat regnum tuum. Fiat volúntas tua, sicut in cælo et in terra.
  "11": Panem nostrum supersubstantiálem da nobis hódie.
  "12": Et dimítte nobis débita nostra, sicut et nos dimíttimus debitóribus nostris.
  "13": 'Et ne nos indúcas in tentatiónem: sed líbera nos a malo. Amen.'
  "14": 'Si enim dimiséritis homínibus peccáta eórum: dimíttet et vobis Pater vester cæléstis delícta vestra.'
  "15": 'Si autem non dimiséritis homínibus: nec Pater vester dimíttet vobis peccáta vestra.'
  "16": 'Cum autem ieiunátis, nolíte fíeri sicut hypócritæ, tristes: extérminant enim fácies suas, ut appáreant homínibus ieiunántes. Amen dico vobis, quia recepérunt mercédem suam.'
  "17": Tu autem, cum ieiúnas, unge caput tuum, et fáciem tuam lava,
  "18": 'ne videáris homínibus ieiúnans, sed Patri tuo, qui est in abscóndito: et Pater tuus, qui videt in abscóndito, reddet tibi.'
  "19": 'Nolíte thesaurizáre vobis thesáuros in terra: ubi ærúgo, et tínea demolítur: et ubi fures effódiunt, et furántur.'
  "20": Thesaurizáte autem vobis thesáuros in cælo, ubi neque ærúgo, neque tínea demolítur, et ubi fures non effódiunt, nec furántur.
  "21": Ubi enim est thesáurus tuus, ibi est et cor tuum.
  "22": Lucérna córporis tui est óculus tuus. Si óculus tuus fúerit simplex, totum corpus tuum lúcidum erit.
  "23": 'Si autem óculus tuus fúerit nequam, totum corpus tuum tenebrósum erit. Si ergo lumen, quod in te est, ténebræ sunt: ipsæ ténebræ quantæ erunt?'
  "24": 'Nemo potest duóbus dóminis servíre: aut enim unum ódio habébit, et álterum díliget: aut unum sustinébit, et álterum contémnet. Non potéstis Deo servíre et mammónæ.'
  "25": Ideo dico vobis, ne sollíciti sitis ánimæ vestræ quid manducétis, neque córpori vestro quid induámini. Nonne ánima plus est quam esca, et corpus plus quam vestiméntum?
  "26": 'Respícite volatília cæli, quóniam non serunt, neque metunt, neque cóngregant in hórrea: et Pater vester cæléstis pascit illa. Nonne vos magis pluris estis illis?'
  "27": Quis autem vestrum cógitans potest adícere ad statúram suam cúbitum unum?
  "28": 'Et de vestiménto quid sollíciti estis? Consideráte lília agri quómodo crescunt: non labórant, neque nent.'
  "29": Dico autem vobis, quóniam nec Sálomon in omni glória sua coopértus est sicut unum ex istis.
  "30": Si autem fœnum agri, quod hódie est, et cras in clíbanum míttitur, Deus sic vestit, quanto magis vos módicæ fídei?
  "31": 'Nolíte ergo sollíciti esse, dicéntes: Quid manducábimus, aut quid bibémus, aut quo operiémur?'
  "32": Hæc enim ómnia gentes inquírunt. Scit enim Pater vester, quia his ómnibus indigétis.
  "33": 'Quǽrite ergo primum regnum Dei, et iustítiam eius: et hæc ómnia adiciéntur vobis.'
  "34": 'Nolíte ergo sollíciti esse in crástinum. Crástinus enim dies sollícitus erit sibi ipsi: súfficit diéi malítia sua.'
