bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "45"
verses:
  "1": In finem, fíliis Core pro arcánis, Psalmus.
  "2": 'Deus noster refúgium, et virtus: adiútor in tribulatiónibus, quæ invenérunt nos nimis.'
  "3": 'Proptérea non timébimus dum turbábitur terra: et transferéntur montes in cor maris.'
  "4": 'Sonuérunt, et turbátæ sunt aquæ eórum: conturbáti sunt montes in fortitúdine eius.'
  "5": 'Flúminis ímpetus lætíficat civitátem Dei: sanctificávit tabernáculum suum Altíssimus.'
  "6": 'Deus in médio eius, non commovébitur: adiuvábit eam Deus mane dilúculo.'
  "7": 'Conturbátæ sunt gentes, et inclináta sunt regna: dedit vocem suam, mota est terra.'
  "8": 'Dóminus virtútum nobíscum: suscéptor noster Deus Iacob.'
  "9": 'Veníte, et vidéte ópera Dómini, quæ pósuit prodígia super terram:'
  "10": áuferens bella usque ad finem terræ. Arcum cónteret, et confrínget arma, et scuta combúret igni.
  "11": 'Vacáte, et vidéte quóniam ego sum Deus: exaltábor in géntibus, et exaltábor in terra.'
  "12": 'Dóminus virtútum nobíscum: suscéptor noster Deus Iacob.'
