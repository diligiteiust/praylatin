bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "11"
verses:
  "1": In finem, pro octáva, Psalmus David.
  "2": 'Salvum me fac Dómine, quóniam defécit sanctus: quóniam diminútæ sunt veritátes a fíliis hóminum.'
  "3": 'Vana locúti sunt unusquísque ad próximum suum: lábia dolósa, in corde et corde locúti sunt.'
  "4": Dispérdat Dóminus univérsa lábia dolósa, et linguam magníloquam.
  "5": 'Qui dixérunt: Linguam nostram magnificábimus, lábia nostra a nobis sunt, quis noster Dóminus est?'
  "6": 'Propter misériam ínopum, et gémitum páuperum, nunc exsúrgam, dicit Dóminus. Ponam in salutári: fiduciáliter agam in eo.'
  "7": 'Elóquia Dómini, elóquia casta: argéntum igne examinátum, probátum terræ, purgátum séptuplum.'
  "8": 'Tu Dómine servábis nos: et custódies nos a generatióne hac in ætérnum.'
  "9": 'In circúitu ímpii ámbulant: secúndum altitúdinem tuam multiplicásti fílios hóminum.'
