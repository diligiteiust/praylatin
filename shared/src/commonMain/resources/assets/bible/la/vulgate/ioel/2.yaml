bible: vulgate
lang: la
language: Latina
book: Ioel
chapter: "2"
verses:
  "1": 'Cánite tuba in Sion, ululáte in monte sancto meo, conturbéntur omnes habitatóres terræ: quia venit dies Dómini, quia prope est.'
  "2": 'Dies tenebrárum et calíginis, dies nubis et túrbinis: quasi mane expánsum super montes pópulus multus et fortis: símilis ei non fuit a princípio, et post eum non erit usque in annos generatiónis et generatiónis.'
  "3": 'Ante fáciem eius ignis vorans, et post eum exúrens flamma: quasi hortus voluptátis terra coram eo, et post eum solitúdo desérti, neque est qui effúgiat eum.'
  "4": 'Quasi aspéctus equórum, aspéctus eórum: et quasi équites, sic current.'
  "5": Sicut sónitus quadrigárum super cápita móntium exsílient, sicut sónitus flammæ ignis devorántis stípulam, velut pópulus fortis præparátus ad prœ́lium.
  "6": 'A fácie eius cruciabúntur pópuli: omnes vultus redigéntur in ollam.'
  "7": 'Sicut fortes current: quasi viri bellatóres ascéndent murum: viri in viis suis gradiéntur, et non declinábunt a sémitis suis.'
  "8": 'Unusquísque fratrem suum non coarctábit, sínguli in calle suo ambulábunt: sed et per fenéstras cadent, et non demoliéntur.'
  "9": 'Urbem ingrediéntur, in muro current: domos conscéndent, per fenéstras intrábunt quasi fur.'
  "10": 'A fácie eius contrémuit terra, moti sunt cæli: sol et luna obtenebráti sunt, et stellæ retraxérunt splendórem suum.'
  "11": 'Et Dóminus dedit vocem suam ante fáciem exércitus sui, quia multa sunt nimis castra eius, quia fórtia et faciéntia verbum eius: magnus enim dies Dómini, et terríbilis valde, et quis sustinébit eum?'
  "12": 'Nunc ergo dicit Dóminus: Convertímini ad me in toto corde vestro, in ieiúnio, et in fletu, et in planctu.'
  "13": 'Et scíndite corda vestra, et non vestiménta vestra, et convertímini ad Dóminum Deum vestrum: quia benígnus et miséricors est, pátiens et multæ misericórdiæ, et præstábilis super malítia.'
  "14": Quis scit si convertátur, et ignóscat, et relínquat post se benedictiónem, sacrifícium et libámen Dómino Deo vestro?
  "15": Cánite tuba in Sion, sanctificáte ieiúnium, vocáte cœtum,
  "16": 'congregáte pópulum, sanctificáte ecclésiam, coadunáte senes, congregáte párvulos, et sugéntes úbera: egrediátur sponsus de cubíli suo, et sponsa de thálamo suo.'
  "17": 'Inter vestíbulum et altáre plorábunt sacerdótes minístri Dómini, et dicent: Parce Dómine, parce pópulo tuo: et ne des hereditátem tuam in oppróbrium, ut dominéntur eis natiónes: quare dicunt in pópulis: Ubi est Deus eórum?'
  "18": 'Zelátus est Dóminus terram suam, et pepércit pópulo suo:'
  "19": 'et respóndit Dóminus, et dixit pópulo suo: Ecce ego mittam vobis fruméntum, et vinum, et óleum, et replebímini eis: et non dabo vos ultra oppróbrium in géntibus.'
  "20": 'Et eum, qui ab aquilóne est, procul fáciam a vobis: et expéllam eum in terram ínviam, et desértam: fáciem eius contra mare orientále, et extrémum eius ad mare novíssimum: et ascéndet fœtor eius, et ascéndet putrédo eius, quia supérbe egit.'
  "21": 'Noli timére terra, exsúlta et lætáre: quóniam magnificávit Dóminus ut fáceret.'
  "22": 'Nolíte timére animália regiónis, quia germinavérunt speciósa desérti: quia lignum áttulit fructum suum, ficus, et vínea dedérunt virtútem suam.'
  "23": 'Et fílii Sion exsultáte, et lætámini in Dómino Deo vestro: quia dedit vobis doctórem iustítiæ, et descéndere fáciet ad vos imbrem matutínum et serótinum, sicut in princípio.'
  "24": Et implebúntur áreæ fruménto, et redundábunt torculária vino, et óleo.
  "25": 'Et reddam vobis annos, quos comédit locústa, bruchus, et rubígo, et erúca: fortitúdo mea magna, quam misi in vos.'
  "26": 'Et comedétis vescéntes, et saturabímini: et laudábitis nomen Dómini Dei vestri, qui fecit mirabília vobíscum: et non confundétur pópulus meus in sempitérnum.'
  "27": 'Et sciétis quia in médio Israel ego sum: et ego Dóminus Deus vester, et non est ámplius: et non confundétur pópulus meus in ætérnum.'
  "28": 'Et erit post hæc: effúndam spíritum meum super omnem carnem: et prophetábunt fílii vestri, et fíliæ vestræ: senes vestri sómnia somniábunt, et iúvenes vestri visiónes vidébunt.'
  "29": Sed et super servos meos, et ancíllas in diébus illis effúndam spíritum meum.
  "30": Et dabo prodígia in cælo, et in terra, sánguinem, et ignem, et vapórem fumi.
  "31": 'Sol convertétur in ténebras, et luna in sánguinem: ántequam véniat dies Dómini magnus, et horríbilis.'
  "32": 'Et erit: omnis qui invocáverit nomen Dómini, salvus erit: quia in monte Sion, et in Ierúsalem erit salvátio, sicut dixit Dóminus, et in resíduis quos Dóminus vocáverit.'
