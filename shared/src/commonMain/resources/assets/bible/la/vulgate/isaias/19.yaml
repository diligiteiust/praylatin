bible: vulgate
lang: la
language: Latina
book: Isaias
chapter: "19"
verses:
  "1": Onus Ægýpti. Ecce Dóminus ascéndet super nubem levem, et ingrediétur Ægýptum, et commovebúntur simulácra Ægýpti a fácie eius, et cor Ægýpti tabéscet in médio eius.
  "2": 'Et concúrrere fáciam Ægýptios advérsus Ægýptios: et pugnábit vir contra fratrem suum, et vir contra amícum suum, cívitas advérsus civitátem, regnum advérsus regnum.'
  "3": 'Et dirumpétur spíritus Ægýpti in viscéribus eius, et consílium eius præcipitábo: et interrogábunt simulácra sua, et divínos suos, et pythónes, et aríolos.'
  "4": Et tradam Ægýptum in manu dominórum crudélium, et rex fortis dominábitur eórum, ait Dóminus Deus exercítuum.
  "5": Et aréscet aqua de mari, et flúvius desolábitur atque siccábitur.
  "6": 'Et defícient flúmina: attenuabúntur, et siccabúntur rivi ággerum. Cálamus et iuncus marcéscet:'
  "7": nudábitur álveus rivi a fonte suo, et omnis seméntis irrígua siccábitur, aréscet, et non erit.
  "8": 'Et mœrébunt piscatóres, et lugébunt omnes mitténtes in flumen hamum: et expandéntes rete super fáciem aquárum emarcéscent.'
  "9": Confundéntur qui operabántur linum, pecténtes et texéntes subtília.
  "10": 'Et erunt irrígua eius flaccéntia: omnes qui faciébant lacúnas ad capiéndos pisces.'
  "11": 'Stulti príncipes Táneos, sapiéntes consiliárii Pharaónis dedérunt consílium insípiens. Quómodo dicétis Pharaóni: Fílius sapiéntium ego, fílius regum antiquórum?'
  "12": Ubi nunc sunt sapiéntes tui? annúntient tibi, et índicent quid cogitáverit Dóminus exercítuum super Ægýptum.
  "13": 'Stulti facti sunt príncipes Táneos, emarcuérunt príncipes Mémpheos: decepérunt Ægýptum, ángulum populórum eius.'
  "14": 'Dóminus míscuit in médio eius spíritum vertíginis: et erráre fecérunt Ægýptum in omni ópere suo, sicut errat ébrius et vomens.'
  "15": Et non erit Ægýpto opus, quod fáciat caput et caudam, incurvántem et refrenántem.
  "16": 'In die illa erit Ægýptus quasi mulíeres: et stupébunt, et timébunt a fácie commotiónis manus Dómini exercítuum, quam ipse movébit super eam.'
  "17": 'Et erit terra Iuda Ægýpto in pavórem: omnis, qui illíus fúerit recordátus, pavébit a fácie consílii Dómini exercítuum, quod ipse cogitávit super eam.'
  "18": 'In die illa erunt quinque civitátes in terra Ægýpti, loquéntes lingua Chánaan, et iurántes per Dóminum exercítuum: Cívitas solis vocábitur una.'
  "19": In die illa erit altáre Dómini in médio terræ Ægýpti, et títulus Dómini iuxta términum eius
  "20": erit in signum, et in testimónium Dómino exercítuum in terra Ægýpti. Clamábunt enim ad Dóminum a fácie tribulatiónis, et mittet eis salvatórem et propugnatórem, qui líberet eos.
  "21": 'Et cognoscétur Dóminus ab Ægýpto, et cognóscent Ægýptii Dóminum in die illa: et colent eum in hóstiis et in munéribus: et vota vovébunt Dómino, et solvent.'
  "22": 'Et percútiet Dóminus Ægýptum plaga, et sanábit eam: et reverténtur ad Dóminum, et placábitur eis, et sanábit eos.'
  "23": 'In die illa erit via de Ægýpto in Assýrios: et intrábit Assýrius Ægýptum, et Ægýptius in Assýrios, et sérvient Ægýptii Assur.'
  "24": 'In die illa erit Israel tértius Ægýptio et Assýrio: benedíctio in médio terræ,'
  "25": 'cui benedíxit Dóminus exercítuum, dicens: Benedíctus pópulus meus Ægýpti, et opus mánuum meárum Assýrio: heréditas autem mea Israel.'
