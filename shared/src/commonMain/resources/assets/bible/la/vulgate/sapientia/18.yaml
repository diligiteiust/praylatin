bible: vulgate
lang: la
language: Latina
book: Sapientia
chapter: "18"
verses:
  "1": 'Sanctis autem tuis máxima erat lux, et horum quidem vocem audiébant, sed figúram non vidébant. Et quia non et ipsi éadem passi erant, magnificábant te:'
  "2": 'et qui ante læsi erant, quia non lædebántur, grátias agébant: et ut esset differéntia, donum petébant.'
  "3": Propter quod ignis ardéntem colúmnam ducem habuérunt ignótæ viæ, et solem sine læsúra boni hospítii præstitísti.
  "4": Digni quidem illi carére luce, et pati cárcerem tenebrárum, qui inclúsos custodiébant fílios tuos, per quos incipiébat incorrúptum legis lumen sǽculo dari.
  "5": Cum cogitárent iustórum occídere infántes, et uno expósito fílio, et liberáto, in traductiónem illórum, multitúdinem filiórum abstulísti, et páriter illos perdidísti in aqua válida.
  "6": Illa enim nox ante cógnita est a pátribus nostris, ut vere sciéntes quibus iuraméntis credidérunt, animæquióres essent.
  "7": Suscépta est autem a pópulo tuo sánitas quidem iustórum, iniustórum autem exterminátio.
  "8": Sicut enim læsísti adversários, sic et nos próvocans magnificásti.
  "9": 'Abscónse enim sacrificábant iusti púeri bonórum, et iustítiæ legem in concórdia disposuérunt: simíliter et bona et mala receptúros iustos, patrum iam decantántes laudes.'
  "10": Resonábat autem inconvéniens inimicórum vox, et flébilis audiebátur planctus ploratórum infántium.
  "11": Símili autem pœna servus cum dómino afflíctus est, et populáris homo regi simília passus.
  "12": 'Simíliter ergo omnes, uno nómine mortis, mórtuos habébant innumerábiles: nec enim ad sepeliéndum vivi sufficiébant, quóniam uno moménto, quæ erat præclárior nátio illórum, extermináta est.'
  "13": 'De ómnibus enim non credéntes, propter venefícia: tunc vero primum cum fuit extermínium primogenitórum, spopondérunt pópulum Dei esse.'
  "14": Cum enim quiétum siléntium continéret ómnia, et nox in suo cursu médium iter habéret,
  "15": omnípotens sermo tuus de cælo, a regálibus sédibus, durus debellátor in médiam extermínii terram prosilívit,
  "16": 'gládius acútus insimulátum impérium tuum portans: et stans replévit ómnia morte, et usque ad cælum attingébat stans in terra.'
  "17": Tunc contínuo visus somniórum malórum turbavérunt illos, et timóres supervenérunt insperáti.
  "18": Et álius álibi proiéctus semivívus, propter quam moriebátur causam demonstrábat mortis.
  "19": Visiónes enim, quæ illos turbavérunt, hæc præmonébant, ne ínscii quare mala patiebántur perírent.
  "20": 'Tétigit autem tunc et iustos tentátio mortis, et commótio in erémo facta est multitúdinis: sed non diu permánsit ira tua.'
  "21": Prósperans enim homo sine queréla deprecári pro pópulis, próferens servitútis suæ scutum, oratiónem et per incénsum deprecatiónem allégans, réstitit iræ, et finem impósuit necessitáti, osténdens quóniam tuus est fámulus.
  "22": Vicit autem turbas non in virtúte córporis, nec armatúræ poténtia, sed verbo illum, qui se vexábat subiécit, iuraménta paréntum et testaméntum commémorans.
  "23": Cum enim iam acervátim cecidíssent super altérutrum mórtui, intérstitit, et amputávit ímpetum, et divísit illam, quæ ad vivos ducébat viam.
  "24": 'In veste enim podéris quam habébat, totus erat orbis terrárum: et paréntum magnália in quátuor ordínibus lápidum erant sculpta, et magnificéntia tua in diadémate cápitis illíus sculpta erat.'
  "25": 'His autem cessit qui exterminábat, et hæc extímuit: erat enim sola tentátio iræ suffíciens.'
