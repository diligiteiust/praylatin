bible: vulgate
lang: la
language: Latina
book: Zacharias
chapter: "10"
verses:
  "1": 'Pétite a Dómino plúviam in témpore serótino, et Dóminus fáciet nives: et plúviam imbris dabit eis, síngulis herbam in agro.'
  "2": 'Quia simulácra locúta sunt inútile, et divíni vidérunt mendácium, et somniatóres locúti sunt frustra: vane consolabántur: idcírco abdúcti sunt quasi grex: affligéntur, quia non est eis pastor.'
  "3": 'Super pastóres irátus est furor meus, et super hircos visitábo: quia visitávit Dóminus exercítuum gregem suum, domum Iuda, et pósuit eos quasi equum glóriæ suæ in bello.'
  "4": Ex ipso ángulus, ex ipso paxíllus, ex ipso arcus prœ́lii, ex ipso egrediétur omnis exáctor simul.
  "5": 'Et erunt quasi fortes conculcántes lutum viárum in prœ́lio: et bellábunt, quia Dóminus cum eis: et confundéntur ascensóres equórum.'
  "6": 'Et confortábo domum Iuda, et domum Ioseph salvábo: et convértam eos, quia miserébor eórum: et erunt sicut fuérunt quando non proiéceram eos: ego enim Dóminus Deus eórum, et exáudiam eos.'
  "7": 'Et erunt quasi fortes Ephraim, et lætábitur cor eórum quasi a vino: et fílii eórum vidébunt, et lætabúntur, et exsultábit cor eórum in Dómino.'
  "8": 'Sibilábo eis, et congregábo illos, quia redémi eos: et multiplicábo eos sicut ante fúerant multiplicáti.'
  "9": 'Et seminábo eos in pópulis, et de longe recordabúntur mei: et vivent cum fíliis suis, et reverténtur.'
  "10": 'Et redúcam eos de terra Ægýpti, et de Assýriis congregábo eos, et ad terram Gálaad et Líbani addúcam eos, et non inveniétur eis locus:'
  "11": et transíbit in maris freto, et percútiet in mari fluctus, et confundéntur ómnia profúnda flúminis, et humiliábitur supérbia Assur, et sceptrum Ægýpti recédet.
  "12": Confortábo eos in Dómino, et in nómine eius ambulábunt, dicit Dóminus.
