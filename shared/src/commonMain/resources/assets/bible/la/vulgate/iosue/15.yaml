bible: vulgate
lang: la
language: Latina
book: Iosue
chapter: "15"
verses:
  "1": 'Igitur sors filiórum Iudæ per cognatiónes suas ista fuit: a término Edom, desértum Sin, contra merídiem, et usque ad extrémam partem austrális plagæ.'
  "2": Inítium eius a summitáte maris salsíssimi, et a lingua eius, quæ réspicit merídiem.
  "3": 'Egreditúrque contra Ascénsum Scorpiónis, et pertránsit in Sina: ascendítque in Cadesbárne, et pérvenit in Esron, ascéndens ad Addar, et circúiens Cárcaa,'
  "4": 'atque inde pertránsiens in Asemóna, et pervéniens ad torréntem Ægýpti: erúntque términi eius mare magnum: hic erit finis meridiánæ plagæ.'
  "5": 'Ab oriénte vero erit inítium, mare salsíssimum usque ad extréma Iordánis: et ea quæ respíciunt ad aquilónem, a lingua maris usque ad eúmdem Iordánis flúvium.'
  "6": 'Ascendítque términus in Beth Hagla, et transit ab aquilóne in Beth Araba, ascéndens ad lápidem Boen fílii Ruben:'
  "7": 'et tendens usque ad términos Débera de valle Achor, contra aquilónem respíciens Gálgala, quæ est ex advérso Ascensiónis Adómmim, ab austráli parte torréntis: transítque aquas, quæ vocántur Fons solis: et erunt éxitus eius ad Fontem Rogel.'
  "8": 'Ascendítque per convállem fílii Ennom ex látere Iebusǽi ad merídiem, hæc est Ierúsalem: et inde se érigens ad vérticem montis, qui est contra Geénnom ad occidéntem in summitáte Vallis Ráphaim contra aquilónem:'
  "9": 'pertransítque a vértice montis usque ad fontem aquæ Néphtoa: et pérvenit usque ad vicos montis Ephron: inclinatúrque in Báala, quæ est Cariathíarim, id est, Urbs silvárum.'
  "10": 'Et círcuit de Báala contra occidéntem, usque ad montem Seir: transítque iuxta latus montis Iarim ad aquilónem in Cheslon: et descéndit in Béthsames, transítque in Thamna.'
  "11": 'Et pérvenit contra aquilónem partis Accaron ex látere: inclinatúrque Sechróna, et transit montem Báala: pervenítque in Iébneel, et magni maris contra occidéntem fine conclúditur.'
  "12": Hi sunt términi filiórum Iuda per circúitum in cognatiónibus suis.
  "13": 'Caleb vero fílio Iéphone dedit partem in médio filiórum Iuda, sicut præcéperat ei Dóminus: Cáriath Arbe patris Enac, ipsa est Hebron.'
  "14": Delevítque ex ea Caleb tres fílios Enac, Sésai et Ahiman et Thólmai de stirpe Enac.
  "15": Atque inde conscéndens venit ad habitatóres Dabir, quæ prius vocabátur Cáriath Sepher, id est, Cívitas litterárum.
  "16": 'Dixítque Caleb: Qui percússerit Cáriath Sepher, et céperit eam, dabo ei Axam fíliam meam uxórem.'
  "17": 'Cepítque eam Othóniel fílius Cenez frater Caleb iúnior: dedítque ei Axam fíliam suam uxórem.'
  "18": 'Quæ, cum pérgerent simul, suása est a viro suo ut péteret a patre suo agrum, suspiravítque ut sedébat in ásino. Cui Caleb: Quid habes? inquit.'
  "19": 'At illa respóndit: Da mihi benedictiónem: terram austrálem et aréntem dedísti mihi: iunge et irríguam. Dedit ítaque ei Caleb irríguum supérius et inférius.'
  "20": Hæc est posséssio tribus filiórum Iuda per cognatiónes suas.
  "21": 'Erántque civitátes ab extrémis pártibus filiórum Iuda iuxta términos Edom a merídie: Cábseel, et Eder, et Iagur,'
  "22": et Cina, et Dimóna, et Adada,
  "23": et Cades, et Asor, et Iethnam,
  "24": Ziph, et Telem, et Baloth,
  "25": Asor nova, et Cárioth, Hesron, hæc est Asor,
  "26": Amam, Sama, et Mólada,
  "27": et Asergádda, et Hássemon, et Béthphelet,
  "28": et Hasérsual, et Bersabée, et Baziothía,
  "29": et Báala, et Iim, et Esem,
  "30": et Elthólad, et Cesil, et Harma,
  "31": et Síceleg, et Medeména, et Sensénna,
  "32": 'Lébaoth, et Selim, et Aen, et Remon: omnes civitátes vigínti novem, et villæ eárum.'
  "33": 'In campéstribus vero: Estaol, et Sárea, et Asena,'
  "34": et Zánoe, et Engánnim, et Táphua, et Enaim,
  "35": et Iérimoth, et Adúllam, Socho, et Azéca,
  "36": 'et Sáraim, et Adíthaim, et Gedéra, et Gederóthaim: urbes quatuórdecim, et villæ eárum.'
  "37": Sanan, et Hadássa, et Magdálgad,
  "38": Délean, et Másepha, et Iecthel,
  "39": Lachis, et Bascath, et Eglon,
  "40": Chebbon, et Léheman, et Cethlis,
  "41": 'et Gíderoth, et Béthdagon, et Náama, et Macéda: civitátes sédecim, et villæ eárum.'
  "42": Lábana, et Ether, et Asan,
  "43": Iephtha, et Esna, et Nesib,
  "44": 'et Ceíla, et Achzib, et Marésa: civitátes novem, et villæ eárum.'
  "45": Accaron cum vicis et víllulis suis.
  "46": 'Ab Accaron usque ad mare: ómnia quæ vergunt ad Azótum et vículos eius.'
  "47": Azótus cum vicis et víllulis suis. Gaza cum vicis et víllulis suis, usque ad torréntem Ægýpti, et mare magnum términus eius.
  "48": 'Et in monte: Samir, et Iether, et Socoth,'
  "49": 'et Danna, et Cariathsénna, hæc est Dabir:'
  "50": Anab, et Istemo, et Anim,
  "51": 'Gosen, et Olon, et Gilo: civitátes úndecim et villæ eárum.'
  "52": Arab, et Ruma, et Esaan,
  "53": et Ianum, et Beththaphúa, et Apheca,
  "54": 'Athmatha, et Cáriath Arbe, hæc est Hebron, et Sior: civitátes novem, et villæ eárum.'
  "55": Maon, et Carmel, et Ziph, et Iota,
  "56": Iézrael, et Iúcadam, et Zánoe,
  "57": 'Accain, Gábaa, et Thamna: civitátes decem et villæ eárum.'
  "58": Halhul, et Besur, et Gedor,
  "59": 'Mareth, et Béthanoth, et Eltecon: civitátes sex et villæ eárum.'
  "60": 'Cariáthbaal, hæc est Cariathíarim urbs silvárum, et Arébba: civitátes duæ, et villæ eárum.'
  "61": In desérto Betháraba, Meddin, et Sáchacha,
  "62": 'et Nebsan, et cívitas salis, et Engáddi: civitátes sex, et villæ eárum.'
  "63": 'Iebusǽum autem habitatórem Ierúsalem non potuérunt fílii Iuda delére: habitavítque Iebusǽus cum fíliis Iuda in Ierúsalem usque in præséntem diem.'
