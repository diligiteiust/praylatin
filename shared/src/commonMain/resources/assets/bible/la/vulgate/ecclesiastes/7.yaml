bible: vulgate
lang: la
language: Latina
book: Ecclesiastes
chapter: "7"
verses:
  "1": Quid necésse est hómini maióra se quǽrere, cum ignóret quid condúcat sibi in vita sua, número diérum peregrinatiónis suæ, et témpore, quod velut umbra prǽterit? Aut quis ei póterit indicáre quid post eum futúrum sub sole sit?
  "2": 'Mélius est nomen bonum, quam unguénta pretiósa: et dies mortis die nativitátis.'
  "3": 'Mélius est ire ad domum luctus, quam ad domum convívii: in illa enim finis cunctórum admonétur hóminum, et vivens cógitat quid futúrum sit.'
  "4": Mélior est ira risu, quia per tristítiam vultus corrígitur ánimus delinquéntis.
  "5": Cor sapiéntium ubi tristítia est, et cor stultórum ubi lætítia.
  "6": 'Mélius est a sapiénte córripi, quam stultórum adulatióne décipi:'
  "7": 'quia sicut sónitus spinárum ardéntium sub olla, sic risus stulti: sed et hoc vánitas.'
  "8": Calúmnia contúrbat sapiéntem, et perdet robur cordis illíus.
  "9": Mélior est finis oratiónis, quam princípium. Mélior est pátiens arrogánte.
  "10": 'Ne sis velox ad irascéndum: quia ira in sinu stulti requiéscit.'
  "11": 'Ne dicas: Quid putas causæ est quod prióra témpora melióra fuére quam nunc sunt? stulta enim est huiuscémodi interrogátio.'
  "12": Utílior est sapiéntia cum divítiis, et magis prodest vidéntibus solem.
  "13": 'Sicut enim prótegit sapiéntia, sic prótegit pecúnia: hoc autem plus habet erudítio et sapiéntia, quod vitam tríbuunt possessóri suo.'
  "14": Consídera ópera Dei, quod nemo possit corrígere quem ille despéxerit.
  "15": 'In die bona frúere bonis, et malam diem prǽcave: sicut enim hanc, sic et illam fecit Deus, ut non invéniat homo contra eum iustas querimónias.'
  "16": 'Hæc quoque vidi in diébus vanitátis meæ: iustus perit in iustítia sua, et ímpius multo vivit témpore in malítia sua.'
  "17": 'Noli esse iustus multum: neque plus sápias, quam necésse est, ne obstupéscas.'
  "18": 'Ne ímpie agas multum: et noli esse stultus, ne moriáris in témpore non tuo.'
  "19": 'Bonum est te sustentáre iustum, sed et ab illo ne súbtrahas manum tuam: quia qui timet Deum, nihil négligit.'
  "20": Sapiéntia confortávit sapiéntem super decem príncipes civitátis.
  "21": Non est enim homo iustus in terra, qui fáciat bonum, et non peccet.
  "22": 'Sed et cunctis sermónibus, qui dicúntur, ne accómodes cor tuum: ne forte áudias servum tuum maledicéntem tibi.'
  "23": Scit enim consciéntia tua, quia et tu crebro maledixísti áliis.
  "24": 'Cuncta tentávi in sapiéntia. Dixi: Sápiens effíciar: et ipsa lóngius recéssit a me'
  "25": 'multo magis quam erat: et alta profúnditas, quis invéniet eam?'
  "26": 'Lustrávi univérsa ánimo meo, ut scirem et considerárem, et quǽrerem sapiéntiam, et ratiónem: et ut cognóscerem impietátem stulti, et errórem imprudéntium:'
  "27": 'et invéni amariórem morte mulíerem, quæ láqueus venatórum est, et sagéna cor eius: víncula sunt manus illíus. Qui placet Deo, effúgiet illam: qui autem peccátor est, capiétur ab illa.'
  "28": Ecce hoc invéni, dixit Ecclesiástes, unum et álterum ut invenírem ratiónem,
  "29": 'quam adhuc quærit ánima mea, et non invéni. Virum de mille unum réperi: mulíerem ex ómnibus non invéni.'
  "30": Solúmmodo hoc invéni, quod fécerit Deus hóminem rectum, et ipse se infinítis miscúerit quæstiónibus. Quis talis ut sápiens est? et quis cognóvit solutiónem verbi?
