bible: vulgate
lang: la
language: Latina
book: Ezechiel
chapter: "27"
verses:
  "1": 'Et factum est verbum Dómini ad me, dicens:'
  "2": 'Tu ergo fili hóminis, assúme super Tyrum laméntum:'
  "3": 'et dices Tyro, quæ hábitat in intróitu maris, negotiatióni populórum ad ínsulas multas: Hæc dicit Dóminus Deus: O Tyre, tu dixísti: Perfécti decóris ego sum,'
  "4": 'et in corde maris sita. Finítimi tui, qui te ædificavérunt, implevérunt decórem tuum:'
  "5": 'abiétibus de Sanir exstruxérunt te cum ómnibus tabulátis maris: cedrum de Líbano tulérunt ut fácerent tibi malum.'
  "6": Quercus de Basan dolavérunt in remos tuos, et transtra tua fecérunt tibi ex ébore índico, et prætoríola de ínsulis Itáliæ.
  "7": 'Byssus vária de Ægýpto texta est tibi in velum ut ponerétur in malo: hyacínthus, et púrpura de ínsulis Elísa facta sunt operiméntum tuum.'
  "8": 'Habitatóres Sidónis et Arádii fuérunt rémiges tui: sapiéntes tui, Tyre, facti sunt gubernatóres tui.'
  "9": 'Senes Gíblii et prudéntes eius habuérunt nautas ad ministérium váriæ supelléctilis tuæ: omnes naves maris, et nautæ eárum fuérunt in pópulo negotiatiónis tuæ.'
  "10": 'Persæ, et Lýdii, et Líbyes erant in exércitu tuo viri bellatóres tui: clýpeum, et gáleam suspendérunt in te pro ornátu tuo.'
  "11": 'Fílii Arádii cum exércitu tuo erant super muros tuos in circúitu: sed et Pigmǽi, qui erant in túrribus tuis, pháretras suas suspendérunt in muris tuis per gyrum: ipsi complevérunt pulchritúdinem tuam.'
  "12": Carthaginénses negotiatóres tui, a multitúdine cunctárum divitiárum, argénto, ferro, stanno, plumbóque replevérunt núndinas tuas.
  "13": 'Grǽcia, Thubal, et Mosoch, ipsi institóres tui: mancípia, et vasa ǽrea advexérunt pópulo tuo.'
  "14": De domo Thogórma, equos, et équites, et mulos adduxérunt ad forum tuum.
  "15": 'Fílii Dedan negotiatóres tui: ínsulæ multæ, negotiátio manus tuæ: dentes ebúrneos, et hebéninos commutavérunt in prétio tuo.'
  "16": 'Syrus negotiátor tuus propter multitúdinem óperum tuórum: gemmam, et púrpuram, et scutuláta, et byssum, et séricum, et chodchod proposuérunt in mercátu tuo.'
  "17": 'Iuda et terra Israel ipsi institóres tui in fruménto primo: bálsamum, et mel, et óleum, et resínam proposuérunt in núndinis tuis.'
  "18": Damascénus negotiátor tuus in multitúdine óperum tuórum, in multitúdine diversárum opum, in vino pingui, in lanis colóris óptimi.
  "19": 'Dan, et Grǽcia, et Mosel in núndinis tuis proposuérunt ferrum fabrefáctum: stacte, et cálamus in negotiatióne tua.'
  "20": Dedan institóres tui in tapétibus ad sedéndum.
  "21": 'Arábia, et univérsi príncipes Cedar, ipsi negotiatóres manus tuæ: cum agnis, et ariétibus, et hædis, venérunt ad te negotiatóres tui.'
  "22": 'Venditóres Saba et Réema, ipsi negotiatóres tui: cum univérsis primis aromátibus, et lápide pretióso, et auro, quod proposuérunt in mercátu tuo.'
  "23": 'Haran, et Chene, et Eden negotiatóres tui: Saba, Assur, et Chelmad venditóres tui.'
  "24": 'Ipsi negotiatóres tui multifáriam involúcris hyacínthi, et polymitórum, gazarúmque pretiosárum, quæ obvolútæ, et astríctæ erant fúnibus: cedros quoque habébant in negotiatiónibus tuis.'
  "25": 'Naves maris, príncipes tui in negotiatióne tua: et repléta es, et glorificáta nimis in corde maris.'
  "26": 'In aquis multis adduxérunt te rémiges tui: ventus auster contrívit te in corde maris.'
  "27": 'Divítiæ tuæ, et thesáuri tui, et múltiplex instruméntum tuum: nautæ tui, et gubernatóres tui, qui tenébant supelléctilem tuam, et pópulo tuo prǽerant: viri quoque bellatóres tui, qui erant in te, cum univérsa multitúdine tua, quæ est in médio tui, cadent in corde maris in die ruínæ tuæ.'
  "28": 'A sónitu clamóris gubernatórum tuórum conturbabúntur classes:'
  "29": 'et descéndent de návibus suis omnes, qui tenébant remum: nautæ et univérsi gubernatóres maris in terra stabunt:'
  "30": 'et eiulábunt super te voce magna, et clamábunt amáre: et superiácient púlverem capítibus suis, et cínere conspergéntur.'
  "31": 'Et radent super te calvítium, et accingéntur cilíciis: et plorábunt te in amaritúdine ánimæ, plorátu amaríssimo.'
  "32": 'Et assúment super te carmen lúgubre, et plangent te: Quæ est ut Tyrus, quæ obmútuit in médio maris?'
  "33": 'Quæ in éxitu negotiatiónum tuárum de mari implésti pópulos multos: in multitúdine divitiárum tuárum, et populórum tuórum ditásti reges terræ.'
  "34": Nunc contríta es a mari, in profúndis aquárum opes tuæ, et omnis multitúdo tua, quæ erat in médio tui, cecidérunt.
  "35": 'Univérsi habitatóres insulárum obstupuérunt super te: et reges eárum omnes tempestáte percúlsi mutavérunt vultus.'
  "36": 'Negotiatóres populórum sibilavérunt super te: ad níhilum dedúcta es, et non eris usque in perpétuum.'
