bible: vulgate
lang: la
language: Latina
book: Matthaeus
chapter: "10"
verses:
  "1": Et convocátis duódecim discípulis suis, dedit illis potestátem spirítuum immundórum, ut eícerent eos, et curárent omnem languórem, et omnem infirmitátem.
  "2": 'Duódecim autem Apostolórum nómina sunt hæc. Primus, Simon, qui dícitur Petrus: et Andréas frater eius,'
  "3": Iacóbus Zebedǽi, et Ioánnes frater eius, Philíppus, et Bartholomǽus, Thomas, et Matthǽus publicánus, Iacóbus Alphǽi, et Thaddǽus,
  "4": Simon Chananǽus, et Iudas Iscariótes, qui et trádidit eum.
  "5": 'Hos duódecim misit Iesus, præcípiens eis, dicens: In viam géntium ne abiéritis, et in civitátes Samaritanórum ne intravéritis:'
  "6": sed pótius ite ad oves, quæ periérunt domus Israel.
  "7": 'Eúntes autem prædicáte, dicéntes: Quia appropinquávit regnum cælórum.'
  "8": 'Infírmos curáte, mórtuos suscitáte, leprósos mundáte, dǽmones eícite: gratis accepístis, gratis date.'
  "9": 'Nolíte possidére aurum, neque argéntum, neque pecúniam in zonis vestris:'
  "10": 'non peram in via, neque duas túnicas, neque calceaménta, neque virgam: dignus enim est operárius cibo suo.'
  "11": 'In quamcúmque autem civitátem, aut castéllum intravéritis, interrogáte, quis in ea dignus sit: et ibi manéte donec exeátis.'
  "12": 'Intrántes autem in domum, salutáte eam, dicéntes: Pax huic dómui.'
  "13": 'Et si quidem fúerit domus illa digna, véniet pax vestra super eam: si autem non fúerit digna, pax vestra revertétur ad vos.'
  "14": 'Et quicúmque non recéperit vos, neque audíerit sermónes vestros: exeúntes foras de domo, vel civitáte, excútite púlverem de pédibus vestris.'
  "15": 'Amen dico vobis: Tolerabílius erit terræ Sodomórum, et Gomorrhæórum in die iudícii, quam illi civitáti.'
  "16": Ecce ego mitto vos sicut oves in médio lupórum. Estóte ergo prudéntes sicut serpéntes, et símplices sicut colúmbæ.
  "17": 'Cavéte autem ab homínibus. Tradent enim vos in concíliis, et in synagógis suis flagellábunt vos:'
  "18": et ad prǽsides, et ad reges ducémini propter me in testimónium illis, et géntibus.
  "19": 'Cum autem tradent vos, nolíte cogitáre quómodo, aut quid loquámini: dábitur enim vobis in illa hora, quid loquámini:'
  "20": non enim vos estis qui loquímini, sed Spíritus Patris vestri, qui lóquitur in vobis.
  "21": 'Tradet autem frater fratrem in mortem, et pater fílium: et insúrgent fílii in paréntes, et morte eos affícient:'
  "22": 'et éritis ódio ómnibus propter nomen meum: qui autem perseveráverit usque in finem, hic salvus erit.'
  "23": Cum autem persequéntur vos in civitáte ista, fúgite in áliam. Amen dico vobis, non consummábitis civitátes Israel, donec véniat Fílius hóminis.
  "24": 'Non est discípulus super magístrum, nec servus super dóminum suum:'
  "25": súfficit discípulo ut sit sicut magíster eius, et servo, sicut dóminus eius. Si patremfamílias Beélzebub vocavérunt, quanto magis domésticos eius?
  "26": 'Ne ergo timuéritis eos. Nihil enim est opértum, quod non revelábitur: et occúltum, quod non sciétur.'
  "27": 'Quod dico vobis in ténebris, dícite in lúmine: et quod in aure audítis, prædicáte super tecta.'
  "28": 'Et nolíte timére eos, qui occídunt corpus, ánimam autem non possunt occídere: sed pótius timéte eum, qui potest et ánimam, et corpus pérdere in gehénnam.'
  "29": 'Nonne duo pásseres asse véneunt: et unus ex illis non cadet super terram sine Patre vestro?'
  "30": Vestri autem capílli cápitis omnes numeráti sunt.
  "31": 'Nolíte ergo timére: multis passéribus melióres estis vos.'
  "32": Omnis ergo, qui confitébitur me coram homínibus, confitébor et ego eum coram Patre meo, qui in cælis est.
  "33": Qui autem negáverit me coram homínibus, negábo et ego eum coram Patre meo, qui in cælis est.
  "34": 'Nolíte arbitrári quia pacem vénerim míttere in terram: non veni pacem míttere, sed gládium:'
  "35": 'veni enim separáre hóminem advérsus patrem suum, et fíliam advérsus matrem suam, et nurum advérsus socrum suam:'
  "36": et inimíci hóminis, doméstici eius.
  "37": 'Qui amat patrem, aut matrem plus quam me, non est me dignus: et qui amat fílium, aut fíliam super me, non est me dignus.'
  "38": Et qui non áccipit crucem suam, et séquitur me, non est me dignus.
  "39": 'Qui ínvenit ánimam suam, perdet illam: et qui perdíderit ánimam suam propter me, invéniet eam.'
  "40": 'Qui récipit vos, me récipit: et qui me récipit, récipit eum, qui me misit.'
  "41": 'Qui récipit prophétam in nómine prophétæ, mercédem prophétæ accípiet: et qui récipit iustum in nómine iusti, mercédem iusti accípiet.'
  "42": 'Et quicúmque potum déderit uni ex mínimis istis cálicem aquæ frígidæ tantum in nómine discípuli: amen dico vobis, non perdet mercédem suam.'
