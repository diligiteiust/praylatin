bible: vulgate
lang: la
language: Latina
book: Lucas
chapter: "6"
verses:
  "1": Factum est autem in sábbato secúndo, primo, cum transíret per sata, vellébant discípuli eius spicas, et manducábant confricántes mánibus.
  "2": 'Quidam autem Pharisæórum, dicébant illis: Quid fácitis quod non licet in sábbatis?'
  "3": 'Et respóndens Iesus ad eos, dixit: Nec hoc legístis quod fecit David, cum esurísset ipse, et qui cum illo erant:'
  "4": 'quómodo intrávit in domum Dei, et panes propositiónis sumpsit, et manducávit, et dedit his, qui cum ipso erant: quos non licet manducáre nisi tantum sacerdótibus?'
  "5": 'Et dicébat illis: Quia dóminus est Fílius hóminis étiam sábbati.'
  "6": Factum est autem in álio sábbato, ut intráret in synagógam, et docéret. Et erat ibi homo, et manus eius dextra erat árida.
  "7": Observábant autem scribæ, et Pharisǽi si in sábbato curáret, ut invenírent unde accusárent eum.
  "8": 'Ipse vero sciébat cogitatiónes eórum: et ait hómini, qui habébat manum áridam: Surge, et sta in médium. Et surgens stetit.'
  "9": 'Ait autem ad illos Iesus: Intérrogo vos si licet sábbatis benefácere, an male: ánimam salvam fácere, an pérdere?'
  "10": 'Et circumspéctis ómnibus dixit hómini: Exténde manum tuam. Et exténdit: et restitúta est manus eius.'
  "11": Ipsi autem repléti sunt insipiéntia, et colloquebántur ad ínvicem, quidnam fácerent Iesu.
  "12": Factum est autem in illis diébus, éxiit in montem oráre, et erat pernóctans in oratióne Dei.
  "13": 'Et cum dies factus esset, vocávit discípulos suos: et elégit duódecim ex ipsis (quos et apóstolos nominávit):'
  "14": Simónem, quem cognominávit Petrum, et Andréam fratrem eius, Iacóbum, et Ioánnem, Philíppum, et Bartholomǽum,
  "15": Matthǽum, et Thomam, Iacóbum Alphǽi, et Simónem, qui vocátur Zelótes,
  "16": et Iudam Iacóbi, et Iudam Iscariótem, qui fuit próditor.
  "17": Et descéndens cum illis, stetit in loco campéstri, et turba discipulórum eius, et multitúdo copiósa plebis ab omni Iudǽa, et Ierúsalem, et marítima, et Tyri, et Sidónis,
  "18": qui vénerant ut audírent eum, et sanaréntur a languóribus suis. Et qui vexabántur a spirítibus immúndis, curabántur.
  "19": 'Et omnis turba quærébat eum tángere: quia virtus de illo exíbat, et sanábat omnes.'
  "20": 'Et ipse elevátis óculis in discípulos suos, dicébat: Beáti páuperes, quia vestrum est regnum Dei.'
  "21": Beáti, qui nunc esurítis, quia saturabímini. Beáti, qui nunc fletis, quia ridébitis.
  "22": Beáti éritis cum vos óderint hómines, et cum separáverint vos, et exprobráverint, et eiécerint nomen vestrum tamquam malum propter Fílium hóminis.
  "23": 'Gaudéte in illa die, et exsultáte: ecce enim merces vestra multa est in cælo: secúndum hæc enim faciébant prophétis patres eórum.'
  "24": Verúmtamen væ vobis divítibus, quia habétis consolatiónem vestram.
  "25": 'Væ vobis, qui saturáti estis: quia esuriétis. Væ vobis, qui ridétis nunc: quia lugébitis et flébitis.'
  "26": 'Væ cum benedíxerint vobis hómines: secúndum hæc enim faciébant pseudoprophétis patres eórum.'
  "27": 'Sed vobis dico, qui audítis: dilígite inimícos vestros, benefácite his qui odérunt vos.'
  "28": Benedícite maledicéntibus vobis, et oráte pro calumniántibus vos.
  "29": Et qui te pércutit in maxíllam, præbe et álteram. Et ab eo, qui aufert tibi vestiméntum, étiam túnicam noli prohibére.
  "30": 'Omni autem peténti te, tríbue: et qui aufert quæ tua sunt, ne répetas.'
  "31": Et prout vultis ut fáciant vobis hómines, et vos fácite illis simíliter.
  "32": Et si dilígitis eos, qui vos díligunt, quæ vobis est grátia? nam et peccatóres diligéntes se díligunt.
  "33": Et si benefecéritis his, qui vobis benefáciunt, quæ vobis est grátia? síquidem et peccatóres hoc fáciunt.
  "34": Et si mútuum dedéritis his, a quibus sperátis recípere, quæ grátia est vobis? nam et peccatóres peccatóribus fœnerántur, ut recípiant æquália.
  "35": 'Verúmtamen dilígite inimícos vestros: benefácite, et mútuum date, nihil inde sperántes: et erit merces vestra multa, et éritis fílii Altíssimi, quia ipse benígnus est super ingrátos et malos.'
  "36": Estóte ergo misericórdes sicut et Pater vester miséricors est.
  "37": 'Nolíte iudicáre, et non iudicabímini: nolíte condemnáre, et non condemnabímini. Dimíttite, et dimittémini.'
  "38": 'Date, et dábitur vobis: mensúram bonam, et confértam, et coagitátam, et supereffluéntem dabunt in sinum vestrum. Eádem quippe mensúra, qua mensi fuéritis, remetiétur vobis.'
  "39": 'Dicébat autem illis et similitúdinem: Numquid potest cæcus cæcum dúcere? nonne ambo in fóveam cadunt?'
  "40": 'Non est discípulus super magístrum: perféctus autem omnis erit, si sit sicut magíster eius.'
  "41": Quid autem vides festúcam in óculo fratris tui, trabem autem, quæ in óculo tuo est, non consíderas?
  "42": 'aut quómodo potes dícere fratri tuo: Frater, sine eíciam festúcam de óculo tuo: ipse in óculo tuo trabem non videns? Hypócrita, éice primum trabem de óculo tuo: et tunc perspícies ut edúcas festúcam de óculo fratris tui.'
  "43": 'Non est enim arbor bona, quæ facit fructus malos: neque arbor mala, fáciens fructum bonum.'
  "44": 'Unaquǽque enim arbor de fructu suo cognóscitur. Neque enim de spinis cólligunt ficus: neque de rubo vindémiant uvam.'
  "45": 'Bonus homo de bono thesáuro cordis sui profert bonum: et malus homo de malo thesáuro profert malum. Ex abundántia enim cordis os lóquitur.'
  "46": 'Quid autem vocátis me Dómine, Dómine: et non fácitis quæ dico?'
  "47": 'Omnis, qui venit ad me, et audit sermónes meos, et facit eos, osténdam vobis cui símilis sit:'
  "48": 'símilis est hómini ædificánti domum, qui fodit in altum, et pósuit fundaméntum super petram: inundatióne autem facta, illísum est flumen dómui illi, et non pótuit eam movére: fundáta enim erat super petram.'
  "49": 'Qui autem audit, et non facit, símilis est hómini ædificánti domum suam super terram sine fundaménto: in quam illísus est flúvius, et contínuo cécidit: et facta est ruína domus illíus magna.'
