bible: vulgate
lang: la
language: Latina
book: Osee
chapter: "2"
verses:
  "1": 'Dícite frátribus vestris: Pópulus meus: et soróri vestræ, Misericórdiam consecúta.'
  "2": 'Iudicáte matrem vestram, iudicáte: quóniam ipsa non uxor mea, et ego non vir eius: áuferat fornicatiónes suas a fácie sua, et adultéria sua de médio úberum suórum.'
  "3": 'Ne forte exspóliem eam nudam, et státuam eam secúndum diem nativitátis suæ: et ponam eam quasi solitúdinem, et státuam eam velut terram ínviam, et interfíciam eam siti.'
  "4": 'Et filiórum illíus non miserébor: quóniam fílii fornicatiónum sunt.'
  "5": 'Quia fornicáta est mater eórum, confúsa est quæ concépit eos: quia dixit: Vadam post amatóres meos, qui dant panes mihi, et aquas meas, lanam meam, et linum meum, óleum meum, et potum meum.'
  "6": Propter hoc ecce ego sépiam viam tuam spinis, et sépiam eam macéria, et sémitas suas non invéniet.
  "7": 'Et sequétur amatóres suos, et non apprehéndet eos: et quæret eos, et non invéniet, et dicet: Vadam, et revértar ad virum meum priórem: quia bene mihi erat tunc magis quam nunc.'
  "8": Et hæc nescívit, quia ego dedi ei fruméntum, et vinum, et óleum, et argéntum multiplicávi ei, et aurum, quæ fecérunt Baal.
  "9": Idcírco convértar, et sumam fruméntum meum in témpore suo, et vinum meum in témpore suo, et liberábo lanam meam et linum meum, quæ operiébant ignomíniam eius.
  "10": 'Et nunc revelábo stultítiam eius in óculis amatórum eius: et vir non éruet eam de manu mea:'
  "11": et cessáre fáciam omne gáudium eius, solemnitátem eius, neoméniam eius, sábbatum eius, et ómnia festa témpora eius.
  "12": 'Et corrúmpam víneam eius, et ficum eius: de quibus dixit: Mercédes hæ meæ sunt, quas dedérunt mihi amatóres mei: et ponam eam in saltum, et cómedet eam béstia agri.'
  "13": Et visitábo super eam dies Báalim, quibus accendébat incénsum, et ornabátur ináure sua, et moníli suo, et ibat post amatóres suos, et mei obliviscebátur, dicit Dóminus.
  "14": 'Propter hoc ecce ego lactábo eam, et ducam eam in solitúdinem: et loquar ad cor eius.'
  "15": 'Et dabo ei vinitóres eius ex eódem loco, et vallem Achor ad aperiéndam spem: et canet ibi iuxta dies iuventútis suæ, et iuxta dies ascensiónis suæ de terra Ægýpti.'
  "16": 'Et erit in die illa, ait Dóminus: vocábit me, Vir meus: et non vocábit me ultra Báali.'
  "17": Et áuferam nómina Báalim de ore eius, et non recordábitur ultra nóminis eórum.
  "18": 'Et percútiam cum eis fœdus in die illa, cum béstia agri, et cum vólucre cæli, et cum réptili terræ: et arcum, et gládium, et bellum cónteram de terra: et dormíre eos fáciam fiduciáliter.'
  "19": 'Et sponsábo te mihi in sempitérnum: et sponsábo te mihi in iustítia, et iudício, et in misericórdia, et in miseratiónibus.'
  "20": 'Et sponsábo te mihi in fide: et scies quia ego Dóminus.'
  "21": 'Et erit in die illa: Exáudiam, dicit Dóminus, exáudiam cælos, et illi exáudient terram.'
  "22": 'Et terra exáudiet tríticum, et vinum, et óleum: et hæc exáudient Iézrahel.'
  "23": Et seminábo eam mihi in terra, et miserébor eius, quæ fuit Absque misericórdia.
  "24": 'Et dicam non pópulo meo: Pópulus meus es tu: et ipse dicet: Deus meus es tu.'
