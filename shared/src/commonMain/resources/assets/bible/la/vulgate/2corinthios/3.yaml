bible: vulgate
lang: la
language: Latina
book: ad Corinthios II
chapter: "3"
verses:
  "1": Incípimus íterum nosmetípsos commendáre? aut numquid egémus (sicut quidam) commendatítiis epístolis ad vos, aut ex vobis?
  "2": 'Epístola nostra vos estis, scripta in córdibus nostris, quæ scitur, et légitur ab ómnibus homínibus:'
  "3": 'manifestáti quod epístola estis Christi, ministráta a nobis, et scripta non atraménto, sed Spíritu Dei vivi: non in tábulis lapídeis, sed in tábulis cordis carnálibus.'
  "4": 'Fidúciam autem talem habémus per Christum ad Deum:'
  "5": 'non quod sufficiéntes simus cogitáre áliquid a nobis, quasi ex nobis: sed sufficiéntia nostra ex Deo est:'
  "6": 'qui et idóneos nos fecit minístros novi testaménti: non líttera, sed Spíritu: líttera enim occídit, Spíritus autem vivíficat.'
  "7": 'Quod si ministrátio mortis lítteris deformáta in lapídibus fuit in glória, ita ut non possent inténdere fílii Israel in fáciem Móysi propter glóriam vultus eius, quæ evacuátur:'
  "8": quómodo non magis ministrátio spíritus erit in glória?
  "9": 'Nam si ministrátio damnatiónis glória est: multo magis abúndat ministérium iustítiæ in glória.'
  "10": Nam nec glorificátum est, quod cláruit in hac parte, propter excelléntem glóriam.
  "11": 'Si enim quod evacuátur, per glóriam est: multo magis quod manet, in glória est.'
  "12": 'Habéntes ígitur talem spem, multa fidúcia útimur:'
  "13": et non sicut Móyses ponébat velámen super fáciem suam, ut non inténderent fílii Israel in fáciem eius, quod evacuátur,
  "14": sed obtúsi sunt sensus eórum. Usque in hodiérnum enim diem, idípsum velámen in lectióne véteris testaménti manet non revelátum (quóniam in Christo evacuátur),
  "15": sed usque in hodiérnum diem, cum légitur Móyses, velámen pósitum est super cor eórum.
  "16": Cum autem convérsus fúerit ad Dóminum, auferétur velámen.
  "17": 'Dóminus autem Spíritus est: ubi autem Spíritus Dómini, ibi libértas.'
  "18": Nos vero omnes, reveláta fácie glóriam Dómini speculántes, in eámdem imáginem transformámur a claritáte in claritátem, tamquam a Dómini Spíritu.
