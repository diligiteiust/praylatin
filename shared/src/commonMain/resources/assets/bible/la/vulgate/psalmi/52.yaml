bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "52"
verses:
  "1": 'In finem, Pro Máeleth intelligéntiæ David. Dixit insípiens in corde suo: Non est Deus.'
  "2": 'Corrúpti sunt, et abominábiles facti sunt in iniquitátibus: non est qui fáciat bonum.'
  "3": 'Deus de cælo prospéxit super fílios hóminum: ut vídeat si est intélligens, aut requírens Deum.'
  "4": 'Omnes declinavérunt, simul inútiles facti sunt: non est qui fáciat bonum, non est usque ad unum.'
  "5": Nonne scient omnes qui operántur iniquitátem, qui dévorant plebem meam ut cibum panis?
  "6": 'Deum non invocavérunt: illic trepidavérunt timóre, ubi non erat timor. Quóniam Deus dissipávit ossa eórum qui homínibus placent: confúsi sunt, quóniam Deus sprevit eos.'
  "7": Quis dabit ex Sion salutáre Israel? cum convérterit Deus captivitátem plebis suæ, exsultábit Iacob, et lætábitur Israel.
