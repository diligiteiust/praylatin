bible: vulgate
lang: la
language: Latina
book: Actus Apostolorum
chapter: "16"
verses:
  "1": Pervénit autem Derben et Lystram. Et ecce discípulus quidam erat ibi nómine Timótheus, fílius mulíeris Iudǽæ fidélis, patre gentíli.
  "2": Huic testimónium bonum reddébant qui in Lystris erant, et Icónio fratres.
  "3": 'Hunc vóluit Paulus secum proficísci: et assúmens circumcídit eum propter Iudǽos, qui erant in illis locis. Sciébant enim omnes quod pater eius erat gentílis.'
  "4": Cum autem pertransírent civitátes, tradébant eis custodíri dógmata, quæ erant decréta ab Apóstolis et senióribus, qui erant Ierosólymis.
  "5": Et ecclésiæ quidem confirmabántur fide, et abundábant número quotídie.
  "6": Transeúntes autem Phrýgiam, et Galátiæ regiónem, vetáti sunt a Spíritu sancto loqui verbum Dei in Asia.
  "7": 'Cum veníssent autem in Mýsiam, tentábant ire in Bithýniam: et non permísit eos Spíritus Iesu.'
  "8": 'Cum autem pertransíssent Mýsiam, descendérunt Tróadem:'
  "9": 'et vísio per noctem Paulo osténsa est: vir Mácedo quidam erat stans, et déprecans eum, et dicens: Tránsiens in Macedóniam, ádiuva nos.'
  "10": Ut autem visum vidit, statim quæsívimus proficísci in Macedóniam, certi facti quod vocásset nos Deus evangelizáre eis.
  "11": 'Navigántes autem a Tróade, recto cursu vénimus Samothráciam, et sequénti die Neápolim:'
  "12": et inde Philíppos, quæ est prima partis Macedóniæ cívitas, colónia. Erámus autem in hac urbe diébus áliquot, conferéntes.
  "13": 'Die autem sabbatórum egréssi sumus foras portam iuxta flumen, ubi videbátur orátio esse: et sedéntes loquebámur muliéribus, quæ convénerant.'
  "14": 'Et quædam múlier nómine Lýdia, purpurária civitátis Thyatirenórum, colens Deum, audívit: cuius Dóminus apéruit cor inténdere his, quæ dicebántur a Paulo.'
  "15": 'Cum autem baptizáta esset, et domus eius, deprecáta est, dicens: Si iudicástis me fidélem Dómino esse, introíte in domum meam, et manéte. Et coégit nos.'
  "16": Factum est autem eúntibus nobis ad oratiónem, puéllam quamdam habéntem spíritum pythónem obviáre nobis, quæ quæstum magnum præstábat dóminis suis divinándo.
  "17": 'Hæc subsecúta Paulum, et nos, clamábat dicens: Isti hómines servi Dei excélsi sunt, qui annúntiant vobis viam salútis.'
  "18": 'Hoc autem faciébat multis diébus. Dolens autem Paulus, et convérsus, spirítui dixit: Præcípio tibi in nómine Iesu Christi exíre ab ea. Et éxiit eádem hora.'
  "19": 'Vidéntes autem dómini eius quia exívit spes quæstus eórum, apprehendéntes Paulum, et Silam perduxérunt in forum ad príncipes:'
  "20": 'et offeréntes eos magistrátibus, dixérunt: Hi hómines contúrbant civitátem nostram, cum sint Iudǽi:'
  "21": et annúntiant morem, quem non licet nobis suscípere neque fácere, cum simus Románi.
  "22": 'Et cucúrrit plebs advérsus eos: et magistrátus, scissis túnicis eórum, iussérunt eos virgis cædi.'
  "23": Et cum multas plagas eis imposuíssent, misérunt eos in cárcerem, præcipiéntes custódi ut diligénter custodíret eos.
  "24": Qui cum tale præcéptum accepísset, misit eos in interiórem cárcerem, et pedes eórum strinxit ligno.
  "25": 'Média autem nocte Paulus, et Silas orántes, laudábant Deum: et audiébant eos, qui in custódia erant.'
  "26": 'Súbito vero terræmótus factus est magnus, ita ut moveréntur fundaménta cárceris. Et statim apérta sunt ómnia óstia: et universórum víncula solúta sunt.'
  "27": Expergefáctus autem custos cárceris, et videns iánuas apértas cárceris, evagináto gládio volébat se interfícere, ǽstimans fugísse vinctos.
  "28": 'Clamávit autem Paulus voce magna, dicens: Nihil tibi mali féceris: univérsi enim hic sumus.'
  "29": 'Petitóque lúmine, introgréssus est: et tremefáctus prócidit Paulo et Silæ ad pedes:'
  "30": 'et prodúcens eos foras, ait: Dómini, quid me opórtet fácere, ut salvus fiam?'
  "31": 'At illi dixérunt: Crede in Dóminum Iesum, et salvus eris tu, et domus tua.'
  "32": Et locúti sunt ei verbum Dómini cum ómnibus, qui erant in domo eius.
  "33": 'Et tollens eos in illa hora noctis, lavit plagas eórum: et baptizátus est ipse, et omnis domus eius contínuo.'
  "34": Cumque perduxísset eos in domum suam, appósuit eis mensam, et lætátus est cum omni domo sua credens Deo.
  "35": 'Et cum dies factus esset, misérunt magistrátus lictóres, dicéntes: Dimítte hómines illos.'
  "36": 'Nuntiávit autem custos cárceris verba hæc Paulo: Quia misérunt magistrátus ut dimittámini: nunc ígitur exeúntes, ite in pace.'
  "37": 'Paulus autem dixit eis: Cæsos nos públice, indemnátos hómines Romános, misérunt in cárcerem: et nunc occúlte nos eíciunt? Non ita: sed véniant,'
  "38": 'et ipsi nos eíciant. Nuntiavérunt autem magistrátibus lictóres verba hæc. Timuerúntque audíto quod Románi essent:'
  "39": et veniéntes deprecáti sunt eos, et educéntes rogábant ut egrederéntur de urbe.
  "40": 'Exeúntes autem de cárcere, introiérunt ad Lýdiam: et visis frátribus consoláti sunt eos, et profécti sunt.'
