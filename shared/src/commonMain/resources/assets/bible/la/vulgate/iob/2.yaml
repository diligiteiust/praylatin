bible: vulgate
lang: la
language: Latina
book: Iob
chapter: "2"
verses:
  "1": Factum est autem, cum quadam die veníssent fílii Dei, et starent coram Dómino, venísset quoque Satan inter eos, et staret in conspéctu eius,
  "2": 'ut díceret Dóminus ad Satan: Unde venis? Qui respóndens ait: Circuívi terram, et perambulávi eam.'
  "3": 'Et dixit Dóminus ad Satan: Numquid considerásti servum meum Iob, quod non sit ei símilis in terra, vir simplex, et rectus, ac timens Deum, et recédens a malo, et adhuc rétinens innocéntiam? Tu autem commovísti me advérsus eum, ut afflígerem eum frustra.'
  "4": 'Cui respóndens Satan, ait: Pellem pro pelle, et cuncta quæ habet homo, dabit pro ánima sua.'
  "5": Alióquin mitte manum tuam, et tange os eius et carnem, et tunc vidébis quod in fáciem benedícat tibi.
  "6": 'Dixit ergo Dóminus ad Satan: Ecce in manu tua est: verúmtamen ánimam illíus serva.'
  "7": 'Egréssus ígitur Satan a fácie Dómini, percússit Iob úlcere péssimo, a planta pedis usque ad vérticem eius:'
  "8": qui testa sániem radébat, sedens in sterquilínio.
  "9": 'Dixit autem illi uxor sua: Adhuc tu pérmanes in simplicitáte tua? bénedic Deo et mórere.'
  "10": 'Qui ait ad illam: Quasi una de stultis muliéribus locúta es: si bona suscépimus de manu Dei, mala quare non suscipiámus? In ómnibus his non peccávit Iob lábiis suis.'
  "11": Igitur audiéntes tres amíci Iob omne malum, quod accidísset ei, venérunt sínguli de loco suo, Eliphaz Themanítes, et Baldad Suhítes, et Sophar Naamathítes. Condíxerant enim, ut páriter veniéntes visitárent eum, et consolaréntur.
  "12": Cumque elevássent procul óculos suos, non cognovérunt eum, et exclamántes ploravérunt, scissísque véstibus sparsérunt púlverem super caput suum in cælum.
  "13": 'Et sedérunt cum eo in terra septem diébus et septem nóctibus, et nemo loquebátur ei verbum: vidébant enim dolórem esse veheméntem.'
