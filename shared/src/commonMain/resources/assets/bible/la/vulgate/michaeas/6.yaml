bible: vulgate
lang: la
language: Latina
book: Michaeas
chapter: "6"
verses:
  "1": 'Audíte quæ Dóminus lóquitur: Surge, conténde iudício advérsum montes, et áudiant colles vocem tuam.'
  "2": 'Audiant montes iudícium Dómini, et fórtia fundaménta terræ: quia iudícium Dómini cum pópulo suo, et cum Israel diiudicábitur.'
  "3": Pópule meus quid feci tibi, aut quid moléstus fui tibi? respónde mihi.
  "4": 'Quia edúxi te de terra Ægýpti, et de domo serviéntium liberávi te: et misi ante fáciem tuam Móysen, et Aaron, et Maríam?'
  "5": Pópule meus meménto quæso quid cogitáverit Balach rex Moab, et quid respónderit ei Bálaam, fílius Beor, de Setim usque ad Gálgalam, ut cognósceres iustítias Dómini.
  "6": Quid dignum ófferam Dómino? curvábo genu Deo excélso? numquid ófferam ei holocautómata, et vítulos annículos?
  "7": Numquid placári potest Dóminus in míllibus aríetum, aut in multis míllibus hircórum pínguium? numquid dabo primogénitum meum pro scélere meo, fructum ventris mei pro peccáto ánimæ meæ?
  "8": 'Indicábo tibi o homo quid sit bonum, et quid Dóminus requírat a te: Utique fácere iudícium, et dilígere misericórdiam, et sollícitum ambuláre cum Deo tuo.'
  "9": 'Vox Dómini ad civitátem clamat, et salus erit timéntibus nomen tuum: Audíte tribus, et quis approbábit illud?'
  "10": Adhuc ignis in domo ímpii thesáuri iniquitátis, et mensúra minor iræ plena.
  "11": Numquid iustificábo statéram ímpiam, et saccélli póndera dolósa?
  "12": in quibus dívites eius repléti sunt iniquitáte, et habitántes in ea loquebántur mendácium, et lingua eórum fraudulénta in ore eórum.
  "13": Et ego ergo cœpi percútere te perditióne super peccátis tuis.
  "14": 'Tu cómedes, et non saturáberis, et humiliátio tua in médio tui: et apprehéndes, et non salvábis: et quos salváveris, in gládium dabo.'
  "15": 'Tu seminábis, et non metes: tu calcábis olívam, et non ungéris óleo: et mustum, et non bibes vinum.'
  "16": 'Et custodísti præcépta Amri, et omne opus domus Achab: et ambulásti in voluntátibus eórum, ut darem te in perditiónem, et habitántes in ea in síbilum, et oppróbrium pópuli mei portábitis.'
