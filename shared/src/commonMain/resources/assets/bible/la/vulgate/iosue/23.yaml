bible: vulgate
lang: la
language: Latina
book: Iosue
chapter: "23"
verses:
  "1": 'Evolúto autem multo témpore, postquam pacem déderat Dóminus Israéli, subiéctis in gyro natiónibus univérsis, et Iósue iam longǽvo, et persenílis ætátis:'
  "2": 'vocávit Iósue omnem Israélem, maiorésque natu, et príncipes ac duces, et magístros, dixítque ad eos: Ego sénui, et progressióris ætátis sum:'
  "3": 'vosque cérnitis ómnia, quæ fécerit Dóminus Deus vester cunctis per circúitum natiónibus, quómodo pro vobis ipse pugnáverit:'
  "4": 'et nunc quia vobis sorte divísit omnem terram, ab orientáli parte Iordánis usque ad mare magnum, multǽque adhuc supérsunt natiónes:'
  "5": Dóminus Deus vester dispérdet eas et áuferet a fácie vestra, et possidébitis terram, sicut vobis pollícitus est.
  "6": 'Tantum confortámini, et estóte sollíciti, ut custodiátis cuncta quæ scripta sunt in volúmine legis Móysi: et non declinétis ab eis neque ad déxteram neque ad sinístram:'
  "7": 'ne postquam intravéritis ad gentes, quæ inter vos futúræ sunt, iurétis in nómine deórum eárum, et serviátis eis, et adorétis illos:'
  "8": 'sed adhæreátis Dómino Deo vestro: quod fecístis usque in diem hanc.'
  "9": Et tunc áuferet Dóminus Deus in conspéctu vestro gentes magnas et robustíssimas, et nullus vobis resístere póterit.
  "10": 'Unus e vobis persequétur hóstium mille viros: quia Dóminus Deus vester pro vobis ipse pugnábit, sicut pollícitus est.'
  "11": 'Hoc tantum diligentíssime præcavéte: ut diligátis Dóminum Deum vestrum.'
  "12": 'Quod si voluéritis géntium harum, quæ inter vos hábitant, erróribus adhærére, et cum eis miscére connúbia, atque amicítias copuláre:'
  "13": iam nunc scitóte quod Dóminus Deus vester non eas déleat ante fáciem vestram, sed sint vobis in fóveam ac láqueum, et offendículum ex látere vestro, et sudes in óculis vestris, donec vos áuferat atque dispérdat de terra hac óptima, quam trádidit vobis.
  "14": En ego hódie ingrédior viam univérsæ terræ, et toto ánimo cognoscétis quod de ómnibus verbis, quæ se Dóminus præstitúrum vobis esse pollícitus est, unum non præteríerit incássum.
  "15": 'Sicut ergo implévit ópere quod promísit, et próspera cuncta venérunt: sic addúcet super vos quidquid malórum comminátus est, donec vos áuferat atque dispérdat de terra hac óptima, quam trádidit vobis,'
  "16": 'eo quod præteriéritis pactum Dómini Dei vestri, quod pépigit vobíscum, et serviéritis diis aliénis, et adoravéritis eos: cito atque velóciter consúrget in vos furor Dómini, et auferémini ab hac terra óptima, quam trádidit vobis.'
