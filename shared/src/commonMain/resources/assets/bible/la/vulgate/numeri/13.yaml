bible: vulgate
lang: la
language: Latina
book: Numeri
chapter: "13"
verses:
  "1": Profectúsque est pópulus de Háseroth, fixis tentóriis in desérto Pharan.
  "2": 'Ibíque locútus est Dóminus ad Móysen, dicens:'
  "3": Mitte viros, qui consíderent terram Chánaan, quam datúrus sum fíliis Israel, síngulos de síngulis tríbubus, ex princípibus.
  "4": Fecit Móyses quod Dóminus imperáverat, de desérto Pharan mittens príncipes viros, quorum ista sunt nómina.
  "5": De tribu Ruben, Sámmua fílium Zechur.
  "6": De tribu Símeon, Saphat fílium Huri.
  "7": De tribu Iuda, Caleb fílium Iéphone.
  "8": De tribu Issachar, Igal fílium Ioseph.
  "9": De tribu Ephraim, Osée fílium Nun.
  "10": De tribu Béniamin, Phalti fílium Raphu.
  "11": De tribu Zábulon, Géddiel fílium Sodi.
  "12": De tribu Ioseph, sceptri Manásse, Gaddi fílium Susi.
  "13": De tribu Dan, Ammiel fílium Gemálli.
  "14": De tribu Aser, Sthur fílium Míchael.
  "15": De tribu Néphthali, Náhabi fílium Vapsi.
  "16": De tribu Gad, Guel fílium Machi.
  "17": 'Hæc sunt nómina virórum, quos misit Móyses ad considerándam terram: vocavítque Osée fílium Nun, Iósue.'
  "18": 'Misit ergo eos Móyses ad considerándam terram Chánaan, et dixit ad eos: Ascéndite per meridiánam plagam. Cumque venéritis ad montes,'
  "19": 'consideráte terram, qualis sit: et pópulum qui habitátor est eius, utrum fortis sit an infírmus: si pauci número an plures:'
  "20": 'ipsa terra, bona an mala: urbes quales, murátæ an absque muris:'
  "21": humus, pinguis an stérilis, nemorósa an absque arbóribus. Confortámini, et afférte nobis de frúctibus terræ. Erat autem tempus quando iam prǽcoquæ uvæ vesci possunt.
  "22": Cumque ascendíssent, exploravérunt terram a desérto Sin, usque Rohob intrántibus Emath.
  "23": 'Ascenderúntque ad merídiem, et venérunt in Hebron, ubi erant Achiman et Sísai et Thólmai fílii Enac: nam Hebron septem annis ante Tanim urbem Ægýpti cóndita est.'
  "24": 'Pergentésque usque ad Torréntem botri, abscidérunt pálmitem cum uva sua, quem portavérunt in vecte duo viri. De malis quoque granátis et de ficis loci illíus tulérunt:'
  "25": qui appellátus est Neheléscol, id est Torrens botri, eo quod botrum portássent inde fílii Israel.
  "26": Reversíque exploratóres terræ post quadragínta dies, omni regióne circúita,
  "27": 'venérunt ad Móysen et Aaron et ad omnem cœtum filiórum Israel in desértum Pharan, quod est in Cades. Locutíque eis et omni multitúdini ostendérunt fructus terræ:'
  "28": 'et narravérunt, dicéntes: Vénimus in terram, ad quam misísti nos, quæ revéra fluit lacte et melle, ut ex his frúctibus cognósci potest:'
  "29": sed cultóres fortíssimos habet, et urbes grandes atque murátas. Stirpem Enac vídimus ibi.
  "30": 'Amalec hábitat in merídie, Hethǽus et Iebusǽus et Amorrhǽus in montánis: Chananǽus vero morátur iuxta mare et circa fluénta Iordánis.'
  "31": 'Inter hæc Caleb compéscens murmur pópuli, qui oriebátur contra Móysen, ait: Ascendámus, et possideámus terram, quóniam potérimus obtinére eam.'
  "32": 'Alii vero, qui fúerant cum eo, dicébant: Nequáquam ad hunc pópulum valémus ascéndere, quia fórtior nobis est.'
  "33": 'Detraxerúntque terræ, quam inspéxerant, apud fílios Israel, dicéntes: Terra, quam lustrávimus, dévorat habitatóres suos: pópulus, quem aspéximus, procéræ statúræ est.'
  "34": 'Ibi vídimus monstra quædam filiórum Enac de génere gigantéo: quibus comparáti, quasi locústæ videbámur.'
