bible: vulgate
lang: la
language: Latina
book: Proverbia
chapter: "9"
verses:
  "1": 'Sapiéntia ædificávit sibi domum: excídit colúmnas septem.'
  "2": Immolávit víctimas suas, míscuit vinum, et propósuit mensam suam.
  "3": 'Misit ancíllas suas ut vocárent ad arcem et ad mœ́nia civitátis:'
  "4": 'Si quis est párvulus, véniat ad me. Et insipiéntibus locúta est:'
  "5": Veníte, comédite panem meum, et bíbite vinum quod míscui vobis.
  "6": Relínquite infántiam, et vívite, et ambuláte per vias prudéntiæ.
  "7": 'Qui érudit derisórem, ipse iniúriam sibi facit: et qui árguit ímpium, sibi máculam génerat.'
  "8": 'Noli argúere derisórem, ne óderit te: árgue sapiéntem, et díliget te.'
  "9": 'Da sapiénti occasiónem, et addétur ei sapiéntia: doce iustum, et festinábit accípere.'
  "10": Princípium sapiéntiæ timor Dómini, et sciéntia sanctórum prudéntia.
  "11": Per me enim multiplicabúntur dies tui, et addéntur tibi anni vitæ.
  "12": 'Si sápiens fúeris, tibimetípsi eris: si autem illúsor, solus portábis malum.'
  "13": Múlier stulta et clamósa, plenáque illécebris, et nihil omníno sciens,
  "14": sedit in fóribus domus suæ, super sellam in excélso urbis loco,
  "15": 'ut vocáret transeúntes per viam, et pergéntes itínere suo:'
  "16": 'Qui est párvulus, declínet ad me. Et vecórdi locúta est:'
  "17": Aquæ furtívæ dulcióres sunt, et panis abscónditus suávior.
  "18": Et ignorávit quod ibi sint gigántes, et in profúndis inférni convívæ eius.
