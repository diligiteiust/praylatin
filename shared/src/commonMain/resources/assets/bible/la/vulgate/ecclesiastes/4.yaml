bible: vulgate
lang: la
language: Latina
book: Ecclesiastes
chapter: "4"
verses:
  "1": 'Verti me ad ália, et vidi calúmnias, quæ sub sole gerúntur, et lácrymas innocéntium, et néminem consolatórem: nec posse resístere eórum violéntiæ, cunctórum auxílio destitútos.'
  "2": 'Et laudávi magis mórtuos, quam vivéntes:'
  "3": et feliciórem utróque iudicávi, qui necdum natus est, nec vidit mala quæ sub sole fiunt.
  "4": 'Rursum contemplátus sum omnes labóres hóminum, et indústrias animadvérti patére invídiæ próximi: et in hoc ergo vánitas, et cura supérflua est.'
  "5": 'Stultus cómplicat manus suas, et cómedit carnes suas, dicens:'
  "6": Mélior est pugíllus cum réquie, quam plena útraque manus cum labóre, et afflictióne ánimi.
  "7": 'Consíderans réperi et áliam vanitátem sub sole:'
  "8": 'unus est, et secúndum non habet, non fílium, non fratrem, et tamen laboráre non cessat, nec satiántur óculi eius divítiis: nec recógitat, dicens: Cui labóro, et fraudo ánimam meam bonis? In hoc quoque vánitas est, et afflíctio péssima.'
  "9": 'Mélius est ergo duos esse simul, quam unum: habent enim emoluméntum societátis suæ:'
  "10": 'si unus cecíderit, ab áltero fulciétur: væ soli: quia cum cecíderit, non habet sublevántem se.'
  "11": 'Et si dormíerint duo, fovebúntur mútuo: unus quómodo calefíet?'
  "12": 'Et si quíspiam prævalúerit contra unum, duo resístunt ei: funículus triplex diffícile rúmpitur.'
  "13": Mélior est puer pauper et sápiens, rege sene et stulto, qui nescit prævidére in pósterum.
  "14": 'Quod de cárcere, catenísque intérdum quis egrediátur ad regnum: et álius natus in regno, inópia consumátur.'
  "15": Vidi cunctos vivéntes, qui ámbulant sub sole cum adolescénte secúndo, qui consúrget pro eo.
  "16": 'Infinítus númerus est pópuli ómnium, qui fuérunt ante eum: et qui póstea futúri sunt non lætabúntur in eo: sed et hoc vánitas, et afflíctio spíritus.'
  "17": Custódi pedem tuum ingrédiens domum Dei, et appropínqua ut áudias. Multo enim mélior est obediéntia, quam stultórum víctimæ, qui nésciunt quid fáciunt mali.
