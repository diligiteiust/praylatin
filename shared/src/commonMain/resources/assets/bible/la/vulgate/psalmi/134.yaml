bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "134"
verses:
  "1": Allelúia. Laudáte nomen Dómini, laudáte servi Dóminum.
  "2": Qui statis in domo Dómini, in átriis domus Dei nostri.
  "3": 'Laudáte Dóminum, quia bonus Dóminus: psállite nómini eius, quóniam suáve.'
  "4": Quóniam Iacob elégit sibi Dóminus, Israel in possessiónem sibi.
  "5": Quia ego cognóvi quod magnus est Dóminus, et Deus noster præ ómnibus diis.
  "6": Omnia quæcúmque vóluit, Dóminus fecit, in cælo, in terra, in mari et in ómnibus abýssis.
  "7": 'Edúcens nubes ab extrémo terræ: fúlgura in plúviam fecit. Qui prodúcit ventos de thesáuris suis:'
  "8": qui percússit primogénita Ægýpti ab hómine usque ad pecus.
  "9": 'Et misit signa et prodígia in médio tui Ægýpte: in Pharaónem, et in omnes servos eius.'
  "10": 'Qui percússit gentes multas: et occídit reges fortes:'
  "11": Sehon regem Amorrhæórum, et Og regem Basan, et ómnia regna Chánaan.
  "12": Et dedit terram eórum hereditátem, hereditátem Israel pópulo suo.
  "13": 'Dómine nomen tuum in ætérnum: Dómine memoriále tuum in generatiónem et generatiónem.'
  "14": 'Quia iudicábit Dóminus pópulum suum: et in servis suis deprecábitur.'
  "15": Simulácra géntium argéntum et aurum, ópera mánuum hóminum.
  "16": 'Os habent, et non loquéntur: óculos habent, et non vidébunt.'
  "17": 'Aures habent, et non áudient: neque enim est spíritus in ore ipsórum.'
  "18": 'Símiles illis fiant qui fáciunt ea: et omnes, qui confídunt in eis.'
  "19": 'Domus Israel benedícite Dómino: domus Aaron benedícite Dómino.'
  "20": 'Domus Levi benedícite Dómino: qui timétis Dóminum, benedícite Dómino.'
  "21": Benedíctus Dóminus ex Sion, qui hábitat in Ierúsalem.
