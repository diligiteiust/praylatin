bible: vulgate
lang: la
language: Latina
book: Isaias
chapter: "38"
verses:
  "1": 'In diébus illis ægrotávit Ezechías usque ad mortem: et introívit ad eum Isaías fílius Amos prophéta, et dixit ei: Hæc dicit Dóminus: Dispóne dómui tuæ, quia moriéris tu, et non vives.'
  "2": Et convértit Ezechías fáciem suam ad paríetem, et orávit ad Dóminum,
  "3": 'et dixit: Obsecro Dómine, meménto quæso quómodo ambuláverim coram te in veritáte et in corde perfécto, et quod bonum est in óculis tuis fécerim. Et flevit Ezechías fletu magno.'
  "4": 'Et factum est verbum Dómini ad Isaíam, dicens:'
  "5": 'Vade, et dic Ezechíæ: Hæc dicit Dóminus Deus David patris tui: Audívi oratiónem tuam, et vidi lácrymas tuas: ecce ego adíciam super dies tuos quíndecim annos.'
  "6": Et de manu regis Assyriórum éruam te, et civitátem istam, et prótegam eam.
  "7": 'Hoc autem tibi erit signum a Dómino, quia fáciet Dóminus verbum hoc, quod locútus est:'
  "8": Ecce ego revérti fáciam umbram lineárum, per quas descénderat in horológio Achaz in sole, retrórsum decem líneis. Et revérsus est sol decem líneis per gradus, quos descénderat.
  "9": Scriptúra Ezechíæ regis Iuda cum ægrotásset, et convaluísset de infirmitáte sua.
  "10": 'Ego dixi: In dimídio diérum meórum vadam ad portas ínferi. Quæsívi resíduum annórum meórum:'
  "11": 'dixi: Non vidébo Dóminum Deum in terra vivéntium. Non aspíciam hóminem ultra, et habitatórem quiétis.'
  "12": 'Generátio mea abláta est: et convolúta est a me, quasi tabernáculum pastórum. Præcísa est velut a texénte, vita mea: dum adhuc ordírer, succídit me: de mane usque ad vésperam fínies me.'
  "13": 'Sperábam usque ad mane, quasi leo sic contrívit ómnia ossa mea: de mane usque ad vésperam fínies me:'
  "14": 'sicut pullus hirúndinis sic clamábo, meditábor ut colúmba: attenuáti sunt óculi mei, suspiciéntes in excélsum: Dómine vim pátior, respónde pro me.'
  "15": Quid dicam, aut quid respondébit mihi, cum ipse fécerit? Recogitábo tibi omnes annos meos in amaritúdine ánimæ meæ.
  "16": Dómine si sic vívitur, et in tálibus vita spíritus mei, corrípies me, et vivificábis me.
  "17": 'Ecce in pace amaritúdo mea amaríssima: tu autem eruísti ánimam meam ut non períret, proiecísti post tergum tuum ómnia peccáta mea.'
  "18": 'Quia non inférnus confitébitur tibi, neque mors laudábit te: non exspectábunt qui descéndunt in lacum, veritátem tuam.'
  "19": 'Vivens vivens ipse confitébitur tibi, sicut et ego hódie: pater fíliis notam fáciet veritátem tuam.'
  "20": Dómine salvum me fac, et psalmos nostros cantábimus cunctis diébus vitæ nostræ in domo Dómini.
  "21": Et iussit Isaías ut tóllerent massam de ficis, et cataplasmárent super vulnus, et sanarétur.
  "22": 'Et dixit Ezechías: Quod erit signum quia ascéndam in domum Dómini?'
