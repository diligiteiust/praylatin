bible: vulgate
lang: la
language: Latina
book: Osee
chapter: "10"
verses:
  "1": 'Vitis frondósa Israel, fructus adæquátus est ei: secúndum multitúdinem fructus sui multiplicávit altária, iuxta ubertátem terræ suæ exuberávit simulácris.'
  "2": 'Divísum est cor eórum, nunc interíbunt: ipse confrínget simulácra eórum, depopulábitur aras eórum.'
  "3": 'Quia nunc dicent: Non est rex nobis: non enim timémus Dóminum: et rex quid fáciet nobis?'
  "4": 'Loquímini verba visiónis inútilis, et feriétis fœdus: et germinábit quasi amaritúdo iudícium super sulcos agri.'
  "5": 'Vaccas Betháven coluérunt habitatóres Samaríæ: quia luxit super eum pópulus eius, et ædítui eius super eum exsultavérunt in glória eius, quia migrávit ab eo.'
  "6": 'Síquidem et ipse in Assur delátus est, munus regi ultóri: confúsio Ephraim cápiet, et confundétur Israel in voluntáte sua.'
  "7": Transíre fecit Samaría regem suum quasi spumam super fáciem aquæ.
  "8": 'Et disperdéntur excélsa idóli, peccátum Israel: lappa, et tríbulus ascéndet super aras eórum: et dicent móntibus: Operíte nos: et cóllibus: Cádite super nos.'
  "9": 'Ex diébus Gábaa, peccávit Israel, ibi stetérunt: non comprehéndet eos in Gábaa prœ́lium super fílios iniquitátis.'
  "10": 'Iuxta desidérium meum corrípiam eos: congregabúntur super eos pópuli, cum corripiéntur propter duas iniquitátes suas.'
  "11": 'Ephraim vítula docta dilígere tritúram, et ego transívi super pulchritúdinem colli eius: ascéndam super Ephraim, arábit Iudas, confrínget sibi sulcos Iacob.'
  "12": 'Semináte vobis in iustítia, et métite in ore misericórdiæ, innováte vobis novále: tempus autem requiréndi Dóminum, cum vénerit qui docébit vos iustítiam.'
  "13": 'Arástis impietátem, iniquitátem messuístis, comedístis frugem mendácii: quia confísus es in viis tuis, in multitúdine fórtium tuórum.'
  "14": 'Consúrget tumúltus in pópulo tuo: et omnes munitiónes tuæ vastabúntur, sicut vastátus est Sálmana a domo eius qui iudicávit Baal in die prœ́lii, matre super fílios allísa.'
  "15": Sic fecit vobis Bethel, a fácie malítiæ nequitiárum vestrárum.
