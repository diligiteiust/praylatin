bible: vulgate
lang: la
language: Latina
book: II Regum
chapter: "6"
verses:
  "1": 'Dixérunt autem fílii prophetárum ad Eliséum: Ecce locus, in quo habitámus coram te, angústus est nobis.'
  "2": 'Eámus usque ad Iordánem, et tollant sínguli de silva matérias síngulas, ut ædificémus nobis ibi locum ad habitándum. Qui dixit: Ite.'
  "3": 'Et ait unus ex illis: Veni ergo et tu cum servis tuis. Respóndit: Ego véniam.'
  "4": Et ábiit cum eis. Cumque veníssent ad Iordánem, cædébant ligna.
  "5": 'Accidit autem ut cum unus matériam succidísset, cáderet ferrum secúris in aquam: exclamavítque ille, et ait: Heu heu heu dómine mi: et hoc ipsum mútuo accéperam.'
  "6": 'Dixit autem homo Dei: Ubi cécidit? At ille monstrávit ei locum. Præcídit ergo lignum, et misit illuc: natavítque ferrum,'
  "7": 'et ait: Tolle. Qui exténdit manum, et tulit illud.'
  "8": 'Rex autem Sýriæ pugnábat contra Israel, consiliúmque íniit cum servis suis, dicens: In loco illo, et illo ponámus insídias.'
  "9": 'Misit ítaque vir Dei ad regem Israel, dicens: Cave ne tránseas in locum illum: quia ibi Syri in insídiis sunt.'
  "10": Misit ítaque rex Israel ad locum, quem díxerat ei vir Dei, et præoccupávit eum, et observávit se ibi non semel neque bis.
  "11": 'Conturbatúmque est cor regis Sýriæ pro hac re: et convocátis servis suis, ait: Quare non indicátis mihi quis próditor mei sit apud regem Israel?'
  "12": 'Dixítque unus servórum eius: Nequáquam dómine mi rex, sed Eliséus prophéta, qui est in Israel, índicat regi Israel ómnia verba quæcúmque locútus fúeris in conclávi tuo.'
  "13": 'Dixítque eis: Ite, et vidéte ubi sit, ut mittam, et cápiam eum. Annuntiaverúntque ei, dicéntes: Ecce in Dothan.'
  "14": 'Misit ergo illuc equos et currus, et robur exércitus: qui cum veníssent nocte, circumdedérunt civitátem.'
  "15": 'Consúrgens autem dilúculo miníster viri Dei, egréssus vidit exércitum in circúitu civitátis, et equos et currus: nuntiavítque ei, dicens: Heu heu heu dómine mi: quid faciémus?'
  "16": 'At ille respóndit: Noli timére: plures enim nobíscum sunt, quam cum illis.'
  "17": 'Cumque orásset Eliséus, ait: Dómine, áperi óculos huius, ut vídeat. Et apéruit Dóminus óculos púeri, et vidit: et ecce mons plenus equórum, et cúrruum igneórum in circúitu Eliséi.'
  "18": 'Hostes vero descendérunt ad eum: porro Eliséus orávit ad Dóminum, dicens: Pércute, óbsecro, gentem hanc cæcitáte. Percussítque eos Dóminus ne vidérent, iuxta verbum Eliséi.'
  "19": 'Dixit autem ad eos Eliséus: Non est hæc via, neque ista est cívitas: sequímini me, et osténdam vobis virum, quem quǽritis. Duxit ergo eos in Samaríam:'
  "20": 'cumque ingréssi fuíssent in Samaríam, dixit Eliséus: Dómine, áperi óculos istórum, ut vídeant. Aperuítque Dóminus óculos eórum, et vidérunt se esse in médio Samaríæ.'
  "21": 'Dixítque rex Israel ad Eliséum, cum vidísset eos: Numquid percútiam eos, pater mi?'
  "22": 'At ille ait: Non percúties: neque enim cepísti eos gládio et arcu tuo, ut percútias: sed pone panem, et aquam coram eis, ut cómedant et bibant, et vadant ad dóminum suum.'
  "23": Appositáque est eis cibórum magna præparátio, et comedérunt, et bibérunt, et dimísit eos, abierúntque ad dóminum suum, et ultra non venérunt latrónes Sýriæ in terram Israel.
  "24": Factum est autem post hæc, congregávit Bénadad rex Sýriæ univérsum exércitum suum, et ascéndit, et obsidébat Samaríam.
  "25": 'Factáque est fames magna in Samaría: et támdiu obséssa est, donec venumdarétur caput ásini octogínta argénteis, et quarta pars cabi stércoris columbárum quinque argénteis.'
  "26": 'Cumque rex Israel transíret per murum, múlier quædam exclamávit ad eum, dicens: Salva me dómine mi rex.'
  "27": 'Qui ait: Non te salvat Dóminus: unde te possum salváre? de área, vel de torculári? Dixítque ad eam rex: Quid tibi vis? Quæ respóndit:'
  "28": 'Múlier ista dixit mihi: Da fílium tuum, ut comedámus eum hódie, et fílium meum comedémus cras.'
  "29": 'Cóximus ergo fílium meum, et comédimus. Dixíque ei die áltera: Da fílium tuum, ut comedámus eum. Quæ abscóndit fílium suum.'
  "30": Quod cum audísset rex, scidit vestiménta sua, et transíbat per murum. Vidítque omnis pópulus cilícium, quo vestítus erat ad carnem intrínsecus.
  "31": 'Et ait rex: Hæc mihi fáciat Deus, et hæc addat, si stéterit caput Eliséi fílii Saphat super ipsum hódie.'
  "32": 'Eliséus autem sedébat in domo sua, et senes sedébant cum eo. Præmísit ítaque virum: et ántequam veníret núntius ille, dixit ad senes: Numquid scitis quod míserit fílius homicídæ hic, ut præcidátur caput meum? vidéte ergo, cum vénerit núntius, cláudite óstium, et non sinátis eum introíre: ecce enim sónitus pedum dómini eius post eum est.'
  "33": 'Adhuc illo loquénte eis, appáruit núntius, qui veniébat ad eum. Et ait: Ecce, tantum malum a Dómino est: quid ámplius exspectábo a Dómino?'
