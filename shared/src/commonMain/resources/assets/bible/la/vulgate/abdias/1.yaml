bible: vulgate
lang: la
language: Latina
book: Abdias
chapter: "1"
verses:
  "1": 'Vísio Abdíæ. Hæc dicit Dóminus Deus ad Edom: Audítum  audívimus a Dómino, et legátum ad gentes misit: súrgite, et consurgámus advérsus eum in prœ́lium.'
  "2": 'Ecce párvulum dedi te in géntibus: contemptíbilis tu es valde.'
  "3": 'Supérbia cordis tui éxtulit te, habitántem in scissúris petrárum, exaltántem sólium tuum: qui dicis in corde tuo: Quis détrahet me in terram?'
  "4": 'Si exaltátus fúeris ut áquila, et si inter sídera posúeris nidum tuum: inde détraham te, dicit Dóminus.'
  "5": Si fures introíssent ad te, si latrónes per noctem, quómodo conticuísses? nonne furáti essent sufficiéntia sibi? si vindemiatóres introíssent ad te, numquid saltem racémum reliquíssent tibi?
  "6": Quómodo scrutáti sunt Esau, investigavérunt abscóndita eius?
  "7": 'Usque ad términum emisérunt te: omnes viri fœ́deris tui illusérunt tibi: invaluérunt advérsum te viri pacis tuæ: qui cómedunt tecum, ponent insídias subter te: non est prudéntia in eo.'
  "8": Numquid non in die illa, dicit Dóminus, perdam sapiéntes de Idumǽa, et prudéntiam de monte Esau?
  "9": Et timébunt fortes tui a merídie, ut intéreat vir de monte Esau.
  "10": Propter interfectiónem, et propter iniquitátem in fratrem tuum Iacob, opériet te confúsio, et períbis in ætérnum.
  "11": In die cum stares advérsus eum, quando capiébant aliéni exércitum eius, et extránei ingrediebántur portas eius, et super Ierúsalem mittébant sortem, tu quoque eras quasi unus ex eis.
  "12": 'Et non despícies in die fratris tui, in die peregrinatiónis eius: et non lætáberis super fílios Iuda in die perditiónis eórum: et non magnificábis os tuum in die angústiæ.'
  "13": 'Neque ingrediéris portam pópuli mei in die ruínæ eórum: neque despícies et tu in malis eius in die vastitátis illíus: et non emittéris advérsus exércitum eius in die vastitátis illíus.'
  "14": 'Neque stabis in exítibus ut interfícias eos qui fúgerint: et non conclúdes réliquos eius in die tribulatiónis.'
  "15": 'Quóniam iuxta est dies Dómini super omnes gentes: sicut fecísti, fiet tibi: retributiónem tuam convértet in caput tuum.'
  "16": 'Quómodo enim bibístis super montem sanctum meum, bibent omnes gentes iúgiter: et bibent, et absorbébunt, et erunt quasi non sint.'
  "17": 'Et in monte Sion erit salvátio, et erit sanctus: et possidébit domus Iacob eos qui se posséderant.'
  "18": 'Et erit domus Iacob ignis, et domus Ioseph flamma, et domus Esau stípula: et succendéntur in eis, et devorábunt eos: et non erunt relíquiæ domus Esau, quia Dóminus locútus est.'
  "19": 'Et hereditábunt hi, qui ad austrum sunt, montem Esau, et qui in campéstribus, Philísthiim: et possidébunt regiónem Ephraim, et regiónem Samaríæ: et Béniamin possidébit Gálaad.'
  "20": 'Et transmigrátio exércitus huius filiórum Israel, ómnia loca Chananæórum usque ad Saréptam: et transmigrátio Ierúsalem, quæ in Bósphoro est, possidébit civitátes austri.'
  "21": 'Et ascéndent salvatóres in montem Sion iudicáre montem Esau: et erit Dómino regnum.'
