bible: vulgate
lang: la
language: Latina
book: Ieremias
chapter: "37"
verses:
  "1": 'Et regnávit rex Sedecías fílius Iosíæ pro Iechonía fílio Ióakim, quem constítuit regem Nabuchodónosor rex Babylónis in terra Iuda:'
  "2": et non obedívit ipse, et servi eius, et pópulus terræ, verbis Dómini, quæ locútus est in manu Ieremíæ prophétæ.
  "3": 'Et misit rex Sedecías Iuchal fílium Selemíæ, et Sophoníam fílium Maasíæ sacerdótem, ad Ieremíam prophétam, dicens: Ora pro nobis Dóminum Deum nostrum.'
  "4": 'Ieremías autem líbere ambulábat in médio pópuli: non enim míserant eum in custódiam cárceris. Igitur exércitus Pharaónis egréssus est de Ægýpto: et audiéntes Chaldǽi, qui obsidébant Ierúsalem, huiuscémodi núntium, recessérunt ab Ierúsalem.'
  "5": 'Et factum est verbum Dómini ad Ieremíam prophétam, dicens:'
  "6": 'Hæc dicit Dóminus Deus Israel: Sic dicétis regi Iuda, qui misit vos ad me interrogándum: Ecce exércitus Pharaónis, qui egréssus est vobis in auxílium, revertétur in terram suam in Ægýptum:'
  "7": et rédient Chaldǽi, et bellábunt contra civitátem hanc, et cápient eam, et succéndent eam igni.
  "8": 'Hæc dicit Dóminus: Nolíte decípere ánimas vestras, dicéntes: Eúntes abíbunt, et recédent a nobis Chaldǽi: quia non abíbunt.'
  "9": Sed etsi percusséritis omnem exércitum Chaldæórum, qui prœliántur advérsum vos, et derelícti fúerint ex eis áliqui vulneráti, sínguli de tentório suo consúrgent, et incéndent civitátem hanc igni.
  "10": Ergo cum recessísset exércitus Chaldæórum ab Ierúsalem propter exércitum Pharaónis,
  "11": egréssus est Ieremías de Ierúsalem ut iret in terram Béniamin, et divíderet ibi possessiónem in conspéctu cívium.
  "12": 'Cumque pervenísset ad portam Béniamin, erat ibi custos portæ per vices, nómine Ierías fílius Selemíæ fílii Hananíæ: et apprehéndit Ieremíam prophétam, dicens: Ad Chaldǽos prófugis.'
  "13": 'Et respóndit Ieremías: Falsum est, non fúgio ad Chaldǽos. Et non audívit eum: sed comprehéndit Ierías Ieremíam, et addúxit eum ad príncipes.'
  "14": 'Quam ob rem iráti príncipes contra Ieremíam, cæsum eum misérunt in cárcerem, qui erat in domo Iónathan scribæ: ipse enim præpósitus erat super cárcerem.'
  "15": 'Itaque ingréssus est Ieremías in domum laci et in ergástulum: et sedit ibi Ieremías diébus multis.'
  "16": 'Mittens autem Sedecías rex, tulit eum: et interrogávit eum in domo sua abscóndite, et dixit: Putásne est sermo a Dómino? Et dixit Ieremías: Est. Et ait: In manus regis Babylónis tradéris.'
  "17": 'Et dixit Ieremías ad regem Sedecíam: Quid peccávi tibi, et servis tuis, et pópulo tuo, quia misísti me in domum cárceris?'
  "18": 'Ubi sunt prophétæ vestri, qui prophetábant vobis, et dicébant: Non véniet rex Babylónis super vos, et super terram hanc?'
  "19": 'Nunc ergo audi óbsecro dómine mi rex: váleat deprecátio mea in conspéctu tuo, et ne me remíttas in domum Iónathan scribæ, ne móriar ibi.'
  "20": 'Præcépit ergo rex Sedecías ut traderétur Ieremías in vestíbulo cárceris: et darétur ei torta panis quotídie, excépto pulménto, donec consumeréntur omnes panes de civitáte: et mansit Ieremías in vestíbulo carceris.'
