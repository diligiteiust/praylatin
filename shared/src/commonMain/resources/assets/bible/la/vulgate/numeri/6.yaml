bible: vulgate
lang: la
language: Latina
book: Numeri
chapter: "6"
verses:
  "1": 'Locutúsque est Dóminus ad Móysen, dicens:'
  "2": 'Lóquere ad fílios Israel, et dices ad eos: Vir, sive múlier, cum fécerint votum ut sanctificéntur, et se volúerint Dómino consecráre:'
  "3": 'a vino, et omni, quod inebriáre potest, abstinébunt. Acétum ex vino, et ex quálibet ália potióne, et quidquid de uva exprímitur, non bibent: uvas recéntes siccásque non cómedent'
  "4": 'cunctis diébus quibus ex voto Dómino consecrántur: quidquid ex vínea esse potest, ab uva passa usque ad ácinum non cómedent.'
  "5": Omni témpore separatiónis suæ novácula non transíbit per caput eius usque ad complétum diem, quo Dómino consecrátur. Sanctus erit, crescénte cæsárie cápitis eius.
  "6": Omni témpore consecratiónis suæ, super mórtuum non ingrediétur,
  "7": nec super patris quidem et matris et fratris sororísque fúnere contaminábitur, quia consecrátio Dei sui super caput eius est.
  "8": Omnibus diébus separatiónis suæ sanctus erit Dómino.
  "9": 'Sin autem mórtuus fúerit súbito quíspiam coram eo, polluétur caput consecratiónis eius: quod radet íllico in eádem die purgatiónis suæ, et rursum séptima.'
  "10": In octáva autem die ófferet duos túrtures, vel duos pullos colúmbæ sacerdóti in intróitu fœ́deris testimónii.
  "11": 'Faciétque sacérdos unum pro peccáto, et álterum in holocáustum, et deprecábitur pro eo, quia peccávit super mórtuo: sanctificabítque caput eius in die illo:'
  "12": 'et consecrábit Dómino dies separatiónis illíus, ófferens agnum annículum pro peccáto: ita tamen ut dies prióres írriti fiant, quóniam pollúta est sanctificátio eius.'
  "13": 'Ista est lex consecratiónis. Cum dies, quos ex voto decréverat, complebúntur: addúcet eum ad óstium tabernáculi fœ́deris,'
  "14": et ófferet oblatiónes eius Dómino, agnum annículum immaculátum in holocáustum, et ovem annículam immaculátam pro peccáto, et aríetem immaculátum, hóstiam pacíficam,
  "15": 'canístrum quoque panum azymórum qui conspérsi sint óleo, et lágana absque ferménto uncta óleo, ac libámina singulórum:'
  "16": quæ ófferet sacérdos coram Dómino, et fáciet tam pro peccáto, quam in holocáustum.
  "17": Aríetem vero immolábit hóstiam pacíficam Dómino, ófferens simul canístrum azymórum, et libaménta quæ ex more debéntur.
  "18": 'Tunc radétur Nazarǽus ante óstium tabernáculi fœ́deris cæsárie consecratiónis suæ: tollétque capíllos eius, et ponet super ignem, qui est suppósitus sacrifício pacificórum:'
  "19": et armum coctum aríetis, tortámque absque ferménto unam de canístro, et láganum ázymum unum, et tradet in manus Nazarǽi, postquam rasum fúerit caput eius.
  "20": 'Susceptáque rursum ab eo, elevábit in conspéctu Dómini: et sanctificáta sacerdótis erunt, sicut pectúsculum, quod separári iussum est, et femur. Post hæc, potest bíbere Nazarǽus vinum.'
  "21": 'Ista est lex Nazarǽi, cum vóverit oblatiónem suam Dómino témpore consecratiónis suæ, excéptis his, quæ invénerit manus eius: iuxta quod mente devóverat, ita fáciet ad perfectiónem sanctificatiónis suæ.'
  "22": 'Locutúsque est Dóminus ad Móysen, dicens:'
  "23": 'Lóquere Aaron et fíliis eius: Sic benedicétis fíliis Israel, et dicétis eis:'
  "24": Benedícat tibi Dóminus, et custódiat te.
  "25": Osténdat Dóminus fáciem suam tibi, et misereátur tui.
  "26": Convértat Dóminus vultum suum ad te, et det tibi pacem.
  "27": Invocabúntque nomen meum super fílios Israel, et ego benedícam eis.
