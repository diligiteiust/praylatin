bible: vulgate
lang: la
language: Latina
book: Apocalypsis
chapter: "7"
verses:
  "1": Post hæc vidi quátuor ángelos stantes super quátuor ángulos terræ, tenéntes quátuor ventos terræ, ne flarent super terram, neque super mare, neque in ullam árborem.
  "2": 'Et vidi álterum ángelum ascendéntem ab ortu solis, habéntem signum Dei vivi: et clamávit voce magna quátuor ángelis, quibus datum est nocére terræ et mari,'
  "3": 'dicens: Nolíte nocére terræ, et mari, neque arbóribus, quoadúsque signémus servos Dei nostri in fróntibus eórum.'
  "4": Et audívi númerum signatórum, centum quadragínta quátuor míllia signáti, ex omni tribu filiórum Israel.
  "5": 'Ex tribu Iuda duódecim míllia signáti: ex tribu Ruben duódecim míllia signáti: ex tribu Gad duódecim míllia signáti:'
  "6": 'ex tribu Aser duódecim míllia signáti: ex tribu Néphthali duódecim míllia signáti: ex tribu Manásse duódecim míllia signáti:'
  "7": 'ex tribu Símeon duódecim míllia signáti: ex tribu Levi duódecim míllia signáti: ex tribu Issachar duódecim míllia signáti:'
  "8": 'ex tribu Zábulon duódecim míllia signáti: ex tribu Ioseph duódecim míllia signáti: ex tribu Béniamin duódecim míllia signáti.'
  "9": 'Post hæc vidi turbam magnam, quam dinumeráre nemo póterat, ex ómnibus géntibus, et tríbubus, et pópulis, et linguis: stantes ante thronum, et in conspéctu Agni, amícti stolis albis, et palmæ in mánibus eórum:'
  "10": 'et clamábant voce magna, dicéntes: Salus Deo nostro, qui sedet super thronum, et Agno.'
  "11": 'Et omnes ángeli stabant in circúitu throni, et seniórum, et quátuor animálium: et cecidérunt in conspéctu throni in fácies suas, et adoravérunt Deum,'
  "12": 'dicéntes: Amen. Benedíctio, et cláritas, et sapiéntia, et gratiárum áctio, honor, et virtus, et fortitúdo Deo nostro in sǽcula sæculórum. Amen.'
  "13": 'Et respóndit unus de senióribus, et dixit mihi: Hi, qui amícti sunt stolis albis, qui sunt? et unde venérunt?'
  "14": 'Et dixi illi: Dómine mi, tu scis. Et dixit mihi: Hi sunt, qui venérunt de tribulatióne magna, et lavérunt stolas suas, et dealbavérunt eas in sánguine Agni.'
  "15": 'Ideo sunt ante thronum Dei, et sérviunt ei die ac nocte in templo eius: et qui sedet in throno, habitábit super illos:'
  "16": 'non esúrient, neque sítient ámplius, nec cadet super illos sol, neque ullus æstus:'
  "17": quóniam Agnus, qui in médio throni est, reget illos, et dedúcet eos ad vitæ fontes aquárum, et abstérget Deus omnem lácrymam ab óculis eórum.
