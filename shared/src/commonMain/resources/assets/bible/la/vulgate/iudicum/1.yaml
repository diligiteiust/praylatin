bible: vulgate
lang: la
language: Latina
book: Iudicum
chapter: "1"
verses:
  "1": 'Post mortem Iósue, consuluérunt fílii Israel Dóminum, dicéntes: Quis ascéndet ante nos contra Chananǽum, et erit dux belli?'
  "2": 'Dixítque Dóminus: Iudas ascéndet: ecce trádidi terram in manus eius.'
  "3": 'Et ait Iudas Simeóni fratri suo: Ascénde mecum in sortem meam, et pugna contra Chananǽum, ut et ego pergam tecum in sortem tuam. Et ábiit cum eo Símeon.'
  "4": 'Ascendítque Iudas, et trádidit Dóminus Chananǽum, ac Pherezǽum in manus eórum: et percussérunt in Bezec decem míllia virórum.'
  "5": Invenerúntque Adoníbezec in Bezec, et pugnavérunt contra eum, ac percussérunt Chananǽum, et Pherezǽum.
  "6": 'Fugit autem Adoníbezec: quem persecúti comprehendérunt, cæsis summitátibus mánuum eius ac pedum.'
  "7": 'Dixítque Adoníbezec: Septuagínta reges amputátis mánuum ac pedum summitátibus colligébant sub mensa mea cibórum relíquias: sicut feci, ita réddidit mihi Deus. Adduxerúntque eum in Ierúsalem, et ibi mórtuus est.'
  "8": Oppugnántes ergo fílii Iuda Ierúsalem, cepérunt eam, et percussérunt in ore gládii, tradéntes cunctam incéndio civitátem.
  "9": Et póstea descendéntes pugnavérunt contra Chananǽum, qui habitábat in montánis, et ad merídiem, et in campéstribus.
  "10": 'Pergénsque Iudas contra Chananǽum, qui habitábat in Hebron (cuius nomen fuit antíquitus Cáriath Arbe), percússit Sésai, et Ahiman, et Thólmai:'
  "11": atque inde proféctus ábiit ad habitatóres Dabir, cuius nomen vetus erat Cáriath Sepher, id est, Cívitas litterárum.
  "12": 'Dixítque Caleb: Qui percússerit Cáriath Sepher, et vastáverit eam, dabo ei Axam fíliam meam uxórem.'
  "13": Cumque cepísset eam Othóniel fílius Cenez frater Caleb minor, dedit ei Axam fíliam suam cóniugem.
  "14": 'Quam pergéntem in itínere mónuit vir suus ut péteret a patre suo agrum. Quæ cum suspirásset sedens in ásino, dixit ei Caleb: Quid habes?'
  "15": 'At illa respóndit: Da mihi benedictiónem, quia terram aréntem dedísti mihi: da et irríguam aquis. Dedit ergo ei Caleb irríguum supérius, et irríguum inférius.'
  "16": Fílii autem Cinǽi cognáti Móysi ascendérunt de Civitáte palmárum cum fíliis Iuda, in desértum sortis eius, quod est ad merídiem Arad, et habitavérunt cum eo.
  "17": Abiit autem Iudas cum Simeóne fratre suo, et percussérunt simul Chananǽum qui habitábat in Séphaath, et interfecérunt eum. Vocatúmque est nomen urbis, Horma, id est, anáthema.
  "18": Cepítque Iudas Gazam cum fínibus suis, et Ascalónem, atque Accaron cum términis suis.
  "19": 'Fuítque Dóminus cum Iuda, et montána possédit: nec pótuit delére habitatóres vallis, quia falcátis cúrribus abundábant.'
  "20": Dederúntque Caleb Hebron, sicut díxerat Móyses, qui delévit ex ea tres fílios Enac.
  "21": 'Iebusǽum autem habitatórem Ierúsalem non delevérunt fílii Béniamin: habitavítque Iebusǽus cum fíliis Béniamin in Ierúsalem, usque in præséntem diem.'
  "22": Domus quoque Ioseph ascéndit in Bethel, fuítque Dóminus cum eis.
  "23": Nam cum obsidérent urbem, quæ prius Luza vocabátur,
  "24": 'vidérunt hóminem egrediéntem de civitáte, dixerúntque ad eum: Osténde nobis intróitum civitátis, et faciémus tecum misericórdiam.'
  "25": 'Qui cum ostendísset eis, percussérunt urbem in ore gládii: hóminem autem illum, et omnem cognatiónem eius, dimisérunt.'
  "26": 'Qui dimíssus, ábiit in terram Hetthim, et ædificávit ibi civitátem, vocavítque eam Luzam: quæ ita appellátur usque in præséntem diem.'
  "27": Manásses quoque non delévit Bethsan, et Thanac cum vículis suis, et habitatóres Dor, et Iéblaam, et Magéddo cum vículis suis, cœpítque Chananǽus habitáre cum eis.
  "28": Postquam autem confortátus est Israel, fecit eos tributários, et delére nóluit.
  "29": Ephraim étiam non interfécit Chananǽum, qui habitábat in Gazer, sed habitávit cum eo.
  "30": 'Zábulon non delévit habitatóres Cetron, et Náalol: sed habitávit Chananǽus in médio eius, factúsque est ei tributárius.'
  "31": 'Aser quoque non delévit habitatóres Accho, et Sidónis, Ahalab, et Achazib, et Helba, et Aphec, et Rohob:'
  "32": habitavítque in médio Chananǽi habitatóris illíus terræ, nec interfécit eum.
  "33": 'Néphthali quoque non delévit habitatóres Béthsames, et Béthanath: et habitávit inter Chananǽum habitatórem terræ, fuerúntque ei Bethsamítæ et Bethanítæ tributárii.'
  "34": 'Arctavítque Amorrhǽus fílios Dan in monte, nec dedit eis locum ut ad planióra descénderent:'
  "35": habitavítque in monte Hares, quod interpretátur testáceo, in Aialon et Sálebim. Et aggraváta est manus domus Ioseph, factúsque est ei tributárius.
  "36": Fuit autem términus Amorrhǽi ab Ascénsu Scorpiónis, Petra, et superióra loca.
