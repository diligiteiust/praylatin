bible: vulgate
lang: la
language: Latina
book: Matthaeus
chapter: "13"
verses:
  "1": In illo die éxiens Iesus de domo, sedébat secus mare.
  "2": 'Et congregátæ sunt ad eum turbæ multæ, ita ut navículam ascéndens sedéret: et omnis turba stabat in líttore,'
  "3": 'et locútus est eis multa in parábolis, dicens: Ecce éxiit qui séminat, semináre.'
  "4": Et dum séminat, quædam cecidérunt secus viam, et venérunt vólucres cæli, et comedérunt ea.
  "5": 'Alia autem cecidérunt in petrósa, ubi non habébant terram multam: et contínuo exórta sunt, quia non habébant altitúdinem terræ.'
  "6": 'Sole autem orto æstuavérunt: et quia non habébant radícem, aruérunt.'
  "7": 'Alia autem cecidérunt in spinas: et crevérunt spinæ, et suffocavérunt ea.'
  "8": 'Alia autem cecidérunt in terram bonam: et dabant fructum, áliud centésimum, áliud sexagésimum, áliud trigésimum.'
  "9": Qui habet aures audiéndi, áudiat.
  "10": 'Et accedéntes discípuli dixérunt ei: Quare in parábolis lóqueris eis?'
  "11": 'Qui respóndens, ait illis: Quia vobis datum est nosse mystéria regni cælórum: illis autem non est datum.'
  "12": 'Qui enim habet, dábitur ei, et abundábit: qui autem non habet, et quod habet auferétur ab eo.'
  "13": 'Ideo in parábolis loquor eis: quia vidéntes non vident, et audiéntes non áudiunt, neque intélligunt.'
  "14": 'Et adimplétur in eis prophetía Isaíæ, dicéntis: Audítu audiétis, et non intelligétis: et vidéntes vidébitis, et non vidébitis.'
  "15": 'Incrassátum est enim cor pópuli huius, et áuribus gráviter audiérunt, et óculos suos clausérunt: nequándo vídeant óculis, et áuribus áudiant, et corde intélligant, et convertántur, et sanem eos.'
  "16": Vestri autem beáti óculi quia vident, et aures vestræ quia áudiunt.
  "17": 'Amen quippe dico vobis, quia multi prophétæ, et iusti cupiérunt vidére quæ vidétis, et non vidérunt: et audíre quæ audítis, et non audiérunt.'
  "18": Vos ergo audíte parábolam seminántis.
  "19": 'Omnis, qui audit verbum regni, et non intélligit, venit malus, et rapit quod seminátum est in corde eius: hic est qui secus viam seminátus est.'
  "20": 'Qui autem super petrósa seminátus est, hic est, qui verbum audit, et contínuo cum gáudio áccipit illud:'
  "21": 'non habet autem in se radícem, sed est temporális: facta autem tribulatióne et persecutióne propter verbum, contínuo scandalizátur.'
  "22": Qui autem seminátus est in spinis, hic est, qui verbum audit, et sollicitúdo sǽculi istíus, et fallácia divitiárum suffócat verbum, et sine fructu effícitur.
  "23": Qui vero in terram bonam seminátus est, hic est, qui audit verbum, et intélligit, et fructum affert, et facit áliud quidem centésimum, áliud autem sexagésimum, áliud vero trigésimum.
  "24": 'Aliam parábolam propósuit illis, dicens: Símile factum est regnum cælórum hómini, qui seminávit bonum semen in agro suo.'
  "25": Cum autem dormírent hómines, venit inimícus eius, et superseminávit zizánia in médio trítici, et ábiit.
  "26": Cum autem crevísset herba, et fructum fecísset, tunc apparuérunt et zizánia.
  "27": 'Accedéntes autem servi patrisfamílias, dixérunt ei: Dómine, nonne bonum semen seminásti in agro tuo? Unde ergo habet zizánia?'
  "28": 'Et ait illis: Inimícus homo hoc fecit. Servi autem dixérunt ei: Vis, imus, et collígimus ea?'
  "29": 'Et ait: Non: ne forte colligéntes zizánia, eradicétis simul cum eis et tríticum.'
  "30": 'Sínite útraque créscere usque ad messem, et in témpore messis dicam messóribus: Collígite primum zizánia, et alligáte ea in fascículos ad comburéndum: tríticum autem congregáte in hórreum meum.'
  "31": 'Aliam parábolam propósuit eis, dicens: Símile est regnum cælórum grano sinápis, quod accípiens homo seminávit in agro suo:'
  "32": 'quod mínimum quidem est ómnibus semínibus: cum autem créverit, maius est ómnibus oléribus, et fit arbor, ita ut vólucres cæli véniant, et hábitent in ramis eius.'
  "33": 'Aliam parábolam locútus est eis: Símile est regnum cælórum ferménto, quod accéptum múlier abscóndit in farínæ satis tribus, donec fermentátum est totum.'
  "34": 'Hæc ómnia locútus est Iesus in parábolis ad turbas: et sine parábolis non loquebátur eis:'
  "35": 'ut implerétur quod dictum erat per prophétam dicéntem: Apériam in parábolis os meum, eructábo abscóndita a constitutióne mundi.'
  "36": 'Tunc, dimíssis turbis, venit in domum: et accessérunt ad eum discípuli eius, dicéntes: Edíssere nobis parábolam zizaniórum agri.'
  "37": 'Qui respóndens ait illis: Qui séminat bonum semen, est Fílius hóminis.'
  "38": Ager autem est mundus. Bonum vero semen, hi sunt fílii regni. Zizánia autem, fílii sunt nequam.
  "39": Inimícus autem, qui seminávit ea, est diábolus. Messis vero, consummátio sǽculi est. Messóres autem, ángeli sunt.
  "40": 'Sicut ergo colligúntur zizánia, et igni comburúntur: sic erit in consummatióne sǽculi.'
  "41": 'Mittet Fílius hóminis ángelos suos, et cólligent de regno eius ómnia scándala, et eos, qui fáciunt iniquitátem:'
  "42": et mittent eos in camínum ignis. Ibi erit fletus et stridor déntium.
  "43": Tunc iusti fulgébunt sicut sol in regno Patris eórum. Qui habet aures audiéndi, áudiat.
  "44": 'Símile est regnum cælórum thesáuro abscóndito in agro: quem qui ínvenit homo, abscóndit, et præ gáudio illíus vadit, et vendit univérsa quæ habet, et emit agrum illum.'
  "45": Iterum símile est regnum cælórum hómini negotiatóri, quærénti bonas margarítas.
  "46": Invénta autem una pretiósa margaríta, ábiit, et véndidit ómnia quæ hábuit, et emit eam.
  "47": Iterum símile est regnum cælórum sagénæ missæ in mare, et ex omni génere píscium congregánti.
  "48": Quam, cum impléta esset, educéntes, et secus littus sedéntes, elegérunt bonos in vasa, malos autem foras misérunt.
  "49": 'Sic erit in consummatióne sǽculi: exíbunt ángeli, et separábunt malos de médio iustórum,'
  "50": 'et mittent eos in camínum ignis: ibi erit fletus, et stridor déntium.'
  "51": 'Intellexístis hæc ómnia? Dicunt ei: Etiam.'
  "52": 'Ait illis: Ideo omnis scriba doctus in regno cælórum, símilis est hómini patrifamílias, qui profert de thesáuro suo nova et vétera.'
  "53": Et factum est, cum consummásset Iesus parábolas istas, tránsiit inde.
  "54": 'Et véniens in pátriam suam, docébat eos in synagógis eórum, ita ut miraréntur, et dícerent: Unde huic sapiéntia hæc, et virtútes?'
  "55": Nonne hic est fabri fílius? nonne mater eius dícitur María, et fratres eius, Iacóbus, et Ioseph, et Simon, et Iudas?
  "56": Et soróres eius, nonne omnes apud nos sunt? unde ergo huic ómnia ista?
  "57": 'Et scandalizabántur in eo. Iesus autem dixit eis: Non est prophéta sine honóre, nisi in pátria sua, et in domo sua.'
  "58": Et non fecit ibi virtútes multas propter incredulitátem illórum.
