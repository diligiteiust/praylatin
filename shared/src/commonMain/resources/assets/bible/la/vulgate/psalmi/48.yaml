bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "48"
verses:
  "1": In finem, fíliis Core Psalmus.
  "2": 'Audíte hæc, omnes gentes: áuribus percípite, omnes qui habitátis orbem:'
  "3": 'quique terrígenæ, et fílii hóminum: simul in unum dives et pauper.'
  "4": 'Os meum loquétur sapiéntiam: et meditátio cordis mei prudéntiam.'
  "5": 'Inclinábo in parábolam aurem meam: apériam in psaltério propositiónem meam.'
  "6": 'Cur timébo in die mala? iníquitas calcánei mei circúmdabit me:'
  "7": 'qui confídunt in virtúte sua: et in multitúdine divitiárum suárum gloriántur.'
  "8": 'Frater non rédimit, rédimet homo: non dabit Deo placatiónem suam.'
  "9": 'Et prétium redemptiónis ánimæ suæ: et laborábit in ætérnum,'
  "10": et vivet adhuc in finem.
  "11": 'Non vidébit intéritum, cum víderit sapiéntes moriéntes: simul insípiens, et stultus períbunt. Et relínquent aliénis divítias suas:'
  "12": 'et sepúlcra eórum domus illórum in ætérnum. Tabernácula eórum in progénie et progénie: vocavérunt nómina sua in terris suis.'
  "13": 'Et homo, cum in honóre esset, non intelléxit: comparátus est iuméntis insipiéntibus, et símilis factus est illis.'
  "14": 'Hæc via illórum scándalum ipsis: et póstea in ore suo complacébunt.'
  "15": 'Sicut oves in inférno pósiti sunt: mors depáscet eos. Et dominabúntur eórum iusti in matutíno: et auxílium eórum veteráscet in inférno a glória eórum.'
  "16": Verúmtamen Deus rédimet ánimam meam de manu ínferi, cum accéperit me.
  "17": 'Ne timúeris cum dives factus fúerit homo: et cum multiplicáta fúerit glória domus eius.'
  "18": 'Quóniam cum interíerit, non sumet ómnia: neque descéndet cum eo glória eius.'
  "19": 'Quia ánima eius in vita ipsíus benedicétur: confitébitur tibi cum beneféceris ei.'
  "20": 'Introíbit usque in progénies patrum suórum: et usque in ætérnum non vidébit lumen.'
  "21": 'Homo, cum in honóre esset, non intelléxit: comparátus est iuméntis insipiéntibus, et símilis factus est illis.'
