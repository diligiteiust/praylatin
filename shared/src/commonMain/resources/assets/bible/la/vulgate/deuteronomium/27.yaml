bible: vulgate
lang: la
language: Latina
book: Deuteronomium
chapter: "27"
verses:
  "1": 'Præcépit autem Móyses et senióres Israel, pópulo dicéntes: Custodíte omne mandátum quod præcípio vobis hódie.'
  "2": Cumque transiéritis Iordánem in terram, quam Dóminus Deus tuus dabit tibi, ériges ingéntes lápides, et calce lævigábis eos,
  "3": 'ut possis in eis scríbere ómnia verba legis huius, Iordáne transmísso: ut intróeas terram, quam Dóminus Deus tuus dabit tibi, terram lacte et melle manántem, sicut iurávit pátribus tuis.'
  "4": 'Quando ergo transiéritis Iordánem, erígite lápides, quos ego hódie præcípio vobis in monte Hebal, et lævigábis eos calce:'
  "5": et ædificábis ibi altáre Dómino Deo tuo de lapídibus, quos ferrum non tétigit,
  "6": 'et de saxis infórmibus et impolítis: et ófferes super eo holocáusta Dómino Deo tuo,'
  "7": et immolábis hóstias pacíficas, comedésque ibi, et epuláberis coram Dómino Deo tuo.
  "8": Et scribes super lápides ómnia verba legis huius plane et lúcide.
  "9": 'Dixerúntque Móyses et sacerdótes Levítici géneris ad omnem Israélem: Atténde, et audi Israel: hódie factus es pópulus Dómini Dei tui:'
  "10": áudies vocem eius, et fácies mandáta atque iustítias, quas ego præcípio tibi.
  "11": 'Præcepítque Móyses pópulo in die illo, dicens:'
  "12": 'Hi stabunt ad benedicéndum pópulo super montem Garízim, Iordáne transmísso: Símeon, Levi, Iudas, Issachar, Ioseph, et Béniamin.'
  "13": 'Et e regióne isti stabunt ad maledicéndum in monte Hebal: Ruben, Gad, et Aser, et Zábulon, Dan, et Néphthali.'
  "14": 'Et pronuntiábunt Levítæ, dicéntque ad omnes viros Israel excélsa voce:'
  "15": 'Maledíctus homo, qui facit scúlptile et conflátile, abominatiónem Dómini, opus mánuum artíficum, ponétque illud in abscóndito: et respondébit omnis pópulus, et dicet: Amen.'
  "16": 'Maledíctus qui non honórat patrem suum, et matrem: et dicet omnis pópulus: Amen.'
  "17": 'Maledíctus qui transfert términos próximi sui: et dicet omnis pópulus: Amen.'
  "18": 'Maledíctus qui erráre facit cæcum in itínere: et dicet omnis pópulus: Amen.'
  "19": 'Maledíctus qui pervértit iudícium ádvenæ, pupílli et víduæ: et dicet omnis pópulus: Amen.'
  "20": 'Maledíctus qui dormit cum uxóre patris sui, et revélat operiméntum léctuli eius: et dicet omnis pópulus: Amen.'
  "21": 'Maledíctus qui dormit cum omni iuménto: et dicet omnis pópulus: Amen.'
  "22": 'Maledíctus qui dormit cum soróre sua, fília patris sui, vel matris suæ: et dicet omnis pópulus: Amen.'
  "23": 'Maledíctus qui dormit cum socru sua: et dicet omnis pópulus: Amen.'
  "24": 'Maledíctus qui clam percússerit próximum suum: et dicet omnis pópulus: Amen.'
  "25": 'Maledíctus qui áccipit múnera, ut percútiat ánimam sánguinis innocéntis: et dicet omnis pópulus: Amen.'
  "26": 'Maledíctus qui non pérmanet in sermónibus legis huius, nec eos ópere pérficit: et dicet omnis pópulus: Amen.'
