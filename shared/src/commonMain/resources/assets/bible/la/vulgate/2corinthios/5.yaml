bible: vulgate
lang: la
language: Latina
book: ad Corinthios II
chapter: "5"
verses:
  "1": Scimus enim quóniam si terréstris domus nostra huius habitatiónis dissolvátur, quod ædificatiónem ex Deo habémus, domum non manufáctam, ætérnam in cælis.
  "2": 'Nam et in hoc ingemíscimus, habitatiónem nostram, quæ de cælo est, superíndui cupiéntes:'
  "3": si tamen vestíti, non nudi inveniámur.
  "4": 'Nam et qui sumus in hoc tabernáculo, ingemíscimus graváti: eo quod nólumus exspoliári, sed supervestíri, ut absorbeátur quod mortále est, a vita.'
  "5": Qui autem éfficit nos in hoc ipsum, Deus, qui dedit nobis pignus Spíritus.
  "6": Audéntes ígitur semper, sciéntes quóniam dum sumus in córpore, peregrinámur a Dómino
  "7": '(per fidem enim ambulámus, et non per spéciem):'
  "8": audémus autem, et bonam voluntátem habémus magis peregrinári a córpore, et præséntes esse ad Dóminum.
  "9": Et ídeo conténdimus, sive abséntes, sive præséntes, placére illi.
  "10": Omnes enim nos manifestári opórtet ante tribúnal Christi, ut réferat unusquísque própria córporis, prout gessit, sive bonum, sive malum.
  "11": Sciéntes ergo timórem Dómini, homínibus suadémus, Deo autem manifésti sumus. Spero autem et in consciéntiis vestris maniféstos nos esse.
  "12": 'Non íterum commendámus nos vobis, sed occasiónem damus vobis gloriándi pro nobis: ut habeátis ad eos, qui in fácie gloriántur, et non in corde.'
  "13": 'Sive enim mente excédimus, Deo: sive sóbrii sumus, vobis.'
  "14": 'Cáritas enim Christi urget nos: æstimántes hoc, quóniam si unus pro ómnibus mórtuus est, ergo omnes mórtui sunt:'
  "15": 'et pro ómnibus mórtuus est Christus: ut, et qui vivunt, iam non sibi vivant, sed ei, qui pro ipsis mórtuus est et resurréxit.'
  "16": Itaque nos ex hoc néminem nóvimus secúndum carnem. Et si cognóvimus secúndum carnem Christum, sed nunc iam non nóvimus.
  "17": 'Si qua ergo in Christo nova creatúra, vétera transiérunt: ecce facta sunt ómnia nova.'
  "18": 'Omnia autem ex Deo, qui nos reconciliávit sibi per Christum: et dedit nobis ministérium reconciliatiónis:'
  "19": quóniam quidem Deus erat in Christo mundum reconcílians sibi, non réputans illis delícta ipsórum, et pósuit in nobis verbum reconciliatiónis.
  "20": Pro Christo ergo legatióne fúngimur, tamquam Deo exhortánte per nos. Obsecrámus pro Christo, reconciliámini Deo.
  "21": Eum, qui non nóverat peccátum, pro nobis peccátum fecit, ut nos efficerémur iustítia Dei in ipso.
