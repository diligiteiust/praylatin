bible: vulgate
lang: la
language: Latina
book: Matthaeus
chapter: "3"
verses:
  "1": In diébus autem illis venit Ioánnes Baptísta prǽdicans in desérto Iudǽæ,
  "2": 'et dicens: Pœniténtiam ágite: appropinquávit enim regnum cælórum.'
  "3": 'Hic est enim, qui dictus est per Isaíam prophétam dicéntem: Vox clamántis in desérto: Paráte viam Dómini: rectas fácite sémitas eius.'
  "4": 'Ipse autem Ioánnes habébat vestiméntum de pilis camelórum, et zonam pellíceam circa lumbos suos: esca autem eius erat locústæ, et mel silvéstre.'
  "5": 'Tunc exíbat ad eum Ierosólyma, et omnis Iudǽa, et omnis régio circa Iordánem:'
  "6": et baptizabántur ab eo in Iordáne, confiténtes peccáta sua.
  "7": 'Videns autem multos Pharisæórum, et Sadducæórum, veniéntes ad baptísmum suum, dixit eis: Progénies viperárum, quis demonstrávit vobis fúgere a ventúra ira?'
  "8": Fácite ergo fructum dignum pœniténtiæ.
  "9": 'Et ne velítis dícere intra vos: Patrem habémus Abraham. Dico enim vobis quóniam potens est Deus de lapídibus istis suscitáre fílios Abrahæ.'
  "10": Iam enim secúris ad radícem árborum pósita est. Omnis ergo arbor, quæ non facit fructum bonum, excidétur, et in ignem mittétur.
  "11": 'Ego quidem baptízo vos in aqua in pœniténtiam: qui autem post me ventúrus est, fórtior me est, cuius non sum dignus calceaménta portáre: ipse vos baptizábit in Spíritu sancto, et igni.'
  "12": 'Cuius ventilábrum in manu sua: et permundábit áream suam: et congregábit tríticum suum in hórreum, páleas autem combúret igni inexstinguíbili.'
  "13": Tunc venit Iesus a Galilǽa in Iordánem ad Ioánnem, ut baptizarétur ab eo.
  "14": 'Ioánnes autem prohibébat eum, dicens: Ego a te débeo baptizári, et tu venis ad me?'
  "15": 'Respóndens autem Iesus, dixit ei: Sine modo: sic enim decet nos implére omnem iustítiam. Tunc dimísit eum.'
  "16": 'Baptizátus autem Iesus, conféstim ascéndit de aqua, et ecce apérti sunt ei cæli: et vidit Spíritum Dei descendéntem sicut colúmbam, et veniéntem super se.'
  "17": 'Et ecce vox de cælis dicens: Hic est Fílius meus diléctus, in quo mihi complácui.'
