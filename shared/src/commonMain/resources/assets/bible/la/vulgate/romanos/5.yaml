bible: vulgate
lang: la
language: Latina
book: ad Romanos
chapter: "5"
verses:
  "1": 'Iustificáti ergo ex fide, pacem habeámus ad Deum per Dóminum nostrum Iesum Christum:'
  "2": per quem et habémus accéssum per fidem in grátiam istam, in qua stamus, et gloriámur in spe glóriæ filiórum Dei.
  "3": 'Non solum autem, sed et gloriámur in tribulatiónibus: sciéntes quod tribulátio patiéntiam operátur:'
  "4": patiéntia autem probatiónem, probátio vero spem,
  "5": 'spes autem non confúndit: quia cáritas Dei diffúsa est in córdibus nostris per Spíritum sanctum, qui datus est nobis.'
  "6": Ut quid enim Christus, cum adhuc infírmi essémus, secúndum tempus pro ímpiis mórtuus est?
  "7": 'Vix enim pro iusto quis móritur: nam pro bono fórsitan quis áudeat mori.'
  "8": 'Comméndat autem caritátem suam Deus in nobis: quóniam cum adhuc peccatóres essémus, secúndum tempus,'
  "9": 'Christus pro nobis mórtuus est: multo ígitur magis nunc iustificáti in sánguine ipsíus, salvi érimus ab ira per ipsum.'
  "10": 'Si enim cum inimíci essémus, reconciliáti sumus Deo per mortem Fílii eius: multo magis reconciliáti, salvi érimus in vita ipsíus.'
  "11": 'Non solum autem: sed et gloriámur in Deo per Dóminum nostrum Iesum Christum, per quem nunc reconciliatiónem accépimus.'
  "12": Proptérea sicut per unum hóminem peccátum in hunc mundum intrávit, et per peccátum mors, et ita in omnes hómines mors pertránsiit, in quo omnes peccavérunt.
  "13": 'Usque ad legem enim peccátum erat in mundo: peccátum autem non imputabátur, cum lex non esset.'
  "14": Sed regnávit mors ab Adam usque ad Móysen étiam in eos, qui non peccavérunt in similitúdinem prævaricatiónis Adæ, qui est forma futúri.
  "15": 'Sed non sicut delíctum, ita et donum: si enim uníus delícto multi mórtui sunt: multo magis grátia Dei et donum in grátia uníus hóminis Iesu Christi in plures abundávit.'
  "16": 'Et non sicut per unum peccátum, ita et donum. Nam iudícium quidem ex uno in condemnatiónem: grátia autem ex multis delíctis in iustificatiónem.'
  "17": 'Si enim uníus delícto mors regnávit per unum: multo magis abundántiam grátiæ, et donatiónis, et iustítiæ accipiéntes, in vita regnábunt per unum Iesum Christum.'
  "18": 'Igitur sicut per uníus delíctum in omnes hómines in condemnatiónem: sic et per uníus iustítiam in omnes hómines in iustificatiónem vitæ.'
  "19": 'Sicut enim per inobediéntiam uníus hóminis, peccatóres constitúti sunt multi: ita et per uníus obeditiónem, iusti constituéntur multi.'
  "20": 'Lex autem subintrávit ut abundáret delíctum. Ubi autem abundávit delíctum, superabundávit grátia:'
  "21": 'ut sicut regnávit peccátum in mortem: ita et grátia regnet per iustítiam in vitam ætérnam, per Iesum Christum Dóminum nostrum.'
