bible: vulgate
lang: la
language: Latina
book: Genesis
chapter: "35"
verses:
  "1": 'Intérea locútus est Deus ad Iacob: Surge, et ascénde Bethel, et hábita ibi, facque altáre Deo qui appáruit tibi quando fugiébas Esau fratrem tuum.'
  "2": 'Iacob vero convocáta omni domo sua, ait: Abícite deos aliénos qui in médio vestri sunt, et mundámini, ac mutáte vestiménta vestra.'
  "3": 'Súrgite, et ascendámus in Bethel, ut faciámus ibi altáre Deo: qui exaudívit me in die tribulatiónis meæ, et sócius fuit itíneris mei.'
  "4": 'Dedérunt ergo ei omnes deos aliénos quos habébant, et ináures quæ erant in áuribus eórum: at ille infódit ea subter terebínthum, quæ est post urbem Sichem.'
  "5": Cumque profécti essent, terror Dei invásit omnes per circúitum civitátes, et non sunt ausi pérsequi recedéntes.
  "6": 'Venit ígitur Iacob Luzam, quæ est in terra Chánaan, cognoménto Bethel: ipse et omnis pópulus cum eo.'
  "7": 'Ædificavítque ibi altáre, et appellávit nomen loci illíus, Domus Dei: ibi enim appáruit ei Deus cum fúgeret fratrem suum.'
  "8": 'Eódem témpore mórtua est Débora nutrix Rebéccæ, et sepúlta est ad radíces Bethel subter quercum: vocatúmque est nomen loci illíus, Quercus fletus.'
  "9": Appáruit autem íterum Deus Iacob postquam revérsus est de Mesopotámia Sýriæ, benedixítque ei,
  "10": 'dicens: Non vocáberis ultra Iacob, sed Israel erit nomen tuum. Et appellávit eum Israel,'
  "11": 'dixítque ei: Ego Deus omnípotens: cresce, et multiplicáre: gentes et pópuli natiónum ex te erunt, reges de lumbis tuis egrediéntur,'
  "12": terrámque quam dedi Abraham et Isaac, dabo tibi et sémini tuo post te.
  "13": Et recéssit ab eo.
  "14": 'Ille vero eréxit títulum lapídeum in loco quo locútus fúerat ei Deus: libans super eum libámina, et effúndens óleum:'
  "15": vocánsque nomen loci illíus Bethel.
  "16": 'Egréssus autem inde, venit verno témpore ad terram quæ ducit Ephratam: in qua cum parturíret Rachel,'
  "17": 'ob difficultátem partus periclitári cœpit. Dixítque ei óbstetrix: Noli timére, quia et hunc habébis fílium.'
  "18": 'Egrediénte autem ánima præ dolóre, et imminénte iam morte, vocávit nomen fílii sui Bénoni, id est, Fílius dolóris mei: pater vero appellávit eum Béniamin, id est, Fílius dextræ.'
  "19": Mórtua est ergo Rachel, et sepúlta est in via quæ ducit Ephratam, hæc est Béthlehem.
  "20": 'Erexítque Iacob títulum super sepúlcrum eius: hic est títulus monuménti Rachel, usque in præséntem diem.'
  "21": Egréssus inde, fixit tabernáculum trans Turrem gregis.
  "22": 'Cumque habitáret in illa regióne, ábiit Ruben, et dormívit cum Bala concubína patris sui: quod illum mínime látuit. Erant autem fílii Iacob duódecim.'
  "23": 'Fílii Liæ: primogénitus Ruben, et Símeon, et Levi, et Iudas, et Issachar, et Zábulon.'
  "24": 'Fílii Rachel: Ioseph et Béniamin.'
  "25": 'Fílii Balæ ancíllæ Rachélis: Dan et Néphthali.'
  "26": 'Fílii Zelphæ ancíllæ Liæ: Gad et Aser: hi sunt fílii Iacob, qui nati sunt ei in Mesopotámia Sýriæ.'
  "27": Venit étiam ad Isaac patrem suum in Mambre, civitátem Arbée, hæc est Hebron, in qua peregrinátus est Abraham et Isaac.
  "28": Et compléti sunt dies Isaac centum octogínta annórum.
  "29": 'Consumptúsque ætáte mórtuus est: et appósitus est pópulo suo senex et plenus diérum: et sepeliérunt eum Esau et Iacob fílii sui.'
