bible: vulgate
lang: la
language: Latina
book: Exodus
chapter: "28"
verses:
  "1": 'Applica quoque ad te Aaron fratrem tuum cum fíliis suis de médio filiórum Israel, ut sacerdótio fungántur mihi: Aaron, Nadab, et Abiu, Eleázar, et Ithamar.'
  "2": Faciésque vestem sanctam Aaron fratri tuo in glóriam et decórem.
  "3": Et loquéris cunctis sapiéntibus corde, quos replévi spíritu prudéntiæ, ut fáciant vestes Aaron, in quibus sanctificátus minístret mihi.
  "4": 'Hæc autem erunt vestiménta quæ fáciet: Rationále et superhumerále, túnicam et líneam strictam, cídarim et bálteum. Fácient vestiménta sancta fratri tuo Aaron et fíliis eius, ut sacerdótio fungántur mihi.'
  "5": Accipiéntque aurum, et hyacínthum, et púrpuram, coccúmque bis tinctum, et byssum.
  "6": Fácient autem superhumerále de auro et hyacíntho et púrpura, coccóque bis tincto, et bysso retórta, ópere polýmito.
  "7": Duas oras iunctas habébit in utróque látere summitátum, ut in unum rédeant.
  "8": Ipsa quoque textúra et cuncta óperis varíetas erit ex auro et hyacíntho, et púrpura, coccóque bis tincto, et bysso retórta.
  "9": 'Sumésque duos lápides onýchinos, et sculpes in eis nómina filiórum Israel:'
  "10": sex nómina in lápide uno, et sex réliqua in áltero, iuxta órdinem nativitátis eórum.
  "11": 'Opere sculptóris et cælatúra gemmárii, sculpes eos nomínibus filiórum Israel, inclúsos auro atque circúmdatos:'
  "12": et pones in utróque látere superhumerális, memoriále fíliis Israel. Portabítque Aaron nómina eórum coram Dómino super utrúmque húmerum, ob recordatiónem.
  "13": Fácies et uncínos ex auro,
  "14": et duas caténulas ex auro puríssimo sibi ínvicem cohæréntes, quas ínseres uncínis.
  "15": Rationále quoque iudícii fácies ópere polýmito iuxta textúram superhumerális, ex auro, hyacíntho, et púrpura, coccóque bis tincto, et bysso retórta.
  "16": 'Quadrángulum erit et duplex: mensúram palmi habébit tam in longitúdine quam in latitúdine.'
  "17": 'Ponésque in eo quátuor órdines lápidum: in primo versu erit lapis sárdius, et topázius, et smarágdus:'
  "18": 'in secúndo carbúnculus, sapphírus, et iaspis:'
  "19": 'in tértio ligúrius, achátes, et amethýstus:'
  "20": 'in quarto chrysólithus, onýchinus, et berýllus: inclúsi auro erunt per órdines suos.'
  "21": 'Habebúntque nómina filiórum Israel: duódecim nomínibus cælabúntur, sínguli lápides nomínibus singulórum per duódecim tribus.'
  "22": 'Fácies in rationáli caténas sibi ínvicem cohæréntes ex auro puríssimo:'
  "23": 'et duos ánnulos áureos, quos pones in utráque rationális summitáte:'
  "24": 'catenásque áureas iunges ánnulis, qui sunt in margínibus eius:'
  "25": et ipsárum catenárum extréma duóbus copulábis uncínis in utróque látere superhumerális quod rationále réspicit.
  "26": Fácies et duos ánnulos áureos, quos pones in summitátibus rationális, in oris, quæ e regióne sunt superhumerális, et posterióra eius aspíciunt.
  "27": Necnon et álios duos ánnulos áureos, qui ponéndi sunt in utróque látere superhumerális deórsum, quod réspicit contra fáciem iunctúræ inferióris, ut aptári possit cum superhumeráli,
  "28": et stringátur rationále ánnulis suis cum ánnulis superhumerális vitta hyacínthina, ut máneat iunctúra fabrefácta, et a se ínvicem rationále et superhumerále néqueant separári.
  "29": Portabítque Aaron nómina filiórum Israel in rationáli iudícii super pectus suum, quando ingrediétur sanctuárium, memoriále coram Dómino in ætérnum.
  "30": 'Pones autem in rationáli iudícii Doctrínam et Veritátem, quæ erunt in péctore Aaron, quando ingrediétur coram Dómino: et gestábit iudícium filiórum Israel in péctore suo, in conspéctu Dómini semper.'
  "31": Fácies et túnicam superhumerális totam hyacínthinam,
  "32": in cuius médio supra erit capítium, et ora per gyrum eius téxtilis, sicut fíeri solet in extrémis véstium pártibus, ne fácile rumpátur.
  "33": Deórsum vero, ad pedes eiúsdem túnicæ, per circúitum, quasi mala púnica fácies, ex hyacíntho, et púrpura, et cocco bis tincto, mixtis in médio tintinnábulis,
  "34": 'ita ut tintinnábulum sit áureum et malum púnicum: rursúmque tintinnábulum áliud áureum et malum púnicum.'
  "35": Et vestiétur ea Aaron in offício ministérii, ut audiátur sónitus quando ingréditur et egréditur sanctuárium in conspéctu Dómini, et non moriátur.
  "36": Fácies et láminam de auro puríssimo, in qua sculpes ópere cælatóris, Sanctum Dómino.
  "37": Ligabísque eam vitta hyacínthina, et erit super tiáram,
  "38": ímminens fronti pontíficis. Portabítque Aaron iniquitátes eórum, quæ obtulérunt et sanctificavérunt fílii Israel, in cunctis munéribus et donáriis suis. Erit autem lámina semper in fronte eius, ut placátus sit eis Dóminus.
  "39": Stringésque túnicam bysso, et tiáram býssinam fácies, et bálteum ópere plumárii.
  "40": 'Porro fíliis Aaron túnicas líneas parábis et bálteos ac tiáras in glóriam et decórem:'
  "41": vestiésque his ómnibus Aaron fratrem tuum et fílios eius cum eo. Et cunctórum consecrábis manus, sanctificabísque illos, ut sacerdótio fungántur mihi.
  "42": 'Fácies et feminália línea, ut opériant carnem turpitúdinis suæ, a rénibus usque ad fémora:'
  "43": et uténtur eis Aaron et fílii eius quando ingrediéntur tabernáculum testimónii, vel quando appropínquant ad altáre ut minístrent in sanctuário, ne iniquitátis rei moriántur. Legítimum sempitérnum erit Aaron, et sémini eius post eum.
