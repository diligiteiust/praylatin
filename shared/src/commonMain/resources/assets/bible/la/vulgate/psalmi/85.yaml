bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "85"
verses:
  "1": 'Orátio ipsi David. Inclína Dómine aurem tuam, et exáudi me: quóniam inops, et pauper sum ego.'
  "2": 'Custódi ánimam meam, quóniam sanctus sum: salvum fac servum tuum, Deus meus, sperántem in te.'
  "3": 'Miserére mei Dómine, quóniam ad te clamávi tota die:'
  "4": lætífica ánimam servi tui, quóniam ad te Dómine ánimam meam levávi.
  "5": 'Quóniam tu Dómine suávis et mitis: et multæ misericórdiæ ómnibus invocántibus te.'
  "6": 'Auribus pércipe Dómine oratiónem meam: et inténde voci deprecatiónis meæ.'
  "7": 'In die tribulatiónis meæ clamávi ad te: quia exaudísti me.'
  "8": 'Non est símilis tui in diis Dómine: et non est secúndum ópera tua.'
  "9": 'Omnes gentes quascúmque fecísti, vénient, et adorábunt coram te Dómine: et glorificábunt nomen tuum.'
  "10": 'Quóniam magnus es tu, et fáciens mirabília: tu es Deus solus.'
  "11": 'Deduc me Dómine in via tua, et ingrédiar in veritáte tua: lætétur cor meum, ut tímeat nomen tuum.'
  "12": 'Confitébor tibi Dómine Deus meus in toto corde meo, et glorificábo nomen tuum in ætérnum:'
  "13": 'quia misericórdia tua magna est super me: et eruísti ánimam meam ex inférno inferióri.'
  "14": 'Deus, iníqui insurrexérunt super me, et synagóga poténtium quæsiérunt ánimam meam: et non proposuérunt te in conspéctu suo.'
  "15": Et tu Dómine Deus miserátor et miséricors, pátiens, et multæ misericórdiæ, et verax,
  "16": 'réspice in me, et miserére mei: da impérium tuum púero tuo: et salvum fac fílium ancíllæ tuæ.'
  "17": 'Fac mecum signum in bonum, ut vídeant qui odérunt me, et confundántur: quóniam tu Dómine adiuvísti me, et consolátus es me.'
