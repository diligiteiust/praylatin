bible: vulgate
lang: la
language: Latina
book: II Paralipomenon
chapter: "15"
verses:
  "1": Azarías autem fílius Oded, facto in se spíritu Dei,
  "2": 'egréssus est in occúrsum Asa, et dixit ei: Audíte me Asa, et omnis Iuda et Béniamin: Dóminus vobíscum, quia fuístis cum eo. Si quæsiéritis eum, inveniétis: si autem dereliquéritis eum, derelínquet vos.'
  "3": Transíbunt autem multi dies in Israel absque Deo vero, et absque sacerdóte doctóre, et absque lege.
  "4": Cumque revérsi fúerint in angústia sua ad Dóminum Deum Israel, et quæsíerint eum, repérient eum.
  "5": 'In témpore illo non erit pax egrediénti, et ingrediénti, sed terróres úndique in cunctis habitatóribus terrárum:'
  "6": pugnábit enim gens contra gentem, et cívitas contra civitátem, quia Dóminus conturbábit eos in omni angústia.
  "7": 'Vos ergo confortámini, et non dissolvántur manus vestræ: erit enim merces óperi vestro.'
  "8": 'Quod cum audísset Asa, verba scílicet, et prophetíam Azaríæ fílii Oded prophétæ, confortátus est, et ábstulit idóla de omni terra Iuda, et de Béniamin, et ex úrbibus, quas céperat, montis Ephraim: et dedicávit altáre Dómini quod erat ante pórticum Dómini.'
  "9": 'Congregavítque univérsum Iudam et Béniamin, et ádvenas cum eis de Ephraim, et de Manásse, et de Símeon: plures enim ad eum confúgerant ex Israel, vidéntes quod Dóminus Deus illíus esset cum eo.'
  "10": Cumque veníssent in Ierúsalem mense tértio, anno decimoquínto regni Asa,
  "11": immolavérunt Dómino in die illa de manúbiis, et præda, quam addúxerant, boves septingéntos, et aríetes septem míllia.
  "12": Et intrávit ex more ad corroborándum fœdus, ut quǽrerent Dóminum Deum patrum suórum in toto corde, et in tota ánima sua.
  "13": Si quis autem, inquit, non quæsíerit Dóminum Deum Israel, moriátur, a mínimo usque ad máximum, a viro usque ad mulíerem.
  "14": Iuraverúntque Dómino voce magna in iúbilo, et in clangóre tubæ, et in sónitu buccinárum,
  "15": 'omnes qui erant in Iuda, cum exsecratióne: in omni enim corde suo iuravérunt, et in tota voluntáte quæsiérunt eum, et invenérunt: præstitítque eis Dóminus réquiem per circúitum.'
  "16": 'Sed et Máacham matrem Asa regis ex augústo depósuit império, eo quod fecísset in luco simulácrum Priápi: quod omne contrívit, et in frusta commínuens combússit in torrénte Cedron.'
  "17": 'Excélsa autem derelícta sunt in Israel: áttamen cor Asa erat perféctum cunctis diébus eius.'
  "18": Eáque quæ vóverat pater suus, et ipse, íntulit in domum Dómini, argéntum, et aurum, vasorúmque divérsam supelléctilem.
  "19": Bellum vero non fuit usque ad trigésimum quintum annum regni Asa.
