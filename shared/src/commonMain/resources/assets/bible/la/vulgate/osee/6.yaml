bible: vulgate
lang: la
language: Latina
book: Osee
chapter: "6"
verses:
  "1": 'In tribulatióne sua mane consúrgent ad me: Veníte, et revertámur ad Dóminum:'
  "2": 'quia ipse cepit, et sanábit nos: percútiet, et curábit nos.'
  "3": 'Vivificábit nos post duos dies: in die tértia suscitábit nos, et vivémus in conspéctu eius. Sciémus, sequemúrque ut cognoscámus Dóminum: quasi dilúculum præparátus est egréssus eius, et véniet quasi imber nobis temporáneus, et serótinus terræ.'
  "4": Quid fáciam tibi Ephraim? quid fáciam tibi Iuda? misericórdia vestra quasi nubes matutína, et quasi ros mane pertránsiens.
  "5": 'Propter hoc dolávi in prophétis, occídi eos in verbis oris mei: et iudícia tua quasi lux egrediéntur.'
  "6": Quia misericórdiam vólui, et non sacrifícium, et sciéntiam Dei plus quam holocáusta.
  "7": 'Ipsi autem sicut Adam transgréssi sunt pactum: ibi prævaricáti sunt in me.'
  "8": Gálaad cívitas operántium idólum, supplantáta sánguine.
  "9": 'Et quasi fauces virórum latrónum, párticeps sacerdótum, in via interficiéntium pergéntes de Sichem: quia scelus operáti sunt.'
  "10": 'In domo Israel vidi horréndum: ibi fornicatiónes Ephraim: contaminátus est Israel.'
  "11": Sed et Iuda pone messem tibi, cum convértero captivitátem pópuli mei.
