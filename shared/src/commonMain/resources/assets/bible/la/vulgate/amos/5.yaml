bible: vulgate
lang: la
language: Latina
book: Amos
chapter: "5"
verses:
  "1": Audíte verbum istud, quod ego levo super vos planctum. Domus Israel cécidit, et non adíciet ut resúrgat.
  "2": Virgo Israel proiécta est in terram suam, non est qui súscitet eam.
  "3": 'Quia hæc dicit Dóminus Deus: Urbs, de qua egrediebántur mille, relinquéntur in ea centum: et de qua egrediebántur centum, relinquéntur in ea decem in domo Israel.'
  "4": 'Quia hæc dicit Dóminus dómui Israel: Quǽrite me, et vivétis.'
  "5": 'Et nolíte quǽrere Bethel, et in Gálgalam nolíte intráre, et in Bersabée non transíbitis: quia Gálgala captíva ducétur, et Bethel erit inútilis.'
  "6": 'Quǽrite Dóminum, et vívite: ne forte comburátur ut ignis domus Ioseph, et devorábit, et non erit qui exstínguat Bethel.'
  "7": Qui convértitis in absínthium iudícium, et iustítiam in terra relínquitis.
  "8": 'Faciéntem Arctúrum, et Oríonem, et converténtem in mane ténebras, et diem in noctem mutántem: qui vocat aquas maris, et effúndit eas super fáciem terræ: Dóminus nomen est eius.'
  "9": Qui subrídet vastitátem super robústum, et depopulatiónem super poténtem affert.
  "10": 'Odio habuérunt corripiéntem in porta: et loquéntem perfécte abomináti sunt.'
  "11": 'Idcírco, pro eo quod diripiebátis páuperem, et prædam eléctam tollebátis ab eo: domos quadro lápide ædificábitis, et non habitábitis in eis: víneas plantábis amantíssimas, et non bibétis vinum eárum.'
  "12": 'Quia cognóvi multa scélera vestra, et fórtia peccáta vestra: hostes iusti accipiéntes munus, et páuperes depriméntes in porta.'
  "13": Ideo prudens in témpore illo tacébit, quia tempus malum est.
  "14": 'Quǽrite bonum, et non malum, ut vivátis: et erit Dóminus Deus exercítuum vobíscum, sicut dixístis.'
  "15": 'Odíte malum, et dilígite bonum, et constitúite in porta iudícium: si forte misereátur Dóminus Deus exercítuum relíquiis Ioseph.'
  "16": 'Proptérea hæc dicit Dóminus Deus exercítuum dominátor, in ómnibus platéis planctus: et in cunctis, quæ foris sunt, dicétur væ væ: et vocábunt agrícolam ad luctum, et ad planctum eos, qui sciunt plángere.'
  "17": 'Et in ómnibus víneis erit planctus: quia pertransíbo in médio tui, dicit Dóminus.'
  "18": 'Væ desiderántibus diem Dómini: ad quid eam vobis? dies Dómini ista, ténebræ, et non lux.'
  "19": 'Quómodo si fúgiat vir a fácie leónis, et occúrrat ei ursus: et ingrediátur domum, et innitátur manu sua super paríetem, et mórdeat eum cóluber.'
  "20": 'Numquid non ténebræ dies Dómini, et non lux: et calígo, et non splendor in ea?'
  "21": 'Odi, et proiéci festivitátes vestras: et non cápiam odórem cœ́tuum vestrórum.'
  "22": 'Quod si obtuléritis mihi holocautómata, et múnera vestra, non suscípiam: et vota pínguium vestrórum non respíciam.'
  "23": 'Aufer a me tumúltum cárminum tuórum: et cántica lyræ tuæ non áudiam.'
  "24": Et revelábitur quasi aqua iudícium, et iustítia quasi torrens fortis.
  "25": Numquid hóstias et sacrifícium obtulístis mihi in desérto quadragínta annis, domus Israel?
  "26": Et portástis tabernáculum Moloch vestro, et imáginem idolórum vestrórum, sidus Dei vestri, quæ fecístis vobis.
  "27": Et migráre vos fáciam trans Damáscum, dicit Dóminus, Deus exercítuum nomen eius.
