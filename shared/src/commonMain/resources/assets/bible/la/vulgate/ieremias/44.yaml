bible: vulgate
lang: la
language: Latina
book: Ieremias
chapter: "44"
verses:
  "1": 'Verbum, quod factum est per Ieremíam ad omnes Iudǽos, qui habitábant in terra Ægýpti, habitántes in Mágdalo, et in Taphnis, et in Memphis, et in terra Phatúres, dicens:'
  "2": 'Hæc dicit Dóminus exercítuum, Deus Israel: Vos vidístis omne malum istud, quod addúxi super Ierúsalem, et super omnes urbes Iuda: et ecce desértæ sunt hódie, et non est in eis habitátor:'
  "3": propter malítiam, quam fecérunt ut me ad iracúndiam provocárent, et irent ut sacrificárent, et cólerent deos aliénos, quos nesciébant, et illi, et vos, et patres vestri.
  "4": 'Et misi ad vos omnes servos meos prophétas, de nocte consúrgens, mitténsque et dicens: Nolíte fácere verbum abominatiónis huiuscémodi, quam odívi.'
  "5": Et non audiérunt, nec inclinavérunt aurem suam ut converteréntur a malis suis, et non sacrificárent diis aliénis.
  "6": 'Et confláta est indignátio mea et furor meus, et succénsa est in civitátibus Iuda, et in platéis Ierúsalem: et versæ sunt in solitúdinem et vastitátem secúndum diem hanc.'
  "7": 'Et nunc hæc dicit Dóminus exercítuum, Deus Israel: Quare vos fácitis malum grande hoc contra ánimas vestras, ut intéreat ex vobis vir et múlier, párvulus et lactens, de médio Iudæ, nec relinquátur vobis quidquam resíduum:'
  "8": 'provocántes me in opéribus mánuum vestrárum, sacrificándo diis aliénis in terra Ægýpti, in quam ingréssi estis ut habitétis ibi: et dispereátis, et sitis in maledictiónem, et in oppróbrium cunctis géntibus terræ?'
  "9": Numquid oblíti estis mala patrum vestrórum, et mala regum Iuda, et mala uxórum eius, et mala vestra, et mala uxórum vestrárum, quæ fecérunt in terra Iuda, et in regiónibus Ierúsalem?
  "10": 'Non sunt mundáti usque ad diem hanc: et non timuérunt, et non ambulavérunt in lege Dómini, et in præcéptis meis, quæ dedi coram vobis et coram pátribus vestris.'
  "11": 'Ideo hæc dicit Dóminus exercítuum, Deus Israel: Ecce ego ponam fáciem meam in vobis in malum: et dispérdam omnem Iudam.'
  "12": 'Et assúmam relíquias Iudæ, qui posuérunt fácies suas ut ingrederéntur terram Ægýpti, et habitárent ibi: et consuméntur omnes in terra Ægýpti: cadent in gládio, et in fame, et consuméntur a mínimo usque ad máximum: in gládio et in fame moriéntur, et erunt in iusiurándum, et in miráculum, et in maledictiónem, et in oppróbrium.'
  "13": Et visitábo super habitatóres terræ Ægýpti sicut visitávi super Ierúsalem, in gládio, et fame, et peste.
  "14": 'Et non erit qui effúgiat, et sit resíduus de relíquiis Iudæórum, qui vadunt ut peregrinéntur in terra Ægýpti: et revertántur in terram Iuda, ad quam ipsi élevant ánimas suas ut revertántur, et hábitent ibi: non reverténtur, nisi qui fúgerint.'
  "15": 'Respondérunt autem Ieremíæ omnes viri sciéntes quod sacrificárent uxóres eórum diis aliénis: et univérsæ mulíeres, quarum stabat multitúdo grandis, et omnis pópulus habitántium in terra Ægýpti in Phatúres, dicéntes:'
  "16": 'Sermónem, quem locútus es ad nos in nómine Dómini, non audiémus ex te:'
  "17": 'sed faciéntes faciémus omne verbum, quod egrediétur de ore nostro, ut sacrificémus regínæ cæli, et libémus ei libámina, sicut fécimus nos et patres nostri, reges nostri et príncipes nostri, in úrbibus Iuda, et in platéis Ierúsalem: et saturáti sumus pánibus, et bene nobis erat, malúmque non vídimus.'
  "18": Ex eo autem témpore quo cessávimus sacrificáre regínæ cæli, et libáre ei libámina, indigémus ómnibus, et gládio, et fame consúmpti sumus.
  "19": 'Quod si nos sacrificámus regínæ cæli, et libámus ei libámina: numquid sine viris nostris fécimus ei placéntas ad coléndum eam, et libándum ei libámina?'
  "20": 'Et dixit Ieremías ad omnem pópulum, advérsum viros, et advérsum mulíeres, et advérsum univérsam plebem, qui respónderant ei verbum, dicens:'
  "21": Numquid non sacrifícium, quod sacrificástis in civitátibus Iuda, et in platéis Ierúsalem, vos et patres vestri, reges vestri, et príncipes vestri, et pópulus terræ, horum recordátus est Dóminus, et ascéndit super cor eius?
  "22": 'Et non póterat Dóminus ultra portáre propter malítiam studiórum vestrórum, et propter abominatiónes, quas fecístis: et facta est terra vestra in desolatiónem, et in stupórem, et in maledíctum, eo quod non sit habitátor, sicut est dies hæc.'
  "23": 'Proptérea quod sacrificavéritis idólis, et peccavéritis Dómino: et non audiéritis vocem Dómini, et in lege, et in præcéptis, et in testimóniis eius non ambulavéritis: idcírco evenérunt vobis mala hæc, sicut est dies hæc.'
  "24": 'Dixit autem Ieremías ad omnem pópulum, et ad univérsas mulíeres: Audíte verbum Dómini omnis Iuda, qui estis in terra Ægýpti:'
  "25": 'Hæc inquit Dóminus exercítuum, Deus Israel, dicens: Vos, et uxóres vestræ locúti estis ore vestro, et mánibus vestris impléstis, dicéntes: Faciámus vota nostra, quæ vóvimus, ut sacrificémus regínæ cæli, et libémus ei libámina: impléstis vota vestra, et ópere perpetrástis ea.'
  "26": 'Ideo audíte verbum Dómini omnis Iuda, qui habitátis in terra Ægýpti: Ecce ego iurávi in nómine meo magno, ait Dóminus: quia nequáquam ultra vocábitur nomen meum ex ore omnis viri Iudǽi, dicéntis: Vivit Dóminus Deus in omni terra Ægýpti.'
  "27": 'Ecce ego vigilábo super eos in malum, et non in bonum: et consuméntur omnes viri Iuda, qui sunt in terra Ægýpti, gládio, et fame, donec pénitus consumántur.'
  "28": 'Et qui fúgerint gládium, reverténtur de terra Ægýpti in terram Iuda viri pauci: et scient omnes relíquiæ Iuda, ingrediéntium terram Ægýpti ut hábitent ibi, cuius sermo compleátur, meus an illórum.'
  "29": 'Et hoc vobis signum, ait Dóminus, quod vísitem ego super vos in loco isto: ut sciátis quia vere complebúntur sermónes mei contra vos in malum:'
  "30": 'Hæc dicit Dóminus: Ecce ego tradam Pharaónem Ephrée regem Ægýpti in manu inimicórum eius, et in manu quæréntium ánimam illíus: sicut trádidi Sedecíam regem Iuda in manu Nabuchodónosor regis Babylónis inimíci sui, et quæréntis ánimam eius.'
