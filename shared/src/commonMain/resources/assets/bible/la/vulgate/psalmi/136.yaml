bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "136"
verses:
  "1": 'Psalmus David, Ieremíæ. Super flúmina Babylónis, illic sédimus et flévimus, cum recordarémur Sion:'
  "2": in salícibus in médio eius, suspéndimus órgana nostra.
  "3": 'Quia illic interrogavérunt nos, qui captívos duxérunt nos, verba cantiónum: et qui abduxérunt nos: Hymnum cantáte nobis de cánticis Sion.'
  "4": Quómodo cantábimus cánticum Dómini in terra aliéna?
  "5": Si oblítus fúero tui Ierúsalem, oblivióni detur déxtera mea.
  "6": 'Adhǽreat lingua mea fáucibus meis, si non memínero tui: si non proposúero Ierúsalem in princípio lætítiæ meæ.'
  "7": 'Memor esto Dómine filiórum Edom, in die Ierúsalem: qui dicunt: Exinaníte, exinaníte usque ad fundaméntum in ea.'
  "8": 'Fília Babylónis mísera: beátus, qui retríbuet tibi retributiónem tuam, quam retribuísti nobis.'
  "9": Beátus, qui tenébit, et allídet párvulos tuos ad petram.
