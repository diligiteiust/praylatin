bible: vulgate
lang: la
language: Latina
book: II Regum
chapter: "10"
verses:
  "1": 'Erant autem Achab septuagínta fílii in Samaría: scripsit ergo Iehu lítteras, et misit in Samaríam, ad optimátes civitátis, et ad maióres natu, et ad nutrítios Achab, dicens:'
  "2": Statim ut accepéritis lítteras has, qui habétis fílios dómini vestri, et currus, et equos, et civitátes firmas, et arma,
  "3": elígite meliórem, et eum qui vobis placúerit de fíliis dómini vestri, et eum pónite super sólium patris sui, et pugnáte pro domo dómini vestri.
  "4": 'Timuérunt illi veheménter, et dixérunt: Ecce duo reges non potuérunt stare coram eo, et quómodo nos valébimus resístere?'
  "5": 'Misérunt ergo præpósiti domus, et præfécti civitátis, et maióres natu, et nutrítii, ad Iehu, dicéntes: Servi tui sumus: quæcúmque iússeris faciémus, nec constituémus nobis regem: quæcúmque tibi placent, fac.'
  "6": 'Rescrípsit autem eis lítteras secúndo, dicens: Si mei estis, et obedítis mihi, tóllite cápita filiórum dómini vestri, et veníte ad me hac eádem hora cras in Iézrahel. Porro fílii regis, septuagínta viri, apud optimátes civitátes nutriebántur.'
  "7": Cumque veníssent lítteras ad eos, tulérunt fílios regis, et occidérunt septuagínta viros, et posuérunt cápita eórum in cóphinis, et misérunt ad eum in Iézrahel.
  "8": 'Venit autem núntius, et indicávit ei, dicens: Attulérunt cápita filiórum regis. Qui respóndit: Pónite ea ad duos acérvos iuxta intróitum portæ usque mane.'
  "9": 'Cumque diluxísset, egréssus est, et stans dixit ad omnem pópulum: Iusti estis: si ego coniurávi contra dóminum meum, et interféci eum, quis percússit omnes hos?'
  "10": 'Vidéte ergo nunc quóniam non cécidit de sermónibus Dómini in terram, quos locútus est Dóminus super domum Achab: et Dóminus fecit quod locútus est in manu servi sui Elíæ.'
  "11": Percússit ígitur Iehu omnes, qui réliqui erant de domo Achab in Iézrahel, et univérsos optimátes eius, et notos, et sacerdótes, donec non remanérent ex eo relíquiæ.
  "12": 'Et surréxit, et venit in Samaríam: cumque venísset ad Cámeram pastórum in via,'
  "13": 'invénit fratres Ochozíæ regis Iuda: dixítque ad eos: Quinam estis vos? Qui respondérunt: Fratres Ochozíæ sumus, et descéndimus ad salutándos fílios regis, et fílios regínæ.'
  "14": 'Qui ait: Comprehéndite eos vivos. Quos cum comprehendíssent vivos, iugulavérunt eos in cistérna iuxta Cámeram, quadragínta duos viros: et non relíquit ex eis quemquam.'
  "15": 'Cumque abiísset inde, invénit Iónadab fílium Rechab in occúrsum sibi, et benedíxit ei. Et ait ad eum: Numquid est cor tuum rectum, sicut cor meum cum corde tuo? Et ait Iónadab: Est. Si est, inquit, da manum tuam. Qui dedit ei manum suam. At ille levávit eum ad se in currum:'
  "16": 'dixítque ad eum: Veni mecum, et vide zelum meum pro Dómino. Et impósitum in curru suo'
  "17": duxit in Samaríam. Et percússit omnes qui réliqui fúerant de Achab in Samaría usque ad unum, iuxta verbum Dómini, quod locútus est per Elíam.
  "18": 'Congregávit ergo Iehu omnem pópulum, et dixit ad eos: Achab cóluit Baal parum, ego autem colam eum ámplius.'
  "19": 'Nunc ígitur omnes prophétas Baal, et univérsos servos eius, et cunctos sacerdótes ipsíus vocáte ad me: nullus sit qui non véniat, sacrifícium enim grande est mihi Baal: quicúmque defúerit, non vivet. Porro Iehu faciébat hoc insidióse, ut dispérderet cultóres Baal.'
  "20": 'Et dixit: Sanctificáte diem solémnem Baal. Vocavítque,'
  "21": 'et misit in univérsos términos Israel, et venérunt cuncti servi Baal: non fuit resíduus ne unus quidem qui non veníret. Et ingréssi sunt templum Baal: et repléta est domus Baal, a summo usque ad summum.'
  "22": 'Dixítque his, qui erant super vestes: Proférte vestiménta univérsis servis Baal. Et protulérunt eis vestes.'
  "23": 'Ingressúsque Iehu, et Iónadab fílius Rechab, templum Baal, ait cultóribus Baal: Perquírite, et vidéte, ne quis forte vobíscum sit de servis Dómini, sed ut sint servi Baal soli.'
  "24": 'Ingréssi sunt ígitur ut fácerent víctimas et holocáusta: Iehu autem præparáverat sibi foris octogínta viros, et díxerat eis: Quicúmque fúgerit de homínibus his, quos ego addúxero in manus vestras, ánima eius erit pro ánima illíus.'
  "25": 'Factum est autem, cum complétum esset holocáustum, præcépit Iehu milítibus et dúcibus suis: Ingredímini, et percútite eos: nullus evádat. Percusserúntque eos in ore gládii, et proiecérunt mílites et duces: et iérunt in civitátem templi Baal,'
  "26": et protulérunt státuam de fano Baal, et combussérunt,
  "27": et comminuérunt eam. Destruxérunt quoque ædem Baal, et fecérunt pro ea latrínas usque in diem hanc.
  "28": 'Delévit ítaque Iehu Baal de Israel:'
  "29": verúmtamen a peccátis Ieróboam fílii Nabat, qui peccáre fecit Israel, non recéssit, nec derelíquit vítulos áureos, qui erant in Bethel, et in Dan.
  "30": 'Dixit autem Dóminus ad Iehu: Quia studióse egísti quod rectum erat, et placébat in óculis meis, et ómnia quæ erant in corde meo fecísti contra domum Achab: fílii tui usque ad quartam generatiónem sedébunt super thronum Israel.'
  "31": 'Porro Iehu non custodívit ut ambuláret in lege Dómini Dei Israel in toto corde suo: non enim recéssit a peccátis Ieróboam, qui peccáre fécerat Israel.'
  "32": 'In diébus illis cœpit Dóminus tædére super Israel: percussítque eos Házael in univérsis fínibus Israel,'
  "33": a Iordáne contra orientálem plagam, omnem terram Gálaad, et Gad, et Ruben, et Manásse, ab Aroer, quæ est super torréntem Arnon, et Gálaad, et Basan.
  "34": Réliqua autem verbórum Iehu, et univérsa quæ fecit, et fortitúdo eius, nonne hæc scripta sunt in Libro verbórum diérum regum Israel?
  "35": 'Et dormívit Iehu cum pátribus suis, sepelierúntque eum in Samaría: et regnávit Ióachaz fílius eius pro eo.'
  "36": Dies autem, quos regnávit Iehu super Israel, vigínti et octo anni sunt in Samaría.
