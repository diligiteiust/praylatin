bible: vulgate
lang: la
language: Latina
book: II Regum
chapter: "3"
verses:
  "1": 'Ioram vero fílius Achab regnávit super Israel in Samaría anno décimo octávo Iósaphat regis Iudæ: regnavítque duódecim annis.'
  "2": 'Et fecit malum coram Dómino, sed non sicut pater suus et mater: tulit enim státuas Baal, quas fécerat pater eius.'
  "3": Verúmtamen in peccátis Ieróboam fílii Nabat, qui peccáre fecit Israel, adhǽsit, nec recéssit ab eis.
  "4": Porro Mesa rex Moab nutriébat pécora multa, et solvébat regi Israel centum míllia agnórum, et centum míllia aríetum cum velléribus suis.
  "5": Cumque mórtuus fuísset Achab, prævaricátus est fœdus, quod habébat cum rege Israel.
  "6": Egréssus est ígitur rex Ioram in die illa de Samaría, et recénsuit univérsum Israel.
  "7": 'Misítque ad Iósaphat regem Iuda, dicens: Rex Moab recéssit a me: veni mecum contra eum ad prœ́lium. Qui respóndit: Ascéndam: qui meus est, tuus est: pópulus meus, pópulus tuus: et equi mei, equi tui.'
  "8": 'Dixítque: Per quam viam ascendémus? At ille respóndit: Per desértum Idumǽæ.'
  "9": Perrexérunt ígitur rex Israel, et rex Iuda, et rex Edom, et circuiérunt per viam septem diérum, nec erat aqua exercítui, et iuméntis, quæ sequebántur eos.
  "10": 'Dixítque rex Israel: Heu heu heu, congregávit nos Dóminus tres reges, ut tráderet in manus Moab.'
  "11": 'Et ait Iósaphat: Estne hic prophéta Dómini, ut deprecémur Dóminum per eum? Et respóndit unus de servis regis Israel: Est hic Eliséus fílius Saphat, qui fundébat aquam super manus Elíæ.'
  "12": 'Et ait Iósaphat: Est apud eum sermo Dómini. Descendítque ad eum rex Israel, et Iósaphat rex Iuda, et rex Edom.'
  "13": 'Dixit autem Eliséus ad regem Israel: Quid mihi et tibi est? vade ad prophétas patris tui, et matris tuæ. Et ait illi rex Israel: Quare congregávit Dóminus tres reges hos, ut tráderet eos in manus Moab?'
  "14": 'Dixítque ad eum Eliséus: Vivit Dóminus exercítuum, in cuius conspéctu sto, quod si non vultum Iósaphat regis Iudæ erubéscerem, non attendíssem quidem te, nec respexíssem.'
  "15": 'Nunc autem addúcite mihi psaltem. Cumque cáneret psaltes, facta est super eum manus Dómini, et ait:'
  "16": 'Hæc dicit Dóminus: Fácite álveum torréntis huius fossas, et fossas.'
  "17": 'Hæc enim dicit Dóminus: Non vidébitis ventum, neque plúviam: et álveus iste replébitur aquis, et bibétis vos, et famíliæ vestræ, et iuménta vestra.'
  "18": 'Parúmque est hoc in conspéctu Dómini: ínsuper tradet étiam Moab in manus vestras.'
  "19": Et percutiétis omnem civitátem munítam, et omnem urbem eléctam, et univérsum lignum fructíferum succidétis, cunctósque fontes aquárum obturábitis, et omnem agrum egrégium operiétis lapídibus.
  "20": Factum est ígitur mane, quando sacrifícium offérri solet, et ecce, aquæ veniébant per viam Edom, et repléta est terra aquis.
  "21": Univérsi autem Moabítæ audiéntes quod ascendíssent reges ut pugnárent advérsum eos, convocavérunt omnes qui accíncti erant bálteo désuper, et stetérunt in términis.
  "22": Primóque mane surgéntes, et orto iam sole ex advérso aquárum, vidérunt Moabítæ ecóntra aquas rubras quasi sánguinem,
  "23": 'dixerúntque: Sanguis gládii est: pugnavérunt reges contra se, et cæsi sunt mútuo: nunc perge ad prædam Moab.'
  "24": 'Perrexerúntque in castra Israel: porro consúrgens Israel, percússit Moab: at illi fugérunt coram eis. Venérunt ígitur qui vícerant, et percussérunt Moab,'
  "25": 'et civitátes destruxérunt: et omnem agrum óptimum, mitténtes sínguli lápides, replevérunt: et univérsos fontes aquárum obturavérunt: et ómnia ligna fructífera succidérunt, ita ut muri tantum fíctiles remanérent: et circúmdata est cívitas a fundibuláriis, et magna ex parte percússa.'
  "26": 'Quod cum vidísset rex Moab, prævaluísse scílicet hostes, tulit secum septingéntos viros educéntes gládium, ut irrúmperent ad regem Edom: et non potuérunt.'
  "27": 'Arripiénsque fílium suum primogénitum, qui regnatúrus erat pro eo, óbtulit holocáustum super murum: et facta est indignátio magna in Israel, statímque recessérunt ab eo, et revérsi sunt in terram suam.'
