bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "88"
verses:
  "1": Intelléctus Ethan Ezrahítæ.
  "2": Misericórdias Dómini in ætérnum cantábo. In generatiónem et generatiónem annuntiábo veritátem tuam in ore meo.
  "3": 'Quóniam dixísti: In ætérnum misericórdia ædificábitur in cælis: præparábitur véritas tua in eis.'
  "4": 'Dispósui testaméntum eléctis meis, iurávi David servo meo:'
  "5": 'Usque in ætérnum præparábo semen tuum: et ædificábo in generatiónem et generatiónem sedem tuam.'
  "6": 'Confitebúntur cæli mirabília tua Dómine: étenim veritátem tuam in ecclésia sanctórum.'
  "7": 'Quóniam quis in núbibus æquábitur Dómino: símilis erit Deo in fíliis Dei?'
  "8": 'Deus, qui glorificátur in consílio sanctórum: magnus et terríbilis super omnes qui in circúitu eius sunt.'
  "9": Dómine Deus virtútum quis símilis tibi? potens es Dómine, et véritas tua in circúitu tuo.
  "10": 'Tu domináris potestáti maris: motum autem flúctuum eius tu mítigas.'
  "11": 'Tu humiliásti sicut vulnerátum, supérbum: in bráchio virtútis tuæ dispersísti inimícos tuos.'
  "12": 'Tui sunt cæli, et tua est terra, orbem terræ et plenitúdinem eius tu fundásti:'
  "13": 'aquilónem et mare tu creásti. Thabor et Hermon in nómine tuo exsultábunt:'
  "14": 'tuum bráchium cum poténtia. Firmétur manus tua, et exaltétur déxtera tua:'
  "15": 'iustítia et iudícium præparátio sedis tuæ. Misericórdia et véritas præcédent fáciem tuam:'
  "16": 'beátus pópulus, qui scit iubilatiónem: Dómine, in lúmine vultus tui ambulábunt,'
  "17": 'et in nómine tuo exsultábunt tota die: et in iustítia tua exaltabúntur.'
  "18": 'Quóniam glória virtútis eórum tu es: et in beneplácito tuo exaltábitur cornu nostrum.'
  "19": Quia Dómini est assúmptio nostra, et sancti Israel regis nostri.
  "20": 'Tunc locútus es in visióne sanctis tuis, et dixísti: Pósui adiutórium in poténte: et exaltávi eléctum de plebe mea.'
  "21": 'Invéni David servum meum: óleo sancto meo unxi eum.'
  "22": 'Manus enim mea auxiliábitur ei: et bráchium meum confortábit eum.'
  "23": Nihil profíciet inimícus in eo, et fílius iniquitátis non appónet nocére ei.
  "24": 'Et concídam a fácie ipsíus inimícos eius: et odiéntes eum in fugam convértam.'
  "25": 'Et véritas mea, et misericórdia mea cum ipso: et in nómine meo exaltábitur cornu eius.'
  "26": Et ponam in mari manum eius, et in flumínibus déxteram eius.
  "27": 'Ipse invocábit me: Pater meus es tu: Deus meus, et suscéptor salútis meæ.'
  "28": Et ego primogénitum ponam illum excélsum præ régibus terræ.
  "29": 'In ætérnum servábo illi misericórdiam meam: et testaméntum meum fidéle ipsi.'
  "30": 'Et ponam in sǽculum sǽculi semen eius: et thronum eius sicut dies cæli.'
  "31": 'Si autem derelíquerint fílii eius legem meam: et in iudíciis meis non ambuláverint:'
  "32": 'si iustítias meas profanáverint: et mandáta mea non custodíerint:'
  "33": 'visitábo in virga iniquitátes eórum: et in verbéribus peccáta eórum.'
  "34": 'Misericórdiam autem meam non dispérgam ab eo: neque nocébo in veritáte mea:'
  "35": 'neque profanábo testaméntum meum: et quæ procédunt de lábiis meis non fáciam írrita.'
  "36": 'Semel iurávi in sancto meo, si David méntiar:'
  "37": semen eius in ætérnum manébit.
  "38": 'Et thronus eius sicut sol in conspéctu meo, et sicut luna perfécta in ætérnum: et testis in cælo fidélis.'
  "39": 'Tu vero repulísti et despexísti: distulísti Christum tuum.'
  "40": 'Evertísti testaméntum servi tui: profanásti in terra sanctuárium eius.'
  "41": 'Destruxísti omnes sepes eius: posuísti firmaméntum eius formídinem.'
  "42": 'Diripuérunt eum omnes transeúntes viam: factus est oppróbrium vicínis suis.'
  "43": 'Exaltásti déxteram depriméntium eum: lætificásti omnes inimícos eius.'
  "44": 'Avertísti adiutórium gládii eius: et non es auxiliátus ei in bello.'
  "45": 'Destruxísti eum ab emundatióne: et sedem eius in terram collisísti.'
  "46": 'Minorásti dies témporis eius: perfudísti eum confusióne.'
  "47": 'Usquequo Dómine avértis in finem: exardéscet sicut ignis ira tua?'
  "48": 'Memoráre quæ mea substántia: numquid enim vane constituísti omnes fílios hóminum?'
  "49": 'Quis est homo, qui vivet, et non vidébit mortem: éruet ánimam suam de manu ínferi?'
  "50": Ubi sunt misericórdiæ tuæ antíquæ Dómine, sicut iurásti David in veritáte tua?
  "51": Memor esto Dómine oppróbrii servórum tuórum (quod contínui in sinu meo) multárum géntium.
  "52": Quod exprobravérunt inimíci tui Dómine, quod exprobravérunt commutatiónem Christi tui.
  "53": 'Benedíctus Dóminus in ætérnum: fiat, fiat.'
