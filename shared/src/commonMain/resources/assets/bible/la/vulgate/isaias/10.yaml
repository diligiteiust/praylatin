bible: vulgate
lang: la
language: Latina
book: Isaias
chapter: "10"
verses:
  "1": 'Væ qui condunt leges iníquas: et scribéntes iniustítiam scripsérunt:'
  "2": 'ut opprímerent in iudício páuperes, et vim fácerent causæ humílium pópuli mei: ut essent víduæ præda eórum, et pupíllos diríperent.'
  "3": Quid faciétis in die visitatiónis, et calamitátis de longe veniéntis? ad cuius confugiétis auxílium? et ubi derelinquétis glóriam vestram,
  "4": ne incurvémini sub vínculo, et cum interféctis cadátis? Super ómnibus his non est avérsus furor eius, sed adhuc manus eius exténta.
  "5": Væ Assur, virga furóris mei et báculus ipse est, in manu eórum indignátio mea.
  "6": Ad gentem fallácem mittam eum, et contra pópulum furóris mei mandábo illi, ut áuferat spólia, et dirípiat prædam, et ponat illum in conculcatiónem quasi lutum plateárum.
  "7": 'Ipse autem non sic arbitrábitur, et cor eius non ita existimábit: sed ad conteréndum erit cor eius, et ad interneciónem géntium non paucárum.'
  "8": 'Dicet enim:'
  "9": Numquid non príncipes mei simul reges sunt? numquid non ut Chárcamis, sic Cálano? et ut Arphad, sic Emath? numquid non ut Damáscus, sic Samaría?
  "10": Quómodo invénit manus mea regna idóli, sic et simulácra eórum de Ierúsalem, et de Samaría.
  "11": Numquid non sicut feci Samaríæ et idólis eius, sic fáciam Ierúsalem, et simulácris eius?
  "12": Et erit, cum impléverit Dóminus cuncta ópera sua in monte Sion et in Ierúsalem, visitábo super fructum magnífici cordis regis Assur, et super glóriam altitúdinis oculórum eius.
  "13": 'Dixit enim: In fortitúdine manus meæ feci, et in sapiéntia mea intelléxi: et ábstuli términos populórum, et príncipes eórum deprædátus sum, et detráxi quasi potens in sublími residéntes.'
  "14": 'Et invénit quasi nidum manus mea fortitúdinem populórum: et sicut colligúntur ova, quæ derelícta sunt, sic univérsam terram ego congregávi: et non fuit qui movéret pennam, et aperíret os, et ganníret.'
  "15": Numquid gloriábitur secúris contra eum, qui secat in ea? aut exaltábitur serra contra eum a quo tráhitur? Quómodo si elevétur virga contra elevántem se, et exaltétur báculus, qui útique lignum est.
  "16": 'Propter hoc mittet dominátor Dóminus exercítuum in pínguibus eius tenuitátem: et subtus glóriam eius succénsa ardébit quasi combústio ignis.'
  "17": 'Et erit lumen Israel in igne, et Sanctus eius in flamma: et succendétur, et devorábitur spina eius et vepres in die una.'
  "18": Et glória saltus eius, et carméli eius, ab ánima usque ad carnem consumétur, et erit terróre prófugus.
  "19": Et relíquiæ ligni saltus eius præ paucitáte numerabúntur, et puer scribet eos.
  "20": 'Et erit in die illa: non adíciet resíduum Israel, et hi, qui fúgerint de domo Iacob, inníti super eo, qui pércutit eos: sed innitétur super Dóminum sanctum Israel in veritáte.'
  "21": Relíquiæ converténtur, relíquiæ, inquam, Iacob ad Deum fortem.
  "22": 'Si enim fúerit pópulus tuus Israel quasi aréna maris, relíquiæ converténtur ex eo: consummátio abbreviáta inundábit iustítiam.'
  "23": Consummatiónem enim et abbreviatiónem Dóminus Deus exercítuum fáciet in médio omnis terræ.
  "24": 'Propter hoc, hæc dicit Dóminus Deus exercítuum: Noli timére pópulus meus habitátor Sion, ab Assur: in virga percútiet te, et báculum suum levábit super te in via Ægýpti.'
  "25": Adhuc enim páululum modicúmque, et consummábitur indignátio et furor meus super scelus eórum.
  "26": 'Et suscitábit super eum Dóminus exercítuum flagéllum, iuxta plagam Mádian in petra Oreb: et virgam suam super mare, et levábit eam in via Ægýpti.'
  "27": 'Et erit in die illa: auferétur onus eius de húmero tuo et iugum eius de collo tuo, et computréscet iugum a fácie ólei.'
  "28": Véniet in Aiath, transíbit in Magron, apud Machmas commendábit vasa sua.
  "29": 'Transiérunt cursim Gaba sedes nostra: obstúpuit Rama, Gábaath Saulis fugit.'
  "30": Hinni voce tua fília Gallim, atténde Láisa, paupércula Anathoth.
  "31": 'Migrávit Medeména: habitatóres Gabim confortámini.'
  "32": 'Adhuc dies est, ut in Nobe stetur: agitábit manum suam super montem fíliæ Sion, collem Ierúsalem.'
  "33": 'Ecce dominátor Dóminus exercítuum confrínget lagúnculam in terróre: et excélsi statúra succidéntur, et sublímes humiliabúntur.'
  "34": 'Et subverténtur condénsa saltus ferro: et Líbanus cum excélsis cadet.'
