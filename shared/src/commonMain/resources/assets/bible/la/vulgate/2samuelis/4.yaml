bible: vulgate
lang: la
language: Latina
book: II Samuelis
chapter: "4"
verses:
  "1": 'Audívit autem Isboseth fílius Saul quod cecidísset Abner in Hebron: et dissolútæ sunt manus eius, omnísque Israel perturbátus est.'
  "2": 'Duo autem viri príncipes latrónum erant fílio Saul, nomen uni Báana, et nomen álteri Rechab, fílii Remmon Berothítæ de fíliis Béniamin: síquidem et Beroth reputáta est in Béniamin.'
  "3": Et fugérunt Berothítæ in Géthaim, fuerúntque ibi ádvenæ usque ad tempus illud.
  "4": 'Erat autem Iónathæ fílio Saul fílius débilis pédibus: quinquénnis enim fuit, quando venit núntius de Saul et Iónatha ex Iézrahel. Tollens ítaque eum nutrix sua, fugit: cumque festináret ut fúgeret, cécidit, et claudus efféctus est: habuítque vocábulum Miphíboseth.'
  "5": 'Veniéntes ígitur fílii Remmon Berothítæ, Rechab et Báana, ingréssi sunt fervénte die domum Isboseth: qui dormiébat super stratum suum merídie. Et ostiária domus purgans tríticum, obdormívit.'
  "6": Ingréssi sunt autem domum laténter assuméntes spicas trítici, et percussérunt eum in ínguine Rechab, et Báana frater eius, et fugérunt.
  "7": 'Cum autem ingréssi fuíssent domum, ille dormiébat super lectum suum in conclávi, et percutiéntes interfecérunt eum: sublatóque cápite eius, abiérunt per viam desérti tota nocte,'
  "8": 'et attulérunt caput Isboseth ad David in Hebron: dixerúntque ad regem: Ecce caput Isboseth fílii Saul inimíci tui, qui quærébat ánimam tuam: et dedit Dóminus dómino meo regi ultiónem hódie de Saul, et de sémine eius.'
  "9": 'Respóndens autem David Rechab, et Báana fratri eius, fíliis Remmon Berothítæ, dixit ad eos: Vivit Dóminus, qui éruit ánimam meam de omni angústia,'
  "10": 'quóniam eum, qui annuntiáverat mihi, et díxerat: Mórtuus est Saul: qui putábat se próspera nuntiáre, ténui, et occídi eum in Síceleg, cui oportébat mercédem dare pro núntio.'
  "11": Quanto magis nunc cum hómines ímpii interfecérunt virum innóxium in domo sua, super lectum suum, non quæram sánguinem eius de manu vestra, et áuferam vos de terra?
  "12": 'Præcépit ítaque David púeris suis, et interfecérunt eos: præcidentésque manus et pedes eórum, suspendérunt eos super piscínam in Hebron: caput autem Isboseth tulérunt, et sepeliérunt in sepúlcro Abner in Hebron.'
