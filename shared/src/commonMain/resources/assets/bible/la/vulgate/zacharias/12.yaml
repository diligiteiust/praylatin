bible: vulgate
lang: la
language: Latina
book: Zacharias
chapter: "12"
verses:
  "1": 'Onus verbi Dómini super Israel. Dicit Dóminus exténdens cælum, et fundans terram, et fingens spíritum hóminis in eo:'
  "2": 'Ecce ego ponam Ierúsalem superlimináre crápulæ ómnibus pópulis in circúitu: sed et Iuda erit in obsidióne contra Ierúsalem.'
  "3": 'Et erit: in die illa ponam Ierúsalem lápidem óneris cunctis pópulis: omnes, qui levábunt eam, concisióne lacerabúntur, et colligéntur advérsus eam ómnia regna terræ.'
  "4": 'In die illa, dicit Dóminus, percútiam omnem equum in stupórem, et ascensórem eius in améntiam: et super domum Iuda apériam óculos meos, et omnem equum populórum percútiam cæcitáte.'
  "5": 'Et dicent duces Iuda in corde suo: Conforténtur mihi habitatóres Ierúsalem in Dómino exercítuum Deo eórum.'
  "6": 'In die illa ponam duces Iuda sicut camínum ignis in lignis, et sicut facem ignis in fœno: et devorábunt ad déxteram, et ad sinístram omnes pópulos in circúitu: et habitábitur Ierúsalem rursus in loco suo in Ierúsalem.'
  "7": 'Et salvábit Dóminus tabernácula Iuda, sicut in princípio: ut non magnífice gloriétur domus David, et glória habitántium Ierúsalem contra Iudam.'
  "8": 'In die illa próteget Dóminus habitatóres Ierúsalem, et erit qui offénderit ex eis in die illa quasi David: et domus David quasi Dei, sicut ángelus Dómini in conspéctu eórum.'
  "9": 'Et erit in die illa: quæram contérere omnes gentes, quæ véniunt contra Ierúsalem.'
  "10": 'Et effúndam super domum David, et super habitatóres Ierúsalem spíritum grátiæ, et precum: et aspícient ad me, quem confixérunt: et plangent eum planctu quasi super unigénitum, et dolébunt super eum, ut doléri solet in morte primogéniti.'
  "11": In die illa magnus erit planctus in Ierúsalem, sicut planctus Adadrémmon in campo Magéddon.
  "12": 'Et planget terra: famíliæ et famíliæ seórsum: famíliæ domus David seórsum, et mulíeres eórum seórsum:'
  "13": 'famíliæ domus Nathan seórsum, et mulíeres eórum seórsum: famíliæ domus Levi seórsum, et mulíeres eórum seórsum: famíliæ Sémei seórsum, et mulíeres eórum seórsum:'
  "14": omnes famíliæ réliquæ, famíliæ et famíliæ seórsum, et mulíeres eórum seórsum.
