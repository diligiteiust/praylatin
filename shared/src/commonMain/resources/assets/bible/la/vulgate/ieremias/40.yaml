bible: vulgate
lang: la
language: Latina
book: Ieremias
chapter: "40"
verses:
  "1": Sermo, qui factus est ad Ieremíam a Dómino, postquam dimíssus est a Nabuzárdan magístro milítiæ de Rama, quando tulit eum vinctum caténis in médio ómnium, qui migrábant de Ierúsalem et Iuda, et ducebántur in Babylónem.
  "2": 'Tollens ergo princeps milítiæ Ieremíam, dixit ad eum: Dóminus Deus tuus locútus est malum hoc super locum istum:'
  "3": 'et addúxit, et fecit Dóminus sicut locútus est, quia peccástis Dómino, et non audístis vocem eius: et factus est vobis sermo hic.'
  "4": 'Nunc ergo ecce solvi te hódie de caténis, quæ sunt in mánibus tuis: si placet tibi ut vénias mecum in Babylónem, veni: et ponam óculos meos super te: si autem dísplicet tibi veníre mecum in Babylónem, réside: ecce omnis terra in conspéctu tuo est: quod elégeris, et quo placúerit tibi ut vadas, illuc perge.'
  "5": 'Et mecum noli veníre, sed hábita apud Godolíam fílium Ahicam fílii Saphan, quem præpósuit rex Babylónis civitátibus Iuda: hábita ergo cum eo in médio pópuli: vel quocúmque placúerit tibi ut vadas, vade. Dedit quoque ei magíster milítiæ cibária et munúscula, et dimísit eum.'
  "6": Venit autem Ieremías ad Godolíam fílium Ahicam in Masphath, et habitávit cum eo in médio pópuli, qui relíctus fúerat in terra.
  "7": 'Cumque audíssent omnes príncipes exércitus, qui dispérsi fúerant per regiónes, ipsi et sócii eórum, quod præfecísset rex Babylónis Godolíam fílium Ahicam terræ, et quod commendásset ei viros, et mulíeres, et párvulos, et de paupéribus terræ, qui non fúerant transláti in Babylónem:'
  "8": 'venérunt ad Godolíam in Masphath: et Ismahel fílius Nathaníæ, et Ióhanan, et Iónathan fílii Carée, et Saréas fílius Thanéhumeth, et fílii Ophi, qui erant de Netóphathi, et Iezonías fílius Maáchathi, ipsi et viri eórum.'
  "9": 'Et iurávit eis Godolías fílius Ahicam fílii Saphan, et comítibus eórum, dicens: Nolíte timére servíre Chaldǽis: habitáte in terra, et servíte regi Babylónis, et bene erit vobis.'
  "10": 'Ecce ego hábito in Masphath, ut respóndeam præcépto Chaldæórum, qui mittúntur ad nos: vos autem collígite vindémiam, et messem, et óleum, et cóndite in vasis vestris, et manéte in úrbibus vestris, quas tenétis.'
  "11": 'Sed et omnes Iudǽi, qui erant in Moab, et in fíliis Ammon, et in Idumǽa, et in univérsis regiónibus, audíto quod dedísset rex Babylónis relíquias in Iudǽa, et quod præposuísset super eos Godolíam fílium Ahicam fílii Saphan:'
  "12": revérsi sunt, inquam, omnes Iudǽi de univérsis locis, ad quæ profúgerant, et venérunt in terram Iuda ad Godolíam in Masphath, et collegérunt vinum et messem multam nimis.
  "13": Ióhanan autem fílius Carée, et omnes príncipes exércitus, qui dispérsi fúerant in regiónibus, venérunt ad Godolíam in Masphath,
  "14": 'et dixérunt ei: Scito quod Báalis rex filiórum Ammon misit Ismahel fílium Nathaníæ percútere ánimam tuam. Et non crédidit eis Godolías fílius Ahicam.'
  "15": 'Ióhanan autem fílius Carée dixit ad Godolíam seórsum in Masphath, loquens: Ibo, et percútiam Ismahel fílium Nathaníæ, nullo sciénte, ne interfíciat ánimam tuam, et dissipéntur omnes Iudǽi, qui congregáti sunt ad te, et períbunt relíquiæ Iuda.'
  "16": 'Et ait Godolías fílius Ahicam ad Ióhanan fílium Carée: Noli fácere verbum hoc: falsum enim tu lóqueris de Ismahel.'
