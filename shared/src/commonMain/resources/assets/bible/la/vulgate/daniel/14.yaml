bible: vulgate
lang: la
language: Latina
book: Daniel
chapter: "14"
verses:
  "1": Erat autem Dániel convíva regis, et honorátus super omnes amícos eius.
  "2": 'Erat quoque idólum apud Babylónios nómine Bel: et impendebántur in eo per dies síngulos símilæ ártabæ duódecim, et oves quadragínta, viníque ámphoræ sex.'
  "3": 'Rex quoque colébat eum, et ibat per síngulos dies adoráre eum: porro Dániel adorábat Deum suum. Dixítque ei rex: Quare non adóras Bel?'
  "4": 'Qui respóndens ait ei: Quia non colo idóla manufácta, sed vivéntem Deum, qui creávit cælum, et terram, et habet potestátem omnis carnis.'
  "5": 'Et dixit rex ad eum: Non vidétur tibi esse Bel vivens Deus? an non vides quanta cómedat et bibat quotídie?'
  "6": 'Et ait Dániel arrídens: Ne erres rex: iste enim intrínsecus lúteus est, et forínsecus ǽreus, neque comédit aliquándo.'
  "7": 'Et irátus rex vocávit sacerdótes eius, et ait eis: Nisi dixéritis mihi, quis est qui cómedat impénsas has, moriémini.'
  "8": 'Si autem ostendéritis quóniam Bel cómedat hæc, moriétur Dániel, quia blasphemávit in Bel. Et dixit Dániel regi: Fiat iuxta verbum tuum.'
  "9": Erant autem sacerdótes Bel septuagínta, excéptis uxóribus, et párvulis, et fíliis. Et venit rex cum Daniéle in templum Bel.
  "10": 'Et dixérunt sacerdótes Bel: Ecce nos egrédimur foras: et tu rex pone escas, et vinum misce, et claude óstium, et signa ánnulo tuo:'
  "11": et cum ingréssus fúeris mane, nisi invéneris ómnia comésta a Bel, morte moriémur, vel Dániel qui mentítus est advérsum nos.
  "12": Contemnébant autem, quia fécerant sub mensa abscónditum intróitum, et per illum ingrediebántur semper, et devorábant ea.
  "13": 'Factum est ígitur postquam egréssi sunt illi, rex pósuit cibos ante Bel: præcépit Dániel púeris suis, et attulérunt cínerem, et cribrávit per totum templum coram rege: et egréssi clausérunt óstium, et signántes ánnulo regis abiérunt.'
  "14": 'Sacerdótes autem ingréssi sunt nocte iuxta consuetúdinem suam, et uxóres, et fílii eórum: et comedérunt ómnia, et bibérunt.'
  "15": Surréxit autem rex primo dilúculo, et Dániel cum eo.
  "16": 'Et ait rex: Salváne sunt signácula, Dániel? Qui respóndit: Salva, rex.'
  "17": 'Statímque cum aperuísset óstium, intúitus rex mensam, exclamávit voce magna: Magnus es Bel, et non est apud te dolus quisquam.'
  "18": 'Et risit Dániel, et ténuit regem ne ingrederétur intro: et dixit: Ecce paviméntum, animadvérte cuius vestígia sint hæc.'
  "19": 'Et dixit rex: Vídeo vestígia virórum, et mulíerum, et infántium. Et irátus est rex.'
  "20": 'Tunc apprehéndit sacerdótes, et uxóres, et fílios eórum: et ostendérunt ei abscóndita ostíola, per quæ ingrediebántur, et consumébant quæ erant super mensam.'
  "21": 'Occídit ergo illos rex, et trádidit Bel in potestátem Daniélis: qui subvértit eum, et templum eius.'
  "22": Et erat draco magnus in loco illo, et colébant eum Babylónii.
  "23": 'Et dixit rex Daniéli: Ecce nunc non potes dícere quia iste non sit Deus vivens: adóra ergo eum.'
  "24": 'Dixítque Dániel: Dóminum Deum meum adóro, quia ipse est Deus vivens: iste autem non est Deus vivens.'
  "25": 'Tu autem rex da mihi potestátem, et interfíciam dracónem absque gládio et fuste. Et ait rex: Do tibi.'
  "26": 'Tulit ergo Dániel picem, et ádipem, et pilos, et coxit páriter: fecítque massas, et dedit in os dracónis, et dirúptus est draco. Et dixit: Ecce quem colebátis.'
  "27": 'Quod cum audíssent Babylónii, indignáti sunt veheménter: et congregáti advérsum regem, dixérunt: Iudǽus factus est rex: Bel destrúxit, dracónem interfécit, et sacerdótes occídit.'
  "28": 'Et dixérunt cum veníssent ad regem: Trade nobis Daniélem, alióquin interficiémus te, et domum tuam.'
  "29": 'Vidit ergo rex quod irrúerent in eum veheménter: et necessitáte compúlsus, trádidit eis Daniélem.'
  "30": Qui misérunt eum in lacum leónum, et erat ibi diébus sex.
  "31": 'Porro in lacu erant leónes septem, et dabántur eis duo córpora quotídie, et duæ oves: et tunc non data sunt eis, ut devorárent Daniélem.'
  "32": 'Erat autem Hábacuc prophéta in Iudǽa, et ipse cóxerat pulméntum, et intríverat panes in alvéolo: et ibat in campum ut ferret messóribus.'
  "33": 'Dixítque ángelus Dómini ad Hábacuc: Fer prándium, quod habes, in Babylónem Daniéli, qui est in lacu leónum.'
  "34": 'Et dixit Hábacuc: Dómine, Babylónem non vidi, et lacum néscio.'
  "35": Et apprehéndit eum ángelus Dómini in vértice eius, et portávit eum capíllo cápitis sui, posuítque eum in Babylóne supra lacum in ímpetu spíritus sui.
  "36": 'Et clamávit Hábacuc, dicens: Dániel serve Dei, tolle prándium, quod misit tibi Deus.'
  "37": 'Et ait Dániel: Recordátus es mei Deus, et non dereliquísti diligéntes te.'
  "38": Surgénsque Dániel comédit. Porro ángelus Dómini restítuit Hábacuc conféstim in loco suo.
  "39": 'Venit ergo rex die séptimo ut lugéret Daniélem: et venit ad lacum, et introspéxit, et ecce Dániel sedens in médio leónum.'
  "40": 'Et exclamávit voce magna rex, dicens: Magnus es Dómine Deus Daniélis. Et extráxit eum de lacu leónum.'
  "41": Porro illos, qui perditiónis eius causa fúerant, intromísit in lacum, et devoráti sunt in moménto coram eo.
  "42": 'Tunc rex ait: Páveant omnes habitántes in univérsa terra Deum Daniélis: quia ipse est salvátor, fáciens signa, et mirabília in terra: qui liberávit Daniélem de lacu leónum.'
