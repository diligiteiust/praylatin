bible: vulgate
lang: la
language: Latina
book: Isaias
chapter: "39"
verses:
  "1": 'In témpore illo misit Mérodach Báladan fílius Báladan rex Babylónis, libros et múnera ad Ezechíam: audíerat enim quod ægrotásset, et convaluísset.'
  "2": Lætátus est autem super eis Ezechías, et osténdit eis cellam arómatum, et argénti, et auri, et odoramentórum, et unguénti óptimi, et omnes apothécas supelléctilis suæ, et univérsa quæ invénta sunt in thesáuris eius. Non fuit verbum, quod non osténderet eis Ezechías in domo sua, et in omni potestáte sua.
  "3": 'Introívit autem Isaías prophéta ad Ezechíam regem, et dixit ei: Quid dixérunt viri isti, et unde venérunt ad te? Et dixit Ezechías: De terra longínqua venérunt ad me, de Babylóne.'
  "4": 'Et dixit: Quid vidérunt in domo tua? Et dixit Ezechías: Omnia, quæ in domo mea sunt, vidérunt: non fuit res, quam non osténderim eis in thesáuris meis.'
  "5": 'Et dixit Isaías ad Ezechíam: Audi verbum Dómini exercítuum.'
  "6": 'Ecce dies vénient, et auferéntur ómnia, quæ in domo tua sunt, et quæ thesaurizavérunt patres tui usque ad diem hanc, in Babylónem: non relinquétur quidquam, dicit Dóminus.'
  "7": Et de fíliis tuis, qui exíbunt de te, quos genúeris, tollent, et erunt eunúchi in palátio regis Babylónis.
  "8": 'Et dixit Ezechías ad Isaíam: Bonum verbum Dómini, quod locútus est. Et dixit: Fiat tantum pax, et véritas in diébus meis.'
