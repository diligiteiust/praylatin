bible: vulgate
lang: la
language: Latina
book: Ecclesiasticus
chapter: "46"
verses:
  "1": Fortis in bello Iesus Nave, succéssor Móysi in prophétis, qui fuit magnus secúndum nomen suum,
  "2": máximus in salútem electórum Dei, expugnáre insurgéntes hostes, ut consequerétur hereditátem Israel.
  "3": Quam glóriam adéptus est in tolléndo manus suas, et iactándo contra civitátes rhomphǽas?
  "4": Quis ante illum sic réstitit? Nam hostes ipse Dóminus perdúxit.
  "5": An non in iracúndia eius impedítus est sol, et una dies facta est quasi duo?
  "6": Invocávit Altíssimum poténtem, in oppugnándo inimícos úndique, et audívit illum magnus et sanctus Deus, in saxis grándinis virtútis valde fortis.
  "7": Impetum fecit contra gentem hostílem, et in descénsu pérdidit contrários,
  "8": 'ut cognóscant gentes poténtiam eius, quia contra Deum pugnáre non est fácile. Et secútus est a tergo poténtis:'
  "9": et in diébus Móysi misericórdiam fecit, ipse, et Caleb fílius Iéphone, stare contra hostem, et prohibére gentem a peccátis, et perfríngere murmur malítiæ.
  "10": Et ipsi duo constitúti, a perículo liberáti sunt a número sexcentórum míllium péditum, indúcere illos in hereditátem, in terram, quæ manat lac et mel.
  "11": 'Et dedit Dóminus ipsi Caleb fortitúdinem, et usque in senectútem permánsit illi virtus, ut ascénderet in excélsum terræ locum, et semen ipsíus obtínuit hereditátem:'
  "12": ut vidérent omnes fílii Israel, quia bonum est óbsequi sancto Deo.
  "13": 'Et iúdices sínguli suo nómine, quorum non est corrúptum cor: qui non avérsi sunt a Dómino,'
  "14": ut sit memória illórum in benedictióne, et ossa eórum púllulent de loco suo,
  "15": et nomen eórum permáneat in ætérnum, pérmanens ad fílios illórum, sanctórum virórum glória.
  "16": Diléctus a Dómino Deo suo Sámuel, prophéta Dómini, renovávit impérium, et unxit príncipes in gente sua.
  "17": In lege Dómini congregatiónem iudicávit, et vidit Deus Iacob, et in fide sua probátus est prophéta.
  "18": 'Et cógnitus est in verbis suis fidélis, quia vidit Deum lucis:'
  "19": et invocávit Dóminum omnipoténtem, in oppugnándo hostes circumstántes úndique, in oblatióne agni invioláti.
  "20": Et intónuit de cælo Dóminus, et in sónitu magno audítam fecit vocem suam,
  "21": 'et contrívit príncipes Tyriórum, et omnes duces Philísthiim:'
  "22": et ante tempus finis vitæ suæ et sǽculi, testimónium prǽbuit in conspéctu Dómini, et Christi, pecúnias et usque ad calceaménta ab omni carne non accépit, et non accusávit illum homo.
  "23": Et post hoc dormívit, et notum fecit regi, et osténdit illi finem vitæ suæ, et exaltávit vocem suam de terra in prophetía, delére impietátem gentis.
