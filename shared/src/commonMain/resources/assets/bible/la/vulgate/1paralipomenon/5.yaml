bible: vulgate
lang: la
language: Latina
book: I Paralipomenon
chapter: "5"
verses:
  "1": 'Fílii quoque Ruben primogéniti Israel (ipse quippe fuit primogénitus eius: sed cum violásset thorum patris sui, data sunt primogénita eius fíliis Ioseph fílii Israel, et non est ille reputátus in primogénitum.'
  "2": 'Porro Iudas, qui erat fortíssimus inter fratres suos, de stirpe eius príncipes germináti sunt: primogénita autem reputáta sunt Ioseph.)'
  "3": 'Fílii ergo Ruben primogéniti Israel: Enoch, et Phallu, Esron, et Charmi.'
  "4": 'Fílii Ioel: Sámia fílius eius, Gog fílius eius, Sémei fílius eius,'
  "5": Micha fílius eius, Reía fílius eius, Baal fílius eius,
  "6": Beéra fílius eius, quem captívum duxit Thelgathphálnasar rex Assyriórum, et fuit princeps in tribu Ruben.
  "7": Fratres autem eius, et univérsa cognátio eius, quando numerabántur per famílias suas, habuérunt príncipes Iéhiel, et Zacharíam.
  "8": Porro Bala fílius Azaz fílii Samma fílii Ioel, ipse habitávit in Aroer usque ad Nebo, et Beélmeon.
  "9": Contra orientálem quoque plagam habitávit usque ad intróitum erémi, et flumen Euphráten. Multum quippe iumentórum númerum possidébant in terra Gálaad.
  "10": In diébus autem Saul prœliáti sunt contra Agaréos, et interfecérunt illos, habitaverúntque pro eis in tabernáculis eórum, in omni plaga, quæ réspicit ad oriéntem Gálaad.
  "11": 'Fílii vero Gad e regióne eórum habitavérunt in terra Basan usque Selcha:'
  "12": 'Ioel in cápite, et Saphan secúndus: Iánai autem et Saphat in Basan.'
  "13": Fratres vero eórum secúndum domos cognatiónum suárum, Míchael, et Mosóllam, et Sebe, et Iórai, et Iachan, et Zie, et Heber, septem.
  "14": Hi fílii Abíhail, fílii Huri, fílii Iara, fílii Gálaad, fílii Míchael, fílii Iésesi, fílii Ieddo, fílii Buz.
  "15": Fratres quoque fílii Abdiel, fílii Guni, princeps domus in famíliis suis.
  "16": Et habitavérunt in Gálaad, et in Basan, et in vículis eius, et in cunctis suburbánis Saron, usque ad términos.
  "17": Omnes hi numeráti sunt in diébus Ióathan regis Iuda, et in diébus Ieróboam regis Israel.
  "18": Fílii Ruben, et Gad, et dimídiæ tribus Manásse, viri bellatóres, scuta portántes et gládios, et tendéntes arcum, eruditíque ad prœ́lia, quadragínta quátuor míllia et septingénti sexagínta, procedéntes ad pugnam.
  "19": 'Dimicavérunt contra Agaréos: Iturǽi vero, et Naphis, et Nodab'
  "20": 'præbuérunt eis auxílium. Traditíque sunt in manus eórum Agaréi, et univérsi, qui fúerant cum eis, quia Deum invocavérunt cum prœliaréntur: et exaudívit eos, eo quod credidíssent in eum.'
  "21": Ceperúntque ómnia quæ posséderant, camelórum quinquagínta míllia, et óvium ducénta quinquagínta míllia, et ásinos duo míllia, et ánimas hóminum centum míllia.
  "22": 'Vulneráti autem multi corruérunt: fuit enim bellum Dómini. Habitaverúntque pro eis usque ad transmigratiónem.'
  "23": 'Fílii quoque dimídiæ tribus Manásse possedérunt terram a fínibus Basan usque Baal, Hermon, et Sanir, et montem Hermon: ingens quippe númerus erat.'
  "24": 'Et hi fuérunt príncipes domus cognatiónis eórum: Epher, et Iesi, et Eliel, et Ezriel, et Ieremía, et Odoía, et Iédiel, viri fortíssimi et poténtes, et nomináti duces in famíliis suis.'
  "25": Reliquérunt autem Deum patrum suórum, et fornicáti sunt post deos populórum terræ, quos ábstulit Deus coram eis.
  "26": 'Et suscitávit Deus Israel spíritum Phul regis Assyriórum, et spíritum Thelgathphálnasar regis Assur: et tránstulit Ruben, et Gad, et dimídiam tribum Manásse, et addúxit eos in Láhela, et in Habor, et Ara, et flúvium Gozan, usque ad diem hanc.'
