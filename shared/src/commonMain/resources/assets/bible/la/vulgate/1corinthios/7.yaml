bible: vulgate
lang: la
language: Latina
book: ad Corinthios I
chapter: "7"
verses:
  "1": 'De quibus autem scripsístis mihi: Bonum est hómini mulíerem non tángere:'
  "2": propter fornicatiónem autem unusquísque suam uxórem hábeat, et unaquǽque suum virum hábeat.
  "3": 'Uxóri vir débitum reddat: simíliter autem et uxor viro.'
  "4": Múlier sui córporis potestátem non habet, sed vir. Simíliter autem et vir sui córporis potestátem non habet, sed múlier.
  "5": 'Nolíte fraudáre ínvicem, nisi forte ex consénsu ad tempus, ut vacétis oratióni: et íterum revertímini in idípsum, ne tentet vos Sátanas propter incontinéntiam vestram.'
  "6": Hoc autem dico secúndum indulgéntiam, non secúndum impérium.
  "7": 'Volo enim omnes vos esse sicut meípsum: sed unusquísque próprium donum habet ex Deo: álius quidem sic, álius vero sic.'
  "8": 'Dico autem non nuptis, et víduis: bonum est illis si sic permáneant, sicut et ego.'
  "9": Quod si non se cóntinent, nubant. Mélius est enim núbere, quam uri.
  "10": 'Iis autem, qui matrimónio iuncti sunt, præcípio non ego, sed Dóminus, uxórem a viro non discédere:'
  "11": quod si discésserit, manére innúptam, aut viro suo reconciliári. Et vir uxórem non dimíttat.
  "12": Nam céteris ego dico, non Dóminus. Si quis frater uxórem habet infidélem, et hæc conséntit habitáre cum illo, non dimíttat illam.
  "13": 'Et si qua múlier fidélis habet virum infidélem, et hic conséntit habitáre cum illa, non dimíttat virum:'
  "14": 'sanctificátus est enim vir infidélis per mulíerem fidélem, et sanctificáta est múlier infidélis per virum fidélem: alióquin fílii vestri immúndi essent, nunc autem sancti sunt.'
  "15": 'Quod si infidélis discédit, discédat: non enim servitúti subiéctus est frater, aut soror in huiúsmodi: in pace autem vocávit nos Deus.'
  "16": Unde enim scis múlier, si virum salvum fácies? aut unde scis vir, si mulíerem salvam fácies?
  "17": Nisi unicuíque sicut divísit Dóminus, unumquémque sicut vocávit Deus, ita ámbulet, et sicut in ómnibus ecclésiis dóceo.
  "18": Circumcísus áliquis vocátus est? non addúcat præpútium. In præpútio áliquis vocátus est? non circumcidátur.
  "19": 'Circumcísio nihil est, et præpútium nihil est: sed observátio mandatórum Dei.'
  "20": Unusquísque in qua vocatióne vocátus est, in ea permáneat.
  "21": 'Servus vocátus es? non sit tibi curæ: sed et si potes fíeri liber, magis útere.'
  "22": 'Qui enim in Dómino vocátus est servus, libértus est Dómini: simíliter qui liber vocátus est, servus est Christi.'
  "23": 'Prétio empti estis: nolíte fíeri servi hóminum.'
  "24": Unusquísque in quo vocátus est, fratres, in hoc permáneat apud Deum.
  "25": 'De virgínibus autem præcéptum Dómini non hábeo: consílium autem do, tamquam misericórdiam consecútus a Dómino, ut sim fidélis.'
  "26": Exístimo ergo hoc bonum esse propter instántem necessitátem, quóniam bonum est hómini sic esse.
  "27": Alligátus es uxóri? noli quǽrere solutiónem. Solútus es ab uxóre? noli quǽrere uxórem.
  "28": 'Si autem accéperis uxórem, non peccásti. Et si núpserit virgo, non peccávit: tribulatiónem tamen carnis habébunt huiúsmodi. Ego autem vobis parco.'
  "29": 'Hoc ítaque dico, fratres: Tempus breve est: réliquum est, ut et qui habent uxóres, tamquam non habéntes sint:'
  "30": 'et qui flent, tamquam non flentes: et qui gaudent, tamquam non gaudéntes: et qui emunt, tamquam non possidéntes:'
  "31": 'et qui utúntur hoc mundo, tamquam non utántur: prǽterit enim figúra huius mundi.'
  "32": Volo autem vos sine sollicitúdine esse. Qui sine uxóre est, sollícitus est quæ Dómini sunt, quómodo pláceat Deo.
  "33": Qui autem cum uxóre est, sollícitus est quæ sunt mundi, quómodo pláceat uxóri, et divísus est.
  "34": Et múlier innúpta, et virgo, cógitat quæ Dómini sunt, ut sit sancta córpore, et spíritu. Quæ autem nupta est, cógitat quæ sunt mundi, quómodo pláceat viro.
  "35": 'Porro hoc ad utilitátem vestram dico: non ut láqueum vobis iníciam, sed ad id, quod honéstum est, et quod facultátem prǽbeat sine impediménto Dóminum obsecrándi.'
  "36": 'Si quis autem turpem se vidéri exístimat super vírgine sua, quod sit superadúlta, et ita opórtet fíeri: quod vult fáciat: non peccat, si nubat.'
  "37": Nam qui státuit in corde suo firmus, non habens necessitátem, potestátem autem habens suæ voluntátis, et hoc iudicávit in corde suo, serváre vírginem suam, bene facit.
  "38": 'Igitur et qui matrimónio iungit vírginem suam, bene facit: et qui non iungit, mélius facit.'
  "39": 'Múlier alligáta est legi quanto témpore vir eius vivit: quod si dormíerit vir eius, liberáta est: cui vult nubat, tantum in Dómino.'
  "40": 'Beátior autem erit si sic permánserit secúndum meum consílium: puto autem quod et ego Spíritum Dei hábeam.'
