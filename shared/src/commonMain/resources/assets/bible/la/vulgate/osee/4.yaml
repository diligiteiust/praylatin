bible: vulgate
lang: la
language: Latina
book: Osee
chapter: "4"
verses:
  "1": 'Audíte verbum Dómini fílii Israel, quia iudícium Dómino cum habitatóribus terræ: non est enim véritas, et non est misericórdia, et non est sciéntia Dei in terra.'
  "2": Maledíctum, et mendácium, et homicídium, et furtum, et adultérium inundavérunt, et sanguis sánguinem tétigit.
  "3": 'Propter hoc lugébit terra, et infirmábitur omnis, qui hábitat in ea, in béstia agri, et in vólucre cæli: sed et pisces maris congregabúntur.'
  "4": 'Verúmtamen unusquísque non iúdicet, et non arguátur vir: pópulus enim tuus sicut hi, qui contradícunt sacerdóti.'
  "5": 'Et córrues hódie, et córruet étiam prophéta tecum: nocte tacére feci matrem tuam.'
  "6": 'Contícuit pópulus meus, eo quod non habúerit sciéntiam: quia tu sciéntiam repulísti, repéllam te, ne sacerdótio fungáris mihi: et oblíta es legis Dei tui, oblivíscar filiórum tuórum et ego.'
  "7": 'Secúndum multitúdinem eórum sic peccavérunt mihi: glóriam eórum in ignomíniam commutábo.'
  "8": Peccáta pópuli mei cómedent, et ad iniquitátem eórum sublevábunt ánimas eórum.
  "9": 'Et erit sicut pópulus, sic sacérdos: et visitábo super eum vias eius, et cogitatiónes eius reddam ei.'
  "10": 'Et cómedent, et non saturabúntur: fornicáti sunt, et non cessavérunt: quóniam Dóminum dereliquérunt in non custodiéndo.'
  "11": Fornicátio, et vinum, et ebríetas áuferunt cor.
  "12": 'Pópulus meus in ligno suo interrogávit, et báculus eius annuntiávit ei: spíritus enim fornicatiónum decépit eos, et fornicáti sunt a Deo suo.'
  "13": 'Super cápita móntium sacrificábant, et super colles accendébant thymiáma: subtus quercum, et pópulum, et terebínthum, quia bona erat umbra eius: ídeo fornicabúntur fíliæ vestræ, et sponsæ vestræ adúlteræ erunt.'
  "14": 'Non visitábo super fílias vestras cum fúerint fornicátæ, et super sponsas vestras cum adulteráverint: quóniam ipsi cum meretrícibus conversabántur, et cum effeminátis sacrificábant, et pópulus non intélligens vapulábit.'
  "15": 'Si fornicáris tu Israel, non delínquat saltem Iuda: et nolíte íngredi in Gálgala, et ne ascendéritis in Betháven, neque iuravéritis: Vivit Dóminus.'
  "16": 'Quóniam sicut vacca lascíviens declinávit Israel: nunc pascet eos Dóminus, quasi agnum in latitúdine.'
  "17": Párticeps idolórum Ephraim, dimítte eum.
  "18": 'Separátum est convívium eórum, fornicatióne fornicáti sunt: dilexérunt afférre ignomíniam protectóres eius.'
  "19": Ligávit eum spíritus in alis suis, et confundéntur a sacrifíciis suis.
