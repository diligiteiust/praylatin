bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "131"
verses:
  "1": 'Cánticum gráduum. Meménto Dómine David, et omnis mansuetúdinis eius:'
  "2": 'sicut iurávit Dómino, votum vovit Deo Iacob:'
  "3": 'Si introíero in tabernáculum domus meæ, si ascéndero in lectum strati mei:'
  "4": 'si dédero somnum óculis meis, et pálpebris meis dormitatiónem:'
  "5": 'et réquiem tempóribus meis: donec invéniam locum Dómino, tabernáculum Deo Iacob.'
  "6": 'Ecce audívimus eam in Ephrata: invénimus eam in campis silvæ.'
  "7": 'Introíbimus in tabernáculum eius: adorábimus in loco, ubi stetérunt pedes eius.'
  "8": Surge Dómine in réquiem tuam, tu et arca sanctificatiónis tuæ.
  "9": 'Sacerdótes tui induántur iustítiam: et sancti tui exsúltent.'
  "10": Propter David servum tuum, non avértas fáciem christi tui.
  "11": 'Iurávit Dóminus David veritátem, et non frustrábitur eam: de fructu ventris tui ponam super sedem tuam.'
  "12": 'Si custodíerint fílii tui testaméntum meum, et testimónia mea hæc quæ docébo eos: et fílii eórum usque in sǽculum, sedébunt super sedem tuam.'
  "13": 'Quóniam elégit Dóminus Sion: elégit eam in habitatiónem sibi.'
  "14": 'Hæc réquies mea in sǽculum sǽculi: hic habitábo, quóniam elégi eam.'
  "15": 'Víduam eius benedícens benedícam: páuperes eius saturábo pánibus.'
  "16": 'Sacerdótes eius índuam salutári: et sancti eius exsultatióne exsultábunt.'
  "17": Illuc prodúcam cornu David, parávi lucérnam christo meo.
  "18": 'Inimícos eius índuam confusióne: super ipsum autem efflorébit sanctificátio mea.'
