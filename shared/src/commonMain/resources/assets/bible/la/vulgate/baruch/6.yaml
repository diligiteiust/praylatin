bible: vulgate
lang: la
language: Latina
book: Baruch
chapter: "6"
verses:
  "1": '[Exémplar epístolæ, quam misit Ieremías ad abducéndos captívos in Babylóniam a rege Babyloniórum, ut annuntiáret illis secúndum quod præcéptum est illi a Deo.] Propter peccáta, quæ peccástis ante Deum, abducémini in Babylóniam captívi a Nabuchodónosor rege Babylónis.'
  "2": 'Ingréssi ítaque in Babylónem, éritis ibi annis plúrimis, et tempóribus longis, usque ad generatiónes septem: post hoc autem edúcam vos inde cum pace.'
  "3": Nunc autem vidébitis in Babylónia deos áureos, et argénteos, et lapídeos, et lígneos, in húmeris portári, ostentántes metum géntibus.
  "4": Vidéte ergo ne et vos símiles efficiámini factis aliénis, et metuátis, et metus vos cápiat in ipsis.
  "5": 'Visa ítaque turba de retro et ab ante, adorántes dícite in córdibus vestris: Te opórtet adorári Dómine.'
  "6": 'Angelus enim meus vobíscum est: ipse autem exquíram ánimas vestras.'
  "7": Nam lingua ipsórum políta a fabro, ipsa étiam inauráta, et inargentáta falsa sunt, et non possunt loqui.
  "8": 'Et sicut vírgini amánti ornaménta: ita accépto auro fabricáti sunt.'
  "9": 'Corónas certe áureas habent super cápita sua dii illórum: unde súbtrahunt sacerdótes ab eis aurum et argéntum, et érogant illud in semetípsos.'
  "10": 'Dant autem et ex ipso prostitútis, et meretríces ornant: et íterum cum recéperint illud a meretrícibus, ornant deos suos.'
  "11": Hi autem non liberántur ab ærúgine, et tínea.
  "12": Opértis autem illis veste purpúrea, extérgunt fáciem ipsórum propter púlverem domus, qui est plúrimus inter eos.
  "13": Sceptrum autem habet ut homo, sicut iudex regiónis, qui in se peccántem non intérficit.
  "14": 'Habet étiam in manu gládium et secúrim: se autem de bello, et a latrónibus non líberat. Unde vobis notum sit quia non sunt dii.'
  "15": Non ergo timuéritis eos. Sicut enim vas hóminis confráctum inútile effícitur, tales sunt et dii illórum.
  "16": Constitútis illis in domo, óculi eórum pleni sunt púlvere a pédibus introeúntium.
  "17": 'Et sicut alícui, qui regem offéndit, circumséptæ sunt iánuæ, aut sicut ad sepúlcrum addúctum mórtuum: ita tutántur sacerdótes óstia clausúris et seris, ne a latrónibus exspoliéntur.'
  "18": 'Lucérnas accéndunt illis, et quidem multas, ex quibus nullam vidére possunt: sunt autem sicut trabes in domo.'
  "19": Corda vero eórum dicunt elíngere serpéntes, qui de terra sunt, dum cómedunt eos, et vestiméntum ipsórum, et non séntiunt.
  "20": Nigræ fiunt fácies eórum a fumo, qui in domo fit.
  "21": Supra corpus eórum et supra caput eórum volant nóctuæ, et hirúndines, et aves étiam, simíliter et cattæ.
  "22": Unde sciátis quia non sunt dii. Ne ergo timuéritis eos.
  "23": 'Aurum étiam, quod habent, ad spéciem est: nisi áliquis extérserit ærúginem, non fulgébunt: neque enim dum conflaréntur, sentiébant.'
  "24": Ex omni prétio empta sunt, in quibus spíritus non inest ipsis.
  "25": Sine pédibus in húmeris portántur, ostentántes ignobilitátem suam homínibus. Confundántur étiam qui colunt ea.
  "26": 'Proptérea si cecíderint in terram, a semetípsis non consúrgunt: neque si quis eum statúerit rectum, per semetípsum stabit, sed sicut mórtuis múnera eórum illis apponéntur.'
  "27": 'Hóstias illórum vendunt sacerdótes ipsórum, et abutúntur: simíliter et mulíeres eórum decerpéntes, neque infírmo, neque mendicánti áliquid impértiunt.'
  "28": De sacrifíciis eórum fœtæ et menstruátæ contíngunt. Sciéntes ítaque ex his quia non sunt dii, ne timeátis eos.
  "29": 'Unde enim vocántur dii? Quia mulíeres appónunt diis argénteis, et áureis, et lígneis:'
  "30": et in dómibus eórum sacerdótes sedent, habéntes túnicas scissas, et cápita, et barbam rasam, quorum cápita nuda sunt.
  "31": Rúgiunt autem clamántes contra deos suos, sicut in cœna mórtui.
  "32": Vestiménta eórum áuferunt sacerdótes, et véstiunt uxóres suas et fílios suos.
  "33": 'Neque si quid mali patiúntur ab áliquo, neque si quid boni, póterunt retribúere: neque regem constitúere possunt, neque auférre.'
  "34": Simíliter neque dare divítias possunt, neque malum retribúere. Si quis illis votum vóverit, et non reddíderit, neque hoc requírunt.
  "35": Hóminem a morte non líberant, neque infírmum a potentióri erípiunt.
  "36": Hóminem cæcum ad visum non restítuunt, de necessitáte hóminem non liberábunt.
  "37": Víduæ non miserebúntur, neque órphanis benefácient.
  "38": 'Lapídibus de monte símiles sunt dii illórum, lígnei, et lapídei, et áurei, et argéntei: qui autem colunt ea, confundéntur.'
  "39": Quómodo ergo æstimándum est, aut dicéndum, illos esse deos?
  "40": 'Adhuc enim ipsis Chaldǽis non honorántibus ea: qui cum audíerint mutum non posse loqui, ófferunt illud ad Bel, postulántes ab eo loqui:'
  "41": 'quasi possint sentíre qui non habent motum, et ipsi cum intelléxerint, relínquent ea: sensum enim non habent ipsi dii illórum.'
  "42": Mulíeres autem circúmdatæ fúnibus in viis sedent, succendéntes ossa olivárum.
  "43": Cum autem áliqua ex ipsis attrácta ab áliquo transeúnte dormíerit cum eo, próximæ suæ éxprobrat quod ea non sit digna hábita, sicut ipsa, neque funis eius dirúptus sit.
  "44": Omnia autem quæ illis fiunt, falsa sunt. Quómodo æstimándum aut dicéndum est, illos esse deos?
  "45": A fabris autem, et ab aurifícibus facta sunt. Nihil áliud erunt, nisi id quod volunt esse sacerdótes.
  "46": Artífices étiam ipsi, qui ea fáciunt, non sunt multi témporis. Numquid ergo possunt ea, quæ fabricáta sunt ab ipsis, esse dii?
  "47": Reliquérunt autem falsa, et oppróbrium póstea futúris.
  "48": Nam cum supervénerit illis prœ́lium et mala, cógitant sacerdótes apud se ubi se abscóndant cum illis.
  "49": Quómodo ergo sentíri débeant quóniam dii sunt, qui nec de bello se líberant, neque de malis se erípiunt?
  "50": 'Nam cum sint lígnea, inauráta et inargentáta, sciétur póstea quia falsa sunt ab univérsis géntibus, et régibus: quæ manifésta sunt quia non sunt dii, sed ópera mánuum hóminum, et nullum Dei opus cum illis.'
  "51": Unde ergo notum est, quia non sunt dii, sed ópera mánuum hóminum, et nullum Dei opus in ipsis est?
  "52": Regem regióni non súscitant, neque plúviam homínibus dabunt.
  "53": 'Iudícium quoque non discérnent, neque regiónes liberábunt ab iniúria: quia nihil possunt, sicut cornículæ inter médium cæli, et terræ.'
  "54": 'Etenim cum incíderit ignis in domum deórum ligneórum, argenteórum, et aureórum, sacerdótes quidem ipsórum fúgient, et liberabúntur: ipsi vero sicut trabes in médio comburéntur.'
  "55": Regi autem, et bello non resístent. Quómodo ergo æstimándum est, aut recipiéndum quia dii sunt?
  "56": 'Non a fúribus, neque a latrónibus se liberábunt dii lígnei, et lapídei, et inauráti, et inargentáti: quibus hi qui fortióres sunt,'
  "57": aurum et argéntum, et vestiméntum, quo opérti sunt, áuferent illis, et abíbunt, nec sibi auxílium ferent.
  "58": 'Itaque mélius est esse regem ostentántem virtútem suam: aut vas in domo útile, in quo gloriábitur qui póssidet illud: vel óstium in domo, quod custódit quæ in ipsa sunt, quam falsi dii.'
  "59": Sol quidem, et luna, ac sídera, cum sint spléndida, et emíssa ad utilitátes, obáudiunt.
  "60": 'Simíliter et fulgur cum apparúerit, perspícuum est: idípsum autem et spíritus in omni regióne spirat.'
  "61": Et nubes, quibus cum imperátum fúerit a Deo perambuláre univérsum orbem, perfíciunt quod imperátum est eis.
  "62": 'Ignis étiam missus désuper, ut consúmat montes et silvas, facit quod præcéptum est ei: hæc autem neque speciébus, neque virtútibus, uni eórum simília sunt.'
  "63": Unde neque existimándum est, neque dicéndum illos esse deos, quando non possunt neque iudícium iudicáre, neque quidquam fácere homínibus.
  "64": Sciéntes ítaque quia non sunt dii, ne ergo timuéritis eos.
  "65": Neque enim régibus maledícent, neque benedícent.
  "66": Signa étiam in cælo géntibus non osténdunt, neque ut sol lucébunt, neque illuminábunt ut luna.
  "67": Béstiæ melióres sunt illis, quæ possunt fúgere sub tectum ac prodésse sibi.
  "68": 'Nullo ítaque modo nobis est maniféstum quia sunt dii: propter quod ne timeátis eos.'
  "69": 'Nam sicut in cucumerário formído nihil custódit: ita sunt dii illórum lígnei, et argéntei, et inauráti.'
  "70": Eódem modo et in horto spina alba, supra quam omnis avis sedet. Simíliter et mórtuo proiécto in ténebris, símiles sunt dii illórum lígnei, et inauráti, et inargentáti.
  "71": A púrpura quoque et múrice, quæ supra illos tíneant, sciétis ítaque quia non sunt dii. Ipsi étiam postrémo comedúntur, et erunt oppróbrium in regióne.
  "72": 'Mélior est homo iustus, qui non habet simulácra: nam erit longe ab oppróbriis.'
