bible: vulgate
lang: la
language: Latina
book: Isaias
chapter: "11"
verses:
  "1": Et egrediétur virga de radíce Iesse, et flos de radíce eius ascéndet.
  "2": 'Et requiéscet super eum spíritus Dómini: spíritus sapiéntiæ et intelléctus, spíritus consílii et fortitúdinis, spíritus sciéntiæ et pietátis:'
  "3": 'et replébit eum spíritus timóris Dómini. Non secúndum visiónem oculórum iudicábit, neque secúndum audítum áurium árguet:'
  "4": 'sed iudicábit in iustítia páuperes, et árguet in æquitáte pro mansuétis terræ: et percútiet terram virga oris sui, et spíritu labiórum suórum interfíciet ímpium.'
  "5": Et erit iustítia cíngulum lumbórum eius, et fides cinctórium renum eius.
  "6": 'Habitábit lupus cum agno, et pardus cum hædo accubábit: vítulus et leo et ovis simul morabúntur, et puer párvulus minábit eos.'
  "7": 'Vítulus, et ursus pascéntur: simul requiéscent cátuli eórum: et leo quasi bos cómedet páleas.'
  "8": 'Et delectábitur infans ab úbere super forámine áspidis: et in cavérna réguli, qui ablactátus fúerit, manum suam mittet.'
  "9": 'Non nocébunt, et non occídent in univérso monte sancto meo: quia repléta est terra sciéntia Dómini, sicut aquæ maris operiéntes.'
  "10": In die illa radix Iesse, qui stat in signum populórum, ipsum gentes deprecabúntur, et erit sepúlcrum eius gloriósum.
  "11": 'Et erit in die illa: adíciet Dóminus secúndo manum suam ad possidéndum resíduum pópuli sui, quod relinquétur ab Assýriis, et ab Ægýpto, et a Phetros, et ab Æthiópia, et ab Ælam, et a Sénnaar, et ab Emath, et ab ínsulis maris.'
  "12": Et levábit signum in natiónes, et congregábit prófugos Israel, et dispérsos Iuda cólliget a quátuor plagis terræ.
  "13": 'Et auferétur zelus Ephraim, et hostes Iuda períbunt: Ephraim non æmulábitur Iudam, et Iudas non pugnábit contra Ephraim.'
  "14": 'Et volábunt in húmeros Philísthiim per mare, simul prædabúntur fílios oriéntis: Idumǽa et Moab præcéptum manus eórum, et fílii Ammon obediéntes erunt.'
  "15": 'Et desolábit Dóminus linguam maris Ægýpti, et levábit manum suam super flumen in fortitúdine spíritus sui: et percútiet eum in septem rivis, ita ut tránseant per eum calceáti.'
  "16": 'Et erit via resíduo pópulo meo, qui relinquétur ab Assýriis: sicut fuit Israéli in die illa, qua ascéndit de terra Ægýpti.'
