bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "148"
verses:
  "1": 'Allelúia. Laudáte Dóminum de cælis: laudáte eum in excélsis.'
  "2": 'Laudáte eum omnes ángeli eius: laudáte eum omnes virtútes eius.'
  "3": 'Laudáte eum sol et luna: laudáte eum omnes stellæ et lumen.'
  "4": 'Laudáte eum cæli cælórum: et aquæ omnes, quæ super cælos sunt,'
  "5": 'laudent nomen Dómini. Quia ipse dixit, et facta sunt: ipse mandávit, et creáta sunt.'
  "6": 'Státuit ea in ætérnum, et in sǽculum sǽculi: præcéptum pósuit, et non præteríbit.'
  "7": Laudáte Dóminum de terra, dracónes et omnes abýssi.
  "8": 'Ignis, grando, nix, glácies, spíritus procellárum: quæ fáciunt verbum eius:'
  "9": 'montes, et omnes colles: ligna fructífera, et omnes cedri.'
  "10": 'Béstiæ, et univérsa pécora: serpéntes, et vólucres pennátæ:'
  "11": 'reges terræ, et omnes pópuli: príncipes, et omnes iúdices terræ.'
  "12": 'Iúvenes, et vírgines: senes cum iunióribus laudent nomen Dómini:'
  "13": quia exaltátum est nomen eius solíus.
  "14": 'Conféssio eius super cælum, et terram: et exaltávit cornu pópuli sui. Hymnus ómnibus sanctis eius: fíliis Israel, pópulo appropinquánti sibi. Allelúia.'
