bible: vulgate
lang: la
language: Latina
book: II Paralipomenon
chapter: "32"
verses:
  "1": Post quæ et huiuscémodi veritátem, venit Sennácherib rex Assyriórum, et ingréssus Iudam, obsédit civitátes munítas, volens eas cápere.
  "2": Quod cum vidísset Ezechías, venísse scílicet Sennácherib, et totum belli ímpetum verti contra Ierúsalem,
  "3": 'ínito cum princípibus consílio, virísque fortíssimis, ut obturárent cápita fóntium, qui erant extra urbem: et hoc ómnium decernénte senténtia,'
  "4": 'congregávit plúrimam multitúdinem, et obturavérunt cunctos fontes, et rivum, qui fluébat in médio terræ, dicéntes: Ne véniant reges Assyriórum, et invéniant aquárum abundántiam.'
  "5": 'Ædificávit quoque, agens indústrie, omnem murum, qui fúerat dissipátus, et exstrúxit turres désuper, et forínsecus álterum murum: instauravítque Mello in civitáte David, et fecit univérsi géneris armatúram et clýpeos:'
  "6": 'constituítque príncipes bellatórum in exércitu, et convocávit univérsos in platéa portæ civitátis, ac locútus est ad cor eórum, dicens:'
  "7": 'Viríliter ágite, et confortámini: nolíte timére, nec paveátis regem Assyriórum, et univérsam multitúdinem, quæ est cum eo: multo enim plures nobíscum sunt, quam cum illo.'
  "8": 'Cum illo enim est bráchium cárneum: nobíscum Dóminus Deus noster, qui auxiliátor est noster, pugnátque pro nobis. Confortatúsque est pópulus huiuscémodi verbis Ezechíæ regis Iuda.'
  "9": 'Quæ postquam gesta sunt, misit Sennácherib rex Assyriórum servos suos in Ierúsalem (ipse enim cum univérso exércitu obsidébat Lachis) ad Ezechíam regem Iuda, et ad omnem pópulum, qui erat in urbe, dicens:'
  "10": 'Hæc dicit Sennácherib rex Assyriórum: In quo habéntes fidúciam sedétis obséssi in Ierúsalem?'
  "11": Num Ezechías décipit vos, ut tradat morti in fame et siti, affírmans quod Dóminus Deus vester líberet vos de manu regis Assyriórum?
  "12": 'Numquid non iste est Ezechías, qui destrúxit excélsa illíus, et altária, et præcépit Iuda et Ierúsalem, dicens: Coram altári uno adorábitis, et in ipso comburétis incénsum?'
  "13": An ignorátis quæ ego fécerim, et patres mei, cunctis terrárum pópulis? numquid prævaluérunt dii géntium, omniúmque terrárum, liberáre regiónem suam de manu mea?
  "14": Quis est de univérsis diis géntium, quas vastavérunt patres mei, qui potúerit erúere pópulum suum de manu mea, ut possit étiam Deus vester erúere vos de hac manu?
  "15": Non vos ergo decípiat Ezechías, nec vana persuasióne delúdat, neque credátis ei. Si enim nullus pótuit deus cunctárum géntium atque regnórum liberáre pópulum suum de manu mea, et de manu patrum meórum, consequénter nec Deus vester póterit erúere vos de manu mea.
  "16": Sed et ália multa locúti sunt servi eius contra Dóminum Deum, et contra Ezechíam servum eius.
  "17": 'Epístolas quoque scripsit plenas blasphémiæ in Dóminum Deum Israel, et locútus est advérsus eum: Sicut dii géntium ceterárum non potuérunt liberáre pópulum suum de manu mea, sic et Deus Ezechíæ erúere non póterit pópulum suum de manu ista.'
  "18": Insuper et clamóre magno, lingua Iudáica, contra pópulum, qui sedébat in muris Ierúsalem, personábat, ut terréret eos, et cáperet civitátem.
  "19": Locutúsque est contra Deum Ierúsalem, sicut advérsum deos populórum terræ, ópera mánuum hóminum.
  "20": Oravérunt ígitur Ezechías rex, et Isaías fílius Amos prophétes, advérsum hanc blasphémiam, ac vociferáti sunt usque in cælum.
  "21": 'Et misit Dóminus ángelum, qui percússit omnem virum robústum, et bellatórem, et príncipem exércitus regis Assyriórum: reversúsque est cum ignomínia in terram suam. Cumque ingréssus esset domum dei sui, fílii qui egréssi fúerant de útero eius interfecérunt eum gládio.'
  "22": Salvavítque Dóminus Ezechíam et habitatóres Ierúsalem de manu Sennácherib regis Assyriórum, et de manu ómnium, et prǽstitit eis quiétem per circúitum.
  "23": 'Multi étiam deferébant hóstias et sacrifícia Dómino in Ierúsalem, et múnera Ezechíæ regi Iuda: qui exaltátus est post hæc coram cunctis géntibus.'
  "24": 'In diébus illis ægrotávit Ezechías usque ad mortem, et orávit Dóminum: exaudivítque eum, et dedit ei signum.'
  "25": 'Sed non iuxta benefícia, quæ accéperat, retríbuit, quia elevátum est cor eius: et facta est contra eum ira, et contra Iudam et Ierúsalem.'
  "26": 'Humiliatúsque est póstea, eo quod exaltátum fuísset cor eius, tam ipse, quam habitatóres Ierúsalem: et idcírco non venit super eos ira Dómini in diébus Ezechíæ.'
  "27": Fuit autem Ezechías dives, et ínclytus valde, et thesáuros sibi plúrimos congregávit argénti, et auri, et lápidis pretiósi, arómatum, et armórum univérsi géneris, et vasórum magni prétii.
  "28": Apothécas quoque fruménti, vini, et ólei, et præsépia ómnium iumentórum, caulásque pécorum,
  "29": 'et urbes ædificávit sibi: habébat quippe greges óvium, et armentórum innumerábiles, eo quod dedísset ei Dóminus substántiam multam nimis.'
  "30": 'Ipse est Ezechías, qui obturávit superiórem fontem aquárum Gihon, et avértit eas subter ad occidéntem urbis David: in ómnibus opéribus suis fecit próspere quæ vóluit.'
  "31": Attamen in legatióne príncipum Babylónis, qui missi fúerant ad eum, ut interrogárent de porténto, quod accíderat super terram, derelíquit eum Deus ut tentarétur, et nota fíerent ómnia, quæ erant in corde eius.
  "32": Réliqua autem sermónum Ezechíæ, et misericordiárum eius, scripta sunt in visióne Isaíæ fílii Amos prophétæ, et in Libro regum Iuda et Israel.
  "33": 'Dormivítque Ezechías cum pátribus suis, et sepeliérunt eum super sepúlcra filiórum David: et celebrávit eius exséquias univérsus Iuda, et omnes habitatóres Ierúsalem: regnavítque Manásses fílius eius pro eo.'
