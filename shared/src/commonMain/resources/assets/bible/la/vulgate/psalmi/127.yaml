bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "127"
verses:
  "1": Cánticum gráduum. Beáti omnes, qui timent Dóminum, qui ámbulant in viis eius.
  "2": 'Labóres mánuum tuárum quia manducábis: beátus es, et bene tibi erit.'
  "3": Uxor tua sicut vitis abúndans, in latéribus domus tuæ. Fílii tui sicut novéllæ olivárum, in circúitu mensæ tuæ.
  "4": Ecce sic benedicétur homo, qui timet Dóminum.
  "5": 'Benedícat tibi Dóminus ex Sion: et vídeas bona Ierúsalem ómnibus diébus vitæ tuæ.'
  "6": Et vídeas fílios filiórum tuórum, pacem super Israel.
