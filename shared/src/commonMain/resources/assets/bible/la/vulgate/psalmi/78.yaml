bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "78"
verses:
  "1": 'Psalmus Asaph. Deus venérunt gentes in hereditátem tuam, polluérunt templum sanctum tuum: posuérunt Ierúsalem in pomórum custódiam.'
  "2": 'Posuérunt morticína servórum tuórum, escas volatílibus cæli: carnes sanctórum tuórum béstiis terræ.'
  "3": 'Effudérunt sánguinem eórum tamquam aquam in circúitu Ierúsalem: et non erat qui sepelíret.'
  "4": 'Facti sumus oppróbrium vicínis nostris: subsannátio et illúsio his, qui in circúitu nostro sunt.'
  "5": 'Usquequo Dómine irascéris in finem: accendétur velut ignis zelus tuus?'
  "6": 'Effúnde iram tuam in gentes, quæ te non novérunt: et in regna, quæ nomen tuum non invocavérunt:'
  "7": 'quia comedérunt Iacob: et locum eius desolavérunt.'
  "8": 'Ne memíneris iniquitátum nostrárum antiquárum, cito antícipent nos misericórdiæ tuæ: quia páuperes facti sumus nimis.'
  "9": 'Adiuva nos Deus salutáris noster: et propter glóriam nóminis tui Dómine líbera nos: et propítius esto peccátis nostris, propter nomen tuum.'
  "10": 'Ne forte dicant in géntibus: Ubi est Deus eórum? et innotéscat in natiónibus coram óculis nostris, últio sánguinis servórum tuórum, qui effúsus est:'
  "11": intróeat in conspéctu tuo gémitus compeditórum. Secúndum magnitúdinem bráchii tui, pósside fílios mortificatórum.
  "12": 'Et redde vicínis nostris séptuplum in sinu eórum: impropérium ipsórum, quod exprobravérunt tibi Dómine.'
  "13": 'Nos autem pópulus tuus, et oves páscuæ tuæ, confitébimur tibi in sǽculum: in generatiónem et generatiónem annuntiábimus laudem tuam.'
