bible: vulgate
lang: la
language: Latina
book: Matthaeus
chapter: "25"
verses:
  "1": 'Tunc símile erit regnum cælórum decem virgínibus: quæ accipiéntes lámpades suas exiérunt óbviam sponso, et sponsæ.'
  "2": 'Quinque autem ex eis erant fátuæ, et quinque prudéntes:'
  "3": 'sed quinque fátuæ, accéptis lampádibus, non sumpsérunt óleum secum:'
  "4": prudéntes vero accepérunt óleum in vasis suis cum lampádibus.
  "5": Moram autem faciénte sponso, dormitavérunt omnes et dormiérunt.
  "6": 'Média autem nocte clamor factus est: Ecce sponsus venit, exíte óbviam ei.'
  "7": Tunc surrexérunt omnes vírgines illæ, et ornavérunt lámpades suas.
  "8": 'Fátuæ autem sapiéntibus dixérunt: Date nobis de óleo vestro: quia lámpades nostræ exstinguúntur.'
  "9": 'Respondérunt prudéntes, dicéntes: Ne forte non suffíciat nobis, et vobis, ite pótius ad vendéntes, et émite vobis.'
  "10": 'Dum autem irent émere, venit sponsus: et quæ parátæ erant, intravérunt cum eo ad núptias, et clausa est iánua.'
  "11": 'Novíssime vero véniunt et réliquæ vírgines, dicéntes: Dómine, Dómine, áperi nobis.'
  "12": 'At ille respóndens, ait: Amen dico vobis, néscio vos.'
  "13": Vigiláte ítaque, quia nescítis diem, neque horam.
  "14": Sicut enim homo péregre proficíscens, vocávit servos suos, et trádidit illis bona sua.
  "15": 'Et uni dedit quinque talénta, álii autem duo, álii vero unum, unicuíque secúndum própriam virtútem: et proféctus est statim.'
  "16": Abiit autem qui quinque talénta accéperat, et operátus est in eis, et lucrátus est ália quinque.
  "17": Simíliter et qui duo accéperat, lucrátus est ália duo.
  "18": Qui autem unum accéperat, ábiens fodit in terram, et abscóndit pecúniam dómini sui.
  "19": Post multum vero témporis venit dóminus servórum illórum, et pósuit ratiónem cum eis.
  "20": 'Et accédens qui quinque talénta accéperat, óbtulit ália quinque talénta, dicens: Dómine, quinque talénta tradidísti mihi, ecce ália quinque superlucrátus sum.'
  "21": 'Ait illi dóminus eius: Euge serve bone, et fidélis: quia super pauca fuísti fidélis, super multa te constítuam: intra in gáudium dómini tui.'
  "22": 'Accéssit autem et qui duo talénta accéperat, et ait: Dómine, duo talénta tradidísti mihi, ecce ália duo lucrátus sum.'
  "23": 'Ait illi dóminus eius: Euge serve bone, et fidélis: quia super pauca fuísti fidélis, super multa te constítuam: intra in gáudium dómini tui.'
  "24": 'Accédens autem et qui unum taléntum accéperat, ait: Dómine, scio quia homo durus es: metis ubi non seminásti, et cóngregas ubi non sparsísti:'
  "25": 'et timens ábii, et abscóndi taléntum tuum in terra: ecce habes quod tuum est.'
  "26": 'Respóndens autem dóminus eius, dixit ei: Serve male, et piger, sciébas quia meto ubi non sémino, et cóngrego ubi non sparsi:'
  "27": opórtuit ergo te commíttere pecúniam meam nummuláriis, et véniens ego recepíssem útique quod meum est cum usúra.
  "28": 'Tóllite ítaque ab eo taléntum, et date ei, qui habet decem talénta:'
  "29": 'omni enim habénti dábitur, et abundábit: ei autem qui non habet, et quod vidétur habére, auferétur ab eo.'
  "30": 'Et inútilem servum eícite in ténebras exterióres: illic erit fletus, et stridor déntium.'
  "31": 'Cum autem vénerit Fílius hóminis in maiestáte sua, et omnes ángeli cum eo, tunc sedébit super sedem maiestátis suæ:'
  "32": 'et congregabúntur ante eum omnes gentes, et separábit eos ab ínvicem, sicut pastor ségregat oves ab hædis:'
  "33": et státuet oves quidem a dextris suis, hædos autem a sinístris.
  "34": 'Tunc dicet rex his, qui a dextris eius erunt: Veníte benedícti Patris mei, possidéte parátum vobis regnum a constitutióne mundi:'
  "35": 'esurívi enim, et dedístis mihi manducáre: sitívi, et dedístis mihi bíbere: hospes eram, et collegístis me:'
  "36": 'nudus, et cooperuístis me: infírmus, et visitástis me: in cárcere eram, et venístis ad me.'
  "37": 'Tunc respondébunt ei iusti, dicéntes: Dómine, quando te vídimus esuriéntem, et pávimus te: sitiéntem, et dédimus tibi potum?'
  "38": 'quando autem te vídimus hóspitem, et collégimus te: aut nudum, et cooperúimus te:'
  "39": aut quando te vídimus infírmum, aut in cárcere, et vénimus ad te?
  "40": 'Et respóndens rex, dicet illis: Amen dico vobis, quámdiu fecístis uni ex his frátribus meis mínimis, mihi fecístis.'
  "41": 'Tunc dicet et his, qui a sinístris erunt: Discédite a me maledícti in ignem ætérnum, qui parátus est diábolo, et ángelis eius:'
  "42": 'esurívi enim, et non dedístis mihi manducáre: sitívi, et non dedístis mihi potum:'
  "43": 'hospes eram, et non collegístis me: nudus, et non cooperuístis me: infírmus, et in cárcere, et non visitástis me.'
  "44": 'Tunc respondébunt ei et ipsi, dicéntes: Dómine, quando te vídimus esuriéntem, aut sitiéntem, aut hóspitem, aut nudum, aut infírmum, aut in cárcere, et non ministrávimus tibi?'
  "45": 'Tunc respondébit illis, dicens: Amen dico vobis: Quámdiu non fecístis uni de minóribus his, nec mihi fecístis.'
  "46": 'Et ibunt hi in supplícium ætérnum: iusti autem in vitam ætérnam.'
