bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "77"
verses:
  "1": 'Intelléctus Asaph. Atténdite pópule meus legem meam: inclináte aurem vestram in verba oris mei.'
  "2": 'Apériam in parábolis os meum: loquar propositiónes ab inítio.'
  "3": 'Quanta audívimus et cognóvimus ea: et patres nostri narravérunt nobis.'
  "4": Non sunt occultáta a fíliis eórum, in generatióne áltera. Narrántes laudes Dómini, et virtútes eius, et mirabília eius quæ fecit.
  "5": 'Et suscitávit testimónium in Iacob: et legem pósuit in Israel. Quanta mandávit pátribus nostris nota fácere ea fíliis suis:'
  "6": ut cognóscat generátio áltera. Fílii qui nascéntur, et exsúrgent, et narrábunt fíliis suis,
  "7": 'ut ponant in Deo spem suam, et non obliviscántur óperum Dei: et mandáta eius exquírant:'
  "8": 'ne fiant sicut patres eórum: generátio prava et exásperans: generátio, quæ non diréxit cor suum: et non est créditus cum Deo spíritus eius.'
  "9": Fílii Ephrem intendéntes et mitténtes arcum, convérsi sunt in die belli.
  "10": 'Non custodiérunt testaméntum Dei: et in lege eius noluérunt ambuláre.'
  "11": Et oblíti sunt benefactórum eius, et mirabílium eius quæ osténdit eis.
  "12": Coram pátribus eórum fecit mirabília in terra Ægýpti, in campo Táneos.
  "13": 'Interrúpit mare, et perdúxit eos: et státuit aquas quasi in utre.'
  "14": 'Et dedúxit eos in nube diéi: et tota nocte in illuminatióne ignis.'
  "15": 'Interrúpit petram in erémo: et adaquávit eos velut in abýsso multa.'
  "16": 'Et edúxit aquam de petra: et dedúxit tamquam flúmina aquas.'
  "17": 'Et apposuérunt adhuc peccáre ei: in iram excitavérunt Excélsum in inaquóso.'
  "18": Et tentavérunt Deum in córdibus suis, ut péterent escas animábus suis.
  "19": 'Et male locúti sunt de Deo: dixérunt: Numquid póterit Deus paráre mensam in desérto?'
  "20": Quóniam percússit petram, et fluxérunt aquæ, et torréntes inundavérunt. Numquid et panem póterit dare, aut paráre mensam pópulo suo?
  "21": 'Ideo audívit Dóminus, et dístulit: et ignis accénsus est in Iacob, et ira ascéndit in Israel:'
  "22": 'quia non credidérunt in Deo, nec speravérunt in salutári eius:'
  "23": et mandávit núbibus désuper, et iánuas cæli apéruit.
  "24": Et pluit illis manna ad manducándum, et panem cæli dedit eis.
  "25": 'Panem angelórum manducávit homo: cibária misit eis in abundántia.'
  "26": 'Tránstulit austrum de cælo: et indúxit in virtúte sua áfricum.'
  "27": 'Et pluit super eos sicut púlverem carnes: et sicut arénam maris volatília pennáta.'
  "28": Et cecidérunt in médio castrórum eórum, circa tabernácula eórum.
  "29": 'Et manducavérunt, et saturáti sunt nimis, et desidérium eórum áttulit eis:'
  "30": 'non sunt fraudáti a desidério suo. Adhuc escæ eórum erant in ore ipsórum:'
  "31": et ira Dei ascéndit super eos. Et occídit pingues eórum, et eléctos Israel impedívit.
  "32": 'In ómnibus his peccavérunt adhuc: et non credidérunt in mirabílibus eius.'
  "33": Et defecérunt in vanitáte dies eórum, et anni eórum cum festinatióne.
  "34": 'Cum occíderet eos, quærébant eum: et revertebántur, et dilúculo veniébant ad eum.'
  "35": 'Et rememoráti sunt, quia Deus adiútor est eórum: et Deus excélsus redémptor eórum est.'
  "36": 'Et dilexérunt eum in ore suo, et lingua sua mentíti sunt ei:'
  "37": 'cor autem eórum non erat rectum cum eo: nec fidéles hábiti sunt in testaménto eius.'
  "38": 'Ipse autem est miséricors, et propítius fiet peccátis eórum: et non dispérdet eos. Et abundávit ut avérteret iram suam: et non accéndit omnem iram suam:'
  "39": 'et recordátus est quia caro sunt: spíritus vadens, et non rédiens.'
  "40": Quóties exacerbavérunt eum in desérto, in iram concitavérunt eum in inaquóso?
  "41": 'Et convérsi sunt, et tentavérunt Deum: et sanctum Israel exacerbavérunt.'
  "42": Non sunt recordáti manus eius, die qua redémit eos de manu tribulántis,
  "43": sicut pósuit in Ægýpto signa sua, et prodígia sua in campo Táneos.
  "44": Et convértit in sánguinem flúmina eórum, et imbres eórum, ne bíberent.
  "45": 'Misit in eos cœnomyíam, et comédit eos: et ranam, et dispérdidit eos.'
  "46": 'Et dedit ærúgini fructus eórum: et labóres eórum locústæ.'
  "47": 'Et occídit in grándine víneas eórum: et moros eórum in pruína.'
  "48": 'Et trádidit grándini iuménta eórum: et possessiónem eórum igni.'
  "49": 'Misit in eos iram indignatiónis suæ: indignatiónem, et iram, et tribulatiónem: immissiónes per ángelos malos.'
  "50": 'Viam fecit sémitæ iræ suæ, non pepércit a morte animábus eórum: et iuménta eórum in morte conclúsit.'
  "51": Et percússit omne primogénitum in terra Ægýpti, primítias omnis labóris eórum in tabernáculis Cham.
  "52": 'Et ábstulit sicut oves pópulum suum: et perdúxit eos tamquam gregem in desérto.'
  "53": 'Et dedúxit eos in spe, et non timuérunt: et inimícos eórum opéruit mare.'
  "54": 'Et indúxit eos in montem sanctificatiónis suæ: montem, quem acquisívit déxtera eius. Et eiécit a fácie eórum gentes: et sorte divísit eis terram in funículo distributiónis.'
  "55": Et habitáre fecit in tabernáculis eórum tribus Israel.
  "56": 'Et tentavérunt, et exacerbavérunt Deum excélsum: et testimónia eius non custodiérunt.'
  "57": 'Et avertérunt se, et non servavérunt pactum: quemádmodum patres eórum, convérsi sunt in arcum pravum.'
  "58": 'In iram concitavérunt eum in cóllibus suis: et in sculptílibus suis ad æmulatiónem eum provocavérunt.'
  "59": 'Audívit Deus, et sprevit: et ad níhilum redégit valde Israel.'
  "60": Et répulit tabernáculum Silo, tabernáculum suum, ubi habitávit in homínibus.
  "61": Et trádidit in captivitátem virtútem eórum, et pulchritúdinem eórum in manus inimíci.
  "62": 'Et conclúsit in gládio pópulum suum: et hereditátem suam sprevit.'
  "63": Iúvenes eórum comédit ignis, et vírgines eórum non sunt lamentátæ.
  "64": 'Sacerdótes eórum in gládio cecidérunt: et víduæ eórum non plorabántur.'
  "65": Et excitátus est tamquam dórmiens Dóminus, tamquam potens crapulátus a vino.
  "66": 'Et percússit inimícos suos in posterióra: oppróbrium sempitérnum dedit illis.'
  "67": 'Et répulit tabernáculum Ioseph, et tribum Ephraim non elégit:'
  "68": sed elégit tribum Iuda, montem Sion quem diléxit.
  "69": Et ædificávit sicut unicórnium sanctifícium suum in terra, quam fundávit in sǽcula.
  "70": 'Et elégit David servum suum, et sústulit eum de grégibus óvium: de post fœtántes accépit eum,'
  "71": páscere Iacob servum suum, et Israel hereditátem suam.
  "72": 'Et pavit eos in innocéntia cordis sui: et in intelléctibus mánuum suárum dedúxit eos.'
