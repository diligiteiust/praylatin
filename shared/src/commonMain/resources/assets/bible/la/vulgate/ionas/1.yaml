bible: vulgate
lang: la
language: Latina
book: Ionas
chapter: "1"
verses:
  "1": 'Et factum est verbum Dómini ad Ionam fílium Amáthi, dicens:'
  "2": 'Surge, et vade in Níniven, civitátem grandem, et prǽdica in ea: quia ascéndit malítia eius coram me.'
  "3": 'Et surréxit Ionas, ut fúgeret in Tharsis a fácie Dómini, et descéndit in Ioppen: et invénit navem eúntem in Tharsis, et dedit naulum eius, et descéndit in eam ut iret cum eis in Tharsis a fácie Dómini.'
  "4": 'Dóminus autem misit ventum magnum in mare: et facta est tempéstas magna in mari, et navis periclitabátur cónteri.'
  "5": 'Et timuérunt nautæ, et clamavérunt viri ad deum suum: et misérunt vasa, quæ erant in navi, in mare, ut alleviarétur ab eis: et Ionas descéndit ad interióra navis, et dormiébat sopóre gravi.'
  "6": 'Et accéssit ad eum gubernátor, et dixit ei: Quid tu sopóre deprímeris? surge, ínvoca Deum tuum, si forte recógitet Deus de nobis, et non pereámus.'
  "7": 'Et dixit vir ad collégam suum: Veníte, et mittámus sortes, et sciámus quare hoc malum sit nobis. Et misérunt sortes: et cécidit sors super Ionam.'
  "8": 'Et dixérunt ad eum: Indica nobis cuius causa malum istud sit nobis: quod est opus tuum? quæ terra tua, et quo vadis? vel ex quo pópulo es tu?'
  "9": 'Et dixit ad eos: Hebrǽus ego sum, et Dóminum Deum cæli ego tímeo, qui fecit mare et áridam.'
  "10": 'Et timuérunt viri timóre magno, et dixérunt ad eum: Quid hoc fecísti? (Cognovérunt enim viri quod a fácie Dómini fúgeret, quia indicáverat eis.)'
  "11": 'Et dixérunt ad eum: Quid faciémus tibi, et cessábit mare a nobis? quia mare ibat, et intumescébat.'
  "12": 'Et dixit ad eos: Tóllite me, et míttite in mare, et cessábit mare a vobis: scio enim ego quóniam propter me tempéstas hæc grandis venit super vos.'
  "13": 'Et remigábant viri ut reverteréntur ad áridam, et non valébant: quia mare ibat, et intumescébat super eos.'
  "14": 'Et clamavérunt ad Dóminum, et dixérunt: Quǽsumus Dómine, ne pereámus in ánima viri istíus, et ne des super nos sánguinem innocéntem: quia tu Dómine, sicut voluísti, fecísti.'
  "15": 'Et tulérunt Ionam, et misérunt in mare: et stetit mare a fervóre suo.'
  "16": 'Et timuérunt viri timóre magno Dóminum: et immolavérunt hóstias Dómino, et vovérunt vota.'
