bible: vulgate
lang: la
language: Latina
book: Iob
chapter: "38"
verses:
  "1": 'Respóndens autem Dóminus Iob de túrbine, dixit:'
  "2": Quis est iste invólvens senténtias sermónibus imperítis?
  "3": 'Accínge sicut vir lumbos tuos: interrogábo te, et respónde mihi.'
  "4": Ubi eras quando ponébam fundaménta terræ? índica mihi, si habes intelligéntiam.
  "5": Quis pósuit mensúras eius, si nosti? vel quis teténdit super eam líneam?
  "6": Super quo bases illíus solidátæ sunt? aut quis demísit lápidem angulárem eius,
  "7": cum me laudárent simul astra matutína, et iubilárent omnes fílii Dei?
  "8": 'Quis conclúsit óstiis mare, quando erumpébat quasi de vulva procédens:'
  "9": cum pónerem nubem vestiméntum eius, et calígine illud quasi pannis infántiæ obvólverem?
  "10": 'Circúmdedi illud términis meis, et pósui vectem, et óstia:'
  "11": 'et dixi: Usque huc vénies, et non procédes ámplius, et hic confrínges tuméntes fluctus tuos.'
  "12": Numquid post ortum tuum præcepísti dilúculo, et ostendísti auróræ locum suum?
  "13": et tenuísti concútiens extréma terræ, et excussísti ímpios ex ea?
  "14": 'Restituétur ut lutum signáculum, et stabit sicut vestiméntum:'
  "15": auferétur ab ímpiis lux sua, et bráchium excélsum confringétur.
  "16": Numquid ingréssus es profúnda maris, et in novíssimis abýssi deambulásti?
  "17": Numquid apértæ sunt tibi portæ mortis, et óstia tenebrósa vidísti?
  "18": Numquid considerásti latitúdinem terræ? índica mihi, si nosti, ómnia,
  "19": 'in qua via lux hábitet, et tenebrárum quis locus sit:'
  "20": ut ducas unumquódque ad términos suos, et intélligas sémitas domus eius.
  "21": Sciébas tunc quod nascitúrus esses, et númerum diérum tuórum nóveras?
  "22": Numquid ingréssus es thesáuros nivis, aut thesáuros grándinis aspexísti?
  "23": quæ præparávi in tempus hostis, in diem pugnæ et belli?
  "24": Per quam viam spárgitur lux, divíditur æstus super terram?
  "25": Quis dedit vehementíssimo imbri cursum, et viam sonántis tonítrui,
  "26": ut plúeret super terram absque hómine in desérto, ubi nullus mortálium commorátur,
  "27": ut impléret ínviam et desolátam, et prodúceret herbas viréntes?
  "28": Quis est plúviæ pater? vel quis génuit stillas roris?
  "29": De cuius útero egréssa est glácies? et gelu de cælo quis génuit?
  "30": In similitúdinem lápidis aquæ durántur, et superfícies abýssi constríngitur.
  "31": Numquid coniúngere valébis micántes stellas Pleíadas, aut gyrum Arctúri póteris dissipáre?
  "32": Numquid prodúcis Lucíferum in témpore suo, et Vésperum super fílios terræ consúrgere facis?
  "33": Numquid nosti órdinem cæli, et pones ratiónem eius in terra?
  "34": Numquid elevábis in nébula vocem tuam, et ímpetus aquárum opériet te?
  "35": 'Numquid mittes fúlgura, et ibunt, et reverténtia dicent tibi: Adsumus?'
  "36": Quis pósuit in viscéribus hóminis sapiéntiam? vel quis dedit gallo intelligéntiam?
  "37": Quis enarrábit cælórum ratiónem? et concéntum cæli quis dormíre fáciet?
  "38": Quando fundebátur pulvis in terra, et glebæ compingebántur?
  "39": Numquid cápies leǽnæ prædam, et ánimam catulórum eius implébis,
  "40": quando cubant in antris, et in spécubus insidiántur?
  "41": Quis prǽparat corvo escam suam, quando pulli eius clamant ad Deum, vagántes, eo quod non hábeant cibos?
