bible: vulgate
lang: la
language: Latina
book: I Machabaeorum
chapter: "13"
verses:
  "1": Et audívit Simon quod congregávit Tryphon exércitum copiósum, ut veníret in terram Iuda, et attéreret eam.
  "2": 'Videns quia in tremóre pópulus est, et in timóre, ascéndit Ierúsalem, et congregávit pópulum:'
  "3": 'et adhórtans dixit: Vos scitis quanta ego, et fratres mei, et domus patris mei fécimus pro légibus, et pro sanctis prœ́lia, et angústias quales vídimus:'
  "4": horum grátia periérunt fratres mei omnes propter Israel, et relíctus sum ego solus.
  "5": 'Et nunc non mihi contíngat párcere ánimæ meæ in omni témpore tribulatiónis: non enim mélior sum frátribus meis.'
  "6": 'Vindicábo ítaque gentem meam, et sancta, natos quoque nostros, et uxóres: quia congregátæ sunt univérsæ gentes contérere nos inimicítiæ grátia.'
  "7": 'Et accénsus est spíritus pópuli simul ut audívit sermónes istos:'
  "8": 'et respondérunt voce magna, dicéntes: Tu es dux noster loco Iudæ, et Iónathæ fratris tui:'
  "9": 'pugna prœ́lium nostrum: et ómnia, quæcúmque díxeris nobis, faciémus.'
  "10": Et cóngregans omnes viros bellatóres, accelerávit consummáre univérsos muros Ierúsalem, et munívit eam in gyro.
  "11": Et misit Iónathan fílium Absalómi, et cum eo exércitum novum in Ioppen, et eiéctis his, qui erant in ea, remánsit illic ipse.
  "12": Et movit Tryphon a Ptolemáida cum exércitu multo, ut veníret in terram Iuda, et Iónathas cum eo in custódia.
  "13": Simon autem applícuit in Addus contra fáciem campi.
  "14": Et ut cognóvit Tryphon quia surréxit Simon loco fratris sui Iónathæ, et quia commissúrus esset cum eo prœ́lium, misit ad eum legátos,
  "15": 'dicens: Pro argénto, quod debébat frater tuus Iónathas in ratióne regis propter negótia quæ hábuit, detinúimus eum.'
  "16": Et nunc mitte argénti talénta centum, et duos fílios eius óbsides, ut non dimíssus fúgiat a nobis, et remittémus eum.
  "17": 'Et cognóvit Simon quia cum dolo loquerétur secum, iussit tamen dari argéntum, et púeros, ne inimicítiam magnam súmeret ad pópulum Israel, dicéntem:'
  "18": Quia non misit ei argéntum, et púeros, proptérea périit.
  "19": 'Et misit púeros, et centum talénta: et mentítus est, et non dimísit Iónathan.'
  "20": 'Et post hæc venit Tryphon intra regiónem, ut contéreret eam: et gyravérunt per viam, quæ ducit Ador: et Simon, et castra eius ambulábant in omnem locum quocúmque ibant.'
  "21": Qui autem in arce erant, misérunt ad Tryphónem legátos, ut festináret veníre per desértum, et mítteret illis alimónias.
  "22": 'Et parávit Tryphon omnem equitátum, ut veníret illa nocte: erat autem nix multa valde, et non venit in Galaadítim.'
  "23": Et cum appropinquásset Báscaman, occídit Iónathan, et fílios eius illic.
  "24": Et convértit Tryphon, et ábiit in terram suam.
  "25": Et misit Simon, et accépit ossa Iónathæ fratris sui, et sepelívit ea in Modin civitáte patrum eius.
  "26": Et planxérunt eum omnis Israel planctu magno, et luxérunt eum dies multos.
  "27": Et ædificávit Simon super sepúlcrum patris sui et fratrum suórum ædifícium altum visu, lápide políto retro et ante.
  "28": 'Et státuit septem pyrámidas, unam contra unam, patri et matri, et quátuor frátribus:'
  "29": 'et his circumpósuit colúmnas magnas: et super colúmnas arma, ad memóriam ætérnam: et iuxta arma naves sculptas, quæ videréntur ab ómnibus navigántibus mare:'
  "30": hoc est sepúlcrum, quod fecit in Modin usque in hunc diem.
  "31": 'Tryphon autem cum iter fáceret cum Antíocho rege adolescénte, dolo occídit eum:'
  "32": et regnávit loco eius, et impósuit sibi diadéma Asiæ, et fecit plagam magnam in terra.
  "33": 'Et ædificávit Simon præsídia Iudǽæ, múniens ea túrribus excélsis, et muris magnis, et portis, et seris: et pósuit aliménta in munitiónibus.'
  "34": 'Et elégit Simon viros, et misit ad Demétrium regem, ut fáceret remissiónem regióni: quia actus omnes Tryphónis per direptiónem fúerant gesti.'
  "35": 'Et Demétrius rex ad verba ista respóndit ei, et scripsit epístolam talem:'
  "36": Rex Demétrius Simóni summo sacerdóti et amíco regum, et senióribus, et genti Iudæórum, salútem.
  "37": 'Corónam áuream, et bahem, quam misístis, suscépimus: et paráti sumus fácere vobíscum pacem magnam, et scríbere præpósitis regis remíttere vobis quæ indúlsimus.'
  "38": 'Quæcúmque enim constitúimus, vobis constant. Munitiónes, quas ædificástis, vobis sint:'
  "39": 'remíttimus quoque ignorántias, et peccáta usque in hodiérnum diem, et corónam quam debebátis: et si quid áliud erat tributárium in Ierúsalem, iam non sit tributárium.'
  "40": Et si qui ex vobis apti sunt conscríbi inter nostros, conscribántur, et sit inter nos pax.
  "41": Anno centésimo septuagésimo, ablátum est iugum géntium ab Israel.
  "42": Et cœpit pópulus Israel scríbere in tábulis, et gestis públicis, anno primo sub Simóne summo sacerdóte, magno duce, et príncipe Iudæórum.
  "43": In diébus illis applícuit Simon ad Gazam, et circúmdedit eam castris, et fecit máchinas, et applícuit ad civitátem, et percússit turrem unam, et comprehéndit eam.
  "44": 'Et erúperant qui erant intra máchinam in civitátem: et factus est motus magnus in civitáte.'
  "45": Et ascendérunt qui erant in civitáte cum uxóribus, et fíliis supra murum scissis túnicis suis, et clamavérunt voce magna, postulántes a Simóne dextras sibi dari,
  "46": 'et dixérunt: Non nobis reddas secúndum malítias nostras, sed secúndum misericórdias tuas.'
  "47": 'Et flexus Simon, non debellávit eos: eiécit tamen eos de civitáte, et mundávit ædes, in quibus fúerant simulácra, et tunc intrávit in eam cum hymnis benedícens Dóminum:'
  "48": 'et eiécta ab ea omni immundítia, collocávit in ea viros, qui legem fácerent: et munívit eam, et fecit sibi habitatiónem.'
  "49": 'Qui autem erant in arce Ierúsalem, prohibebántur égredi et íngredi regiónem, et émere ac véndere: et esuriérunt valde, et multi ex eis fame periérunt,'
  "50": 'et clamavérunt ad Simónem ut dextras accíperent: et dedit illis: et eiécit eos inde, et mundávit arcem a contaminatiónibus:'
  "51": et intravérunt in eam tértia et vigésima die secúndi mensis, anno centésimo septuagésimo primo cum laude, et ramis palmárum, et cínyris, et cýmbalis, et nablis, et hymnis, et cánticis, quia contrítus est inimícus magnus ex Israel.
  "52": Et constítuit ut ómnibus annis ageréntur dies hi cum lætítia.
  "53": Et munívit montem templi, qui erat secus arcem, et habitávit ibi ipse, et qui cum eo erant.
  "54": 'Et vidit Simon Ioánnem fílium suum, quod fortis prœ́lii vir esset: et pósuit eum ducem virtútum universárum: et habitávit in Gázaris.'
