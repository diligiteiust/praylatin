bible: vulgate
lang: la
language: Latina
book: Ieremias
chapter: "28"
verses:
  "1": 'Et factum est in anno illo, in princípio regni Sedecíæ regis Iuda, in anno quarto, in mense quinto, dixit ad me Hananías fílius Azur, prophéta de Gábaon, in domo Dómini, coram sacerdótibus et omni pópulo, dicens:'
  "2": 'Hæc dicit Dóminus exercítuum, Deus Israel: Contrívi iugum regis Babylónis.'
  "3": Adhuc duo anni diérum, et ego reférri fáciam ad locum istum ómnia vasa domus Dómini, quæ tulit Nabuchodónosor rex Babylónis de loco isto, et tránstulit ea in Babylónem.
  "4": 'Et Iechoníam fílium Ióakim regem Iuda, et omnem transmigratiónem Iuda, qui ingréssi sunt in Babylónem, ego convértam ad locum istum, ait Dóminus: cónteram enim iugum regis Babylónis.'
  "5": 'Et dixit Ieremías prophéta ad Hananíam prophétam, in óculis sacerdótum, et in óculis omnis pópuli, qui stabat in domo Dómini:'
  "6": 'et ait Ieremías prophéta: Amen, sic fáciat Dóminus: súscitet Dóminus verba tua, quæ prophetásti: ut referántur vasa in domum Dómini, et omnis transmigrátio de Babylóne ad locum istum.'
  "7": 'Verúmtamen audi verbum hoc, quod ego loquor in áuribus tuis, et in áuribus univérsi pópuli:'
  "8": Prophétæ, qui fuérunt ante me et ante te ab inítio, et prophetavérunt super terras multas, et super regna magna de prœ́lio, et de afflictióne, et de fame.
  "9": 'Prophéta, qui vaticinátus est pacem: cum vénerit verbum eius, sciétur prophéta, quem misit Dóminus in veritáte.'
  "10": Et tulit Hananías prophéta caténam de collo Ieremíæ prophétæ, et confrégit eam.
  "11": 'Et ait Hananías in conspéctu omnis pópuli, dicens: Hæc dicit Dóminus: Sic confríngam iugum Nabuchodónosor regis Babylónis, post duos annos diérum de collo ómnium géntium.'
  "12": 'Et ábiit Ieremías prophéta in viam suam. Et factum est verbum Dómini ad Ieremíam, postquam confrégit Hananías prophéta caténam de collo Ieremíæ prophétæ, dicens:'
  "13": 'Vade, et dices Hananíæ: Hæc dicit Dóminus: Caténas lígneas contrivísti: et fácies pro eis caténas férreas.'
  "14": 'Quia hæc dicit Dóminus exercítuum, Deus Israel: Iugum férreum pósui super collum cunctárum géntium istárum, ut sérviant Nabuchodónosor regi Babylónis, et sérvient ei: ínsuper et béstias terræ dedi ei.'
  "15": 'Et dixit Ieremías prophéta ad Hananíam prophétam: Audi Hananía: non misit te Dóminus, et tu confídere fecísti pópulum istum in mendácio.'
  "16": 'Idcírco hæc dicit Dóminus: Ecce ego mittam te a fácie terræ: hoc anno moriéris: advérsum enim Dóminum locútus es.'
  "17": Et mórtuus est Hananías prophéta in anno illo, mense séptimo.
