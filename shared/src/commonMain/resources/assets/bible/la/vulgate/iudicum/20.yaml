bible: vulgate
lang: la
language: Latina
book: Iudicum
chapter: "20"
verses:
  "1": Egréssi ítaque sunt omnes fílii Israel, et páriter congregáti, quasi vir unus, de Dan usque Bersabée, et terra Gálaad, ad Dóminum in Maspha.
  "2": Omnésque ánguli populórum, et cunctæ tribus Israel in ecclésiam pópuli Dei convenérunt, quadringénta míllia péditum pugnatórum.
  "3": (Nec látuit fílios Béniamin quod ascendíssent fílii Israel in Maspha.) Interrogatúsque Levíta, marítus mulíeris interféctæ, quómodo tantum scelus perpetrátum esset,
  "4": 'respóndit: Veni in Gábaa Béniamin cum uxóre mea, illúcque divérti:'
  "5": et ecce hómines civitátis illíus circumdedérunt nocte domum, in qua manébam, voléntes me occídere, et uxórem meam incredíbili furóre libídinis vexántes, dénique mórtua est.
  "6": 'Quam arréptam, in frusta concídi, misíque partes in omnes términos possessiónis vestræ: quia numquam tantum nefas, et tam grande piáculum factum est in Israel.'
  "7": Adéstis omnes fílii Israel, decérnite quid fácere debeátis.
  "8": 'Stansque omnis pópulus, quasi uníus hóminis sermóne respóndit: Non recedémus in tabernácula nostra, nec suam quisquam intrábit domum:'
  "9": sed hoc contra Gábaa in commúne faciámus.
  "10": Decem viri eligántur e centum ex ómnibus tríbubus Israel, et centum de mille, et mille de decem míllibus, ut compórtent exercítui cibária, et possímus pugnáre contra Gábaa Béniamin, et réddere ei pro scélere, quod merétur.
  "11": Convenítque univérsus Israel ad civitátem, quasi homo unus eádem mente, unóque consílio.
  "12": 'Et misérunt núntios ad omnem tribum Béniamin, qui dícerent: Cur tantum nefas in vobis repértum est?'
  "13": 'Trádite hómines de Gábaa, qui hoc flagítium perpetrárunt, ut moriántur, et auferátur malum de Israel. Qui noluérunt fratrum suórum filiórum Israel audíre mandátum:'
  "14": sed ex cunctis úrbibus, quæ sortis suæ erant, convenérunt in Gábaa, ut illis ferrent auxílium, et contra univérsum pópulum Israel dimicárent.
  "15": Inventíque sunt vigínti quinque míllia de Béniamin educéntium gládium, præter habitatóres Gábaa,
  "16": 'qui septingénti erant viri fortíssimi, ita sinístra ut dextra prœliántes: et sic fundis lápides ad certum iaciéntes, ut capíllum quoque possent percútere, et nequáquam in álteram partem ictus lápidis deferrétur.'
  "17": Virórum quoque Israel, absque fíliis Béniamin, invénta sunt quadringénta míllia educéntium gládium, et paratórum ad pugnam.
  "18": 'Qui surgéntes venérunt in domum Dei, hoc est, in Silo: consuluerúntque Deum, atque dixérunt: Quis erit in exércitu nostro princeps certáminis contra fílios Béniamin? Quibus respóndit Dóminus: Iudas sit dux vester.'
  "19": 'Statímque fílii Israel surgéntes mane, castrametáti sunt iuxta Gábaa:'
  "20": et inde procedéntes ad pugnam contra Béniamin, urbem oppugnáre cœpérunt.
  "21": Egressíque fílii Béniamin de Gábaa, occidérunt de fíliis Israel die illo vigínti duo míllia virórum.
  "22": 'Rursum fílii Israel et fortitúdine et número confidéntes, in eódem loco, in quo prius certáverant, áciem direxérunt:'
  "23": 'ita tamen ut prius ascénderent et flerent coram Dómino usque ad noctem: consuleréntque eum, et dícerent: Débeo ultra procédere ad dimicándum contra fílios Béniamin fratres meos, an non? Quibus ille respóndit: Ascéndite ad eos, et iníte certámen.'
  "24": Cumque fílii Israel áltera die contra fílios Béniamin ad prœ́lium processíssent,
  "25": 'erupérunt fílii Béniamin de portis Gábaa: et occurréntes eis tanta in illos cæde baccháti sunt, ut decem et octo míllia virórum educéntium gládium prostérnerent.'
  "26": 'Quam ob rem omnes fílii Israel venérunt in domum Dei, et sedéntes flebant coram Dómino: ieiunaverúntque die illo usque ad vésperam, et obtulérunt ei holocáusta, atque pacíficas víctimas,'
  "27": et super statu suo interrogavérunt. Eo témpore ibi erat arca fœ́deris Dei,
  "28": 'et Phínees fílius Eleázari fílii Aaron præpósitus domus. Consuluérunt ígitur Dóminum, atque dixérunt: Exíre ultra debémus ad pugnam contra fílios Béniamin fratres nostros, an quiéscere? Quibus ait Dóminus: Ascéndite, cras enim tradam eos in manus vestras.'
  "29": 'Posuerúntque fílii Israel insídias per circúitum urbis Gábaa:'
  "30": et tértia vice, sicut semel et bis, contra Béniamin exércitum produxérunt.
  "31": 'Sed et fílii Béniamin audácter erupérunt de civitáte, et fugiéntes adversários lóngius persecúti sunt, ita ut vulnerárent ex eis sicut primo die et secúndo, et cǽderent per duas sémitas verténtes terga, quarum una ferebátur in Bethel et áltera in Gábaa, atque prostérnerent trigínta círciter viros:'
  "32": putavérunt enim sólito eos more cédere. Qui fugam arte simulántes iniérunt consílium ut abstráherent eos de civitáte, et quasi fugiéntes ad supradíctas sémitas perdúcerent.
  "33": Omnes ítaque fílii Israel surgéntes de sédibus suis, tetendérunt áciem in loco, qui vocátur Baálthamar. Insídiæ quoque, quæ circa urbem erant, paulátim se aperíre cœpérunt,
  "34": 'et ab occidentáli urbis parte procédere. Sed et ália decem míllia virórum de univérso Israel, habitatóres urbis ad certámina provocábant. Ingravatúmque est bellum contra fílios Béniamin: et non intellexérunt quod ex omni parte illis instáret intéritus.'
  "35": Percussítque eos Dóminus in conspéctu filiórum Israel, et interfecérunt ex eis in illo die vigínti quinque míllia, et centum viros, omnes bellatóres et educéntes gládium.
  "36": Fílii autem Béniamin cum se inferióres esse vidíssent, cœpérunt fúgere. Quod cernéntes fílii Israel, dedérunt eis ad fugiéndum locum, ut ad præparátas insídias devenírent, quas iuxta urbem posúerant.
  "37": Qui cum repénte de latíbulis surrexíssent, et Béniamin terga cædéntibus daret, ingréssi sunt civitátem, et percussérunt eam in ore gládii.
  "38": 'Signum autem déderant fílii Israel his, quos in insídiis collocáverant, ut postquam urbem cepíssent, ignem accénderent: ut ascendénte in altum fumo, captam urbem demonstrárent.'
  "39": Quod cum cérnerent fílii Israel in ipso certámine pósiti (putavérunt enim fílii Béniamin eos fúgere, et instántius persequebántur, cæsis de exércitu eórum trigínta viris),
  "40": 'et vidérent quasi colúmnam fumi de civitáte conscéndere: Béniamin quoque aspíciens retro, cum captam cérneret civitátem, et flammas in sublíme ferri:'
  "41": qui prius simuláverant fugam, versa fácie fórtius resistébant. Quod cum vidíssent fílii Béniamin, in fugam versi sunt,
  "42": 'et ad viam desérti ire cœpérunt, illuc quoque eos adversáriis persequéntibus: sed et hi, qui urbem succénderant, occurrérunt eis.'
  "43": Atque ita factum est, ut ex utráque parte ab hóstibus cæderéntur, nec erat ulla réquies moriéntium. Cecidérunt, atque prostráti sunt ad orientálem plagam urbis Gábaa.
  "44": Fuérunt autem qui in eódem loco interfécti sunt, decem et octo míllia virórum, omnes robustíssimi pugnatóres.
  "45": 'Quod cum vidíssent, qui remánserant de Béniamin, fugérunt in solitúdinem: et pergébant ad petram, cuius vocábulum est Remmon. In illa quoque fuga palántes, et in divérsa tendéntes, occidérunt quinque míllia virórum. Et cum ultra ténderent, persecúti sunt eos, et interfecérunt étiam ália duo míllia.'
  "46": Et sic factum est, ut omnes qui cecíderant de Béniamin in divérsis locis essent vigínti quinque míllia, pugnatóres ad bella promptíssimi.
  "47": 'Remansérunt ítaque de omni número Béniamin, qui evádere, et fúgere in solitúdinem potuérunt, sexcénti viri: sederúntque in petra Remmon ménsibus quátuor.'
  "48": Regréssi autem fílii Israel, omnes relíquias civitátis a viris usque ad iuménta gládio percussérunt, cunctásque urbes et vículos Béniamin vorax flamma consúmpsit.
