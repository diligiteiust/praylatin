bible: vulgate
lang: la
language: Latina
book: Ieremias
chapter: "47"
verses:
  "1": Quod factum est verbum Dómini ad Ieremíam prophétam contra Palæstínos, ántequam percúteret Phárao Gazam.
  "2": 'Hæc dicit Dóminus: Ecce aquæ ascéndunt ab aquilóne, et erunt quasi torrens inúndans, et opérient terram et plenitúdinem eius, urbem et habitatóres eius: clamábunt hómines, et ululábunt omnes habitatóres terræ,'
  "3": a strépitu pompæ armórum, et bellatórum eius, a commotióne quadrigárum eius, et multitúdine rotárum illíus. Non respexérunt patres fílios mánibus dissolútis
  "4": 'pro advéntu diéi, in quo vastabúntur omnes Philísthiim, et dissipábitur Tyrus, et Sidon cum ómnibus réliquis auxíliis suis: depopulátus est enim Dóminus Palæstínos, relíquias ínsulæ Cappadóciæ.'
  "5": 'Venit calvítium super Gazam: contícuit Ascalon, et relíquiæ vallis eárum, úsquequo concidéris?'
  "6": O mucro Dómini úsquequo non quiésces? Ingrédere in vagínam tuam, refrigeráre, et sile.
  "7": Quómodo quiéscet, cum Dóminus præcéperit ei advérsus Ascalónem, et advérsus marítimas eius regiónes, ibíque condíxerit illi?
