bible: vulgate
lang: la
language: Latina
book: ad Corinthios I
chapter: "5"
verses:
  "1": Omníno audítur inter vos fornicátio, et talis fornicátio, qualis nec inter gentes, ita ut uxórem patris sui áliquis hábeat.
  "2": 'Et vos infláti estis: et non magis luctum habuístis ut tollátur de médio vestrum qui hoc opus fecit.'
  "3": Ego quidem absens córpore, præsens autem spíritu, iam iudicávi ut præsens eum, qui sic operátus est.
  "4": In nómine Dómini nostri Iesu Christi, congregátis vobis et meo spíritu, cum virtúte Dómini nostri Iesu,
  "5": trádere huiúsmodi Sátanæ in intéritum carnis, ut spíritus salvus sit in die Dómini nostri Iesu Christi.
  "6": Non est bona gloriátio vestra. Nescítis quia módicum ferméntum totam massam corrúmpit?
  "7": Expurgáte vetus ferméntum, ut sitis nova conspérsio, sicut estis ázymi. Etenim Pascha nostrum immolátus est Christus.
  "8": 'Itaque epulémur: non in ferménto véteri, neque in ferménto malítiæ, et nequítiæ: sed in ázymis sinceritátis, et veritátis.'
  "9": 'Scripsi vobis in epístola: Ne commisceámini fornicáriis:'
  "10": 'non útique fornicáriis huius mundi, aut aváris, aut rapácibus, aut idólis serviéntibus: alióquin debuerátis de hoc mundo exiísse.'
  "11": 'Nunc autem scripsi vobis non commiscéri: si is, qui frater nominátur, est fornicátor, aut avárus, aut idólis sérviens, aut malédicus, aut ebriósus, aut rapax, cum eiúsmodi nec cibum súmere.'
  "12": Quid enim mihi de iis, qui foris sunt, iudicáre? Nonne de iis, qui intus sunt, vos iudicátis?
  "13": Nam eos, qui foris sunt, Deus iudicábit. Auférte malum ex vobis ipsis.
