bible: vulgate
lang: la
language: Latina
book: II Machabaeorum
chapter: "3"
verses:
  "1": Igitur cum sancta cívitas habitarétur in omni pace, leges étiam adhuc óptime custodiréntur, propter Oníæ pontíficis pietátem, et ánimos ódio habéntes mala,
  "2": 'fiébat ut et ipsi reges, et príncipes locum summo honóre dignum dúcerent, et templum máximis munéribus illustrárent:'
  "3": ita ut Seléucus Asiæ rex de reddítibus suis præstáret omnes sumptus ad ministérium sacrificiórum pertinéntes.
  "4": Simon autem de tribu Béniamin, præpósitus templi constitútus, contendébat, obsisténte sibi príncipe sacerdótum, iníquum áliquid in civitáte molíri.
  "5": 'Sed cum víncere Oníam non posset, venit ad Apollónium Tharsǽæ fílium, qui eo témpore erat dux Cœlesýriæ, et Phœnícis:'
  "6": 'et nuntiávit ei pecúniis innumerabílibus plenum esse ærárium Ierosólymis, et commúnes cópias imménsas esse, quæ non pértinent ad ratiónem sacrificiórum: esse autem possíbile sub potestáte regis cádere univérsa.'
  "7": Cumque retulísset ad regem Apollónius de pecúniis, quæ delátæ erant, ille accítum Heliodórum, qui erat super negótia eius, misit, cum mandátis ut prædíctam pecúniam transportáret.
  "8": Statímque Heliodórus iter est aggréssus, spécie quidem quasi per Cœlesýriam et Phœnícen civitátes esset peragratúrus, re vera autem regis propósitum perfectúrus.
  "9": 'Sed cum venísset Ierosólymam, et benígne a summo sacerdóte in civitáte esset excéptus, narrávit de dato indício pecuniárum, et cuius rei grátia adésset, apéruit: interrogábat autem si vere hæc ita essent.'
  "10": 'Tunc summus sacérdos osténdit depósita esse hæc, et victuália viduárum, et pupillórum:'
  "11": 'quædam vero esse Hircáni Tobíæ viri valde eminéntis, in his, quæ detúlerat ímpius Simon: univérsa autem argénti talénta esse quadringénta, et auri ducénta:'
  "12": décipi vero eos, qui credidíssent loco, et templo, quod per univérsum mundum honorátur pro sui veneratióne, et sanctitáte omníno impossíbile esse.
  "13": At ille pro his, quæ habébat in mandátis a rege, dicébat omni génere regi ea esse deferénda.
  "14": Constitúta autem die, intrábat de his Heliodórus ordinatúrus. Non módica vero per univérsam civitátem erat trepidátio.
  "15": Sacerdótes autem ante altáre cum stolis sacerdotálibus iactavérunt se, et invocábant de cælo eum, qui de depósitis legem pósuit, ut his, qui deposúerant ea, salva custodíret.
  "16": 'Iam vero qui vidébat summi sacerdótis vultum, mente vulnerabátur: fácies enim, et color immutátus declarábat intérnum ánimi dolórem:'
  "17": circumfúsa enim erat mœstítia quædam viro, et horror córporis, per quem maniféstus aspiciéntibus dolor cordis eius efficiebátur.
  "18": Alii étiam gregátim de dómibus confluébant, pública supplicatióne obsecrántes, pro eo quod in contémptum locus esset ventúrus.
  "19": 'Accinctǽque mulíeres cilíciis pectus, per platéas confluébant: sed et vírgines quæ conclúsæ erant, procurrébant ad Oníam, áliæ autem ad muros, quædam vero per fenéstras aspiciébant:'
  "20": 'univérsæ autem protendéntes manus in cælum, deprecabántur:'
  "21": erat enim mísera commístæ multitúdinis, et magni sacerdótis in agóne constitúti exspectátio.
  "22": Et hi quidem invocábant omnipoténtem Deum, ut crédita sibi his, qui credíderant, cum omni integritáte conservaréntur.
  "23": Heliodórus autem, quod decréverat, perficiébat eódem loco ipse cum satellítibus circa ærárium præsens.
  "24": Sed spíritus omnipoténtis Dei magnam fecit suæ ostensiónis evidéntiam, ita ut omnes, qui ausi fúerant parére ei, ruéntes Dei virtúte, in dissolutiónem, et formídinem converteréntur.
  "25": 'Appáruit enim illis quidam equus terríbilem habens sessórem, óptimis operiméntis adornátus: isque cum ímpetu Heliodóro prióres calces elísit: qui autem ei sedébat, videbátur arma habére áurea.'
  "26": 'Alii étiam apparuérunt duo iúvenes virtúte decóri, óptimi glória, speciosíque amíctu: qui circumstetérunt eum, et ex utráque parte flagellábant, sine intermissióne multis plagis verberántes.'
  "27": Súbito autem Heliodórus cóncidit in terram, eúmque multa calígine circumfúsum rapuérunt, atque in sella gestatória pósitum eiecérunt.
  "28": 'Et is, qui cum multis cursóribus, et satellítibus prædíctum ingréssus est ærárium, portabátur nullo sibi auxílium ferénte, manifésta Dei cógnita virtúte:'
  "29": et ille quidem per divínam virtútem iacébat mutus, atque omni spe et salúte privátus.
  "30": 'Hi autem Dóminum benedicébant, quia magnificábat locum suum: et templum, quod paulo ante timóre ac tumúltu erat plenum, apparénte omnipoténte Dómino, gáudio et lætítia implétum est.'
  "31": Tunc vero ex amícis Heliodóri quidam rogábant conféstim Oníam, ut invocáret Altíssimum, ut vitam donáret ei, qui in suprémo spíritu erat constitútus.
  "32": Consíderans autem summus sacérdos ne forte rex suspicarétur malítiam áliquam ex Iudǽis circa Heliodórum consummátam, óbtulit pro salúte viri hóstiam salutárem.
  "33": 'Cumque summus sacérdos exoráret, iídem iúvenes eísdem véstibus amícti astántes Heliodóro, dixérunt: Oníæ sacerdóti grátias age: nam propter eum Dóminus tibi vitam donávit.'
  "34": Tu autem a Deo flagellátus, núntia ómnibus magnália Dei, et potestátem. Et his dictis, non comparuérunt.
  "35": Heliodórus autem, hóstia Deo obláta, et votis magnis promíssis ei, qui vívere illi concéssit, et Oníæ grátias agens, recépto exércitu, repedábat ad regem.
  "36": Testabátur autem ómnibus ea quæ sub óculis suis víderat ópera magni Dei.
  "37": 'Cum autem rex interrogásset Heliodórum, quis esset aptus adhuc semel Ierosólymam mitti, ait:'
  "38": 'Si quem habes hostem, aut regni tui insidiatórem, mitte illuc, et flagellátum eum recípies, si tamen eváserit: eo quod in loco sit vere Dei quædam virtus.'
  "39": Nam ipse, qui habet in cælis habitatiónem, visitátor, et adiútor est loci illíus, et veniéntes ad malefaciéndum pércutit, ac perdit.
  "40": Igitur de Heliodóro, et ærárii custódia ita res se habet.
