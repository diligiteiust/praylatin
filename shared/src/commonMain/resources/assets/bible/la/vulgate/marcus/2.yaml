bible: vulgate
lang: la
language: Latina
book: Marcus
chapter: "2"
verses:
  "1": Et íterum intrávit Caphárnaum post dies,
  "2": et audítum est quod in domo esset, et convenérunt multi, ita ut non cáperet neque ad iánuam, et loquebátur eis verbum.
  "3": Et venérunt ad eum feréntes paralýticum, qui a quátuor portabátur.
  "4": 'Et cum non possent offérre eum illi præ turba, nudavérunt tectum ubi erat: et patefaciéntes submisérunt grabátum, in quo paralýticus iacébat.'
  "5": 'Cum autem vidísset Iesus fidem illórum, ait paralýtico: Fili, dimittúntur tibi peccáta tua.'
  "6": 'Erant autem illic quidam de scribis sedéntes, et cogitántes in córdibus suis:'
  "7": Quid hic sic lóquitur? blasphémat. Quis potest dimíttere peccáta, nisi solus Deus?
  "8": 'Quo statim cógnito Iesus spíritu suo, quia sic cogitárent intra se, dicit illis: Quid ista cogitátis in córdibus vestris?'
  "9": 'Quid est facílius dícere paralýtico: Dimittúntur tibi peccáta tua: an dícere: Surge, tolle grabátum tuum, et ámbula?'
  "10": Ut autem sciátis quia Fílius hóminis habet potestátem in terra dimitténdi peccáta, (ait paralýtico)
  "11": 'tibi dico: Surge, tolle grabátum tuum, et vade in domum tuam.'
  "12": 'Et statim surréxit ille: et, subláto grabáto, ábiit coram ómnibus, ita ut miraréntur omnes, et honorificárent Deum, dicéntes: Quia numquam sic vídimus.'
  "13": Et egréssus est rursus ad mare, omnísque turba veniébat ad eum, et docébat eos.
  "14": 'Et cum præteríret, vidit Levi Alphǽi sedéntem ad telónium, et ait illi: Séquere me. Et surgens secútus est eum.'
  "15": 'Et factum est, cum accúmberet in domo illíus, multi publicáni, et peccatóres simul discumbébant cum Iesu, et discípulis eius: erant enim multi, qui et sequebántur eum.'
  "16": 'Et scribæ, et Pharisǽi vidéntes quia manducáret cum publicánis, et peccatóribus, dicébant discípulis eius: Quare cum publicánis, et peccatóribus mandúcat et bibit Magíster vester?'
  "17": 'Hoc audíto Iesus ait illis: Non necésse habent sani médico, sed qui male habent: non enim veni vocáre iustos, sed peccatóres.'
  "18": 'Et erant discípuli Ioánnis, et Pharisǽi ieiunántes: et véniunt, et dicunt illi: Quare discípuli Ioánnis, et Pharisæórum ieiúnant, tui autem discípuli non ieiúnant?'
  "19": 'Et ait illis Iesus: Numquid possunt fílii nuptiárum, quámdiu sponsus cum illis est, ieiunáre? Quanto témpore habent secum sponsum, non possunt ieiunáre.'
  "20": 'Vénient autem dies cum auferétur ab eis sponsus: et tunc ieiunábunt in illis diébus.'
  "21": 'Nemo assuméntum panni rudis ássuit vestiménto véteri: alióquin aufert suppleméntum novum a véteri, et maior scissúra fit.'
  "22": 'Et nemo mittit vinum novum in utres véteres: alióquin dirúmpet vinum utres, et vinum effundétur, et utres períbunt: sed vinum novum in utres novos mitti debet.'
  "23": Et factum est íterum cum Dóminus sábbatis ambuláret per sata, et discípuli eius cœpérunt prógredi, et véllere spicas.
  "24": 'Pharisǽi autem dicébant ei: Ecce, quid fáciunt sábbatis quod non licet?'
  "25": 'Et ait illis: Numquam legístis quid fécerit David, quando necessitátem hábuit, et esúriit ipse, et qui cum eo erant?'
  "26": quómodo introívit in domum Dei sub Abíathar príncipe sacerdótum, et panes propositiónis manducávit, quos non licébat manducáre, nisi sacerdótibus, et dedit eis, qui cum eo erant?
  "27": 'Et dicébat eis: Sábbatum propter hóminem factum est, et non homo propter sábbatum.'
  "28": Itaque Dóminus est Fílius hóminis, étiam sábbati.
