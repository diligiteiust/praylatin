bible: vulgate
lang: la
language: Latina
book: Apocalypsis
chapter: "17"
verses:
  "1": 'Et venit unus de septem ángelis, qui habébant septem phíalas, et locútus est mecum, dicens: Veni, osténdam tibi damnatiónem meretrícis magnæ, quæ sedet super aquas multas,'
  "2": cum qua fornicáti sunt reges terræ, et inebriáti sunt qui inhábitant terram de vino prostitutiónis eius.
  "3": Et ábstulit me in spíritu in desértum. Et vidi mulíerem sedéntem super béstiam coccíneam, plenam nomínibus blasphémiæ, habéntem cápita septem, et córnua decem.
  "4": Et múlier erat circúmdata púrpura, et cóccino, et inauráta auro, et lápide pretióso, et margarítis, habens póculum áureum in manu sua, plenum abominatióne, et immundítia fornicatiónis eius.
  "5": 'Et in fronte eius nomen scriptum: Mystérium: Bábylon magna, mater fornicatiónum, et abominatiónum terræ.'
  "6": Et vidi mulíerem ébriam de sánguine sanctórum, et de sánguine mártyrum Iesu. Et mirátus sum cum vidíssem illam admiratióne magna.
  "7": 'Et dixit mihi ángelus: Quare miráris? ego dicam tibi sacraméntum mulíeris, et béstiæ, quæ portat eam, quæ habet cápita septem, et córnua decem.'
  "8": 'Béstia, quam vidísti, fuit, et non est, et ascensúra est de abýsso, et in intéritum ibit: et mirabúntur inhabitántes terram (quorum non sunt scripta nómina in Libro vitæ a constitutióne mundi) vidéntes béstiam, quæ erat, et non est.'
  "9": Et hic est sensus, qui habet sapiéntiam. Septem cápita, septem montes sunt, super quos múlier sedet, et reges septem sunt.
  "10": 'Quinque cecidérunt, unus est, et álius nondum venit: et cum vénerit, opórtet illum breve tempus manére.'
  "11": 'Et béstia, quæ erat, et non est: et ipsa octáva est: et de septem est, et in intéritum vadit.'
  "12": 'Et decem córnua, quæ vidísti, decem reges sunt: qui regnum nondum accepérunt, sed potestátem tamquam reges una hora accípient post béstiam.'
  "13": Hi unum consílium habent, et virtútem, et potestátem suam béstiæ tradent.
  "14": 'Hi cum Agno pugnábunt, et Agnus vincet illos: quóniam Dóminus dominórum est, et Rex regum: et qui cum illo sunt, vocáti, elécti, et fidéles.'
  "15": 'Et dixit mihi: Aquæ, quas vidísti ubi méretrix sedet, pópuli sunt, et gentes, et linguæ.'
  "16": 'Et decem córnua, quæ vidísti in béstia: hi ódient fornicáriam, et desolátam fácient illam, et nudam, et carnes eius manducábunt, et ipsam igni concremábunt.'
  "17": 'Deus enim dedit in corda eórum ut fáciant quod plácitum est illi: ut dent regnum suum béstiæ donec consumméntur verba Dei.'
  "18": Et múlier, quam vidísti, est cívitas magna, quæ habet regnum super reges terræ.
