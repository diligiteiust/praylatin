bible: vulgate
lang: la
language: Latina
book: Sophonias
chapter: "2"
verses:
  "1": 'Conveníte, congregámini gens non amábilis:'
  "2": priúsquam páriat iússio quasi púlverem transeúntem diem, ántequam véniat super vos ira furóris Dómini, ántequam véniat super vos dies indignatiónis Dómini.
  "3": 'Quǽrite Dóminum omnes mansuéti terræ, qui iudícium eius estis operáti: quǽrite iustum, quǽrite mansuétum: si quómodo abscondámini in die furóris Dómini.'
  "4": Quia Gaza destrúcta erit, et Ascalon in desértum, Azótum in merídie eícient, et Accaron eradicábitur.
  "5": 'Væ qui habitátis funículum maris, gens perditórum: verbum Dómini super vos Chánaan terra Philisthinórum, et dispérdam te, ita ut non sit inhabitátor.'
  "6": 'Et erit funículus maris réquies pastórum, et caulæ pécorum:'
  "7": 'et erit funículus eius, qui remánserit de domo Iuda: ibi pascéntur, in dómibus Ascalónis ad vésperam requiéscent: quia visitábit eos Dóminus Deus eórum, et avértet captivitátem eórum.'
  "8": 'Audívi oppróbrium Moab, et blasphémias filiórum Ammon: quæ exprobravérunt pópulo meo, et magnificáti sunt super términos eórum.'
  "9": 'Proptérea vivo ego, dicit Dóminus exercítuum Deus Israel, quia Moab ut Sódoma erit, et fílii Ammon quasi Gomórrha, síccitas spinárum, et acérvi salis, et desértum usque in ætérnum: relíquiæ pópuli mei dirípient eos, et resídui gentis meæ possidébunt illos.'
  "10": 'Hoc eis evéniet pro supérbia sua: quia blasphemavérunt, et magnificáti sunt super pópulum Dómini exercítuum.'
  "11": 'Horríbilis Dóminus super eos, et attenuábit omnes deos terræ: et adorábunt eum viri de loco suo, omnes ínsulæ géntium.'
  "12": Sed et vos Æthíopes interfécti gládio meo éritis.
  "13": 'Et exténdet manum suam super aquilónem, et perdet Assur: et ponet speciósam in solitúdinem, et in ínvium, et quasi desértum.'
  "14": 'Et accubábunt in médio eius greges, omnes béstiæ géntium: et onocrótalus, et erícius in limínibus eius morabúntur: vox cantántis in fenéstra, corvus in superliminári, quóniam attenuábo robur eius.'
  "15": 'Hæc est cívitas gloriósa hábitans in confidéntia, quæ dicébat in corde suo: Ego sum, et extra me non est ália ámplius: quómodo facta est in desértum cubíle béstiæ? omnis, qui transit per eam, sibilábit, et movébit manum suam.'
