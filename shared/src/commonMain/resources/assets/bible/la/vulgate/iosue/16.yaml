bible: vulgate
lang: la
language: Latina
book: Iosue
chapter: "16"
verses:
  "1": 'Cécidit quoque sors filiórum Ioseph ab Iordáne contra Iéricho et aquas eius ab oriénte: solitúdo quæ ascéndit de Iéricho ad montem Bethel:'
  "2": 'et egréditur de Bethel Luza: transítque términum Archi, Ataroth:'
  "3": 'et descéndit ad occidéntem iuxta términum Iephléti, usque ad términos Béthoron inferióris, et Gazer: finiuntúrque regiónes eius mari magno:'
  "4": possederúntque fílii Ioseph Manásses et Ephraim.
  "5": 'Et factus est términus filiórum Ephraim per cognatiónes suas: et posséssio eórum contra oriéntem Ataroth Addar usque Béthoron superiórem.'
  "6": 'Egrediuntúrque confínia in mare: Máchmethath vero aquilónem réspicit, et círcuit términos contra oriéntem in Thanáthselo: et pertránsit ab oriénte Iánoe.'
  "7": 'Descendítque de Iánoe in Ataroth et Naarátha: et pérvenit in Iéricho, egreditúrque ad Iordánem.'
  "8": De Táphua pertránsit contra mare in Vallem arundinéti, suntque egréssus eius in mare salsíssimum. Hæc est posséssio tribus filiórum Ephraim per famílias suas.
  "9": Urbésque separátæ sunt fíliis Ephraim in médio possessiónis filiórum Manásse, et villæ eárum.
  "10": 'Et non interfecérunt fílii Ephraim Chananǽum, qui habitábat in Gazer: habitavítque Chananǽus in médio Ephraim usque in diem hanc tributárius.'
