bible: vulgate
lang: la
language: Latina
book: Zacharias
chapter: "3"
verses:
  "1": 'Et osténdit mihi Dóminus Iesum sacerdótem magnum, stantem coram ángelo Dómini: et Satan stabat a dextris eius ut adversarétur ei.'
  "2": 'Et dixit Dóminus ad Satan: Increpet Dóminus in te, Satan: et íncrepet Dóminus in te, qui elégit Ierúsalem: numquid non iste torris est érutus de igne?'
  "3": Et Iesus erat indútus véstibus sórdidis, et stabat ante fáciem ángeli.
  "4": 'Qui respóndit, et ait ad eos, qui stabant coram se, dicens: Auférte vestiménta sórdida ab eo. Et dixit ad eum: Ecce ábstuli a te iniquitátem tuam, et índui te mutatóriis.'
  "5": 'Et dixit: Pónite cídarim mundam super caput eius. Et posuérunt cídarim mundam super caput eius, et induérunt eum véstibus: et ángelus Dómini stabat.'
  "6": 'Et contestabátur ángelus Dómini Iesum, dicens:'
  "7": 'Hæc dicit Dóminus exercítuum: Si in viis meis ambuláveris, et custódiam meam custodíeris: tu quoque iudicábis domum meam, et custódies átria mea, et dabo tibi ambulántes de his, qui nunc hic assístunt.'
  "8": 'Audi Iesu sacérdos magne, tu et amíci tui, qui hábitant coram te, quia viri portendéntes sunt: ecce enim ego addúcam servum meum Oriéntem.'
  "9": 'Quia ecce lapis, quem dedi coram Iesu: super lápidem unum septem óculi sunt: ecce ego cælábo sculptúram eius, ait Dóminus exercítuum: et áuferam iniquitátem terræ illíus in die una.'
  "10": In die illa, dicit Dóminus exercítuum, vocábit vir amícum suum subter vitem, et subter ficum.
