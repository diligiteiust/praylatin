bible: vulgate
lang: la
language: Latina
book: II Samuelis
chapter: "3"
verses:
  "1": 'Facta est ergo longa concertátio inter domum Saul, et inter domum David: David proficíscens, et semper seípso robústior, domus autem Saul decréscens quotídie.'
  "2": 'Natíque sunt fílii David in Hebron: fuítque primogénitus eius Amnon, de Achínoam Iezraelítide.'
  "3": 'Et post eum Chéleab, de Abígail uxóre Nabal Carméli: porro tértius Absalom, fílius Máacha fíliæ Thólmai regis Gessur.'
  "4": 'Quartus autem Adonías, fílius Haggith: et quintus Saphathía, fílius Abital.'
  "5": 'Sextus quoque Iéthraam, de Egla uxóre David: hi nati sunt David in Hebron.'
  "6": Cum ergo esset prœ́lium inter domum Saul et domum David, Abner fílius Ner regébat domum Saul.
  "7": 'Fúerat autem Sauli concubína nómine Respha, fília Aia. Dixítque Isboseth ad Abner:'
  "8": 'Quare ingréssus es ad concubínam patris mei? Qui irátus nimis propter verba Isboseth, ait: Numquid caput canis ego sum advérsum Iudam hódie, qui fécerim misericórdiam super domum Saul patris tui, et super fratres et próximos eius, et non trádidi te in manus David, et tu requisísti in me quod argúeres pro mulíere hódie?'
  "9": Hæc fáciat Deus Abner, et hæc addat ei, nisi quómodo iurávit Dóminus David, sic fáciam cum eo,
  "10": ut transferátur regnum de domo Saul, et elevétur thronus David super Israel et super Iudam, a Dan usque Bersabée.
  "11": Et non pótuit respondére ei quidquam, quia metuébat illum.
  "12": 'Misit ergo Abner núntios ad David pro se dicéntes: Cuius est terra? et ut loqueréntur: Fac mecum amicítias, et erit manus mea tecum, et redúcam ad te univérsum Israel.'
  "13": 'Qui ait: Optime: ego fáciam tecum amicítias: sed unam rem peto a te, dicens: Non vidébis fáciem meam ántequam addúxeris Michol fíliam Saul: et sic vénies, et vidébis me.'
  "14": 'Misit autem David núntios ad Isboseth fílium Saul, dicens: Redde uxórem meam Michol, quam despóndi mihi centum præpútiis Philísthiim.'
  "15": Misit ergo Isboseth, et tulit eam a viro suo Pháltiel fílio Lais.
  "16": 'Sequebatúrque eam vir suus, plorans usque Bahúrim: et dixit ad eum Abner: Vade, et revértere. Qui revérsus est.'
  "17": 'Sermónem quoque íntulit Abner ad senióres Israel, dicens: Tam heri quam nudiustértius quærebátis David ut regnáret super vos.'
  "18": 'Nunc ergo fácite: quóniam Dóminus locútus est ad David, dicens: In manu servi mei David salvábo pópulum meum Israel de manu Philísthiim, et ómnium inimicórum eius.'
  "19": Locútus est autem Abner étiam ad Béniamin. Et ábiit ut loquerétur ad David in Hebron ómnia quæ placúerant Israéli, et univérso Béniamin.
  "20": 'Venítque ad David in Hebron cum vigínti viris: et fecit David Abner, et viris eius qui vénerant cum eo, convívium.'
  "21": 'Et dixit Abner ad David: Surgam, ut cóngregem ad te dóminum meum regem omnem Israel, et íneam tecum fœdus, et ímperes ómnibus, sicut desíderat ánima tua. Cum ergo deduxísset David Abner, et ille isset in pace,'
  "22": 'statim púeri David et Ioab venérunt, cæsis latrónibus, cum præda magna nimis: Abner autem non erat cum David in Hebron, quia iam dimíserat eum, et proféctus fúerat in pace.'
  "23": 'Et Ioab, et omnis exércitus, qui erat cum eo, póstea venérunt: nuntiátum est ítaque Ioab a narrántibus: Venit Abner fílius Ner ad regem, et dimísit eum, et ábiit in pace.'
  "24": 'Et ingréssus est Ioab ad regem, et ait: Quid fecísti? Ecce venit Abner ad te: quare dimisísti eum, et ábiit et recéssit?'
  "25": Ignóras Abner fílium Ner, quóniam ad hoc venit ad te ut decíperet te, et sciret éxitum tuum, et intróitum tuum, et nosset ómnia quæ agis?
  "26": Egréssus ítaque Ioab a David, misit núntios post Abner, et redúxit eum a cistérna Sira, ignoránte David.
  "27": 'Cumque rediísset Abner in Hebron, seórsum addúxit eum Ioab ad médium portæ ut loquerétur ei, in dolo: et percússit illum ibi in ínguine, et mórtuus est in ultiónem sánguinis Asael fratris eius.'
  "28": 'Quod cum audísset David rem iam gestam, ait: Mundus ego sum, et regnum meum apud Dóminum usque in sempitérnum, a sánguine Abner fílii Ner:'
  "29": 'et véniat super caput Ioab, et super omnem domum patris eius: nec defíciat de domo Ioab fluxum séminis sústinens, et leprósus, et tenens fusum, et cadens gládio, et índigens pane.'
  "30": Igitur Ioab et Abísai frater eius interfecérunt Abner, eo quod occidísset Asael fratrem eórum in Gábaon in prœ́lio.
  "31": 'Dixit autem David ad Ioab, et ad omnem pópulum, qui erat cum eo: Scíndite vestiménta vestra, et accingímini saccis, et plángite ante exséquias Abner: porro rex David sequebátur féretrum.'
  "32": 'Cumque sepelíssent Abner in Hebron, levávit rex David vocem suam, et flevit super túmulum Abner: flevit autem et omnis pópulus.'
  "33": 'Plangénsque rex, et lugens Abner, ait: Nequáquam ut mori solent ignávi, mórtuus est Abner.'
  "34": 'Manus tuæ ligátæ non sunt, et pedes tui non sunt compédibus aggraváti: sed sicut solent cádere coram fíliis iniquitátis, sic corruísti. Congeminánsque omnis pópulus flevit super eum.'
  "35": 'Cumque venísset univérsa multitúdo cibum cápere cum David, clara adhuc die iurávit David, dicens: Hæc fáciat mihi Deus, et hæc addat, si ante occásum solis gustávero panem vel áliud quidquam.'
  "36": Omnísque pópulus audívit, et placuérunt eis cuncta quæ fecit rex in conspéctu totíus pópuli.
  "37": Et cognóvit omne vulgus et univérsus Israel in die illa, quóniam non actum fuísset a rege ut occiderétur Abner fílius Ner.
  "38": 'Dixit quoque rex ad servos suos: Num ignorátis quóniam princeps et máximus cécidit hódie in Israel?'
  "39": 'Ego autem adhuc delicátus, et unctus rex: porro viri isti fílii Sárviæ duri sunt mihi: retríbuat Dóminus faciénti malum iuxta malítiam suam.'
