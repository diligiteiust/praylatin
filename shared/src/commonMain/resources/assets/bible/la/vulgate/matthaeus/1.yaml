bible: vulgate
lang: la
language: Latina
book: Matthaeus
chapter: "1"
verses:
  "1": Liber generatiónis Iesu Christi fílii David, fílii Abraham.
  "2": Abraham génuit Isaac. Isaac autem génuit Iacob. Iacob autem génuit Iudam, et fratres eius.
  "3": Iudas autem génuit Phares, et Zaram de Thamar. Phares autem génuit Esron. Esron autem génuit Aram.
  "4": Aram autem génuit Amínadab. Amínadab autem génuit Naásson. Naásson autem génuit Salmon.
  "5": Salmon autem génuit Booz de Rahab. Booz autem génuit Obed ex Ruth. Obed autem génuit Iesse. Iesse autem génuit David regem.
  "6": David autem rex génuit Salomónem ex ea, quæ fuit Uríæ.
  "7": Sálomon autem génuit Róboam. Róboam autem génuit Abíam. Abías autem génuit Asa.
  "8": Asa autem génuit Iósaphat. Iósaphat autem génuit Ioram. Ioram autem génuit Ozíam.
  "9": Ozías autem génuit Ióatham. Ióatham autem génuit Achaz. Achaz autem génuit Ezechíam.
  "10": Ezechías autem génuit Manássen. Manásses autem génuit Amon. Amon autem génuit Iosíam.
  "11": Iosías autem génuit Iechoníam, et fratres eius in transmigratióne Babylónis.
  "12": 'Et post transmigratiónem Babylónis: Iechonías génuit Saláthiel. Saláthiel autem génuit Zoróbabel.'
  "13": Zoróbabel autem génuit Abiud. Abiud autem génuit Elíacim. Elíacim autem génuit Azor.
  "14": Azor autem génuit Sadoc. Sadoc autem génuit Achim. Achim autem génuit Eliud.
  "15": Eliud autem génuit Eleázar. Eleázar autem génuit Mathan. Mathan autem génuit Iacob.
  "16": Iacob autem génuit Ioseph virum Maríæ, de qua natus est Iesus, qui vocátur Christus.
  "17": 'Omnes ítaque generatiónes ab Abraham usque ad David, generatiónes quatuórdecim: et a David usque ad transmigratiónem Babylónis, generatiónes quatuórdecim: et a transmigratióne Babylónis usque ad Christum, generatiónes quatuórdecim.'
  "18": 'Christi autem generátio sic erat: cum esset desponsáta mater eius María Ioseph, ántequam convenírent, invénta est in útero habens de Spíritu sancto.'
  "19": Ioseph autem vir eius cum esset iustus, et nollet eam tradúcere, vóluit occúlte dimíttere eam.
  "20": 'Hæc autem eo cogitánte, ecce ángelus Dómini appáruit in somnis ei, dicens: Ioseph fili David, noli timére accípere Maríam cóniugem tuam: quod enim in ea natum est, de Spíritu sancto est.'
  "21": 'Páriet autem fílium: et vocábis nomen eius Iesum: ipse enim salvum fáciet pópulum suum a peccátis eórum.'
  "22": 'Hoc autem totum factum est, ut adimplerétur quod dictum est a Dómino per prophétam dicéntem:'
  "23": 'Ecce virgo in útero habébit, et páriet fílium: et vocábunt nomen eius Emmánuel, quod est interpretátum Nobíscum Deus.'
  "24": Exsúrgens autem Ioseph a somno, fecit sicut præcépit ei ángelus Dómini, et accépit cóniugem suam.
  "25": 'Et non cognoscébat eam donec péperit fílium suum primogénitum: et vocávit nomen eius Iesum.'
