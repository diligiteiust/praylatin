bible: vulgate
lang: la
language: Latina
book: ad Hebraeos
chapter: "8"
verses:
  "1": 'Capítulum autem super ea, quæ dicúntur: Talem habémus pontíficem, qui consédit in déxtera sedis magnitúdinis in cælis,'
  "2": sanctórum miníster, et tabernáculi veri, quod fixit Dóminus, et non homo.
  "3": 'Omnis enim póntifex ad offeréndum múnera, et hóstias constitúitur: unde necésse est et hunc habére áliquid, quod ófferat.'
  "4": 'Si ergo esset super terram, nec esset sacérdos: cum essent qui ófferent secúndum legem múnera,'
  "5": 'qui exemplári, et umbræ desérviunt cæléstium. Sicut respónsum est Móysi, cum consummáret tabernáculum: Vide (inquit) ómnia fácito secúndum exémplar, quod tibi osténsum est in monte.'
  "6": Nunc autem mélius sortítus est ministérium, quanto et melióris testaménti mediátor est, quod in melióribus repromissiónibus sancítum est.
  "7": Nam si illud prius culpa vacásset, non útique secúndi locus inquirerétur.
  "8": 'Vitúperans enim eos dicit: Ecce dies vénient, dicit Dóminus: et consummábo super domum Israel, et super domum Iuda, testaméntum novum,'
  "9": 'non secúndum testaméntum, quod feci pátribus eórum in die, qua apprehéndi manum eórum ut edúcerem illos de terra Ægýpti: quóniam ipsi non permansérunt in testaménto meo: et ego negléxi eos, dicit Dóminus.'
  "10": 'Quia hoc est testaméntum, quod dispónam dómui Israel post dies illos, dicit Dóminus: dando leges meas in mentem eórum, et in corde eórum superscríbam eas: et ero eis in Deum, et ipsi erunt mihi in pópulum:'
  "11": 'et non docébit unusquísque próximum suum, et unusquísque fratrem suum, dicens: Cognósce Dóminum: quóniam omnes scient me a minóre usque ad maiórem eórum:'
  "12": quia propítius ero iniquitátibus eórum, et peccatórum eórum iam non memorábor.
  "13": 'Dicéndo autem novum: veterávit prius. Quod autem antiquátur, et senéscit, prope intéritum est.'
