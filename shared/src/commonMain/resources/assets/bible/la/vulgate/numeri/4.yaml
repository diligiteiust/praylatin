bible: vulgate
lang: la
language: Latina
book: Numeri
chapter: "4"
verses:
  "1": 'Locutúsque est Dóminus ad Móysen et Aaron, dicens:'
  "2": Tolle summam filiórum Caath de médio Levitárum per domos et famílias suas,
  "3": a trigésimo anno et supra, usque ad quinquagésimum annum, ómnium qui ingrediúntur ut stent et minístrent in tabernáculo fœ́deris.
  "4": 'Hic est cultus filiórum Caath: tabernáculum fœ́deris, et Sanctum sanctórum'
  "5": ingrediéntur Aaron et fílii eius, quando movénda sunt castra, et depónent velum quod pendet ante fores, involvéntque eo arcam testimónii,
  "6": et opérient rursum velámine ianthinárum péllium, extendéntque désuper pállium totum hyacínthinum, et indúcent vectes.
  "7": 'Mensam quoque propositiónis invólvent hyacínthino pállio, et ponent cum ea thuríbula et mortaríola, cýathos et cratéras ad liba fundénda: panes semper in ea erunt:'
  "8": extendéntque désuper pállium coccíneum, quod rursum opérient velaménto ianthinárum péllium, et indúcent vectes.
  "9": 'Sument et pállium hyacínthinum, quo opérient candelábrum cum lucérnis et forcípibus suis et emunctóriis et cunctis vasis ólei, quæ ad concinnándas lucérnas necessária sunt:'
  "10": et super ómnia ponent operiméntum ianthinárum péllium, et indúcent vectes.
  "11": Necnon et altáre áureum invólvent hyacínthino vestiménto, et exténdent désuper operiméntum ianthinárum péllium, inducéntque vectes.
  "12": Omnia vasa, quibus ministrátur in sanctuário, invólvent hyacínthino pállio, et exténdent désuper operiméntum ianthinárum péllium, inducéntque vectes.
  "13": Sed et altáre mundábunt cínere, et invólvent illud purpúreo vestiménto,
  "14": ponéntque cum eo ómnia vasa, quibus in ministério eius utúntur, id est, ígnium receptácula, fuscínulas ac tridéntes, uncínos et batílla. Cuncta vasa altáris opérient simul velámine ianthinárum péllium, et indúcent vectes.
  "15": 'Cumque invólverint Aaron et fílii eius sanctuárium et ómnia vasa eius in commotióne castrórum, tunc intrábunt fílii Caath ut portent involúta: et non tangent vasa sanctuárii, ne moriántur. Ista sunt ónera filiórum Caath in tabernáculo fœ́deris:'
  "16": super quos erit Eleázar fílius Aaron sacerdótis, ad cuius curam pértinet óleum ad concinnándas lucérnas, et compositiónis incénsum, et sacrifícium, quod semper offértur, et óleum unctiónis, et quidquid ad cultum tabernáculi pértinet, omniúmque vasórum, quæ in sanctuário sunt.
  "17": 'Locutúsque est Dóminus ad Móysen et Aaron, dicens:'
  "18": 'Nolíte pérdere pópulum Caath de médio Levitárum:'
  "19": sed hoc fácite eis, ut vivant, et non moriántur, si tetígerint Sancta sanctórum. Aaron et fílii eius intrábunt, ipsíque dispónent ópera singulórum, et dívident quid portáre quis débeat.
  "20": Alii nulla curiositáte vídeant quæ sunt in sanctuário priúsquam involvántur, alióquin moriéntur.
  "21": 'Locutúsque est Dóminus ad Móysen, dicens:'
  "22": Tolle summam étiam filiórum Gerson per domos ac famílias et cognatiónes suas,
  "23": a trigínta annis et supra, usque ad annos quinquagínta. Númera omnes qui ingrediúntur et minístrant in tabernáculo fœ́deris.
  "24": Hoc est offícium famíliæ Gersonitárum,
  "25": ut portent cortínas tabernáculi et tectum fœ́deris, operiméntum áliud, et super ómnia velámen iánthinum tentoriúmque quod pendet in intróitu tabernáculi fœ́deris,
  "26": cortínas átrii, et velum in intróitu quod est ante tabernáculum. Omnia quæ ad altáre pértinent, funículos, et vasa ministérii,
  "27": 'iubénte Aaron et fíliis eius, portábunt fílii Gerson: et scient sínguli cui débeant óneri mancipári.'
  "28": Hic est cultus famíliæ Gersonitárum in tabernáculo fœ́deris, erúntque sub manu Ithamar fílii Aaron sacerdótis.
  "29": Fílios quoque Merári per famílias et domos patrum suórum recensébis,
  "30": a trigínta annis et supra, usque ad annos quinquagínta, omnes qui ingrediúntur ad offícium ministérii sui et cultum fœ́deris testimónii.
  "31": 'Hæc sunt ónera eórum: portábunt tábulas tabernáculi et vectes eius, colúmnas ac bases eárum,'
  "32": colúmnas quoque átrii per circúitum cum básibus et paxíllis et fúnibus suis. Omnia vasa et supelléctilem ad númerum accípient, sicque portábunt.
  "33": 'Hoc est offícium famíliæ Meraritárum et ministérium in tabernáculo fœ́deris: erúntque sub manu Ithamar fílii Aaron sacerdótis.'
  "34": Recensuérunt ígitur Móyses et Aaron et príncipes synagógæ fílios Caath per cognatiónes et domos patrum suórum,
  "35": 'a trigínta annis et supra, usque ad annum quinquagésimum, omnes qui ingrediúntur ad ministérium tabernáculi fœ́deris:'
  "36": et invénti sunt duo míllia septingénti quinquagínta.
  "37": 'Hic est númerus pópuli Caath qui intrant tabernáculum fœ́deris: hos numerávit Móyses et Aaron iuxta sermónem Dómini per manum Móysi.'
  "38": Numeráti sunt et fílii Gerson per cognatiónes et domos patrum suórum,
  "39": 'a trigínta annis et supra, usque ad quinquagésimum annum, omnes qui ingrediúntur ut minístrent in tabernáculo fœ́deris:'
  "40": et invénti sunt duo míllia sexcénti trigínta.
  "41": Hic est pópulus Gersonitárum, quos numeravérunt Móyses et Aaron iuxta verbum Dómini.
  "42": Numeráti sunt et fílii Merári per cognatiónes et domos patrum suórum,
  "43": 'a trigínta annis et supra, usque ad annum quinquagésimum, omnes qui ingrediúntur ad expléndos ritus tabernáculi fœ́deris:'
  "44": et invénti sunt tria míllia ducénti.
  "45": Hic est númerus filiórum Merári, quos recensuérunt Móyses et Aaron iuxta impérium Dómini per manum Móysi.
  "46": Omnes qui recensíti sunt de Levítis, et quos recenséri fecit ad nomen Móyses et Aaron, et príncipes Israel per cognatiónes et domos patrum suórum,
  "47": a trigínta annis et supra, usque ad annum quinquagésimum, ingrediéntes ad ministérium tabernáculi, et ónera portánda,
  "48": fuérunt simul octo míllia quingénti octogínta.
  "49": Iuxta verbum Dómini recénsuit eos Móyses, unumquémque iuxta offícium et ónera sua, sicut præcéperat ei Dóminus.
