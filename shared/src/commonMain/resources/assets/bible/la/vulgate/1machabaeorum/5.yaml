bible: vulgate
lang: la
language: Latina
book: I Machabaeorum
chapter: "5"
verses:
  "1": 'Et factum est, ut audiérunt gentes in circúitu quia ædificátum est altáre, et sanctuárium sicut prius, irátæ sunt valde:'
  "2": et cogitábant tóllere genus Iacob, qui erant inter eos, et cœpérunt occídere de pópulo, et pérsequi.
  "3": Et debellábat Iudas fílios Esau in Idumǽa, et eos, qui erant in Acrabatháne, quia circumsedébant Israelítas, et percússit eos plaga magna.
  "4": Et recordátus est malítiam filiórum Bean, qui erant pópulo in láqueum, et in scándalum, insidiántes ei in via.
  "5": Et conclúsi sunt ab eo in túrribus, et applícuit ad eos, et anathematizávit eos, et incéndit turres eórum igni cum ómnibus, qui in eis erant.
  "6": 'Et transívit ad fílios Ammon, et invénit manum fortem, et pópulum copiósum, et Timótheum ducem ipsórum:'
  "7": 'et commísit cum eis prœ́lia multa, et contríti sunt in conspéctu eórum, et percússit eos:'
  "8": et cepit Gazer civitátem, et fílias eius, et revérsus est in Iudǽam.
  "9": 'Et congregátæ sunt gentes, quæ sunt in Gálaad advérsus Israelítas, qui erant in fínibus eórum, ut tóllerent eos: et fugérunt in Dátheman munitiónem.'
  "10": 'Et misérunt lítteras ad Iudam, et fratres eius, dicéntes: Congregátæ sunt advérsum nos gentes per circúitum, ut nos áuferant:'
  "11": 'et parant veníre, et occupáre munitiónem, in quam confúgimus: et Timótheus est dux exércitus eórum.'
  "12": Nunc ergo veni, et éripe nos de mánibus eórum, quia cécidit multitúdo de nobis.
  "13": 'Et omnes fratres nostri, qui erant in locis Tubin, interfécti sunt: et captívas duxérunt uxóres eórum, et natos, et spólia, et peremérunt illic fere mille viros.'
  "14": 'Et adhuc epístolæ legebántur, et ecce álii núntii venérunt de Galilǽa conscíssis túnicis, nuntiántes secúndum verba hæc:'
  "15": 'dicéntes convenísse advérsum se a Ptolemáida, et Tyro, et Sidóne: et repléta est omnis Galilǽa alienígenis, ut nos consúmant.'
  "16": Ut audívit autem Iudas, et pópulus, sermónes istos, convénit ecclésia magna cogitáre quid fácerent frátribus suis, qui in tribulatióne erant, et expugnabántur ab eis.
  "17": 'Dixítque Iudas Simóni fratri suo: Elige tibi viros, et vade, et líbera fratres tuos in Galilǽa: ego autem, et frater meus Iónathas íbimus in Galaadítim.'
  "18": 'Et relíquit Ioséphum fílium Zacharíæ, et Azaríam, duces pópuli, cum resíduo exércitu in Iudǽa ad custódiam:'
  "19": 'et præcépit illis, dicens: Præestóte pópulo huic: et nolíte bellum commíttere advérsum gentes, donec revertámur.'
  "20": 'Et partíti sunt Simóni viri tria míllia, ut iret in Galilǽam: Iudæ autem octo míllia in Galaadítim.'
  "21": 'Et ábiit Simon in Galilǽam, et commísit prœ́lia multa cum géntibus: et contrítæ sunt gentes a fácie eius, et persecútus est eos usque ad portam'
  "22": 'Ptolemáidis: et cecidérunt de géntibus fere tria míllia virórum: et accépit spólia eórum,'
  "23": et assúmpsit eos, qui erant in Galilǽa, et in Arbatis, cum uxóribus, et natis, et ómnibus quæ erant illis, et addúxit in Iudǽam cum lætítia magna.
  "24": Et Iudas Machabǽus, et Iónathas frater eius, transiérunt Iordánem, et abiérunt viam trium diérum per desértum.
  "25": Et occurrérunt eis Nabuthǽi, et suscepérunt eos pacífice, et narravérunt eis ómnia, quæ accíderant frátribus eórum in Galaadítide,
  "26": 'et quia multi ex eis comprehénsi sunt in Bárasa, et Bosor, et in Alimis, et in Casphor, et Mageth, et Cárnaim: hæ omnes civitátes munítæ, et magnæ.'
  "27": Sed et in céteris civitátibus Galaadítidis tenéntur comprehénsi, et in crástinum constituérunt admovére exércitum civitátibus his, et comprehéndere, et tóllere eos in una die.
  "28": 'Et convértit Iudas, et exércitus eius, viam in desértum Bosor repénte, et occupávit civitátem: et occídit omnem másculum in ore gládii, et accépit ómnia spólia eórum, et succéndit eam igni.'
  "29": Et surrexérunt inde nocte, et ibant usque ad munitiónem.
  "30": Et factum est dilúculo, cum elevássent óculos suos, ecce pópulus multus, cuius non erat númerus, portántes scalas, et máchinas ut comprehénderent munitiónem, et expugnárent eos.
  "31": 'Et vidit Iudas quia cœpit bellum, et clamor belli ascéndit ad cælum sicut tuba, et clamor magnus de civitáte:'
  "32": 'et dixit exercítui suo: Pugnáte hódie pro frátribus vestris.'
  "33": Et venit tribus ordínibus post eos, et exclamavérunt tubis, et clamavérunt in oratióne.
  "34": 'Et cognovérunt castra Timóthei quia Machabǽus est, et refugérunt a fácie eius: et percussérunt eos plaga magna: et cecidérunt ex eis in die illa fere octo míllia virórum.'
  "35": 'Et divértit Iudas in Maspha, et expugnávit, et cepit eam: et occídit omnem másculum eius, et sumpsit spólia eius, et succéndit eam igni.'
  "36": Inde perréxit, et cepit Casbon, et Mageth, et Bosor, et réliquas civitátes Galaadítidis.
  "37": Post hæc autem verba congregávit Timótheus exércitum álium, et castra pósuit contra Raphon trans torréntem.
  "38": 'Et misit Iudas speculári exércitum: et renuntiavérunt ei, dicéntes: Quia convenérunt ad eum omnes gentes, quæ in circúitu nostro sunt, exércitus multus nimis:'
  "39": et Arabas conduxérunt in auxílium sibi, et castra posuérunt trans torréntem, paráti ad te veníre in prœ́lium. Et ábiit Iudas óbviam illis.
  "40": 'Et ait Timótheus princípibus exércitus sui: Cum appropinquáverit Iudas, et exércitus eius ad torréntem aquæ: si transíerit ad nos prior, non potérimus sustinére eum, quia potens póterit advérsum nos:'
  "41": si vero timúerit transíre, et posúerit castra extra flumen, transfretámus ad eos, et potérimus advérsus illum.
  "42": 'Ut autem appropinquávit Iudas ad torréntem aquæ, státuit scribas pópuli secus torréntem, et mandávit eis, dicens: Néminem hóminum reliquéritis, sed véniant omnes in prœ́lium.'
  "43": Et transfretávit ad illos prior, et omnis pópulus post eum, et contrítæ sunt omnes gentes a fácie eórum, et proiecérunt arma sua, et fugérunt ad fanum, quod erat in Cárnaim.
  "44": 'Et occupávit ipsam civitátem, et fanum succéndit igni cum ómnibus, qui erant in ipso: et oppréssa est Cárnaim, et non pótuit sustinére contra fáciem Iudæ.'
  "45": Et congregávit Iudas univérsos Israelítas, qui erant in Galaadítide, a mínimo usque ad máximum, et uxóres eórum, et natos, et exércitum magnum valde, ut venírent in terram Iuda.
  "46": 'Et venérunt usque Ephron: et hæc cívitas magna in ingréssu pósita, muníta valde, et non erat declináre ab ea déxtera vel sinístra, sed per médiam iter erat.'
  "47": 'Et inclusérunt se qui erant in civitáte, et obstruxérunt portas lapídibus: et misit ad eos Iudas verbis pacíficis,'
  "48": 'dicens: Transeámus per terram vestram, ut eámus in terram nostram: et nemo vobis nocébit: tantum pédibus transíbimus. Et nolébant eis aperíre.'
  "49": 'Et præcépit Iudas prædicáre in castris, ut applicárent unusquísque in quo erat loco:'
  "50": 'et applicuérunt se viri virtútis: et oppugnávit civitátem illam tota die, et tota nocte, et trádita est cívitas in manu eius:'
  "51": et peremérunt omnem másculum in ore gládii, et eradicávit eam, et accépit spólia eius, et transívit per totam civitátem super interféctos.
  "52": Et transgréssi sunt Iordánem in campo magno, contra fáciem Bethsan.
  "53": 'Et erat Iudas cóngregans extrémos, et exhortabátur pópulum per totam viam, donec venírent in terram Iuda:'
  "54": et ascendérunt in montem Sion cum lætítia, et gáudio, et obtulérunt holocáusta, quod nemo ex eis cecidísset donec reverteréntur in pace.
  "55": Et in diébus, quibus erat Iudas, et Iónathas in terra Gálaad, et Simon frater eius in Galilǽa contra fáciem Ptolemáidis,
  "56": audívit Ioséphus Zacharíæ fílius, et Azarías princeps virtútis, res bene gestas, et prœ́lia quæ facta sunt,
  "57": 'et dixit: Faciámus et ipsi nobis nomen, et eámus pugnáre advérsus gentes, quæ in circúitu nostro sunt.'
  "58": Et præcépit his, qui erant in exércitu suo, et abiérunt Iámniam.
  "59": Et exívit Górgias de civitáte, et viri eius óbviam illis in pugnam.
  "60": 'Et fugáti sunt Ioséphus, et Azarías usque in fines Iudǽæ: et cecidérunt illo die de pópulo Israel ad duo míllia viri, et facta est fuga magna in pópulo:'
  "61": quia non audiérunt Iudam, et fratres eius, existimántes fórtiter se factúros.
  "62": Ipsi autem non erant de sémine virórum illórum, per quos salus facta est in Israel.
  "63": Et viri Iuda magnificáti sunt valde in conspéctu omnis Israel, et géntium ómnium ubi audiebátur nomen eórum.
  "64": Et convenérunt ad eos fausta acclamántes.
  "65": 'Et exívit Iudas, et fratres eius, et expugnábant fílios Esau in terra, quæ ad austrum est, et percússit Chebron et fílias eius: et muros eius, et turres succéndit igni in circúitu.'
  "66": Et movit castra ut iret in terram alienigenárum, et perambulábat Samaríam.
  "67": In die illa cecidérunt sacerdótes in bello, dum volunt fórtiter fácere, dum sine consílio éxeunt in prœ́lium.
  "68": 'Et declinávit Iudas in Azótum in terram alienigenárum, et díruit aras eórum, et sculptília deórum ipsórum succéndit igni: et cepit spólia civitátum, et revérsus est in terram Iuda.'
