bible: vulgate
lang: la
language: Latina
book: Nehemiae
chapter: "7"
verses:
  "1": 'Postquam autem ædificátus est murus, et pósui valvas, et recénsui ianitóres, et cantóres, et Levítas:'
  "2": præcépi Hánani fratri meo, et Hananíæ príncipi domus de Ierúsalem (ipse enim quasi vir verax et timens Deum plus céteris videbátur),
  "3": 'et dixi eis: Non aperiántur portæ Ierúsalem usque ad calórem solis. Cumque adhuc assísterent, clausæ portæ sunt, et oppilátæ: et pósui custódes de habitatóribus Ierúsalem, síngulos per vices suas, et unumquémque contra domum suam.'
  "4": Cívitas autem erat lata nimis et grandis, et pópulus parvus in médio eius, et non erant domus ædificátæ.
  "5": 'Deus autem dedit in corde meo, et congregávi optimátes, et magistrátus, et vulgus, ut recensérem eos: et invéni librum census eórum, qui ascénderant primum, et invéntum est scriptum in eo.'
  "6": Isti fílii provínciæ, qui ascendérunt de captivitáte migrántium, quos transtúlerat Nabuchodónosor rex Babylónis, et revérsi sunt in Ierúsalem, et in Iudǽam, unusquísque in civitátem suam.
  "7": 'Qui venérunt cum Zoróbabel, Iósue, Nehemías, Azarías, Raamías, Nahamáni, Mardochǽus, Belsam, Méspharath, Begóai, Nahum, Báana. Númerus virórum pópuli Israel:'
  "8": 'fílii Pharos, duo míllia centum septuagínta duo:'
  "9": 'fílii Saphatía, trecénti septuagínta duo:'
  "10": 'fílii Area, sexcénti quinquagínta duo:'
  "11": 'fílii Phaháthmoab filiórum Iósue et Ioab, duo míllia octingénti decem et octo:'
  "12": 'fílii Ælam, mille ducénti quinquagínta quátuor:'
  "13": 'fílii Zéthua, octingénti quadragínta quinque:'
  "14": 'fílii Záchai, septingénti sexagínta:'
  "15": 'fílii Bánnui, sexcénti quadragínta octo:'
  "16": 'fílii Bébai, sexcénti vigínti octo:'
  "17": 'fílii Azgad, duo míllia trecénti vigínti duo:'
  "18": 'fílii Adónicam, sexcénti sexagínta septem:'
  "19": 'fílii Begúai, duo míllia sexagínta septem:'
  "20": 'fílii Adin, sexcénti quinquagínta quinque:'
  "21": 'fílii Ater, fílii Hezecíæ, nonagínta octo:'
  "22": 'fílii Hasem, trecénti vigínti octo:'
  "23": 'fílii Bésai, trecénti vigínti quátuor:'
  "24": 'fílii Hareph, centum duódecim:'
  "25": 'fílii Gábaon, nonagínta quinque:'
  "26": fílii Béthlehem, et Netúpha, centum octogínta octo.
  "27": Viri Anathoth, centum vigínti octo.
  "28": Viri Betházmoth, quadragínta duo.
  "29": Viri Cariathíarim, Cephíra, et Beroth, septingénti quadragínta tres.
  "30": Viri Rama et Geba, sexcénti vigínti unus.
  "31": Viri Machmas, centum vigínti duo.
  "32": Viri Bethel et Hai, centum vigínti tres.
  "33": Viri Nebo altérius, quinquagínta duo.
  "34": Viri Ælam altérius, mille ducénti quinquagínta quátuor.
  "35": Fílii Harem, trecénti vigínti.
  "36": Fílii Iéricho, trecénti quadragínta quinque.
  "37": Fílii Lod Hadid et Ono, septingénti vigínti unus.
  "38": Fílii Sénaa, tria míllia nongénti trigínta.
  "39": 'Sacerdótes: Fílii Idaía in domo Iósue, nongénti septuagínta tres.'
  "40": Fílii Emmer, mille quinquagínta duo.
  "41": Fílii Phashur, mille ducénti quadragínta septem.
  "42": 'Fílii Arem, mille decem et septem. Levítæ:'
  "43": fílii Iósue et Cédmihel filiórum
  "44": 'Oduíæ, septuagínta quátuor. Cantóres:'
  "45": fílii Asaph, centum quadragínta octo.
  "46": 'Ianitóres: fílii Sellum, fílii Ater, fílii Telmon, fílii Accub, fílii Hátita, fílii Sóbai: centum trigínta octo.'
  "47": 'Nathinǽi: fílii Soha, fílii Hasúpha, fílii Tébbaoth,'
  "48": fílii Ceros, fílii Síaa, fílii Phadon, fílii Lébana, fílii Hágaba, fílii Sélmai,
  "49": fílii Hanan, fílii Geddel, fílii Gaher,
  "50": fílii Raaía, fílii Rasin, fílii Necóda,
  "51": fílii Gezem, fílii Aza, fílii Phásea,
  "52": fílii Bésai, fílii Munim, fílii Nephússim,
  "53": fílii Bacbuc, fílii Hacúpha, fílii Harhur,
  "54": fílii Besloth, fílii Máhida, fílii Harsa,
  "55": fílii Bercos, fílii Sísara, fílii Thema,
  "56": fílii Nasía, fílii Hatípha,
  "57": fílii servórum Salomónis, fílii Sóthai, fílii Sóphereth, fílii Pharída,
  "58": fílii Iáhala, fílii Darcon, fílii Ieddel,
  "59": fílii Saphatía, fílii Hatil, fílii Phóchereth, qui erat ortus ex Sábaim, fílio Amon.
  "60": Omnes Nathinǽi, et fílii servórum Salomónis, trecénti nonagínta duo.
  "61": 'Hi sunt autem, qui ascendérunt de Thélmela, Thelhársa, Cherub, Addon, et Emmer: et non potuérunt indicáre domum patrum suórum, et semen suum, utrum ex Israel essent.'
  "62": Fílii Dalaía, fílii Tobía, fílii Necóda, sexcénti quadragínta duo.
  "63": Et de sacerdótibus, fílii Había, fílii Accos, fílii Berzellái, qui accépit de filiábus Berzellái Galaadítis uxórem, et vocátus est nómine eórum.
  "64": 'Hi quæsiérunt scriptúram suam in censu, et non invenérunt: et eiécti sunt de sacerdótio.'
  "65": Dixítque Athérsatha eis ut non manducárent de Sanctis sanctórum, donec staret sacérdos doctus et erudítus.
  "66": Omnis multitúdo quasi vir unus, quadragínta duo míllia trecénti sexagínta,
  "67": absque servis et ancíllis eórum, qui erant septem míllia trecénti trigínta septem, et inter eos cantóres, et cantatríces, ducénti quadragínta quinque.
  "68": 'Equi eórum, septingénti trigínta sex: muli eórum, ducénti quadragínta quinque:'
  "69": 'caméli eórum, quadringénti trigínta quinque: ásini, sex míllia septingénti vigínti.'
  "70": '[Hucúsque refértur quid in commentário scriptum fúerit, exin Nehemíæ história téxitur.] Nonnúlli autem de princípibus familiárum dedérunt in opus. Athérsatha dedit in thesáurum auri drachmas mille, phíalas quinquagínta, túnicas sacerdotáles quingéntas trigínta.'
  "71": Et de princípibus familiárum dedérunt in thesáurum óperis, auri drachmas vigínti míllia, et argénti mnas duo míllia ducéntas.
  "72": Et quod dedit réliquus pópulus, auri drachmas vigínti míllia, et argénti mnas duo míllia, et túnicas sacerdotáles sexagínta septem.
  "73": Habitavérunt autem sacerdótes, et Levítæ, et ianitóres, et cantóres, et réliquum vulgus, et Nathinǽi, et omnis Israel in civitátibus suis.
