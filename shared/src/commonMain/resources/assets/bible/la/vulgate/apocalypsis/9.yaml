bible: vulgate
lang: la
language: Latina
book: Apocalypsis
chapter: "9"
verses:
  "1": 'Et quintus ángelus tuba cécinit: et vidi stellam de cælo cecidísse in terram, et data est ei clavis pútei abýssi.'
  "2": 'Et apéruit púteum abýssi: et ascéndit fumus pútei, sicut fumus fornácis magnæ: et obscurátus est sol, et aer de fumo pútei:'
  "3": 'et de fumo pútei exiérunt locústæ in terram, et data est illis potéstas, sicut habent potestátem scorpiónes terræ:'
  "4": 'et præcéptum est illis ne lǽderent fœnum terræ, neque omne víride, neque omnem árborem: nisi tantum hómines, qui non habent signum Dei in fróntibus suis.'
  "5": 'Et datum est illis ne occíderent eos: sed ut cruciárent ménsibus quinque: et cruciátus eórum, ut cruciátus scórpii cum pércutit hóminem.'
  "6": 'Et in diébus illis quærent hómines mortem, et non invénient eam: et desiderábunt mori, et fúgiet mors ab eis.'
  "7": 'Et similitúdines locustárum, símiles equis parátis in prœ́lium: et super cápita eárum tamquam corónæ símiles auro: et fácies eárum tamquam fácies hóminum.'
  "8": 'Et habébant capíllos sicut capíllos mulíerum: et dentes eárum, sicut dentes leónum erant:'
  "9": 'et habébant lorícas sicut lorícas férreas, et vox alárum eárum sicut vox cúrruum equórum multórum curréntium in bellum:'
  "10": 'et habébant caudas símiles scorpiónum, et acúlei erant in caudis eárum: et potéstas eárum nocére homínibus ménsibus quinque:'
  "11": et habébant super se regem ángelum abýssi, cui nomen hebráice Abáddon, græce autem Apóllyon, latíne habens nomen Extérminans.
  "12": Væ unum ábiit, et ecce véniunt adhuc duo væ post hæc.
  "13": 'Et sextus ángelus tuba cécinit: et audívi vocem unam ex quátuor córnibus altáris áurei, quod est ante óculos Dei,'
  "14": 'dicéntem sexto ángelo, qui habébat tubam: Solve quátuor ángelos, qui alligáti sunt in flúmine magno Euphráte.'
  "15": Et solúti sunt quátuor ángeli, qui paráti erant in horam, et diem, et mensem, et annum, ut occíderent tértiam partem hóminum.
  "16": Et númerus equéstris exércitus vícies míllies dena míllia. Et audívi númerum eórum.
  "17": 'Et ita vidi equos in visióne: et qui sedébant super eos, habébant lorícas ígneas, et hyacínthinas, et sulphúreas, et cápita equórum erant tamquam cápita leónum: et de ore eórum procédit ignis, et fumus, et sulphur.'
  "18": Et ab his tribus plagis occísa est tértia pars hóminum de igne, et de fumo, et súlphure, quæ procedébant de ore ipsórum.
  "19": 'Potéstas enim equórum in ore eórum est, et in caudis eórum: nam caudæ eórum símiles serpéntibus, habéntes cápita: et in his nocent.'
  "20": 'Et céteri hómines, qui non sunt occísi in his plagis, neque pœniténtiam egérunt de opéribus mánuum suárum, ut non adorárent dæmónia, et simulácra áurea, et argéntea, et ǽrea, et lapídea, et lígnea, quæ neque vidére possunt, neque audíre, neque ambuláre:'
  "21": et non egérunt pœniténtiam ab homicídiis suis, neque a venefíciis suis, neque a fornicatióne sua, neque a furtis suis.
