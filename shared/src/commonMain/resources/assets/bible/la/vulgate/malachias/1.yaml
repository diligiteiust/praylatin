bible: vulgate
lang: la
language: Latina
book: Malachias
chapter: "1"
verses:
  "1": Onus verbi Dómini ad Israel in manu Malachíæ.
  "2": 'Diléxi vos, dicit Dóminus, et dixístis: In quo dilexísti nos? Nonne frater erat Esau Iacob? dicit Dóminus: et diléxi Iacob,'
  "3": Esau autem ódio hábui? et pósui montes eius in solitúdinem, et hereditátem eius in dracónes desérti.
  "4": 'Quod si díxerit Idumǽa: Destrúcti sumus, sed reverténtes ædificábimus quæ destrúcta sunt: hæc dicit Dóminus exercítuum: Isti ædificábunt, et ego déstruam: et vocabúntur términi impietátis, et pópulus, cui irátus est Dóminus usque in ætérnum.'
  "5": 'Et óculi vestri vidébunt, et vos dicétis: Magnificétur Dóminus super términum Israel.'
  "6": 'Fílius honórat patrem, et servus dóminum suum: si ergo pater ego sum, ubi est honor meus? et si Dóminus ego sum, ubi est timor meus, dicit Dóminus exercítuum? ad vos, o sacerdótes, qui despícitis nomen meum, et dixístis: In quo despéximus nomen tuum?'
  "7": 'Offértis super altáre meum panem pollútum, et dícitis: In quo pollúimus te? In eo quod dícitis: Mensa Dómini despécta est.'
  "8": Si offerátis cæcum ad immolándum, nonne malum est? et si offerátis claudum, et lánguidum, nonne malum est? offer illud duci tuo, si placúerit ei, aut si suscéperit fáciem tuam, dicit Dóminus exercítuum.
  "9": Et nunc deprecámini vultum Dei ut misereátur vestri (de manu enim vestra factum est hoc) si quómodo suscípiat fácies vestras, dicit Dóminus exercítuum.
  "10": 'Quis est in vobis, qui claudat óstia, et incéndat altáre meum gratuíto? non est mihi volúntas in vobis, dicit Dóminus exercítuum: et munus non suscípiam de manu vestra.'
  "11": 'Ab ortu enim solis usque ad occásum, magnum est nomen meum in géntibus, et in omni loco sacrificátur, et offértur nómini meo oblátio munda: quia magnum est nomen meum in géntibus, dicit Dóminus exercítuum.'
  "12": 'Et vos polluístis illud in eo, quod dícitis: Mensa Dómini contamináta est: et quod superpónitur contemptíbile est cum igne, qui illud dévorat.'
  "13": 'Et dixístis: Ecce de labóre, et exsufflástis illud, dicit Dóminus exercítuum, et intulístis de rapínis claudum, et lánguidum, et intulístis munus: numquid suscípiam illud de manu vestra, dicit Dóminus?'
  "14": 'Maledíctus dolósus, qui habet in grege suo másculum, et votum fáciens ímmolat débile Dómino: quia rex magnus ego, dicit Dóminus exercítuum, et nomen meum horríbile in géntibus.'
