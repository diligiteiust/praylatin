bible: vulgate
lang: la
language: Latina
book: Proverbia
chapter: "18"
verses:
  "1": 'Occasiónes quærit qui vult recédere ab amíco: omni témpore erit exprobrábilis.'
  "2": 'Non récipit stultus verba prudéntiæ: nisi ea díxeris, quæ versántur in corde eius.'
  "3": 'Impius, cum in profúndum vénerit peccatórum, contémnit: sed séquitur eum ignomínia et oppróbrium.'
  "4": 'Aqua profúnda verba ex ore viri: et torrens redúndans fons sapiéntiæ.'
  "5": Accípere persónam ímpii non est bonum, ut declínes a veritáte iudícii.
  "6": 'Lábia stulti miscent se rixis: et os eius iúrgia próvocat.'
  "7": 'Os stulti contrítio eius: et lábia ipsíus, ruína ánimæ eius.'
  "8": 'Verba bilínguis, quasi simplícia: et ipsa pervéniunt usque ad interióra ventris. Pigrum déicit timor: ánimæ autem effeminatórum esúrient.'
  "9": Qui mollis et dissolútus est in ópere suo, frater est sua ópera dissipántis.
  "10": 'Turris fortíssima nomen Dómini: ad ipsum currit iustus, et exaltábitur.'
  "11": Substántia dívitis urbs róboris eius, et quasi murus válidus circúmdans eum.
  "12": 'Antequam conterátur, exaltátur cor hóminis: et ántequam glorificétur, humiliátur.'
  "13": Qui prius respóndet quam áudiat, stultum se esse demónstrat, et confusióne dignum.
  "14": 'Spíritus viri susténtat imbecillitátem suam: spíritum vero ad irascéndum fácilem quis póterit sustinére?'
  "15": 'Cor prudens possidébit sciéntiam: et auris sapiéntium quærit doctrínam.'
  "16": Donum hóminis dilátat viam eius, et ante príncipes spátium ei facit.
  "17": 'Iustus prior est accusátor sui: venit amícus eius, et investigábit eum.'
  "18": Contradictiónes cómprimit sors, et inter poténtes quoque diiúdicat.
  "19": 'Frater, qui adiuvátur a fratre, quasi cívitas firma: et iudícia quasi vectes úrbium.'
  "20": 'De fructu oris viri replébitur venter eius: et genímina labiórum ipsíus saturábunt eum.'
  "21": 'Mors, et vita in manu linguæ: qui díligunt eam, cómedent fructus eius.'
  "22": 'Qui ínvenit mulíerem bonam, ínvenit bonum: et háuriet iucunditátem a Dómino. Qui expéllit mulíerem bonam, expéllit bonum: qui autem tenet adúlteram, stultus est et ímpius.'
  "23": 'Cum obsecratiónibus loquétur pauper: et dives effábitur rígide.'
  "24": Vir amábilis ad societátem, magis amícus erit, quam frater.
