bible: vulgate
lang: la
language: Latina
book: Ecclesiastes
chapter: "11"
verses:
  "1": 'Mitte panem tuum super transeúntes aquas: quia post témpora multa invénies illum.'
  "2": 'Da partem septem, necnon et octo: quia ignóras quid futúrum sit mali super terram.'
  "3": Si replétæ fúerint nubes, imbrem super terram effúndent. Si cecíderit lignum ad austrum, aut ad aquilónem, in quocúmque loco cecíderit, ibi erit.
  "4": 'Qui obsérvat ventum, non séminat: et qui consíderat nubes, numquam metet.'
  "5": 'Quómodo ignóras quæ sit via spíritus, et qua ratióne compingántur ossa in ventre prægnántis: sic nescis ópera Dei, qui fabricátor est ómnium.'
  "6": 'Mane sémina semen tuum, et véspere ne cesset manus tua: quia nescis quid magis oriátur, hoc aut illud: et si utrúmque simul, mélius erit.'
  "7": Dulce lumen, et delectábile est óculis vidére solem.
  "8": 'Si annis multis víxerit homo, et in his ómnibus lætátus fúerit, meminísse debet tenebrósi témporis, et diérum multórum: qui cum vénerint, vanitátis arguéntur prætérita.'
  "9": 'Lætáre ergo iúvenis in adolescéntia tua, et in bono sit cor tuum in diébus iuventútis tuæ: et ámbula in viis cordis tui, et in intúitu oculórum tuórum: et scito quod pro ómnibus his addúcet te Deus in iudícium.'
  "10": 'Aufer iram a corde tuo, et ámove malítiam a carne tua: adolescéntia enim et volúptas vana sunt.'
