bible: vulgate
lang: la
language: Latina
book: II Samuelis
chapter: "9"
verses:
  "1": 'Et dixit David: Putásne est áliquis qui remánserit de domo Saul, ut fáciam cum eo misericórdiam propter Iónathan?'
  "2": 'Erat autem de domo Saul servus nómine Siba: quem cum vocásset rex ad se, dixit ei: Tune es Siba? Et ille respóndit: Ego sum servus tuus.'
  "3": 'Et ait rex: Numquid súperest áliquis de domo Saul, ut fáciam cum eo misericórdiam Dei? Dixítque Siba regi: Súperest fílius Iónathæ, débilis pédibus.'
  "4": 'Ubi, inquit, est? Et Siba ad regem: Ecce, ait, in domo est Machir fílii Ammiel, in Lódabar.'
  "5": Misit ergo rex David, et tulit eum de domo Machir fílii Ammiel, de Lódabar.
  "6": 'Cum autem venísset Miphíboseth fílius Iónathæ fílii Saul ad David, córruit in fáciem suam, et adorávit. Dixítque David: Miphíboseth? Qui respóndit: Adsum servus tuus.'
  "7": 'Et ait ei David: Ne tímeas, quia fáciens fáciam in te misericórdiam propter Iónathan patrem tuum, et restítuam tibi omnes agros Saul patris tui: et tu cómedes panem in mensa mea semper.'
  "8": 'Qui adórans eum, dixit: Quis ego sum servus tuus, quóniam respexísti super canem mórtuum símilem mei?'
  "9": 'Vocávit ítaque rex Sibam púerum Saul, et dixit ei: Omnia quæcúmque fuérunt Saul, et univérsam domum eius, dedi fílio dómini tui.'
  "10": 'Operáre ígitur ei terram tu, et fílii tui, et servi tui, et ínferes fílio dómini tui cibos ut alátur: Miphíboseth autem fílius dómini tui cómedet semper panem super mensam meam. Erant autem Sibæ quíndecim fílii, et vigínti servi.'
  "11": 'Dixítque Siba ad regem: Sicut iussísti dómine mi rex servo tuo, sic fáciet servus tuus: et Miphíboseth cómedet super mensam meam, quasi unus de fíliis regis.'
  "12": 'Habébat autem Miphíboseth fílium párvulum nómine Micha: omnis vero cognátio domus Sibæ serviébat Miphíboseth.'
  "13": 'Porro Miphíboseth habitábat in Ierúsalem: quia de mensa regis iúgiter vescebátur: et erat claudus utróque pede.'
