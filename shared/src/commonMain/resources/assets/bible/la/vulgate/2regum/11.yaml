bible: vulgate
lang: la
language: Latina
book: II Regum
chapter: "11"
verses:
  "1": Athalía vero mater Ochozíæ, videns mórtuum fílium suum, surréxit, et interfécit omne semen régium.
  "2": 'Tollens autem Iósaba fília regis Ioram, soror Ochozíæ, Ioas fílium Ochozíæ, furáta est eum de médio filiórum regis, qui interficiebántur, et nutrícem eius de triclínio: et abscóndit eum a fácie Athalíæ ut non interficerétur.'
  "3": 'Erátque cum ea sex annis clam in domo Dómini: porro Athalía regnávit super terram.'
  "4": 'Anno autem séptimo misit Ióiada, et assúmens centuriónes et mílites, introdúxit ad se in templum Dómini, pepigítque cum eis fœdus: et adiúrans eos in domo Dómini, osténdit eis fílium regis:'
  "5": 'et præcépit illis, dicens: Iste est sermo, quem fácere debétis:'
  "6": 'tértia pars vestrum intróeat sábbato, et obsérvet excúbias domus regis. Tértia autem pars sit ad portam Sur, et tértia pars sit ad portam, quæ est post habitáculum scutariórum: et custodiétis excúbias domus Messa.'
  "7": Duæ vero partes e vobis, omnes egrediéntes sábbato, custódiant excúbias domus Dómini circa regem.
  "8": 'Et vallábitis eum, habéntes arma in mánibus vestris: si quis autem ingréssus fúerit septum templi, interficiátur: eritísque cum rege introeúnte et egrediénte.'
  "9": 'Et fecérunt centuriónes iuxta ómnia, quæ præcéperat eis Ióiada sacérdos: et assuméntes sínguli viros suos, qui ingrediebántur sábbato, cum his qui egrediebántur sábbato, venérunt ad Ióiadam sacerdótem.'
  "10": Qui dedit eis hastas, et arma regis David, quæ erant in domo Dómini.
  "11": Et stetérunt sínguli habéntes arma in manu sua, a parte templi déxtera usque ad partem sinístram altáris, et ædis, circum regem.
  "12": 'Produxítque fílium regis, et pósuit super eum diadéma, et testimónium: fecerúntque eum regem, et unxérunt: et plaudéntes manu, dixérunt: Vivat rex.'
  "13": 'Audívit autem Athalía vocem pópuli curréntis: et ingréssa ad turbas in templum Dómini,'
  "14": 'vidit regem stantem super tribúnal iuxta morem, et cantóres, et tubas prope eum, omnémque pópulum terræ lætántem, et canéntem tubis: et scidit vestiménta sua, clamavítque: Coniurátio, coniurátio.'
  "15": 'Præcépit autem Ióiada centuriónibus, qui erant super exércitum, et ait eis: Edúcite eam extra septa templi, et quicúmque eam secútus fúerit, feriátur gládio. Díxerat enim sacérdos: Non occidátur in templo Dómini.'
  "16": Imposuerúntque ei manus, et impegérunt eam per viam intróitus equórum, iuxta palátium, et interfécta est ibi.
  "17": 'Pépigit ergo Ióiada fœdus inter Dóminum, et inter regem, et inter pópulum, ut esset pópulus Dómini: et inter regem et pópulum.'
  "18": 'Ingressúsque est omnis pópulus terræ templum Baal, et destruxérunt aras eius, et imágines contrivérunt válide: Mathan quoque sacerdótem Baal occidérunt coram altári. Et pósuit sacérdos custódias in domo Dómini.'
  "19": 'Tulítque centuriónes, et Ceréthi et Pheléthi legiónes, et omnem pópulum terræ, deduxerúntque regem de domo Dómini: et venérunt per viam portæ scutariórum in palátium, et sedit super thronum regum.'
  "20": 'Lætatúsque est omnis pópulus terræ, et cívitas conquiévit: Athalía autem occísa est gládio in domo regis.'
  "21": Septémque annórum erat Ioas, cum regnáre cœpísset.
