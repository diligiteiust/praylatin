bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "66"
verses:
  "1": In finem, in hymnis, Psalmus Cántici David.
  "2": 'Deus misereátur nostri, et benedícat nobis: illúminet vultum suum super nos, et misereátur nostri.'
  "3": 'Ut cognoscámus in terra viam tuam: in ómnibus géntibus salutáre tuum.'
  "4": 'Confiteántur tibi pópuli Deus: confiteántur tibi pópuli omnes.'
  "5": 'Læténtur et exsúltent gentes: quóniam iúdicas pópulos in æquitáte, et gentes in terra dírigis.'
  "6": 'Confiteántur tibi pópuli Deus: confiteántur tibi pópuli omnes.'
  "7": 'Terra dedit fructum suum: benedícat nos Deus, Deus noster,'
  "8": 'benedícat nos Deus: et métuant eum omnes fines terræ.'
