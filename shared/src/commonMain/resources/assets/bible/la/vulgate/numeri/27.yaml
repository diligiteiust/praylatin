bible: vulgate
lang: la
language: Latina
book: Numeri
chapter: "27"
verses:
  "1": 'Accessérunt autem fíliæ Sálphaad, fílii Hepher, fílii Gálaad, fílii Machir, fílii Manásse, qui fuit fílius Ioseph: quarum sunt nómina, Máala, et Noa, et Hegla, et Melcha, et Thersa.'
  "2": 'Steterúntque coram Móyse et Eleázaro sacerdóte et cunctis princípibus pópuli ad óstium tabernáculi fœ́deris, atque dixérunt:'
  "3": 'Pater noster mórtuus est in desérto, nec fuit in seditióne, quæ concitáta est contra Dóminum sub Core, sed in peccáto suo mórtuus est: hic non hábuit mares fílios. Cur tóllitur nomen illíus de família sua, quia non hábuit fílium? Date nobis possessiónem inter cognátos patris nostri.'
  "4": Retulítque Móyses causam eárum ad iudícium Dómini.
  "5": 'Qui dixit ad eum:'
  "6": 'Iustam rem póstulant fíliæ Sálphaad: da eis possessiónem inter cognátos patris sui, et ei in hereditátem succédant.'
  "7": 'Ad fílios autem Israel loquéris hæc:'
  "8": Homo cum mórtuus fúerit absque fílio, ad fíliam eius transíbit heréditas.
  "9": Si fíliam non habúerit, habébit successóres fratres suos.
  "10": Quod si et fratres non fúerint, dábitis hereditátem frátribus patris eius.
  "11": Sin autem nec pátruos habúerit, dábitur heréditas his, qui ei próximi sunt. Erítque hoc fíliis Israel sanctum lege perpétua, sicut præcépit Dóminus Móysi.
  "12": 'Dixit quoque Dóminus ad Móysen: Ascénde in montem istum Abarim, et contempláre inde terram, quam datúrus sum fíliis Israel.'
  "13": 'Cumque víderis eam, ibis et tu ad pópulum tuum, sicut ivit frater tuus Aaron:'
  "14": 'quia offendístis me in desérto Sin in contradictióne multitúdinis, nec sanctificáre me voluístis coram ea super aquas: hæ sunt aquæ contradictiónis in Cades desérti Sin.'
  "15": 'Cui respóndit Móyses:'
  "16": 'Provídeat Dóminus Deus spirítuum omnis carnis, hóminem, qui sit super multitúdinem hanc:'
  "17": 'et possit exíre et intráre ante eos, et edúcere eos vel introdúcere: ne sit pópulus Dómini sicut oves absque pastóre.'
  "18": 'Dixítque Dóminus ad eum: Tolle Iósue fílium Nun, virum in quo est Spíritus, et pone manum tuam super eum.'
  "19": 'Qui stabit coram Eleázaro sacerdóte et omni multitúdine:'
  "20": et dabis ei præcépta cunctis vidéntibus, et partem glóriæ tuæ, ut áudiat eum omnis synagóga filiórum Israel.
  "21": Pro hoc, si quid agéndum erit, Eleázar sacérdos cónsulet Dóminum. Ad verbum eius egrediétur et ingrediétur ipse, et omnes fílii Israel cum eo, et cétera multitúdo.
  "22": 'Fecit Móyses ut præcéperat Dóminus: cumque tulísset Iósue, státuit eum coram Eleázaro sacerdóte et omni frequéntia pópuli.'
  "23": Et impósitis cápiti eius mánibus, cuncta replicávit quæ mandáverat Dóminus.
