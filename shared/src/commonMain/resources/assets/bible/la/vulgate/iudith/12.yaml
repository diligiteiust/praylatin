bible: vulgate
lang: la
language: Latina
book: Iudith
chapter: "12"
verses:
  "1": Tunc iussit eam introíre ubi repósiti erant thesáuri eius, et iussit illic manére eam, et constítuit quid darétur illi de convívio suo.
  "2": 'Cui respóndit Iudith, et dixit: Nunc non pótero manducáre ex his, quæ mihi prǽcipis tríbui, ne véniat super me offénsio: ex his autem, quæ mihi détuli, manducábo.'
  "3": 'Cui Holoférnes ait: Si defécerint tibi ista, quæ tecum detulísti, quid faciémus tibi?'
  "4": 'Et dixit Iudith: Vivit ánima tua dómine meus, quóniam non expéndet ómnia hæc ancílla tua, donec fáciat Deus in manu mea hæc, quæ cogitávi. Et induxérunt illam servi eius in tabernáculum, quod præcéperat.'
  "5": Et pétiit dum introíret, ut darétur ei cópia nocte et ante lucem egrediéndi foras ad oratiónem, et deprecándi Dóminum.
  "6": 'Et præcépit cubiculáriis suis, ut sicut placéret illi, exíret et introíret ad adorándum Deum suum, per tríduum:'
  "7": et exíbat nóctibus in vallem Bethúliæ, et baptizábat se in fonte aquæ.
  "8": Et ut ascendébat, orábat Dóminum Deum Israel, ut dirígeret viam eius ad liberatiónem pópuli sui.
  "9": Et intróiens, munda manébat in tabernáculo usque dum accíperet escam suam in véspere.
  "10": 'Et factum est, in quarto die Holoférnes fecit cœnam servis suis, et dixit ad Vágao eunúchum suum: Vade, et suáde Hebrǽam illam ut sponte conséntiat habitáre mecum.'
  "11": Fœdum est enim apud Assýrios, si fémina irrídeat virum, agéndo ut immúnis ab eo tránseat.
  "12": 'Tunc introívit Vágao ad Iudith, et dixit: Non vereátur bona puélla introíre ad dóminum meum, ut honorificétur ante fáciem eius, ut mandúcet cum eo, et bibat vinum in iucunditáte.'
  "13": 'Cui Iudith respóndit: Quæ ego sum, ut contradícam dómino meo?'
  "14": Omne quod erit ante óculos eius bonum et óptimum fáciam. Quidquid autem illi placúerit, hoc mihi erit óptimum ómnibus diébus vitæ meæ.
  "15": Et surréxit, et ornávit se vestiménto suo, et ingréssa stetit ante fáciem eius.
  "16": 'Cor autem Holoférnes concússum est: erat enim ardens in concupiscéntia eius.'
  "17": 'Et dixit ad eam Holoférnes: Bibe nunc, et accúmbe in iucunditáte, quóniam invenísti grátiam coram me.'
  "18": 'Et dixit Iudith: Bibam dómine, quóniam magnificáta est ánima mea hódie præ ómnibus diébus meis.'
  "19": Et accépit, et manducávit, et bibit coram ipso ea, quæ paráverat illi ancílla eius.
  "20": Et iucúndus factus est Holoférnes ad eam, bibítque vinum multum nimis, quantum numquam bíberat in vita sua.
