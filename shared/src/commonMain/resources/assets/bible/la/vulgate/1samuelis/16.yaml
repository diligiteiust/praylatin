bible: vulgate
lang: la
language: Latina
book: I Samuelis
chapter: "16"
verses:
  "1": 'Dixítque Dóminus ad Samuélem: Usquequo tu luges Saul, cum ego proiécerim eum ne regnet super Israel? Imple cornu tuum óleo, et veni, ut mittam te ad Isai Bethlehemítem: provídi enim in fíliis eius mihi regem.'
  "2": 'Et ait Sámuel: Quómodo vadam? áudiet enim Saul, et interfíciet me. Et ait Dóminus: Vítulum de arménto tolles in manu tua, et dices: Ad immolándum Dómino veni.'
  "3": Et vocábis Isai ad víctimam, et ego osténdam tibi quid fácias, et unges quemcúmque monstrávero tibi.
  "4": 'Fecit ergo Sámuel sicut locútus est ei Dóminus. Venítque in Béthlehem, et admiráti sunt senióres civitátis occurréntes ei, dixerúntque: Pacificúsne est ingréssus tuus?'
  "5": 'Et ait: Pacíficus: ad immolándum Dómino veni, sanctificámini, et veníte mecum ut ímmolem. Sanctificávit ergo Isai et fílios eius, et vocávit eos ad sacrifícium.'
  "6": 'Cumque ingréssi essent, vidit Eliab, et ait: Num coram Dómino est christus eius?'
  "7": 'Et dixit Dóminus ad Samuélem: Ne respícias vultum eius, neque altitúdinem statúræ eius: quóniam abiéci eum, nec iuxta intúitum hóminis ego iúdico: homo enim videt ea quæ parent, Dóminus autem intuétur cor.'
  "8": 'Et vocávit Isai Abínadab, et addúxit eum coram Samuéle. Qui dixit: Nec hunc elégit Dóminus.'
  "9": 'Addúxit autem Isai Samma, de quo ait: Etiam hunc non elégit Dóminus.'
  "10": 'Addúxit ítaque Isai septem fílios suos coram Samuéle: et ait Sámuel ad Isai: Non elégit Dóminus ex istis.'
  "11": 'Dixítque Sámuel ad Isai: Numquid iam compléti sunt fílii? Qui respóndit: Adhuc réliquus est párvulus, et pascit oves. Et ait Sámuel ad Isai: Mitte, et adduc eum: nec enim discumbémus priúsquam huc ille véniat.'
  "12": 'Misit ergo, et addúxit eum. Erat autem rufus, et pulcher aspéctu, decoráque fácie: et ait Dóminus: Surge, unge eum, ipse est enim.'
  "13": 'Tulit ergo Sámuel cornu ólei, et unxit eum in médio fratrum eius: et diréctus est Spíritus Dómini a die illa in David, et deínceps. Surgénsque Sámuel ábiit in Rámatha.'
  "14": Spíritus autem Dómini recéssit a Saul, et exagitábat eum spíritus nequam a Dómino.
  "15": 'Dixerúntque servi Saul ad eum: Ecce spíritus Dei malus exágitat te.'
  "16": Iúbeat dóminus noster, et servi tui qui coram te sunt, quærent hóminem sciéntem psállere cíthara, ut quando arripúerit te spíritus Dómini malus, psallat manu sua, et lévius feras.
  "17": 'Et ait Saul ad servos suos: Providéte ergo mihi áliquem bene psalléntem, et addúcite eum ad me.'
  "18": 'Et respóndens unus de púeris, ait: Ecce vidi fílium Isai Bethlehemítem sciéntem psállere, et fortíssimum róbore, et virum bellicósum, et prudéntem in verbis, et virum pulchrum: et Dóminus est cum eo.'
  "19": 'Misit ergo Saul núntios ad Isai, dicens: Mitte ad me David fílium tuum, qui est in páscuis.'
  "20": Tulit ítaque Isai ásinum plenum pánibus, et lagénam vini, et hædum de capris unum, et misit per manum David fílii sui Sauli.
  "21": 'Et venit David ad Saul, et stetit coram eo: at ille diléxit eum nimis, et factus est eius ármiger.'
  "22": 'Misítque Saul ad Isai, dicens: Stet David in conspéctu meo: invénit enim grátiam in óculis meis.'
  "23": 'Igitur quandocúmque spíritus Dómini malus arripiébat Saul, David tollébat cítharam, et percutiébat manu sua, et refocillabátur Saul, et lévius habébat: recedébat enim ab eo spíritus malus.'
