bible: vulgate
lang: la
language: Latina
book: II Samuelis
chapter: "16"
verses:
  "1": Cumque David transísset páululum montis vérticem, appáruit Siba puer Miphíboseth in occúrsum eius, cum duóbus ásinis, qui oneráti erant ducéntis pánibus, et centum alligatúris uvæ passæ, et centum massis palathárum, et utre vini.
  "2": 'Et dixit rex Sibæ: Quid sibi volunt hæc? Respondítque Siba: Asini, domésticis regis ut sédeant: panes et pálathæ ad vescéndum púeris tuis: vinum autem ut bibat si quis defécerit in desérto.'
  "3": 'Et ait rex: Ubi est fílius dómini tui? Respondítque Siba regi: Remánsit in Ierúsalem, dicens: Hódie restítuet mihi domus Israel regnum patris mei.'
  "4": 'Et ait rex Sibæ: Tua sint ómnia quæ fuérunt Miphíboseth. Dixítque Siba: Oro ut invéniam grátiam coram te, dómine mi rex.'
  "5": 'Venit ergo rex David usque Bahúrim: et ecce egrediebátur inde vir de cognatióne domus Saul, nómine Sémei, fílius Gera: procedebátque egrédiens, et maledicébat,'
  "6": 'mittebátque lápides contra David, et contra univérsos servos regis David: omnis autem pópulus, et univérsi bellatóres, a dextro et a sinístro látere regis incedébant.'
  "7": 'Ita autem loquebátur Sémei cum maledíceret regi: Egrédere, egrédere vir sánguinum, et vir Bélial.'
  "8": 'Réddidit tibi Dóminus univérsum sánguinem domus Saul: quóniam invasísti regnum pro eo, et dedit Dóminus regnum in manu Absalom fílii tui: et ecce premunt te mala tua, quóniam vir sánguinum es.'
  "9": 'Dixit autem Abísai fílius Sárviæ regi: Quare maledícit canis hic mórtuus dómino meo regi? vadam, et amputábo caput eius.'
  "10": 'Et ait rex: Quid mihi et vobis est fílii Sárviæ? dimíttite eum, ut maledícat: Dóminus enim præcépit ei ut maledíceret David: et quis est qui áudeat dícere, quare sic fécerit?'
  "11": 'Et ait rex Abísai, et univérsis servis suis: Ecce fílius meus, qui egréssus est de útero meo, quærit ánimam meam: quanto magis nunc fílius Iémini? dimíttite eum ut maledícat iuxta præcéptum Dómini:'
  "12": si forte respíciat Dóminus afflictiónem meam, et reddat mihi Dóminus bonum pro maledictióne hac hodiérna.
  "13": Ambulábat ítaque David et sócii eius per viam cum eo. Sémei autem per iugum montis ex látere contra illum gradiebátur, maledícens, et mittens lápides advérsum eum, terrámque spargens.
  "14": Venit ítaque rex, et univérsus pópulus cum eo lassus, et refocilláti sunt ibi.
  "15": Absalom autem et omnis pópulus eius ingréssi sunt Ierúsalem, sed et Achítophel cum eo.
  "16": 'Cum autem venísset Chúsai Arachítes amícus David ad Absalom, locútus est ad eum: Salve rex, salve rex.'
  "17": 'Ad quem Absalom: Hæc est, inquit, grátia tua ad amícum tuum? quare non ivísti cum amíco tuo?'
  "18": 'Respondítque Chúsai ad Absalom: Nequáquam: quia illíus ero, quem elégit Dóminus, et omnis hic pópulus, et univérsus Israel: et cum eo manébo.'
  "19": Sed ut et hoc ínferam, cui ego servitúrus sum? nonne fílio regis? sicut párui patri tuo, ita parébo et tibi.
  "20": 'Dixit autem Absalom ad Achítophel: Iníte consílium quid ágere debeámus.'
  "21": 'Et ait Achítophel ad Absalom: Ingrédere ad concubínas patris tui, quas dimísit ad custodiéndam domum: ut cum audíerit omnis Israel quod fœdáveris patrem tuum, roboréntur tecum manus eórum.'
  "22": Tetendérunt ergo Absalom tabernáculum in solário, ingressúsque est ad concubínas patris sui coram univérso Israel.
  "23": 'Consílium autem Achítophel quod dabat in diébus illis, quasi si quis consúleret Deum: sic erat omne consílium Achítophel, et cum esset cum David, et cum esset cum Absalom.'
