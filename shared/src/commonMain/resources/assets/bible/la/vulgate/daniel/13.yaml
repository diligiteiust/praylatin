bible: vulgate
lang: la
language: Latina
book: Daniel
chapter: "13"
verses:
  "1": '[Hucúsque Daniélem in hebrǽo volúmine légimus. Quæ sequúntur usque ad finem libri, de Theodotiónis editióne transláta sunt.] Et erat vir hábitans in Babylóne, et nomen eius Ióakim:'
  "2": 'et accépit uxórem nómine Susánnam, fíliam Helcíæ, pulchram nimis, et timéntem Deum:'
  "3": paréntes enim illíus, cum essent iusti, erudiérunt fíliam suam secúndum legem Móysi.
  "4": 'Erat autem Ióakim dives valde, et erat ei pomárium vicínum dómui suæ: et ad ipsum confluébant Iudǽi, eo quod esset honorabílior ómnium.'
  "5": 'Et constitúti sunt de pópulo duo senes iúdices in illo anno, de quibus locútus est Dóminus: Quia egréssa est iníquitas de Babylóne a senióribus iudícibus, qui videbántur régere pópulum.'
  "6": Isti frequentábant domum Ióakim, et veniébant ad eos omnes, qui habébant iudícia.
  "7": Cum autem pópulus revertísset per merídiem, ingrediebátur Susánna, et deambulábat in pomário viri sui.
  "8": 'Et vidébant eam senes quotídie ingrediéntem, et deambulántem: et exarsérunt in concupiscéntiam eius:'
  "9": et evertérunt sensum suum, et declinavérunt óculos suos ut non vidérent cælum, neque recordaréntur iudiciórum iustórum.
  "10": 'Erant ergo ambo vulneráti amóre eius, nec indicavérunt sibi vicíssim dolórem suum:'
  "11": 'erubescébant enim indicáre sibi concupiscéntiam suam, voléntes concúmbere cum ea:'
  "12": 'et observábant quotídie sollicítius vidére eam. Dixítque alter ad álterum:'
  "13": Eámus domum, quia hora prándii est. Et egréssi, recessérunt a se.
  "14": 'Cumque revertíssent, venérunt in unum: et sciscitántes ab ínvicem causam, conféssi sunt concupiscéntiam suam: et tunc in commúni statuérunt tempus, quando eam possent inveníre solam.'
  "15": 'Factum est autem, cum observárent diem aptum, ingréssa est aliquándo sicut heri et nudiustértius, cum duábus solis puéllis, voluítque lavári in pomário: æstus quippe erat:'
  "16": et non erat ibi quisquam, præter duos senes abscónditos, et contemplántes eam.
  "17": 'Dixit ergo puéllis: Afférte mihi óleum, et smígmata, et óstia pomárii cláudite, ut laver.'
  "18": 'Et fecérunt sicut præcéperat: clauserúntque óstia pomárii, et egréssæ sunt per postícum ut afférrent quæ iússerat: nesciebántque senes intus esse abscónditos.'
  "19": 'Cum autem egréssæ essent puéllæ, surrexérunt duo senes, et accurrérunt ad eam, et dixérunt:'
  "20": 'Ecce óstia pomárii clausa sunt, et nemo nos videt, et nos in concupiscéntia tui sumus: quam ob rem assentíre nobis, et commiscére nobíscum.'
  "21": Quod si nolúeris, dicémus contra te testimónium, quod fúerit tecum iúvenis, et ob hanc causam emíseris puéllas a te.
  "22": 'Ingémuit Susánna, et ait: Angústiæ sunt mihi úndique: si enim hoc égero, mors mihi est: si autem non égero, non effúgiam manus vestras.'
  "23": Sed mélius est mihi absque ópere incídere in manus vestras, quam peccáre in conspéctu Dómini.
  "24": 'Et exclamávit voce magna Susánna: exclamavérunt autem et senes advérsus eam.'
  "25": Et cucúrrit unus ad óstia pomárii, et apéruit.
  "26": Cum ergo audíssent clamórem fámuli domus in pomário, irruérunt per postícum ut vidérent quidnam esset.
  "27": 'Postquam autem senes locúti sunt, erubuérunt servi veheménter: quia numquam dictus fúerat sermo huiuscémodi de Susánna. Et facta est dies crástina.'
  "28": Cumque venísset pópulus ad Ióakim virum eius, venérunt et duo presbýteri, pleni iníqua cogitatióne advérsus Susánnam ut interfícerent eam.
  "29": 'Et dixérunt coram pópulo: Míttite ad Susánnam fíliam Helcíæ uxórem Ióakim. Et statim misérunt.'
  "30": Et venit cum paréntibus, et fíliis, et univérsis cognátis suis.
  "31": Porro Susánna erat delicáta nimis, et pulchra spécie.
  "32": At iníqui illi iussérunt ut discooperirétur (erat enim coopérta), ut vel sic satiaréntur decóre eius.
  "33": Flebant ígitur sui, et omnes qui nóverant eam.
  "34": Consurgéntes autem duo presbýteri in médio pópuli, posuérunt manus suas super caput eius.
  "35": 'Quæ flens suspéxit ad cælum: erat enim cor eius fidúciam habens in Dómino.'
  "36": 'Et dixérunt presbýteri: Cum deambularémus in pomário soli, ingréssa est hæc cum duábus puéllis: et clausit óstia pomárii, et dimísit a se puéllas.'
  "37": Venítque ad eam adoléscens, qui erat abscónditus, et concúbuit cum ea.
  "38": Porro nos cum essémus in ángulo pomárii, vidéntes iniquitátem, cucúrrimus ad eos, et vídimus eos páriter commiscéri.
  "39": 'Et illum quidem non quívimus comprehéndere, quia fórtior nobis erat, et apértis óstiis exsilívit:'
  "40": 'hanc autem cum apprehendissémus, interrogávimus, quisnam esset adoléscens, et nóluit indicáre nobis: huius rei testes sumus.'
  "41": Crédidit eis multitúdo quasi sénibus et iudícibus pópuli, et condemnavérunt eam ad mortem.
  "42": 'Exclamávit autem voce magna Susánna, et dixit: Deus ætérne, qui absconditórum es cógnitor, qui nosti ómnia ántequam fiant,'
  "43": 'tu scis quóniam falsum testimónium tulérunt contra me: et ecce mórior, cum nihil horum fécerim, quæ isti malitióse composuérunt advérsum me.'
  "44": Exaudívit autem Dóminus vocem eius.
  "45": 'Cumque ducerétur ad mortem, suscitávit Dóminus spíritum sanctum púeri iunióris, cuius nomen Dániel:'
  "46": 'et exclamávit voce magna: Mundus ego sum a sánguine huius.'
  "47": 'Et convérsus omnis pópulus ad eum, dixit: Quis est iste sermo, quem tu locútus es?'
  "48": 'Qui cum staret in médio eórum, ait: Sic fátui fílii Israel, non iudicántes, neque quod verum est cognoscéntes, condemnástis fíliam Israel?'
  "49": Revertímini ad iudícium, quia falsum testimónium locúti sunt advérsus eam.
  "50": 'Revérsus est ergo pópulus cum festinatióne, et dixérunt ei senes: Veni, et sede in médio nostrum, et índica nobis: quia tibi Deus dedit honórem senectútis.'
  "51": 'Et dixit ad eos Dániel: Separáte illos ab ínvicem procul, et diiudicábo eos.'
  "52": 'Cum ergo divísi essent alter ab áltero, vocávit unum de eis, et dixit ad eum: Inveteráte diérum malórum, nunc venérunt peccáta tua, quæ operabáris prius:'
  "53": 'iúdicans iudícia iniústa, innocéntes ópprimens, et dimíttens nóxios, dicénte Dómino: Innocéntem et iustum non interfícies.'
  "54": 'Nunc ergo si vidísti eam, dic sub qua árbore víderis eos colloquéntes sibi. Qui ait: Sub schino.'
  "55": 'Dixit autem Dániel: Recte mentítus es in caput tuum: ecce enim ángelus Dei, accépta senténtia ab eo, scindet te médium.'
  "56": 'Et, amóto eo, iussit veníre álium, et dixit ei: Semen Chánaan, et non Iuda, spécies decépit te, et concupiscéntia subvértit cor tuum:'
  "57": 'sic faciebátis filiábus Israel, et illæ timéntes loquebántur vobis: sed fília Iuda non sustínuit iniquitátem vestram.'
  "58": 'Nunc ergo dic mihi, sub qua árbore comprehénderis eos loquéntes sibi. Qui ait: Sub prino.'
  "59": 'Dixit autem ei Dániel: Recte mentítus es et tu in caput tuum: manet enim ángelus Dómini, gládium habens, ut secet te médium, et interfíciat vos.'
  "60": Exclamávit ítaque omnis cœtus voce magna, et benedixérunt Deum, qui salvat sperántes in se.
  "61": Et consurrexérunt advérsus duos presbýteros (convícerat enim eos Dániel ex ore suo falsum dixísse testimónium), fecerúntque eis sicut male égerant advérsus próximum,
  "62": 'ut fácerent secúndum legem Móysi: et interfecérunt eos, et salvátus est sanguis innóxius in die illa.'
  "63": Helcías autem et uxor eius laudavérunt Deum pro fília sua Susánna cum Ióakim maríto eius, et cognátis ómnibus, quia non esset invénta in ea res turpis.
  "64": Dániel autem factus est magnus in conspéctu pópuli a die illa, et deínceps.
  "65": Et rex Astýages appósitus est ad patres suos, et suscépit Cyrus Perses regnum eius.
