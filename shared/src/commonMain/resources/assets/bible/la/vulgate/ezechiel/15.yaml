bible: vulgate
lang: la
language: Latina
book: Ezechiel
chapter: "15"
verses:
  "1": 'Et factus est sermo Dómini ad me, dicens:'
  "2": Fili hóminis, quid fiet de ligno vitis, ex ómnibus lignis némorum, quæ sunt inter ligna silvárum?
  "3": Numquid tollétur de ea lignum ut fiat opus, aut fabricábitur de ea paxíllus, ut depéndeat in eo quodcúmque vas?
  "4": 'Ecce igni datum est in escam: utrámque partem eius consúmpsit ignis, et medíetas eius redácta est in favíllam: numquid útile erit ad opus?'
  "5": 'Etiam cum esset íntegrum, non erat aptum ad opus: quanto magis cum illud ignis devoráverit, et combússerit, nihil ex eo fiet óperis?'
  "6": 'Proptérea hæc dicit Dóminus Deus: Quómodo lignum vitis inter ligna silvárum, quod dedi igni ad devorándum, sic tradam habitatóres Ierúsalem.'
  "7": 'Et ponam fáciem meam in eos: de igne egrediéntur, et ignis consúmet eos: et sciétis quia ego Dóminus, cum posúero fáciem meam in eos,'
  "8": 'et dédero terram ínviam, et desolátam: eo quod prævaricatóres extíterint, dicit Dóminus Deus.'
