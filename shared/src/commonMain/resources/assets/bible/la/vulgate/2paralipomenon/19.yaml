bible: vulgate
lang: la
language: Latina
book: II Paralipomenon
chapter: "19"
verses:
  "1": Revérsus est autem Iósaphat rex Iuda in domum suam pacífice in Ierúsalem.
  "2": 'Cui occúrrit Iehu fílius Hánani videns, et ait ad eum: Impio præbes auxílium, et his qui odérunt Dóminum amicítia iúngeris, et idcírco iram quidem Dómini merebáris:'
  "3": sed bona ópera invénta sunt in te, eo quod abstúleris lucos de terra Iuda, et præparáveris cor tuum ut requíreres Dóminum Deum patrum tuórum.
  "4": 'Habitávit ergo Iósaphat in Ierúsalem: rursúmque egréssus est ad pópulum de Bersabée usque ad montem Ephraim, et revocávit eos ad Dóminum Deum patrum suórum.'
  "5": Constituítque iúdices terræ in cunctis civitátibus Iuda munítis per síngula loca,
  "6": 'et præcípiens iudícibus, Vidéte, ait, quid faciátis: non enim hóminis exercétis iudícium, sed Dómini: et quodcúmque iudicavéritis, in vos redundábit.'
  "7": 'Sit timor Dómini vobíscum, et cum diligéntia cuncta fácite: non est enim apud Dóminum Deum nostrum iníquitas, nec personárum accéptio, nec cupído múnerum.'
  "8": In Ierúsalem quoque constítuit Iósaphat Levítas, et sacerdótes, et príncipes familiárum ex Israel, ut iudícium et causam Dómini iudicárent habitatóribus eius.
  "9": 'Præcepítque eis, dicens: Sic agétis in timóre Dómini fidéliter et corde perfécto.'
  "10": 'Omnem causam, quæ vénerit ad vos fratrum vestrórum, qui hábitant in úrbibus suis inter cognatiónem et cognatiónem, ubicúmque quǽstio est de lege, de mandáto, de cæremóniis, de iustificatiónibus: osténdite eis, ut non peccent in Dóminum, et ne véniat ira super vos et super fratres vestros: sic ergo agéntes non peccábitis.'
  "11": 'Amarías autem sacérdos et póntifex vester, in his, quæ ad Deum pértinent, præsidébit: porro Zabadías fílius Ismahel, qui est dux in domo Iuda, super ea ópera erit, quæ ad regis offícium pértinent: habetísque magístros Levítas coram vobis, confortámini, et ágite diligénter, et erit Dóminus vobíscum in bonis.'
