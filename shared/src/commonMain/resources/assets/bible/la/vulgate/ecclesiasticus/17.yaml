bible: vulgate
lang: la
language: Latina
book: Ecclesiasticus
chapter: "17"
verses:
  "1": Deus creávit de terra hóminem, et secúndum imáginem suam fecit illum.
  "2": Et íterum convértit illum in ipsam, et secúndum se vestívit illum virtúte.
  "3": Númerum diérum, et tempus dedit illi, et dedit illi potestátem eórum, quæ sunt super terram.
  "4": Pósuit timórem illíus super omnem carnem, et dominátus est bestiárum et volatílium.
  "5": 'Creávit ex ipso adiutórium símile sibi: consílium, et linguam, et óculos, et aures, et cor dedit illis excogitándi, et disciplína intelléctus replévit illos.'
  "6": Creávit illis sciéntiam spíritus, sensu implévit cor illórum, et mala et bona osténdit illis.
  "7": Pósuit óculum suum super corda illórum, osténdere illis magnália óperum suórum,
  "8": 'ut nomen sanctificatiónis colláudent: et gloriári in mirabílibus illíus, ut magnália enárrent óperum eius.'
  "9": Addidit illis disciplínam, et legem vitæ hereditávit illos.
  "10": Testaméntum ætérnum constítuit cum illis, et iustítiam et iudícia sua osténdit illis.
  "11": 'Et magnália honóris eius vidit óculus illórum, et honórem vocis audiérunt aures illórum. Et dixit illis: Atténdite ab omni iníquo.'
  "12": Et mandávit illis unicuíque de próximo suo.
  "13": Viæ illórum coram ipso sunt semper, non sunt abscónsæ ab óculis ipsíus.
  "14": 'In unamquámque gentem præpósuit rectórem:'
  "15": et pars Dei, Israel facta est manifésta.
  "16": 'Et ómnia ópera illórum velut sol in conspéctu Dei: et óculi eius sine intermissióne inspiciéntes in viis eórum.'
  "17": Non sunt abscónsa testaménta per iniquitátem illórum, et omnes iniquitátes eórum in conspéctu Dei.
  "18": Eleemósyna viri quasi signáculum cum ipso, et grátiam hóminis quasi pupíllam conservábit.
  "19": Et póstea resúrget, et retríbuet illis retributiónem, unicuíque in caput ipsórum, et convértet in interióres partes terræ.
  "20": Pœniténtibus autem dedit viam iustítiæ, et confirmávit deficiéntes sustinére, et destinávit illis sortem veritátis.
  "21": 'Convértere ad Dóminum, et relínque peccáta tua:'
  "22": precáre ante fáciem Dómini, et mínue offendícula.
  "23": 'Revértere ad Dóminum, et avértere ab iniustítia tua, et nimis ódito exsecratiónem:'
  "24": et cognósce iustítias et iudícia Dei, et sta in sorte propositiónis, et oratiónis altíssimi Dei.
  "25": In partes vade sǽculi sancti, cum vivis et dántibus confessiónem Deo.
  "26": Non demoréris in erróre impiórum, ante mortem confitére. A mórtuo quasi nihil, perit conféssio.
  "27": Confitéberis vivens, vivus et sanus confitéberis, et laudábis Deum, et gloriáberis in miseratiónibus illíus.
  "28": Quam magna misericórdia Dómini, et propitiátio illíus converténtibus ad se!
  "29": Nec enim ómnia possunt esse in homínibus, quóniam non est immortális fílius hóminis, et in vanitáte malítiæ placuérunt.
  "30": Quid lucídius sole? et hic defíciet. Aut quid néquius quam quod excogitávit caro et sanguis? et hoc arguétur.
  "31": 'Virtútem altitúdinis cæli ipse cónspicit: et omnes hómines terra et cinis.'
