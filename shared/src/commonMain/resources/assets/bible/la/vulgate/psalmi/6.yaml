bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "6"
verses:
  "1": In finem, in carmínibus, Psalmus David, pro octáva.
  "2": Dómine ne in furóre tuo árguas me, neque in ira tua corrípias me.
  "3": 'Miserére mei Dómine quóniam infírmus sum: sana me Dómine quóniam conturbáta sunt ossa mea.'
  "4": 'Et ánima mea turbáta est valde: sed tu Dómine úsquequo?'
  "5": 'Convértere Dómine, et éripe ánimam meam: salvum me fac propter misericórdiam tuam.'
  "6": 'Quóniam non est in morte qui memor sit tui: in inférno autem quis confitébitur tibi?'
  "7": 'Laborávi in gémitu meo, lavábo per síngulas noctes lectum meum: lácrymis meis stratum meum rigábo.'
  "8": 'Turbátus est a furóre óculus meus: inveterávi inter omnes inimícos meos.'
  "9": Discédite a me omnes qui operámini iniquitátem, quóniam exaudívit Dóminus vocem fletus mei.
  "10": 'Exaudívit Dóminus deprecatiónem meam: Dóminus oratiónem meam suscépit.'
  "11": 'Erubéscant, et conturbéntur veheménter omnes inimíci mei: convertántur et erubéscant valde velóciter.'
