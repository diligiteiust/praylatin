bible: vulgate
lang: la
language: Latina
book: Nahum
chapter: "2"
verses:
  "1": 'Ascéndit qui dispérgat coram te, qui custódiat obsidiónem: contempláre viam, confórta lumbos, róbora virtútem valde.'
  "2": 'Quia réddidit Dóminus supérbiam Iacob, sicut supérbiam Israel: quia vastatóres dissipavérunt eos, et propágines eórum corrupérunt.'
  "3": 'Clýpeus fórtium eius ignítus, viri exércitus in coccíneis: ígneæ habénæ currus in die præparatiónis eius, et agitatóres consopíti sunt.'
  "4": 'In itinéribus conturbáti sunt: quadrígæ collísæ sunt in platéis: aspéctus eórum quasi lámpades, quasi fúlgura discurréntia.'
  "5": 'Recordábitur fórtium suórum, ruent in itinéribus suis: velóciter ascéndent muros eius, et præparábitur umbráculum.'
  "6": Portæ fluviórum apértæ sunt, et templum ad solum dírutum.
  "7": 'Et miles captívus abdúctus est: et ancíllæ eius minabántur geméntes ut colúmbæ, murmurántes in córdibus suis.'
  "8": 'Et Nínive quasi piscína aquárum aquæ eius: ipsi vero fugérunt: state, state, et non est qui revertátur.'
  "9": 'Dirípite argéntum, dirípite aurum: et non est finis divitiárum ex ómnibus vasis desiderabílibus.'
  "10": 'Dissipáta est, et scissa, et dilaceráta: et cor tabéscens, et dissolútio geniculórum, et deféctio in cunctis rénibus: et fácies ómnium eórum sicut nigrédo ollæ.'
  "11": Ubi est habitáculum leónum, et páscua catulórum leónum, ad quam ivit leo ut ingrederétur illuc, cátulus leónis, et non est qui extérreat?
  "12": 'Leo cepit sufficiénter cátulis suis, et necávit leǽnis suis: et implévit præda spelúncas suas, et cubíle suum rapína.'
  "13": 'Ecce ego ad te, dicit Dóminus exercítuum, et succéndam usque ad fumum quadrígas tuas, et leúnculos tuos cómedet gládius: et exterminábo de terra prædam tuam, et non audiétur ultra vox nuntiórum tuórum.'
