bible: vulgate
lang: la
language: Latina
book: Ecclesiasticus
chapter: "45"
verses:
  "1": 'Diléctus Deo et homínibus Móyses: cuius memória in benedictióne est.'
  "2": Símilem illum fecit in glória sanctórum, et magnificávit eum in timóre inimicórum, et in verbis suis monstra placávit.
  "3": Glorificávit illum in conspéctu regum, et iussit illi coram pópulo suo, et osténdit illi glóriam suam.
  "4": In fide et lenitáte ipsíus sanctum fecit illum, et elégit eum ex omni carne.
  "5": Audívit enim eum, et vocem ipsíus, et indúxit illum in nubem.
  "6": Et dedit illi coram præcépta, et legem vitæ et disciplínæ, docére Iacob testaméntum suum, et iudícia sua Israel.
  "7": 'Excélsum fecit Aaron fratrem eius, et símilem sibi de tribu Levi:'
  "8": 'státuit ei testaméntum ætérnum, et dedit illi sacerdótium gentis: et beatificávit illum in glória,'
  "9": et circumcínxit eum zona glóriæ, et índuit eum stolam glóriæ, et coronávit eum in vasis virtútis.
  "10": 'Circúmpedes, et femorália, et humerále pósuit ei: et cinxit illum tintinnábulis áureis plúrimis in gyro,'
  "11": dare sónitum in incéssu suo, audítum fácere sónitum in templo in memóriam fíliis gentis suæ.
  "12": 'Stolam sanctam auro, et hyacíntho, et púrpura, opus téxtile viri sapiéntis, iudício et veritáte prǽditi:'
  "13": torto cocco opus artíficis, gemmis pretiósis figurátis in ligatúra auri, et ópere lapidárii sculptis, in memóriam secúndum númerum tríbuum Israel.
  "14": 'Coróna áurea super mitram eius expréssa signo sanctitátis, et glória honóris: opus virtútis, et desidéria oculórum ornáta.'
  "15": Sic pulchra ante ipsum non fuérunt tália usque ad oríginem.
  "16": Non est indútus illa alienígena áliquis, sed tantum fílii ipsíus soli, et nepótes eius per omne tempus.
  "17": Sacrifícia ipsíus consúmpta sunt igne quotídie.
  "18": Complévit Móyses manus eius, et unxit illum óleo sancto.
  "19": Factum est illi in testaméntum ætérnum, et sémini eius, sicut dies cæli, fungi sacerdótio, et habére laudem, et glorificáre pópulum suum in nómine eius.
  "20": 'Ipsum elégit ab omni vivénte, offérre sacrifícium Deo, incénsum, et bonum odórem, in memóriam placáre pro pópulo suo:'
  "21": 'et dedit illi in præcéptis suis potestátem, in testaméntis iudiciórum: docére Iacob testimónia, et in lege sua lucem dare Israel.'
  "22": Quia contra illum stetérunt aliéni, et propter invídiam circumdedérunt illum hómines in desérto, qui erant cum Dathan et Abiron, et congregátio Core in iracúndia.
  "23": Vidit Dóminus Deus, et non plácuit illi, et consúmpti sunt in ímpetu iracúndiæ.
  "24": Fecit illis monstra, et consúmpsit illos in flamma ignis.
  "25": Et áddidit Aaron glóriam, et dedit illi hereditátem, et primítias frugum terræ divísit illi.
  "26": 'Panem ipsis in primis parávit in satietátem: nam et sacrifícia Dómini edent, quæ dedit illi et sémini eius.'
  "27": 'Céterum in terra gentes non hereditábit, et pars non est illi in gente: ipse est enim pars eius, et heréditas.'
  "28": 'Phínees, fílius Eleázari, tértius in glória est, imitándo eum in timóre Dómini:'
  "29": 'et stare in reveréntia gentis: in bonitáte et alacritáte ánimæ suæ plácuit Deo pro Israel.'
  "30": Ideo státuit illi testaméntum pacis, príncipem sanctórum et gentis suæ, ut sit illi et sémini eius sacerdótii dígnitas in ætérnum.
  "31": 'Et testaméntum David regi fílio Iesse de tribu Iuda, heréditas ipsi et sémini eius: ut daret sapiéntiam in cor nostrum iudicáre gentem suam in iustítia, ne aboleréntur bona ipsórum, et glóriam ipsórum in gentem eórum ætérnam fecit.'
