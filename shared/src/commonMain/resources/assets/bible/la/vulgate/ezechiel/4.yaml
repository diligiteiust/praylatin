bible: vulgate
lang: la
language: Latina
book: Ezechiel
chapter: "4"
verses:
  "1": 'Et tu fili hóminis, sume tibi láterem, et pones eum coram te: et descríbes in eo civitátem Ierúsalem.'
  "2": Et ordinábis advérsus eam obsidiónem, et ædificábis munitiónes, et comportábis ággerem, et dabis contra eam castra, et pones aríetes in gyro.
  "3": 'Et tu sume tibi sartáginem férream, et pones eam in murum férreum inter te et inter civitátem: et obfirmábis fáciem tuam ad eam, et erit in obsidiónem, et circúmdabis eam: signum est dómui Israel.'
  "4": 'Et tu dórmies super latus tuum sinístrum, et pones iniquitátes domus Israel super eo, número diérum quibus dórmies super illud: et assúmes iniquitátem eórum.'
  "5": 'Ego autem dedi tibi annos iniquitátis eórum, número diérum trecéntos et nonagínta dies: et portábis iniquitátem domus Israel.'
  "6": 'Et cum compléveris hæc, dórmies super latus tuum déxterum secúndo, et assúmes iniquitátem domus Iuda quadragínta diébus: diem pro anno, diem, inquam, pro anno dedi tibi.'
  "7": 'Et ad obsidiónem Ierúsalem convértes fáciem tuam, et bráchium tuum erit exténtum: et prophetábis advérsus eam.'
  "8": 'Ecce circúmdedi te vínculis: et non te convértes a látere tuo in latus áliud, donec cómpleas dies obsidiónis tuæ.'
  "9": 'Et tu sume tibi fruméntum, et hórdeum, et fabam, et lentem, et mílium, et víciam: et mittes ea in vas unum, et fácies tibi panes número diérum, quibus dórmies super latus tuum: trecéntis et nonagínta diébus cómedes illud.'
  "10": 'Cibus autem tuus, quo vescéris, erit in póndere vigínti statéres in die: a témpore usque ad tempus cómedes illud.'
  "11": 'Et aquam in mensúra bibes, sextam partem hin: a témpore usque ad tempus bibes illud.'
  "12": 'Et quasi subcinerícium hordeáceum cómedes illud: et stércore, quod egréditur de hómine, opéries illud in óculis eórum.'
  "13": 'Et dixit Dóminus: Sic cómedent fílii Israel panem suum pollútum inter gentes, ad quas eíciam eos.'
  "14": 'Et dixi: A a a, Dómine Deus, ecce ánima mea non est pollúta: et morticínum, et lacerátum a béstiis non comédi ab infántia mea usque nunc, et non est ingréssa in os meum omnis caro immúnda.'
  "15": 'Et dixit ad me: Ecce dedi tibi fimum boum pro stercóribus humánis: et fácies panem tuum in eo.'
  "16": 'Et dixit ad me: Fili hóminis, ecce ego cónteram báculum panis in Ierúsalem: et cómedent panem in póndere, et in sollicitúdine: et aquam in mensúra, et in angústia bibent:'
  "17": 'ut deficiéntibus pane et aqua, córruat unusquísque ad fratrem suum: et contabéscant in iniquitátibus suis.'
