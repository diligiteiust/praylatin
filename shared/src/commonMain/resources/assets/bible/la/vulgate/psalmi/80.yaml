bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "80"
verses:
  "1": In finem, Pro torculáribus, Psalmus ipsi Asaph.
  "2": 'Exsultáte Deo adiutóri nostro: iubiláte Deo Iacob.'
  "3": 'Súmite psalmum, et date týmpanum: psaltérium iucúndum cum cíthara.'
  "4": 'Buccináte in neoménia tuba, in insígni die solemnitátis vestræ:'
  "5": 'quia præcéptum in Israel est: et iudícium Deo Iacob.'
  "6": 'Testimónium in Ioseph pósuit illud, cum exíret de terra Ægýpti: linguam, quam non nóverat, audívit.'
  "7": 'Divértit ab onéribus dorsum eius: manus eius in cóphino serviérunt.'
  "8": 'In tribulatióne invocásti me: et liberávi te: exaudívi te in abscóndito tempestátis: probávi te apud aquam contradictiónis.'
  "9": 'Audi pópulus meus et contestábor te: Israel si audíeris me,'
  "10": non erit in te deus recens, neque adorábis deum aliénum.
  "11": 'Ego enim sum Dóminus Deus tuus, qui edúxi te de terra Ægýpti: diláta os tuum, et implébo illud.'
  "12": 'Et non audívit pópulus meus vocem meam: et Israel non inténdit mihi.'
  "13": 'Et dimísi eos secúndum desidéria cordis eórum: ibunt in adinventiónibus suis.'
  "14": 'Si pópulus meus audísset me: Israel si in viis meis ambulásset:'
  "15": 'pro níhilo fórsitan inimícos eórum humiliássem: et super tribulántes eos misíssem manum meam.'
  "16": 'Inimíci Dómini mentíti sunt ei: et erit tempus eórum in sǽcula.'
  "17": 'Et cibávit eos ex ádipe fruménti: et de petra, melle saturávit eos.'
