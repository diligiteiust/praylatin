bible: vulgate
lang: la
language: Latina
book: Deuteronomium
chapter: "21"
verses:
  "1": Quando invéntum fúerit in terra, quam Dóminus Deus tuus datúrus est tibi, hóminis cadáver occísi, et ignorábitur cædis reus,
  "2": 'egrediéntur maióres natu, et iúdices tui, et metiéntur a loco cadáveris singulárum per circúitum spátia civitátum:'
  "3": et quam viciniórem céteris esse perspéxerint, senióres civitátis illíus tollent vítulam de arménto, quæ non traxit iugum, nec terram scidit vómere,
  "4": 'et ducent eam ad vallem ásperam atque saxósam, quæ numquam aráta est, nec seméntem recépit: et cædent in ea cervíces vítulæ:'
  "5": accedéntque sacerdótes fílii Levi, quos elégerit Dóminus Deus tuus ut minístrent ei, et benedícant in nómine eius, et ad verbum eórum omne negótium, et quidquid mundum, vel immúndum est, iudicétur.
  "6": Et vénient maióres natu civitátis illíus ad interféctum, lavabúntque manus suas super vítulam, quæ in valle percússa est,
  "7": 'et dicent: Manus nostræ non effudérunt sánguinem hunc, nec óculi vidérunt.'
  "8": 'Propítius esto pópulo tuo Israel, quem redemísti Dómine, et ne réputes sánguinem innocéntem in médio pópuli tui Israel. Et auferétur ab eis reátus sánguinis:'
  "9": tu autem aliénus eris ab innocéntis cruóre, qui fusus est, cum féceris quod præcépit Dóminus.
  "10": Si egréssus fúeris ad pugnam contra inimícos tuos, et tradíderit eos Dóminus Deus tuus in manu tua, captivósque dúxeris,
  "11": et víderis in número captivórum mulíerem pulchram, et adamáveris eam, voluerísque habére uxórem,
  "12": 'introdúces eam in domum tuam: quæ radet cæsáriem, et circumcídet ungues,'
  "13": 'et depónet vestem, in qua capta est: sedénsque in domo tua, flebit patrem et matrem suam uno mense: et póstea intrábis ad eam, dormiésque cum illa, et erit uxor tua.'
  "14": 'Si autem póstea non séderit ánimo tuo, dimíttes eam líberam, nec véndere póteris pecúnia, nec opprímere per poténtiam: quia humiliásti eam.'
  "15": Si habúerit homo uxóres duas, unam diléctam, et álteram odiósam, genueríntque ex eo líberos, et fúerit fílius odiósæ primogénitus,
  "16": 'voluerítque substántiam inter fílios suos divídere: non póterit fílium diléctæ fácere primogénitum, et præférre fílio odiósæ:'
  "17": 'sed fílium odiósæ agnóscet primogénitum, dabítque ei de his quæ habúerit cuncta duplícia: iste est enim princípium liberórum eius, et huic debéntur primogénita.'
  "18": 'Si genúerit homo fílium contumácem et protérvum, qui non áudiat patris aut matris impérium, et coércitus obedíre contémpserit:'
  "19": apprehéndent eum, et ducent ad senióres civitátis illíus, et ad portam iudícii,
  "20": 'dicéntque ad eos: Fílius noster iste protérvus et cóntumax est: mónita nostra audíre contémnit, comessatiónibus vacat, et luxúriæ atque convíviis:'
  "21": lapídibus eum óbruet pópulus civitátis, et moriétur, ut auferátis malum de médio vestri, et univérsus Israel áudiens pertiméscat.
  "22": 'Quando peccáverit homo quod morte plecténdum est, et adiudicátus morti appénsus fúerit in patíbulo:'
  "23": 'non permanébit cadáver eius in ligno, sed in eádem die sepeliétur: quia maledíctus a Deo est qui pendet in ligno: et nequáquam contaminábis terram tuam, quam Dóminus Deus tuus déderit tibi in possessiónem.'
