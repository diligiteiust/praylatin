bible: vulgate
lang: la
language: Latina
book: I Paralipomenon
chapter: "7"
verses:
  "1": 'Porro fílii Issachar: Thola, et Phua, Iasub, et Símeron, quátuor.'
  "2": 'Fílii Thola: Ozi, et Raphaía, et Iériel, et Iémai, et Iebsem, et Sámuel, príncipes per domos cognatiónum suárum. De stirpe Thola viri fortíssimi numeráti sunt in diébus David, vigínti duo míllia sexcénti.'
  "3": 'Fílii Ozi: Izrahía, de quo nati sunt Míchael, et Obadía, et Ioel, et Iesía, quinque omnes príncipes.'
  "4": 'Cumque eis per famílias et pópulos suos, accíncti ad prœ́lium, viri fortíssimi, trigínta sex míllia: multas enim habuérunt uxóres, et fílios.'
  "5": Fratres quoque eórum per omnem cognatiónem Issachar robustíssimi ad pugnándum, octogínta septem míllia numeráti sunt.
  "6": 'Fílii Béniamin: Bela, et Bechor, et Iádihel, tres.'
  "7": 'Fílii Bela: Esbon, et Ozi, et Oziel, et Iérimoth, et Urai, quinque príncipes familiárum, et ad pugnándum robustíssimi: númerus autem eórum, vigínti duo míllia et trigínta quátuor.'
  "8": 'Porro fílii Bechor: Zamíra, et Ioas, et Eliézer, et Elioénai, et Amri, et Iérimoth, et Abía, et Anathoth, et Almath: omnes hi fílii Bechor.'
  "9": Numeráti sunt autem per famílias suas príncipes cognatiónum suárum ad bella fortíssimi, vigínti míllia et ducénti.
  "10": 'Porro fílii Iádihel: Balan. Fílii autem Balan: Iehus, et Béniamin, et Aod, et Chánana, et Zethan, et Tharsis, et Ahísahar:'
  "11": omnes hi fílii Iádihel, príncipes cognatiónum suárum viri fortíssimi, decem et septem míllia et ducénti ad prœ́lium procedéntes.
  "12": 'Sepham quoque et Hapham fílii Hir: et Hasim fílii Aher.'
  "13": 'Fílii autem Néphthali: Iáziel, et Guni, et Ieser, et Sellum, fílii Bala.'
  "14": 'Porro fílius Manásse, Esriel: concubináque eius Syra péperit Machir patrem Gálaad.'
  "15": 'Machir autem accépit uxóres fíliis suis Happhim, et Saphan: et hábuit sorórem nómine Máacha: nomen autem secúndi, Sálphaad, natǽque sunt Sálphaad fíliæ.'
  "16": 'Et péperit Máacha uxor Machir fílium, vocavítque nomen eius Phares: porro nomen fratris eius, Sares: et fílii eius, Ulam, et Recen.'
  "17": 'Fílius autem Ulam, Badan: hi sunt fílii Gálaad, fílii Machir, fílii Manásse.'
  "18": Soror autem eius Regína péperit Virum decórum, et Abiézer, et Móhola.
  "19": Erant autem fílii Semída, Ahin, et Sechem, et Leci, et Aníam.
  "20": 'Fílii autem Ephraim: Súthala, Bared fílius eius, Thahath fílius eius, Elada fílius eius, Thahath fílius eius, huius fílius Zabad,'
  "21": 'et huius fílius Súthula, et huius fílius Ezer et Elad: occidérunt autem eos viri Geth indígenæ, quia descénderant ut inváderent possessiónes eórum.'
  "22": Luxit ígitur Ephraim pater eórum multis diébus, et venérunt fratres eius ut consolaréntur eum.
  "23": 'Ingressúsque est ad uxórem suam: quæ concépit, et péperit fílium, et vocávit nomen eius Béria, eo quod in malis domus eius ortus esset:'
  "24": fília autem eius fuit Sara, quæ ædificávit Béthoron inferiórem et superiórem, et Ozénsara.
  "25": Porro fílius eius Rapha, et Reseph, et Thale, de quo natus est Thaan,
  "26": 'qui génuit Láadan: huius quoque fílius Ammiud, qui génuit Elísama,'
  "27": de quo ortus est Nun, qui hábuit fílium Iósue.
  "28": Posséssio autem eórum et habitátio, Bethel cum filiábus suis, et contra oriéntem Noran, ad occidentálem plagam Gazer et fíliæ eius, Sichem quoque cum filiábus suis, usque ad Aza cum filiábus eius.
  "29": 'Iuxta fílios quoque Manásse, Bethsan et fílias eius, Thanach et fílias eius, Magéddo et fílias eius, Dor et fílias eius: in his habitavérunt fílii Ioseph, fílii Israel.'
  "30": 'Fílii Aser: Iemna, et Iésua, et Iéssui, et Baría, et Sara soror eórum.'
  "31": 'Fílii autem Baría: Heber, et Mélchiel: ipse est pater Bársaith.'
  "32": Heber autem génuit Iephlat, et Somer, et Hotham, et Súaa sorórem eórum.
  "33": 'Fílii Iephlat: Phosech, et Chámaal, et Asoth: hi fílii Iephlat.'
  "34": 'Porro fílii Somer: Ahi, et Róaga, et Haba, et Aram.'
  "35": 'Fílii autem Helem fratris eius: Supha, et Iemna, et Selles, et Amal.'
  "36": 'Fílii Supha: Sue, Hárnapher, et Sual, et Beri, et Iamra,'
  "37": Bosor, et Hod, et Samma, et Sálusa, et Iethran, et Bera.
  "38": 'Fílii Iether: Iéphone, et Phaspha, et Ara.'
  "39": 'Fílii autem Olla: Arée, et Hániel, et Résia.'
  "40": 'Omnes hi fílii Aser, príncipes cognatiónum, elécti atque fortíssimi duces ducum: númerus autem eórum ætátis, quæ apta esset ad bellum, vigínti sex míllia.'
