bible: vulgate
lang: la
language: Latina
book: Lucas
chapter: "16"
verses:
  "1": 'Dicébat autem et ad discípulos suos: Homo quidam erat dives, qui habébat víllicum: et hic diffamátus est apud illum quasi dissipásset bona ipsíus.'
  "2": 'Et vocávit illum, et ait illi: Quid hoc áudio de te? redde ratiónem villicatiónis tuæ: iam enim non póteris villicáre.'
  "3": 'Ait autem víllicus intra se: Quid fáciam, quia dóminus meus aufert a me villicatiónem? Fódere non váleo, mendicáre erubésco.'
  "4": Scio quid fáciam, ut, cum amótus fúero a villicatióne, recípiant me in domos suas.
  "5": 'Convocátis ítaque síngulis debitóribus dómini sui, dicébat primo: Quantum debes dómino meo?'
  "6": 'At ille dixit: Centum cados ólei. Dixítque illi: Accipe cautiónem tuam: et sede cito, scribe quinquagínta.'
  "7": 'Deínde álii dixit: Tu vero quantum debes? Qui ait: Centum coros trítici. Ait illi: Accipe lítteras tuas, et scribe octogínta.'
  "8": 'Et laudávit dóminus víllicum iniquitátis, quia prudénter fecísset: quia fílii huius sǽculi prudentióres fíliis lucis in generatióne sua sunt.'
  "9": 'Et ego vobis dico: fácite vobis amícos de mammóna iniquitátis: ut, cum defecéritis, recípiant vos in ætérna tabernácula.'
  "10": 'Qui fidélis est in mínimo, et in maióri fidélis est: et qui in módico iníquus est, et in maióri iníquus est.'
  "11": 'Si ergo in iníquo mammóna fidéles non fuístis: quod verum est, quis credet vobis?'
  "12": 'Et si in aliéno fidéles non fuístis: quod vestrum est, quis dabit vobis?'
  "13": 'Nemo servus potest duóbus dóminis servíre: aut enim unum ódiet, et álterum díliget: aut uni adhærébit, et álterum contémnet. Non potéstis Deo servíre, et mammónæ.'
  "14": 'Audiébant autem ómnia hæc Pharisǽi, qui erant avári: et deridébant illum.'
  "15": 'Et ait illis: Vos estis, qui iustificátis vos coram homínibus: Deus autem novit corda vestra: quia quod homínibus altum est, abominátio est ante Deum.'
  "16": 'Lex, et prophétæ usque ad Ioánnem: ex eo regnum Dei evangelizátur, et omnis in illud vim facit.'
  "17": Facílius est autem cælum, et terram præteríre, quam de lege unum ápicem cádere.
  "18": 'Omnis, qui dimíttit uxórem suam, et álteram ducit, mœchátur: et qui dimíssam a viro ducit, mœchátur.'
  "19": Homo quidam erat dives, qui induebátur púrpura et bysso, et epulabátur quotídie spléndide.
  "20": Et erat quidam mendícus, nómine Lázarus, qui iacébat ad iánuam eius, ulcéribus plenus,
  "21": 'cúpiens saturári de micis, quæ cadébant de mensa dívitis, et nemo illi dabat: sed et canes veniébant, et lingébant úlcera eius.'
  "22": Factum est autem ut morerétur mendícus, et portarétur ab ángelis in sinum Abrahæ. Mórtuus est autem et dives, et sepúltus est in inférno.
  "23": 'Elevans autem óculos suos, cum esset in torméntis, vidit Abraham a longe, et Lázarum in sinu eius:'
  "24": 'et ipse clamans dixit: Pater Abraham, miserére mei, et mitte Lázarum ut intíngat extrémum dígiti sui in aquam, ut refrígeret linguam meam, quia crúcior in hac flamma.'
  "25": 'Et dixit illi Abraham: Fili, recordáre quia recepísti bona in vita tua, et Lázarus simíliter mala: nunc autem hic consolátur, tu vero cruciáris:'
  "26": 'et in his ómnibus inter nos, et vos chaos magnum firmátum est: ut hi, qui volunt hinc transíre ad vos, non possint, neque inde huc transmeáre.'
  "27": 'Et ait: Rogo ergo te pater ut mittas eum in domum patris mei:'
  "28": 'hábeo enim quinque fratres: ut testétur illis, ne et ipsi véniant in hunc locum tormentórum.'
  "29": 'Et ait illi Abraham: Habent Móysen, et prophétas: áudiant illos.'
  "30": 'At ille dixit: Non, pater Abraham: sed si quis ex mórtuis íerit ad eos, pœniténtiam agent.'
  "31": 'Ait autem illi: Si Móysen, et prophétas non áudiunt, neque si quis ex mórtuis resurréxerit, credent.'
