bible: vulgate
lang: la
language: Latina
book: ad Galatas
chapter: "2"
verses:
  "1": Deínde post annos quatuórdecim, íterum ascéndi Ierosólymam cum Bárnaba, assúmpto et Tito.
  "2": 'Ascéndi autem secúndum revelatiónem: et cóntuli cum illis Evangélium, quod prǽdico in géntibus, seórsum autem iis, qui videbántur áliquid esse: ne forte in vácuum cúrrerem, aut cucurríssem.'
  "3": 'Sed neque Titus, qui mecum erat, cum esset gentílis, compúlsus est circumcídi:'
  "4": sed propter subintrodúctos falsos fratres, qui subintroiérunt exploráre libertátem nostram, quam habémus in Christo Iesu, ut nos in servitútem redígerent.
  "5": 'Quibus neque ad horam céssimus subiectióne, ut véritas Evangélii permáneat apud vos:'
  "6": 'ab iis autem, qui videbántur esse áliquid (quales aliquándo fúerint, nihil mea ínterest: Deus persónam hóminis non áccipit): mihi enim qui videbántur esse áliquid, nihil contulérunt.'
  "7": Sed ecóntra cum vidíssent quod créditum est mihi Evangélium præpútii, sicut et Petro circumcisiónis
  "8": '(qui enim operátus est Petro in apostolátum circumcisiónis, operátus est et mihi inter gentes):'
  "9": 'et cum cognovíssent grátiam, quæ data est mihi, Iacóbus, et Cephas, et Ioánnes, qui videbántur colúmnæ esse, dextras dedérunt mihi, et Bárnabæ societátis: ut nos in gentes, ipsi autem in circumcisiónem:'
  "10": tantum ut páuperum mémores essémus, quod étiam sollícitus fui hoc ipsum fácere.
  "11": Cum autem venísset Cephas Antiochíam, in fáciem ei réstiti, quia reprehensíbilis erat.
  "12": 'Prius enim quam venírent quidam a Iacóbo, cum géntibus edébat: cum autem veníssent, subtrahébat, et segregábat se, timens eos, qui ex circumcisióne erant.'
  "13": Et simulatióni eius consensérunt céteri Iudǽi, ita ut et Bárnabas ducerétur ab eis in illam simulatiónem.
  "14": 'Sed cum vidíssem quod non recte ambulárent ad veritátem Evangélii, dixi Cephæ coram ómnibus: Si tu, cum Iudǽus sis, gentíliter vivis, et non Iudáice: quómodo gentes cogis iudaizáre?'
  "15": Nos natúra Iudǽi, et non ex géntibus peccatóres.
  "16": 'Sciéntes autem quod non iustificátur homo ex opéribus legis, nisi per fidem Iesu Christi: et nos in Christo Iesu crédimus, ut iustificémur ex fide Christi, et non ex opéribus legis: propter quod ex opéribus legis non iustificábitur omnis caro.'
  "17": Quod si quæréntes iustificári in Christo, invénti sumus et ipsi peccatóres, numquid Christus peccáti miníster est? Absit.
  "18": 'Si enim quæ destrúxi, íterum hæc ædífico: prævaricatórem me constítuo.'
  "19": 'Ego enim per legem, legi mórtuus sum, ut Deo vivam: Christo confíxus sum cruci.'
  "20": 'Vivo autem, iam non ego: vivit vero in me Christus. Quod autem nunc vivo in carne: in fide vivo Fílii Dei, qui diléxit me, et trádidit semetípsum pro me.'
  "21": Non abício grátiam Dei. Si enim per legem iustítia, ergo gratis Christus mórtuus est.
