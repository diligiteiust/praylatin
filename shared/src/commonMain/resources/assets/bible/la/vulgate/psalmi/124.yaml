bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "124"
verses:
  "1": 'Cánticum gráduum. Qui confídunt in Dómino, sicut mons Sion: non commovébitur in ætérnum, qui hábitat'
  "2": 'in Ierúsalem. Montes in circúitu eius: et Dóminus in circúitu pópuli sui, ex hoc nunc et usque in sǽculum.'
  "3": 'Quia non relínquet Dóminus virgam peccatórum super sortem iustórum: ut non exténdant iusti ad iniquitátem manus suas.'
  "4": Bénefac Dómine bonis, et rectis corde.
  "5": 'Declinántes autem in obligatiónes, addúcet Dóminus cum operántibus iniquitátem: pax super Israel.'
