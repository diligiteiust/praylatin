bible: vulgate
lang: la
language: Latina
book: Actus Apostolorum
chapter: "11"
verses:
  "1": Audiérunt autem Apóstoli, et fratres, qui erant in Iudǽa, quóniam et gentes recepérunt verbum Dei.
  "2": Cum autem ascendísset Petrus Ierosólymam, disceptábant advérsus illum qui erant ex circumcisióne,
  "3": 'dicéntes: Quare introísti ad viros præpútium habéntes, et manducásti cum illis?'
  "4": 'Incípiens autem Petrus exponébat illis órdinem, dicens:'
  "5": Ego eram in civitáte Ioppe orans, et vidi in excéssu mentis visiónem, descéndens vas quoddam velut línteum magnum quátuor inítiis summítti de cælo, et venit usque ad me.
  "6": In quod íntuens considerábam, et vidi quadrupédia terræ, et béstias, et reptília, et volatília cæli.
  "7": 'Audívi autem et vocem dicéntem mihi: Surge, Petre: occíde, et mandúca.'
  "8": 'Dixi autem: Nequáquam Dómine: quia commúne aut immúndum numquam introívit in os meum.'
  "9": 'Respóndit autem vox secúndo de cælo: Quæ Deus mundávit, tu ne commúne díxeris.'
  "10": 'Hoc autem factum est per ter: et recépta sunt ómnia rursum in cælum.'
  "11": Et ecce viri tres conféstim astitérunt in domo, in qua eram, missi a Cæsaréa ad me.
  "12": Dixit autem Spíritus mihi ut irem cum illis, nihil hǽsitans. Venérunt autem mecum et sex fratres isti, et ingréssi sumus in domum viri.
  "13": 'Narrávit autem nobis quómodo vidísset ángelum in domo sua, stantem et dicéntem sibi: Mitte in Ioppen, et accérsi Simónem, qui cognominátur Petrus,'
  "14": qui loquétur tibi verba, in quibus salvus eris tu, et univérsa domus tua.
  "15": Cum autem cœpíssem loqui, cécidit Spíritus sanctus super eos, sicut et in nos in inítio.
  "16": 'Recordátus sum autem verbi Dómini, sicut dicébat: Ioánnes quidem baptizávit aqua, vos autem baptizabímini Spíritu sancto.'
  "17": 'Si ergo eámdem grátiam dedit illis Deus, sicut et nobis, qui credídimus in Dóminum Iesum Christum: ego quis eram, qui possem prohibére Deum?'
  "18": 'His audítis, tacuérunt: et glorificavérunt Deum, dicéntes: Ergo et géntibus pœniténtiam dedit Deus ad vitam.'
  "19": Et illi quidem, qui dispérsi fúerant a tribulatióne, quæ facta fúerat sub Stéphano, perambulavérunt usque Phœnícen, et Cyprum, et Antiochíam, némini loquéntes verbum, nisi solis Iudǽis.
  "20": Erant autem quidam ex eis viri Cýprii et Cyrenǽi, qui cum introíssent Antiochíam, loquebántur et ad Græcos, annuntiántes Dóminum Iesum.
  "21": 'Et erat manus Dómini cum eis: multúsque númerus credéntium convérsus est ad Dóminum.'
  "22": 'Pervénit autem sermo ad aures ecclésiæ, quæ erat Ierosólymis super istis: et misérunt Bárnabam usque ad Antiochíam.'
  "23": 'Qui cum pervenísset, et vidísset grátiam Dei, gavísus est: et hortabátur omnes in propósito cordis permanére in Dómino:'
  "24": quia erat vir bonus, et plenus Spíritu sancto, et fide. Et appósita est multa turba Dómino.
  "25": 'Proféctus est autem Bárnabas Tarsum, ut quǽreret Saulum: quem cum invenísset, perdúxit Antiochíam.'
  "26": 'Et annum totum conversáti sunt ibi in Ecclésia: et docuérunt turbam multam, ita ut cognominaréntur primum Antiochíæ discípuli, Christiáni.'
  "27": 'In his autem diébus supervenérunt ab Ierosólymis prophétæ Antiochíam:'
  "28": et surgens unus ex eis nómine Agabus, significábat per Spíritum famem magnam futúram in univérso orbe terrárum, quæ facta est sub Cláudio.
  "29": 'Discípuli autem, prout quis habébat, proposuérunt sínguli in ministérium míttere habitántibus in Iudǽa frátribus:'
  "30": quod et fecérunt, mitténtes ad senióres per manus Bárnabæ, et Sauli.
