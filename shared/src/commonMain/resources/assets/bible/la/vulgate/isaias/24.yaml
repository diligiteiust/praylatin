bible: vulgate
lang: la
language: Latina
book: Isaias
chapter: "24"
verses:
  "1": Ecce Dóminus dissipábit terram, et nudábit eam, et afflíget fáciem eius, et dispérget habitatóres eius.
  "2": 'Et erit sicut pópulus, sic sacérdos: et sicut servus, sic dóminus eius: sicut ancílla, sic dómina eius: sicut emens, sic ille qui vendit: sicut fœnerátor, sic is qui mútuum áccipit: sicut qui répetit, sic qui debet.'
  "3": 'Dissipatióne dissipábitur terra, et direptióne prædábitur: Dóminus enim locútus est verbum hoc.'
  "4": 'Luxit, et deflúxit terra, et infirmáta est: deflúxit orbis, infirmáta est altitúdo pópuli terræ.'
  "5": Et terra infécta est ab habitatóribus suis, quia transgréssi sunt leges, mutavérunt ius, dissipavérunt fœdus sempitérnum.
  "6": 'Propter hoc maledíctio vorábit terram, et peccábunt habitatóres eius: ideóque insánient cultóres eius, et relinquéntur hómines pauci.'
  "7": Luxit vindémia, infirmáta est vitis, ingemuérunt omnes qui lætabántur corde.
  "8": Cessávit gáudium tympanórum, quiévit sónitus lætántium, contícuit dulcédo cítharæ.
  "9": 'Cum cántico non bibent vinum: amára erit pótio bibéntibus illam.'
  "10": Attríta est cívitas vanitátis, clausa est omnis domus nullo introeúnte.
  "11": Clamor erit super vino in platéis, desérta est ómnia lætítia, translátum est gáudium terræ.
  "12": Relícta est in urbe solitúdo, et calámitas ópprimet portas.
  "13": 'Quia hæc erunt in médio terræ in médio populórum: quómodo si paucæ olívæ, quæ remansérunt, excutiántur ex ólea: et racémi, cum fúerit finíta vindémia.'
  "14": 'Hi levábunt vocem suam, atque laudábunt: cum glorificátus fúerit Dóminus, hínnient de mari.'
  "15": 'Propter hoc in doctrínis glorificáte Dóminum: in ínsulis maris nomen Dómini Dei Israel.'
  "16": 'A fínibus terræ laudes audívimus, glóriam iusti. Et dixi: Secrétum meum mihi, secrétum meum mihi, væ mihi: prævaricántes prævaricáti sunt, et prævaricatióne transgressórum prævaricáti sunt.'
  "17": Formído, et fóvea, et láqueus super te, qui habitátor es terræ.
  "18": 'Et erit: qui fúgerit a voce formídinis, cadet in fóveam: et qui se explicáverit de fóvea, tenébitur láqueo: quia cataráctæ de excélsis apértæ sunt, et concutiéntur fundaménta terræ.'
  "19": Confractióne confringétur terra, contritióne conterétur terra, commotióne commovébitur terra,
  "20": 'agitatióne agitábitur terra sicut ébrius, et auferétur quasi tabernáculum uníus noctis: et gravábit eam iníquitas sua, et córruet, et non adíciet ut resúrgat.'
  "21": 'Et erit: in die illa visitábit Dóminus super milítiam cæli in excélso: et super reges terræ, qui sunt super terram.'
  "22": Et congregabúntur in congregatióne uníus fascis in lacum, et claudéntur ibi in cárcere, et post multos dies visitabúntur.
  "23": Et erubéscet luna, et confundétur sol, cum regnáverit Dóminus exercítuum in monte Sion, et in Ierúsalem, et in conspéctu senum suórum fúerit glorificátus.
