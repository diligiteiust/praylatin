bible: vulgate
lang: la
language: Latina
book: Habacuc
chapter: "2"
verses:
  "1": 'Super custódiam meam stabo, et figam gradum super munitiónem: et contemplábor, ut vídeam quid dicátur mihi, et quid respóndeam ad arguéntem me.'
  "2": 'Et respóndit mihi Dóminus, et dixit: Scribe visum, et explána eum super tábulas: ut percúrrat qui légerit eum.'
  "3": 'Quia adhuc visus procul: et apparébit in finem, et non mentiétur: si moram fécerit, exspécta illum: quia véniens véniet, et non tardábit.'
  "4": 'Ecce qui incrédulus est, non erit recta ánima eius in semetípso: iustus autem in fide sua vivet.'
  "5": 'Et quómodo vinum potántem décipit: sic erit vir supérbus, et non decorábitur: qui dilatávit quasi inférnus ánimam suam: et ipse quasi mors, et non adimplétur: et congregábit ad se omnes gentes, et coacervábit ad se omnes pópulos.'
  "6": 'Numquid non omnes isti super eum parábolam sument, et loquélam ænígmatum eius: et dicétur: Væ ei, qui multíplicat non sua? úsquequo et ággravat contra se densum lutum?'
  "7": 'Numquid non repénte consúrgent qui mórdeant te: et suscitabúntur lacerántes te, et eris in rapínam eis?'
  "8": Quia tu spoliásti gentes multas, spoliábunt te omnes, qui réliqui fúerint de pópulis, propter sánguinem hóminis et iniquitátem terræ civitátis, et ómnium habitántium in ea.
  "9": Væ qui cóngregat avarítiam malam dómui suæ, ut sit in excélso nidus eius, et liberári se putat de manu mali.
  "10": Cogitásti confusiónem dómui tuæ, concidísti pópulos multos, et peccávit ánima tua.
  "11": 'Quia lapis de paríete clamábit: et lignum, quod inter iunctúras ædificiórum est, respondébit.'
  "12": Væ qui ædíficat civitátem in sanguínibus, et prǽparat urbem in iniquitáte.
  "13": Numquid non hæc sunt a Dómino exercítuum? Laborábunt enim pópuli in multo igne, et gentes in vácuum, et defícient.
  "14": Quia replébitur terra, ut cognóscant glóriam Dómini, quasi aquæ operiéntes mare.
  "15": Væ qui potum dat amíco suo mittens fel suum, et inébrians ut aspíciat nuditátem eius.
  "16": 'Replétus es ignomínia pro glória: bibe tu quoque, et consopíre: circúmdabit te calix déxteræ Dómini, et vómitus ignomíniæ super glóriam tuam.'
  "17": Quia iníquitas Líbani opériet te, et vástitas animálium deterrébit eos de sanguínibus hóminum, et iniquitáte terræ, et civitátis, et ómnium habitántium in ea.
  "18": Quid prodest scúlptile, quia sculpsit illud fictor suus, conflátile, et imáginem falsam? quia sperávit in figménto fictor eius, ut fáceret simulácra muta.
  "19": 'Væ qui dicit ligno: Expergíscere: Surge, lápidi tacénti: numquid ipse docére póterit? Ecce iste coopértus est auro, et argénto: et omnis spíritus non est in viscéribus eius.'
  "20": 'Dóminus autem in templo sancto suo: síleat a fácie eius omnis terra.'
