bible: vulgate
lang: la
language: Latina
book: Genesis
chapter: "48"
verses:
  "1": 'His ita transáctis, nuntiátum est Ioseph quod ægrotáret pater suus: qui, assúmptis duóbus fíliis Manásse et Ephraim, ire perréxit.'
  "2": 'Dictúmque est seni: Ecce fílius tuus Ioseph venit ad te. Qui confortátus sedit in léctulo.'
  "3": 'Et ingrésso ad se ait: Deus omnípotens appáruit mihi in Luza, quæ est in terra Chánaan: benedixítque mihi,'
  "4": 'et ait: Ego te augébo et multiplicábo, et fáciam te in turbas populórum: dabóque tibi terram hanc, et sémini tuo post te in possessiónem sempitérnam.'
  "5": 'Duo ergo fílii tui, qui nati sunt tibi in terra Ægýpti ántequam huc venírem ad te, mei erunt: Ephraim et Manásses, sicut Ruben et Símeon reputabúntur mihi.'
  "6": Réliquos autem quos genúeris post eos, tui erunt, et nómine fratrum suórum vocabúntur in possessiónibus suis.
  "7": 'Mihi enim, quando veniébam de Mesopotámia, mórtua est Rachel in terra Chánaan in ipso itínere, erátque vernum tempus: et ingrediébar Ephratam, et sepelívi eam iuxta viam Ephratæ, quæ álio nómine appellátur Béthlehem.'
  "8": 'Videns autem fílios eius dixit ad eum: Qui sunt isti?'
  "9": 'Respóndit: Fílii mei sunt, quos donávit mihi Deus in hoc loco. Adduc, inquit, eos ad me, ut benedícam illis.'
  "10": Oculi enim Israel caligábant præ nímia senectúte, et clare vidére non póterat. Applicitósque ad se, deosculátus et circumpléxus eos,
  "11": 'dixit ad fílium suum: Non sum fraudátus aspéctu tuo: ínsuper osténdit mihi Deus semen tuum.'
  "12": Cumque tulísset eos Ioseph de grémio patris, adorávit pronus in terram.
  "13": 'Et pósuit Ephraim ad déxteram suam, id est, ad sinístram Israel: Manássen vero in sinístra sua, ad déxteram scílicet patris, applicuítque ambos ad eum.'
  "14": 'Qui exténdens manum déxteram, pósuit super caput Ephraim minóris fratris: sinístram autem super caput Manásse qui maior natu erat, commútans manus.'
  "15": 'Benedixítque Iacob fíliis Ioseph, et ait: Deus, in cuius conspéctu ambulavérunt patres mei Abraham, et Isaac, Deus qui pascit me ab adolescéntia mea usque in præséntem diem:'
  "16": 'ángelus, qui éruit me de cunctis malis, benedícat púeris istis: et invocétur super eos nomen meum, nómina quoque patrum meórum Abraham et Isaac, et crescant in multitúdinem super terram.'
  "17": 'Videns autem Ioseph quod posuísset pater suus déxteram manum super caput Ephraim, gráviter accépit: et apprehénsam manum patris leváre conátus est de cápite Ephraim, et transférre super caput Manásse.'
  "18": 'Dixítque ad patrem: Non ita cónvenit, pater: quia hic est primogénitus, pone déxteram tuam super caput eius.'
  "19": 'Qui rénuens, ait: Scio fili mi, scio: et iste quidem erit in pópulos, et multiplicábitur: sed frater eius minor, maior erit illo: et semen illíus crescet in gentes.'
  "20": 'Benedixítque eis in témpore illo, dicens: In te benedicétur Israel, atque dicétur: Fáciat tibi Deus sicut Ephraim, et sicut Manásse. Constituítque Ephraim ante Manássen.'
  "21": 'Et ait ad Ioseph fílium suum: En ego mórior, et erit Deus vobíscum, reducétque vos ad terram patrum vestrórum.'
  "22": Do tibi partem unam extra fratres tuos, quam tuli de manu Amorrhǽi in gládio et arcu meo.
