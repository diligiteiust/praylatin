bible: vulgate
lang: la
language: Latina
book: Ecclesiasticus
chapter: "51"
verses:
  "1": '[Orátio Iesu fílii Sirach:] Confitébor tibi Dómine rex, et collaudábo te Deum salvatórem meum.'
  "2": 'Confitébor nómini tuo: quóniam adiútor et protéctor factus es mihi,'
  "3": et liberásti corpus meum a perditióne, a láqueo linguæ iníquæ, et a lábiis operántium mendácium, et in conspéctu astántium factus es mihi adiútor.
  "4": Et liberásti me secúndum multitúdinem misericórdiæ nóminis tui a rugiéntibus, præparátis ad escam,
  "5": 'de mánibus quæréntium ánimam meam, et de portis tribulatiónum quæ circumdedérunt me:'
  "6": 'a pressúra flammæ, quæ circúmdedit me, et in médio ignis non sum æstuátus:'
  "7": 'de altitúdine ventris ínferi, et a lingua coinquináta, et a verbo mendácii, a rege iníquo, et a lingua iniústa:'
  "8": laudábit usque ad mortem ánima mea Dóminum,
  "9": et vita mea appropínquans erat in inférno deórsum.
  "10": Circumdedérunt me úndique, et non erat qui adiuváret. Respíciens eram ad adiutórium hóminum, et non erat.
  "11": 'Memorátus sum misericórdiæ tuæ Dómine, et operatiónis tuæ, quæ a sǽculo sunt:'
  "12": quóniam éruis sustinéntes te Dómine, et líberas eos de mánibus géntium.
  "13": Exaltásti super terram habitatiónem meam, et pro morte defluénte deprecátus sum.
  "14": Invocávi Dóminum patrem Dómini mei, ut non derelínquat me in die tribulatiónis meæ, et in témpore superbórum sine adiutório.
  "15": Laudábo nomen tuum assídue, et collaudábo illud in confessióne, et exaudíta est orátio mea.
  "16": Et liberásti me de perditióne, et eripuísti me de témpore iníquo.
  "17": Proptérea confitébor, et laudem dicam tibi, et benedícam nómini Dómini.
  "18": Cum adhuc iúnior essem, priúsquam oberrárem, quæsívi sapiéntiam palam in oratióne mea.
  "19": Ante templum postulábam pro illa, et usque in novíssimis inquíram eam. Et efflóruit tamquam præcox uva,
  "20": lætátum est cor meum in ea. Ambulávit pes meus iter rectum, a iuventúte mea investigábam eam.
  "21": Inclinávi módico aurem meam, et excépi illam.
  "22": Multam invéni in meípso sapiéntiam, et multum proféci in ea.
  "23": Danti mihi sapiéntiam, dabo glóriam.
  "24": 'Consiliátus sum enim ut fácerem illam: zelátus sum bonum, et non confúndar.'
  "25": Colluctáta est ánima mea in illa, et in faciéndo eam confirmátus sum.
  "26": Manus meas exténdi in altum, et insipiéntiam eius luxi.
  "27": Animam meam diréxi ad illam, et in agnitióne invéni eam.
  "28": 'Possédi cum ipsa cor ab inítio: propter hoc non derelínquar.'
  "29": 'Venter meus conturbátus est quæréndo illam: proptérea bonam possidébo possessiónem.'
  "30": 'Dedit mihi Dóminus linguam mercédem meam: et in ipsa laudábo eum.'
  "31": Appropiáte ad me indócti, et congregáte vos in domum disciplínæ.
  "32": Quid adhuc retardátis? et quid dícitis in his? ánimæ vestræ sítiunt veheménter.
  "33": 'Apérui os meum, et locútus sum: Comparáte vobis sine argénto,'
  "34": 'et collum vestrum subícite iugo, et suscípiat ánima vestra disciplínam: in próximo est enim inveníre eam.'
  "35": Vidéte óculis vestris, quia módicum laborávi, et invéni mihi multam réquiem.
  "36": Assúmite disciplínam in multo número argénti, et copiósum aurum possidéte in ea.
  "37": Lætétur ánima vestra in misericórdia eius, et non confundémini in laude ipsíus.
  "38": Operámini opus vestrum ante tempus, et dabit vobis mercédem vestram in témpore suo.
