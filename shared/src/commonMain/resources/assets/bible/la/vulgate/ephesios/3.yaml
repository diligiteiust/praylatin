bible: vulgate
lang: la
language: Latina
book: ad Ephesios
chapter: "3"
verses:
  "1": Huius rei grátia, ego Paulus vinctus Christi Iesu, pro vobis géntibus,
  "2": 'si tamen audístis dispensatiónem grátiæ Dei, quæ data est mihi in vobis:'
  "3": quóniam secúndum revelatiónem notum mihi factum est sacraméntum, sicut supra scripsi in brevi,
  "4": 'prout potéstis legéntes intellígere prudéntiam meam in mystério Christi:'
  "5": quod áliis generatiónibus non est ágnitum fíliis hóminum, sícuti nunc revelátum est sanctis apóstolis eius, et prophétis in Spíritu,
  "6": 'gentes esse coherédes, et concorporáles, et compartícipes promissiónis eius in Christo Iesu per Evangélium:'
  "7": cuius factus sum miníster secúndum donum grátiæ Dei, quæ data est mihi secúndum operatiónem virtútis eius.
  "8": Mihi ómnium sanctórum mínimo data est grátia hæc, in géntibus evangelizáre investigábiles divítias Christi,
  "9": 'et illumináre omnes, quæ sit dispensátio sacraménti abscónditi a sǽculis in Deo, qui ómnia creávit:'
  "10": ut innotéscat principátibus, et potestátibus in cæléstibus per Ecclésiam, multifórmis sapiéntia Dei,
  "11": 'secúndum præfinitiónem sæculórum, quam fecit in Christo Iesu Dómino nostro:'
  "12": in quo habémus fidúciam, et accéssum in confidéntia per fidem eius.
  "13": 'Propter quod peto ne deficiátis in tribulatiónibus meis pro vobis: quæ est glória vestra.'
  "14": Huius rei grátia flecto génua mea ad Patrem Dómini nostri Iesu Christi,
  "15": ex quo omnis patérnitas in cælis, et in terra nominátur,
  "16": ut det vobis secúndum divítias glóriæ suæ, virtúte corroborári per Spíritum eius in interiórem hóminem,
  "17": 'Christum habitáre per fidem in córdibus vestris: in caritáte radicáti, et fundáti,'
  "18": 'ut possítis comprehéndere cum ómnibus sanctis, quæ sit latitúdo, et longitúdo, et sublímitas, et profúndum:'
  "19": scire étiam supereminéntem sciéntiæ caritátem Christi, ut impleámini in omnem plenitúdinem Dei.
  "20": 'Ei autem, qui potens est ómnia fácere superabundánter quam pétimus aut intellígimus, secúndum virtútem, quæ operátur in nobis:'
  "21": ipsi glória in Ecclésia, et in Christo Iesu, in omnes generatiónes sǽculi sæculórum. Amen.
