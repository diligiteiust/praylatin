bible: vulgate
lang: la
language: Latina
book: I Samuelis
chapter: "30"
verses:
  "1": Cumque veníssent David et viri eius in Síceleg die tértia, Amalecítæ ímpetum fécerant ex parte austráli in Síceleg, et percússerant Síceleg, et succénderant eam igni.
  "2": 'Et captívas dúxerant mulíeres ex ea, a mínimo usque ad magnum: et non interfécerant quemquam, sed secum dúxerant, et pergébant itínere suo.'
  "3": Cum ergo veníssent David et viri eius ad civitátem, et inveníssent eam succénsam igni, et uxóres suas, et fílios suos, et fílias ductas esse captívas,
  "4": levavérunt David et pópulus qui erat cum eo voces suas, et planxérunt donec defícerent in eis lácrymæ.
  "5": Síquidem et duæ uxóres David captívæ ductæ fúerant, Achínoam Iezrahelítes, et Abígail uxor Nabal Carméli.
  "6": 'Et contristátus est David valde: volébat enim eum pópulus lapidáre, quia amára erat ánima uniuscuiúsque viri super fíliis suis, et filiábus: confortátus est autem David in Dómino Deo suo.'
  "7": 'Et ait ad Abíathar sacerdótem fílium Achímelech: Applica ad me ephod. Et applicávit Abíathar ephod ad David.'
  "8": 'Et consúluit David Dóminum, dicens: Pérsequar latrúnculos hos, et comprehéndam eos, an non? Dixítque ei Dóminus: Perséquere: absque dúbio enim comprehéndes eos, et excúties prædam.'
  "9": 'Abiit ergo David ipse, et sexcénti viri qui erant cum eo, et venérunt usque ad torréntem Besor: et lassi quidam substitérunt.'
  "10": 'Persecútus est autem David ipse, et quadringénti viri: substíterant enim ducénti, qui lassi transíre non póterant torréntem Besor.'
  "11": 'Et invenérunt virum Ægýptium in agro, et adduxérunt eum ad David: dederúntque ei panem ut coméderet, et bíberet aquam,'
  "12": 'sed et fragmen massæ caricárum, et duas ligatúras uvæ passæ. Quæ cum comedísset, revérsus est spíritus eius, et refocillátus est: non enim coméderat panem, neque bíberat aquam, tribus diébus et tribus nóctibus.'
  "13": 'Dixit ítaque ei David: Cuius es tu? vel unde? et quo pergis? Qui ait: Puer Ægýptius ego sum, servus viri Amalecítæ: derelíquit autem me dóminus meus, quia ægrotáre cœpi nudiustértius.'
  "14": Síquidem nos erúpimus ad austrálem plagam Ceréthi, et contra Iudam, et ad merídiem Caleb, et Síceleg succéndimus igni.
  "15": 'Dixítque ei David: Potes me dúcere ad cúneum istum? Qui ait: Iura mihi per Deum, quod non occídas me, et non tradas me in manus dómini mei, et ego ducam te ad cúneum istum. Et iurávit ei David.'
  "16": Qui cum duxísset eum, ecce illi discumbébant super fáciem univérsæ terræ comedéntes et bibéntes, et quasi festum celebrántes diem, pro cuncta præda, et spóliis quæ céperant de terra Philísthiim et de terra Iuda.
  "17": Et percússit eos David a véspere usque ad vésperam altérius diéi, et non evásit ex eis quisquam, nisi quadringénti viri adolescéntes, qui ascénderant camélos, et fúgerant.
  "18": Eruit ergo David ómnia, quæ túlerant Amalecítæ, et duas uxóres suas éruit.
  "19": 'Nec défuit quidquam a parvo usque ad magnum, tam de fíliis quam de filiábus, et de spóliis, et quæcúmque rapúerant: ómnia redúxit David.'
  "20": 'Et tulit univérsos greges et arménta, et minávit ante fáciem suam: dixerúntque: Hæc est præda David.'
  "21": 'Venit autem David ad ducéntos viros, qui lassi substíterant, nec sequi potúerant David, et residére eos iússerat in torrénte Besor: qui egréssi sunt óbviam David, et pópulo qui erat cum eo. Accédens autem David ad pópulum, salutávit eos pacífice.'
  "22": 'Respondénsque omnis vir péssimus, et iníquus de viris, qui íerant cum David, dixit: Quia non venérunt nobíscum, non dábimus eis quidquam de præda, quam erúimus: sed suffíciat unicuíque uxor sua et fílii: quos cum accéperint, recédant.'
  "23": 'Dixit autem David: Non sic faciétis fratres mei, de his, quæ trádidit nobis Dóminus, et custodívit nos, et dedit latrúnculos, qui erúperant advérsum nos, in manus nostras:'
  "24": 'nec áudiet vos quisquam super sermóne hoc: æqua enim pars erit descendéntis ad prœ́lium, et remanéntis ad sárcinas, et simíliter dívident.'
  "25": Et factum est hoc ex die illa, et deínceps constitútum et præfinítum, et quasi lex in Israel usque in diem hanc.
  "26": 'Venit ergo David in Síceleg, et misit dona de præda senióribus Iuda próximis suis, dicens: Accípite benedictiónem de præda hóstium Dómini:'
  "27": his, qui erant in Bethel, et qui in Ramoth ad merídiem, et qui in Iether,
  "28": et qui in Aroer, et qui in Séphamoth, et qui in Esthamo,
  "29": et qui in Rachal, et qui in úrbibus Ierámeel, et qui in úrbibus Ceni,
  "30": et qui in Arama, et qui in lacu Asan, et qui in Athach,
  "31": et qui in Hebron, et réliquis qui erant in his locis, in quibus commorátus fúerat David ipse, et viri eius.
