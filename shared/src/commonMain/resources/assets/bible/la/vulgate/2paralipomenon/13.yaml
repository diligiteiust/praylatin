bible: vulgate
lang: la
language: Latina
book: II Paralipomenon
chapter: "13"
verses:
  "1": Anno octávo décimo regis Ieróboam, regnávit Abía super Iudam.
  "2": 'Tribus annis regnávit in Ierúsalem, noménque matris eius Michaía fília Uriel de Gábaa: et erat bellum inter Abíam et Ieróboam.'
  "3": 'Cumque iniísset Abía certámen, et habéret bellicosíssimos viros, et electórum quadringénta míllia: Ieróboam instrúxit ecóntra áciem octingénta míllia virórum, qui et ipsi elécti erant, et ad bella fortíssimi.'
  "4": 'Stetit ergo Abía super montem Sémeron, qui erat in Ephraim, et ait: Audi Ieróboam, et omnis Israel.'
  "5": Num ignorátis quod Dóminus Deus Israel déderit regnum David super Israel in sempitérnum, ipsi et fíliis eius in pactum salis?
  "6": Et surréxit Ieróboam fílius Nabat, servus Salomónis fílii David, et rebellávit contra dóminum suum.
  "7": 'Congregatíque sunt ad eum viri vaníssimi, et fílii Bélial: et prævaluérunt contra Róboam fílium Salomónis: porro Róboam erat rudis, et corde pávido, nec pótuit resístere eis.'
  "8": Nunc ergo vos dícitis quod resístere possítis regno Dómini, quod póssidet per fílios David, habetísque grandem pópuli multitúdinem, atque vítulos áureos, quos fecit vobis Ieróboam in deos.
  "9": 'Et eiecístis sacerdótes Dómini, fílios Aaron, atque Levítas, et fecístis vobis sacerdótes sicut omnes pópuli terrárum: quicúmque vénerit, et initiáverit manum suam in tauro de bobus, et in ariétibus septem, fit sacérdos eórum, qui non sunt dii.'
  "10": 'Noster autem Dóminus, Deus est, quem non relínquimus, sacerdotésque minístrant Dómino de fíliis Aaron, et Levítæ sunt in órdine suo:'
  "11": 'holocáusta quoque ófferunt Dómino per síngulos dies mane et véspere, et thymiáma iuxta legis præcépta conféctum, et proponúntur panes in mensa mundíssima, estque apud nos candelábrum áureum, et lucérnæ eius, ut accendántur semper ad vésperam: nos quippe custodímus præcépta Dómini Dei nostri, quem vos reliquístis.'
  "12": 'Ergo in exércitu nostro dux Deus est, et sacerdótes eius, qui clangunt tubis, et résonant contra vos: fílii Israel nolíte pugnáre contra Dóminum Deum patrum vestrórum, quia non vobis éxpedit.'
  "13": Hæc illo loquénte, Ieróboam retro moliebátur insídias. Cumque ex advérso hóstium staret, ignorántem Iudam suo ambiébat exércitu.
  "14": 'Respiciénsque Iudas, vidit instáre bellum ex advérso et post tergum, et clamávit ad Dóminum: ac sacerdótes tubis cánere cœpérunt.'
  "15": 'Omnésque viri Iuda vociferáti sunt: et ecce illis clamántibus, pertérruit Deus Ieróboam, et omnem Israel qui stabat ex advérso Abía et Iuda.'
  "16": Fugerúntque fílii Israel Iudam, et trádidit eos Deus in manu eórum.
  "17": 'Percússit ergo eos Abía, et pópulus eius plaga magna: et corruérunt vulneráti ex Israel quingénta míllia virórum fórtium.'
  "18": Humiliatíque sunt fílii Israel in témpore illo, et vehementíssime confortáti fílii Iuda, eo quod sperássent in Dómino Deo patrum suórum.
  "19": 'Persecútus est autem Abía fugiéntem Ieróboam, et cepit civitátes eius, Bethel et fílias eius, et Iésana cum filiábus suis, Ephron quoque et fílias eius:'
  "20": 'nec váluit ultra resístere Ieróboam in diébus Abía: quem percússit Dóminus, et mórtuus est.'
  "21": 'Igitur Abía, confortáto império suo, accépit uxóres quatuórdecim: procreavítque vigínti duos fílios, et sédecim fílias.'
  "22": Réliqua autem sermónum Abía, viarúmque et óperum eius, scripta sunt diligentíssime in libro Addo prophétæ.
