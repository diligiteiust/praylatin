bible: vulgate
lang: la
language: Latina
book: Proverbia
chapter: "11"
verses:
  "1": 'Statéra dolósa abominátio est apud Dóminum: et pondus æquum volúntas eius.'
  "2": 'Ubi fúerit supérbia, ibi erit et contumélia: ubi autem est humílitas, ibi et sapiéntia.'
  "3": 'Simplícitas iustórum díriget eos: et supplantátio perversórum vastábit illos.'
  "4": 'Non próderunt divítiæ in die ultiónis: iustítia autem liberábit a morte.'
  "5": 'Iustítia símplicis díriget viam eius: et in impietáte sua córruet ímpius.'
  "6": 'Iustítia rectórum liberábit eos: et in insídiis suis capiéntur iníqui.'
  "7": 'Mórtuo hómine ímpio, nulla erit ultra spes: et exspectátio sollicitórum períbit.'
  "8": 'Iustus de angústia liberátus est: et tradétur ímpius pro eo.'
  "9": 'Simulátor ore décipit amícum suum: iusti autem liberabúntur sciéntia.'
  "10": 'In bonis iustórum exsultábit cívitas: et in perditióne impiórum erit laudátio.'
  "11": 'Benedictióne iustórum exaltábitur cívitas: et ore impiórum subvertétur.'
  "12": 'Qui déspicit amícum suum índigens corde est: vir autem prudens tacébit.'
  "13": 'Qui ámbulat fraudulénter, revélat arcána: qui autem fidélis est ánimi, celat amíci commíssum.'
  "14": 'Ubi non est gubernátor, pópulus córruet: salus autem, ubi multa consília.'
  "15": 'Affligétur malo, qui fidem facit pro extráneo: qui autem cavet láqueos, secúrus erit.'
  "16": 'Múlier gratiósa invéniet glóriam: et robústi habébunt divítias.'
  "17": 'Benéfacit ánimæ suæ vir miséricors: qui autem crudélis est, étiam propínquos ábicit.'
  "18": 'Impius facit opus instábile: seminánti autem iustítiam merces fidélis.'
  "19": 'Cleméntia prǽparat vitam: et sectátio malórum mortem.'
  "20": 'Abominábile Dómino cor pravum: et volúntas eius in iis, qui simplíciter ámbulant.'
  "21": 'Manus in manu non erit ínnocens malus: semen autem iustórum salvábitur.'
  "22": Círculus áureus in náribus suis, múlier pulchra et fátua.
  "23": 'Desidérium iustórum omne bonum est: præstolátio impiórum furor.'
  "24": 'Alii dívidunt própria, et ditióres fiunt: álii rápiunt non sua, et semper in egestáte sunt.'
  "25": 'Anima, quæ benedícit, impinguábitur: et qui inébriat, ipse quoque inebriábitur.'
  "26": 'Qui abscóndit fruménta maledicétur in pópulis: benedíctio autem super caput vendéntium.'
  "27": 'Bene consúrgit dilúculo qui quærit bona: qui autem investigátor malórum est, opprimétur ab eis.'
  "28": 'Qui confídit in divítiis suis, córruet: iusti autem quasi virens fólium germinábunt.'
  "29": 'Qui contúrbat domum suam, possidébit ventos: et qui stultus est sérviet sapiénti.'
  "30": 'Fructus iusti lignum vitæ: et qui súscipit ánimas, sápiens est.'
  "31": 'Si iustus in terra récipit: quanto magis ímpius et peccátor?'
