bible: vulgate
lang: la
language: Latina
book: ad Corinthios II
chapter: "8"
verses:
  "1": 'Notam autem fácimus vobis, fratres, grátiam Dei, quæ data est in ecclésiis Macedóniæ:'
  "2": 'quod in multo experiménto tribulatiónis abundántia gáudii ipsórum fuit, et altíssima paupértas eórum abundávit in divítias simplicitátis eórum:'
  "3": quia secúndum virtútem testimónium illis reddo, et supra virtútem voluntárii fuérunt,
  "4": cum multa exhortatióne obsecrántes nos grátiam, et communicatiónem ministérii, quod fit in sanctos.
  "5": Et non sicut sperávimus, sed semetípsos dedérunt primum Dómino, deínde nobis per voluntátem Dei,
  "6": ita ut rogarémus Titum, ut quemádmodum cœpit, ita et perfíciat in vobis étiam grátiam istam.
  "7": Sed sicut in ómnibus abundátis fide, et sermóne, et sciéntia, et omni sollicitúdine, ínsuper et caritáte vestra in nos, ut et in hac grátia abundétis.
  "8": 'Non quasi ímperans dico: sed per aliórum sollicitúdinem, étiam vestræ caritátis ingénium bonum cómprobans.'
  "9": Scitis enim grátiam Dómini nostri Iesu Christi, quóniam propter vos egénus factus est, cum esset dives, ut illíus inópia vos dívites essétis.
  "10": 'Et consílium in hoc do: hoc enim vobis útile est, qui non solum fácere, sed et velle cœpístis ab anno prióre:'
  "11": 'nunc vero et facto perfícite: ut quemádmodum promptus est ánimus voluntátis, ita sit et perficiéndi ex eo, quod habétis.'
  "12": Si enim volúntas prompta est, secúndum id, quod habet, accépta est, non secúndum id, quod non habet.
  "13": Non enim ut áliis sit remíssio, vobis autem tribulátio, sed ex æqualitáte.
  "14": 'In præsénti témpore vestra abundántia illórum inópiam súppleat: ut et illórum abundántia vestræ inópiæ sit suppleméntum, ut fiat æquálitas, sicut scriptum est:'
  "15": 'Qui multum, non abundávit: et qui módicum, non minorávit.'
  "16": Grátias autem Deo, qui dedit eámdem sollicitúdinem pro vobis in corde Titi,
  "17": 'quóniam exhortatiónem quidem suscépit: sed cum sollicítior esset, sua voluntáte proféctus est ad vos.'
  "18": 'Mísimus étiam cum illo fratrem, cuius laus est in Evangélio per omnes ecclésias:'
  "19": 'non solum autem, sed et ordinátus est ab ecclésiis comes peregrinatiónis nostræ in hanc grátiam, quæ ministrátur a nobis ad Dómini glóriam, et destinátam voluntátem nostram:'
  "20": devitántes hoc, ne quis nos vitúperet in hac plenitúdine, quæ ministrátur a nobis.
  "21": Providémus enim bona non solum coram Deo, sed étiam coram homínibus.
  "22": 'Mísimus autem cum illis et fratrem nostrum, quem probávimus in multis sæpe sollícitum esse: nunc autem multo sollicitiórem, confidéntia multa in vos,'
  "23": sive pro Tito, qui est sócius meus, et in vos adiútor, sive fratres nostri, Apóstoli ecclesiárum, glória Christi.
  "24": Ostensiónem ergo, quæ est caritátis vestræ, et nostræ glóriæ pro vobis, in illos osténdite in fáciem ecclesiárum.
