bible: vulgate
lang: la
language: Latina
book: ad Ephesios
chapter: "5"
verses:
  "1": 'Estóte ergo imitatóres Dei, sicut fílii caríssimi:'
  "2": et ambuláte in dilectióne, sicut et Christus diléxit nos, et trádidit semetípsum pro nobis oblatiónem, et hóstiam Deo in odórem suavitátis.
  "3": 'Fornicátio autem, et omnis immundítia, aut avarítia, nec nominétur in vobis, sicut decet sanctos:'
  "4": 'aut turpitúdo, aut stultilóquium, aut scurrílitas, quæ ad rem non pértinet: sed magis gratiárum áctio.'
  "5": 'Hoc enim scitóte intelligéntes: quod omnis fornicátor, aut immúndus, aut avárus, quod est idolórum sérvitus, non habet hereditátem in regno Christi, et Dei.'
  "6": 'Nemo vos sedúcat inánibus verbis: propter hæc enim venit ira Dei in fílios diffidéntiæ.'
  "7": Nolíte ergo éffici partícipes eórum.
  "8": 'Erátis enim aliquándo ténebræ: nunc autem lux in Dómino. Ut fílii lucis ambuláte:'
  "9": 'fructus enim lucis est in omni bonitáte, et iustítia, et veritáte:'
  "10": 'probántes quid sit beneplácitum Deo:'
  "11": et nolíte communicáre opéribus infructuósis tenebrárum, magis autem redargúite.
  "12": Quæ enim in occúlto fiunt ab ipsis, turpe est et dícere.
  "13": 'Omnia autem, quæ arguúntur, a lúmine manifestántur: omne enim, quod manifestátur, lumen est.'
  "14": 'Propter quod dicit: Surge qui dormis, et exsúrge a mórtuis, et illuminábit te Christus.'
  "15": 'Vidéte ítaque fratres, quómodo caute ambulétis: non quasi insipiéntes,'
  "16": 'sed ut sapiéntes: rediméntes tempus, quóniam dies mali sunt.'
  "17": Proptérea nolíte fíeri imprudéntes, sed intelligéntes quæ sit volúntas Dei.
  "18": 'Et nolíte inebriári vino, in quo est luxúria: sed implémini Spíritu sancto,'
  "19": loquéntes vobismetípsis in psalmis, et hymnis, et cánticis spirituálibus, cantántes, et psalléntes in córdibus vestris Dómino,
  "20": grátias agéntes semper pro ómnibus in nómine Dómini nostri Iesu Christi Deo et Patri.
  "21": Subiécti ínvicem in timóre Christi.
  "22": 'Mulíeres viris suis súbditæ sint, sicut Dómino:'
  "23": 'quóniam vir caput est mulíeris, sicut Christus caput est Ecclésiæ: ipse, salvátor córporis eius.'
  "24": Sed sicut Ecclésia subiécta est Christo, ita et mulíeres viris suis in ómnibus.
  "25": Viri, dilígite uxóres vestras, sicut et Christus diléxit Ecclésiam, et seípsum trádidit pro ea,
  "26": ut illam sanctificáret, mundans lavácro aquæ in verbo vitæ,
  "27": ut exhibéret ipse sibi gloriósam Ecclésiam, non habéntem máculam, aut rugam, aut áliquid huiúsmodi, sed ut sit sancta et immaculáta.
  "28": Ita et viri debent dilígere uxóres suas ut córpora sua. Qui suam uxórem díligit, seípsum díligit.
  "29": 'Nemo enim unquam carnem suam ódio hábuit: sed nutrit, et fovet eam, sicut et Christus Ecclésiam:'
  "30": quia membra sumus córporis eius, de carne eius, et de óssibus eius.
  "31": 'Propter hoc relínquet homo patrem, et matrem suam, et adhærébit uxóri suæ: et erunt duo in carne una.'
  "32": Sacraméntum hoc magnum est, ego autem dico in Christo et in Ecclésia.
  "33": 'Verúmtamen et vos sínguli, unusquísque uxórem suam sicut seípsum díligat: uxor autem tímeat virum suum.'
