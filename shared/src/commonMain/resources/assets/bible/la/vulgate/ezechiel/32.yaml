bible: vulgate
lang: la
language: Latina
book: Ezechiel
chapter: "32"
verses:
  "1": 'Et factum est, duodécimo anno, in mense duodécimo, in una mensis, factum est verbum Dómini ad me, dicens:'
  "2": 'Fili hóminis assúme laméntum super Pharaónem regem Ægýpti, et dices ad eum: Leóni géntium assimilátus es, et dracóni, qui est in mari: et ventilábas cornu in flumínibus tuis, et conturbábas aquas pédibus tuis, et conculcábas flúmina eárum.'
  "3": 'Proptérea hæc dicit Dóminus Deus: Expándam super te rete meum in multitúdine populórum multórum, et éxtraham te in sagéna mea.'
  "4": 'Et proíciam te in terram, super fáciem agri abíciam te: et habitáre fáciam super te ómnia volatília cæli, et saturábo de te béstias univérsæ terræ.'
  "5": Et dabo carnes tuas super montes, et implébo colles tuos sánie tua.
  "6": Et irrigábo terram fœtóre sánguinis tui super montes, et valles implebúntur ex te.
  "7": 'Et opériam, cum exstínctus fúeris, cælum, et nigréscere fáciam stellas eius: solem nube tegam, et luna non dabit lumen suum.'
  "8": 'Omnia luminária cæli mœrére fáciam super te: et dabo ténebras super terram tuam, dicit Dóminus Deus, cum cecíderint vulneráti tui in médio terræ, ait Dóminus Deus.'
  "9": Et irritábo cor populórum multórum, cum indúxero contritiónem tuam in géntibus super terras, quas nescis.
  "10": 'Et stupéscere fáciam super te pópulos multos: et reges eórum horróre nímio formidábunt super te, cum voláre cœ́perit gládius meus super fácies eórum: et obstupéscent repénte sínguli pro ánima sua in die ruínæ tuæ.'
  "11": 'Quia hæc dicit Dóminus Deus: Gládius regis Babylónis véniet tibi,'
  "12": 'in gládiis fórtium deíciam multitúdinem tuam: inexpugnábiles omnes gentes hæ: et vastábunt supérbiam Ægýpti, et dissipábitur multitúdo eius.'
  "13": 'Et perdam ómnia iuménta eius, quæ erant super aquas plúrimas: et non conturbábit eas pes hóminis ultra, neque úngula iumentórum turbábit eas.'
  "14": 'Tunc puríssimas reddam aquas eórum, et flúmina eórum quasi óleum addúcam, ait Dóminus Deus:'
  "15": 'cum dédero terram Ægýpti desolátam: deserétur autem terra a plenitúdine sua, quando percússero omnes habitatóres eius: et scient quia ego Dóminus.'
  "16": 'Planctus est, et plangent eum: fíliæ géntium plangent eum: super Ægýptum et super multitúdinem eius plangent eum, ait Dóminus Deus.'
  "17": 'Et factum est in duodécimo anno, in quintadécima mensis: factum est verbum Dómini ad me, dicens:'
  "18": 'Fili hóminis cane lúgubre super multitúdinem Ægýpti: et détrahe eam ipsam, et fílias géntium robustárum, ad terram últimam, cum his, qui descéndunt in lacum.'
  "19": Quo púlchrior es? descénde, et dormi cum incircumcísis.
  "20": 'In médio interfectórum gládio cadent: gládius datus est, attraxérunt eam, et omnes pópulos eius.'
  "21": Loquéntur ei potentíssimi robustórum de médio inférni, qui cum auxiliatóribus eius descendérunt, et dormiérunt incircumcísi interfécti gládio.
  "22": 'Ibi Assur, et omnis multitúdo eius: in circúitu illíus sepúlcra eius: omnes interfécti, et qui cecidérunt gládio.'
  "23": 'Quorum data sunt sepúlcra in novíssimis laci, et facta est multitúdo eius per gyrum sepúlcri eius: univérsi interfécti, cadentésque gládio, qui déderant quondam formídinem in terra vivéntium.'
  "24": 'Ibi Ælam, et omnis multitúdo eius per gyrum sepúlcri sui: omnes hi interfécti, ruentésque gládio, qui descendérunt incircumcísi ad terram últimam: qui posuérunt terrórem suum in terra vivéntium, et portavérunt ignomíniam suam cum his, qui descéndunt in lacum.'
  "25": 'In médio interfectórum posuérunt cubíle eius in univérsis pópulis eius: in circúitu eius sepúlcrum illíus: omnes hi incircumcísi, interfectíque gládio: dedérunt enim terrórem suum in terra vivéntium, et portavérunt ignomíniam suam cum his, qui descéndunt in lacum: in médio interfectórum pósiti sunt.'
  "26": 'Ibi Mosoch, et Thubal, et omnis multitúdo eius: in circúitu eius sepúlcra illíus: omnes hi incircumcísi, interfectíque et cadéntes gládio: quia dedérunt formídinem suam in terra vivéntium.'
  "27": 'Et non dórmient cum fórtibus, cadentibúsque, et incircumcísis, qui descendérunt ad inférnum cum armis suis, et posuérunt gládios suos sub capítibus suis, et fuérunt iniquitátes eórum in óssibus eórum: quia terror fórtium facti sunt in terra vivéntium.'
  "28": Et tu ergo in médio incircumcisórum conteréris, et dórmies cum interféctis gládio.
  "29": 'Ibi Idumǽa, et reges eius, et omnes duces eius, qui dati sunt cum exércitu suo cum interféctis gládio: et qui cum incircumcísis dormiérunt, et cum his, qui descéndunt in lacum.'
  "30": 'Ibi príncipes aquilónis omnes, et univérsi venatóres: qui dedúcti sunt cum interféctis, pavéntes, et in sua fortitúdine confúsi: qui dormiérunt incircumcísi cum interféctis gládio, et portavérunt confusiónem suam cum his, qui descéndunt in lacum.'
  "31": 'Vidit eos Phárao, et consolátus est super univérsa multitúdine sua, quæ interfécta est gládio: Phárao, et omnis exércitus eius, ait Dóminus Deus.'
  "32": 'Quia dedi terrórem meum in terra vivéntium, et dormívit in médio incircumcisórum cum interféctis gládio: Phárao, et omnis multitúdo eius, ait Dóminus Deus.'
