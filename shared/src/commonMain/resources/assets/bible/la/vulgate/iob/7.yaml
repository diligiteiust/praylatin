bible: vulgate
lang: la
language: Latina
book: Iob
chapter: "7"
verses:
  "1": 'Milítia est vita hóminis super terram: et sicut dies mercenárii, dies eius.'
  "2": 'Sicut servus desíderat umbram, et sicut mercenárius præstolátur finem óperis sui:'
  "3": sic et ego hábui menses vácuos, et noctes laboriósas enumerávi mihi.
  "4": 'Si dormíero, dicam: Quando consúrgam? et rursum exspectábo vésperam, et replébor dolóribus usque ad ténebras.'
  "5": Indúta est caro mea putrédine, et sórdibus púlveris cutis mea áruit, et contrácta est.
  "6": Dies mei velócius transiérunt quam a texénte tela succíditur, et consúmpti sunt absque ulla spe.
  "7": Meménto quia ventus est vita mea, et non revertétur óculus meus ut vídeat bona.
  "8": 'Nec aspíciet me visus hóminis: óculi tui in me, et non subsístam.'
  "9": 'Sicut consúmitur nubes, et pertránsit: sic qui descénderit ad ínferos, non ascéndet.'
  "10": Nec revertétur ultra in domum suam, neque cognóscet eum ámplius locus eius.
  "11": 'Quaprópter et ego non parcam ori meo, loquar in tribulatióne spíritus mei: confabulábor cum amaritúdine ánimæ meæ.'
  "12": Numquid mare ego sum, aut cetus, quia circumdedísti me cárcere?
  "13": 'Si díxero: Consolábitur me léctulus meus, et relevábor loquens mecum in strato meo:'
  "14": terrébis me per sómnia, et per visiónes horróre concúties.
  "15": Quam ob rem elégit suspéndium ánima mea, et mortem ossa mea.
  "16": 'Desperávi, nequáquam ultra iam vivam: parce mihi, nihil enim sunt dies mei.'
  "17": Quid est homo, quia magníficas eum? aut quid appónis erga eum cor tuum?
  "18": Vísitas eum dilúculo, et súbito probas illum.
  "19": Usquequo non parcis mihi, nec dimíttis me ut glútiam salívam meam?
  "20": Peccávi, quid fáciam tibi o custos hóminum? quare posuísti me contrárium tibi, et factus sum mihimetípsi gravis?
  "21": Cur non tollis peccátum meum, et quare non aufers iniquitátem meam? ecce nunc in púlvere dórmiam, et si mane me quæsíeris, non subsístam.
