bible: vulgate
lang: la
language: Latina
book: I Samuelis
chapter: "18"
verses:
  "1": Et factum est cum complésset loqui ad Saul, ánima Iónathæ conglutináta est ánimæ David, et diléxit eum Iónathas quasi ánimam suam.
  "2": Tulítque eum Saul in die illa, et non concéssit ei ut reverterétur in domum patris sui.
  "3": 'Iniérunt autem David et Iónathas fœdus: diligébat enim eum quasi ánimam suam.'
  "4": Nam exspoliávit se Iónathas túnica, qua erat indútus, et dedit eam David, et réliqua vestiménta sua, usque ad gládium et arcum suum, et usque ad bálteum.
  "5": 'Egrediebátur quoque David ad ómnia quæcúmque misísset eum Saul, et prudénter se agébat: posuítque eum Saul super viros belli, et accéptus erat in óculis univérsi pópuli, maximéque in conspéctu famulórum Saul.'
  "6": Porro cum reverterétur percússo Philisthǽo David, egréssæ sunt mulíeres de univérsis úrbibus Israel, cantántes, chorósque ducéntes in occúrsum Saul regis, in týmpanis lætítiæ, et in sistris.
  "7": 'Et præcinébant mulíeres, ludéntes, atque dicéntes: Percússit Saul mille, et David decem míllia.'
  "8": 'Irátus est autem Saul nimis, et displícuit in óculis eius sermo iste: dixítque: Dedérunt David decem míllia, et mihi mille dedérunt: quid ei súperest, nisi solum regnum?'
  "9": Non rectis ergo óculis Saul aspiciébat David a die illa, et deínceps.
  "10": 'Post diem autem álteram, invásit spíritus Dei malus Saul, et prophetábat in médio domus suæ: David autem psallébat manu sua, sicut per síngulos dies. Tenebátque Saul lánceam,'
  "11": 'et misit eam, putans quod confígere posset David cum paríete: et declinávit David a fácie eius secúndo.'
  "12": Et tímuit Saul David, eo quod Dóminus esset cum eo, et a se recessísset.
  "13": 'Amóvit ergo eum Saul a se, et fecit eum tribúnum super mille viros: et egrediebátur, et intrábat in conspéctu pópuli.'
  "14": In ómnibus quoque viis suis David prudénter agébat, et Dóminus erat cum eo.
  "15": Vidit ítaque Saul quod prudens esset nimis, et cœpit cavére eum.
  "16": 'Omnis autem Israel et Iuda diligébat David: ipse enim ingrediebátur et egrediebátur ante eos.'
  "17": 'Dixítque Saul ad David: Ecce fília mea maior Merob: ipsam dabo tibi uxórem: tantúmmodo esto vir fortis, et prœliáre bella Dómini. Saul autem reputábat, dicens: Non sit manus mea in eum, sed sit super eum manus Philisthinórum.'
  "18": 'Ait autem David ad Saul: Quis ego sum, aut quæ est vita mea, aut cognátio patris mei in Israel, ut fiam gener regis?'
  "19": Factum est autem tempus cum debéret dari Merob fília Saul David, data est Hadriéli Molathítæ uxor.
  "20": Diléxit autem David Michol fília Saul áltera. Et nuntiátum est Saul, et plácuit ei.
  "21": 'Dixítque Saul: Dabo eam illi, ut fiat ei in scándalum, et sit super eum manus Philisthinórum. Dixítque Saul ad David: In duábus rebus gener meus eris hódie.'
  "22": 'Et mandávit Saul servis suis: Loquímini ad David clam me, dicéntes: Ecce places regi, et omnes servi eius díligunt te: nunc ergo esto gener regis.'
  "23": 'Et locúti sunt servi Saul in áuribus David ómnia verba hæc. Et ait David: Num parum vidétur vobis, génerum esse regis? ego autem sum vir pauper et ténuis.'
  "24": 'Et renuntiavérunt servi Saul dicéntes: Huiuscémodi verba locútus est David.'
  "25": 'Dixit autem Saul: Sic loquímini ad David: Non habet rex sponsália necésse, nisi tantum centum præpútia Philisthinórum, ut fiat últio de inimícis regis. Porro Saul cogitábat trádere David in manus Philisthinórum.'
  "26": Cumque renuntiássent servi eius David verba, quæ díxerat Saul, plácuit sermo in óculis David, ut fíeret gener regis.
  "27": Et post paucos dies surgens David, ábiit cum viris, qui sub eo erant. Et percússit ex Philísthiim ducéntos viros, et áttulit eórum præpútia et annumerávit ea regi, ut esset gener eius. Dedit ítaque Saul ei Michol fíliam suam uxórem.
  "28": Et vidit Saul, et intelléxit quod Dóminus esset cum David. Michol autem fília Saul diligébat eum.
  "29": 'Et Saul magis cœpit timére David: factúsque est Saul inimícus David cunctis diébus.'
  "30": Et egréssi sunt príncipes Philisthinórum. A princípio autem egressiónis eórum, prudéntius se gerébat David quam omnes servi Saul, et célebre factum est nomen eius nimis.
