bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "74"
verses:
  "1": In finem, Ne corrúmpas. Psalmus Cántici Asaph.
  "2": 'Confitébimur tibi Deus: confitébimur, et invocábimus nomen tuum. Narrábimus mirabília tua:'
  "3": cum accépero tempus, ego iustítias iudicábo.
  "4": 'Liquefácta est terra, et omnes qui hábitant in ea: ego confirmávi colúmnas eius.'
  "5": 'Dixi iníquis: Nolíte iníque ágere: et delinquéntibus: Nolíte exaltáre cornu:'
  "6": 'nolíte extóllere in altum cornu vestrum: nolíte loqui advérsus Deum iniquitátem.'
  "7": 'Quia neque ab oriénte, neque ab occidénte, neque a desértis móntibus:'
  "8": 'quóniam Deus iudex est. Hunc humíliat, et hunc exáltat:'
  "9": 'quia calix in manu Dómini vini meri, plenus misto. Et inclinávit ex hoc in hoc: verúmtamen fæx eius non est exinaníta: bibent omnes peccatóres terræ.'
  "10": 'Ego autem annuntiábo in sǽculum: cantábo Deo Iacob.'
  "11": Et ómnia córnua peccatórum confríngam, et exaltabúntur córnua iusti.
