bible: vulgate
lang: la
language: Latina
book: Ieremias
chapter: "30"
verses:
  "1": 'Hoc verbum, quod factum est ad Ieremíam a Dómino, dicens:'
  "2": 'Hæc dicit Dóminus Deus Israel, dicens: Scribe tibi ómnia verba, quæ locútus sum ad te, in libro.'
  "3": 'Ecce enim dies véniunt, dicit Dóminus, et convértam conversiónem pópuli mei Israel et Iuda, ait Dóminus: et convértam eos ad terram, quam dedi pátribus eórum, et possidébunt eam.'
  "4": 'Et hæc verba, quæ locútus est Dóminus ad Israel et ad Iudam:'
  "5": 'Quóniam hæc dicit Dóminus: Vocem terróris audívimus: formído, et non est pax.'
  "6": 'Interrogáte, et vidéte si génerat másculus: quare ergo vidi omnis viri manum super lumbum suum, quasi parturiéntis, et convérsæ sunt univérsæ fácies in aurúginem?'
  "7": 'Væ, quia magna dies illa, nec est símilis eius: tempúsque tribulatiónis est Iacob, et ex ipso salvábitur.'
  "8": 'Et erit in die illa, ait Dóminus exercítuum: cónteram iugum eius de collo tuo: et víncula eius dirúmpam, et non dominabúntur ei ámplius aliéni:'
  "9": sed sérvient Dómino Deo suo, et David regi suo, quem suscitábo eis.
  "10": 'Tu ergo ne tímeas serve meus Iacob, ait Dóminus, neque páveas Israel: quia ecce ego salvábo te de terra longínqua, et semen tuum de terra captivitátis eórum: et revertétur Iacob, et quiéscet, et cunctis áffluet bonis, et non erit quem formídet:'
  "11": 'quóniam tecum ego sum, ait Dóminus, ut salvem te: fáciam enim consummatiónem in cunctis géntibus, in quibus dispérsi te: te autem non fáciam in consummatiónem: sed castigábo te in iudício, ut non videáris tibi innóxius.'
  "12": 'Quia hæc dicit Dóminus: Insanábilis fractúra tua, péssima plaga tua.'
  "13": 'Non est qui iúdicet iudícium tuum ad alligándum: curatiónum utílitas non est tibi.'
  "14": 'Omnes amatóres tui oblíti sunt tui, teque non quærent: plaga enim inimíci percússi te castigatióne crudéli: propter multitúdinem iniquitátis tuæ dura facta sunt peccáta tua.'
  "15": 'Quid clamas super contritióne tua? insanábilis est dolor tuus: propter multitúdinem iniquitátis tuæ, et propter dura peccáta tua, feci hæc tibi.'
  "16": 'Proptérea omnes, qui cómedunt te, devorabúntur: et univérsi hostes tui in captivitátem ducéntur: et qui te vastant, vastabúntur, cunctósque prædatóres tuos dabo in prædam.'
  "17": 'Obdúcam enim cicatrícem tibi, et a vulnéribus tuis sanábo te, dicit Dóminus. Quia eiéctam vocavérunt te Sion: Hæc est, quæ non habébat requiréntem.'
  "18": 'Hæc dicit Dóminus: Ecce ego convértam conversiónem tabernaculórum Iacob, et tectis eius miserébor, et ædificábitur cívitas in excélso suo, et templum iuxta órdinem suum fundábitur.'
  "19": 'Et egrediétur de eis laus, voxque ludéntium: et multiplicábo eos, et non minuéntur: et glorificábo eos, et non attenuabúntur.'
  "20": 'Et erunt fílii eius sicut a princípio, et cœtus eius coram me permanébit: et visitábo advérsum omnes, qui tríbulant eum.'
  "21": 'Et erit dux eius ex eo, et princeps de médio eius producétur: et applicábo eum, et accédet ad me: quis enim iste est, qui ápplicet cor suum ut appropínquet mihi, ait Dóminus?'
  "22": Et éritis mihi in pópulum, et ego ero vobis in Deum.
  "23": 'Ecce turbo Dómini, furor egrédiens, procélla ruens: in cápite impiórum conquiéscet.'
  "24": 'Non avértet iram indignatiónis Dóminus, donec fáciat et cómpleat cogitatiónem cordis sui: in novíssimo diérum intelligétis ea.'
