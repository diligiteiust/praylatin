bible: vulgate
lang: la
language: Latina
book: Isaias
chapter: "18"
verses:
  "1": Væ terræ cýmbalo alárum, quæ est trans flúmina Æthiópiæ,
  "2": 'qui mittit in mare legátos, et in vasis papýri super aquas. Ite ángeli velóces ad gentem convúlsam, et dilacerátam: ad pópulum terríbilem, post quem non est álius: ad gentem exspectántem et conculcátam, cuius diripuérunt flúmina terram eius.'
  "3": Omnes habitatóres orbis, qui morámini in terra, cum elevátum fúerit signum in móntibus, vidébitis, et clangórem tubæ audiétis.
  "4": 'Quia hæc dicit Dóminus ad me: Quiéscam, et considerábo in loco meo, sicut meridiána lux clara est, et sicut nubes roris in die messis.'
  "5": 'Ante messem enim totus efflóruit, et immatúra perféctio germinábit: et præcidéntur ramúsculi eius fálcibus, et quæ derelícta fúerint, abscindéntur, et excutiéntur.'
  "6": 'Et relinquéntur simul ávibus móntium, et béstiis terræ: et æstáte perpétua erunt super eum vólucres, et omnes béstiæ terræ super illum hiemábunt.'
  "7": 'In témpore illo deferétur munus Dómino exercítuum a pópulo divúlso et dilaceráto, a pópulo terríbili, post quem non fuit álius: a gente exspectánte, exspectánte et conculcáta, cuius diripuérunt flúmina terram eius: ad locum nóminis Dómini exercítuum, montem Sion.'
