bible: vulgate
lang: la
language: Latina
book: II Machabaeorum
chapter: "8"
verses:
  "1": 'Iudas vero Machabǽus, et qui cum illo erant, introíbant laténter in castélla: et convocántes cognátos, et amícos, et eos, qui permansérunt in Iudaísmo assuméntes, eduxérunt ad se sex míllia virórum.'
  "2": 'Et invocábant Dóminum, ut respíceret in pópulum, qui ab ómnibus calcabátur: et misererétur templo, quod contaminabátur ab ímpiis:'
  "3": 'misererétur étiam extermínio civitátis, quæ esset íllico complanánda, et vocem sánguinis ad se clamántis audíret:'
  "4": memorarétur quoque iniquíssimas mortes parvulórum innocéntum, et blasphémias nómini suo illátas, et indignarétur super his.
  "5": 'At Machabǽus, congregáta multitúdine, intolerábilis géntibus efficiebátur: ira enim Dómini in misericórdiam convérsa est.'
  "6": 'Et supervéniens castéllis, et civitátibus improvísus, succendébat eas: et opportúna loca óccupans, non paucas hóstium strages dabat:'
  "7": máxime autem nóctibus ad huiuscémodi excúrsus ferebátur, et fama virtútis eius ubíque diffundebátur.
  "8": Videns autem Philíppus paulátim virum ad proféctum veníre, ac frequéntius res ei cédere próspere, ad Ptolemǽum ducem Cœlesýriæ, et Phœnícis scripsit ut auxílium ferret regis negótiis.
  "9": At ille velóciter misit Nicánorem Pátrocli de primóribus amícum, datis ei de permístis géntibus, armátis non minus vigínti míllibus, ut univérsum Iudæórum genus deléret, adiúncto ei Górgia viro militári, et in béllicis rebus experientíssimo.
  "10": 'Constítuit autem Nicánor, ut regi tribútum, quod Románis erat dandum, duo míllia talentórum de captivitáte Iudæórum suppléret:'
  "11": statímque ad marítimas civitátes misit, cónvocans ad coemptiónem Iudaicórum mancipiórum, promíttens se nonagínta mancípia talénto distractúrum, non respíciens ad vindíctam, quæ eum ab Omnipoténte esset consecutúra.
  "12": Iudas autem ubi cómperit, indicávit his, qui secum erant, Iudǽis Nicánoris advéntum.
  "13": 'Ex quibus quidam formidántes, et non credéntes Dei iustítiæ, in fugam vertebántur:'
  "14": 'álii vero si quid eis supérerat vendébant, simúlque Dóminum deprecabántur ut eríperet eos ab ímpio Nicánore, qui eos priúsquam cóminus veníret, vendíderat:'
  "15": et si non propter eos, propter testaméntum tamen quod erat ad patres eórum, et propter invocatiónem sancti et magnífici nóminis eius super ipsos.
  "16": Convocátis autem Machabǽus septem míllibus, qui cum ipso erant, rogábat ne hóstibus reconciliaréntur, neque metúerent iníque veniéntium advérsum se hóstium multitúdinem, sed fórtiter conténderent,
  "17": ante óculos habéntes contuméliam, quæ loco sancto ab his iniúste esset illáta, itémque et ludíbrio hábitæ civitátis iniúriam, adhuc étiam véterum institúta convúlsa.
  "18": 'Nam illi quidem armis confídunt, ait, simul et audácia: nos autem in omnipoténte Dómino, qui potest et veniéntes advérsum nos, et univérsum mundum uno nutu delére, confídimus.'
  "19": 'Admónuit autem eos et de auxíliis Dei, quæ facta sunt erga paréntes: et quod sub Sennácherib centum octogínta quinque míllia periérunt:'
  "20": et de prœ́lio, quod eis advérsus Gálatas fuit in Babylónia, ut omnes, ubi ad rem ventum est, Macedónibus sóciis hæsitántibus, ipsi sex míllia soli peremérunt centum vigínti míllia, propter auxílium illis datum de cælo, et benefícia pro his plúrima consecúti sunt.
  "21": His verbis constántes effécti sunt, et pro légibus, et pátria mori paráti.
  "22": Constítuit ítaque fratres suos duces utríque órdini, Simónem, et Ioséphum, et Iónathan, subiéctis unicuíque millénis et quingenténis.
  "23": Ad hoc étiam ab Esdra lecto illis sancto libro, et dato signo adiutórii Dei, in prima ácie ipse dux commísit cum Nicánore.
  "24": 'Et facto sibi adiutóre Omnipoténte, interfecérunt super novem míllia hóminum: maiórem autem partem exércitus Nicánoris vulnéribus débilem factam fúgere compulérunt.'
  "25": 'Pecúniis vero eórum, qui ad emptiónem ipsórum vénerant, sublátis, ipsos usquequáque persecúti sunt:'
  "26": 'sed revérsi sunt hora conclúsi, nam erat ante sábbatum: quam ob causam non perseveravérunt insequéntes.'
  "27": Arma autem ipsórum, et spólia congregántes, sábbatum agébant, benedicéntes Dóminum, qui liberávit eos in isto die, misericórdiæ inítium stillans in eos.
  "28": 'Post sábbatum vero debílibus, et órphanis, et víduis divisérunt spólia: et resídua ipsi cum suis habuére.'
  "29": His ítaque gestis, et commúniter ab ómnibus facta obsecratióne, misericórdem Dóminum postulábant ut in finem servis suis reconciliarétur.
  "30": 'Et ex his, qui cum Timótheo, et Bácchide erant contra se contendéntes, super vigínti míllia interfecérunt, et munitiónes excélsas obtinuérunt: et plures prædas divisérunt, æquam portiónem debílibus, pupíllis, et víduis, sed et senióribus faciéntes.'
  "31": 'Et cum arma eórum diligénter collegíssent, ómnia composuérunt in locis opportúnis: resídua vero spólia Ierosólymam detulérunt:'
  "32": et Philárchen, qui cum Timótheo erat, interfecérunt, virum sceléstum, qui in multis Iudǽos afflíxerat.
  "33": Et cum epinícia ágerent Ierosólymis, eum, qui sacras iánuas incénderat, id est, Callísthenem, cum in quoddam domicílium refugísset, incendérunt, digna ei mercéde pro impietátibus suis réddita.
  "34": Facinorosíssimus autem Nicánor, qui mille negotiántes ad Iudæórum venditiónem addúxerat,
  "35": humiliátus auxílio Dómini ab his, quos nullos existimáverat, depósita veste glóriæ, per mediterránea fúgiens, solus venit Antiochíam, summam infelicitátem de intéritu sui exércitus consecútus.
  "36": Et qui promíserat Románis se tribútum restitúere de captivitáte Ierosolymórum, prædicábat nunc protectórem Deum habére Iudǽos, et ob ipsum invulnerábiles esse, eo quod sequeréntur leges ab ipso constitútas.
