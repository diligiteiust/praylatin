bible: vulgate
lang: la
language: Latina
book: Sapientia
chapter: "15"
verses:
  "1": Tu autem Deus noster, suávis et verus es, pátiens, et in misericórdia dispónens ómnia.
  "2": 'Etenim si peccavérimus, tui sumus, sciéntes magnitúdinem tuam: et si non peccavérimus, scimus quóniam apud te sumus computáti.'
  "3": 'Nosse enim te, consummáta iustítia est: et scire iustítiam, et virtútem tuam, radix est immortalitátis.'
  "4": Non enim in errórem indúxit nos hóminum malæ artis excogitátio, nec umbra pictúræ labor sine fructu, effígies sculpta per vários colóres,
  "5": cuius aspéctus insensáto dat concupiscéntiam, et díligit mórtuæ imáginis effígiem sine ánima.
  "6": Malórum amatóres, digni sunt qui spem hábeant in tálibus, et qui fáciunt illos, et qui díligunt, et qui colunt.
  "7": 'Sed et fígulus mollem terram premens, laborióse fingit ad usus nostros unumquódque vas: et de eódem luto fingit quæ munda sunt in usum vasa, et simíliter quæ his sunt contrária: horum autem vasórum quis sit usus, iudex est fígulus.'
  "8": Et cum labóre vano deum fingit de eódem luto, ille qui paulo ante de terra factus fúerat, et post pusíllum redúcit se unde accéptus est, repetítus ánimæ débitum quam habébat.
  "9": 'Sed cura est illi non quia laboratúrus est, nec quóniam brevis illi vita est: sed concertátur aurifícibus et argentáriis: sed et ærários imitátur, et glóriam præfert, quóniam res supervácuas fingit.'
  "10": 'Cinis est enim cor eius, et terra supervácua spes illíus, et luto vílior vita eius:'
  "11": quóniam ignorávit qui se finxit, et qui inspirávit illi ánimam, quæ operátur, et qui insufflávit ei spíritum vitálem.
  "12": Sed et æstimavérunt ludum esse vitam nostram, et conversatiónem vitæ compósitam ad lucrum, et oportére undecúmque étiam ex malo acquírere.
  "13": Hic enim scit se super omnes delínquere, qui ex terræ matéria fragília vasa et sculptília fingit.
  "14": 'Omnes enim insipiéntes, et infelíces supra modum ánimæ supérbi, sunt inimíci pópuli tui, et imperántes illi:'
  "15": quóniam ómnia idóla natiónum deos æstimavérunt, quibus neque oculórum usus est ad vidéndum, neque nares ad percipiéndum spíritum, neque aures ad audiéndum, neque dígiti mánuum ad tractándum, sed et pedes eórum pigri ad ambulándum.
  "16": 'Homo enim fecit illos: et qui spíritum mutuátus est, is finxit illos. Nemo enim sibi símilem homo póterit deum fíngere.'
  "17": Cum enim sit mortális, mórtuum fingit mánibus iníquis. Mélior enim est ipse his, quos colit, quia ipse quidem vixit, cum esset mortális, illi autem numquam.
  "18": 'Sed et animália misérrima colunt: insensáta enim comparáta his, illis sunt deterióra.'
  "19": Sed nec aspéctu áliquis ex his animálibus bona potest conspícere. Effugérunt autem Dei laudem, et benedictiónem eius.
