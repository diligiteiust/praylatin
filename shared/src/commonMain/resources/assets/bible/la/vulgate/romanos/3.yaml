bible: vulgate
lang: la
language: Latina
book: ad Romanos
chapter: "3"
verses:
  "1": Quid ergo ámplius Iudǽo est? aut quæ utílitas circumcisiónis?
  "2": Multum per omnem modum. Primum quidem quia crédita sunt illis elóquia Dei.
  "3": Quid enim si quidam illórum non credidérunt? numquid incredúlitas illórum fidem Dei evacuábit? Absit.
  "4": 'Est autem Deus verax: omnis autem homo mendax, sicut scriptum est: Ut iustificéris in sermónibus tuis: et vincas cum iudicáris.'
  "5": Si autem iníquitas nostra iustítiam Dei comméndat, quid dicémus? Numquid iníquus est Deus, qui infert iram?
  "6": (Secúndum hóminem dico.) Absit. Alióquin quómodo iudicábit Deus hunc mundum?
  "7": 'Si enim véritas Dei in meo mendácio abundávit in glóriam ipsíus: quid adhuc et ego tamquam peccátor iúdicor?'
  "8": 'Et non (sicut blasphemámur, et sicut aiunt quidam nos dícere) faciámus mala ut véniant bona: quorum damnátio iusta est.'
  "9": Quid ergo? præcéllimus eos? Nequáquam. Causáti enim sumus Iudǽos, et Græcos omnes sub peccáto esse,
  "10": 'sicut scriptum est: Quia non est iustus quisquam:'
  "11": non est intélligens, non est requírens Deum.
  "12": 'Omnes declinavérunt, simul inútiles facti sunt: non est qui fáciat bonum, non est usque ad unum.'
  "13": 'Sepúlcrum patens est guttur eórum, linguis suis dolóse agébant. Venénum áspidum sub lábiis eórum:'
  "14": 'quorum os maledictióne, et amaritúdine plenum est:'
  "15": 'velóces pedes eórum ad effundéndum sánguinem:'
  "16": 'contrítio, et infelícitas in viis eórum:'
  "17": 'et viam pacis non cognovérunt:'
  "18": non est timor Dei ante óculos eórum.
  "19": 'Scimus autem quóniam quæcúmque lex lóquitur, iis, qui in lege sunt, lóquitur: ut omne os obstruátur, et súbditus fiat omnis mundus Deo:'
  "20": quia ex opéribus legis non iustificábitur omnis caro coram illo. Per legem enim cognítio peccáti.
  "21": 'Nunc autem sine lege iustítia Dei manifestáta est: testificáta a lege et prophétis.'
  "22": 'Iustítia autem Dei per fidem Iesu Christi in omnes, et super omnes, qui credunt in eum: non enim est distínctio:'
  "23": omnes enim peccavérunt, et egent glória Dei.
  "24": Iustificáti gratis per grátiam ipsíus, per redemptiónem, quæ est in Christo Iesu,
  "25": quem propósuit Deus propitiatiónem per fidem in sánguine ipsíus, ad ostensiónem iustítiæ suæ propter remissiónem præcedéntium delictórum
  "26": 'in sustentatióne Dei, ad ostensiónem iustítiæ eius in hoc témpore: ut sit ipse iustus, et iustíficans eum, qui est ex fide Iesu Christi.'
  "27": 'Ubi est ergo gloriátio tua? Exclúsa est. Per quam legem? Factórum? Non: sed per legem fídei.'
  "28": Arbitrámur enim iustificári hóminem per fidem sine opéribus legis.
  "29": 'An Iudæórum Deus tantum? nonne et géntium? Immo et géntium:'
  "30": quóniam quidem unus est Deus, qui iustíficat circumcisiónem ex fide, et præpútium per fidem.
  "31": 'Legem ergo destrúimus per fidem? Absit: sed legem statúimus.'
