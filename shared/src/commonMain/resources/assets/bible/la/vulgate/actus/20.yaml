bible: vulgate
lang: la
language: Latina
book: Actus Apostolorum
chapter: "20"
verses:
  "1": Postquam autem cessávit tumúltus, vocátis Paulus discípulis, et exhortátus eos, valedíxit, et proféctus est ut iret in Macedóniam.
  "2": 'Cum autem perambulásset partes illas, et exhortátus eos fuísset multo sermóne, venit ad Grǽciam:'
  "3": 'ubi cum fecísset menses tres, factæ sunt illi insídiæ a Iudǽis navigatúro in Sýriam: habuítque consílium ut reverterétur per Macedóniam.'
  "4": 'Comitátus est autem eum Sópater Pyrrhi Berœénsis, Thessalonicénsium vero Aristárchus, et Secúndus, et Gaius Derbeus, et Timótheus: Asiáni vero Týchicus et Tróphimus.'
  "5": 'Hi cum præcessíssent, sustinuérunt nos Tróade:'
  "6": nos vero navigávimus post dies azymórum a Philíppis, et vénimus ad eos Tróadem in diébus quinque, ubi demoráti sumus diébus septem.
  "7": Una autem sábbati cum convenissémus ad frangéndum panem, Paulus disputábat cum eis profectúrus in crástinum, protraxítque sermónem usque in médiam noctem.
  "8": Erant autem lámpades copiósæ in cœnáculo, ubi erámus congregáti.
  "9": Sedens autem quidam adoléscens nómine Eútychus super fenéstram, cum mergerétur somno gravi, disputánte diu Paulo, ductus somno cécidit de tértio cœnáculo deórsum, et sublátus est mórtuus.
  "10": 'Ad quem cum descendísset Paulus, incúbuit super eum: et compléxus dixit: Nolíte turbári, ánima enim ipsíus in ipso est.'
  "11": Ascéndens autem, frangénsque panem, et gustans, satísque allocútus usque in lucem, sic proféctus est.
  "12": Adduxérunt autem púerum vivéntem, et consoláti sunt non mínime.
  "13": 'Nos autem ascendéntes navem, navigávimus in Asson, inde susceptúri Paulum: sic enim disposúerat ipse per terram iter factúrus.'
  "14": Cum autem convenísset nos in Asson, assúmpto eo, vénimus Mitylénen.
  "15": Et inde navigántes, sequénti die vénimus contra Chium, et ália applicúimus Samum, et sequénti die vénimus Milétum.
  "16": Proposúerat enim Paulus transnavigáre Ephesum, ne qua mora illi fíeret in Asia. Festinábat enim, si possíbile sibi esset, ut diem Pentecóstes fáceret Ierosólymis.
  "17": A Miléto autem mittens Ephesum, vocávit maióres natu ecclésiæ.
  "18": 'Qui cum veníssent ad eum, et simul essent, dixit eis: Vos scitis a prima die, qua ingréssus sum in Asiam, quáliter vobíscum per omne tempus fúerim,'
  "19": 'sérviens Dómino cum omni humilitáte, et lácrymis, et tentatiónibus, quæ mihi accidérunt ex insídiis Iudæórum:'
  "20": quómodo nihil subtráxerim utílium, quóminus annuntiárem vobis, et docérem vos públice, et per domos,
  "21": testíficans Iudǽis, atque gentílibus in Deum pœniténtiam, et fidem in Dóminum nostrum Iesum Christum.
  "22": 'Et nunc ecce alligátus ego spíritu, vado in Ierúsalem: quæ in ea ventúra sint mihi, ignórans:'
  "23": nisi quod Spíritus sanctus per omnes civitátes mihi protestátur, dicens quóniam víncula, et tribulatiónes Ierosólymis me manent.
  "24": 'Sed nihil horum véreor: nec fácio ánimam meam pretiosiórem quam me, dúmmodo consúmmem cursum meum, et ministérium verbi, quod accépi a Dómino Iesu, testificári Evangélium grátiæ Dei.'
  "25": Et nunc ecce ego scio quia ámplius non vidébitis fáciem meam vos omnes, per quos transívi prǽdicans regnum Dei.
  "26": Quaprópter contéstor vos hodiérna die, quia mundus sum a sánguine ómnium.
  "27": Non enim subterfúgi, quóminus annuntiárem omne consílium Dei vobis.
  "28": Atténdite vobis, et univérso gregi, in quo vos Spíritus sanctus pósuit epíscopos régere Ecclésiam Dei, quam acquisívit sánguine suo.
  "29": Ego scio quóniam intrábunt post discessiónem meam lupi rapáces in vos, non parcéntes gregi.
  "30": Et ex vobis ipsis exsúrgent viri loquéntes pervérsa, ut abdúcant discípulos post se.
  "31": Propter quod vigiláte, memória retinéntes, quóniam per triénnium nocte et die non cessávi, cum lácrymis monens unumquémque vestrum.
  "32": Et nunc comméndo vos Deo, et verbo grátiæ ipsíus, qui potens est ædificáre, et dare hereditátem in sanctificátis ómnibus.
  "33": Argéntum, et aurum, aut vestem nullíus concupívi, sicut
  "34": 'ipsi scitis: quóniam ad ea, quæ mihi opus erant, et his, qui mecum sunt, ministravérunt manus istæ.'
  "35": 'Omnia osténdi vobis, quóniam sic laborántes, opórtet suscípere infírmos, ac meminísse verbi Dómini Iesu, quóniam ipse dixit: Beátius est magis dare, quam accípere.'
  "36": Et cum hæc dixísset, pósitis génibus suis orávit cum ómnibus illis.
  "37": 'Magnus autem fletus factus est ómnium: et procumbéntes super collum Pauli, osculabántur eum,'
  "38": doléntes máxime in verbo, quod díxerat, quóniam ámplius fáciem eius non essent visúri. Et deducébant eum ad navem.
