bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "86"
verses:
  "1": 'Fíliis Core, Psalmus cántici. Fundaménta eius in móntibus sanctis:'
  "2": díligit Dóminus portas Sion super ómnia tabernácula Iacob.
  "3": Gloriósa dicta sunt de te, cívitas Dei.
  "4": Memor ero Rahab et Babylónis sciéntium me. Ecce alienígenæ, et Tyrus, et pópulus Æthíopum, hi fuérunt illic.
  "5": 'Numquid Sion dicet: Homo, et homo natus est in ea: et ipse fundávit eam Altíssimus?'
  "6": 'Dóminus narrábit in scriptúris populórum, et príncipum: horum, qui fuérunt in ea.'
  "7": Sicut lætántium ómnium habitátio est in te.
