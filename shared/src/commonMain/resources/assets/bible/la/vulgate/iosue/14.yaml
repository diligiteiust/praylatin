bible: vulgate
lang: la
language: Latina
book: Iosue
chapter: "14"
verses:
  "1": 'Hoc est quod possedérunt fílii Israel in terra Chánaan, quam dedérunt eis Eleázar sacérdos, et Iósue fílius Nun, et príncipes familiárum per tribus Israel:'
  "2": sorte ómnia dividéntes, sicut præcéperat Dóminus in manu Móysi, novem tríbubus, et dimídiæ tríbui.
  "3": 'Duábus enim tríbubus, et dimídiæ, déderat Móyses trans Iordánem possessiónem: absque Levítis, qui nihil terræ accepérunt inter fratres suos:'
  "4": 'sed in eórum successérunt locum fílii Ioseph in duas divísi tribus, Manásse et Ephraim: nec accepérunt Levítæ áliam in terra partem, nisi urbes ad habitándum, et suburbána eárum ad alénda iuménta et pécora sua.'
  "5": Sicut præcéperat Dóminus Móysi, ita fecérunt fílii Israel, et divisérunt terram.
  "6": 'Accessérunt ítaque fílii Iuda ad Iósue in Gálgala, locutúsque est ad eum Caleb fílius Iéphone Cenezǽus: Nosti quid locútus sit Dóminus ad Móysen hóminem Dei de me et te in Cadesbárne.'
  "7": Quadragínta annórum eram quando misit me Móyses fámulus Dómini de Cadesbárne, ut considerárem terram, nuntiavíque ei quod mihi verum videbátur.
  "8": 'Fratres autem mei, qui ascénderant mecum, dissolvérunt cor pópuli: et nihilóminus ego secútus sum Dóminum Deum meum.'
  "9": 'Iuravítque Móyses in die illo, dicens: Terra, quam calcávit pes tuus, erit posséssio tua, et filiórum tuórum in ætérnum: quia secútus es Dóminum Deum meum.'
  "10": 'Concéssit ergo Dóminus vitam mihi, sicut pollícitus est, usque in præséntem diem. Quadragínta et quinque anni sunt, ex quo locútus est Dóminus verbum istud ad Móysen, quando ambulábat Israel per solitúdinem: hódie octogínta quinque annórum sum,'
  "11": 'sic valens ut eo valébam témpore quando ad explorándum missus sum: illíus in me témporis fortitúdo usque hódie persevérat, tam ad bellándum quam ad gradiéndum.'
  "12": 'Da ergo mihi montem istum, quem pollícitus est Dóminus, te quoque audiénte, in quo Enacim sunt, et urbes magnæ atque munítæ: si forte sit Dóminus mecum, et potúero delére eos, sicut promísit mihi.'
  "13": Benedixítque ei Iósue, et trádidit ei Hebron in possessiónem.
  "14": Atque ex eo fuit Hebron Caleb fílio Iéphone Cenezǽo usque in præséntem diem, quia secútus est Dóminum Deum Israel.
  "15": 'Nomen Hebron ante vocabátur Cáriath Arbe: Adam máximus ibi inter Enacim situs est: et terra cessávit a prœ́liis.'
