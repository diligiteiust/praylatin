bible: vulgate
lang: la
language: Latina
book: II Regum
chapter: "14"
verses:
  "1": In anno secúndo Ioas fílii Ióachaz regis Israel, regnávit Amasías fílius Ioas regis Iuda.
  "2": 'Vigínti quinque annórum erat cum regnáre cœpísset: vigínti autem et novem annis regnávit in Ierúsalem, nomen matris eius Ióadan de Ierúsalem.'
  "3": 'Et fecit rectum coram Dómino, verúmtamen non ut David pater eius. Iuxta ómnia, quæ fecit Ioas pater suus, fecit:'
  "4": 'nisi hoc tantum, quod excélsa non ábstulit: adhuc enim pópulus immolábat, et adolébat incénsum in excélsis.'
  "5": 'Cumque obtinuísset regnum, percússit servos suos, qui interfécerant regem patrem suum:'
  "6": 'fílios autem eórum, qui occíderant, non occídit, iuxta quod scriptum est in libro legis Móysi, sicut præcépit Dóminus, dicens: Non moriéntur patres pro fíliis, neque fílii moriéntur pro pátribus: sed unusquísque in peccáto suo moriétur.'
  "7": Ipse percússit Edom in valle Salinárum decem míllia, et apprehéndit petram in prœ́lio, vocavítque nomen eius Iéctehel usque in præséntem diem.
  "8": 'Tunc misit Amasías núntios ad Ioas fílium Ióachaz, fílii Iehu regis Israel, dicens: Veni, et videámus nos.'
  "9": 'Remisítque Ioas rex Israel ad Amasíam regem Iuda, dicens: Cárduus Líbani misit ad cedrum, quæ est in Líbano, dicens: Da fíliam tuam fílio meo uxórem. Transierúntque béstiæ saltus, quæ sunt in Líbano, et conculcavérunt cárduum.'
  "10": 'Percútiens invaluísti super Edom, et sublevávit te cor tuum: conténtus esto glória, et sede in domo tua: quare próvocas malum, ut cadas tu et Iudas tecum?'
  "11": Et non acquiévit Amasías. Ascendítque Ioas rex Israel, et vidérunt se, ipse et Amasías rex Iuda, in Béthsames óppido Iudæ.
  "12": Percussúsque est Iuda coram Israel, et fugérunt unusquísque in tabernácula sua.
  "13": 'Amasíam vero regem Iuda, fílium Ioas fílii Ochozíæ, cepit Ioas rex Israel in Béthsames, et addúxit eum in Ierúsalem: et interrúpit murum Ierúsalem, a porta Ephraim usque ad portam ánguli, quadringéntis cúbitis.'
  "14": Tulítque omne aurum, et argéntum, et univérsa vasa, quæ invénta sunt in domo Dómini, et in thesáuris regis, et óbsides, et revérsus est in Samaríam.
  "15": Réliqua autem verbórum Ioas quæ fecit, et fortitúdo eius qua pugnávit contra Amasíam regem Iuda, nonne hæc scripta sunt in Libro sermónum diérum regum Israel?
  "16": Dormivítque Ioas cum pátribus suis, et sepúltus est in Samaría cum régibus Israel, et regnávit Ieróboam fílius eius pro eo.
  "17": Vixit autem Amasías, fílius Ioas, rex Iuda, postquam mórtuus est Ioas fílius Ióachaz regis Israel, quíndecim annis.
  "18": Réliqua autem sermónum Amasíæ, nonne hæc scripta sunt in Libro sermónum diérum regum Iuda?
  "19": 'Factáque est contra eum coniurátio in Ierúsalem: at ille fugit in Lachis. Miserúntque post eum in Lachis, et interfecérunt eum ibi:'
  "20": et asportavérunt in equis, sepultúsque est in Ierúsalem cum pátribus suis in civitáte David.
  "21": Tulit autem univérsus pópulus Iudæ Azaríam annos natum sédecim, et constituérunt eum regem pro patre eius Amasía.
  "22": Ipse ædificávit Ælath, et restítuit eam Iudæ, postquam dormívit rex cum pátribus suis.
  "23": Anno quintodécimo Amasíæ fílii Ioas regis Iuda, regnávit Ieróboam fílius Ioas regis Israel in Samaría, quadragínta et uno anno.
  "24": 'Et fecit quod malum est coram Dómino: non recéssit ab ómnibus peccátis Ieróboam fílii Nabat, qui peccáre fecit Israel.'
  "25": Ipse restítuit términos Israel ab intróitu Emath usque ad mare solitúdinis, iuxta sermónem Dómini Dei Israel, quem locútus est per servum suum Ionam fílium Amáthi prophétam, qui erat de Geth, quæ est in Opher.
  "26": Vidit enim Dóminus afflictiónem Israel amáram nimis, et quod consúmpti essent usque ad clausos cárcere, et extrémos, et non esset qui auxiliarétur Israéli.
  "27": Nec locútus est Dóminus ut deléret nomen Israel de sub cælo, sed salvávit eos in manu Ieróboam fílii Ioas.
  "28": Réliqua autem sermónum Ieróboam, et univérsa quæ fecit, et fortitúdo eius, qua prœliátus est, et quómodo restítuit Damáscum, et Emath Iudæ in Israel, nonne hæc scripta sunt in Libro sermónum diérum regum Israel?
  "29": Dormivítque Ieróboam cum pátribus suis régibus Israel, et regnávit Zacharías fílius eius pro eo.
