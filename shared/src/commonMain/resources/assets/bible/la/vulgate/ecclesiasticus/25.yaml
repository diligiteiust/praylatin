bible: vulgate
lang: la
language: Latina
book: Ecclesiasticus
chapter: "25"
verses:
  "1": 'In tribus plácitum est spirítui meo, quæ sunt probáta coram Deo et homínibus:'
  "2": concórdia fratrum, et amor proximórum, et vir et múlier bene sibi consentiéntes.
  "3": 'Tres spécies odívit ánima mea, et ággravor valde ánimæ illórum:'
  "4": páuperem supérbum, dívitem mendácem, senem fátuum et insensátum.
  "5": Quæ in iuventúte tua non congregásti, quómodo in senectúte tua invénies?
  "6": Quam speciósum canitiéi iudícium, et presbýteris cognóscere consílium!
  "7": Quam speciósa veteránis sapiéntia, et gloriósis intelléctus, et consílium!
  "8": Coróna senum multa perítia, et glória illórum timor Dei.
  "9": 'Novem insuspicabília cordis magnificávi: et décimum dicam in lingua homínibus:'
  "10": homo, qui iucundátur in fíliis, vivens et videns subversiónem inimicórum suórum.
  "11": Beátus, qui hábitat cum mulíere sensáta, et qui lingua sua non est lapsus, et qui non servívit indígnis se.
  "12": Beátus, qui invénit amícum verum, et qui enárrat iustítiam auri audiénti.
  "13": Quam magnus, qui invénit sapiéntiam et sciéntiam! sed non est super timéntem Dóminum.
  "14": Timor Dei super ómnia se superpósuit.
  "15": 'Beátus homo, cui donátum est habére timórem Dei: qui tenet illum, cui assimilábitur?'
  "16": 'Timor Dei inítium dilectiónis eius: fídei autem inítium agglutinándum est ei.'
  "17": 'Omnis plaga tristítia cordis est: et omnis malítia, nequítia mulíeris.'
  "18": 'Et omnem plagam, et non plagam vidébit cordis:'
  "19": 'et omnem nequítiam, et non nequítiam mulíeris:'
  "20": 'et omnem obdúctum, et non obdúctum odiéntium:'
  "21": et omnem vindíctam, et non vindíctam inimicórum.
  "22": 'Non est caput néquius super caput cólubri:'
  "23": et non est ira super iram mulíeris. Commorári leóni et dracóni placébit, quam habitáre cum mulíere nequam.
  "24": 'Nequítia mulíeris immútat fáciem eius: et obcǽcat vultum suum tamquam ursus: et quasi saccum osténdit. In médio proximórum eius'
  "25": ingémuit vir eius, et áudiens suspirávit módicum.
  "26": 'Brevis omnis malítia super malítiam mulíeris: sors peccatórum cadat super illam.'
  "27": Sicut ascénsus arenósus in pédibus veteráni, sic múlier linguáta hómini quiéto.
  "28": Ne respícias in mulíeris spéciem, et non concupíscas mulíerem in spécie.
  "29": Mulíeris ira, et irreveréntia, et confúsio magna.
  "30": Múlier si primátum hábeat, contrária est viro suo.
  "31": Cor húmile, et fácies tristis, et plaga cordis, múlier nequam.
  "32": Manus débiles, et génua dissolúta, múlier quæ non beatíficat virum suum.
  "33": A mulíere inítium factum est peccáti, et per illam omnes mórimur.
  "34": 'Non des aquæ tuæ éxitum, nec módicum: nec mulíeri nequam véniam prodeúndi.'
  "35": Si non ambuláverit ad manum tuam, confúndet te in conspéctu inimicórum.
  "36": A cárnibus tuis abscínde illam, ne semper te abutátur.
