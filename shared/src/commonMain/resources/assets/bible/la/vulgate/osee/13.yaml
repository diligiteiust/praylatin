bible: vulgate
lang: la
language: Latina
book: Osee
chapter: "13"
verses:
  "1": Loquénte Ephraim, horror invásit Israel, et delíquit in Baal, et mórtuus est.
  "2": 'Et nunc addidérunt ad peccándum: fecerúntque sibi conflátile de argénto suo quasi similitúdinem idolórum, factúra artíficum totum est: his ipsi dicunt: Immoláte hómines vítulos adorántes.'
  "3": Idcírco erunt quasi nubes matutína, et sicut ros matutínus prætériens, sicut pulvis túrbine raptus ex área, et sicut fumus de fumário.
  "4": 'Ego autem Dóminus Deus tuus, ex terra Ægýpti: et Deum absque me néscies, et salvátor non est præter me.'
  "5": Ego cognóvi te in desérto, in terra solitúdinis.
  "6": 'Iuxta páscua sua adimpléti sunt, et saturáti sunt: et levavérunt cor suum, et oblíti sunt mei.'
  "7": Et ego ero eis quasi leǽna, sicut pardus in via Assyriórum.
  "8": 'Occúrram eis quasi ursa raptis cátulis, et dirúmpam interióra iécoris eórum: et consúmam eos ibi quasi leo, béstia agri scindet eos.'
  "9": 'Perdítio tua Israel: tantúmmodo in me auxílium tuum.'
  "10": 'Ubi est rex tuus? máxime nunc salvet te in ómnibus úrbibus tuis: et iúdices tui, de quibus dixísti: Da mihi regem et príncipes.'
  "11": Dabo tibi regem in furóre meo, et áuferam in indignatióne mea.
  "12": Colligáta est iníquitas Ephraim, abscónditum peccátum eius.
  "13": 'Dolóres parturiéntis vénient ei: ipse fílius non sápiens: nunc enim non stabit in contritióne filiórum.'
  "14": 'De manu mortis liberábo eos, de morte rédimam eos: ero mors tua o mors, morsus tuus ero inférne: consolátio abscóndita est ab óculis meis.'
  "15": 'Quia ipse inter fratres dívidet: addúcet uréntem ventum Dóminus de desérto ascendéntem: et siccábit venas eius, et desolábit fontem eius, et ipse dirípiet thesáurum omnis vasis desiderábilis.'
