bible: vulgate
lang: la
language: Latina
book: Proverbia
chapter: "26"
verses:
  "1": 'Quómodo nix in æstáte, et plúviæ in messe: sic índecens est stulto glória.'
  "2": 'Sicut avis ad ália tránsvolans, et passer quólibet vadens: sic maledíctum frustra prolátum in quémpiam supervéniet.'
  "3": Flagéllum equo, et camus ásino, et virga in dorso imprudéntium.
  "4": Ne respóndeas stulto iuxta stultítiam suam, ne efficiáris ei símilis.
  "5": Respónde stulto iuxta stultítiam suam, ne sibi sápiens esse videátur.
  "6": Claudus pédibus, et iniquitátem bibens, qui mittit verba per núntium stultum.
  "7": 'Quómodo pulchras frustra habet claudus tíbias: sic índecens est in ore stultórum parábola.'
  "8": 'Sicut qui mittit lápidem in acérvum Mercúrii: ita qui tríbuit insipiénti honórem.'
  "9": 'Quómodo si spina nascátur in manu temulénti: sic parábola in ore stultórum.'
  "10": 'Iudícium detérminat causas: et qui impónit stulto siléntium, iras mítigat.'
  "11": Sicut canis, qui revértitur ad vómitum suum, sic imprúdens, qui íterat stultítiam suam.
  "12": Vidísti hóminem sapiéntem sibi vidéri? magis illo spem habébit insípiens.
  "13": 'Dicit piger: Leo est in via, et leǽna in itinéribus:'
  "14": sicut óstium vértitur in cárdine suo, ita piger in léctulo suo.
  "15": Abscóndit piger manum sub ascélla sua, et labórat si ad os suum eam convérterit.
  "16": Sapiéntior sibi piger vidétur septem viris loquéntibus senténtias.
  "17": Sicut qui apprehéndit áuribus canem, sic qui transit impátiens, et commiscétur rixæ altérius.
  "18": 'Sicut nóxius est qui mittit sagíttas, et lánceas in mortem:'
  "19": 'ita vir fraudulénter nocet amíco suo: et cum fúerit deprehénsus dicit: Ludens feci.'
  "20": 'Cum defécerint ligna, exstinguétur ignis: et susurróne subtrácto, iúrgia conquiéscent.'
  "21": Sicut carbónes ad prunas, et ligna ad ignem, sic homo iracúndus súscitat rixas.
  "22": Verba susurrónis quasi simplícia, et ipsa pervéniunt ad íntima ventris.
  "23": Quómodo si argénto sórdido ornáre velis vas fíctile, sic lábia tuméntia cum péssimo corde sociáta.
  "24": Lábiis suis intellígitur inimícus, cum in corde tractáverit dolos.
  "25": 'Quando submíserit vocem suam, ne credíderis ei: quóniam septem nequítiæ sunt in corde illíus.'
  "26": Qui óperit ódium fraudulénter, revelábitur malítia eius in consílio.
  "27": 'Qui fodit fóveam, íncidet in eam: et qui volvit lápidem, revertétur ad eum.'
  "28": 'Lingua fallax non amat veritátem: et os lúbricum operátur ruínas.'
