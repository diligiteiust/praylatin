bible: vulgate
lang: la
language: Latina
book: I Samuelis
chapter: "5"
verses:
  "1": Philísthiim autem tulérunt arcam Dei, et asportavérunt eam a Lápide adiutórii in Azótum.
  "2": Tulerúntque Philísthiim arcam Dei, et intulérunt eam in templum Dagon, et statuérunt eam iuxta Dagon.
  "3": 'Cumque surrexíssent dilúculo Azótii áltera die, ecce Dagon iacébat pronus in terra ante arcam Dómini: et tulérunt Dagon, et restituérunt eum in locum suum.'
  "4": 'Rursúmque mane die áltera consurgéntes, invenérunt Dagon iacéntem super fáciem suam in terra coram arca Dómini: caput autem Dagon, et duæ palmæ mánuum eius abscíssæ erant super limen:'
  "5": porro Dagon solus truncus remánserat in loco suo. Propter hanc causam non calcant sacerdótes Dagon, et omnes qui ingrediúntur templum eius, super limen Dagon in Azóto, usque in hodiérnum diem.
  "6": 'Aggraváta est autem manus Dómini super Azótios, et demolítus est eos: et percússit in secretióri parte nátium Azótum, et fines eius. Et ebulliérunt villæ et agri in médio regiónis illíus, et nati sunt mures, et facta est confúsio mortis magnæ in civitáte.'
  "7": 'Vidéntes autem viri Azótii huiuscémodi plagam, dixérunt: Non máneat arca Dei Israel apud nos: quóniam dura est manus eius super nos, et super Dagon deum nostrum.'
  "8": 'Et mitténtes congregavérunt omnes sátrapas Philisthinórum ad se, et dixérunt: Quid faciémus de arca Dei Israel? Responderúntque Gethǽi: Circumducátur arca Dei Israel. Et circumduxérunt arcam Dei Israel.'
  "9": 'Illis autem circumducéntibus eam, fiébat manus Dómini per síngulas civitátes interfectiónis magnæ nimis: et percutiébat viros uniuscuiúsque urbis, a parvo usque ad maiórem, et computrescébant prominéntes extáles eórum. Inierúntque Gethǽi consílium, et fecérunt sibi sedes pellíceas.'
  "10": 'Misérunt ergo arcam Dei in Accaron. Cumque venísset arca Dei in Accaron, exclamavérunt Accaronítæ, dicéntes: Adduxérunt ad nos arcam Dei Israel, ut interfíciat nos et pópulum nostrum.'
  "11": 'Misérunt ítaque et congregavérunt omnes sátrapas Philisthinórum: qui dixérunt: Dimíttite arcam Dei Israel, et revertátur in locum suum, et non interfíciat nos cum pópulo nostro.'
  "12": 'Fiébat enim pavor mortis in síngulis úrbibus, et gravíssima valde manus Dei: viri quoque, qui mórtui non fúerant, percutiebántur in secretióri parte nátium: et ascendébat ululátus uniuscuiúsque civitátis in cælum.'
