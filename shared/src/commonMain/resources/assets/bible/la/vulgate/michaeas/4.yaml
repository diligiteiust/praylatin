bible: vulgate
lang: la
language: Latina
book: Michaeas
chapter: "4"
verses:
  "1": 'Et erit: in novíssimo diérum erit mons domus Dómini præparátus in vértice móntium, et sublímis super colles: et fluent ad eum pópuli.'
  "2": 'Et properábunt gentes multæ, et dicent: Veníte, ascendámus ad montem Dómini, et ad domum Dei Iacob: et docébit nos de viis suis, et íbimus in sémitis eius: quia de Sion egrediétur lex, et verbum Dómini de Ierúsalem.'
  "3": 'Et iudicábit inter pópulos multos, et corrípiet gentes fortes usque in longínquum: et concídent gládios suos in vómeres, et hastas suas in ligónes: non sumet gens advérsus gentem gládium, et non discent ultra belligeráre.'
  "4": 'Et sedébit vir subtus vitem suam, et subtus ficum suam, et non erit qui detérreat: quia os Dómini exercítuum locútum est.'
  "5": 'Quia omnes pópuli ambulábunt unusquísque in nómine dei sui: nos autem ambulábimus in nómine Dómini Dei nostri, in ætérnum et ultra.'
  "6": 'In die illa, dicit Dóminus, congregábo claudicántem: et eam, quam eiéceram, cólligam, et quam afflíxeram:'
  "7": 'et ponam claudicántem in relíquias: et eam, quæ laboráverat, in gentem robústam: et regnábit Dóminus super eos in monte Sion, ex hoc nunc et usque in ætérnum.'
  "8": 'Et tu turris gregis nebulósa fíliæ Sion usque ad te véniet: et véniet potéstas prima, regnum fíliæ Ierúsalem.'
  "9": Nunc quare mœróre contráheris? numquid rex non est tibi, aut consiliárius tuus périit, quia comprehéndit te dolor sicut parturiéntem?
  "10": 'Dole et sátage fília Sion quasi partúriens: quia nunc egrediéris de civitáte, et habitábis in regióne, et vénies usque ad Babylónem, ibi liberáberis: ibi rédimet te Dóminus de manu inimicórum tuórum.'
  "11": 'Et nunc congregátæ sunt super te gentes multæ, quæ dicunt: Lapidétur: et aspíciat in Sion óculus noster.'
  "12": 'Ipsi autem non cognovérunt cogitatiónes Dómini, et non intellexérunt consílium eius: quia congregávit eos quasi fœnum áreæ.'
  "13": 'Surge et tritúra fília Sion: quia cornu tuum ponam férreum, et úngulas tuas ponam ǽreas: et commínues pópulos multos, et interfícies Dómino rapínas eórum, et fortitúdinem eórum Dómino univérsæ terræ.'
