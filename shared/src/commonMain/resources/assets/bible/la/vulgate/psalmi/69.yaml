bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "69"
verses:
  "1": In finem, Psalmus David, In rememoratiónem, quod salvum fécerit eum Dóminus.
  "2": 'Deus in adiutórium meum inténde: Dómine ad adiuvándum me festína.'
  "3": 'Confundántur, et revereántur, qui quærunt ánimam meam:'
  "4": 'avertántur retrórsum, et erubéscant, qui volunt mihi mala: avertántur statim erubescéntes, qui dicunt mihi: Euge, euge.'
  "5": 'Exsúltent et læténtur in te omnes qui quærunt te, et dicant semper: Magnificétur Dóminus, qui díligunt salutáre tuum.'
  "6": 'Ego vero egénus, et pauper sum: Deus ádiuva me. Adiútor meus, et liberátor meus es tu: Dómine ne moréris.'
