bible: vulgate
lang: la
language: Latina
book: ad Corinthios II
chapter: "11"
verses:
  "1": 'Utinam sustinerétis módicum quid insipiéntiæ meæ, sed et supportáre me:'
  "2": ǽmulor enim vos Dei æmulatióne. Despóndi enim vos uni viro, vírginem castam exhibére Christo.
  "3": Tímeo autem ne sicut serpens Hevam sedúxit astútia sua, ita corrumpántur sensus vestri, et éxcidant a simplicitáte, quæ est in Christo.
  "4": 'Nam si is qui venit, álium Christum prǽdicat, quem non prædicávimus, aut álium spíritum accípitis, quem non accepístis: aut áliud Evangélium, quod non recepístis: recte paterémini.'
  "5": Exístimo enim nihil me minus fecísse a magnis Apóstolis.
  "6": Nam etsi imperítus sermóne, sed non sciéntia, in ómnibus autem manifestáti sumus vobis.
  "7": Aut numquid peccátum feci, meípsum humílians, ut vos exaltémini? quóniam gratis Evangélium Dei evangelizávi vobis?
  "8": Alias ecclésias exspoliávi, accípiens stipéndium ad ministérium vestrum.
  "9": 'Et cum essem apud vos, et egérem, nulli onerósus fui: nam quod mihi déerat, supplevérunt fratres, qui venérunt a Macedónia: et in ómnibus sine ónere me vobis servávi, et servábo.'
  "10": Est véritas Christi in me, quóniam hæc gloriátio non infringétur in me in regiónibus Acháiæ.
  "11": Quare? quia non díligo vos? Deus scit.
  "12": 'Quod autem fácio, et fáciam: ut ámputem occasiónem eórum, qui volunt occasiónem, ut in quo gloriántur, inveniántur sicut et nos.'
  "13": Nam eiúsmodi pseudoapóstoli sunt operárii súbdoli, transfigurántes se in apóstolos Christi.
  "14": 'Et non mirum: ipse enim Sátanas transfigúrat se in ángelum lucis.'
  "15": 'Non est ergo magnum, si minístri eius transfiguréntur velut minístri iustítiæ: quorum finis erit secúndum ópera ipsórum.'
  "16": Iterum dico (ne quis me putet insipiéntem esse, alióquin velut insipiéntem accípite me, ut et ego módicum quid glórier),
  "17": quod loquor, non loquor secúndum Deum, sed quasi in insipiéntia, in hac substántia glóriæ.
  "18": 'Quóniam multi gloriántur secúndum carnem: et ego gloriábor.'
  "19": Libénter enim suffértis insipiéntes, cum sitis ipsi sapiéntes.
  "20": Sustinétis enim si quis vos in servitútem rédigit, si quis dévorat, si quis áccipit, si quis extóllitur, si quis in fáciem vos cædit.
  "21": 'Secúndum ignobilitátem dico, quasi nos infírmi fuérimus in hac parte. In quo quis audet (in insipiéntia dico) áudeo et ego:'
  "22": 'Hebrǽi sunt, et ego: Israelítæ sunt, et ego: semen Abrahæ sunt, et ego:'
  "23": 'minístri Christi sunt (ut minus sápiens dico), plus ego: in labóribus plúrimis, in carcéribus abundántius, in plagis supra modum, in mórtibus frequénter.'
  "24": A Iudǽis quínquies, quadragénas, una minus, accépi.
  "25": 'Ter virgis cæsus sum, semel lapidátus sum: ter naufrágium feci, nocte et die in profúndo maris fui,'
  "26": 'in itinéribus sæpe, perículis flúminum, perículis latrónum, perículis ex génere, perículis ex géntibus, perículis in civitáte, perículis in solitúdine, perículis in mari, perículis in falsis frátribus:'
  "27": 'in labóre, et ærúmna, in vigíliis multis, in fame, et siti, in ieiúniis multis, in frígore, et nuditáte:'
  "28": præter illa, quæ extrínsecus sunt, instántia mea quotidiána, sollicitúdo ómnium ecclesiárum.
  "29": Quis infirmátur, et ego non infírmor? quis scandalizátur, et ego non uror?
  "30": 'Si gloriári opórtet: quæ infirmitátis meæ sunt, gloriábor.'
  "31": Deus et Pater Dómini nostri Iesu Christi, qui est benedíctus in sǽcula, scit quod non méntior.
  "32": 'Damásci præpósitus gentis Arétæ regis custodiébat civitátem Damascenórum ut me comprehénderet:'
  "33": et per fenéstram in sporta dimíssus sum per murum, et sic effúgi manus eius.
