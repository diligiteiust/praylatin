bible: vulgate
lang: la
language: Latina
book: Isaias
chapter: "66"
verses:
  "1": 'Hæc dicit Dóminus: Cælum sedes mea, terra autem scabéllum pedum meórum. Quæ est ista domus, quam ædificábitis mihi? et quis est iste locus quiétis meæ?'
  "2": 'Omnia hæc manus mea fecit, et facta sunt univérsa ista, dicit Dóminus: ad quem autem respíciam, nisi ad paupérculum, et contrítum spíritu, et treméntem sermónes meos?'
  "3": 'Qui ímmolat bovem, quasi qui interfíciat virum: qui mactat pecus, quasi qui excérebret canem: qui offert oblatiónem, quasi qui sánguinem suíllum ófferat: qui recordátur thuris, quasi qui benedícat idólo. Hæc ómnia elegérunt in viis suis, et in abominatiónibus suis ánima eórum delectáta est.'
  "4": 'Unde et ego éligam illusiónes eórum: et quæ timébant, addúcam eis: quia vocávi, et non erat qui respondéret: locútus sum, et non audiérunt: fecerúntque malum in óculis meis, et quæ nólui elegérunt.'
  "5": 'Audíte verbum Dómini, qui trémitis ad verbum eius: dixérunt fratres vestri odiéntes vos, et abiciéntes propter nomen meum: glorificétur Dóminus, et vidébimus in lætítia vestra: ipsi autem confundéntur.'
  "6": Vox pópuli de civitáte, vox de templo, vox Dómini reddéntis retributiónem inimícis suis.
  "7": 'Antequam parturíret, péperit: ántequam veníret partus eius, péperit másculum.'
  "8": Quis audívit unquam tale? et quis vidit huic símile? numquid partúriet terra in die una, aut pariétur gens simul, quia parturívit et péperit Sion fílios suos?
  "9": Numquid ego, qui álios párere fácio, ipse non páriam, dicit Dóminus? si ego, qui generatiónem céteris tríbuo, stérilis ero, ait Dóminus Deus tuus?
  "10": 'Lætámini cum Ierúsalem, et exsultáte in ea omnes qui dilígitis eam: gaudéte cum ea gáudio univérsi, qui lugétis super eam,'
  "11": 'ut sugátis, et repleámini ab úbere consolatiónis eius: ut mulgeátis, et delíciis affluátis ab omnímoda glória eius.'
  "12": 'Quia hæc dicit Dóminus: Ecce ego declinábo super eam quasi flúvium pacis, et quasi torréntem inundántem glóriam géntium, quam sugétis: ad úbera portabímini, et super génua blandiéntur vobis.'
  "13": Quómodo si cui mater blandiátur, ita ego consolábor vos, et in Ierúsalem consolabímini.
  "14": 'Vidébitis, et gaudébit cor vestrum, et ossa vestra quasi herba germinábunt: et cognoscétur manus Dómini servis eius, et indignábitur inimícis suis.'
  "15": 'Quia ecce Dóminus in igne véniet, et quasi turbo quadrígæ eius: réddere in indignatióne furórem suum, et increpatiónem suam in flamma ignis:'
  "16": quia in igne Dóminus diiudicábit, et in gládio suo ad omnem carnem, et multiplicabúntur interfécti a Dómino,
  "17": 'qui sanctificabántur, et mundos se putábant in hortis post iánuam intrínsecus, qui comedébant carnem suíllam, et abominatiónem et murem: simul consuméntur, dicit Dóminus.'
  "18": 'Ego autem ópera eórum, et cogitatiónes eórum: vénio ut cóngregem cum ómnibus géntibus et linguis: et vénient et vidébunt glóriam meam.'
  "19": 'Et ponam in eis signum, et mittam ex eis, qui salváti fúerint, ad gentes in mare, in Africam, et Lýdiam, tendéntes sagíttam: in Itáliam et Grǽciam, ad ínsulas longe, ad eos, qui non audiérunt de me, et non vidérunt glóriam meam. Et annuntiábunt glóriam meam géntibus,'
  "20": et addúcent omnes fratres vestros de cunctis géntibus donum Dómino, in equis, et in quadrígis, et in lectícis, et in mulis, et in carrúcis, ad montem sanctum meum Ierúsalem, dicit Dóminus, quómodo si ínferant fílii Israel munus in vase mundo in domum Dómini.
  "21": Et assúmam ex eis in sacerdótes, et Levítas, dicit Dóminus.
  "22": 'Quia sicut cæli novi et terra nova, quæ ego fácio stare coram me, dicit Dóminus: sic stabit semen vestrum, et nomen vestrum.'
  "23": 'Et erit mensis ex mense, et sábbatum ex sábbato: véniet omnis caro ut adóret coram fácie mea, dicit Dóminus.'
  "24": 'Et egrediéntur, et vidébunt cadávera virórum, qui prævaricáti sunt in me: vermis eórum non moriétur, et ignis eórum non exstinguétur: et erunt usque ad satietátem visiónis omni carni.'
