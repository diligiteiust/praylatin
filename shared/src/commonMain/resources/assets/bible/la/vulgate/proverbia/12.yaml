bible: vulgate
lang: la
language: Latina
book: Proverbia
chapter: "12"
verses:
  "1": 'Qui díligit disciplínam, díligit sciéntiam: qui autem odit increpatiónes, insípiens est.'
  "2": 'Qui bonus est, háuriet grátiam a Dómino: qui autem confídit in cogitatiónibus suis ímpie agit.'
  "3": 'Non roborábitur homo ex impietáte: et radix iustórum non commovébitur.'
  "4": 'Múlier díligens, coróna est viro suo: et putrédo in óssibus eius, quæ confusióne res dignas gerit.'
  "5": 'Cogitatiónes iustórum iudícia: et consília impiórum fraudulénta.'
  "6": 'Verba impiórum insidiántur sánguini: os iustórum liberábit eos.'
  "7": 'Verte ímpios, et non erunt: domus autem iustórum permanébit.'
  "8": 'Doctrína sua noscétur vir: qui autem vanus et excors est, patébit contémptui.'
  "9": Mélior est pauper et suffíciens sibi, quam gloriósus et índigens pane.
  "10": 'Novit iustus iumentórum suórum ánimas: víscera autem impiórum crudélia.'
  "11": 'Qui operátur terram suam, satiábitur pánibus: qui autem sectátur ótium, stultíssimus est. Qui suávis est in vini demoratiónibus, in suis munitiónibus relínquit contuméliam.'
  "12": 'Desidérium ímpii muniméntum est pessimórum: radix autem iustórum profíciet.'
  "13": 'Propter peccáta labiórum ruína próximat malo: effúgiet autem iustus de angústia.'
  "14": De fructu oris sui unusquísque replébitur bonis, et iuxta ópera mánuum suárum retribuétur ei.
  "15": 'Via stulti recta in óculis eius: qui autem sápiens est, audit consília.'
  "16": 'Fátuus statim índicat iram suam: qui autem dissímulat iniúriam, cállidus est.'
  "17": 'Qui quod novit lóquitur, index iustítiæ est: qui autem mentítur, testis est frauduléntus.'
  "18": 'Est qui promíttit, et quasi gládio púngitur consciéntiæ: lingua autem sapiéntium sánitas est.'
  "19": 'Lábium veritátis firmum erit in perpétuum: qui autem testis est repentínus, concínnat linguam mendácii.'
  "20": 'Dolus in corde cogitántium mala: qui autem pacis íneunt consília, séquitur eos gáudium.'
  "21": 'Non contristábit iustum quidquid ei accíderit: ímpii autem replebúntur malo.'
  "22": 'Abominátio est Dómino lábia mendácia: qui autem fidéliter agunt, placent ei.'
  "23": 'Homo versútus celat sciéntiam: et cor insipiéntium próvocat stultítiam.'
  "24": 'Manus fórtium dominábitur: quæ autem remíssa est, tribútis sérviet.'
  "25": Mœror in corde viri humiliábit illum, et sermóne bono lætificábitur.
  "26": 'Qui négligit damnum propter amícum, iustus est: iter autem impiórum decípiet eos.'
  "27": 'Non invéniet frauduléntus lucrum: et substántia hóminis erit auri prétium.'
  "28": 'In sémita iustítiæ, vita: iter autem dévium ducit ad mortem.'
