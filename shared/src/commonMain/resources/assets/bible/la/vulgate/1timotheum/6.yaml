bible: vulgate
lang: la
language: Latina
book: ad Timotheum I
chapter: "6"
verses:
  "1": Quicúmque sunt sub iugo servi, dóminos suos omni honóre dignos arbitréntur, ne nomen Dómini et doctrína blasphemétur.
  "2": 'Qui autem fidéles habent dóminos, non contémnant, quia fratres sunt: sed magis sérviant, quia fidéles sunt et dilécti, qui benefícii partícipes sunt. Hæc doce, et exhortáre.'
  "3": 'Si quis áliter docet, et non acquiéscit sanis sermónibus Dómini nostri Iesu Christi, et ei, quæ secúndum pietátem est, doctrínæ:'
  "4": 'supérbus est, nihil sciens, sed languens circa quæstiónes, et pugnas verbórum: ex quibus oriúntur invídiæ, contentiónes, blasphémiæ, suspiciónes malæ,'
  "5": conflictatiónes hóminum mente corruptórum, et qui veritáte priváti sunt, existimántium quæstum esse pietátem.
  "6": Est autem quæstus magnus píetas cum sufficiéntia.
  "7": 'Nihil enim intúlimus in hunc mundum: haud dúbium quod nec auférre quid póssumus.'
  "8": Habéntes autem aliménta, et quibus tegámur, his conténti simus.
  "9": Nam qui volunt dívites fíeri, íncidunt in tentatiónem, et in láqueum diáboli, et desidéria multa inutília, et nocíva, quæ mergunt hómines in intéritum, et perditiónem.
  "10": 'Radix enim ómnium malórum est cupíditas: quam quidam appeténtes erravérunt a fide, et inseruérunt se dolóribus multis.'
  "11": 'Tu autem o homo Dei hæc fuge: sectáre vero iustítiam, pietátem, fidem, caritátem, patiéntiam, mansuetúdinem.'
  "12": Certa bonum certámen fídei, apprehénde vitam ætérnam, in qua vocátus es, et conféssus bonam confessiónem coram multis téstibus.
  "13": 'Præcípio tibi coram Deo, qui vivíficat ómnia, et Christo Iesu, qui testimónium réddidit sub Póntio Piláto, bonam confessiónem:'
  "14": ut serves mandátum sine mácula, irreprehensíbile usque in advéntum Dómini nostri Iesu Christi,
  "15": 'quem suis tempóribus osténdet beátus et solus potens, Rex regum, et Dóminus dominántium:'
  "16": 'qui solus habet immortalitátem, et lucem inhábitat inaccessíbilem: quem nullus hóminum vidit, sed nec vidére potest: cui honor, et impérium sempitérnum. Amen.'
  "17": Divítibus huius sǽculi prǽcipe non sublíme sápere, neque speráre in incérto divitiárum, sed in Deo vivo (qui præstat nobis ómnia abúnde ad fruéndum)
  "18": bene ágere, dívites fíeri in bonis opéribus, fácile tribúere, communicáre,
  "19": thesaurizáre sibi fundaméntum bonum in futúrum, ut apprehéndant veram vitam.
  "20": O Timóthee, depósitum custódi, devítans profánas vocum novitátes, et oppositiónes falsi nóminis sciéntiæ,
  "21": quam quidam promitténtes, circa fidem excidérunt. Grátia tecum. Amen.
