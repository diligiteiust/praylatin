bible: vulgate
lang: la
language: Latina
book: Isaias
chapter: "47"
verses:
  "1": 'Descénde, sede in púlvere virgo fília Bábylon, sede in terra: non est sólium fíliæ Chaldæórum, quia ultra non vocáberis mollis et ténera.'
  "2": 'Tolle molam, et mole farínam: denúda turpitúdinem tuam: discoóperi húmerum, revéla crura, transi flúmina.'
  "3": 'Revelábitur ignomínia tua, et vidébitur oppróbrium tuum: ultiónem cápiam, et non resístet mihi homo.'
  "4": Redémptor noster, Dóminus exercítuum nomen illíus, sanctus Israel.
  "5": 'Sede tacens, et intra in ténebras fília Chaldæórum: quia non vocáberis ultra dómina regnórum.'
  "6": 'Irátus sum super pópulum meum: contaminávi hereditátem meam, et dedi eos in manu tua: non posuísti eis misericórdias: super senem aggravásti iugum tuum valde.'
  "7": 'Et dixísti: In sempitérnum ero dómina: non posuísti hæc super cor tuum, neque recordáta es novíssimi tui.'
  "8": 'Et nunc audi hæc delicáta, et hábitans confidénter, quæ dicis in corde tuo: Ego sum, et non est præter me ámplius: non sedébo vídua, et ignorábo sterilitátem.'
  "9": 'Vénient tibi duo hæc súbito in die una, sterílitas et vidúitas: univérsa venérunt super te, propter multitúdinem maleficiórum tuórum, et propter durítiam incantatórum tuórum veheméntem.'
  "10": 'Et fidúciam habuísti in malítia tua, et dixísti: Non est qui vídeat me: sapiéntia tua et sciéntia tua hæc decépit te. Et dixísti in corde tuo: Ego sum, et præter me non est áltera.'
  "11": 'Véniet super te malum, et néscies ortum eius: et írruet super te calámitas, quam non póteris expiáre: véniet super te repénte miséria, quam néscies.'
  "12": Sta cum incantatóribus tuis, et cum multitúdine maleficiórum tuórum, in quibus laborásti ab adolescéntia tua, si forte quid prosit tibi, aut si possis fíeri fórtior.
  "13": 'Defecísti in multitúdine consiliórum tuórum: stent, et salvent te áugures cæli, qui contemplabántur sídera, et supputábant menses, ut ex eis annuntiárent ventúra tibi.'
  "14": 'Ecce facti sunt quasi stípula, ignis combússit eos: non liberábunt ánimam suam de manu flammæ: non sunt prunæ, quibus calefíant, nec focus, ut sédeant ad eum.'
  "15": 'Sic facta sunt tibi in quibuscúmque laboráveras: negotiatóres tui ab adolescéntia tua, unusquísque in via sua erravérunt: non est qui salvet te.'
