bible: vulgate
lang: la
language: Latina
book: Isaias
chapter: "48"
verses:
  "1": Audíte hæc domus Iacob, qui vocámini nómine Israel, et de aquis Iuda exístis, qui iurátis in nómine Dómini, et Dei Israel recordámini non in veritáte neque in iustítia.
  "2": 'De civitáte enim sancta vocáti sunt, et super Deum Israel constabilíti sunt: Dóminus exercítuum nomen eius.'
  "3": 'Prióra ex tunc annuntiávi, et ex ore meo exiérunt, et audíta feci ea: repénte operátus sum, et venérunt.'
  "4": Scivi enim quia durus es tu, et nervus férreus cervix tua, et frons tua ǽrea.
  "5": 'Prædíxi tibi ex tunc: ántequam venírent indicávi tibi, ne forte díceres: Idóla mea fecérunt hæc, et sculptília mea, et conflatília mandavérunt ista.'
  "6": 'Quæ audísti, vide ómnia: vos autem, num annuntiástis? Audíta feci tibi nova ex tunc, et conserváta sunt quæ nescis:'
  "7": 'nunc creáta sunt, et non ex tunc: et ante diem, et non audísti ea, ne forte dicas: Ecce ego cognóvi ea.'
  "8": 'Neque audísti, neque cognovísti, neque ex tunc apérta est auris tua: scio enim quia præváricans prævaricáberis, et transgressórem ex útero vocávi te.'
  "9": 'Propter nomen meum longe fáciam furórem meum: et laude mea infrenábo te, ne intéreas.'
  "10": 'Ecce excóxi te, sed non quasi argéntum: elégi te in camíno paupertátis.'
  "11": 'Propter me, propter me fáciam, ut non blasphémer: et glóriam meam álteri non dabo.'
  "12": 'Audi me Iacob, et Israel quem ego voco: ego ipse, ego primus, et ego novíssimus.'
  "13": 'Manus quoque mea fundávit terram, et déxtera mea mensa est cælos: ego vocábo eos, et stabunt simul.'
  "14": 'Congregámini omnes vos, et audíte: quis de eis annuntiávit hæc? Dóminus diléxit eum, fáciet voluntátem suam in Babylóne, et bráchium suum in Chaldǽis.'
  "15": 'Ego ego locútus sum, et vocávi eum: addúxi eum, et dirécta est via eius.'
  "16": 'Accédite ad me, et audíte hoc: non a princípio in abscóndito locútus sum: ex témpore ántequam fíeret, ibi eram: et nunc Dóminus Deus misit me, et spíritus eius.'
  "17": 'Hæc dicit Dóminus redémptor tuus sanctus Israel: Ego Dóminus Deus tuus, docens te utília, gubérnans te in via, qua ámbulas.'
  "18": 'Utinam attendísses mandáta mea: facta fuísset sicut flumen pax tua, et iustítia tua sicut gúrgites maris:'
  "19": 'et fuísset quasi aréna semen tuum, et stirps úteri tui ut lapílli eius: non interísset, et non fuísset attrítum nomen eius a fácie mea.'
  "20": 'Egredímini de Babylóne, fúgite a Chaldǽis, in voce exsultatiónis annuntiáte: audítum fácite hoc, et efférte illud usque ad extréma terræ. Dícite: Redémit Dóminus servum suum Iacob.'
  "21": 'Non sitiérunt in desérto, cum edúceret eos: aquam de petra prodúxit eis, et scidit petram, et fluxérunt aquæ.'
  "22": Non est pax ímpiis, dicit Dóminus.
