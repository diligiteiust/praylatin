bible: vulgate
lang: la
language: Latina
book: Lucas
chapter: "12"
verses:
  "1": 'Multis autem turbis circumstántibus, ita ut se ínvicem conculcárent, cœpit dícere ad discípulos suos: Atténdite a ferménto Pharisæórum, quod est hypócrisis.'
  "2": 'Nihil autem opértum est, quod non revelétur: neque abscónditum, quod non sciátur.'
  "3": 'Quóniam quæ in ténebris dixístis, in lúmine dicéntur: et quod in aurem locúti estis in cubículis, prædicábitur in tectis.'
  "4": 'Dico autem vobis amícis meis: Ne terreámini ab his, qui occídunt corpus, et post hæc non habent ámplius quid fáciant.'
  "5": 'Osténdam autem vobis quem timeátis: timéte eum qui, postquam occíderit, habet potestátem míttere in gehénnam: ita dico vobis, hunc timéte.'
  "6": Nonne quinque pásseres véneunt dipóndio, et unus ex illis non est in oblivióne coram Deo?
  "7": 'Sed et capílli cápitis vestri omnes numeráti sunt. Nolíte ergo timére: multis passéribus pluris estis vos.'
  "8": 'Dico autem vobis: Omnis, quicúmque conféssus fúerit me coram homínibus, et Fílius hóminis confitébitur illum coram ángelis Dei:'
  "9": qui autem negáverit me coram homínibus, negábitur coram ángelis Dei.
  "10": 'Et omnis, qui dicit verbum in Fílium hóminis, remittétur illi: ei autem, qui in Spíritum sanctum blasphemáverit, non remittétur.'
  "11": Cum autem indúcent vos in synagógas, et ad magistrátus, et potestátes, nolíte sollíciti esse quáliter, aut quid respondeátis, aut quid dicátis.
  "12": Spíritus enim sanctus docébit vos in ipsa hora quid opórteat vos dícere.
  "13": 'Ait autem ei quidam de turba: Magíster, dic fratri meo ut dívidat mecum hereditátem.'
  "14": 'At ille dixit illi: Homo, quis me constítuit iúdicem, aut divisórem super vos?'
  "15": 'Dixítque ad illos: Vidéte, et cavéte ab omni avarítia: quia non in abundántia cuiúsquam vita eius est ex his quæ póssidet.'
  "16": 'Dixit autem similitúdinem ad illos, dicens: Hóminis cuiúsdam dívitis úberes fructus ager áttulit:'
  "17": 'et cogitábat intra se, dicens: Quid fáciam, quia non hábeo quo cóngregem fructus meos?'
  "18": 'Et dixit: Hoc fáciam: déstruam hórrea mea, et maióra fáciam: et illuc congregábo ómnia, quæ nata sunt mihi, et bona mea,'
  "19": 'et dicam ánimæ meæ: Anima, habes multa bona pósita in annos plúrimos: requiésce, cómede, bibe, epuláre.'
  "20": 'Dixit autem illi Deus: Stulte, hac nocte ánimam tuam répetunt a te: quæ autem parásti, cuius erunt?'
  "21": Sic est qui sibi thesaurízat, et non est in Deum dives.
  "22": 'Dixítque ad discípulos suos: Ideo dico vobis, nolíte sollíciti esse ánimæ vestræ quid manducétis, neque córpori quid induámini.'
  "23": Anima plus est quam esca, et corpus plus quam vestiméntum.
  "24": Consideráte corvos, quia non séminant, neque metunt, quibus non est cellárium, neque hórreum, et Deus pascit illos. Quanto magis vos pluris estis illis?
  "25": Quis autem vestrum cogitándo potest adícere ad statúram suam cúbitum unum?
  "26": Si ergo neque quod mínimum est potéstis, quid de céteris sollíciti estis?
  "27": 'Consideráte lília quómodo crescunt: non labórant, neque nent: dico autem vobis, nec Sálomon in omni glória sua vestiebátur sicut unum ex istis.'
  "28": 'Si autem fœnum, quod hódie est in agro, et cras in clíbanum míttitur, Deus sic vestit: quanto magis vos pusíllæ fídei?'
  "29": 'Et vos nolíte quǽrere quid manducétis, aut quid bibátis: et nolíte in sublíme tolli:'
  "30": hæc enim ómnia gentes mundi quærunt. Pater autem vester scit quóniam his indigétis.
  "31": 'Verúmtamen quǽrite primum regnum Dei, et iustítiam eius: et hæc ómnia adiciéntur vobis.'
  "32": Nolíte timére pusíllus grex, quia complácuit Patri vestro dare vobis regnum.
  "33": 'Véndite quæ possidétis, et date eleemósynam. Fácite vobis sácculos, qui non veteráscunt, thesáurum non deficiéntem in cælis: quo fur non apprópiat, neque tínea corrúmpit.'
  "34": Ubi enim thesáurus vester est, ibi et cor vestrum erit.
  "35": Sint lumbi vestri præcíncti, et lucérnæ ardéntes in mánibus vestris,
  "36": 'et vos símiles homínibus exspectántibus dóminum suum quando revertátur a núptiis: ut, cum vénerit et pulsáverit, conféstim apériant ei.'
  "37": 'Beáti servi illi, quos cum vénerit dóminus, invénerit vigilántes: amen dico vobis, quod præcínget se, et fáciet illos discúmbere, et tránsiens ministrábit illis.'
  "38": Et si vénerit in secúnda vigília, et si in tértia vigília vénerit, et ita invénerit, beáti sunt servi illi.
  "39": Hoc autem scitóte, quóniam si sciret paterfamílias, qua hora fur veníret, vigiláret útique, et non síneret pérfodi domum suam.
  "40": 'Et vos estóte paráti: quia qua hora non putátis, Fílius hóminis véniet.'
  "41": 'Ait autem ei Petrus: Dómine ad nos dicis hanc parábolam, an et ad omnes?'
  "42": 'Dixit autem Dóminus: Quis, putas, est fidélis dispensátor, et prudens, quem constítuit dóminus supra famíliam suam, ut det illis in témpore trítici mensúram?'
  "43": Beátus ille servus, quem cum vénerit dóminus, invénerit ita faciéntem.
  "44": Vere dico vobis, quóniam supra ómnia, quæ póssidet, constítuet illum.
  "45": 'Quod si díxerit servus ille in corde suo: Moram facit dóminus meus veníre: et cœ́perit percútere servos, et ancíllas, et édere, et bíbere, et inebriári:'
  "46": véniet dóminus servi illíus in die, qua non sperat, et hora, qua nescit, et dívidet eum, partémque eius cum infidélibus ponet.
  "47": 'Ille autem servus, qui cognóvit voluntátem dómini sui, et non præparávit, et non fecit secúndum voluntátem eius, vapulábit multis:'
  "48": 'qui autem non cognóvit, et fecit digna plagis, vapulábit paucis. Omni autem, cui multum datum est, multum quærétur ab eo: et cui commendavérunt multum, plus petent ab eo.'
  "49": Ignem veni míttere in terram, et quid volo nisi ut accendátur?
  "50": 'Baptísmo autem hábeo baptizári: et quómodo coárctor usque dum perficiátur?'
  "51": 'Putátis quia pacem veni dare in terram? Non, dico vobis, sed separatiónem:'
  "52": erunt enim ex hoc quinque in domo una divísi, tres in duos, et duo in tres
  "53": 'dividéntur: pater in fílium, et fílius in patrem suum, mater in fíliam, et fília in matrem, socrus in nurum suam, et nurus in socrum suam.'
  "54": 'Dicébat autem et ad turbas: Cum vidéritis nubem oriéntem ab occásu, statim dícitis: Nimbus venit: et ita fit.'
  "55": 'Et cum austrum flantem, dícitis: Quia æstus erit: et fit.'
  "56": 'Hypócritæ, fáciem cæli, et terræ nostis probáre: hoc autem tempus quómodo non probátis?'
  "57": Quid autem et a vobis ipsis non iudicátis quod iustum est?
  "58": Cum autem vadis cum adversário tuo ad príncipem, in via da óperam liberári ab illo, ne forte trahat te ad iúdicem, et iudex tradat te exactóri, et exáctor mittat te in cárcerem.
  "59": Dico tibi, non éxies inde, donec étiam novíssimum minútum reddas.
