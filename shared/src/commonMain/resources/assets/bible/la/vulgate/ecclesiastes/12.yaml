bible: vulgate
lang: la
language: Latina
book: Ecclesiastes
chapter: "12"
verses:
  "1": 'Meménto Creatóris tui in diébus iuventútis tuæ, ántequam véniat tempus afflictiónis, et appropínquent anni, de quibus dicas: Non mihi placent:'
  "2": 'ántequam tenebréscat sol, et lumen, et luna, et stellæ, et revertántur nubes post plúviam:'
  "3": 'quando commovebúntur custódes domus, et nutábunt viri fortíssimi, et otiósæ erunt moléntes in minúto número, et tenebréscent vidéntes per forámina:'
  "4": et claudent óstia in platéa, in humilitáte vocis moléntis, et consúrgent ad vocem vólucris, et obsurdéscent omnes fíliæ cárminis.
  "5": 'Excélsa quoque timébunt, et formidábunt in via, florébit amýgdalus, impinguábitur locústa, et dissipábitur cápparis: quóniam ibit homo in domum æternitátis suæ, et circuíbunt in platéa plangéntes.'
  "6": Antequam rumpátur funículus argénteus, et recúrrat vitta áurea, et conterátur hýdria super fontem, et confringátur rota super cistérnam,
  "7": et revertátur pulvis in terram suam unde erat, et spíritus rédeat ad Deum, qui dedit illum.
  "8": Vánitas vanitátum, dixit Ecclesiástes, et ómnia vánitas.
  "9": 'Cumque esset sapientíssimus Ecclesiástes, dócuit pópulum, et enarrávit quæ fécerat: et investígans compósuit parábolas multas.'
  "10": Quæsívit verba utília, et conscrípsit sermónes rectíssimos, ac veritáte plenos.
  "11": Verba sapiéntium sicut stímuli, et quasi clavi in altum defíxi, quæ per magistrórum consílium data sunt a pastóre uno.
  "12": 'His ámplius fili mi ne requíras. Faciéndi plures libros nullus est finis: frequénsque meditátio, carnis afflíctio est.'
  "13": 'Finem loquéndi páriter omnes audiámus. Deum time, et mandáta eius obsérva: hoc est enim omnis homo:'
  "14": et cuncta, quæ fiunt, addúcet Deus in iudícium pro omni erráto, sive bonum, sive malum illud sit.
