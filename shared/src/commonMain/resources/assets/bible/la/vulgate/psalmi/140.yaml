bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "140"
verses:
  "1": 'Psalmus David. Dómine clamávi ad te, exáudi me: inténde voci meæ, cum clamávero ad te.'
  "2": 'Dirigátur orátio mea sicut incénsum in conspéctu tuo: elevátio mánuum meárum sacrifícium vespertínum.'
  "3": 'Pone Dómine custódiam ori meo: et óstium circumstántiæ lábiis meis.'
  "4": 'Non declínes cor meum in verba malítiæ, ad excusándas excusatiónes in peccátis: cum homínibus operántibus iniquitátem: et non communicábo cum eléctis eórum.'
  "5": 'Corrípiet me iustus in misericórdia, et increpábit me: óleum autem peccatóris non impínguet caput meum. Quóniam adhuc et orátio mea in beneplácitis eórum:'
  "6": 'absórpti sunt iuncti petræ iúdices eórum. Audient verba mea quóniam potuérunt:'
  "7": 'sicut crassitúdo terræ erúpta est super terram. Dissipáta sunt ossa nostra secus inférnum:'
  "8": 'quia ad te Dómine, Dómine óculi mei: in te sperávi, non áuferas ánimam meam.'
  "9": 'Custódi me a láqueo, quem statuérunt mihi: et a scándalis operántium iniquitátem.'
  "10": 'Cadent in retiáculo eius peccatóres: singuláriter sum ego donec tránseam.'
