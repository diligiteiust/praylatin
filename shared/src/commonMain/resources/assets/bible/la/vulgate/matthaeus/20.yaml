bible: vulgate
lang: la
language: Latina
book: Matthaeus
chapter: "20"
verses:
  "1": Símile est regnum cælórum hómini patrifamílias, qui éxiit primo mane condúcere operários in víneam suam.
  "2": Conventióne autem facta cum operáriis ex denário diúrno, misit eos in víneam suam.
  "3": Et egréssus circa horam tértiam, vidit álios stantes in foro otiósos,
  "4": 'et dixit illis: Ite et vos in víneam meam, et quod iustum fúerit dabo vobis.'
  "5": 'Illi autem abiérunt. Iterum autem éxiit circa sextam, et nonam horam: et fecit simíliter.'
  "6": 'Circa undécimam vero éxiit, et invénit álios stantes, et dicit illis: Quid hic statis tota die otiósi?'
  "7": 'Dicunt ei: Quia nemo nos condúxit. Dicit illis: Ite et vos in víneam meam.'
  "8": 'Cum sero autem factum esset, dicit dóminus víneæ procuratóri suo: Voca operários, et redde illis mercédem incípiens a novíssimis usque ad primos.'
  "9": Cum veníssent ergo qui circa undécimam horam vénerant, accepérunt síngulos denários.
  "10": 'Veniéntes autem et primi, arbitráti sunt quod plus essent acceptúri: accepérunt autem et ipsi síngulos denários.'
  "11": Et accipiéntes murmurábant advérsus patremfamílias,
  "12": 'dicéntes: Hi novíssimi una hora fecérunt, et pares illos nobis fecísti, qui portávimus pondus diéi, et æstus.'
  "13": 'At ille respóndens uni eórum, dixit: Amíce, non fácio tibi iniúriam: nonne ex denário convenísti mecum?'
  "14": 'Tolle quod tuum est, et vade: volo autem et huic novíssimo dare sicut et tibi.'
  "15": Aut non licet mihi quod volo, fácere? an óculus tuus nequam est, quia ego bonus sum?
  "16": Sic erunt novíssimi primi, et primi novíssimi. Multi enim sunt vocáti, pauci vero elécti.
  "17": 'Et ascéndens Iesus Ierosólymam, assúmpsit duódecim discípulos secréto, et ait illis:'
  "18": Ecce ascéndimus Ierosólymam, et Fílius hóminis tradétur princípibus sacerdótum, et scribis, et condemnábunt eum morte,
  "19": et tradent eum géntibus ad illudéndum, et flagellándum, et crucifigéndum, et tértia die resúrget.
  "20": Tunc accéssit ad eum mater filiórum Zebedǽi cum fíliis suis, adórans et petens áliquid ab eo.
  "21": 'Qui dixit ei: Quid vis? Ait illi: Dic ut sédeant hi duo fílii mei, unus ad déxteram tuam, et unus ad sinístram in regno tuo.'
  "22": 'Respóndens autem Iesus, dixit: Nescítis quid petátis. Potéstis bíbere cálicem, quem ego bibitúrus sum? Dicunt ei: Póssumus.'
  "23": 'Ait illis: Cálicem quidem meum bibétis: sedére autem ad déxteram meam vel sinístram non est meum dare vobis, sed quibus parátum est a Patre meo.'
  "24": Et audiéntes decem, indignáti sunt de duóbus frátribus.
  "25": 'Iesus autem vocávit eos ad se, et ait: Scitis quia príncipes géntium dominántur eórum: et qui maióres sunt, potestátem exércent in eos.'
  "26": 'Non ita erit inter vos: sed quicúmque volúerit inter vos maior fíeri, sit vester miníster:'
  "27": et qui volúerit inter vos primus esse, erit vester servus.
  "28": Sicut Fílius hóminis non venit ministrári, sed ministráre, et dare ánimam suam redemptiónem pro multis.
  "29": Et egrediéntibus illis ab Iéricho, secúta est eum turba multa,
  "30": 'et ecce duo cæci sedéntes secus viam, audiérunt quia Iesus transíret: et clamavérunt, dicéntes: Dómine miserére nostri, fili David.'
  "31": 'Turba autem increpábat eos ut tacérent. At illi magis clamábant, dicéntes: Dómine, miserére nostri, fili David.'
  "32": 'Et stetit Iesus, et vocávit eos, et ait: Quid vultis ut fáciam vobis?'
  "33": 'Dicunt illi: Dómine, ut aperiántur óculi nostri.'
  "34": Misértus autem eórum Iesus, tétigit óculos eórum. Et conféstim vidérunt, et secúti sunt eum.
