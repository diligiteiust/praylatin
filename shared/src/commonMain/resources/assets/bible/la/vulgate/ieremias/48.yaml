bible: vulgate
lang: la
language: Latina
book: Ieremias
chapter: "48"
verses:
  "1": 'Ad Moab hæc dicit Dóminus exercítuum, Deus Israel: Væ super Nabo, quóniam vastáta est, et confúsa: capta est Cariáthaim: confúsa est fortis, et trémuit.'
  "2": 'Non est ultra exsultátio in Moab contra Hésebon: cogitavérunt malum. Veníte, et disperdámus eam de gente: ergo silens conticésces, sequetúrque te gládius.'
  "3": Vox clamóris de Orónaim, vástitas et contrítio magna.
  "4": 'Contríta est Moab: annuntiáte clamórem párvulis eius.'
  "5": 'Per ascénsum enim Luith plorans ascéndet in fletu: quóniam in descénsu Orónaim hostes ululátum contritiónis audiérunt:'
  "6": Fúgite, salváte ánimas vestras, et éritis quasi myrícæ in desérto.
  "7": 'Pro eo enim quod habuísti fidúciam in munitiónibus tuis, et in thesáuris tuis, tu quoque capiéris: et ibit Chamos in transmigratiónem, sacerdótes eius et príncipes eius simul.'
  "8": 'Et véniet prædo ad omnem urbem, et urbs nulla salvábitur: et períbunt valles, et dissipabúntur campéstria: quóniam dixit Dóminus:'
  "9": 'Date florem Moab, quia florens egrediétur: et civitátes eius desértæ erunt, et inhabitábiles.'
  "10": 'Maledíctus, qui facit opus Dómini fraudulénter: et maledíctus, qui próhibet gládium suum a sánguine.'
  "11": 'Fértilis fuit Moab ab adolescéntia sua, et requiévit in fǽcibus suis: nec transfúsus est de vase in vas, et in transmigratiónem non ábiit: idcírco permánsit gustus eius in eo, et odor eius non est immutátus.'
  "12": 'Proptérea ecce dies véniunt, dicit Dóminus, et mittam ei ordinatóres et stratóres lagunculárum: et sternent eum, et vasa eius exháurient, et lagúnculas eórum collídent.'
  "13": Et confundétur Moab a Chamos sicut confúsa est domus Israel a Bethel, in qua habébat fidúciam.
  "14": 'Quómodo dícitis: Fortes sumus, et viri robústi ad prœliándum?'
  "15": 'Vastáta est Moab, et civitátes illíus succidérunt: et elécti iúvenes eius descendérunt in occisiónem: ait rex, Dóminus exercítuum nomen eius.'
  "16": Prope est intéritus Moab ut véniat, et malum eius velóciter accúrret nimis.
  "17": 'Consolámini eum omnes, qui estis in circúitu eius: et univérsi, qui scitis nomen eius, dícite: Quómodo confrácta est virga fortis, báculus gloriósus?'
  "18": 'Descénde de glória, et sede in siti habitátio fíliæ Dibon: quóniam vastátor Moab ascéndit ad te, dissipávit munitiónes tuas.'
  "19": 'In via sta, et próspice habitátio Aroer: intérroga fugiéntem: et ei, qui evásit, dic: Quid áccidit?'
  "20": 'Confúsus est Moab, quóniam victus est: ululáte, et clamáte, annuntiáte in Arnon, quóniam vastáta est Moab.'
  "21": 'Et iudícium venit ad terram campéstrem: super Helon, et super Iasa, et super Méphaath,'
  "22": et super Dibon, et super Nabo, et super domum Debláthaim,
  "23": et super Cariáthaim, et super Béthgamul, et super Béthmaon,
  "24": 'et super Cárioth, et super Bosra: et super omnes civitátes terræ Moab, quæ longe, et quæ prope sunt.'
  "25": Abscíssum est cornu Moab, et bráchium eius contrítum est, ait Dóminus.
  "26": 'Inebriáte eum, quóniam contra Dóminum eréctus est: et allídet manum Moab in vómitu suo, et erit in derísum étiam ipse.'
  "27": 'Fuit enim in derísum tibi Israel, quasi inter fures reperísses eum: propter verba ergo tua, quæ advérsum illum locútus es, captívus ducéris.'
  "28": 'Relínquite civitátes, et habitáte in petra habitatóres Moab: et estóte quasi colúmba nidíficans in summo ore foráminis.'
  "29": 'Audívimus supérbiam Moab, supérbus est valde: sublimitátem eius, et arrogántiam, et supérbiam, et altitúdinem cordis eius.'
  "30": 'Ego scio, ait Dóminus, iactántiam eius: et quod non sit iuxta eam virtus eius, nec iuxta quod póterat conáta sit fácere.'
  "31": Ideo super Moab eiulábo, et ad Moab univérsam clamábo, ad viros muri fíctilis lamentántes.
  "32": 'De planctu Iazer plorábo tibi vínea Sábama: propágines tuæ transiérunt mare, usque ad mare Iazer pervenérunt: super messem tuam, et vindémiam tuam prædo írruit.'
  "33": 'Abláta est lætítia et exsultátio de Carmélo, et de terra Moab, et vinum de torculáribus sústuli: nequáquam calcátor uvæ sólitum celéuma cantábit.'
  "34": 'De clamóre Hésebon usque Eleále, et Iasa, dedérunt vocem suam: a Segor usque ad Orónaim vítula conternánte: aquæ quoque Nemrim péssimæ erunt.'
  "35": Et áuferam de Moab, ait Dóminus, offeréntem in excélsis, et sacrificántem diis eius.
  "36": 'Proptérea cor meum ad Moab quasi tíbiæ resonábit, et cor meum ad viros muri fíctilis dabit sónitum tibiárum: quia plus fecit quam pótuit, idcírco periérunt.'
  "37": 'Omne enim caput calvítium, et omnis barba rasa erit: in cunctis mánibus colligátio, et super omne dorsum cilícium.'
  "38": 'Super ómnia tecta Moab, et in platéis eius omnis planctus: quóniam contrívi Moab sicut vas inútile, ait Dóminus.'
  "39": Quómodo victa est, et ululavérunt? quómodo deiécit cervícem Moab, et confúsus est? erítque Moab in derísum, et in exémplum ómnibus in circúitu suo.
  "40": 'Hæc dicit Dóminus: Ecce quasi áquila volábit, et exténdet alas suas ad Moab.'
  "41": 'Capta est Cárioth, et munitiónes comprehénsæ sunt: et erit cor fórtium Moab in die illa, sicut cor mulíeris parturiéntis.'
  "42": 'Et cessábit Moab esse pópulus: quóniam contra Dóminum gloriátus est.'
  "43": Pavor, et fóvea, et láqueus super te o habitátor Moab, dicit Dóminus.
  "44": 'Qui fúgerit a fácie pavóris cadet in fóveam, et qui conscénderit de fóvea capiétur láqueo: addúcam enim super Moab annum visitatiónis eórum, ait Dóminus.'
  "45": 'In umbra Hésebon stetérunt de láqueo fugiéntes: quia ignis egréssus est de Hésebon, et flamma de médio Seon, et devorábit partem Moab, et vérticem filiórum tumúltus.'
  "46": 'Væ tibi Moab, periísti pópule Chamos: quia comprehénsi sunt fílii tui, et fíliæ tuæ in captivitátem.'
  "47": Et convértam captivitátem Moab in novíssimis diébus, ait Dóminus. Hucúsque iudícia Moab.
