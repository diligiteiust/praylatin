bible: vulgate
lang: la
language: Latina
book: Lucas
chapter: "18"
verses:
  "1": Dicébat autem et parábolam ad illos, quóniam opórtet semper oráre et non defícere,
  "2": 'dicens: Iudex quidam erat in quadam civitáte, qui Deum non timébat, et hóminem non reverebátur.'
  "3": 'Vídua autem quædam erat in civitáte illa, et veniébat ad eum, dicens: Víndica me de adversário meo.'
  "4": 'Et nolébat per multum tempus. Post hæc autem dixit intra se: Etsi Deum non tímeo, nec hóminem revéreor:'
  "5": tamen quia molésta est mihi hæc vídua, vindicábo illam, ne in novíssimo véniens sugíllet me.
  "6": 'Ait autem Dóminus: Audíte quid iudex iniquitátis dicit:'
  "7": Deus autem non fáciet vindíctam electórum suórum clamántium ad se die ac nocte, et patiéntiam habébit in illis?
  "8": Dico vobis quia cito fáciet vindíctam illórum. Verúmtamen Fílius hóminis véniens, putas, invéniet fidem in terra?
  "9": 'Dixit autem et ad quosdam, qui in se confidébant tamquam iusti, et aspernabántur céteros, parábolam istam:'
  "10": 'Duo hómines ascendérunt in templum ut orárent: unus Pharisǽus, et alter publicánus.'
  "11": 'Pharisǽus stans, hæc apud se orábat: Deus grátias ago tibi, quia non sum sicut céteri hóminum: raptóres, iniústi, adúlteri, velut étiam hic publicánus:'
  "12": ieiúno bis in sábbato, décimas do ómnium, quæ possídeo.
  "13": 'Et publicánus a longe stans, nolébat nec óculos ad cælum leváre: sed percutiébat pectus suum, dicens: Deus propítius esto mihi peccatóri.'
  "14": 'Dico vobis, descéndit hic iustificátus in domum suam ab illo: quia omnis qui se exáltat, humiliábitur, et qui se humíliat, exaltábitur.'
  "15": Afferébant autem ad illum et infántes, ut eos tángeret. Quod cum vidérent discípuli, increpábant illos.
  "16": 'Iesus autem cónvocans illos, dixit: Sínite púeros veníre ad me, et nolíte vetáre eos: tálium est enim regnum Dei.'
  "17": Amen dico vobis, quicúmque non accéperit regnum Dei sicut puer, non intrábit in illud.
  "18": 'Et interrogávit eum quidam princeps, dicens: Magíster bone, quid fáciens vitam ætérnam possidébo?'
  "19": 'Dixit autem ei Iesus: Quid me dicis bonum? nemo bonus nisi solus Deus.'
  "20": 'Mandáta nosti: non occídes: non mœcháberis: non furtum fácies: non falsum testimónium dices: honóra patrem tuum, et matrem.'
  "21": 'Qui ait: Hæc ómnia custodívi a iuventúte mea.'
  "22": 'Quo audíto, Iesus ait ei: Adhuc unum tibi deest: ómnia quæcúmque habes vende, et da paupéribus, et habébis thesáurum in cælo: et veni, séquere me.'
  "23": 'His ille audítis, contristátus est: quia dives erat valde.'
  "24": 'Videns autem Iesus illum tristem factum, dixit: Quam diffícile, qui pecúnias habent, in regnum Dei intrábunt.'
  "25": Facílius est enim camélum per forámen acus transíre, quam dívitem intráre in regnum Dei.
  "26": 'Et dixérunt qui audiébant: Et quis potest salvus fíeri?'
  "27": 'Ait illis: Quæ impossibília sunt apud hómines, possibília sunt apud Deum.'
  "28": 'Ait autem Petrus: Ecce nos dimísimus ómnia, et secúti sumus te.'
  "29": 'Qui dixit eis: Amen dico vobis, nemo est, qui relíquit domum, aut paréntes, aut fratres, aut uxórem, aut fílios propter regnum Dei,'
  "30": et non recípiat multo plura in hoc témpore, et in sǽculo ventúro vitam ætérnam.
  "31": 'Assúmpsit autem Iesus duódecim, et ait illis: Ecce ascéndimus Ierosólymam, et consummabúntur ómnia, quæ scripta sunt per prophétas de Fílio hóminis:'
  "32": 'tradétur enim géntibus, et illudétur, et flagellábitur, et conspuétur:'
  "33": et postquam flagelláverint, occídent eum, et tértia die resúrget.
  "34": Et ipsi nihil horum intellexérunt, et erat verbum istud abscónditum ab eis, et non intelligébant quæ dicebántur.
  "35": Factum est autem, cum appropinquáret Iéricho, cæcus quidam sedébat secus viam, mendícans.
  "36": Et cum audíret turbam prætereúntem, interrogábat quid hoc esset.
  "37": Dixérunt autem ei, quod Iesus Nazarénus transíret.
  "38": 'Et clamávit, dicens: Iesu fili David miserére mei.'
  "39": 'Et qui præíbant, increpábant eum ut tacéret. Ipse vero multo magis clamábat: Fili David miserére mei.'
  "40": Stans autem Iesus iussit illum addúci ad se. Et cum appropinquásset, interrogávit illum,
  "41": 'dicens: Quid tibi vis fáciam? At ille dixit: Dómine ut vídeam.'
  "42": 'Et Iesus dixit illi: Réspice, fides tua te salvum fecit.'
  "43": Et conféstim vidit, et sequebátur illum magníficans Deum. Et omnis plebs ut vidit, dedit laudem Deo.
