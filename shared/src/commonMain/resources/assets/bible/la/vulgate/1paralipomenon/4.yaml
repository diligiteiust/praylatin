bible: vulgate
lang: la
language: Latina
book: I Paralipomenon
chapter: "4"
verses:
  "1": 'Fílii Iuda: Phares, Hesron, et Charmi, et Hur, et Sobal.'
  "2": 'Ráia vero fílius Sobal génuit Iahath, de quo nati sunt Ahúmai, et Laad: hæ cognatiónes Saráthi.'
  "3": 'Ista quoque stirps Etam: Iézrahel, et Iesema, et Iédebos. Nomen quoque soróris eórum, Asalélphuni.'
  "4": 'Phánuel autem pater Gedor, et Ezer pater Hosa: isti sunt fílii Hur primogéniti Ephratha patris Béthlehem.'
  "5": Assur vero patri Thécuæ erant duæ uxóres, Hálaa et Náara.
  "6": 'Péperit autem ei Náara, Oózam, et Hepher, et Thémani, et Ahásthari: isti sunt fílii Náara.'
  "7": Porro fílii Hálaa, Sereth, Isaar, et Ethnan.
  "8": Cos autem génuit Anob, et Sóboba, et cognatiónem Ahárehel fílii Arum.
  "9": 'Fuit autem Iabes ínclytus præ frátribus suis, et mater eius vocávit nomen illíus Iabes, dicens: Quia péperi eum in dolóre.'
  "10": 'Invocávit vero Iabes Deum Israel, dicens: Si benedícens benedíxeris mihi, et dilatáveris términos meos, et fúerit manus tua mecum, et féceris me a malítia non ópprimi. Et prǽstitit Deus quæ precátus est.'
  "11": Caleb autem frater Sua génuit Mahir, qui fuit pater Esthon.
  "12": 'Porro Esthon génuit Béthrapha, et Phesse, et Tehínna patrem urbis Naas: hi sunt viri Recha.'
  "13": Fílii autem Cenez, Othóniel, et Saraía. Porro fílii Othóniel, Hathath, et Maónathi.
  "14": 'Maónathi génuit Ophra, Saraía autem génuit Ioab patrem Vallis artíficum: ibi quippe artífices erant.'
  "15": 'Fílii vero Caleb fílii Iéphone, Hir, et Ela, et Naham. Fílii quoque Ela: Cenez.'
  "16": 'Fílii quoque Ialéleel: Ziph, et Zipha, Thíria, et Asrael.'
  "17": Et fílii Ezra, Iether, et Mered, et Epher, et Ialon, genuítque Maríam, et Sámmai, et Iesba patrem Esthamo.
  "18": 'Uxor quoque eius Iudaía, péperit Iared patrem Gedor, et Heber patrem Socho, et Icúthiel patrem Zánoe: hi autem fílii Bethíæ fíliæ Pharaónis, quam accépit Mered.'
  "19": Et fílii uxóris Odaíæ soróris Naham patris Céila, Garmi, et Esthamo, qui fuit de Macháthi.
  "20": Fílii quoque Simon, Amnon, et Rinna fílius Hanan, et Thilon. Et fílii Iesi, Zoheth, et Bénzoheth.
  "21": 'Fílii Sela, fílii Iuda: Her pater Lecha, et Láada pater Marésa, et cognatiónes domus operántium byssum in Domo iuraménti.'
  "22": 'Et qui stare fecit solem, viríque Mendácii, et Secúrus, et Incéndens, qui príncipes fuérunt in Moab, et qui revérsi sunt in Lahem: hæc autem verba vétera.'
  "23": Hi sunt fíguli habitántes in Plantatiónibus, et in Sépibus, apud regem in opéribus eius, commoratíque sunt ibi.
  "24": 'Fílii Símeon: Námuel et Iamin, Iarib, Zara, Saul.'
  "25": Sellum fílius eius, Mapsam fílius eius, Masma fílius eius.
  "26": 'Fílii Masma: Hámuel fílius eius, Zachur fílius eius, Sémei fílius eius.'
  "27": 'Fílii Sémei sédecim, et fíliæ sex: fratres autem eius non habuérunt fílios multos, et univérsa cognátio non pótuit adæquáre summam filiórum Iuda.'
  "28": Habitavérunt autem in Bersabée, et Mólada, et Hasársuhal,
  "29": et in Bala, et in Asom, et in Tholad,
  "30": et in Báthuel, et in Horma, et in Síceleg,
  "31": 'et in Bethmárchaboth, et in Hasársusim, et in Bethbérai, et in Sáarim: hæ civitátes eórum usque ad regem David.'
  "32": 'Villæ quoque eórum: Etam, et Aen, Remmon, et Thochen, et Asan, civitátes quinque.'
  "33": 'Et univérsi vículi eórum per circúitum civitátum istárum usque ad Baal: hæc est habitátio eórum, et sédium distribútio.'
  "34": Mosóbab quoque et Iemlech, et Iosa fílius Amasíæ,
  "35": et Ioel, et Iehu fílius Iosabíæ fílii Saraíæ fílii Asiel,
  "36": et Elioénai, et Iácoba, et Isuhaía, et Asaía, et Adiel, et Ismiel, et Banaía,
  "37": Ziza quoque fílius Séphei fílii Allon fílii Idaía fílii Semri fílii Samaía.
  "38": Isti sunt nomináti príncipes in cognatiónibus suis, et in domo affinitátum suárum multiplicáti sunt veheménter.
  "39": Et profécti sunt ut ingrederéntur in Gador usque ad oriéntem vallis, et ut quǽrerent páscua grégibus suis.
  "40": Invenerúntque páscuas úberes, et valde bonas, et terram latíssimam et quiétam et fértilem, in qua ante habitáverant de stirpe Cham.
  "41": 'Hi ergo venérunt, quos supra descrípsimus nominátim, in diébus Ezechíæ regis Iuda: et percussérunt tabernácula eórum, et habitatóres qui invénti fúerant ibi, et delevérunt eos usque in præséntem diem: habitaverúntque pro eis, quóniam ubérrimas páscuas ibídem reperérunt.'
  "42": 'De fíliis quoque Símeon abiérunt in montem Seir viri quingénti, habéntes príncipes Phalthíam et Naaríam et Raphaíam et Oziel fílios Iesi:'
  "43": et percussérunt relíquias, quæ evádere potúerant, Amalecitárum, et habitavérunt ibi pro eis usque ad diem hanc.
