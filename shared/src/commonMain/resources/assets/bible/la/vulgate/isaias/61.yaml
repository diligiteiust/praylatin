bible: vulgate
lang: la
language: Latina
book: Isaias
chapter: "61"
verses:
  "1": 'Spíritus Dómini super me, eo quod únxerit Dóminus me: ad annuntiándum mansuétis misit me, ut medérer contrítis corde, et prædicárem captívis indulgéntiam, et clausis apertiónem:'
  "2": 'ut prædicárem annum placábilem Dómino, et diem ultiónis Deo nostro: ut consolárer omnes lugéntes:'
  "3": 'ut pónerem lugéntibus Sion: et darem eis corónam pro cínere, óleum gáudii pro luctu, pállium laudis pro spíritu mœróris: et vocabúntur in ea fortes iustítiæ, plantátio Dómini ad glorificándum.'
  "4": Et ædificábunt desérta a sǽculo, et ruínas antíquas érigent, et instaurábunt civitátes desértas, dissipátas in generatiónem et generatiónem.
  "5": 'Et stabunt aliéni, et pascent pécora vestra: et fílii peregrinórum agrícolæ et vinitóres vestri erunt.'
  "6": 'Vos autem sacerdótes Dómini vocabímini: Minístri Dei nostri, dicétur vobis: fortitúdinem géntium comedétis, et in glória eárum superbiétis.'
  "7": 'Pro confusióne vestra dúplici et rubóre, laudábunt partem suam: propter hoc in terra sua duplícia possidébunt, lætítia sempitérna erit eis.'
  "8": 'Quia ego Dóminus díligens iudícium, et ódio habens rapínam in holocáusto: et dabo opus eórum in veritáte, et fœdus perpétuum fériam eis.'
  "9": 'Et scient in géntibus semen eórum, et germen eórum in médio populórum: omnes, qui víderint eos, cognóscent illos, quia isti sunt semen, cui benedíxit Dóminus.'
  "10": 'Gaudens gaudébo in Dómino, et exsultábit ánima mea in Deo meo: quia índuit me vestiméntis salútis, et induménto iustítiæ circúmdedit me, quasi sponsum decorátum coróna, et quasi sponsam ornátam monílibus suis.'
  "11": 'Sicut enim terra profert germen suum, et sicut hortus semen suum gérminat: sic Dóminus Deus germinábit iustítiam, et laudem coram univérsis géntibus.'
