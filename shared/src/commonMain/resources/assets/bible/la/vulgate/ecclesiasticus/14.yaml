bible: vulgate
lang: la
language: Latina
book: Ecclesiasticus
chapter: "14"
verses:
  "1": Beátus vir, qui non est lapsus verbo ex ore suo, et non est stimulátus in tristítia delícti.
  "2": Felix, qui non hábuit ánimi sui tristítiam, et non éxcidit a spe sua.
  "3": Viro cúpido et tenáci sine ratióne est substántia, et hómini lívido ad quid aurum?
  "4": Qui acérvat ex ánimo suo iniúste, áliis cóngregat, et in bonis illíus álius luxuriábitur.
  "5": Qui sibi nequam est, cui álii bonus erit? et non iucundábitur in bonis suis.
  "6": 'Qui sibi ínvidet, nihil est illo néquius: et hæc reddítio est malítiæ illíus.'
  "7": 'Et si bene fécerit, ignoránter et non volens facit: et in novíssimo maniféstat malítiam suam.'
  "8": 'Nequam est óculus lívidi: et avértens fáciem suam, et despíciens ánimam suam.'
  "9": 'Insatiábilis óculus cúpidi in parte iniquitátis: non satiábitur donec consúmat arefáciens ánimam suam.'
  "10": Oculus malus ad mala, et non saturábitur pane, sed índigens et in tristítia erit super mensam suam.
  "11": Fili si habes, bénefac tecum, et Deo dignas oblatiónes offer.
  "12": 'Memor esto quóniam mors non tardat, et testaméntum inferórum quia demonstrátum est tibi: testaméntum enim huius mundi morte moriétur.'
  "13": Ante mortem bénefac amíco tuo, et secúndum vires tuas expórrigens da páuperi.
  "14": Non defraudéris a die bono, et partícula boni doni non te prætéreat.
  "15": Nonne áliis relínques dolóres et labóres tuos in divisióne sortis?
  "16": Da, et áccipe, et iustífica ánimam tuam.
  "17": 'Ante óbitum tuum operáre iustítiam: quóniam non est apud ínferos inveníre cibum.'
  "18": Omnis caro sicut fœnum veteráscet, et sicut fólium fructíficans in árbore víridi.
  "19": 'Alia generántur, et ália deiciúntur: sic generátio carnis et sánguinis, ália finítur, et ália náscitur.'
  "20": Omne opus corruptíbile in fine defíciet, et qui illud operátur, ibit cum illo.
  "21": 'Et omne opus eléctum iustificábitur: et qui operátur illud, honorábitur in illo.'
  "22": Beátus vir, qui in sapiéntia morábitur, et qui in iustítia sua meditábitur, et in sensu cogitábit circumspectiónem Dei.
  "23": 'Qui excógitat vias illíus in corde suo, et in abscónditis suis intélligens, vadens post illam quasi investigátor, et in viis illíus consístens:'
  "24": 'qui réspicit per fenéstras illíus, et in iánuis illíus áudiens:'
  "25": 'qui requiéscit iuxta domum illíus, et in pariétibus illíus figens palum státuet cásulam suam ad manus illíus, et requiéscent in cásula illíus bona per ævum:'
  "26": 'státuet fílios suos sub tégmine illíus, et sub ramis eius morábitur:'
  "27": protegétur sub tégmine illíus a fervóre, et in glória eius requiéscet.
