bible: vulgate
lang: la
language: Latina
book: Lucas
chapter: "13"
verses:
  "1": Aderant autem quidam ipso in témpore, nuntiántes illi de Galilǽis, quorum sánguinem Pilátus míscuit cum sacrifíciis eórum.
  "2": 'Et respóndens dixit illis: Putátis quod hi Galilǽi præ ómnibus Galilǽis peccatóres fúerint, quia tália passi sunt?'
  "3": 'Non, dico vobis: sed nisi pœniténtiam habuéritis, omnes simíliter períbitis.'
  "4": 'Sicut illi decem et octo, supra quos cécidit turris in Síloe, et occídit eos: putátis quia et ipsi debitóres fúerint præter omnes hómines habitántes in Ierúsalem?'
  "5": 'Non, dico vobis: sed si pœniténtiam non egéritis, omnes simíliter períbitis.'
  "6": 'Dicébat autem et hanc similitúdinem: Arborem fici habébat quidam plantátam in vínea sua, et venit quærens fructum in illa, et non invénit.'
  "7": 'Dixit autem ad cultórem víneæ: Ecce anni tres sunt ex quo vénio quærens fructum in ficúlnea hac, et non invénio: succíde ergo illam: ut quid étiam terram óccupat?'
  "8": 'At ille respóndens, dicit illi: Dómine dimítte illam et hoc anno, usque dum fódiam circa illam, et mittam stércora,'
  "9": 'et síquidem fécerit fructum: sin autem, in futúrum succídes eam.'
  "10": Erat autem docens in synagóga eórum sábbatis.
  "11": 'Et ecce múlier, quæ habébat spíritum infirmitátis annis decem et octo: et erat inclináta, nec omníno póterat sursum respícere.'
  "12": 'Quam cum vidéret Iesus, vocávit eam ad se, et ait illi: Múlier, dimíssa es ab infirmitáte tua.'
  "13": Et impósuit illi manus, et conféstim erécta est, et glorificábat Deum.
  "14": 'Respóndens autem archisynagógus, indígnans quia sábbato curásset Iesus, dicébat turbæ: Sex dies sunt, in quibus opórtet operári: in his ergo veníte, et curámini, et non in die sábbati.'
  "15": 'Respóndens autem ad illum Dóminus, dixit: Hypócritæ, unusquísque vestrum sábbato non solvit bovem suum, aut ásinum a præsépio, et ducit adaquáre?'
  "16": Hanc autem fíliam Abrahæ, quam alligávit Sátanas, ecce decem et octo annis, non opórtuit solvi a vínculo isto die sábbati?
  "17": 'Et cum hæc díceret, erubescébant omnes adversárii eius: et omnis pópulus gaudébat in univérsis, quæ glorióse fiébant ab eo.'
  "18": 'Dicébat ergo: Cui símile est regnum Dei, et cui símile æstimábo illud?'
  "19": 'Símile est grano sinápis, quod accéptum homo misit in hortum suum, et crevit, et factum est in árborem magnam: et vólucres cæli requievérunt in ramis eius.'
  "20": 'Et íterum dixit: Cui símile æstimábo regnum Dei?'
  "21": Símile est ferménto, quod accéptum múlier abscóndit in farínæ sata tria, donec fermentarétur totum.
  "22": Et ibat per civitátes, et castélla docens, et iter fáciens in Ierúsalem.
  "23": 'Ait autem illi quidam: Dómine, si pauci sunt, qui salvántur? Ipse autem dixit ad illos:'
  "24": 'Conténdite intráre per angústam portam: quia multi, dico vobis, quærent intráre, et non póterunt.'
  "25": 'Cum autem intráverit paterfamílias, et cláuserit óstium, incipiétis foris stare, et pulsáre óstium, dicéntes: Dómine, áperi nobis: et respóndens dicet vobis: Néscio vos unde sitis:'
  "26": 'tunc incipiétis dícere: Manducávimus coram te, et bíbimus, et in platéis nostris docuísti.'
  "27": 'Et dicet vobis: Néscio vos unde sitis: discédite a me omnes operárii iniquitátis.'
  "28": 'Ibi erit fletus, et stridor déntium: cum vidéritis Abraham, et Isaac, et Iacob, et omnes prophétas in regno Dei, vos autem expélli foras.'
  "29": Et vénient ab oriénte, et occidénte, et aquilóne, et austro, et accúmbent in regno Dei.
  "30": Et ecce sunt novíssimi qui erunt primi, et sunt primi qui erunt novíssimi.
  "31": 'In ipsa die accessérunt quidam Pharisæórum, dicéntes illi: Exi, et vade hinc: quia Heródes vult te occídere.'
  "32": 'Et ait illis: Ite, et dícite vulpi illi: Ecce eício dæmónia, et sanitátes perfício hódie, et cras, et tértia die consúmmor.'
  "33": 'Verúmtamen opórtet me hódie et cras et sequénti die ambuláre: quia non capit prophétam períre extra Ierúsalem.'
  "34": Ierúsalem, Ierúsalem, quæ occídis prophétas, et lápidas eos, qui mittúntur ad te, quóties vólui congregáre fílios tuos quemádmodum avis nidum suum sub pennis, et noluísti?
  "35": 'Ecce relinquétur vobis domus vestra desérta. Dico autem vobis, quia non vidébitis me donec véniat cum dicétis: Benedíctus, qui venit in nómine Dómini.'
