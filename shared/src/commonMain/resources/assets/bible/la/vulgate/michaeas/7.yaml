bible: vulgate
lang: la
language: Latina
book: Michaeas
chapter: "7"
verses:
  "1": 'Væ mihi, quia factus sum sicut qui cólligit in autúmno racémos vindémiæ: non est botrus ad comedéndum, prǽcoquas ficus desiderávit ánima mea.'
  "2": 'Périit sanctus de terra, et rectus in homínibus non est: omnes in sánguine insidiántur, vir fratrem suum ad mortem venátur.'
  "3": 'Malum mánuum suárum dicunt bonum: princeps póstulat, et iudex in reddéndo est: et magnus locútus est desidérium ánimæ suæ, et conturbavérunt eam.'
  "4": 'Qui óptimus in eis est, quasi paliúrus: et qui rectus, quasi spina de sepe. Dies speculatiónis tuæ, visitátio tua venit: nunc erit vástitas eórum.'
  "5": 'Nolíte crédere amíco, et nolíte confídere in duce: ab ea, quæ dormit in sinu tuo, custódi claustra oris tui.'
  "6": 'Quia fílius contuméliam facit patri, et fília consúrgit advérsus matrem suam, nurus advérsus socrum suam: et inimíci hóminis doméstici eius.'
  "7": 'Ego autem ad Dóminum aspíciam, exspectábo Deum salvatórem meum: áudiet me Deus meus.'
  "8": 'Ne lætéris inimíca mea super me, quia cécidi: consúrgam, cum sédero in ténebris, Dóminus lux mea est.'
  "9": 'Iram Dómini portábo, quóniam peccávi ei, donec causam meam iúdicet, et fáciat iudícium meum: edúcet me in lucem, vidébo iustítiam eius.'
  "10": 'Et aspíciet inimíca mea, et operiétur confusióne, quæ dicit ad me: Ubi est Dóminus Deus tuus? Oculi mei vidébunt in eam: nunc erit in conculcatiónem ut lutum plateárum.'
  "11": 'Dies, ut ædificéntur macériæ tuæ: in die illa longe fiet lex.'
  "12": 'In die illa et usque ad te véniet de Assur, et usque ad civitátes munítas: et a civitátibus munítis usque ad flumen, et ad mare de mari, et ad montem de monte.'
  "13": Et terra erit in desolatiónem propter habitatóres suos, et propter fructum cogitatiónum eórum.
  "14": 'Pasce pópulum tuum in virga tua, gregem hereditátis tuæ habitántes solos in saltu, in médio Carméli: pascéntur Basan et Gálaad iuxta dies antíquos.'
  "15": Secúndum dies egressiónis tuæ de terra Ægýpti osténdam ei mirabília.
  "16": 'Vidébunt gentes, et confundéntur super omni fortitúdine sua: ponent manum super os, aures eórum surdæ erunt.'
  "17": 'Lingent púlverem sicut serpéntes: velut reptília terræ perturbabúntur in ǽdibus suis: Dóminum Deum nostrum formidábunt, et timébunt te.'
  "18": Quis Deus símilis tui, qui aufers iniquitátem, et transis peccátum reliquiárum hereditátis tuæ? non immíttet ultra furórem suum, quóniam volens misericórdiam est.
  "19": 'Revertétur, et miserébitur nostri: depónet iniquitátes nostras, et proíciet in profúndum maris ómnia peccáta nostra.'
  "20": 'Dabis veritátem Iacob, misericórdiam Abraham: quæ iurásti pátribus nostris a diébus antíquis.'
