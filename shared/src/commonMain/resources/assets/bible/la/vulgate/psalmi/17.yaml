bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "17"
verses:
  "1": 'In finem. Púero Dómini David, qui locútus est Dómino verba cántici huius, in die qua erípuit eum Dóminus de manu ómnium inimicórum eius, et de manu Saul, et dixit:'
  "2": 'Díligam te Dómine fortitúdo mea:'
  "3": 'Dóminus firmaméntum meum, et refúgium meum, et liberátor meus. Deus meus adiútor meus, et sperábo in eum: protéctor meus, et cornu salútis meæ, et suscéptor meus.'
  "4": 'Laudans invocábo Dóminum: et ab inimícis meis salvus ero.'
  "5": 'Circumdedérunt me dolóres mortis: et torréntes iniquitátis conturbavérunt me.'
  "6": 'Dolóres inférni circumdedérunt me: præoccupavérunt me láquei mortis.'
  "7": 'In tribulatióne mea invocávi Dóminum, et ad Deum meum clamávi: et exaudívit de templo sancto suo vocem meam: et clamor meus in conspéctu eius introívit in aures eius.'
  "8": 'Commóta est, et contrémuit terra: fundaménta móntium conturbáta sunt, et commóta sunt: quóniam irátus est eis.'
  "9": 'Ascéndit fumus in ira eius, et ignis a fácie eius exársit: carbónes succénsi sunt ab eo.'
  "10": 'Inclinávit cælos, et descéndit: et calígo sub pédibus eius.'
  "11": 'Et ascéndit super chérubim, et volávit: volávit super pennas ventórum.'
  "12": 'Et pósuit ténebras latíbulum suum, in circúitu eius tabernáculum eius: tenebrósa aqua in núbibus áeris.'
  "13": Præ fulgóre in conspéctu eius nubes transiérunt, grando et carbónes ignis.
  "14": 'Et intónuit de cælo Dóminus, et Altíssimus dedit vocem suam: grando et carbónes ignis.'
  "15": 'Et misit sagíttas suas, et dissipávit eos: fúlgura multiplicávit, et conturbávit eos.'
  "16": 'Et apparuérunt fontes aquárum, et reveláta sunt fundaménta orbis terrárum: ab increpatióne tua Dómine, ab inspiratióne spíritus iræ tuæ.'
  "17": 'Misit de summo, et accépit me: et assúmpsit me de aquis multis.'
  "18": 'Erípuit me de inimícis meis fortíssimis, et ab his qui odérunt me: quóniam confortáti sunt super me.'
  "19": 'Prævenérunt me in die afflictiónis meæ: et factus est Dóminus protéctor meus.'
  "20": 'Et edúxit me in latitúdinem: salvum me fecit, quóniam vóluit me.'
  "21": 'Et retríbuet mihi Dóminus secúndum iustítiam meam, et secúndum puritátem mánuum meárum retríbuet mihi:'
  "22": quia custodívi vias Dómini, nec ímpie gessi a Deo meo.
  "23": 'Quóniam ómnia iudícia eius in conspéctu meo: et iustítias eius non répuli a me.'
  "24": 'Et ero immaculátus cum eo: et observábo me ab iniquitáte mea.'
  "25": 'Et retríbuet mihi Dóminus secúndum iustítiam meam: et secúndum puritátem mánuum meárum in conspéctu oculórum eius.'
  "26": 'Cum sancto sanctus eris, et cum viro innocénte ínnocens eris:'
  "27": 'et cum elécto eléctus eris: et cum pervérso pervertéris.'
  "28": 'Quóniam tu pópulum húmilem salvum fácies: et óculos superbórum humiliábis.'
  "29": 'Quóniam tu illúminas lucérnam meam Dómine: Deus meus illúmina ténebras meas.'
  "30": 'Quóniam in te erípiar a tentatióne: et in Deo meo transgrédiar murum.'
  "31": 'Deus meus impollúta via eius: elóquia Dómini igne examináta: protéctor est ómnium sperántium in se.'
  "32": Quóniam quis Deus præter Dóminum? aut quis Deus præter Deum nostrum?
  "33": 'Deus qui præcínxit me virtúte: et pósuit immaculátam viam meam.'
  "34": Qui perfécit pedes meos tamquam cervórum, et super excélsa státuens me.
  "35": 'Qui docet manus meas ad prœ́lium: et posuísti, ut arcum ǽreum, bráchia mea.'
  "36": 'Et dedísti mihi protectiónem salútis tuæ: et déxtera tua suscépit me: et disciplína tua corréxit me in finem: et disciplína tua ipsa me docébit.'
  "37": 'Dilatásti gressus meos subtus me: et non sunt infirmáta vestígia mea.'
  "38": 'Pérsequar inimícos meos, et comprehéndam illos: et non convértar donec defíciant.'
  "39": 'Confríngam illos, nec póterunt stare: cadent subtus pedes meos.'
  "40": 'Et præcinxísti me virtúte ad bellum: et supplantásti insurgéntes in me subtus me.'
  "41": Et inimícos meos dedísti mihi dorsum, et odiéntes me disperdidísti.
  "42": 'Clamavérunt, nec erat qui salvos fáceret, ad Dóminum: nec exaudívit eos.'
  "43": 'Et commínuam eos ut púlverem ante fáciem venti: ut lutum plateárum delébo eos.'
  "44": 'Erípies me de contradictiónibus pópuli: constítues me in caput géntium.'
  "45": 'Pópulus, quem non cognóvi, servívit mihi: in audítu auris obedívit mihi.'
  "46": Fílii aliéni mentíti sunt mihi, fílii aliéni inveteráti sunt, et claudicavérunt a sémitis suis.
  "47": Vivit Dóminus, et benedíctus Deus meus, et exaltétur Deus salútis meæ.
  "48": 'Deus qui das vindíctas mihi, et subdis pópulos sub me: liberátor meus de inimícis meis iracúndis.'
  "49": 'Et ab insurgéntibus in me exaltábis me: a viro iníquo erípies me.'
  "50": 'Proptérea confitébor tibi in natiónibus Dómine: et nómini tuo psalmum dicam:'
  "51": magníficans salútes regis eius, et fáciens misericórdiam christo suo David, et sémini eius usque in sǽculum.
