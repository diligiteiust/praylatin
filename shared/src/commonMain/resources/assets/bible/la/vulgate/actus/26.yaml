bible: vulgate
lang: la
language: Latina
book: Actus Apostolorum
chapter: "26"
verses:
  "1": 'Agríppa vero ad Paulum ait: Permíttitur tibi loqui pro temetípso. Tunc Paulus exténta manu cœpit ratiónem réddere:'
  "2": De ómnibus, quibus accúsor a Iudǽis, rex Agríppa, ǽstimo me beátum, apud te cum sim defensúrus me hódie,
  "3": 'máxime te sciénte ómnia, et quæ apud Iudǽos sunt consuetúdines, et quæstiónes: propter quod óbsecro patiénter me áudias.'
  "4": 'Et quidem vitam meam a iuventúte, quæ ab inítio fuit in gente mea in Ierosólymis, novérunt omnes Iudǽi:'
  "5": præsciéntes me ab inítio (si velint testimónium perhibére) quóniam secúndum certíssimam sectam nostræ religiónis vixi Pharisǽus.
  "6": 'Et nunc in spe, quæ ad patres nostros repromissiónis facta est a Deo, sto iudício subiéctus:'
  "7": in quam duódecim tribus nostræ nocte ac die deserviéntes, sperant deveníre. De qua spe accúsor a Iudǽis, rex.
  "8": Quid incredíbile iudicátur apud vos, si Deus mórtuos súscitat?
  "9": 'Et ego quidem existimáveram me advérsus nomen Iesu Nazaréni debére multa contrária ágere:'
  "10": 'quod et feci Ierosólymis, et multos sanctórum ego in carcéribus inclúsi, a princípibus sacerdótum potestáte accépta: et cum occideréntur, détuli senténtiam.'
  "11": 'Et per omnes synagógas frequénter púniens eos, compellébam blasphemáre: et ámplius insániens in eos, persequébar usque in éxteras civitátes.'
  "12": In quibus dum irem Damáscum cum potestáte, et permíssu príncipum sacerdótum,
  "13": die média in via, vidi, rex, de cælo supra splendórem solis circumfulsísse me lumen, et eos, qui mecum simul erant.
  "14": 'Omnésque nos cum decidissémus in terram, audívi vocem loquéntem mihi Hebráica lingua: Saule, Saule, quid me perséqueris? durum est tibi contra stímulum calcitráre.'
  "15": 'Ego autem dixi: Quis es Dómine? Dóminus autem dixit: Ego sum Iesus, quem tu perséqueris.'
  "16": 'Sed exsúrge, et sta super pedes tuos: ad hoc enim appárui tibi, ut constítuam te minístrum, et testem eórum, quæ vidísti, et eórum, quibus apparébo tibi,'
  "17": erípiens te de pópulo, et géntibus, in quas nunc ego mitto te,
  "18": aperíre óculos eórum, ut convertántur a ténebris ad lucem, et de potestáte Sátanæ ad Deum, ut accípiant remissiónem peccatórum, et sortem inter sanctos per fidem, quæ est in me.
  "19": 'Unde rex Agríppa, non fui incrédulus cælésti visióni:'
  "20": sed his, qui sunt Damásci primum, et Ierosólymis, et in omnem regiónem Iudǽæ, et géntibus, annuntiábam, ut pœniténtiam ágerent, et converteréntur ad Deum, digna pœniténtiæ ópera faciéntes.
  "21": Hac ex causa me Iudǽi, cum essem in templo, comprehénsum tentábant interfícere.
  "22": Auxílio autem adiútus Dei usque in hodiérnum diem sto, testíficans minóri, atque maióri, nihil extra dicens quam ea, quæ prophétæ locúti sunt futúra esse, et Móyses,
  "23": si passíbilis Christus, si primus ex resurrectióne mortuórum, lumen annuntiatúrus est pópulo, et géntibus.
  "24": 'Hæc loquénte eo, et ratiónem reddénte, Festus magna voce dixit: Insánis Paule: multæ te lítteræ ad insániam convértunt.'
  "25": 'Et Paulus: Non insánio (inquit) óptime Feste, sed veritátis, et sobrietátis verba loquor.'
  "26": 'Scit enim de his rex, ad quem et constánter loquor: latére enim eum nihil horum árbitror. Neque enim in ángulo quidquam horum gestum est.'
  "27": Credis rex Agríppa prophétis? Scio quia credis.
  "28": 'Agríppa autem ad Paulum: In módico suades me Christiánum fíeri.'
  "29": 'Et Paulus: Opto apud Deum, et in módico, et in magno, non tantum te, sed étiam omnes, qui áudiunt, hódie fíeri tales, qualis et ego sum, excéptis vínculis his.'
  "30": Et exsurréxit rex, et præses, et Berníce, et qui assidébant eis.
  "31": 'Et cum secessíssent, loquebántur ad ínvicem, dicéntes: Quia nihil morte, aut vínculis dignum quid fecit homo iste.'
  "32": 'Agríppa autem Festo dixit: Dimítti póterat homo hic, si non appellásset Cǽsarem.'
