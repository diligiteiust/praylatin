bible: vulgate
lang: la
language: Latina
book: Ruth
chapter: "1"
verses:
  "1": In diébus uníus iúdicis, quando iúdices prǽerant, facta est fames in terra. Abiítque homo de Béthlehem Iuda, ut peregrinarétur in regióne Moabítide cum uxóre sua ac duóbus líberis.
  "2": 'Ipse vocabátur Elímelech, et uxor eius Nóemi: et duo fílii, alter Máhalon, et alter Chélion, Ephrathǽi de Béthlehem Iuda. Ingressíque regiónem Moabítidem, morabántur ibi.'
  "3": 'Et mórtuus est Elímelech marítus Nóemi: remansítque ipsa cum fíliis.'
  "4": Qui accepérunt uxóres Moabítidas, quarum una vocabátur Orpha, áltera vero Ruth. Manserúntque ibi decem annis,
  "5": 'et ambo mórtui sunt, Máhalon vidélicet et Chélion: remansítque múlier orbáta duóbus líberis ac maríto.'
  "6": 'Et surréxit ut in pátriam pérgeret cum utráque nuru sua de regióne Moabítide: audíerat enim quod respexísset Dóminus pópulum suum, et dedísset eis escas.'
  "7": 'Egréssa est ítaque de loco peregrinatiónis suæ, cum utráque nuru: et iam in via reverténdi pósita in terram Iuda,'
  "8": 'dixit ad eas: Ite in domum matris vestræ, fáciat vobíscum Dóminus misericórdiam, sicut fecístis cum mórtuis et mecum.'
  "9": Det vobis inveníre réquiem in dómibus virórum, quos sortitúræ estis. Et osculáta est eas. Quæ eleváta voce flere cœpérunt,
  "10": 'et dícere: Tecum pergémus ad pópulum tuum.'
  "11": 'Quibus illa respóndit: Revertímini fíliæ meæ, cur venítis mecum? num ultra hábeo fílios in útero meo, ut viros ex me speráre possítis?'
  "12": 'Revertímini fíliæ meæ, et abíte: iam enim senectúte confécta sum, nec apta vínculo coniugáli: etiámsi possem hac nocte concípere, et párere fílios,'
  "13": 'si eos exspectáre velítis donec crescant, et annos pubertátis ímpleant, ante éritis vétulæ quam nubátis. Nolíte, quæso, fíliæ meæ: quia vestra angústia magis me premit, et egréssa est manus Dómini contra me.'
  "14": 'Eleváta ígitur voce, rursum flere cœpérunt: Orpha osculáta est socrum, ac revérsa est: Ruth adhǽsit sócrui suæ.'
  "15": 'Cui dixit Nóemi: En revérsa est cognáta tua ad pópulum suum, et ad deos suos, vade cum ea.'
  "16": 'Quæ respóndit: Ne adverséris mihi ut relínquam te et ábeam: quocúmque enim perréxeris, pergam: et ubi moráta fúeris, et ego páriter morábor. Pópulus tuus pópulus meus, et Deus tuus Deus meus.'
  "17": 'Quæ te terra moriéntem suscéperit, in ea móriar: ibíque locum accípiam sepultúræ. Hæc mihi fáciat Dóminus, et hæc addat, si non sola mors me et te separáverit.'
  "18": 'Videns ergo Nóemi quod obstináto ánimo Ruth decrevísset secum pérgere, adversári nóluit, nec ad suos ultra réditum persuadére:'
  "19": 'profectǽque sunt simul, et venérunt in Béthlehem. Quibus urbem ingréssis, velox apud cunctos fama percrébruit: dicebántque mulíeres: Hæc est illa Nóemi.'
  "20": 'Quibus ait: Ne vocétis me Nóemi (id est, pulchram), sed vocáte me Mara (id est, amáram), quia amaritúdine valde replévit me Omnípotens.'
  "21": Egréssa sum plena, et vácuam redúxit me Dóminus. Cur ergo vocátis me Nóemi, quam Dóminus humiliávit, et afflíxit Omnípotens?
  "22": 'Venit ergo Nóemi cum Ruth Moabítide nuru sua, de terra peregrinatiónis suæ: ac revérsa est in Béthlehem, quando primum hórdea metebántur.'
