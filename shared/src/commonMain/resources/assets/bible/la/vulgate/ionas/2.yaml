bible: vulgate
lang: la
language: Latina
book: Ionas
chapter: "2"
verses:
  "1": 'Et præparávit Dóminus piscem grandem ut deglutíret Ionam: et erat Ionas in ventre piscis tribus diébus, et tribus nóctibus.'
  "2": Et orávit Ionas ad Dóminum Deum suum de ventre piscis.
  "3": 'Et dixit: Clamávi de tribulatióne mea ad Dóminum, et exaudívit me: de ventre ínferi clamávi, et exaudísti vocem meam.'
  "4": 'Et proiecísti me in profúndum in corde maris, et flumen circúmdedit me: omnes gúrgites tui, et fluctus tui super me transiérunt.'
  "5": 'Et ego dixi: Abiéctus sum a conspéctu oculórum tuórum: verúmtamen rursus vidébo templum sanctum tuum.'
  "6": 'Circumdedérunt me aquæ usque ad ánimam: abýssus vallávit me, pélagus opéruit caput meum.'
  "7": 'Ad extréma móntium descéndi: terræ vectes conclusérunt me in ætérnum: et sublevábis de corruptióne vitam meam, Dómine Deus meus.'
  "8": 'Cum angustiarétur in me ánima mea, Dómini recordátus sum: ut véniat ad te orátio mea ad templum sanctum tuum.'
  "9": Qui custódiunt vanitátes frustra, misericórdiam suam derelínquunt.
  "10": 'Ego autem in voce laudis immolábo tibi: quæcúmque vovi, reddam pro salúte Dómino.'
  "11": 'Et dixit Dóminus pisci: et evómuit Ionam in áridam.'
