bible: vulgate
lang: la
language: Latina
book: Daniel
chapter: "10"
verses:
  "1": 'Anno tértio Cyri regis Persárum, verbum revelátum est Daniéli cognoménto Baltássar, et verbum verum, et fortitúdo magna: intellexítque sermónem: intelligéntia enim est opus in visióne.'
  "2": In diébus illis ego Dániel lugébam trium hebdomadárum diébus,
  "3": 'panem desiderábilem non comédi, et caro et vinum non introiérunt in os meum, sed neque unguénto unctus sum: donec compleréntur trium hebdomadárum dies.'
  "4": Die autem vigésima et quarta mensis primi, eram iuxta flúvium magnum, qui est Tigris.
  "5": 'Et levávi óculos meos, et vidi: et ecce vir unus vestítus líneis, et renes eius accíncti auro obrízo:'
  "6": 'et corpus eius quasi chrysólithus, et fácies eius velut spécies fúlguris, et óculi eius ut lampas ardens: et bráchia eius, et quæ deórsum sunt usque ad pedes, quasi spécies æris candéntis: et vox sermónum eius ut vox multitúdinis.'
  "7": 'Vidi autem ego Dániel solus visiónem: porro viri, qui erant mecum, non vidérunt: sed terror nímius írruit super eos, et fugérunt in abscónditum.'
  "8": 'Ego autem relíctus solus vidi visiónem grandem hanc: et non remánsit in me fortitúdo, sed et spécies mea immutáta est in me, et emárcui, nec hábui quidquam vírium.'
  "9": 'Et audívi vocem sermónum eius: et áudiens iacébam consternátus super fáciem meam, et vultus meus hærébat terræ.'
  "10": Et ecce manus tétigit me, et eréxit me super génua mea, et super artículos mánuum meárum.
  "11": 'Et dixit ad me: Dániel vir desideriórum, intéllige verba, quæ ego loquor ad te, et sta in gradu tuo: nunc enim sum missus ad te. Cumque dixísset mihi sermónem istum, steti tremens.'
  "12": 'Et ait ad me: Noli metúere Dániel: quia ex die primo, quo posuísti cor tuum ad intelligéndum ut te afflígeres in conspéctu Dei tui, exaudíta sunt verba tua: et ego veni propter sermónes tuos.'
  "13": 'Princeps autem regni Persárum réstitit mihi vigínti et uno diébus: et ecce Míchael, unus de princípibus primis, venit in adiutórium meum, et ego remánsi ibi iuxta regem Persárum.'
  "14": Veni autem ut docérem te quæ ventúra sunt pópulo tuo in novíssimis diébus, quóniam adhuc vísio in dies.
  "15": Cumque loquerétur mihi huiuscémodi verbis, deiéci vultum meum ad terram, et tácui.
  "16": 'Et ecce quasi similitúdo fílii hóminis tétigit lábia mea: et apériens os meum locútus sum, et dixi ad eum, qui stabat contra me: Dómine mi, in visióne tua dissolútæ sunt compáges meæ, et nihil in me remánsit vírium.'
  "17": Et quómodo póterit servus Dómini mei loqui cum Dómino meo? nihil enim in me remánsit vírium, sed et hálitus meus interclúditur.
  "18": Rursum ergo tétigit me quasi vísio hóminis, et confortávit me,
  "19": 'et dixit: Noli timére vir desideriórum: pax tibi: confortáre, et esto robústus. Cumque loquerétur mecum, conválui, et dixi: Lóquere Dómine mi, quia confortásti me.'
  "20": 'Et ait: Numquid scis quare vénerim ad te? et nunc revértar ut prœ́lier advérsum príncipem Persárum: cum ego egréderer, appáruit princeps Græcórum véniens.'
  "21": 'Verúmtamen annuntiábo tibi quod expréssum est in scriptúra veritátis: et nemo est adiútor meus in ómnibus his, nisi Míchael princeps vester.'
