bible: vulgate
lang: la
language: Latina
book: Isaias
chapter: "31"
verses:
  "1": 'Væ qui descéndunt in Ægýptum ad auxílium, in equis sperántes, et habéntes fidúciam super quadrígis, quia multæ sunt: et super equítibus, quia præválidi nimis: et non sunt confísi super sanctum Israel, et Dóminum non requisiérunt.'
  "2": 'Ipse autem sápiens addúxit malum, et verba sua non ábstulit: et consúrget contra domum pessimórum, et contra auxílium operántium iniquitátem.'
  "3": 'Ægýptus, homo, et non Deus: et equi eórum, caro, et non spíritus: et Dóminus inclinábit manum suam, et córruet auxiliátor, et cadet cui præstátur auxílium, simúlque omnes consuméntur.'
  "4": 'Quia hæc dicit Dóminus ad me: Quómodo si rúgiat leo et cátulus leónis super prædam suam: et cum occúrrerit ei multitúdo pastórum, a voce eórum non formidábit, et a multitúdine eórum non pavébit: sic descéndet Dóminus exercítuum ut prœliétur super montem Sion, et super collem eius.'
  "5": Sicut aves volántes, sic próteget Dóminus exercítuum Ierúsalem, prótegens et líberans, tránsiens et salvans.
  "6": Convertímini, sicut in profúndum recesserátis, fílii Israel.
  "7": In die enim illa abíciet vir idóla argénti sui, et idóla auri sui, quæ fecérunt vobis manus vestræ in peccátum.
  "8": 'Et cadet Assur in gládio non viri, et gládius non hóminis vorábit eum: et fúgiet non a fácie gládii, et iúvenes eius vectigáles erunt.'
  "9": 'Et fortitúdo eius a terróre transíbit, et pavébunt fugiéntes príncipes eius, dixit Dóminus: cuius ignis est in Sion, et camínus eius in Ierúsalem.'
