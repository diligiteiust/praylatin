bible: vulgate
lang: la
language: Latina
book: ad Hebraeos
chapter: "5"
verses:
  "1": 'Omnis namque póntifex ex homínibus assúmptus, pro homínibus constitúitur in iis, quæ sunt ad Deum, ut ófferat dona, et sacrifícia pro peccátis:'
  "2": 'qui condolére possit iis, qui ignórant, et errant: quóniam et ipse circúmdatus est infirmitáte:'
  "3": et proptérea debet, quemádmodum pro pópulo, ita étiam et pro semetípso offérre pro peccátis.
  "4": Nec quisquam sumit sibi honórem, sed qui vocátur a Deo, tamquam Aaron.
  "5": 'Sic et Christus non semetípsum clarificávit ut póntifex fíeret: sed qui locútus est ad eum: Fílius meus es tu, ego hódie génui te.'
  "6": 'Quemádmodum et in álio loco dicit: Tu es sacérdos in ætérnum, secúndum órdinem Melchísedech.'
  "7": Qui in diébus carnis suæ preces, supplicationésque ad eum, qui possit illum salvum fácere a morte, cum clamóre válido, et lácrymis ófferens, exaudítus est pro sua reveréntia.
  "8": 'Et quidem cum esset Fílius Dei, dídicit ex iis, quæ passus est, obediéntiam:'
  "9": et consummátus, factus est ómnibus obtemperántibus sibi, causa salútis ætérnæ,
  "10": appellátus a Deo póntifex iuxta órdinem Melchísedech.
  "11": 'De quo nobis grandis sermo, et ininterpretábilis ad dicéndum: quóniam imbecílles facti estis ad audiéndum.'
  "12": 'Etenim cum deberétis magístri esse propter tempus: rursum indigétis, ut vos doceámini quæ sint eleménta exórdii sermónum Dei: et facti estis quibus lacte opus sit, non sólido cibo.'
  "13": 'Omnis enim, qui lactis est párticeps, expers est sermónis iustítiæ: párvulus enim est.'
  "14": 'Perfectórum autem est sólidus cibus: eórum, qui pro consuetúdine exercitátos habent sensus ad discretiónem boni ac mali.'
