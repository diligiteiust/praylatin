bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "68"
verses:
  "1": In finem, pro iis, qui commutabúntur, David.
  "2": 'Salvum me fac Deus: quóniam intravérunt aquæ usque ad ánimam meam.'
  "3": 'Infíxus sum in limo profúndi: et non est substántia. Veni in altitúdinem maris: et tempéstas demérsit me.'
  "4": 'Laborávi clamans, raucæ factæ sunt fauces meæ: defecérunt óculi mei, dum spero in Deum meum.'
  "5": 'Multiplicáti sunt super capíllos cápitis mei, qui odérunt me gratis. Confortáti sunt qui persecúti sunt me inimíci mei iniúste: quæ non rápui, tunc exsolvébam.'
  "6": 'Deus tu scis insipiéntiam meam: et delícta mea a te non sunt abscóndita.'
  "7": 'Non erubéscant in me qui exspéctant te Dómine, Dómine virtútum: non confundántur super me qui quærunt te, Deus Israel.'
  "8": 'Quóniam propter te sustínui oppróbrium: opéruit confúsio fáciem meam.'
  "9": Extráneus factus sum frátribus meis, et peregrínus fíliis matris meæ.
  "10": 'Quóniam zelus domus tuæ comédit me: et oppróbria exprobrántium tibi cecidérunt super me.'
  "11": 'Et opérui in ieiúnio ánimam meam: et factum est in oppróbrium mihi.'
  "12": 'Et pósui vestiméntum meum cilícium: et factus sum illis in parábolam.'
  "13": 'Advérsum me loquebántur qui sedébant in porta: et in me psallébant qui bibébant vinum.'
  "14": 'Ego vero oratiónem meam ad te Dómine: tempus benepláciti Deus. In multitúdine misericórdiæ tuæ exáudi me, in veritáte salútis tuæ.'
  "15": 'Eripe me de luto, ut non infígar: líbera me ab iis qui odérunt me, et de profúndis aquárum.'
  "16": 'Non me demérgat tempéstas aquæ, neque absórbeat me profúndum: neque úrgeat super me púteus os suum.'
  "17": 'Exáudi me Dómine, quóniam benígna est misericórdia tua: secúndum multitúdinem miseratiónum tuárum réspice in me.'
  "18": 'Et ne avértas fáciem tuam a púero tuo: quóniam tríbulor, velóciter exáudi me.'
  "19": 'Inténde ánimæ meæ, et líbera eam: propter inimícos meos éripe me.'
  "20": Tu scis impropérium meum, et confusiónem meam, et reveréntiam meam.
  "21": 'In conspéctu tuo sunt omnes qui tríbulant me: impropérium exspectávit cor meum, et misériam: et sustínui qui simul contristarétur, et non fuit: et qui consolarétur, et non invéni.'
  "22": Et dedérunt in escam meam fel, et in siti mea potavérunt me acéto.
  "23": Fiat mensa eórum coram ipsis in láqueum, et in retributiónes, et in scándalum.
  "24": 'Obscuréntur óculi eórum ne vídeant: et dorsum eórum semper incúrva.'
  "25": 'Effúnde super eos iram tuam: et furor iræ tuæ comprehéndat eos.'
  "26": 'Fiat habitátio eórum desérta: et in tabernáculis eórum non sit qui inhábitet.'
  "27": 'Quóniam quem tu percussísti, persecúti sunt: et super dolórem vúlnerum meórum addidérunt.'
  "28": 'Appóne iniquitátem super iniquitátem eórum: et non intrent in iustítiam tuam.'
  "29": 'Deleántur de libro vivéntium: et cum iustis non scribántur.'
  "30": 'Ego sum pauper et dolens: salus tua Deus suscépit me.'
  "31": 'Laudábo nomen Dei cum cántico: et magnificábo eum in laude:'
  "32": et placébit Deo super vítulum novéllum, córnua producéntem et úngulas.
  "33": 'Vídeant páuperes et læténtur: quǽrite Deum, et vivet ánima vestra:'
  "34": 'quóniam exaudívit páuperes Dóminus: et vinctos suos non despéxit.'
  "35": 'Laudent illum cæli et terra: mare, et ómnia reptília in eis.'
  "36": 'Quóniam Deus salvam fáciet Sion: et ædificabúntur civitátes Iuda: et inhabitábunt ibi, et hereditáte acquírent eam.'
  "37": 'Et semen servórum eius possidébit eam: et qui díligunt nomen eius, habitábunt in ea.'
