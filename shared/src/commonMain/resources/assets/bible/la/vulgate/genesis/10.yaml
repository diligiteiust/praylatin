bible: vulgate
lang: la
language: Latina
book: Genesis
chapter: "10"
verses:
  "1": 'Hæ sunt generatiónes filiórum Noe, Sem, Cham, et Iapheth: natíque sunt eis fílii post dilúvium.'
  "2": 'Fílii Iapheth: Gomer, et Magog, et Mádai, et Iavan, et Thubal, et Mosoch, et Thiras.'
  "3": 'Porro fílii Gomer: Ascenez et Riphath et Thogórma.'
  "4": 'Fílii autem Iavan: Elísa et Tharsis, Cetthim et Dódanim.'
  "5": Ab his divísæ sunt ínsulæ géntium in regiónibus suis, unusquísque secúndum linguam suam et famílias suas in natiónibus suis.
  "6": 'Fílii autem Cham: Chus, et Mésraim et Phuth, et Chánaan.'
  "7": 'Fílii Chus: Saba, et Hevíla, et Sábatha, et Regma, et Sabátacha. Fílii Regma: Saba et Dadan.'
  "8": 'Porro Chus génuit Nemrod: ipse cœpit esse potens in terra,'
  "9": 'et erat robústus venátor coram Dómino. Ob hoc exívit provérbium: Quasi Nemrod robústus venátor coram Dómino.'
  "10": Fuit autem princípium regni eius Bábylon, et Arach, et Achad, et Chalánne, in terra Sénnaar.
  "11": De terra illa egréssus est Assur, et ædificávit Níniven, et platéas civitátis, et Chale.
  "12": 'Resen quoque inter Níniven et Chale: hæc est cívitas magna.'
  "13": At vero Mésraim génuit Ludim, et Anámim, et Láabim, Néphthuim,
  "14": 'et Phétrusim, et Chásluim: de quibus egréssi sunt Philísthiim et Cáphtorim.'
  "15": Chánaan autem génuit Sidónem primogénitum suum, Hethǽum,
  "16": et Iebusǽum, et Amorrhǽum, Gergesǽum,
  "17": 'Hevǽum, et Aracǽum: Sinǽum,'
  "18": 'et Arádium, Samarǽum, et Amathǽum: et post hæc dissemináti sunt pópuli Chananæórum.'
  "19": Factíque sunt términi Chánaan veniéntibus a Sidóne Geráram usque Gazam, donec ingrediáris Sódomam et Gomórrham, et Adamam, et Sebóim usque Lesa.
  "20": Hi sunt fílii Cham in cognatiónibus, et linguis, et generatiónibus, terrísque et géntibus suis.
  "21": De Sem quoque nati sunt, patre ómnium filiórum Heber, fratre Iapheth maióre.
  "22": 'Fílii Sem: Ælam, et Assur, et Arpháxad, et Lud, et Aram.'
  "23": 'Fílii Aram: Us, et Hul, et Gether, et Mes.'
  "24": At vero Arpháxad génuit Sale, de quo ortus est Heber.
  "25": 'Natíque sunt Heber fílii duo: nomen uni Phaleg, eo quod in diébus eius divísa sit terra: et nomen fratris eius Iectan.'
  "26": Qui Iectan génuit Elmódad, et Saleph, et Asármoth, Iare,
  "27": et Adúram, et Uzal, et Decla,
  "28": et Ebal, et Abímael, Saba,
  "29": 'et Ophir, et Hevíla, et Iobab: omnes isti, fílii Iectan.'
  "30": Et facta est habitátio eórum de Messa pergéntibus usque Sephar montem orientálem.
  "31": Isti fílii Sem secúndum cognatiónes, et linguas, et regiónes in géntibus suis.
  "32": Hæ famíliæ Noe iuxta pópulos et natiónes suas. Ab his divísæ sunt gentes in terra post dilúvium.
