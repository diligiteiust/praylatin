bible: vulgate
lang: la
language: Latina
book: Lucas
chapter: "11"
verses:
  "1": 'Et factum est: cum esset in quodam loco orans, ut cessávit, dixit unus ex discípulis eius ad eum: Dómine, doce nos oráre, sicut dócuit et Ioánnes discípulos suos.'
  "2": 'Et ait illis: Cum orátis, dícite: Pater, sanctificétur nomen tuum. Advéniat regnum tuum.'
  "3": Panem nostrum quotidiánum da nobis hódie.
  "4": Et dimítte nobis peccáta nostra, síquidem et ipsi dimíttimus omni debénti nobis. Et ne nos indúcas in tentatiónem.
  "5": 'Et ait ad illos: Quis vestrum habébit amícum, et ibit ad illum média nocte, et dicet illi: Amíce, cómmoda mihi tres panes,'
  "6": quóniam amícus meus venit de via ad me, et non hábeo quod ponam ante illum,
  "7": 'et ille deíntus respóndens dicat: Noli mihi moléstus esse, iam óstium clausum est, et púeri mei mecum sunt in cubíli: non possum súrgere, et dare tibi.'
  "8": 'Et si ille perseveráverit pulsans: dico vobis, etsi non dabit illi surgens eo quod amícus eius sit, propter improbitátem tamen eius surget, et dabit illi quotquot habet necessários.'
  "9": 'Et ego dico vobis: Pétite, et dábitur vobis: quǽrite, et inveniétis: pulsáte, et aperiétur vobis.'
  "10": 'Omnis enim, qui petit, áccipit: et qui quærit, ínvenit: et pulsánti aperiétur.'
  "11": Quis autem ex vobis patrem petit panem, numquid lápidem dabit illi? Aut piscem, numquid pro pisce serpéntem dabit illi?
  "12": Aut si petíerit ovum, numquid porríget illi scorpiónem?
  "13": 'Si ergo vos, cum sitis mali, nostis bona data dare fíliis vestris: quanto magis Pater vester de cælo dabit Spíritum bonum peténtibus se?'
  "14": Et erat eíciens dæmónium, et illud erat mutum. Et cum eiecísset dæmónium, locútus est mutus, et admirátæ sunt turbæ.
  "15": 'Quidam autem ex eis dixérunt: In Beélzebub príncipe dæmoniórum éicit dæmónia.'
  "16": Et álii tentántes, signum de cælo quærébant ab eo.
  "17": 'Ipse autem ut vidit cogitatiónes eórum, dixit eis: Omne regnum in seípsum divísum desolábitur, et domus supra domum cadet.'
  "18": Si autem et Sátanas in seípsum divísus est, quómodo stabit regnum eius? quia dícitis in Beélzebub me eícere dæmónia.
  "19": 'Si autem ego in Beélzebub eício dæmónia: fílii vestri in quo eíciunt? Ideo ipsi iúdices vestri erunt.'
  "20": 'Porro si in dígito Dei eício dæmónia: profécto pervénit in vos regnum Dei.'
  "21": Cum fortis armátus custódit átrium suum, in pace sunt ea, quæ póssidet.
  "22": Si autem fórtior eo supervéniens vícerit eum, univérsa arma eius áuferet, in quibus confidébat, et spólia eius distríbuet.
  "23": 'Qui non est mecum, contra me est: et qui non cólligit mecum, dispérgit.'
  "24": 'Cum immúndus spíritus exíerit de hómine, ámbulat per loca inaquósa, quærens réquiem: et non invéniens dicit: Revértar in domum meam unde exívi.'
  "25": Et cum vénerit, ínvenit eam scopis mundátam, et ornátam.
  "26": Tunc vadit, et assúmit septem álios spíritus secum, nequióres se, et ingréssi hábitant ibi. Et fiunt novíssima hóminis illíus peióra prióribus.
  "27": 'Factum est autem, cum hæc díceret: extóllens vocem quædam múlier de turba dixit illi: Beátus venter, qui te portávit, et úbera, quæ suxísti.'
  "28": 'At ille dixit: Quinímmo beáti, qui áudiunt verbum Dei, et custódiunt illud.'
  "29": 'Turbis autem concurréntibus cœpit dícere: Generátio hæc, generátio nequam est: signum quærit, et signum non dábitur ei, nisi signum Ionæ prophétæ.'
  "30": Nam sicut fuit Ionas signum Ninivítis, ita erit et Fílius hóminis generatióni isti.
  "31": 'Regína austri surget in iudício cum viris generatiónis huius, et condemnábit illos: quia venit a fínibus terræ audíre sapiéntiam Salomónis: et ecce plus quam Sálomon hic.'
  "32": 'Viri Ninivítæ surgent in iudício cum generatióne hac, et condemnábunt illam: quia pœniténtiam egérunt ad prædicatiónem Ionæ, et ecce plus quam Ionas hic.'
  "33": 'Nemo lucérnam accéndit, et in abscóndito ponit, neque sub módio: sed supra candelábrum, ut qui ingrediúntur, lumen vídeant.'
  "34": 'Lucérna córporis tui est óculus tuus. Si óculus tuus fúerit simplex, totum corpus tuum lúcidum erit: si autem nequam fúerit, étiam corpus tuum tenebrósum erit.'
  "35": Vide ergo ne lumen, quod in te est, ténebræ sint.
  "36": Si ergo corpus tuum totum lúcidum fúerit, non habens áliquam partem tenebrárum, erit lúcidum totum, et sicut lucérna fulgóris illuminábit te.
  "37": Et cum loquerétur, rogávit illum quidam Pharisǽus ut prandéret apud se. Et ingréssus recúbuit.
  "38": Pharisǽus autem cœpit intra se réputans dícere, quare non baptizátus esset ante prándium.
  "39": 'Et ait Dóminus ad illum: Nunc vos Pharisǽi, quod déforis est cálicis, et catíni, mundátis: quod autem intus est vestrum, plenum est rapína, et iniquitáte.'
  "40": Stulti, nonne qui fecit quod déforis est, étiam id, quod deíntus est, fecit?
  "41": 'Verúmtamen quod súperest, date eleemósynam: et ecce ómnia munda sunt vobis.'
  "42": 'Sed væ vobis Pharisǽis, quia decimátis mentham, et rutam, et omne olus, et prætéritis iudícium, et caritátem Dei: hæc autem opórtuit fácere, et illa non omíttere.'
  "43": Væ vobis Pharisǽis, quia dilígitis primas cáthedras in synagógis, et salutatiónes in foro.
  "44": Væ vobis, quia estis ut monuménta, quæ non ápparent, et hómines ambulántes supra, nésciunt.
  "45": 'Respóndens autem quidam ex legisperítis, ait illi: Magíster, hæc dicens étiam contuméliam nobis facis.'
  "46": 'At ille ait: Et vobis legisperítis væ: quia onerátis hómines onéribus, quæ portáre non possunt, et ipsi uno dígito vestro non tángitis sárcinas.'
  "47": 'Væ vobis, qui ædificátis monuménta prophetárum: patres autem vestri occidérunt illos.'
  "48": 'Profécto testificámini quod consentítis opéribus patrum vestrórum: quóniam ipsi quidem eos occidérunt, vos autem ædificátis eórum sepúlcra.'
  "49": 'Proptérea et sapiéntia Dei dixit: Mittam ad illos prophétas, et apóstolos, et ex illis occídent, et persequéntur:'
  "50": ut inquirátur sanguis ómnium prophetárum, qui effúsus est a constitutióne mundi a generatióne ista,
  "51": a sánguine Abel, usque ad sánguinem Zacharíæ, qui périit inter altáre, et ædem. Ita dico vobis, requirétur ab hac generatióne.
  "52": 'Væ vobis legisperítis, quia tulístis clavem sciéntiæ: ipsi non introístis, et eos, qui introíbant, prohibuístis.'
  "53": Cum autem hæc ad illos díceret, cœpérunt Pharisǽi, et legisperíti gráviter insístere, et os eius opprímere de multis,
  "54": insidiántes ei, et quæréntes áliquid cápere de ore eius, ut accusárent eum.
