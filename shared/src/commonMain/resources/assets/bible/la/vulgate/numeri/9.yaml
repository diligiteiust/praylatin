bible: vulgate
lang: la
language: Latina
book: Numeri
chapter: "9"
verses:
  "1": 'Locútus est Dóminus ad Móysen in desérto Sínai anno secúndo, postquam egréssi sunt de terra Ægýpti, mense primo, dicens:'
  "2": Fáciant fílii Israel Phase in témpore suo,
  "3": quartadécima die mensis huius ad vésperam, iuxta omnes cæremónias et iustificatiónes eius.
  "4": Præcepítque Móyses fíliis Israel ut fácerent Phase.
  "5": Qui fecérunt témpore suo, quartadécima die mensis ad vésperam, in monte Sínai. Iuxta ómnia quæ mandáverat Dóminus Móysi, fecérunt fílii Israel.
  "6": Ecce autem quidam immúndi super ánima hóminis, qui non póterant fácere Phase in die illo, accedéntes ad Móysen et Aaron,
  "7": 'dixérunt eis: Immúndi sumus super ánima hóminis: quare fraudámur ut non valeámus oblatiónem offérre Dómino in témpore suo inter fílios Israel?'
  "8": 'Quibus respóndit Móyses: State ut cónsulam quid præcípiat Dóminus de vobis.'
  "9": 'Locutúsque est Dóminus ad Móysen, dicens:'
  "10": 'Lóquere fíliis Israel: Homo qui fúerit immúndus super ánima, sive in via procul in gente vestra, fáciat Phase Dómino'
  "11": 'in mense secúndo, quartadécima die mensis ad vésperam: cum ázymis et lactúcis agréstibus cómedent illud:'
  "12": 'non relínquent ex eo quíppiam usque mane, et os eius non confríngent: omnem ritum Phase observábunt.'
  "13": 'Si quis autem et mundus est, et in itínere non fuit, et tamen non fecit Phase, exterminábitur ánima illa de pópulis suis, quia sacrifícium Dómino non óbtulit témpore suo: peccátum suum ipse portábit.'
  "14": Peregrínus quoque et ádvena si fúerint apud vos, fácient Phase Dómino iuxta cæremónias et iustificatiónes eius. Præcéptum idem erit apud vos tam ádvenæ quam indígenæ.
  "15": Igitur die qua eréctum est tabernáculum, opéruit illud nubes. A véspere autem super tentórium erat quasi spécies ignis usque mane.
  "16": 'Sic fiébat iúgiter: per diem operiébat illud nubes, et per noctem quasi spécies ignis.'
  "17": 'Cumque abláta fuísset nubes, quæ tabernáculum protegébat, tunc proficiscebántur fílii Israel: et in loco ubi stetísset nubes, ibi castrametabántur.'
  "18": 'Ad impérium Dómini proficiscebántur, et ad impérium illíus figébant tabernáculum. Cunctis diébus quibus stabat nubes super tabernáculum, manébant in eódem loco:'
  "19": et si evenísset ut multo témpore manéret super illud, erant fílii Israel in excúbiis Dómini, et non proficiscebántur
  "20": quot diébus fuísset nubes super tabernáculum. Ad impérium Dómini erigébant tentória, et ad impérium illíus deponébant.
  "21": 'Si fuísset nubes a véspere usque mane, et statim dilúculo tabernáculum reliquísset, proficiscebántur: et si post diem et noctem recessísset, dissipábant tentória.'
  "22": 'Si vero bíduo aut uno mense vel longióri témpore fuísset super tabernáculum, manébant fílii Israel in eódem loco, et non proficiscebántur: statim autem ut recessísset, movébant castra.'
  "23": 'Per verbum Dómini figébant tentória, et per verbum illíus proficiscebántur: erántque in excúbiis Dómini iuxta impérium eius per manum Móysi.'
