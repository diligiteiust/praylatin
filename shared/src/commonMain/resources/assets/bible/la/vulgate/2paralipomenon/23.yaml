bible: vulgate
lang: la
language: Latina
book: II Paralipomenon
chapter: "23"
verses:
  "1": 'Anno autem séptimo, confortátus Ióiada, assúmpsit centuriónes, Azaríam vidélicet fílium Iéroham, et Ismahel fílium Ióhanan, Azaríam quoque fílium Obed, et Maasíam fílium Adaíæ, et Elísaphat fílium Zechri: et íniit cum eis fœdus.'
  "2": Qui circumeúntes Iudam, congregavérunt Levítas de cunctis úrbibus Iuda, et príncipes familiárum Israel, venerúntque in Ierúsalem.
  "3": 'Iniit ergo omnis multitúdo pactum in domo Dei cum rege, dixítque ad eos Ióiada: Ecce fílius regis regnábit, sicut locútus est Dóminus super fílios David.'
  "4": 'Iste est ergo sermo quem faciétis:'
  "5": 'tértia pars vestrum qui véniunt ad sábbatum, sacerdótum, et Levitárum, et ianitórum erit in portis: tértia vero pars ad domum regis: et tértia ad portam quæ appellátur Fundaménti: omne vero réliquum vulgus sit in átriis domus Dómini.'
  "6": 'Nec quíspiam álius ingrediátur domum Dómini, nisi sacerdótes, et qui minístrant de Levítis: ipsi tantúmmodo ingrediántur, quia sanctificáti sunt: et omne réliquum vulgus obsérvet custódias Dómini.'
  "7": 'Levítæ autem circúmdent regem, habéntes sínguli arma sua (et si quis álius ingréssus fúerit templum, interficiátur): sintque cum rege et intránte et egrediénte.'
  "8": 'Fecérunt ergo Levítæ, et univérsus Iuda, iuxta ómnia quæ præcéperat Ióiada póntifex: et assumpsérunt sínguli viros qui sub se erant, et veniébant per órdinem sábbati, cum his qui impléverant sábbatum et egressúri erant: síquidem Ióiada póntifex non dimíserat abíre turmas, quæ sibi per síngulas hebdómadas succédere consuéverant.'
  "9": Dedítque Ióiada sacérdos centuriónibus lánceas, clypeósque et peltas regis David, quas consecráverat in domo Dómini.
  "10": Constituítque omnem pópulum tenéntium pugiónes a parte templi dextra, usque ad partem templi sinístram, coram altári et templo, per circúitum regis.
  "11": 'Et eduxérunt fílium regis, et imposuérunt ei diadéma, et testimónium, dederúntque in manu eius tenéndam legem, et constituérunt eum regem: unxit quoque illum Ióiada póntifex, et fílii eius: imprecatíque sunt ei, atque dixérunt: Vivat rex.'
  "12": Quod cum audísset Athalía, vocem scílicet curréntium atque laudántium regem, ingréssa est ad pópulum in templum Dómini.
  "13": 'Cumque vidísset regem stantem super gradum in intróitu, et príncipes, turmásque circa eum, omnémque pópulum terræ gaudéntem, atque clangéntem tubis, et divérsi géneris órganis concinéntem, vocémque laudántium, scidit vestiménta sua, et ait: Insídiæ, insídiæ.'
  "14": 'Egréssus autem Ióiada póntifex ad centuriónes, et príncipes exércitus, dixit eis: Edúcite illam extra septa templi, et interficiátur foris gládio. Præcepítque sacérdos ne occiderétur in domo Dómini.'
  "15": 'Et imposuérunt cervícibus eius manus: cumque intrásset portam equórum domus regis, interfecérunt eam ibi.'
  "16": Pépigit autem Ióiada fœdus inter se, universúmque pópulum, et regem, ut esset pópulus Dómini.
  "17": 'Itaque ingréssus est omnis pópulus domum Baal, et destruxérunt eam, et altária ac simulácra illíus confregérunt: Mathan quoque sacerdótem Baal interfecérunt ante aras.'
  "18": Constítuit autem Ióiada præpósitos in domo Dómini, sub mánibus sacerdótum, et Levitárum, quos distríbuit David in domo Dómini, ut offérrent holocáusta Dómino, sicut scriptum est in lege Móysi, in gáudio et cánticis, iuxta dispositiónem David.
  "19": Constítuit quoque ianitóres in portis domus Dómini, ut non ingrederétur eam immúndus in omni re.
  "20": Assumpsítque centuriónes, et fortíssimos viros, ac príncipes pópuli, et omne vulgus terræ, et fecérunt descéndere regem de domo Dómini, et introíre per médium portæ superióris in domum regis, et collocavérunt eum in sólio regáli.
  "21": 'Lætatúsque est omnis pópulus terræ, et urbs quiévit: porro Athalía interfécta est gládio.'
