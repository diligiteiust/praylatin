bible: vulgate
lang: la
language: Latina
book: I Samuelis
chapter: "7"
verses:
  "1": 'Venérunt ergo viri Cariathíarim, et reduxérunt arcam Dómini, et intulérunt eam in domum Abínadab in Gábaa: Eleázarum autem fílium eius sanctificavérunt, ut custodíret arcam Dómini.'
  "2": Et factum est, ex qua die mansit arca Dómini in Cariathíarim, multiplicáti sunt dies (erat quippe iam annus vigésimus), et requiévit omnis domus Israel post Dóminum.
  "3": 'Ait autem Sámuel ad univérsam domum Israel, dicens: Si in toto corde vestro revertímini ad Dóminum, auférte deos aliénos de médio vestri, Báalim et Astaroth: et præparáte corda vestra Dómino, et servíte ei soli, et éruet vos de manu Philísthiim.'
  "4": Abstulérunt ergo fílii Israel Báalim et Astaroth, et serviérunt Dómino soli.
  "5": 'Dixit autem Sámuel: Congregáte univérsum Israel in Masphath, ut orem pro vobis Dóminum.'
  "6": 'Et convenérunt in Masphath: hauserúntque aquam, et effudérunt in conspéctu Dómini: et ieiunavérunt in die illa, atque dixérunt ibi: Peccávimus Dómino. Iudicavítque Sámuel fílios Israel in Masphath.'
  "7": Et audiérunt Philísthiim quod congregáti essent fílii Israel in Masphath, et ascendérunt sátrapæ Philisthinórum ad Israel. Quod cum audíssent fílii Israel, timuérunt a fácie Philisthinórum.
  "8": 'Dixerúntque ad Samuélem: Ne cesses pro nobis clamáre ad Dóminum Deum nostrum, ut salvet nos de manu Philisthinórum.'
  "9": 'Tulit autem Sámuel agnum lacténtem unum, et óbtulit illum holocáustum íntegrum Dómino: et clamávit Sámuel ad Dóminum pro Israel, et exaudívit eum Dóminus.'
  "10": 'Factum est autem, cum Sámuel offérret holocáustum, Philísthiim iniére prœ́lium contra Israel: intónuit autem Dóminus fragóre magno in die illa super Philísthiim, et extérruit eos, et cæsi sunt a fácie Israel.'
  "11": Egressíque viri Israel de Masphath, persecúti sunt Philisthǽos, et percussérunt eos usque ad locum, qui erat subter Bethchar.
  "12": 'Tulit autem Sámuel lápidem unum, et pósuit eum inter Masphath et inter Sen: et vocávit nomen loci illíus, Lapis adiutórii. Dixítque: Hucúsque auxiliátus est nobis Dóminus.'
  "13": Et humiliáti sunt Philísthiim, nec apposuérunt ultra ut venírent in términos Israel. Facta est ítaque manus Dómini super Philisthǽos cunctis diébus Samuélis.
  "14": 'Et rédditæ sunt urbes, quas túlerant Philísthiim ab Israel, Israéli, ab Accaron usque Geth, et términos suos: liberavítque Israel de manu Philisthinórum, erátque pax inter Israel et Amorrhǽum.'
  "15": 'Iudicábat quoque Sámuel Israélem cunctis diébus vitæ suæ:'
  "16": et ibat per síngulos annos circúiens Bethel et Gálgala et Masphath, et iudicábat Israélem in supradíctis locis.
  "17": 'Revertebatúrque in Rámatha: ibi enim erat domus eius, et ibi iudicábat Israélem: ædificávit étiam ibi altáre Dómino.'
