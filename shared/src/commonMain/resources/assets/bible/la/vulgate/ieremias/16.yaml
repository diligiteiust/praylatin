bible: vulgate
lang: la
language: Latina
book: Ieremias
chapter: "16"
verses:
  "1": 'Et factum est verbum Dómini ad me, dicens:'
  "2": Non accípies uxórem, et non erunt tibi fílii, et fíliæ in loco isto.
  "3": 'Quia hæc dicit Dóminus super fílios et fílias, qui generántur in loco isto, et super matres eórum, quæ genuérunt eos: et super patres eórum, de quorum stirpe sunt nati in terra hac:'
  "4": 'Mórtibus ægrotatiónum moriéntur: non plangéntur, et non sepeliéntur, in sterquilínium super fáciem terræ erunt: et gládio, et fame consuméntur: et erit cadáver eórum in escam volatílibus cæli, et béstiis terræ.'
  "5": 'Hæc enim dicit Dóminus: Ne ingrediáris domum convívii, neque vadas ad plangéndum, neque consoléris eos: quia ábstuli pacem meam a pópulo isto, dicit Dóminus, misericórdiam et miseratiónes.'
  "6": 'Et moriéntur grandes et parvi in terra ista: non sepeliéntur, neque plangéntur, et non se incídent, neque calvítium fiet pro eis.'
  "7": Et non frangent inter eos lugénti panem ad consolándum super mórtuo, et non dabunt eis potum cálicis ad consolándum super patre suo et matre.
  "8": 'Et domum convívii non ingrediáris, ut sédeas cum eis, et cómedas, et bibas:'
  "9": 'quia hæc dicit Dóminus exercítuum, Deus Israel: Ecce ego áuferam de loco isto, in óculis vestris, et in diébus vestris, vocem gáudii et vocem lætítiæ, vocem sponsi et vocem sponsæ.'
  "10": 'Et cum annuntiáveris pópulo huic ómnia verba hæc, et díxerint tibi: Quare locútus est Dóminus super nos omne malum grande istud? quæ iníquitas nostra? et quod peccátum nostrum, quod peccávimus Dómino Deo nostro?'
  "11": 'Dices ad eos: Quia dereliquérunt me patres vestri, ait Dóminus: et abiérunt post deos aliénos, et serviérunt eis, et adoravérunt eos: et me dereliquérunt, et legem meam non custodiérunt.'
  "12": 'Sed et vos peius operáti estis quam patres vestri: ecce enim ámbulat unusquísque post pravitátem cordis sui mali, ut me non áudiat.'
  "13": 'Et eíciam vos de terra hac in terram, quam ignorátis vos, et patres vestri: et serviétis ibi diis aliénis, die ac nocte, qui non dabunt vobis réquiem.'
  "14": 'Proptérea ecce dies véniunt, dicit Dóminus, et non dicétur ultra: Vivit Dóminus, qui edúxit fílios Israel de terra Ægýpti,'
  "15": 'sed, Vivit Dóminus, qui edúxit fílios Israel de terra aquilónis, et de univérsis terris, ad quas eiéci eos: et redúcam eos in terram suam, quam dedi pátribus eórum.'
  "16": 'Ecce ego mittam piscatóres multos, dicit Dóminus, et piscabúntur eos: et post hæc mittam eis multos venatóres, et venabúntur eos de omni monte, et de omni colle, et de cavérnis petrárum.'
  "17": 'Quia óculi mei super omnes vias eórum: non sunt abscónditæ a fácie mea, et non fuit occultáta iníquitas eórum ab óculis meis.'
  "18": 'Et reddam primum dúplices iniquitátes, et peccáta eórum: quia contaminavérunt terram meam in morticínis idolórum suórum, et abominatiónibus suis implevérunt hereditátem meam.'
  "19": 'Dómine fortitúdo mea, et robur meum, et refúgium meum in die tribulatiónis: ad te gentes vénient ab extrémis terræ, et dicent: Vere mendácium possedérunt patres nostri, vanitátem, quæ eis non prófuit.'
  "20": Numquid fáciet sibi homo deos, et ipsi non sunt dii?
  "21": 'Idcírco ecce ego osténdam eis per vicem hanc, osténdam eis manum meam, et virtútem meam: et scient quia nomen mihi Dóminus.'
