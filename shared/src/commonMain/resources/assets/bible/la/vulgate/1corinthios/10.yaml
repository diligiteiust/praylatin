bible: vulgate
lang: la
language: Latina
book: ad Corinthios I
chapter: "10"
verses:
  "1": Nolo enim vos ignoráre fratres, quóniam patres nostri omnes sub nube fuérunt, et omnes mare transiérunt,
  "2": 'et omnes in Móyse baptizáti sunt in nube, et in mari:'
  "3": et omnes eámdem escam spiritálem manducavérunt,
  "4": 'et omnes eúmdem potum spiritálem bibérunt (bibébant autem de spiritáli, consequénte eos, petra: petra autem erat Christus):'
  "5": 'sed non in plúribus eórum beneplácitum est Deo: nam prostráti sunt in desérto.'
  "6": Hæc autem in figúra facta sunt nostri, ut non simus concupiscéntes malórum, sicut et illi concupiérunt.
  "7": 'Neque idolólatræ efficiámini, sicut quidam ex ipsis: quemádmodum scriptum est: Sedit pópulus manducáre, et bíbere, et surrexérunt lúdere.'
  "8": Neque fornicémur, sicut quidam ex ipsis fornicáti sunt, et cecidérunt una die vigínti tria míllia.
  "9": Neque tentémus Christum, sicut quidam eórum tentavérunt, et a serpéntibus periérunt.
  "10": Neque murmuravéritis, sicut quidam eórum murmuravérunt, et periérunt ab exterminatóre.
  "11": 'Hæc autem ómnia in figúra contingébant illis: scripta sunt autem ad correptiónem nostram, in quos fines sæculórum devenérunt.'
  "12": Itaque qui se exístimat stare, vídeat ne cadat.
  "13": 'Tentátio vos non apprehéndat nisi humána: fidélis autem Deus est, qui non patiétur vos tentári supra id quod potéstis, sed fáciet étiam cum tentatióne provéntum ut possítis sustinére.'
  "14": 'Propter quod caríssimi mihi, fúgite ab idolórum cultúra:'
  "15": ut prudéntibus loquor, vos ipsi iudicáte quod dico.
  "16": Calix benedictiónis, cui benedícimus, nonne communicátio sánguinis Christi est? et panis, quem frángimus, nonne participátio córporis Dómini est?
  "17": Quóniam unus panis, unum corpus multi sumus, omnes qui de uno pane participámus.
  "18": 'Vidéte Israel secúndum carnem: nonne qui edunt hóstias, partícipes sunt altáris?'
  "19": Quid ergo? dico quod idólis immolátum sit áliquid? aut quod idólum sit áliquid?
  "20": 'Sed quæ ímmolant gentes, dæmóniis ímmolant, et non Deo. Nolo autem vos sócios fíeri dæmoniórum: non potéstis cálicem Dómini bíbere, et cálicem dæmoniórum:'
  "21": non potéstis mensæ Dómini partícipes esse, et mensæ dæmoniórum.
  "22": An æmulámur Dóminum? numquid fortióres illo sumus? Omnia mihi licent, sed non ómnia expédiunt.
  "23": Omnia mihi licent, sed non ómnia ædíficant.
  "24": Nemo quod suum est quærat, sed quod altérius.
  "25": Omne, quod in macéllo venit, manducáte, nihil interrogántes propter consciéntiam.
  "26": Dómini est terra, et plenitúdo eius.
  "27": 'Si quis vocat vos infidélium, et vultis ire: omne, quod vobis appónitur, manducáte, nihil interrogántes propter consciéntiam.'
  "28": 'Si quis autem díxerit: Hoc immolátum est idólis: nolíte manducáre propter illum, qui indicávit, et propter consciéntiam:'
  "29": consciéntiam autem dico non tuam, sed altérius. Ut quid enim libértas mea iudicátur ab aliéna consciéntia?
  "30": Si ego cum grátia partícipo, quid blasphémor pro eo quod grátias ago?
  "31": 'Sive ergo manducátis, sive bíbitis, sive áliud quid fácitis: ómnia in glóriam Dei fácite.'
  "32": 'Sine offensióne estóte Iudǽis, et géntibus, et Ecclésiæ Dei:'
  "33": 'sicut et ego per ómnia ómnibus pláceo, non quærens quod mihi útile est, sed quod multis: ut salvi fiant.'
