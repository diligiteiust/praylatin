bible: vulgate
lang: la
language: Latina
book: Lucas
chapter: "21"
verses:
  "1": Respíciens autem vidit eos, qui mittébant múnera sua in gazophylácium, dívites.
  "2": Vidit autem et quamdam víduam paupérculam mitténtem æra minúta duo.
  "3": 'Et dixit: Vere dico vobis, quia vídua hæc pauper, plus quam omnes misit.'
  "4": 'Nam omnes hi ex abundánti sibi misérunt in múnera Dei: hæc autem ex eo, quod deest illi, omnem victum suum quem hábuit, misit.'
  "5": 'Et quibúsdam dicéntibus de templo quod bonis lapídibus, et donis ornátum esset, dixit:'
  "6": Hæc quæ vidétis, vénient dies, in quibus non relinquétur lapis super lápidem, qui non destruátur.
  "7": 'Interrogavérunt autem illum, dicéntes: Præcéptor, quando hæc erunt, et quod signum cum fíeri incípient?'
  "8": 'Qui dixit: Vidéte ne seducámini: multi enim vénient in nómine meo, dicéntes quia ego sum: et tempus appropinquávit: nolíte ergo ire post eos.'
  "9": 'Cum autem audiéritis prœ́lia, et seditiónes, nolíte terréri: opórtet primum hæc fíeri, sed nondum statim finis.'
  "10": 'Tunc dicébat illis: Surget gens contra gentem, et regnum advérsus regnum.'
  "11": Et terræmótus magni erunt per loca, et pestiléntiæ, et fames, terrorésque de cælo, et signa magna erunt.
  "12": 'Sed ante hæc ómnia inícient vobis manus suas, et persequéntur tradéntes in synagógas, et custódias, trahéntes ad reges, et prǽsides propter nomen meum:'
  "13": contínget autem vobis in testimónium.
  "14": 'Pónite ergo in córdibus vestris non præmeditári quemádmodum respondeátis:'
  "15": ego enim dabo vobis os, et sapiéntiam, cui non póterunt resístere, et contradícere omnes adversárii vestri.
  "16": 'Tradémini autem a paréntibus, et frátribus, et cognátis, et amícis, et morte affícient ex vobis:'
  "17": 'et éritis ódio ómnibus propter nomen meum:'
  "18": et capíllus de cápite vestro non períbit.
  "19": In patiéntia vestra possidébitis ánimas vestras.
  "20": 'Cum autem vidéritis circúmdari ab exércitu Ierúsalem, tunc scitóte quia appropinquávit desolátio eius:'
  "21": 'tunc qui in Iudǽa sunt, fúgiant ad montes, et qui in médio eius, discédant: et qui in regiónibus, non intrent in eam,'
  "22": quia dies ultiónis hi sunt, ut impleántur ómnia, quæ scripta sunt.
  "23": 'Væ autem prægnántibus, et nutriéntibus in illis diébus: erit enim pressúra magna super terram, et ira pópulo huic.'
  "24": Et cadent in ore gládii, et captívi ducéntur in omnes gentes, et Ierúsalem calcábitur a géntibus, donec impleántur témpora natiónum.
  "25": 'Et erunt signa in sole, et luna, et stellis, et in terris pressúra géntium præ confusióne sónitus maris, et flúctuum:'
  "26": 'arescéntibus homínibus præ timóre, et exspectatióne, quæ supervénient univérso orbi: nam virtútes cælórum movebúntur:'
  "27": et tunc vidébunt Fílium hóminis veniéntem in nube cum potestáte magna, et maiestáte.
  "28": 'His autem fíeri incipiéntibus, respícite, et leváte cápita vestra: quóniam appropínquat redémptio vestra.'
  "29": 'Et dixit illis similitúdinem: Vidéte ficúlneam, et omnes árbores:'
  "30": cum prodúcunt iam ex se fructum, scitis quóniam prope est æstas.
  "31": Ita et vos cum vidéritis hæc fíeri, scitóte quóniam prope est regnum Dei.
  "32": Amen dico vobis, quia non præteríbit generátio hæc, donec ómnia fiant.
  "33": 'Cælum, et terra transíbunt: verba autem mea non transíbunt.'
  "34": 'Atténdite autem vobis, ne forte gravéntur corda vestra in crápula, et ebrietáte, et curis huius vitæ, et supervéniat in vos repentína dies illa:'
  "35": tamquam láqueus enim supervéniet in omnes, qui sedent super fáciem omnis terræ.
  "36": Vigiláte ítaque, omni témpore orántes, ut digni habeámini fúgere ista ómnia, quæ futúra sunt, et stare ante Fílium hóminis.
  "37": 'Erat autem diébus docens in templo: nóctibus vero éxiens, morabátur in monte, qui vocátur Olivéti.'
  "38": Et omnis pópulus manicábat ad eum in templo audíre eum.
