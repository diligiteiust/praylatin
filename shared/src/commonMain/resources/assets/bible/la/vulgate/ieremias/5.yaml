bible: vulgate
lang: la
language: Latina
book: Ieremias
chapter: "5"
verses:
  "1": 'Circuíte vias Ierúsalem, et aspícite, et consideráte, et quǽrite in platéis eius, an inveniátis virum faciéntem iudícium, et quæréntem fidem: et propítius ero ei.'
  "2": 'Quod si étiam Vivit Dóminus, díxerint: et hoc falso iurábunt.'
  "3": 'Dómine óculi tui respíciunt fidem: percussísti eos, et non doluérunt: attrivísti eos, et renuérunt accípere disciplínam: induravérunt fácies suas supra petram, et noluérunt revérti.'
  "4": 'Ego autem dixi: Fórsitan páuperes sunt et stulti, ignorántes viam Dómini, iudícium Dei sui.'
  "5": 'Ibo ígitur ad optimátes, et loquar eis: ipsi enim cognovérunt viam Dómini, iudícium Dei sui: et ecce magis hi simul confregérunt iugum, rupérunt víncula.'
  "6": 'Idcírco percússit eos leo de silva, lupus ad vésperam vastávit eos, pardus vígilans super civitátes eórum: omnis, qui egréssus fúerit ex eis, capiétur: quia multiplicátæ sunt prævaricatiónes eórum, confortátæ sunt aversiónes eórum.'
  "7": 'Super quo propítius tibi esse pótero? fílii tui dereliquérunt me, et iurant in his, qui non sunt dii: saturávi eos, et mœcháti sunt, et in domo meretrícis luxuriabántur.'
  "8": 'Equi amatóres et emissárii facti sunt: unusquísque ad uxórem próximi sui hinniébat.'
  "9": Numquid super his non visitábo, dicit Dóminus, et in gente tali non ulciscétur ánima mea?
  "10": 'Ascéndite muros eius, et dissipáte: consummatiónem autem nolíte fácere: auférte propágines eius, quia non sunt Dómini.'
  "11": Prævaricatióne enim prævaricáta est in me domus Israel, et domus Iuda, ait Dóminus.
  "12": 'Negavérunt Dóminum, et dixérunt: Non est ipse: neque véniet super nos malum: gládium et famem non vidébimus.'
  "13": 'Prophétæ fuérunt in ventum locúti, et respónsum non fuit in eis: hæc ergo evénient illis.'
  "14": 'Hæc dicit Dóminus Deus exercítuum: Quia locúti estis verbum istud, ecce ego do verba mea in ore tuo in ignem, et pópulum istum in ligna, et vorábit eos.'
  "15": 'Ecce ego addúcam super vos gentem de longínquo domus Israel, ait Dóminus: gentem robústam, gentem antíquam, gentem, cuius ignorábis linguam, nec intélliges quid loquátur.'
  "16": Pháretra eius quasi sepúlcrum patens, univérsi fortes.
  "17": 'Et cómedet ségetes tuas, et panem tuum: devorábit fílios tuos, et fílias tuas: cómedet gregem tuum, et arménta tua: cómedet víneam tuam, et ficum tuam: et cónteret urbes munítas tuas, in quibus tu habes fidúciam, gládio.'
  "18": Verúmtamen in diébus illis, ait Dóminus, non fáciam vos in consummatiónem.
  "19": 'Quod si dixéritis: Quare fecit nobis Dóminus Deus noster hæc ómnia? dices ad eos: Sicut dereliquístis me, et servístis deo aliéno in terra vestra, sic serviétis aliénis in terra non vestra.'
  "20": 'Annuntiáte hoc dómui Iacob, et audítum fácite in Iuda, dicéntes:'
  "21": 'Audi pópule stulte, qui non habes cor: qui habéntes óculos non vidétis: et aures, et non audítis.'
  "22": 'Me ergo non timébitis, ait Dóminus, et a fácie mea non dolébitis? Qui pósui arénam términum mari, præcéptum sempitérnum, quod non præteríbit: et commovebúntur, et non póterunt: et intuméscent fluctus eius, et non transíbunt illud.'
  "23": Pópulo autem huic factum est cor incrédulum et exásperans, recessérunt et abiérunt.
  "24": 'Et non dixérunt in corde suo: Metuámus Dóminum Deum nostrum, qui dat nobis plúviam temporáneam et serótinam in témpore suo, plenitúdinem ánnuæ messis custodiéntem nobis.'
  "25": 'Iniquitátes vestræ declinavérunt hæc, et peccáta vestra prohibuérunt bonum a vobis:'
  "26": quia invénti sunt in pópulo meo ímpii insidiántes quasi áucupes, láqueos ponéntes et pédicas ad capiéndos viros.
  "27": 'Sicut decípula plena ávibus, sic domus eórum plenæ dolo: ídeo magnificáti sunt et ditáti.'
  "28": Incrassáti sunt et impinguáti, et præteriérunt sermónes meos péssime. Causam víduæ non iudicavérunt, causam pupílli non direxérunt, et iudícium páuperum non iudicavérunt.
  "29": Numquid super his non visitábo, dicit Dóminus, aut super gentem huiuscémodi non ulciscétur ánima mea?
  "30": 'Stupor et mirabília facta sunt in terra:'
  "31": 'prophétæ prophetábant mendácium, et sacerdótes applaudébant mánibus suis: et pópulus meus diléxit tália: quid ígitur fiet in novíssimo eius?'
