bible: vulgate
lang: la
language: Latina
book: II Paralipomenon
chapter: "11"
verses:
  "1": Venit autem Róboam in Ierúsalem, et convocávit univérsam domum Iuda et Béniamin, centum octogínta míllia electórum atque bellántium, ut dimicáret contra Israel, et convérteret ad se regnum suum.
  "2": 'Factúsque est sermo Dómini ad Semeíam hóminem Dei, dicens:'
  "3": 'Lóquere ad Róboam fílium Salomónis regem Iuda, et ad univérsum Israel, qui est in Iuda et Béniamin:'
  "4": 'Hæc dicit Dóminus: Non ascendétis, neque pugnábitis contra fratres vestros: revertátur unusquísque in domum suam, quia mea hoc gestum est voluntáte. Qui cum audíssent sermónem Dómini, revérsi sunt, nec perrexérunt contra Ieróboam.'
  "5": Habitávit autem Róboam in Ierúsalem, et ædificávit civitátes murátas in Iuda.
  "6": Exstruxítque Béthlehem, et Etam, et Thécue,
  "7": Bethsur quoque, et Socho, et Odóllam,
  "8": necnon et Geth, et Marésa, et Ziph,
  "9": sed et Adúram, et Lachis, et Azéca,
  "10": Sáraa quoque, et Aialon, et Hebron, quæ erant in Iuda et Béniamin, civitátes munitíssimas.
  "11": Cumque clausísset eas muris, pósuit in eis príncipes, ciborúmque hórrea, hoc est, ólei, et vini.
  "12": Sed et in síngulis úrbibus fecit armamentárium scutórum et hastárum, firmavítque eas summa diligéntia, et imperávit super Iudam et Béniamin.
  "13": Sacerdótes autem et Levítæ, qui erant in univérso Israel, venérunt ad eum de cunctis sédibus suis,
  "14": 'relinquéntes suburbána, et possessiónes suas, et transeúntes ad Iudam, et Ierúsalem: eo quod abiecísset eos Ieróboam, et pósteri eius, ne sacerdótio Dómini fungeréntur.'
  "15": Qui constítuit sibi sacerdótes excelsórum, et dæmoniórum, vitulorúmque quos fécerat.
  "16": Sed et de cunctis tríbubus Israel, quicúmque déderant cor suum ut quǽrerent Dóminum Deum Israel, venérunt in Ierúsalem ad immolándum víctimas suas coram Dómino Deo patrum suórum.
  "17": 'Et roboravérunt regnum Iuda, et confirmavérunt Róboam fílium Salomónis per tres annos: ambulavérunt enim in viis David et Salomónis, annis tantum tribus.'
  "18": 'Duxit autem Róboam uxórem Máhalath fíliam Iérimoth fílii David: Abíhail quoque fíliam Eliab fílii Isai,'
  "19": quæ péperit ei fílios Iehus, et Somoríam, et Zoom.
  "20": Post hanc quoque accépit Máacha fíliam Absalom, quæ péperit ei Abía, et Ethai, et Ziza, et Sálomith.
  "21": 'Amávit autem Róboam Máacha fíliam Absalom super omnes uxóres suas, et concubínas: nam uxóres decem et octo dúxerat, concubínas autem sexagínta: et génuit vigínti octo fílios, et sexagínta fílias.'
  "22": 'Constítuit vero in cápite Abíam fílium Máacha ducem super omnes fratres suos: ipsum enim regem fácere cogitábat,'
  "23": 'quia sapiéntior fuit, et poténtior super omnes fílios eius, et in cunctis fínibus Iuda, et Béniamin, et in univérsis civitátibus murátis: præbuítque eis escas plúrimas, et multas petívit uxóres.'
