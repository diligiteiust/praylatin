bible: vulgate
lang: la
language: Latina
book: Esdrae
chapter: "8"
verses:
  "1": Hi sunt ergo príncipes familiárum, et genealógia eórum, qui ascendérunt mecum in regno Artaxérxis regis de Babylóne.
  "2": De fíliis Phínees, Gersom. De fíliis Ithamar, Dániel. De fíliis David, Hattus.
  "3": 'De fíliis Secheníæ, fíliis Pharos, Zacharías: et cum eo numeráti sunt viri centum quinquagínta.'
  "4": De fíliis Phahath Moab, Elioénai fílius Zaréhe, et cum eo ducénti viri.
  "5": De fíliis Secheníæ, fílius Ezéchiel, et cum eo trecénti viri.
  "6": De fíliis Adan, Abed fílius Iónathan, et cum eo quinquagínta viri.
  "7": De fíliis Alam, Isaías fílius Athalíæ, et cum eo septuagínta viri.
  "8": De fíliis Saphatíæ, Zebedía fílius Míchael, et cum eo octogínta viri.
  "9": De fíliis Ioab, Obedía fílius Iáhiel, et cum eo ducénti decem et octo viri.
  "10": De fíliis Sélomith, fílius Iosphíæ, et cum eo centum sexagínta viri.
  "11": De fíliis Bébai, Zacharías fílius Bébai, et cum eo vigínti octo viri.
  "12": De fíliis Azgad, Ióhanan fílius Eccetan, et cum eo centum et decem viri.
  "13": 'De fíliis Adónicam, qui erant novíssimi: et hæc nómina eórum: Elípheleth, et Iéhiel, et Samaías, et cum eis sexagínta viri.'
  "14": De fílii Bégui, Uthai et Zachur, et cum eis septuagínta viri.
  "15": 'Congregávi autem eos ad flúvium, qui decúrrit ad Ahava, et mánsimus ibi tribus diébus: quæsivíque in pópulo et in sacerdótibus de fíliis Levi, et non invéni ibi.'
  "16": 'Itaque misi Eliézer, et Ariel, et Semeíam, et Elnathan, et Iarib, et álterum Elnathan, et Nathan, et Zacharíam, et Mosóllam príncipes: et Ióiarib, et Elnathan sapiéntes.'
  "17": Et misi eos ad Eddo, qui est primus in Chasphíæ loco, et pósui in ore eórum verba, quæ loqueréntur ad Eddo, et fratres eius Nathinǽos in loco Chasphíæ, ut addúcerent nobis minístros domus Dei nostri.
  "18": Et adduxérunt nobis per manum Dei nostri bonam super nos, virum doctíssimum de fíliis Móholi fílii Levi fílii Israel, et Sarabíam et fílios eius et fratres eius decem et octo,
  "19": 'et Hasabíam, et cum eo Isaíam de fíliis Merári, fratrésque eius, et fílios eius vigínti:'
  "20": 'et de Nathinǽis, quos déderat David et príncipes ad ministéria Levitárum, Nathinǽos ducéntos vigínti: omnes hi suis nomínibus vocabántur.'
  "21": Et prædicávi ibi ieiúnium iuxta flúvium Ahava, ut affligerémur coram Dómino Deo nostro, et peterémus ab eo viam rectam nobis et fíliis nostris, universǽque substántiæ nostræ.
  "22": 'Erúbui enim pétere a rege auxílium et équites, qui defénderent nos ab inimíco in via: quia dixerámus regi: Manus Dei nostri est super omnes, qui quærunt eum in bonitáte: et impérium eius, et fortitúdo eius, et furor super omnes, qui derelínquunt eum.'
  "23": 'Ieiunávimus autem, et rogávimus Deum nostrum per hoc: et evénit nobis próspere.'
  "24": 'Et separávi de princípibus sacerdótum duódecim, Sarabíam, et Hasabíam, et cum eis de frátribus eórum decem:'
  "25": 'appendíque eis argéntum et aurum, et vasa consecráta domus Dei nostri, quæ obtúlerat rex et consiliatóres eius, et príncipes eius, universúsque Israel eórum qui invénti fúerant:'
  "26": 'et appéndi in mánibus eórum argénti talénta sexcénta quinquagínta, et vasa argéntea centum, auri centum talénta:'
  "27": et cratéres áureos vigínti, qui habébant sólidos millénos, et vasa æris fulgéntis óptimi duo, pulchra ut aurum.
  "28": 'Et dixi eis: Vos sancti Dómini, et vasa sancta, et argéntum et aurum, quod sponte oblátum est Dómino Deo patrum nostrórum:'
  "29": vigiláte et custodíte, donec appendátis coram princípibus sacerdótum, et Levitárum, et dúcibus familiárum Israel in Ierúsalem, in thesáurum domus Dómini.
  "30": Suscepérunt autem sacerdótes et Levítæ pondus argénti, et auri, et vasórum, ut deférrent Ierúsalem in domum Dei nostri.
  "31": 'Promóvimus ergo a flúmine Ahava duodécimo die mensis primi ut pergerémus Ierúsalem: et manus Dei nostri fuit super nos, et liberávit nos de manu inimíci et insidiatóris in via.'
  "32": Et vénimus Ierúsalem, et mánsimus ibi tribus diébus.
  "33": Die autem quarta appénsum est argéntum, et aurum, et vasa in domo Dei nostri per manum Méremoth fílii Uríæ sacerdótis, et cum eo Eleázar fílius Phínees, cumque eis Iózabed fílius Iósue, et Noadaía fílius Bénnoi Levítæ,
  "34": 'iuxta númerum et pondus ómnium: descriptúmque est omne pondus in témpore illo.'
  "35": 'Sed et qui vénerant de captivitáte fílii transmigratiónis, obtulérunt holocautómata Deo Israel, vítulos duódecim pro omni pópulo Israel, aríetes nonagínta sex, agnos septuagínta septem, hircos pro peccáto duódecim: ómnia in holocáustum Dómino.'
  "36": Dedérunt autem edícta regis sátrapis, qui erant de conspéctu regis, et dúcibus trans flumen, et elevavérunt pópulum et domum Dei.
