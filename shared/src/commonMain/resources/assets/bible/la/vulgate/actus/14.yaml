bible: vulgate
lang: la
language: Latina
book: Actus Apostolorum
chapter: "14"
verses:
  "1": Factum est autem Icónii, ut simul introírent in synagógam Iudæórum, et loqueréntur, ita ut créderet Iudæórum, et Græcórum copiósa multitúdo.
  "2": Qui vero incréduli fuérunt Iudǽi, suscitavérunt, et ad iracúndiam concitavérunt ánimas géntium advérsus fratres.
  "3": Multo ígitur témpore demoráti sunt, fiduciáliter agéntes in Dómino, testimónium perhibénte verbo grátiæ suæ, dante signa, et prodígia fíeri per manus eórum.
  "4": 'Divísa est autem multitúdo civitátis: et quidam quidem erant cum Iudǽis, quidam vero cum Apóstolis.'
  "5": Cum autem factus esset ímpetus gentílium, et Iudæórum cum princípibus suis, ut contuméliis affícerent, et lapidárent eos,
  "6": intelligéntes confugérunt ad civitátes Lycaóniæ Lystram, et Derben, et univérsam in circúitu regiónem, et ibi evangelizántes erant.
  "7": Et quidam vir Lystris infírmus pédibus sedébat, claudus ex útero matris suæ, qui numquam ambuláverat.
  "8": Hic audívit Paulum loquéntem. Qui intúitus eum, et videns quia fidem habéret ut salvus fíeret,
  "9": 'dixit magna voce: Surge super pedes tuos rectus. Et exsilívit, et ambulábat.'
  "10": 'Turbæ autem cum vidíssent quod fécerat Paulus, levavérunt vocem suam Lycaónice, dicéntes: Dii símiles facti homínibus descendérunt ad nos.'
  "11": 'Et vocábant Bárnabam Iovem, Paulum vero Mercúrium: quóniam ipse erat dux verbi.'
  "12": Sacérdos quoque Iovis, qui erat ante civitátem, tauros, et corónas ante iánuas áfferens, cum pópulis volébat sacrificáre.
  "13": Quod ubi audiérunt Apóstoli, Bárnabas et Paulus, conscíssis túnicis suis exsiliérunt in turbas, clamántes,
  "14": 'et dicéntes: Viri, quid hæc fácitis? et nos mortáles sumus, símiles vobis hómines, annuntiántes vobis ab his vanis convérti ad Deum vivum, qui fecit cælum, et terram, et mare, et ómnia quæ in eis sunt:'
  "15": qui in prætéritis generatiónibus dimísit omnes gentes íngredi vias suas.
  "16": Et quidem non sine testimónio semetípsum relíquit benefáciens de cælo, dans plúvias, et témpora fructífera, implens cibo, et lætítia corda nostra.
  "17": Et hæc dicéntes, vix sedavérunt turbas ne sibi immolárent.
  "18": 'Supervenérunt autem quidam ab Antiochía, et Icónio Iudǽi: et persuásis turbis, lapidantésque Paulum, traxérunt extra civitátem, existimántes eum mórtuum esse.'
  "19": Circumdántibus autem eum discípulis, surgens intrávit civitátem, et póstera die proféctus est cum Bárnaba in Derben.
  "20": Cumque evangelizássent civitáti illi, et docuíssent multos, revérsi sunt Lystram, et Icónium, et Antiochíam,
  "21": 'confirmántes ánimas discipulórum, exhortantésque ut permanérent in fide: et quóniam per multas tribulatiónes opórtet nos intráre in regnum Dei.'
  "22": Et cum constituíssent illis per síngulas ecclésias presbýteros, et orássent cum ieiunatiónibus, commendavérunt eos Dómino, in quem credidérunt.
  "23": Transeuntésque Pisídiam, venérunt in Pamphýliam,
  "24": 'et loquéntes verbum Dómini in Perge, descendérunt in Attáliam:'
  "25": et inde navigavérunt Antiochíam, unde erant tráditi grátiæ Dei in opus, quod complevérunt.
  "26": Cum autem veníssent, et congregássent Ecclésiam, retulérunt quanta fecísset Deus cum illis, et quia aperuísset géntibus óstium fídei.
  "27": Moráti sunt autem tempus non módicum cum discípulis.
