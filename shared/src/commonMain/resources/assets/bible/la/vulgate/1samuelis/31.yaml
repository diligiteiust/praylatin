bible: vulgate
lang: la
language: Latina
book: I Samuelis
chapter: "31"
verses:
  "1": 'Philísthiim autem pugnábant advérsum Israel: et fugérunt viri Israel ante fáciem Philísthiim, et cecidérunt interfécti in monte Gélboe.'
  "2": 'Irruerúntque Philísthiim in Saul, et in fílios eius, et percussérunt Iónathan, et Abínadab, et Melchísua fílios Saul:'
  "3": totúmque pondus prœ́lii versum est in Saul, et consecúti sunt eum viri sagittárii, et vulnerátus est veheménter a sagittáriis.
  "4": 'Dixítque Saul ad armígerum suum: Evagína gládium tuum, et pércute me: ne forte véniant incircumcísi isti, et interfíciant me, illudéntes mihi. Et nóluit ármiger eius: fúerat enim nímio terróre pertérritus. Arrípuit ítaque Saul gládium, et írruit super eum.'
  "5": Quod cum vidísset ármiger eius, vidélicet quod mórtuus esset Saul, írruit étiam ipse super gládium suum, et mórtuus est cum eo.
  "6": Mórtuus est ergo Saul, et tres fílii eius, et ármiger illíus, et univérsi viri eius in die illa páriter.
  "7": 'Vidéntes autem viri Israel, qui erant trans vallem, et trans Iordánem, quod fugíssent viri Israelítæ, et quod mórtuus esset Saul, et fílii eius, reliquérunt civitátes suas, et fugérunt: venerúntque Philísthiim, et habitavérunt ibi.'
  "8": Facta autem die áltera, venérunt Philísthiim ut spoliárent interféctos, et invenérunt Saul et tres fílios eius iacéntes in monte Gélboe.
  "9": 'Et præcidérunt caput Saul, et spoliavérunt eum armis: et misérunt in terram Philisthinórum per circúitum, ut annuntiarétur in templo idolórum, et in pópulis.'
  "10": Et posuérunt arma eius in templo Astaroth, corpus vero eius suspendérunt in muro Bethsan.
  "11": Quod cum audíssent habitatóres Iabes Gálaad, quæcúmque fécerant Philísthiim Saul,
  "12": 'surrexérunt omnes viri fortíssimi, et ambulavérunt tota nocte, et tulérunt cadáver Saul, et cadávera filiórum eius, de muro Bethsan: venerúntque Iabes Gálaad, et combussérunt ea ibi:'
  "13": et tulérunt ossa eórum, et sepeliérunt in némore Iabes, et ieiunavérunt septem diébus.
