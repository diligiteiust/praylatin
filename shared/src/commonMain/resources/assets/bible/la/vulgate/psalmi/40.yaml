bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "40"
verses:
  "1": In finem, Psalmus ipsi David.
  "2": 'Beátus qui intélligit super egénum et páuperem: in die mala liberábit eum Dóminus.'
  "3": 'Dóminus consérvet eum, et vivíficet eum, et beátum fáciat eum in terra: et non tradat eum in ánimam inimicórum eius.'
  "4": 'Dóminus opem ferat illi super lectum dolóris eius: univérsum stratum eius versásti in infirmitáte eius.'
  "5": 'Ego dixi: Dómine miserére mei: sana ánimam meam, quia peccávi tibi.'
  "6": 'Inimíci mei dixérunt mala mihi: Quando moriétur, et períbit nomen eius?'
  "7": Et si ingrediebátur ut vidéret, vana loquebátur, cor eius congregávit iniquitátem sibi. Egrediebátur foras, et loquebátur
  "8": 'in idípsum. Advérsum me susurrábant omnes inimíci mei: advérsum me cogitábant mala mihi.'
  "9": 'Verbum iníquum constituérunt advérsum me: Numquid qui dormit non adíciet ut resúrgat?'
  "10": 'Etenim homo pacis meæ in quo sperávi: qui edébat panes meos, magnificávit super me supplantatiónem.'
  "11": 'Tu autem Dómine miserére mei, et resúscita me: et retríbuam eis.'
  "12": 'In hoc cognóvi quóniam voluísti me: quóniam non gaudébit inimícus meus super me.'
  "13": 'Me autem propter innocéntiam suscepísti: et confirmásti me in conspéctu tuo in ætérnum.'
  "14": 'Benedíctus Dóminus Deus Israel a sǽculo, et usque in sǽculum: fiat, fiat.'
