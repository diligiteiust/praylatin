bible: vulgate
lang: la
language: Latina
book: Numeri
chapter: "24"
verses:
  "1": 'Cumque vidísset Bálaam quod placéret Dómino ut benedíceret Israéli, nequáquam ábiit ut ante perréxerat, ut augúrium quǽreret: sed dírigens contra desértum vultum suum,'
  "2": 'et élevans óculos, vidit Israel in tentóriis commorántem per tribus suas: et irruénte in se Spíritu Dei,'
  "3": 'assúmpta parábola, ait: Dixit Bálaam fílius Beor: dixit homo, cuius obturátus est óculus:'
  "4": 'dixit audítor sermónum Dei, qui visiónem Omnipoténtis intúitus est, qui cadit, et sic aperiúntur óculi eius:'
  "5": Quam pulchra tabernácula tua Iacob, et tentória tua Israel!
  "6": Ut valles nemorósæ, ut horti iuxta flúvios irrígui, ut tabernácula quæ fixit Dóminus, quasi cedri prope aquas.
  "7": Fluet aqua de sítula eius, et semen illíus erit in aquas multas. Tollétur propter Agag, rex eius, et auferétur regnum illíus.
  "8": Deus edúxit illum de Ægýpto, cuius fortitúdo símilis est rhinocerótis. Devorábunt gentes hostes illíus, ossáque eórum confríngent, et perforábunt sagíttis.
  "9": 'Accubans dormívit ut leo, et quasi leǽna, quam suscitáre nullus audébit. Qui benedíxerit tibi, erit et ipse benedíctus: qui maledíxerit, in maledictióne reputábitur.'
  "10": 'Iratúsque Balac contra Bálaam, complósis mánibus ait: Ad maledicéndum inimícis meis vocávi te, quibus e contrário tértio benedixísti:'
  "11": revértere ad locum tuum. Decréveram quidem magnífice honoráre te, sed Dóminus privávit te honóre dispósito.
  "12": 'Respóndit Bálaam ad Balac: Nonne núntiis tuis, quos misísti ad me, dixi:'
  "13": 'Si déderit mihi Balac plenam domum suam argénti et auri, non pótero præteríre sermónem Dómini Dei mei, ut vel boni quid vel mali próferam ex corde meo: sed quidquid Dóminus díxerit, hoc loquar?'
  "14": Verúmtamen pergens ad pópulum meum, dabo consílium, quid pópulus tuus pópulo huic fáciat extrémo témpore.
  "15": 'Sumpta ígitur parábola, rursum ait: Dixit Bálaam fílius Beor: dixit homo, cuius obturátus est óculus:'
  "16": dixit audítor sermónum Dei, qui novit doctrínam Altíssimi, et visiónes Omnipoténtis videt, qui cadens apértos habet óculos.
  "17": 'Vidébo eum, sed non modo: intuébor illum, sed non prope. Oriétur stella ex Iacob, et consúrget virga de Israel: et percútiet duces Moab, vastabítque omnes fílios Seth.'
  "18": 'Et erit Idumǽa posséssio eius: heréditas Seir cedet inimícis suis: Israel vero fórtiter aget.'
  "19": De Iacob erit qui dominétur, et perdat relíquias civitátis.
  "20": 'Cumque vidísset Amalec, assúmens parábolam, ait: Princípium géntium Amalec, cuius extréma perdéntur.'
  "21": 'Vidit quoque Cinǽum: et assúmpta parábola, ait: Robústum quidem est habitáculum tuum: sed si in petra posúeris nidum tuum,'
  "22": et fúeris eléctus de stirpe Cin, quámdiu póteris permanére? Assur enim cápiet te.
  "23": 'Assumptáque parábola íterum locútus est: Heu, quis victúrus est, quando ista fáciet Deus?'
  "24": 'Vénient in triéribus de Itália: superábunt Assýrios, vastabúntque Hebrǽos, et ad extrémum étiam ipsi períbunt.'
  "25": 'Surrexítque Bálaam, et revérsus est in locum suum: Balac quoque via, qua vénerat, rédiit.'
