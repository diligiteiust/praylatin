bible: vulgate
lang: la
language: Latina
book: Genesis
chapter: "25"
verses:
  "1": 'Abraham vero áliam duxit uxórem nómine Cetúram:'
  "2": quæ péperit ei Zamran et Iecsan, et Madan, et Mádian, et Iesboc, et Sue.
  "3": Iecsan quoque génuit Saba, et Dadan. Fílii Dadan fuérunt Assurim, et Latúsim, et Lóomim.
  "4": 'At vero ex Mádian ortus est Epha, et Opher, et Henoch, et Abída, et Eldaa: omnes hi fílii Cetúræ.'
  "5": 'Dedítque Abraham cuncta quæ posséderat, Isaac:'
  "6": fíliis autem concubinárum largítus est múnera, et separávit eos ab Isaac fílio suo, dum adhuc ipse víveret, ad plagam orientálem.
  "7": Fuérunt autem dies vitæ Abrahæ, centum septuagínta quinque anni.
  "8": 'Et defíciens mórtuus est in senectúte bona, provectǽque ætátis, et plenus diérum: congregatúsque est ad pópulum suum.'
  "9": Et sepeliérunt eum Isaac et Ismael fílii sui in spelúnca dúplici, quæ sita est in agro Ephron fílii Seor Hethǽi, e regióne Mambre,
  "10": 'quem émerat a fíliis Heth: ibi sepúltus est ipse, et Sara uxor eius.'
  "11": Et post óbitum illíus benedíxit Deus Isaac fílio eius, qui habitábat iuxta púteum nómine Vivéntis et Vidéntis.
  "12": 'Hæ sunt generatiónes Ismael fílii Abrahæ, quem péperit ei Agar Ægýptia, fámula Saræ:'
  "13": et hæc nómina filiórum eius in vocábulis et generatiónibus suis. Primogénitus Ismaélis Nábaioth, deínde Cedar, et Adbeel, et Mabsam,
  "14": Masma quoque, et Duma, et Massa,
  "15": Hadar, et Thema, et Iethur, et Naphis, et Cedma.
  "16": 'Isti sunt fílii Ismaélis: et hæc nómina per castélla et óppida eórum, duódecim príncipes tríbuum suárum.'
  "17": Et facti sunt anni vitæ Ismaélis centum trigínta septem, deficiénsque mórtuus est, et appósitus ad pópulum suum.
  "18": 'Habitávit autem ab Hevíla usque Sur, quæ réspicit Ægýptum introeúntibus Assýrios: coram cunctis frátribus suis óbiit.'
  "19": 'Hæ quoque sunt generatiónes Isaac fílii Abraham: Abraham génuit Isaac:'
  "20": qui cum quadragínta esset annórum, duxit uxórem Rebéccam fíliam Bathuélis Syri de Mesopotámia, sorórem Laban.
  "21": 'Deprecatúsque est Isaac Dóminum pro uxóre sua, eo quod esset stérilis: qui exaudívit eum, et dedit concéptum Rebéccæ.'
  "22": 'Sed collidebántur in útero eius párvuli: quæ ait: Si sic mihi futúrum erat, quid necésse fuit concípere? perrexítque ut consúleret Dóminum.'
  "23": 'Qui respóndens ait: Duæ gentes sunt in útero tuo, et duo pópuli ex ventre tuo dividéntur, populúsque pópulum superábit, et maior sérviet minóri.'
  "24": Iam tempus pariéndi advénerat, et ecce gémini in útero eius repérti sunt.
  "25": 'Qui prior egréssus est, rufus erat, et totus in morem pellis híspidus: vocatúmque est nomen eius Esau. Prótinus alter egrédiens, plantam fratris tenébat manu: et idcírco appellávit eum Iacob.'
  "26": Sexagenárius erat Isaac quando nati sunt ei párvuli.
  "27": 'Quibus adúltis, factus est Esau vir gnarus venándi, et homo agrícola: Iacob autem vir simplex habitábat in tabernáculis.'
  "28": 'Isaac amábat Esau, eo quod de venatiónibus illíus vescerétur: et Rebécca diligébat Iacob.'
  "29": 'Coxit autem Iacob pulméntum: ad quem cum venísset Esau de agro lassus,'
  "30": 'ait: Da mihi de coctióne hac rufa, quia óppido lassus sum. Quam ob causam vocátum est nomen eius Edom.'
  "31": 'Cui dixit Iacob: Vende mihi primogénita tua.'
  "32": 'Ille respóndit: En mórior, quid mihi próderunt primogénita?'
  "33": 'Ait Iacob: Iura ergo mihi. Iurávit ei Esau, et véndidit primogénita.'
  "34": 'Et sic accépto pane et lentis edúlio, comédit et bibit, et ábiit: parvipéndens quod primogénita vendidísset.'
