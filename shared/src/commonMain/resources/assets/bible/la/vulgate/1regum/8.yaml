bible: vulgate
lang: la
language: Latina
book: I Regum
chapter: "8"
verses:
  "1": Tunc congregáti sunt omnes maióres natu Israel cum princípibus tríbuum, et duces familiárum filiórum Israel, ad regem Salomónem in Ierúsalem, ut deférrent arcam fœ́deris Dómini de civitáte David, id est, de Sion.
  "2": 'Convenítque ad regem Salomónem univérsus Israel in mense Ethánim, in solémni die: ipse est mensis séptimus.'
  "3": Venerúntque cuncti senes de Israel, et tulérunt arcam sacerdótes,
  "4": 'et portavérunt arcam Dómini, et tabernáculum fœ́deris, et ómnia vasa sanctuárii, quæ erant in tabernáculo: et ferébant ea sacerdótes et Levítæ.'
  "5": Rex autem Sálomon, et omnis multitúdo Israel, quæ convénerat ad eum, gradiebátur cum illo ante arcam, et immolábant oves et boves absque æstimatióne et número.
  "6": Et intulérunt sacerdótes arcam fœ́deris Dómini in locum suum, in oráculum templi, in Sanctum sanctórum, subter alas chérubim.
  "7": Síquidem chérubim expandébant alas super locum arcæ, et protegébant arcam, et vectes eius désuper.
  "8": Cumque eminérent vectes, et apparérent summitátes eórum foris sanctuárium ante oráculum, non apparébant ultra extrínsecus, qui et fuérunt ibi usque in præséntem diem.
  "9": In arca autem non erat áliud nisi duæ tábulæ lapídeæ, quas posúerat in ea Móyses in Horeb, quando pépigit Dóminus fœdus cum fíliis Israel, cum egrederéntur de terra Ægýpti.
  "10": Factum est autem cum exíssent sacerdótes de sanctuário, nébula implévit domum Dómini,
  "11": 'et non póterant sacerdótes stare et ministráre propter nébulam: impléverat enim glória Dómini domum Dómini.'
  "12": 'Tunc ait Sálomon: Dóminus dixit ut habitáret in nébula.'
  "13": 'Ædíficans ædificávi domum in habitáculum tuum: firmíssimum sólium tuum in sempitérnum.'
  "14": 'Convertítque rex fáciem suam, et benedíxit omni ecclésiæ Israel: ómnis enim ecclésia Israel stabat.'
  "15": 'Et ait Sálomon: Benedíctus Dóminus Deus Israel, qui locútus est ore suo ad David patrem meum, et in mánibus eius perfécit, dicens:'
  "16": 'A die, qua edúxi pópulum meum Israel de Ægýpto, non elégi civitátem de univérsis tríbubus Israel, ut ædificarétur domus, et esset nomen meum ibi: sed elégi David ut esset super pópulum meum Israel.'
  "17": 'Voluítque David pater meus ædificáre domum nómini Dómini Dei Israel:'
  "18": 'et ait Dóminus ad David patrem meum: Quod cogitásti in corde tuo ædificáre domum nómini meo, bene fecísti, hoc ipsum mente tractans.'
  "19": Verúmtamen tu non ædificábis mihi domum, sed fílius tuus, qui egrediétur de rénibus tuis, ipse ædificábit domum nómini meo.
  "20": 'Confirmávit Dóminus sermónem suum, quem locútus est: stetíque pro David patre meo, et sedi super thronum Israel, sicut locútus est Dóminus: et ædificávi domum nómini Dómini Dei Israel.'
  "21": Et constítui ibi locum arcæ, in qua fœdus Dómini est, quod percússit cum pátribus nostris quando egréssi sunt de terra Ægýpti.
  "22": Stetit autem Sálomon ante altáre Dómini in conspéctu ecclésiæ Israel, et expándit manus suas in cælum,
  "23": 'et ait: Dómine Deus Israel, non est símilis tui Deus in cælo désuper, et super terram deórsum: qui custódis pactum et misericórdiam servis tuis, qui ámbulant coram te in toto corde suo.'
  "24": 'Qui custodísti servo tuo David patri meo quæ locútus es ei: ore locútus es, et mánibus perfecísti, ut hæc dies probat.'
  "25": 'Nunc ígitur Dómine Deus Israel, consérva fámulo tuo David patri meo quæ locútus es ei, dicens: Non auferétur de te vir coram me, qui sédeat super thronum Israel: ita tamen si custodíerint fílii tui viam suam, ut ámbulent coram me sicut tu ambulásti in conspéctu meo.'
  "26": Et nunc Dómine Deus Israel firméntur verba tua, quæ locútus es servo tuo David patri meo.
  "27": Ergóne putándum est quod vere Deus hábitet super terram? si enim cælum, et cæli cælórum te cápere non possunt, quanto magis domus hæc, quam ædificávi?
  "28": 'Sed réspice ad oratiónem servi tui, et ad preces eius Dómine Deus meus: audi hymnum et oratiónem, quam servus tuus orat coram te hódie:'
  "29": 'ut sint óculi tui apérti super domum hanc nocte ac die: super domum, de qua dixísti: Erit nomen meum ibi: ut exáudias oratiónem, quam orat in loco isto ad te servus tuus:'
  "30": ut exáudias deprecatiónem servi tui et pópuli tui Israel, quodcúmque oráverint in loco isto, et exáudies in loco habitáculi tui in cælo, et cum exaudíeris, propítius eris.
  "31": Si peccáverit homo in próximum suum, et habúerit áliquod iuraméntum, quo teneátur astríctus, et vénerit propter iuraméntum coram altári tuo in domum tuam,
  "32": 'tu exáudies in cælo: et fácies, et iudicábis servos tuos, condémnans ímpium, et reddens viam suam super caput eius, iustificánsque iustum, et retríbuens ei secúndum iustítiam suam.'
  "33": 'Si fúgerit pópulus tuus Israel inimícos suos (quia peccatúrus est tibi), et agéntes pœniténtiam, et confiténtes nómini tuo, vénerint, et oráverint, et deprecáti te fúerint in domo hac:'
  "34": exáudi in cælo, et dimítte peccátum pópuli tui Israel, et redúces eos in terram, quam dedísti pátribus eórum.
  "35": 'Si clausum fúerit cælum, et non plúerit propter peccáta eórum, et orántes in loco isto, pœniténtiam égerint nómini tuo, et a peccátis suis convérsi fúerint propter afflictiónem suam:'
  "36": 'exáudi eos in cælo, et dimítte peccáta servórum tuórum, et pópuli tui Israel: et osténde eis viam bonam per quam ámbulent, et da plúviam super terram tuam, quam dedísti pópulo tuo in possessiónem.'
  "37": Fames si obórta fúerit in terra, aut pestiléntia, aut corrúptus aer, aut ærúgo, aut locústa, vel rubígo, et afflíxerit eum inimícus eius portas óbsidens, omnis plaga, univérsa infírmitas,
  "38": 'cuncta devotátio, et imprecátio, quæ accíderit omni hómini de pópulo tuo Israel: si quis cognóverit plagam cordis sui, et expánderit manus suas in domo hac,'
  "39": tu exáudies in cælo in loco habitatiónis tuæ, et repropitiáberis, et fácies ut des unicuíque secúndum omnes vias suas, sicut víderis cor eius (quia tu nosti solus cor ómnium filiórum hóminum),
  "40": ut tímeant te cunctis diébus, quibus vivunt super fáciem terræ, quam dedísti pátribus nostris.
  "41": Insuper et alienígena, qui non est de pópulo tuo Israel, cum vénerit de terra longínqua propter nomen tuum (audiétur enim nomen tuum magnum, et manus tua fortis, et bráchium tuum
  "42": exténtum ubíque), cum vénerit ergo, et oráverit in hoc loco,
  "43": 'tu exáudies in cælo, in firmaménto habitáculi tui, et fácies ómnia, pro quibus invocáverit te alienígena: ut discant univérsi pópuli terrárum nomen tuum timére, sicut pópulus tuus Israel, et probent quia nomen tuum invocátum est super domum hanc, quam ædificávi.'
  "44": Si egréssus fúerit pópulus tuus ad bellum contra inimícos suos, per viam, quocúmque míseris eos, orábunt te contra viam civitátis, quam elegísti, et contra domum, quam ædificávi nómini tuo,
  "45": et exáudies in cælo oratiónes eórum, et preces eórum, et fácies iudícium eórum.
  "46": Quod si peccáverint tibi (non est enim homo qui non peccet) et irátus tradíderis eos inimícis suis, et captívi ducti fúerint in terram inimicórum longe vel prope,
  "47": 'et égerint pœniténtiam in corde suo in loco captivitátis, et convérsi deprecáti te fúerint in captivitáte sua, dicéntes: Peccávimus: iníque égimus, ímpie géssimus:'
  "48": 'et revérsi fúerint ad te in univérso corde suo, et tota ánima sua in terra inimicórum suórum, ad quam captívi ducti fúerint: et oráverint te contra viam terræ suæ, quam dedísti pátribus eórum, et civitátis quam elegísti, et templi quod ædificávi nómini tuo:'
  "49": 'exáudies in cælo, in firmaménto sólii tui, oratiónes eórum et preces eórum, et fácies iudícium eórum:'
  "50": 'et propitiáberis pópulo tuo qui peccávit tibi, et ómnibus iniquitátibus eórum, quibus prævaricáti sunt in te: et dabis misericórdiam coram eis, qui eos captívos habúerint, ut misereántur eis.'
  "51": Pópulus enim tuus est, et heréditas tua, quos eduxísti de terra Ægýpti, de médio fornácis férreæ.
  "52": Ut sint óculi tui apérti ad deprecatiónem servi tui, et pópuli tui Israel, et exáudias eos in univérsis pro quibus invocáverint te.
  "53": Tu enim separásti eos tibi in hereditátem de univérsis pópulis terræ, sicut locútus es per Móysen servum tuum quando eduxísti patres nostros de Ægýpto Dómine Deus.
  "54": 'Factum est autem, cum complésset Sálomon orans Dóminum omnem oratiónem, et deprecatiónem hanc, surréxit de conspéctu altáris Dómini: utrúmque enim genu in terram fíxerat, et manus expánderat in cælum.'
  "55": 'Stetit ergo, et benedíxit omni ecclésiæ Israel voce magna, dicens:'
  "56": 'Benedíctus Dóminus, qui dedit réquiem pópulo suo Israel, iuxta ómnia quæ locútus est: non cécidit ne unus quidem sermo ex ómnibus bonis, quæ locútus est per Móysen servum suum.'
  "57": Sit Dóminus Deus noster nobíscum, sicut fuit cum pátribus nostris, non derelínquens nos, neque proíciens.
  "58": Sed inclínet corda nostra ad se, ut ambulémus in univérsis viis eius, et custodiámus mandáta eius, et cæremónias eius, et iudícia quæcúmque mandávit pátribus nostris.
  "59": 'Et sint sermónes mei isti, quibus deprecátus sum coram Dómino, appropinquántes Dómino Deo nostro die ac nocte, ut fáciat iudícium servo suo, et pópulo suo Israel per síngulos dies:'
  "60": ut sciant omnes pópuli terræ quia Dóminus ipse est Deus, et non est ultra absque eo.
  "61": Sit quoque cor nostrum perféctum cum Dómino Deo nostro, ut ambulémus in decrétis eius, et custodiámus mandáta eius, sicut et hódie.
  "62": Igitur rex, et omnis Israel cum eo, immolábant víctimas coram Dómino.
  "63": 'Mactavítque Sálomon hóstias pacíficas, quas immolávit Dómino, boum vigínti duo míllia, et óvium centum vigínti míllia: et dedicavérunt templum Dómini rex, et fílii Israel.'
  "64": 'In die illa sanctificávit rex médium átrii, quod erat ante domum Dómini: fecit quippe holocáustum ibi, et sacrifícium, et ádipem pacificórum: quóniam altáre ǽreum, quod erat coram Dómino, minus erat, et cápere non póterat holocáustum, et sacrifícium, et ádipem pacificórum.'
  "65": Fecit ergo Sálomon in témpore illo festivitátem célebrem, et omnis Israel cum eo, multitúdo magna ab intróitu Emath usque ad rivum Ægýpti, coram Dómino Deo nostro, septem diébus et septem diébus, id est, quatuórdecim diébus.
  "66": 'Et in die octáva dimísit pópulos: qui benedicéntes regi, profécti sunt in tabernácula sua lætántes, et álacri corde super ómnibus bonis, quæ fécerat Dóminus David servo suo, et Israel pópulo suo.'
