bible: vulgate
lang: la
language: Latina
book: Sapientia
chapter: "9"
verses:
  "1": Deus patrum meórum, et Dómine misericórdiæ, qui fecísti ómnia verbo tuo,
  "2": et sapiéntia tua constituísti hóminem, ut dominarétur creatúræ, quæ a te facta est,
  "3": 'ut dispónat orbem terrárum in æquitáte et iustítia, et in directióne cordis iudícium iúdicet:'
  "4": 'da mihi sédium tuárum assistrícem sapiéntiam, et noli me reprobáre a púeris tuis:'
  "5": 'quóniam servus tuus sum ego, et fílius ancíllæ tuæ: homo infírmus, et exígui témporis, et minor ad intelléctum iudícii et legum.'
  "6": Nam etsi quis erit consummátus inter fílios hóminum, si ab illo abfúerit sapiéntia tua, in níhilum computábitur.
  "7": 'Tu elegísti me regem pópulo tuo, et iúdicem filiórum tuórum et filiárum:'
  "8": 'et dixísti me ædificáre templum in monte sancto tuo, et in civitáte habitatiónis tuæ altáre: similitúdinem tabernáculi sancti tui, quod præparásti ab inítio.'
  "9": Et tecum sapiéntia tua, quæ novit ópera tua, quæ et áffuit tunc cum orbem terrárum fáceres, et sciébat quid esset plácitum óculis tuis, et quid diréctum in præcéptis tuis.
  "10": 'Mitte illam de cælis sanctis tuis, et a sede magnitúdinis tuæ, ut mecum sit et mecum labóret, ut sciam quid accéptum sit apud te:'
  "11": scit enim illa ómnia, et intélligit, et dedúcet me in opéribus meis sóbrie, et custódiet me in sua poténtia.
  "12": Et erunt accépta ópera mea, et dispónam pópulum tuum iuste, et ero dignus sédium patris mei.
  "13": Quis enim hóminum póterit scire consílium Dei? aut quis póterit cogitáre quid velit Deus?
  "14": Cogitatiónes enim mortálium tímidæ, et incértæ providéntiæ nostræ.
  "15": Corpus enim, quod corrúmpitur, ággravat ánimam, et terréna inhabitátio déprimit sensum multa cogitántem.
  "16": 'Et diffícile æstimámus quæ in terra sunt: et quæ in prospéctu sunt, invenímus cum labóre: quæ autem in cælis sunt, quis investigábit?'
  "17": 'Sensum autem tuum quis sciet, nisi tu déderis sapiéntiam, et míseris Spíritum sanctum tuum de altíssimis:'
  "18": et sic corréctæ sint sémitæ eórum, qui sunt in terris, et quæ tibi placent didícerint hómines?
  "19": Nam per sapiéntiam sanáti sunt quicúmque placuérunt tibi Dómine a princípio.
