bible: vulgate
lang: la
language: Latina
book: I Samuelis
chapter: "19"
verses:
  "1": 'Locútus est autem Saul ad Iónathan fílium suum, et ad omnes servos suos, ut occíderent David. Porro Iónathas fílius Saul diligébat David valde:'
  "2": 'et indicávit Iónathas David, dicens: Quærit Saul pater meus occídere te: quaprópter obsérva te, quæso, mane: et manébis clam, et abscondéris.'
  "3": 'Ego autem egrédiens stabo iuxta patrem meum in agro, ubicúmque fúeris: et ego loquar de te ad patrem meum, et quodcúmque vídero, nuntiábo tibi.'
  "4": 'Locútus est ergo Iónathas de David bona ad Saul patrem suum: dixítque ad eum: Ne pecces rex in servum tuum David, quia non peccávit tibi, et ópera eius bona sunt tibi valde.'
  "5": 'Et pósuit ánimam suam in manu sua, et percússit Philisthǽum, et fecit Dóminus salútem magnam univérso Israéli: vidísti, et lætátus es. Quare ergo peccas in sánguine innóxio, interfíciens David, qui est absque culpa?'
  "6": 'Quod cum audísset Saul, placátus voce Iónathæ, iurávit: Vivit Dóminus, quia non occidétur.'
  "7": 'Vocávit ítaque Iónathas David, et indicávit ei ómnia verba hæc: et introdúxit Iónathas David ad Saul, et fuit ante eum sicut fúerat heri et nudiustértius.'
  "8": 'Motum est autem rursum bellum: et egréssus David, pugnávit advérsum Philísthiim: percussítque eos plaga magna, et fugérunt a fácie eius.'
  "9": 'Et factus est spíritus Dómini malus in Saul: sedébat autem in domo sua, et tenébat lánceam: porro David psallébat manu sua.'
  "10": 'Nisúsque est Saul confígere David láncea in paríete, et declinávit David a fácie Saul: láncea autem casso vúlnere perláta est in paríetem, et David fugit, et salvátus est nocte illa.'
  "11": 'Misit ergo Saul satéllites suos in domum David, ut custodírent eum, et interficerétur mane. Quod cum annuntiásset David Michol uxor sua, dicens: Nisi salváveris te nocte hac, cras moriéris:'
  "12": 'depósuit eum per fenéstram: porro ille ábiit et aufúgit, atque salvátus est.'
  "13": Tulit autem Michol státuam, et pósuit eam super lectum, et pellem pilósam caprárum pósuit ad caput eius, et opéruit eam vestiméntis.
  "14": 'Misit autem Saul apparitóres, qui ráperent David: et respónsum est quod ægrotáret.'
  "15": 'Rursúmque misit Saul núntios ut vidérent David, dicens: Afférte eum ad me in lecto, ut occidátur.'
  "16": Cumque veníssent núntii, invéntum est simulácrum super lectum, et pellis caprárum ad caput eius.
  "17": 'Dixítque Saul ad Michol: Quare sic illusísti mihi, et dimisísti inimícum meum ut fúgeret? Et respóndit Michol ad Saul: Quia ipse locútus est mihi: Dimítte me, alióquin interfíciam te.'
  "18": 'David autem fúgiens salvátus est, et venit ad Sámuel in Rámatha, et nuntiávit ei ómnia quæ fécerat sibi Saul: et abiérunt ipse et Sámuel, et moráti sunt in Naioth.'
  "19": 'Nuntiátum est autem Sauli a dicéntibus: Ecce David in Naioth in Rámatha.'
  "20": 'Misit ergo Saul lictóres, ut ráperent David: qui cum vidíssent cúneum prophetárum vaticinántium, et Samuélem stantem super eos, factus est étiam Spíritus Dómini in illis, et prophetáre cœpérunt étiam ipsi.'
  "21": 'Quod cum nuntiátum esset Sauli, misit et álios núntios: prophetavérunt autem et illi. Et rursum misit Saul tértios núntios: qui et ipsi prophetavérunt. Et irátus iracúndia Saul,'
  "22": 'ábiit étiam ipse in Rámatha, et venit usque ad cistérnam magnam, quæ est in Socho, et interrogávit, et dixit: In quo loco sunt Sámuel et David? Dictúmque est ei: Ecce in Naioth sunt in Rámatha.'
  "23": Et ábiit in Naioth in Rámatha, et factus est étiam super eum Spíritus Dómini, et ambulábat ingrédiens, et prophetábat usque dum veníret in Naioth in Rámatha.
  "24": 'Et exspoliávit étiam ipse se vestiméntis suis, et prophetávit cum céteris coram Samuéle, et cécidit nudus tota die illa et nocte. Unde et exívit provérbium: Num et Saul inter prophétas?'
