bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "33"
verses:
  "1": Davídi, cum immutávit vultum suum coram Achímelech, et dimísit eum, et ábiit.
  "2": 'Benedícam Dóminum in omni témpore: semper laus eius in ore meo.'
  "3": 'In Dómino laudábitur ánima mea: áudiant mansuéti, et læténtur.'
  "4": 'Magnificáte Dóminum mecum: et exaltémus nomen eius in idípsum.'
  "5": 'Exquisívi Dóminum, et exaudívit me: et ex ómnibus tribulatiónibus meis erípuit me.'
  "6": 'Accédite ad eum, et illuminámini: et fácies vestræ non confundéntur.'
  "7": 'Iste pauper clamávit, et Dóminus exaudívit eum: et de ómnibus tribulatiónibus eius salvávit eum.'
  "8": 'Immíttet ángelus Dómini in circúitu timéntium eum: et erípiet eos.'
  "9": 'Gustáte, et vidéte quóniam suávis est Dóminus: beátus vir, qui sperat in eo.'
  "10": 'Timéte Dóminum omnes sancti eius: quóniam non est inópia timéntibus eum.'
  "11": 'Dívites eguérunt et esuriérunt: inquiréntes autem Dóminum non minuéntur omni bono.'
  "12": 'Veníte fílii, audíte me: timórem Dómini docébo vos.'
  "13": 'Quis est homo qui vult vitam: díligit dies vidére bonos?'
  "14": 'Próhibe linguam tuam a malo: et lábia tua ne loquántur dolum.'
  "15": 'Divérte a malo, et fac bonum: inquíre pacem, et perséquere eam.'
  "16": 'Oculi Dómini super iustos: et aures eius in preces eórum.'
  "17": 'Vultus autem Dómini super faciéntes mala: ut perdat de terra memóriam eórum.'
  "18": 'Clamavérunt iusti, et Dóminus exaudívit eos: et ex ómnibus tribulatiónibus eórum liberávit eos.'
  "19": 'Iuxta est Dóminus iis, qui tribuláto sunt corde: et húmiles spíritu salvábit.'
  "20": 'Multæ tribulatiónes iustórum: et de ómnibus his liberábit eos Dóminus.'
  "21": 'Custódit Dóminus ómnia ossa eórum: unum ex his non conterétur.'
  "22": 'Mors peccatórum péssima: et qui odérunt iustum delínquent.'
  "23": 'Rédimet Dóminus ánimas servórum suórum: et non delínquent omnes qui sperant in eo.'
