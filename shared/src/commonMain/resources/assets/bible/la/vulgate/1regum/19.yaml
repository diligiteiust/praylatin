bible: vulgate
lang: la
language: Latina
book: I Regum
chapter: "19"
verses:
  "1": Nuntiávit autem Achab Iézabel ómnia quæ fécerat Elías, et quómodo occidísset univérsos prophétas gládio.
  "2": 'Misítque Iézabel núntium ad Elíam, dicens: Hæc mihi fáciant dii, et hæc addant, nisi hac hora cras posúero ánimam tuam sicut ánimam uníus ex illis.'
  "3": 'Tímuit ergo Elías, et surgens ábiit quocúmque eum ferébat volúntas: venítque in Bersabée Iuda, et dimísit ibi púerum suum,'
  "4": 'et perréxit in desértum, viam uníus diéi. Cumque venísset, et sedéret subter unam iuníperum, petívit ánimæ suæ ut morerétur, et ait: Súfficit mihi Dómine, tolle ánimam meam: neque enim mélior sum, quam patres mei.'
  "5": 'Proiecítque se, et obdormívit in umbra iuníperi: et ecce ángelus Dómini tétigit eum, et dixit illi: Surge, et cómede.'
  "6": 'Respéxit, et ecce ad caput suum subcinerícius panis, et vas aquæ: comédit ergo, et bibit, et rursum obdormívit.'
  "7": 'Reversúsque est ángelus Dómini secúndo, et tétigit eum, dixítque illi: Surge, cómede: grandis enim tibi restat via.'
  "8": Qui cum surrexísset, comédit et bibit, et ambulávit in fortitúdine cibi illíus quadragínta diébus, et quadragínta nóctibus, usque ad montem Dei Horeb.
  "9": 'Cumque venísset illuc, mansit in spelúnca: et ecce sermo Dómini ad eum, dixítque illi: Quid hic agis Elía?'
  "10": 'At ille respóndit: Zelo zelátus sum pro Dómino Deo exercítuum, quia dereliquérunt pactum tuum fílii Israel: altária tua destruxérunt, prophétas tuos occidérunt gládio, derelíctus sum ego solus, et quærunt ánimam meam ut áuferant eam.'
  "11": 'Et ait ei: Egrédere, et sta in monte coram Dómino: et ecce Dóminus transit, et spíritus grandis et fortis subvértens montes, et cónterens petras ante Dóminum: non in spíritu Dóminus. Et post spíritum commótio: non in commotióne Dóminus.'
  "12": 'Et post commotiónem ignis: non in igne Dóminus. Et post ignem síbilus auræ ténuis.'
  "13": 'Quod cum audísset Elías, opéruit vultum suum pállio, et egréssus stetit in óstio spelúncæ. Et ecce vox ad eum, dicens: Quid hic agis Elía? Et ille respóndit:'
  "14": 'Zelo zelátus sum pro Dómino Deo exercítuum, quia dereliquérunt pactum tuum fílii Israel: altária tua destruxérunt, prophétas tuos occidérunt gládio, derelíctus sum ego solus, et quærunt ánimam meam ut áuferant eam.'
  "15": 'Et ait Dóminus ad eum: Vade, et revértere in viam tuam per desértum in Damáscum: cumque pervéneris illuc, unges Házael regem super Sýriam,'
  "16": 'et Iehu fílium Namsi unges regem super Israel: Eliséum autem fílium Saphat, qui est de Abelméhula, unges prophétam pro te.'
  "17": 'Et erit: quicúmque fúgerit gládium Házael, occídet eum Iehu: et quicúmque fúgerit gládium Iehu, interfíciet eum Eliséus.'
  "18": Et derelínquam mihi in Israel septem míllia virórum, quorum génua non sunt incurváta ante Baal, et omne os quod non adorávit eum ósculans manus.
  "19": 'Proféctus ergo inde Elías, réperit Eliséum fílium Saphat, arántem in duódecim iugis boum. Et ipse in duódecim iugis boum arántibus unus erat: cumque venísset Elías ad eum, misit pállium suum super illum.'
  "20": 'Qui statim relíctis bobus cucúrrit post Elíam, et ait: Osculer, oro, patrem meum, et matrem meam, et sic sequar te. Dixítque ei: Vade, et revértere: quod enim meum erat, feci tibi.'
  "21": 'Revérsus autem ab eo, tulit par boum, et mactávit illud, et in arátro boum coxit carnes, et dedit pópulo, et comedérunt: consurgénsque ábiit, et secútus est Elíam, et ministrábat ei.'
