bible: vulgate
lang: la
language: Latina
book: Lucas
chapter: "14"
verses:
  "1": Et factum est cum intráret Iesus in domum cuiúsdam príncipis Pharisæórum sábbato manducáre panem, et ipsi observábant eum.
  "2": Et ecce homo quidam hydrópicus erat ante illum.
  "3": 'Et respóndens Iesus dixit ad legisperítos et Pharisǽos, dicens: Si licet sábbato curáre?'
  "4": At illi tacuérunt. Ipse vero apprehénsum sanávit eum, ac dimísit.
  "5": 'Et respóndens ad illos dixit: Cuius vestrum ásinus, aut bos in púteum cadet, et non contínuo éxtrahet illum die sábbati?'
  "6": Et non póterant ad hæc respondére illi.
  "7": 'Dicébat autem et ad invitátos parábolam, inténdens quómodo primos accúbitus elígerent, dicens ad illos:'
  "8": Cum invitátus fúeris ad núptias, non discúmbas in primo loco, ne forte honorátior te sit invitátus ab illo.
  "9": 'Et véniens is, qui te et illum vocávit, dicat tibi: Da huic locum: et tunc incípias cum rubóre novíssimum locum tenére.'
  "10": 'Sed cum vocátus fúeris, vade, recúmbe in novíssimo loco: ut, cum vénerit qui te invitávit, dicat tibi: Amíce, ascénde supérius. Tunc erit tibi glória coram simul discumbéntibus:'
  "11": 'quia omnis, qui se exáltat, humiliábitur: et qui se humíliat, exaltábitur.'
  "12": 'Dicébat autem et ei, qui se invitáverat: Cum facis prándium, aut cœnam, noli vocáre amícos tuos, neque fratres tuos, neque cognátos, neque vicínos dívites: ne forte te et ipsi reinvítent, et fiat tibi retribútio.'
  "13": 'Sed cum facis convívium, voca páuperes, débiles, claudos, et cæcos:'
  "14": 'et beátus eris, quia non habent retribúere tibi: retribuétur enim tibi in resurrectióne iustórum.'
  "15": 'Hæc cum audísset quidam de simul discumbéntibus, dixit illi: Beátus, qui manducábit panem in regno Dei.'
  "16": 'At ipse dixit ei: Homo quidam fecit cœnam magnam, et vocávit multos.'
  "17": Et misit servum suum hora cœnæ dícere invitátis ut venírent, quia iam paráta sunt ómnia.
  "18": 'Et cœpérunt simul omnes excusáre. Primus dixit ei: Villam emi, et necésse hábeo exíre, et vidére illam: rogo te, habe me excusátum.'
  "19": 'Et alter dixit: Iuga boum emi quinque, et eo probáre illa: rogo te, habe me excusátum.'
  "20": 'Et álius dixit: Uxórem duxi, et ídeo non possum veníre.'
  "21": 'Et revérsus servus nuntiávit hæc dómino suo. Tunc irátus paterfamílias, dixit servo suo: Exi cito in platéas, et vicos civitátis: et páuperes, ac débiles, et cæcos, et claudos intróduc huc.'
  "22": 'Et ait servus: Dómine, factum est ut imperásti, et adhuc locus est.'
  "23": 'Et ait dóminus servo: Exi in vias, et sepes: et compélle intráre, ut impleátur domus mea.'
  "24": Dico autem vobis, quod nemo virórum illórum, qui vocáti sunt, gustábit cœnam meam.
  "25": 'Ibant autem turbæ multæ cum eo: et convérsus dixit ad illos:'
  "26": Si quis venit ad me, et non odit patrem suum, et matrem, et uxórem, et fílios, et fratres, et soróres, adhuc autem et ánimam suam, non potest meus esse discípulus.
  "27": Et qui non báiulat crucem suam, et venit post me, non potest meus esse discípulus.
  "28": Quis enim ex vobis volens turrim ædificáre, non prius sedens cómputat sumptus, qui necessárii sunt, si hábeat ad perficiéndum,
  "29": ne, posteáquam posúerit fundaméntum, et non potúerit perfícere, omnes, qui vident, incípiant illúdere ei,
  "30": 'dicéntes: Quia hic homo cœpit ædificáre, et non pótuit consummáre?'
  "31": Aut quis rex itúrus commíttere bellum advérsus álium regem, non sedens prius cógitat, si possit cum decem míllibus occúrrere ei, qui cum vigínti míllibus venit ad se?
  "32": Alióquin adhuc illo longe agénte, legatiónem mittens rogat ea quæ pacis sunt.
  "33": Sic ergo omnis ex vobis, qui non renúntiat ómnibus, quæ póssidet, non potest meus esse discípulus.
  "34": 'Bonum est sal: si autem sal evanúerit, in quo condiétur?'
  "35": Neque in terram, neque in sterquilínium útile est, sed foras mittétur. Qui habet aures audiéndi, áudiat.
