bible: vulgate
lang: la
language: Latina
book: Iudicum
chapter: "11"
verses:
  "1": Fuit illo témpore Iephte Galaadítes vir fortíssimus atque pugnátor, fílius mulíeris meretrícis, qui natus est de Gálaad.
  "2": 'Hábuit autem Gálaad uxórem, de qua suscépit fílios: qui postquam créverant, eiecérunt Iephte, dicéntes: Heres in domo patris nostri esse non póteris, quia de áltera matre natus es.'
  "3": 'Quos ille fúgiens atque devítans, habitávit in terra Tob: congregatíque sunt ad eum viri ínopes, et latrocinántes, et quasi príncipem sequebántur.'
  "4": In illis diébus pugnábant fílii Ammon contra Israel.
  "5": 'Quibus ácriter instántibus perrexérunt maióres natu de Gálaad, ut tóllerent in auxílium sui Iephte de terra Tob:'
  "6": 'dixerúntque ad eum: Veni et esto princeps noster, et pugna contra fílios Ammon.'
  "7": 'Quibus ille respóndit: Nonne vos estis, qui odístis me, et eiecístis de domo patris mei? et nunc venístis ad me necessitáte compúlsi.'
  "8": 'Dixerúntque príncipes Gálaad ad Iephte: Ob hanc ígitur causam nunc ad te venímus, ut proficiscáris nobíscum, et pugnes contra fílios Ammon, sisque dux ómnium qui hábitant in Gálaad.'
  "9": 'Iephte quoque dixit eis: Si vere venístis ad me, ut pugnem pro vobis contra fílios Ammon, tradiderítque eos Dóminus in manus meas, ego ero vester princeps?'
  "10": 'Qui respondérunt ei: Dóminus, qui hæc audit, ipse mediátor ac testis est quod nostra promíssa faciémus.'
  "11": Abiit ítaque Iephte cum princípibus Gálaad, fecítque eum omnis pópulus príncipem sui. Locutúsque est Iephte omnes sermónes suos coram Dómino in Maspha.
  "12": 'Et misit núntios ad regem filiórum Ammon, qui ex persóna sua dícerent: Quid mihi et tibi est, quia venísti contra me, ut vastáres terram meam?'
  "13": 'Quibus ille respóndit: Quia tulit Israel terram meam, quando ascéndit de Ægýpto, a fínibus Arnon usque Iaboc atque Iordánem: nunc ergo cum pace redde mihi eam.'
  "14": 'Per quos rursum mandávit Iephte, et imperávit eis ut dícerent regi Ammon:'
  "15": 'Hæc dicit Iephte: Non tulit Israel terram Moab, nec terram filiórum Ammon:'
  "16": sed quando de Ægýpto conscendérunt, ambulávit per solitúdinem usque ad mare Rubrum, et venit in Cades.
  "17": 'Misítque núntios ad regem Edom, dicens: Dimítte me ut tránseam per terram tuam. Qui nóluit acquiéscere précibus eius. Misit quoque ad regem Moab, qui et ipse tránsitum præbére contémpsit. Mansit ítaque in Cades,'
  "18": 'et circuívit ex látere terram Edom, et terram Moab: venítque contra orientálem plagam terræ Moab, et castrametátus est trans Arnon: nec vóluit intráre términos Moab: Arnon quippe confínium est terræ Moab.'
  "19": 'Misit ítaque Israel núntios ad Sehon regem Amorrhæórum, qui habitábat in Hésebon, et dixérunt ei: Dimítte ut tránseam per terram tuam usque ad flúvium.'
  "20": 'Qui et ipse Israel verba despíciens, non dimísit eum transíre per términos suos: sed infiníta multitúdine congregáta, egréssus est contra eum in Iasa, et fórtiter resistébat.'
  "21": 'Tradidítque eum Dóminus in manus Israel cum omni exércitu suo: qui percússit eum, et possédit omnem terram Amorrhǽi habitatóris regiónis illíus,'
  "22": et univérsos fines eius, de Arnon usque Iaboc, et de solitúdine usque ad Iordánem.
  "23": Dóminus ergo Deus Israel subvértit Amorrhǽum, pugnánte contra illum pópulo suo Israel, et tu nunc vis possidére terram eius?
  "24": 'Nonne ea quæ póssidet Chamos deus tuus, tibi iure debéntur? quæ autem Dóminus Deus noster victor obtínuit, in nostram cedent possessiónem:'
  "25": 'nisi forte mélior es Balac fílio Sephor rege Moab: aut docére potes, quod iurgátus sit contra Israel, et pugnáverit contra eum,'
  "26": quando habitávit in Hésebon et vículis eius, et in Aroer et villis illíus, vel in cunctis civitátibus iuxta Iordánem, per trecéntos annos. Quare tanto témpore nihil super hac repetitióne tentástis?
  "27": Igitur non ego pecco in te, sed tu contra me male agis, indícens mihi bella non iusta. Iúdicet Dóminus árbiter huius diéi inter Israel, et inter fílios Ammon.
  "28": Noluítque acquiéscere rex filiórum Ammon verbis Iephte, quæ per núntios mandáverat.
  "29": Factus est ergo super Iephte Spíritus Dómini, et circúiens Gálaad et Manásse, Maspha quoque Gálaad, et inde tránsiens ad fílios Ammon,
  "30": 'votum vovit Dómino, dicens: Si tradíderis fílios Ammon in manus meas,'
  "31": quicúmque primus fúerit egréssus de fóribus domus meæ, mihíque occúrrerit reverténti cum pace a fíliis Ammon, eum holocáustum ófferam Dómino.
  "32": 'Transivítque Iephte ad fílios Ammon, ut pugnáret contra eos: quos trádidit Dóminus in manus eius.'
  "33": 'Percussítque ab Aroer usque dum vénias in Mennith, vigínti civitátes, et usque ad Abel, quæ est víneis cónsita, plaga magna nimis: humiliatíque sunt fílii Ammon a fíliis Israel.'
  "34": 'Reverténte autem Iephte in Maspha domum suam, occúrrit ei unigénita fília sua cum týmpanis et choris: non enim habébat álios líberos.'
  "35": 'Qua visa, scidit vestiménta sua, et ait: Heu me fília mea, decepísti me, et ipsa decépta es: apérui enim os meum ad Dóminum, et áliud fácere non pótero.'
  "36": 'Cui illa respóndit: Pater mi, si aperuísti os tuum ad Dóminum, fac mihi quodcúmque pollícitus es, concéssa tibi ultióne atque victória de hóstibus tuis.'
  "37": 'Dixítque ad patrem: Hoc solum mihi præsta quod déprecor: dimítte me ut duóbus ménsibus circúmeam montes, et plangam virginitátem meam cum sodálibus meis.'
  "38": 'Cui ille respóndit: Vade. Et dimísit eam duóbus ménsibus. Cumque abiísset cum sóciis ac sodálibus suis, flebat virginitátem suam in móntibus.'
  "39": Expletísque duóbus ménsibus, revérsa est ad patrem suum, et fecit ei sicut vóverat, quæ ignorábat virum. Exínde mos incrébruit in Israel, et consuetúdo serváta est,
  "40": ut post anni círculum convéniant in unum fíliæ Israel, et plangant fíliam Iephte Galaadítæ diébus quátuor.
