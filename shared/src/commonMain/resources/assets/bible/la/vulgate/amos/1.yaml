bible: vulgate
lang: la
language: Latina
book: Amos
chapter: "1"
verses:
  "1": 'Verba Amos, qui fuit in pastóribus de Thécue: quæ vidit super Israel in diébus Ozíæ regis Iuda, et in diébus Ieróboam fílii Ioas regis Israel, ante duos annos terræmótus.'
  "2": 'Et dixit: Dóminus de Sion rúgiet, et de Ierúsalem dabit vocem suam: et luxérunt speciósa pastórum, et exsiccátus est vertex Carméli.'
  "3": 'Hæc dicit Dóminus: Super tribus sceléribus Damásci, et super quátuor non convértam eum: eo quod trituráverint in plaustris férreis Gálaad.'
  "4": Et mittam ignem in domum Azael, et devorábit domos Bénadad.
  "5": 'Et cónteram vectem Damásci: et dispérdam habitatórem de campo idóli, et tenéntem sceptrum de domo voluptátis: et transferétur pópulus Sýriæ Cyrénen, dicit Dóminus.'
  "6": 'Hæc dicit Dóminus: Super tribus sceléribus Gazæ, et super quátuor non convértam eum: eo quod transtúlerint captivitátem perféctam, ut conclúderent eam in Idumǽa.'
  "7": Et mittam ignem in murum Gazæ, et devorábit ædes eius.
  "8": 'Et dispérdam habitatórem de Azóto, et tenéntem sceptrum de Ascalóne: et convértam manum meam super Accaron, et períbunt réliqui Philisthinórum, dicit Dóminus Deus.'
  "9": 'Hæc dicit Dóminus: Super tribus sceléribus Tyri, et super quátuor non convértam eum: eo quod conclúserint captivitátem perféctam in Idumǽa, et non sint recordáti fœ́deris fratrum.'
  "10": Et mittam ignem in murum Tyri, et devorábit ædes eius.
  "11": 'Hæc dicit Dóminus: Super tribus sceléribus Edom, et super quátuor non convértam eum: eo quod persecútus sit in gládio fratrem suum, et violáverit misericórdiam eius, et tenúerit ultra furórem suum, et indignatiónem suam serváverit usque in finem.'
  "12": 'Mittam ignem in Theman: et devorábit ædes Bosræ.'
  "13": 'Hæc dicit Dóminus: Super tribus sceléribus filiórum Ammon, et super quátuor non convértam eum: eo quod dissecúerit prægnántes Gálaad ad dilatándum términum suum.'
  "14": 'Et succéndam ignem in muro Rabba: et devorábit ædes eius in ululátu in die belli, et in túrbine in die commotiónis.'
  "15": Et ibit Melchom in captivitátem, ipse, et príncipes eius simul, dicit Dóminus.
