bible: vulgate
lang: la
language: Latina
book: ad Galatas
chapter: "3"
verses:
  "1": O insensáti Gálatæ, quis vos fascinávit non obedíre veritáti, ante quorum óculos Iesus Christus præscríptus est, in vobis crucifíxus?
  "2": 'Hoc solum a vobis volo díscere: ex opéribus legis Spíritum accepístis, an ex audítu fídei?'
  "3": Sic stulti estis, ut cum spíritu cœpéritis, nunc carne consummémini?
  "4": Tanta passi estis sine causa? si tamen sine causa.
  "5": 'Qui ergo tríbuit vobis Spíritum, et operátur virtútes in vobis: ex opéribus legis, an ex audítu fídei?'
  "6": 'Sicut scriptum est: Abraham crédidit Deo, et reputátum est illi ad iustítiam.'
  "7": Cognóscite ergo quia qui ex fide sunt, ii sunt fílii Abrahæ.
  "8": 'Próvidens autem Scriptúra quia ex fide iustíficat gentes Deus, prænuntiávit Abrahæ: Quia benedicéntur in te omnes gentes.'
  "9": Igitur qui ex fide sunt, benedicéntur cum fidéli Abraham.
  "10": 'Quicúmque enim ex opéribus legis sunt, sub maledícto sunt. Scriptum est enim: Maledíctus omnis, qui non permánserit in ómnibus, quæ scripta sunt in libro legis ut fáciat ea.'
  "11": 'Quóniam autem in lege nemo iustificátur apud Deum, maniféstum est: quia iustus ex fide vivit.'
  "12": 'Lex autem non est ex fide, sed: Qui fécerit ea, vivet in illis.'
  "13": 'Christus nos redémit de maledícto legis, factus pro nobis maledíctum: quia scriptum est: Maledíctus omnis qui pendet in ligno:'
  "14": ut in géntibus benedíctio Abrahæ fíeret in Christo Iesu, ut pollicitatiónem Spíritus accipiámus per fidem.
  "15": Fratres (secúndum hóminem dico) tamen hóminis confirmátum testaméntum nemo spernit, aut superórdinat.
  "16": 'Abrahæ dictæ sunt promissiónes, et sémini eius. Non dicit: Et semínibus, quasi in multis: sed quasi in uno: Et sémini tuo, qui est Christus.'
  "17": 'Hoc autem dico, testaméntum confirmátum a Deo: quæ post quadringéntos et trigínta annos facta est lex, non írritum facit ad evacuándam promissiónem.'
  "18": Nam si ex lege heréditas, iam non ex promissióne. Abrahæ autem per repromissiónem donávit Deus.
  "19": Quid ígitur lex? Propter transgressiónes pósita est donec veníret semen, cui promíserat, ordináta per ángelos in manu mediatóris.
  "20": 'Mediátor autem uníus non est: Deus autem unus est.'
  "21": Lex ergo advérsus promíssa Dei? Absit. Si enim data esset lex, quæ posset vivificáre, vere ex lege esset iustítia.
  "22": Sed conclúsit Scriptúra ómnia sub peccáto, ut promíssio ex fide Iesu Christi darétur credéntibus.
  "23": Prius autem quam veníret fides, sub lege custodiebámur conclúsi in eam fidem, quæ revelánda erat.
  "24": Itaque lex pædagógus noster fuit in Christo, ut ex fide iustificémur.
  "25": At ubi venit fides, iam non sumus sub pædagógo.
  "26": Omnes enim fílii Dei estis per fidem, quæ est in Christo Iesu.
  "27": Quicúmque enim in Christo baptizáti estis, Christum induístis.
  "28": 'Non est Iudǽus, neque Græcus: non est servus, neque liber: non est másculus, neque fémina. Omnes enim vos unum estis in Christo Iesu.'
  "29": Si autem vos Christi, ergo semen Abrahæ estis, secúndum promissiónem herédes.
