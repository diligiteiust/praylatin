bible: vulgate
lang: la
language: Latina
book: Malachias
chapter: "2"
verses:
  "1": Et nunc ad vos mandátum hoc, o sacerdótes.
  "2": 'Si noluéritis audíre, et si noluéritis pónere super cor, ut detis glóriam nómini meo, ait Dóminus exercítuum: mittam in vos egestátem, et maledícam benedictiónibus vestris, et maledícam illis: quóniam non posuístis super cor.'
  "3": Ecce ego proíciam vobis bráchium, et dispérgam super vultum vestrum stercus solemnitátum vestrárum, et assúmet vos secum.
  "4": Et sciétis quia misi ad vos mandátum istud, ut esset pactum meum cum Levi, dicit Dóminus exercítuum.
  "5": 'Pactum meum fuit cum eo vitæ et pacis: et dedi ei timórem, et tímuit me, et a fácie nóminis mei pavébat.'
  "6": 'Lex veritátis fuit in ore eius, et iníquitas non est invénta in lábiis eius: in pace, et in æquitáte ambulávit mecum, et multos avértit ab iniquitáte.'
  "7": 'Lábia enim sacerdótis custódient sciéntiam, et legem requírent ex ore eius: quia ángelus Dómini exercítuum est.'
  "8": 'Vos autem recessístis de via, et scandalizástis plúrimos in lege: írritum fecístis pactum Levi, dicit Dóminus exercítuum.'
  "9": Propter quod et ego dedi vos contemptíbiles, et húmiles ómnibus pópulis, sicut non servástis vias meas, et accepístis fáciem in lege.
  "10": Numquid non pater unus ómnium nostrum? numquid non Deus unus creávit nos? quare ergo déspicit unusquísque nostrum fratrem suum, víolans pactum patrum nostrórum?
  "11": 'Transgréssus est Iuda, et abominátio facta est in Israel, et in Ierúsalem: quia contaminávit Iuda sanctificatiónem Dómini, quam diléxit, et hábuit fíliam dei aliéni.'
  "12": Dispérdet Dóminus virum, qui fécerit hoc, magístrum, et discípulum de tabernáculis Iacob, et offeréntem munus Dómino exercítuum.
  "13": 'Et hoc rursum fecístis: operiebátis lácrymis altáre Dómini, fletu, et mugítu, ita ut non respíciam ultra ad sacrifícium, nec accípiam placábile quid de manu vestra.'
  "14": 'Et dixístis: Quam ob causam? quia Dóminus testificátus est inter te, et uxórem pubertátis tuæ, quam tu despexísti: et hæc párticeps tua, et uxor fœ́deris tui.'
  "15": Nonne unus fecit, et resíduum spíritus eius est? Et quid unus quærit, nisi semen Dei? Custodíte ergo spíritum vestrum, et uxórem adolescéntiæ tuæ noli despícere.
  "16": 'Cum ódio habúeris, dimítte, dicit Dóminus Deus Israel: opériet autem iníquitas vestiméntum eius, dicit Dóminus exercítuum: custodíte spíritum vestrum, et nolíte despícere.'
  "17": 'Laboráre fecístis Dóminum in sermónibus vestris: et dixístis: In quo eum fécimus laboráre? In eo quod dícitis: Omnis qui facit malum, bonus est in conspéctu Dómini, et tales ei placent: aut certe ubi est Deus iudícii?'
