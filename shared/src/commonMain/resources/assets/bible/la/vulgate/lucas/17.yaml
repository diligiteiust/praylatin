bible: vulgate
lang: la
language: Latina
book: Lucas
chapter: "17"
verses:
  "1": 'Et ait ad discípulos suos: Impossíbile est ut non véniant scándala: væ autem illi per quem véniunt.'
  "2": Utílius est illi si lapis moláris imponátur circa collum eius, et proiciátur in mare, quam ut scandalízet unum de pusíllis istis.
  "3": 'Atténdite vobis: Si peccáverit in te frater tuus, íncrepa illum: et si pœniténtiam égerit, dimítte illi.'
  "4": 'Et si sépties in die peccáverit in te, et sépties in die convérsus fúerit ad te, dicens: Pœ́nitet me, dimítte illi.'
  "5": 'Et dixérunt apóstoli Dómino: Adáuge nobis fidem.'
  "6": 'Dixit autem Dóminus: Si habuéritis fidem sicut granum sinápis, dicétis huic árbori moro: Eradicáre, et transplantáre in mare, et obédiet vobis.'
  "7": 'Quis autem vestrum habens servum arántem aut pascéntem, qui regrésso de agro dicat illi: Statim transi, recúmbe:'
  "8": 'et non dicat ei: Para quod cœnem, et præcínge te, et minístra mihi donec mandúcem, et bibam, et post hæc tu manducábis, et bibes?'
  "9": Numquid grátiam habet servo illi, quia fecit quæ ei imperáverat?
  "10": 'Non puto. Sic et vos cum fecéritis ómnia, quæ præcépta sunt vobis, dícite: Servi inútiles sumus: quod debúimus fácere, fécimus.'
  "11": Et factum est, dum iret in Ierúsalem, transíbat per médiam Samaríam, et Galilǽam.
  "12": 'Et cum ingrederétur quoddam castéllum, occurrérunt ei decem viri leprósi, qui stetérunt a longe:'
  "13": 'et levavérunt vocem, dicéntes: Iesu præcéptor, miserére nostri.'
  "14": 'Quos ut vidit, dixit: Ite, osténdite vos sacerdótibus. Et factum est, dum irent, mundáti sunt.'
  "15": Unus autem ex illis, ut vidit quia mundátus est, regréssus est, cum magna voce magníficans Deum,
  "16": 'et cécidit in fáciem ante pedes eius, grátias agens: et hic erat Samaritánus.'
  "17": 'Respóndens autem Iesus, dixit: Nonne decem mundáti sunt? et novem ubi sunt?'
  "18": Non est invéntus qui redíret, et daret glóriam Deo, nisi hic alienígena.
  "19": 'Et ait illi: Surge, vade: quia fides tua te salvum fecit.'
  "20": 'Interrogátus autem a Pharisǽis: Quando venit regnum Dei? respóndens eis, dixit: Non venit regnum Dei cum observatióne:'
  "21": 'neque dicent: Ecce hic, aut ecce illic. Ecce enim regnum Dei intra vos est.'
  "22": 'Et ait ad discípulos suos: Vénient dies quando desiderétis vidére unum diem Fílii hóminis, et non vidébitis.'
  "23": 'Et dicent vobis: Ecce hic, et ecce illic. Nolíte ire, neque sectémini:'
  "24": 'nam, sicut fulgur corúscans de sub cælo in ea, quæ sub cælo sunt, fulget: ita erit Fílius hóminis in die sua.'
  "25": Primum autem opórtet illum multa pati, et reprobári a generatióne hac.
  "26": Et sicut factum est in diébus Noe, ita erit et in diébus Fílii hóminis.
  "27": 'Edébant, et bibébant: uxóres ducébant, et dabántur ad núptias, usque in diem, qua intrávit Noe in arcam: et venit dilúvium, et pérdidit omnes.'
  "28": 'Simíliter sicut factum est in diébus Lot: Edébant, et bibébant: emébant, et vendébant: plantábant, et ædificábant:'
  "29": 'qua die autem éxiit Lot a Sódomis, pluit ignem, et sulphur de cælo, et omnes pérdidit:'
  "30": secúndum hæc erit, qua die Fílius hóminis revelábitur.
  "31": 'In illa hora, qui fúerit in tecto, et vasa eius in domo, ne descéndat tóllere illa: et qui in agro, simíliter non rédeat retro.'
  "32": Mémores estóte uxóris Lot.
  "33": 'Quicúmque quæsíerit ánimam suam salvam fácere, perdet illam: et quicúmque perdíderit illam, vivificábit eam.'
  "34": 'Dico vobis: In illa nocte erunt duo in lecto uno: unus assumétur, et alter relinquétur:'
  "35": 'duæ erunt moléntes in unum: una assumétur, et áltera relinquétur: duo in agro: unus assumétur, et alter relinquétur.'
  "36": 'Respondéntes dicunt illi: Ubi Dómine?'
  "37": 'Qui dixit illis: Ubicúmque fúerit corpus, illuc congregabúntur et áquilæ.'
