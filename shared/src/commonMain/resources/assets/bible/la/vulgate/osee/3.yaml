bible: vulgate
lang: la
language: Latina
book: Osee
chapter: "3"
verses:
  "1": 'Et dixit Dóminus ad me: Adhuc vade, et dílige mulíerem diléctam amíco et adúlteram: sicut díligit Dóminus fílios Israel, et ipsi respíciunt ad deos aliénos, et díligunt vinácia uvárum.'
  "2": Et fodi eam mihi quíndecim argénteis, et coro hórdei, et dimídio coro hórdei.
  "3": 'Et dixi ad eam: Dies multos exspectábis me: non fornicáberis, et non eris viro: sed et ego exspectábo te.'
  "4": Quia dies multos sedébunt fílii Israel sine rege, et sine príncipe, et sine sacrifício, et sine altári, et sine ephod, et sine théraphim.
  "5": 'Et post hæc reverténtur fílii Israel, et quærent Dóminum Deum suum, et David regem suum: et pavébunt ad Dóminum, et ad bonum eius, in novíssimo diérum.'
