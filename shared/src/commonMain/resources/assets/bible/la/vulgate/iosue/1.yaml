bible: vulgate
lang: la
language: Latina
book: Iosue
chapter: "1"
verses:
  "1": 'Et factum est post mortem Móysi servi Dómini, ut loquerétur Dóminus ad Iósue fílium Nun, minístrum Móysi, et díceret ei:'
  "2": 'Móyses servus meus mórtuus est: surge, et transi Iordánem istum tu, et omnis pópulus tecum, in terram, quam ego dabo fíliis Israel.'
  "3": Omnem locum, quem calcáverit vestígium pedis vestri, vobis tradam, sicut locútus sum Móysi.
  "4": A desérto et Líbano usque ad flúvium magnum Euphráten, omnis terra Hethæórum usque ad mare magnum contra solis occásum erit términus vester.
  "5": 'Nullus póterit vobis resístere cunctis diébus vitæ tuæ: sicut fui cum Móyse, ita ero tecum: non dimíttam, nec derelínquam te.'
  "6": 'Confortáre, et esto robústus: tu enim sorte dívides pópulo huic terram, pro qua iurávi pátribus suis, ut tráderem eam illis.'
  "7": 'Confortáre ígitur, et esto robústus valde, ut custódias, et fácias omnem legem, quam præcépit tibi Móyses servus meus: ne declínes ab ea ad déxteram vel ad sinístram, ut intélligas cuncta quæ agis.'
  "8": 'Non recédat volúmen legis huius ab ore tuo: sed meditáberis in eo diébus ac nóctibus, ut custódias et fácias ómnia quæ scripta sunt in eo: tunc díriges viam tuam, et intélliges eam.'
  "9": 'Ecce præcípio tibi: confortáre, et esto robústus. Noli metúere, et noli timére: quóniam tecum est Dóminus Deus tuus in ómnibus ad quæcúmque perréxeris.'
  "10": 'Præcepítque Iósue princípibus pópuli, dicens: Transíte per médium castrórum, et imperáte pópulo, ac dícite:'
  "11": 'Præparáte vobis cibária: quóniam post diem tértium transíbitis Iordánem, et intrábitis ad possidéndam terram, quam Dóminus Deus vester datúrus est vobis.'
  "12": 'Rubenítis quoque et Gadítis, et dimídiæ tríbui Manásse, ait:'
  "13": 'Mementóte sermónis, quem præcépit vobis Móyses fámulus Dómini, dicens: Dóminus Deus vester dedit vobis réquiem, et omnem terram.'
  "14": 'Uxóres vestræ, et fílii, ac iuménta manébunt in terra, quam trádidit vobis Móyses trans Iordánem: vos autem transíte armáti ante fratres vestros, omnes fortes manu, et pugnáte pro eis,'
  "15": 'donec det Dóminus réquiem frátribus vestris sicut et vobis dedit, et possídeant ipsi quoque terram, quam Dóminus Deus vester datúrus est eis: et sic revertímini in terram possessiónis vestræ, et habitábitis in ea, quam vobis dedit Móyses fámulus Dómini trans Iordánem contra solis ortum.'
  "16": 'Responderúntque ad Iósue, atque dixérunt: Omnia, quæ præcepísti nobis, faciémus: et quocúmque míseris, íbimus.'
  "17": 'Sicut obedívimus in cunctis Móysi, ita obediémus et tibi: tantum sit Dóminus Deus tuus tecum, sicut fuit cum Móyse.'
  "18": 'Qui contradíxerit ori tuo, et non obedíerit cunctis sermónibus, quos præcéperis ei, moriátur: tu tantum confortáre, et viríliter age.'
