bible: vulgate
lang: la
language: Latina
book: Michaeas
chapter: "5"
verses:
  "1": 'Nunc vastáberis fília latrónis: obsidiónem posuérunt super nos, in virga percútient maxíllam iúdicis Israel.'
  "2": 'Et tu Béthlehem Ephrata párvulus es in míllibus Iuda: ex te mihi egrediétur qui sit dominátor in Israel, et egréssus eius ab inítio, a diébus æternitátis.'
  "3": 'Propter hoc dabit eos usque ad tempus, in quo partúriens páriet: et relíquiæ fratrum eius converténtur ad fílios Israel.'
  "4": 'Et stabit, et pascet in fortitúdine Dómini, in sublimitáte nóminis Dómini Dei sui: et converténtur, quia nunc magnificábitur usque ad términos terræ.'
  "5": 'Et erit iste pax: cum vénerit Assýrius in terram nostram, et quando calcáverit in dómibus nostris: et suscitábimus super eum septem pastóres, et octo primátes hómines.'
  "6": 'Et pascent terram Assur in gládio, et terram Nemrod in lánceis eius: et liberábit ab Assur cum vénerit in terram nostram, et cum calcáverit in fínibus nostris.'
  "7": Et erunt relíquiæ Iacob in médio populórum multórum quasi ros a Dómino, et quasi stillæ super herbam, quæ non exspéctat virum, et non præstolátur fílios hóminum.
  "8": 'Et erunt relíquiæ Iacob in géntibus, in médio populórum multórum, quasi leo in iuméntis silvárum, et quasi cátulus leónis in grégibus pécorum: qui cum transíerit, et conculcáverit, et céperit, non est qui éruat.'
  "9": Exaltábitur manus tua super hostes tuos, et omnes inimíci tui interíbunt.
  "10": 'Et erit in die illa, dicit Dóminus: Auferam equos tuos de médio tui, et dispérdam quadrígas tuas.'
  "11": Et perdam civitátes terræ tuæ, et déstruam omnes munitiónes tuas, et áuferam malefícia de manu tua, et divinatiónes non erunt in te.
  "12": 'Et períre fáciam sculptília tua, et státuas tuas de médio tui: et non adorábis ultra ópera mánuum tuárum.'
  "13": Et evéllam lucos tuos de médio tui, et cónteram civitátes tuas.
  "14": Et fáciam in furóre et in indignatióne ultiónem in ómnibus géntibus, quæ non audiérunt.
