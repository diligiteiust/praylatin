bible: vulgate
lang: la
language: Latina
book: Ezechiel
chapter: "29"
verses:
  "1": 'In anno décimo, décimo mense, undécima die mensis, factum est verbum Dómini ad me, dicens:'
  "2": Fili hóminis pone fáciem tuam contra Pharaónem regem Ægýpti, et prophetábis de eo, et de Ægýpto univérsa.
  "3": 'Lóquere, et dices: Hæc dicit Dóminus Deus: Ecce ego ad te, Phárao rex Ægýpti, draco magne, qui cubas in médio flúminum tuórum, et dicis: Meus est flúvius, et ego feci memetípsum.'
  "4": 'Et ponam frenum in maxíllis tuis, et agglutinábo pisces flúminum tuórum squamis tuis: et éxtraham te de médio flúminum tuórum, et univérsi pisces tui squamis tuis adhærébunt.'
  "5": 'Et proíciam te in desértum, et omnes pisces flúminis tui: super fáciem terræ cades, non colligéris, neque congregáberis: béstiis terræ, et volatílibus cæli dedi te ad devorándum.'
  "6": 'Et scient omnes habitatóres Ægýpti quia ego Dóminus: pro eo quod fuísti báculus arundíneus dómui Israel.'
  "7": 'Quando apprehendérunt te manu, et confráctus es, et lacerásti omnem húmerum eórum: et inniténtibus eis super te comminútus es, et dissolvísti omnes renes eórum.'
  "8": 'Proptérea hæc dicit Dóminus Deus: Ecce ego addúcam super te gládium, et interfíciam de te hóminem, et iuméntum.'
  "9": 'Et erit terra Ægýpti in desértum, et in solitúdinem: et scient quia ego Dóminus, pro eo quod díxeris: Flúvius meus est, et ego feci eum.'
  "10": 'Idcírco ecce ego ad te, et ad flúmina tua: dabóque terram Ægýpti in solitúdines, gládio dissipátam, a turre Syénes usque ad términos Æthiópiæ.'
  "11": 'Non pertransíbit eam pes hóminis, neque pes iuménti gradiétur in ea: et non habitábitur quadragínta annis.'
  "12": 'Dabóque terram Ægýpti desértam in médio terrárum desertárum, et civitátes eius in médio úrbium subversárum, et erunt desolátæ quadragínta annis: et dispérgam Ægýptios in natiónes, et ventilábo eos in terras.'
  "13": 'Quia hæc dicit Dóminus Deus: Post finem quadragínta annórum congregábo Ægýptum de pópulis, in quibus dispérsi fúerant.'
  "14": 'Et redúcam captivitátem Ægýpti, et collocábo eos in terra Phathúres, in terra nativitátis suæ: et erunt ibi in regnum húmile:'
  "15": inter cétera regna erit humíllima, et non elevábitur ultra super natiónes, et immínuam eos ne ímperent géntibus.
  "16": 'Neque erunt ultra dómui Israel in confidéntia, docéntes iniquitátem, ut fúgiant, et sequántur eos: et scient quia ego Dóminus Deus.'
  "17": 'Et factum est in vigésimo et séptimo anno, in primo, in una mensis: factum est verbum Dómini ad me, dicens:'
  "18": 'Fili hóminis, Nabuchodónosor rex Babylónis servíre fecit exércitum suum servitúte magna advérsum Tyrum: omne caput decalvátum, et omnis húmerus depilátus est: et merces non est réddita ei, neque exercítui eius de Tyro pro servitúte, qua servívit mihi advérsus eam.'
  "19": 'Proptérea hæc dicit Dóminus Deus: Ecce ego dabo Nabuchodónosor regem Babylónis in terra Ægýpti: et accípiet multitúdinem eius, et deprædábitur manúbias eius, et dirípiet spólia eius: et erit merces exercítui illíus,'
  "20": 'et óperi, quo servívit advérsus eam: dedi ei terram Ægýpti, pro eo quod laboráverit mihi, ait Dóminus Deus.'
  "21": In die illo pullulábit cornu dómui Israel, et tibi dabo apértum os in médio eórum, et scient quia ego Dóminus.
