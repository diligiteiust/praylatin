bible: vulgate
lang: la
language: Latina
book: Amos
chapter: "2"
verses:
  "1": 'Hæc dicit Dóminus: Super tribus sceléribus Moab, et super quátuor non convértam eum: eo quod incénderit ossa regis Idumǽæ usque ad cínerem.'
  "2": 'Et mittam ignem in Moab, et devorábit ædes Carioth: et moriétur in sónitu Moab, in clangóre tubæ:'
  "3": et dispérdam iúdicem de médio eius, et omnes príncipes eius interfíciam cum eo, dicit Dóminus.
  "4": 'Hæc dicit Dóminus: Super tribus sceléribus Iuda, et super quátuor non convértam eum: eo quod abiécerit legem Dómini, et mandáta eius non custodíerit: decepérunt enim eos idóla sua, post quæ abíerant patres eórum.'
  "5": Et mittam ignem in Iuda, et devorábit ædes Ierúsalem.
  "6": 'Hæc dicit Dóminus: Super tribus sceléribus Israel, et super quátuor non convértam eum: pro eo quod vendíderit pro argénto iustum, et páuperem pro calceaméntis.'
  "7": 'Qui cónterunt super púlverem terræ cápita páuperum, et viam humílium declínant: et fílius ac pater eius iérunt ad puéllam, ut violárent nomen sanctum meum.'
  "8": 'Et super vestiméntis pignorátis accubuérunt iuxta omne altáre: et vinum damnatórum bibébant in domo Dei sui.'
  "9": 'Ego autem exterminávi Amorrhǽum a fácie eórum: cuius altitúdo, cedrórum altitúdo eius, et fortis ipse quasi quercus: et contrívi fructum eius désuper, et radíces eius subter.'
  "10": Ego sum, qui ascéndere vos feci de terra Ægýpti, et duxi vos in desérto quadragínta annis, ut possiderétis terram Amorrhǽi.
  "11": 'Et suscitávi de fíliis vestris in prophétas, et de iuvénibus vestris Nazarǽos: numquid non ita est fílii Israel, dicit Dóminus?'
  "12": 'Et propinábitis Nazarǽis vinum: et prophétis mandábitis, dicéntes: Ne prophetétis.'
  "13": Ecce ego stridébo subter vos, sicut stridet plaustrum onústum fœno.
  "14": 'Et períbit fuga a velóce, et fortis non obtinébit virtútem suam, et robústus non salvábit ánimam suam:'
  "15": 'et tenens arcum non stabit, et velox pédibus suis non salvábitur, et ascénsor equi non salvábit ánimam suam:'
  "16": et robústus corde inter fortes nudus fúgiet in illa die, dicit Dóminus.
