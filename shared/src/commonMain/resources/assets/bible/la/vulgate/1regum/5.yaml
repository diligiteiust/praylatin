bible: vulgate
lang: la
language: Latina
book: I Regum
chapter: "5"
verses:
  "1": 'Misit quoque Hiram rex Tyri servos suos ad Salomónem: audívit enim quod ipsum unxíssent regem pro patre eius: quia amícus fúerat Hiram David omni témpore.'
  "2": 'Misit autem Sálomon ad Hiram, dicens:'
  "3": Tu scis voluntátem David patris mei, et quia non potúerit ædificáre domum nómini Dómini Dei sui propter bella imminéntia per circúitum, donec daret Dóminus eos sub vestígio pedum eius.
  "4": Nunc autem réquiem dedit Dóminus Deus meus mihi per circúitum, et non est satan, neque occúrsus malus.
  "5": 'Quam ob rem cógito ædificáre templum nómini Dómini Dei mei, sicut locútus est Dóminus David patri meo, dicens: Fílius tuus, quem dabo pro te super sólium tuum, ipse ædificábit domum nómini meo.'
  "6": 'Prǽcipe ígitur ut præcídant mihi servi tui cedros de Líbano, et servi mei sint cum servis tuis: mercédem autem servórum tuórum dabo tibi quamcúmque petíeris: scis enim quómodo non est in pópulo meo vir qui nóverit ligna cǽdere sicut Sidónii.'
  "7": 'Cum ergo audísset Hiram verba Salomónis, lætátus est valde, et ait: Benedíctus Dóminus Deus hódie, qui dedit David fílium sapientíssimum super pópulum hunc plúrimum.'
  "8": 'Et misit Hiram ad Salomónem, dicens: Audívi quæcúmque mandásti mihi: ego fáciam omnem voluntátem tuam in lignis cédrinis et abiégnis.'
  "9": 'Servi mei depónent ea de Líbano ad mare, et ego compónam ea in rátibus in mari usque ad locum, quem significáveris mihi: et applicábo ea ibi, et tu tolles ea: præbebísque necessária mihi, ut detur cibus dómui meæ.'
  "10": Itaque Hiram dabat Salomóni ligna cédrina, et ligna abiégna, iuxta omnem voluntátem eius.
  "11": 'Sálomon autem præbébat Hiram coros trítici vigínti míllia in cibum dómui eius, et vigínti coros puríssimi ólei: hæc tribuébat Sálomon Hiram per síngulos annos.'
  "12": 'Dedit quoque Dóminus sapiéntiam Salomóni, sicut locútus est ei: et erat pax inter Hiram et Salomónem, et percussérunt ambo fœdus.'
  "13": Elegítque rex Sálomon operários de omni Israel, et erat indíctio trigínta míllia virórum.
  "14": 'Mittebátque eos in Líbanum, decem míllia per menses síngulos vicíssim, ita ut duóbus ménsibus essent in dómibus suis: et Adoníram erat super huiuscémodi indictióne.'
  "15": 'Fuerúntque Salomóni septuagínta míllia eórum qui ónera portábant, et octogínta míllia latomórum in monte:'
  "16": absque præpósitis qui prǽerant síngulis opéribus, número trium míllium et trecentórum, præcipiéntium pópulo et his qui faciébant opus.
  "17": 'Præcepítque rex ut tóllerent lápides grandes, lápides pretiósos in fundaméntum templi, et quadrárent eos:'
  "18": 'quos dolavérunt cæmentárii Salomónis, et cæmentárii Hiram: porro Gíblii præparavérunt ligna et lápides ad ædificándam domum.'
