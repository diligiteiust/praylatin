bible: vulgate
lang: la
language: Latina
book: Exodus
chapter: "17"
verses:
  "1": Igitur profécta omnis multitúdo filiórum Israel de desérto Sin per mansiónes suas, iuxta sermónem Dómini, castrametáti sunt in Ráphidim, ubi non erat aqua ad bibéndum pópulo.
  "2": 'Qui iurgátus contra Móysen, ait: Da nobis aquam, ut bibámus. Quibus respóndit Móyses: Quid iurgámini contra me? cur tentátis Dóminum?'
  "3": 'Sitívit ergo ibi pópulus præ aquæ penúria, et murmurávit contra Móysen, dicens: Cur fecísti nos exíre de Ægýpto, ut occíderes nos, et líberos nostros, ac iuménta siti?'
  "4": 'Clamávit autem Móyses ad Dóminum, dicens: Quid fáciam pópulo huic? adhuc páululum, et lapidábit me.'
  "5": 'Et ait Dóminus ad Móysen: Antecéde pópulum, et sume tecum de senióribus Israel: et virgam qua percussísti flúvium, tolle in manu tua, et vade.'
  "6": 'En ego stabo ibi coram te, supra petram Horeb: percutiésque petram, et exíbit ex ea aqua, ut bibat pópulus. Fecit Móyses ita coram senióribus Israel:'
  "7": 'et vocávit nomen loci illíus, Tentátio, propter iúrgium filiórum Israel, et quia tentavérunt Dóminum, dicéntes: Estne Dóminus in nobis, an non?'
  "8": Venit autem Amalec, et pugnábat contra Israel in Ráphidim.
  "9": 'Dixítque Móyses ad Iósue: Elige viros: et egréssus, pugna contra Amalec: cras ego stabo in vértice collis, habens virgam Dei in manu mea.'
  "10": 'Fecit Iósue ut locútus erat Móyses, et pugnávit contra Amalec: Móyses autem et Aaron et Hur ascendérunt super vérticem collis.'
  "11": 'Cumque leváret Móyses manus, vincébat Israel: sin autem páululum remisísset, superábat Amalec.'
  "12": 'Manus autem Móysi erant graves: suméntes ígitur lápidem, posuérunt subter eum, in quo sedit: Aaron autem et Hur sustentábant manus eius ex utráque parte. Et factum est ut manus illíus non lassaréntur usque ad occásum solis.'
  "13": Fugavítque Iósue Amalec, et pópulum eius in ore gládii.
  "14": 'Dixit autem Dóminus ad Móysen: Scribe hoc ob monuméntum in libro, et trade áuribus Iósue: delébo enim memóriam Amalec sub cælo.'
  "15": 'Ædificavítque Móyses altáre: et vocávit nomen eius, Dóminus exaltátio mea, dicens:'
  "16": Quia manus sólii Dómini, et bellum Dómini erit contra Amalec, a generatióne in generatiónem.
