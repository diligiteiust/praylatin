bible: vulgate
lang: la
language: Latina
book: ad Philippenses
chapter: "3"
verses:
  "1": De cétero fratres mei gaudéte in Dómino. Eadem vobis scríbere, mihi quidem non pigrum, vobis autem necessárium.
  "2": Vidéte canes, vidéte malos operários, vidéte concisiónem.
  "3": Nos enim sumus circumcísio, qui spíritu servímus Deo, et gloriámur in Christo Iesu, et non in carne fidúciam habéntes,
  "4": quamquam ego hábeam confidéntiam et in carne. Si quis álius vidétur confídere in carne, ego magis,
  "5": circumcísus octávo die, ex génere Israel, de tribu Béniamin, Hebrǽus ex Hebrǽis, secúndum legem Pharisǽus,
  "6": secúndum æmulatiónem pérsequens Ecclésiam Dei, secúndum iustítiam, quæ in lege est, conversátus sine queréla.
  "7": Sed quæ mihi fuérunt lucra, hæc arbitrátus sum propter Christum detriménta.
  "8": 'Verúmtamen exístimo ómnia detriméntum esse propter eminéntem sciéntiam Iesu Christi Dómini mei: propter quem ómnia detriméntum feci, et árbitror ut stércora, ut Christum lucrifáciam,'
  "9": 'et invéniar in illo non habens meam iustítiam, quæ ex lege est, sed illam, quæ ex fide est Christi Iesu: quæ ex Deo est iustítia in fide,'
  "10": 'ad cognoscéndum illum, et virtútem resurrectiónis eius, et societátem passiónum illíus: configurátus morti eius:'
  "11": 'si quo modo occúrram ad resurrectiónem, quæ est ex mórtuis:'
  "12": 'non quod iam accéperim, aut iam perféctus sim: sequor autem, si quómodo comprehéndam in quo et comprehénsus sum a Christo Iesu.'
  "13": 'Fratres, ego me non árbitror comprehendísse. Unum autem: quæ quidem retro sunt oblivíscens, ad ea vero, quæ sunt prióra, exténdens meípsum,'
  "14": ad destinátum pérsequor, ad bravíum supérnæ vocatiónis Dei in Christo Iesu.
  "15": 'Quicúmque ergo perfécti sumus, hoc sentiámus: et si quid áliter sápitis, et hoc vobis Deus revelábit.'
  "16": Verúmtamen ad quod pervénimus ut idem sapiámus, et in eádem permaneámus régula.
  "17": Imitatóres mei estóte fratres, et observáte eos qui ita ámbulant, sicut habétis formam nostram.
  "18": 'Multi enim ámbulant, quos sæpe dicébam vobis (nunc autem et flens dico) inimícos crucis Christi:'
  "19": 'quorum finis intéritus: quorum Deus venter est: et glória in confusióne ipsórum, qui terréna sápiunt.'
  "20": 'Nostra autem conversátio in cælis est: unde étiam Salvatórem exspectámus Dóminum nostrum Iesum Christum,'
  "21": qui reformábit corpus humilitátis nostræ, configurátum córpori claritátis suæ, secúndum operatiónem, qua étiam possit subícere sibi ómnia.
