bible: vulgate
lang: la
language: Latina
book: I Samuelis
chapter: "20"
verses:
  "1": 'Fugit autem David de Naioth, quæ est in Rámatha, veniénsque locútus est coram Iónatha: Quid feci? quæ est iníquitas mea, et quod peccátum meum in patrem tuum, quia quærit ánimam meam?'
  "2": 'Qui dixit ei: Absit, non moriéris: neque enim fáciet pater meus quidquam grande vel parvum, nisi prius indicáverit mihi: hunc ergo celávit me pater meus sermónem tantúmmodo? nequáquam erit istud.'
  "3": 'Et iurávit rursum Davídi. Et ille ait: Scit profécto pater tuus quia invéni grátiam in óculis tuis, et dicet: Nésciat hoc Iónathas, ne forte tristétur. Quinímmo vivit Dóminus, et vivit ánima tua, quia uno tantum (ut ita dicam) gradu ego morsque divídimur.'
  "4": 'Et ait Iónathas ad David: Quodcúmque díxerit mihi ánima tua, fáciam tibi.'
  "5": 'Dixit autem David ad Iónathan: Ecce caléndæ sunt crástino, et ego ex more sedére sóleo iuxta regem ad vescéndum: dimítte ergo me ut abscóndar in agro usque ad vésperam diéi tértiæ.'
  "6": 'Si respíciens requisíerit me pater tuus, respondébis ei: Rogávit me David ut iret celériter in Béthlehem civitátem suam, quia víctimæ solémnes ibi sunt univérsis contribúlibus suis.'
  "7": 'Si díxerit: Bene: pax erit servo tuo. Si autem fúerit irátus, scito quia compléta est malítia eius.'
  "8": 'Fac ergo misericórdiam in servum tuum, quia fœdus Dómini me fámulum tuum tecum iníre fecísti: si autem est iníquitas áliqua in me, tu me intérfice, et ad patrem tuum ne introdúcas me.'
  "9": 'Et ait Iónathas: Absit hoc a te: neque enim fíeri potest, ut si certe cognóvero complétam esse patris mei malítiam contra te, non annúntiem tibi.'
  "10": 'Respondítque David ad Iónathan: Quis renuntiábit mihi, si quid forte respónderit tibi pater tuus dure de me?'
  "11": 'Et ait Iónathas ad David: Veni, et egrediámur foras in agrum. Cumque exíssent ambo in agrum,'
  "12": 'ait Iónathas ad David: Dómine Deus Israel, si investigávero senténtiam patris mei crástino vel peréndie, et áliquid boni fúerit super David, et non statim mísero ad te, et notum tibi fécero,'
  "13": hæc fáciat Dóminus Iónathæ, et hæc addat. Si autem perseveráverit patris mei malítia advérsum te, revelábo aurem tuam, et dimíttam te, ut vadas in pace, et sit Dóminus tecum, sicut fuit cum patre meo.
  "14": 'Et si víxero, fácies mihi misericórdiam Dómini: si vero mórtuus fúero,'
  "15": 'non áuferes misericórdiam tuam a domo mea usque in sempitérnum, quando eradicáverit Dóminus inimícos David, unumquémque de terra: áuferat Iónathan de domo sua, et requírat Dóminus de manu inimicórum David.'
  "16": 'Pépigit ergo Iónathas fœdus cum domo David: et requisívit Dóminus de manu inimicórum David.'
  "17": 'Et áddidit Iónathas deieráre David, eo quod dilígeret illum: sicut enim ánimam suam, ita diligébat eum.'
  "18": 'Dixítque ad eum Iónathas: Cras caléndæ sunt, et requiréris:'
  "19": requirétur enim séssio tua usque peréndie. Descéndes ergo festínus, et vénies in locum ubi celándus es in die qua operári licet, et sedébis iuxta lápidem, cui nomen est Ezel.
  "20": Et ego tres sagíttas mittam iuxta eum, et iáciam quasi exércens me ad signum.
  "21": 'Mittam quoque et púerum, dicens ei: Vade, et affer mihi sagíttas.'
  "22": 'Si díxero púero: Ecce sagíttæ intra te sunt, tolle eas: tu veni ad me, quia pax tibi est, et nihil est mali, vivit Dóminus. Si autem sic locútus fúero púero: Ecce sagíttæ ultra te sunt: vade in pace, quia dimísit te Dóminus.'
  "23": De verbo autem quod locúti sumus ego et tu, sit Dóminus inter me et te usque in sempitérnum.
  "24": Abscónditus est ergo David in agro, et venérunt caléndæ, et sedit rex ad comedéndum panem.
  "25": 'Cumque sedísset rex super cáthedram suam (secúndum consuetúdinem) quæ erat iuxta paríetem, surréxit Iónathas, et sedit Abner ex látere Saul: vacuúsque appáruit locus David.'
  "26": 'Et non est locútus Saul quidquam in die illa: cogitábat enim quod forte evenísset ei, ut non esset mundus, nec purificátus.'
  "27": 'Cumque illuxísset dies secúnda post caléndas, rursus appáruit vácuus locus David. Dixítque Saul ad Iónathan fílium suum: Cur non venit fílius Isai nec heri, nec hódie ad vescéndum?'
  "28": 'Respondítque Iónathas Sauli: Rogávit me obníxe, ut iret in Béthlehem,'
  "29": 'et ait: Dimítte me, quóniam sacrifícium solémne est in civitáte, unus de frátribus meis accersívit me: nunc ergo si invéni grátiam in óculis tuis, vadam cito, et vidébo fratres meos. Ob hanc causam non venit ad mensam regis.'
  "30": 'Irátus autem Saul advérsum Iónathan, dixit ei: Fili mulíeris virum ultro rapiéntis, numquid ignóro quia díligis fílium Isai in confusiónem tuam, et in confusiónem ignominiósæ matris tuæ?'
  "31": 'Omnibus enim diébus quibus fílius Isai víxerit super terram, non stabiliéris tu, neque regnum tuum. Itaque iam nunc mitte, et adduc eum ad me: quia fílius mortis est.'
  "32": 'Respóndens autem Iónathas Sauli patri suo, ait: Quare moriétur? quid fecit?'
  "33": Et arrípuit Saul lánceam ut percúteret eum. Et intelléxit Iónathas quod definítum esset a patre suo, ut interfíceret David.
  "34": Surréxit ergo Iónathas a mensa in ira furóris, et non comédit in die calendárum secúnda panem. Contristátus est enim super David, eo quod confudísset eum pater suus.
  "35": Cumque illuxísset mane, venit Iónathas in agrum iuxta plácitum David, et puer párvulus cum eo.
  "36": 'Et ait ad púerum suum: Vade, et affer mihi sagíttas, quas ego iácio. Cumque puer cucurrísset, iecit áliam sagíttam trans púerum.'
  "37": 'Venit ítaque puer ad locum iáculi, quod míserat Iónathas: et clamávit Iónathas post tergum púeri, et ait: Ecce ibi est sagítta porro ultra te.'
  "38": 'Clamavítque íterum Iónathas post tergum púeri, dicens: Festína velóciter, ne stéteris. Collégit autem puer Iónathæ sagíttas, et áttulit ad dóminum suum:'
  "39": 'et quid agerétur, pénitus ignorábat: tantúmmodo enim Iónathas et David rem nóverant.'
  "40": 'Dedit ergo Iónathas arma sua púero, et dixit ei: Vade, et defer in civitátem.'
  "41": 'Cumque abiísset puer, surréxit David de loco, qui vergébat ad austrum, et cadens pronus in terram, adorávit tértio: et osculántes se altérutrum, flevérunt páriter, David autem ámplius.'
  "42": 'Dixit ergo Iónathas ad David: Vade in pace: quæcúmque iurávimus ambo in nómine Dómini, dicéntes: Dóminus sit inter me et te, et inter semen meum et semen tuum usque in sempitérnum.'
  "43": 'Et surréxit David, et ábiit: sed et Iónathas ingréssus est civitátem.'
