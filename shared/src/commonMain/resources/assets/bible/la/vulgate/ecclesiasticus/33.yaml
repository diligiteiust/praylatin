bible: vulgate
lang: la
language: Latina
book: Ecclesiasticus
chapter: "33"
verses:
  "1": 'Timénti Dóminum non occúrrent mala: sed in tentatióne Deus illum conservábit, et liberábit a malis.'
  "2": Sápiens non odit mandáta et iustítias, et non illidétur quasi in procélla navis.
  "3": Homo sensátus credit legi Dei, et lex illi fidélis.
  "4": Qui interrogatiónem maniféstat, parábit verbum, et sic deprecátus exaudiétur, et conservábit disciplínam, et tunc respondébit.
  "5": Præcórdia fátui quasi rota carri, et quasi axis versátilis cogitátus illíus.
  "6": Equus emissárius, sic et amícus subsannátor, sub omni supra sedénte hinnit.
  "7": Quare dies diem súperat, et íterum lux lucem, et annus annum a sole?
  "8": A Dómini sciéntia separáti sunt, facto sole, et præcéptum custodiénte.
  "9": Et immutávit témpora, et dies festos ipsórum, et in illis dies festos celebravérunt ad horam.
  "10": 'Ex ipsis exaltávit et magnificávit Deus, et ex ipsis pósuit in númerum diérum: et omnes hómines de solo, et ex terra, unde creátus est Adam.'
  "11": In multitúdine disciplínæ Dóminus separávit eos, et immutávit vias eórum.
  "12": 'Ex ipsis benedíxit et exaltávit, et ex ipsis sanctificávit, et ad se applicávit: et ex ipsis maledíxit, et humiliávit, et convértit illos a separatióne ipsórum.'
  "13": Quasi lutum fíguli in manu ipsíus, plasmáre illud et dispónere.
  "14": 'Omnes viæ eius secúndum dispositiónem eius: sic homo in manu illíus qui se fecit, et reddet illi secúndum iudícium suum.'
  "15": 'Contra malum bonum est, et contra mortem vita: sic et contra virum iustum peccátor. Et sic intuére in ómnia ópera Altíssimi. Duo et duo, et unum contra unum.'
  "16": Et ego novíssimus evigilávi, et quasi qui cólligit ácinos post vindemiatóres.
  "17": 'In benedictióne Dei et ipse sperávi: et quasi qui vindémiat, replévi tórcular.'
  "18": Respícite quóniam non mihi soli laborávi, sed ómnibus exquiréntibus disciplínam.
  "19": 'Audíte me magnátes, et omnes pópuli: et rectóres ecclésiæ, áuribus percípite.'
  "20": 'Fílio et mulíeri, fratri et amíco, non des potestátem super te in vita tua: et non déderis álii possessiónem tuam, ne forte pœníteat te, et deprecéris pro illis.'
  "21": Dum adhuc súperes et aspíras, non immutábit te omnis caro.
  "22": Mélius est enim ut fílii tui te rogent, quam te respícere in manus filiórum tuórum.
  "23": In ómnibus opéribus tuis præcéllens esto.
  "24": Ne déderis máculam in glória tua. In die consummatiónis diérum vitæ tuæ, et in témpore éxitus tui distríbue hereditátem tuam.
  "25": 'Cibária, et virga, et onus ásino: panis, et disciplína, et opus servo.'
  "26": 'Operátur in disciplína, et quærit requiéscere: laxa manus illi, et quærit libertátem.'
  "27": Iugum et lorum curvant collum durum, et servum inclínant operatiónes assíduæ.
  "28": 'Servo malévolo tortúra et cómpedes: mitte illum in operatiónem, ne vacet:'
  "29": multam enim malítiam dócuit otiósitas.
  "30": 'In ópera constítue eum: sic enim cóndecet illum. Quod si non obaudíerit, curva illum compédibus, et non amplífices super omnem carnem: verum sine iudício nihil fácias grave.'
  "31": 'Si est tibi servus fidélis, sit tibi quasi ánima tua: quasi fratrem sic eum tracta, quóniam in sánguine ánimæ comparásti illum.'
  "32": 'Si lǽseris eum iniúste, in fugam convertétur:'
  "33": 'et si extóllens discésserit: quem quæras, et in qua via quæras illum, nescis.'
