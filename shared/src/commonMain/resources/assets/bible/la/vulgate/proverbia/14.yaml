bible: vulgate
lang: la
language: Latina
book: Proverbia
chapter: "14"
verses:
  "1": 'Sápiens múlier ædíficat domum suam: insípiens exstrúctam quoque mánibus déstruet.'
  "2": Ambulans recto itínere, et timens Deum, despícitur ab eo, qui infámi gráditur via.
  "3": 'In ore stulti virga supérbiæ: lábia autem sapiéntium custódiunt eos.'
  "4": 'Ubi non sunt boves, præsépe vácuum est: ubi autem plúrimæ ségetes, ibi manifésta est fortitúdo bovis.'
  "5": 'Testis fidélis non mentítur: profert autem mendácium dolósus testis.'
  "6": 'Quærit derísor sapiéntiam, et non ínvenit: doctrína prudéntium fácilis.'
  "7": Vade contra virum stultum, et nescit lábia prudéntiæ.
  "8": 'Sapiéntia cállidi est intellígere viam suam: et imprudéntia stultórum errans.'
  "9": Stultus illúdet peccátum, et inter iustos morábitur grátia.
  "10": Cor quod novit amaritúdinem ánimæ suæ, in gáudio eius non miscébitur extráneus.
  "11": 'Domus impiórum delébitur: tabernácula vero iustórum germinábunt.'
  "12": 'Est via, quæ vidétur hómini iusta: novíssima autem eius dedúcunt ad mortem.'
  "13": Risus dolóre miscébitur, et extréma gáudii luctus óccupat.
  "14": Viis suis replébitur stultus, et super eum erit vir bonus.
  "15": 'Innocens credit omni verbo: astútus consíderat gressus suos. Fílio dolóso nihil erit boni: servo autem sapiénti prósperi erunt actus, et dirigétur via eius.'
  "16": 'Sápiens timet, et declínat a malo: stultus tránsilit, et confídit.'
  "17": 'Impátiens operábitur stultítiam: et vir versútus odiósus est.'
  "18": Possidébunt párvuli stultítiam, et exspectábunt astúti sciéntiam.
  "19": 'Iacébunt mali ante bonos: et ímpii ante portas iustórum.'
  "20": 'Etiam próximo suo pauper odiósus erit: amíci vero dívitum multi.'
  "21": 'Qui déspicit próximum suum peccat: qui autem miserétur páuperis beátus erit. Qui credit in Dómino, misericórdiam díligit.'
  "22": 'Errant qui operántur malum: misericórdia et véritas prǽparant bona.'
  "23": 'In omni ópere erit abundántia: ubi autem verba sunt plúrima, ibi frequénter egéstas.'
  "24": 'Coróna sapiéntium, divítiæ eórum: fatúitas stultórum, imprudéntia.'
  "25": 'Líberat ánimas testis fidélis: et profert mendácia versipéllis.'
  "26": In timóre Dómini fidúcia fortitúdinis, et fíliis eius erit spes.
  "27": Timor Dómini fons vitæ, ut declínent a ruína mortis.
  "28": 'In multitúdine pópuli dígnitas regis: et in paucitáte plebis ignomínia príncipis.'
  "29": 'Qui pátiens est, multa gubernátur prudéntia: qui autem impátiens est, exáltat stultítiam suam.'
  "30": 'Vita cárnium, sánitas cordis: putrédo óssium, invídia.'
  "31": 'Qui calumniátur egéntem, éxprobrat factóri eius: honórat autem eum, qui miserétur páuperis.'
  "32": 'In malítia sua expellétur ímpius: sperat autem iustus in morte sua.'
  "33": In corde prudéntis requiéscit sapiéntia, et indóctos quosque erúdiet.
  "34": 'Iustítia élevat gentem: míseros autem facit pópulos peccátum.'
  "35": 'Accéptus est regi miníster intélligens: iracúndiam eius inútilis sustinébit.'
