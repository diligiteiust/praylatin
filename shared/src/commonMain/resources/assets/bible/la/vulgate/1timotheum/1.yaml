bible: vulgate
lang: la
language: Latina
book: ad Timotheum I
chapter: "1"
verses:
  "1": Paulus Apóstolus Iesu Christi secúndum impérium Dei Salvatóris nostri, et Christi Iesu spei nostræ,
  "2": Timótheo dilécto fílio in fide. Grátia, misericórdia, et pax a Deo Patre, et Christo Iesu Dómino nostro.
  "3": Sicut rogávi te ut remanéres Ephesi cum irem in Macedóniam, ut denuntiáres quibúsdam ne áliter docérent,
  "4": 'neque inténderent fábulis, et genealógiis interminátis: quæ quæstiónes præstant magis quam ædificatiónem Dei, quæ est in fide.'
  "5": Finis autem præcépti est cáritas de corde puro, et consciéntia bona, et fide non ficta.
  "6": A quibus quidam aberrántes, convérsi sunt in vanilóquium,
  "7": voléntes esse legis doctóres, non intelligéntes neque quæ loquúntur, neque de quibus affírmant.
  "8": 'Scimus autem quia bona est lex si quis ea legítime utátur:'
  "9": sciens hoc quia lex iusto non est pósita, sed iniústis, et non súbditis, ímpiis, et peccatóribus, scelerátis, et contaminátis, parricídis, et matricídis, homicídis,
  "10": fornicáriis, masculórum concubitóribus, plagiáriis, mendácibus, et periúris, et si quid áliud sanæ doctrínæ adversátur,
  "11": quæ est secúndum Evangélium glóriæ beáti Dei, quod créditum est mihi.
  "12": 'Grátias ago ei, qui me confortávit, Christo Iesu Dómino nostro, quia fidélem me existimávit, ponens in ministério:'
  "13": 'qui prius blasphémus fui, et persecútor, et contumeliósus: sed misericórdiam Dei consecútus sum, quia ignórans feci in incredulitáte.'
  "14": Superabundávit autem grátia Dómini nostri cum fide, et dilectióne, quæ est in Christo Iesu.
  "15": 'Fidélis sermo, et omni acceptióne dignus: quod Christus Iesus venit in hunc mundum peccatóres salvos fácere, quorum primus ego sum.'
  "16": 'Sed ídeo misericórdiam consecútus sum: ut in me primo osténderet Christus Iesus omnem patiéntiam ad informatiónem eórum, qui creditúri sunt illi, in vitam ætérnam.'
  "17": Regi autem sæculórum immortáli, invisíbili, soli Deo honor, et glória in sǽcula sæculórum. Amen.
  "18": Hoc præcéptum comméndo tibi fili Timóthee, secúndum præcedéntes in te prophetías, ut mílites in illis bonam milítiam,
  "19": 'habens fidem, et bonam consciéntiam, quam quidam repelléntes, circa fidem naufragavérunt:'
  "20": 'ex quibus est Hymenǽus, et Alexánder: quos trádidi Sátanæ, ut discant non blasphemáre.'
