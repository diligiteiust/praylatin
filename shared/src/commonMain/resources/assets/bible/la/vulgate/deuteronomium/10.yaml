bible: vulgate
lang: la
language: Latina
book: Deuteronomium
chapter: "10"
verses:
  "1": 'In témpore illo dixit Dóminus ad me: Dola tibi duas tábulas lapídeas, sicut prióres fuérunt, et ascénde ad me in montem: faciésque arcam lígneam,'
  "2": et scribam in tábulis verba quæ fuérunt in his, quas ante confregísti, ponésque eas in arca.
  "3": Feci ígitur arcam de lignis setim. Cumque dolássem duas tábulas lapídeas instar priórum, ascéndi in montem, habens eas in mánibus.
  "4": 'Scripsítque in tábulis, iuxta id quod prius scrípserat, verba decem, quæ locútus est Dóminus ad vos in monte de médio ignis, quando pópulus congregátus est: et dedit eas mihi.'
  "5": Reversúsque de monte, descéndi, et pósui tábulas in arcam, quam féceram, quæ hucúsque ibi sunt, sicut mihi præcépit Dóminus.
  "6": Fílii autem Israel movérunt castra ex Beroth filiórum Iacan in Moséra, ubi Aaron mórtuus ac sepúltus est, pro quo sacerdótio functus est Eleázar fílius eius.
  "7": 'Inde venérunt in Gadgad: de quo loco profécti, castrametáti sunt in Ietébatha, in terra aquárum atque torréntium.'
  "8": Eo témpore separávit tribum Levi, ut portáret arcam fœ́deris Dómini, et staret coram eo in ministério, ac benedíceret in nómine illíus usque in præséntem diem.
  "9": 'Quam ob rem non hábuit Levi partem, neque possessiónem cum frátribus suis: quia ipse Dóminus posséssio eius est, sicut promísit ei Dóminus Deus tuus.'
  "10": 'Ego autem steti in monte, sicut prius, quadragínta diébus ac nóctibus: exaudivítque me Dóminus étiam hac vice, et te pérdere nóluit.'
  "11": 'Dixítque mihi: Vade, et præcéde pópulum, ut ingrediátur, et possídeat terram, quam iurávi pátribus eórum ut tráderem eis.'
  "12": 'Et nunc Israel, quid Dóminus Deus tuus petit a te, nisi ut tímeas Dóminum Deum tuum, et ámbules in viis eius, et díligas eum, ac sérvias Dómino Deo tuo in toto corde tuo, et in tota ánima tua:'
  "13": custodiásque mandáta Dómini, et cæremónias eius, quas ego hódie præcípio tibi, ut bene sit tibi?
  "14": 'En Dómini Dei tui cælum est, et cælum cæli, terra, et ómnia quæ in ea sunt:'
  "15": et tamen pátribus tuis conglutinátus est Dóminus, et amávit eos, elegítque semen eórum post eos, id est vos, de cunctis géntibus, sicut hódie comprobátur.
  "16": 'Circumcídite ígitur præpútium cordis vestri, et cervícem vestram ne indurétis ámplius:'
  "17": quia Dóminus Deus vester ipse est Deus deórum, et Dóminus dominántium, Deus magnus, et potens, et terríbilis, qui persónam non áccipit, nec múnera.
  "18": Facit iudícium pupíllo et víduæ, amat peregrínum, et dat ei victum atque vestítum.
  "19": Et vos ergo amáte peregrínos, quia et ipsi fuístis ádvenæ in terra Ægýpti.
  "20": 'Dóminum Deum tuum timébis, et ei soli sérvies: ipsi adhærébis, iurabísque in nómine illíus.'
  "21": Ipse est laus tua, et Deus tuus, qui fecit tibi hæc magnália et terribília, quæ vidérunt óculi tui.
  "22": In septuagínta animábus descendérunt patres tui in Ægýptum, et ecce nunc multiplicávit te Dóminus Deus tuus sicut astra cæli.
