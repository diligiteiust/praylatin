bible: vulgate
lang: la
language: Latina
book: II Samuelis
chapter: "10"
verses:
  "1": Factum est autem post hæc ut morerétur rex filiórum Ammon, et regnávit Hanon fílius eius pro eo.
  "2": 'Dixítque David: Fáciam misericórdiam cum Hanon fílio Naas, sicut fecit pater eius mecum misericórdiam. Misit ergo David, consólans eum per servos suos super patris intéritu. Cum autem veníssent servi David in terram filiórum Ammon,'
  "3": 'dixérunt príncipes filiórum Ammon ad Hanon dóminum suum: Putas quod propter honórem patris tui míserit David ad te consolatóres, et non ídeo ut investigáret, et exploráret civitátem, et evérteret eam, misit David servos suos ad te?'
  "4": Tulit ítaque Hanon servos David, rasítque dimídiam partem barbæ eórum, et prǽscidit vestes eórum médias usque ad nates, et dimísit eos.
  "5": 'Quod cum nuntiátum esset David, misit in occúrsum eórum: erant enim viri confúsi túrpiter valde, et mandávit eis David: Manéte in Iéricho donec crescat barba vestra, et tunc revertímini.'
  "6": Vidéntes autem fílii Ammon quod iniúriam fecíssent David, misérunt, et conduxérunt mercéde Syrum Rohob, et Syrum Soba, vigínti míllia péditum, et a rege Máacha mille viros, et ab Istob duódecim míllia virórum.
  "7": Quod cum audísset David, misit Ioab et omnem exércitum bellatórum.
  "8": 'Egréssi sunt ergo fílii Ammon, et direxérunt áciem ante ipsum intróitum portæ: Syrus autem Soba, et Rohob, et Istob, et Máacha, seórsum erant in campo.'
  "9": 'Videns ígitur Ioab quod præparátum esset advérsum se prœ́lium, et ex advérso et post tergum, elégit ex ómnibus eléctis Israel, et instrúxit áciem contra Syrum:'
  "10": réliquam autem partem pópuli trádidit Abísai fratri suo, qui diréxit áciem advérsus fílios Ammon.
  "11": 'Et ait Ioab: Si prævalúerint advérsum me Syri, eris mihi in adiutórium: si autem fílii Ammon prævalúerint advérsum te, auxiliábor tibi.'
  "12": 'Esto vir fortis, et pugnémus pro pópulo nostro, et civitáte Dei nostri: Dóminus autem fáciet quod bonum est in conspéctu suo.'
  "13": 'Iniit ítaque Ioab, et pópulus qui erat cum eo, certámen contra Syros: qui statim fugérunt a fácie eius.'
  "14": 'Fílii autem Ammon vidéntes quia fugíssent Syri, fugérunt et ipsi a fácie Abísai, et ingréssi sunt civitátem: reversúsque est Ioab a fíliis Ammon, et venit Ierúsalem.'
  "15": Vidéntes ígitur Syri quóniam corruíssent coram Israel, congregáti sunt páriter.
  "16": 'Misítque Adarézer, et edúxit Syros, qui erant trans flúvium, et addúxit eórum exércitum: Sobach autem, magíster milítiæ Adarézer, erat princeps eórum.'
  "17": 'Quod cum nuntiátum esset David, contráxit omnem Israélem, et transívit Iordánem, venítque in Helam: et direxérunt áciem Syri ex advérso David, et pugnavérunt contra eum.'
  "18": 'Fugerúntque Syri a fácie Israel, et occídit David de Syris septingéntos currus, et quadragínta míllia équitum: et Sobach príncipem milítiæ percússit, qui statim mórtuus est.'
  "19": 'Vidéntes autem univérsi reges, qui erant in præsídio Adarézer, se victos esse ab Israel, expavérunt, et fugérunt quinquagínta et octo míllia coram Israel. Et fecérunt pacem cum Israel, et serviérunt eis: timuerúntque Syri auxílium præbére ultra fíliis Ammon.'
