bible: vulgate
lang: la
language: Latina
book: Ioannes
chapter: "9"
verses:
  "1": 'Et prætériens Iesus vidit hóminem cæcum a nativitáte:'
  "2": 'et interrogavérunt eum discípuli eius: Rabbi, quis peccávit, hic, aut paréntes eius, ut cæcus nascerétur?'
  "3": 'Respóndit Iesus: Neque hic peccávit, neque paréntes eius: sed ut manifesténtur ópera Dei in illo.'
  "4": 'Me opórtet operári ópera eius, qui misit me, donec dies est: venit nox, quando nemo potest operári.'
  "5": Quámdiu sum in mundo, lux sum mundi.
  "6": Hæc cum dixísset, éxspuit in terram, et fecit lutum ex sputo, et linívit lutum super óculos eius,
  "7": 'et dixit ei: Vade, lava in natatória Síloe (quod interpretátur Missus). Abiit ergo, et lavit, et venit videns.'
  "8": 'Itaque vicíni, et qui víderant eum prius quia mendícus erat, dicébant: Nonne hic est, qui sedébat, et mendicábat? Alii dicébant: Quia hic est.'
  "9": 'Alii autem: Nequáquam, sed símilis est ei. Ille vero dicébat: Quia ego sum.'
  "10": 'Dicébant ergo ei: Quómodo apérti sunt tibi óculi?'
  "11": 'Respóndit: Ille homo qui dícitur Iesus, lutum fecit: et unxit óculos meos, et dixit mihi: Vade ad natatória Síloe, et lava. Et ábii, et lavi, et vídeo.'
  "12": 'Et dixérunt ei: Ubi est ille? Ait: Néscio.'
  "13": Addúcunt eum ad Pharisǽos, qui cæcus fúerat.
  "14": Erat autem sábbatum quando lutum fecit Iesus, et apéruit óculos eius.
  "15": 'Iterum ergo interrogábant eum Pharisǽi quómodo vidísset. Ille autem dixit eis: Lutum mihi pósuit super óculos, et lavi, et vídeo.'
  "16": 'Dicébant ergo ex Pharisǽis quidam: Non est hic homo a Deo, qui sábbatum non custódit. Alii autem dicébant: Quómodo potest homo peccátor hæc signa fácere? Et schisma erat inter eos.'
  "17": 'Dicunt ergo cæco íterum: Tu quid dicis de illo, qui apéruit óculos tuos? Ille autem dixit: Quia prophéta est.'
  "18": 'Non credidérunt ergo Iudǽi de illo, quia cæcus fuísset et vidísset, donec vocavérunt paréntes eius, qui víderat:'
  "19": 'et interrogavérunt eos, dicéntes: Hic est fílius vester, quem vos dícitis quia cæcus natus est? quómodo ergo nunc videt?'
  "20": 'Respondérunt eis paréntes eius, et dixérunt: Scimus quia hic est fílius noster, et quia cæcus natus est:'
  "21": 'quómodo autem nunc vídeat, nescímus: aut quis eius apéruit óculos, nos nescímus: ipsum interrogáte: ætátem habet, ipse de se loquátur.'
  "22": 'Hæc dixérunt paréntes eius, quóniam timébant Iudǽos: iam enim conspiráverant Iudǽi, ut si quis eum confiterétur esse Christum, extra synagógam fíeret.'
  "23": 'Proptérea paréntes eius dixérunt: Quia ætátem habet, ipsum interrogáte.'
  "24": 'Vocavérunt ergo rursum hóminem, qui fúerat cæcus, et dixérunt ei: Da glóriam Deo: nos scimus quia hic homo peccátor est.'
  "25": 'Dixit ergo eis ille: Si peccátor est, néscio: unum scio, quia cæcus cum essem, modo vídeo.'
  "26": 'Dixérunt ergo illi: Quid fecit tibi? quómodo apéruit tibi óculos?'
  "27": 'Respóndit eis: Dixi vobis iam, et audístis: quid íterum vultis audíre? numquid et vos vultis discípuli eius fíeri?'
  "28": 'Maledixérunt ergo ei, et dixérunt: Tu discípulus illíus sis: nos autem Móysi discípuli sumus.'
  "29": 'Nos scimus quia Móysi locútus est Deus: hunc autem nescímus unde sit.'
  "30": 'Respóndit ille homo, et dixit eis: In hoc enim mirábile est quia vos nescítis unde sit, et apéruit meos óculos:'
  "31": 'scimus autem quia peccatóres Deus non audit: sed si quis Dei cultor est, et voluntátem eius facit, hunc exáudit.'
  "32": A sǽculo non est audítum quia quis apéruit óculos cæci nati.
  "33": Nisi esset hic a Deo, non póterat fácere quidquam.
  "34": 'Respondérunt, et dixérunt ei: In peccátis natus es totus, et tu doces nos? Et eiecérunt eum foras.'
  "35": 'Audívit Iesus quia eiecérunt eum foras: et cum invenísset eum, dixit ei: Tu credis in Fílium Dei?'
  "36": 'Respóndit ille, et dixit: Quis est, Dómine, ut credam in eum?'
  "37": 'Et dixit ei Iesus: Et vidísti eum, et qui lóquitur tecum, ipse est.'
  "38": 'At ille ait: Credo Dómine. Et prócidens adorávit eum.'
  "39": 'Et dixit Iesus: In iudícium ego in hunc mundum veni: ut qui non vident vídeant, et qui vident cæci fiant.'
  "40": 'Et audiérunt quidam ex Pharisǽis, qui cum ipso erant, et dixérunt ei: Numquid et nos cæci sumus?'
  "41": 'Dixit eis Iesus: Si cæci essétis, non haberétis peccátum: nunc vero dícitis: Quia vidémus. Peccátum vestrum manet.'
