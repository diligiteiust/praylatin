bible: vulgate
lang: la
language: Latina
book: Zacharias
chapter: "14"
verses:
  "1": Ecce vénient dies Dómini, et dividéntur spólia tua in médio tui.
  "2": 'Et congregábo omnes gentes ad Ierúsalem in prœ́lium: et capiétur cívitas, et vastabúntur domus, et mulíeres violabúntur: et egrediétur média pars civitátis in captivitátem, et réliquum pópuli non auferétur ex urbe.'
  "3": Et egrediétur Dóminus, et prœliábitur contra gentes illas, sicut prœliátus est in die certáminis.
  "4": 'Et stabunt pedes eius in die illa super montem Olivárum, qui est contra Ierúsalem ad oriéntem: et scindétur mons Olivárum ex média parte sui ad oriéntem, et ad occidéntem prærúpto grandi valde, et separábitur médium montis ad aquilónem, et médium eius ad merídiem.'
  "5": 'Et fugiétis ad vallem móntium eórum, quóniam coniungétur vallis móntium usque ad próximum: et fugiétis sicut fugístis a fácie terræmótus in diébus Ozíæ regis Iuda: et véniet Dóminus Deus meus, omnésque sancti cum eo.'
  "6": 'Et erit in die illa: non erit lux, sed frigus et gelu.'
  "7": 'Et erit dies una, quæ nota est Dómino, non dies neque nox: et in témpore vésperi erit lux.'
  "8": 'Et erit in die illa: exíbunt aquæ vivæ de Ierúsalem: médium eárum ad mare orientále, et médium eárum ad mare novíssimum: in æstáte et in híeme erunt.'
  "9": 'Et erit Dóminus rex super omnem terram: in die illa erit Dóminus unus, et erit nomen eius unum.'
  "10": 'Et revertétur omnis terra usque ad desértum, de colle Remmon ad austrum Ierúsalem: et exaltábitur, et habitábit in loco suo a porta Béniamin usque ad locum portæ prióris, et usque ad portam angulórum: et a turre Hanáneel usque ad torculária regis.'
  "11": 'Et habitábunt in ea, et anáthema non erit ámplius: sed sedébit Ierúsalem secúra.'
  "12": 'Et hæc erit plaga, qua percútiet Dóminus omnes gentes, quæ pugnavérunt advérsus Ierúsalem: tabéscet caro uniuscuiúsque stantis super pedes suos, et óculi eius contabéscent in foramínibus suis, et lingua eórum contabéscet in ore suo.'
  "13": 'In die illa erit tumúltus Dómini magnus in eis: et apprehéndet vir manum próximi sui, et conserétur manus eius super manum próximi sui.'
  "14": 'Sed et Iudas pugnábit advérsus Ierúsalem: et congregabúntur divítiæ ómnium géntium in circúitu, aurum, et argéntum, et vestes multæ satis.'
  "15": Et sic erit ruína equi, et muli, et caméli, et ásini, et ómnium iumentórum, quæ fúerint in castris illis, sicut ruína hæc.
  "16": Et omnes, qui réliqui fúerint de univérsis géntibus, quæ venérunt contra Ierúsalem, ascéndent ab anno in annum, ut adórent regem, Dóminum exercítuum, et célebrent festivitátem tabernaculórum.
  "17": 'Et erit: qui non ascénderit de famíliis terræ ad Ierúsalem ut adóret regem, Dóminum exercítuum, non erit super eos imber.'
  "18": 'Quod etsi família Ægýpti non ascénderit, et non vénerit: nec super eos erit, sed erit ruína, qua percútiet Dóminus omnes gentes, quæ non ascénderint ad celebrándam festivitátem tabernaculórum.'
  "19": Hoc erit peccátum Ægýpti, et hoc peccátum ómnium géntium, quæ non ascénderint ad celebrándam festivitátem tabernaculórum.
  "20": 'In die illa erit quod super frenum equi est, sanctum Dómino: et erunt lebétes in domo Dómini quasi phíalæ coram altári.'
  "21": 'Et erit omnis lebes in Ierúsalem, et in Iuda sanctificátus Dómino exercítuum: et vénient omnes immolántes, et sument ex eis, et coquent in eis: et non erit mercátor ultra in domo Dómini exercítuum in die illo.'
