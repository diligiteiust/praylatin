bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "10"
verses:
  "1": In finem, Psalmus David.
  "2": 'In Dómino confído: quómodo dícitis ánimæ meæ: Tránsmigra in montem sicut passer?'
  "3": 'Quóniam ecce peccatóres intendérunt arcum: paravérunt sagíttas suas in pháretra, ut sagíttent in obscúro rectos corde:'
  "4": 'quóniam quæ perfecísti destruxérunt: iustus autem quid fecit?'
  "5": 'Dóminus in templo sancto suo: Dóminus in cælo sedes eius. Oculi eius in páuperem respíciunt: pálpebræ eius intérrogant fílios hóminum.'
  "6": 'Dóminus intérrogat iustum et ímpium: qui autem díligit iniquitátem, odit ánimam suam.'
  "7": 'Pluet super peccatóres láqueos: ignis, et sulphur, et spíritus procellárum, pars cálicis eórum.'
  "8": 'Quóniam iustus Dóminus, et iustítias diléxit: æquitátem vidit vultus eius.'
