bible: vulgate
lang: la
language: Latina
book: Iudicum
chapter: "12"
verses:
  "1": 'Ecce autem in Ephraim orta est sedítio: nam transeúntes contra aquilónem, dixérunt ad Iephte: Quare vadens ad pugnam contra fílios Ammon, vocáre nos noluísti, ut pergerémus tecum? ígitur incendémus domum tuam.'
  "2": 'Quibus ille respóndit: Disceptátio erat mihi et pópulo meo contra fílios Ammon véhemens: vocavíque vos, ut præberétis mihi auxílium, et fácere noluístis.'
  "3": Quod cernens, pósui ánimam meam in mánibus meis, transivíque ad fílios Ammon, et trádidit eos Dóminus in manus meas. Quid commérui, ut advérsum me consurgátis in prœ́lium?
  "4": 'Vocátis ítaque ad se cunctis viris Gálaad, pugnábat contra Ephraim: percusserúntque viri Gálaad Ephraim, quia díxerat: Fugitívus est Gálaad de Ephraim, et hábitat in médio Ephraim et Manásse.'
  "5": 'Occupaverúntque Galaadítæ vada Iordánis, per quæ Ephraim reversúrus erat. Cumque venísset ad ea de Ephraim número, fúgiens, atque dixísset: Obsecro ut me transíre permittátis: dicébant ei Galaadítæ: Numquid Ephrathǽus es? quo dicénte: Non sum:'
  "6": 'interrogábant eum: Dic ergo Scíbboleth, quod interpretátur Spica. Qui respondébat, Síbboleth: eádem líttera spicam exprímere non valens. Statímque apprehénsum iugulábant in ipso Iordánis tránsitu. Et cecidérunt in illo témpore de Ephraim quadragínta duo míllia.'
  "7": 'Iudicávit ítaque Iephte Galaadítes Israel sex annis: et mórtuus est, ac sepúltus in civitáte sua Gálaad.'
  "8": 'Post hunc iudicávit Israel Abesan de Béthlehem:'
  "9": 'qui hábuit trigínta fílios, et tótidem fílias, quas emíttens foras, marítis dedit, et eiúsdem númeri fíliis suis accépit uxóres, introdúcens in domum suam. Qui septem annis iudicávit Israel:'
  "10": mortuúsque est, ac sepúltus in Béthlehem.
  "11": 'Cui succéssit Ahíalon Zabulonítes: et iudicávit Israel decem annis:'
  "12": mortuúsque est, ac sepúltus in Zábulon.
  "13": 'Post hunc iudicávit Israel Abdon, fílius Illel, Pharathonítes:'
  "14": 'qui hábuit quadragínta fílios, et trigínta ex eis nepótes, ascendéntes super septuagínta pullos asinárum. Et iudicávit Israel octo annis:'
  "15": mortuúsque est, ac sepúltus in Phárathon terræ Ephraim, in monte Amalec.
