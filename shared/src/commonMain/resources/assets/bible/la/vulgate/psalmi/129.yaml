bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "129"
verses:
  "1": 'Cánticum gráduum. De profúndis clamávi ad te Dómine:'
  "2": Dómine exáudi vocem meam. Fiant aures tuæ intendéntes, in vocem deprecatiónis meæ.
  "3": 'Si iniquitátes observáveris Dómine: Dómine quis sustinébit?'
  "4": 'Quia apud te propitiátio est: et propter legem tuam sustínui te Dómine. Sustínuit ánima mea in verbo eius:'
  "5": sperávit ánima mea in Dómino.
  "6": 'A custódia matutína usque ad noctem: speret Israel in Dómino.'
  "7": 'Quia apud Dóminum misericórdia: et copiósa apud eum redémptio.'
  "8": Et ipse rédimet Israel, ex ómnibus iniquitátibus eius.
