bible: vulgate
lang: la
language: Latina
book: Daniel
chapter: "8"
verses:
  "1": Anno tértio regni Baltássar regis, vísio appáruit mihi. Ego Dániel, post id quod víderam in princípio,
  "2": 'vidi in visióne mea, cum essem in Susis castro, quod est in Ælam regióne: vidi autem in visióne esse me super portam Ulai.'
  "3": 'Et levávi óculus meos, et vidi: et ecce áries unus stabat ante palúdem, habens córnua excélsa, et unum excélsius áltero atque succréscens. Póstea'
  "4": 'vidi aríetem córnibus ventilántem contra occidéntem, et contra aquilónem, et contra merídiem, et omnes béstiæ non póterant resístere ei, neque liberári de manu eius: fecítque secúndum voluntátem suam, et magnificátus est.'
  "5": 'Et ego intelligébam: ecce autem hircus caprárum veniébat ab occidénte super fáciem totíus terræ, et non tangébat terram: porro hircus habébat cornu insígne inter óculos suos.'
  "6": Et venit usque ad aríetem illum cornútum, quem víderam stantem ante portam, et cucúrrit ad eum in ímpetu fortitúdinis suæ.
  "7": 'Cumque appropinquásset prope aríetem, efferátus est in eum, et percússit aríetem: et commínuit duo córnua eius, et non póterat áries resístere ei: cumque eum misísset in terram, conculcávit, et nemo quibat liberáre aríetem de manu eius.'
  "8": 'Hircus autem caprárum magnus factus est nimis: cumque crevísset, fractum est cornu magnum, et orta sunt quátuor córnua subter illud per quátuor ventos cæli.'
  "9": 'De uno autem ex eis egréssum est cornu unum módicum: et factum est grande contra merídiem, et contra oriéntem, et contra fortitúdinem.'
  "10": 'Et magnificátum est usque ad fortitúdinem cæli: et deiécit de fortitúdine, et de stellis, et conculcávit eas.'
  "11": 'Et usque ad príncipem fortitúdinis magnificátum est: et ab eo tulit iuge sacrifícium, et deiécit locum sanctificatiónis eius.'
  "12": 'Robur autem datum est ei contra iuge sacrifícium propter peccáta: et prosternétur véritas in terra, et fáciet, et prosperábitur.'
  "13": 'Et audívi unum de sanctis loquéntem: et dixit unus sanctus álteri néscio cui loquénti: Usquequo vísio, et iuge sacrifícium, et peccátum desolatiónis, quæ facta est: et sanctuárium, et fortitúdo conculcábitur?'
  "14": 'Et dixit ei: Usque ad vésperam et mane, dies duo míllia trecénti: et mundábitur sanctuárium.'
  "15": 'Factum est autem cum vidérem ego Dániel visiónem, et quǽrerem intelligéntiam: ecce stetit in conspéctu meo quasi spécies viri.'
  "16": 'Et audívi vocem viri inter Ulai, et clamávit, et ait: Gábriel fac intellígere istam visiónem.'
  "17": 'Et venit, et stetit iuxta ubi ego stabam: cumque venísset, pavens córrui in fáciem meam, et ait ad me: Intéllige fili hóminis, quóniam in témpore finis complébitur vísio.'
  "18": 'Cumque loquerétur ad me, collápsus sum pronus in terram: et tétigit me, et státuit me in gradu meo,'
  "19": 'dixítque mihi: Ego osténdam tibi quæ futúra sunt in novíssimo maledictiónis: quóniam habet tempus finem suum.'
  "20": Aries, quem vidísti habére córnua, rex Medórum est atque Persárum.
  "21": Porro hircus caprárum, rex Græcórum est, et cornu grande, quod erat inter óculos eius, ipse est rex primus.
  "22": 'Quod autem fracto illo surrexérunt quátuor pro eo: quátuor reges de gente eius consúrgent, sed non in fortitúdine eius.'
  "23": Et post regnum eórum, cum créverint iniquitátes, consúrget rex ímpudens fácie, et intélligens propositiónes.
  "24": 'Et roborábitur fortitúdo eius, sed non in víribus suis: et supra quam credi potest, univérsa vastábit, et prosperábitur, et fáciet. Et interfíciet robústos, et pópulum sanctórum'
  "25": 'secúndum voluntátem suam, et dirigétur dolus in manu eius: et cor suum magnificábit, et in cópia rerum ómnium occídet plúrimos: et contra príncipem príncipum consúrget, et sine manu conterétur.'
  "26": 'Et vísio véspere et mane, quæ dicta est, vera est: tu ergo visiónem signa, quia post multos dies erit.'
  "27": 'Et ego Dániel lángui, et ægrotávi per dies: cumque surrexíssem, faciébam ópera regis, et stupébam ad visiónem, et non erat qui interpretarétur.'
