bible: vulgate
lang: la
language: Latina
book: I Paralipomenon
chapter: "23"
verses:
  "1": Igitur David, senex et plenus diérum, regem constítuit Salomónem fílium suum super Israel.
  "2": Et congregávit omnes príncipes Israel, et sacerdótes atque Levítas.
  "3": 'Numeratíque sunt Levítæ a trigínta annis, et supra: et invénta sunt trigínta octo míllia virórum.'
  "4": 'Ex his elécti sunt, et distribúti in ministérium domus Dómini, vigínti quátuor míllia: præpositórum autem et iúdicum sex míllia.'
  "5": Porro quátuor míllia ianitóres, et tótidem psaltæ, canéntes Dómino in órganis, quæ fécerat ad canéndum.
  "6": Et distríbuit eos David per vices filiórum Levi, Gerson vidélicet, et Caath, et Merári.
  "7": 'Fílii Gerson: Léedan, et Sémei.'
  "8": 'Fílii Léedan: princeps Iáhiel, et Zethan, et Ioel, tres.'
  "9": 'Fílii Sémei: Sálomith, et Hósiel, et Aran, tres: isti príncipes familiárum Léedan.'
  "10": 'Porro fílii Sémei: Leheth, et Ziza, et Iaus, et Baría: isti fílii Sémei, quátuor.'
  "11": 'Erat autem Leheth prior, Ziza secúndus: porro Iaus et Baría non habuérunt plúrimos fílios, et idcírco in una família, unáque domo computáti sunt.'
  "12": 'Fílii Caath: Amram, et Isaar, Hebron, et Oziel, quátuor.'
  "13": 'Fílii Amram: Aaron, et Móyses. Separatúsque est Aaron ut ministráret in Sancto sanctórum, ipse et fílii eius in sempitérnum, et adoléret incénsum Dómino secúndum ritum suum, ac benedíceret nómini eius in perpétuum.'
  "14": Móysi quoque hóminis Dei fílii annumeráti sunt in tribu Levi.
  "15": 'Fílii Móysi: Gersom et Eliézer.'
  "16": 'Fílii Gersom: Súbuel primus.'
  "17": 'Fuérunt autem fílii Eliézer: Rohobía primus: et non erant Eliézer fílii álii. Porro fílii Rohobía multiplicáti sunt nimis.'
  "18": 'Fílii Isaar: Sálomith primus.'
  "19": 'Fílii Hebron: Ieríau primus, Amarías secúndus, Iaháziel tértius, Iécmaam quartus.'
  "20": 'Fílii Oziel: Micha primus, Iesía secúndus.'
  "21": 'Fílii Merári: Móholi, et Musi. Fílii Móholi: Eleázar, et Cis.'
  "22": 'Mórtuus est autem Eleázar, et non hábuit fílios, sed fílias: acceperúntque eas fílii Cis fratres eárum.'
  "23": 'Fílii Musi: Móholi, et Eder, et Iérimoth, tres.'
  "24": Hi fílii Levi in cognatiónibus, et famíliis suis, príncipes per vices, et númerum cápitum singulórum, qui faciébant ópera ministérii domus Dómini, a vigínti annis et supra.
  "25": 'Dixit enim David: Réquiem dedit Dóminus Deus Israel pópulo suo, et habitatiónem Ierúsalem usque in ætérnum.'
  "26": Nec erit offícii Levitárum ut ultra portent tabernáculum, et ómnia vasa eius ad ministrándum.
  "27": Iuxta præcépta quoque David novíssima, supputábitur númerus filiórum Levi a vigínti annis et supra.
  "28": Et erunt sub manu filiórum Aaron in cultum domus Dómini, in vestíbulis, et in éxedris, et in loco purificatiónis, et in sanctuário, et in univérsis opéribus ministérii templi Dómini.
  "29": Sacerdótes autem, super panes propositiónis, et ad símilæ sacrifícium, et ad lágana ázyma, et sartáginem, et ad torréndum, et super omne pondus atque mensúram.
  "30": 'Levítæ vero ut stent mane ad confiténdum, et canéndum Dómino: similitérque ad vésperam'
  "31": tam in oblatióne holocaustórum Dómini, quam in sábbatis et caléndis et solemnitátibus réliquis iuxta númerum, et cæremónias uniuscuiúsque rei, iúgiter coram Dómino.
  "32": Et custódiant observatiónes tabernáculi fœ́deris, et ritum sanctuárii, et observatiónem filiórum Aaron fratrum suórum, ut minístrent in domo Dómini.
