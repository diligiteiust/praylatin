bible: vulgate
lang: la
language: Latina
book: II Regum
chapter: "19"
verses:
  "1": Quæ cum audísset Ezechías rex, scidit vestiménta sua, et opértus est sacco, ingressúsque est domum Dómini.
  "2": Et misit Elíacim præpósitum domus, et Sobnam scribam, et senes de sacerdótibus, opértos saccis, ad Isaíam prophétam fílium Amos.
  "3": 'Qui dixérunt: Hæc dicit Ezechías: Dies tribulatiónis, et increpatiónis, et blasphémiæ dies iste: venérunt fílii usque ad partum, et vires non habet partúriens.'
  "4": 'Si forte áudiat Dóminus Deus tuus univérsa verba Rábsacis, quem misit rex Assyriórum dóminus suus ut exprobráret Deum vivéntem et argúeret verbis, quæ audívit Dóminus Deus tuus: et fac oratiónem pro relíquiis, quæ repértæ sunt.'
  "5": Venérunt ergo servi regis Ezechíæ ad Isaíam.
  "6": 'Dixítque eis Isaías: Hæc dicétis dómino vestro: Hæc dicit Dóminus: Noli timére a fácie sermónum, quos audísti, quibus blasphemavérunt púeri regis Assyriórum me.'
  "7": Ecce ego immíttam ei spíritum, et áudiet núntium, et revertétur in terram suam, et deíciam eum gládio in terra sua.
  "8": 'Revérsus est ergo Rábsaces, et invénit regem Assyriórum expugnántem Lobnam: audíerat enim quod recessísset de Lachis.'
  "9": 'Cumque audísset de Tháraca rege Æthiópiæ, dicéntes: Ecce egréssus est ut pugnet advérsum te: et iret contra eum, misit núntios ad Ezechíam, dicens:'
  "10": 'Hæc dícite Ezechíæ regi Iuda: Non te sedúcat Deus tuus, in quo habes fidúciam, neque dicas: Non tradétur Ierúsalem in manus regis Assyriórum.'
  "11": 'Tu enim ipse audísti quæ fecérunt reges Assyriórum univérsis terris, quómodo vastavérunt eas: num ergo solus póteris liberári?'
  "12": Numquid liberavérunt dii géntium síngulos, quos vastavérunt patres mei, Gozan vidélicet, et Haran, et Reseph, et fílios Eden, qui erant in Thelássar?
  "13": Ubi est rex Emath, et rex Arphad, et rex civitátis Sephárvaim, Ana, et Ava?
  "14": Itaque cum accepísset Ezechías lítteras de manu nuntiórum, et legísset eas, ascéndit in domum Dómini, et expándit eas coram Dómino,
  "15": 'et orávit in conspéctu eius, dicens: Dómine Deus Israel, qui sedes super chérubim, tu es Deus solus regum ómnium terræ: tu fecísti cælum et terram.'
  "16": 'Inclína aurem tuam, et audi: áperi Dómine óculos tuos, et vide: audi ómnia verba Sennácherib, qui misit ut exprobráret nobis Deum vivéntem.'
  "17": Vere Dómine dissipavérunt reges Assyriórum gentes, et terras ómnium.
  "18": 'Et misérunt deos eórum in ignem: non enim erant dii, sed ópera mánuum hóminum, ex ligno et lápide: et perdidérunt eos.'
  "19": Nunc ígitur Dómine Deus noster, salvos nos fac de manu eius, ut sciant ómnia regna terræ, quia tu es Dóminus Deus solus.
  "20": 'Misit autem Isaías fílius Amos ad Ezechíam, dicens: Hæc dicit Dóminus Deus Israel: Quæ deprecátus es me super Sennácherib rege Assyriórum, audívi.'
  "21": 'Iste est sermo, quem locútus est Dóminus de eo: Sprevit te, et subsannávit te virgo fília Sion: post tergum tuum caput movit fília Ierúsalem.'
  "22": Cui exprobrásti, et quem blasphemásti? contra quem exaltásti vocem tuam, et elevásti in excélsum óculos tuos? contra sanctum Israel.
  "23": 'Per manum servórum tuórum exprobrásti Dómino, et dixísti: In multitúdine cúrruum meórum ascéndi excélsa móntium in summitáte Líbani, et succídi sublímes cedros eius, et eléctas abiétes illíus. Et ingréssus sum usque ad términos eius, et saltum Carméli eius'
  "24": ego succídi. Et bibi aquas aliénas, et siccávi vestígiis pedum meórum omnes aquas clausas.
  "25": 'Numquid non audísti quid ab inítio fécerim? Ex diébus antíquis plasmávi illud, et nunc addúxi: erúntque in ruínam cóllium pugnántium civitátes munítæ.'
  "26": 'Et qui sedent in eis, húmiles manu, contremuérunt et confúsi sunt: facti sunt velut fœnum agri, et virens herba tectórum, quæ arefácta est ántequam veníret ad maturitátem.'
  "27": Habitáculum tuum, et egréssum tuum, et intróitum tuum, et viam tuam ego præscívi, et furórem tuum contra me.
  "28": 'Insanísti in me, et supérbia tua ascéndit in aures meas: ponam ítaque círculum in náribus tuis, et camum in lábiis tuis, et redúcam te in viam, per quam venísti.'
  "29": 'Tibi autem Ezechía hoc erit signum: cómede hoc anno quæ repéreris: in secúndo autem anno, quæ sponte nascúntur: porro in tértio anno semináte et métite: plantáte víneas, et comédite fructum eárum.'
  "30": Et quodcúmque réliquum fúerit de domo Iuda, mittet radícem deórsum, et fáciet fructum sursum.
  "31": 'De Ierúsalem quippe egrediéntur relíquiæ, et quod salvétur de monte Sion: zelus Dómini exercítuum fáciet hoc.'
  "32": 'Quam ob rem hæc dicit Dóminus de rege Assyriórum: Non ingrediétur urbem hanc, nec mittet in eam sagíttam, nec occupábit eam clýpeus, nec circúmdabit eam munítio.'
  "33": 'Per viam, qua venit, revertétur: et civitátem hanc non ingrediétur, dicit Dóminus.'
  "34": Protegámque urbem hanc, et salvábo eam propter me, et propter David servum meum.
  "35": 'Factum est ígitur in nocte illa, venit ángelus Dómini, et percússit in castris Assyriórum centum octogínta quinque míllia. Cumque dilúculo surrexísset, vidit ómnia córpora mortuórum: et recédens ábiit,'
  "36": et revérsus est Sennácherib rex Assyriórum, et mansit in Nínive.
  "37": Cumque adoráret in templo Nesroch deum suum, Adrámelech et Sárasar fílii eius percussérunt eum gládio, fugerúntque in terram Armeniórum, et regnávit Asarháddon fílius eius pro eo.
