bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "145"
verses:
  "1": Allelúia, Aggǽi, et Zacharíæ.
  "2": 'Lauda ánima mea Dóminum, laudábo Dóminum in vita mea: psallam Deo meo quámdiu fúero. Nolíte confídere in princípibus,'
  "3": in fíliis hóminum, in quibus non est salus.
  "4": 'Exíbit spíritus eius, et revertétur in terram suam: in illa die períbunt omnes cogitatiónes eórum.'
  "5": 'Beátus, cuius Deus Iacob adiútor eius, spes eius in Dómino Deo ipsíus:'
  "6": qui fecit cælum et terram, mare, et ómnia quæ in eis sunt.
  "7": 'Qui custódit veritátem in sǽculum, facit iudícium iniúriam patiéntibus: dat escam esuriéntibus. Dóminus solvit compedítos:'
  "8": Dóminus illúminat cæcos. Dóminus érigit elísos, Dóminus díligit iustos.
  "9": 'Dóminus custódit ádvenas, pupíllum, et víduam suscípiet: et vias peccatórum dispérdet.'
  "10": Regnábit Dóminus in sǽcula Deus tuus Sion, in generatiónem et generatiónem.
