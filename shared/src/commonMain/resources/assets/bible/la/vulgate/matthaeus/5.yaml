bible: vulgate
lang: la
language: Latina
book: Matthaeus
chapter: "5"
verses:
  "1": Videns autem Iesus turbas, ascéndit in montem, et cum sedísset, accessérunt ad eum discípuli eius,
  "2": 'et apériens os suum docébat eos, dicens:'
  "3": 'Beáti páuperes spíritu: quóniam ipsórum est regnum cælórum.'
  "4": 'Beáti mites: quóniam ipsi possidébunt terram.'
  "5": 'Beáti, qui lugent: quóniam ipsi consolabúntur.'
  "6": 'Beáti, qui esúriunt, et sítiunt iustítiam: quóniam ipsi saturabúntur.'
  "7": 'Beáti misericórdes: quóniam ipsi misericórdiam consequéntur.'
  "8": 'Beáti mundo corde: quóniam ipsi Deum vidébunt.'
  "9": 'Beáti pacífici: quóniam fílii Dei vocabúntur.'
  "10": 'Beáti, qui persecutiónem patiúntur propter iustítiam: quóniam ipsórum est regnum cælórum.'
  "11": 'Beáti estis cum maledíxerint vobis, et persecúti vos fúerint, et díxerint omne malum advérsum vos mentiéntes, propter me:'
  "12": gaudéte, et exsultáte, quóniam merces vestra copiósa est in cælis. Sic enim persecúti sunt prophétas, qui fuérunt ante vos.
  "13": Vos estis sal terræ. Quod si sal evanúerit, in quo saliétur? ad níhilum valet ultra, nisi ut mittátur foras, et conculcétur ab homínibus.
  "14": 'Vos estis lux mundi. Non potest cívitas abscóndi supra montem pósita:'
  "15": neque accéndunt lucérnam, et ponunt eam sub módio, sed super candelábrum, ut lúceat ómnibus qui in domo sunt.
  "16": 'Sic lúceat lux vestra coram homínibus: ut vídeant ópera vestra bona, et gloríficent Patrem vestrum, qui in cælis est.'
  "17": 'Nolíte putáre quóniam veni sólvere legem aut prophétas: non veni sólvere, sed adimplére.'
  "18": Amen quippe dico vobis, donec tránseat cælum et terra, iota unum, aut unus apex non præteríbit a lege, donec ómnia fiant.
  "19": 'Qui ergo sólverit unum de mandátis istis mínimis, et docúerit sic hómines, mínimus vocábitur in regno cælórum: qui autem fécerit et docúerit, hic magnus vocábitur in regno cælórum.'
  "20": Dico enim vobis, quia nisi abundáverit iustítia vestra plus quam scribárum et Pharisæórum, non intrábitis in regnum cælórum.
  "21": 'Audístis quia dictum est antíquis: Non occídes: qui autem occíderit, reus erit iudício.'
  "22": 'Ego autem dico vobis: quia omnis, qui iráscitur fratri suo, reus erit iudício. Qui autem díxerit fratri suo, raca: reus erit concílio. Qui autem díxerit, fátue: reus erit gehénnæ ignis.'
  "23": 'Si ergo offers munus tuum ad altáre, et ibi recordátus fúeris quia frater tuus habet áliquid advérsum te:'
  "24": 'relínque ibi munus tuum ante altáre, et vade prius reconciliári fratri tuo: et tunc véniens ófferes munus tuum.'
  "25": 'Esto conséntiens adversário tuo cito dum es in via cum eo: ne forte tradat te adversárius iúdici, et iudex tradat te minístro: et in cárcerem mittáris.'
  "26": Amen dico tibi, non éxies inde, donec reddas novíssimum quadrántem.
  "27": 'Audístis quia dictum est antíquis: Non mœcháberis.'
  "28": 'Ego autem dico vobis: quia omnis, qui víderit mulíerem ad concupiscéndum eam, iam mœchátus est eam in corde suo.'
  "29": 'Quod si óculus tuus dexter scandalízat te, érue eum, et próice abs te: éxpedit enim tibi ut péreat unum membrórum tuórum, quam totum corpus tuum mittátur in gehénnam.'
  "30": 'Et si dextra manus tua scandalízat te, abscíde eam, et próice abs te: éxpedit enim tibi ut péreat unum membrórum tuórum, quam totum corpus tuum eat in gehénnam.'
  "31": 'Dictum est autem: Quicúmque dimíserit uxórem suam, det ei libéllum repúdii.'
  "32": 'Ego autem dico vobis: quia omnis, qui dimíserit uxórem suam, excépta fornicatiónis causa, facit eam mœchári: et qui dimíssam dúxerit, adúlterat.'
  "33": 'Iterum audístis quia dictum est antíquis: Non periurábis: reddes autem Dómino iuraménta tua.'
  "34": 'Ego autem dico vobis, non iuráre omníno, neque per cælum, quia thronus Dei est:'
  "35": 'neque per terram, quia scabéllum est pedum eius: neque per Ierosólymam, quia cívitas est magni regis:'
  "36": neque per caput tuum iuráveris, quia non potes unum capíllum album fácere, aut nigrum.
  "37": 'Sit autem sermo vester, est, est: non, non: quod autem his abundántius est, a malo est.'
  "38": 'Audístis quia dictum est: Oculum pro óculo, et dentem pro dente.'
  "39": 'Ego autem dico vobis, non resístere malo: sed si quis te percússerit in déxteram maxíllam tuam, præbe illi et álteram:'
  "40": 'et ei, qui vult tecum iudício conténdere, et túnicam tuam tóllere, dimítte ei et pállium:'
  "41": et quicúmque te angariáverit mille passus, vade cum illo et ália duo.
  "42": 'Qui petit a te, da ei: et volénti mutuári a te, ne avertáris.'
  "43": 'Audístis quia dictum est: Díliges próximum tuum, et ódio habébis inimícum tuum.'
  "44": 'Ego autem dico vobis: dilígite inimícos vestros, benefácite his, qui odérunt vos: et oráte pro persequéntibus, et calumniántibus vos:'
  "45": 'ut sitis fílii Patris vestri, qui in cælis est: qui solem suum oríri facit super bonos, et malos: et pluit super iustos, et iniústos.'
  "46": Si enim dilígitis eos, qui vos díligunt, quam mercédem habébitis? nonne et publicáni hoc fáciunt?
  "47": Et si salutavéritis fratres vestros tantum, quid ámplius fácitis? nonne et éthnici hoc fáciunt?
  "48": Estóte ergo vos perfécti, sicut et Pater vester cæléstis perféctus est.
