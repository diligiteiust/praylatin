bible: vulgate
lang: la
language: Latina
book: Iob
chapter: "18"
verses:
  "1": 'Respóndens autem Baldad Suhítes, dixit:'
  "2": Usque ad quem finem verba iactábitis? intellígite prius, et sic loquámur.
  "3": Quare reputáti sumus ut iuménta, et sordúimus coram vobis?
  "4": Qui perdis ánimam tuam in furóre tuo, numquid propter te derelinquétur terra, et transferéntur rupes de loco suo?
  "5": Nonne lux ímpii exstinguétur, nec splendébit flamma ignis eius?
  "6": Lux obtenebréscet in tabernáculo illíus, et lucérna, quæ super eum est, exstinguétur.
  "7": Arctabúntur gressus virtútis eius, et præcipitábit eum consílium suum.
  "8": Immísit enim in rete pedes suos, et in máculis eius ámbulat.
  "9": Tenébitur planta illíus láqueo, et exardéscet contra eum sitis.
  "10": Abscóndita est in terra pédica eius, et decípula illíus super sémitam.
  "11": Undique terrébunt eum formídines, et invólvent pedes eius.
  "12": Attenuétur fame robur eius, et inédia invádat costas illíus.
  "13": 'Dévoret pulchritúdinem cutis eius: consúmat bráchia illíus primogénita mors.'
  "14": Avellátur de tabernáculo suo fidúcia eius, et calcet super eum, quasi rex, intéritus.
  "15": Hábitent in tabernáculo illíus sócii eius, qui non est, aspergátur in tabernáculo eius sulphur.
  "16": Deórsum radíces eius siccéntur, sursum autem atterátur messis eius.
  "17": Memória illíus péreat de terra, et non celebrétur nomen eius in platéis.
  "18": Expéllet eum de luce in ténebras, et de orbe tránsferet eum.
  "19": Non erit semen eius, neque progénies in pópulo suo, nec ullæ relíquiæ in regiónibus eius.
  "20": In die eius stupébunt novíssimi, et primos invádet horror.
  "21": Hæc sunt ergo tabernácula iníqui, et iste locus eius, qui ignórat Deum.
