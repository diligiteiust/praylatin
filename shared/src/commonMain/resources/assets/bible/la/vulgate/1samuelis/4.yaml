bible: vulgate
lang: la
language: Latina
book: I Samuelis
chapter: "4"
verses:
  "1": 'Et factum est in diébus illis, convenérunt Philísthiim in pugnam: et egréssus est Israel óbviam Philísthiim in prœ́lium, et castrametátus est iuxta Lápidem adiutórii. Porro Philísthiim venérunt in Aphec,'
  "2": 'et instruxérunt áciem contra Israel. Inito autem certámine, terga vertit Israel Philisthǽis: et cæsa sunt in illo certámine passim per agros, quasi quátuor míllia virórum.'
  "3": 'Et revérsus est pópulus ad castra: dixerúntque maióres natu de Israel: Quare percússit nos Dóminus hódie coram Philísthiim? afferámus ad nos de Silo arcam fœ́deris Dómini, et véniat in médium nostri, ut salvet nos de manu inimicórum nostrórum.'
  "4": 'Misit ergo pópulus in Silo, et tulérunt inde arcam fœ́deris Dómini exercítuum sedéntis super chérubim: erántque duo fílii Heli cum arca fœ́deris Dei, Ophni et Phínees.'
  "5": Cumque venísset arca fœ́deris Dómini in castra, vociferátus est omnis Israel clamóre grandi, et persónuit terra.
  "6": 'Et audiérunt Philísthiim vocem clamóris, dixerúntque: Quænam est hæc vox clamóris magni in castris Hebræórum? Et cognovérunt quod arca Dómini venísset in castra.'
  "7": 'Timuerúntque Philísthiim, dicéntes: Venit Deus in castra. Et ingemuérunt, dicéntes:'
  "8": 'Væ nobis: non enim fuit tanta exsultátio heri et nudiustértius: væ nobis. Quis nos salvábit de manu deórum sublímium istórum? hi sunt dii, qui percussérunt Ægýptum omni plaga in desérto.'
  "9": 'Confortámini, et estóte viri, Philísthiim: ne serviátis Hebrǽis, sicut et illi serviérunt vobis: confortámini, et belláte.'
  "10": 'Pugnavérunt ergo Philísthiim, et cæsus est Israel, et fugit unusquísque in tabernáculum suum: et facta est plaga magna nimis, et cecidérunt de Israel trigínta míllia péditum.'
  "11": 'Et arca Dei capta est: duo quoque fílii Heli mórtui sunt, Ophni et Phínees.'
  "12": Currens autem vir de Béniamin ex ácie, venit in Silo in die illa, scissa veste, et conspérsus púlvere caput.
  "13": 'Cumque ille venísset, Heli sedébat super sellam contra viam spectans. Erat enim cor eius pavens pro arca Dei. Vir autem ille postquam ingréssus est, nuntiávit urbi: et ululávit omnis cívitas.'
  "14": 'Et audívit Heli sónitum clamóris, dixítque: Quis est hic sónitus tumúltus huius? At ille festinávit, et venit, et nuntiávit Heli.'
  "15": Heli autem erat nonagínta et octo annórum, et óculi eius caligáverant, et vidére non póterat.
  "16": 'Et dixit ad Heli: Ego sum qui veni de prœ́lio, et ego qui de ácie fugi hódie. Cui ille ait: Quid actum est fili mi?'
  "17": 'Respóndens autem ille, qui nuntiábat, Fugit, inquit, Israel coram Philísthiim, et ruína magna facta est in pópulo: ínsuper et duo fílii tui mórtui sunt, Ophni et Phínees, et arca Dei capta est.'
  "18": 'Cumque ille nominásset arcam Dei, cécidit de sella retrórsum iuxta óstium, et fractis cervícibus mórtuus est. Senex enim erat vir et grandǽvus: et ipse iudicávit Israel quadragínta annis.'
  "19": 'Nurus autem eius, uxor Phínees, prægnans erat, vicináque pártui: et audíto núntio quod capta esset arca Dei, et mórtuus esset socer suus, et vir suus, incurvávit se et péperit: irrúerant enim in eam dolóres súbiti.'
  "20": 'In ipso autem moménto mortis eius, dixérunt ei quæ stabant circa eam: Ne tímeas, quia fílium peperísti. Quæ non respóndit eis, neque animadvértit.'
  "21": 'Et vocávit púerum Ichabod, dicens: Transláta est glória de Israel, quia capta est arca Dei, et pro sócero suo et pro viro suo:'
  "22": 'et ait: Transláta est glória ab Israel, eo quod capta esset arca Dei.'
