bible: vulgate
lang: la
language: Latina
book: Proverbia
chapter: "23"
verses:
  "1": 'Quando séderis ut cómedas cum príncipe, diligénter atténde quæ appósita sunt ante fáciem tuam:'
  "2": et státue cultrum in gútture tuo, si tamen habes in potestáte ánimam tuam.
  "3": Ne desíderes de cibis eius, in quo est panis mendácii.
  "4": 'Noli laboráre ut ditéris: sed prudéntiæ tuæ pone modum.'
  "5": 'Ne érigas óculos tuos ad opes, quas non potes habére: quia fácient sibi pennas quasi áquilæ, et volábunt in cælum.'
  "6": 'Ne cómedas cum hómine ínvido, et ne desíderes cibos eius:'
  "7": 'quóniam in similitúdinem aríoli, et coniectóris, ǽstimat quod ignórat. Cómede et bibe, dicet tibi: et mens eius non est tecum.'
  "8": 'Cibos, quos coméderas, évomes: et perdes pulchros sermónes tuos.'
  "9": In áuribus insipiéntium ne loquáris, quia despícient doctrínam elóquii tui.
  "10": 'Ne attíngas parvulórum términos, et agrum pupillórum ne intróeas:'
  "11": propínquus enim illórum fortis est, et ipse iudicábit contra te causam illórum.
  "12": Ingrediátur ad doctrínam cor tuum, et aures tuæ ad verba sciéntiæ.
  "13": 'Noli subtráhere a púero disciplínam: si enim percússeris eum virga, non moriétur.'
  "14": 'Tu virga percúties eum: et ánimam eius de inférno liberábis.'
  "15": 'Fili mi, si sápiens fúerit ánimus tuus, gaudébit tecum cor meum:'
  "16": et exsultábunt renes mei, cum locúta fúerint rectum lábia tua.
  "17": 'Non æmulétur cor tuum peccatóres, sed in timóre Dómini esto tota die:'
  "18": quia habébis spem in novíssimo, et præstolátio tua non auferétur.
  "19": 'Audi fili mi, et esto sápiens: et dírige in via ánimum tuum.'
  "20": 'Noli esse in convíviis potatórum, nec in comessatiónibus eórum qui carnes ad vescéndum cónferunt:'
  "21": quia vacántes pótibus, et dantes sýmbola consuméntur, et vestiétur pannis dormitátio.
  "22": 'Audi patrem tuum, qui génuit te: et ne contémnas cum senúerit mater tua.'
  "23": Veritátem eme, et noli véndere sapiéntiam, et doctrínam, et intelligéntiam.
  "24": 'Exsúltat gáudio pater iusti: qui sapiéntem génuit, lætábitur in eo.'
  "25": Gáudeat pater tuus et mater tua, et exsúltet quæ génuit te.
  "26": 'Præbe fili mi cor tuum mihi: et óculi tui vias meas custódiant.'
  "27": 'Fóvea enim profúnda est méretrix: et púteus angústus aliéna.'
  "28": Insidiátur in via quasi latro, et quos incáutos víderit, interfíciet.
  "29": Cui væ? cuius patri væ? cui rixæ? cui fóveæ? cui sine causa vúlnera? cui suffúsio oculórum?
  "30": Nonne his, qui commorántur in vino, et student calícibus epotándis?
  "31": 'Ne intueáris vinum quando flavéscit, cum splendúerit in vitro color eius: ingréditur blande,'
  "32": sed in novíssimo mordébit ut cóluber, et sicut régulus venéna diffúndet.
  "33": Oculi tui vidébunt extráneas, et cor tuum loquétur pervérsa.
  "34": 'Et eris sicut dórmiens in médio mari, et quasi sopítus gubernátor, amísso clavo:'
  "35": 'et dices: Verberavérunt me, sed non dólui: traxérunt me, et ego non sensi: quando evigilábo, et rursus vina repériam?'
