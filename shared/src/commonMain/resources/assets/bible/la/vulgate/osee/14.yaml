bible: vulgate
lang: la
language: Latina
book: Osee
chapter: "14"
verses:
  "1": 'Péreat Samaría, quóniam ad amaritúdinem concitávit Deum suum: in gládio péreant, párvuli eórum elidántur, et fœtæ eius discindántur.'
  "2": 'Convértere Israel ad Dóminum Deum tuum: quóniam corruísti in iniquitáte tua.'
  "3": 'Tóllite vobíscum verba, et convertímini ad Dóminum: et dícite ei: Omnem aufer iniquitátem, áccipe bonum: et reddémus vítulos labiórum nostrórum.'
  "4": 'Assur non salvábit nos, super equum non ascendémus, nec dicémus ultra: Dii nostri ópera mánuum nostrárum: quia eius, qui in te est, miseréberis pupílli.'
  "5": 'Sanábo contritiónes eórum, díligam eos spontánee: quia avérsus est furor meus ab eis.'
  "6": Ero quasi ros, Israel germinábit sicut lílium, et erúmpet radix eius ut Líbani.
  "7": Ibunt rami eius, et erit quasi olíva glória eius, et odor eius ut Líbani.
  "8": 'Converténtur sedéntes in umbra eius: vivent trítico, et germinábunt quasi vínea: memoriále eius sicut vinum Líbani.'
  "9": 'Ephraim quid mihi ultra idóla? ego exáudiam, et dírigam eum ego ut abiétem viréntem: ex me fructus tuus invéntus est.'
  "10": 'Quis sápiens, et intélliget ista? intélligens, et sciet hæc? quia rectæ viæ Dómini, et iusti ambulábunt in eis: prævaricatóres vero córruent in eis.'
