bible: vulgate
lang: la
language: Latina
book: ad Corinthios II
chapter: "9"
verses:
  "1": Nam de ministério, quod fit in sanctos, ex abundánti est mihi scríbere vobis.
  "2": 'Scio enim promptum ánimum vestrum: pro quo de vobis glórior apud Macédones. Quóniam et Acháia paráta est ab anno prætérito, et vestra æmulátio provocávit plúrimos.'
  "3": 'Misi autem fratres: ut ne quod gloriámur de vobis, evacuétur in hac parte, ut (quemádmodum dixi) paráti sitis:'
  "4": ne cum vénerint Macédones mecum, et invénerint vos imparátos, erubescámus nos (ut non dicámus vos) in hac substántia.
  "5": Necessárium ergo existimávi rogáre fratres, ut prævéniant ad vos, et prǽparent repromíssam benedictiónem hanc parátam esse sic, quasi benedictiónem, non tamquam avarítiam.
  "6": 'Hoc autem dico: qui parce séminat, parce et metet: et qui séminat in benedictiónibus, de benedictiónibus et metet.'
  "7": 'Unusquísque prout destinávit in corde suo, non ex tristítia, aut ex necessitáte: hílarem enim datórem díligit Deus.'
  "8": 'Potens est autem Deus omnem grátiam abundáre fácere in vobis: ut in ómnibus semper omnem sufficiéntiam habéntes, abundétis in omne opus bonum,'
  "9": 'sicut scriptum est: Dispérsit, dedit paupéribus: iustítia eius manet in sǽculum sǽculi.'
  "10": 'Qui autem adminístrat semen seminánti: et panem ad manducándum præstábit, et multiplicábit semen vestrum, et augébit increménta frugum iustítiæ vestræ:'
  "11": ut in ómnibus locupletáti abundétis in omnem simplicitátem, quæ operátur per nos gratiárum actiónem Deo.
  "12": Quóniam ministérium huius offícii non solum supplet ea, quæ desunt sanctis, sed étiam abúndat per multas gratiárum actiónes in Dómino,
  "13": per probatiónem ministérii huius, glorificántes Deum in obediéntia confessiónis vestræ, in Evangélium Christi, et simplicitáte communicatiónis in illos, et in omnes,
  "14": et in ipsórum obsecratióne pro vobis, desiderántium vos propter eminéntem grátiam Dei in vobis.
  "15": Grátias Deo super inenarrábili dono eius.
