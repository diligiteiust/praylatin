bible: vulgate
lang: la
language: Latina
book: I Samuelis
chapter: "14"
verses:
  "1": 'Et áccidit quadam die ut díceret Iónathas fílius Saul ad adolescéntem armígerum suum: Veni, et transeámus ad statiónem Philisthinórum, quæ est trans locum illum. Patri autem suo hoc ipsum non indicávit.'
  "2": 'Porro Saul morabátur in extréma parte Gábaa sub malogranáto, quæ erat in Magron: et erat pópulus cum eo quasi sexcentórum virórum.'
  "3": Et Achías fílius Achitob fratris Ichabod fílii Phínees, qui ortus fúerat ex Heli sacerdóte Dómini in Silo, portábat ephod. Sed et pópulus ignorábat quo isset Iónathas.
  "4": 'Erant autem inter ascénsus, per quos nitebátur Iónathas transíre ad statiónem Philisthinórum, eminéntes petræ ex utráque parte, et quasi in modum déntium scópuli hinc et inde prærúpti: nomen uni Boses, et nomen álteri Sene:'
  "5": unus scópulus próminens ad aquilónem ex advérso Machmas, et alter ad merídiem contra Gábaa.
  "6": 'Dixit autem Iónathas ad adolescéntem armígerum suum: Veni, transeámus ad statiónem incircumcisórum horum, si forte fáciat Dóminus pro nobis: quia non est Dómino diffícile salváre, vel in multis, vel in paucis.'
  "7": 'Dixítque ei ármiger suus: Fac ómnia, quæ placent ánimo tuo: perge quo cupis, et ero tecum ubicúmque volúeris.'
  "8": 'Et ait Iónathas: Ecce nos transímus ad viros istos. Cumque apparuérimus eis,'
  "9": 'si táliter locúti fúerint ad nos: Manéte donec veniámus ad vos: stemus in loco nostro, nec ascendámus ad eos.'
  "10": 'Si autem díxerint: Ascéndite ad nos: ascendámus, quia trádidit eos Dóminus in mánibus nostris: hoc erit nobis signum.'
  "11": 'Appáruit ígitur utérque statióni Philisthinórum: dixerúntque Philísthiim: En Hebrǽi egrediúntur de cavérnis, in quibus abscónditi fúerant.'
  "12": 'Et locúti sunt viri de statióne ad Iónatham, et ad armígerum eius, dixerúntque: Ascéndite ad nos, et ostendémus vobis rem. Et ait Iónathas ad armígerum suum: Ascendámus, séquere me: trádidit enim Dóminus eos in manus Israel.'
  "13": Ascéndit autem Iónathas mánibus et pédibus reptans, et ármiger eius post eum. Itaque álii cadébant ante Iónatham, álios ármiger eius interficiébat sequens eum.
  "14": Et facta est plaga prima, qua percússit Iónathas et ármiger eius, quasi vigínti virórum in média parte iúgeri, quam par boum in die aráre consuévit.
  "15": 'Et factum est miráculum in castris per agros: sed et omnis pópulus statiónis eórum, qui íerant ad prædándum, obstúpuit, et conturbáta est terra: et áccidit quasi miráculum a Deo.'
  "16": Et respexérunt speculatóres Saul, qui erant in Gábaa Béniamin, et ecce multitúdo prostráta, et huc illúcque diffúgiens.
  "17": 'Et ait Saul pópulo, qui erat cum eo: Requírite, et vidéte quis abíerit ex nobis. Cumque requisíssent, repértum est non adésse Iónatham, et armígerum eius.'
  "18": 'Et ait Saul ad Achíam: Applica arcam Dei. (Erat enim ibi arca Dei in die illa cum fíliis Israel.)'
  "19": 'Cumque loquerétur Saul ad sacerdótem, tumúltus magnus exórtus est in castris Philisthinórum: crescebátque paulátim, et clárius resonábat. Et ait Saul ad sacerdótem: Cóntrahe manum tuam.'
  "20": 'Conclamávit ergo Saul, et omnis pópulus, qui erat cum eo, et venérunt usque ad locum certáminis: et ecce versus fúerat gládius uniuscuiúsque ad próximum suum, et cædes magna nimis.'
  "21": Sed et Hebrǽi qui fúerant cum Philísthiim heri et nudiustértius, ascenderántque cum eis in castris, revérsi sunt ut essent cum Israel, qui erant cum Saul et Iónatha.
  "22": Omnes quoque Israelítæ, qui se abscónderant in monte Ephraim, audiéntes quod fugíssent Philisthǽi, sociavérunt se cum suis in prœ́lio. Et erant cum Saul quasi decem míllia virórum.
  "23": 'Et salvávit Dóminus in die illa Israel: pugna autem pervénit usque ad Betháven.'
  "24": 'Et viri Israel sociáti sunt sibi in die illa: adiurávit autem Saul pópulum, dicens: Maledíctus vir, qui coméderit panem usque ad vésperam, donec ulcíscar de inimícis meis. Et non manducávit univérsus pópulus panem:'
  "25": omnéque terræ vulgus venit in saltum, in quo erat mel super fáciem agri.
  "26": 'Ingréssus est ítaque pópulus saltum, et appáruit fluens mel, nullúsque applícuit manum ad os suum: timébat enim pópulus iuraméntum.'
  "27": 'Porro Iónathas non audíerat cum adiuráret pater eius pópulum: extendítque summitátem virgæ, quam habébat in manu, et intínxit in favum mellis: et convértit manum suam ad os suum, et illumináti sunt óculi eius.'
  "28": 'Respondénsque unus de pópulo, ait: Iureiurándo constrínxit pater tuus pópulum, dicens: Maledíctus vir, qui coméderit panem hódie. (Defécerat autem pópulus.)'
  "29": 'Dixítque Iónathas: Turbávit pater meus terram: vidístis ipsi quia illumináti sunt óculi mei, eo quod gustáverim páululum de melle isto:'
  "30": quanto magis si comedísset pópulus de præda inimicórum suórum, quam réperit? nonne maior plaga facta fuísset in Philísthiim?
  "31": 'Percussérunt ergo in die illa Philisthǽos a Machmis usque in Aialon. Defatigátus est autem pópulus nimis:'
  "32": 'et versus ad prædam tulit oves, et boves, et vítulos, et mactavérunt in terra: comedítque pópulus cum sánguine.'
  "33": 'Nuntiavérunt autem Sauli dicéntes quod pópulus peccásset Dómino, cómedens cum sánguine. Qui ait: Prævaricáti estis: vólvite ad me iam nunc saxum grande.'
  "34": 'Et dixit Saul: Dispergímini in vulgus, et dícite eis ut addúcat ad me unusquísque bovem suum et aríetem, et occídite super istud, et vescímini, et non peccábitis Dómino comedéntes cum sánguine. Addúxit ítaque omnis pópulus unusquísque bovem in manu sua usque ad noctem: et occidérunt ibi.'
  "35": Ædificávit autem Saul altáre Dómino, tuncque primum cœpit ædificáre altáre Dómino.
  "36": 'Et dixit Saul: Irruámus super Philisthǽos nocte, et vastémus eos usque dum illucéscat mane, nec relinquámus ex eis virum. Dixítque pópulus: Omne quod bonum vidétur in óculis tuis, fac. Et ait sacérdos: Accedámus huc ad Deum.'
  "37": 'Et consúluit Saul Dóminum: Num pérsequar Philísthiim? si trades eos in manus Israel? Et non respóndit ei in die illa.'
  "38": 'Dixítque Saul: Applicáte huc univérsos ángulos pópuli: et scitóte, et vidéte per quem accíderit peccátum hoc hódie.'
  "39": Vivit Dóminus salvátor Israel, quia si per Iónatham fílium meum factum est, absque retractióne moriétur. Ad quod nullus contradíxit ei de omni pópulo.
  "40": 'Et ait ad univérsum Israel: Separámini vos in partem unam, et ego cum Iónatha fílio meo ero in parte áltera. Respondítque pópulus ad Saul: Quod bonum vidétur in óculis tuis, fac.'
  "41": 'Et dixit Saul ad Dóminum Deum Israel: Dómine Deus Israel da indícium: quid est quod non respónderis servo tuo hódie? si in me, aut in Iónatha fílio meo, est iníquitas hæc, da ostensiónem: aut si hæc iníquitas est in pópulo tuo, da sanctitátem. Et deprehénsus est Iónathas et Saul, pópulus autem exívit.'
  "42": 'Et ait Saul: Míttite sortem inter me, et inter Iónatham fílium meum. Et captus est Iónathas.'
  "43": 'Dixit autem Saul ad Iónatham: Indica mihi quid féceris. Et indicávit ei Iónathas, et ait: Gustans gustávi in summitáte virgæ, quæ erat in manu mea, páululum mellis, et ecce ego mórior.'
  "44": 'Et ait Saul: Hæc fáciat mihi Deus, et hæc addat, quia morte moriéris, Iónatha.'
  "45": 'Dixítque pópulus ad Saul: Ergóne Iónathas moriétur, qui fecit salútem hanc magnam in Israel? hoc nefas est: vivit Dóminus, si cecíderit capíllus de cápite eius in terram, quia cum Deo operátus est hódie. Liberávit ergo pópulus Iónatham, ut non morerétur.'
  "46": 'Recessítque Saul, nec persecútus est Philísthiim: porro Philísthiim abiérunt in loca sua.'
  "47": 'Et Saul, confirmáto regno super Israel, pugnábat per circúitum advérsum omnes inimícos eius, contra Moab, et fílios Ammon, et Edom, et reges Soba, et Philisthǽos: et quocúmque se vérterat, superábat.'
  "48": Congregatóque exércitu, percússit Amalec, et éruit Israel de manu vastatórum eius.
  "49": 'Fuérunt autem fílii Saul, Iónathas, et Iéssui, et Melchísua: et nómina duárum filiárum eius, nomen primogénitæ Merob, et nomen minóris Michol.'
  "50": 'Et nomen uxóris Saul, Achínoam fília Achímaas: et nomen príncipis milítiæ eius Abner, fílius Ner, patruélis Saul.'
  "51": Porro Cis fuit pater Saul, et Ner pater Abner, fílius Abiel.
  "52": Erat autem bellum potens advérsum Philisthǽos ómnibus diébus Saul. Nam quemcúmque víderat Saul virum fortem, et aptum ad prœ́lium, sociábat eum sibi.
