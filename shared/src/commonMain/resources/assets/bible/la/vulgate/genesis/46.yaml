bible: vulgate
lang: la
language: Latina
book: Genesis
chapter: "46"
verses:
  "1": 'Profectúsque Israel cum ómnibus quæ habébat, venit ad Púteum iuraménti: et mactátis ibi víctimis Deo patris sui Isaac,'
  "2": 'audívit eum per visiónem noctis vocántem se, et dicéntem sibi: Iacob, Iacob. Cui respóndit: Ecce adsum.'
  "3": 'Ait illi Deus: Ego sum fortíssimus Deus patris tui: noli timére, descénde in Ægýptum, quia in gentem magnam fáciam te ibi.'
  "4": 'Ego descéndam tecum illuc, et ego inde addúcam te reverténtem: Ioseph quoque ponet manus suas super óculos tuos.'
  "5": 'Surréxit autem Iacob a Púteo iuraménti: tulerúntque eum fílii cum párvulis et uxóribus suis in plaustris quæ míserat Phárao ad portándum senem,'
  "6": 'et ómnia quæ posséderat in terra Chánaan: venítque in Ægýptum cum omni sémine suo,'
  "7": fílii eius, et nepótes, fíliæ, et cuncta simul progénies.
  "8": Hæc sunt autem nómina filiórum Israel, qui ingréssi sunt in Ægýptum, ipse cum líberis suis. Primogénitus Ruben.
  "9": 'Fílii Ruben: Henoch et Phallu et Hesron et Charmi.'
  "10": 'Fílii Símeon: Iámuel et Iamin et Ahod, et Iachin et Sohar, et Saul fílius Chanaanítidis.'
  "11": 'Fílii Levi: Gerson et Caath et Merári.'
  "12": 'Fílii Iuda: Her et Onan et Sela et Phares et Zara: mórtui sunt autem Her et Onan in terra Chánaan. Natíque sunt fílii Phares: Hesron et Hamul.'
  "13": 'Fílii Issachar: Thola et Phua et Iob et Semron.'
  "14": 'Fílii Zábulon: Sared et Elon et Iáhelel.'
  "15": 'Hi fílii Liæ quos génuit in Mesopotámia Sýriæ cum Dina fília sua: omnes ánimæ filiórum eius et filiárum, trigínta tres.'
  "16": 'Fílii Gad: Séphion et Haggi et Suni et Esebon et Heri et Aródi et Aréli.'
  "17": 'Fílii Aser: Iamne et Iésua et Iéssui et Béria, Sara quoque soror eórum. Fílii Béria: Heber et Mélchiel.'
  "18": 'Hi fílii Zelphæ, quam dedit Laban Liæ fíliæ suæ: et hos génuit Iacob sédecim ánimas.'
  "19": 'Fílii Rachel uxóris Iacob: Ioseph et Béniamin.'
  "20": 'Natíque sunt Ioseph fílii in terra Ægýpti, quos génuit ei Aseneth fília Putíphare sacerdótis Heliopóleos: Manásses et Ephraim.'
  "21": 'Fílii Béniamin: Bela et Bechor et Asbel et Gera et Náaman et Echi et Ros et Mophim et Ophim et Ared.'
  "22": 'Hi fílii Rachel quos génuit Iacob: omnes ánimæ, quatuórdecim.'
  "23": 'Fílii Dan: Husim.'
  "24": 'Fílii Néphthali: Iásiel et Guni et Ieser et Sallem.'
  "25": 'Hi fílii Balæ, quam dedit Laban Rachéli fíliæ suæ: et hos génuit Iacob: omnes ánimæ, septem.'
  "26": Cunctæ ánimæ, quæ ingréssæ sunt cum Iacob in Ægýptum, et egréssæ sunt de fémore illíus, absque uxóribus filiórum eius, sexagínta sex.
  "27": Fílii autem Ioseph, qui nati sunt ei in terra Ægýpti, ánimæ duæ. Omnes ánimæ domus Iacob, quæ ingréssæ sunt in Ægýptum, fuére septuagínta.
  "28": Misit autem Iudam ante se ad Ioseph, ut nuntiáret ei, et occúrreret in Gessen.
  "29": 'Quo cum pervenísset, iuncto Ioseph curru suo, ascéndit óbviam patri suo ad eúmdem locum: vidénsque eum, írruit super collum eius, et inter ampléxus flevit.'
  "30": 'Dixítque pater ad Ioseph: Iam lætus móriar, quia vidi fáciem tuam, et supérstitem te relínquo.'
  "31": 'At ille locútus est ad fratres suos, et ad omnem domum patris sui: Ascéndam, et nuntiábo Pharaóni, dicámque ei: Fratres mei, et domus patris mei, qui erant in terra Chánaan, venérunt ad me:'
  "32": 'et sunt viri pastóres óvium, curámque habent alendórum gregum: pécora sua, et arménta, et ómnia quæ habére potuérunt, adduxérunt secum.'
  "33": 'Cumque vocáverit vos, et díxerit: Quod est opus vestrum?'
  "34": 'respondébitis: Viri pastóres sumus servi tui, ab infántia nostra usque in præsens, et nos et patres nostri. Hæc autem dicétis, ut habitáre possítis in terra Gessen: quia detestántur Ægýptii omnes pastóres óvium.'
