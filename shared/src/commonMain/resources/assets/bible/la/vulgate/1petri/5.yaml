bible: vulgate
lang: la
language: Latina
book: I Petri
chapter: "5"
verses:
  "1": 'Senióres ergo, qui in vobis sunt, óbsecro, consénior et testis Christi passiónum: qui et eius, quæ in futúro revelánda est, glóriæ communicátor:'
  "2": 'páscite qui in vobis est gregem Dei, providéntes non coácte, sed spontánee secúndum Deum: neque turpis lucri grátia, sed voluntárie:'
  "3": neque ut dominántes in cleris, sed forma facti gregis ex ánimo.
  "4": Et cum apparúerit princeps pastórum, percipiétis immarcescíbilem glóriæ corónam.
  "5": Simíliter adolescéntes súbditi estóte senióribus. Omnes autem ínvicem humilitátem insinuáte, quia Deus supérbis resístit, humílibus autem dat grátiam.
  "6": 'Humiliámini ígitur sub poténti manu Dei, ut vos exáltet in témpore visitatiónis:'
  "7": omnem sollicitúdinem vestram proiciéntes in eum, quóniam ipsi cura est de vobis.
  "8": 'Sóbrii estóte, et vigiláte: quia adversárius vester diábolus tamquam leo rúgiens círcuit, quærens quem dévoret:'
  "9": 'cui resístite fortes in fide: sciéntes eámdem passiónem ei, quæ in mundo est, vestræ fraternitáti fíeri.'
  "10": Deus autem omnis grátiæ, qui vocávit nos in ætérnam suam glóriam in Christo Iesu, módicum passos ipse perfíciet, confirmábit, solidabítque.
  "11": Ipsi glória, et impérium in sǽcula sæculórum. Amen.
  "12": 'Per Silvánum fidélem fratrem vobis, ut árbitror, bréviter scripsi: óbsecrans et contéstans, hanc esse veram grátiam Dei, in qua statis.'
  "13": Salútat vos ecclésia, quæ est in Babylóne coelécta, et Marcus fílius meus.
  "14": Salutáte ínvicem in ósculo sancto. Grátia vobis ómnibus, qui estis in Christo Iesu. Amen.
