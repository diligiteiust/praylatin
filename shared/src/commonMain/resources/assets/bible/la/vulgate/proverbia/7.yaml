bible: vulgate
lang: la
language: Latina
book: Proverbia
chapter: "7"
verses:
  "1": Fili mi, custódi sermónes meos, et præcépta mea recónde tibi. Fili,
  "2": 'serva mandáta mea, et vives: et legem meam quasi pupíllam óculi tui:'
  "3": liga eam in dígitis tuis, scribe illam in tábulis cordis tui.
  "4": 'Dic sapiéntiæ: Soror mea es, et prudéntiam voca amícam tuam:'
  "5": ut custódiant te a mulíere extránea, et ab aliéna quæ verba sua dúlcia facit.
  "6": De fenéstra enim domus meæ per cancéllos prospéxi,
  "7": 'et vídeo párvulos: consídero vecórdem iúvenem,'
  "8": qui transit per platéam iuxta ángulum et prope viam domus illíus, gráditur
  "9": in obscúro, advesperascénte die, in noctis ténebris et calígine.
  "10": 'Et ecce occúrrit illi múlier ornátu meretrício, præparáta ad capiéndas ánimas: gárrula et vaga,'
  "11": 'quiétis impátiens, nec valens in domo consístere pédibus suis:'
  "12": nunc foris, nunc in platéis, nunc iuxta ángulos insídians.
  "13": 'Apprehensúmque deosculátur iúvenem, et procáci vultu blandítur, dicens:'
  "14": 'Víctimas pro salúte vovi: hódie réddidi vota mea:'
  "15": idcírco egréssa sum in occúrsum tuum, desíderans te vidére, et réperi.
  "16": 'Intéxui fúnibus léctulum meum: stravi tapétibus pictis ex Ægýpto:'
  "17": aspérsi cubíle meum myrrha, et áloe, et cinnamómo.
  "18": Veni, inebriémur ubéribus, et fruámur cupítis ampléxibus donec illucéscat dies.
  "19": 'Non est enim vir in domo sua: ábiit via longíssima.'
  "20": 'Sácculum pecúniæ secum tulit: in die plenæ lunæ reversúrus est in domum suam.'
  "21": Irretívit eum multis sermónibus, et blandítiis labiórum protráxit illum.
  "22": 'Statim eam séquitur quasi bos ductus ad víctimam, et quasi agnus lascíviens, et ignórans quod ad víncula stultus trahátur:'
  "23": donec transfígat sagítta iecur eius, velut si avis festínet ad láqueum, et nescit quod de perículo ánimæ illíus ágitur.
  "24": Nunc ergo fili mi, audi me, et atténde verbis oris mei.
  "25": 'Ne abstrahátur in viis illíus mens tua, neque decipiáris sémitis eius:'
  "26": multos enim vulnerátos deiécit, et fortíssimi quique interfécti sunt ab ea.
  "27": Viæ ínferi domus eius, penetrántes in interióra mortis.
