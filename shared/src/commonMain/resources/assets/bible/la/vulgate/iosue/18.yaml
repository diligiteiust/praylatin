bible: vulgate
lang: la
language: Latina
book: Iosue
chapter: "18"
verses:
  "1": Congregatíque sunt omnes fílii Israel in Silo, ibíque fixérunt tabernáculum testimónii, et fuit eis terra subiécta.
  "2": Remánserant autem filiórum Israel septem tribus, quæ necdum accéperant possessiónes suas.
  "3": 'Ad quos Iósue ait: Usquequo marcétis ignávia, et non intrátis ad possidéndam terram, quam Dóminus Deus patrum vestrórum dedit vobis?'
  "4": 'Elígite de síngulis tríbubus ternos viros, ut mittam eos, et pergant atque circúmeant terram, et descríbant eam iuxta númerum uniuscuiúsque multitúdinis: referántque ad me quod descrípserint.'
  "5": 'Divídite vobis terram in septem partes: Iudas sit in términis suis ab austráli plaga, et domus Ioseph ab aquilóne.'
  "6": 'Médiam inter hos terram in septem partes descríbite: et huc veniétis ad me, ut coram Dómino Deo vestro mittam vobis hic sortem:'
  "7": quia non est inter vos pars Levitárum, sed sacerdótium Dómini est eórum heréditas. Gad autem et Ruben, et dimídia tribus Manásse, iam accéperant possessiónes suas trans Iordánem ad orientálem plagam, quas dedit eis Móyses fámulus Dómini.
  "8": 'Cumque surrexíssent viri, ut pérgerent ad describéndam terram, præcépit eis Iósue, dicens: Circúite terram, et descríbite eam, ac revertímini ad me: ut hic coram Dómino, in Silo, mittam vobis sortem.'
  "9": 'Itaque perrexérunt: et lustrántes eam, in septem partes divisérunt, scribéntes in volúmine. Reversíque sunt ad Iósue in castra Silo.'
  "10": Qui misit sortes coram Dómino in Silo, divisítque terram fíliis Israel in septem partes.
  "11": Et ascéndit sors prima filiórum Béniamin per famílias suas, ut possidérent terram inter fílios Iuda et fílios Ioseph.
  "12": 'Fuítque términus eórum contra aquilónem a Iordáne: pergens iuxta latus Iéricho septentrionális plagæ, et inde contra occidéntem ad montána conscéndens, et pervéniens ad solitúdinem Betháven,'
  "13": 'atque pertránsiens iuxta Luzam ad merídiem, ipsa est Bethel: descendítque in Ataroth Addar in montem, qui est ad merídiem Béthoron inferióris:'
  "14": 'et inclinátur circúiens contra mare ad merídiem montis qui réspicit Béthoron contra Africum: suntque éxitus eius in Cáriath Baal, quæ vocátur et Cariathíarim, urbem filiórum Iuda. Hæc est plaga contra mare, ad occidéntem.'
  "15": A merídie autem ex parte Cariathíarim egréditur términus contra mare, et pérvenit usque ad fontem aquárum Néphtoa.
  "16": 'Descendítque in partem montis, qui réspicit vallem filiórum Ennom: et est contra septentrionálem plagam in extréma parte vallis Ráphaim. Descendítque in Geénnom (id est, vallem Ennom) iuxta latus Iebusǽi ad austrum: et pérvenit ad Fontem Rogel,'
  "17": 'tránsiens ad aquilónem, et egrédiens ad Ensemes, id est, Fontem solis:'
  "18": 'et pertránsit usque ad túmulos, qui sunt e regióne ascénsus Adómmim: descendítque ad Abénboen, id est, lápidem Boen fílii Ruben: et pertránsit ex látere aquilónis ad campéstria: descendítque in planítiem,'
  "19": 'et prætergréditur contra aquilónem Beth Hagla: suntque éxitus eius contra linguam maris salsíssimi ab aquilóne in fine Iordánis ad austrálem plagam:'
  "20": qui est términus illíus ab oriénte. Hæc est posséssio filiórum Béniamin per términos suos in circúitu, et famílias suas.
  "21": Fuerúntque civitátes eius, Iéricho, et Beth Hagla, et Vallis Casis,
  "22": Beth Araba, et Samáraim, et Bethel,
  "23": et Avim, et Aphara, et Ophera,
  "24": 'villa Emóna, et Ophni, et Gabée: civitátes duódecim, et villæ eárum.'
  "25": Gábaon, et Rama, et Beroth,
  "26": et Mesphe, et Cáphara, et Amósa,
  "27": et Recem, Iárephel, et Thárela,
  "28": 'et Sela, Eleph, et Iebus, quæ est Ierúsalem, Gábaath, et Cáriath: civitátes quatuórdecim, et villæ eárum. Hæc est posséssio filiórum Béniamin iuxta famílias suas.'
