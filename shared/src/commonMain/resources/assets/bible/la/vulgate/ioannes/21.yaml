bible: vulgate
lang: la
language: Latina
book: Ioannes
chapter: "21"
verses:
  "1": 'Póstea manifestávit se íterum Iesus discípulis ad mare Tiberíadis. Manifestávit autem sic:'
  "2": erant simul Simon Petrus, et Thomas, qui dícitur Dídymus, et Nathánael, qui erat a Cana Galilǽæ, et fílii Zebedǽi, et álii ex discípulis eius duo.
  "3": 'Dicit eis Simon Petrus: Vado piscári. Dicunt ei: Venímus et nos tecum. Et exiérunt, et ascendérunt in navim: et illa nocte nihil prendidérunt.'
  "4": 'Mane autem facto stetit Iesus in líttore: non tamen cognovérunt discípuli quia Iesus est.'
  "5": 'Dixit ergo eis Iesus: Púeri, numquid pulmentárium habétis? Respondérunt ei: Non.'
  "6": 'Dicit eis: Míttite in déxteram navígii rete, et inveniétis. Misérunt ergo: et iam non valébant illud tráhere præ multitúdine píscium.'
  "7": 'Dixit ergo discípulus ille, quem diligébat Iesus, Petro: Dóminus est. Simon Petrus cum audísset quia Dóminus est, túnica succínxit se (erat enim nudus) et misit se in mare.'
  "8": Alii autem discípuli navígio venérunt (non enim longe erant a terra, sed quasi cúbitis ducéntis), trahéntes rete píscium.
  "9": Ut ergo descendérunt in terram, vidérunt prunas pósitas, et piscem superpósitum, et panem.
  "10": 'Dicit eis Iesus: Afférte de píscibus, quos prendidístis nunc.'
  "11": Ascéndit Simon Petrus, et traxit rete in terram, plenum magnis píscibus centum quinquagínta tribus. Et cum tanti essent, non est scissum rete.
  "12": 'Dicit eis Iesus: Veníte, prandéte. Et nemo audébat discumbéntium interrogáre eum: Tu quis es? sciéntes, quia Dóminus est.'
  "13": Et venit Iesus, et áccipit panem, et dat eis, et piscem simíliter.
  "14": Hoc iam tértio manifestátus est Iesus discípulis suis cum resurrexísset a mórtuis.
  "15": 'Cum ergo prandíssent, dicit Simóni Petro Iesus: Simon Ioánnis, díligis me plus his? Dicit ei: Etiam Dómine, tu scis quia amo te. Dicit ei: Pasce agnos meos.'
  "16": 'Dicit ei íterum: Simon Ioánnis, díligis me? Ait illi: Etiam Dómine, tu scis quia amo te. Dicit ei: Pasce agnos meos.'
  "17": 'Dicit ei tértio: Simon Ioánnis, amas me? Contristátus est Petrus, quia dixit ei tértio: Amas me? et dixit ei: Dómine tu ómnia nosti, tu scis quia amo te. Dixit ei: Pasce oves meas.'
  "18": 'Amen, amen dico tibi: cum esses iúnior, cingébas te, et ambulábas ubi volébas: cum autem senúeris, exténdes manus tuas, et álius te cinget, et ducet quo tu non vis.'
  "19": 'Hoc autem dixit signíficans qua morte clarificatúrus esset Deum. Et cum hoc dixísset, dicit ei: Séquere me.'
  "20": 'Convérsus Petrus vidit illum discípulum, quem diligébat Iesus, sequéntem, qui et recúbuit in cœna super pectus eius, et dixit: Dómine quis est qui tradet te?'
  "21": 'Hunc ergo cum vidísset Petrus, dixit Iesu: Dómine hic autem quid?'
  "22": 'Dicit ei Iesus: Sic eum volo manére donec véniam, quid ad te? tu me séquere.'
  "23": 'Exiit ergo sermo iste inter fratres quia discípulus ille non móritur. Et non dixit ei Iesus: Non móritur, sed: Sic eum volo manére donec véniam, quid ad te?'
  "24": 'Hic est discípulus ille, qui testimónium pérhibet de his, et scripsit hæc: et scimus, quia verum est testimónium eius.'
  "25": 'Sunt autem et ália multa, quæ fecit Iesus: quæ si scribántur per síngula, nec ipsum árbitror mundum cápere posse eos, qui scribéndi sunt, libros.'
