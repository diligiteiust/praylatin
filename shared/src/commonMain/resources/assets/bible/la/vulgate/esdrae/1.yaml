bible: vulgate
lang: la
language: Latina
book: Esdrae
chapter: "1"
verses:
  "1": 'In anno primo Cyri regis Persárum, ut complerétur verbum Dómini ex ore Ieremíæ, suscitávit Dóminus spíritum Cyri regis Persárum: et tradúxit vocem in omni regno suo, étiam per scriptúram, dicens:'
  "2": 'Hæc dicit Cyrus rex Persárum: Omnia regna terræ dedit mihi Dóminus Deus cæli, et ipse præcépit mihi ut ædificárem ei domum in Ierúsalem, quæ est in Iudǽa.'
  "3": Quis est in vobis de univérso pópulo eius? Sit Deus illíus cum ipso. Ascéndat in Ierúsalem, quæ est in Iudǽa, et ædíficet domum Dómini Dei Israel, ipse est Deus qui est in Ierúsalem.
  "4": Et omnes réliqui in cunctis locis ubicúmque hábitant, ádiuvent eum viri de loco suo argénto et auro, et substántia, et pecóribus, excépto quod voluntárie ófferunt templo Dei, quod est in Ierúsalem.
  "5": Et surrexérunt príncipes patrum de Iuda, et Béniamin, et sacerdótes, et Levítæ, et omnis cuius Deus suscitávit spíritum, ut ascénderent ad ædificándum templum Dómini, quod erat in Ierúsalem.
  "6": Universíque qui erant in circúitu, adiuvérunt manus eórum in vasis argénteis et áureis, in substántia et iuméntis, in supelléctili, excéptis his, quæ sponte obtúlerant.
  "7": Rex quoque Cyrus prótulit vasa templi Dómini, quæ túlerat Nabuchodónosor de Ierúsalem, et posúerat ea in templo dei sui.
  "8": Prótulit autem ea Cyrus rex Persárum per manum Mithridátis fílii Gázabar, et annumerávit ea Sassabásar príncipi Iuda.
  "9": 'Et hic est númerus eórum: phíalæ áureæ trigínta, phíalæ argénteæ mille, cultri vigínti novem, scyphi áurei trigínta,'
  "10": 'scyphi argéntei secúndi quadringénti decem: vasa ália mille.'
  "11": 'Omnia vasa áurea et argéntea quinque míllia quadringénta: univérsa tulit Sassabásar cum his, qui ascendébant de transmigratióne Babylónis in Ierúsalem.'
