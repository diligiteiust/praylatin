bible: vulgate
lang: la
language: Latina
book: Iob
chapter: "31"
verses:
  "1": Pépigi fœdus cum óculis meis, ut ne cogitárem quidem de vírgine.
  "2": Quam enim partem habéret in me Deus désuper, et hereditátem Omnípotens de excélsis?
  "3": Numquid non perdítio est iníquo, et alienátio operántibus iniustítiam?
  "4": Nonne ipse consíderat vias meas, et cunctos gressus meos dinúmerat?
  "5": 'Si ambulávi in vanitáte, et festinávit in dolo pes meus:'
  "6": appéndat me in statéra iusta, et sciat Deus simplicitátem meam.
  "7": 'Si declinávit gressus meus de via, et si secútum est óculos meos cor meum, et si mánibus meis adhǽsit mácula:'
  "8": 'seram, et álius cómedat: et progénies mea eradicétur.'
  "9": Si decéptum est cor meum super mulíere, et si ad óstium amíci mei insidiátus sum,
  "10": scortum altérius sit uxor mea, et super illam incurvéntur álii.
  "11": Hoc enim nefas est, et iníquitas máxima.
  "12": Ignis est usque ad perditiónem dévorans, et ómnia eradícans genímina.
  "13": Si contémpsi subíre iudícium cum servo meo, et ancílla mea, cum disceptárent advérsum me.
  "14": Quid enim fáciam cum surréxerit ad iudicándum Deus? et cum quæsíerit, quid respondébo illi?
  "15": 'Numquid non in útero fecit me qui et illum operátus est: et formávit me in vulva unus?'
  "16": 'Si negávi, quod volébant, paupéribus, et óculos víduæ exspectáre feci:'
  "17": si comédi buccéllam meam solus, et non comédit pupíllus ex ea
  "18": '(quia ab infántia mea crevit mecum miserátio, et de útero matris meæ egréssa est mecum):'
  "19": 'si despéxi pereúntem, eo quod non habúerit induméntum, et absque operiménto páuperem:'
  "20": 'si non benedixérunt mihi látera eius, et de velléribus óvium meárum calefáctus est:'
  "21": 'si levávi super pupíllum manum meam, étiam cum vidérem me in porta superiórem:'
  "22": húmerus meus a iunctúra sua cadat, et bráchium meum cum suis óssibus confringátur.
  "23": Semper enim quasi tuméntes super me fluctus tímui Deum, et pondus eius ferre non pótui.
  "24": 'Si putávi aurum robur meum, et obrízo dixi: Fidúcia mea.'
  "25": Si lætátus sum super multis divítiis meis, et quia plúrima réperit manus mea.
  "26": 'Si vidi solem cum fulgéret, et lunam incedéntem clare:'
  "27": et lætátum est in abscóndito cor meum, et osculátus sum manum meam ore meo,
  "28": quæ est iníquitas máxima, et negátio contra Deum altíssimum.
  "29": Si gavísus sum ad ruínam eius qui me óderat, et exsultávi quod invenísset eum malum.
  "30": Non enim dedi ad peccándum guttur meum, ut expéterem maledícens ánimam eius.
  "31": 'Si non dixérunt viri tabernáculi mei: Quis det de cárnibus eius ut saturémur?'
  "32": Foris non mansit peregrínus, óstium meum viatóri pátuit.
  "33": Si abscóndi quasi homo peccátum meum, et celávi in sinu meo iniquitátem meam.
  "34": 'Si expávi ad multitúdinem nímiam, et despéctio propinquórum térruit me: et non magis tácui, nec egréssus sum óstium.'
  "35": 'Quis mihi tríbuat auditórem, ut desidérium meum áudiat Omnípotens: et librum scribat ipse qui iúdicat,'
  "36": ut in húmero meo portem illum, et circúmdem illum quasi corónam mihi?
  "37": Per síngulos gradus meos pronuntiábo illum, et quasi príncipi ófferam eum.
  "38": 'Si advérsum me terra mea clamat, et cum ipsa sulci eius deflent:'
  "39": 'si fructus eius comédi absque pecúnia, et ánimam agricolárum eius afflíxi:'
  "40": pro fruménto oriátur mihi tríbulus, et pro hórdeo spina. [Finíta sunt verba Iob.]
