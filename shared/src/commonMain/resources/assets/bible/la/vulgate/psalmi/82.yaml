bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "82"
verses:
  "1": Cánticum Psalmi Asaph.
  "2": 'Deus, quis símilis erit tibi? ne táceas, neque compescáris Deus:'
  "3": 'quóniam ecce inimíci tui sonuérunt: et qui odérunt te extulérunt caput.'
  "4": 'Super pópulum tuum malignavérunt consílium: et cogitavérunt advérsus sanctos tuos.'
  "5": 'Dixérunt: Veníte, et disperdámus eos de gente: et non memorétur nomen Israel ultra.'
  "6": 'Quóniam cogitavérunt unanímiter: simul advérsum te testaméntum disposuérunt,'
  "7": 'tabernácula Idumæórum et Ismahelítæ: Moab et Agaréni,'
  "8": 'Gebal, et Ammon, et Amalec: alienígenæ cum habitántibus Tyrum.'
  "9": 'Etenim Assur venit cum illis: facti sunt in adiutórium fíliis Lot.'
  "10": Fac illis sicut Mádian et Sísaræ, sicut Iabin in torrénte Cisson.
  "11": 'Disperiérunt in Endor: facti sunt ut stercus terræ.'
  "12": 'Pone príncipes eórum sicut Oreb, et Zeb, et Zébee, et Sálmana: omnes príncipes eórum:'
  "13": 'qui dixérunt: Hereditáte possideámus sanctuárium Dei.'
  "14": 'Deus meus pone illos ut rotam: et sicut stípulam ante fáciem venti.'
  "15": 'Sicut ignis qui combúrit silvam: et sicut flamma combúrens montes:'
  "16": 'ita persequéris illos in tempestáte tua: et in ira tua turbábis eos.'
  "17": 'Imple fácies eórum ignomínia: et quærent nomen tuum Dómine.'
  "18": 'Erubéscant, et conturbéntur in sǽculum sǽculi: et confundántur, et péreant.'
  "19": 'Et cognóscant quia nomen tibi Dóminus: tu solus Altíssimus in omni terra.'
