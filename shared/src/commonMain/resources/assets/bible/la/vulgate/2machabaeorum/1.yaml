bible: vulgate
lang: la
language: Latina
book: II Machabaeorum
chapter: "1"
verses:
  "1": Frátribus, qui sunt per Ægýptum Iudǽis, salútem dicunt fratres, qui sunt in Ierosólymis Iudǽi, et qui in regióne Iudǽæ, et pacem bonam.
  "2": 'Benefáciat vobis Deus, et memínerit testaménti sui, quod locútus est ad Abraham, et Isaac, et Iacob servórum suórum fidélium:'
  "3": et det vobis cor ómnibus ut colátis eum, et faciátis eius voluntátem, corde magno et ánimo volénti.
  "4": Adapériat cor vestrum in lege sua, et in præcéptis suis, et fáciat pacem.
  "5": Exáudiat oratiónes vestras, et reconciliétur vobis, nec vos déserat in témpore malo.
  "6": Et nunc hic sumus orántes pro vobis.
  "7": Regnánte Demétrio, anno centésimo sexagésimo nono, nos Iudǽi scrípsimus vobis in tribulatióne, et ímpetu, qui supervénit nobis in istis annis, ex quo recéssit Iason a sancta terra, et a regno.
  "8": 'Portam succendérunt, et effudérunt sánguinem innocéntem: et orávimus ad Dóminum, et exaudíti sumus, et obtúlimus sacrifícium, et similáginem, et accéndimus lucérnas, et proposúimus panes.'
  "9": Et nunc frequentáte dies scenopégiæ mensis Casleu.
  "10": Anno centésimo octogésimo octávo, pópulus, qui est Ierosólymis, et in Iudǽa, senatúsque et Iudas, Aristóbolo magístro Ptolemǽi regis, qui est de génere christórum sacerdótum, et his, qui in Ægýpto sunt Iudǽis, salútem, et sanitátem.
  "11": De magnis perículis a Deo liberáti, magnífice grátias ágimus ipsi, útpote qui advérsus talem regem dimicávimus.
  "12": Ipse enim ebullíre fecit de Pérside eos, qui pugnavérunt contra nos, et sanctam civitátem.
  "13": Nam cum in Pérside esset dux ipse, et cum ipso imménsus exércitus, cécidit in templo Nanéæ, consílio decéptus sacerdótum Nanéæ.
  "14": Etenim cum ea habitatúrus venit ad locum Antíochus, et amíci eius, et ut accíperet pecúnias multas dotis nómine.
  "15": Cumque proposuíssent eas sacerdótes Nanéæ, et ipse cum paucis ingréssus esset intra ámbitum fani, clausérunt templum,
  "16": 'cum intrásset Antíochus: apertóque occúlto áditu templi, mitténtes lápides percussérunt ducem, et eos qui cum eo erant: et divisérunt membrátim, et capítibus amputátis foras proiecérunt.'
  "17": Per ómnia benedíctus Deus, qui trádidit ímpios.
  "18": 'Factúri ígitur quinta et vigésima die mensis Casleu purificatiónem templi, necessárium dúximus significáre vobis: ut et vos quoque agátis diem scenopégiæ, et diem ignis, qui datus est quando Nehemías ædificáto templo et altári óbtulit sacrifícia.'
  "19": Nam cum in Pérsidem duceréntur patres nostri, sacerdótes, qui tunc cultóres Dei erant, accéptum ignem de altári occúlte abscondérunt in valle, ubi erat púteus altus, et siccus, et in eo contutáti sunt eum, ita ut ómnibus ignótus esset locus.
  "20": 'Cum autem præteríssent anni multi, et plácuit Deo ut mitterétur Nehemías a rege Pérsidis: nepótes sacerdótum illórum, qui abscónderant, misit ad requiréndum ignem: et sicut narravérunt nobis, non invenérunt ignem, sed aquam crassam.'
  "21": 'Et iussit eos hauríre, et afférre sibi: et sacrifícia, quæ impósita erant, iussit sacérdos Nehemías aspérgi ipsa aqua: et ligna, et quæ erant superpósita.'
  "22": Utque hoc factum est, et tempus áffuit quo sol refúlsit, qui prius erat in núbilo, accénsus est ignis magnus, ita ut omnes miraréntur.
  "23": Oratiónem autem faciébant omnes sacerdótes, dum consummarétur sacrifícium, Iónatha inchoánte, céteris autem respondéntibus.
  "24": 'Et Nehemíæ erat orátio hunc habens modum: Dómine Deus ómnium creátor, terríbilis, et fortis, iustus, et miséricors, qui solus es bonus rex,'
  "25": 'solus præstans, solus iustus, et omnípotens, et ætérnus, qui líberas Israel de omni malo, qui fecísti patres eléctos, et sanctificásti eos:'
  "26": áccipe sacrifícium pro univérso pópulo tuo Israel, et custódi partem tuam, et sanctífica.
  "27": 'Cóngrega dispersiónem nostram, líbera eos, qui sérviunt géntibus, et contémptos et abominátos réspice: ut sciant gentes quia tu es Deus noster.'
  "28": Afflíge oppriméntes nos, et contuméliam faciéntes in supérbia.
  "29": Constítue pópulum tuum in loco sancto tuo, sicut dixit Móyses.
  "30": Sacerdótes autem psallébant hymnos, úsquequo consúmptum esset sacrifícium.
  "31": Cum autem consúmptum esset sacrifícium, ex resídua aqua Nehemías iussit lápides maióres perfúndi.
  "32": 'Quod ut factum est, ex eis flamma accénsa est: sed ex lúmine quod refúlsit ab altári, consúmpta est.'
  "33": Ut vero manifestáta est res, renuntiátum est regi Persárum quod in loco, in quo ignem abscónderant hi, qui transláti fúerant sacerdótes, aqua appáruit, de qua Nehemías, et qui cum eo erant, purificavérunt sacrifícia.
  "34": 'Consíderans autem rex, et rem diligénter exáminans, fecit ei templum, ut probáret quod factum erat:'
  "35": 'et cum probásset, sacerdótibus donávit multa bona, et ália atque ália múnera: et accípiens manu sua, tribuébat eis.'
  "36": Appellávit autem Nehemías hunc locum Nephthar, quod interpretátur Purificátio. Vocátur autem apud plures Nephi.
