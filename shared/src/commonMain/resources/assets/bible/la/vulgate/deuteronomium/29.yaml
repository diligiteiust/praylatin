bible: vulgate
lang: la
language: Latina
book: Deuteronomium
chapter: "29"
verses:
  "1": 'Hæc sunt verba fœ́deris quod præcépit Dóminus Móysi ut feríret cum fíliis Israel in terra Moab: præter illud fœdus, quod cum eis pépigit in Horeb.'
  "2": 'Vocavítque Móyses omnem Israel, et dixit ad eos: Vos vidístis univérsa, quæ fecit Dóminus coram vobis in terra Ægýpti Pharaóni, et ómnibus servis eius, universǽque terræ illíus,'
  "3": tentatiónes magnas, quas vidérunt óculi tui, signa illa, portentáque ingéntia,
  "4": et non dedit vobis Dóminus cor intélligens, et óculos vidéntes, et aures quæ possunt audíre, usque in præséntem diem.
  "5": 'Addúxit vos quadragínta annis per desértum: non sunt attríta vestiménta vestra, nec calceaménta pedum vestrórum vetustáte consúmpta sunt.'
  "6": 'Panem non comedístis, vinum et síceram non bibístis: ut scirétis quia ego sum Dóminus Deus vester.'
  "7": 'Et venístis ad hunc locum: egressúsque est Sehon rex Hésebon, et Og rex Basan, occurréntes nobis ad pugnam. Et percússimus eos,'
  "8": et túlimus terram eórum, ac tradídimus possidéndam Ruben et Gad, et dimídiæ tríbui Manásse.
  "9": 'Custodíte ergo verba pacti huius, et impléte ea: ut intelligátis univérsa quæ fácitis.'
  "10": Vos statis hódie cuncti coram Dómino Deo vestro, príncipes vestri, et tribus, ac maióres natu, atque doctóres, omnis pópulus Israel,
  "11": 'líberi et uxóres vestræ, et ádvena qui tecum morátur in castris, excéptis lignórum cæsóribus, et his, qui compórtant aquas:'
  "12": 'ut tránseas in fœ́dere Dómini Dei tui, et in iureiurándo quod hódie Dóminus Deus tuus pércutit tecum:'
  "13": ut súscitet te sibi in pópulum, et ipse sit Deus tuus sicut locútus est tibi, et sicut iurávit pátribus tuis, Abraham, Isaac, et Iacob.
  "14": Nec vobis solis ego hoc fœdus fério, et hæc iuraménta confírmo,
  "15": sed cunctis præséntibus et abséntibus.
  "16": Vos enim nostis quómodo habitavérimus in terra Ægýpti, et quómodo transiérimus per médium natiónum, quas transeúntes
  "17": vidístis abominatiónes et sordes, id est, idóla eórum, lignum et lápidem, argéntum et aurum, quæ colébant.
  "18": 'Ne forte sit inter vos vir aut múlier, família aut tribus, cuius cor avérsum est hódie a Dómino Deo nostro, ut vadat et sérviat diis illárum géntium: et sit inter vos radix gérminans fel et amaritúdinem.'
  "19": 'Cumque audíerit verba iuraménti huius, benedícat sibi in corde suo, dicens: Pax erit mihi, et ambulábo in pravitáte cordis mei: et absúmat ébria sitiéntem,'
  "20": 'et Dóminus non ignóscat ei: sed tunc quam máxime furor eius fumet, et zelus contra hóminem illum, et sédeant super eum ómnia maledícta, quæ scripta sunt in hoc volúmine: et déleat Dóminus nomen eius sub cælo,'
  "21": et consúmat eum in perditiónem ex ómnibus tríbubus Israel, iuxta maledictiónes, quæ in libro legis huius ac fœ́deris continéntur.
  "22": Dicétque sequens generátio, et fílii qui nascéntur deínceps, et peregríni qui de longe vénerint, vidéntes plagas terræ illíus, et infirmitátes, quibus eam afflíxerit Dóminus,
  "23": súlphure, et salis ardóre combúrens, ita ut ultra non serátur, nec virens quíppiam gérminet, in exémplum subversiónis Sódomæ et Gomórrhæ, Adamæ et Séboim, quas subvértit Dóminus in ira et furóre suo.
  "24": 'Et dicent omnes gentes: Quare sic fecit Dóminus terræ huic? quæ est hæc ira furóris eius imménsa?'
  "25": 'Et respondébunt: Quia dereliquérunt pactum Dómini, quod pépigit cum pátribus eórum, quando edúxit eos de terra Ægýpti:'
  "26": 'et serviérunt diis aliénis, et adoravérunt eos, quos nesciébant, et quibus non fúerant attribúti:'
  "27": 'idcírco irátus est furor Dómini contra terram istam, ut indúceret super eam ómnia maledícta, quæ in hoc volúmine scripta sunt:'
  "28": et eiécit eos de terra sua in ira et in furóre, et in indignatióne máxima, proiecítque in terram aliénam, sicut hódie comprobátur.
  "29": 'Abscóndita, Dómino Deo nostro: quæ manifésta sunt, nobis et fíliis nostris usque in sempitérnum, ut faciámus univérsa verba legis huius.'
