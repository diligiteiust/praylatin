bible: vulgate
lang: la
language: Latina
book: Ieremias
chapter: "24"
verses:
  "1": 'Osténdit mihi Dóminus: et ecce duo cálathi pleni ficis, pósiti ante templum Dómini, postquam tránstulit Nabuchodónosor rex Babylónis Iechoníam fílium Ióakim, regem Iuda, et príncipes eius, et fabrum, et inclusórem de Ierúsalem, et addúxit eos in Babylónem.'
  "2": 'Cálathus unus ficus bonas habébat nimis, ut solent ficus esse primi témporis: et cálathus unus ficus habébat malas nimis, quæ cómedi non póterant, eo quod essent malæ.'
  "3": 'Et dixit Dóminus ad me: Quid tu vides Ieremía? Et dixi : Ficus, ficus bonas, bonas valde : et malas, malas valde: quæ cómedi non possunt, eo quod sint malæ.'
  "4": 'Et factum est verbum Dómini ad me, dicens:'
  "5": 'Hæc dicit Dóminus Deus Israel: Sicut ficus hæ bonæ, sic cognóscam transmigratiónem Iuda, quam emísi de loco isto in terram Chaldæórum, in bonum.'
  "6": 'Et ponam óculos meos super eos ad placándum, et redúcam eos in terram hanc: et ædificábo eos, et non déstruam: et plantábo eos, et non evéllam.'
  "7": 'Et dabo eis cor ut sciant me, quia ego sum Dóminus: et erunt mihi in pópulum, et ego ero eis in Deum, quia reverténtur ad me in toto corde suo.'
  "8": 'Et sicut ficus péssimæ, quæ cómedi non possunt, eo quod sint malæ, hæc dicit Dóminus: Sic dabo Sedecíam regem Iuda, et príncipes eius, et réliquos de Ierúsalem, qui remansérunt in urbe hac, et qui hábitant in terra Ægýpti.'
  "9": 'Et dabo eos in vexatiónem, afflictionémque ómnibus regnis terræ: in oppróbrium, et in parábolam, et in provérbium, et in maledictiónem in univérsis locis, ad quæ eiéci eos.'
  "10": 'Et mittam in eis gládium, et famem, et pestem: donec consumántur de terra, quam dedi eis, et pátribus eórum.'
