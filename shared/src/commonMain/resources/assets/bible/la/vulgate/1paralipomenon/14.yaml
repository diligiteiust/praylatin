bible: vulgate
lang: la
language: Latina
book: I Paralipomenon
chapter: "14"
verses:
  "1": Misit quoque Hiram rex Tyri núntios ad David, et ligna cédrina, et artífices paríetum, lignorúmque, ut ædificárent ei domum.
  "2": Cognovítque David quod confirmásset eum Dóminus in regem super Israel, et sublevátum esset regnum suum super pópulum eius Israel.
  "3": Accépit quoque David álias uxóres in Ierúsalem, genuítque fílios et fílias.
  "4": 'Et hæc nómina eórum, qui nati sunt ei in Ierúsalem: Sámua, et Sobab, Nathan, et Sálomon,'
  "5": Iébahar, et Elísua, et Elíphalet,
  "6": Noga quoque, et Napheg, et Iáphia,
  "7": Elísama, et Baalíada, et Elíphalet.
  "8": 'Audiéntes autem Philísthiim eo quod unctus esset David regem super univérsum Israel, ascendérunt omnes ut quǽrerent eum: quod cum audísset David, egréssus est óbviam eis.'
  "9": Porro Philísthiim veniéntes, diffúsi sunt in Valle Ráphaim.
  "10": 'Consuluítque David Dóminum, dicens: Si ascéndam ad Philisthǽos, et si trades eos in manu mea? Et dixit ei Dóminus: Ascénde, et tradam eos in manu tua.'
  "11": 'Cumque illi ascendíssent in Baalphárasim, percússit eos ibi David, et dixit: Divísit Deus inimícos meos per manum meam, sicut dividúntur aquæ: et idcírco vocátum est nomen illíus loci Baalphárasim.'
  "12": Dereliquerúntque ibi deos suos, quos David iussit exúri.
  "13": Alia étiam vice Philísthiim irruérunt, et diffúsi sunt in valle.
  "14": 'Consuluítque rursum David Deum, et dixit ei Deus: Non ascéndas post eos: recéde ab eis, et vénies contra illos ex advérso pyrórum.'
  "15": 'Cumque audíeris sónitum gradiéntis in cacúmine pyrórum, tunc egrediéris ad bellum: egréssus est enim Deus ante te, ut percútiat castra Philísthiim.'
  "16": Fecit ergo David sicut præcéperat ei Deus, et percússit castra Philisthinórum, de Gábaon usque Gázera.
  "17": Divulgatúmque est nomen David in univérsis regiónibus, et Dóminus dedit pavórem eius super omnes gentes.
