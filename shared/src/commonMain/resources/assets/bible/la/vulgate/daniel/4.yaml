bible: vulgate
lang: la
language: Latina
book: Daniel
chapter: "4"
verses:
  "1": 'Ego Nabuchodónosor quiétus eram in domo mea, et florens in palátio meo:'
  "2": 'sómnium vidi, quod pertérruit me: et cogitatiónes meæ in strato meo, et visiónes cápitis mei conturbavérunt me.'
  "3": Et per me propósitum est decrétum ut introduceréntur in conspéctu meo cuncti sapiéntes Babylónis, et ut solutiónem sómnii indicárent mihi.
  "4": 'Tunc ingrediebántur aríoli, magi, Chaldǽi, et arúspices, et sómnium narrávi in conspéctu eórum: et solutiónem eius non indicavérunt mihi:'
  "5": 'donec colléga ingréssus est in conspéctu meo Dániel, cui nomen Baltássar secúndum nomen dei mei, qui habet spíritum deórum sanctórum in semetípso: et sómnium coram ipso locútus sum.'
  "6": 'Baltássar princeps ariolórum, quóniam ego scio quod spíritum sanctórum deórum hábeas in te, et omne sacraméntum non est impossíbile tibi: visiónes somniórum meórum, quas vidi, et solutiónem eárum narra.'
  "7": 'Vísio cápitis mei in cubíli meo: vidébam, et ecce arbor in médio terræ, et altitúdo eius nímia.'
  "8": 'Magna arbor, et fortis, et procéritas eius contíngens cælum: aspéctus illíus erat usque ad términos univérsæ terræ.'
  "9": 'Fólia eius pulchérrima, et fructus eius nímius: et esca universórum in ea: subter eam habitábant animália, et béstiæ, et in ramis eius conversabántur vólucres cæli: et ex ea vescebátur omnis caro.'
  "10": Vidébam in visióne cápitis mei super stratum meum, et ecce vigil, et sanctus de cælo descéndit.
  "11": 'Clamávit fórtiter, et sic ait: Succídite árborem, et præcídite ramos eius: excútite fólia eius, et dispérgite fructus eius: fúgiant béstiæ, quæ subter eam sunt, et vólucres de ramis eius.'
  "12": Verúmtamen germen radícum eius in terra sínite, et alligétur vínculo férreo et ǽreo in herbis, quæ foris sunt, et rore cæli tingátur, et cum feris pars eius in herba terræ.
  "13": 'Cor eius ab humáno commutétur, et cor feræ detur ei: et septem témpora muténtur super eum.'
  "14": 'In senténtia vígilum decrétum est, et sermo sanctórum, et petítio: donec cognóscant vivéntes quóniam dominátur Excélsus in regno hóminum, et cuicúmque volúerit, dabit illud, et humíllimum hóminem constítuet super eum.'
  "15": 'Hoc sómnium vidi ego Nabuchodónosor rex: tu ergo Baltássar interpretatiónem narra festínus: quia omnes sapiéntes regni mei non queunt solutiónem edícere mihi: tu autem potes, quia spíritus deórum sanctórum in te est.'
  "16": 'Tunc Dániel, cuius nomen Baltássar, cœpit intra semetípsum tácitus cogitáre quasi una hora: et cogitatiónes eius conturbábant eum. Respóndens autem rex, ait: Baltássar, sómnium et interpretátio eius non contúrbent te. Respóndit Baltássar, et dixit: Dómine mi, sómnium his, qui te odérunt, et interpretátio eius hóstibus tuis sit.'
  "17": 'Arborem, quam vidísti sublímem atque robústam, cuius altitúdo pertíngit ad cælum, et aspéctus illíus in omnem terram:'
  "18": 'et rami eius pulchérrimi, et fructus eius nímius, et esca ómnium in ea, subter eam habitántes béstiæ agri, et in ramis eius commorántes aves cæli:'
  "19": 'tu es rex, qui magnificátus es, et invaluísti: et magnitúdo tua crevit, et pervénit usque ad cælum, et potéstas tua in términos univérsæ terræ.'
  "20": 'Quod autem vidit rex vígilem, et sanctum descéndere de cælo, et dícere: Succídite árborem, et dissipáte illam, áttamen germen radícum eius in terra dimíttite, et vinciátur ferro et ære in herbis foris, et rore cæli conspergátur, et cum feris sit pábulum eius, donec septem témpora muténtur super eum:'
  "21": 'hæc est interpretátio senténtiæ Altíssimi, quæ pervénit super dóminum meum regem:'
  "22": 'Eícient te ab homínibus, et cum béstiis ferísque erit habitátio tua, et fœnum ut bos cómedes, et rore cæli infundéris: septem quoque témpora mutabúntur super te, donec scias quod dominétur Excélsus super regnum hóminum, et cuicúmque volúerit, det illud.'
  "23": 'Quod autem præcépit ut relinquerétur germen radícum eius, id est árboris: regnum tuum tibi manébit postquam cognóveris potestátem esse cæléstem.'
  "24": 'Quam ob rem rex consílium meum pláceat tibi, et peccáta tua eleemósynis rédime, et iniquitátes tuas misericórdiis páuperum: fórsitan ignóscet delíctis tuis.'
  "25": Omnia hæc venérunt super Nabuchodónosor regem.
  "26": Post finem ménsium duódecim, in aula Babylónis deambulábat.
  "27": 'Respondítque rex, et ait: Nonne hæc est Bábylon magna, quam ego ædificávi in domum regni, in róbore fortitúdinis meæ, et in glória decóris mei?'
  "28": 'Cumque sermo adhuc esset in ore regis, vox de cælo ruit: Tibi dícitur Nabuchodónosor rex: Regnum tuum transíbit a te,'
  "29": 'et ab homínibus eícient te, et cum béstiis et feris erit habitátio tua: fœnum quasi bos cómedes, et septem témpora mutabúntur super te, donec scias quod dominétur Excélsus in regno hóminum, et cuicúmque volúerit, det illud.'
  "30": Eádem hora sermo complétus est super Nabuchodónosor, et ex homínibus abiéctus est, et fœnum ut bos comédit, et rore cæli corpus eius inféctum est, donec capílli eius in similitúdinem aquilárum créscerent, et ungues eius quasi ávium.
  "31": 'Igitur post finem diérum, ego Nabuchodónosor óculos meos ad cælum levávi, et sensus meus rédditus est mihi: et Altíssimo benedíxi, et vivéntem in sempitérnum laudávi, et glorificávi: quia potéstas eius potéstas sempitérna, et regnum eius in generatiónem et generatiónem.'
  "32": 'Et omnes habitatóres terræ apud eum in níhilum reputáti sunt: iuxta voluntátem enim suam facit tam in virtútibus cæli quam in habitatóribus terræ: et non est qui resístat mánui eius, et dicat ei: Quare fecísti?'
  "33": 'In ipso témpore sensus meus revérsus est ad me, et ad honórem regni mei, decorémque pervéni: et figúra mea revérsa est ad me: et optimátes mei, et magistrátus mei requisiérunt me, et in regno meo restitútus sum: et magnificéntia ámplior áddita est mihi.'
  "34": 'Nunc ígitur ego Nabuchodónosor laudo, et magnífico, et glorífico regem cæli: quia ómnia ópera eius vera, et viæ eius iudícia, et gradiéntes in supérbia potest humiliáre.'
