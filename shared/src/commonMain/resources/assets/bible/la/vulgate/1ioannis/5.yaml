bible: vulgate
lang: la
language: Latina
book: I Ioannis
chapter: "5"
verses:
  "1": Omnis, qui credit quóniam Iesus est Christus, ex Deo natus est. Et omnis, qui díligit eum qui génuit, díligit et eum qui natus est ex eo.
  "2": In hoc cognóscimus quóniam dilígimus natos Dei, cum Deum diligámus, et mandáta eius faciámus.
  "3": 'Hæc est enim cáritas Dei, ut mandáta eius custodiámus: et mandáta eius grávia non sunt.'
  "4": 'Quóniam omne, quod natum est ex Deo, vincit mundum: et hæc est victória, quæ vincit mundum, fides nostra.'
  "5": Quis est, qui vincit mundum, nisi qui credit quóniam Iesus est Fílius Dei?
  "6": 'Hic est, qui venit per aquam et sánguinem, Iesus Christus: non in aqua solum, sed in aqua et sánguine. Et spíritus est, qui testificátur, quóniam Christus est véritas.'
  "7": 'Quóniam tres sunt, qui testimónium dant in cælo: Pater, Verbum, et Spíritus sanctus: et hi tres unum sunt.'
  "8": 'Et tres sunt, qui testimónium dant in terra: spíritus, et aqua, et sanguis: et hi tres unum sunt.'
  "9": 'Si testimónium hóminum accípimus, testimónium Dei maius est: quóniam hoc est testimónium Dei, quod maius est, quóniam testificátus est de Fílio suo.'
  "10": 'Qui credit in Fílium Dei, habet testimónium Dei in se. Qui non credit Fílio, mendácem facit eum: quia non credit in testimónium quod testificátus est Deus de Fílio suo.'
  "11": 'Et hoc est testimónium, quóniam vitam ætérnam dedit nobis Deus: et hæc vita in Fílio eius est.'
  "12": 'Qui habet Fílium, habet vitam: qui non habet Fílium, vitam non habet.'
  "13": 'Hæc scribo vobis: ut sciátis quóniam vitam habétis ætérnam, qui créditis in nómine Fílii Dei.'
  "14": 'Et hæc est fidúcia, quam habémus ad eum: quia quodcúmque petiérimus secúndum voluntátem eius, audit nos.'
  "15": 'Et scimus quia audit nos quidquid petiérimus: scimus quóniam habémus petitiónes quas postulámus ab eo.'
  "16": 'Qui scit fratrem suum peccáre peccátum non ad mortem, petat, et dábitur ei vita peccánti non ad mortem. Est peccátum ad mortem: non pro illo dico ut roget quis.'
  "17": 'Omnis iníquitas, peccátum est: et est peccátum ad mortem.'
  "18": 'Scimus quia omnis, qui natus est ex Deo, non peccat: sed generátio Dei consérvat eum, et malígnus non tangit eum.'
  "19": 'Scimus quóniam ex Deo sumus: et mundus totus in malígno pósitus est.'
  "20": Et scimus quóniam Fílius Dei venit, et dedit nobis sensum ut cognoscámus verum Deum, et simus in vero Fílio eius. Hic est verus Deus, et vita ætérna.
  "21": Filíoli, custodíte vos a simulácris. Amen.
