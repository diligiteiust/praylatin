bible: vulgate
lang: la
language: Latina
book: II Regum
chapter: "8"
verses:
  "1": 'Eliséus autem locútus est ad mulíerem, cuius vívere fécerat fílium, dicens: Surge, vade tu et domus tua, et peregrináre ubicúmque repéreris: vocávit enim Dóminus famem, et véniet super terram septem annis.'
  "2": 'Quæ surréxit, et fecit iuxta verbum hóminis Dei: et vadens cum domo sua, peregrináta est in terra Philísthiim diébus multis.'
  "3": 'Cumque finíti essent anni septem, revérsa est múlier de terra Philísthiim: et egréssa est ut interpelláret regem pro domo sua, et pro agris suis.'
  "4": 'Rex autem loquebátur cum Giézi púero viri Dei, dicens: Narra mihi ómnia magnália quæ fecit Eliséus.'
  "5": 'Cumque ille narráret regi quómodo mórtuum suscitásset, appáruit múlier, cuius vivificáverat fílium, clamans ad regem pro domo sua, et pro agris suis. Dixítque Giézi: Dómine mi rex, hæc est múlier, et hic est fílius eius, quem suscitávit Eliséus.'
  "6": 'Et interrogávit rex mulíerem: quæ narrávit ei. Dedítque ei rex eunúchum unum, dicens: Restítue ei ómnia quæ sua sunt, et univérsos réditus agrórum a die, qua relíquit terram usque ad præsens.'
  "7": 'Venit quoque Eliséus Damáscum, et Bénadad rex Sýriæ ægrotábat: nuntiaverúntque ei, dicéntes: Venit vir Dei huc.'
  "8": 'Et ait rex ad Házael: Tolle tecum múnera, et vade in occúrsum viri Dei, et cónsule Dóminum per eum, dicens: Si evádere pótero de infirmitáte mea hac?'
  "9": 'Ivit ígitur Házael in occúrsum eius, habens secum múnera, et ómnia bona Damásci, ónera quadragínta camelórum. Cumque stetísset coram eo, ait: Fílius tuus Bénadad rex Sýriæ misit me ad te, dicens: Si sanári pótero de infirmitáte mea hac?'
  "10": 'Dixítque ei Eliséus: Vade, dic ei: Sanáberis: porro osténdit mihi Dóminus quia morte moriétur.'
  "11": 'Stetíque cum eo, et conturbátus est usque ad suffusiónem vultus: flevítque vir Dei.'
  "12": 'Cui Házael ait: Quare dóminus meus flet? At ille dixit: Quia scio quæ factúrus sis fíliis Israel mala. Civitátes eórum munítas igne succéndes, et iúvenes eórum interfícies gládio, et párvulos eórum elídes, et prægnántes dívides.'
  "13": 'Dixítque Házael: Quid enim sum servus tuus canis, ut fáciam rem istam magnam? Et ait Eliséus: Osténdit mihi Dóminus te regem Sýriæ fore.'
  "14": 'Qui cum recessísset ab Eliséo, venit ad dóminum suum. Qui ait ei: Quid dixit tibi Eliséus? At ille respóndit: Dixit mihi: Recípies sanitátem.'
  "15": 'Cumque venísset dies áltera, tulit strágulum, et infúdit aquam, et expándit super fáciem eius: quo mórtuo, regnávit Házael pro eo.'
  "16": Anno quinto Ioram fílii Achab regis Israel, et Iósaphat regis Iuda, regnávit Ioram fílius Iósaphat rex Iuda.
  "17": Trigínta duórum annórum erat cum regnáre cœpísset, et octo annis regnávit in Ierúsalem.
  "18": 'Ambulavítque in viis regum Israel, sicut ambuláverat domus Achab: fília enim Achab erat uxor eius: et fecit quod malum est in conspéctu Dómini.'
  "19": Nóluit autem Dóminus dispérdere Iudam, propter David servum suum, sicut promíserat ei, ut daret illi lucérnam, et fíliis eius cunctis diébus.
  "20": In diébus eius recéssit Edom ne esset sub Iuda, et constítuit sibi regem.
  "21": 'Venítque Ioram Séira, et omnes currus cum eo: et surréxit nocte, percussítque Idumǽos, qui eum circumdéderant, et príncipes cúrruum: pópulus autem fugit in tabernácula sua.'
  "22": Recéssit ergo Edom ne esset sub Iuda, usque ad diem hanc. Tunc recéssit et Lobna in témpore illo.
  "23": Réliqua autem sermónum Ioram, et univérsa, quæ fecit, nonne hæc scripta sunt in Libro verbórum diérum regum Iuda?
  "24": Et dormívit Ioram cum pátribus suis, sepultúsque est cum eis in civitáte David, et regnávit Ochozías fílius eius pro eo.
  "25": Anno duodécimo Ioram fílii Achab regis Israel regnávit Ochozías fílius Ioram regis Iudæ.
  "26": 'Vigínti duórum annórum erat Ochozías cum regnáre cœpísset, et uno anno regnávit in Ierúsalem: nomen matris eius Athalía fília Amri regis Israel.'
  "27": 'Et ambulávit in viis domus Achab: et fecit quod malum est coram Dómino, sicut domus Achab: gener enim domus Achab fuit.'
  "28": Abiit quoque cum Ioram fílio Achab ad prœliándum contra Házael regem Sýriæ in Ramoth Gálaad, et vulneravérunt Syri Ioram.
  "29": Qui revérsus est ut curarétur in Iézrahel, quia vulneráverant eum Syri in Ramoth prœliántem contra Házael regem Sýriæ. Porro Ochozías fílius Ioram rex Iuda descéndit invísere Ioram fílium Achab in Iézrahel, quia ægrotábat ibi.
