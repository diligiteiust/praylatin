bible: vulgate
lang: la
language: Latina
book: Ezechiel
chapter: "6"
verses:
  "1": 'Et factus est sermo Dómini ad me, dicens:'
  "2": Fili hóminis pone fáciem tuam ad montes Israel, et prophetábis ad eos,
  "3": 'et dices: Montes Israel audíte verbum Dómini Dei: Hæc dicit Dóminus Deus móntibus, et cóllibus, rúpibus, et vállibus: Ecce ego indúcam super vos gládium, et dispérdam excélsa vestra,'
  "4": 'et demóliar aras vestras, et confringéntur simulácra vestra: et deíciam interféctos vestros ante idóla vestra.'
  "5": 'Et dabo cadávera filiórum Israel ante fáciem simulacrórum vestrórum: et dispérgam ossa vestra circum aras vestras'
  "6": 'in ómnibus habitatiónibus vestris. Urbes desértæ erunt, et excélsa demoliéntur, et dissipabúntur: et interíbunt aræ vestræ, et confringéntur: et cessábunt idóla vestra, et conteréntur delúbra vestra, et delebúntur ópera vestra.'
  "7": Et cadet interféctus in médio vestri, et sciétis quia ego sum Dóminus.
  "8": Et relínquam in vobis eos, qui fúgerint gládium in géntibus, cum dispérsero vos in terris.
  "9": 'Et recordabúntur mei liberáti vestri in géntibus, ad quas captívi ducti sunt: quia contrívi cor eórum fórnicans, et recédens a me, et óculos eórum fornicántes post idóla sua: et displicébunt sibímet super malis quæ fecérunt in univérsis abominatiónibus suis.'
  "10": Et scient quia ego Dóminus non frustra locútus sum, ut fácerem eis malum hoc.
  "11": 'Hæc dicit Dóminus Deus: Pércute manum tuam, et allíde pedem tuum, et dic: Heu, ad omnes abominatiónes malórum domus Israel: quia gládio, fame, et peste ruitúri sunt.'
  "12": 'Qui longe est, peste moriétur: qui autem prope, gládio córruet: et qui relíctus fúerit et obséssus, fame moriétur: et complébo indignatiónem meam in eis.'
  "13": Et sciétis quia ego Dóminus, cum fúerint interfécti vestri in médio idolórum vestrórum, in circúitu arárum vestrárum, in omni colle excélso, et in cunctis summitátibus móntium, et subtus omne lignum nemorósum, et subtus univérsam quercum frondósam, locum ubi accendérunt thura redoléntia univérsis idólis suis.
  "14": 'Et exténdam manum meam super eos: et fáciam terram desolátam et destitútam, a desérto Déblatha, in ómnibus habitatiónibus eórum: et scient quia ego Dóminus.'
