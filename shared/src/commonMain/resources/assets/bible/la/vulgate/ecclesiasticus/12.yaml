bible: vulgate
lang: la
language: Latina
book: Ecclesiasticus
chapter: "12"
verses:
  "1": Si beneféceris, scito cui féceris, et erit grátia in bonis tuis multa.
  "2": 'Bénefac iusto, et invénies retributiónem magnam: et si non ab ipso, certe a Dómino.'
  "3": 'Non est enim ei bene qui assíduus est in malis, et eleemósynas non danti: quóniam et Altíssimus ódio habet peccatóres, et misértus est pœniténtibus.'
  "4": 'Da misericórdi, et ne suscípias peccatórem: et ímpiis et peccatóribus reddet vindíctam, custódiens eos in diem vindíctæ.'
  "5": Da bono, et non recéperis peccatórem.
  "6": 'Bénefac húmili, et non déderis ímpio: próhibe panes illi dari, ne in ipsis poténtior te sit:'
  "7": 'nam duplícia mala invénies in ómnibus bonis, quæcúmque féceris illi: quóniam et Altíssimus ódio habet peccatóres, et ímpiis reddet vindíctam.'
  "8": Non agnoscétur in bonis amícus, et non abscondétur in malis inimícus.
  "9": 'In bonis viri, inimíci illíus in tristítia: et in malítia illíus, amícus ágnitus est.'
  "10": 'Non credas inimíco tuo in ætérnum: sicut enim æraméntum ærúginat nequítia illíus:'
  "11": et si humiliátus vadat curvus, ádice ánimum tuum, et custódi te ab illo.
  "12": 'Non státuas illum penes te, nec sédeat ad déxteram tuam, ne forte convérsus in locum tuum, inquírat cáthedram tuam: et in novíssimo agnósces verba mea, et in sermónibus meis stimuléris.'
  "13": Quis miserébitur incantatóri a serpénte percússo, et ómnibus qui apprópiant béstiis? et sic qui comitátur cum viro iníquo, et obvolútus est in peccátis eius.
  "14": 'Una hora tecum permanébit: si autem declináveris, non supportábit.'
  "15": In lábiis suis indúlcat inimícus, et in corde suo insidiátur ut subvértat te in fóveam.
  "16": 'In óculis suis lacrymátur inimícus: et si invénerit tempus, non satiábitur sánguine.'
  "17": Et si incúrrerint tibi mala, invénies eum illic priórem.
  "18": In óculis suis lacrymátur inimícus, et quasi ádiuvans suffódiet plantas tuas.
  "19": Caput suum movébit, et plaudet manu, et multa susúrrans commutábit vultum suum.
