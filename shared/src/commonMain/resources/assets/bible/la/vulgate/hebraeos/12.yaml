bible: vulgate
lang: la
language: Latina
book: ad Hebraeos
chapter: "12"
verses:
  "1": 'Ideóque et nos tantam habéntes impósitam nubem téstium, deponéntes omne pondus, et circúmstans nos peccátum, per patiéntiam currámus ad propósitum nobis certámen:'
  "2": aspiciéntes in auctórem fídei, et consummatórem Iesum, qui propósito sibi gáudio sustínuit crucem, confusióne contémpta, atque in déxtera sedis Dei sedet.
  "3": 'Recogitáte enim eum, qui talem sustínuit a peccatóribus advérsum semetípsum contradictiónem: ut ne fatigémini, ánimis vestris deficiéntes.'
  "4": 'Nondum enim usque ad sánguinem restitístis, advérsus peccátum repugnántes:'
  "5": 'et oblíti estis consolatiónis, quæ vobis tamquam fíliis lóquitur, dicens: Fili mi, noli neglígere disciplínam Dómini: neque fatigéris dum ab eo argúeris.'
  "6": 'Quem enim díligit Dóminus, castígat: flagéllat autem omnem fílium, quem récipit.'
  "7": 'In disciplína perseveráte. Tamquam fíliis vobis offert se Deus: quis enim fílius, quem non córripit pater?'
  "8": 'Quod si extra disciplínam estis, cuius partícipes facti sunt omnes: ergo adúlteri, et non fílii estis.'
  "9": 'Deínde patres quidem carnis nostræ, eruditóres habúimus, et reverebámur eos: non multo magis obtemperábimus Patri spirítuum, et vivémus?'
  "10": 'Et illi quidem in témpore paucórum diérum, secúndum voluntátem suam erudiébant nos: hic autem ad id, quod útile est in recipiéndo sanctificatiónem eius.'
  "11": 'Omnis autem disciplína in præsénti quidem vidétur non esse gáudii, sed mœróris: póstea autem fructum pacatíssimum exercitátis per eam, reddet iustítiæ.'
  "12": 'Propter quod remíssas manus, et solúta génua erígite:'
  "13": 'et gressus rectos fácite pédibus vestris: ut non cláudicans quis erret, magis autem sanétur.'
  "14": 'Pacem sequímini cum ómnibus, et sanctimóniam, sine qua nemo vidébit Deum:'
  "15": 'contemplántes ne quis desit grátiæ Dei: ne qua radix amaritúdinis sursum gérminans impédiat, et per illam inquinéntur multi.'
  "16": 'Ne quis fornicátor, aut profánus ut Esau: qui propter unam escam véndidit primitíva sua:'
  "17": 'scitóte enim quóniam et póstea cúpiens hereditáre benedictiónem, reprobátus est: non enim invénit pœniténtiæ locum, quamquam cum lácrymis inquisísset eam.'
  "18": Non enim accessístis ad tractábilem montem, et accensíbilem ignem, et túrbinem, et calíginem, et procéllam,
  "19": et tubæ sonum, et vocem verbórum, quam qui audiérunt, excusavérunt se, ne eis fíeret verbum.
  "20": 'Non enim portábant quod dicebátur: Et si béstia tetígerit montem, lapidábitur.'
  "21": 'Et ita terríbile erat quod videbátur, Móyses dixit: Extérritus sum, et tremebúndus.'
  "22": Sed accessístis ad Sion montem, et civitátem Dei vivéntis, Ierúsalem cæléstem, et multórum míllium angelórum frequéntiam,
  "23": et Ecclésiam primitivórum, qui conscrípti sunt in cælis, et iúdicem ómnium Deum, et spíritus iustórum perfectórum,
  "24": et testaménti novi mediatórem Iesum, et sánguinis aspersiónem mélius loquéntem quam Abel.
  "25": 'Vidéte ne recusétis loquéntem. Si enim illi non effugérunt, recusántes eum, qui super terram loquebátur: multo magis nos, qui de cælis loquéntem nobis avértimus.'
  "26": 'Cuius vox movit terram tunc: nunc autem repromíttit, dicens: Adhuc semel, et ego movébo non solum terram, sed et cælum.'
  "27": 'Quod autem, Adhuc semel, dicit: declárat mobílium translatiónem tamquam factórum, ut máneant ea, quæ sunt immobília.'
  "28": 'Itaque regnum immóbile suscipiéntes, habémus grátiam: per quam serviámus placéntes Deo, cum metu et reveréntia.'
  "29": Etenim Deus noster ignis consúmens est.
