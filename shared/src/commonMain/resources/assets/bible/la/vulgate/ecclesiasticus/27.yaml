bible: vulgate
lang: la
language: Latina
book: Ecclesiasticus
chapter: "27"
verses:
  "1": 'Propter inópiam multi deliquérunt: et qui quærit locupletári, avértit óculum suum.'
  "2": Sicut in médio compáginis lápidum palus fígitur, sic et inter médium venditiónis et emptiónis angustiábitur peccátum.
  "3": Conterétur cum delinquénte delíctum.
  "4": Si non in timóre Dómini tenúeris te instánter, cito subvertétur domus tua.
  "5": Sicut in percussúra cribri remanébit pulvis, sic apória hóminis in cogitátu illíus.
  "6": Vasa fíguli probat fornax, et hómines iustos tentátio tribulatiónis.
  "7": Sicut rusticátio de ligno osténdit fructum illíus, sic verbum ex cogitátu cordis hóminis.
  "8": 'Ante sermónem non laudes virum: hæc enim tentátio est hóminum.'
  "9": 'Si sequáris iustítiam, apprehéndes illam, et índues quasi podérem honóris: et inhabitábis cum ea, et próteget te in sempitérnum, et in die agnitiónis invénies firmaméntum.'
  "10": 'Volatília ad sibi simília convéniunt: et véritas ad eos, qui operántur illam, revertétur.'
  "11": 'Leo venatióni insidiátur semper: sic peccáta operántibus iniquitátes.'
  "12": 'Homo sanctus in sapiéntia manet sicut sol: nam stultus sicut luna mutátur.'
  "13": 'In médio insensatórum serva verbum témpori: in médio autem cogitántium assíduus esto.'
  "14": Narrátio peccántium odiósa, et risus illórum in delíciis peccáti.
  "15": 'Loquéla multum iurans horripilatiónem cápiti státuet: et irreveréntia ipsíus obturátio áurium.'
  "16": 'Effúsio sánguinis in rixa superbórum: et maledíctio illórum audítus gravis.'
  "17": Qui denúdat arcána amíci, fidem perdit, et non invéniet amícum ad ánimum suum.
  "18": Dílige próximum, et coniúngere fide cum illo.
  "19": Quod si denudáveris abscónsa illíus, non persequéris post eum.
  "20": Sicut enim homo, qui perdit amícum suum, sic et qui perdit amicítiam próximi sui.
  "21": Et sicut qui dimíttit avem de manu sua, sic dereliquísti próximum tuum, et non eum cápies.
  "22": 'Non illum sequáris, quóniam longe abest: effúgit enim quasi cáprea de láqueo: quóniam vulneráta est ánima eius:'
  "23": 'ultra eum non póteris colligáre. Et maledícti est concordátio:'
  "24": denudáre autem amíci mystéria, desperátio est ánimæ infelícis.
  "25": Annuens óculo fábricat iníqua, et nemo eum abíciet.
  "26": 'In conspéctu oculórum tuórum condulcábit os suum, et super sermónes tuos admirábitur: novíssime autem pervértet os suum, et in verbis tuis dabit scándalum.'
  "27": Multa odívi, et non coæquávi ei, et Dóminus ódiet illum.
  "28": 'Qui in altum mittit lápidem, super caput eius cadet: et plaga dolósa dolósi dívidet vúlnera.'
  "29": 'Et qui fóveam fodit, íncidet in eam: et qui státuit lápidem próximo, offéndet in eo: et qui láqueum álii ponit, períbit in illo.'
  "30": Faciénti nequíssimum consílium, super ipsum devolvétur, et non agnóscet unde advéniat illi.
  "31": Illúsio et impropérium superbórum, et vindícta sicut leo insidiábitur illi.
  "32": 'Láqueo períbunt qui oblectántur casu iustórum: dolor autem consúmet illos ántequam moriántur.'
  "33": Ira et furor, útraque exsecrabília sunt, et vir peccátor cóntinens erit illórum.
