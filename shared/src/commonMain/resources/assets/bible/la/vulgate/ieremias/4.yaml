bible: vulgate
lang: la
language: Latina
book: Ieremias
chapter: "4"
verses:
  "1": 'Si revérteris Israel, ait Dóminus, ad me convértere: si abstúleris offendícula tua a fácie mea, non commovéberis.'
  "2": 'Et iurábis: Vivit Dóminus in veritáte, et in iudício, et in iustítia: et benedícent eum gentes, ipsúmque laudábunt.'
  "3": 'Hæc enim dicit Dóminus viro Iuda et Ierúsalem: Nováte vobis novále, et nolíte sérere super spinas.'
  "4": 'Circumcidímini Dómino, et auférte præpútia córdium vestrórum viri Iuda, et habitatóres Ierúsalem: ne forte egrediátur ut ignis indignátio mea, et succendátur, et non sit qui exstínguat, propter malítiam cogitatiónum vestrárum.'
  "5": 'Annuntiáte in Iuda, et in Ierúsalem audítum fácite: loquímini, et cánite tuba in terra: clamáte fórtiter, et dícite: Congregámini, et ingrediámur civitátes munítas.'
  "6": 'Leváte signum in Sion: confortámini, nolíte stare: quia malum ego addúco ab aquilóne, et contritiónem magnam.'
  "7": 'Ascéndit leo de cubíli suo, et prædo géntium se levávit: egréssus est de loco suo ut ponat terram tuam in solitúdinem: civitátes tuæ vastabúntur, remanéntes absque habitatóre.'
  "8": 'Super hoc accíngite vos cilíciis, plángite, et ululáte: quia non est avérsa ira furóris Dómini a nobis.'
  "9": 'Et erit in die illa, dicit Dóminus: períbit cor regis, et cor príncipum: et obstupéscent sacerdótes, et prophétæ consternabúntur.'
  "10": 'Et dixi: Heu, heu, heu Dómine Deus, ergóne decepísti pópulum istum et Ierúsalem, dicens: Pax erit vobis: et ecce pervénit gládius usque ad ánimam?'
  "11": 'In témpore illo dicétur pópulo huic et Ierúsalem: Ventus urens in viis, quæ sunt in desérto viæ fíliæ pópuli mei, non ad ventilándum et ad purgándum.'
  "12": Spíritus plenus ex his véniet mihi, et nunc ego loquar iudícia mea cum eis.
  "13": 'Ecce quasi nubes ascéndet, et quasi tempéstas currus eius: velocióres áquilis equi illíus: væ nobis, quóniam vastáti sumus.'
  "14": 'Lava a malítia cor tuum Ierúsalem, ut salva fias: úsquequo morabúntur in te cogitatiónes nóxiæ?'
  "15": Vox enim annuntiántis a Dan, et notum faciéntis idólum de monte Ephraim.
  "16": 'Dícite géntibus: Ecce audítum est in Ierúsalem custódes veníre de terra longínqua, et dare super civitátes Iuda vocem suam.'
  "17": 'Quasi custódes agrórum facti sunt super eam in gyro: quia me ad iracúndiam provocávit, dicit Dóminus.'
  "18": 'Viæ tuæ, et cogitatiónes tuæ fecérunt hæc tibi: ista malítia tua, quia amára, quia tétigit cor tuum.'
  "19": 'Ventrem meum, ventrem meum dóleo, sensus cordis mei turbáti sunt in me: non tacébo, quóniam vocem búccinæ audívit ánima mea, clamórem prœ́lii.'
  "20": 'Contrítio super contritiónem vocáta est, et vastáta est omnis terra: repénte vastáta sunt tabernácula mea, súbito pelles meæ.'
  "21": Usquequo vidébo fugiéntem, áudiam vocem búccinæ?
  "22": 'Quia stultus pópulus meus me non cognóvit: fílii insipiéntes sunt et vecórdes: sapiéntes sunt ut fáciant mala, bene autem fácere nesciérunt.'
  "23": 'Aspéxi terram, et ecce vácua erat et níhili: et cælos, et non erat lux in eis.'
  "24": 'Vidi montes, et ecce movebántur: et omnes colles conturbáti sunt.'
  "25": 'Intúitus sum, et non erat homo: et omne volátile cæli recéssit.'
  "26": 'Aspéxi, et ecce Carmélus desértus: et omnes urbes eius destrúctæ sunt a fácie Dómini, et a fácie iræ furóris eius.'
  "27": 'Hæc enim dicit Dóminus: Desérta erit omnis terra, sed tamen consummatiónem non fáciam.'
  "28": 'Lugébit terra, et mœrébunt cæli désuper: eo quod locútus sum, cogitávi, et non pœnítuit me, nec avérsus sum ab eo.'
  "29": 'A voce équitis et mitténtis sagíttam fugit omnis cívitas: ingréssi sunt árdua, et ascendérunt rupes: univérsæ urbes derelíctæ sunt, et non hábitat in eis homo.'
  "30": 'Tu autem vastáta quid fácies? cum vestíeris te cóccino, cum ornáta fúeris moníli áureo, et pínxeris stíbio óculos tuos, frustra componéris: contempsérunt te amatóres tui, ánimam tuam quærent.'
  "31": 'Vocem enim quasi parturiéntis audívi, angústias ut puérperæ: vox fíliæ Sion intermoriéntis, expandentísque manus suas: væ mihi, quia defécit ánima mea propter interféctos.'
