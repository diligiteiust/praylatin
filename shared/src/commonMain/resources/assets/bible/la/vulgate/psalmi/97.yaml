bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "97"
verses:
  "1": 'Psalmus ipsi David. Cantáte Dómino cánticum novum: quia mirabília fecit. Salvávit sibi déxtera eius, et bráchium sanctum eius.'
  "2": 'Notum fecit Dóminus salutáre suum: in conspéctu géntium revelávit iustítiam suam.'
  "3": Recordátus est misericórdiæ suæ, et veritátis suæ dómui Israel. Vidérunt omnes términi terræ salutáre Dei nostri.
  "4": 'Iubiláte Deo omnis terra: cantáte, et exsultáte, et psállite.'
  "5": 'Psállite Dómino in cíthara, in cíthara et voce psalmi:'
  "6": 'in tubis ductílibus, et voce tubæ córneæ. Iubiláte in conspéctu regis Dómini:'
  "7": 'moveátur mare, et plenitúdo eius: orbis terrárum, et qui hábitant in eo.'
  "8": Flúmina plaudent manu, simul montes exsultábunt
  "9": 'a conspéctu Dómini: quóniam venit iudicáre terram. Iudicábit orbem terrárum in iustítia, et pópulos in æquitáte.'
