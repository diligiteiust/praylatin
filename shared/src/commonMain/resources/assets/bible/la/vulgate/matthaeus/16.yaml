bible: vulgate
lang: la
language: Latina
book: Matthaeus
chapter: "16"
verses:
  "1": 'Et accessérunt ad eum Pharisǽi, et Sadducǽi tentántes: et rogavérunt eum ut signum de cælo osténderet eis.'
  "2": 'At ille respóndens, ait illis: Facto véspere dícitis: Serénum erit, rubicúndum est enim cælum.'
  "3": 'Et mane: Hódie tempéstas, rútilat enim triste cælum.'
  "4": 'Fáciem ergo cæli diiudicáre nostis: signa autem témporum non potéstis scire? Generátio mala et adúltera signum quærit: et signum non dábitur ei, nisi signum Ionæ prophétæ. Et relíctis illis, ábiit.'
  "5": Et cum veníssent discípuli eius trans fretum, oblíti sunt panes accípere.
  "6": 'Qui dixit illis: Intuémini, et cavéte a ferménto Pharisæórum, et Sadducæórum.'
  "7": 'At illi cogitábant intra se dicéntes: Quia panes non accépimus.'
  "8": 'Sciens autem Iesus, dixit: Quid cogitátis intra vos módicæ fídei, quia panes non habétis?'
  "9": Nondum intellígitis, neque recordámini quinque panum in quinque míllia hóminum, et quot cóphinos sumpsístis?
  "10": Neque septem panum in quátuor míllia hóminum, et quot sportas sumpsístis?
  "11": 'Quare non intellígitis, quia non de pane dixi vobis: Cavéte a ferménto Pharisæórum, et Sadducæórum?'
  "12": Tunc intellexérunt quia non díxerit cavéndum a ferménto panum, sed a doctrína Pharisæórum, et Sadducæórum.
  "13": 'Venit autem Iesus in partes Cæsaréæ Philíppi: et interrogábat discípulos suos, dicens: Quem dicunt hómines esse Fílium hóminis?'
  "14": 'At illi dixérunt: Alii Ioánnem Baptístam, álii autem Elíam, álii vero Ieremíam, aut unum ex prophétis.'
  "15": 'Dicit illis Iesus: Vos autem, quem me esse dícitis?'
  "16": 'Respóndens Simon Petrus dixit: Tu es Christus, Fílius Dei vivi.'
  "17": 'Respóndens autem Iesus, dixit ei: Beátus es Simon Bar Iona: quia caro et sanguis non revelávit tibi, sed Pater meus, qui in cælis est.'
  "18": Et ego dico tibi, quia tu es Petrus, et super hanc petram ædificábo Ecclésiam meam, et portæ ínferi non prævalébunt advérsus eam.
  "19": 'Et tibi dabo claves regni cælórum. Et quodcúmque ligáveris super terram, erit ligátum et in cælis: et quodcúmque sólveris super terram, erit solútum et in cælis.'
  "20": Tunc præcépit discípulis suis ut némini dícerent quia ipse esset Iesus Christus.
  "21": Exínde cœpit Iesus osténdere discípulis suis, quia oportéret eum ire Ierosólymam, et multa pati a senióribus, et scribis, et princípibus sacerdótum, et occídi, et tértia die resúrgere.
  "22": 'Et assúmens eum Petrus, cœpit increpáre illum, dicens: Absit a te, Dómine: non erit tibi hoc.'
  "23": 'Qui convérsus, dixit Petro: Vade post me Sátana, scándalum es mihi: quia non sapis ea, quæ Dei sunt, sed ea, quæ hóminum.'
  "24": 'Tunc Iesus dixit discípulis suis: Si quis vult post me veníre, ábneget semetípsum, et tollat crucem suam, et sequátur me.'
  "25": 'Qui enim volúerit ánimam suam salvam fácere, perdet eam: qui autem perdíderit ánimam suam propter me, invéniet eam.'
  "26": Quid enim prodest hómini, si mundum univérsum lucrétur, ánimæ vero suæ detriméntum patiátur? aut quam dabit homo commutatiónem pro ánima sua?
  "27": 'Fílius enim hóminis ventúrus est in glória Patris sui cum ángelis suis: et tunc reddet unicuíque secúndum ópera eius.'
  "28": Amen dico vobis, sunt quidam de hic stántibus, qui non gustábunt mortem, donec vídeant Fílium hóminis veniéntem in regno suo.
