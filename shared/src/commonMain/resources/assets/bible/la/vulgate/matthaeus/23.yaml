bible: vulgate
lang: la
language: Latina
book: Matthaeus
chapter: "23"
verses:
  "1": Tunc Iesus locútus est ad turbas, et ad discípulos suos,
  "2": 'dicens: Super cáthedram Móysi sedérunt scribæ, et Pharisǽi.'
  "3": 'Omnia ergo quæcúmque díxerint vobis, serváte, et fácite: secúndum ópera vero eórum nolíte fácere: dicunt enim, et non fáciunt.'
  "4": 'Alligant enim ónera grávia, et importabília, et impónunt in húmeros hóminum: dígito autem suo nolunt ea movére.'
  "5": 'Omnia vero ópera sua fáciunt ut videántur ab homínibus: dilátant enim phylactéria sua, et magníficant fímbrias.'
  "6": Amant autem primos recúbitus in cœnis, et primas cáthedras in synagógis,
  "7": et salutatiónes in foro, et vocári ab homínibus Rabbi.
  "8": 'Vos autem nolíte vocári Rabbi: unus est enim magíster vester, omnes autem vos fratres estis.'
  "9": 'Et patrem nolíte vocáre vobis super terram: unus est enim Pater vester, qui in cælis est.'
  "10": 'Nec vocémini magístri: quia magíster vester unus est, Christus.'
  "11": Qui maior est vestrum, erit miníster vester.
  "12": 'Qui autem se exaltáverit, humiliábitur: et qui se humiliáverit, exaltábitur.'
  "13": 'Væ autem vobis scribæ, et Pharisǽi hypócritæ: quia cláuditis regnum cælórum ante hómines: vos enim non intrátis, nec introeúntes sínitis intráre.'
  "14": 'Væ vobis scribæ, et Pharisǽi hypócritæ: quia coméditis domos viduárum, oratiónes longas orántes: propter hoc ámplius accipiétis iudícium.'
  "15": 'Væ vobis scribæ, et Pharisǽi hypócritæ: quia circuítis mare, et áridam, ut faciátis unum prosélytum, et cum fúerit factus, fácitis eum fílium gehénnæ duplo quam vos.'
  "16": 'Væ vobis duces cæci, qui dícitis: Quicúmque iuráverit per templum, nihil est: qui autem iuráverit in auro templi, debet.'
  "17": 'Stulti, et cæci: quid enim maius est? aurum, an templum, quod sanctíficat aurum?'
  "18": 'Et quicúmque iuráverit in altári, nihil est: quicúmque autem iuráverit in dono, quod est super illud, debet.'
  "19": 'Cæci: quid enim maius est, donum, an altáre, quod sanctíficat donum?'
  "20": Qui ergo iurat in altári, iurat in eo, et in ómnibus, quæ super illud sunt.
  "21": 'Et quicúmque iuráverit in templo, iurat in illo, et in eo, qui hábitat in ipso:'
  "22": et qui iurat in cælo, iurat in throno Dei, et in eo, qui sedet super eum.
  "23": 'Væ vobis scribæ, et Pharisǽi hypócritæ, qui decimátis mentham, et anéthum, et cymínum, et reliquístis quæ gravióra sunt legis, iudícium, et misericórdiam, et fidem: hæc opórtuit fácere, et illa non omíttere.'
  "24": Duces cæci, excolántes cúlicem, camélum autem glutiéntes.
  "25": 'Væ vobis scribæ, et Pharisǽi hypócritæ: quia mundátis quod déforis est cálicis, et parópsidis: intus autem pleni estis rapína, et immundítia.'
  "26": Pharisǽe cæce, munda prius quod intus est cálicis, et parópsidis, ut fiat id, quod déforis est, mundum.
  "27": 'Væ vobis scribæ, et Pharisǽi hypócritæ: quia símiles estis sepúlcris dealbátis, quæ a foris parent homínibus speciósa, intus vero pleni sunt óssibus mortuórum, et omni spurcítia.'
  "28": 'Sic et vos a foris quidem parétis homínibus iusti: intus autem pleni estis hypócrisi, et iniquitáte.'
  "29": Væ vobis scribæ, et Pharisǽi hypócritæ, qui ædificátis sepúlcra prophetárum, et ornátis monuménta iustórum,
  "30": 'et dícitis: Si fuissémus in diébus patrum nostrórum, non essémus sócii eórum in sánguine prophetárum.'
  "31": Itaque testimónio estis vobismetípsis, quia fílii estis eórum, qui prophétas occidérunt.
  "32": Et vos impléte mensúram patrum vestrórum.
  "33": Serpéntes, genímina viperárum, quómodo fugiétis a iudício gehénnæ?
  "34": 'Ideo ecce ego mitto ad vos prophétas, et sapiéntes, et scribas, et ex illis occidétis, et crucifigétis, et ex eis flagellábitis in synagógis vestris, et persequémini de civitáte in civitátem:'
  "35": ut véniat super vos omnis sanguis iustus, qui effúsus est super terram, a sánguine Abel iusti usque ad sánguinem Zacharíæ, fílii Barachíæ, quem occidístis inter templum et altáre.
  "36": Amen dico vobis, vénient hæc ómnia super generatiónem istam.
  "37": Ierúsalem, Ierúsalem, quæ occídis prophétas, et lápidas eos, qui ad te missi sunt, quóties vólui congregáre fílios tuos, quemádmodum gallína cóngregat pullos suos sub alas, et noluísti?
  "38": Ecce relinquétur vobis domus vestra desérta.
  "39": 'Dico enim vobis, non me vidébitis ámodo, donec dicátis: Benedíctus, qui venit in nómine Dómini.'
