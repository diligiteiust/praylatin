bible: vulgate
lang: la
language: Latina
book: Leviticus
chapter: "8"
verses:
  "1": 'Locutúsque est Dóminus ad Móysen, dicens:'
  "2": 'Tolle Aaron cum fíliis suis, vestes eórum, et unctiónis óleum, vítulum pro peccáto, duos aríetes, canístrum cum ázymis:'
  "3": et congregábis omnem cœtum ad óstium tabernáculi.
  "4": Fecit Móyses ut Dóminus imperáverat. Congregatáque omni turba ante fores tabernáculi,
  "5": 'ait: Iste est sermo, quem iussit Dóminus fíeri.'
  "6": Statímque óbtulit Aaron et fílios eius. Cumque lavísset eos,
  "7": vestívit pontíficem subúcula línea, accíngens eum bálteo, et índuens eum túnica hyacínthina, et désuper humerále impósuit,
  "8": quod astríngens cíngulo aptávit rationáli, in quo erat Doctrína et Véritas.
  "9": 'Cídari quoque texit caput: et super eam, contra frontem, pósuit láminam áuream consecrátam in sanctificatióne, sicut præcéperat ei Dóminus.'
  "10": Tulit et unctiónis óleum, quo linívit tabernáculum cum omni supelléctili sua.
  "11": Cumque sanctíficans aspersísset altáre septem vícibus, unxit illud, et ómnia vasa eius, labrúmque cum basi sua sanctificávit óleo.
  "12": 'Quod fundens super caput Aaron, unxit eum, et consecrávit:'
  "13": fílios quoque eius oblátos vestívit túnicis líneis, et cinxit bálteis, imposuítque mitras, ut iússerat Dóminus.
  "14": 'Obtulit et vítulum pro peccáto: cumque super caput eius posuísset Aaron et fílii eius manus suas,'
  "15": 'immolávit eum, háuriens sánguinem, et tincto dígito, tétigit córnua altáris per gyrum: quo expiáto et sanctificáto, fudit réliquum sánguinem ad fundaménta eius.'
  "16": 'Adipem vero qui erat super vitália, et retículum iécoris, duósque renúnculos, cum arvínulis suis, adolévit super altáre:'
  "17": vítulum cum pelle, et cárnibus, et fimo, cremans extra castra, sicut præcéperat Dóminus.
  "18": 'Obtulit et aríetem in holocáustum: super cuius caput cum imposuíssent Aaron et fílii eius manus suas,'
  "19": immolávit eum, et fudit sánguinem eius per circúitum altáris.
  "20": Ipsúmque aríetem in frusta concídens, caput eius, et artus, et ádipem adolévit igni,
  "21": 'lotis prius intestínis et pédibus: totúmque simul aríetem incéndit super altáre, eo quod esset holocáustum suavíssimi odóris Dómino, sicut præcéperat ei.'
  "22": 'Obtulit et aríetem secúndum in consecratióne sacerdótum: posuerúntque super caput eius Aaron et fílii eius manus suas.'
  "23": Quem cum immolásset Móyses, sumens de sánguine eius, tétigit extrémum aurículæ dextræ Aaron, et póllicem manus eius dextræ, simíliter et pedis.
  "24": 'Obtulit et fílios Aaron: cumque de sánguine aríetis immoláti tetigísset extrémum aurículæ singulórum dextræ, et póllices manus ac pedis dextri, réliquum fudit super altáre per circúitum:'
  "25": ádipem vero, et caudam, omnémque pinguédinem quæ óperit intestína, reticulúmque iécoris, et duos renes cum adípibus suis et armo dextro separávit.
  "26": Tollens autem de canístro azymórum, quod erat coram Dómino, panem absque ferménto, et collýridam conspérsam óleo, laganúmque pósuit super ádipes, et armum dextrum,
  "27": tradens simul ómnia Aaron et fíliis eius. Qui postquam levavérunt ea coram Dómino,
  "28": rursum suscépta de mánibus eórum, adolévit super altáre holocáusti, eo quod consecratiónis esset oblátio, in odórem suavitátis, sacrifícii Dómino.
  "29": Tulítque pectúsculum, élevans illud coram Dómino, de aríete consecratiónis in partem suam, sicut præcéperat ei Dóminus.
  "30": Assuménsque unguéntum, et sánguinem qui erat in altári, aspérsit super Aaron et vestiménta eius, et super fílios illíus ac vestes eórum.
  "31": 'Cumque sanctificásset eos in vestítu suo, præcépit eis, dicens: Cóquite carnes ante fores tabernáculi, et ibi comédite eas: panes quoque consecratiónis édite, qui pósiti sunt in canístro, sicut præcépit mihi Dóminus, dicens: Aaron et fílii eius cómedent eos:'
  "32": quidquid autem réliquum fúerit de carne et pánibus, ignis absúmet.
  "33": 'De óstio quoque tabernáculi non exíbitis septem diébus, usque ad diem quo complébitur tempus consecratiónis vestræ: septem enim diébus finítur consecrátio:'
  "34": sicut et impræsentiárum factum est, ut ritus sacrifícii complerétur.
  "35": 'Die ac nocte manébitis in tabernáculo observántes custódias Dómini, ne moriámini: sic enim mihi præcéptum est.'
  "36": Fecerúntque Aaron et fílii eius cuncta quæ locútus est Dóminus per manum Móysi.
