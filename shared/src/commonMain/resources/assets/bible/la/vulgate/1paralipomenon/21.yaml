bible: vulgate
lang: la
language: Latina
book: I Paralipomenon
chapter: "21"
verses:
  "1": 'Consurréxit autem Satan contra Israel: et concitávit David ut numeráret Israel.'
  "2": 'Dixítque David ad Ioab, et ad príncipes pópuli: Ite, et numeráte Israel a Bersabée usque Dan: et afférte mihi númerum ut sciam.'
  "3": 'Respondítque Ioab: Augeat Dóminus pópulum suum céntuplum, quam sunt: nonne dómine mi rex, omnes servi tui sunt? quare hoc quærit dóminus meus, quod in peccátum reputétur Israéli?'
  "4": 'Sed sermo regis magis præváluit: egressúsque est Ioab, et circuívit univérsum Israel: et revérsus est Ierúsalem:'
  "5": 'dedítque David númerum eórum, quos circuíerat: et invéntus est omnis númerus Israel, mille míllia et centum míllia virórum educéntium gládium: de Iuda autem quadringénta septuagínta míllia bellatórum.'
  "6": 'Nam Levi, et Béniamin non numerávit: eo quod Ioab invítus exsequerétur regis impérium.'
  "7": 'Displícuit autem Deo quod iussum erat: et percússit Israel.'
  "8": 'Dixítque David ad Deum: Peccávi nimis ut hoc fácerem: óbsecro, aufer iniquitátem servi tui, quia insipiénter egi.'
  "9": 'Et locútus est Dóminus ad Gad Vidéntem Davídis, dicens:'
  "10": 'Vade, et lóquere ad David, et dic ei: Hæc dicit Dóminus: Trium tibi optiónem do: unum, quod volúeris, élige, et fáciam tibi.'
  "11": 'Cumque venísset Gad ad David, dixit ei: Hæc dicit Dóminus: Elige quod volúeris:'
  "12": 'aut tribus annis famem: aut tribus ménsibus te fúgere hostes tuos, et gládium eórum non posse evádere: aut tribus diébus gládium Dómini, et pestiléntiam versári in terra, et ángelum Dómini interfícere in univérsis fínibus Israel: nunc ígitur vide quid respóndeam ei, qui misit me.'
  "13": 'Et dixit David ad Gad: Ex omni parte me angústiæ premunt: sed mélius mihi est ut íncidam in manus Dómini, quia multæ sunt miseratiónes eius, quam in manus hóminum.'
  "14": 'Misit ergo Dóminus pestiléntiam in Israel: et cecidérunt de Israel septuagínta míllia virórum.'
  "15": 'Misit quoque ángelum in Ierúsalem, ut percúteret eam: cumque percuterétur, vidit Dóminus, et misértus est super magnitúdine mali: et imperávit ángelo, qui percutiébat: Súfficit, iam cesset manus tua. Porro ángelus Dómini stabat iuxta áream Ornan Iebusǽi.'
  "16": 'Levánsque David óculos suos, vidit ángelum Dómini stantem inter cælum et terram, et evaginátum gládium in manu eius, et versum contra Ierúsalem: et cecidérunt tam ipse quam maióres natu, vestíti cilíciis, proni in terram.'
  "17": 'Dixítque David ad Deum: Nonne ego sum, qui iussi ut numerarétur pópulus? ego, qui peccávi: ego, qui malum feci: iste grex quid comméruit? Dómine Deus meus, vertátur óbsecro manus tua in me, et in domum patris mei: pópulus autem tuus non percutiátur.'
  "18": Angelus autem Dómini præcépit Gad ut díceret Davídi ut ascénderet, exstruerétque altáre Dómino Deo in área Ornan Iebusǽi.
  "19": Ascéndit ergo David iuxta sermónem Gad, quem locútus ei fúerat ex nómine Dómini.
  "20": 'Porro Ornan cum suspexísset, et vidísset ángelum, quatuórque fílii eius cum eo, abscondérunt se: nam eo témpore terébat in área tríticum.'
  "21": Igitur cum veníret David ad Ornan, conspéxit eum Ornan, et procéssit ei óbviam de área, et adorávit eum pronus in terram.
  "22": 'Dixítque ei David: Da mihi locum áreæ tuæ, ut ædíficem in ea altáre Dómino: ita ut quantum valet argénti accípias, et cesset plaga a pópulo.'
  "23": 'Dixit autem Ornan ad David: Tolle, et fáciat dóminus meus rex quodcúmque ei placet: sed et boves do in holocáustum, et tríbulas in ligna, et tríticum in sacrifícium: ómnia libens præbébo.'
  "24": 'Dixítque ei rex David: Nequáquam ita fiet, sed argéntum dabo quantum valet: neque enim tibi auférre débeo, et sic offérre Dómino holocáusta gratuíta.'
  "25": Dedit ergo David Ornan pro loco siclos auri iustíssimi pónderis sexcéntos.
  "26": 'Et ædificávit ibi altáre Dómino: obtulítque holocáusta, et pacífica, et invocávit Dóminum: et exaudívit eum in igne de cælo super altáre holocáusti.'
  "27": Præcepítque Dóminus ángelo, et convértit gládium suum in vagínam.
  "28": Prótinus ergo David, videns quod exaudísset eum Dóminus in área Ornan Iebusǽi, immolávit ibi víctimas.
  "29": Tabernáculum autem Dómini, quod fécerat Móyses in desérto, et altáre holocaustórum, ea tempestáte erat in excélso Gábaon.
  "30": 'Et non præváluit David ire ad altáre, ut ibi obsecráret Deum: nímio enim fúerat in timóre pertérritus, videns gládium ángeli Dómini.'
