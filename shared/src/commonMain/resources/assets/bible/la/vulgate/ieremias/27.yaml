bible: vulgate
lang: la
language: Latina
book: Ieremias
chapter: "27"
verses:
  "1": 'In princípio regni Ióakim fílii Iosíæ regis Iuda, factum est verbum istud ad Ieremíam a Dómino, dicens:'
  "2": 'Hæc dicit Dóminus ad me: Fac tibi víncula et caténas, et pones eas in collo tuo.'
  "3": 'Et mittes eas ad regem Edom, et ad regem Moab, et ad regem filiórum Ammon, et ad regem Tyri, et ad regem Sidónis: in manu nuntiórum, qui venérunt Ierúsalem ad Sedecíam regem Iuda.'
  "4": 'Et præcípies eis ut ad dóminos suos loquántur: Hæc dicit Dóminus exercítuum, Deus Israel: Hæc dicétis ad dóminos vestros:'
  "5": 'Ego feci terram, et hómines, et iuménta, quæ sunt super fáciem terræ, in fortitúdine mea magna, et in bráchio meo exténto: et dedi eam ei, qui plácuit in óculis meis.'
  "6": 'Et nunc ítaque ego dedi omnes terras istas in manu Nabuchodónosor regis Babylónis servi mei: ínsuper et béstias agri dedi ei, ut sérviant illi.'
  "7": 'Et sérvient ei omnes gentes, et fílio eius, et fílio fílii eius: donec véniat tempus terræ eius et ipsíus: et sérvient ei gentes multæ, et reges magni.'
  "8": 'Gens autem et regnum, quod non servíerit Nabuchodónosor regi Babylónis, et quicúmque non curváverit collum suum sub iugo regis Babylónis, in gládio, et in fame, et in peste visitábo super gentem illam, ait Dóminus: donec consúmam eos in manu eius.'
  "9": 'Vos ergo nolíte audíre prophétas vestros, et divínos, et somniatóres, et áugures, et maléficos, qui dicunt vobis: Non serviétis regi Babylónis.'
  "10": 'Quia mendácium prophétant vobis: ut longe vos fáciant de terra vestra, et eíciant vos, et pereátis.'
  "11": 'Porro gens, quæ subiécerit cervícem suam sub iugo regis Babylónis, et servíerit ei: dimíttam eam in terra sua, dicit Dóminus, et colet eam, et habitábit in ea.'
  "12": 'Et ad Sedecíam regem Iuda locútus sum secúndum ómnia verba hæc, dicens: Subícite colla vestra sub iugo regis Babylónis, et servíte ei, et pópulo eius, et vivétis.'
  "13": Quare moriémini tu et pópulus tuus gládio, et fame, et peste, sicut locútus est Dóminus ad gentem, quæ servíre nolúerit regi Babylónis?
  "14": 'Nolíte audíre verba prophetárum dicéntium vobis: Non serviétis regi Babylónis: quia mendácium ipsi loquúntur vobis.'
  "15": 'Quia non misi eos, ait Dóminus, et ipsi prophétant in nómine meo mendáciter: ut eíciant vos, et pereátis tam vos, quam prophétæ, qui vaticinántur vobis.'
  "16": 'Et ad sacerdótes, et ad pópulum istum locútus sum, dicens: Hæc dicit Dóminus: Nolíte audíre verba prophetárum vestrórum, qui prophétant vobis, dicéntes: Ecce vasa Dómini reverténtur de Babylóne nunc cito, mendácium enim prophétant vobis.'
  "17": 'Nolíte ergo audíre eos, sed servíte regi Babylónis, ut vivátis: quare datur hæc cívitas in solitúdinem?'
  "18": 'Et si prophétæ sunt, et est verbum Dómini in eis: occúrrant Dómino exercítuum, ut non véniant vasa, quæ derelícta fúerant in domo Dómini, et in domo regis Iuda, et in Ierúsalem, in Babylónem.'
  "19": 'Quia hæc dicit Dóminus exercítuum ad colúmnas, et ad mare, et ad bases, et ad réliqua vasórum, quæ remansérunt in civitáte hac:'
  "20": quæ non tulit Nabuchodónosor rex Babylónis, cum transférret Iechoníam fílium Ióakim regem Iuda de Ierúsalem in Babylónem, et omnes optimátes Iuda et Ierúsalem.
  "21": 'Quia hæc dicit Dóminus exercítuum Deus Israel ad vasa, quæ derelícta sunt in domo Dómini, et in domo regis Iuda et Ierúsalem:'
  "22": In Babylónem transferéntur, et ibi erunt usque ad diem visitatiónis suæ, dicit Dóminus, et afférri fáciam ea, et restítui in loco isto.
