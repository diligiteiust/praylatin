bible: vulgate
lang: la
language: Latina
book: Matthaeus
chapter: "14"
verses:
  "1": 'In illo témpore audívit Heródes tetrárcha famam Iesu:'
  "2": 'et ait púeris suis: Hic est Ioánnes Baptísta: ipse surréxit a mórtuis, et ídeo virtútes operántur in eo.'
  "3": 'Heródes enim ténuit Ioánnem, et alligávit eum: et pósuit in cárcerem propter Herodíadem uxórem fratris sui.'
  "4": 'Dicébat enim illi Ioánnes: Non licet tibi habére eam.'
  "5": 'Et volens illum occídere, tímuit pópulum: quia sicut prophétam eum habébant.'
  "6": 'Die autem natális Heródis saltávit fília Herodíadis in médio, et plácuit Heródi:'
  "7": unde cum iuraménto pollícitus est ei dare quodcúmque postulásset ab eo.
  "8": At illa præmónita a matre sua, Da mihi, inquit, hic in disco caput Ioánnis Baptístæ.
  "9": 'Et contristátus est rex: propter iuraméntum autem, et eos, qui páriter recumbébant, iussit dari.'
  "10": Misítque et decollávit Ioánnem in cárcere.
  "11": Et allátum est caput eius in disco, et datum est puéllæ, et áttulit matri suæ.
  "12": 'Et accedéntes discípuli eius, tulérunt corpus eius, et sepeliérunt illud: et veniéntes nuntiavérunt Iesu.'
  "13": 'Quod cum audísset Iesus, secéssit inde in navícula, in locum desértum seórsum: et cum audíssent turbæ, secútæ sunt eum pedéstres de civitátibus.'
  "14": Et éxiens vidit turbam multam, et misértus est eis, et curávit lánguidos eórum.
  "15": 'Véspere autem facto, accessérunt ad eum discípuli eius, dicéntes: Desértus est locus, et hora iam prætériit: dimítte turbas, ut eúntes in castélla, emant sibi escas.'
  "16": 'Iesus autem dixit eis: Non habent necésse ire: date illis vos manducáre.'
  "17": 'Respondérunt ei: Non habémus hic nisi quinque panes, et duos pisces.'
  "18": 'Qui ait eis: Afférte mihi illos huc.'
  "19": Et cum iussísset turbam discúmbere super fœnum, accéptis quinque pánibus, et duóbus píscibus, aspíciens in cælum benedíxit, et fregit, et dedit discípulis panes, discípuli autem turbis.
  "20": Et manducavérunt omnes, et saturáti sunt. Et tulérunt relíquias, duódecim cóphinos fragmentórum plenos.
  "21": Manducántium autem fuit númerus quinque míllia virórum, excéptis muliéribus, et párvulis.
  "22": Et statim cómpulit Iesus discípulos ascéndere in navículam, et præcédere eum trans fretum, donec dimítteret turbas.
  "23": Et dimíssa turba, ascéndit in montem solus oráre. Véspere autem facto solus erat ibi.
  "24": 'Navícula autem in médio mari iactabátur flúctibus: erat enim contrárius ventus.'
  "25": Quarta autem vigília noctis, venit ad eos ámbulans super mare.
  "26": 'Et vidéntes eum super mare ambulántem, turbáti sunt, dicéntes: Quia phantásma est. Et præ timóre clamavérunt.'
  "27": 'Statímque Iesus locútus est eis, dicens: Habéte fidúciam: ego sum, nolíte timére.'
  "28": 'Respóndens autem Petrus, dixit: Dómine, si tu es, iube me ad te veníre super aquas.'
  "29": 'At ipse ait: Veni. Et descéndens Petrus de navícula, ambulábat super aquam ut veníret ad Iesum.'
  "30": 'Videns vero ventum válidum, tímuit: et cum cœpísset mergi, clamávit dicens: Dómine, salvum me fac.'
  "31": 'Et contínuo Iesus exténdens manum, apprehéndit eum: et ait illi: Módicæ fídei, quare dubitásti?'
  "32": Et cum ascendíssent in navículam, cessávit ventus.
  "33": 'Qui autem in navícula erant, venérunt, et adoravérunt eum, dicéntes: Vere Fílius Dei es.'
  "34": Et cum transfretássent, venérunt in terram Génesar.
  "35": 'Et cum cognovíssent eum viri loci illíus, misérunt in univérsam regiónem illam, et obtulérunt ei omnes male habéntes:'
  "36": et rogábant eum ut vel fímbriam vestiménti eius tángerent. Et quicúmque tetigérunt, salvi facti sunt.
