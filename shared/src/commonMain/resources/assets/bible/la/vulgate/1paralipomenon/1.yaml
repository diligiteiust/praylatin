bible: vulgate
lang: la
language: Latina
book: I Paralipomenon
chapter: "1"
verses:
  "1": Adam, Seth, Enos,
  "2": Cáinan, Maláleel, Iared,
  "3": Henoch, Mathúsale, Lamech,
  "4": Noe, Sem, Cham, et Iapheth.
  "5": 'Fílii Iapheth: Gomer, et Magog, et Mádai, et Iavan, Thubal, Mosoch, Thiras.'
  "6": 'Porro fílii Gomer: Ascenez, et Riphath, et Thogórma.'
  "7": 'Fílii autem Iavan: Elísa et Tharsis, Cethim et Dódanim.'
  "8": 'Fílii Cham: Chus, et Mésraim, et Phut, et Chánaan.'
  "9": 'Fílii autem Chus: Saba, et Hevíla, Sábatha, et Regma, et Sabáthacha. Porro fílii Regma: Saba, et Dadan.'
  "10": 'Chus autem génuit Nemrod: iste cœpit esse potens in terra.'
  "11": Mésraim vero génuit Ludim, et Anamim, et Láabim, et Néphtuim,
  "12": 'Phétrusim quoque, et Cásluim: de quibus egréssi sunt Philísthiim, et Cáphtorim.'
  "13": Chánaan vero génuit Sidónem primogénitum suum, Hethǽum quoque,
  "14": et Iebusǽum, et Amorrhǽum, et Gergesǽum,
  "15": Hevæúmque et Aracǽum, et Sinǽum.
  "16": Arádium quoque, et Samarǽum, et Hamathǽum.
  "17": 'Fílii Sem: Ælam, et Assur, et Arpháxad, et Lud, et Aram, et Hus, et Hul, et Gether, et Mosoch.'
  "18": Arpháxad autem génuit Sale, qui et ipse génuit Heber.
  "19": 'Porro Heber nati sunt duo fílii: nomen uni Phaleg, quia in diébus eius divísa est terra: et nomen fratris eius Iectan.'
  "20": Iectan autem génuit Elmódad, et Saleph, et Asármoth, et Iare,
  "21": Adóram quoque, et Huzal, et Decla,
  "22": Hebal étiam, et Abímael, et Saba, necnon
  "23": 'et Ophir, et Hevíla, et Iobab: omnes isti fílii Iectan.'
  "24": Sem, Arpháxad, Sale,
  "25": Heber, Phaleg, Ragau,
  "26": Serug, Nachor, Thare,
  "27": 'Abram: iste est Abraham.'
  "28": Fílii autem Abraham, Isaac et Ismahel.
  "29": Et hæ generatiónes eórum. Primogénitus Ismahélis, Nábaioth, et Cedar, et Adbeel, et Mabsam,
  "30": et Masma, et Duma, Massa, Hadad, et Thema,
  "31": 'Ietur, Naphis, Cedma: hi sunt fílii Ismahélis.'
  "32": 'Fílii autem Cetúræ concubínæ Abraham, quos génuit: Zamran, Iecsan, Madan, Mádian, Iesboc, et Sue. Porro fílii Iecsan: Saba, et Dadan. Fílii autem Dadan: Assurim, et Latússim, et Láomim.'
  "33": 'Fílii autem Mádian: Epha, et Epher, et Henoch, et Abída, et Eldaa: omnes hi fílii Cetúræ.'
  "34": 'Génuit autem Abraham Isaac: cuius fuérunt fílii Esau, et Israel.'
  "35": 'Fílii Esau: Eliphaz, Ráhuel, Iehus, Ihelom, et Core.'
  "36": 'Fílii Eliphaz: Theman, Omar, Sephi, Gathan, Cenez, Thamna, Amalec.'
  "37": 'Fílii Ráhuel: Nahath, Zara, Samma, Meza.'
  "38": 'Fílii Seir: Lotan, Sobal, Sébeon, Ana, Dison, Eser, Disan.'
  "39": 'Fílii Lotan: Hori, Homam. Soror autem Lotan fuit Thamna.'
  "40": 'Fílii Sobal: Alian, et Mánahath, et Ebal, Sephi et Onam. Fílii Sébeon: Aia et Ana. Fílii Ana: Dison.'
  "41": 'Fílii Dison: Hamram, et Eseban, et Iethran, et Charan.'
  "42": 'Fílii Eser: Bálaan, et Zavan, et Iacan. Fílii Disan: Hus et Aran.'
  "43": 'Isti sunt reges, qui imperavérunt in terra Edom, ántequam esset rex super fílios Israel. Bale fílius Beor: et nomen civitátis eius, Dénaba.'
  "44": Mórtuus est autem Bale, et regnávit pro eo Iobab fílius Zare de Bosra.
  "45": Cumque et Iobab fuísset mórtuus, regnávit pro eo Husam de terra Themanórum.
  "46": 'Obiit quoque et Husam, et regnávit pro eo Adad fílius Badad, qui percússit Mádian in terra Moab: et nomen civitátis eius Avith.'
  "47": Cumque et Adad fuísset mórtuus, regnávit pro eo Semla de Másreca.
  "48": Sed et Semla mórtuus est, et regnávit pro eo Saul de Róhoboth, quæ iuxta amnem sita est.
  "49": Mórtuo quoque Saul, regnávit pro eo Bálanan fílius Achobor.
  "50": 'Sed et hic mórtuus est, et regnávit pro eo Adad: cuius urbis nomen fuit Phau, et appelláta est uxor eius Meétabel fília Matred fíliæ Mézaab.'
  "51": 'Adad autem mórtuo, duces pro régibus in Edom esse cœpérunt: dux Thamna, dux Alva, dux Ietheth,'
  "52": dux Oolíbama, dux Ela, dux Phinon,
  "53": dux Cenez, dux Theman, dux Mabsar,
  "54": 'dux Mágdiel, dux Hiram: hi duces Edom.'
