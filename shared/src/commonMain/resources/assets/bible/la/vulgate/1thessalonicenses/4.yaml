bible: vulgate
lang: la
language: Latina
book: ad Thessalonicenses I
chapter: "4"
verses:
  "1": De cétero ergo, fratres, rogámus vos et obsecrámus in Dómino Iesu, ut quemádmodum accepístis a nobis quómodo opórteat vos ambuláre, et placére Deo, sic et ambulétis, ut abundétis magis.
  "2": Scitis enim quæ præcépta déderim vobis per Dóminum Iesum.
  "3": 'Hæc est enim volúntas Dei, sanctificátio vestra: ut abstineátis vos a fornicatióne,'
  "4": 'ut sciat unusquísque vestrum vas suum possidére in sanctificatióne, et honóre:'
  "5": 'non in passióne desidérii, sicut et gentes, quæ ignórant Deum:'
  "6": 'et ne quis supergrediátur, neque circumvéniat in negótio fratrem suum: quóniam vindex est Dóminus de his ómnibus, sicut prædíximus vobis, et testificáti sumus.'
  "7": Non enim vocávit nos Deus in immundítiam, sed in sanctificatiónem.
  "8": 'Itaque qui hæc spernit, non hóminem spernit, sed Deum: qui étiam dedit Spíritum suum sanctum in nobis.'
  "9": 'De caritáte autem fraternitátis non necésse habémus scríbere vobis: ipsi enim vos a Deo didicístis ut diligátis ínvicem.'
  "10": Etenim illud fácitis in omnes fratres in univérsa Macedónia. Rogámus autem vos fratres ut abundétis magis,
  "11": 'et óperam detis ut quiéti sitis, et ut vestrum negótium agátis, et operémini mánibus vestris, sicut præcépimus vobis:'
  "12": 'et ut honéste ambulétis ad eos, qui foris sunt: et nullíus áliquid desiderétis.'
  "13": Nólumus autem vos ignoráre fratres de dormiéntibus, ut non contristémini sicut et céteri, qui spem non habent.
  "14": 'Si enim crédimus quod Iesus mórtuus est, et resurréxit: ita et Deus eos, qui dormiérunt per Iesum, addúcet cum eo.'
  "15": Hoc enim vobis dícimus in verbo Dómini, quia nos, qui vívimus, qui resídui sumus in advéntum Dómini, non præveniémus eos, qui dormiérunt.
  "16": 'Quóniam ipse Dóminus in iussu, et in voce archángeli, et in tuba Dei descéndet de cælo: et mórtui, qui in Christo sunt, resúrgent primi.'
  "17": Deínde nos, qui vívimus, qui relínquimur, simul rapiémur cum illis in núbibus óbviam Christo in áera, et sic semper cum Dómino érimus.
  "18": Itaque consolámini ínvicem in verbis istis.
