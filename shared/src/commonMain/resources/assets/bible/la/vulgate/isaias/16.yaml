bible: vulgate
lang: la
language: Latina
book: Isaias
chapter: "16"
verses:
  "1": Emítte agnum Dómine dominatórem terræ, de Petra desérti ad montem fíliæ Sion.
  "2": 'Et erit: sicut avis fúgiens, et pulli de nido avolántes, sic erunt fíliæ Moab in transcénsu Arnon.'
  "3": 'Ini consílium, coge concílium: pone quasi noctem umbram tuam in merídie: abscónde fugiéntes, et vagos ne prodas.'
  "4": 'Habitábunt apud te prófugi mei: Moab esto latíbulum eórum a fácie vastatóris: finítus est enim pulvis, consummátus est miser, defécit qui conculcábat terram.'
  "5": Et præparábitur in misericórdia sólium, et sedébit super illud in veritáte in tabernáculo David, iúdicans et quærens iudícium, et velóciter reddens quod iustum est.
  "6": 'Audívimus supérbiam Moab, supérbus est valde: supérbia eius, et arrogántia eius, et indignátio eius plus quam fortitúdo eius.'
  "7": 'Idcírco ululábit Moab ad Moab: univérsus ululábit: his, qui lætántur super muros cocti láteris, loquímini plagas suas.'
  "8": 'Quóniam suburbána Hésebon desérta sunt, et víneam Sábama dómini géntium excidérunt: flagélla eius usque ad Iazer pervenérunt: erravérunt in desérto, propágines eius relíctæ sunt, transiérunt mare.'
  "9": 'Super hoc plorábo in fletu Iazer víneam Sábama: inebriábo te lácryma mea Hésebon et Eleále, quóniam super vindémiam tuam et super messem tuam vox calcántium írruit.'
  "10": 'Et auferétur lætítia et exsultátio de Carmélo, et in víneis non exsultábit neque iubilábit: vinum in torculári non calcábit qui calcáre consuéverat: vocem calcántium ábstuli.'
  "11": Super hoc venter meus ad Moab quasi cíthara sonábit, et víscera mea ad murum cocti láteris.
  "12": 'Et erit: cum apparúerit quod laborávit Moab super excélsis suis, ingrediétur ad sancta sua ut óbsecret, et non valébit.'
  "13": 'Hoc verbum quod locútus est Dóminus ad Moab ex tunc:'
  "14": 'et nunc locútus est Dóminus, dicens: In tribus annis, quasi anni mercenárii, auferétur glória Moab super omni pópulo multo, et relinquétur parvus et módicus, nequáquam multus.'
