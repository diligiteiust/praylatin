bible: vulgate
lang: la
language: Latina
book: ad Timotheum I
chapter: "5"
verses:
  "1": 'Seniórem ne increpáveris, sed óbsecra ut patrem: iúvenes, ut fratres:'
  "2": 'anus, ut matres: iuvénculas, ut soróres in omni castitáte.'
  "3": Víduas honóra, quæ vere víduæ sunt.
  "4": 'Si qua autem vídua fílios, aut nepótes habet: discat primum domum suam régere, et mútuam vicem réddere paréntibus: hoc enim accéptum est coram Deo.'
  "5": Quæ autem vere vídua est, et desoláta, speret in Deum, et instet obsecratiónibus, et oratiónibus nocte ac die.
  "6": Nam quæ in delíciis est, vivens mórtua est.
  "7": Et hoc prǽcipe, ut irreprehensíbiles sint.
  "8": Si quis autem suórum, et máxime domesticórum curam non habet, fidem negávit, et est infidéli detérior.
  "9": Vídua eligátur non minus sexagínta annórum, quæ fúerit uníus viri uxor,
  "10": in opéribus bonis testimónium habens, si fílios educávit, si hospítio recépit, si sanctórum pedes lavit, si tribulatiónem patiéntibus subministrávit, si omne opus bonum subsecúta est.
  "11": 'Adolescentióres autem víduas devíta: cum enim luxuriátæ fúerint in Christo, núbere volunt:'
  "12": 'habéntes damnatiónem, quia primam fidem írritam fecérunt:'
  "13": 'simul autem et otiósæ discunt circuíre domos: non solum otiósæ, sed et verbósæ, et curiósæ, loquéntes quæ non opórtet.'
  "14": Volo ergo iunióres núbere, fílios procreáre, matresfamílias esse, nullam occasiónem dare adversário maledícti grátia.
  "15": Iam enim quædam convérsæ sunt retro Sátanam.
  "16": 'Si quis fidélis habet víduas, subminístret illis, et non gravétur ecclésia: ut iis, quæ vere víduæ sunt, suffíciat.'
  "17": 'Qui bene præsunt presbýteri, dúplici honóre digni habeántur: máxime qui labórant in verbo et doctrína.'
  "18": 'Dicit enim Scriptúra: Non alligábis os bovi trituránti. Et: Dignus est operárius mercéde sua.'
  "19": Advérsus presbýterum accusatiónem noli recípere, nisi sub duóbus aut tribus téstibus.
  "20": 'Peccántes coram ómnibus árgue: ut et céteri timórem hábeant.'
  "21": Testor coram Deo, et Christo Iesu, et eléctis ángelis, ut hæc custódias sine præiudício, nihil fáciens in álteram partem declinándo.
  "22": Manus cito némini imposúeris, neque communicáveris peccátis aliénis. Teípsum castum custódi.
  "23": Noli adhuc aquam bíbere, sed módico vino útere propter stómachum tuum, et frequéntes tuas infirmitátes.
  "24": 'Quorúmdam hóminum peccáta manifésta sunt, præcedéntia ad iudícium: quosdam autem et subsequúntur.'
  "25": 'Simíliter et facta bona, manifésta sunt: et quæ áliter se habent, abscóndi non possunt.'
