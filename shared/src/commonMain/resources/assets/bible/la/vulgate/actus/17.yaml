bible: vulgate
lang: la
language: Latina
book: Actus Apostolorum
chapter: "17"
verses:
  "1": Cum autem perambulássent Amphípolim, et Apollóniam, venérunt Thessalonícam, ubi erat synagóga Iudæórum.
  "2": Secúndum consuetúdinem autem Paulus introívit ad eos, et per sábbata tria disserébat eis de Scriptúris,
  "3": 'adapériens et insínuans quia Christum opórtuit pati, et resúrgere a mórtuis: et quia hic est Iesus Christus, quem ego annúntio vobis.'
  "4": Et quidam ex eis credidérunt, et adiúncti sunt Paulo, et Silæ, et de coléntibus, gentilibúsque multitúdo magna, et mulíeres nóbiles non paucæ.
  "5": 'Zelántes autem Iudǽi, assumentésque de vulgo viros quosdam malos, et turba facta, concitavérunt civitátem: et assisténtes dómui Iasónis quærébant eos prodúcere in pópulum.'
  "6": 'Et cum non inveníssent eos, trahébant Iasónem, et quosdam fratres ad príncipes civitátis, clamántes: Quóniam hi, qui urbem cóncitant, et huc venérunt,'
  "7": quos suscépit Iason, et hi omnes contra decréta Cǽsaris fáciunt, regem álium dicéntes esse, Iesum.
  "8": Concitavérunt autem plebem, et príncipes civitátis audiéntes hæc.
  "9": Et accépta satisfactióne a Iasóne, et a céteris, dimisérunt eos.
  "10": Fratres vero conféstim per noctem dimisérunt Paulum, et Silam in Berœ́am. Qui cum veníssent, in synagógam Iudæórum introiérunt.
  "11": Hi autem erant nobilióres eórum, qui sunt Thessalonícæ, qui suscepérunt verbum cum omni aviditáte, quotídie scrutántes Scriptúras, si hæc ita se habérent.
  "12": Et multi quidem credidérunt ex eis, et mulíerum gentílium honestárum, et viri non pauci.
  "13": Cum autem cognovíssent in Thessaloníca Iudǽi, quia et Berœ́æ prædicátum est a Paulo verbum Dei, venérunt et illuc commovéntes, et turbántes multitúdinem.
  "14": 'Statímque tunc Paulum dimisérunt fratres, ut iret usque ad mare: Silas autem, et Timótheus remansérunt ibi.'
  "15": Qui autem deducébant Paulum, perduxérunt eum usque Athénas, et accépto mandáto ab eo ad Silam, et Timótheum ut quam celériter venírent ad illum, profécti sunt.
  "16": Paulus autem cum Athénis eos exspectáret, incitabátur spíritus eius in ipso, videns idololatríæ déditam civitátem.
  "17": Disputábat ígitur in synagóga cum Iudǽis, et coléntibus, et in foro, per omnes dies ad eos, qui áderant.
  "18": 'Quidam autem Epicuréi, et Stóici philósophi disserébant cum eo, et quidam dicébant: Quid vult seminivérbius hic dícere? Alii vero: Novórum dæmoniórum vidétur annuntiátor esse: quia Iesum, et resurrectiónem annuntiábat eis.'
  "19": 'Et apprehénsum eum ad Areópagum duxérunt, dicéntes: Póssumus scire quæ est hæc nova, quæ a te dícitur, doctrína?'
  "20": 'Nova enim quædam infers áuribus nostris: vólumus ergo scire quidnam velint hæc esse.'
  "21": (Atheniénses autem omnes, et ádvenæ hóspites, ad nihil áliud vacábant nisi aut dícere, aut audíre áliquid novi.)
  "22": 'Stans autem Paulus in médio Areópagi, ait: Viri Atheniénses, per ómnia quasi superstitiosióres vos vídeo.'
  "23": 'Prætériens enim, et videns simulácra vestra, invéni et aram, in qua scriptum erat: Ignóto Deo. Quod ergo ignorántes cólitis, hoc ego annúntio vobis.'
  "24": Deus, qui fecit mundum, et ómnia quæ in eo sunt, hic cæli et terræ cum sit Dóminus, non in manufáctis templis hábitat,
  "25": 'nec mánibus humánis cólitur índigens áliquo, cum ipse det ómnibus vitam, et inspiratiónem, et ómnia:'
  "26": fecítque ex uno omne genus hóminum inhabitáre super univérsam fáciem terræ, defíniens statúta témpora, et términos habitatiónis eórum,
  "27": quǽrere Deum si forte attréctent eum, aut invéniant, quamvis non longe sit ab unoquóque nostrum.
  "28": 'In ipso enim vívimus, et movémur, et sumus: sicut et quidam vestrórum poetárum dixérunt: Ipsíus enim et genus sumus.'
  "29": Genus ergo cum simus Dei, non debémus æstimáre auro, aut argénto, aut lápidi, sculptúræ artis, et cogitatiónis hóminis, divínum esse símile.
  "30": Et témpora quidem huius ignorántiæ despíciens Deus, nunc annúntiat homínibus ut omnes ubíque pœniténtiam agant,
  "31": eo quod státuit diem, in quo iudicatúrus est orbem in æquitáte, in viro, in quo státuit, fidem præbens ómnibus, súscitans eum a mórtuis.
  "32": 'Cum audíssent autem resurrectiónem mortuórum, quidam quidem irridébant, quidam vero dixérunt: Audiémus te de hoc íterum.'
  "33": Sic Paulus exívit de médio eórum.
  "34": 'Quidam vero viri adhæréntes ei, credidérunt: in quibus et Dionýsius Areopagíta, et múlier nómine Dámaris, et álii cum eis.'
