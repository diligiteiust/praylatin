bible: vulgate
lang: la
language: Latina
book: Daniel
chapter: "12"
verses:
  "1": 'In témpore autem illo consúrget Míchael princeps magnus, qui stat pro fíliis pópuli tui: et véniet tempus quale non fuit ab eo ex quo gentes esse cœpérunt usque ad tempus illud. Et in témpore illo salvábitur pópulus tuus, omnis qui invéntus fúerit scriptus in libro.'
  "2": 'Et multi de his, qui dórmiunt in terræ púlvere, evigilábunt: álii in vitam ætérnam, et álii in oppróbrium ut vídeant semper.'
  "3": 'Qui autem docti fúerint, fulgébunt quasi splendor firmaménti: et qui ad iustítiam erúdiunt multos, quasi stellæ in perpétuas æternitátes.'
  "4": 'Tu autem Dániel, claude sermónes, et signa librum usque ad tempus statútum: plúrimi pertransíbunt, et múltiplex erit sciéntia.'
  "5": 'Et vidi ego Dániel, et ecce quasi duo álii stabant: unus hinc super ripam flúminis, et álius inde ex áltera ripa flúminis.'
  "6": 'Et dixi viro, qui erat indútus líneis, qui stabat super aquas flúminis: Usquequo finis horum mirabílium?'
  "7": Et audívi virum, qui indútus erat líneis, qui stabat super aquas flúminis, cum elevásset déxteram et sinístram suam in cælum, et iurásset per vivéntem in ætérnum, quia in tempus, et témpora, et dimídium témporis. Et cum compléta fúerit dispérsio manus pópuli sancti, complebúntur univérsa hæc.
  "8": 'Et ego audívi, et non intelléxi. Et dixi: Dómine mi, quid erit post hæc?'
  "9": 'Et ait: Vade Dániel, quia clausi sunt signatíque sermónes usque ad præfinítum tempus.'
  "10": 'Eligéntur, et dealbabúntur, et quasi ignis probabúntur multi: et ímpie agent ímpii, neque intélligent omnes ímpii, porro docti intélligent.'
  "11": Et a témpore cum ablátum fúerit iuge sacrifícium, et pósita fúerit abominátio in desolatiónem, dies mille ducénti nonagínta.
  "12": Beátus, qui exspéctat, et pérvenit usque ad dies mille trecéntos trigínta quinque.
  "13": 'Tu autem vade ad præfinítum: et requiésces, et stabis in sorte tua in finem diérum.'
