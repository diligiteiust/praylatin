bible: vulgate
lang: la
language: Latina
book: I Regum
chapter: "16"
verses:
  "1": 'Factus est autem sermo Dómini ad Iehu fílium Hánani contra Báasa, dicens:'
  "2": 'Pro eo quod exaltávi te de púlvere, et pósui te ducem super pópulum meum Israel, tu autem ambulásti in via Ieróboam, et peccáre fecísti pópulum meum Israel, ut me irritáres in peccátis eórum:'
  "3": ecce, ego demétam posterióra Báasa, et posterióra domus eius, et fáciam domum tuam sicut domum Ieróboam fílii Nabat.
  "4": 'Qui mórtuus fúerit de Báasa in civitáte, cómedent eum canes: et qui mórtuus fúerit ex eo in regióne, cómedent eum vólucres cæli.'
  "5": Réliqua autem sermónum Báasa, et quæcúmque fecit, et prœ́lia eius, nonne hæc scripta sunt in Libro verbórum diérum regum Israel?
  "6": 'Dormívit ergo Báasa cum pátribus suis, sepultúsque est in Thersa: et regnávit Ela fílius eius pro eo.'
  "7": 'Cum autem in manu Iehu fílii Hánani prophétæ verbum Dómini factum esset contra Báasa, et contra domum eius, et contra omne malum, quod fécerat coram Dómino, ad irritándum eum in opéribus mánuum suárum, ut fíeret sicut domus Ieróboam: ob hanc causam occídit eum, hoc est, Iehu fílium Hánani prophétam.'
  "8": Anno vigésimo sexto Asa regis Iuda, regnávit Ela fílius Báasa super Israel in Thersa, duóbus annis.
  "9": 'Et rebellávit contra eum servus suus Zambri, dux médiæ partis équitum: erat autem Ela in Thersa bibens, et temuléntus in domo Arsa præfécti Thersa.'
  "10": Irruens ergo Zambri, percússit, et occídit eum, anno vigésimo séptimo Asa regis Iuda, et regnávit pro eo.
  "11": Cumque regnásset, et sedísset super sólium eius, percússit omnem domum Báasa, et non derelíquit ex ea mingéntem ad paríetem, et propínquos et amícos eius.
  "12": Delevítque Zambri omnem domum Báasa, iuxta verbum Dómini, quod locútus fúerat ad Báasa in manu Iehu prophétæ,
  "13": propter univérsa peccáta Báasa, et peccáta Ela fílii eius, qui peccavérunt, et peccáre fecérunt Israel, provocántes Dóminum Deum Israel in vanitátibus suis.
  "14": Réliqua autem sermónum Ela, et ómnia quæ fecit, nonne hæc scripta sunt in Libro verbórum diérum regum Israel?
  "15": 'Anno vigésimo séptimo Asa regis Iuda, regnávit Zambri septem diébus in Thersa: porro exércitus obsidébat Gébbethon urbem Philisthinórum.'
  "16": Cumque audísset rebellásse Zambri, et occidísse regem, fecit sibi regem omnis Israel Amri, qui erat princeps milítiæ super Israel in die illa in castris.
  "17": Ascéndit ergo Amri, et omnis Israel cum eo, de Gébbethon, et obsidébant Thersa.
  "18": 'Videns autem Zambri quod expugnánda esset cívitas, ingréssus est palátium, et succéndit se cum domo régia: et mórtuus est'
  "19": in peccátis suis, quæ peccáverat fáciens malum coram Dómino, et ámbulans in via Ieróboam, et in peccáto eius, quo fecit peccáre Israel.
  "20": Réliqua autem sermónum Zambri, et insidiárum eius, et tyránnidis, nonne hæc scripta sunt in Libro verbórum diérum regum Israel?
  "21": 'Tunc divísus est pópulus Israel in duas partes: média pars pópuli sequebátur Thebni fílium Gineth, ut constitúeret eum regem: et média pars Amri.'
  "22": 'Præváluit autem pópulus, qui erat cum Amri, pópulo qui sequebátur Thebni fílium Gineth: mortuúsque est Thebni, et regnávit Amri.'
  "23": 'Anno trigésimo primo Asa regis Iuda, regnávit Amri super Israel, duódecim annis: in Thersa regnávit sex annis.'
  "24": 'Emítque montem Samaríæ a Somer duóbus taléntis argénti: et ædificávit eum, et vocávit nomen civitátis, quam exstrúxerat, nómine Semer dómini montis, Samaríam.'
  "25": Fecit autem Amri malum in conspéctu Dómini, et operátus est néquiter, super omnes qui fuérunt ante eum.
  "26": 'Ambulavítque in omni via Ieróboam fílii Nabat, et in peccátis eius quibus peccáre fécerat Israel: ut irritáret Dóminum Deum Israel in vanitátibus suis.'
  "27": Réliqua autem sermónum Amri, et prœ́lia eius, quæ gessit, nonne hæc scripta sunt in Libro verbórum diérum regum Israel?
  "28": 'Dormivítque Amri cum pátribus suis, et sepúltus est in Samaría: regnavítque Achab fílius eius pro eo.'
  "29": Achab vero fílius Amri regnávit super Israel anno trigésimo octávo Asa regis Iuda. Et regnávit Achab fílius Amri super Israel in Samaría vigínti et duóbus annis.
  "30": Et fecit Achab fílius Amri malum in conspéctu Dómini super omnes, qui fuérunt ante eum.
  "31": 'Nec suffécit ei ut ambuláret in peccátis Ieróboam fílii Nabat: ínsuper duxit uxórem Iézabel fíliam Ethbaal regis Sidoniórum. Et ábiit, et servívit Baal, et adorávit eum.'
  "32": Et pósuit aram Baal in templo Baal, quod ædificáverat in Samaría,
  "33": 'et plantávit lucum: et áddidit Achab in ópere suo, irrítans Dóminum Deum Israel super omnes reges Israel, qui fuérunt ante eum.'
  "34": 'In diébus eius ædificávit Hiel de Bethel Iéricho: in Abiram primitívo suo fundávit eam, et in Segub novíssimo suo pósuit portas eius: iuxta verbum Dómini, quod locútus fúerat in manu Iósue fílii Nun.'
