bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "103"
verses:
  "1": 'Ipsi David. Bénedic ánima mea Dómino: Dómine Deus meus, magnificátus es veheménter. Confessiónem, et decórem induísti:'
  "2": 'amíctus lúmine sicut vestiménto: exténdens cælum sicut pellem:'
  "3": 'qui tegis aquis superióra eius. Qui ponis nubem ascénsum tuum: qui ámbulas super pennas ventórum.'
  "4": 'Qui facis ángelos tuos, spíritus: et minístros tuos, ignem uréntem.'
  "5": 'Qui fundásti terram super stabilitátem suam: non inclinábitur in sǽculum sǽculi.'
  "6": 'Abýssus sicut vestiméntum amíctus eius: super montes stabunt aquæ.'
  "7": 'Ab increpatióne tua fúgient: a voce tonítrui tui formidábunt.'
  "8": 'Ascéndunt montes: et descéndunt campi, in locum quem fundásti eis.'
  "9": 'Términum posuísti, quem non transgrediéntur: neque converténtur operíre terram.'
  "10": 'Qui emíttis fontes in convállibus: inter médium móntium pertransíbunt aquæ.'
  "11": 'Potábunt omnes béstiæ agri: exspectábunt ónagri in siti sua.'
  "12": 'Super ea vólucres cæli habitábunt: de médio petrárum dabunt voces.'
  "13": 'Rigans montes de superióribus suis: de fructu óperum tuórum satiábitur terra:'
  "14": 'prodúcens fœnum iuméntis, et herbam servitúti hóminum: ut edúcas panem de terra:'
  "15": 'et vinum lætíficet cor hóminis: ut exhílaret fáciem in óleo: et panis cor hóminis confírmet.'
  "16": 'Saturabúntur ligna campi, et cedri Líbani quas plantávit:'
  "17": 'illic pásseres nidificábunt. Heródii domus dux est eórum:'
  "18": 'montes excélsi cervis: petra refúgium herináciis.'
  "19": 'Fecit lunam in témpora: sol cognóvit occásum suum.'
  "20": 'Posuísti ténebras, et facta est nox: in ipsa pertransíbunt omnes béstiæ silvæ.'
  "21": Cátuli leónum rugiéntes, ut rápiant, et quærant a Deo escam sibi.
  "22": 'Ortus est sol, et congregáti sunt: et in cubílibus suis collocabúntur.'
  "23": 'Exíbit homo ad opus suum: et ad operatiónem suam usque ad vésperum.'
  "24": 'Quam magnificáta sunt ópera tua Dómine! ómnia in sapiéntia fecísti: impléta est terra possessióne tua.'
  "25": 'Hoc mare magnum, et spatiósum mánibus: illic reptília, quorum non est númerus. Animália pusílla cum magnis:'
  "26": 'illic naves pertransíbunt: draco iste, quem formásti ad illudéndum ei:'
  "27": ómnia a te exspéctant ut des illis escam in témpore.
  "28": 'Dante te illis, cólligent: aperiénte te manum tuam, ómnia implebúntur bonitáte.'
  "29": 'Averténte autem te fáciem, turbabúntur: áuferes spíritum eórum, et defícient, et in púlverem suum reverténtur.'
  "30": 'Emíttes spíritum tuum, et creabúntur: et renovábis fáciem terræ.'
  "31": 'Sit glória Dómini in sǽculum: lætábitur Dóminus in opéribus suis:'
  "32": 'qui réspicit terram, et facit eam trémere: qui tangit montes, et fúmigant.'
  "33": 'Cantábo Dómino in vita mea: psallam Deo meo quámdiu sum.'
  "34": 'Iucúndum sit ei elóquium meum: ego vero delectábor in Dómino.'
  "35": 'Defíciant peccatóres a terra, et iníqui ita ut non sint: bénedic ánima mea Dómino.'
