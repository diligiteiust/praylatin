bible: vulgate
lang: la
language: Latina
book: Isaias
chapter: "62"
verses:
  "1": Propter Sion non tacébo, et propter Ierúsalem non quiéscam, donec egrediátur ut splendor iustus eius, et salvátor eius ut lampas accendátur.
  "2": 'Et vidébunt gentes iustum tuum, et cuncti reges ínclytum tuum: et vocábitur tibi nomen novum, quod os Dómini nominábit.'
  "3": Et eris coróna glóriæ in manu Dómini, et diadéma regni in manu Dei tui.
  "4": 'Non vocáberis ultra Derelícta: et terra tua non vocábitur ámplius Desoláta: sed vocáberis Volúntas mea in ea, et terra tua Inhabitáta: quia complácuit Dómino in te: et terra tua inhabitábitur.'
  "5": 'Habitábit enim iúvenis cum vírgine, et habitábunt in te fílii tui: et gaudébit sponsus super sponsam, et gaudébit super te Deus tuus.'
  "6": Super muros tuos Ierúsalem constítui custódes, tota die et tota nocte in perpétuum non tacébunt. Qui reminiscímini Dómini, ne taceátis,
  "7": et ne detis siléntium ei, donec stabíliat et donec ponat Ierúsalem laudem in terra.
  "8": 'Iurávit Dóminus in déxtera sua, et in bráchio fortitúdinis suæ: Si dédero tríticum tuum ultra cibum inimícis tuis: et si bíberint fílii aliéni vinum tuum, in quo laborásti.'
  "9": 'Quia qui cóngregant illud, cómedent, et laudábunt Dóminum: et qui compórtant illud, bibent in átriis sanctis meis.'
  "10": 'Transíte, transíte per portas, præparáte viam pópulo: planum fácite iter, elígite lápides, et eleváte signum ad pópulos.'
  "11": 'Ecce Dóminus audítum fecit in extrémis terræ, dícite fíliæ Sion: Ecce Salvátor tuus venit: ecce merces eius cum eo, et opus eius coram illo.'
  "12": 'Et vocábunt eos, Pópulus sanctus, redémpti a Dómino. Tu autem vocáberis: Quæsíta cívitas, et non Derelícta.'
