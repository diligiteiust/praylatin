bible: vulgate
lang: la
language: Latina
book: Actus Apostolorum
chapter: "7"
verses:
  "1": 'Dixit autem princeps sacerdótum: Si hæc ita se habent?'
  "2": 'Qui ait: Viri fratres, et patres audíte: Deus glóriæ appáruit patri nostro Abrahæ cum esset in Mesopotámia, priúsquam morarétur in Charan,'
  "3": 'et dixit ad illum: Exi de terra tua, et de cognatióne tua, et veni in terram, quam monstrávero tibi.'
  "4": Tunc éxiit de terra Chaldæórum, et habitávit in Charan. Et inde, postquam mórtuus est pater eius, tránstulit illum in terram istam, in qua nunc vos habitátis.
  "5": 'Et non dedit illi hereditátem in ea, nec passum pedis: sed repromísit dare illi eam in possessiónem, et sémini eius post ipsum, cum non habéret fílium.'
  "6": 'Locútus est autem ei Deus: Quia erit semen eius áccola in terra aliéna, et servitúti eos subícient, et male tractábunt eos annis quadringéntis:'
  "7": 'et gentem, cui servíerint, iudicábo ego, dixit Dóminus: et post hæc exíbunt, et sérvient mihi in loco isto.'
  "8": 'Et dedit illi testaméntum circumcisiónis: et sic génuit Isaac, et circumcídit eum die octávo: et Isaac, Iacob: et Iacob, duódecim patriárchas.'
  "9": 'Et patriárchæ æmulántes, Ioseph vendidérunt in Ægýptum: et erat Deus cum eo:'
  "10": 'et erípuit eum ex ómnibus tribulatiónibus eius: et dedit ei grátiam, et sapiéntiam in conspéctu Pharaónis regis Ægýpti, et constítuit eum præpósitum super Ægýptum, et super omnem domum suam.'
  "11": 'Venit autem fames in univérsam Ægýptum, et Chánaan, et tribulátio magna: et non inveniébant cibos patres nostri.'
  "12": 'Cum audísset autem Iacob esse fruméntum in Ægýpto, misit patres nostros primum:'
  "13": et in secúndo cógnitus est Ioseph a frátribus suis, et manifestátum est Pharaóni genus eius.
  "14": Mittens autem Ioseph, accersívit Iacob patrem suum, et omnem cognatiónem suam, in animábus septuagínta quinque.
  "15": 'Et descéndit Iacob in Ægýptum: et defúnctus est ipse, et patres nostri.'
  "16": Et transláti sunt in Sichem, et pósiti sunt in sepúlcro, quod emit Abraham prétio argénti a fíliis Hemor fílii Sichem.
  "17": Cum autem appropinquáret tempus promissiónis, quam conféssus erat Deus Abrahæ, crevit pópulus, et multiplicátus est in Ægýpto,
  "18": quoadúsque surréxit álius rex in Ægýpto, qui non sciébat Ioseph.
  "19": Hic circumvéniens genus nostrum, afflíxit patres nostros ut expónerent infántes suos, ne vivificaréntur.
  "20": 'Eódem témpore natus est Móyses, et fuit gratus Deo: qui nutrítus est tribus ménsibus in domo patris sui.'
  "21": Expósito autem illo, sústulit eum fília Pharaónis, et nutrívit eum sibi in fílium.
  "22": Et erudítus est Móyses omni sapiéntia Ægyptiórum, et erat potens in verbis, et in opéribus suis.
  "23": Cum autem implerétur ei quadragínta annórum tempus, ascéndit in cor eius ut visitáret fratres suos fílios Israel.
  "24": 'Et cum vidísset quemdam iniúriam patiéntem, vindicávit illum: et fecit ultiónem ei, qui iniúriam sustinébat, percússo Ægýptio.'
  "25": 'Existimábat autem intellígere fratres, quóniam Deus per manum ipsíus daret salútem illis: at illi non intellexérunt.'
  "26": 'Sequénti vero die appáruit illis litigántibus: et reconciliábat eos in pace, dicens: Viri, fratres estis, ut quid nocétis altérutrum?'
  "27": 'Qui autem iniúriam faciébat próximo, répulit eum, dicens: Quis te constítuit príncipem, et iúdicem super nos?'
  "28": Numquid interfícere me tu vis, quemádmodum interfecísti heri Ægýptium?
  "29": 'Fugit autem Móyses in verbo isto: et factus est ádvena in terra Mádian, ubi generávit fílios duos.'
  "30": Et explétis annis quadragínta, appáruit illi in desérto montis Sina ángelus in igne flammæ rubi.
  "31": 'Móyses autem videns, admirátus est visum. Et accedénte illo ut consideráret, facta est ad eum vox Dómini, dicens:'
  "32": Ego sum Deus patrum tuórum, Deus Abraham, Deus Isaac, et Deus Iacob. Tremefáctus autem Móyses, non audébat consideráre.
  "33": 'Dixit autem illi Dóminus: Solve calceaméntum pedum tuórum: locus enim in quo stas, terra sancta est.'
  "34": Videns vidi afflictiónem pópuli mei, qui est in Ægýpto, et gémitum eórum audívi, et descéndi liberáre eos. Et nunc veni, et mittam te in Ægýptum.
  "35": 'Hunc Móysen, quem negavérunt, dicéntes: Quis te constítuit príncipem, et iúdicem? hunc Deus príncipem et redemptórem misit, cum manu ángeli, qui appáruit illi in rubo.'
  "36": Hic edúxit illos fáciens prodígia, et signa in terra Ægýpti, et in rubro mari, et in desérto annis quadragínta.
  "37": 'Hic est Móyses, qui dixit fíliis Israel: Prophétam suscitábit vobis Deus de frátribus vestris, tamquam me: ipsum audiétis.'
  "38": 'Hic est, qui fuit in ecclésia in solitúdine cum ángelo, qui loquebátur ei in monte Sina, et cum pátribus nostris: qui accépit verba vitæ dare nobis.'
  "39": 'Cui noluérunt obedíre patres nostri: sed repulérunt, et avérsi sunt córdibus suis in Ægýptum,'
  "40": 'dicéntes ad Aaron: Fac nobis deos, qui præcédant nos: Móyses enim hic, qui edúxit nos de terra Ægýpti, nescímus quid factum sit ei.'
  "41": Et vítulum fecérunt in diébus illis, et obtulérunt hóstiam simulácro, et lætabántur in opéribus mánuum suárum.
  "42": 'Convértit autem Deus, et trádidit eos servíre milítiæ cæli, sicut scriptum est in libro prophetárum: Numquid víctimas, et hóstias obtulístis mihi annis quadragínta in desérto, domus Israel?'
  "43": 'Et suscepístis tabernáculum Moloch, et sidus dei vestri Rempham, figúras, quas fecístis adoráre eas: et tránsferam vos trans Babylónem.'
  "44": Tabernáculum testimónii fuit cum pátribus nostris in desérto, sicut dispósuit illis Deus, loquens ad Móysen, ut fáceret illud secúndum formam, quam víderat.
  "45": Quod et induxérunt, suscipiéntes patres nostri cum Iesu in possessiónem géntium, quas éxpulit Deus a fácie patrum nostrórum, usque in diébus David,
  "46": qui invénit grátiam ante Deum, et pétiit ut inveníret tabernáculum Deo Iacob.
  "47": Sálomon autem ædificávit illi domum.
  "48": 'Sed non excélsus in manufáctis hábitat, sicut prophéta dicit:'
  "49": 'Cælum mihi sedes est: terra autem scabéllum pedum meórum. Quam domum ædificábitis mihi, dicit Dóminus? aut quis locus requietiónis meæ est?'
  "50": Nonne manus mea fecit hæc ómnia?
  "51": Dura cervíce, et incircumcísis córdibus, et áuribus, vos semper Spirítui sancto resístitis, sicut patres vestri, ita et vos.
  "52": 'Quem prophetárum non sunt persecúti patres vestri? Et occidérunt eos, qui prænuntiábant de advéntu Iusti, cuius vos nunc proditóres, et homicídæ fuístis:'
  "53": qui accepístis legem in dispositióne angelórum, et non custodístis.
  "54": Audiéntes autem hæc, dissecabántur córdibus suis, et stridébant déntibus in eum.
  "55": 'Cum autem esset plenus Spíritu sancto, inténdens in cælum, vidit glóriam Dei, et Iesum stantem a dextris Dei. Et ait: Ecce vídeo cælos apértos, et Fílium hóminis stantem a dextris Dei.'
  "56": Exclamántes autem voce magna continuérunt aures suas, et ímpetum fecérunt unanímiter in eum.
  "57": 'Et eiciéntes eum extra civitátem lapidábant: et testes deposuérunt vestiménta sua secus pedes adolescéntis, qui vocabátur Saulus.'
  "58": 'Et lapidábant Stéphanum invocántem, et dicéntem: Dómine Iesu súscipe spíritum meum.'
  "59": 'Pósitis autem génibus, clamávit voce magna, dicens: Dómine ne státuas illis hoc peccátum. Et cum hoc dixísset, obdormívit in Dómino. Saulus autem erat conséntiens neci eius.'
