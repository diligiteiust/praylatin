bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "13"
verses:
  "1": 'In finem, Psalmus David. Dixit insípiens in corde suo: Non est Deus. Corrúpti sunt, et abominábiles facti sunt in stúdiis suis: non est qui fáciat bonum, non est usque ad unum.'
  "2": Dóminus de cælo prospéxit super fílios hóminum, ut vídeat si est intélligens, aut requírens Deum.
  "3": 'Omnes declinavérunt, simul inútiles facti sunt. Non est qui fáciat bonum, non est usque ad unum. Sepúlcrum patens est guttur eórum: linguis suis dolóse agébant, venénum áspidum sub lábiis eórum. Quorum os maledictióne et amaritúdine plenum est: velóces pedes eórum ad effundéndum sánguinem. Contrítio et infelícitas in viis eórum, et viam pacis non cognovérunt: non est timor Dei ante óculos eórum.'
  "4": Nonne cognóscent omnes qui operántur iniquitátem, qui dévorant plebem meam sicut escam panis?
  "5": 'Dóminum non invocavérunt: illic trepidavérunt timóre, ubi non erat timor.'
  "6": 'Quóniam Dóminus in generatióne iusta est: consílium ínopis confudístis: quóniam Dóminus spes eius est.'
  "7": Quis dabit ex Sion salutáre Israel? cum avérterit Dóminus captivitátem plebis suæ, exsultábit Iacob, et lætábitur Israel.
