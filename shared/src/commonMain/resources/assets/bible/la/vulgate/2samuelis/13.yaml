bible: vulgate
lang: la
language: Latina
book: II Samuelis
chapter: "13"
verses:
  "1": Factum est autem post hæc ut Absalom fílii David sorórem speciosíssimam, vocábulo Thamar, adamáret Amnon fílius David,
  "2": 'et deperíret eam valde, ita ut propter amórem eius ægrotáret: quia cum esset virgo, diffícile ei videbátur ut quíppiam inhonéste ágeret cum ea.'
  "3": Erat autem Amnon amícus nómine Iónadab, fílius Sémmaa fratris David, vir prudens valde.
  "4": 'Qui dixit ad eum: Quare sic attenuáris mácie fili regis per síngulos dies? cur non índicas mihi? Dixítque ei Amnon: Thamar sorórem fratris mei Absalom amo.'
  "5": 'Cui respóndit Iónadab: Cuba super lectum tuum, et languórem símula: cumque vénerit pater tuus ut vísitet te, dic ei: Véniat, oro, Thamar soror mea, ut det mihi cibum, et fáciat pulméntum, ut cómedam de manu eius.'
  "6": 'Accúbuit ítaque Amnon, et quasi ægrotáre cœpit: cumque venísset rex ad visitándum eum, ait Amnon ad regem: Véniat, óbsecro, Thamar soror mea, ut fáciat in óculis meis duas sorbitiúnculas, et cibum cápiam de manu eius.'
  "7": 'Misit ergo David ad Thamar domum, dicens: Veni in domum Amnon fratris tui, et fac ei pulméntum.'
  "8": 'Venítque Thamar in domum Amnon fratris sui: ille autem iacébat. Quæ tollens farínam commíscuit, et liquefáciens, in óculis eius coxit sorbitiúnculas.'
  "9": 'Tollénsque quod cóxerat, effúdit, et pósuit coram eo, et nóluit comédere: dixítque Amnon: Eícite univérsos a me. Cumque eiecíssent omnes,'
  "10": 'dixit Amnon ad Thamar: Infer cibum in concláve, ut vescar de manu tua. Tulit ergo Thamar sorbitiúnculas, quas fécerat, et íntulit ad Amnon fratrem suum in concláve.'
  "11": 'Cumque obtulísset ei cibum, apprehéndit eam, et ait: Veni, cuba mecum, soror mea.'
  "12": 'Quæ respóndit ei: Noli frater mi, noli opprímere me: neque enim hoc fas est in Israel: noli fácere stultítiam hanc.'
  "13": 'Ego enim ferre non pótero oppróbrium meum, et tu eris quasi unus de insipiéntibus in Israel: quin pótius lóquere ad regem, et non negábit me tibi.'
  "14": Nóluit autem acquiéscere précibus eius, sed prǽvalens víribus oppréssit eam, et cubávit cum ea.
  "15": 'Et exósam eam hábuit Amnon ódio magno nimis: ita ut maius esset ódium, quo óderat eam, amóre quo ante diléxerat. Dixítque ei Amnon: Surge, et vade.'
  "16": 'Quæ respóndit ei: Maius est hoc malum, quod nunc agis advérsum me, quam quod ante fecísti, expéllens me. Et nóluit audíre eam:'
  "17": 'sed vocáto púero, qui ministrábat ei, dixit: Eice hanc a me foras, et claude óstium post eam.'
  "18": 'Quæ indúta erat talári túnica: huiuscémodi enim fíliæ regis vírgines véstibus utebántur. Eiécit ítaque eam miníster illíus foras: clausítque fores post eam.'
  "19": Quæ aspérgens cínerem cápiti suo, scissa talári túnica, impositísque mánibus super caput suum, ibat ingrédiens, et clamans.
  "20": 'Dixit autem ei Absalom frater suus: Numquid Amnon frater tuus concúbuit tecum? sed nunc soror tace, frater tuus est: neque afflígas cor tuum pro hac re. Mansit ítaque Thamar contabéscens in domo Absalom fratris sui.'
  "21": 'Cum autem audísset rex David verba hæc, contristátus est valde: et nóluit contristáre spíritum Amnon fílii sui, quóniam diligébat eum, quia primogénitus erat ei.'
  "22": 'Porro non est locútus Absalom ad Amnon nec malum nec bonum: óderat enim Absalom Amnon, eo quod violásset Thamar sorórem suam.'
  "23": 'Factum est autem post tempus biénnii, ut tonderéntur oves Absalom in Baálhasor, quæ est iuxta Ephraim: et vocávit Absalom omnes fílios regis,'
  "24": 'venítque ad regem, et ait ad eum: Ecce tondéntur oves servi tui: véniat, oro, rex cum servis suis ad servum suum.'
  "25": 'Dixítque rex ad Absalom: Noli fili mi, noli rogáre ut veniámus omnes, et gravémus te. Cum autem cógeret eum, et noluísset ire, benedíxit ei.'
  "26": 'Et ait Absalom: Si non vis veníre, véniat, óbsecro, nobíscum saltem Amnon frater meus. Dixítque ad eum rex: Non est necésse ut vadat tecum.'
  "27": Coégit ítaque Absalom eum, et dimísit cum eo Amnon et univérsos fílios regis. Fecerátque Absalom convívium quasi convívium regis.
  "28": 'Præcéperat autem Absalom púeris suis, dicens: Observáte cum temuléntus fúerit Amnon vino, et díxero vobis: Percútite eum, et interfícite: nolíte timére: ego enim sum qui præcípio vobis: roborámini, et estóte viri fortes.'
  "29": Fecérunt ergo púeri Absalom advérsum Amnon sicut præcéperat eis Absalom. Surgentésque omnes fílii regis ascendérunt sínguli mulas suas, et fugérunt.
  "30": 'Cumque adhuc pérgerent in itínere, fama pervénit ad David, dicens: Percússit Absalom omnes fílios regis, et non remánsit ex eis saltem unus.'
  "31": 'Surréxit ítaque rex, et scidit vestiménta sua, et cécidit super terram: et omnes servi illíus, qui assistébant ei, scidérunt vestiménta sua.'
  "32": 'Respóndens autem Iónadab fílius Sémmaa fratris David, dixit: Ne ǽstimet dóminus meus rex, quod omnes púeri fílii regis occísi sint: Amnon solus mórtuus est, quóniam in ore Absalom erat pósitus ex die qua oppréssit Thamar sorórem eius.'
  "33": 'Nunc ergo ne ponat dóminus meus rex super cor suum verbum istud, dicens: Omnes fílii regis occísi sunt: quóniam Amnon solus mórtuus est.'
  "34": 'Fugit autem Absalom. Et elevávit puer speculátor óculos suos, et aspéxit: et ecce pópulus multus veniébat per iter dévium ex látere montis.'
  "35": 'Dixit autem Iónadab ad regem: Ecce fílii regis adsunt: iuxta verbum servi tui, sic factum est.'
  "36": 'Cumque cessásset loqui, apparuérunt et fílii regis: et intrántes levavérunt vocem suam, et flevérunt: sed et rex et omnes servi eius flevérunt plorátu magno nimis.'
  "37": Porro Absalom fúgiens, ábiit ad Tholómai fílium Ammiud regem Gessur. Luxit ergo David fílium suum cunctis diébus.
  "38": Absalom autem cum fugísset, et venísset in Gessur, fuit ibi tribus annis.
  "39": Cessavítque rex David pérsequi Absalom, eo quod consolátus esset super Amnon intéritu.
