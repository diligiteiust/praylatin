bible: vulgate
lang: la
language: Latina
book: Osee
chapter: "5"
verses:
  "1": 'Audíte hoc sacerdótes, et atténdite domus Israel, et domus regis auscultáte: quia vobis iudícium est, quóniam láqueus facti estis speculatióni, et rete expánsum super Thabor.'
  "2": 'Et víctimas declinástis in profúndum: et ego erudítor ómnium eórum.'
  "3": 'Ego scio Ephraim, et Israel non est abscónditus a me: quia nunc fornicátus est Ephraim, contaminátus est Israel.'
  "4": 'Non dabunt cogitatiónes suas ut revertántur ad Deum suum: quia spíritus fornicatiónum in médio eórum, et Dóminum non cognovérunt.'
  "5": 'Et respondébit arrogántia Israel in fácie eius: et Israel, et Ephraim ruent in iniquitáte sua: ruet étiam Iudas cum eis.'
  "6": 'In grégibus suis, et in arméntis suis vadent ad quæréndum Dóminum, et non invénient: ablátus est ab eis.'
  "7": 'In Dóminum prævaricáti sunt, quia fílios aliénos genuérunt: nunc devorábit eos mensis, cum pártibus suis.'
  "8": 'Clángite búccina in Gábaa, tuba in Rama: ululáte in Betháven, post tergum tuum Béniamin.'
  "9": 'Ephraim in desolatióne erit in die correptiónis: in tríbubus Israel osténdi fidem.'
  "10": 'Facti sunt príncipes Iuda quasi assuméntes términum: super eos effúndam quasi aquam iram meam.'
  "11": 'Calúmniam pátiens est Ephraim, fractus iudício: quóniam cœpit abíre post sordes.'
  "12": 'Et ego quasi tínea Ephraim: et quasi putrédo dómui Iuda.'
  "13": 'Et vidit Ephraim languórem suum, et Iuda vínculum suum: et ábiit Ephraim ad Assur, et misit ad regem ultórem: et ipse non póterit sanáre vos, nec sólvere póterit a vobis vínculum.'
  "14": 'Quóniam ego quasi leǽna Ephraim, et quasi cátulus leónis dómui Iuda: ego ego cápiam, et vadam: tollam, et non est qui éruat.'
  "15": Vadens revértar ad locum meum, donec deficiátis, et quærátis fáciem meam.
