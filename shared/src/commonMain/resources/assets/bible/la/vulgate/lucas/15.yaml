bible: vulgate
lang: la
language: Latina
book: Lucas
chapter: "15"
verses:
  "1": Erant autem appropinquántes ei publicáni, et peccatóres ut audírent illum.
  "2": 'Et murmurábant Pharisǽi, et scribæ, dicéntes: Quia hic peccatóres récipit, et mandúcat cum illis.'
  "3": 'Et ait ad illos parábolam istam, dicens:'
  "4": Quis ex vobis homo, qui habet centum oves, et si perdíderit unam ex illis, nonne dimíttit nonagínta novem in desérto, et vadit ad illam, quæ períerat, donec invéniat eam?
  "5": 'Et cum invénerit eam, impónit in húmeros suos gaudens:'
  "6": 'et véniens domum cónvocat amícos, et vicínos, dicens illis: Congratulámini mihi, quia invéni ovem meam, quæ períerat.'
  "7": Dico vobis, quod ita gáudium erit in cælo super uno peccatóre pœniténtiam agénte, quam super nonagínta novem iustis, qui non índigent pœniténtia.
  "8": Aut quæ múlier habens drachmas decem, si perdíderit drachmam unam, nonne accéndit lucérnam, et evérrit domum, et quærit diligénter, donec invéniat?
  "9": 'Et cum invénerit, cónvocat amícas, et vicínas, dicens: Congratulámini mihi, quia invéni drachmam, quam perdíderam.'
  "10": Ita dico vobis, gáudium erit coram ángelis Dei super uno peccatóre pœniténtiam agénte.
  "11": 'Ait autem: Homo quidam hábuit duos fílios:'
  "12": 'et dixit adolescéntior ex illis patri: Pater, da mihi portiónem substántiæ, quæ me contíngit. Et divísit illis substántiam.'
  "13": Et non post multos dies, congregátis ómnibus, adolescéntior fílius péregre proféctus est in regiónem longínquam, et ibi dissipávit substántiam suam vivéndo luxurióse.
  "14": Et postquam ómnia consummásset, facta est fames válida in regióne illa, et ipse cœpit egére.
  "15": 'Et ábiit, et adhǽsit uni cívium regiónis illíus: et misit illum in villam suam ut pásceret porcos.'
  "16": 'Et cupiébat implére ventrem suum de síliquis, quas porci manducábant: et nemo illi dabat.'
  "17": 'In se autem revérsus, dixit: Quanti mercenárii in domo patris mei abúndant pánibus, ego autem hic fame péreo!'
  "18": 'Surgam, et ibo ad patrem meum, et dicam ei: Pater, peccávi in cælum, et coram te:'
  "19": 'iam non sum dignus vocári fílius tuus: fac me sicut unum de mercenáriis tuis.'
  "20": Et surgens venit ad patrem suum. Cum autem adhuc longe esset, vidit illum pater ipsíus, et misericórdia motus est, et accúrrens cécidit super collum eius, et osculátus est eum.
  "21": 'Dixítque ei fílius: Pater, peccávi in cælum, et coram te: iam non sum dignus vocári fílius tuus.'
  "22": 'Dixit autem pater ad servos suos: Cito proférte stolam primam, et indúite illum, et date ánnulum in manum eius, et calceaménta in pedes eius:'
  "23": 'et addúcite vítulum saginátum, et occídite, et manducémus, et epulémur:'
  "24": 'quia hic fílius meus mórtuus erat, et revíxit: períerat, et invéntus est. Et cœpérunt epulári.'
  "25": 'Erat autem fílius eius sénior in agro: et cum veníret, et appropinquáret dómui, audívit symphóniam, et chorum:'
  "26": et vocávit unum de servis, et interrogávit quid hæc essent.
  "27": 'Isque dixit illi: Frater tuus venit, et occídit pater tuus vítulum saginátum, quia salvum illum recépit.'
  "28": Indignátus est autem, et nolébat introíre. Pater ergo illíus egréssus, cœpit rogáre illum.
  "29": 'At ille respóndens, dixit patri suo: Ecce tot annis sérvio tibi, et numquam mandátum tuum præterívi: et numquam dedísti mihi hædum ut cum amícis meis epulárer.'
  "30": Sed postquam fílius tuus hic, qui devorávit substántiam suam cum meretrícibus, venit, occidísti illi vítulum saginátum.
  "31": 'At ipse dixit illi: Fili, tu semper mecum es, et ómnia mea tua sunt:'
  "32": 'epulári autem, et gaudére oportébat, quia frater tuus hic mórtuus erat, et revíxit: períerat, et invéntus est.'
