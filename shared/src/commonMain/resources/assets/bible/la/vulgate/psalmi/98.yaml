bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "98"
verses:
  "1": 'Psalmus ipsi David. Dóminus regnávit, irascántur pópuli: qui sedet super chérubim, moveátur terra.'
  "2": 'Dóminus in Sion magnus: et excélsus super omnes pópulos.'
  "3": 'Confiteántur nómini tuo magno: quóniam terríbile, et sanctum est:'
  "4": 'et honor regis iudícium díligit. Tu parásti directiónes: iudícium et iustítiam in Iacob tu fecísti.'
  "5": 'Exaltáte Dóminum Deum nostrum, et adoráte scabéllum pedum eius: quóniam sanctum est.'
  "6": 'Móyses, et Aaron in sacerdótibus eius: et Sámuel inter eos qui ínvocant nomen eius: invocábant Dóminum, et ipse exaudiébat eos:'
  "7": in colúmna nubis loquebátur ad eos. Custodiébant testimónia eius, et præcéptum quod dedit illis.
  "8": 'Dómine Deus noster tu exaudiébas eos: Deus tu propítius fuísti eis, et ulcíscens in omnes adinventiónes eórum.'
  "9": 'Exaltáte Dóminum Deum nostrum, et adoráte in monte sancto eius: quóniam sanctus Dóminus Deus noster.'
