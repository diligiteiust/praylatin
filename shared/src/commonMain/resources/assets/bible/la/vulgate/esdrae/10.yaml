bible: vulgate
lang: la
language: Latina
book: Esdrae
chapter: "10"
verses:
  "1": Sic ergo oránte Esdra, et imploránte eo, et flente, et iacénte ante templum Dei, colléctus est ad eum de Israel cœtus grandis nimis virórum et mulíerum et puerórum, et flevit pópulus fletu multo.
  "2": 'Et respóndit Sechenías fílius Iéhiel de fíliis Ælam, et dixit Esdræ: Nos prævaricáti sumus in Deum nostrum, et dúximus uxóres alienígenas de pópulis terræ: et nunc, si est pœniténtia in Israel super hoc,'
  "3": 'percutiámus fœdus cum Dómino Deo nostro, ut proiciámus univérsas uxóres, et eos qui de his nati sunt, iuxta voluntátem Dómini, et eórum qui timent præcéptum Dómini Dei nostri: secúndum legem fiat.'
  "4": 'Surge, tuum est decérnere, nosque érimus tecum: confortáre, et fac.'
  "5": 'Surréxit ergo Esdras, et adiurávit príncipes sacerdótum et Levitárum, et omnem Israel, ut fácerent secúndum verbum hoc: et iuravérunt.'
  "6": 'Et surréxit Esdras ante domum Dei, et ábiit ad cubículum Ióhanan fílii Elíasib, et ingréssus est illuc: panem non comédit, et aquam non bibit: lugébat enim transgressiónem eórum, qui vénerant de captivitáte.'
  "7": 'Et missa est vox in Iuda et in Ierúsalem ómnibus fíliis transmigratiónis, ut congregaréntur in Ierúsalem:'
  "8": et omnis qui non vénerit in tribus diébus iuxta consílium príncipum et seniórum, auferétur univérsa substántia eius, et ipse abiciétur de cœtu transmigratiónis.
  "9": 'Convenérunt ígitur omnes viri Iuda, et Béniamin in Ierúsalem tribus diébus: ipse est mensis nonus, vigésimo die mensis: et sedit omnis pópulus in platéa domus Dei, treméntes pro peccáto, et plúviis.'
  "10": 'Et surréxit Esdras sacérdos, et dixit ad eos: Vos transgréssi estis, et duxístis uxóres alienígenas, ut adderétis super delíctum Israel.'
  "11": Et nunc date confessiónem Dómino Deo patrum vestrórum, et fácite plácitum eius, et separámini a pópulis terræ, et ab uxóribus alienígenis.
  "12": 'Et respóndit univérsa multitúdo, dixítque voce magna: Iuxta verbum tuum ad nos, sic fiat.'
  "13": Verúmtamen quia pópulus multus est, et tempus plúviæ, et non sustinémus stare foris, et opus non est diéi uníus vel duórum (veheménter quippe peccávimus in sermóne isto),
  "14": 'constituántur príncipes in univérsa multitúdine: et omnes in civitátibus nostris qui duxérunt uxóres alienígenas, véniant in tempóribus statútis, et cum his senióres per civitátem et civitátem, et iúdices eius, donec avertátur ira Dei nostri a nobis super peccáto hoc.'
  "15": 'Igitur Iónathan fílius Azahel, et Iaasía fílius Thécue, stetérunt super hoc, et Messóllam et Sebéthai Levítes adiuvérunt eos:'
  "16": fecerúntque sic fílii transmigratiónis. Et abiérunt Esdras sacérdos, et viri príncipes familiárum, in domos patrum suórum, et omnes per nómina sua, et sedérunt in die primo mensis décimi ut quǽrerent rem.
  "17": Et consummáti sunt omnes viri, qui dúxerant uxóres alienígenas, usque ad diem primam mensis primi.
  "18": Et invénti sunt de fíliis sacerdótum qui dúxerant uxóres alienígenas. De fíliis Iósue fílii Iósedec, et fratres eius, Maasía, et Eliézer, et Iarib, et Godolía.
  "19": Et dedérunt manus suas ut eícerent uxóres suas, et pro delícto suo aríetem de óvibus offérrent.
  "20": Et de fíliis Emmer, Hánani, et Zebedía.
  "21": Et de fíliis Harim, Maasía, et Elía, et Semeía, et Iéhiel, et Ozías.
  "22": Et de fíliis Pheshur, Elioénai, Maasía, Ismael, Nathánael, Iózabed, et Elasa.
  "23": Et de fíliis Levitárum, Iózabed, et Sémei, et Celaía, ipse est Cálita, Phataía, Iuda, et Eliézer.
  "24": Et de cantóribus, Elíasib. Et de ianitóribus, Sellum, et Telem, et Uri.
  "25": Et ex Israel, de fíliis Pharos, Remeía, et Iesía, et Melchía, et Míamin, et Eliézer, et Melchía, et Bánea.
  "26": Et de fíliis Ælam, Mathanía, Zacharías, et Iéhiel, et Abdi, et Iérimoth, et Elía.
  "27": Et de fíliis Zéthua, Elioénai, Elíasib, Mathanía, et Iérimuth, et Zabad, et Azíza.
  "28": Et de fíliis Bébai, Ióhanan, Hananía, Zábbai, Athálai.
  "29": Et de fíliis Bani, Mosóllam, et Melluch, et Adaía, Iasub, et Saal, et Ramoth.
  "30": Et de fíliis Phahath Moab, Edna, et Chalal, Banaías, et Maasías, Mathanías, Beséleel, Bénnui, et Manásse.
  "31": Et de fíliis Herem, Eliézer, Iósue, Melchías, Semeías, Símeon,
  "32": Béniamin, Maloch, Samarías.
  "33": Et de fíliis Hasom, Mathánai, Máthatha, Zabad, Elíphelet, Iérmai, Manásse, Sémei.
  "34": De fíliis Bani, Maáddi, Amram, et Vel,
  "35": Báneas, et Badaías, Chelíau,
  "36": Vanía, Márimuth, et Elíasib,
  "37": Mathanías, Mathánai, et Iasi,
  "38": et Bani, et Bénnui, Sémei,
  "39": et Salmías, et Nathan, et Adaías,
  "40": et Mechnedébai, Sísai, Sárai,
  "41": Ezrel, et Selemíau, Semería,
  "42": Sellum, Amaría, Ioseph.
  "43": De fíliis Nebo, Iéhiel, Mathathías, Zabad, Zábina, Ieddu, et Ioel, et Banaía.
  "44": Omnes hi accéperant uxóres alienígenas, et fuérunt ex eis mulíeres, quæ pepérerant fílios.
