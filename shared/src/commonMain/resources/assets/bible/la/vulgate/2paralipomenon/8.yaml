bible: vulgate
lang: la
language: Latina
book: II Paralipomenon
chapter: "8"
verses:
  "1": 'Explétis autem vigínti annis postquam ædificávit Sálomon domum Dómini et domum suam:'
  "2": civitátes, quas déderat Hiram Salomóni, ædificávit, et habitáre ibi fecit fílios Israel.
  "3": Abiit quoque in Emath Suba, et obtínuit eam.
  "4": Et ædificávit Palmýram in desérto, et álias civitátes munitíssimas ædificávit in Emath.
  "5": 'Exstruxítque Béthoron superiórem, et Béthoron inferiórem, civitátes murátas habéntes portas et vectes et seras:'
  "6": Bálaath étiam et omnes urbes firmíssimas, quæ fuérunt Salomónis, cunctásque urbes quadrigárum, et urbes équitum. Omnia quæcúmque vóluit Sálomon atque dispósuit, ædificávit in Ierúsalem, et in Líbano, et in univérsa terra potestátis suæ.
  "7": 'Omnem pópulum, qui derelíctus fúerat de Hethǽis, et Amorrhǽis, et Pherezǽis, et Hevǽis, et Iebusǽis, qui non erant de stirpe Israel:'
  "8": de fíliis eórum, et de pósteris, quos non interfécerant fílii Israel, subiugávit Sálomon in tributários, usque in diem hanc.
  "9": 'Porro de fíliis Israel non pósuit ut servírent opéribus regis: ipsi enim erant viri bellatóres, et duces primi, et príncipes quadrigárum et équitum eius.'
  "10": Omnes autem príncipes exércitus regis Salomónis fuérunt ducénti quinquagínta, qui erudiébant pópulum.
  "11": 'Fíliam vero Pharaónis tránstulit de civitáte David in domum, quam ædificáverat ei. Dixit enim rex: Non habitábit uxor mea in domo David regis Israel, eo quod sanctificáta sit: quia ingréssa est in eam arca Dómini.'
  "12": Tunc óbtulit Sálomon holocáusta Dómino super altáre Dómini, quod exstrúxerat ante pórticum,
  "13": ut per síngulos dies offerrétur in eo iuxta præcéptum Móysi in sábbatis et in caléndis, et in festis diébus, ter per annum, id est, in solemnitáte azymórum, et in solemnitáte hebdomadárum, et in solemnitáte tabernaculórum.
  "14": 'Et constítuit iuxta dispositiónem David patris sui offícia sacerdótum in ministériis suis, et Levítas in órdine suo, ut laudárent et ministrárent coram sacerdótibus iuxta ritum uniuscuiúsque diéi, et ianitóres in divisiónibus suis per portam et portam: sic enim præcéperat David homo Dei.'
  "15": Nec prætergréssi sunt de mandátis regis, tam sacerdótes quam Levítæ, ex ómnibus quæ præcéperat, et in custódiis thesaurórum.
  "16": Omnes impénsas præparátas hábuit Sálomon ex eo die, quo fundávit domum Dómini usque in diem, quo perfécit eam.
  "17": Tunc ábiit Sálomon in Asióngaber, et in Ailath ad oram maris Rubri, quæ est in terra Edom.
  "18": Misit autem ei Hiram per manus servórum suórum naves, et nautas gnaros maris, et abiérunt cum servis Salomónis in Ophir, tulerúntque inde quadringénta quinquagínta talénta auri, et attulérunt ad regem Salomónem.
