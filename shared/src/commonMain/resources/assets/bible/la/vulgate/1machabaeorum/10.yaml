bible: vulgate
lang: la
language: Latina
book: I Machabaeorum
chapter: "10"
verses:
  "1": 'Et anno centésimo sexagésimo, ascéndit Alexánder Antíochi fílius, qui cognominátus est Nóbilis: et occupávit Ptolemáidam: et recepérunt eum, et regnávit illic.'
  "2": Et audívit Demétrius rex, et congregávit exércitum copiósum valde, et exívit óbviam illi in prœ́lium.
  "3": Et misit Demétrius epístolam ad Iónathan verbis pacíficis, ut magnificáret eum.
  "4": 'Dixit enim: Anticipémus fácere pacem cum eo, priúsquam fáciat cum Alexándro advérsum nos:'
  "5": recordábitur enim ómnium malórum, quæ fécimus in eum, et in fratrem eius, et in gentem eius.
  "6": 'Et dedit ei potestátem congregándi exércitum, et fabricáre arma, et esse ipsum sócium eius: et óbsides, qui erant in arce, iussit tradi ei.'
  "7": Et venit Iónathas in Ierúsalem, et legit epístolas in audítu omnis pópuli, et eórum, qui in arce erant.
  "8": Et timuérunt timóre magno, quóniam audiérunt quod dedit ei rex potestátem congregándi exércitum.
  "9": 'Et tráditi sunt Iónathæ óbsides, et réddidit eos paréntibus suis:'
  "10": et habitávit Iónathas in Ierúsalem, et cœpit ædificáre et innováre civitátem.
  "11": 'Et dixit faciéntibus ópera ut exstrúerent muros, et montem Sion in circúitu lapídibus quadrátis ad munitiónem: et ita fecérunt.'
  "12": 'Et fugérunt alienígenæ, qui erant in munitiónibus, quas Bácchides ædificáverat:'
  "13": 'et relíquit unusquísque locum suum, et ábiit in terram suam:'
  "14": 'tantum in Bethsúra remansérunt áliqui ex his, qui relíquerant legem, et præcépta Dei: erat enim hæc eis ad refúgium.'
  "15": 'Et audívit Alexánder rex promíssa, quæ promísit Demétrius Iónathæ: et narravérunt ei prœ́lia, et virtútes, quas ipse fecit, et fratres eius, et labóres, quos laboravérunt:'
  "16": 'et ait: Numquid inveniémus áliquem virum talem? et nunc faciémus eum amícum, et sócium nostrum.'
  "17": 'Et scripsit epístolam, et misit ei secúndum hæc verba, dicens:'
  "18": Rex Alexánder fratri Iónathæ salútem.
  "19": 'Audívimus de te quod vir potens sis víribus, et aptus es ut sis amícus noster:'
  "20": et nunc constitúimus te hódie summum sacerdótem gentis tuæ, et ut amícus vocéris regis (et misit ei púrpuram, et corónam áuream), et quæ nostra sunt séntias nobíscum, et consérves amicítias ad nos.
  "21": 'Et índuit se Iónathas stola sancta séptimo mense, anno centésimo sexagésimo, in die solémni scenopégiæ: et congregávit exércitum, et fecit arma copiósa.'
  "22": 'Et audívit Demétrius verba ista, et contristátus est nimis, et ait:'
  "23": Quid hoc fécimus, quod præoccupávit nos Alexánder apprehéndere amicítiam Iudæórum ad munímen sui?
  "24": Scribam et ego illis verba deprecatória, et dignitátes, et dona, ut sint mecum in adiutórium.
  "25": 'Et scripsit eis in hæc verba: Rex Demétrius genti Iudæórum salútem.'
  "26": Quóniam servástis ad nos pactum, et mansístis in amicítia nostra, et non accessístis ad inimícos nostros, audívimus, et gavísi sumus.
  "27": 'Et nunc perseveráte adhuc conserváre ad nos fidem, et retribuémus vobis bona pro his, quæ fecístis nobíscum:'
  "28": et remittémus vobis præstatiónes multas, et dábimus vobis donatiónes.
  "29": 'Et nunc absólvo vos, et omnes Iudǽos a tribútis, et prétia salis indúlgeo, et corónas remítto, et tértias séminis:'
  "30": 'et dimídiam partem fructus ligni, quod est portiónis meæ, relínquo vobis ex hodiérno die, et deínceps, ne accipiátur a terra Iuda, et a tribus civitátibus, quæ ádditæ sunt illi ex Samaría, et Galilǽa, ex hodiérna die et in totum tempus:'
  "31": 'et Ierúsalem sit sancta, et líbera cum fínibus suis: et décimæ, et tribúta ipsíus sint.'
  "32": 'Remítto étiam potestátem arcis, quæ est in Ierúsalem: et do eam summo sacerdóti, ut constítuat in ea viros quoscúmque ipse elégerit, qui custódiant eam.'
  "33": Et omnem ánimam Iudæórum, quæ captíva est a terra Iuda in omni regno meo, relínquo líberam gratis, ut omnes a tribútis solvántur, étiam pécorum suórum.
  "34": 'Et omnes dies solémnes, et sábbata, et neoméniæ, et dies decréti, et tres dies ante diem solémnem, et tres dies post diem solémnem, sint omnes immunitátis et remissiónis ómnibus Iudǽis, qui sunt in regno meo:'
  "35": et nemo habébit potestátem ágere áliquid, et movére negótia advérsus áliquem illórum in omni causa.
  "36": 'Et ascribántur ex Iudǽis in exércitu regis ad trigínta míllia virórum: et dabúntur illis cópiæ ut opórtet ómnibus exercítibus regis, et ex eis ordinabúntur qui sint in munitiónibus regis magni:'
  "37": et ex his constituéntur super negótia regni, quæ agúntur ex fide, et príncipes sint ex eis, et ámbulent in légibus suis, sicut præcépit rex in terra Iuda.
  "38": 'Et tres civitátes, quæ ádditæ sunt Iudǽæ ex regióne Samaríæ, cum Iudǽa reputéntur: ut sint sub uno, et non obédiant álii potestáti, nisi summi sacerdótis:'
  "39": Ptolemáida, et confínes eius, quas dedi donum sanctis, qui sunt in Ierúsalem, ad necessários sumptus sanctórum.
  "40": 'Et ego do síngulis annis quíndecim míllia siclórum argénti de ratiónibus regis, quæ me contíngunt:'
  "41": et omne quod réliquum fúerit, quod non reddíderant qui super negótia erant annis prióribus, ex hoc dabunt in ópera domus.
  "42": 'Et super hæc quinque míllia siclórum argénti, quæ accipiébant de sanctórum ratióne per síngulos annos: et hæc ad sacerdótes pertíneant, qui ministério fungúntur.'
  "43": Et quicúmque confúgerint in templum, quod est Ierosólymis, et in ómnibus fínibus eius, obnóxii regi in omni negótio dimittántur, et univérsa, quæ sunt eis in regno meo, líbera hábeant.
  "44": 'Et ad ædificánda vel restauránda ópera sanctórum, sumptus dabúntur de ratióne regis:'
  "45": et ad exstruéndos muros Ierúsalem, et communiéndos in circúitu, sumptus dabúntur de ratióne regis, et ad construéndos muros in Iudǽa.
  "46": 'Ut audívit autem Iónathas, et pópulus sermónes istos, non credidérunt eis, nec recepérunt eos: quia recordáti sunt malítiæ magnæ, quam fécerat in Israel, et tribuláverat eos valde.'
  "47": Et complácuit eis in Alexándrum, quia ipse fúerat eis princeps sermónum pacis, et ipsi auxílium ferébant ómnibus diébus.
  "48": Et congregávit rex Alexánder exércitum magnum, et admóvit castra contra Demétrium.
  "49": Et commisérunt prœ́lium duo reges, et fugit exércitus Demétrii, et insecútus est eum Alexánder, et incúbuit super eos.
  "50": 'Et inváluit prœ́lium nimis, donec óccidit sol: et cécidit Demétrius in die illa.'
  "51": 'Et misit Alexánder ad Ptolemǽum regem Ægýpti legátos secúndum hæc verba, dicens:'
  "52": Quóniam regréssus sum in regnum meum, et sedi in sede patrum meórum, et obtínui principátum, et contrívi Demétrium, et possédi regiónem nostram,
  "53": 'et commísi pugnam cum eo, et contrítus est ipse, et castra eius a nobis, et sédimus in sede regni eius:'
  "54": 'et nunc statuámus ad ínvicem amicítiam: et da mihi fíliam tuam uxórem, et ego ero gener tuus, et dabo tibi dona, et ipsi, digna te.'
  "55": 'Et respóndit rex Ptolemǽus, dicens: Felix dies, in qua revérsus es ad terram patrum tuórum, et sedísti in sede regni eórum.'
  "56": 'Et nunc fáciam tibi quod scripsísti: sed occúrre mihi Ptolemáidam, ut videámus ínvicem nos, et spóndeam tibi sicut dixísti.'
  "57": Et exívit Ptolemǽus de Ægýpto, ipse et Cleopátra fília eius, et venit Ptolemáidam anno centésimo sexagésimo secúndo.
  "58": 'Et occúrrit ei Alexánder rex, et dedit ei Cleopátram fíliam suam: et fecit núptias eius Ptolemáidæ, sicut reges in magna glória.'
  "59": Et scripsit rex Alexánder Iónathæ, ut veníret óbviam sibi.
  "60": 'Et ábiit cum glória Ptolemáidam, et occúrrit ibi duóbus régibus, et dedit illis argéntum multum, et aurum, et dona: et invénit grátiam in conspéctu eórum.'
  "61": 'Et convenérunt advérsus eum viri pestiléntes ex Israel, viri iníqui interpellántes advérsus eum: et non inténdit ad eos rex.'
  "62": 'Et iussit spoliári Iónathan véstibus suis, et índui eum púrpura: et ita fecérunt. Et collocávit eum rex sedére secum.'
  "63": 'Dixítque princípibus suis: Exíte cum eo in médium civitátis, et prædicáte, ut nemo advérsus eum interpéllet de ullo negótio, nec quisquam ei moléstus sit de ulla ratióne.'
  "64": 'Et factum est, ut vidérunt qui interpellábant glóriam eius, quæ prædicabátur, et opértum eum púrpura, fugérunt omnes:'
  "65": et magnificávit eum rex, et scripsit eum inter primos amícos, et pósuit eum ducem, et partícipem principátus.
  "66": Et revérsus est Iónathas in Ierúsalem cum pace, et lætítia.
  "67": In anno centésimo sexagésimo quinto, venit Demétrius fílius Demétrii a Creta in terram patrum suórum.
  "68": Et audívit Alexánder rex, et contristátus est valde, et revérsus est Antiochíam.
  "69": 'Et constítuit Demétrius rex Apollónium ducem, qui prǽerat Cœlesýriæ: et congregávit exércitum magnum, et accéssit ad Iámniam: et misit ad Iónathan summum sacerdótem,'
  "70": 'dicens: Tu solus resístis nobis: ego autem factus sum in derísum, et in oppróbrium, proptérea quia tu potestátem advérsum nos exérces in móntibus.'
  "71": 'Nunc ergo si confídis in virtútibus tuis, descénde ad nos in campum, et comparémus illic ínvicem: quia mecum est virtus bellórum.'
  "72": 'Intérroga, et disce quis sum ego, et céteri, qui auxílio sunt mihi, qui et dicunt quia non potest stare pes vester ante fáciem nostram, quia bis in fugam convérsi sunt patres tui in terra sua:'
  "73": et nunc quómodo póteris sustinére equitátum et exércitum tantum in campo, ubi non est lapis, neque saxum, neque locus fugiéndi?
  "74": 'Ut audívit autem Iónathas sermónes Apollónii, motus est ánimo: et elégit decem míllia virórum, et éxiit ab Ierúsalem, et occúrrit ei Simon frater eius in adiutórium:'
  "75": et applicuérunt castra in Ioppen, et exclúsit eum a civitáte, quia custódia Apollónii Ioppe erat, et oppugnávit eam.
  "76": Et extérriti qui erant in civitáte, aperuérunt ei, et obtínuit Iónathas Ioppen.
  "77": Et audívit Apollónius, et admóvit tria míllia équitum, et exércitum multum.
  "78": Et ábiit Azótum tamquam iter fáciens, et statim éxiit in campum, eo quod habéret multitúdinem équitum, et confíderet in eis. Et insecútus est eum Iónathas in Azótum, et commisérunt prœ́lium.
  "79": Et relíquit Apollónius in castris mille équites post eos occúlte.
  "80": Et cognóvit Iónathas quóniam insídiæ sunt post se, et circuiérunt castra eius, et iecérunt iácula in pópulum a mane usque ad vésperam.
  "81": 'Pópulus autem stabat, sicut præcéperat Iónathas: et laboravérunt equi eórum.'
  "82": 'Et eiécit Simon exércitum suum, et commísit contra legiónem: équites enim fatigáti erant: et contríti sunt ab eo, et fugérunt.'
  "83": Et qui dispérsi sunt per campum, fugérunt in Azótum, et intravérunt in Béthdagon idólum suum, ut ibi se liberárent.
  "84": 'Et succéndit Iónathas Azótum, et civitátes, quæ erant in circúitu eius, et accépit spólia eórum, et templum Dagon: et omnes, qui fugérunt in illud, succéndit igni.'
  "85": Et fuérunt qui cecidérunt gládio cum his, qui succénsi sunt, fere octo míllia virórum.
  "86": 'Et movit inde Iónathas castra, et applícuit ea Ascalónem: et exiérunt de civitáte óbviam illi in magna glória.'
  "87": Et revérsus est Iónathas in Ierúsalem cum suis, habéntibus spólia multa.
  "88": Et factum est, ut audívit Alexánder rex sermónes istos, áddidit adhuc glorificáre Iónathan.
  "89": Et misit ei fíbulam áuream, sicut consuetúdo est dari cognátis regum. Et dedit ei Accaron, et omnes fines eius in possessiónem.
