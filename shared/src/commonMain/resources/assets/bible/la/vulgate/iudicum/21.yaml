bible: vulgate
lang: la
language: Latina
book: Iudicum
chapter: "21"
verses:
  "1": 'Iuravérunt quoque fílii Israel in Maspha, et dixérunt: Nullus nostrum dabit fíliis Béniamin de filiábus suis uxórem.'
  "2": 'Venerúntque omnes ad domum Dei in Silo, et in conspéctu eius sedéntes usque ad vésperam, levavérunt vocem, et magno ululátu cœpérunt flere, dicéntes:'
  "3": Quare, Dómine Deus Israel, factum est hoc malum in pópulo tuo, ut hódie una tribus auferrétur ex nobis?
  "4": 'Altera autem die dilúculo consurgéntes, exstruxérunt altáre: obtulerúntque ibi holocáusta, et pacíficas víctimas, et dixérunt:'
  "5": Quis non ascéndit in exércitu Dómini de univérsis tríbubus Israel? Grandi enim iuraménto se constrínxerant, cum essent in Maspha, intérfici eos, qui defuíssent.
  "6": 'Ductíque pœniténtia fílii Israel super fratre suo Béniamin, cœpérunt dícere: Abláta est tribus una de Israel,'
  "7": unde uxóres accípient? omnes enim in commúne iurávimus, non datúros nos his fílias nostras.
  "8": 'Idcírco dixérunt: Quis est de univérsis tríbubus Israel, qui non ascéndit ad Dóminum in Maspha? Et ecce invénti sunt habitatóres Iabes Gálaad in illo exércitu non fuísse.'
  "9": (Eo quoque témpore cum essent in Silo, nullus ex eis ibi repértus est.)
  "10": 'Misérunt ítaque decem míllia viros robustíssimos, et præcepérunt eis: Ite, et percútite habitatóres Iabes Gálaad in ore gládii, tam uxóres quam párvulos eórum.'
  "11": 'Et hoc erit quod observáre debébitis: omne géneris masculíni, et mulíeres, quæ cognovérunt viros, interfícite: vírgines autem reserváte.'
  "12": 'Inventǽque sunt de Iabes Gálaad quadringéntæ vírgines, quæ nesciérunt viri thorum: et adduxérunt eas ad castra in Silo, in terram Chánaan.'
  "13": Miserúntque núntios ad fílios Béniamin, qui erant in petra Remmon, et præcepérunt eis, ut eos suscíperent in pace.
  "14": 'Venerúntque fílii Béniamin in illo témpore, et datæ sunt eis uxóres de filiábus Iabes Gálaad: álias autem non reperérunt, quas símili modo tráderent.'
  "15": Universúsque Israel valde dóluit, et egit pœniténtiam super interfectióne uníus tribus ex Israel.
  "16": 'Dixerúntque maióres natu: Quid faciémus réliquis, qui non accepérunt uxóres? omnes in Béniamin féminæ concidérunt,'
  "17": et magna nobis cura, ingentíque stúdio providéndum est, ne una tribus deleátur ex Israel.
  "18": 'Fílias enim nostras eis dare non póssumus, constrícti iuraménto et maledictióne, qua díximus: Maledíctus qui déderit de filiábus suis uxórem Béniamin.'
  "19": 'Ceperúntque consílium, atque dixérunt: Ecce solémnitas Dómini est in Silo anniversária, quæ sita est ad septentriónem urbis Bethel, et ad orientálem plagam viæ, quæ de Bethel tendit ad Síchimam, et ad merídiem óppidi Lébona.'
  "20": 'Præceperúntque fíliis Béniamin, atque dixérunt: Ite, et latitáte in víneis.'
  "21": Cumque vidéritis fílias Silo ad ducéndos choros ex more procédere, exíte repénte de víneis, et rápite ex eis sínguli uxóres síngulas, et pérgite in terram Béniamin.
  "22": 'Cumque vénerint patres eárum, ac fratres, et advérsum vos queri cœ́perint atque iurgári, dicémus eis: Miserémini eórum: non enim rapuérunt eas iure bellántium atque victórum: sed rogántibus ut accíperent, non dedístis, et a vestra parte peccátum est.'
  "23": 'Fecerúntque fílii Béniamin ut sibi fúerat imperátum: et iuxta númerum suum, rapuérunt sibi de his, quæ ducébant choros, uxóres síngulas: abierúntque in possessiónem suam ædificántes urbes, et habitántes in eis.'
  "24": 'Fílii quoque Israel revérsi sunt per tribus, et famílias in tabernácula sua. In diébus illis non erat rex in Israel: sed unusquísque quod sibi rectum videbátur, hoc faciébat.'
