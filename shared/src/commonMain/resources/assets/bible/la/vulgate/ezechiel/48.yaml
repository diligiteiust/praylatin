bible: vulgate
lang: la
language: Latina
book: Ezechiel
chapter: "48"
verses:
  "1": Et hæc nómina tríbuum a fínibus aquilónis iuxta viam Héthalon pergéntibus Emath, átrium Enan términus Damásci ad aquilónem, iuxta viam Emath. Et erit ei plaga orientális mare, Dan una.
  "2": Et super términum Dan, a plaga orientáli usque ad plagam maris, Aser una.
  "3": Et super términum Aser, a plaga orientáli usque ad plagam maris, Néphthali una.
  "4": Et super términum Néphthali, a plaga orientáli usque ad plagam maris, Manásse una.
  "5": Et super términum Manásse, a plaga orientáli usque ad plagam maris, Ephraim una.
  "6": Et super términum Ephraim, a plaga orientáli usque ad plagam maris, Ruben una.
  "7": Et super términum Ruben, a plaga orientáli usque ad plagam maris, Iuda una.
  "8": 'Et super términum Iuda, a plaga orientáli usque ad plagam maris, erunt primítiæ, quas separábitis, vigínti quinque míllibus latitúdinis et longitúdinis, sícuti síngulæ partes a plaga orientáli usque ad plagam maris: et erit sanctuárium in médio eius.'
  "9": 'Primítiæ, quas separábitis Dómino: longitúdo vigínti quinque míllibus, et latitúdo decem míllibus.'
  "10": 'Hæ autem erunt primítiæ sanctuárii sacerdótum: ad aquilónem longitúdinis vigínti quinque míllia, et ad mare latitúdinis decem míllia, sed et ad oriéntem latitúdinis decem míllia, et ad merídiem longitúdinis vigínti quinque míllia: et erit sanctuárium Dómini in médio eius.'
  "11": Sacerdótibus sanctuárium erit de fíliis Sadoc, qui custodiérunt cæremónias meas, et non erravérunt cum errárent fílii Israel, sicut erravérunt et Levítæ.
  "12": Et erunt eis primítiæ de primítiis terræ sanctum sanctórum, iuxta términum Levitárum.
  "13": Sed et Levítis simíliter, iuxta fines sacerdótum, vigínti quinque míllia longitúdinis, et latitúdinis decem míllia. Omnis longitúdo vigínti et quinque míllium, et latitúdo decem míllium.
  "14": 'Et non venúmdabunt ex eo, neque mutábunt: neque transferéntur primítiæ terræ, quia sanctificátæ sunt Dómino.'
  "15": 'Quinque míllia autem, quæ supérsunt in latitúdine per vigínti quinque míllia, profána erunt urbis in habitáculum, et in suburbána: et erit cívitas in médio eius.'
  "16": 'Et hæ mensúræ eius: ad plagam septentrionálem, quingénta et quátuor míllia: et ad plagam meridiánam, quingénta et quátuor míllia: et ad plagam orientálem, quingénta et quátuor míllia: et ad plagam occidentálem, quingénta et quátuor míllia.'
  "17": 'Erunt autem suburbána civitátis ad aquilónem, ducénta quinquagínta: et ad merídiem, ducénta quinquagínta: et ad oriéntem, ducénta quinquagínta: et ad mare, ducénta quinquagínta.'
  "18": 'Quod autem réliquum fúerit in longitúdine secúndum primítias sanctuárii, decem míllia in oriéntem, et decem míllia in occidéntem, erunt sicut primítiæ sanctuárii: et erunt fruges eius in panes his, qui sérviunt civitáti.'
  "19": Serviéntes autem civitáti, operabúntur ex ómnibus tríbubus Israel.
  "20": Omnes primítiæ vigínti quinque míllium, per vigínti quinque míllia in quadrum, separabúntur in primítias sanctuárii, et in possessiónem civitátis.
  "21": 'Quod autem réliquum fúerit, príncipis erit ex omni parte primitiárum sanctuárii, et possessiónis civitátis e regióne vigínti quinque míllium primitiárum usque ad términum orientálem: sed et ad mare, e regióne vigínti quinque míllium usque ad términum maris, simíliter in pártibus príncipis erit: et erunt primítiæ sanctuárii, et sanctuárium templi in médio eius.'
  "22": 'De possessióne autem Levitárum, et de possessióne civitátis in médio pártium príncipis: erit inter términum Iuda, et inter términum Béniamin, et ad príncipem pertinébit.'
  "23": Et réliquis tríbubus, a plaga orientáli usque ad plagam occidentálem, Béniamin una.
  "24": Et contra términum Béniamin, a plaga orientáli usque ad plagam occidentálem, Símeon una.
  "25": Et super términum Simeónis, a plaga orientáli usque ad plagam occidentálem, Issachar una.
  "26": Et super términum Issachar, a plaga orientáli usque ad plagam occidentálem, Zábulon una.
  "27": Et super términum Zábulon, a plaga orientáli usque ad plagam maris, Gad una.
  "28": 'Et super términum Gad, ad plagam austri in merídie: et erit finis de Thamar usque ad Aquas contradictiónis Cades, heréditas contra mare magnum.'
  "29": 'Hæc est terra, quam mittétis in sortem tríbubus Israel: et hæ partitiónes eárum, ait Dóminus Deus.'
  "30": 'Et hi egréssus civitátis: a plaga septentrionáli, quingéntos et quátuor míllibus mensurábis.'
  "31": Et portæ civitátis ex nomínibus tríbuum Israel, portæ tres a septentrióne, porta Ruben una, porta Iuda una, porta Levi una.
  "32": 'Et ad plagam orientálem, quingéntos et quátuor míllia: et portæ tres, porta Ioseph una, porta Béniamin una, porta Dan una.'
  "33": 'Et ad plagam meridiánam, quingéntos et quátuor míllia metiéris: et portæ tres, porta Simeónis una, porta Issachar una, porta Zábulon una.'
  "34": Et ad plagam occidentálem, quingéntos et quátuor míllia, et portæ eórum tres, porta Gad una, porta Aser una, porta Néphthali una.
  "35": 'Per circúitum, decem et octo míllia: et nomen civitátis ex illa die, Dóminus ibídem.'
