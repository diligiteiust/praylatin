bible: vulgate
lang: la
language: Latina
book: I Regum
chapter: "14"
verses:
  "1": In témpore illo ægrotávit Abía fílius Ieróboam.
  "2": 'Dixítque Ieróboam uxóri suæ: Surge, et commúta hábitum, ne cognoscáris quod sis uxor Ieróboam: et vade in Silo, ubi est Ahías prophéta, qui locútus est mihi quod regnatúrus essem super pópulum hunc.'
  "3": 'Tolle quoque in manu tua decem panes, et crústulam, et vas mellis, et vade ad illum: ipse enim indicábit tibi quid eventúrum sit púero huic.'
  "4": 'Fecit ut díxerat, uxor Ieróboam: et consúrgens ábiit in Silo, et venit in domum Ahíæ: at ille non póterat vidére, quia caligáverant óculi eius præ senectúte.'
  "5": 'Dixit autem Dóminus ad Ahíam: Ecce uxor Ieróboam ingréditur ut cónsulat te super fílio suo qui ægrótat: hæc et hæc loquéris ei. Cum ergo illa intráret, et dissimuláret se esse quæ erat,'
  "6": 'audívit Ahías sónitum pedum eius introeúntis per óstium, et ait: Ingrédere uxor Ieróboam: quare áliam te esse símulas? ego autem missus sum ad te durus núntius.'
  "7": 'Vade, et dic Ieróboam: Hæc dicit Dóminus Deus Israel: Quia exaltávi te de médio pópuli, et dedi te ducem super pópulum meum Israel:'
  "8": 'et scidi regnum domus David, et dedi illud tibi, et non fuísti sicut servus meus David, qui custodívit mandáta mea, et secútus est me in toto corde suo, fáciens quod plácitum esset in conspéctu meo:'
  "9": 'sed operátus es mala super omnes, qui fuérunt ante te, et fecísti tibi deos aliénos et conflátiles, ut me ad iracúndiam provocáres, me autem proiecísti post corpus tuum:'
  "10": 'idcírco ecce ego indúcam mala super domum Ieróboam, et percútiam de Ieróboam mingéntem ad paríetem, et clausum, et novíssimum in Israel: et mundábo relíquias domus Ieróboam, sicut mundári solet fimus usque ad purum.'
  "11": 'Qui mórtui fúerint de Ieróboam in civitáte, cómedent eos canes: qui autem mórtui fúerint in agro, vorábunt eos aves cæli: quia Dóminus locútus est.'
  "12": 'Tu ígitur surge, et vade in domum tuam: et in ipso intróitu pedum tuórum in urbem, moriétur puer,'
  "13": 'et planget eum omnis Israel, et sepéliet: iste enim solus inferétur de Ieróboam in sepúlcrum, quia invéntus est super eo sermo bonus a Dómino Deo Israel in domo Ieróboam.'
  "14": 'Constítuet autem sibi Dóminus regem super Israel, qui percútiet domum Ieróboam in hac die, et in hoc témpore:'
  "15": 'et percútiet Dóminus Deus Israel, sicut movéri solet arúndo in aqua: et evéllet Israel de terra bona hac, quam dedit pátribus eórum, et ventilábit eos trans flumen: quia fecérunt sibi lucos, ut irritárent Dóminum.'
  "16": Et tradet Dóminus Israel propter peccáta Ieróboam, qui peccávit, et peccáre fecit Israel.
  "17": 'Surréxit ítaque uxor Ieróboam, et ábiit, et venit in Thersa: cumque illa ingrederétur limen domus, puer mórtuus est,'
  "18": et sepeliérunt eum. Et planxit eum omnis Israel iuxta sermónem Dómini, quem locútus est in manu servi sui Ahíæ prophétæ.
  "19": Réliqua autem verbórum Ieróboam, quómodo pugnáverit, et quómodo regnáverit, ecce scripta sunt in Libro verbórum diérum regum Israel.
  "20": 'Dies autem, quibus regnávit Ieróboam, vigínti duo anni sunt: et dormívit cum pátribus suis, regnavítque Nadab fílius eius pro eo.'
  "21": 'Porro Róboam fílius Salomónis regnávit in Iuda. Quadragínta et uníus anni erat Róboam cum regnáre cœpísset: decem et septem annos regnávit in Ierúsalem civitáte, quam elégit Dóminus ut póneret nomen suum ibi, ex ómnibus tríbubus Israel. Nomen autem matris eius Náama Ammanítis.'
  "22": Et fecit Iudas malum coram Dómino, et irritavérunt eum super ómnibus, quæ fécerant patres eórum in peccátis suis, quæ peccavérunt.
  "23": 'Ædificavérunt enim et ipsi sibi aras, et státuas, et lucos super omnem collem excélsum, et subter omnem árborem frondósam:'
  "24": sed et effemináti fuérunt in terra, fecerúntque omnes abominatiónes géntium, quas attrívit Dóminus ante fáciem filiórum Israel.
  "25": In quinto autem anno regni Róboam, ascéndit Sesac rex Ægýpti in Ierúsalem,
  "26": 'et tulit thesáuros domus Dómini, et thesáuros régios, et univérsa dirípuit: scuta quoque áurea, quæ fécerat Sálomon:'
  "27": pro quibus fecit rex Róboam scuta ǽrea, et trádidit ea in manum ducum scutariórum, et eórum qui excubábant ante óstium domus regis.
  "28": 'Cumque ingrederétur rex in domum Dómini, portábant ea qui præeúndi habébant offícium: et póstea reportábant ad armamentárium scutariórum.'
  "29": Réliqua autem sermónum Róboam, et ómnia quæ fecit, ecce scripta sunt in Libro sermónum diérum regum Iuda.
  "30": Fuítque bellum inter Róboam et Ieróboam cunctis diébus.
  "31": 'Dormivítque Róboam cum pátribus suis, et sepúltus est cum eis in civitáte David: nomen autem matris eius Náama Ammanítis: et regnávit Abíam fílius eius pro eo.'
