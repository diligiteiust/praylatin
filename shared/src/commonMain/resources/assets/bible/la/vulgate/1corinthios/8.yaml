bible: vulgate
lang: la
language: Latina
book: ad Corinthios I
chapter: "8"
verses:
  "1": De iis autem, quæ idólis sacrificántur, scimus quia omnes sciéntiam habémus. Sciéntia inflat, cáritas vero ædíficat.
  "2": Si quis autem se exístimat scire áliquid, nondum cognóvit quemádmodum opórteat eum scire.
  "3": Si quis autem díligit Deum, hic cógnitus est ab eo.
  "4": De escis autem, quæ idólis immolántur, scimus quia nihil est idólum in mundo, et quod nullus est Deus, nisi unus.
  "5": 'Nam etsi sunt qui dicántur dii sive in cælo, sive in terra (síquidem sunt dii multi, et dómini multi):'
  "6": 'nobis tamen unus est Deus, Pater, ex quo ómnia, et nos in illum: et unus Dóminus Iesus Christus, per quem ómnia, et nos per ipsum.'
  "7": 'Sed non in ómnibus est sciéntia. Quidam autem cum consciéntia usque nunc idóli, quasi idolóthytum mandúcant: et consciéntia ipsórum cum sit infírma, pollúitur.'
  "8": 'Esca autem nos non comméndat Deo. Neque enim si manducavérimus, abundábimus: neque si non manducavérimus, deficiémus.'
  "9": Vidéte autem ne forte hæc licéntia vestra offendículum fiat infírmis.
  "10": 'Si enim quis víderit eum, qui habet sciéntiam, in idolío recumbéntem: nonne consciéntia eius, cum sit infírma, ædificábitur ad manducándum idolóthyta?'
  "11": Et períbit infírmus in tua sciéntia frater, propter quem Christus mórtuus est?
  "12": Sic autem peccántes in fratres, et percutiéntes consciéntiam eórum infírmam, in Christum peccátis.
  "13": Quaprópter si esca scandalízat fratrem meum, non manducábo carnem in ætérnum, ne fratrem meum scandalízem.
