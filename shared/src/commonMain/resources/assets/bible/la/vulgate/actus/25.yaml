bible: vulgate
lang: la
language: Latina
book: Actus Apostolorum
chapter: "25"
verses:
  "1": Festus ergo cum venísset in provínciam, post tríduum ascéndit Ierosólymam a Cæsaréa.
  "2": 'Adierúntque eum príncipes sacerdótum, et primi Iudæórum advérsus Paulum: et rogábant eum,'
  "3": postulántes grátiam advérsus eum, ut iubéret perdúci eum in Ierúsalem, insídias tendéntes ut interfícerent eum in via.
  "4": 'Festus autem respóndit servári Paulum in Cæsaréa: se autem matúrius profectúrum.'
  "5": Qui ergo in vobis, ait, poténtes sunt, descendéntes simul, si quod est in viro crimen, accúsent eum.
  "6": Demorátus autem inter eos dies non ámplius quam octo, aut decem, descéndit Cæsaréam, et áltera die sedit pro tribunáli, et iussit Paulum addúci.
  "7": 'Qui cum perdúctus esset, circumstetérunt eum, qui ab Ierosólyma descénderant Iudǽi, multas, et graves causas obiciéntes, quas non póterant probáre:'
  "8": 'Paulo ratiónem reddénte: Quóniam neque in legem Iudæórum, neque in templum, neque in Cǽsarem quidquam peccávi.'
  "9": 'Festus autem volens grátiam præstáre Iudǽis, respóndens Paulo, dixit: Vis Ierosólymam ascéndere, et ibi de his iudicári apud me?'
  "10": 'Dixit autem Paulus: Ad tribúnal Cǽsaris sto: ibi me opórtet iudicári: Iudǽis non nócui, sicut tu mélius nosti.'
  "11": 'Si enim nócui, aut dignum morte áliquid feci, non recúso mori: si vero nihil est eórum, quæ hi accúsant me, nemo potest me illis donáre. Cǽsarem appéllo.'
  "12": 'Tunc Festus cum concílio locútus, respóndit: Cǽsarem appellásti? ad Cǽsarem ibis.'
  "13": Et cum dies áliquot transácti essent, Agríppa rex, et Berníce descendérunt Cæsaréam ad salutándum Festum.
  "14": 'Et cum dies plures ibi demoraréntur, Festus regi indicávit de Paulo, dicens: Vir quidam est derelíctus a Felíce vinctus,'
  "15": de quo cum essem Ierosólymis, adiérunt me príncipes sacerdótum, et senióres Iudæórum, postulántes advérsus illum damnatiónem.
  "16": 'Ad quos respóndi: Quia non est Románis consuetúdo damnáre áliquem hóminem priúsquam is, qui accusátur, præséntes hábeat accusatóres, locúmque defendéndi accípiat ad abluénda crímina.'
  "17": Cum ergo huc conveníssent sine ulla dilatióne, sequénti die sedens pro tribunáli, iussi addúci virum.
  "18": De quo, cum stetíssent accusatóres, nullam causam deferébant, de quibus ego suspicábar malum.
  "19": Quæstiónes vero quasdam de sua superstitióne habébant advérsus eum, et de quodam Iesu defúncto, quem affirmábat Paulus vívere.
  "20": Hǽsitans autem ego de huiúsmodi quæstióne, dicébam si vellet ire Ierosólymam, et ibi iudicári de istis.
  "21": Paulo autem appellánte ut servarétur ad Augústi cognitiónem, iussi servári eum, donec mittam eum ad Cǽsarem.
  "22": 'Agríppa autem dixit ad Festum: Volébam et ipse hóminem audíre. Cras, inquit, áudies eum.'
  "23": Altera autem die cum venísset Agríppa, et Berníce cum multa ambitióne, et introíssent in auditórium cum tribúnis, et viris principálibus civitátis, iubénte Festo, addúctus est Paulus.
  "24": 'Et dicit Festus: Agríppa rex, et omnes, qui simul adéstis nobíscum viri, vidétis hunc, de quo omnis multitúdo Iudæórum interpellávit me Ierosólymis, peténtes et acclamántes non oportére eum vívere ámplius.'
  "25": Ego vero cómperi nihil dignum morte eum admisísse. Ipso autem hoc appellánte ad Augústum, iudicávi míttere.
  "26": De quo quid certum scribam dómino, non hábeo. Propter quod prodúxi eum ad vos, et máxime ad te rex Agríppa, ut interrogatióne facta hábeam quid scribam.
  "27": Sine ratióne enim mihi vidétur míttere vinctum, et causas eius non significáre.
