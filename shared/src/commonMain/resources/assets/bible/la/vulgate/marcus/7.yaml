bible: vulgate
lang: la
language: Latina
book: Marcus
chapter: "7"
verses:
  "1": Et convéniunt ad eum Pharisǽi, et quidam de scribis, veniéntes ab Ierosólymis.
  "2": Et cum vidíssent quosdam ex discípulis eius commúnibus mánibus, id est non lotis, manducáre panes, vituperavérunt.
  "3": 'Pharisǽi enim, et omnes Iudǽi, nisi crebro láverint manus, non mandúcant, tenéntes traditiónem seniórum:'
  "4": 'et a foro nisi baptizéntur, non cómedunt: et ália multa sunt, quæ trádita sunt illis serváre, baptísmata cálicum, et urceórum, et æramentórum, et lectórum:'
  "5": 'et interrogábant eum Pharisǽi et scribæ: Quare discípuli tui non ámbulant iuxta traditiónem seniórum, sed commúnibus mánibus mandúcant panem?'
  "6": 'At ille respóndens, dixit eis: Bene prophetávit Isaías de vobis hypócritis, sicut scriptum est: Pópulus hic lábiis me honórat, cor autem eórum longe est a me:'
  "7": in vanum autem me colunt, docéntes doctrínas, et præcépta hóminum.
  "8": 'Relinquéntes enim mandátum Dei, tenétis traditiónem hóminum, baptísmata urceórum, et cálicum: et ália simília his fácitis multa.'
  "9": 'Et dicébat illis: Bene írritum fácitis præcéptum Dei, ut traditiónem vestram servétis.'
  "10": 'Móyses enim dixit: Honóra patrem tuum, et matrem tuam. Et: Qui maledíxerit patri, vel matri, morte moriátur.'
  "11": 'Vos autem dícitis: Si díxerit homo patri, aut matri, Corban (quod est donum) quodcúmque ex me, tibi profúerit:'
  "12": et ultra non dimíttitis eum quidquam fácere patri suo, aut matri,
  "13": 'rescindéntes verbum Dei per traditiónem vestram, quam tradidístis: et simília huiúsmodi multa fácitis.'
  "14": 'Et ádvocans íterum turbam, dicébat illis: Audíte me omnes, et intellígite.'
  "15": Nihil est extra hóminem intróiens in eum, quod possit eum coinquináre, sed quæ de hómine procédunt, illa sunt, quæ commúnicant hóminem.
  "16": Si quis habet aures audiéndi, áudiat.
  "17": Et cum introísset in domum a turba, interrogábant eum discípuli eius parábolam.
  "18": 'Et ait illis: Sic et vos imprudéntes estis? Non intellígitis quia omne extrínsecus intróiens in hóminem, non potest eum communicáre:'
  "19": quia non intrat in cor eius, sed in ventrem vadit, et in secéssum exit, purgans omnes escas?
  "20": Dicébat autem, quóniam quæ de hómine éxeunt, illa commúnicant hóminem.
  "21": Ab intus enim de corde hóminum malæ cogitatiónes procédunt, adultéria, fornicatiónes, homicídia,
  "22": furta, avarítiæ, nequítiæ, dolus, impudicítiæ, óculus malus, blasphémia, supérbia, stultítia.
  "23": Omnia hæc mala ab intus procédunt, et commúnicant hóminem.
  "24": 'Et inde surgens ábiit in fines Tyri, et Sidónis: et ingréssus domum, néminem vóluit scire, et non pótuit latére.'
  "25": Múlier enim statim ut audívit de eo, cuius fília habébat spíritum immúndum, intrávit, et prócidit ad pedes eius.
  "26": Erat enim múlier gentílis, Syrophœníssa génere. Et rogábat eum ut dæmónium eíceret de fília eius.
  "27": 'Qui dixit illi: Sine prius saturári fílios: non est enim bonum súmere panem filiórum, et míttere cánibus.'
  "28": 'At illa respóndit, et dixit illi: Utique Dómine, nam et catélli cómedunt sub mensa de micis puerórum.'
  "29": 'Et ait illi: Propter hunc sermónem vade, éxiit dæmónium a fília tua.'
  "30": Et cum abiísset domum suam, invénit puéllam iacéntem supra lectum, et dæmónium exiísse.
  "31": Et íterum éxiens de fínibus Tyri, venit per Sidónem ad mare Galilǽæ inter médios fines Decapóleos.
  "32": Et addúcunt ei surdum, et mutum, et deprecabántur eum, ut impónat illi manum.
  "33": 'Et apprehéndens eum de turba seórsum, misit dígitos suos in aurículas eius: et éxspuens, tétigit linguam eius:'
  "34": 'et suspíciens in cælum, ingémuit, et ait illi: Ephphétha, quod est, Adaperíre.'
  "35": Et statim apértæ sunt aures eius, et solútum est vínculum linguæ eius, et loquebátur recte.
  "36": 'Et præcépit illis ne cui dícerent. Quanto autem eis præcipiébat, tanto magis plus prædicábant:'
  "37": 'et eo ámplius admirabántur, dicéntes: Bene ómnia fecit: et surdos fecit audíre, et mutos loqui.'
