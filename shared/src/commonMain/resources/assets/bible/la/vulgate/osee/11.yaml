bible: vulgate
lang: la
language: Latina
book: Osee
chapter: "11"
verses:
  "1": 'Sicut mane tránsiit, pertránsiit rex Israel. Quia puer Israel, et diléxi eum: et ex Ægýpto vocávi fílium meum.'
  "2": 'Vocavérunt eos, sic abiérunt a fácie eórum: Báalim immolábant, et simulácris sacrificábant.'
  "3": 'Et ego quasi nutrícius Ephraim, portábam eos in bráchiis meis: et nesciérunt quod curárem eos.'
  "4": 'In funículis Adam traham eos, in vínculis caritátis: et ero eis quasi exáltans iugum super maxíllas eórum: et declinávi ad eum ut vescerétur.'
  "5": 'Non revertétur in terram Ægýpti, et Assur ipse rex eius: quóniam noluérunt convérti.'
  "6": Cœpit gládius in civitátibus eius, et consúmet eléctos eius, et cómedet cápita eórum.
  "7": 'Et pópulus meus pendébit ad réditum meum: iugum autem imponétur eis simul, quod non auferétur.'
  "8": Quómodo dabo te Ephraim, prótegam te Israel? quómodo dabo te sicut Adama, ponam te ut Séboim? Convérsum est in me cor meum, páriter conturbáta est pœnitúdo mea.
  "9": 'Non fáciam furórem iræ meæ: non convértar ut dispérdam Ephraim: quóniam Deus ego, et non homo: in médio tui sanctus, et non ingrédiar civitátem.'
  "10": 'Post Dóminum ambulábunt, quasi leo rúgiet: quia ipse rúgiet, et formidábunt fílii maris.'
  "11": 'Et avolábunt quasi avis ex Ægýpto, et quasi colúmba de terra Assyriórum: et collocábo eos in dómibus suis, dicit Dóminus.'
  "12": 'Circúmdedit me in negatióne Ephraim, et in dolo domus Israel: Iudas autem testis descéndit cum Deo, et cum sanctis fidélis.'
