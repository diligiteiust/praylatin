bible: vulgate
lang: la
language: Latina
book: II Samuelis
chapter: "19"
verses:
  "1": 'Nuntiátum est autem Ioab quod rex fleret et lugéret fílium suum:'
  "2": 'et versa est victória in luctum in die illa omni pópulo: audívit enim pópulus in die illa dici: Dolet rex super fílio suo.'
  "3": Et declinávit pópulus in die illa íngredi civitátem, quómodo declináre solet pópulus versus et fúgiens de prœ́lio.
  "4": 'Porro rex opéruit caput suum, et clamábat voce magna: Fili mi Absalom, Absalom fili mi, fili mi.'
  "5": 'Ingréssus ergo Ioab ad regem in domum, dixit: Confudísti hódie vultus ómnium servórum tuórum, qui salvam fecérunt ánimam tuam, et ánimam filiórum tuórum, et filiárum tuárum, et ánimam uxórum tuárum, et ánimam concubinárum tuárum.'
  "6": 'Díligis odiéntes te, et ódio habes diligéntes te: et ostendísti hódie quia non curas de dúcibus tuis, et de servis tuis: et vere cognóvi modo, quia si Absalom víveret, et omnes nos occubuissémus, tunc placéret tibi.'
  "7": 'Nunc ígitur surge, et procéde, et álloquens satísfac servis tuis: iuro enim tibi per Dóminum quod si non exíeris, ne unus quidem remansúrus sit tecum nocte hac: et peius erit hoc tibi, quam ómnia mala, quæ venérunt super te ab adolescéntia tua usque in præsens.'
  "8": 'Surréxit ergo rex et sedit in porta: et omni pópulo nuntiátum est quod rex sedéret in porta. Venítque univérsa multitúdo coram rege: Israel autem fugit in tabernácula sua.'
  "9": 'Omnis quoque pópulus certábat in cunctis tríbubus Israel, dicens: Rex liberávit nos de manu inimicórum nostrórum: ipse salvávit nos de manu Philisthinórum: et nunc fugit de terra propter Absalom.'
  "10": 'Absalom autem, quem únximus super nos, mórtuus est in bello: úsquequo silétis, et non redúcitis regem?'
  "11": 'Rex vero David misit ad Sadoc, et Abíathar sacerdótes, dicens: Loquímini ad maióres natu Iuda, dicéntes: Cur venítis novíssimi ad reducéndum regem in domum suam? (Sermo autem omnis Israel pervénerat ad regem in domo eius.)'
  "12": Fratres mei vos, os meum, et caro mea vos, quare novíssimi redúcitis regem?
  "13": 'Et Amasæ dícite: Nonne os meum, et caro mea es? hæc fáciat mihi Deus, et hæc addat, si non magíster milítiæ fúeris coram me omni témpore pro Ioab.'
  "14": 'Et inclinávit cor ómnium virórum Iuda quasi viri uníus: miserúntque ad regem, dicéntes: Revértere tu, et omnes servi tui.'
  "15": 'Et revérsus est rex, et venit usque ad Iordánem: et omnis Iuda venit usque in Gálgalam ut occúrreret regi, et tradúceret eum Iordánem.'
  "16": Festinávit autem Sémei fílius Gera fílii Iémini de Bahúrim, et descéndit cum viris Iuda in occúrsum regis David
  "17": 'cum mille viris de Béniamin, et Siba puer de domo Saul: et quíndecim fílii eius, ac vigínti servi erant cum eo: et irrumpéntes Iordánem, ante regem'
  "18": 'transiérunt vada, ut tradúcerent domum regis, et fácerent iuxta iussiónem eius: Sémei autem fílius Gera prostrátus coram rege, cum iam transísset Iordánem,'
  "19": 'dixit ad eum: Ne réputes mihi dómine mi iniquitátem, neque memíneris iniuriárum servi tui in die qua egréssus es dómine mi rex de Ierúsalem, neque ponas rex in corde tuo.'
  "20": 'Agnósco enim servus tuus peccátum meum: et idcírco hódie primus veni de omni domo Ioseph, descendíque in occúrsum dómini mei regis.'
  "21": 'Respóndens vero Abísai fílius Sárviæ, dixit: Numquid pro his verbis non occidétur Sémei, quia maledíxit christo Dómini?'
  "22": 'Et ait David: Quid mihi et vobis, fílii Sárviæ? cur efficímini mihi hódie in satan? ergóne hódie interficiétur vir in Israel? an ignóro hódie me factum regem super Israel?'
  "23": 'Et ait rex Sémei: Non moriéris. Iuravítque ei.'
  "24": 'Miphíboseth quoque fílius Saul descéndit in occúrsum regis, illótis pédibus, et intónsa barba: vestésque suas non láverat a die qua egréssus fúerat rex, usque ad diem reversiónis eius in pace.'
  "25": 'Cumque Ierúsalem occurrísset regi, dixit ei rex: Quare non venísti mecum Miphíboseth?'
  "26": 'Et respóndens ait: Dómine mi rex, servus meus contémpsit me: dixíque ei ego fámulus tuus ut stérneret mihi ásinum, et ascéndens abírem cum rege: claudus enim sum servus tuus.'
  "27": 'Insuper et accusávit me servum tuum ad te dóminum meum regem: tu autem dómine mi rex, sicut ángelus Dei es: fac quod plácitum est tibi.'
  "28": 'Neque enim fuit domus patris mei, nisi morti obnóxia dómino meo regi: tu autem posuísti me servum tuum inter convívas mensæ tuæ: quid ergo hábeo iustæ querélæ? aut quid possum ultra vociferári ad regem?'
  "29": 'Ait ergo ei rex: Quid ultra lóqueris? fixum est quod locútus sum: tu, et Siba divídite possessiónes.'
  "30": 'Respondítque Miphíboseth regi: Etiam cuncta accípiat, postquam revérsus est dóminus meus rex pacífice in domum suam.'
  "31": Berzellái quoque Galaadítes, descéndens de Rógelim, tradúxit regem Iordánem, parátus étiam ultra flúvium prósequi eum.
  "32": 'Erat autem Berzellái Galaadítes senex valde, id est, octogenárius, et ipse prǽbuit aliménta regi cum morarétur in Castris: fuit quippe vir dives nimis.'
  "33": 'Dixit ítaque rex ad Berzellái: Veni mecum, ut requiéscas secúrus mecum in Ierúsalem.'
  "34": 'Et ait Berzellái ad regem: Quot sunt dies annórum vitæ meæ, ut ascéndam cum rege in Ierúsalem?'
  "35": 'Octogenárius sum hódie: numquid vigent sensus mei ad discernéndum suáve aut amárum? aut delectáre potest servum tuum cibus et potus? vel audíre possum ultra vocem cantórum, atque cantatrícum? quare servus tuus sit óneri dómino meo regi?'
  "36": 'Páululum procédam fámulus tuus ab Iordáne tecum: non indígeo hac vicissitúdine,'
  "37": 'sed óbsecro ut revértar servus tuus, et móriar in civitáte mea, et sepéliar iuxta sepúlcrum patris mei, et matris meæ. Est autem servus tuus Chámaam: ipse vadat tecum, dómine mi rex, et fac ei quidquid tibi bonum vidétur.'
  "38": 'Dixit ítaque ei rex: Mecum tránseat Chámaam, et ego fáciam ei quidquid tibi placúerit: et omne, quod petíeris a me, impetrábis.'
  "39": 'Cumque transísset univérsus pópulus et rex Iordánem, osculátus est rex Berzellái, et benedíxit ei: et ille revérsus est in locum suum.'
  "40": 'Transívit ergo rex in Gálgalam, et Chámaam cum eo: omnis autem pópulus Iuda tradúxerat regem, et média tantum pars adfúerat de pópulo Israel.'
  "41": 'Itaque omnes viri Israel concurréntes ad regem dixérunt ei: Quare te furáti sunt fratres nostri viri Iuda, et traduxérunt regem et domum eius Iordánem, omnésque viros David cum eo?'
  "42": 'Et respóndit omnis vir Iuda ad viros Israel: Quia mihi própior est rex: cur irásceris super hac re? numquid comédimus áliquid ex rege, aut múnera nobis data sunt?'
  "43": 'Et respóndit vir Israel ad viros Iuda, et ait: Decem pártibus maior ego sum apud regem, magísque ad me pértinet David quam ad te: cur fecísti mihi iniúriam, et non mihi nuntiátum est prióri, ut redúcerem regem meum? Dúrius autem respondérunt viri Iuda viris Israel.'
