bible: vulgate
lang: la
language: Latina
book: II Regum
chapter: "9"
verses:
  "1": 'Eliséus autem prophétes vocávit unum de fíliis prophetárum, et ait illi: Accínge lumbos tuos, et tolle lentículam ólei hanc in manu tua, et vade in Ramoth Gálaad.'
  "2": 'Cumque véneris illuc, vidébis Iehu fílium Iósaphat fílii Namsi: et ingréssus suscitábis eum de médio fratrum suórum, et introdúces in intérius cubículum.'
  "3": 'Tenénsque lentículam ólei, fundes super caput eius, et dices: Hæc dicit Dóminus: Unxi te regem super Israel. Aperiésque óstium, et fúgies, et non ibi subsístes.'
  "4": Abiit ergo adoléscens puer prophétæ in Ramoth Gálaad,
  "5": 'et ingréssus est illuc: ecce autem príncipes exércitus sedébant: et ait: Verbum mihi ad te o princeps. Dixítque Iehu: Ad quem ex ómnibus nobis? At ille dixit: Ad te o princeps.'
  "6": 'Et surréxit, et ingréssus est cubículum: at ille fudit óleum super caput eius, et ait: Hæc dicit Dóminus Deus Israel: Unxi te regem super pópulum Dómini Israel,'
  "7": et percúties domum Achab dómini tui, et ulcíscar sánguinem servórum meórum prophetárum, et sánguinem ómnium servórum Dómini de manu Iézabel.
  "8": 'Perdámque omnem domum Achab: et interfíciam de Achab mingéntem ad paríetem, et clausum, et novíssimum in Israel.'
  "9": Et dabo domum Achab sicut domum Ieróboam fílii Nabat, et sicut domum Báasa fílii Ahía.
  "10": Iézabel quoque cómedent canes in agro Iézrahel, nec erit qui sepéliat eam. Aperuítque óstium, et fugit.
  "11": 'Iehu autem egréssus est ad servos dómini sui: qui dixérunt ei: Recténe sunt ómnia? quid venit insánus iste ad te? Qui ait eis: Nostis hóminem, et quid locútus sit.'
  "12": 'At illi respondérunt: Falsum est, sed magis narra nobis. Qui ait eis: Hæc et hæc locútus est mihi, et ait: Hæc dicit Dóminus: Unxi te regem super Israel.'
  "13": 'Festinavérunt ítaque, et unusquísque tollens pállium suum posuérunt sub pédibus eius in similitúdinem tribunális, et cecinérunt tuba, atque dixérunt: Regnávit Iehu.'
  "14": 'Coniurávit ergo Iehu fílius Iósaphat fílii Namsi contra Ioram: porro Ioram obséderat Ramoth Gálaad, ipse et omnis Israel contra Házael regem Sýriæ:'
  "15": 'et revérsus fúerat ut curarétur in Iézrahel propter vúlnera, quia percússerant eum Syri prœliántem contra Házael regem Sýriæ. Dixítque Iehu: Si placet vobis, nemo egrediátur prófugus de civitáte, ne vadat, et núntiet in Iézrahel.'
  "16": 'Et ascéndit, et proféctus est in Iézrahel: Ioram enim ægrotábat ibi, et Ochozías rex Iuda descénderat ad visitándum Ioram.'
  "17": 'Igitur speculátor, qui stabat super turrim Iézrahel, vidit globum Iehu veniéntis, et ait: Vídeo ego globum. Dixítque Ioram: Tolle currum, et mitte in occúrsum eórum, et dicat vadens: Recténe sunt ómnia?'
  "18": 'Abiit ergo, qui ascénderat currum, in occúrsum eius, et ait: Hæc dicit rex: Pacatáne sunt ómnia? Dixítque Iehu: Quid tibi et paci? transi, et séquere me. Nuntiávit quoque speculátor, dicens: Venit núntius ad eos, et non revértitur.'
  "19": 'Misit étiam currum equórum secúndum: venítque ad eos, et ait: Hæc dicit rex: Numquid pax est? Et ait Iehu: Quid tibi et paci? transi, et séquere me.'
  "20": 'Nuntiávit autem speculátor, dicens: Venit usque ad eos, et non revértitur: est autem incéssus quasi incéssus Iehu fílii Namsi, præceps enim gráditur.'
  "21": 'Et ait Ioram: Iunge currum. Iunxerúntque currum eius, et egréssus est Ioram rex Israel, et Ochozías rex Iuda, sínguli in cúrribus suis, egressíque sunt in occúrsum Iehu, et invenérunt eum in agro Naboth Iezrahelítæ.'
  "22": 'Cumque vidísset Ioram Iehu, dixit: Pax est Iehu? At ille respóndit: Quæ pax? adhuc fornicatiónes Iézabel matris tuæ, et venefícia eius multa vigent.'
  "23": 'Convértit autem Ioram manum suam, et fúgiens ait ad Ochozíam: Insídiæ Ochozía.'
  "24": 'Porro Iehu teténdit arcum manu, et percússit Ioram inter scápulas: et egréssa est sagítta per cor eius, statímque córruit in curru suo.'
  "25": 'Dixítque Iehu ad Bádacer ducem: Tolle, próice eum in agro Naboth Iezrahelítæ: mémini enim quando ego et tu sedéntes in curru sequebámur Achab patrem huius, quod Dóminus onus hoc leváverit super eum, dicens:'
  "26": Si non pro sánguine Naboth, et pro sánguine filiórum eius, quem vidi heri, ait Dóminus, reddam tibi in agro isto, dicit Dóminus. Nunc ergo tolle, et próice eum in agrum iuxta verbum Dómini.
  "27": 'Ochozías autem rex Iuda videns hoc, fugit per viam domus horti: persecutúsque est eum Iehu, et ait: Etiam hunc percútite in curru suo. Et percussérunt eum in ascénsu Gaver, qui est iuxta Iéblaam: qui fugit in Magéddo, et mórtuus est ibi.'
  "28": 'Et imposuérunt eum servi eius super currum suum, et tulérunt in Ierúsalem: sepelierúntque eum in sepúlcro cum pátribus suis in civitáte David.'
  "29": Anno undécimo Ioram fílii Achab, regnávit Ochozías super Iudam,
  "30": venítque Iehu in Iézrahel. Porro Iézabel intróitu eius audíto, depínxit óculos suos stíbio, et ornávit caput suum, et respéxit per fenéstram
  "31": 'ingrediéntem Iehu per portam, et ait: Numquid pax potest esse Zambri, qui interfécit dóminum suum?'
  "32": 'Levavítque Iehu fáciem suam ad fenéstram, et ait: Quæ est ista? et inclinavérunt se ad eum duo, vel tres eunúchi.'
  "33": 'At ille dixit eis: Præcipitáte eam deórsum: et præcipitavérunt eam, aspersúsque est sánguine páries, et equórum úngulæ conculcavérunt eam.'
  "34": 'Cumque introgréssus esset ut coméderet biberétque, ait: Ite, et vidéte maledíctam illam, et sepelíte eam: quia fília regis est.'
  "35": Cumque issent ut sepelírent eam, non invenérunt nisi calváriam, et pedes, et summas manus.
  "36": 'Reversíque nuntiavérunt ei. Et ait Iehu: Sermo Dómini est, quem locútus est per servum suum Elíam Thesbíten, dicens: In agro Iézrahel cómedent canes carnes Iézabel,'
  "37": 'et erunt carnes Iézabel sicut stercus super fáciem terræ in agro Iézrahel, ita ut prætereúntes dicant: Hǽccine est illa Iézabel?'
