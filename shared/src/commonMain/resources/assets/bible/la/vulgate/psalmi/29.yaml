bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "29"
verses:
  "1": Psalmus cántici. In dedicatióne domus David.
  "2": 'Exaltábo te Dómine quóniam suscepísti me: nec delectásti inimícos meos super me.'
  "3": Dómine Deus meus clamávi ad te, et sanásti me.
  "4": 'Dómine eduxísti ab inférno ánimam meam: salvásti me a descendéntibus in lacum.'
  "5": 'Psállite Dómino sancti eius: et confitémini memóriæ sanctitátis eius.'
  "6": 'Quóniam ira in indignatióne eius, et vita in voluntáte eius: ad vésperum demorábitur fletus, et ad matutínum lætítia.'
  "7": 'Ego autem dixi in abundántia mea: Non movébor in ætérnum.'
  "8": 'Dómine in voluntáte tua præstitísti decóri meo virtútem: avertísti fáciem tuam a me, et factus sum conturbátus.'
  "9": Ad te Dómine clamábo, et ad Deum meum deprecábor.
  "10": Quæ utílitas in sánguine meo, dum descéndo in corruptiónem? Numquid confitébitur tibi pulvis, aut annuntiábit veritátem tuam?
  "11": 'Audívit Dóminus, et misértus est mei: Dóminus factus est adiútor meus.'
  "12": 'Convertísti planctum meum in gáudium mihi: conscidísti saccum meum, et circumdedísti me lætítia:'
  "13": 'ut cantet tibi glória mea, et non compúngar: Dómine Deus meus in ætérnum confitébor tibi.'
