bible: vulgate
lang: la
language: Latina
book: Sapientia
chapter: "2"
verses:
  "1": 'Dixérunt enim cogitántes apud se non recte: Exíguum et cum tǽdio est tempus vitæ nostræ, et non est refrigérium in fine hóminis, et non est qui ágnitus sit revérsus ab ínferis.'
  "2": 'Quia ex níhilo nati sumus, et post hoc érimus tamquam non fuérimus: quóniam fumus flatus est in náribus nostris: et sermo scintílla ad commovéndum cor nostrum:'
  "3": qua exstíncta, cinis erit corpus nostrum, et spíritus diffundétur tamquam mollis aer, et transíbit vita nostra tamquam vestígium nubis, et sicut nébula dissolvétur, quæ fugáta est a rádiis solis, et a calóre illíus aggraváta.
  "4": Et nomen nostrum obliviónem accípiet per tempus, et nemo memóriam habébit óperum nostrórum.
  "5": 'Umbræ enim tránsitus est tempus nostrum, et non est revérsio finis nostri: quóniam consignáta est, et nemo revértitur.'
  "6": Veníte ergo, et fruámur bonis quæ sunt, et utámur creatúra tamquam in iuventúte celériter.
  "7": Vino pretióso et unguéntis nos impleámus, et non prætéreat nos flos témporis.
  "8": 'Coronémus nos rosis ántequam marcéscant: nullum pratum sit, quod non pertránseat luxúria nostra.'
  "9": 'Nemo nostrum exsors sit luxúriæ nostræ: ubíque relinquámus signa lætítiæ: quóniam hæc est pars nostra, et hæc est sors.'
  "10": Opprimámus páuperem iustum, et non parcámus víduæ, nec veteráni revereámur canos multi témporis.
  "11": 'Sit autem fortitúdo nostra lex iustítiæ: quod enim infírmum est, inútile invenítur.'
  "12": Circumveniámus ergo iustum, quóniam inútilis est nobis, et contrárius est opéribus nostris, et impróperat nobis peccáta legis, et diffámat in nos peccáta disciplínæ nostræ.
  "13": Promíttit se sciéntiam Dei habére, et fílium Dei se nóminat.
  "14": Factus est nobis in traductiónem cogitatiónum nostrárum.
  "15": Gravis est nobis étiam ad vidéndum, quóniam dissímilis est áliis vita illíus, et immutátæ sunt viæ eius.
  "16": Tamquam nugáces æstimáti sumus ab illo, et ábstinet se a viis nostris tamquam ab immundítiis, et præfert novíssima iustórum, et gloriátur patrem se habére Deum.
  "17": Videámus ergo si sermónes illíus veri sint, et tentémus quæ ventúra sunt illi, et sciémus quæ erunt novíssima illíus.
  "18": Si enim est verus fílius Dei, suscípiet illum, et liberábit eum de mánibus contrariórum.
  "19": Contumélia et torménto interrogémus eum, ut sciámus reveréntiam eius, et probémus patiéntiam illíus.
  "20": 'Morte turpíssima condemnémus eum: erit enim ei respéctus ex sermónibus illíus.'
  "21": 'Hæc cogitavérunt, et erravérunt: excæcávit enim illos malítia eórum.'
  "22": 'Et nesciérunt sacraménta Dei: neque mercédem speravérunt iustítiæ, nec iudicavérunt honórem animárum sanctárum.'
  "23": Quóniam Deus creávit hóminem inexterminábilem, et ad imáginem similitúdinis suæ fecit illum.
  "24": 'Invídia autem diáboli mors introívit in orbem terrárum:'
  "25": imitántur autem illum qui sunt ex parte illíus.
