bible: vulgate
lang: la
language: Latina
book: Ecclesiasticus
chapter: "36"
verses:
  "1": 'Miserére nostri Deus ómnium, et réspice nos, et osténde nobis lucem miseratiónum tuárum:'
  "2": et immítte timórem tuum super gentes, quæ non exquisiérunt te, ut cognóscant quia non est Deus nisi tu, et enárrent magnália tua.
  "3": Alleva manum tuam super gentes aliénas, ut vídeant poténtiam tuam.
  "4": Sicut enim in conspéctu eórum sanctificátus es in nobis, sic in conspéctu nostro magnificáberis in eis,
  "5": ut cognóscant te, sicut et nos cognóvimus quóniam non est Deus præter te Dómine.
  "6": Innova signa, et immúta mirabília.
  "7": Glorífica manum, et bráchium dextrum.
  "8": Excita furórem, et effúnde iram.
  "9": Tolle adversárium, et afflíge inimícum.
  "10": Festína tempus, et meménto finis, ut enárrent mirabília tua.
  "11": 'In ira flammæ devorétur qui salvátur: et qui péssimant plebem tuam, invéniant perditiónem.'
  "12": 'Cóntere caput príncipum inimicórum, dicéntium: Non est álius præter nos.'
  "13": 'Cóngrega omnes tribus Iacob: ut cognóscant quia non est Deus nisi tu, et enárrent magnália tua: et hereditábis eos, sicut ab inítio.'
  "14": 'Miserére plebi tuæ, super quam invocátum est nomen tuum: et Israel, quem coæquásti primogénito tuo.'
  "15": Miserére civitáti sanctificatiónis tuæ Ierúsalem, civitáti requiéi tuæ.
  "16": Reple Sion inenarrabílibus verbis tuis, et glória tua pópulum tuum.
  "17": Da testimónium his, qui ab inítio creatúræ tuæ sunt, et súscita prædicatiónes, quas locúti sunt in nómine tuo prophétæ prióres.
  "18": 'Da mercédem sustinéntibus te, ut prophétæ tui fidéles inveniántur: et exáudi oratiónes servórum tuórum,'
  "19": secúndum benedictiónem Aaron de pópulo tuo, et dírige nos in viam iustítiæ, et sciant omnes qui hábitant terram, quia tu es Deus conspéctor sæculórum.
  "20": Omnem escam manducábit venter, et est cibus cibo mélior.
  "21": Fauces contíngunt cibum feræ, et cor sensátum verba mendácia.
  "22": Cor pravum dabit tristítiam, et homo perítus resístet illi.
  "23": 'Omnem másculum excípiet múlier: et est fília mélior fília.'
  "24": Spécies mulíeris exhílarat fáciem viri sui, et super omnem concupiscéntiam hóminis superdúcit desidérium.
  "25": 'Si est lingua curatiónis, est et mitigatiónis et misericórdiæ: non est vir illíus secúndum fílios hóminum.'
  "26": 'Qui póssidet mulíerem bonam ínchoat possessiónem: adiutórium secúndum illum est, et colúmna ut réquies.'
  "27": 'Ubi non est sepes, diripiétur posséssio: et ubi non est múlier, ingemíscit egens.'
  "28": Quis credit ei, qui non habet nidum, et defléctens ubicúmque obscuráverit, quasi succínctus latro exsíliens de civitáte in civitátem?
