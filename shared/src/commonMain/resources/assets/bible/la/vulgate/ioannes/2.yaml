bible: vulgate
lang: la
language: Latina
book: Ioannes
chapter: "2"
verses:
  "1": Et die tértia núptiæ factæ sunt in Cana Galilǽæ, et erat mater Iesu ibi.
  "2": Vocátus est autem et Iesus, et discípuli eius, ad núptias.
  "3": 'Et deficiénte vino, dicit mater Iesu ad eum: Vinum non habent.'
  "4": 'Et dicit ei Iesus: Quid mihi, et tibi est múlier? nondum venit hora mea.'
  "5": 'Dicit mater eius minístris: Quodcúmque díxerit vobis, fácite.'
  "6": Erant autem ibi lapídeæ hýdriæ sex pósitæ secúndum purificatiónem Iudæórum, capiéntes síngulæ metrétas binas vel ternas.
  "7": 'Dicit eis Iesus: Impléte hýdrias aqua. Et implevérunt eas usque ad summum.'
  "8": 'Et dicit eis Iesus: Hauríte nunc, et ferte architriclíno. Et tulérunt.'
  "9": 'Ut autem gustávit architriclínus aquam vinum factam, et non sciébat unde esset, minístri autem sciébant, qui háuserant aquam: vocat sponsum architriclínus,'
  "10": 'et dicit ei: Omnis homo primum bonum vinum ponit: et cum inebriáti fúerint, tunc id, quod detérius est. Tu autem servásti bonum vinum usque adhuc.'
  "11": 'Hoc fecit inítium signórum Iesus in Cana Galilǽæ: et manifestávit glóriam suam, et credidérunt in eum discípuli eius.'
  "12": 'Post hoc descéndit Caphárnaum ipse, et mater eius, et fratres eius, et discípuli eius: et ibi mansérunt non multis diébus.'
  "13": 'Et prope erat Pascha Iudæórum, et ascéndit Iesus Ierosólymam:'
  "14": et invénit in templo vendéntes boves, et oves, et colúmbas, et nummulários sedéntes.
  "15": Et cum fecísset quasi flagéllum de funículis, omnes eiécit de templo, oves quoque, et boves, et nummulariórum effúdit æs, et mensas subvértit.
  "16": 'Et his, qui colúmbas vendébant, dixit: Auférte ista hinc, et nolíte fácere domum patris mei, domum negotiatiónis.'
  "17": 'Recordáti sunt vero discípuli eius quia scriptum est: Zelus domus tuæ comédit me.'
  "18": 'Respondérunt ergo Iudǽi, et dixérunt ei: Quod signum osténdis nobis, quia hæc facis?'
  "19": 'Respóndit Iesus, et dixit eis: Sólvite templum hoc, et in tribus diébus excitábo illud.'
  "20": 'Dixérunt ergo Iudǽi: Quadragínta et sex annis ædificátum est templum hoc, et tu in tribus diébus excitábis illud?'
  "21": Ille autem dicébat de templo córporis sui.
  "22": Cum ergo resurrexísset a mórtuis, recordáti sunt discípuli eius, quia hoc dicébat, et credidérunt Scriptúræ, et sermóni, quem dixit Iesus.
  "23": Cum autem esset Ierosólymis in Pascha in die festo, multi credidérunt in nómine eius, vidéntes signa eius, quæ faciébat.
  "24": Ipse autem Iesus non credébat semetípsum eis, eo quod ipse nosset omnes,
  "25": 'et quia opus ei non erat ut quis testimónium perhibéret de hómine: ipse enim sciébat quid esset in hómine.'
