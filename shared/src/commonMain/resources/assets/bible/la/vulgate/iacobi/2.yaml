bible: vulgate
lang: la
language: Latina
book: Iacobi
chapter: "2"
verses:
  "1": Fratres mei, nolíte in personárum acceptióne habére fidem Dómini nostri Iesu Christi glóriæ.
  "2": Etenim si introíerit in convéntum vestrum vir áureum ánnulum habens in veste cándida, introíerit autem et pauper in sórdido hábitu,
  "3": 'et intendátis in eum, qui indútus est veste præclára, et dixéritis ei: Tu sede hic bene: páuperi autem dicátis: Tu sta illic: aut sede sub scabéllo pedum meórum:'
  "4": nonne iudicátis apud vosmetípsos, et facti estis iúdices cogitatiónum iniquárum?
  "5": 'Audíte fratres mei dilectíssimi: nonne Deus elégit páuperes in hoc mundo, dívites in fide, et herédes regni, quod repromísit Deus diligéntibus se?'
  "6": Vos autem exhonorástis páuperem. Nonne dívites per poténtiam ópprimunt vos, et ipsi trahunt vos ad iudícia?
  "7": Nonne ipsi blasphémant bonum nomen, quod invocátum est super vos?
  "8": 'Si tamen legem perfícitis regálem secúndum Scriptúras: Díliges próximum tuum sicut teípsum: bene fácitis:'
  "9": si autem persónas accípitis, peccátum operámini, redargúti a lege quasi transgressóres.
  "10": Quicúmque autem totam legem serváverit, offéndat autem in uno, factus est ómnium reus.
  "11": 'Qui enim dixit: Non mœcháberis, dixit et: Non occídes. Quod si non mœcháberis, occídes autem, factus es transgréssor legis.'
  "12": Sic loquímini, et sic fácite sicut per legem libertátis incipiéntes iudicári.
  "13": 'Iudícium enim sine misericórdia illi, qui non fecit misericórdiam: superexáltat autem misericórdia iudícium.'
  "14": Quid próderit fratres mei si fidem quis dicat se habére, ópera autem non hábeat? Numquid póterit fides salváre eum?
  "15": Si autem frater, et soror nudi sint, et indígeant victu quotidiáno,
  "16": 'dicat autem áliquis ex vobis illis: Ite in pace, calefacímini et saturámini: non dedéritis autem eis quæ necessária sunt córpori, quid próderit?'
  "17": Sic et fides, si non hábeat ópera, mórtua est in semetípsa.
  "18": 'Sed dicet quis: Tu fidem habes, et ego ópera hábeo: osténde mihi fidem tuam sine opéribus: et ego osténdam tibi ex opéribus fidem meam.'
  "19": 'Tu credis quóniam unus est Deus: bene facis: et dǽmones credunt, et contremíscunt.'
  "20": Vis autem scire o homo inánis, quóniam fides sine opéribus mórtua est?
  "21": Abraham pater noster nonne ex opéribus iustificátus est, ófferens Isaac fílium suum super altáre?
  "22": 'Vides quóniam fides cooperabátur opéribus illíus: et ex opéribus fides consummáta est?'
  "23": 'Et suppléta est Scriptúra, dicens: Crédidit Abraham Deo, et reputátum est illi ad iustítiam, et amícus Dei appellátus est.'
  "24": Vidétis quóniam ex opéribus iustificátur homo, et non ex fide tantum?
  "25": Simíliter et Rahab méretrix, nonne ex opéribus iustificáta est, suscípiens núntios, et ália via eíciens?
  "26": Sicut enim corpus sine spíritu mórtuum est, ita et fides sine opéribus mórtua est.
