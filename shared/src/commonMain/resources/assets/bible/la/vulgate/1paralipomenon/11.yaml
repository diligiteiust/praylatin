bible: vulgate
lang: la
language: Latina
book: I Paralipomenon
chapter: "11"
verses:
  "1": 'Congregátus est ígitur omnis Israel ad David in Hebron, dicens: Os tuum sumus, et caro tua.'
  "2": 'Heri quoque, et nudiustértius cum adhuc regnáret Saul, tu eras qui educébas, et introducébas Israel: tibi enim dixit Dóminus Deus tuus: Tu pasces pópulum meum Israel, et tu eris princeps super eum.'
  "3": 'Venérunt ergo omnes maióres natu Israel ad regem in Hebron, et íniit David cum eis fœdus coram Dómino: unxerúntque eum regem super Israel, iuxta sermónem Dómini, quem locútus est in manu Sámuel.'
  "4": 'Abiit quoque David, et omnis Israel in Ierúsalem: hæc est Iebus, ubi erant Iebusǽi habitatóres terræ.'
  "5": 'Dixerúntque qui habitábant in Iebus ad David: Non ingrediéris huc. Porro David cepit arcem Sion, quæ est cívitas David,'
  "6": 'dixítque: Omnis qui percússerit Iebusǽum in primis, erit princeps et dux. Ascéndit ígitur primus Ioab fílius Sárviæ, et factus est princeps.'
  "7": Habitávit autem David in arce, et idcírco appelláta est cívitas David.
  "8": 'Ædificavítque urbem in circúitu a Mello usque ad gyrum: Ioab autem réliqua urbis exstrúxit.'
  "9": Proficiebátque David vadens et crescens, et Dóminus exercítuum erat cum eo.
  "10": Hi príncipes virórum fórtium David, qui adiuvérunt eum ut rex fíeret super omnem Israel, iuxta verbum Dómini, quod locútus est ad Israel.
  "11": 'Et iste númerus robustórum David: Iésbaam fílius Hachamóni princeps inter trigínta: iste levávit hastam suam super trecéntos vulnerátos una vice.'
  "12": Et post eum Eleázar fílius pátrui eius Ahohítes, qui erat inter tres poténtes.
  "13": 'Iste fuit cum David in Phésdomim, quando Philísthiim congregáti sunt ad locum illum in prœ́lium: et erat ager regiónis illíus plenus hórdeo, fugerátque pópulus a fácie Philisthinórum.'
  "14": 'Hi stetérunt in médio agri, et defendérunt eum: cumque percussíssent Philisthǽos, dedit Dóminus salútem magnam pópulo suo.'
  "15": Descendérunt autem tres de trigínta princípibus ad petram, in qua erat David, ad spelúncam Odóllam, quando Philísthiim fúerant castrametáti in valle Ráphaim.
  "16": Porro David erat in præsídio, et státio Philisthinórum in Béthlehem.
  "17": 'Desiderávit ígitur David, et dixit: O si quis daret mihi aquam de cistérna Béthlehem, quæ est in porta!'
  "18": 'Tres ergo isti per média castra Philisthinórum perrexérunt, et hausérunt aquam de cistérna Béthlehem, quæ erat in porta, et attulérunt ad David ut bíberet: qui nóluit, sed magis libávit illam Dómino,'
  "19": 'dicens: Absit ut in conspéctu Dei mei hoc fáciam, et sánguinem istórum virórum bibam: quia in perículo animárum suárum attulérunt mihi aquam. Et ob hanc causam nóluit bíbere: hæc fecérunt tres robustíssimi.'
  "20": Abísai quoque frater Ioab ipse erat princeps trium, et ipse levávit hastam suam contra trecéntos vulnerátos, et ipse erat inter tres nominatíssimus,
  "21": 'et inter tres secúndos ínclytus, et princeps eórum: verúmtamen usque ad tres primos non pervénerat.'
  "22": 'Banaías fílius Ióiadæ viri robustíssimi, qui multa ópera perpetrárat, de Cábseel: ipse percússit duos Ariel Moab, et ipse descéndit, et interfécit leónem in média cistérna témpore nivis.'
  "23": 'Et ipse percússit virum Ægýptium, cuius statúra erat quinque cubitórum, et habébat lánceam ut liciatórium texéntium: descéndit ígitur ad eum cum virga, et rápuit hastam, quam tenébat manu: et interfécit eum hasta sua.'
  "24": Hæc fecit Banaías fílius Ióiadæ, qui erat inter tres robústos nominatíssimus,
  "25": 'inter trigínta primus, verúmtamen ad tres usque non pervénerat: pósuit autem eum David ad aurículam suam.'
  "26": Porro fortíssimi viri in exércitu, Asahel frater Ioab, et Elchanan fílius pátrui eius de Béthlehem,
  "27": Sammoth Arorítes, Helles Pharonítes,
  "28": Ira fílius Acces Thecuítes, Abiézer Anathothítes,
  "29": Sobbóchai Husathítes, Ilai Ahohítes,
  "30": Mahárai Netophathítes, Heled fílius Báana Netophathítes,
  "31": Ethai fílius Ríbai de Gábaath filiórum Béniamin, Banaía Pharatonítes,
  "32": Húrai de torrénte Gaas, Abiel Arbathítes, Azmoth Bauramítes, Elíaba Salabonítes.
  "33": Fílii Assem Gezonítes, Iónathan fílius Sage Ararítes,
  "34": Ahíam fílius Sachar Ararítes,
  "35": Eliphal fílius Ur,
  "36": Hepher Mecherathítes, Ahía Phelonítes,
  "37": Hesro Carmelítes, Naárai fílius Asbai,
  "38": Ioel frater Nathan, Míbahar fílius Agárai,
  "39": Selec Ammonítes, Nahárai Berothítes ármiger Ioab fílii Sárviæ,
  "40": Ira Iethrǽus, Gareb Iethrǽus,
  "41": Urías Hethǽus, Zabad fílius Ohóli,
  "42": 'Adina fílius Siza Rubenítes princeps Rubenitárum, et cum eo trigínta:'
  "43": Hanan fílius Máacha, et Iósaphat Mathanítes,
  "44": Ozía Astarothítes, Samma, et Iéhiel fílii Hotham Arorítes,
  "45": Iédihel fílius Samri, et Ioha frater eius Thosaítes,
  "46": Eliel Mahumítes, et Ieríbai, et Iosaía fílii Elnaem, et Iethma Moabítes, Eliel, et Obed, et Iásiel de Masobía.
