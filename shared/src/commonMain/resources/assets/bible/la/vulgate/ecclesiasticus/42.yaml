bible: vulgate
lang: la
language: Latina
book: Ecclesiasticus
chapter: "42"
verses:
  "1": 'Non dúplices sermónem audítus de revelatióne sermónis abscónditi, et eris vere sine confusióne, et invénies grátiam in conspéctu ómnium hóminum: ne pro his ómnibus confundáris, et ne accípias persónam ut delínquas.'
  "2": De lege Altíssimi, et testaménto, et de iudício iustificáre ímpium,
  "3": de verbo sociórum et viatórum, et de datióne hereditátis amicórum,
  "4": de æqualitáte statéræ et pónderum, de acquisitióne multórum et paucórum,
  "5": de corruptióne emptiónis et negotiatórum, et de multa disciplína filiórum, et servo péssimo latus sanguináre.
  "6": Super mulíerem nequam bonum est signum.
  "7": 'Ubi manus multæ sunt, claude: et quodcúmque trades, númera et appénde: datum vero, et accéptum omne descríbe.'
  "8": 'De disciplína insensáti et fátui, et de senióribus qui iudicántur ab adolescéntibus: et eris erudítus in ómnibus, et probábilis in conspéctu ómnium vivórum.'
  "9": 'Fília patris abscóndita est vigília, et sollicitúdo eius aufert somnum: ne forte in adolescéntia sua adúlta efficiátur, et cum viro commoráta odíbilis fiat:'
  "10": 'nequándo polluátur in virginitáte sua, et in patérnis suis grávida inveniátur: ne forte cum viro commoráta transgrediátur, aut certe stérilis efficiátur.'
  "11": 'Super fíliam luxuriósam confírma custódiam: nequándo fáciat te in oppróbrium veníre inimícis, a detractióne in civitáte, et obiectióne plebis, et confúndat te in multitúdine pópuli.'
  "12": 'Omni hómini noli inténdere in spécie: et in médio mulíerum noli commorári:'
  "13": de vestiméntis enim procédit tínea, et a mulíere iníquitas viri.
  "14": Mélior est enim iníquitas viri, quam múlier benefáciens, et múlier confúndens in oppróbrium.
  "15": Memor ero ígitur óperum Dómini, et quæ vidi annuntiábo. In sermónibus Dómini ópera eius.
  "16": Sol illúminans per ómnia respéxit, et glória Dómini plenum est opus eius.
  "17": Nonne Dóminus fecit sanctos enarráre ómnia mirabília sua, quæ confirmávit Dóminus omnípotens stabilíri in glória sua?
  "18": 'Abýssum et cor hóminum investigávit: et in astútia eórum excogitávit.'
  "19": Cognóvit enim Dóminus omnem sciéntiam, et inspéxit in signum ævi, annúntians quæ præteriérunt, et quæ superventúra sunt, revélans vestígia occultórum.
  "20": Non prǽterit illum omnis cogitátus, et non abscóndit se ab eo ullus sermo.
  "21": 'Magnália sapiéntiæ suæ decorávit: qui est ante sǽculum et usque in sǽculum, neque adiéctum est,'
  "22": neque minúitur, et non eget alicúius consílio.
  "23": Quam desiderabília ómnia ópera eius, et tamquam scintílla, quæ est consideráre!
  "24": Omnia hæc vivunt, et manent in sǽculum, et in omni necessitáte ómnia obáudiunt ei.
  "25": Omnia duplícia, unum contra unum, et non fecit quidquam deésse.
  "26": Uniuscuiúsque confirmávit bona. Et quis satiábitur videns glóriam eius?
