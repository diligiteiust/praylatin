bible: vulgate
lang: la
language: Latina
book: Nahum
chapter: "3"
verses:
  "1": 'Væ cívitas sánguinum, univérsa mendácii dilaceratióne plena: non recédet a te rapína.'
  "2": 'Vox flagélli, et vox ímpetus rotæ, et equi freméntis, et quadrígæ fervéntis, et équitis ascendéntis:'
  "3": 'et micántis gládii, et fulgurántis hastæ, et multitúdinis interféctæ, et gravis ruínæ: nec est finis cadáverum, et córruent in corpóribus suis.'
  "4": 'Propter multitúdinem fornicatiónum meretrícis speciósæ, et gratæ, et habéntis malefícia, quæ véndidit gentes in fornicatiónibus suis, et famílias in malefíciis suis:'
  "5": ecce ego ad te, dicit Dóminus exercítuum, et revelábo pudénda tua in fácie tua, et osténdam géntibus nuditátem tuam, et regnis ignomíniam tuam.
  "6": Et proíciam super te abominatiónes, et contuméliis te affíciam, et ponam te in exémplum.
  "7": 'Et erit: omnis, qui víderit te, resíliet a te, et dicet: Vastáta est Nínive: quis commovébit super te caput? unde quæram consolatórem tibi?'
  "8": 'Numquid mélior es Alexandría populórum, quæ hábitat in flumínibus? aquæ in circúitu eius: cuius divítiæ, mare: aquæ, muri eius.'
  "9": 'Æthiópia fortitúdo eius, et Ægýptus, et non est finis: Africa, et Líbyes fuérunt in auxílio tuo.'
  "10": 'Sed et ipsa in transmigratiónem ducta est in captivitátem: párvuli eius elísi sunt in cápite ómnium viárum, et super ínclytos eius misérunt sortem, et omnes optimátes eius confíxi sunt in compédibus.'
  "11": 'Et tu ergo inebriáberis, et eris despécta: et tu quæres auxílium ab inimíco.'
  "12": 'Omnes munitiónes tuæ sicut ficus cum grossis suis: si concússæ fúerint, cadent in os comedéntis.'
  "13": 'Ecce pópulus tuus, mulíeres in médio tui: inimícis tuis adapertióne pandéntur portæ terræ tuæ, devorábit ignis vectes tuos.'
  "14": 'Aquam propter obsidiónem hauri tibi, éxstrue munitiónes tuas: intra in lutum, et calca, súbigens tene láterem.'
  "15": 'Ibi cómedet te ignis: períbis gládio, devorábit te ut bruchus: congregáre ut bruchus: multiplicáre ut locústa.'
  "16": 'Plures fecísti negotiatiónes tuas quam stellæ sint cæli: bruchus expánsus est, et avolávit.'
  "17": 'Custódes tui quasi locústæ: et párvuli tui quasi locústæ locustárum, quæ consídunt in sépibus in die frígoris: sol ortus est, et avolavérunt, et non est cógnitus locus eárum ubi fúerint.'
  "18": 'Dormitavérunt pastóres tui, rex Assur: sepeliéntur príncipes tui: latitávit pópulus tuus in móntibus, et non est qui cóngreget.'
  "19": 'Non est obscúra contrítio tua, péssima est plaga tua: omnes qui audiérunt auditiónem tuam compressérunt manum super te: quia super quem non tránsiit malítia tua semper?'
