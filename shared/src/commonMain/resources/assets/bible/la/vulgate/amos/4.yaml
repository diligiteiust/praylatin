bible: vulgate
lang: la
language: Latina
book: Amos
chapter: "4"
verses:
  "1": 'Audíte verbum hoc vaccæ pingues, quæ estis in monte Samaríæ: quæ calúmniam fácitis egénis, et confríngitis páuperes: quæ dícitis dóminis vestris: Afférte, et bibémus.'
  "2": 'Iurávit Dóminus Deus in sancto suo: quia ecce dies vénient super vos, et levábunt vos in contis, et relíquias vestras in ollis fervéntibus.'
  "3": Et per apertúras exíbitis áltera contra álteram, et proiciémini in Armon, dicit Dóminus.
  "4": 'Veníte ad Bethel, et ímpie ágite: ad Gálgalam, et multiplicáte prævaricatiónem: et afférte mane víctimas vestras, tribus diébus décimas vestras.'
  "5": 'Et sacrificáte de fermentáto laudem: et vocáte voluntárias oblatiónes, et annuntiáte: sic enim voluístis fílii Israel, dicit Dóminus Deus.'
  "6": 'Unde et ego dedi vobis stupórem déntium in cunctis úrbibus vestris, et indigéntiam panum in ómnibus locis vestris: et non estis revérsi ad me, dicit Dóminus.'
  "7": 'Ego quoque prohíbui a vobis imbrem, cum adhuc tres menses superéssent usque ad messem: et plui super unam civitátem, et super álteram civitátem non plui: pars una complúta est: et pars, super quam non plui, áruit.'
  "8": 'Et venérunt duæ et tres civitátes ad unam civitátem ut bíberent aquam, et non sunt satiátæ: et non redístis ad me, dicit Dóminus.'
  "9": 'Percússi vos in vento urénte, et in aurúgine: multitúdinem hortórum vestrórum, et vineárum vestrárum: olivéta vestra, et ficéta vestra comédit erúca: et non redístis ad me, dicit Dóminus.'
  "10": 'Misi in vos mortem in via Ægýpti, percússi in gládio iúvenes vestros, usque ad captivitátem equórum vestrórum: et ascéndere feci putrédinem castrórum vestrórum in nares vestras: et non redístis ad me, dicit Dóminus.'
  "11": 'Subvérti vos, sicut subvértit Deus Sódomam, et Gomórrham, et facti estis quasi torris raptus ab incéndio: et non redístis ad me, dicit Dóminus.'
  "12": 'Quaprópter hæc fáciam tibi Israel: postquam autem hæc fécero tibi, præparáre in occúrsum Dei tui Israel.'
  "13": 'Quia ecce formans montes, et creans ventum, et annúntians hómini elóquium suum, fáciens matutínam nébulam, et grádiens super excélsa terræ: Dóminus Deus exercítuum nomen eius.'
