bible: vulgate
lang: la
language: Latina
book: Deuteronomium
chapter: "19"
verses:
  "1": 'Cum disperdíderit Dóminus Deus tuus gentes, quarum tibi traditúrus est terram, et posséderis eam, habitaverísque in úrbibus eius et in ǽdibus:'
  "2": tres civitátes separábis tibi in médio terræ, quam Dóminus Deus tuus dabit tibi in possessiónem,
  "3": 'sternens diligénter viam: et in tres æquáliter partes totam terræ tuæ provínciam dívides: ut hábeat e vicíno qui propter homicídium prófugus est, quo possit evádere.'
  "4": 'Hæc erit lex homicídæ fugiéntis, cuius vita servánda est: qui percússerit próximum suum nésciens, et qui heri et nudiustértius nullum contra eum ódium habuísse comprobátur:'
  "5": 'sed abiísse cum eo simplíciter in silvam ad ligna cædénda, et in succisióne lignórum secúris fúgerit manu, ferrúmque lapsum de manúbrio amícum eius percússerit, et occíderit: hic ad unam supradictárum úrbium confúgiet, et vivet:'
  "6": 'ne fórsitan próximus eius, cuius effúsus est sanguis, dolóre stimulátus, persequátur, et apprehéndat eum si lóngior via fúerit, et percútiat ánimam eius, qui non est reus mortis: quia nullum contra eum, qui occísus est, ódium prius habuísse monstrátur.'
  "7": Idcírco præcípio tibi, ut tres civitátes æquális inter se spátii dívidas.
  "8": Cum autem dilatáverit Dóminus Deus tuus términos tuos, sicut iurávit pátribus tuis, et déderit tibi cunctam terram, quam eis pollícitus est
  "9": '(si tamen custodíeris mandáta eius, et féceris quæ hódie præcípio tibi, ut díligas Dóminum Deum tuum, et ámbules in viis eius omni témpore), addes tibi tres álias civitátes, et supradictárum trium úrbium númerum duplicábis:'
  "10": ut non effundátur sanguis innóxius in médio terræ, quam Dóminus Deus tuus dabit tibi possidéndam, ne sis sánguinis reus.
  "11": Si quis autem, ódio habens próximum suum, insidiátus fúerit vitæ eius, surgénsque percússerit illum, et mórtuus fúerit, fugerítque ad unam de supradíctis úrbibus,
  "12": mittent senióres civitátis illíus, et arrípient eum de loco effúgii, tradéntque in manu próximi, cuius sanguis effúsus est, et moriétur.
  "13": Non miseréberis eius, et áuferes innóxium sánguinem de Israel, ut bene sit tibi.
  "14": Non assúmes, et tránsferes términos próximi tui, quos fixérunt prióres in possessióne tua, quam Dóminus Deus tuus dabit tibi in terra, quam accéperis possidéndam.
  "15": 'Non stabit testis unus contra áliquem, quidquid illud peccáti, et facínoris fúerit: sed in ore duórum aut trium téstium stabit omne verbum.'
  "16": Si stéterit testis mendax contra hóminem, accúsans eum prævaricatiónis,
  "17": stabunt ambo, quorum causa est, ante Dóminum in conspéctu sacerdótum et iúdicum qui fúerint in diébus illis.
  "18": Cumque diligentíssime perscrutántes, invénerint falsum testem dixísse contra fratrem suum mendácium,
  "19": 'reddent ei sicut fratri suo fácere cogitávit, et áuferes malum de médio tui:'
  "20": ut audiéntes céteri timórem hábeant, et nequáquam tália áudeant fácere.
  "21": Non miseréberis eius, sed ánimam pro ánima, óculum pro óculo, dentem pro dente, manum pro manu, pedem pro pede éxiges.
