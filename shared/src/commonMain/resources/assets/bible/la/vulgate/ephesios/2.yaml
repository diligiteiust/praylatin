bible: vulgate
lang: la
language: Latina
book: ad Ephesios
chapter: "2"
verses:
  "1": Et vos, cum essétis mórtui delíctis, et peccátis vestris,
  "2": in quibus aliquándo ambulástis secúndum sǽculum mundi huius, secúndum príncipem potestátis áeris huius, spíritus, qui nunc operátur in fílios diffidéntiæ,
  "3": 'in quibus et nos omnes aliquándo conversáti sumus in desidériis carnis nostræ, faciéntes voluntátem carnis, et cogitatiónum, et erámus natúra fílii iræ, sicut et céteri:'
  "4": Deus autem, qui dives est in misericórdia, propter nímiam caritátem suam, qua diléxit nos,
  "5": et cum essémus mórtui peccátis, convivificávit nos in Christo (cuius grátia estis salváti),
  "6": 'et conresuscitávit, et consedére fecit in cæléstibus in Christo Iesu:'
  "7": ut osténderet in sǽculis superveniéntibus abundántes divítias grátiæ suæ, in bonitáte super nos in Christo Iesu.
  "8": 'Grátia enim estis salváti per fidem, et hoc non ex vobis: Dei enim donum est:'
  "9": non ex opéribus, ut ne quis gloriétur.
  "10": Ipsíus enim sumus factúra, creáti in Christo Iesu in opéribus bonis, quæ præparávit Deus ut in illis ambulémus.
  "11": 'Propter quod mémores estóte quod aliquándo vos gentes in carne, qui dicímini præpútium ab ea, quæ dícitur circumcísio in carne, manu facta:'
  "12": quia erátis illo in témpore sine Christo, alienáti a conversatióne Israel, et hóspites testamentórum, promissiónis spem non habéntes, et sine Deo in hoc mundo.
  "13": Nunc autem in Christo Iesu vos, qui aliquándo erátis longe, facti estis prope in sánguine Christi.
  "14": Ipse enim est pax nostra, qui fecit útraque unum, et médium paríetem macériæ solvens, inimicítias in carne sua,
  "15": 'legem mandatórum decrétis evácuans, ut duos condat in semetípso in unum novum hóminem, fáciens pacem:'
  "16": et reconcíliet ambos in uno córpore, Deo per crucem, interfíciens inimicítias in semetípso.
  "17": 'Et véniens evangelizávit pacem vobis, qui longe fuístis: et pacem iis, qui prope.'
  "18": Quóniam per ipsum habémus accéssum ambo in uno Spíritu ad Patrem.
  "19": 'Ergo iam non estis hóspites, et ádvenæ: sed estis cives sanctórum, et doméstici Dei:'
  "20": 'superædificáti super fundaméntum apostolórum, et prophetárum, ipso summo angulári lápide Christo Iesu:'
  "21": in quo omnis ædificátio constrúcta crescit in templum sanctum in Dómino,
  "22": in quo et vos coædificámini in habitáculum Dei in Spíritu.
