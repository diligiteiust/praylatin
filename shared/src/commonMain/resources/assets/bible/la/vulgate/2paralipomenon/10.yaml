bible: vulgate
lang: la
language: Latina
book: II Paralipomenon
chapter: "10"
verses:
  "1": 'Proféctus est autem Róboam in Sichem: illuc enim cunctus Israel convénerat ut constitúerent eum regem.'
  "2": Quod cum audísset Ieróboam fílius Nabat, qui erat in Ægýpto (fúgerat quippe illuc ante Salomónem), statim revérsus est.
  "3": 'Vocaverúntque eum, et venit cum univérso Israel: et locúti sunt ad Róboam, dicéntes:'
  "4": 'Pater tuus duríssimo iugo nos pressit: tu levióra ímpera patre tuo, qui nobis impósuit gravem servitútem, et páululum de ónere súbleva, ut serviámus tibi.'
  "5": 'Qui ait: Post tres dies revertímini ad me. Cumque abiísset pópulus,'
  "6": 'íniit consílium cum sénibus, qui stéterant coram patre eius Salomóne dum adhuc víveret, dicens: Quid datis consílii ut respóndeam pópulo?'
  "7": 'Qui dixérunt ei: Si placúeris pópulo huic, et leníveris eos verbis cleméntibus, sérvient tibi omni témpore.'
  "8": At ille relíquit consílium senum, et cum iuvénibus tractáre cœpit, qui cum eo nutríti fúerant, et erant in comitátu illíus.
  "9": 'Dixítque ad eos: Quid vobis vidétur? vel respondére quid débeo pópulo huic, qui dixit mihi: Súbleva iugum quod impósuit nobis pater tuus?'
  "10": 'At illi respondérunt ut iúvenes, et nutríti cum eo in delíciis, atque dixérunt: Sic loquéris pópulo, qui dixit tibi: Pater tuus aggravávit iugum nostrum, tu súbleva: et sic respondébis ei: Mínimus dígitus meus gróssior est lumbis patris mei.'
  "11": 'Pater meus impósuit vobis grave iugum, et ego maius pondus appónam: pater meus cecídit vos flagéllis, ego vero cædam vos scorpiónibus.'
  "12": Venit ergo Ieróboam, et univérsus pópulus ad Róboam die tértio, sicut præcéperat eis.
  "13": 'Respondítque rex dura, derelícto consílio seniórum:'
  "14": 'locutúsque est iuxta iúvenum voluntátem: Pater meus grave vobis impósuit iugum, quod ego grávius fáciam: pater meus cecídit vos flagéllis, ego vero cædam vos scorpiónibus.'
  "15": 'Et non acquiévit pópuli précibus: erat enim voluntátis Dei, ut complerétur sermo eius, quem locútus fúerat per manum Ahíæ Silonítis ad Ieróboam fílium Nabat.'
  "16": 'Pópulus autem univérsus rege durióra dicénte, sic locútus est ad eum: Non est nobis pars in David, neque heréditas in fílio Isai. Revértere in tabernácula tua Israel: tu autem pasce domum tuam David. Et ábiit Israel in tabernácula sua.'
  "17": Super fílios autem Israel, qui habitábant in civitátibus Iuda, regnávit Róboam.
  "18": 'Misítque rex Róboam Adúram, qui prǽerat tribútis, et lapidavérunt eum fílii Israel, et mórtuus est: porro rex Róboam currum festinávit ascéndere, et fugit in Ierúsalem.'
  "19": Recessítque Israel a domo David, usque ad diem hanc.
