bible: vulgate
lang: la
language: Latina
book: II Machabaeorum
chapter: "6"
verses:
  "1": 'Sed non post multum témporis, misit rex senem quemdam Antiochénum, qui compélleret Iudǽos ut se transférrent a pátriis, et Dei légibus:'
  "2": 'contamináre étiam quod in Ierosólymis erat templum, et cognomináre Iovis Olýmpii: et in Garízim, prout erant hi, qui locum inhabitábant, Iovis hospitális.'
  "3": 'Péssima autem et univérsis gravis erat malórum incúrsio:'
  "4": 'nam templum luxúria, et comessatiónibus géntium erat plenum, et scortántium cum meretrícibus: sacratísque ǽdibus mulíeres se ultro ingerébant, intro feréntes ea, quæ non licébat.'
  "5": Altáre étiam plenum erat illícitis, quæ légibus prohibebántur.
  "6": Neque autem sábbata custodiebántur, neque dies solémnes pátrii servabántur, nec simplíciter Iudǽum se esse quisquam confitebátur.
  "7": 'Ducebántur autem cum amára necessitáte in die natális regis ad sacrifícia: et cum Líberi sacra celebraréntur, cogebántur hédera coronáti Líbero circuíre.'
  "8": 'Decrétum autem éxiit in próximas gentílium civitátes, suggeréntibus Ptolemǽis, ut pari modo et ipsi advérsus Iudǽos ágerent, ut sacrificárent:'
  "9": 'eos autem, qui nollent transíre ad institúta géntium, interfícerent: erat ergo vidére misériam.'
  "10": 'Duæ enim mulíeres delátæ sunt natos suos circumcidísse: quas, infántibus ad úbera suspénsis, cum públice per civitátem circumduxíssent, per muros præcipitavérunt.'
  "11": Alii vero, ad próximas coeúntes spelúncas, et laténter sábbati diem celebrántes, cum indicáti essent Philíppo, flammis succénsi sunt, eo quod verebántur propter religiónem, et observántiam, manu sibímet auxílium ferre.
  "12": 'Obsecro autem eos, qui hunc librum lectúri sunt, ne abhorréscant propter advérsos casus: sed réputent, ea, quæ accidérunt, non ad intéritum, sed ad correptiónem esse géneris nostri.'
  "13": Etenim multo témpore non sínere peccatóribus ex senténtia ágere, sed statim ultiónes adhibére, magni benefícii est indícium.
  "14": 'Non enim, sicut in áliis natiónibus, Dóminus patiénter exspéctat, ut eas cum iudícii dies advénerit, in plenitúdine peccatórum púniat:'
  "15": ita et in nobis státuit ut, peccátis nostris in finem devolútis, ita demum in nos víndicet.
  "16": 'Propter quod numquam quidem a nobis misericórdiam suam ámovet: corrípiens vero in advérsis, pópulum suum non derelíquit.'
  "17": Sed hæc nobis ad commonitiónem legéntium dicta sint paucis. Iam enim veniéndum est ad narratiónem.
  "18": Igitur Eleázarus, unus de primóribus scribárum, vir ætáte provéctus, et vultu decórus, apérto ore hians compellebátur carnem porcínam manducáre.
  "19": At ille gloriosíssimam mortem magis quam odíbilem vitam compléctens, voluntárie præíbat ad supplícium.
  "20": Intuens autem quemádmodum oportéret accédere, patiénter sústinens, destinávit non admíttere illícita propter vitæ amórem.
  "21": 'Hi autem, qui astábant, iníqua miseratióne commóti propter antíquam viri amicítiam, tolléntes eum secréto rogábant afférri carnes, quibus vesci ei licébat, ut simularétur manducásse sicut rex imperáverat de sacrifícii cárnibus:'
  "22": 'ut hoc facto, a morte liberarétur: et propter véterem viri amicítiam, hanc in eo faciébant humanitátem.'
  "23": 'At ille cogitáre cœpit ætátis ac senectútis suæ eminéntiam dignam, et ingénitæ nobilitátis canítiem, atque a púero óptimæ conversatiónis actus: et secúndum sanctæ, et a Deo cónditæ legis constitúta, respóndit cito, dicens præmítti se velle in inférnum.'
  "24": 'Non enim ætáti nostræ dignum est, inquit, fíngere: ut multi adolescéntium, arbitrántes Eleázarum nonagínta annórum transísse ad vitam alienigenárum:'
  "25": et ipsi propter meam simulatiónem, et propter módicum corruptíbilis vitæ tempus decipiántur, et per hoc máculam, atque exsecratiónem meæ senectúti conquíram.
  "26": Nam etsi in præsénti témpore supplíciis hóminum erípiar, sed manum Omnipoténtis nec vivus, nec defúnctus effúgiam.
  "27": 'Quam ob rem fórtiter vita excedéndo, senectúte quidem dignus apparébo:'
  "28": adolescéntibus autem exémplum forte relínquam, si prompto ánimo, ac fórtiter pro gravíssimis ac sanctíssimis légibus honésta morte perfúngar. His dictis, conféstim ad supplícium trahebátur.
  "29": Hi autem, qui eum ducébant, et paulo ante fúerant mitióres, in iram convérsi sunt propter sermónes ab eo dictos, quos illi per arrogántiam prolátos arbitrabántur.
  "30": 'Sed, cum plagis perimerétur, ingémuit, et dixit: Dómine, qui habes sanctam sciéntiam, maniféste tu scis, quia, cum a morte possem liberári, duros córporis sustíneo dolóres: secúndum ánimam vero propter timórem tuum libénter hæc pátior.'
  "31": Et iste quidem hoc modo vita decéssit, non solum iuvénibus, sed et univérsæ genti memóriam mortis suæ ad exémplum virtútis et fortitúdinis derelínquens.
