bible: vulgate
lang: la
language: Latina
book: Iudicum
chapter: "6"
verses:
  "1": 'Fecérunt autem fílii Israel malum in conspéctu Dómini: qui trádidit illos in manu Mádian septem annis,'
  "2": et oppréssi sunt valde ab eis. Fecerúntque sibi antra et spelúncas in móntibus, et munitíssima ad repugnándum loca.
  "3": 'Cumque sevísset Israel, ascendébat Mádian et Amalec, ceteríque orientálium natiónum:'
  "4": 'et apud eos figéntes tentória, sicut erant in herbis cuncta vastábant usque ad intróitum Gazæ: nihílque omníno ad vitam pértinens relinquébant in Israel, non oves, non boves, non ásinos.'
  "5": Ipsi enim et univérsi greges eórum veniébant cum tabernáculis suis, et instar locustárum univérsa complébant, innúmera multitúdo hóminum et camelórum, quidquid tetígerant devastántes.
  "6": Humiliatúsque est Israel valde in conspéctu Mádian.
  "7": Et clamávit ad Dóminum póstulans auxílium contra Madianítas.
  "8": 'Qui misit ad eos virum prophétam, et locútus est: Hæc dicit Dóminus Deus Israel: Ego vos feci conscéndere de Ægýpto, et edúxi vos de domo servitútis,'
  "9": 'et liberávi de manu Ægyptiórum, et ómnium inimicórum, qui affligébant vos: eiecíque eos ad intróitum vestrum, et trádidi vobis terram eórum.'
  "10": 'Et dixi: Ego Dóminus Deus vester: ne timeátis deos Amorrhæórum, in quorum terra habitátis. Et noluístis audíre vocem meam.'
  "11": Venit autem ángelus Dómini, et sedit sub quercu, quæ erat in Ephra, et pertinébat ad Ioas patrem famíliæ Ezri. Cumque Gédeon fílius eius excúteret atque purgáret fruménta in torculári, ut fúgeret Mádian,
  "12": 'appáruit ei ángelus Dómini, et ait: Dóminus tecum, virórum fortíssime.'
  "13": 'Dixítque ei Gédeon: Obsecro, mi dómine, si Dóminus nobíscum est, cur apprehendérunt nos hæc ómnia? ubi sunt mirabília eius, quæ narravérunt patres nostri, atque dixérunt: De Ægýpto edúxit nos Dóminus? Nunc autem derelíquit nos Dóminus, et trádidit in manu Mádian.'
  "14": 'Respexítque ad eum Dóminus, et ait: Vade in hac fortitúdine tua, et liberábis Israel de manu Mádian: scito quod míserim te.'
  "15": 'Qui respóndens ait: Obsecro, mi Dómine, in quo liberábo Israel? ecce família mea ínfima est in Manásse, et ego mínimus in domo patris mei.'
  "16": 'Dixítque ei Dóminus: Ego ero tecum: et percúties Mádian quasi unum virum.'
  "17": 'Et ille: Si invéni, inquit, grátiam coram te, da mihi signum quod tu sis qui lóqueris ad me:'
  "18": 'nec recédas hinc, donec revértar ad te, portans sacrifícium, et ófferens tibi. Qui respóndit: Ego præstolábor advéntum tuum.'
  "19": 'Ingréssus est ítaque Gédeon, et coxit hædum, et de farínæ módio ázymos panes: carnésque ponens in canístro, et ius cárnium mittens in ollam, tulit ómnia sub quercu, et óbtulit ei.'
  "20": 'Cui dixit ángelus Dómini: Tolle carnes et ázymos panes, et pone supra petram illam, et ius désuper funde. Cumque fecísset ita,'
  "21": 'exténdit ángelus Dómini summitátem virgæ, quam tenébat in manu, et tétigit carnes et panes ázymos: ascendítque ignis de petra, et carnes azymósque panes consúmpsit: ángelus autem Dómini evánuit ex óculis eius.'
  "22": 'Vidénsque Gédeon quod esset ángelus Dómini, ait: Heu mi Dómine Deus: quia vidi ángelum Dómini fácie ad fáciem.'
  "23": 'Dixítque ei Dóminus: Pax tecum: ne tímeas, non moriéris.'
  "24": Ædificávit ergo ibi Gédeon altáre Dómino, vocavítque illud, Dómini pax, usque in præséntem diem. Cumque adhuc esset in Ephra, quæ est famíliæ Ezri,
  "25": 'nocte illa dixit Dóminus ad eum: Tolle taurum patris tui, et álterum taurum annórum septem, destruésque aram Baal, quæ est patris tui: et nemus, quod circa aram est, succíde.'
  "26": 'Et ædificábis ibi altáre Dómino Deo tuo in summitáte petræ huius, super quam ante sacrifícium posuísti: tollésque taurum secúndum, et ófferes holocáustum super struem lignórum, quæ de némore succíderis.'
  "27": Assúmptis ergo Gédeon decem viris de servis suis, fecit sicut præcéperat ei Dóminus. Timens autem domum patris sui, et hómines illíus civitátis, per diem nóluit id fácere, sed ómnia nocte complévit.
  "28": Cumque surrexíssent viri óppidi eius mane, vidérunt destrúctam aram Baal, lucúmque succísum, et taurum álterum impósitum super altáre, quod tunc ædificátum erat.
  "29": 'Dixerúntque ad ínvicem: Quis hoc fecit? Cumque perquírerent auctórem facti, dictum est: Gédeon fílius Ioas fecit hæc ómnia.'
  "30": 'Et dixérunt ad Ioas: Produc fílium tuum huc, ut moriátur: quia destrúxit aram Baal, et succídit nemus.'
  "31": 'Quibus ille respóndit: Numquid ultóres estis Baal, ut pugnétis pro eo? qui adversárius est eius, moriátur ántequam lux crástina véniat: si Deus est, víndicet se de eo, qui suffódit aram eius.'
  "32": 'Ex illo die vocátus est Gédeon Ieróbaal, eo quod dixísset Ioas: Ulciscátur se de eo Baal, qui suffódit aram eius.'
  "33": 'Igitur omnis Mádian, et Amalec, et orientáles pópuli, congregáti sunt simul: et transeúntes Iordánem, castrametáti sunt in valle Iézrael.'
  "34": Spíritus autem Dómini índuit Gédeon, qui clangens búccina convocávit domum Abiézer, ut sequerétur se.
  "35": 'Misítque núntios in univérsum Manássen, qui et ipse secútus est eum: et álios núntios in Aser et Zábulon et Néphthali, qui occurrérunt ei.'
  "36": 'Dixítque Gédeon ad Deum: Si salvum facis per manum meam Israel, sicut locútus es,'
  "37": 'ponam hoc vellus lanæ in área: si ros in solo véllere fúerit, et in omni terra síccitas, sciam quod per manum meam, sicut locútus es, liberábis Israel.'
  "38": Factúmque est ita. Et de nocte consúrgens exprésso véllere, concham rore implévit.
  "39": 'Dixítque rursus ad Deum: Ne irascátur furor tuus contra me si adhuc semel tentávero, signum quærens in véllere. Oro ut solum vellus siccum sit, et omnis terra rore madens.'
  "40": 'Fecítque Deus nocte illa ut postuláverat: et fuit síccitas in solo véllere, et ros in omni terra.'
