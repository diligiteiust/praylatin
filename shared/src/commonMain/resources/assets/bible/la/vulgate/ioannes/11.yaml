bible: vulgate
lang: la
language: Latina
book: Ioannes
chapter: "11"
verses:
  "1": Erat autem quidam languens Lázarus a Bethánia, de castéllo Maríæ, et Marthæ soróris eius.
  "2": '(María autem erat, quæ unxit Dóminum unguénto, et extérsit pedes eius capíllis suis: cuius frater Lázarus infirmabátur.)'
  "3": 'Misérunt ergo soróres eius ad eum dicéntes: Dómine, ecce quem amas infirmátur.'
  "4": 'Audiens autem Iesus dixit eis: Infírmitas hæc non est ad mortem, sed pro glória Dei, ut glorificétur Fílius Dei per eam.'
  "5": Diligébat autem Iesus Martham, et sorórem eius Maríam, et Lázarum.
  "6": 'Ut ergo audívit quia infirmabátur, tunc quidem mansit in eódem loco duóbus diébus:'
  "7": 'deínde post hæc dixit discípulis suis: Eámus in Iudǽam íterum.'
  "8": 'Dicunt ei discípuli: Rabbi, nunc quærébant te Iudǽi lapidáre, et íterum vadis illuc?'
  "9": 'Respóndit Iesus: Nonne duódecim sunt horæ diéi? Si quis ambuláverit in die, non offéndit, quia lucem huius mundi videt:'
  "10": si autem ambuláverit in nocte, offéndit, quia lux non est in eo.
  "11": 'Hæc ait, et post hæc dixit eis: Lázarus amícus noster dormit: sed vado ut a somno éxcitem eum.'
  "12": 'Dixérunt ergo discípuli eius: Dómine, si dormit, salvus erit.'
  "13": 'Díxerat autem Iesus de morte eius: illi autem putavérunt quia de dormitióne somni díceret.'
  "14": 'Tunc ergo Iesus dixit eis maniféste: Lázarus mórtuus est:'
  "15": et gáudeo propter vos, ut credátis, quóniam non eram ibi, sed eámus ad eum.
  "16": 'Dixit ergo Thomas, qui dícitur Dídymus, ad condiscípulos: Eámus et nos, ut moriámur cum eo.'
  "17": 'Venit ítaque Iesus: et invénit eum quátuor dies iam in monuménto habéntem.'
  "18": (Erat autem Bethánia iuxta Ierosólymam quasi stádiis quíndecim.)
  "19": Multi autem ex Iudǽis vénerant ad Martham, et Maríam, ut consolaréntur eas de fratre suo.
  "20": 'Martha ergo ut audívit quia Iesus venit, occúrrit illi: María autem domi sedébat.'
  "21": 'Dixit ergo Martha ad Iesum: Dómine, si fuísses hic, frater meus non fuísset mórtuus:'
  "22": sed et nunc scio quia quæcúmque popósceris a Deo, dabit tibi Deus.
  "23": 'Dicit illi Iesus: Resúrget frater tuus.'
  "24": 'Dicit ei Martha: Scio quia resúrget in resurrectióne in novíssimo die.'
  "25": 'Dixit ei Iesus: Ego sum resurréctio, et vita: qui credit in me, étiam si mórtuus fúerit, vivet:'
  "26": et omnis, qui vivit, et credit in me, non moriétur in ætérnum. Credis hoc?
  "27": 'Ait illi: Utique Dómine, ego crédidi quia tu es Christus, Fílius Dei vivi, qui in hunc mundum venísti.'
  "28": 'Et cum hæc dixísset, ábiit, et vocávit Maríam sorórem suam siléntio, dicens: Magíster adest, et vocat te.'
  "29": 'Illa ut audívit, surgit cito, et venit ad eum:'
  "30": 'nondum enim vénerat Iesus in castéllum: sed erat adhuc in illo loco, ubi occúrrerat ei Martha.'
  "31": 'Iudǽi ergo, qui erant cum ea in domo, et consolabántur eam, cum vidíssent Maríam quia cito surréxit, et éxiit, secúti sunt eam dicéntes: Quia vadit ad monuméntum, ut ploret ibi.'
  "32": 'María ergo, cum venísset ubi erat Iesus, videns eum, cécidit ad pedes eius, et dicit ei: Dómine, si fuísses hic, non esset mórtuus frater meus.'
  "33": Iesus ergo, ut vidit eam plorántem, et Iudǽos, qui vénerant cum ea, plorántes, infrémuit spíritu, et turbávit seípsum,
  "34": 'et dixit: Ubi posuístis eum? Dicunt ei: Dómine, veni, et vide.'
  "35": Et lacrymátus est Iesus.
  "36": 'Dixérunt ergo Iudǽi: Ecce quómodo amábat eum.'
  "37": 'Quidam autem ex ipsis dixérunt: Non póterat hic, qui apéruit óculos cæci nati, fácere ut hic non morerétur?'
  "38": Iesus ergo rursum fremens in semetípso, venit ad monuméntum. Erat autem spelúnca, et lapis superpósitus erat ei.
  "39": 'Ait Iesus: Tóllite lápidem. Dicit ei Martha soror eius, qui mórtuus fúerat: Dómine, iam fœtet, quatriduánus est enim.'
  "40": 'Dicit ei Iesus: Nonne dixi tibi quóniam si credíderis, vidébis glóriam Dei?'
  "41": 'Tulérunt ergo lápidem: Iesus autem, elevátis sursum óculis, dixit: Pater grátias ago tibi quóniam audísti me.'
  "42": 'Ego autem sciébam quia semper me audis, sed propter pópulum, qui circúmstat, dixi: ut credant quia tu me misísti.'
  "43": 'Hæc cum dixísset, voce magna clamávit: Lázare veni foras.'
  "44": 'Et statim pródiit qui fúerat mórtuus, ligátus pedes, et manus ínstitis, et fácies illíus sudário erat ligáta. Dixit eis Iesus: Sólvite eum, et sínite abíre.'
  "45": Multi ergo ex Iudǽis, qui vénerant ad Maríam, et Martham, et víderant quæ fecit Iesus, credidérunt in eum.
  "46": Quidam autem ex ipsis abiérunt ad Pharisǽos, et dixérunt eis quæ fecit Iesus.
  "47": 'Collegérunt ergo pontífices, et Pharisǽi concílium, et dicébant: Quid fácimus, quia hic homo multa signa facit?'
  "48": Si dimíttimus eum sic, omnes credent in eum, et vénient Románi, et tollent nostrum locum, et gentem.
  "49": 'Unus autem ex ipsis, Caíphas nómine, cum esset póntifex anni illíus, dixit eis: Vos nescítis quidquam,'
  "50": nec cogitátis quia éxpedit vobis ut unus moriátur homo pro pópulo, et non tota gens péreat.
  "51": 'Hoc autem a semetípso non dixit: sed cum esset póntifex anni illíus, prophetávit, quod Iesus moritúrus erat pro gente,'
  "52": et non tantum pro gente, sed ut fílios Dei, qui erant dispérsi, congregáret in unum.
  "53": Ab illo ergo die cogitavérunt ut interfícerent eum.
  "54": Iesus ergo iam non in palam ambulábat apud Iudǽos, sed ábiit in regiónem iuxta desértum, in civitátem quæ dícitur Ephrem, et ibi morabátur cum discípulis suis.
  "55": Próximum autem erat Pascha Iudæórum, et ascendérunt multi Ierosólymam de regióne ante Pascha, ut sanctificárent seípsos.
  "56": 'Quærébant ergo Iesum, et colloquebántur ad ínvicem, in templo stantes: Quid putátis, quia non venit ad diem festum? Déderant autem pontífices, et Pharisǽi mandátum, ut si quis cognóverit ubi sit, índicet, ut apprehéndant eum.'
