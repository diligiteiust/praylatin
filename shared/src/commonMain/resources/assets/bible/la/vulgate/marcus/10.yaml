bible: vulgate
lang: la
language: Latina
book: Marcus
chapter: "10"
verses:
  "1": 'Et inde exsúrgens venit in fines Iudǽæ ultra Iordánem: et convéniunt íterum turbæ ad eum: et sicut consuéverat, íterum docébat illos.'
  "2": 'Et accedéntes Pharisǽi interrogábant eum: Si licet viro uxórem dimíttere: tentántes eum.'
  "3": 'At ille respóndens, dixit eis: Quid vobis præcépit Móyses?'
  "4": 'Qui dixérunt: Móyses permísit libéllum repúdii scríbere, et dimíttere.'
  "5": 'Quibus respóndens Iesus, ait: Ad durítiam cordis vestri scripsit vobis præcéptum istud:'
  "6": ab inítio autem creatúræ másculum, et féminam fecit eos Deus.
  "7": 'Propter hoc relínquet homo patrem suum, et matrem, et adhærébit ad uxórem suam:'
  "8": et erunt duo in carne una. Itaque iam non sunt duo, sed una caro.
  "9": Quod ergo Deus coniúnxit, homo non séparet.
  "10": Et in domo íterum discípuli eius de eódem interrogavérunt eum.
  "11": 'Et ait illis: Quicúmque dimíserit uxórem suam, et áliam dúxerit, adultérium commíttit super eam.'
  "12": Et si uxor dimíserit virum suum, et álii núpserit, mœchátur.
  "13": Et offerébant illi párvulos ut tángeret illos. Discípuli autem comminabántur offeréntibus.
  "14": 'Quos cum vidéret Iesus, indígne tulit, et ait illis: Sínite párvulos veníre ad me, et ne prohibuéritis eos: tálium enim est regnum Dei.'
  "15": 'Amen dico vobis: Quisquis non recéperit regnum Dei velut párvulus, non intrábit in illud.'
  "16": Et compléxans eos, et impónens manus super illos, benedicébat eos.
  "17": 'Et cum egréssus esset in viam, procúrrens quidam genu flexo ante eum, rogábat eum: Magíster bone, quid fáciam ut vitam ætérnam percípiam?'
  "18": 'Iesus autem dixit ei: Quid me dicis bonum? nemo bonus, nisi unus Deus.'
  "19": 'Præcépta nosti: Ne adúlteres, Ne occídas, Ne furéris, Ne falsum testimónium díxeris, Ne fraudem féceris, Honóra patrem tuum et matrem.'
  "20": 'At ille respóndens, ait illi: Magíster, hæc ómnia observávi a iuventúte mea.'
  "21": 'Iesus autem intúitus eum, diléxit eum, et dixit ei: Unum tibi deest: vade, quæcúmque habes vende, et da paupéribus, et habébis thesáurum in cælo: et veni, séquere me.'
  "22": 'Qui contristátus in verbo, ábiit mœrens: erat enim habens multas possessiónes.'
  "23": 'Et circumspíciens Iesus, ait discípulis suis: Quam diffícile qui pecúnias habent, in regnum Dei introíbunt!'
  "24": 'Discípuli autem obstupescébant in verbis eius. At Iesus rursus respóndens ait illis: Filíoli, quam diffícile est, confidéntes in pecúniis, in regnum Dei introíre!'
  "25": Facílius est camélum per forámen acus transíre, quam dívitem intráre in regnum Dei.
  "26": 'Qui magis admirabántur, dicéntes ad semetípsos: Et quis potest salvus fíeri?'
  "27": 'Et íntuens illos Iesus, ait: Apud hómines impossíbile est, sed non apud Deum: ómnia enim possibília sunt apud Deum.'
  "28": 'Et cœpit ei Petrus dícere: Ecce nos dimísimus ómnia, et secúti sumus te.'
  "29": 'Respóndens Iesus, ait: Amen dico vobis: Nemo est, qui relíquerit domum, aut fratres, aut soróres, aut patrem, aut matrem, aut fílios, aut agros propter me, et propter Evangélium,'
  "30": 'qui non accípiat cénties tantum, nunc in témpore hoc: domos, et fratres, et soróres, et matres, et fílios, et agros, cum persecutiónibus, et in sǽculo futúro vitam ætérnam.'
  "31": Multi autem erunt primi novíssimi, et novíssimi primi.
  "32": 'Erant autem in via ascendéntes Ierosólymam: et præcedébat illos Iesus, et stupébant: et sequéntes timébant. Et assúmens íterum duódecim, cœpit illis dícere quæ essent ei eventúra.'
  "33": 'Quia ecce ascéndimus Ierosólymam, et Fílius hóminis tradétur princípibus sacerdótum, et scribis, et senióribus, et damnábunt eum morte, et tradent eum géntibus:'
  "34": 'et illúdent ei, et cónspuent eum, et flagellábunt eum, et interfícient eum: et tértia die resúrget.'
  "35": 'Et accédunt ad eum Iacóbus, et Ioánnes fílii Zebedǽi, dicéntes: Magíster, vólumus ut quodcúmque petiérimus, fácias nobis.'
  "36": 'At ille dixit eis: Quid vultis ut fáciam vobis?'
  "37": 'Et dixérunt: Da nobis ut unus ad déxteram tuam, et álius ad sinístram tuam sedeámus in glória tua.'
  "38": 'Iesus autem ait eis: Nescítis quid petátis: potéstis bíbere cálicem, quem ego bibo: aut baptísmo, quo ego baptízor, baptizári?'
  "39": 'At illi dixérunt ei: Póssumus. Iesus autem ait eis: Cálicem quidem, quem ego bibo, bibétis: et baptísmo, quo ego baptízor, baptizabímini:'
  "40": sedére autem ad déxteram meam, vel ad sinístram, non est meum dare vobis, sed quibus parátum est.
  "41": Et audiéntes decem, cœpérunt indignári de Iacóbo, et Ioánne.
  "42": 'Iesus autem vocans eos, ait illis: Scitis quia hi, qui vidéntur principári géntibus, dominántur eis: et príncipes eórum potestátem habent ipsórum.'
  "43": 'Non ita est autem in vobis, sed quicúmque volúerit fíeri maior, erit vester miníster:'
  "44": et quicúmque volúerit in vobis primus esse, erit ómnium servus.
  "45": Nam et Fílius hóminis non venit ut ministrarétur ei, sed ut ministráret, et daret ánimam suam redemptiónem pro multis.
  "46": 'Et véniunt Iéricho: et proficiscénte eo de Iéricho, et discípulis eius, et plúrima multitúdine, fílius Timǽi Bartimǽus cæcus, sedébat iuxta viam mendícans.'
  "47": 'Qui cum audísset quia Iesus Nazarénus est, cœpit clamáre, et dícere: Iesu fili David, miserére mei.'
  "48": 'Et comminabántur ei multi ut tacéret. At ille multo magis clamábat: Fili David, miserére mei.'
  "49": 'Et stans Iesus præcépit illum vocári. Et vocant cæcum, dicéntes ei: Animǽquior esto: surge, vocat te.'
  "50": Qui proiécto vestiménto suo exsíliens, venit ad eum.
  "51": 'Et respóndens Iesus dixit illi: Quid tibi vis fáciam? Cæcus autem dixit ei: Rabbóni, ut vídeam.'
  "52": 'Iesus autem ait illi: Vade, fides tua te salvum fecit. Et conféstim vidit, et sequebátur eum in via.'
