bible: vulgate
lang: la
language: Latina
book: Iob
chapter: "9"
verses:
  "1": 'Et respóndens Iob, ait:'
  "2": Vere scio quod ita sit, et quod non iustificétur homo compósitus Deo.
  "3": Si volúerit conténdere cum eo, non póterit ei respondére unum pro mille.
  "4": 'Sápiens corde est, et fortis róbore: quis réstitit ei, et pacem hábuit?'
  "5": Qui tránstulit montes, et nesciérunt hi quos subvértit in furóre suo.
  "6": Qui cómmovet terram de loco suo, et colúmnæ eius concutiúntur.
  "7": 'Qui prǽcipit soli, et non orítur: et stellas claudit quasi sub signáculo.'
  "8": Qui exténdit cælos solus, et gráditur super fluctus maris.
  "9": Qui facit Arctúrum, et Oríona, et Hýadas, et interióra austri.
  "10": Qui facit magna, et incomprehensibília, et mirabília, quorum non est númerus.
  "11": 'Si vénerit ad me, non vidébo eum: si abíerit, non intélligam.'
  "12": 'Si repénte intérroget, quis respondébit ei? vel quis dícere potest: Cur ita facis?'
  "13": Deus, cuius iræ nemo resístere potest, et sub quo curvántur qui portant orbem.
  "14": Quantus ergo sum ego, ut respóndeam ei, et loquar verbis meis cum eo?
  "15": Qui étiam si habúero quíppiam iustum, non respondébo, sed meum iúdicem deprecábor.
  "16": Et cum invocántem exaudíerit me, non credo quod audíerit vocem meam.
  "17": In túrbine enim cónteret me, et multiplicábit vúlnera mea, étiam sine causa.
  "18": Non concédit requiéscere spíritum meum, et implet me amaritudínibus.
  "19": 'Si fortitúdo quǽritur, robustíssimus est: si ǽquitas iudícii, nemo audet pro me testimónium dícere.'
  "20": 'Si iustificáre me volúero, os meum condemnábit me: si innocéntem osténdero, pravum me comprobábit.'
  "21": Etiam si simplex fúero, hoc ipsum ignorábit ánima mea, et tædébit me vitæ meæ.
  "22": Unum est quod locútus sum, et innocéntem et ímpium ipse consúmit.
  "23": Si flagéllat, occídat semel, et non de pœnis innocéntum rídeat.
  "24": 'Terra data est in manus ímpii, vultum iúdicum eius óperit: quod si non ille est, quis ergo est?'
  "25": 'Dies mei velocióres fuérunt cursóre: fugérunt, et non vidérunt bonum.'
  "26": Pertransiérunt quasi naves poma portántes, sicut áquila volans ad escam.
  "27": 'Cum díxero: Nequáquam ita loquar: commúto fáciem meam, et dolóre tórqueor.'
  "28": Verébar ómnia ópera mea, sciens quod non párceres delinquénti.
  "29": Si autem et sic ímpius sum, quare frustra laborávi?
  "30": 'Si lotus fúero quasi aquis nivis, et fúlserint velut mundíssimæ manus meæ:'
  "31": tamen sórdibus intínges me, et abominabúntur me vestiménta mea.
  "32": 'Neque enim viro qui símilis mei est, respondébo: nec qui mecum in iudício ex æquo possit audíri.'
  "33": Non est qui utrúmque váleat argúere, et pónere manum suam in ámbobus.
  "34": Auferat a me virgam suam, et pavor eius non me térreat.
  "35": 'Loquar, et non timébo eum: neque enim possum métuens respondére.'
