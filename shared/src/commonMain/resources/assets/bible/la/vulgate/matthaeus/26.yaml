bible: vulgate
lang: la
language: Latina
book: Matthaeus
chapter: "26"
verses:
  "1": 'Et factum est: cum consummásset Iesus sermónes hos omnes, dixit discípulis suis:'
  "2": Scitis quia post bíduum Pascha fiet, et Fílius hóminis tradétur ut crucifigátur.
  "3": 'Tunc congregáti sunt príncipes sacerdótum, et senióres pópuli, in átrium príncipis sacerdótum, qui dicebátur Caíphas:'
  "4": et consílium fecérunt ut Iesum dolo tenérent, et occíderent.
  "5": 'Dicébant autem: Non in die festo, ne forte tumúltus fíeret in pópulo.'
  "6": Cum autem Iesus esset in Bethánia in domo Simónis leprósi,
  "7": accéssit ad eum múlier habens alabástrum unguénti pretiósi, et effúdit super caput ipsíus recumbéntis.
  "8": 'Vidéntes autem discípuli, indignáti sunt, dicéntes: Ut quid perdítio hæc?'
  "9": pótuit enim istud venúmdari multo, et dari paupéribus.
  "10": 'Sciens autem Iesus, ait illis: Quid molésti estis huic mulíeri? opus enim bonum operáta est in me.'
  "11": 'Nam semper páuperes habétis vobíscum: me autem non semper habétis.'
  "12": Mittens enim hæc unguéntum hoc in corpus meum, ad sepeliéndum me fecit.
  "13": Amen dico vobis, ubicúmque prædicátum fúerit hoc Evangélium in toto mundo, dicétur et quod hæc fecit in memóriam eius.
  "14": 'Tunc ábiit unus de duódecim, qui dicebátur Iudas Iscariótes, ad príncipes sacerdótum:'
  "15": 'et ait illis: Quid vultis mihi dare, et ego vobis eum tradam? At illi constituérunt ei trigínta argénteos.'
  "16": Et exínde quærébat opportunitátem ut eum tráderet.
  "17": 'Prima autem die azymórum accessérunt discípuli ad Iesum, dicéntes: Ubi vis parémus tibi comédere Pascha?'
  "18": 'At Iesus dixit: Ite in civitátem ad quemdam, et dícite ei: Magíster dicit: Tempus meum prope est, apud te fácio Pascha cum discípulis meis.'
  "19": Et fecérunt discípuli sicut constítuit illis Iesus, et paravérunt Pascha.
  "20": Véspere autem facto, discumbébat cum duódecim discípulis suis.
  "21": 'Et edéntibus illis, dixit: Amen dico vobis, quia unus vestrum me traditúrus est.'
  "22": 'Et contristáti valde, cœpérunt sínguli dícere: Numquid ego sum Dómine?'
  "23": 'At ipse respóndens, ait: Qui intíngit mecum manum in parópside, hic me tradet.'
  "24": 'Fílius quidem hóminis vadit, sicut scriptum est de illo: væ autem hómini illi, per quem Fílius hóminis tradétur: bonum erat ei, si natus non fuísset homo ille.'
  "25": 'Respóndens autem Iudas, qui trádidit eum, dixit: Numquid ego sum Rabbi? Ait illi: Tu dixísti.'
  "26": 'Cœnántibus autem eis, accépit Iesus panem, et benedíxit, ac fregit, dedítque discípulis suis, et ait: Accípite, et comédite: hoc est corpus meum.'
  "27": 'Et accípiens cálicem, grátias egit: et dedit illis, dicens: Bíbite ex hoc omnes.'
  "28": Hic est enim sanguis meus novi testaménti, qui pro multis effundétur in remissiónem peccatórum.
  "29": 'Dico autem vobis: non bibam ámodo de hoc genímine vitis usque in diem illum, cum illud bibam vobíscum novum in regno Patris mei.'
  "30": Et hymno dicto, exiérunt in montem Olivéti.
  "31": 'Tunc dicit illis Iesus: Omnes vos scándalum patiémini in me in ista nocte. Scriptum est enim: Percútiam pastórem, et dispergéntur oves gregis.'
  "32": Postquam autem resurréxero, præcédam vos in Galilǽam.
  "33": 'Respóndens autem Petrus, ait illi: Et si omnes scandalizáti fúerint in te, ego numquam scandalizábor.'
  "34": 'Ait illi Iesus: Amen dico tibi, quia in hac nocte, ántequam gallus cantet, ter me negábis.'
  "35": 'Ait illi Petrus: Etiámsi oportúerit me mori tecum, non te negábo. Simíliter et omnes discípuli dixérunt.'
  "36": 'Tunc venit Iesus cum illis in villam, quæ dícitur Gethsémani, et dixit discípulis suis: Sedéte hic donec vadam illuc, et orem.'
  "37": Et assúmpto Petro, et duóbus fíliis Zebedǽi, cœpit contristári et mœstus esse.
  "38": 'Tunc ait illis: Tristis est ánima mea usque ad mortem: sustinéte hic, et vigiláte mecum.'
  "39": 'Et progréssus pusíllum, prócidit in fáciem suam, orans, et dicens: Pater mi, si possíbile est, tránseat a me calix iste: verúmtamen non sicut ego volo, sed sicut tu.'
  "40": 'Et venit ad discípulos suos, et invénit eos dormiéntes, et dicit Petro: Sic non potuístis una hora vigiláre mecum?'
  "41": Vigiláte, et oráte ut non intrétis in tentatiónem. Spíritus quidem promptus est, caro autem infírma.
  "42": 'Iterum secúndo ábiit, et orávit, dicens: Pater mi, si non potest hic calix transíre nisi bibam illum, fiat volúntas tua.'
  "43": 'Et venit íterum, et invénit eos dormiéntes: erant enim óculi eórum graváti.'
  "44": Et relíctis illis, íterum ábiit, et orávit tértio, eúmdem sermónem dicens.
  "45": 'Tunc venit ad discípulos suos, et dicit illis: Dormíte iam, et requiéscite: ecce appropinquávit hora, et Fílius hóminis tradétur in manus peccatórum.'
  "46": 'Súrgite, eámus: ecce appropinquávit qui me tradet.'
  "47": Adhuc eo loquénte, ecce Iudas unus de duódecim venit, et cum eo turba multa cum gládiis et fústibus, missi a princípibus sacerdótum, et senióribus pópuli.
  "48": 'Qui autem trádidit eum, dedit illis signum, dicens: Quemcúmque osculátus fúero, ipse est, tenéte eum.'
  "49": 'Et conféstim accédens ad Iesum, dixit: Ave Rabbi. Et osculátus est eum.'
  "50": 'Dixítque illi Iesus: Amíce, ad quid venísti? Tunc accessérunt, et manus iniecérunt in Iesum, et tenuérunt eum.'
  "51": Et ecce unus ex his, qui erant cum Iesu, exténdens manum, exémit gládium suum, et percútiens servum príncipis sacerdótum amputávit aurículam eius.
  "52": 'Tunc ait illi Iesus: Convérte gládium tuum in locum suum: omnes enim, qui accéperint gládium, gládio períbunt.'
  "53": An putas, quia non possum rogáre Patrem meum, et exhibébit mihi modo plus quam duódecim legiónes angelórum?
  "54": Quómodo ergo implebúntur Scriptúræ, quia sic opórtet fíeri?
  "55": 'In illa hora dixit Iesus turbis: Tamquam ad latrónem exístis cum gládiis, et fústibus comprehéndere me: quotídie apud vos sedébam docens in templo, et non me tenuístis.'
  "56": Hoc autem totum factum est, ut adimpleréntur Scriptúræ prophetárum. Tunc discípuli omnes, relícto eo, fugérunt.
  "57": At illi tenéntes Iesum, duxérunt ad Caípham príncipem sacerdótum, ubi scribæ et senióres convénerant.
  "58": Petrus autem sequebátur eum a longe, usque in átrium príncipis sacerdótum. Et ingréssus intro, sedébat cum minístris, ut vidéret finem.
  "59": 'Príncipes autem sacerdótum, et omne concílium, quærébant falsum testimónium contra Iesum, ut eum morti tráderent:'
  "60": et non invenérunt, cum multi falsi testes accessíssent. Novíssime autem venérunt duo falsi testes,
  "61": 'et dixérunt: Hic dixit: Possum destrúere templum Dei, et post tríduum reædificáre illud.'
  "62": 'Et surgens princeps sacerdótum, ait illi: Nihil respóndes ad ea, quæ isti advérsum te testificántur?'
  "63": 'Iesus autem tacébat. Et princeps sacerdótum ait illi: Adiúro te per Deum vivum, ut dicas nobis si tu es Christus Fílius Dei.'
  "64": 'Dicit illi Iesus: Tu dixísti. Verúmtamen dico vobis, ámodo vidébitis Fílium hóminis sedéntem a dextris virtútis Dei, et veniéntem in núbibus cæli.'
  "65": 'Tunc princeps sacerdótum scidit vestiménta sua, dicens: Blasphemávit: quid adhuc egémus téstibus? ecce nunc audístis blasphémiam:'
  "66": 'quid vobis vidétur? At illi respondéntes dixérunt: Reus est mortis.'
  "67": Tunc exspuérunt in fáciem eius, et cólaphis eum cecidérunt, álii autem palmas in fáciem eius dedérunt,
  "68": 'dicéntes: Prophetíza nobis Christe, quis est qui te percússit?'
  "69": 'Petrus vero sedébat foris in átrio: et accéssit ad eum una ancílla, dicens: Et tu cum Iesu Galilǽo eras.'
  "70": 'At ille negávit coram ómnibus, dicens: Néscio quid dicis.'
  "71": 'Exeúnte autem illo iánuam, vidit eum ália ancílla, et ait his, qui erant ibi: Et hic erat cum Iesu Nazaréno.'
  "72": 'Et íterum negávit cum iuraménto: Quia non novi hóminem.'
  "73": 'Et post pusíllum accessérunt qui stabant, et dixérunt Petro: Vere et tu ex illis es: nam et loquéla tua maniféstum te facit.'
  "74": Tunc cœpit detestári, et iuráre quia non novísset hóminem. Et contínuo gallus cantávit.
  "75": 'Et recordátus est Petrus verbi Iesu, quod díxerat: Priúsquam gallus cantet, ter me negábis. Et egréssus foras, flevit amáre.'
