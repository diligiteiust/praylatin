bible: vulgate
lang: la
language: Latina
book: Iudicum
chapter: "17"
verses:
  "1": Fuit eo témpore vir quidam de monte Ephraim nómine Michas,
  "2": 'qui dixit matri suæ: Mille et centum argénteos, quos separáveras tibi, et super quibus me audiénte iuráveras, ecce ego hábeo, et apud me sunt. Cui illa respóndit: Benedíctus fílius meus Dómino.'
  "3": 'Réddidit ergo eos matri suæ, quæ díxerat ei: Consecrávi et vovi hoc argéntum Dómino, ut de manu mea suscípiat fílius meus, et fáciat scúlptile atque conflátile: et nunc trado illud tibi.'
  "4": 'Réddidit ígitur eos matri suæ: quæ tulit ducéntos argénteos, et dedit eos argentário, ut fáceret ex eis scúlptile atque conflátile, quod fuit in domo Michæ.'
  "5": 'Qui ædículam quoque in ea deo separávit, et fecit ephod, et théraphim, id est, vestem sacerdotálem, et idóla: implevítque uníus filiórum suórum manum, et factus est ei sacérdos.'
  "6": In diébus illis non erat rex in Israel, sed unusquísque quod sibi rectum videbátur, hoc faciébat.
  "7": 'Fuit quoque alter adoléscens de Béthlehem Iuda, ex cognatióne eius: erátque ipse Levítes, et habitábat ibi.'
  "8": Egressúsque de civitáte Béthlehem, peregrinári vóluit ubicúmque sibi cómmodum reperísset. Cumque venísset in montem Ephraim, iter fáciens, et declinásset parúmper in domum Michæ,
  "9": 'interrogátus est ab eo unde venísset. Qui respóndit: Levíta sum de Béthlehem Iuda, et vado ut hábitem ubi potúero, et útile mihi esse perspéxero.'
  "10": 'Dixítque Michas: Mane apud me, et esto mihi parens ac sacérdos: dabóque tibi per annos síngulos decem argénteos, ac vestem dúplicem, et quæ ad victum sunt necessária.'
  "11": Acquiévit, et mansit apud hóminem, fuítque illi quasi unus de fíliis.
  "12": 'Implevítque Michas manum eius, et hábuit púerum sacerdótem apud se:'
  "13": Nunc scio, dicens, quod benefáciet mihi Deus habénti Levítici géneris sacerdótem.
