bible: vulgate
lang: la
language: Latina
book: Ezechiel
chapter: "30"
verses:
  "1": 'Et factum est verbum Dómini ad me, dicens:'
  "2": 'Fili hóminis prophéta, et dic: Hæc dicit Dóminus Deus: Ululáte, væ, væ diéi:'
  "3": 'quia iuxta est dies, et appropínquat dies Dómini: dies nubis, tempus géntium erit.'
  "4": 'Et véniet gládius in Ægýptum: et erit pavor in Æthiópia, cum cecíderint vulneráti in Ægýpto, et abláta fúerit multitúdo illíus, et destrúcta fundaménta eius.'
  "5": Æthiópia, et Líbya, et Lydi, et omne réliquum vulgus, et Chub, et fílii terræ fœ́deris, cum eis gládio cadent.
  "6": 'Hæc dicit Dóminus Deus: Et córruent fulciéntes Ægýptum, et destruétur supérbia impérii eius: a turre Syénes gládio cadent in ea, ait Dóminus Deus exercítuum.'
  "7": Et dissipabúntur in médio terrárum desolatárum, et urbes eius in médio civitátum desertárum erunt.
  "8": Et scient quia ego Dóminus, cum dédero ignem in Ægýpto, et attríti fúerint omnes auxiliatóres eius.
  "9": 'In die illa egrediéntur núntii a fácie mea in triéribus ad conteréndam Æthiópiæ confidéntiam: et erit pavor in eis in die Ægýpti, quia absque dúbio véniet.'
  "10": 'Hæc dicit Dóminus Deus: Cessáre fáciam multitúdinem Ægýpti in manu Nabuchodónosor regis Babylónis.'
  "11": 'Ipse et pópulus eius cum eo, fortíssimi géntium adducéntur ad disperdéndam terram: et evaginábunt gládios suos super Ægýptum, et implébunt terram interféctis.'
  "12": 'Et fáciam álveos flúminum áridos, et tradam terram in manus pessimórum: et dissipábo terram, et plenitúdinem eius manu alienórum, ego Dóminus locútus sum.'
  "13": 'Hæc dicit Dóminus Deus: Et dispérdam simulácra, et cessáre fáciam idóla de Memphis: et dux de terra Ægýpti non erit ámplius, et dabo terrórem in terra Ægýpti.'
  "14": Et dispérdam terram Phathúres, et dabo ignem in Taphnis, et fáciam iudícia in Alexandría.
  "15": Et effúndam indignatiónem meam super Pelúsium robur Ægýpti, et interfíciam multitúdinem Alexandríæ,
  "16": 'et dabo ignem in Ægýpto: quasi partúriens dolébit Pelúsium, et Alexandría erit dissipáta, et in Memphis angústiæ quotidiánæ.'
  "17": Iúvenes Heliopóleos et Bubásti gládio cadent, et ipsæ captívæ ducéntur.
  "18": 'Et in Taphnis nigréscet dies, cum contrívero ibi sceptra Ægýpti, et defécerit in ea supérbia poténtiæ eius: ipsam nubes opériet, fíliæ autem eius in captivitátem ducéntur.'
  "19": 'Et iudícia fáciam in Ægýpto: et scient quia ego Dóminus.'
  "20": 'Et factum est in undécimo anno, in primo mense, in séptima mensis: factum est verbum Dómini ad me, dicens:'
  "21": Fili hóminis bráchium Pharaónis regis Ægýpti confrégi, et ecce non est obvolútum ut restituerétur ei sánitas, ut ligarétur pannis, et fasciarétur lintéolis, ut recépto róbore posset tenére gládium.
  "22": 'Proptérea hæc dicit Dóminus Deus: Ecce ego ad Pharaónem regem Ægýpti, et commínuam bráchium eius forte, sed confráctum: et deíciam gládium de manu eius:'
  "23": et dispérgam Ægýptum in géntibus, et ventilábo eos in terris.
  "24": 'Et confortábo bráchia regis Babylónis, dabóque gládium meum in manu eius: et confríngam bráchia Pharaónis, et gement gemítibus interfécti coram fácie eius.'
  "25": 'Et confortábo bráchia regis Babylónis, et bráchia Pharaónis cóncident: et scient quia ego Dóminus, cum dédero gládium meum in manu regis Babylónis, et exténderit eum super terram Ægýpti.'
  "26": 'Et dispérgam Ægýptum in natiónes, et ventilábo eos in terras: et scient quia ego Dóminus.'
