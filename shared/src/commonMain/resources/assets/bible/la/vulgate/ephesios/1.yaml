bible: vulgate
lang: la
language: Latina
book: ad Ephesios
chapter: "1"
verses:
  "1": Paulus Apóstolus Iesu Christi per voluntátem Dei, ómnibus sanctis, qui sunt Ephesi, et fidélibus in Christo Iesu.
  "2": Grátia vobis, et pax a Deo Patre nostro, et Dómino Iesu Christo.
  "3": Benedíctus Deus et Pater Dómini nostri Iesu Christi, qui benedíxit nos in omni benedictióne spirituáli in cæléstibus in Christo,
  "4": sicut elégit nos in ipso ante mundi constitutiónem, ut essémus sancti et immaculáti in conspéctu eius in caritáte.
  "5": 'Qui prædestinávit nos in adoptiónem filiórum per Iesum Christum in ipsum: secúndum propósitum voluntátis suæ,'
  "6": in laudem glóriæ grátiæ suæ, in qua gratificávit nos in dilécto Fílio suo.
  "7": In quo habémus redemptiónem per sánguinem eius, remissiónem peccatórum secúndum divítias grátiæ eius,
  "8": 'quæ superabundávit in nobis in omni sapiéntia, et prudéntia:'
  "9": ut notum fáceret nobis sacraméntum voluntátis suæ, secúndum beneplácitum eius, quod propósuit in eo,
  "10": 'in dispensatióne plenitúdinis témporum, instauráre ómnia in Christo, quæ in cælis, et quæ in terra sunt, in ipso:'
  "11": 'in quo étiam et nos sorte vocáti sumus prædestináti secúndum propósitum eius, qui operátur ómnia secúndum consílium voluntátis suæ:'
  "12": 'ut simus in laudem glóriæ eius nos, qui ante sperávimus in Christo:'
  "13": in quo et vos, cum audissétis verbum veritátis, Evangélium salútis vestræ, in quo et credéntes signáti estis Spíritu promissiónis sancto,
  "14": qui est pignus hereditátis nostræ, in redemptiónem acquisitiónis, in laudem glóriæ ipsíus.
  "15": Proptérea et ego áudiens fidem vestram, quæ est in Dómino Iesu, et dilectiónem in omnes sanctos,
  "16": 'non cesso grátias agens pro vobis, memóriam vestri fáciens in oratiónibus meis:'
  "17": 'ut Deus Dómini nostri Iesu Christi, Pater glóriæ, det vobis spíritum sapiéntiæ et revelatiónis, in agnitióne eius:'
  "18": illuminátos óculos cordis vestri, ut sciátis quæ sit spes vocatiónis eius, et quæ divítiæ glóriæ hereditátis eius in sanctis,
  "19": et quæ sit superéminens magnitúdo virtútis eius in nos, qui crédimus secúndum operatiónem poténtiæ virtútis eius,
  "20": 'quam operátus est in Christo, súscitans illum a mórtuis, et constítuens ad déxteram suam in cæléstibus:'
  "21": supra omnem principátum, et potestátem, et virtútem, et dominatiónem, et omne nomen, quod nominátur non solum in hoc sǽculo, sed étiam in futúro.
  "22": 'Et ómnia subiécit sub pédibus eius: et ipsum dedit caput supra omnem Ecclésiam,'
  "23": quæ est corpus ipsíus, et plenitúdo eius, qui ómnia in ómnibus adimplétur.
