bible: vulgate
lang: la
language: Latina
book: I Samuelis
chapter: "11"
verses:
  "1": 'Et factum est quasi post mensem, ascéndit Naas Ammonítes, et pugnáre cœpit advérsum Iabes Gálaad. Dixerúntque omnes viri Iabes ad Naas: Habéto nos fœderátos, et serviémus tibi.'
  "2": 'Et respóndit ad eos Naas Ammonítes: In hoc fériam vobíscum fœdus, ut éruam ómnium vestrum óculos dextros, ponámque vos oppróbrium in univérso Israel.'
  "3": 'Et dixérunt ad eum senióres Iabes: Concéde nobis septem dies, ut mittámus núntios ad univérsos términos Israel, et si non fúerit qui deféndat nos, egrediémur ad te.'
  "4": 'Venérunt ergo núntii in Gábaa Saulis: et locúti sunt verba hæc, audiénte pópulo: et levávit omnis pópulus vocem suam, et flevit.'
  "5": 'Et ecce Saul veniébat, sequens boves de agro, et ait: Quid habet pópulus quod plorat? Et narravérunt ei verba virórum Iabes.'
  "6": Et insilívit Spíritus Dómini in Saul cum audísset verba hæc, et irátus est furor eius nimis.
  "7": 'Et assúmens utrúmque bovem, concídit in frusta, misítque in omnes términos Israel per manum nuntiórum, dicens: Quicúmque non exíerit, et secútus fúerit Saul et Sámuel, sic fiet bobus eius. Invásit ergo timor Dómini pópulum, et egréssi sunt quasi vir unus.'
  "8": 'Et recénsuit eos in Bezech: fuerúntque filiórum Israel trecénta míllia, virórum autem Iuda trigínta míllia.'
  "9": 'Et dixérunt núntiis, qui vénerant: Sic dicétis viris, qui sunt in Iabes Gálaad: Cras erit vobis salus, cum incalúerit sol. Venérunt ergo núntii, et annuntiavérunt viris Iabes: qui lætáti sunt.'
  "10": 'Et dixérunt: Mane exíbimus ad vos: et faciétis nobis omne quod placúerit vobis.'
  "11": 'Et factum est, cum dies crástinus venísset, constítuit Saul pópulum in tres partes: et ingréssus est média castra in vigília matutína, et percússit Ammon usque dum incalésceret dies: réliqui autem dispérsi sunt, ita ut non relinqueréntur in eis duo páriter.'
  "12": 'Et ait pópulus ad Samuélem: Quis est iste qui dixit: Saul num regnábit super nos? Date viros, et interficiémus eos.'
  "13": 'Et ait Saul: Non occidétur quisquam in die hac, quia hódie fecit Dóminus salútem in Israel.'
  "14": 'Dixit autem Sámuel ad pópulum: Veníte, et eámus in Gálgala, et innovémus ibi regnum.'
  "15": Et perréxit omnis pópulus in Gálgala, et fecérunt ibi regem Saul coram Dómino in Gálgala, et immolavérunt ibi víctimas pacíficas coram Dómino. Et lætátus est ibi Saul, et cuncti viri Israel nimis.
