bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "64"
verses:
  "1": In finem, Psalmus David, Cánticum Ieremíæ et Ezechiélis pópulo transmigratiónis, cum incíperent exíre.
  "2": 'Te decet hymnus Deus in Sion: et tibi reddétur votum in Ierúsalem.'
  "3": 'Exáudi oratiónem meam: ad te omnis caro véniet.'
  "4": 'Verba iniquórum prævaluérunt super nos: et impietátibus nostris tu propitiáberis.'
  "5": 'Beátus, quem elegísti, et assumpsísti: inhabitábit in átriis tuis. Replébimur in bonis domus tuæ: sanctum est templum tuum,'
  "6": mirábile in æquitáte. Exáudi nos Deus salutáris noster, spes ómnium fínium terræ, et in mari longe.
  "7": 'Prǽparans montes in virtúte tua, accínctus poténtia:'
  "8": qui contúrbas profúndum maris, sonum flúctuum eius. Turbabúntur gentes,
  "9": 'et timébunt qui hábitant términos a signis tuis: éxitus matutíni et véspere delectábis.'
  "10": 'Visitásti terram, et inebriásti eam: multiplicásti locupletáre eam. Flumen Dei replétum est aquis, parásti cibum illórum: quóniam ita est præparátio eius.'
  "11": 'Rivos eius inébria, multíplica genímina eius: in stillicídiis eius lætábitur gérminans.'
  "12": 'Benedíces corónæ anni benignitátis tuæ: et campi tui replebúntur ubertáte.'
  "13": 'Pinguéscent speciósa desérti: et exsultatióne colles accingéntur.'
  "14": 'Indúti sunt aríetes óvium, et valles abundábunt fruménto: clamábunt, étenim hymnum dicent.'
