bible: vulgate
lang: la
language: Latina
book: I Samuelis
chapter: "26"
verses:
  "1": 'Et venérunt Ziphǽi ad Saul in Gábaa, dicéntes: Ecce David abscónditus est in colle Háchila, quæ est ex advérso solitúdinis.'
  "2": Et surréxit Saul, et descéndit in desértum Ziph, et cum eo tria míllia virórum de eléctis Israel, ut quǽreret David in desérto Ziph.
  "3": 'Et castrametátus est Saul in Gábaa Háchila, quæ erat ex advérso solitúdinis in via: David autem habitábat in desérto. Videns autem quod venísset Saul post se in desértum,'
  "4": misit exploratóres, et dídicit quod illuc venísset certíssime.
  "5": 'Et surréxit David clam, et venit ad locum ubi erat Saul: cumque vidísset locum, in quo dormiébat Saul, et Abner fílius Ner, princeps milítiæ eius, et Saulem dormiéntem in tentório, et réliquum vulgus per circúitum eius,'
  "6": 'ait David ad Achímelech Hethǽum, et Abísai fílium Sárviæ fratrem Ioab, dicens: Quis descéndet mecum ad Saul in castra? Dixítque Abísai: Ego descéndam tecum.'
  "7": 'Venérunt ergo David, et Abísai ad pópulum nocte, et invenérunt Saul iacéntem et dormiéntem in tentório, et hastam fixam in terra ad caput eius: Abner autem et pópulum dormiéntes in circúitu eius.'
  "8": 'Dixítque Abísai ad David: Conclúsit Deus inimícum tuum hódie in manus tuas: nunc ergo perfódiam eum láncea in terra semel, et secúndo opus non erit.'
  "9": 'Et dixit David ad Abísai: Ne interfícias eum: quis enim exténdet manum suam in christum Dómini, et ínnocens erit?'
  "10": 'Et dixit David: Vivit Dóminus, quia nisi Dóminus percússerit eum, aut dies eius vénerit ut moriátur, aut in prœ́lium descéndens períerit:'
  "11": 'propítius sit mihi Dóminus ne exténdam manum meam in christum Dómini: nunc ígitur tolle hastam, quæ est ad caput eius, et scyphum aquæ, et abeámus.'
  "12": 'Tulit ígitur David hastam, et scyphum aquæ, qui erat ad caput Saul, et abiérunt: et non erat quisquam qui vidéret, et intellígeret, et evigiláret, sed omnes dormiébant, quia sopor Dómini irrúerat super eos.'
  "13": Cumque transísset David ex advérso, et stetísset in vértice montis de longe, et esset grande intervállum inter eos,
  "14": 'clamávit David ad pópulum, et ad Abner fílium Ner, dicens: Nonne respondébis, Abner? Et respóndens Abner, ait: Quis es tu, qui clamas, et inquiétas regem?'
  "15": 'Et ait David ad Abner: Numquid non vir tu es? et quis álius símilis tui in Israel? quare ergo non custodísti dóminum tuum regem? ingréssus est enim unus de turba ut interfíceret regem, dóminum tuum.'
  "16": 'Non est bonum hoc, quod fecísti: vivit Dóminus, quóniam fílii mortis estis vos, qui non custodístis dóminum vestrum, christum Dómini: nunc ergo vide ubi sit hasta regis, et ubi sit scyphus aquæ, qui erat ad caput eius.'
  "17": 'Cognóvit autem Saul vocem David, et dixit: Numquid vox hæc tua, fili mi David? Et ait David: Vox mea, dómine mi rex.'
  "18": 'Et ait: Quam ob causam dóminus meus perséquitur servum suum? Quid feci? aut quod est malum in manu mea?'
  "19": 'Nunc ergo audi, oro, dómine mi rex, verba servi tui: Si Dóminus íncitat te advérsum me, odorétur sacrifícium: si autem fílii hóminum, maledícti sunt in conspéctu Dómini: qui eiecérunt me hódie, ut non hábitem in hereditáte Dómini, dicéntes: Vade, servi diis aliénis.'
  "20": 'Et nunc non effundátur sanguis meus in terram coram Dómino: quia egréssus est rex Israel ut quærat púlicem unum, sicut perséquitur perdix in móntibus.'
  "21": 'Et ait Saul: Peccávi, revértere fili mi David: nequáquam enim ultra tibi malefáciam, eo quod pretiósa fúerit ánima mea in óculis tuis hódie: appáret enim quod stulte égerim, et ignoráverim multa nimis.'
  "22": 'Et respóndens David, ait: Ecce hasta regis: tránseat unus de púeris regis, et tollat eam.'
  "23": 'Dóminus autem retríbuet unicuíque secúndum iustítiam suam et fidem: trádidit enim te Dóminus hódie in manum meam, et nólui exténdere manum meam in christum Dómini.'
  "24": Et sicut magnificáta est ánima tua hódie in óculis meis, sic magnificétur ánima mea in óculis Dómini, et líberet me de omni angústia.
  "25": 'Ait ergo Saul ad David: Benedíctus tu fili mi David: et quidem fáciens fácies, et potens póteris. Abiit autem David in viam suam, et Saul revérsus est in locum suum.'
