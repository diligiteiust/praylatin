bible: vulgate
lang: la
language: Latina
book: Ecclesiasticus
chapter: "22"
verses:
  "1": 'In lápide lúteo lapidátus est piger: et omnes loquéntur super aspernatiónem illíus.'
  "2": 'De stércore boum lapidátus est piger: et omnis, qui tetígerit eum, excútiet manus.'
  "3": 'Confúsio patris est de fílio indisciplináto: fília autem in deminoratióne fiet.'
  "4": 'Fília prudens heréditas viro suo: nam quæ confúndit, in contuméliam fit genitóris.'
  "5": 'Patrem et virum confúndit audax, et ab ímpiis non minorábitur: ab utrísque autem inhonorábitur.'
  "6": 'Música in luctu importúna narrátio: flagélla et doctrína in omni témpore sapiéntia.'
  "7": Qui docet fátuum, quasi qui conglútinat testam.
  "8": Qui narrat verbum non audiénti, quasi qui éxcitat dormiéntem de gravi somno.
  "9": 'Cum dormiénte lóquitur qui enárrat stulto sapiéntiam: et in fine narratiónis dicit: Quis est hic?'
  "10": 'Supra mórtuum plora, defécit enim lux eius: et supra fátuum plora, defécit enim sensus.'
  "11": Módicum plora super mórtuum, quóniam requiévit.
  "12": Nequíssimi enim nequíssima vita super mortem fátui.
  "13": 'Luctus mórtui septem dies: fátui autem et ímpii omnes dies vitæ illórum.'
  "14": Cum stulto ne multum loquáris, et cum insensáto ne abíeris.
  "15": Serva te ab illo, ut non moléstiam hábeas, et non coinquináberis peccáto illíus.
  "16": Deflécte ab illo, et invénies réquiem, et non acediáberis in stultítia illíus.
  "17": Super plumbum quid gravábitur? et quod illi áliud nomen quam fátuus?
  "18": Arénam, et salem, et massam ferri facílius est ferre quam hóminem imprudéntem, et fátuum, et ímpium.
  "19": 'Loraméntum lígneum colligátum in fundaménto ædifícii non dissolvétur: sic et cor confirmátum in cogitatióne consílii.'
  "20": Cogitátus sensáti in omni témpore metu non depravábitur.
  "21": 'Sicut pali in excélsis, et cæménta sine impénsa pósita contra fáciem venti non permanébunt:'
  "22": sic et cor tímidum in cogitatióne stulti contra ímpetum timóris non resístet.
  "23": Sicut cor trépidum in cogitatióne fátui, omni témpore non métuet, sic et qui in præcéptis Dei pérmanet semper.
  "24": Pungens óculum dedúcit lácrymas, et qui pungit cor profert sensum.
  "25": 'Mittens lápidem in volatília, deíciet illa: sic et qui conviciátur amíco, dissólvit amicítiam.'
  "26": 'Ad amícum etsi prodúxeris gládium, non despéres: est enim regréssus. Ad amícum'
  "27": 'si aperúeris os triste, non tímeas: est enim concordátio: excépto convítio, et impropério, et supérbia, et mystérii revelatióne, et plaga dolósa: in his ómnibus effúgiet amícus.'
  "28": Fidem pósside cum amíco in paupertáte illíus, ut et in bonis illíus lætéris.
  "29": In témpore tribulatiónis illíus pérmane illi fidélis, ut et in hereditáte illíus cohǽres sis.
  "30": 'Ante ignem camíni vapor, et fumus ignis inaltátur: sic et ante sánguinem maledícta, et contuméliæ, et minæ.'
  "31": 'Amícum salutáre non confúndar, a fácie illíus non me abscóndam: et si mala mihi evénerint per illum, sustinébo.'
  "32": Omnis qui áudiet, cavébit se ab eo.
  "33": Quis dabit ori meo custódiam, et super lábia mea signáculum certum, ut non cadam ab ipsis, et lingua mea perdat me?
