bible: vulgate
lang: la
language: Latina
book: II Regum
chapter: "21"
verses:
  "1": 'Duódecim annórum erat Manásses cum regnáre cœpísset, et quinquagínta quinque annis regnávit in Ierúsalem: nomen matris eius Haphsíba.'
  "2": Fecítque malum in conspéctu Dómini, iuxta idóla géntium, quas delévit Dóminus a fácie filiórum Israel.
  "3": 'Conversúsque est, et ædificávit excélsa, quæ dissipáverat Ezechías pater eius: et eréxit aras Baal, et fecit lucos sicut fécerat Achab rex Israel, et adorávit omnem milítiam cæli, et cóluit eam.'
  "4": 'Exstruxítque aras in domo Dómini, de qua dixit Dóminus: In Ierúsalem ponam nomen meum.'
  "5": Et exstrúxit altária univérsæ milítiæ cæli in duóbus átriis templi Dómini.
  "6": 'Et tradúxit fílium suum per ignem: et ariolátus est, et observávit augúria, et fecit pythónes, et arúspices multiplicávit, ut fáceret malum coram Dómino, et irritáret eum.'
  "7": 'Pósuit quoque idólum luci, quem fécerat in templo Dómini, super quod locútus est Dóminus ad David, et ad Salomónem fílium eius: In templo hoc, et in Ierúsalem, quam elégi de cunctis tríbubus Israel, ponam nomen meum in sempitérnum.'
  "8": 'Et ultra non fáciam commovéri pedem Israel de terra, quam dedi pátribus eórum: si tamen custodíerint ópere ómnia quæ præcépi eis, et univérsam legem, quam mandávit eis servus meus Móyses.'
  "9": 'Illi vero non audiérunt: sed sedúcti sunt a Manásse, ut fácerent malum super gentes, quas contrívit Dóminus a fácie filiórum Israel.'
  "10": 'Locutúsque est Dóminus in manu servórum suórum prophetárum, dicens:'
  "11": 'Quia fecit Manásses rex Iuda abominatiónes istas péssimas, super ómnia quæ fecérunt Amorrhǽi ante eum, et peccáre fecit étiam Iudam in immundítiis suis:'
  "12": 'proptérea hæc dicit Dóminus Deus Israel: Ecce ego indúcam mala super Ierúsalem et Iudam: ut quicúmque audíerit, tínniant ambæ aures eius.'
  "13": 'Et exténdam super Ierúsalem funículum Samaríæ, et pondus domus Achab: et delébo Ierúsalem, sicut deléri solent tábulæ: et delens vertam, et ducam crébrius stylum super fáciem eius.'
  "14": 'Dimíttam vero relíquias hereditátis meæ, et tradam eas in manus inimicórum eius, erúntque in vastitátem, et in rapínam cunctis adversáriis suis:'
  "15": eo quod fécerint malum coram me, et perseveráverint irritántes me, ex die qua egréssi sunt patres eórum ex Ægýpto usque ad hanc diem.
  "16": 'Insuper et sánguinem innóxium fudit Manásses multum nimis, donec impléret Ierúsalem usque ad os: absque peccátis suis, quibus peccáre fecit Iudam, ut fáceret malum coram Dómino.'
  "17": Réliqua autem sermónum Manásse, et univérsa quæ fecit, et peccátum eius, quod peccávit, nonne hæc scripta sunt in Libro sermónum diérum regum Iuda?
  "18": 'Dormivítque Manásses cum pátribus suis, et sepúltus est in horto domus suæ, in horto Oza: et regnávit Amon fílius eius pro eo.'
  "19": 'Vigínti duórum annórum erat Amon cum regnáre cœpísset: duóbus quoque annis regnávit in Ierúsalem: nomen matris eius Messálemeth fília Harus de Iéteba.'
  "20": Fecítque malum in conspéctu Dómini, sicut fécerat Manásses pater eius.
  "21": 'Et ambulávit in omni via, per quam ambuláverat pater eius: servivítque immundítiis, quibus servíerat pater eius, et adorávit eas,'
  "22": et derelíquit Dóminum Deum patrum suórum, et non ambulávit in via Dómini.
  "23": Tetenderúntque ei insídias servi sui, et interfecérunt regem in domo sua.
  "24": 'Percússit autem pópulus terræ omnes, qui coniuráverant contra regem Amon: et constituérunt sibi regem Iosíam fílium eius pro eo.'
  "25": Réliqua autem sermónum Amon quæ fecit, nonne hæc scripta sunt in Libro sermónum diérum regum Iuda?
  "26": 'Sepelierúntque eum in sepúlcro suo, in horto Oza: et regnávit Iosías fílius eius pro eo.'
