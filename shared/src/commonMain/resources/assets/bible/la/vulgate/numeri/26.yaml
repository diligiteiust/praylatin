bible: vulgate
lang: la
language: Latina
book: Numeri
chapter: "26"
verses:
  "1": 'Postquam noxiórum sanguis effúsus est, dixit Dóminus ad Móysen et Eleázarum fílium Aaron sacerdótem:'
  "2": Numeráte omnem summam filiórum Israel a vigínti annis et supra, per domos et cognatiónes suas, cunctos, qui possunt ad bella procédere.
  "3": Locúti sunt ítaque Móyses et Eleázar sacérdos, in campéstribus Moab super Iordánem contra Iéricho, ad eos, qui erant
  "4": 'a vigínti annis et supra, sicut Dóminus imperáverat, quorum iste est númerus:'
  "5": 'Ruben primogénitus Israel: huius fílius, Henoch, a quo família Henochitárum: et Phallu, a quo família Phalluitárum:'
  "6": 'et Hesron, a quo família Hesronitárum: et Charmi, a quo família Charmitárum.'
  "7": 'Hæ sunt famíliæ de stirpe Ruben: quarum númerus invéntus est quadragínta tria míllia, et septingénti trigínta.'
  "8": 'Fílius Phallu, Eliab:'
  "9": 'huius fílii, Námuel et Dathan et Abiron: isti sunt Dathan et Abiron príncipes pópuli, qui surrexérunt contra Móysen et Aaron in seditióne Core, quando advérsus Dóminum rebellavérunt:'
  "10": et apériens terra os suum devorávit Core, moriéntibus plúrimis, quando combússit ignis ducéntos quinquagínta viros. Et factum est grande miráculum,
  "11": ut, Core pereúnte, fílii illíus non perírent.
  "12": 'Fílii Símeon per cognatiónes suas: Námuel, ab hoc família Namuelitárum: Iamin, ab hoc família Iaminitárum: Iachin, ab hoc família Iachinitárum:'
  "13": 'Zare, ab hoc família Zareitárum: Saul, ab hoc família Saulitárum.'
  "14": Hæ sunt famíliæ de stirpe Símeon, quarum omnis númerus fuit vigínti duo míllia ducénti.
  "15": 'Fílii Gad per cognatiónes suas: Sephon, ab hoc família Sephonitárum: Aggi, ab hoc família Aggitárum: Suni, ab hoc família Sunitárum:'
  "16": 'Ozni, ab hoc família Oznitárum: Her, ab hoc família Heritárum:'
  "17": 'Arod, ab hoc família Aroditárum: Ariel, ab hoc família Arielitárum.'
  "18": Istæ sunt famíliæ Gad, quarum omnis númerus fuit quadragínta míllia quingénti.
  "19": Fílii Iuda, Her, et Onan, qui ambo mórtui sunt in terra Chánaan.
  "20": 'Fuerúntque fílii Iuda per cognatiónes suas: Sela, a quo família Selaitárum: Phares, a quo família Pharesitárum: Zare, a quo família Zareitárum.'
  "21": 'Porro fílii Phares: Hesron, a quo família Hesronitárum: et Hamul, a quo família Hamulitárum.'
  "22": Istæ sunt famíliæ Iuda, quarum omnis númerus fuit septuagínta sex míllia quingénti.
  "23": 'Fílii Issachar per cognatiónes suas: Thola, a quo família Tholaitárum: Phua, a quo família Phuaitárum:'
  "24": 'Iasub, a quo família Iasubitárum: Semran, a quo família Semranitárum.'
  "25": Hæ sunt cognatiónes Issachar, quarum númerus fuit sexagínta quátuor míllia trecénti.
  "26": 'Fílii Zábulon per cognatiónes suas: Sared, a quo família Sareditárum: Elon, a quo família Elonitárum: Ialel, a quo família Ialelitárum.'
  "27": Hæ sunt cognatiónes Zábulon, quarum númerus fuit sexagínta míllia quingénti.
  "28": Fílii Ioseph per cognatiónes suas, Manásse et Ephraim.
  "29": De Manásse ortus est Machir, a quo família Machiritárum. Machir génuit Gálaad, a quo família Galaaditárum.
  "30": 'Gálaad hábuit fílios: Iezer, a quo família Iezeritárum: et Helec, a quo família Helecitárum:'
  "31": 'et Asriel, a quo família Asrielitárum: et Sechem, a quo família Sechemitárum:'
  "32": 'et Semída, a quo família Semidaitárum: et Hepher, a quo família Hepheritárum.'
  "33": 'Fuit autem Hepher pater Sálphaad, qui fílios non habébat, sed tantum fílias, quarum ista sunt nómina: Máala, et Noa, et Hegla, et Melcha, et Thersa.'
  "34": Hæ sunt famíliæ Manásse, et númerus eárum quinquagínta duo míllia septingénti.
  "35": 'Fílii autem Ephraim per cognatiónes suas fuérunt hi: Súthala, a quo família Suthalaitárum: Becher, a quo família Becheritárum: Thehen, a quo família Thehenitárum.'
  "36": Porro fílius Súthala fuit Heran, a quo família Heranitárum.
  "37": Hæ sunt cognatiónes filiórum Ephraim, quarum númerus fuit trigínta duo míllia quingénti.
  "38": 'Isti sunt fílii Ioseph per famílias suas. Fílii Béniamin in cognatiónibus suis: Bela, a quo família Belaitárum: Asbel, a quo família Asbelitárum: Ahiram, a quo família Ahiramitárum:'
  "39": 'Supham, a quo família Suphamitárum: Hupham, a quo família Huphamitárum.'
  "40": 'Fílii Bela: Hered, et Nóeman. De Hered, família Hereditárum: de Nóeman, família Noemanitárum.'
  "41": Hi sunt fílii Béniamin per cognatiónes suas, quorum númerus fuit quadragínta quinque míllia sexcénti.
  "42": 'Fílii Dan per cognatiónes suas: Suham, a quo família Suhamitárum. Hæ sunt cognatiónes Dan per famílias suas.'
  "43": Omnes fuére Suhamítæ, quorum númerus erat sexagínta quátuor míllia quadringénti.
  "44": 'Fílii Aser per cognatiónes suas: Iemna, a quo família Iemnaitárum: Iéssui, a quo família Iessuitárum: Brie, a quo família Brieitárum.'
  "45": 'Fílii Brie: Heber, a quo família Heberitárum: et Mélchiel, a quo família Melchielitárum.'
  "46": Nomen autem fíliæ Aser fuit Sara.
  "47": Hæ cognatiónes filiórum Aser, et númerus eórum quinquagínta tria míllia quadringénti.
  "48": 'Fílii Néphthali per cognatiónes suas: Iésiel, a quo família Iesielitárum: Guni, a quo família Gunitárum:'
  "49": 'Ieser, a quo família Ieseritárum: Sellem, a quo família Sellemitárum.'
  "50": 'Hæ sunt cognatiónes filiórum Néphthali per famílias suas: quorum númerus quadragínta quinque míllia quadringénti.'
  "51": Ista est summa filiórum Israel, qui recensíti sunt, sexcénta míllia, et mille septingénti trigínta.
  "52": 'Locutúsque est Dóminus ad Móysen, dicens:'
  "53": Istis dividétur terra iuxta númerum vocabulórum in possessiónes suas.
  "54": 'Plúribus maiórem partem dabis, et paucióribus minórem: síngulis, sicut nunc recensíti sunt, tradétur posséssio:'
  "55": ita dumtáxat ut sors terram tríbubus dívidat et famíliis.
  "56": Quidquid sorte contígerit, hoc vel plures accípiant, vel paucióres.
  "57": 'Hic quoque est númerus filiórum Levi per famílias suas: Gerson, a quo família Gersonitárum: Caath, a quo família Caathitárum: Merári, a quo família Meraritárum.'
  "58": 'Hæ sunt famíliæ Levi: Família Lobni, família Hebróni, família Móholi, família Musi, família Core. At vero Caath génuit Amram:'
  "59": qui hábuit uxórem Ióchabed fíliam Levi, quæ nata est ei in Ægýpto. Hæc génuit Amram viro suo fílios, Aaron et Móysen, et Maríam sorórem eórum.
  "60": 'De Aaron orti sunt Nadab et Abiu, et Eleázar et Ithamar:'
  "61": quorum Nadab et Abiu mórtui sunt, cum obtulíssent ignem aliénum coram Dómino.
  "62": 'Fuerúntque omnes, qui numeráti sunt, vigínti tria míllia géneris masculíni ab uno mense et supra: quia non sunt recensíti inter fílios Israel, nec eis cum céteris data posséssio est.'
  "63": 'Hic est númerus filiórum Israel, qui descrípti sunt a Móyse et Eleázaro sacerdóte, in campéstribus Moab supra Iordánem contra Iéricho:'
  "64": inter quos, nullus fuit eórum, qui ante numeráti sunt a Móyse et Aaron in desérto Sínai.
  "65": Prædíxerat enim Dóminus, quod omnes moreréntur in solitúdine. Nullúsque remánsit ex eis, nisi Caleb fílius Iéphone, et Iósue fílius Nun.
