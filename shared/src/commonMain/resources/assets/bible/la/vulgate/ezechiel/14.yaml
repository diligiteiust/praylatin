bible: vulgate
lang: la
language: Latina
book: Ezechiel
chapter: "14"
verses:
  "1": Et venérunt ad me viri seniórum Israel, et sedérunt coram me.
  "2": 'Et factus est sermo Dómini ad me, dicens:'
  "3": 'Fili hóminis, viri isti posuérunt immundítias suas in córdibus suis, et scándalum iniquitátis suæ statuérunt contra fáciem suam: numquid interrogátus respondébo eis?'
  "4": 'Propter hoc lóquere eis, et dices ad eos: Hæc dicit Dóminus Deus: Homo homo de domo Israel, qui posúerit immundítias suas in corde suo, et scándalum iniquitátis suæ statúerit contra fáciem suam, et vénerit ad prophétam intérrogans per eum me: ego Dóminus respondébo ei in multitúdine immunditiárum suárum:'
  "5": ut capiátur domus Israel in corde suo, quo recessérunt a me in cunctis idólis suis.
  "6": 'Proptérea dic ad domum Israel: Hæc dicit Dóminus Deus: Convertímini, et recédite ab idólis vestris, et ab univérsis contaminatiónibus vestris avértite fácies vestras.'
  "7": 'Quia homo homo de domo Israel, et de prosélytis quicúmque ádvena fúerit in Israel, si alienátus fúerit a me, et posúerit idóla sua in corde suo, et scándalum iniquitátis suæ statúerit contra fáciem suam, et vénerit ad prophétam ut intérroget per eum me: ego Dóminus respondébo ei per me.'
  "8": 'Et ponam fáciem meam super hóminem illum, et fáciam eum in exémplum et in provérbium, et dispérdam eum de médio pópuli mei: et sciétis quia ego Dóminus.'
  "9": 'Et prophéta cum erráverit, et locútus fúerit verbum: ego Dóminus decépi prophétam illum: et exténdam manum meam super illum, et delébo eum de médio pópuli mei Israel.'
  "10": 'Et portábunt iniquitátem suam: iuxta iniquitátem interrogántis, sic iníquitas prophétæ erit:'
  "11": 'ut non erret ultra domus Israel a me, neque polluátur in univérsis prævaricatiónibus suis: sed sint mihi in pópulum, et ego sim eis in Deum, ait Dóminus exercítuum.'
  "12": 'Et factus est sermo Dómini ad me, dicens:'
  "13": Fili hóminis, terra cum peccáverit mihi, ut prævaricétur præváricans, exténdam manum meam super eam, et cónteram virgam panis eius, et immíttam in eam famem, et interfíciam de ea hóminem et iuméntum.
  "14": 'Et si fúerint tres viri isti in médio eius, Noe, Dániel, et Iob: ipsi iustítia sua liberábunt ánimas suas, ait Dóminus exercítuum.'
  "15": 'Quod si et béstias péssimas indúxero super terram ut vastem eam, et fúerit ínvia, eo quod non sit pertránsiens propter béstias:'
  "16": 'tres viri isti si fúerint in ea, vivo ego, dicit Dóminus Deus, quia nec fílios, nec fílias liberábunt: sed ipsi soli liberabúntur, terra autem desolábitur.'
  "17": 'Vel si gládium indúxero super terram illam, et díxero gládio: Transi per terram: et interfécero de ea hóminem, et iuméntum:'
  "18": 'et tres viri isti fúerint in médio eius: vivo ego, dicit Dóminus Deus, non liberábunt fílios, neque fílias, sed ipsi soli liberabúntur.'
  "19": 'Si autem et pestiléntiam immísero super terram illam, et effúdero indignatiónem meam super eam in sánguine, ut áuferam ex ea hóminem et iuméntum:'
  "20": 'et Noe, et Dániel, et Iob fúerint in médio eius: vivo ego, dicit Dóminus Deus, quia fílium, et fíliam non liberábunt, sed ipsi iustítia sua liberábunt ánimas suas.'
  "21": 'Quóniam hæc dicit Dóminus Deus: Quod etsi quátuor iudícia mea péssima, gládium, et famem, ac béstias malas, et pestiléntiam immísero in Ierúsalem, ut interfíciam de ea hóminem, et pecus:'
  "22": 'tamen relinquétur in ea salvátio educéntium fílios, et fílias: ecce ipsi ingrediéntur ad vos, et vidébitis viam eórum, et adinventiónes eórum, et consolabímini super malo, quod indúxi in Ierúsalem in ómnibus, quæ importávi super eam.'
  "23": 'Et consolabúntur vos, cum vidéritis viam eórum, et adinventiónes eórum: et cognoscétis quod non frustra fécerim ómnia, quæ feci in ea, ait Dóminus Deus.'
