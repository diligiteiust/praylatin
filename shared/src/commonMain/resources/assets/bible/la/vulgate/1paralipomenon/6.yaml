bible: vulgate
lang: la
language: Latina
book: I Paralipomenon
chapter: "6"
verses:
  "1": 'Fílii Levi: Gerson, Caath, et Merári.'
  "2": 'Fílii Caath: Amram, Isaar, Hebron, et Oziel.'
  "3": 'Fílii Amram: Aaron, Móyses, et María. Fílii Aaron: Nadab et Abiu, Eleázar et Ithamar.'
  "4": Eleázar génuit Phínees, et Phínees génuit Abísue.
  "5": Abísue vero génuit Bocci, et Bocci génuit Ozi.
  "6": Ozi génuit Zaraíam, et Zaraías génuit Méraioth.
  "7": Porro Méraioth génuit Amaríam, et Amarías génuit Achitob.
  "8": Achitob génuit Sadoc, et Sadoc génuit Achímaas,
  "9": Achímaas génuit Azaríam, Azarías génuit Ióhanan,
  "10": 'Ióhanan génuit Azaríam: ipse est qui sacerdótio functus est in domo, quam ædificávit Sálomon in Ierúsalem.'
  "11": Génuit autem Azarías Amaríam, et Amarías génuit Achitob,
  "12": Achitob génuit Sadoc, et Sadoc génuit Sellum,
  "13": Sellum génuit Helcíam, et Helcías génuit Azaríam,
  "14": Azarías génuit Saraíam, et Saraías génuit Iósedec.
  "15": Porro Iósedec egréssus est, quando tránstulit Dóminus Iudam, et Ierúsalem per manus Nabuchodónosor.
  "16": 'Fílii ergo Levi: Gerson, Caath, et Merári.'
  "17": 'Et hæc nómina filiórum Gerson: Lobni, et Sémei.'
  "18": 'Fílii Caath: Amram, et Isaar, et Hebron, et Oziel.'
  "19": 'Fílii Merári: Móholi et Musi. Hæ autem cognatiónes Levi secúndum famílias eórum.'
  "20": 'Gersom: Lobni fílius eius, Iahath fílius eius, Zamma fílius eius,'
  "21": Ioah fílius eius, Addo fílius eius, Zara fílius eius, Iéthrai fílius eius.
  "22": 'Fílii Caath: Amínadab fílius eius, Core fílius eius, Asir fílius eius,'
  "23": Elcana fílius eius, Abíasaph fílius eius, Asir fílius eius,
  "24": Thahath fílius eius, Uriel fílius eius, Ozías fílius eius, Saul fílius eius.
  "25": Fílii Elcana, Amásai et Achimoth,
  "26": 'et Elcana: Fílii Elcana: Sóphai fílius eius, Nahath fílius eius,'
  "27": Eliab fílius eius, Iéroham fílius eius, Elcana fílius eius.
  "28": 'Fílii Sámuel: primogénitus Vásseni, et Abía.'
  "29": 'Fílii autem Merári, Móholi: Lobni fílius eius, Sémei fílius eius, Oza fílius eius,'
  "30": Sámmaa fílius eius, Haggía fílius eius, Asaía fílius eius.
  "31": 'Isti sunt, quos constítuit David super cantóres domus Dómini, ex quo collocáta est arca:'
  "32": 'et ministrábant coram tabernáculo testimónii, canéntes donec ædificáret Sálomon domum Dómini in Ierúsalem: stabant autem iuxta órdinem suum in ministério.'
  "33": Hi vero sunt, qui assistébant cum fíliis suis, de fíliis Caath, Heman cantor fílius Iohel, fílii Sámuel,
  "34": fílii Elcana, fílii Iéroham, fílii Eliel, fílii Thohu,
  "35": fílii Suph, fílii Elcana, fílii Mahath, fílii Amásai,
  "36": fílii Elcana, fílii Iohel, fílii Azaríæ, fílii Sophoníæ,
  "37": fílii Thahath, fílii Asir, fílii Abíasaph, fílii Core,
  "38": fílii Isaar, fílii Caath, fílii Levi, fílii Israel.
  "39": Et frater eius Asaph, qui stabat a dextris eius, Asaph fílius Barachíæ, fílii Sámaa,
  "40": fílii Míchael, fílii Basaíæ, fílii Melchíæ,
  "41": fílii Athánai, fílii Zara, fílii Adaía,
  "42": fílii Ethan, fílii Zamma, fílii Sémei,
  "43": fílii Ieth, fílii Gersom, fílii Levi.
  "44": Fílii autem Merári fratres eórum, ad sinístram, Ethan fílius Cusi, fílii Abdi, fílii Maloch,
  "45": fílii Hasabíæ, fílii Amasíæ, fílii Helcíæ,
  "46": fílii Amásai, fílii Boni, fílii Somer,
  "47": fílii Móholi, fílii Musi, fílii Merári, fílii Levi.
  "48": Fratres quoque eórum Levítæ, qui ordináti sunt in cunctum ministérium tabernáculi domus Dómini.
  "49": 'Aaron vero, et fílii eius adolébant incénsum super altáre holocáusti, et super altáre thymiámatis, in omne opus Sancti sanctórum: et ut precaréntur pro Israel iuxta ómnia, quæ præcéperat Móyses servus Dei.'
  "50": 'Hi sunt autem fílii Aaron: Eleázar fílius eius, Phínees fílius eius, Abísue fílius eius,'
  "51": Bocci fílius eius, Ozi fílius eius, Zarahía fílius eius,
  "52": Méraioth fílius eius, Amarías fílius eius, Achitob fílius eius,
  "53": Sadoc fílius eius, Achímaas fílius eius.
  "54": 'Et hæc habitácula eórum per vicos atque confínia, filiórum scílicet Aaron, iuxta cognatiónes Caathitárum: ipsis enim sorte contígerant.'
  "55": 'Dedérunt ígitur eis Hebron in terra Iuda, et suburbána eius per circúitum:'
  "56": agros autem civitátis, et villas, Caleb fílio Iéphone.
  "57": Porro fíliis Aaron dedérunt civitátes ad confugiéndum, Hebron, et Lobna, et suburbána eius,
  "58": Iether quoque, et Esthemo cum suburbánis suis, sed et Helon, et Dabir cum suburbánis suis,
  "59": Asan quoque, et Béthsemes, et suburbána eárum.
  "60": 'De tribu autem Béniamin, Gabée et suburbána eius, et Almath cum suburbánis suis, Anathoth quoque cum suburbánis suis: omnes civitátes, trédecim, per cognatiónes suas.'
  "61": Fíliis autem Caath resíduis de cognatióne sua dedérunt ex dimídia tribu Manásse in possessiónem urbes decem.
  "62": Porro fíliis Gersom per cognatiónes suas de tribu Issachar, et de tribu Aser, et de tribu Néphthali, et de tribu Manásse in Basan, urbes trédecim.
  "63": Fíliis autem Merári per cognatiónes suas de tribu Ruben, et de tribu Gad, et de tribu Zábulon, dedérunt sorte civitátes duódecim.
  "64": 'Dedérunt quoque fílii Israel Levítis civitátes, et suburbána eárum:'
  "65": dederúntque per sortem, ex tribu filiórum Iuda, et ex tribu filiórum Símeon, et ex tribu filiórum Béniamin urbes has, quas vocavérunt nomínibus suis,
  "66": et his, qui erant de cognatióne filiórum Caath, fuerúntque civitátes in términis eórum de tribu Ephraim.
  "67": Dedérunt ergo eis urbes ad confugiéndum, Sichem cum suburbánis suis in monte Ephraim, et Gazer cum suburbánis suis,
  "68": Iécmaam quoque cum suburbánis suis, et Béthoron simíliter,
  "69": necnon et Helon cum suburbánis suis, et Gethrémmon in eúmdem modum.
  "70": 'Porro ex dimídia tribu Manásse, Aner et suburbána eius, Bálaam et suburbána eius: his vidélicet, qui de cognatióne filiórum Caath réliqui erant.'
  "71": Fíliis autem Gersom de cognatióne dimídiæ tribus Manásse, Gaulon in Basan, et suburbána eius, et Astaroth cum suburbánis suis.
  "72": De tribu Issachar, Cedes et suburbána ejus, et Dábereth cum suburbánis suis,
  "73": Ramoth quoque et suburbána eius, et Anem cum suburbánis suis.
  "74": 'De tribu vero Aser: Masal cum suburbánis suis, et Abdon simíliter,'
  "75": Hucac quoque et suburbána eius, et Rohob cum suburbánis suis.
  "76": Porro de tribu Néphthali, Cedes in Galilǽa et suburbána eius, Hamon cum suburbánis suis, et Cariáthaim et suburbána eius.
  "77": 'Fíliis autem Merári resíduis: de tribu Zábulon, Rémmono et suburbána eius, et Thabor cum suburbánis suis:'
  "78": trans Iordánem quoque ex advérso Iéricho contra oriéntem Iordánis, de tribu Ruben, Bosor in solitúdine cum suburbánis suis, et Iassa cum suburbánis suis,
  "79": Cádemoth quoque et suburbána eius, et Méphaat cum suburbánis suis.
  "80": Necnon et de tribu Gad, Ramoth in Gálaad et suburbána eius, et Mánaim cum suburbánis suis,
  "81": sed et Hésebon cum suburbánis suis, et Iezer cum suburbánis suis.
