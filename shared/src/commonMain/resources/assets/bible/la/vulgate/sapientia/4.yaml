bible: vulgate
lang: la
language: Latina
book: Sapientia
chapter: "4"
verses:
  "1": 'O quam pulchra est casta generátio cum claritáte: immortális est enim memória illíus: quóniam et apud Deum nota est, et apud hómines.'
  "2": 'Cum præsens est, imitántur illam, et desíderant eam cum se edúxerit: et in perpétuum coronáta triúmphat, incoinquinatórum certáminum prǽmium vincens.'
  "3": Multígena autem impiórum multitúdo non erit útilis, et spúria vitulámina non dabunt radíces altas, nec stábile firmaméntum collocábunt.
  "4": Etsi in ramis in témpore germináverint, infírmiter pósita, a vento commovebúntur, et a nimietáte ventórum eradicabúntur.
  "5": 'Confringéntur enim rami inconsummáti: et fructus illórum inútiles et acérbi ad manducándum, et ad níhilum apti.'
  "6": Ex iníquis enim somnis fílii, qui nascúntur, testes sunt nequítiæ advérsus paréntes in interrogatióne sua.
  "7": Iustus autem si morte præoccupátus fúerit, in refrigério erit.
  "8": 'Senéctus enim venerábilis est non diutúrna, neque annórum número computáta: cani autem sunt sensus hóminis,'
  "9": et ætas senectútis vita immaculáta.
  "10": Placens Deo factus est diléctus, et vivens inter peccatóres translátus est.
  "11": Raptus est, ne malítia mutáret intelléctum eius, aut ne fíctio decíperet ánimam illíus.
  "12": Fascinátio enim nugacitátis obscúrat bona, et inconstántia concupiscéntiæ transvértit sensum sine malítia.
  "13": 'Consummátus in brevi, explévit témpora multa:'
  "14": 'plácita enim erat Deo ánima illíus: propter hoc properávit edúcere illum de médio iniquitátum. Pópuli autem vidéntes, et non intelligéntes, nec ponéntes in præcórdiis tália,'
  "15": quóniam grátia Dei et misericórdia est in sanctos eius, et respéctus in eléctos illíus.
  "16": Condémnat autem iustus mórtuus vivos ímpios, et iuvéntus celérius consummáta longam vitam iniústi.
  "17": Vidébunt enim finem sapiéntis, et non intélligent quid cogitáverit de illo Deus, et quare muníerit illum Dóminus.
  "18": 'Vidébunt, et contémnent eum: illos autem Dóminus irridébit.'
  "19": 'Et erunt post hæc decidéntes sine honóre, et in contumélia inter mórtuos in perpétuum: quóniam disrúmpet illos inflátos sine voce, et commovébit illos a fundaméntis, et usque ad suprémum desolabúntur, et erunt geméntes, et memória illórum períbit.'
  "20": Vénient in cogitatióne peccatórum suórum tímidi, et tradúcent illos ex advérso iniquitátes ipsórum.
