bible: vulgate
lang: la
language: Latina
book: Isaias
chapter: "4"
verses:
  "1": 'Et apprehéndent septem mulíeres virum unum in die illa, dicéntes: Panem nostrum comedémus, et vestiméntis nostris operiémur: tantúmmodo invocétur nomen tuum super nos, aufer oppróbrium nostrum.'
  "2": In die illa erit germen Dómini in magnificéntia, et glória, et fructus terræ sublímis, et exsultátio his, qui salváti fúerint de Israel.
  "3": 'Et erit: omnis qui relíctus fúerit in Sion, et resíduus in Ierúsalem, sanctus vocábitur, omnis qui scriptus est in vita in Ierúsalem.'
  "4": Si ablúerit Dóminus sordes filiárum Sion, et sánguinem Ierúsalem láverit de médio eius in spíritu iudícii, et spíritu ardóris.
  "5": 'Et creábit Dóminus super omnem locum montis Sion, et ubi invocátus est, nubem per diem, et fumum et splendórem ignis flammántis in nocte: super omnem enim glóriam protéctio.'
  "6": Et tabernáculum erit in umbráculum diéi ab æstu, et in securitátem, et absconsiónem a túrbine, et a plúvia.
