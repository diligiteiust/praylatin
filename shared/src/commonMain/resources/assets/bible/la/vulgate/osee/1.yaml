bible: vulgate
lang: la
language: Latina
book: Osee
chapter: "1"
verses:
  "1": 'Verbum Dómini, quod factum est ad Osée fílium Beéri, in diébus Ozíæ, Ióathan, Achaz, Ezechíæ, regum Iuda: et in diébus Ieróboam, fílii Ioas, regis Israel.'
  "2": 'Princípium loquéndi Dómino in Osée: et dixit Dóminus ad Osée: Vade, sume tibi uxórem fornicatiónum, et fac tibi fílios fornicatiónum: quia fórnicans fornicábitur terra a Dómino.'
  "3": 'Et ábiit, et accépit Gomer, fíliam Debélaim: et concépit, et péperit ei fílium.'
  "4": 'Et dixit Dóminus ad eum: Voca nomen eius Iézrahel, quóniam adhuc módicum, et visitábo sánguinem Iézrahel super domum Iehu, et quiéscere fáciam regnum domus Israel.'
  "5": Et in illa die cónteram arcum Israel in valle Iézrahel.
  "6": 'Et concépit adhuc, et péperit fíliam. Et dixit ei: Voca nomen eius Absque misericórdia: quia non addam ultra miseréri dómui Israel, sed oblivióne oblivíscar eórum.'
  "7": 'Et dómui Iuda miserébor, et salvábo eos in Dómino Deo suo: et non salvábo eos in arcu, et gládio, et in bello, et in equis, et in equítibus.'
  "8": Et ablactávit eam, quæ erat Absque misericórdia. Et concépit, et péperit fílium.
  "9": 'Et dixit: Voca nomen eius Non pópulus meus: quia vos non pópulus meus, et ego non ero vester.'
  "10": 'Et erit númerus filiórum Israel quasi aréna maris, quæ sine mensúra est, et non numerábitur. Et erit in loco ubi dicétur eis: Non pópulus meus vos: dicétur eis: Fílii Dei vivéntis.'
  "11": 'Et congregabúntur fílii Iuda, et fílii Israel páriter: et ponent sibímet caput unum, et ascéndent de terra: quia magnus dies Iézrahel.'
