bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "16"
verses:
  "1": 'Orátio David. Exáudi Dómine iustítiam meam: inténde deprecatiónem meam. Auribus pércipe oratiónem meam, non in lábiis dolósis.'
  "2": 'De vultu tuo iudícium meum pródeat: óculi tui vídeant æquitátes.'
  "3": 'Probásti cor meum, et visitásti nocte: igne me examinásti, et non est invénta in me iníquitas.'
  "4": 'Ut non loquátur os meum ópera hóminum: propter verba labiórum tuórum, ego custodívi vias duras.'
  "5": 'Pérfice gressus meos in sémitis tuis: ut non moveántur vestígia mea.'
  "6": 'Ego clamávi, quóniam exaudísti me Deus: inclína aurem tuam mihi, et exáudi verba mea.'
  "7": Mirífica misericórdias tuas, qui salvos facis sperántes in te.
  "8": 'A resisténtibus déxteræ tuæ custódi me, ut pupíllam óculi. Sub umbra alárum tuárum prótege me:'
  "9": 'a fácie impiórum qui me afflixérunt. Inimíci mei ánimam meam circumdedérunt:'
  "10": 'ádipem suum conclusérunt: os eórum locútum est supérbiam.'
  "11": 'Proiciéntes me nunc circumdedérunt me: óculos suos statuérunt declináre in terram.'
  "12": Suscepérunt me sicut leo parátus ad prædam, et sicut cátulus leónis hábitans in ábditis.
  "13": 'Exsúrge Dómine, prǽveni eum, et supplánta eum: éripe ánimam meam ab ímpio, frámeam tuam'
  "14": 'ab inimícis manus tuæ. Dómine a paucis de terra dívide eos in vita eórum: de abscónditis tuis adimplétus est venter eórum. Saturáti sunt fíliis, et dimisérunt relíquias suas párvulis suis.'
  "15": 'Ego autem in iustítia apparébo conspéctui tuo: satiábor cum apparúerit glória tua.'
