bible: vulgate
lang: la
language: Latina
book: II Machabaeorum
chapter: "10"
verses:
  "1": 'Machabǽus autem, et qui cum eo erant, Dómino se protegénte, templum quidem, et civitátem recépit:'
  "2": 'aras autem, quas alienígenæ per platéas exstrúxerant, itémque delúbra demolítus est:'
  "3": et purgáto templo, áliud altáre fecérunt, et de ignítis lapídibus igne concépto sacrifícia obtulérunt post biénnium, et incénsum, et lucérnas, et panes propositiónis posuérunt.
  "4": 'Quibus gestis, rogábant Dóminum prostráti in terram, ne ámplius tálibus malis incíderent: sed et, si quando peccássent, ut ab ipso mítius corriperéntur, et non bárbaris, ac blasphémis homínibus traderéntur.'
  "5": Qua die autem templum ab alienígenis pollútum fúerat, cóntigit eádem die purificatiónem fíeri, vigésima quinta mensis, qui fuit Casleu.
  "6": Et cum lætítia diébus octo egérunt in modum tabernaculórum, recordántes quod ante módicum témporis diem solémnem tabernaculórum in móntibus, et in spelúncis more bestiárum égerant.
  "7": Propter quod thyrsos, et ramos vírides, et palmas præferébant ei, qui prosperávit mundári locum suum.
  "8": Et decrevérunt commúni præcépto, et decréto, univérsæ genti Iudæórum ómnibus annis ágere dies istos.
  "9": Et Antíochi quidem, qui appellátus est Nóbilis, vitæ excéssus ita se hábuit.
  "10": Nunc autem de Eupátore Antíochi ímpii fílio, quæ gesta sunt narrábimus, breviántes mala, quæ in bellis gesta sunt.
  "11": Hic enim suscépto regno, constítuit super negótia regni Lýsiam quemdam, Phœnícis, et Sýriæ milítiæ príncipem.
  "12": Nam Ptolemǽus, qui dicebátur Macer, iusti tenax erga Iudǽos esse constítuit, et præcípue propter iniquitátem, quæ facta erat in eos, et pacífice ágere cum eis.
  "13": Sed ob hoc accusátus ab amícis apud Eupátorem, cum frequénter próditor audíret, eo quod Cyprum créditam sibi a Philométore deseruísset, et ad Antíochum Nóbilem translátus étiam ab eo recessísset, venéno vitam finívit.
  "14": Górgias autem, cum esset dux locórum, assúmptis ádvenis, frequénter Iudǽos debellábat.
  "15": Iudǽi vero, qui tenébant opportúnas munitiónes, fugátos ab Ierosólymis suscipiébant, et belláre tentábant.
  "16": 'Hi vero, qui erant cum Machabǽo, per oratiónes Dóminum rogántes ut esset sibi adiútor, ímpetum fecérunt in munitiónes Idumæórum:'
  "17": multáque vi insisténtes, loca obtinuérunt, occurréntes interemérunt, et omnes simul non minus vigínti míllibus trucidavérunt.
  "18": Quidam autem cum confugíssent in duas turres valde munítas, omnem apparátum ad repugnándum habéntes,
  "19": Machabǽus ad eórum expugnatiónem relícto Simóne, et Iosépho, itémque Zachǽo, eísque qui cum ipsis erant satis multis, ipse ad eas, quæ ámplius perurgébant, pugnas convérsus est.
  "20": 'Hi vero, qui cum Simóne erant, cupiditáte ducti, a quibúsdam, qui in túrribus erant, suási sunt pecúnia: et septuagínta míllibus dídrachmis accéptis, dimisérunt quosdam effúgere.'
  "21": Cum autem Machabǽo nuntiátum esset quod factum est, princípibus pópuli congregátis, accusávit, quod pecúnia fratres vendidíssent, adversáriis eórum dimíssis.
  "22": Hos ígitur proditóres factos interfécit, et conféstim duas turres occupávit.
  "23": Armis autem ac mánibus ómnia próspere agéndo in duábus munitiónibus plus quam vigínti míllia perémit.
  "24": At Timótheus, qui prius a Iudǽis fúerat superátus, convocáto exércitu peregrínæ multitúdinis, et congregáto equitátu Asiáno, advénit quasi armis Iudǽam captúrus.
  "25": Machabǽus autem, et qui cum ipso erant, appropinquánte illo, deprecabántur Dóminum, caput terra aspergéntes, lumbósque cilíciis præcíncti,
  "26": ad altáris crepídinem provolúti, ut sibi propítius, inimícis autem eórum esset inimícus, et adversáriis adversarétur, sicut lex dicit.
  "27": Et ita post oratiónem, sumptis armis, lóngius de civitáte procedéntes, et próximi hóstibus effécti, resedérunt.
  "28": 'Primo autem solis ortu utríque commisérunt: isti quidem victóriæ, et prosperitátis sponsórem cum virtúte Dóminum habéntes: illi autem ducem belli ánimum habébant.'
  "29": 'Sed cum véhemens pugna esset, apparuérunt adversáriis de cælo viri quinque in equis, frenis áureis decóri, ducátum Iudǽis præstántes:'
  "30": 'ex quibus duo Machabǽum médium habéntes, armis suis circumséptum incólumem conservábant: in adversários autem tela, et fúlmina iaciébant, ex quo et cæcitáte confúsi, et repléti perturbatióne cadébant.'
  "31": Interfécti sunt autem vigínti míllia quingénti, et équites sexcénti.
  "32": Timótheus vero confúgit in Gázaram præsídium munítum, cui prǽerat Chǽreas.
  "33": Machabǽus autem, et qui cum eo erant, lætántes obsedérunt præsídium diébus quátuor.
  "34": At hi, qui intus erant, loci firmitáte confísi, supra modum maledicébant, et sermónes nefándos iactábant.
  "35": 'Sed cum dies quinta illucésceret, vigínti iúvenes ex his, qui cum Machabǽo erant, accénsi ánimis propter blasphémiam, viríliter accessérunt ad murum, et feróci ánimo incedéntes ascendébant:'
  "36": sed et álii simíliter ascendéntes, turres portásque succéndere aggréssi sunt, atque ipsos malédicos vivos concremáre.
  "37": 'Per contínuum autem bíduum præsídio vastáto, Timótheum occultántem se in quodam repértum loco peremérunt: et fratrem illíus Chǽream, et Apollóphanem occidérunt.'
  "38": Quibus gestis, in hymnis et confessiónibus benedicébant Dóminum, qui magna fecit in Israel, et victóriam dedit illis.
