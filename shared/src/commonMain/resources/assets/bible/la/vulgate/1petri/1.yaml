bible: vulgate
lang: la
language: Latina
book: I Petri
chapter: "1"
verses:
  "1": Petrus Apóstolus Iesu Christi, eléctis ádvenis dispersiónis Ponti, Galátiæ, Cappadóciæ, Asiæ, et Bithýniæ,
  "2": secúndum præsciéntiam Dei Patris, in sanctificatiónem Spíritus, in obediéntiam, et aspersiónem sánguinis Iesu Christi. Grátia vobis, et pax multiplicétur.
  "3": Benedíctus Deus et Pater Dómini nostri Iesu Christi, qui secúndum misericórdiam suam magnam regenerávit nos in spem vivam, per resurrectiónem Iesu Christi ex mórtuis,
  "4": in hereditátem incorruptíbilem, et incontaminátam, et immarcescíbilem, conservátam in cælis in vobis,
  "5": qui in virtúte Dei custodímini per fidem in salútem, parátam revelári in témpore novíssimo.
  "6": 'In quo exsultábitis, módicum nunc si opórtet contristári in váriis tentatiónibus:'
  "7": 'ut probátio vestræ fídei multo pretiósior auro (quod per ignem probátur) inveniátur in laudem, et glóriam, et honórem in revelatióne Iesu Christi:'
  "8": 'quem cum non vidéritis, dilígitis: in quem nunc quoque non vidéntes créditis: credéntes autem exsultábitis lætítia inenarrábili, et glorificáta:'
  "9": reportántes finem fídei vestræ, salútem animárum.
  "10": 'De qua salúte exquisiérunt, atque scrutáti sunt prophétæ, qui de futúra in vobis grátia prophetavérunt:'
  "11": 'scrutántes in quod, vel quale tempus significáret in eis Spíritus Christi: prænúntians eas quæ in Christo sunt passiónes, et posterióres glórias:'
  "12": quibus revelátum est quia non sibimetípsis, vobis autem ministrábant ea, quæ nunc nuntiáta sunt vobis per eos, qui evangelizavérunt vobis, Spíritu sancto misso de cælo, in quem desíderant ángeli prospícere.
  "13": 'Propter quod succíncti lumbos mentis vestræ, sóbrii, perfécte speráte in eam, quæ offértur vobis, grátiam, in revelatiónem Iesu Christi:'
  "14": 'quasi fílii obediéntiæ, non configuráti prióribus ignorántiæ vestræ desidériis:'
  "15": 'sed secúndum eum, qui vocávit vos, Sanctum: et ipsi in omni conversatióne sancti sitis:'
  "16": 'quóniam scriptum est: Sancti éritis, quóniam ego sanctus sum.'
  "17": Et si patrem invocátis eum, qui sine acceptióne personárum iúdicat secúndum uniuscuiúsque opus, in timóre incolátus vestri témpore conversámini.
  "18": 'Sciéntes quod non corruptibílibus auro, vel argénto redémpti estis de vana vestra conversatióne patérnæ traditiónis:'
  "19": 'sed pretióso sánguine quasi agni immaculáti Christi, et incontamináti:'
  "20": præcógniti quidem ante mundi constitutiónem, manifestáti autem novíssimis tempóribus propter vos,
  "21": 'qui per ipsum fidéles estis in Deo, qui suscitávit eum a mórtuis, et dedit ei glóriam, ut fides vestra, et spes esset in Deo:'
  "22": 'ánimas vestras castificántes in obediéntia caritátis, in fraternitátis amóre, símplici ex corde ínvicem dilígite atténtius:'
  "23": 'renáti non ex sémine corruptíbili, sed incorruptíbili per verbum Dei vivi, et permanéntis in ætérnum:'
  "24": 'quia omnis caro ut fœnum: et omnis glória eius tamquam flos fœni: exáruit fœnum, et flos eius décidit.'
  "25": 'Verbum autem Dómini manet in ætérnum: hoc est autem verbum, quod evangelizátum est in vos.'
