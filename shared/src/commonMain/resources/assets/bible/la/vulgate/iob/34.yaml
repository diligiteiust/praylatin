bible: vulgate
lang: la
language: Latina
book: Iob
chapter: "34"
verses:
  "1": 'Pronúntians ítaque Eliu, étiam hæc locútus est:'
  "2": 'Audíte sapiéntes verba mea, et erudíti auscultáte me:'
  "3": auris enim verba probat, et guttur escas gustu diiúdicat.
  "4": Iudícium eligámus nobis, et inter nos videámus quid sit mélius.
  "5": 'Quia dixit Iob: Iustus sum, et Deus subvértit iudícium meum.'
  "6": 'In iudicándo enim me, mendácium est: violénta sagítta mea absque ullo peccáto.'
  "7": 'Quis est vir ut est Iob, qui bibit subsannatiónem quasi aquam:'
  "8": qui gráditur cum operántibus iniquitátem, et ámbulat cum viris ímpiis?
  "9": 'Dixit enim: Non placébit vir Deo, étiam si cucúrrerit cum eo.'
  "10": Ideo viri cordáti audíte me, absit a Deo impíetas, et ab Omnipoténte iníquitas.
  "11": Opus enim hóminis reddet ei, et iuxta vias singulórum restítuet eis.
  "12": Vere enim Deus non condemnábit frustra, nec Omnípotens subvértet iudícium.
  "13": Quem constítuit álium super terram? aut quem pósuit super orbem, quem fabricátus est?
  "14": Si diréxerit ad eum cor suum, spíritum illíus et flatum ad se trahet.
  "15": Defíciet omnis caro simul, et homo in cínerem revertétur.
  "16": Si habes ergo intelléctum, audi quod dícitur, et auscúlta vocem elóquii mei.
  "17": Numquid qui non amat iudícium, sanári potest? et quómodo tu eum, qui iustus est, in tantum condémnas?
  "18": 'Qui dicit regi, Apóstata: qui vocat duces ímpios:'
  "19": 'qui non áccipit persónas príncipum: nec cognóvit tyránnum, cum disceptáret contra páuperem: opus enim mánuum eius sunt univérsi.'
  "20": Súbito moriéntur, et in média nocte turbabúntur pópuli, et pertransíbunt, et áuferent violéntum absque manu.
  "21": Oculi enim eius super vias hóminum, et omnes gressus eórum consíderat.
  "22": Non sunt ténebræ, et non est umbra mortis, ut abscondántur ibi qui operántur iniquitátem.
  "23": Neque enim ultra in hóminis potestáte est, ut véniat ad Deum in iudícium.
  "24": Cónteret multos, et innumerábiles, et stare fáciet álios pro eis.
  "25": 'Novit enim ópera eórum: et idcírco indúcet noctem, et conteréntur.'
  "26": Quasi ímpios percússit eos in loco vidéntium.
  "27": 'Qui quasi de indústria recessérunt ab eo, et omnes vias eius intellígere noluérunt:'
  "28": ut perveníre fácerent ad eum clamórem egéni, et audíret vocem páuperum.
  "29": Ipso enim concedénte pacem, quis est qui condémnet? ex quo abscónderit vultum, quis est qui contemplétur eum et super gentes, et super omnes hómines?
  "30": Qui regnáre facit hóminem hypócritam propter peccáta pópuli.
  "31": Quia ergo ego locútus sum ad Deum, te quoque non prohibébo.
  "32": 'Si errávi, tu doce me: si iniquitátem locútus sum, ultra non addam.'
  "33": 'Numquid a te Deus éxpetit eam, quia displícuit tibi? tu enim cœpísti loqui, et non ego: quod si quid nosti mélius, lóquere.'
  "34": Viri intelligéntes loquántur mihi, et vir sápiens áudiat me.
  "35": Iob autem stulte locútus est, et verba illíus non sonant disciplínam.
  "36": 'Pater mi, probétur Iob usque ad finem: ne désinas ab hómine iniquitátis.'
  "37": 'Quia addit super peccáta sua blasphémiam, inter nos ínterim constringátur: et tunc ad iudícium próvocet sermónibus suis Deum.'
