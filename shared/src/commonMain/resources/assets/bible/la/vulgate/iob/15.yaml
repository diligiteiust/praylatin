bible: vulgate
lang: la
language: Latina
book: Iob
chapter: "15"
verses:
  "1": 'Respóndens autem Eliphaz Themanítes, dixit:'
  "2": Numquid sápiens respondébit quasi in ventum loquens, et implébit ardóre stómachum suum?
  "3": Arguis verbis eum, qui non est æquális tibi, et lóqueris quod tibi non éxpedit.
  "4": Quantum in te est, evacuásti timórem, et tulísti preces coram Deo.
  "5": Dócuit enim iníquitas tua os tuum, et imitáris linguam blasphemántium.
  "6": 'Condemnábit te os tuum, et non ego: et lábia tua respondébunt tibi.'
  "7": Numquid primus homo tu natus es, et ante colles formátus?
  "8": Numquid consílium Dei audísti, et inférior te erit eius sapiéntia?
  "9": Quid nosti quod ignorémus? quid intélligis quod nesciámus?
  "10": Et senes et antíqui sunt in nobis, multo vetustióres quam patres tui.
  "11": Numquid grande est ut consolétur te Deus? sed verba tua prava hoc próhibent.
  "12": Quid te élevat cor tuum, et quasi magna cógitans, attónitos habes óculos?
  "13": Quid tumet contra Deum spíritus tuus, ut próferas de ore tuo huiuscémodi sermónes?
  "14": Quid est homo, ut immaculátus sit, et ut iustus appáreat natus de mulíere?
  "15": Ecce inter sanctos eius nemo immutábilis, et cæli non sunt mundi in conspéctu eius.
  "16": Quanto magis abominábilis et inútilis homo, qui bibit quasi aquam iniquitátem?
  "17": 'Osténdam tibi, audi me: quod vidi narrábo tibi.'
  "18": Sapiéntes confiténtur, et non abscóndunt patres suos.
  "19": Quibus solis data est terra, et non transívit aliénus per eos.
  "20": Cunctis diébus suis ímpius supérbit, et númerus annórum incértus est tyránnidis eius.
  "21": 'Sónitus terróris semper in áuribus illíus: et cum pax sit, ille semper insídias suspicátur.'
  "22": Non credit quod revérti possit de ténebris ad lucem, circumspéctans úndique gládium.
  "23": Cum se móverit ad quæréndum panem, novit quod parátus sit in manu eius tenebrárum dies.
  "24": Terrébit eum tribulátio, et angústia vallábit eum, sicut regem qui præparátur ad prœ́lium.
  "25": Teténdit enim advérsus Deum manum suam, et contra Omnipoténtem roborátus est.
  "26": Cucúrrit advérsus eum erécto collo, et pingui cervíce armátus est.
  "27": Opéruit fáciem eius crassitúdo, et de latéribus eius arvína depéndet.
  "28": Habitávit in civitátibus desolátis, et in dómibus desértis, quæ in túmulos sunt redáctæ.
  "29": Non ditábitur, nec perseverábit substántia eius, nec mittet in terra radícem suam.
  "30": 'Non recédet de ténebris: ramos eius arefáciet flamma, et auferétur spíritu oris sui.'
  "31": Non credet, frustra erróre decéptus, quod áliquo prétio rediméndus sit.
  "32": 'Antequam dies eius impleántur, períbit: et manus eius aréscent.'
  "33": Lædétur quasi vínea in primo flore botrus eius, et quasi olíva proíciens florem suum.
  "34": Congregátio enim hypócritæ stérilis, et ignis devorábit tabernácula eórum, qui múnera libénter accípiunt.
  "35": Concépit dolórem, et péperit iniquitátem, et úterus eius prǽparat dolos.
