bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "109"
verses:
  "1": 'Psalmus David. Dixit Dóminus Dómino meo: Sede a dextris meis: donec ponam inimícos tuos, scabéllum pedum tuórum.'
  "2": 'Virgam virtútis tuæ emíttet Dóminus ex Sion: domináre in médio inimicórum tuórum.'
  "3": 'Tecum princípium in die virtútis tuæ in splendóribus sanctórum: ex útero ante lucíferum génui te.'
  "4": 'Iurávit Dóminus, et non pœnitébit eum: Tu es sacérdos in ætérnum secúndum órdinem Melchísedech.'
  "5": Dóminus a dextris tuis, confrégit in die iræ suæ reges.
  "6": 'Iudicábit in natiónibus, implébit ruínas: conquassábit cápita in terra multórum.'
  "7": 'De torrénte in via bibet: proptérea exaltábit caput.'
