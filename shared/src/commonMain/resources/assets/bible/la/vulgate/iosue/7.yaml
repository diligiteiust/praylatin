bible: vulgate
lang: la
language: Latina
book: Iosue
chapter: "7"
verses:
  "1": 'Fílii autem Israel prævaricáti sunt mandátum, et usurpavérunt de anathémate. Nam Achan fílius Charmi fílii Zabdi fílii Zare de tribu Iuda tulit áliquid de anathémate: iratúsque est Dóminus contra fílios Israel.'
  "2": 'Cumque mítteret Iósue de Iéricho viros contra Hai, quæ est iuxta Betháven, ad orientálem plagam óppidi Bethel, dixit eis: Ascéndite, et exploráte terram. Qui præcépta compléntes exploravérunt Hai.'
  "3": 'Et revérsi dixérunt ei: Non ascéndat omnis pópulus, sed duo vel tria míllia virórum pergant, et déleant civitátem: quare omnis pópulus frustra vexábitur contra hostes paucíssimos?'
  "4": Ascendérunt ergo tria míllia pugnatórum. Qui statim terga verténtes,
  "5": 'percússi sunt a viris urbis Hai, et corruérunt ex eis trigínta sex hómines: persecutíque sunt eos adversárii de porta usque ad Sabárim, et cecidérunt per prona fugiéntes: pertimuítque cor pópuli, et instar aquæ liquefáctum est.'
  "6": 'Iósue vero scidit vestiménta sua, et pronus cécidit in terram coram arca Dómini usque ad vésperam, tam ipse quam omnes senes Israel: miserúntque púlverem super cápita sua,'
  "7": 'et dixit Iósue: Heu Dómine Deus, quid voluísti tradúcere pópulum istum Iordánem flúvium, ut tráderes nos in manus Amorrhǽi, et pérderes? útinam ut cœ́pimus, mansissémus trans Iordánem.'
  "8": Mi Dómine Deus, quid dicam, videns Israélem hóstibus suis terga verténtem?
  "9": 'Audient Chananǽi, et omnes habitatóres terræ, et páriter conglobáti circúmdabunt nos, atque delébunt nomen nostrum de terra: et quid fácies magno nómini tuo?'
  "10": 'Dixítque Dóminus ad Iósue: Surge, cur iaces pronus in terra?'
  "11": 'Peccávit Israel, et prævaricátus est pactum meum: tulerúntque de anathémate, et furáti sunt atque mentíti, et abscondérunt inter vasa sua.'
  "12": 'Nec póterit Israel stare ante hostes suos, eósque fúgiet: quia pollútus est anathémate. Non ero ultra vobíscum, donec conterátis eum, qui huius scéleris reus est.'
  "13": 'Surge, sanctífica pópulum, et dic eis: Sanctificámini in crástinum: hæc enim dicit Dóminus Deus Israel: Anáthema in médio tui est Israel: non póteris stare coram hóstibus tuis, donec deleátur ex te qui hoc contaminátus est scélere.'
  "14": 'Accedetísque mane sínguli per tribus vestras: et quamcúmque tribum sors invénerit, accédet per cognatiónes suas, et cognátio per domos, domúsque per viros.'
  "15": 'Et quicúmque ille in hoc facínore fúerit deprehénsus, comburétur igni cum omni substántia sua: quóniam prævaricátus est pactum Dómini, et fecit nefas in Israel.'
  "16": Surgens ítaque Iósue mane, applícuit Israel per tribus suas, et invénta est tribus Iuda.
  "17": 'Quæ cum iuxta famílias suas esset obláta, invénta est família Zare. Illam quoque per domos ófferens, réperit Zabdi:'
  "18": cuius domum in síngulos dívidens viros, invénit Achan fílium Charmi, fílii Zabdi, fílii Zare de tribu Iuda.
  "19": 'Et ait Iósue ad Achan: Fili mi, da glóriam Dómino Deo Israel, et confitére, atque índica mihi quid féceris, ne abscóndas.'
  "20": 'Respondítque Achan Iósue, et dixit ei: Vere ego peccávi Dómino Deo Israel, et sic et sic feci.'
  "21": 'Vidi enim inter spólia pállium coccíneum valde bonum, et ducéntos siclos argénti, regulámque áuream quinquagínta siclórum: et concupíscens ábstuli, et abscóndi in terra contra médium tabernáculi mei, argentúmque fossa humo opérui.'
  "22": 'Misit ergo Iósue minístros: qui curréntes ad tabernáculum illíus, reperérunt cuncta abscóndita in eódem loco, et argéntum simul.'
  "23": Auferentésque de tentório, tulérunt ea ad Iósue, et ad omnes fílios Israel, proiecerúntque ante Dóminum.
  "24": 'Tollens ítaque Iósue Achan fílium Zare, argentúmque et pállium, et áuream régulam, fílios quoque et fílias eius, boves et ásinos et oves, ipsúmque tabernáculum, et cunctam supelléctilem (et omnis Israel cum eo), duxérunt eos ad vallem Achor:'
  "25": 'ubi dixit Iósue: Quia turbásti nos, extúrbet te Dóminus in die hac. Lapidavítque eum omnis Israel: et cuncta quæ illíus erant, igne consúmpta sunt.'
  "26": Congregaverúntque super eum acérvum magnum lápidum, qui pérmanet usque in præséntem diem. Et avérsus est furor Dómini ab eis. Vocatúmque est nomen loci illíus, Vallis Achor, usque hódie.
