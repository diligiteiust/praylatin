bible: vulgate
lang: la
language: Latina
book: Lucas
chapter: "3"
verses:
  "1": Anno autem quintodécimo impérii Tibérii Cǽsaris, procuránte Póntio Piláto Iudǽam, tetrárcha autem Galilǽæ Heróde, Philíppo autem fratre eius tetrárcha Iturǽæ, et Trachonítidis regiónis, et Lysánia Abilínæ tetrárcha,
  "2": 'sub princípibus sacerdótum Anna et Caípha: factum est verbum Dómini super Ioánnem, Zacharíæ fílium, in desérto.'
  "3": Et venit in omnem regiónem Iordánis, prǽdicans baptísmum pœniténtiæ in remissiónem peccatórum,
  "4": 'sicut scriptum est in libro sermónum Isaíæ prophétæ: Vox clamántis in desérto: Paráte viam Dómini: rectas fácite sémitas eius:'
  "5": 'omnis vallis implébitur: et omnis mons, et collis humiliábitur: et erunt prava in dirécta, et áspera in vias planas:'
  "6": et vidébit omnis caro salutáre Dei.
  "7": 'Dicébat ergo ad turbas, quæ exíbant ut baptizaréntur ab ipso: Genímina viperárum, quis osténdit vobis fúgere a ventúra ira?'
  "8": 'Fácite ergo fructus dignos pœniténtiæ, et ne cœpéritis dícere: Patrem habémus Abraham. Dico enim vobis, quia potens est Deus de lapídibus istis suscitáre fílios Abrahæ.'
  "9": Iam enim secúris ad radícem árborum pósita est. Omnis ergo arbor non fáciens fructum bonum, excidétur, et in ignem mittétur.
  "10": 'Et interrogábant eum turbæ, dicéntes: Quid ergo faciémus?'
  "11": 'Respóndens autem dicébat illis: Qui habet duas túnicas, det non habénti: et qui habet escas, simíliter fáciat.'
  "12": 'Venérunt autem et publicáni ut baptizaréntur, et dixérunt ad illum: Magíster, quid faciémus?'
  "13": 'At ille dixit ad eos: Nihil ámplius, quam quod constitútum est vobis, faciátis.'
  "14": 'Interrogábant autem eum et mílites, dicéntes: Quid faciémus et nos? Et ait illis: Néminem concutiátis, neque calúmniam faciátis: et conténti estóte stipéndiis vestris.'
  "15": Existimánte autem pópulo, et cogitántibus ómnibus in córdibus suis de Ioánne, ne forte ipse esset Christus,
  "16": 'respóndit Ioánnes, dicens ómnibus: Ego quidem aqua baptízo vos: véniet autem fórtior me, cuius non sum dignus sólvere corrígiam calceamentórum eius: ipse vos baptizábit in Spíritu sancto, et igni:'
  "17": cuius ventilábrum in manu eius, et purgábit áream suam, et congregábit tríticum in hórreum suum, páleas autem combúret igni inexstinguíbili.
  "18": Multa quidem et ália exhórtans evangelizábat pópulo.
  "19": Heródes autem tetrárcha cum corriperétur ab illo de Herodíade uxóre fratris sui, et de ómnibus malis, quæ fecit Heródes,
  "20": adiécit et hoc super ómnia, et inclúsit Ioánnem in cárcere.
  "21": 'Factum est autem cum baptizarétur omnis pópulus, et Iesu baptizáto, et oránte, apértum est cælum:'
  "22": 'et descéndit Spíritus sanctus corporáli spécie sicut colúmba in ipsum: et vox de cælo facta est: Tu es fílius meus diléctus, in te complácui mihi.'
  "23": Et ipse Iesus erat incípiens quasi annórum trigínta, ut putabátur, fílius Ioseph, qui fuit Heli, qui fuit Mathat,
  "24": qui fuit Levi, qui fuit Melchi, qui fuit Ianne, qui fuit Ioseph,
  "25": qui fuit Mathathíæ, qui fuit Amos, qui fuit Nahum, qui fuit Hesli, qui fuit Nagge,
  "26": qui fuit Mahath, qui fuit Mathathíæ, qui fuit Sémei, qui fuit Ioseph, qui fuit Iuda,
  "27": qui fuit Ioánna, qui fuit Resa, qui fuit Zoróbabel, qui fuit Saláthiel, qui fuit Neri,
  "28": qui fuit Melchi, qui fuit Addi, qui fuit Cosan, qui fuit Elmadan, qui fuit Her,
  "29": qui fuit Iesu, qui fuit Eliézer, qui fuit Iorim, qui fuit Mathat, qui fuit Levi,
  "30": qui fuit Símeon, qui fuit Iuda, qui fuit Ioseph, qui fuit Iona, qui fuit Elíakim,
  "31": qui fuit Mélea, qui fuit Menna, qui fuit Máthatha, qui fuit Nathan, qui fuit David,
  "32": qui fuit Iesse, qui fuit Obed, qui fuit Booz, qui fuit Salmon, qui fuit Naásson,
  "33": qui fuit Amínadab, qui fuit Aram, qui fuit Esron, qui fuit Phares, qui fuit Iudæ,
  "34": qui fuit Iacob, qui fuit Isaac, qui fuit Abrahæ, qui fuit Thare, qui fuit Nachor,
  "35": qui fuit Sarug, qui fuit Ragau, qui fuit Phaleg, qui fuit Heber, qui fuit Sale,
  "36": qui fuit Cáinan, qui fuit Arpháxad, qui fuit Sem, qui fuit Noe, qui fuit Lamech,
  "37": qui fuit Mathúsale, qui fuit Henoch, qui fuit Iared, qui fuit Maláleel, qui fuit Cáinan,
  "38": qui fuit Henos, qui fuit Seth, qui fuit Adam, qui fuit Dei.
