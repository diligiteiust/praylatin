bible: vulgate
lang: la
language: Latina
book: Leviticus
chapter: "5"
verses:
  "1": 'Si peccáverit ánima, et audíerit vocem iurántis, testísque fúerit quod aut ipse vidit, aut cónscius est: nisi indicáverit, portábit iniquitátem suam.'
  "2": 'Anima quæ tetígerit áliquid immúndum, sive quod occísum a béstia est, aut per se mórtuum, aut quódlibet áliud réptile: et oblíta fúerit immundítiæ suæ, rea est, et delíquit:'
  "3": et si tetígerit quidquam de immundítia hóminis iuxta omnem impuritátem, qua póllui solet, oblitáque cognóverit póstea, subiacébit delícto.
  "4": Anima, quæ iuráverit, et protúlerit lábiis suis, ut vel male quid fáceret, vel bene, et idípsum iuraménto et sermóne firmáverit, oblitáque póstea intelléxerit delíctum suum,
  "5": agat pœniténtiam pro peccáto,
  "6": 'et ófferat de grégibus agnam sive capram, orabítque pro ea sacérdos et pro peccáto eius:'
  "7": sin autem non potúerit offérre pecus, ófferat duos túrtures, vel duos pullos columbárum Dómino, unum pro peccáto, et álterum in holocáustum,
  "8": 'dabítque eos sacerdóti: qui primum ófferens pro peccáto, retorquébit caput eius ad pénnulas, ita ut collo hǽreat, et non pénitus abrumpátur.'
  "9": 'Et aspérget de sánguine eius paríetem altáris: quidquid autem réliquum fúerit, fáciet distilláre ad fundaméntum eius, quia pro peccáto est.'
  "10": 'Alterum vero adolébit in holocáustum, ut fíeri solet: rogabítque pro eo sacérdos et pro peccáto eius, et dimittétur ei.'
  "11": 'Quod si non quíverit manus eius duos offérre túrtures, aut duos pullos columbárum, ófferet pro peccáto suo símilæ partem ephi décimam: non mittet in eam óleum, nec thuris áliquid impónet, quia pro peccáto est.'
  "12": 'Tradétque eam sacerdóti: qui plenum ex ea pugíllum háuriens, cremábit super altáre in moniméntum eius qui obtúlerit,'
  "13": 'rogans pro illo et éxpians: réliquam vero partem ipse habébit in múnere.'
  "14": 'Locutúsque est Dóminus ad Móysen, dicens:'
  "15": 'Anima si præváricans cæremónias, per errórem, in his quæ Dómino sunt sanctificáta, peccáverit, ófferet pro delícto suo aríetem immaculátum de grégibus, qui emi potest duóbus siclis, iuxta pondus sanctuárii:'
  "16": ipsúmque quod íntulit damni restítuet, et quintam partem ponet supra, tradens sacerdóti, qui rogábit pro eo ófferens aríetem, et dimittétur ei.
  "17": Anima si peccáverit per ignorántiam, fecerítque unum ex his quæ Dómini lege prohibéntur, et peccáti rea intelléxerit iniquitátem suam,
  "18": 'ófferet aríetem immaculátum de grégibus sacerdóti, iuxta mensúram æstimationémque peccáti: qui orábit pro eo, quia nésciens fécerit: et dimittétur ei,'
  "19": quia per errórem delíquit in Dóminum.
