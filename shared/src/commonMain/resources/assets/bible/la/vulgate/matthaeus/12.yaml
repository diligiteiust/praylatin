bible: vulgate
lang: la
language: Latina
book: Matthaeus
chapter: "12"
verses:
  "1": 'In illo témpore ábiit Iesus per sata sábbato: discípuli autem eius esuriéntes cœpérunt véllere spicas, et manducáre.'
  "2": 'Pharisǽi autem vidéntes, dixérunt ei: Ecce discípuli tui fáciunt quod non licet fácere sábbatis.'
  "3": 'At ille dixit eis: Non legístis quid fécerit David, quando esúriit, et qui cum eo erant:'
  "4": quómodo intrávit in domum Dei, et panes propositiónis comédit, quos non licébat ei édere, neque his, qui cum eo erant, nisi solis sacerdótibus?
  "5": Aut non legístis in lege quia sábbatis sacerdótes in templo sábbatum víolant, et sine crímine sunt?
  "6": Dico autem vobis, quia templo maior est hic.
  "7": 'Si autem scirétis, quid est: Misericórdiam volo, et non sacrifícium: numquam condemnassétis innocéntes.'
  "8": Dóminus enim est Fílius hóminis étiam sábbati.
  "9": Et cum inde transísset, venit in synagógam eórum.
  "10": 'Et ecce homo manum habens áridam, et interrogábant eum, dicéntes: Si licet sábbatis curáre? ut accusárent eum.'
  "11": 'Ipse autem dixit illis: Quis erit ex vobis homo, qui hábeat ovem unam, et si cecíderit hæc sábbatis in fóveam, nonne tenébit, et levábit eam?'
  "12": Quanto magis mélior est homo ove? ítaque licet sábbatis benefácere.
  "13": 'Tunc ait hómini: Exténde manum tuam. Et exténdit, et restitúta est sanitáti sicut áltera.'
  "14": Exeúntes autem Pharisǽi, consílium faciébant advérsus eum, quómodo pérderent eum.
  "15": 'Iesus autem sciens recéssit inde: et secúti sunt eum multi, et curávit eos omnes:'
  "16": 'et præcépit eis, ne maniféstum eum fácerent:'
  "17": 'ut adimplerétur, quod dictum est per Isaíam prophétam, dicéntem:'
  "18": Ecce puer meus, quem elégi, diléctus meus, in quo bene complácuit ánimæ meæ. Ponam spíritum meum super eum, et iudícium géntibus nuntiábit.
  "19": 'Non conténdet, neque clamábit, neque áudiet áliquis in platéis vocem eius:'
  "20": 'arúndinem quassátam non confrínget, et linum fúmigans non exstínguet, donec eíciat ad victóriam iudícium:'
  "21": et in nómine eius gentes sperábunt.
  "22": Tunc oblátus est ei dæmónium habens, cæcus, et mutus, et curávit eum ita ut loquerétur, et vidéret.
  "23": 'Et stupébant omnes turbæ, et dicébant: Numquid hic est fílius David?'
  "24": 'Pharisǽi autem audiéntes, dixérunt: Hic non éicit dǽmones nisi in Beélzebub príncipe dæmoniórum.'
  "25": 'Iesus autem sciens cogitatiónes eórum, dixit eis: Omne regnum divísum contra se desolábitur: et omnis cívitas, vel domus divísa contra se, non stabit.'
  "26": 'Et si Sátanas Sátanam éicit, advérsus se divísus est: quómodo ergo stabit regnum eius?'
  "27": Et si ego in Beélzebub eício dǽmones, fílii vestri in quo eíciunt? Ideo ipsi iúdices vestri erunt.
  "28": Si autem ego in Spíritu Dei eício dǽmones, ígitur pervénit in vos regnum Dei.
  "29": Aut quómodo potest quisquam intráre in domum fortis, et vasa eius dirípere, nisi prius alligáverit fortem? et tunc domum illíus dirípiet.
  "30": 'Qui non est mecum, contra me est: et qui non cóngregat mecum, spargit.'
  "31": 'Ideo dico vobis: Omne peccátum et blasphémia remittétur homínibus, Spíritus autem blasphémia non remittétur.'
  "32": 'Et quicúmque díxerit verbum contra Fílium hóminis, remittétur ei: qui autem díxerit contra Spíritum sanctum, non remittétur ei, neque in hoc sǽculo, neque in futúro.'
  "33": 'Aut fácite árborem bonam, et fructum eius bonum: aut fácite árborem malam, et fructum eius malum: síquidem ex fructu arbor agnóscitur.'
  "34": Progénies viperárum, quómodo potéstis bona loqui, cum sitis mali? ex abundántia enim cordis os lóquitur.
  "35": 'Bonus homo de bono thesáuro profert bona: et malus homo de malo thesáuro profert mala.'
  "36": Dico autem vobis quóniam omne verbum otiósum, quod locúti fúerint hómines, reddent ratiónem de eo in die iudícii.
  "37": Ex verbis enim tuis iustificáberis, et ex verbis tuis condemnáberis.
  "38": 'Tunc respondérunt ei quidam de scribis et Pharisǽis, dicéntes: Magíster, vólumus a te signum vidére.'
  "39": 'Qui respóndens ait illis: Generátio mala et adúltera signum quærit: et signum non dábitur ei, nisi signum Ionæ prophétæ.'
  "40": 'Sicut enim fuit Ionas in ventre ceti tribus diébus, et tribus nóctibus: sic erit Fílius hóminis in corde terræ tribus diébus, et tribus nóctibus.'
  "41": 'Viri Ninivítæ surgent in iudício cum generatióne ista, et condemnábunt eam: quia pœniténtiam egérunt in prædicatióne Ionæ. Et ecce plus quam Ionas hic.'
  "42": 'Regína austri surget in iudício cum generatióne ista, et condemnábit eam: quia venit a fínibus terræ audíre sapiéntiam Salomónis, et ecce plus quam Sálomon hic.'
  "43": Cum autem immúndus spíritus exíerit ab hómine, ámbulat per loca árida, quærens réquiem, et non ínvenit.
  "44": 'Tunc dicit: Revértar in domum meam, unde exívi. Et véniens ínvenit eam vacántem, scopis mundátam, et ornátam.'
  "45": 'Tunc vadit, et assúmit septem álios spíritus secum nequióres se, et intrántes hábitant ibi: et fiunt novíssima hóminis illíus peióra prióribus. Sic erit et generatióni huic péssimæ.'
  "46": Adhuc eo loquénte ad turbas, ecce mater eius, et fratres stabant foris, quæréntes loqui ei.
  "47": 'Dixit autem ei quidam: Ecce mater tua, et fratres tui foris stant quæréntes te.'
  "48": 'At ipse respóndens dicénti sibi, ait: Quæ est mater mea, et qui sunt fratres mei?'
  "49": 'Et exténdens manum in discípulos suos, dixit: Ecce mater mea, et fratres mei.'
  "50": 'Quicúmque enim fécerit voluntátem Patris mei, qui in cælis est: ipse meus frater, et soror, et mater est.'
