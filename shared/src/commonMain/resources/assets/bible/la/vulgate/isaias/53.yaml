bible: vulgate
lang: la
language: Latina
book: Isaias
chapter: "53"
verses:
  "1": Quis crédidit audítui nostro? et bráchium Dómini cui revelátum est?
  "2": 'Et ascéndet sicut virgúltum coram eo, et sicut radix de terra sitiénti: non est spécies ei, neque decor: et vídimus eum, et non erat aspéctus, et desiderávimus eum:'
  "3": 'despéctum, et novíssimum virórum, virum dolórum, et sciéntem infirmitátem: et quasi abscónditus vultus eius et despéctus, unde nec reputávimus eum.'
  "4": 'Vere languóres nostros ipse tulit, et dolóres nostros ipse portávit: et nos putávimus eum quasi leprósum, et percússum a Deo et humiliátum.'
  "5": 'Ipse autem vulnerátus est propter iniquitátes nostras: attrítus est propter scélera nostra: disciplína pacis nostræ super eum, et livóre eius sanáti sumus.'
  "6": 'Omnes nos quasi oves errávimus, unusquísque in viam suam declinávit: et pósuit Dóminus in eo iniquitátem ómnium nostrum.'
  "7": 'Oblátus est quia ipse vóluit, et non apéruit os suum: sicut ovis ad occisiónem ducétur, et quasi agnus coram tondénte se obmutéscet, et non apériet os suum.'
  "8": 'De angústia, et de iudício sublátus est: generatiónem eius quis enarrábit? quia abscíssus est de terra vivéntium: propter scelus pópuli mei percússi eum.'
  "9": Et dabit ímpios pro sepultúra, et dívitem pro morte sua, eo quod iniquitátem non fécerit, neque dolus fúerit in ore eius.
  "10": Et Dóminus vóluit contérere eum in infirmitáte. Si posúerit pro peccáto ánimam suam, vidébit semen longǽvum, et volúntas Dómini in manu eius dirigétur.
  "11": Pro eo quod laborávit ánima eius, vidébit et saturábitur. In sciéntia sua iustificábit ipse iustus servus meus multos, et iniquitátes eórum ipse portábit.
  "12": Ideo dispértiam ei plúrimos, et fórtium dívidet spólia, pro eo quod trádidit in mortem ánimam suam, et cum scelerátis reputátus est, et ipse peccáta multórum tulit, et pro transgressóribus rogávit.
