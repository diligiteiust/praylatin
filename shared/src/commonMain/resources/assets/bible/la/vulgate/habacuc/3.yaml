bible: vulgate
lang: la
language: Latina
book: Habacuc
chapter: "3"
verses:
  "1": Orátio Hábacuc prophétæ, pro ignorántiis.
  "2": 'Dómine audívi auditiónem tuam, et tímui. Dómine opus tuum in médio annórum vivífica illud: in médio annórum notum fácies: cum irátus fúeris, misericórdiæ recordáberis.'
  "3": 'Deus ab austro véniet, et sanctus de monte Pharan: opéruit cælos glória eius: et laudis eius plena est terra.'
  "4": 'Splendor eius ut lux erit: córnua in mánibus eius: ibi abscóndita est fortitúdo eius:'
  "5": ante fáciem eius ibit mors. Et egrediétur diábolus ante pedes eius.
  "6": 'Stetit, et mensus est terram. Aspéxit, et dissólvit gentes: et contríti sunt montes sǽculi. Incurváti sunt colles mundi, ab itinéribus æternitátis eius.'
  "7": Pro iniquitáte vidi tentória Æthiópiæ, turbabúntur pelles terræ Mádian.
  "8": 'Numquid in flumínibus irátus es Dómine? aut in flumínibus furor tuus? vel in mari indignátio tua? Qui ascéndes super equos tuos: et quadrígæ tuæ salvátio.'
  "9": 'Súscitans suscitábis arcum tuum: iuraménta tríbubus quæ locútus es: flúvios scindes terræ:'
  "10": 'vidérunt te, et doluérunt montes: gurges aquárum tránsiit. Dedit abýssus vocem suam: altitúdo manus suas levávit.'
  "11": Sol, et luna stetérunt in habitáculo suo, in luce sagittárum tuárum, ibunt in splendóre fulgurántis hastæ tuæ.
  "12": 'In frémitu conculcábis terram: in furóre obstupefácies gentes.'
  "13": 'Egréssus es in salútem pópuli tui: in salútem cum Christo tuo: percussísti caput de domo ímpii: denudásti fundaméntum eius usque ad collum.'
  "14": Maledixísti sceptris eius, cápiti bellatórum eius, veniéntibus ut turbo ad dispergéndum me. Exsultátio eórum, sicut eius qui dévorat páuperem in abscóndito.
  "15": Viam fecísti in mari equis tuis, in luto aquárum multárum.
  "16": 'Audívi, et conturbátus est venter meus: a voce contremuérunt lábia mea. Ingrediátur putrédo in óssibus meis, et subter me scáteat. Ut requiéscam in die tribulatiónis: ut ascéndam ad pópulum accínctum nostrum.'
  "17": 'Ficus enim non florébit: et non erit germen in víneis. Mentiétur opus olívæ: et arva non áfferent cibum. Abscindétur de ovíli pecus: et non erit arméntum in præsépibus.'
  "18": 'Ego autem in Dómino gaudébo: et exsultábo in Deo Iesu meo.'
  "19": 'Deus Dóminus fortitúdo mea: et ponet pedes meos quasi cervórum. Et super excélsa mea dedúcet me victor in psalmis canéntem.'
