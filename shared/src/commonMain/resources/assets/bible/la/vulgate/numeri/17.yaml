bible: vulgate
lang: la
language: Latina
book: Numeri
chapter: "17"
verses:
  "1": 'Et locútus est Dóminus ad Móysen, dicens:'
  "2": Lóquere ad fílios Israel, et áccipe ab eis virgas síngulas per cognatiónes suas, a cunctis princípibus tríbuum, virgas duódecim, et uniuscuiúsque nomen superscríbes virgæ suæ.
  "3": 'Nomen autem Aaron erit in tribu Levi, et una virga cunctas seórsum famílias continébit:'
  "4": ponésque eas in tabernáculo fœ́deris coram testimónio, ubi loquar ad te.
  "5": 'Quem ex his elégero, germinábit virga eius: et cohibébo a me querimónias filiórum Israel, quibus contra vos múrmurant.'
  "6": 'Locutúsque est Móyses ad fílios Israel: et dedérunt ei omnes príncipes virgas per síngulas tribus: fuerúntque virgæ duódecim absque virga Aaron.'
  "7": Quas cum posuísset Móyses coram Dómino in tabernáculo testimónii,
  "8": 'sequénti die regréssus invénit germinásse virgam Aaron in domo Levi: et turgéntibus gemmis erúperant flores, qui, fóliis dilatátis, in amýgdalas deformáti sunt.'
  "9": 'Prótulit ergo Móyses omnes virgas de conspéctu Dómini ad cunctos fílios Israel: viderúntque, et recepérunt sínguli virgas suas.'
  "10": 'Dixítque Dóminus ad Móysen: Refer virgam Aaron in tabernáculum testimónii, ut servétur ibi in signum rebéllium filiórum Israel, et quiéscant querélæ eórum a me, ne moriántur.'
  "11": Fecítque Móyses sicut præcéperat Dóminus.
  "12": 'Dixérunt autem fílii Israel ad Móysen: Ecce consúmpti sumus, omnes perívimus.'
  "13": 'Quicúmque accédit ad tabernáculum Dómini, móritur: num usque ad interneciónem cuncti deléndi sumus?'
