bible: vulgate
lang: la
language: Latina
book: Daniel
chapter: "5"
verses:
  "1": 'Baltássar rex fecit grande convívium optimátibus suis mille: et unusquísque secúndum suam bibébat ætátem.'
  "2": Præcépit ergo iam temuléntus ut afferréntur vasa áurea et argéntea, quæ asportáverat Nabuchodónosor pater eius de templo, quod fuit in Ierúsalem, ut bíberent in eis rex, et optimátes eius, uxorésque eius, et concubínæ.
  "3": 'Tunc alláta sunt vasa áurea, et argéntea, quæ asportáverat de templo, quod fúerat in Ierúsalem: et bibérunt in eis rex, et optimátes eius, uxóres et concubínæ illíus.'
  "4": Bibébant vinum, et laudábant deos suos áureos, et argénteos, ǽreos, férreos, ligneósque et lapídeos.
  "5": 'In eádem hora apparuérunt dígiti, quasi manus hóminis scribéntis contra candelábrum in superfície paríetis aulæ régiæ: et rex aspiciébat artículos manus scribéntis.'
  "6": 'Tunc fácies regis commutáta est, et cogitatiónes eius conturbábant eum: et compáges renum eius solvebántur, et génua eius ad se ínvicem collidebántur.'
  "7": 'Exclamávit ítaque rex fórtiter ut introdúcerent magos, Chaldǽos, et arúspices. Et próloquens rex ait sapiéntibus Babylónis: Quicúmque légerit scriptúram hanc, et interpretatiónem eius maniféstam mihi fécerit, púrpura vestiétur, et torquem áuream habébit in collo, et tértius in regno meo erit.'
  "8": Tunc ingréssi omnes sapiéntes regis non potuérunt nec scriptúram légere, nec interpretatiónem indicáre regi.
  "9": 'Unde rex Baltássar satis conturbátus est, et vultus illíus immutátus est: sed et optimátes eius turbabántur.'
  "10": 'Regína autem pro re, quæ accíderat regi, et optimátibus eius, domum convívii ingréssa est: et próloquens ait: Rex in ætérnum vive: non te contúrbent cogitatiónes tuæ, neque fácies tua immutétur.'
  "11": 'Est vir in regno tuo, qui spíritum deórum sanctórum habet in se: et in diébus patris tui sciéntia et sapiéntia invéntæ sunt in eo: nam et rex Nabuchodónosor pater tuus príncipem magórum, incantatórum, Chaldæórum, et arúspicum constítuit eum, pater, inquam, tuus, o rex:'
  "12": 'quia spíritus ámplior, et prudéntia, intelligentiáque et interpretátio somniórum, et osténsio secretórum, ac solútio ligatórum invéntæ sunt in eo, hoc est in Daniéle: cui rex pósuit nomen Baltássar: nunc ítaque Dániel vocétur, et interpretatiónem narrábit.'
  "13": 'Igitur introdúctus est Dániel coram rege: ad quem præfátus rex ait: Tu es Dániel de fíliis captivitátis Iudæ, quem addúxit pater meus rex de Iudǽa?'
  "14": 'Audívi de te, quóniam spíritum deórum hábeas: et sciéntia, intelligentiáque ac sapiéntia amplióres invéntæ sunt in te.'
  "15": 'Et nunc introgréssi sunt in conspéctu meo sapiéntes magi, ut scriptúram hanc légerent, et interpretatiónem eius indicárent mihi: et nequivérunt sensum huius sermónis edícere.'
  "16": 'Porro ego audívi de te, quod possis obscúra interpretári, et ligáta dissólvere: si ergo vales scriptúram légere, et interpretatiónem eius indicáre mihi, púrpura vestiéris, et torquem áuream circa collum tuum habébis, et tértius in regno meo princeps eris.'
  "17": 'Ad quæ respóndens Dániel, ait coram rege: Múnera tua sint tibi, et dona domus tuæ álteri da: scriptúram autem legam tibi, rex, et interpretatiónem eius osténdam tibi.'
  "18": O rex, Deus altíssimus regnum et magnificéntiam, glóriam, et honórem dedit Nabuchodónosor patri tuo.
  "19": 'Et propter magnificéntiam, quam déderat ei, univérsi pópuli, tribus, et linguæ tremébant, et metuébant eum: quos volébat, interficiébat: et quos volébat, percutiébat: et quos volébat, exaltábat: et quos volébat, humiliábat.'
  "20": 'Quando autem elevátum est cor eius, et spíritus illíus obfirmátus est ad supérbiam, depósitus est de sólio regni sui, et glória eius abláta est:'
  "21": 'et a fíliis hóminum eiéctus est, sed et cor eius cum béstiis pósitum est, et cum ónagris erat habitátio eius: fœnum quoque ut bos comedébat, et rore cæli corpus eius inféctum est, donec cognósceret quod potestátem habéret Altíssimus in regno hóminum, et quemcúmque volúerit, suscitábit super illud.'
  "22": 'Tu quoque, fílius eius Baltássar, non humiliásti cor tuum, cum scires hæc ómnia:'
  "23": 'sed advérsum Dominatórem cæli elevátus es: et vasa domus eius alláta sunt coram te, et tu, et optimátes tui, et uxóres tuæ, et concubínæ tuæ vinum bibístis in eis: deos quoque argénteos, et áureos, et ǽreos, férreos, ligneósque et lapídeos, qui non vident, neque áudiunt, neque séntiunt, laudásti: porro Deum, qui habet flatum tuum in manu sua, et omnes vias tuas, non glorificásti.'
  "24": Idcírco ab eo missus est artículus manus, quæ scripsit hoc, quod exarátum est.
  "25": 'Hæc est autem scriptúra, quæ digésta est: Mane, Thecel, Phares.'
  "26": 'Et hæc est interpretátio sermónis. Mane: numerávit Deus regnum tuum, et complévit illud.'
  "27": 'Thecel: appénsus es in statéra, et invéntus es minus habens.'
  "28": 'Phares: divísum est regnum tuum, et datum est Medis, et Persis.'
  "29": 'Tunc iubénte rege indútus est Dániel púrpura, et circúmdata est torques áurea collo eius: et prædicátum est de eo quod habéret potestátem tértius in regno suo.'
  "30": Eádem nocte interféctus est Baltássar rex Chaldǽus.
  "31": Et Daríus Medus succéssit in regnum, annos natus sexagínta duos.
