bible: vulgate
lang: la
language: Latina
book: II Paralipomenon
chapter: "27"
verses:
  "1": 'Vigínti quinque annórum erat Ióatham cum regnáre cœpísset, et sédecim annis regnávit in Ierúsalem: nomen matris eius Iérusa fília Sadoc.'
  "2": Fecítque quod rectum erat coram Dómino, iuxta ómnia quæ fécerat Ozías pater suus, excépto quod non est ingréssus templum Dómini, et adhuc pópulus delinquébat.
  "3": Ipse ædificávit portam domus Dómini excélsam, et in muro Ophel multa constrúxit.
  "4": Urbes quoque ædificávit in móntibus Iuda, et in sáltibus castélla et turres.
  "5": 'Ipse pugnávit contra regem filiórum Ammon, et vicit eos, dederúntque ei fílii Ammon in témpore illo centum talénta argénti, et decem míllia coros trítici, ac tótidem coros hórdei: hæc ei præbuérunt fílii Ammon in anno secúndo et tértio.'
  "6": Corroboratúsque est Ióatham, eo quod direxísset vias suas coram Dómino Deo suo.
  "7": Réliqua autem sermónum Ióatham, et omnes pugnæ eius, et ópera, scripta sunt in Libro regum Israel et Iuda.
  "8": Vigínti quinque annórum erat cum regnáre cœpísset, et sédecim annis regnávit in Ierúsalem.
  "9": 'Dormivítque Ióatham cum pátribus suis, et sepeliérunt eum in civitáte David: et regnávit Achaz fílius eius pro eo.'
