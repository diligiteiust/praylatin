bible: vulgate
lang: la
language: Latina
book: Lamentationes
chapter: "3"
verses:
  "1": Aleph. Ego vir videns paupertátem meam in virga indignatiónis eius.
  "2": Aleph. Me minávit, et addúxit in ténebras, et non in lucem.
  "3": Aleph. Tantum in me vertit, et convértit manum suam tota die.
  "4": Beth. Vetústam fecit pellem meam, et carnem meam, contrívit ossa mea.
  "5": Beth. Ædificávit in gyro meo, et circúmdedit me felle et labóre.
  "6": Beth. In tenebrósis collocávit me, quasi mórtuos sempitérnos.
  "7": 'Ghimel. Circumædificávit advérsum me, ut non egrédiar: aggravávit cómpedem meum.'
  "8": Ghimel. Sed et cum clamávero, et rogávero, exclúsit oratiónem meam.
  "9": Ghimel. Conclúsit vias meas lapídibus quadris, sémitas meas subvértit.
  "10": 'Daleth. Ursus insídians factus est mihi: leo in abscónditis.'
  "11": 'Daleth. Sémitas meas subvértit, et confrégit me: pósuit me desolátam.'
  "12": Daleth. Teténdit arcum suum, et pósuit me quasi signum ad sagíttam.
  "13": He. Misit in rénibus meis fílias pháretræ suæ.
  "14": He. Factus sum in derísum omni pópulo meo, cánticum eórum tota die.
  "15": He. Replévit me amaritudínibus, inebriávit me absínthio.
  "16": Vau. Et fregit ad númerum dentes meos, cibávit me cínere.
  "17": Vau. Et repúlsa est a pace ánima mea, oblítus sum bonórum.
  "18": 'Vau. Et dixi: Périit finis meus, et spes mea a Dómino.'
  "19": Zain. Recordáre paupertátis, et transgressiónis meæ, absínthii et fellis.
  "20": Zain. Memória memor ero, et tabéscet in me ánima mea.
  "21": Zain. Hæc recólens in corde meo, ídeo sperábo.
  "22": 'Heth. Misericórdiæ Dómini, quia non sumus consúmpti: quia non defecérunt miseratiónes eius.'
  "23": Heth. Novi dilúculo, multa est fides tua.
  "24": 'Heth. Pars mea Dóminus, dixit ánima mea: proptérea exspectábo eum.'
  "25": Teth. Bonus est Dóminus sperántibus in eum, ánimæ quærénti illum.
  "26": Teth. Bonum est præstolári cum siléntio salutáre Dei.
  "27": Teth. Bonum est viro, cum portáverit iugum ab adolescéntia sua.
  "28": 'Iod. Sedébit solitárius, et tacébit: quia levávit super se.'
  "29": Iod. Ponet in púlvere os suum, si forte sit spes.
  "30": Iod. Dabit percutiénti se maxíllam, saturábitur oppróbriis.
  "31": Caph. Quia non repéllet in sempitérnum Dóminus.
  "32": Caph. Quia si abiécit, et miserébitur secúndum multitúdinem misericordiárum suárum.
  "33": Caph. Non enim humiliávit ex corde suo, et abiécit fílios hóminum,
  "34": Lamed. ut cónteret sub pédibus suis omnes vinctos terræ,
  "35": Lamed. ut declináret iudícium viri in conspéctu vultus Altíssimi,
  "36": Lamed. ut pervérteret hóminem in iudício suo, Dóminus ignorávit.
  "37": Mem. Quis est iste qui dixit ut fíeret, Dómino non iubénte?
  "38": Mem. Ex ore Altíssimi non egrediéntur nec mala nec bona?
  "39": Mem. Quid murmurávit homo vivens, vir pro peccátis suis?
  "40": Nun. Scrutémur vias nostras, et quærámus, et revertámur ad Dóminum.
  "41": Nun. Levémus corda nostra cum mánibus ad Dóminum in cælos.
  "42": 'Nun. Nos iníque égimus, et ad iracúndiam provocávimus: idcírco tu inexorábilis es.'
  "43": 'Samech. Operuísti in furóre, et percussísti nos: occidísti, nec pepercísti.'
  "44": Samech. Opposuísti nubem tibi, ne tránseat orátio.
  "45": Samech. Eradicatiónem, et abiectiónem posuísti me in médio populórum.
  "46": Phe. Aperuérunt super nos os suum omnes inimíci.
  "47": Phe. Formído, et láqueus facta est nobis vaticinátio, et contrítio.
  "48": Phe. Divisiónes aquárum dedúxit óculus meus, in contritióne fíliæ pópuli mei.
  "49": Ain. Oculus meus afflíctus est, nec tácuit, eo quod non esset réquies,
  "50": Ain. donec respíceret et vidéret Dóminus de cælis.
  "51": Ain. Oculus meus deprædátus est ánimam meam in cunctis filiábus urbis meæ.
  "52": Sade. Venatióne cepérunt me quasi avem inimíci mei gratis.
  "53": Sade. Lapsa est in lacum vita mea, et posuérunt lápidem super me.
  "54": 'Sade. Inundavérunt aquæ super caput meum: dixi: Périi.'
  "55": Coph. Invocávi nomen tuum Dómine de lacu novíssimo.
  "56": 'Coph. Vocem meam audísti: ne avértas aurem tuam a singúltu meo, et clamóribus.'
  "57": 'Coph. Appropinquásti in die, quando invocávi te: dixísti: Ne tímeas.'
  "58": Res. Iudicásti Dómine causam ánimæ meæ, redémptor vitæ meæ.
  "59": 'Res. Vidísti Dómine iniquitátem illórum advérsum me: iúdica iudícium meum.'
  "60": Res. Vidísti omnem furórem, univérsas cogitatiónes eórum advérsum me.
  "61": Sin. Audísti oppróbrium eórum Dómine, omnes cogitatiónes eórum advérsum me.
  "62": Sin. Lábia insurgéntium mihi, et meditatiónes eórum advérsum me tota die.
  "63": 'Sin. Sessiónem eórum, et resurrectiónem eórum vide: ego sum psalmus eórum.'
  "64": Thau. Reddes eis vicem Dómine iuxta ópera mánuum suárum.
  "65": Thau. Dabis eis scutum cordis labórem tuum.
  "66": Thau. Persequéris in furóre, et cónteres eos sub cælis Dómine.
