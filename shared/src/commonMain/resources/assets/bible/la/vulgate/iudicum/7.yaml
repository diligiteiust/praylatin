bible: vulgate
lang: la
language: Latina
book: Iudicum
chapter: "7"
verses:
  "1": 'Igitur Ieróbaal qui et Gédeon, de nocte consúrgens, et omnis pópulus cum eo, venit ad fontem, qui vocátur Harad: erant autem castra Mádian in valle ad septentrionálem plagam collis excélsi.'
  "2": 'Dixítque Dóminus ad Gédeon: Multus tecum est pópulus, nec tradétur Mádian in manus eius: ne gloriétur contra me Israel, et dicat: Meis víribus liberátus sum.'
  "3": 'Lóquere ad pópulum, et cunctis audiéntibus prǽdica: Qui formidolósus et tímidus est, revertátur. Recesserúntque de monte Gálaad, et revérsi sunt de pópulo vigínti duo míllia virórum, et tantum decem míllia remansérunt.'
  "4": 'Dixítque Dóminus ad Gédeon: Adhuc pópulus multus est: duc eos ad aquas, et ibi probábo illos: et de quo díxero tibi ut tecum vadat, ipse pergat: quem ire prohibúero, revertátur.'
  "5": 'Cumque descendísset pópulus ad aquas, dixit Dóminus ad Gédeon: Qui lingua lambúerint aquas, sicut solent canes lámbere, separábis eos seórsum: qui autem curvátis génibus bíberint, in áltera parte erunt.'
  "6": 'Fuit ítaque númerus eórum qui manu ad os proiciénte lambúerant aquas, trecénti viri: omnis autem réliqua multitúdo flexo póplite bíberat.'
  "7": 'Et ait Dóminus ad Gédeon: In trecéntis viris qui lambuérunt aquas, liberábo vos, et tradam in manu tua Mádian: omnis autem réliqua multitúdo revertátur in locum suum.'
  "8": 'Sumptis ítaque pro número cibáriis et tubis, omnem réliquam multitúdinem abíre præcépit ad tabernácula sua: et ipse cum trecéntis viris se certámini dedit. Castra autem Mádian erant subter in valle.'
  "9": 'Eádem nocte dixit Dóminus ad eum: Surge, et descénde in castra: quia trádidi eos in manu tua.'
  "10": Sin autem solus ire formídas, descéndat tecum Phara puer tuus.
  "11": Et cum audíeris quid loquántur, tunc confortabúntur manus tuæ, et secúrior ad hóstium castra descéndes. Descéndit ergo ipse et Phara puer eius in partem castrórum, ubi erant armatórum vigíliæ.
  "12": 'Mádian autem et Amalec, et omnes orientáles pópuli, fusi iacébant in valle, ut locustárum multitúdo: caméli quoque innumerábiles erant, sicut aréna quæ iacet in líttore maris.'
  "13": 'Cumque venísset Gédeon, narrábat áliquis sómnium próximo suo: et in hunc modum referébat quod víderat: Vidi sómnium, et videbátur mihi quasi subcinerícius panis ex hórdeo volvi, et in castra Mádian descéndere: cumque pervenísset ad tabernáculum, percússit illud, atque subvértit, et terræ fúnditus coæquávit.'
  "14": 'Respóndit is, cui loquebátur: Non est hoc áliud, nisi gládius Gedeónis fílii Ioas viri Israelítæ: trádidit enim Dóminus in manus eius Mádian, et ómnia castra eius.'
  "15": 'Cumque audísset Gédeon sómnium, et interpretatiónem eius, adorávit: et revérsus est ad castra Israel, et ait: Súrgite, trádidit enim Dóminus in manus nostras castra Mádian.'
  "16": Divisítque trecéntos viros in tres partes, et dedit tubas in mánibus eórum, lagenásque vácuas, ac lámpades in médio lagenárum.
  "17": 'Et dixit ad eos: Quod me fácere vidéritis, hoc fácite: ingrédiar partem castrórum, et quod fécero, sectámini.'
  "18": Quando personúerit tuba in manu mea, vos quoque per castrórum circúitum clángite, et conclamáte, Dómino et Gedeóni.
  "19": 'Ingressúsque est Gédeon, et trecénti viri qui erant cum eo in partem castrórum, incipiéntibus vigíliis noctis médiæ: et custódibus suscitátis, cœpérunt búccinis clángere, et complódere inter se lagénas.'
  "20": 'Cumque per gyrum castrórum in tribus personárent locis, et hýdrias confregíssent, tenuérunt sinístris mánibus lámpades, et dextris sonántes tubas, clamaverúntque: Gládius Dómini et Gedeónis:'
  "21": 'stantes sínguli in loco suo per circúitum castrórum hostílium. Omnia ítaque castra turbáta sunt, et vociferántes ululantésque fugérunt:'
  "22": et nihilóminus insistébant trecénti viri búccinis personántes. Immisítque Dóminus gládium in ómnibus castris, et mútua se cæde truncábant,
  "23": fugiéntes usque ad Bethsétta, et crepídinem Abelméhula in Tebbath. Conclamántes autem viri Israel de Néphthali, et Aser, et omni Manásse, persequebántur Mádian.
  "24": 'Misítque Gédeon núntios in omnem montem Ephraim, dicens: Descéndite in occúrsum Mádian, et occupáte aquas usque Béthbera atque Iordánem. Clamavítque omnis Ephraim, et præoccupávit aquas atque Iordánem usque Béthbera.'
  "25": Apprehensósque duos viros Mádian, Oreb et Zeb, interfécit Oreb in petra Oreb, Zeb vero in torculári Zeb. Et persecúti sunt Mádian, cápita Oreb et Zeb portántes ad Gédeon trans fluénta Iordánis.
