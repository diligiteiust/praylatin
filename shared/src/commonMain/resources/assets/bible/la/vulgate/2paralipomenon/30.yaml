bible: vulgate
lang: la
language: Latina
book: II Paralipomenon
chapter: "30"
verses:
  "1": 'Misit quoque Ezechías ad omnem Israel et Iudam: scripsítque epístolas ad Ephraim et Manássen, ut venírent ad domum Dómini in Ierúsalem, et fácerent Phase Dómino Deo Israel.'
  "2": Inito ergo consílio regis et príncipum, et univérsi cœtus Ierúsalem, decrevérunt ut fácerent Phase mense secúndo.
  "3": Non enim potúerant fácere in témpore suo, quia sacerdótes, qui possent suffícere, sanctificáti non fúerant, et pópulus nondum congregátus fúerat in Ierúsalem.
  "4": Placuítque sermo regi, et omni multitúdini.
  "5": 'Et decrevérunt ut mítterent núntios in univérsum Israel, de Bersabée usque Dan, ut venírent, et fácerent Phase Dómino Deo Israel in Ierúsalem: multi enim non fécerant sicut lege præscríptum est.'
  "6": 'Perrexerúntque cursóres cum epístolis ex regis império, et príncipum eius, in univérsum Israel et Iudam, iuxta id quod rex iússerat, prædicántes: Fílii Israel revertímini ad Dóminum Deum Abraham, et Isaac, et Israel: et revertétur ad relíquias, quæ effugérunt manum regis Assyriórum.'
  "7": Nolíte fíeri sicut patres vestri et fratres, qui recessérunt a Dómino Deo patrum suórum, qui trádidit eos in intéritum, ut ipsi cérnitis.
  "8": 'Nolíte induráre cervíces vestras, sicut patres vestri: trádite manus Dómino, et veníte ad sanctuárium eius, quod sanctificávit in ætérnum: servíte Dómino Deo patrum vestrórum, et avertétur a vobis ira furóris eius.'
  "9": 'Si enim vos revérsi fuéritis ad Dóminum: fratres vestri, et fílii habébunt misericórdiam coram dóminis suis, qui illos duxérunt captívos, et reverténtur in terram hanc: pius enim et clemens est Dóminus Deus vester, et non avértet fáciem suam a vobis, si revérsi fuéritis ad eum.'
  "10": Igitur cursóres pergébant velóciter de civitáte in civitátem, per terram Ephraim et Manásse usque ad Zábulon, illis irridéntibus et subsannántibus eos.
  "11": Attamen quidam viri ex Aser, et Manásse, et Zábulon acquiescéntes consílio, venérunt Ierúsalem.
  "12": In Iuda vero facta est manus Dómini ut daret eis cor unum, ut fácerent iuxta præcéptum regis, et príncipum verbum Dómini.
  "13": 'Congregatíque sunt in Ierúsalem pópuli multi, ut fácerent solemnitátem azymórum, in mense secúndo:'
  "14": et surgéntes destruxérunt altária, quæ erant in Ierúsalem, atque univérsa, in quibus idólis adolebátur incénsum, subverténtes, proiecérunt in torréntem Cedron.
  "15": 'Immolavérunt autem Phase quartadécima die mensis secúndi. Sacerdótes quoque, atque Levítæ tandem sanctificáti, obtulérunt holocáusta in domo Dómini:'
  "16": 'steterúntque in órdine suo iuxta dispositiónem, et legem Móysi hóminis Dei: sacerdótes vero suscipiébant effundéndum sánguinem de mánibus Levitárum,'
  "17": 'eo quod multa turba sanctificáta non esset: et idcírco immolárent Levítæ Phase his, qui non occúrrerant sanctificári Dómino.'
  "18": 'Magna étiam pars pópuli de Ephraim, et Manásse, et Issachar, et Zábulon, quæ sanctificáta non fúerat, comédit Phase non iuxta quod scriptum est: et orávit pro eis Ezechías, dicens: Dóminus bonus propitiábitur'
  "19": 'cunctis, qui in toto corde requírunt Dóminum Deum patrum suórum: et non imputábit eis quod minus sanctificáti sunt.'
  "20": Quem exaudívit Dóminus, et placátus est pópulo.
  "21": 'Fecerúntque fílii Israel, qui invénti sunt in Ierúsalem, solemnitátem azymórum septem diébus in lætítia magna, laudántes Dóminum per síngulos dies: Levítæ quoque, et sacerdótes per órgana, quæ suo offício congruébant.'
  "22": 'Et locútus est Ezechías ad cor ómnium Levitárum, qui habébant intelligéntiam bonam super Dómino: et comedérunt septem diébus solemnitátis, immolántes víctimas pacificórum, et laudántes Dóminum Deum patrum suórum.'
  "23": 'Placuítque univérsæ multitúdini ut celebrárent étiam álios dies septem: quod et fecérunt cum ingénti gáudio.'
  "24": 'Ezechías enim rex Iuda præbúerat multitúdini mille tauros, et septem míllia óvium: príncipes vero déderant pópulo tauros mille, et oves decem míllia: sanctificáta est ergo sacerdótum plúrima multitúdo.'
  "25": 'Et hilaritáte perfúsa omnis turba Iuda, tam sacerdótum et Levitárum, quam univérsæ frequéntiæ, quæ vénerat ex Israel: proselytórum quoque de terra Israel, et habitántium in Iuda.'
  "26": Factáque est grandis celébritas in Ierúsalem, qualis a diébus Salomónis fílii David regis Israel in ea urbe non fúerat.
  "27": 'Surrexérunt autem sacerdótes atque Levítæ benedicéntes pópulo: et exaudíta est vox eórum, pervenítque orátio in habitáculum sanctum cæli.'
