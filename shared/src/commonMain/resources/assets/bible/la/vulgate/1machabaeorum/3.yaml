bible: vulgate
lang: la
language: Latina
book: I Machabaeorum
chapter: "3"
verses:
  "1": 'Et surréxit Iudas, qui vocabátur Machabǽus, fílius eius, pro eo:'
  "2": 'et adiuvábant eum omnes fratres eius: et univérsi, qui se coniúnxerant patri eius, et prœliabántur prœ́lium Israel cum lætítia.'
  "3": Et dilatávit glóriam pópulo suo, et índuit se lorícam sicut gigas, et succínxit se arma béllica sua in prœ́liis, et protegébat castra gládio suo.
  "4": Símilis factus est leóni in opéribus suis, et sicut cátulus leónis rúgiens in venatióne.
  "5": 'Et persecútus est iníquos perscrútans eos: et qui conturbábant pópulum suum, eos succéndit flammis:'
  "6": 'et repúlsi sunt inimíci eius præ timóre eius, et omnes operárii iniquitátis conturbáti sunt: et dirécta est salus in manu eius.'
  "7": Et exacerbábat reges multos, et lætificábat Iacob in opéribus suis, et in sǽculum memória eius in benedictióne.
  "8": Et perambulávit civitátes Iuda, et pérdidit ímpios ex eis, et avértit iram ab Israel.
  "9": Et nominátus est usque ad novíssimum terræ, et congregávit pereúntes.
  "10": Et congregávit Apollónius gentes, et a Samaría virtútem multam et magnam ad bellándum contra Israel.
  "11": 'Et cognóvit Iudas, et éxiit óbviam illi: et percússit, et occídit illum: et cecidérunt vulneráti multi, et réliqui fugérunt.'
  "12": 'Et accépit spólia eórum: et gládium Apollónii ábstulit Iudas, et erat pugnans in eo ómnibus diébus.'
  "13": Et audívit Seron princeps exércitus Sýriæ, quod congregávit Iudas congregatiónem fidélium, et ecclésiam secum,
  "14": 'et ait: Fáciam mihi nomen, et glorificábor in regno, et debellábo Iudam, et eos, qui cum ipso sunt, qui spernébant verbum regis.'
  "15": 'Et præparávit se: et ascendérunt cum eo castra impiórum fortes auxiliárii ut fácerent vindíctam in fílios Israel.'
  "16": 'Et appropinquavérunt usque ad Béthoron: et exívit Iudas óbviam illi cum paucis.'
  "17": 'Ut autem vidérunt exércitum veniéntem sibi óbviam, dixérunt Iudæ: Quómodo potérimus pauci pugnáre contra multitúdinem tantam, et tam fortem, et nos fatigáti sumus ieiúnio hódie?'
  "18": 'Et ait Iudas: Fácile est conclúdi multos in manus paucórum: et non est differéntia in conspéctu Dei cæli liberáre in multis, et in paucis:'
  "19": quóniam non in multitúdine exércitus victória belli, sed de cælo fortitúdo est.
  "20": 'Ipsi véniunt ad nos in multitúdine contumáci, et supérbia, ut dispérdant nos, et uxóres nostras, et fílios nostros, et ut spólient nos:'
  "21": 'nos vero pugnábimus pro animábus nostris, et légibus nostris:'
  "22": 'et ipse Dóminus cónteret eos ante fáciem nostram: vos autem ne timuéritis eos.'
  "23": 'Ut cessávit autem loqui, insíluit in eos súbito: et contrítus est Seron, et exércitus eius in conspéctu ipsíus:'
  "24": et persecútus est eum in descénsu Béthoron usque in campum, et cecidérunt ex eis octingénti viri, réliqui autem fugérunt in terram Philísthiim.
  "25": Et cécidit timor Iudæ, ac fratrum eius, et formído super omnes gentes in circúitu eórum.
  "26": Et pervénit ad regem nomen eius, et de prœ́liis Iudæ narrábant omnes gentes.
  "27": 'Ut audívit autem rex Antíochus sermónes istos, irátus est ánimo: et misit, et congregávit exércitum univérsi regni sui, castra fórtia valde:'
  "28": 'et apéruit ærárium suum, et dedit stipéndia exercítui in annum: et mandávit illis ut essent paráti ad ómnia.'
  "29": 'Et vidit quod defécit pecúnia de thesáuris suis, et tribúta regiónis módica propter dissensiónem, et plagam, quam fecit in terra, ut tólleret legítima, quæ erant a primis diébus:'
  "30": 'et tímuit ne non habéret ut semel et bis, in sumptus et donária, quæ déderat ante larga manu: et abundáverat super reges, qui ante eum fúerant.'
  "31": Et consternátus erat ánimo valde, et cogitávit ire in Pérsidem, et accípere tribúta regiónum, et congregáre argéntum multum.
  "32": 'Et relíquit Lýsiam hóminem nóbilem de génere regáli, super negótia régia, a flúmine Euphráte usque ad flumen Ægýpti:'
  "33": et ut nutríret Antíochum fílium suum, donec redíret.
  "34": 'Et trádidit ei médium exércitum, et elephántos: et mandávit ei de ómnibus, quæ volébat, et de inhabitántibus Iudǽam, et Ierúsalem:'
  "35": 'et ut mítteret ad eos exércitum ad conteréndam, et exstirpándam virtútem Israel, et relíquias Ierúsalem, et auferéndam memóriam eórum de loco:'
  "36": et ut constitúeret habitatóres fílios alienígenas in ómnibus fínibus eórum, et sorte distribúeret terram eórum.
  "37": 'Et rex assúmpsit partem exércitus resídui, et exívit ab Antiochía civitáte regni sui anno centésimo et quadragésimo séptimo: et transfretávit Euphráten flumen, et perambulábat superióres regiónes.'
  "38": 'Et elégit Lýsias Ptolemǽum fílium Dorýmini, et Nicánorem, et Górgiam, viros poténtes ex amícis regis:'
  "39": et misit cum eis quadragínta míllia virórum, et septem míllia équitum, ut venírent in terram Iuda, et dispérderent eam secúndum verbum regis.
  "40": Et processérunt cum univérsa virtúte sua, et venérunt, et applicuérunt Emmaum in terra campéstri.
  "41": 'Et audiérunt mercatóres regiónum nomen eórum: et accepérunt argéntum, et aurum multum valde, et púeros: et venérunt in castra ut accíperent fílios Israel in servos, et ádditi sunt ad eos exércitus Sýriæ, et terræ alienigenárum.'
  "42": 'Et vidit Iudas, et fratres eius, quia multiplicáta sunt mala, et exércitus applicábant ad fines eórum: et cognovérunt verba regis, quæ mandávit pópulo fácere in intéritum, et consummatiónem:'
  "43": 'et dixérunt unusquísque ad próximum suum: Erigámus deiectiónem pópuli nostri, et pugnémus pro pópulo nostro, et sanctis nostris.'
  "44": 'Et congregátus est convéntus ut essent paráti in prœ́lium: et ut orárent, et péterent misericórdiam, et miseratiónes.'
  "45": 'Et Ierúsalem non habitabátur, sed erat sicut desértum: non erat qui ingrederétur et egrederétur de natis eius: et sanctum conculcabátur: et fílii alienigenárum erant in arce: ibi erat habitátio géntium: et abláta est volúptas a Iacob, et defécit ibi tíbia, et cíthara.'
  "46": 'Et congregáti sunt, et venérunt in Maspha contra Ierúsalem: quia locus oratiónis erat in Maspha ante in Israel.'
  "47": 'Et ieiunavérunt illa die, et induérunt se cilíciis, et cínerem imposuérunt cápiti suo, et discidérunt vestiménta sua:'
  "48": 'et expandérunt libros legis, de quibus scrutabántur gentes similitúdinem simulacrórum suórum:'
  "49": 'et attulérunt ornaménta sacerdotália, et primítias, et décimas: et suscitavérunt Nazarǽos, qui impléverant dies:'
  "50": 'et clamavérunt voce magna in cælum, dicéntes: Quid faciémus istis, et quo eos ducémus?'
  "51": 'Et sancta tua conculcáta sunt, et contamináta sunt, et sacerdótes tui facti sunt in luctum, et in humilitátem:'
  "52": 'et ecce natiónes convenérunt advérsum nos ut nos dispérdant: tu scis quæ cógitant in nos.'
  "53": Quómodo potérimus subsístere ante fáciem eórum, nisi tu Deus ádiuves nos?
  "54": Et tubis exclamavérunt voce magna.
  "55": Et post hæc constítuit Iudas duces pópuli, tribúnos, et centuriónes, et pentacontárchos, et decuriónes.
  "56": Et dixit his, qui ædificábant domos, et sponsábant uxóres, et plantábant víneas, et formidolósis, ut redírent unusquísque in domum suam secúndum legem.
  "57": Et movérunt castra, et collocavérunt ad austrum Emmaum.
  "58": 'Et ait Iudas: Accingímini, et estóte fílii poténtes, et estóte paráti in mane, ut pugnétis advérsus natiónes has, quæ convenérunt advérsus nos dispérdere nos, et sancta nostra:'
  "59": quóniam mélius est nos mori in bello, quam vidére mala gentis nostræ, et sanctórum.
  "60": Sicut autem fúerit volúntas in cælo, sic fiat.
