bible: vulgate
lang: la
language: Latina
book: Isaias
chapter: "23"
verses:
  "1": 'Onus Tyri. Ululáte naves maris: quia vastáta est domus, unde veníre consuéverant: de terra Cethim revelátum est eis.'
  "2": 'Tacéte qui habitátis in ínsula: negotiatóres Sidónis transfretántes mare, replevérunt te.'
  "3": 'In aquis multis semen Nili, messis flúminis fruges eius: et facta est negotiátio géntium.'
  "4": 'Erubésce, Sidon: ait enim mare, fortitúdo maris, dicens: Non parturívi, et non péperi, et non enutrívi iúvenes, nec ad increméntum perdúxi vírgines.'
  "5": Cum audítum fúerit in Ægýpto, dolébunt cum audíerint de Tyro.
  "6": 'Transíte mária, ululáte qui habitátis in ínsula:'
  "7": numquid non vestra hæc est, quæ gloriabátur a diébus prístinis in antiquitáte sua? Ducent eam pedes sui longe ad peregrinándum.
  "8": Quis cogitávit hoc super Tyrum quondam coronátam, cuius negotiatóres príncipes, institóres eius ínclyti terræ?
  "9": Dóminus exercítuum cogitávit hoc, ut detráheret supérbiam omnis glóriæ, et ad ignomíniam dedúceret univérsos ínclytos terræ.
  "10": Transi terram tuam quasi flumen fília maris, non est cíngulum ultra tibi.
  "11": 'Manum suam exténdit super mare, conturbávit regna: Dóminus mandávit advérsus Chánaan, ut contéreret fortes eius,'
  "12": 'et dixit: Non adícies ultra ut gloriéris, calúmniam sústinens virgo fília Sidónis: in Cethim consúrgens tránsfreta: ibi quoque non erit réquies tibi.'
  "13": 'Ecce terra Chaldæórum talis pópulus non fuit, Assur fundávit eam: in captivitátem traduxérunt robústos eius, suffodérunt domos eius, posuérunt eam in ruínam.'
  "14": Ululáte naves maris, quia devastáta est fortitúdo vestra.
  "15": 'Et erit in die illa: in oblivióne eris o Tyre septuagínta annis, sicut dies regis uníus: post septuagínta autem annos erit Tyro quasi cánticum meretrícis.'
  "16": 'Sume cítharam, círcui civitátem méretrix oblivióni trádita: bene cane, frequénta cánticum, ut memória tui sit.'
  "17": 'Et erit post septuagínta annos: visitábit Dóminus Tyrum, et redúcet eam ad mercédes suas, et rursum fornicábitur cum univérsis regnis terræ super fáciem terræ.'
  "18": 'Et erunt negotiatiónes eius, et mercédes eius sanctificátæ Dómino: non condéntur, neque reponéntur: quia his, qui habitáverint coram Dómino erit negotiátio eius, ut mandúcent in saturitátem, et vestiántur usque ad vetustátem.'
