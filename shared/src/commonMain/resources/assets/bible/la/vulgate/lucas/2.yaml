bible: vulgate
lang: la
language: Latina
book: Lucas
chapter: "2"
verses:
  "1": Factum est autem in diébus illis, éxiit edíctum a Cǽsare Augústo, ut describerétur univérsus orbis.
  "2": 'Hæc descríptio prima facta est a prǽside Sýriæ Cyríno:'
  "3": et ibant omnes ut profiteréntur sínguli in suam civitátem.
  "4": 'Ascéndit autem et Ioseph a Galilǽa de civitáte Názareth in Iudǽam, in civitátem David, quæ vocátur Béthlehem: eo quod esset de domo, et família David,'
  "5": ut profiterétur cum María desponsáta sibi uxóre prægnánte.
  "6": Factum est autem, cum essent ibi, impléti sunt dies ut páreret.
  "7": 'Et péperit Fílium suum primogénitum, et pannis eum invólvit, et reclinávit eum in præsépio: quia non erat eis locus in diversório.'
  "8": Et pastóres erant in regióne eádem vigilántes, et custodiéntes vigílias noctis super gregem suum.
  "9": Et ecce ángelus Dómini stetit iuxta illos, et cláritas Dei circumfúlsit illos, et timuérunt timóre magno.
  "10": 'Et dixit illis ángelus: Nolíte timére: ecce enim evangelízo vobis gáudium magnum, quod erit omni pópulo:'
  "11": quia natus est vobis hódie Salvátor, qui est Christus Dóminus, in civitáte David.
  "12": 'Et hoc vobis signum: inveniétis infántem pannis involútum, et pósitum in præsépio.'
  "13": 'Et súbito facta est cum ángelo multitúdo milítiæ cæléstis laudántium Deum, et dicéntium:'
  "14": Glória in altíssimis Deo, et in terra pax homínibus bonæ voluntátis.
  "15": 'Et factum est, ut discessérunt ab eis ángeli in cælum: pastóres loquebántur ad ínvicem: Transeámus usque Béthlehem, et videámus hoc verbum, quod factum est, quod Dóminus osténdit nobis.'
  "16": 'Et venérunt festinántes: et invenérunt Maríam, et Ioseph, et infántem pósitum in præsépio.'
  "17": Vidéntes autem cognovérunt de verbo, quod dictum erat illis de púero hoc.
  "18": 'Et omnes, qui audiérunt, miráti sunt: et de his, quæ dicta erant a pastóribus ad ipsos.'
  "19": María autem conservábat ómnia verba hæc, cónferens in corde suo.
  "20": Et revérsi sunt pastóres glorificántes, et laudántes Deum in ómnibus, quæ audíerant, et víderant, sicut dictum est ad illos.
  "21": Et postquam consummáti sunt dies octo, ut circumciderétur puer, vocátum est nomen eius Iesus, quod vocátum est ab ángelo priúsquam in útero conciperétur.
  "22": Et postquam impléti sunt dies purgatiónis eius secúndum legem Móysi, tulérunt illum in Ierúsalem, ut sísterent eum Dómino,
  "23": 'sicut scriptum est in lege Dómini: Quia omne masculínum adapériens vulvam, sanctum Dómino vocábitur:'
  "24": et ut darent hóstiam secúndum quod dictum est in lege Dómini, par túrturum, aut duos pullos columbárum.
  "25": 'Et ecce homo erat in Ierúsalem, cui nomen Símeon, et homo iste iustus, et timorátus, exspéctans consolatiónem Israel: et Spíritus sanctus erat in eo.'
  "26": Et respónsum accéperat a Spíritu sancto, non visúrum se mortem, nisi prius vidéret Christum Dómini.
  "27": Et venit in Spíritu in templum. Et cum indúcerent púerum Iesum paréntes eius, ut fácerent secúndum consuetúdinem legis pro eo,
  "28": 'et ipse accépit eum in ulnas suas: et benedíxit Deum, et dixit:'
  "29": 'Nunc dimíttis servum tuum Dómine, secúndum verbum tuum in pace:'
  "30": quia vidérunt óculi mei salutáre tuum,
  "31": 'quod parásti ante fáciem ómnium populórum:'
  "32": lumen ad revelatiónem géntium, et glóriam plebis tuæ Israel.
  "33": Et erat pater eius et mater mirántes super his, quæ dicebántur de illo.
  "34": 'Et benedíxit illis Símeon, et dixit ad Maríam matrem eius: Ecce pósitus est hic in ruínam, et in resurrectiónem multórum in Israel: et in signum, cui contradicétur:'
  "35": et tuam ipsíus ánimam pertransíbit gládius, ut reveléntur ex multis córdibus cogitatiónes.
  "36": 'Et erat Anna prophetíssa, fília Phánuel, de tribu Aser: hæc procésserat in diébus multis, et víxerat cum viro suo annis septem a virginitáte sua.'
  "37": 'Et hæc vídua usque ad annos octogínta quátuor: quæ non discedébat de templo, ieiúniis, et obsecratiónibus sérviens nocte, ac die.'
  "38": 'Et hæc, ipsa hora supervéniens, confitebátur Dómino: et loquebátur de illo ómnibus, qui exspectábant redemptiónem Israel.'
  "39": Et ut perfecérunt ómnia secúndum legem Dómini, revérsi sunt in Galilǽam in civitátem suam Názareth.
  "40": 'Puer autem crescébat, et confortabátur plenus sapiéntia: et grátia Dei erat in illo.'
  "41": Et ibant paréntes eius per omnes annos in Ierúsalem, in die solémni Paschæ.
  "42": Et cum factus esset annórum duódecim, ascendéntibus illis Ierosólymam secúndum consuetúdinem diéi festi,
  "43": consummatísque diébus, cum redírent, remánsit puer Iesus in Ierúsalem, et non cognovérunt paréntes eius.
  "44": Existimántes autem illum esse in comitátu, venérunt iter diéi, et requirébant eum inter cognátos, et notos.
  "45": Et non inveniéntes, regréssi sunt in Ierúsalem, requiréntes eum.
  "46": Et factum est, post tríduum invenérunt illum in templo sedéntem in médio doctórum, audiéntem illos, et interrogántem eos.
  "47": Stupébant autem omnes, qui eum audiébant, super prudéntia, et respónsis eius.
  "48": 'Et vidéntes admiráti sunt. Et dixit mater eius ad illum: Fili, quid fecísti nobis sic? ecce pater tuus, et ego doléntes quærebámus te.'
  "49": 'Et ait ad illos: Quid est quod me quærebátis? nesciebátis quia in his, quæ Patris mei sunt, opórtet me esse?'
  "50": Et ipsi non intellexérunt verbum quod locútus est ad eos.
  "51": 'Et descéndit cum eis, et venit Názareth: et erat súbditus illis. Et mater eius conservábat ómnia verba hæc in corde suo.'
  "52": Et Iesus proficiébat sapiéntia, et ætáte, et grátia apud Deum, et hómines.
