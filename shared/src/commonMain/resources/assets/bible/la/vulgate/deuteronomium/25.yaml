bible: vulgate
lang: la
language: Latina
book: Deuteronomium
chapter: "25"
verses:
  "1": 'Si fúerit causa inter áliquos, et interpelláverint iúdices: quem iustum esse perspéxerint, illi iustítiæ palmam dabunt: quem ímpium, condemnábunt impietátis.'
  "2": 'Sin autem eum, qui peccávit, dignum víderint plagis: prostérnent, et coram se fácient verberári. Pro mensúra peccáti erit et plagárum modus:'
  "3": 'ita dumtáxat, ut quadragenárium númerum non excédant: ne fœde lacerátus ante óculos tuos ábeat frater tuus.'
  "4": Non ligábis os bovis teréntis in área fruges tuas.
  "5": 'Quando habitáverint fratres simul, et unus ex eis absque líberis mórtuus fúerit, uxor defúncti non nubet álteri: sed accípiet eam frater eius, et suscitábit semen fratris sui:'
  "6": et primogénitum ex ea fílium nómine illíus appellábit, ut non deleátur nomen eius ex Israel.
  "7": 'Sin autem nolúerit accípere uxórem fratris sui, quæ ei lege debétur, perget múlier ad portam civitátis, et interpellábit maióres natu, dicétque: Non vult frater viri mei suscitáre nomen fratris sui in Israel, nec me in cóniugem súmere.'
  "8": 'Statímque accersíri eum fácient, et interrogábunt. Si respónderit: Nolo eam uxórem accípere:'
  "9": 'accédet múlier ad eum coram senióribus, et tollet calceaméntum de pede eius, spuétque in fáciem illíus, et dicet: Sic fiet hómini, qui non ædíficat domum fratris sui.'
  "10": Et vocábitur nomen illíus in Israel, Domus discalceáti.
  "11": 'Si habúerint inter se iúrgium viri duo, et unus contra álterum rixári cœ́perit, volénsque uxor altérius erúere virum suum de manu fortióris, miserítque manum, et apprehénderit verénda eius:'
  "12": abscídes manum illíus, nec flectéris super eam ulla misericórdia.
  "13": 'Non habébis in sácculo divérsa póndera, maius et minus:'
  "14": nec erit in domo tua módius maior et minor.
  "15": 'Pondus habébis iustum et verum, et módius æquális et verus erit tibi: ut multo vivas témpore super terram, quam Dóminus Deus tuus déderit tibi.'
  "16": Abominátur enim Dóminus tuus eum, qui facit hæc, et aversátur omnem iniustítiam.
  "17": 'Meménto quæ fécerit tibi Amalec in via quando egrediebáris ex Ægýpto:'
  "18": 'quómodo occúrrerit tibi, et extrémos ágminis tui, qui lassi residébant, cecíderit, quando tu eras fame et labóre conféctus: et non timúerit Deum.'
  "19": 'Cum ergo Dóminus Deus tuus déderit tibi réquiem, et subiécerit cunctas per circúitum natiónes in terra, quam tibi pollícitus est: delébis nomen eius sub cælo. Cave ne obliviscáris.'
