bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "51"
verses:
  "1": In finem, Intelléctus David,
  "2": 'cum venit Doeg Idumǽus, et nuntiávit Sauli: Venit David in domum Achímelech.'
  "3": Quid gloriáris in malítia, qui potens es in iniquitáte?
  "4": 'Tota die iniustítiam cogitávit lingua tua: sicut novácula acúta fecísti dolum.'
  "5": 'Dilexísti malítiam super benignitátem: iniquitátem magis quam loqui æquitátem.'
  "6": Dilexísti ómnia verba præcipitatiónis, lingua dolósa.
  "7": 'Proptérea Deus déstruet te in finem: evéllet te, et emigrábit te de tabernáculo tuo, et radícem tuam de terra vivéntium.'
  "8": 'Vidébunt iusti, et timébunt: et super eum ridébunt, et dicent:'
  "9": 'Ecce homo qui non pósuit Deum adiutórem suum: sed sperávit in multitúdine divitiárum suárum, et præváluit in vanitáte sua.'
  "10": 'Ego autem, sicut olíva fructífera in domo Dei, sperávi in misericórdia Dei in ætérnum: et in sǽculum sǽculi.'
  "11": 'Confitébor tibi in sǽculum, quia fecísti: et exspectábo nomen tuum, quóniam bonum est in conspéctu sanctórum tuórum.'
