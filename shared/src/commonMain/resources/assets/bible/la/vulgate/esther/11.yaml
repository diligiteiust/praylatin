bible: vulgate
lang: la
language: Latina
book: Esther
chapter: "11"
verses:
  "1": Anno quarto, regnántibus Ptolemǽo, et Cleopátra, attulérunt Dosithǽus, qui se sacerdótem, et Levítici géneris ferébat, et Ptolemǽus fílius eius, hanc epístolam phurim, quam dixérunt interpretátum esse Lysímachum Ptolemǽi fílium in Ierúsalem.
  "2": '[Hoc quoque princípium erat in editióne vulgáta, quod nec in Hebrǽo, nec apud ullum fertur intérpretum.] Anno secúndo, regnánte Artaxérxe máximo, prima die mensis Nisan, vidit sómnium Mardochǽus fílius Iáiri, fílii Sémei, fílii Cis, de tribu Béniamin:'
  "3": homo Iudǽus, qui habitábat in urbe Susis, vir magnus, et inter primos aulæ régiæ.
  "4": Erat autem de eo número captivórum, quos transtúlerat Nabuchodónosor rex Babylónis de Ierúsalem cum Iechonía rege Iuda.
  "5": 'Et hoc eius sómnium fuit: apparuérunt voces, et tumúltus, et tonítrua, et terræmótus, et conturbátio super terram:'
  "6": et ecce duo dracónes magni, paratíque contra se in prœ́lium.
  "7": Ad quorum clamórem cunctæ concitátæ sunt natiónes, ut pugnárent contra gentem iustórum.
  "8": Fuítque dies illa tenebrárum et discríminis, tribulatiónis et angústiæ, et ingens formído super terram.
  "9": Conturbatáque est gens iustórum timéntium mala sua, et præparáta ad mortem.
  "10": 'Clamaverúntque ad Deum: et illis vociferántibus, fons parvus crevit in flúvium máximum, et in aquas plúrimas redundávit.'
  "11": Lux et sol ortus est, et húmiles exaltáti sunt, et devoravérunt ínclytos.
  "12": 'Quod cum vidísset Mardochǽus, et surrexísset de strato, cogitábat quid Deus fácere vellet: et fixum habébat in ánimo, scire cúpiens quid significáret sómnium.'
