bible: vulgate
lang: la
language: Latina
book: Ecclesiasticus
chapter: "35"
verses:
  "1": Qui consérvat legem, multíplicat oblatiónem.
  "2": Sacrifícium salutáre est atténdere mandátis, et discédere ab omni iniquitáte.
  "3": Et propitiatiónem litáre sacrifícii super iniustítias, et deprecátio pro peccátis, recédere ab iniustítia.
  "4": 'Retríbuet grátiam qui offert similáginem: et qui facit misericórdiam offert sacrifícium.'
  "5": 'Beneplácitum est Dómino recédere ab iniquitáte: et deprecátio pro peccátis recédere ab iniustítia.'
  "6": Non apparébis ante conspéctum Dómini vácuus.
  "7": Hæc enim ómnia propter mandátum Dei fiunt.
  "8": Oblátio iusti impínguat altáre, et odor suavitátis est in conspéctu Altíssimi.
  "9": Sacrifícium iusti accéptum est, et memóriam eius non obliviscétur Dóminus.
  "10": Bono ánimo glóriam redde Deo, et non mínuas primítias mánuum tuárum.
  "11": In omni dato hílarem fac vultum tuum, et in exsultatióne sanctífica décimas tuas.
  "12": 'Da Altíssimo secúndum datum eius, et in bono óculo adinventiónem fácito mánuum tuárum:'
  "13": quóniam Dóminus retríbuens est, et sépties tantum reddet tibi.
  "14": Noli offérre múnera prava, non enim suscípiet illa.
  "15": Et noli inspícere sacríficum iniústum, quóniam Dóminus iudex est, et non est apud illum glória persónæ.
  "16": Non accípiet Dóminus persónam in páuperem, et deprecatiónem læsi exáudiet.
  "17": 'Non despíciet preces pupílli: nec víduam, si effúndat loquélam gémitus.'
  "18": Nonne lácrymæ víduæ ad maxíllam descéndunt, et exclamátio eius super deducéntem eas?
  "19": A maxílla enim ascéndunt usque ad cælum, et Dóminus exaudítor non delectábitur in illis.
  "20": Qui adórat Deum in oblectatióne suscipiétur, et deprecátio illíus usque ad nubes propinquábit.
  "21": 'Orátio humiliántis se, nubes penetrábit: et donec propínquet non consolábitur: et non discédet donec Altíssimus aspíciat.'
  "22": 'Et Dóminus non elongábit: sed iudicábit iustos, et fáciet iudícium: et Fortíssimus non habébit in illis patiéntiam, ut contríbulet dorsum ipsórum:'
  "23": 'et géntibus reddet vindíctam, donec tollat plenitúdinem superbórum: et sceptra iniquórum contríbulet:'
  "24": 'donec reddat homínibus secúndum actus suos, et secúndum ópera Adæ, et secúndum præsumptiónem illíus:'
  "25": donec iúdicet iudícium plebis suæ, et oblectábit iustos misericórdia sua.
  "26": Speciósa misericórdia Dei in témpore tribulatiónis, quasi nubes plúviæ in témpore siccitátis.
