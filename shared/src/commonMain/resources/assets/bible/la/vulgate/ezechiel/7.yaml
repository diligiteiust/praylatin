bible: vulgate
lang: la
language: Latina
book: Ezechiel
chapter: "7"
verses:
  "1": 'Et factus est sermo Dómini ad me, dicens:'
  "2": 'Et tu fili hóminis, hæc dicit Dóminus Deus terræ Israel: Finis venit, venit finis super quátuor plagas terræ.'
  "3": 'Nunc finis super te, et immíttam furórem meum in te: et iudicábo te iuxta vias tuas, et ponam contra te omnes abominatiónes tuas.'
  "4": 'Et non parcet óculus meus super te, et non miserébor: sed vias tuas ponam super te, et abominatiónes tuæ in médio tui erunt: et sciétis quia ego Dóminus.'
  "5": 'Hæc dicit Dóminus Deus: Afflíctio una, afflíctio ecce venit.'
  "6": 'Finis venit, venit finis, evigilávit advérsum te: ecce venit.'
  "7": 'Venit contrítio super te, qui hábitas in terra: venit tempus, prope est dies occisiónis, et non glóriæ móntium.'
  "8": 'Nunc de propínquo effúndam iram meam super te, et complébo furórem meum in te: et iudicábo te iuxta vias tuas, et impónam tibi ómnia scélera tua:'
  "9": 'et non parcet óculus meus, nec miserébor: sed vias tuas impónam tibi, et abominatiónes tuæ in médio tui erunt: et sciétis quia ego sum Dóminus percútiens.'
  "10": 'Ecce dies, ecce venit: egréssa est contrítio, flóruit virga, germinávit supérbia:'
  "11": 'iníquitas surréxit in virga impietátis: non ex eis, et non ex pópulo, neque ex sónitu eórum: et non erit réquies in eis.'
  "12": 'Venit tempus, appropinquávit dies: qui emit, non lætétur: et qui vendit, non lúgeat: quia ira super omnem pópulum eius.'
  "13": 'Quia qui vendit, ad id quod véndidit non revertétur, et adhuc in vivéntibus vita eórum: vísio enim ad omnem multitúdinem eius non regrediétur: et vir in iniquitáte vitæ suæ non confortábitur.'
  "14": 'Cánite tuba, præparéntur omnes, et non est qui vadat ad prœ́lium: ira enim mea super univérsum pópulum eius.'
  "15": 'Gládius foris: et pestis, et fames intrínsecus: qui in agro est, gládio moriétur: et qui in civitáte, pestiléntia et fame devorabúntur.'
  "16": 'Et salvabúntur qui fúgerint ex eis: et erunt in móntibus quasi colúmbæ convállium omnes trépidi, unusquísque in iniquitáte sua.'
  "17": Omnes manus dissolvéntur, et ómnia génua fluent aquis.
  "18": 'Et accíngent se cilíciis, et opériet eos formído: et in omni fácie confúsio, et in univérsis capítibus eórum calvítium.'
  "19": 'Argéntum eórum foras proiciétur, et aurum eórum in sterquilínium erit. Argéntum eórum, et aurum eórum non valébit liberáre eos in die furóris Dómini: ánimam suam non saturábunt, et ventres eórum non implebúntur: quia scándalum iniquitátis eórum factum est.'
  "20": 'Et ornaméntum monílium suórum in supérbiam posuérunt, et imágines abominatiónum suárum, et simulacrórum fecérunt ex eo: propter hoc dedi eis illud in immundítiam:'
  "21": et dabo illud in manus alienórum ad diripiéndum, et ímpiis terræ in prædam, et contaminábunt illud.
  "22": 'Et avértam fáciem meam ab eis, et violábunt arcánum meum: et introíbunt in illud emissárii, et contaminábunt illud.'
  "23": 'Fac conclusiónem: quóniam terra plena est iudício sánguinum, et cívitas plena iniquitáte.'
  "24": 'Et addúcam péssimos de géntibus, et possidébunt domos eórum: et quiéscere fáciam supérbiam poténtium, et possidébunt sanctuária eórum.'
  "25": Angústia superveniénte, requírent pacem, et non erit.
  "26": 'Conturbátio super conturbatiónem véniet, et audítus super audítum: et quærent visiónem de prophéta, et lex períbit a sacerdóte, et consílium a senióribus.'
  "27": 'Rex lugébit, et princeps induétur mœróre, et manus pópuli terræ conturbabúntur. Secúndum viam eórum fáciam eis, et secúndum iudícia eórum iudicábo eos: et scient quia ego Dóminus.'
