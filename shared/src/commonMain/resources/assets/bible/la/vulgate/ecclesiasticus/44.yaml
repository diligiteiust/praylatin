bible: vulgate
lang: la
language: Latina
book: Ecclesiasticus
chapter: "44"
verses:
  "1": Laudémus viros gloriósos, et paréntes nostros in generatióne sua.
  "2": Multam glóriam fecit Dóminus magnificéntia sua a sǽculo.
  "3": Dominántes in potestátibus suis, hómines magni virtúte et prudéntia sua prǽditi, nuntiántes in prophétis dignitátem prophetárum,
  "4": et imperántes in præsénti pópulo, et virtúte prudéntiæ pópulis sanctíssima verba.
  "5": In perítia sua requiréntes modos músicos, et narrántes cármina scripturárum.
  "6": Hómines dívites in virtúte, pulchritúdinis stúdium habéntes, pacificántes in dómibus suis.
  "7": Omnes isti in generatiónibus gentis suæ glóriam adépti sunt, et in diébus suis habéntur in láudibus.
  "8": 'Qui de illis nati sunt, reliquérunt nomen narrándi laudes eórum:'
  "9": 'et sunt quorum non est memória: periérunt quasi qui non fúerint: et nati sunt quasi non nati, et fílii ipsórum cum ipsis.'
  "10": 'Sed illi viri misericórdiæ sunt, quorum pietátes non defuérunt:'
  "11": cum sémine eórum pérmanent bona,
  "12": 'heréditas sancta nepótes eórum, et in testaméntis stetit semen eórum:'
  "13": 'et fílii eórum propter illos usque in ætérnum manent: semen eórum et glória eórum non derelinquétur.'
  "14": Córpora ipsórum in pace sepúlta sunt, et nomen eórum vivit in generatiónem et generatiónem.
  "15": Sapiéntiam ipsórum narrent pópuli, et laudem eórum núntiet ecclésia.
  "16": Enoch plácuit Deo, et translátus est in paradísum, ut det géntibus pœniténtiam.
  "17": Noe invéntus est perféctus, iustus, et in témpore iracúndiæ factus est reconciliátio.
  "18": Ideo dimíssum est réliquum terræ, cum factum est dilúvium.
  "19": Testaménta sǽculi pósita sunt apud illum, ne deléri possit dilúvio omnis caro.
  "20": 'Abraham magnus pater multitúdinis géntium, et non est invéntus símilis illi in glória: qui conservávit legem Excélsi, et fuit in testaménto cum illo.'
  "21": In carne eius stare fecit testaméntum, et in tentatióne invéntus est fidélis.
  "22": Ideo iureiurándo dedit illi glóriam in gente sua, créscere illum quasi terræ cúmulum,
  "23": et ut stellas exaltáre semen eius, et hereditáre illos a mari usque ad mare, et a flúmine usque ad términos terræ.
  "24": Et in Isaac eódem modo fecit, propter Abraham patrem eius.
  "25": Benedictiónem ómnium géntium dedit illi Dóminus, et testaméntum confirmávit super caput Iacob.
  "26": Agnóvit eum in benedictiónibus suis, et dedit illi hereditátem, et divísit illi partem in tríbubus duódecim.
  "27": Et conservávit illi hómines misericórdiæ, inveniéntes grátiam in óculis omnis carnis.
