bible: vulgate
lang: la
language: Latina
book: Numeri
chapter: "23"
verses:
  "1": 'Dixítque Bálaam ad Balac: Ædífica mihi hic septem aras, et para tótidem vítulos, eiusdémque númeri aríetes.'
  "2": Cumque fecísset iuxta sermónem Bálaam, imposuérunt simul vítulum et aríetem super aram.
  "3": 'Dixítque Bálaam ad Balac: Sta paulísper iuxta holocáustum tuum, donec vadam, si forte occúrrat mihi Dóminus, et quodcúmque imperáverit, loquar tibi.'
  "4": 'Cumque abiísset velóciter, occúrrit illi Deus. Locutúsque ad eum Bálaam: Septem, inquit, aras eréxi, et impósui vítulum et aríetem désuper.'
  "5": 'Dóminus autem pósuit verbum in ore eius, et ait: Revértere ad Balac, et hæc loquéris.'
  "6": 'Revérsus invénit stantem Balac iuxta holocáustum suum, et omnes príncipes Moabitárum:'
  "7": 'assumptáque parábola sua, dixit: De Aram addúxit me Balac rex Moabitárum, de móntibus oriéntis: Veni, inquit, et máledic Iacob: própera, et detestáre Israel.'
  "8": Quómodo maledícam, cui non maledíxit Deus? qua ratióne detéster, quem Dóminus non detestátur?
  "9": De summis silícibus vidébo eum, et de cóllibus considerábo illum. Pópulus solus habitábit, et inter gentes non reputábitur.
  "10": Quis dinumeráre possit púlverem Iacob, et nosse númerum stirpis Israel? Moriátur ánima mea morte iustórum, et fiant novíssima mea horum simília.
  "11": 'Dixítque Balac ad Bálaam: Quid est hoc quod agis? ut maledíceres inimícis meis vocávi te, et tu e contrário benedícis eis.'
  "12": 'Cui ille respóndit: Num áliud possum loqui, nisi quod iússerit Dóminus?'
  "13": 'Dixit ergo Balac: Veni mecum in álterum locum unde partem Israel vídeas, et totum vidére non possis: inde maledícito ei.'
  "14": Cumque duxísset eum in locum sublímem, super vérticem montis Phasga, ædificávit Bálaam septem aras, et impósitis supra vítulo atque aríete,
  "15": 'dixit ad Balac: Sta hic iuxta holocáustum tuum, donec ego óbvius pergam.'
  "16": 'Cui cum Dóminus occurrísset, posuissétque verbum in ore eius, ait: Revértere ad Balac, et hæc loquéris ei.'
  "17": 'Revérsus invénit eum stantem iuxta holocáustum suum, et príncipes Moabitárum cum eo. Ad quem Balac: Quid, inquit, locútus est Dóminus?'
  "18": 'At ille, assúmpta parábola sua, ait: Sta Balac, et auscúlta, audi fili Sephor:'
  "19": Non est Deus quasi homo, ut mentiátur, nec ut fílius hóminis, ut mutétur. Dixit ergo, et non fáciet? locútus est, et non implébit?
  "20": 'Ad benedicéndum addúctus sum: benedictiónem prohibére non váleo.'
  "21": Non est idólum in Iacob, nec vidétur simulácrum in Israel. Dóminus Deus eius cum eo est, et clangor victóriæ regis in illo.
  "22": Deus edúxit illum de Ægýpto, cuius fortitúdo símilis est rhinocerótis.
  "23": 'Non est augúrium in Iacob, nec divinátio in Israel: tempóribus suis dicétur Iacob et Israéli quid operátus sit Deus.'
  "24": 'Ecce pópulus ut leǽna consúrget, et quasi leo erigétur: non accubábit donec dévoret prædam, et occisórum sánguinem bibat.'
  "25": 'Dixítque Balac ad Bálaam: Nec maledícas ei, nec benedícas.'
  "26": 'Et ille ait: Nonne dixi tibi quod quidquid mihi Deus imperáret, hoc fácerem?'
  "27": 'Et ait Balac ad eum: Veni, et ducam te ad álium locum: si forte pláceat Deo ut inde maledícas eis.'
  "28": Cumque duxísset eum super vérticem montis Phogor, qui réspicit solitúdinem,
  "29": 'dixit ei Bálaam: Ædífica mihi hic septem aras, et para tótidem vítulos, eiusdémque númeri aríetes.'
  "30": 'Fecit Balac ut Bálaam díxerat: imposuítque vítulos et aríetes per síngulas aras.'
