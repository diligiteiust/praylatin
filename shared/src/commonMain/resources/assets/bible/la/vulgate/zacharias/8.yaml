bible: vulgate
lang: la
language: Latina
book: Zacharias
chapter: "8"
verses:
  "1": 'Et factum est verbum Dómini exercítuum, dicens:'
  "2": 'Hæc dicit Dóminus exercítuum: Zelátus sum Sion zelo magno, et indignatióne magna zelátus sum eam.'
  "3": 'Hæc dicit Dóminus exercítuum: Revérsus sum ad Sion, et habitábo in médio Ierúsalem: et vocábitur Ierúsalem Cívitas veritátis, et Mons Dómini exercítuum mons sanctificátus.'
  "4": 'Hæc dicit Dóminus exercítuum: Adhuc habitábunt senes, et anus in platéis Ierúsalem: et viri báculus in manu eius præ multitúdine diérum.'
  "5": Et platéæ civitátis complebúntur infántibus et puéllis ludéntibus in platéis eius.
  "6": 'Hæc dicit Dóminus exercítuum: Si vidébitur diffícile in óculis reliquiárum pópuli huius in diébus illis, numquid in óculis meis diffícile erit? dicit Dóminus exercítuum.'
  "7": 'Hæc dicit Dóminus exercítuum: Ecce ego salvábo pópulum meum de terra oriéntis, et de terra occásus solis.'
  "8": 'Et addúcam eos, et habitábunt in médio Ierúsalem: et erunt mihi in pópulum, et ego ero eis in Deum, in veritáte, et in iustítia.'
  "9": 'Hæc dicit Dóminus exercítuum: Conforténtur manus vestræ, qui audítis in his diébus sermónes istos per os prophetárum, in die qua fundáta est domus Dómini exercítuum, ut templum ædificarétur.'
  "10": 'Síquidem ante dies illos merces hóminum non erat, nec merces iumentórum erat: neque introeúnti, neque exeúnti erat pax præ tribulatióne: et dimísi omnes hómines, unumquémque contra próximum suum.'
  "11": Nunc autem non iuxta dies prióres ego fáciam relíquiis pópuli huius, dicit Dóminus exercítuum,
  "12": 'sed semen pacis erit: vínea dabit fructum suum, et terra dabit germen suum, et cæli dabunt rorem suum: et possidére fáciam relíquias pópuli huius univérsa hæc.'
  "13": 'Et erit: sicut erátis maledíctio in géntibus, domus Iuda, et domus Israel: sic salvábo vos, et éritis benedíctio: nolíte timére, conforténtur manus vestræ.'
  "14": 'Quia hæc dicit Dóminus exercítuum: Sicut cogitávi ut afflígerem vos, cum ad iracúndiam provocássent patres vestri me, dicit Dóminus,'
  "15": 'et non sum misértus: sic convérsus cogitávi in diébus istis ut benefáciam dómui Iuda, et Ierúsalem: nolíte timére.'
  "16": 'Hæc sunt ergo verba, quæ faciétis: Loquímini veritátem unusquísque cum próximo suo: veritátem, et iudícium pacis iudicáte in portis vestris.'
  "17": 'Et unusquísque malum contra amícum suum ne cogitétis in córdibus vestris, et iuraméntum mendax ne diligátis: ómnia enim hæc sunt, quæ odi, dicit Dóminus.'
  "18": 'Et factum est verbum Dómini exercítuum ad me, dicens:'
  "19": 'Hæc dicit Dóminus exercítuum: Ieiúnium quarti, et ieiúnium quinti, et ieiúnium séptimi, et ieiúnium décimi erit dómui Iuda in gáudium, et lætítiam, et in solemnitátes præcláras: veritátem tantum, et pacem dilígite.'
  "20": 'Hæc dicit Dóminus exercítuum: Usquequo véniant pópuli, et hábitent in civitátibus multis,'
  "21": 'et vadant habitatóres, unus ad álterum, dicéntes: Eámus, et deprecémur fáciem Dómini, et quærámus Dóminum exercítuum: vadam étiam ego.'
  "22": Et vénient pópuli multi, et gentes robústæ, ad quæréndum Dóminum exercítuum in Ierúsalem, et deprecándam fáciem Dómini.
  "23": 'Hæc dicit Dóminus exercítuum: In diébus illis, in quibus apprehéndent decem hómines ex ómnibus linguis géntium, et apprehéndent fímbriam viri Iudǽi, dicéntes: Ibimus vobíscum: audívimus enim quóniam Deus vobíscum est.'
