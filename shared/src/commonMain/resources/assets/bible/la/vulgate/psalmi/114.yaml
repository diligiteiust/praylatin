bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "114"
verses:
  "1": Allelúia. Diléxi, quóniam exáudiet Dóminus vocem oratiónis meæ.
  "2": 'Quia inclinávit aurem suam mihi: et in diébus meis invocábo.'
  "3": 'Circumdedérunt me dolóres mortis: et perícula inférni invenérunt me. Tribulatiónem et dolórem invéni,'
  "4": 'et nomen Dómini invocávi. O Dómine líbera ánimam meam:'
  "5": miséricors Dóminus, et iustus, et Deus noster miserétur.
  "6": 'Custódiens párvulos Dóminus: humiliátus sum, et liberávit me.'
  "7": 'Convértere ánima mea in réquiem tuam: quia Dóminus benefécit tibi.'
  "8": 'Quia erípuit ánimam meam de morte: óculos meos a lácrymis, pedes meos a lapsu.'
  "9": Placébo Dómino in regióne vivórum.
