bible: vulgate
lang: la
language: Latina
book: I Regum
chapter: "10"
verses:
  "1": Sed et regína Saba, audíta fama Salomónis in nómine Dómini, venit tentáre eum in ænigmátibus.
  "2": Et ingréssa Ierúsalem multo cum comitátu, et divítiis, camélis portántibus arómata, et aurum infinítum nimis, et gemmas pretiósas, venit ad regem Salomónem, et locúta est ei univérsa quæ habébat in corde suo.
  "3": 'Et dócuit eam Sálomon ómnia verba, quæ proposúerat: non fuit sermo, qui regem posset latére, et non respondéret ei.'
  "4": Videns autem regína Saba omnem sapiéntiam Salomónis, et domum, quam ædificáverat,
  "5": 'et cibos mensæ eius, et habitácula servórum, et órdines ministrántium, vestésque eórum, et pincérnas, et holocáusta, quæ offerébat in domo Dómini: non habébat ultra spíritum.'
  "6": 'Dixítque ad regem: Verus est sermo, quem audívi in terra mea'
  "7": 'super sermónibus tuis, et super sapiéntia tua: et non credébam narrántibus mihi, donec ipsa veni, et vidi óculis meis, et probávi quod média pars mihi nuntiáta non fúerit: maior est sapiéntia et ópera tua, quam rumor, quem audívi.'
  "8": Beáti viri tui, et beáti servi tui, qui stant coram te semper, et áudiunt sapiéntiam tuam.
  "9": Sit Dóminus Deus tuus benedíctus, cui complacuísti, et pósuit te super thronum Israel, eo quod diléxerit Dóminus Israel in sempitérnum, et constítuit te regem, ut fáceres iudícium et iustítiam.
  "10": 'Dedit ergo regi centum vigínti talénta auri, et arómata multa nimis, et gemmas pretiósas: non sunt alláta ultra arómata tam multa, quam ea quæ dedit regína Saba regi Salomóni.'
  "11": (Sed et classis Hiram, quæ portábat aurum de Ophir, áttulit ex Ophir ligna thýina multa nimis, et gemmas pretiósas.
  "12": 'Fecítque rex de lignis thýinis fulcra domus Dómini et domus régiæ, et cítharas lyrásque cantóribus: non sunt alláta huiuscémodi ligna thýina, neque visa usque in præséntem diem.)'
  "13": 'Rex autem Sálomon dedit regínæ Saba ómnia quæ vóluit, et petívit ab eo: excéptis his, quæ ultro obtúlerat ei múnere régio. Quæ revérsa est, et ábiit in terram suam cum servis suis.'
  "14": 'Erat autem pondus auri, quod afferebátur Salomóni per annos síngulos, sexcentórum sexagínta sex talentórum auri:'
  "15": excépto eo, quod afferébant viri, qui super vectigália erant, et negotiatóres, universíque scruta vendéntes, et omnes reges Arábiæ, ducésque terræ.
  "16": 'Fecit quoque rex Sálomon ducénta scuta de auro puríssimo: sexcéntos auri siclos dedit in láminas scuti uníus.'
  "17": 'Et trecéntas peltas ex auro probáto: trecéntæ minæ auri unam peltam vestiébant: posuítque eas rex in domo saltus Líbani.'
  "18": 'Fecit étiam rex Sálomon thronum de ébore grandem: et vestívit eum auro fulvo nimis,'
  "19": 'qui habébat sex gradus: et súmmitas throni rotúnda erat in parte posterióri: et duæ manus hinc atque inde tenéntes sedíle: et duo leónes stabant iuxta manus síngulas.'
  "20": 'Et duódecim leúnculi stantes super sex gradus hinc atque inde: non est factum tale opus in univérsis regnis.'
  "21": 'Sed et ómnia vasa, quibus potábat rex Sálomon, erant áurea: et univérsa supéllex domus saltus Líbani de auro puríssimo: non erat argéntum, nec alicúius prétii putabátur in diébus Salomónis,'
  "22": quia classis regis per mare cum classe Hiram semel per tres annos ibat in Tharsis, déferens inde aurum, et argéntum, et dentes elephantórum, et símias, et pavos.
  "23": Magnificátus est ergo rex Sálomon super omnes reges terræ divítiis, et sapiéntia.
  "24": Et univérsa terra desiderábat vultum Salomónis, ut audíret sapiéntiam eius, quam déderat Deus in corde eius.
  "25": Et sínguli deferébant ei múnera, vasa argéntea et áurea, vestes et arma béllica, arómata quoque, et equos et mulos per annos síngulos.
  "26": 'Congregavítque Sálomon currus et équites, et facti sunt ei mille quadringénti currus, et duódecim míllia équitum: et dispósuit eos per civitátes munítas, et cum rege in Ierúsalem.'
  "27": 'Fecítque ut tanta esset abundántia argénti in Ierúsalem, quanta et lápidum: et cedrórum prǽbuit multitúdinem quasi sycómoros, quæ nascúntur in campéstribus.'
  "28": Et educebántur equi Salomóni de Ægýpto, et de Coa. Negotiatóres enim regis emébant de Coa, et statúto prétio perducébant.
  "29": Egrediebátur autem quadríga ex Ægýpto sexcéntis siclis argénti, et equus centum quinquagínta. Atque in hunc modum cuncti reges Hethæórum et Sýriæ equos venúmdabant.
