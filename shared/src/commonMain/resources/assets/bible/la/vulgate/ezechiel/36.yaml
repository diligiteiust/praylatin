bible: vulgate
lang: la
language: Latina
book: Ezechiel
chapter: "36"
verses:
  "1": 'Tu autem fili hóminis prophéta super montes Israel, et dices: Montes Israel audíte verbum Dómini.'
  "2": 'Hæc dicit Dóminus Deus: Eo quod díxerit inimícus de vobis: Euge, altitúdines sempitérnæ in hereditátem datæ sunt nobis:'
  "3": 'proptérea vaticináre, et dic: Hæc dicit Dóminus Deus: Pro eo quod desoláti estis, et conculcáti per circúitum, et facti in hereditátem réliquis géntibus, et ascendístis super lábium linguæ, et oppróbrium pópuli:'
  "4": 'proptérea montes Israel audíte verbum Dómini Dei: Hæc dicit Dóminus Deus móntibus, et cóllibus, torréntibus vallibúsque, et desértis, pariétinis et úrbibus derelíctis, quæ depopulátæ sunt, et subsannátæ a réliquis géntibus per circúitum.'
  "5": 'Proptérea hæc dicit Dóminus Deus: Quóniam in igne zeli mei locútus sum de réliquis géntibus, et de Idumǽa univérsa, quæ dedérunt terram meam sibi in hereditátem cum gáudio, et toto corde, et ex ánimo: et eiecérunt eam ut vastárent:'
  "6": 'idcírco vaticináre super humum Israel, et dices móntibus, et cóllibus, iugis, et vállibus: Hæc dicit Dóminus Deus: Ecce ego in zelo meo, et in furóre meo locútus sum, eo quod confusiónem géntium sustinuéritis.'
  "7": 'Idcírco hæc dicit Dóminus Deus: Ego levávi manum meam, ut gentes, quæ in circúitu vestro sunt, ipsæ confusiónem suam portent.'
  "8": 'Vos autem montes Israel ramos vestros germinétis, et fructum vestrum afferátis pópulo meo Israel: prope enim est ut véniat:'
  "9": quia ecce ego ad vos, et convértar ad vos, et arabímini, et accipiétis seméntem.
  "10": 'Et multiplicábo in vobis hómines, omnémque domum Israel: et habitabúntur civitátes, et ruinósa instaurabúntur.'
  "11": 'Et replébo vos homínibus, et iuméntis: et multiplicabúntur, et crescent: et habitáre vos fáciam sicut a princípio, bonísque donábo maióribus, quam habuístis ab inítio: et sciétis quia ego Dóminus.'
  "12": 'Et addúcam super vos hómines pópulum meum Israel, et hereditáte possidébunt te: et eris eis in hereditátem, et non addes ultra ut absque eis sis.'
  "13": 'Hæc dicit Dóminus Deus: Pro eo quod dicunt de vobis: Devorátrix hóminum es, et suffócans gentem tuam:'
  "14": proptérea hómines non cómedes ámplius, et gentem tuam non necábis ultra, ait Dóminus Deus.
  "15": Nec audítam fáciam in te ámplius confusiónem géntium, et oppróbrium populórum nequáquam portábis, et gentem tuam non amíttes ámplius, ait Dóminus Deus.
  "16": 'Et factum est verbum Dómini ad me, dicens:'
  "17": Fili hóminis domus Israel habitavérunt in humo sua, et polluérunt eam in viis suis, et in stúdiis suis, iuxta immundítiam menstruátæ facta est via eórum coram me.
  "18": Et effúdi indignatiónem meam super eos pro sánguine, quem fudérunt super terram, et in idólis suis polluérunt eam.
  "19": 'Et dispérsi eos in gentes, et ventiláti sunt in terras: iuxta vias eórum, et adinventiónes eórum iudicávi eos.'
  "20": 'Et ingréssi sunt ad gentes, ad quas introiérunt, et polluérunt nomen sanctum meum, cum dicerétur de eis: Pópulus Dómini iste est, et de terra eius egréssi sunt.'
  "21": Et pepérci nómini sancto meo, quod pollúerat domus Israel in géntibus, ad quas ingréssi sunt.
  "22": 'Idcírco dices dómui Israel: Hæc dicit Dóminus Deus: Non propter vos ego fáciam, domus Israel, sed propter nomen sanctum meum, quod polluístis in géntibus, ad quas intrástis.'
  "23": 'Et sanctificábo nomen meum magnum, quod pollútum est inter gentes, quod polluístis in médio eárum: ut sciant gentes quia ego Dóminus, ait Dóminus exercítuum, cum sanctificátus fúero in vobis coram eis.'
  "24": Tollam quippe vos de géntibus, et congregábo vos de univérsis terris, et addúcam vos in terram vestram.
  "25": Et effúndam super vos aquam mundam, et mundabímini ab ómnibus inquinaméntis vestris, et ab univérsis idólis vestris mundábo vos.
  "26": 'Et dabo vobis cor novum, et spíritum novum ponam in médio vestri: et áuferam cor lapídeum de carne vestra, et dabo vobis cor cárneum.'
  "27": 'Et spíritum meum ponam in médio vestri: et fáciam ut in præcéptis meis ambulétis, et iudícia mea custodiátis et operémini.'
  "28": 'Et habitábitis in terra, quam dedi pátribus vestris: et éritis mihi in pópulum, et ego ero vobis in Deum.'
  "29": 'Et salvábo vos ex univérsis inquinaméntis vestris: et vocábo fruméntum, et multiplicábo illud, et non impónam vobis famem.'
  "30": Et multiplicábo fructum ligni, et genímina agri, ut non portétis ultra oppróbrium famis in géntibus.
  "31": 'Et recordabímini viárum vestrárum pessimárum, studiorúmque non bonórum: et displicébunt vobis iniquitátes vestræ, et scélera vestra.'
  "32": 'Non propter vos ego fáciam, ait Dóminus Deus, notum sit vobis: confundímini, et erubéscite super viis vestris, domus Israel.'
  "33": 'Hæc dicit Dóminus Deus: In die, qua mundávero vos ex ómnibus iniquitátibus vestris, et inhabitári fécero urbes, et instaurávero ruinósa,'
  "34": et terra desérta fúerit excúlta, quæ quondam erat desoláta in óculis omnis viatóris,
  "35": 'dicent: Terra illa incúlta facta est ut hortus voluptátis: et civitátes desértæ, et destitútæ atque suffóssæ, munítæ sedérunt.'
  "36": Et scient gentes quæcúmque derelíctæ fúerint in circúitu vestro, quia ego Dóminus ædificávi dissipáta, plantavíque incúlta, ego Dóminus locútus sim, et fécerim.
  "37": 'Hæc dicit Dóminus Deus: Adhuc in hoc invénient me domus Israel, ut fáciam eis: multiplicábo eos sicut gregem hóminum,'
  "38": 'ut gregem sanctum, ut gregem Ierúsalem in solemnitátibus eius: sic erunt civitátes desértæ, plenæ grégibus hóminum: et scient quia ego Dóminus.'
