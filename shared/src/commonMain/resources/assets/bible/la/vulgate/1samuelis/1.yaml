bible: vulgate
lang: la
language: Latina
book: I Samuelis
chapter: "1"
verses:
  "1": 'Fuit vir unus de Ramáthaim Sophim, de monte Ephraim, et nomen eius Elcana, fílius Iéroham, fílii Eliu, fílii Thohu, fílii Suph, Ephrathǽus:'
  "2": 'et hábuit duas uxóres, nomen uni Anna, et nomen secúndæ Phenénna. Fuerúntque Phenénnæ fílii: Annæ autem non erant líberi.'
  "3": Et ascendébat vir ille de civitáte sua statútis diébus, ut adoráret et sacrificáret Dómino exercítuum in Silo. Erant autem ibi duo fílii Heli, Ophni et Phínees, sacerdótes Dómini.
  "4": 'Venit ergo dies, et immolávit Elcana, dedítque Phenénnæ uxóri suæ, et cunctis fíliis eius, et filiábus, partes:'
  "5": Annæ autem dedit partem unam tristis, quia Annam diligébat. Dóminus autem conclúserat vulvam eius.
  "6": 'Affligébat quoque eam ǽmula eius, et veheménter angébat, in tantum ut exprobráret quod Dóminus conclusísset vulvam eius:'
  "7": 'sicque faciébat per síngulos annos, cum redeúnte témpore ascénderent ad templum Dómini, et sic provocábat eam: porro illa flebat, et non capiébat cibum.'
  "8": 'Dixit ergo ei Elcana vir suus: Anna, cur fles? et quare non cómedis? et quam ob rem afflígitur cor tuum? numquid non ego mélior tibi sum, quam decem fílii?'
  "9": Surréxit autem Anna postquam coméderat, et bíberat in Silo. Et Heli sacerdóte sedénte super sellam ante postes templi Dómini,
  "10": cum esset Anna amáro ánimo, orávit ad Dóminum, flens lárgiter,
  "11": 'et votum vovit, dicens: Dómine exercítuum, si respíciens víderis afflictiónem fámulæ tuæ, et recordátus mei fúeris, nec oblítus ancíllæ tuæ, dederísque servæ tuæ sexum virílem: dabo eum Dómino ómnibus diébus vitæ eius, et novácula non ascéndet super caput eius.'
  "12": Factum est autem, cum illa multiplicáret preces coram Dómino, ut Heli observáret os eius.
  "13": Porro Anna loquebátur in corde suo, tantúmque lábia illíus movebántur, et vox pénitus non audiebátur. Æstimávit ergo eam Heli temuléntam,
  "14": 'dixítque ei: Usquequo ébria eris? dígere paulísper vinum, quo mades.'
  "15": 'Respóndens Anna: Nequáquam, inquit, dómine mi: nam múlier infélix nimis ego sum: vinúmque et omne quod inebriáre potest, non bibi, sed effúdi ánimam meam in conspéctu Dómini.'
  "16": 'Ne réputes ancíllam tuam quasi unam de filiábus Bélial: quia ex multitúdine dolóris, et mœróris mei locúta sum usque in præsens.'
  "17": 'Tunc Heli ait ei: Vade in pace: et Deus Israel det tibi petitiónem tuam, quam rogásti eum.'
  "18": 'Et illa dixit: Utinam invéniat ancílla tua grátiam in óculis tuis. Et ábiit múlier in viam suam, et comédit, vultúsque illíus non sunt ámplius in divérsa mutáti.'
  "19": 'Et surrexérunt mane, et adoravérunt coram Dómino: reversíque sunt, et venérunt in domum suam Rámatha. Cognóvit autem Elcana Annam uxórem suam: et recordátus est eius Dóminus.'
  "20": 'Et factum est post círculum diérum, concépit Anna, et péperit fílium: vocavítque nomen eius Sámuel, eo quod a Dómino postulásset eum.'
  "21": Ascéndit autem vir eius Elcana, et omnis domus eius, ut immoláret Dómino hóstiam solémnem, et votum suum.
  "22": 'Et Anna non ascéndit: dixit enim viro suo: Non vadam donec ablactétur infans, et ducam eum, ut appáreat ante conspéctum Dómini, et máneat ibi iúgiter.'
  "23": 'Et ait ei Elcana vir suus: Fac quod bonum tibi vidétur, et mane donec abláctes eum: precórque ut ímpleat Dóminus verbum suum. Mansit ergo múlier, et lactávit fílium suum, donec amovéret eum a lacte.'
  "24": 'Et addúxit eum secum, postquam ablactáverat, in vítulis tribus, et tribus módiis farínæ, et ámphora vini, et addúxit eum ad domum Dómini in Silo. Puer autem erat adhuc infántulus:'
  "25": et immolavérunt vítulum, et obtulérunt púerum Heli.
  "26": 'Et ait Anna: Obsecro mi dómine, vivit ánima tua dómine: ego sum illa múlier, quæ steti coram te hic orans Dóminum.'
  "27": Pro púero isto orávi, et dedit mihi Dóminus petitiónem meam, quam postulávi eum.
  "28": 'Idcírco et ego commodávi eum Dómino cunctis diébus, quibus fúerit commodátus Dómino. Et adoravérunt ibi Dóminum. Et orávit Anna, et ait:'
