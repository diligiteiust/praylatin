bible: vulgate
lang: la
language: Latina
book: Matthaeus
chapter: "28"
verses:
  "1": Véspere autem sábbati, quæ lucéscit in prima sábbati, venit María Magdaléne, et áltera María, vidére sepúlcrum.
  "2": 'Et ecce terræmótus factus est magnus. Angelus enim Dómini descéndit de cælo: et accédens revólvit lápidem, et sedébat super eum:'
  "3": 'erat autem aspéctus eius sicut fulgur: et vestiméntum eius sicut nix.'
  "4": Præ timóre autem eius extérriti sunt custódes, et facti sunt velut mórtui.
  "5": 'Respóndens autem ángelus dixit muliéribus: Nolíte timére vos: scio enim, quod Iesum, qui crucifíxus est, quǽritis.'
  "6": 'Non est hic: surréxit enim, sicut dixit: veníte, et vidéte locum, ubi pósitus erat Dóminus.'
  "7": 'Et cito eúntes, dícite discípulis eius quia surréxit: et ecce præcédit vos in Galilǽam: ibi eum vidébitis: ecce prædíxi vobis.'
  "8": Et exiérunt cito de monuménto cum timóre, et gáudio magno, curréntes nuntiáre discípulis eius.
  "9": 'Et ecce Iesus occúrrit illis, dicens: Avéte. Illæ autem accessérunt, et tenuérunt pedes eius, et adoravérunt eum.'
  "10": 'Tunc ait illis Iesus: Nolíte timére: ite, nuntiáte frátribus meis ut eant in Galilǽam: ibi me vidébunt.'
  "11": Quæ cum abiíssent, ecce quidam de custódibus venérunt in civitátem, et nuntiavérunt princípibus sacerdótum ómnia, quæ facta fúerant.
  "12": Et congregáti cum senióribus consílio accépto, pecúniam copiósam dedérunt milítibus,
  "13": 'dicéntes: Dícite quia discípuli eius nocte venérunt, et furáti sunt eum, nobis dormiéntibus.'
  "14": Et si hoc audítum fúerit a prǽside, nos suadébimus ei, et secúros vos faciémus.
  "15": At illi, accépta pecúnia, fecérunt sicut erant edócti. Et divulgátum est verbum istud apud Iudǽos, usque in hodiérnum diem.
  "16": Undecim autem discípuli abiérunt in Galilǽam in montem, ubi constitúerat illis Iesus.
  "17": 'Et vidéntes eum adoravérunt: quidam autem dubitavérunt.'
  "18": 'Et accédens Iesus locútus est eis, dicens: Data est mihi omnis potéstas in cælo, et in terra.'
  "19": 'Eúntes ergo docéte omnes gentes: baptizántes eos in nómine Patris, et Fílii, et Spíritus sancti:'
  "20": 'docéntes eos serváre ómnia quæcúmque mandávi vobis: et ecce ego vobíscum sum ómnibus diébus, usque ad consummatiónem sǽculi.'
