bible: vulgate
lang: la
language: Latina
book: Proverbia
chapter: "31"
verses:
  "1": Verba Lamuélis regis. Vísio, qua erudívit eum mater sua.
  "2": Quid dilécte mi? quid dilécte úteri mei? quid dilécte votórum meórum?
  "3": Ne déderis muliéribus substántiam tuam, et divítias tuas ad deléndos reges.
  "4": 'Noli régibus, o Lámuel, noli régibus dare vinum, quia nullum secrétum est ubi regnat ebríetas:'
  "5": et ne forte bibant, et obliviscántur iudiciórum, et mutent causam filiórum páuperis.
  "6": 'Date síceram mœréntibus, et vinum his, qui amáro sunt ánimo:'
  "7": bibant, et obliviscántur egestátis suæ, et dolóris sui non recordéntur ámplius.
  "8": 'Aperi os tuum muto, et causis ómnium filiórum qui pertránseunt:'
  "9": aperi os tuum, decérne quod iustum est, et iúdica ínopem et páuperem.
  "10": Mulíerem fortem quis invéniet? procul et de últimis fínibus prétium eius.
  "11": Confídit in ea cor viri sui, et spóliis non indigébit.
  "12": Reddet ei bonum, et non malum, ómnibus diébus vitæ suæ.
  "13": Quæsívit lanam et linum, et operáta est consílio mánuum suárum.
  "14": Facta est quasi navis institóris, de longe portans panem suum.
  "15": Et de nocte surréxit, dedítque prædam domésticis suis, et cibária ancíllis suis.
  "16": 'Considerávit agrum, et emit eum: de fructu mánuum suárum plantávit víneam.'
  "17": Accínxit fortitúdine lumbos suos, et roborávit bráchium suum.
  "18": 'Gustávit, et vidit quia bona est negotiátio eius: non exstinguétur in nocte lucérna eius.'
  "19": Manum suam misit ad fórtia, et dígiti eius apprehendérunt fusum.
  "20": Manum suam apéruit ínopi, et palmas suas exténdit ad páuperem.
  "21": 'Non timébit dómui suæ a frigóribus nivis: omnes enim doméstici eius vestíti sunt duplícibus.'
  "22": 'Stragulátam vestem fecit sibi: byssus, et púrpura induméntum eius.'
  "23": Nóbilis in portis vir eius, quando séderit cum senatóribus terræ.
  "24": Síndonem fecit, et véndidit, et cíngulum trádidit Chananǽo.
  "25": Fortitúdo et decor induméntum eius, et ridébit in die novíssimo.
  "26": Os suum apéruit sapiéntiæ, et lex cleméntiæ in lingua eius.
  "27": Considerávit sémitas domus suæ, et panem otiósa non comédit.
  "28": 'Surrexérunt fílii eius, et beatíssimam prædicavérunt: vir eius, et laudávit eam.'
  "29": 'Multæ fíliæ congregavérunt divítias: tu supergréssa es univérsas.'
  "30": 'Fallax grátia, et vana est pulchritúdo: múlier timens Dóminum, ipsa laudábitur.'
  "31": Date ei de fructu mánuum suárum, et laudent eam in portis ópera eius.
