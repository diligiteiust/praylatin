bible: vulgate
lang: la
language: Latina
book: Daniel
chapter: "7"
verses:
  "1": 'Anno primo Baltássar regis Babylónis, Dániel sómnium vidit: vísio autem cápitis eius in cubíli suo: et sómnium scribens, brevi sermóne comprehéndit: summatímque perstríngens, ait:'
  "2": Vidébam in visióne mea nocte, et ecce quátuor venti cæli pugnábant in mari magno.
  "3": Et quátuor béstiæ grandes ascendébant de mari divérsæ inter se.
  "4": 'Prima quasi leǽna, et alas habébat áquilæ: aspiciébam donec evúlsæ sunt alæ eius, et subláta est de terra, et super pedes quasi homo stetit, et cor hóminis datum est ei.'
  "5": 'Et ecce béstia ália símilis urso in parte stetit: et tres órdines erant in ore eius, et in déntibus eius, et sic dicébant ei: Surge, cómede carnes plúrimas.'
  "6": Post hæc aspiciébam, et ecce ália quasi pardus, et alas habébat quasi avis, quátuor super se, et quátuor cápita erant in béstia, et potéstas data est ei.
  "7": 'Post hæc aspiciébam in visióne noctis, et ecce béstia quarta terríbilis, atque mirábilis, et fortis nimis: dentes férreos habébat magnos, cómedens atque commínuens, et réliqua pédibus suis concúlcans: dissímilis autem erat céteris béstiis, quas víderam ante eam, et habébat córnua decem.'
  "8": 'Considerábam córnua, et ecce cornu áliud párvulum ortum est de médio eórum: et tria de córnibus primis evúlsa sunt a fácie eius: et ecce óculi, quasi óculi hóminis erant in cornu isto, et os loquens ingéntia.'
  "9": 'Aspiciébam donec throni pósiti sunt, et antíquus diérum sedit: vestiméntum eius cándidum quasi nix, et capílli cápitis eius quasi lana munda: thronus eius flammæ ignis: rotæ eius ignis accénsus.'
  "10": 'Flúvius ígneus rapidúsque egrediebátur a fácie eius: míllia míllium ministrábant ei, et décies míllies centéna míllia assistébant ei: iudícium sedit, et libri apérti sunt.'
  "11": 'Aspiciébam propter vocem sermónum grándium, quos cornu illud loquebátur: et vidi quóniam interfécta esset béstia, et perísset corpus eius, et tráditum esset ad comburéndum igni:'
  "12": aliárum quoque bestiárum abláta esset potéstas, et témpora vitæ constitúta essent eis usque ad tempus, et tempus.
  "13": 'Aspiciébam ergo in visióne noctis, et ecce cum núbibus cæli quasi fílius hóminis veniébat, et usque ad antíquum diérum pervénit: et in conspéctu eius obtulérunt eum.'
  "14": 'Et dedit ei potestátem, et honórem, et regnum: et omnes pópuli, tribus, et linguæ ipsi sérvient: potéstas eius, potéstas ætérna, quæ non auferétur: et regnum eius, quod non corrumpétur.'
  "15": 'Hórruit spíritus meus: ego Dániel térritus sum in his, et visiónes cápitis mei conturbavérunt me.'
  "16": 'Accéssi ad unum de assisténtibus, et veritátem quærébam ab eo de ómnibus his. Qui dixit mihi interpretatiónem sermónum, et dócuit me:'
  "17": Hæ quátuor béstiæ magnæ, quátuor sunt regna, quæ consúrgent de terra.
  "18": Suscípient autem regnum sancti Dei altíssimi, et obtinébunt regnum usque in sǽculum, et sǽculum sæculórum.
  "19": 'Post hoc vólui diligénter díscere de béstia quarta, quæ erat dissímilis valde ab ómnibus, et terríbilis nimis: dentes et ungues eius férrei: comedébat, et comminuébat, et réliqua pédibus suis conculcábat:'
  "20": 'et de córnibus decem, quæ habébat in cápite: et de álio, quod ortum fúerat, ante quod cecíderant tria córnua: et de cornu illo, quod habébat óculos, et os loquens grándia, et maius erat céteris.'
  "21": Aspiciébam, et ecce cornu illud faciébat bellum advérsus sanctos, et prævalébat eis,
  "22": donec venit antíquus diérum, et iudícium dedit sanctis Excélsi, et tempus advénit, et regnum obtinuérunt sancti.
  "23": 'Et sic ait: Béstia quarta, regnum quartum erit in terra, quod maius erit ómnibus regnis, et devorábit univérsam terram, et conculcábit, et commínuet eam.'
  "24": 'Porro córnua decem ipsíus regni, decem reges erunt: et álius consúrget post eos, et ipse poténtior erit prióribus, et tres reges humiliábit.'
  "25": 'Et sermónes contra Excélsum loquétur, et sanctos Altíssimi cónteret: et putábit quod possit mutáre témpora, et leges, et tradéntur in manu eius usque ad tempus, et témpora, et dimídium témporis.'
  "26": Et iudícium sedébit, ut auferátur poténtia, et conterátur, et dispéreat usque in finem.
  "27": 'Regnum autem, et potéstas, et magnitúdo regni, quæ est subter omne cælum, detur pópulo sanctórum Altíssimi: cuius regnum, regnum sempitérnum est, et omnes reges sérvient ei, et obédient.'
  "28": 'Hucúsque finis verbi. Ego Dániel multum cogitatiónibus meis conturbábar, et fácies mea mutáta est in me: verbum autem in corde meo conservávi.'
