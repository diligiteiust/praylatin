bible: vulgate
lang: la
language: Latina
book: Proverbia
chapter: "3"
verses:
  "1": 'Fili mi, ne obliviscáris legis meæ, et præcépta mea cor tuum custódiat:'
  "2": longitúdinem enim diérum, et annos vitæ, et pacem appónent tibi.
  "3": 'Misericórdia et véritas te non déserant: circúmda eas gútturi tuo, et descríbe in tábulis cordis tui:'
  "4": et invénies grátiam, et disciplínam bonam coram Deo et homínibus.
  "5": Habe fidúciam in Dómino ex toto corde tuo, et ne innitáris prudéntiæ tuæ.
  "6": In ómnibus viis tuis cógita illum, et ipse díriget gressus tuos.
  "7": 'Ne sis sápiens apud temetípsum: time Deum, et recéde a malo:'
  "8": sánitas quippe erit umbilíco tuo, et irrigátio óssium tuórum.
  "9": 'Honóra Dóminum de tua substántia, et de primítiis ómnium frugum tuárum da ei:'
  "10": et implebúntur hórrea tua saturitáte, et vino torculária tua redundábunt.
  "11": 'Disciplínam Dómini, fili mi, ne abícias: nec defícias cum ab eo corríperis:'
  "12": 'quem enim díligit Dóminus, córripit: et quasi pater in fílio cómplacet sibi.'
  "13": Beátus homo, qui invénit sapiéntiam, et qui áffluit prudéntia.
  "14": 'Mélior est acquisítio eius negotiatióne argénti, et auri primi et puríssimi fructus eius:'
  "15": 'pretiósior est cunctis ópibus: et ómnia, quæ desiderántur, huic non valent comparári.'
  "16": Longitúdo diérum in déxtera eius, et in sinístra illíus divítiæ et glória.
  "17": Viæ eius viæ pulchræ, et omnes sémitæ illíus pacíficæ.
  "18": Lignum vitæ est his, qui apprehénderint eam, et qui tenúerit eam beátus.
  "19": 'Dóminus sapiéntia fundávit terram: stabilívit cælos prudéntia.'
  "20": Sapiéntia illíus erupérunt abýssi, et nubes rore concréscunt.
  "21": 'Fili mi, ne éffluant hæc ab óculis tuis. Custódi legem atque consílium:'
  "22": et erit vita ánimæ tuæ, et grátia fáucibus tuis.
  "23": Tunc ambulábis fiduciáliter in via tua, et pes tuus non impínget.
  "24": 'Si dormíeris, non timébis: quiésces, et suávis erit somnus tuus.'
  "25": Ne páveas repentíno terróre, et irruéntes tibi poténtias impiórum.
  "26": Dóminus enim erit in látere tuo, et custódiet pedem tuum ne capiáris.
  "27": 'Noli prohibére benefácere eum, qui potest: si vales, et ipse bénefac.'
  "28": 'Ne dicas amíco tuo: Vade, et revértere: cras dabo tibi: cum statim possis dare.'
  "29": Ne moliáris amíco tuo malum, cum ille in te hábeat fidúciam.
  "30": Ne conténdas advérsus hóminem frustra, cum ipse tibi nihil mali fécerit.
  "31": 'Ne æmuléris hóminem iniústum, nec imitéris vias eius:'
  "32": quia abominátio Dómini est omnis illúsor, et cum simplícibus sermocinátio eius.
  "33": 'Egéstas a Dómino in domo ímpii: habitácula autem iustórum benedicéntur.'
  "34": Ipse delúdet illusóres, et mansuétis dabit grátiam.
  "35": 'Glóriam sapiéntes possidébunt: stultórum exaltátio ignomínia.'
