bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "12"
verses:
  "1": In finem, Psalmus David. Usquequo Dómine obliviscéris me in finem? úsquequo avértis fáciem tuam a me?
  "2": Quámdiu ponam consília in ánima mea, dolórem in corde meo per diem?
  "3": Usquequo exaltábitur inimícus meus super me?
  "4": 'Réspice, et exáudi me, Dómine Deus meus. Illúmina óculos meos, ne unquam obdórmiam in morte:'
  "5": 'nequándo dicat inimícus meus: Præválui advérsus eum. Qui tríbulant me exsultábunt si motus fúero:'
  "6": 'ego autem in misericórdia tua sperávi. Exsultábit cor meum in salutári tuo: cantábo Dómino qui bona tríbuit mihi: et psallam nómini Dómini altíssimi.'
