bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "73"
verses:
  "1": 'Intelléctus Asaph. Ut quid Deus repulísti in finem: irátus est furor tuus super oves páscuæ tuæ?'
  "2": 'Memor esto congregatiónis tuæ, quam possedísti ab inítio. Redemísti virgam hereditátis tuæ: mons Sion, in quo habitásti in eo.'
  "3": 'Leva manus tuas in supérbias eórum in finem: quanta malignátus est inimícus in sancto!'
  "4": 'Et gloriáti sunt qui odérunt te, in médio solemnitátis tuæ. Posuérunt signa sua, signa:'
  "5": et non cognovérunt sicut in éxitu super summum. Quasi in silva lignórum secúribus
  "6": 'excidérunt iánuas eius in idípsum: in secúri, et áscia deiecérunt eam.'
  "7": 'Incendérunt igni sanctuárium tuum: in terra polluérunt tabernáculum nóminis tui.'
  "8": 'Dixérunt in corde suo cognátio eórum simul: Quiéscere faciámus omnes dies festos Dei a terra.'
  "9": 'Signa nostra non vídimus, iam non est prophéta: et nos non cognóscet ámplius.'
  "10": 'Usquequo Deus improperábit inimícus: irrítat adversárius nomen tuum in finem?'
  "11": Ut quid avértis manum tuam, et déxteram tuam, de médio sinu tuo in finem?
  "12": 'Deus autem rex noster ante sǽcula: operátus est salútem in médio terræ.'
  "13": 'Tu confirmásti in virtúte tua mare: contribulásti cápita dracónum in aquis.'
  "14": 'Tu confregísti cápita dracónis: dedísti eum escam pópulis Æthíopum.'
  "15": 'Tu dirupísti fontes et torréntes: tu siccásti flúvios Ethan.'
  "16": 'Tuus est dies, et tua est nox: tu fabricátus es auróram et solem.'
  "17": 'Tu fecísti omnes términos terræ: æstátem et ver tu plasmásti ea.'
  "18": 'Memor esto huius, inimícus improperávit Dómino: et pópulus insípiens incitávit nomen tuum.'
  "19": Ne tradas béstiis ánimas confiténtes tibi, et ánimas páuperum tuórum ne obliviscáris in finem.
  "20": 'Réspice in testaméntum tuum: quia repléti sunt, qui obscuráti sunt terræ dómibus iniquitátum.'
  "21": 'Ne avertátur húmilis factus confúsus: pauper et inops laudábunt nomen tuum.'
  "22": 'Exsúrge Deus, iúdica causam tuam: memor esto improperiórum tuórum, eórum quæ ab insipiénte sunt tota die.'
  "23": 'Ne obliviscáris voces inimicórum tuórum: supérbia eórum, qui te odérunt, ascéndit semper.'
