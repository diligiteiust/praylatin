bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "60"
verses:
  "1": In finem, In hymnis David.
  "2": 'Exáudi Deus deprecatiónem meam: inténde oratióni meæ.'
  "3": 'A fínibus terræ ad te clamávi: dum anxiarétur cor meum, in petra exaltásti me. Deduxísti me,'
  "4": 'quia factus es spes mea: turris fortitúdinis a fácie inimíci.'
  "5": 'Inhabitábo in tabernáculo tuo in sǽcula: prótegar in velaménto alárum tuárum.'
  "6": 'Quóniam tu Deus meus exaudísti oratiónem meam: dedísti hereditátem timéntibus nomen tuum.'
  "7": 'Dies super dies regis adícies: annos eius usque in diem generatiónis et generatiónis.'
  "8": 'Pérmanet in ætérnum in conspéctu Dei: misericórdiam et veritátem eius quis requíret?'
  "9": 'Sic psalmum dicam nómini tuo in sǽculum sǽculi: ut reddam vota mea de die in diem.'
