bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "27"
verses:
  "1": 'Psalmus ipsi David. Ad te Dómine clamábo, Deus meus ne síleas a me: nequándo táceas a me, et assimilábor descendéntibus in lacum.'
  "2": 'Exáudi Dómine vocem deprecatiónis meæ dum oro ad te: dum extóllo manus meas ad templum sanctum tuum.'
  "3": 'Ne simul trahas me cum peccatóribus: et cum operántibus iniquitátem ne perdas me: qui loquúntur pacem cum próximo suo, mala autem in córdibus eórum.'
  "4": 'Da illis secúndum ópera eórum, et secúndum nequítiam adinventiónum ipsórum: secúndum ópera mánuum eórum tríbue illis: redde retributiónem eórum ipsis.'
  "5": Quóniam non intellexérunt ópera Dómini, et in ópera mánuum eius déstrues illos, et non ædificábis eos.
  "6": 'Benedíctus Dóminus: quóniam exaudívit vocem deprecatiónis meæ.'
  "7": 'Dóminus adiútor meus, et protéctor meus: in ipso sperávit cor meum, et adiútus sum: et reflóruit caro mea, et ex voluntáte mea confitébor ei.'
  "8": 'Dóminus fortitúdo plebis suæ: et protéctor salvatiónum christi sui est.'
  "9": 'Salvum fac pópulum tuum Dómine, et bénedic hereditáti tuæ: et rege eos, et extólle illos usque in ætérnum.'
