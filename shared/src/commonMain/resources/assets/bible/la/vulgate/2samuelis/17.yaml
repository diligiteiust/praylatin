bible: vulgate
lang: la
language: Latina
book: II Samuelis
chapter: "17"
verses:
  "1": 'Dixit ergo Achítophel ad Absalom: Eligam mihi duódecim míllia virórum, et consúrgens pérsequar David hac nocte.'
  "2": 'Et írruens super eum (quippe qui lassus est, et solútis mánibus), percútiam eum: cumque fúgerit omnis pópulus, qui cum eo est, percútiam regem desolátum.'
  "3": 'Et redúcam univérsum pópulum, quómodo unus homo revérti solet: unum enim virum tu quæris: et omnis pópulus erit in pace.'
  "4": Placuítque sermo eius Absalom, et cunctis maióribus natu Israel.
  "5": 'Ait autem Absalom: Vocáte Chúsai Arachíten, et audiámus quid étiam ipse dicat.'
  "6": 'Cumque venísset Chúsai ad Absalom, ait Absalom ad eum: Huiuscémodi sermónem locútus est Achítophel: fácere debémus an non? quod das consílium?'
  "7": 'Et dixit Chúsai ad Absalom: Non est bonum consílium, quod dedit Achítophel hac vice.'
  "8": 'Et rursum íntulit Chúsai: Tu nosti patrem tuum, et viros, qui cum eo sunt, esse fortíssimos et amáro ánimo, véluti si ursa raptis cátulis in saltu sǽviat: sed et pater tuus vir bellátor est, nec morábitur cum pópulo.'
  "9": 'Fórsitan nunc látitat in fóveis, aut in uno, quo volúerit, loco: et cum cecíderit unus quílibet in princípio, áudiet quicúmque audíerit, et dicet: Facta est plaga in pópulo qui sequebátur Absalom.'
  "10": 'Et fortíssimus quisque, cuius cor est quasi leónis, pavóre solvétur: scit enim omnis pópulus Israel fortem esse patrem tuum, et robústos omnes qui cum eo sunt.'
  "11": 'Sed hoc mihi vidétur rectum esse consílium. Congregétur ad te univérsus Israel, a Dan usque Bersabée, quasi aréna maris innumerábilis: et tu eris in médio eórum.'
  "12": 'Et irruémus super eum in quocúmque loco invéntus fúerit: et operiémus eum, sicut cádere solet ros super terram: et non relinquémus de viris, qui cum eo sunt, ne unum quidem.'
  "13": Quod si urbem áliquam fúerit ingréssus, circúmdabit omnis Israel civitáti illi funes, et trahémus eam in torréntem, ut non reperiátur ne cálculus quidem ex ea.
  "14": 'Dixítque Absalom, et omnes viri Israel: Mélius est consílium Chúsai Arachítæ, consílio Achítophel: Dómini autem nutu dissipátum est consílium Achítophel útile, ut indúceret Dóminus super Absalom malum.'
  "15": 'Et ait Chúsai Sadoc, et Abíathar sacerdótibus: Hoc et hoc modo consílium dedit Achítophel Absalom, et senióribus Israel: et ego tale et tale dedi consílium.'
  "16": 'Nunc ergo míttite cito, et nuntiáte David, dicéntes: Ne moréris nocte hac in campéstribus desérti, sed absque dilatióne transgrédere: ne forte absorbeátur rex, et omnis pópulus qui cum eo est.'
  "17": 'Iónathas autem et Achímaas stabant iuxta fontem Rogel: ábiit ancílla et nuntiávit eis: et illi profécti sunt, ut reférrent ad regem David núntium: non enim póterant vidéri, aut introíre civitátem.'
  "18": 'Vidit autem eos quidam puer, et indicávit Absalom: illi vero cóncito gradu ingréssi sunt domum cuiúsdam viri in Bahúrim, qui habébat púteum in vestíbulo suo: et descendérunt in eum.'
  "19": 'Tulit autem múlier, et expándit velámen super os pútei, quasi siccans ptísanas: et sic látuit res.'
  "20": 'Cumque veníssent servi Absalom in domum, ad mulíerem dixérunt: Ubi est Achímaas et Iónathas? Et respóndit eis múlier: Transiérunt festinánter, gustáta páululum aqua. At hi qui quærébant, cum non reperíssent, revérsi sunt in Ierúsalem.'
  "21": 'Cumque abiíssent, ascendérunt illi de púteo, et pergéntes nuntiavérunt regi David, et dixérunt: Súrgite, et transíte cito flúvium: quóniam huiuscémodi dedit consílium contra vos Achítophel.'
  "22": 'Surréxit ergo David, et omnis pópulus qui cum eo erat, et transiérunt Iordánem, donec dilucésceret: et ne unus quidem resíduus fuit, qui non transísset flúvium.'
  "23": 'Porro Achítophel videns quod non fuísset factum consílium suum, stravit ásinum suum, surrexítque, et ábiit in domum suam et in civitátem suam: et dispósita domo sua, suspéndio intériit, et sepúltus est in sepúlcro patris sui.'
  "24": David autem venit in Castra, et Absalom transívit Iordánem, ipse et omnes viri Israel cum eo.
  "25": 'Amasam vero constítuit Absalom pro Ioab super exércitum: Amasa autem erat fílius viri, qui vocabátur Ietra de Iezraéli, qui ingréssus est ad Abígail fíliam Naas, sorórem Sárviæ, quæ fuit mater Ioab.'
  "26": Et castrametátus est Israel cum Absalom in terra Gálaad.
  "27": Cumque venísset David in Castra, Sobi fílius Naas de Rabbath filiórum Ammon, et Machir fílius Ammihel de Lódabar, et Berzellái Galaadítes de Rógelim,
  "28": obtulérunt ei stratória, et tapétia, et vasa fictília, fruméntum, et hórdeum, et farínam, et poléntam, et fabam, et lentem, et frixum cicer,
  "29": 'et mel, et butýrum, oves, et pingues vítulos: dederúntque David, et pópulo, qui cum eo erat, ad vescéndum: suspicáti enim sunt, pópulum fame et siti fatigári in desérto.'
