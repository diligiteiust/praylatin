bible: vulgate
lang: la
language: Latina
book: Ioannes
chapter: "6"
verses:
  "1": 'Post hæc ábiit Iesus trans mare Galilǽæ, quod est Tiberíadis:'
  "2": et sequebátur eum multitúdo magna, quia vidébant signa, quæ faciébat super his, qui infirmabántur.
  "3": 'Súbiit ergo in montem Iesus: et ibi sedébat cum discípulis suis.'
  "4": Erat autem próximum Pascha dies festus Iudæórum.
  "5": 'Cum sublevásset ergo óculos Iesus, et vidísset quia multitúdo máxima venit ad eum, dixit ad Philíppum: Unde emémus panes, ut mandúcent hi?'
  "6": 'Hoc autem dicébat tentans eum: ipse enim sciébat quid esset factúrus.'
  "7": 'Respóndit ei Philíppus: Ducentórum denariórum panes non suffíciunt eis, ut unusquísque módicum quid accípiat.'
  "8": 'Dicit ei unus ex discípulis eius, Andréas frater Simónis Petri:'
  "9": 'Est puer unus hic, qui habet quinque panes hordeáceos, et duos pisces: sed hæc quid sunt inter tantos?'
  "10": 'Dixit ergo Iesus: Fácite hómines discúmbere. Erat autem fœnum multum in loco. Discubuérunt ergo viri, número quasi quinque míllia.'
  "11": 'Accépit ergo Iesus panes: et cum grátias egísset, distríbuit discumbéntibus: simíliter et ex píscibus quantum volébant.'
  "12": 'Ut autem impléti sunt, dixit discípulis suis: Collígite quæ superavérunt fragménta, ne péreant.'
  "13": Collegérunt ergo, et implevérunt duódecim cóphinos fragmentórum ex quinque pánibus hordeáceis, quæ superfuérunt his, qui manducáverant.
  "14": 'Illi ergo hómines cum vidíssent quod Iesus fécerat signum, dicébant: Quia hic est vere prophéta, qui ventúrus est in mundum.'
  "15": Iesus ergo cum cognovísset quia ventúri essent ut ráperent eum, et fácerent eum regem, fugit íterum in montem ipse solus.
  "16": Ut autem sero factum est, descendérunt discípuli eius ad mare.
  "17": 'Et cum ascendíssent navim, venérunt trans mare in Caphárnaum: et ténebræ iam factæ erant: et non vénerat ad eos Iesus.'
  "18": Mare autem, vento magno flante, exsurgébat.
  "19": Cum remigássent ergo quasi stádia vigínti quinque aut trigínta, vident Iesum ambulántem supra mare, et próximum navi fíeri, et timuérunt.
  "20": 'Ille autem dicit eis: Ego sum, nolíte timére.'
  "21": Voluérunt ergo accípere eum in navim et statim navis fuit ad terram, in quam ibant.
  "22": 'Altera die, turba, quæ stabat trans mare, vidit quia navícula ália non erat ibi nisi una, et quia non introísset cum discípulis suis Iesus in navim, sed soli discípuli eius abiíssent:'
  "23": áliæ vero supervenérunt naves a Tiberíade iuxta locum ubi manducáverant panem, grátias agénte Dómino.
  "24": Cum ergo vidísset turba quia Iesus non esset ibi, neque discípuli eius, ascendérunt in navículas, et venérunt Caphárnaum quæréntes Iesum.
  "25": 'Et cum inveníssent eum trans mare, dixérunt ei: Rabbi, quando huc venísti?'
  "26": 'Respóndit eis Iesus, et dixit: Amen, amen dico vobis: quǽritis me non quia vidístis signa, sed quia manducástis ex pánibus, et saturáti estis.'
  "27": Operámini non cibum, qui perit, sed qui pérmanet in vitam ætérnam, quem Fílius hóminis dabit vobis. Hunc enim Pater signávit Deus.
  "28": 'Dixérunt ergo ad eum: Quid faciémus ut operémur ópera Dei?'
  "29": 'Respóndit Iesus, et dixit eis: Hoc est opus Dei, ut credátis in eum, quem misit ille.'
  "30": 'Dixérunt ergo ei: Quod ergo tu facis signum ut videámus, et credámus tibi? quid operáris?'
  "31": 'Patres nostri manducavérunt manna in desérto, sicut scriptum est: Panem de cælo dedit eis manducáre.'
  "32": 'Dixit ergo eis Iesus: Amen, amen dico vobis: non Móyses dedit vobis panem de cælo, sed Pater meus dat vobis panem de cælo verum.'
  "33": Panis enim Dei est, qui de cælo descéndit, et dat vitam mundo.
  "34": 'Dixérunt ergo ad eum: Dómine, semper da nobis panem hunc.'
  "35": 'Dixit autem eis Iesus: Ego sum panis vitæ: qui venit ad me, non esúriet: et qui credit in me, non sítiet unquam.'
  "36": Sed dixi vobis quia et vidístis me, et non créditis.
  "37": 'Omne, quod dat mihi Pater, ad me véniet: et eum, qui venit ad me, non eíciam foras:'
  "38": quia descéndi de cælo, non ut fáciam voluntátem meam, sed voluntátem eius, qui misit me.
  "39": 'Hæc est autem volúntas eius, qui misit me, Patris: ut omne, quod dedit mihi, non perdam ex eo, sed resúscitem illud in novíssimo die.'
  "40": 'Hæc est autem volúntas Patris mei, qui misit me: ut omnis, qui videt Fílium, et credit in eum, hábeat vitam ætérnam, et ego resuscitábo eum in novíssimo die.'
  "41": 'Murmurábant ergo Iudǽi de illo, quia dixísset: Ego sum panis vivus, qui de cælo descéndi,'
  "42": 'et dicébant: Nonne hic est Iesus fílius Ioseph, cuius nos nóvimus patrem, et matrem? Quómodo ergo dicit hic: Quia de cælo descéndi?'
  "43": 'Respóndit ergo Iesus, et dixit eis: Nolíte murmuráre in ínvicem:'
  "44": 'nemo potest veníre ad me, nisi Pater, qui misit me, tráxerit eum: et ego resuscitábo eum in novíssimo die.'
  "45": 'Est scriptum in prophétis: Et erunt omnes docíbiles Dei. Omnis, qui audívit a Patre, et dídicit, venit ad me.'
  "46": Non quia Patrem vidit quisquam, nisi is, qui est a Deo, hic vidit Patrem.
  "47": 'Amen, amen dico vobis: qui credit in me, habet vitam ætérnam.'
  "48": Ego sum panis vitæ.
  "49": Patres vestri manducavérunt manna in desérto, et mórtui sunt.
  "50": 'Hic est panis de cælo descéndens: ut si quis ex ipso manducáverit, non moriátur.'
  "51": Ego sum panis vivus, qui de cælo descéndi.
  "52": 'Si quis manducáverit ex hoc pane, vivet in ætérnum: et panis, quem ego dabo, caro mea est pro mundi vita.'
  "53": 'Litigábant ergo Iudǽi ad ínvicem, dicéntes: Quómodo potest hic nobis carnem suam dare ad manducándum?'
  "54": 'Dixit ergo eis Iesus: Amen, amen dico vobis: nisi manducavéritis carnem Fílii hóminis, et bibéritis eius sánguinem, non habébitis vitam in vobis.'
  "55": 'Qui mandúcat meam carnem, et bibit meum sánguinem, habet vitam ætérnam: et ego resuscitábo eum in novíssimo die.'
  "56": 'Caro enim mea, vere est cibus: et sanguis meus, vere est potus:'
  "57": qui mandúcat meam carnem, et bibit meum sánguinem, in me manet, et ego in illo.
  "58": 'Sicut misit me vivens Pater, et ego vivo propter Patrem: et qui mandúcat me, et ipse vivet propter me.'
  "59": Hic est panis, qui de cælo descéndit. Non sicut manducavérunt patres vestri manna, et mórtui sunt. Qui mandúcat hunc panem, vivet in ætérnum.
  "60": Hæc dixit in synagóga docens, in Caphárnaum.
  "61": 'Multi ergo audiéntes ex discípulis eius, dixérunt: Durus est hic sermo, et quis potest eum audíre?'
  "62": 'Sciens autem Iesus apud semetípsum quia murmurárent de hoc discípuli eius, dixit eis: Hoc vos scandalízat?'
  "63": Si ergo vidéritis Fílium hóminis ascendéntem ubi erat prius?
  "64": 'Spíritus est, qui vivíficat: caro non prodest quidquam: verba, quæ ego locútus sum vobis, spíritus et vita sunt.'
  "65": Sed sunt quidam ex vobis, qui non credunt. Sciébat enim ab inítio Iesus qui essent non credéntes, et quis traditúrus esset eum.
  "66": 'Et dicébat: Proptérea dixi vobis, quia nemo potest veníre ad me, nisi fúerit ei datum a Patre meo.'
  "67": 'Ex hoc multi discipulórum eius abiérunt retro: et iam non cum illo ambulábant.'
  "68": 'Dixit ergo Iesus ad duódecim: Numquid et vos vultis abíre?'
  "69": 'Respóndit ergo ei Simon Petrus: Dómine, ad quem íbimus? verba vitæ ætérnæ habes:'
  "70": et nos credídimus, et cognóvimus quia tu es Christus Fílius Dei.
  "71": 'Respóndit eis Iesus: Nonne ego vos duódecim elégi: et ex vobis unus diábolus est?'
  "72": 'Dicébat autem Iudam Simónis Iscariótem: hic enim erat traditúrus eum, cum esset unus ex duódecim.'
