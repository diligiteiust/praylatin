bible: vulgate
lang: la
language: Latina
book: Amos
chapter: "9"
verses:
  "1": 'Vidi Dóminum stantem super altáre, et dixit: Pércute cárdinem, et commoveántur superliminária: avarítia enim in cápite ómnium, et novíssimum eórum in gládio interfíciam: non erit fuga eis. Fúgient, et non salvábitur ex eis qui fúgerit.'
  "2": 'Si descénderint usque ad inférnum, inde manus mea edúcet eos: et si ascénderint usque in cælum, inde détraham eos.'
  "3": 'Et si abscónditi fúerint in vértice Carméli, inde scrutans áuferam eos: et si celáverint se ab óculis meis in profúndo maris, ibi mandábo serpénti, et mordébit eos.'
  "4": 'Et si abíerint in captivitátem coram inimícis suis, ibi mandábo gládio, et occídet eos: et ponam óculos meos super eos in malum, et non in bonum.'
  "5": 'Et Dóminus Deus exercítuum, qui tangit terram, et tabéscet: et lugébunt omnes habitántes in ea: et ascéndet sicut rivus omnis, et défluet sicut flúvius Ægýpti.'
  "6": 'Qui ædíficat in cælo ascensiónem suam, et fascículum suum super terram fundávit: qui vocat aquas maris, et effúndit eas super fáciem terræ, Dóminus nomen eius.'
  "7": Numquid non ut fílii Æthíopum vos estis mihi, fílii Israel, ait Dóminus? numquid non Israel ascéndere feci de terra Ægýpti, et Palæstínos de Cappadócia, et Syros de Cyréne?
  "8": 'Ecce óculi Dómini Dei super regnum peccans, et cónteram illud a fácie terræ: verúmtamen cónterens non cónteram domum Iacob, dicit Dóminus.'
  "9": 'Ecce enim mandábo ego, et concútiam in ómnibus géntibus domum Israel, sicut concútitur tríticum in cribro: et non cadet lapíllus super terram.'
  "10": 'In gládio moriéntur omnes peccatóres pópuli mei, qui dicunt: Non appropinquábit, et non véniet super nos malum.'
  "11": 'In die illa suscitábo tabernáculum David, quod cécidit: et reædificábo apertúras murórum eius, et ea, quæ corrúerant, instaurábo: et reædificábo illud sicut in diébus antíquis.'
  "12": 'Ut possídeant relíquias Idumǽæ, et omnes natiónes, eo quod invocátum sit nomen meum super eos: dicit Dóminus fáciens hæc.'
  "13": 'Ecce dies véniunt, dicit Dóminus: et comprehéndet arátor messórem, et calcátor uvæ mitténtem semen: et stillábunt montes dulcédinem, et omnes colli culti erunt.'
  "14": 'Et convértam captivitátem pópuli mei Israel: et ædificábunt civitátes desértas, et inhabitábunt: et plantábunt víneas, et bibent vinum eárum: et fácient hortos, et cómedent fructus eórum.'
  "15": Et plantábo eos super humum suam, et non evéllam eos ultra de terra sua, quam dedi eis, dicit Dóminus Deus tuus.
