bible: vulgate
lang: la
language: Latina
book: Iosue
chapter: "21"
verses:
  "1": 'Accesserúntque príncipes familiárum Levi ad Eleázarum sacerdótem, et Iósue fílium Nun, et ad duces cognatiónum per síngulas tribus filiórum Israel:'
  "2": 'locutíque sunt ad eos in Silo terræ Chánaan, atque dixérunt: Dóminus præcépit per manum Móysi, ut daréntur nobis urbes ad habitándum, et suburbána eárum ad alénda iuménta.'
  "3": Dederúntque fílii Israel de possessiónibus suis iuxta impérium Dómini, civitátes et suburbána eárum.
  "4": 'Egressáque est sors in famíliam Caath filiórum Aaron sacerdótis, de tríbubus Iuda, et Símeon, et Béniamin, civitátes trédecim:'
  "5": et réliquis filiórum Caath, id est Levítis, qui superfúerant, de tríbubus Ephraim, et Dan, et dimídia tribu Manásse, civitátes decem.
  "6": Porro fíliis Gerson egréssa est sors, ut accíperent de tríbubus Issachar, et Aser, et Néphthali, dimidiáque tribu Manásse in Basan, civitátes número trédecim.
  "7": Et fíliis Merári per cognatiónes suas de tríbubus Ruben, et Gad, et Zábulon, urbes duódecim.
  "8": Dederúntque fílii Israel Levítis civitátes et suburbána eárum, sicut præcépit Dóminus per manum Móysi, síngulis sorte tribuéntes.
  "9": De tríbubus filiórum Iuda et Símeon dedit Iósue civitátes, quarum ista sunt nómina,
  "10": fíliis Aaron per famílias Caath Levítici géneris (prima enim sors illis egréssa est),
  "11": Cariathárbe patris Enac, quæ vocátur Hebron, in monte Iuda, et suburbána eius per circúitum.
  "12": Agros vero et villas eius déderat Caleb fílio Iéphone ad possidéndum.
  "13": 'Dedit ergo fíliis Aaron sacerdótis Hebron confúgii civitátem, ac suburbána eius: et Lobnam cum suburbánis suis:'
  "14": et Iether, et Esthemo,
  "15": et Holon, et Dabir,
  "16": 'et Ain, et Ieta, et Béthsames, cum suburbánis suis: civitátes novem de tríbubus, ut dictum est, duábus.'
  "17": De tribu autem filiórum Béniamin, Gábaon, et Gabæ,
  "18": 'et Anathoth, et Almon, cum suburbánis suis: civitátes quátuor.'
  "19": Omnes simul civitátes filiórum Aaron sacerdótis, trédecim, cum suburbánis suis.
  "20": Réliquis vero per famílias filiórum Caath Levítici géneris hæc est data posséssio.
  "21": De tribu Ephraim urbes confúgii, Sichem cum suburbánis suis in monte Ephraim, et Gazer,
  "22": et Cíbsaim, et Béthoron, cum suburbánis suis, civitátes quátuor.
  "23": De tribu quoque Dan, Eltheco, et Gábathon,
  "24": et Aialon, et Gethrémmon, cum suburbánis suis, civitátes quátuor.
  "25": Porro de dimídia tribu Manásse, Thanach, et Gethrémmon, cum suburbánis suis, civitátes duæ.
  "26": Omnes civitátes decem, et suburbána eárum, datæ sunt fíliis Caath inferióris gradus.
  "27": Fíliis quoque Gerson Levítici géneris dedit de dimídia tribu Manásse confúgii civitátes, Gaulon in Basan, et Bosram, cum suburbánis suis, civitátes duas.
  "28": Porro de tribu Issachar, Césion, et Dábereth,
  "29": et Iáramoth, et Engánnim, cum suburbánis suis, civitátes quátuor.
  "30": De tribu autem Aser, Masal, et Abdon,
  "31": et Helcath, et Rohob, cum suburbánis suis, civitátes quátuor.
  "32": De tribu quoque Néphthali civitátes confúgii, Cedes in Galilǽa, et Hammoth Dor, et Carthan, cum suburbánis suis, civitátes tres.
  "33": Omnes urbes familiárum Gerson, trédecim, cum suburbánis suis.
  "34": Fíliis autem Merári Levítis inferióris gradus per famílias suas data est de tribu Zábulon, Iecnam, et Cartha,
  "35": et Damna, et Náalol, civitátes quátuor cum suburbánis suis.
  "36": De tribu Ruben ultra Iordánem contra Iéricho civitátes refúgii, Bosor in solitúdine, Misor, et Iaser, et Iethson, et Méphaath, civitátes quátuor cum suburbánis suis.
  "37": De tribu Gad civitátes confúgii, Ramoth in Gálaad, et Mánaim, et Hésebon, et Iazer, civitátes quátuor cum suburbánis suis.
  "38": Omnes urbes filiórum Merári per famílias et cognatiónes suas, duódecim.
  "39": Itaque civitátes univérsæ Levitárum in médio possessiónis filiórum Israel fuérunt quadragínta octo
  "40": cum suburbánis suis, síngulæ per famílias distribútæ.
  "41": 'Dedítque Dóminus Deus Israéli omnem terram, quam traditúrum se pátribus eórum iuráverat: et possedérunt illam, atque habitavérunt in ea.'
  "42": 'Datáque est ab eo pax in omnes per circúitum natiónes: nullúsque eis hóstium resístere ausus est, sed cuncti in eórum ditiónem redácti sunt.'
  "43": Ne unum quidem verbum, quod illis præstitúrum se esse promíserat, írritum fuit, sed rebus expléta sunt ómnia.
