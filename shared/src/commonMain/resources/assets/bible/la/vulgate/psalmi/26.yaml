bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "26"
verses:
  "1": Psalmus David priúsquam linirétur. Dóminus illuminátio mea, et salus mea, quem timébo? Dóminus protéctor vitæ meæ, a quo trepidábo?
  "2": 'Dum apprópiant super me nocéntes, ut edant carnes meas: qui tríbulant me inimíci mei, ipsi infirmáti sunt et cecidérunt.'
  "3": 'Si consístant advérsum me castra, non timébit cor meum: si exsúrgat advérsum me prœ́lium, in hoc ego sperábo.'
  "4": 'Unam pétii a Dómino, hanc requíram, ut inhábitem in domo Dómini ómnibus diébus vitæ meæ: ut vídeam voluptátem Dómini, et vísitem templum eius.'
  "5": 'Quóniam abscóndit me in tabernáculo suo: in die malórum protéxit me in abscóndito tabernáculi sui.'
  "6": 'In petra exaltávit me: et nunc exaltávit caput meum super inimícos meos. Circuívi, et immolávi in tabernáculo eius hóstiam vociferatiónis: cantábo, et psalmum dicam Dómino.'
  "7": 'Exáudi Dómine vocem meam, qua clamávi ad te: miserére mei, et exáudi me.'
  "8": 'Tibi dixit cor meum: Exquisívit te fácies mea: fáciem tuam Dómine requíram.'
  "9": 'Ne avértas fáciem tuam a me: ne declínes in ira a servo tuo. Adiútor meus esto: ne derelínquas me, neque despícias me Deus salutáris meus.'
  "10": 'Quóniam pater meus et mater mea dereliquérunt me: Dóminus autem assúmpsit me.'
  "11": 'Legem pone mihi Dómine in via tua: et dírige me in sémitam rectam propter inimícos meos.'
  "12": 'Ne tradíderis me in ánimas tribulántium me: quóniam insurrexérunt in me testes iníqui, et mentíta est iníquitas sibi.'
  "13": Credo vidére bona Dómini in terra vivéntium.
  "14": 'Exspécta Dóminum, viríliter age: et confortétur cor tuum, et sústine Dóminum.'
