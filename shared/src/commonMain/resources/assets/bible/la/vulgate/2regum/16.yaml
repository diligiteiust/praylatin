bible: vulgate
lang: la
language: Latina
book: II Regum
chapter: "16"
verses:
  "1": Anno décimo séptimo Phácee fílii Romelíæ, regnávit Achaz fílius Ióatham regis Iuda.
  "2": 'Vigínti annórum erat Achaz cum regnáre cœpísset, et sédecim annis regnávit in Ierúsalem: non fecit quod erat plácitum in conspéctu Dómini Dei sui sicut David pater eius:'
  "3": 'sed ambulávit in via regum Israel: ínsuper et fílium suum consecrávit, tránsferens per ignem secúndum idóla géntium, quæ dissipávit Dóminus coram fíliis Israel.'
  "4": Immolábat quoque víctimas, et adolébat incénsum in excélsis, et in cóllibus, et sub omni ligno frondóso.
  "5": 'Tunc ascéndit Rasin rex Sýriæ, et Phácee fílius Romelíæ rex Israel, in Ierúsalem ad prœliándum: cumque obsidérent Achaz, non valuérunt superáre eum.'
  "6": 'In témpore illo restítuit Rasin rex Sýriæ, Ailam Sýriæ, et eiécit Iudǽos de Aila: et Idumǽi venérunt in Ailam, et habitavérunt ibi usque in diem hanc.'
  "7": 'Misit autem Achaz núntios ad Theglathphálasar regem Assyriórum, dicens: Servus tuus, et fílius tuus ego sum: ascénde, et salvum me fac de manu regis Sýriæ, et de manu regis Israel, qui consurrexérunt advérsum me.'
  "8": Et cum collegísset argéntum et aurum, quod inveníri pótuit in domo Dómini, et in thesáuris regis, misit regi Assyriórum múnera.
  "9": 'Qui et acquiévit voluntáti eius: ascéndit enim rex Assyriórum in Damáscum, et vastávit eam, et tránstulit habitatóres eius Cyrénen: Rasin autem interfécit.'
  "10": 'Perrexítque rex Achaz in occúrsum Theglathphálasar regis Assyriórum in Damáscum: cumque vidísset altáre Damásci, misit rex Achaz ad Uríam sacerdótem exémplar eius, et similitúdinem iuxta omne opus eius.'
  "11": 'Exstruxítque Urías sacérdos altáre: iuxta ómnia quæ præcéperat rex Achaz de Damásco, ita fecit sacérdos Urías donec veníret rex Achaz de Damásco.'
  "12": 'Cumque venísset rex de Damásco, vidit altáre, et venerátus est illud: ascendítque et immolávit holocáusta, et sacrifícium suum,'
  "13": et libávit libámina, et fudit sánguinem pacificórum, quæ obtúlerat super altáre.
  "14": 'Porro altáre ǽreum, quod erat coram Dómino, tránstulit de fácie templi, et de loco altáris, et de loco templi Dómini: posuítque illud ex látere altáris ad aquilónem.'
  "15": 'Præcépit quoque rex Achaz Uríæ sacerdóti, dicens: Super altáre maius offer holocáustum matutínum, et sacrifícium vespertínum, et holocáustum regis, et sacrifícium eius, et holocáustum univérsi pópuli terræ, et sacrifícia eórum, et libámina eórum: et omnem sánguinem holocáusti, et univérsum sánguinem víctimæ super illud effúndes: altáre vero ǽreum erit parátum ad voluntátem meam.'
  "16": Fecit ígitur Urías sacérdos iuxta ómnia, quæ præcéperat rex Achaz.
  "17": 'Tulit autem rex Achaz cælátas bases, et lutérem, qui erat désuper: et mare depósuit de bobus ǽreis, qui sustentábant illud, et pósuit super paviméntum stratum lápide.'
  "18": 'Musach quoque sábbati, quod ædificáverat in templo: et ingréssum regis extérius convértit in templum Dómini propter regem Assyriórum.'
  "19": Réliqua autem verbórum Achaz, quæ fecit, nonne hæc scripta sunt in Libro sermónum diérum regum Iuda?
  "20": 'Dormivítque Achaz cum pátribus suis, et sepúltus est cum eis in civitáte David: et regnávit Ezechías fílius eius pro eo.'
