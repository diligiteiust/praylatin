bible: vulgate
lang: la
language: Latina
book: Iob
chapter: "33"
verses:
  "1": Audi ígitur Iob elóquia mea, et omnes sermónes meos auscúlta.
  "2": Ecce apérui os meum, loquátur lingua mea in fáucibus meis.
  "3": Símplici corde meo sermónes mei, et senténtiam puram lábia mea loquéntur.
  "4": Spíritus Dei fecit me, et spiráculum Omnipoténtis vivificávit me.
  "5": Si potes, respónde mihi, et advérsus fáciem meam consíste.
  "6": Ecce, et me sicut et te fecit Deus, et de eódem luto ego quoque formátus sum.
  "7": Verúmtamen miráculum meum non te térreat, et eloquéntia mea non sit tibi gravis.
  "8": 'Dixísti ergo in áuribus meis, et vocem verbórum tuórum audívi:'
  "9": 'Mundus sum ego, et absque delícto: immaculátus, et non est iníquitas in me.'
  "10": Quia querélas in me réperit, ídeo arbitrátus est me inimícum sibi.
  "11": Pósuit in nervo pedes meos, custodívit omnes sémitas meas.
  "12": 'Hoc est ergo, in quo non es iustificátus: respondébo tibi, quia maior sit Deus hómine.'
  "13": Advérsus eum conténdis, quod non ad ómnia verba respónderit tibi?
  "14": Semel lóquitur Deus, et secúndo idípsum non répetit.
  "15": 'Per sómnium in visióne noctúrna, quando írruit sopor super hómines, et dórmiunt in léctulo:'
  "16": tunc áperit aures virórum, et erúdiens eos ínstruit disciplína,
  "17": 'ut avértat hóminem ab his, quæ facit, et líberet eum de supérbia:'
  "18": 'éruens ánimam eius a corruptióne: et vitam illíus, ut non tránseat in gládium.'
  "19": Increpat quoque per dolórem in léctulo, et ómnia ossa eius marcéscere facit.
  "20": Abominábilis ei fit in vita sua panis, et ánimæ illíus cibus ante desiderábilis.
  "21": Tabéscet caro eius, et ossa, quæ tecta fúerant, nudabúntur.
  "22": Appropinquávit corruptióni ánima eius, et vita illíus mortíferis.
  "23": 'Si fúerit pro eo ángelus loquens, unus de míllibus, ut annúntiet hóminis æquitátem:'
  "24": 'miserébitur eius, et dicet: Líbera eum, ut non descéndat in corruptiónem: invéni in quo ei propítier.'
  "25": Consúmpta est caro eius a supplíciis, revertátur ad dies adolescéntiæ suæ.
  "26": 'Deprecábitur Deum, et placábilis ei erit: et vidébit fáciem eius in iúbilo, et reddet hómini iustítiam suam.'
  "27": 'Respíciet hómines, et dicet: Peccávi, et vere delíqui, et, ut eram dignus, non recépi.'
  "28": Liberávit ánimam suam, ne pérgeret in intéritum, sed vivens lucem vidéret.
  "29": Ecce hæc ómnia operátur Deus tribus vícibus per síngulos,
  "30": ut révocet ánimas eórum a corruptióne, et illúminet luce vivéntium.
  "31": 'Atténde Iob, et audi me: et tace, dum ego loquor.'
  "32": 'Si autem habes quod loquáris, respónde mihi, lóquere: volo enim te apparére iustum.'
  "33": 'Quod si non habes, audi me: tace, et docébo te sapiéntiam.'
