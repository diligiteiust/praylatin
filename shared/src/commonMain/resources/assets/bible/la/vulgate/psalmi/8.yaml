bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "8"
verses:
  "1": In finem, pro torculáribus, Psalmus David.
  "2": Dómine Dóminus noster, quam admirábile est nomen tuum in univérsa terra! Quóniam eleváta est magnificéntia tua super cælos.
  "3": Ex ore infántium et lacténtium perfecísti laudem propter inimícos tuos, ut déstruas inimícum et ultórem.
  "4": 'Quóniam vidébo cælos tuos, ópera digitórum tuórum: lunam et stellas, quæ tu fundásti.'
  "5": Quid est homo, quod memor es eius? aut fílius hóminis, quóniam vísitas eum?
  "6": 'Minuísti eum paulo minus ab ángelis, glória et honóre coronásti eum:'
  "7": et constituísti eum super ópera mánuum tuárum.
  "8": 'Omnia subiecísti sub pédibus eius, oves et boves univérsas, ínsuper et pécora campi:'
  "9": vólucres cæli, et pisces maris, qui perámbulant sémitas maris.
  "10": Dómine Dóminus noster, quam admirábile est nomen tuum in univérsa terra!
