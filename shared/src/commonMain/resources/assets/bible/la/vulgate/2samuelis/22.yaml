bible: vulgate
lang: la
language: Latina
book: II Samuelis
chapter: "22"
verses:
  "1": Locútus est autem David Dómino verba cárminis huius, in die qua liberávit eum Dóminus de manu ómnium inimicórum suórum, et de manu Saul.
  "2": 'Et ait: Dóminus petra mea, et robur meum, et salvátor meus.'
  "3": 'Deus fortis meus, sperábo in eum: scutum meum, et cornu salútis meæ: elevátor meus, et refúgium meum: salvátor meus, de iniquitáte liberábis me.'
  "4": Laudábilem invocábo Dóminum, et ab inimícis meis salvus ero.
  "5": 'Quia circumdedérunt me contritiónes mortis: torréntes Bélial terruérunt me.'
  "6": 'Funes inférni circumdedérunt me: prævenérunt me láquei mortis.'
  "7": 'In tribulatióne mea invocábo Dóminum, et ad Deum meum clamábo: et exáudiet de templo suo vocem meam, et clamor meus véniet ad aures eius.'
  "8": 'Commóta est et contrémuit terra: fundaménta móntium concússa sunt, et conquassáta, quóniam irátus est eis.'
  "9": 'Ascéndit fumus de náribus eius, et ignis de ore eius vorábit: carbónes succénsi sunt ab eo.'
  "10": 'Inclinávit cælos, et descéndit: et calígo sub pédibus eius.'
  "11": 'Et ascéndit super chérubim, et volávit: et lapsus est super pennas venti.'
  "12": 'Pósuit ténebras in circúitu suo latíbulum: cribrans aquas de núbibus cælórum.'
  "13": Præ fulgóre in conspéctu eius, succénsi sunt carbónes ignis.
  "14": 'Tonábit de cælo Dóminus: et excélsus dabit vocem suam.'
  "15": 'Misit sagíttas et dissipávit eos: fulgur, et consúmpsit eos.'
  "16": Et apparuérunt effusiónes maris, et reveláta sunt fundaménta orbis ab increpatióne Dómini, ab inspiratióne spíritus furóris eius.
  "17": 'Misit de excélso, et assúmpsit me: et extráxit me de aquis multis.'
  "18": 'Liberávit me ab inimíco meo potentíssimo, et ab his qui óderant me: quóniam robustióres me erant.'
  "19": Prævénit me in die afflictiónis meæ, et factus est Dóminus firmaméntum meum.
  "20": 'Et edúxit me in latitúdinem: liberávit me, quia complácui ei.'
  "21": 'Retríbuet mihi Dóminus secúndum iustítiam meam: et secúndum mundítiam mánuum meárum reddet mihi.'
  "22": Quia custodívi vias Dómini, et non egi ímpie a Deo meo.
  "23": Omnia enim iudícia eius in conspéctu meo, et præcépta eius non amóvi a me.
  "24": 'Et ero perféctus cum eo: et custódiam me ab iniquitáte mea.'
  "25": 'Et restítuet mihi Dóminus secúndum iustítiam meam: et secúndum mundítiam mánuum meárum in conspéctu oculórum suórum.'
  "26": 'Cum sancto sanctus eris: et cum robústo perféctus.'
  "27": 'Cum elécto eléctus eris: et cum pervérso pervertéris.'
  "28": 'Et pópulum páuperem salvum fácies: oculísque tuis excélsos humiliábis.'
  "29": 'Quia tu lucérna mea Dómine: et tu Dómine illuminábis ténebras meas.'
  "30": 'In te enim curram accínctus: in Deo meo transíliam murum.'
  "31": 'Deus, immaculáta via eius, elóquium Dómini igne examinátum: scutum est ómnium sperántium in se.'
  "32": Quis est Deus præter Dóminum, et quis fortis præter Deum nostrum?
  "33": 'Deus qui accínxit me fortitúdine: et complanávit perféctam viam meam.'
  "34": Coǽquans pedes meos cervis, et super excélsa mea státuens me.
  "35": Docens manus meas ad prœ́lium, et compónens quasi arcum ǽreum bráchia mea.
  "36": 'Dedísti mihi clýpeum salútis tuæ: et mansuetúdo tua multiplicávit me.'
  "37": 'Dilatábis gressus meos subtus me: et non defícient tali mei.'
  "38": 'Pérsequar inimícos meos, et cónteram: et non convértar donec consúmam eos.'
  "39": 'Consúmam eos et confríngam, ut non consúrgant: cadent sub pédibus meis.'
  "40": 'Accinxísti me fortitúdine ad prœ́lium: incurvásti resisténtes mihi subtus me.'
  "41": 'Inimícos meos dedísti mihi dorsum: odiéntes me, et dispérdam eos.'
  "42": 'Clamábunt, et non erit qui salvet: ad Dóminum, et non exáudiet eos.'
  "43": 'Delébo eos ut púlverem terræ: quasi lutum plateárum commínuam eos atque confríngam.'
  "44": 'Salvábis me a contradictiónibus pópuli mei: custódies me in caput géntium: pópulus, quem ignóro, sérviet mihi.'
  "45": Fílii aliéni resístent mihi, audítu auris obédient mihi.
  "46": Fílii aliéni defluxérunt, et contrahéntur in angústiis suis.
  "47": 'Vivit Dóminus, et benedíctus Deus meus: et exaltábitur Deus fortis salútis meæ.'
  "48": Deus qui das vindíctas mihi, et déicis pópulos sub me.
  "49": 'Qui edúcis me ab inimícis meis, et a resisténtibus mihi élevas me: a viro iníquo liberábis me.'
  "50": 'Proptérea confitébor tibi Dómine in géntibus: et nómini tuo cantábo.'
  "51": Magníficans salútes regis sui, et fáciens misericórdiam christo suo David, et sémini eius in sempitérnum.
