bible: vulgate
lang: la
language: Latina
book: ad Thessalonicenses II
chapter: "3"
verses:
  "1": 'De cétero fratres oráte pro nobis ut sermo Dei currat, et clarificétur, sicut et apud vos:'
  "2": 'et ut liberémur ab importúnis, et malis homínibus: non enim ómnium est fides.'
  "3": Fidélis autem Deus est, qui confirmábit vos, et custódiet a malo.
  "4": Confídimus autem de vobis, in Dómino, quóniam quæ præcépimus, et fácitis, et faciétis.
  "5": Dóminus autem dírigat corda vestra in caritáte Dei, et patiéntia Christi.
  "6": Denuntiámus autem vobis fratres in nómine Dómini nostri Iesu Christi, ut subtrahátis vos ab omni fratre ambulánte inordináte, et non secúndum traditiónem, quam accepérunt a nobis.
  "7": 'Ipsi enim scitis quemádmodum opórteat imitári nos: quóniam non inquiéti fúimus inter vos:'
  "8": neque gratis panem manducávimus ab áliquo, sed in labóre, et in fatigatióne, nocte et die operántes, ne quem vestrum gravarémus.
  "9": Non quasi non habuérimus potestátem, sed ut nosmetípsos formam darémus vobis ad imitándum nos.
  "10": 'Nam et cum essémus apud vos, hoc denuntiabámus vobis: quóniam si quis non vult operári, nec mandúcet.'
  "11": Audívimus enim inter vos quosdam ambuláre inquiéte, nihil operántes, sed curióse agéntes.
  "12": Iis autem, qui eiúsmodi sunt, denuntiámus, et obsecrámus in Dómino Iesu Christo, ut cum siléntio operántes, suum panem mandúcent.
  "13": Vos autem fratres nolíte defícere benefaciéntes.
  "14": 'Quod si quis non obédit verbo nostro per epístolam, hunc notáte, et ne commisceámini cum illo ut confundátur:'
  "15": et nolíte quasi inimícum existimáre, sed corrípite ut fratrem.
  "16": Ipse autem Dóminus pacis det vobis pacem sempitérnam in omni loco. Dóminus sit cum ómnibus vobis.
  "17": 'Salutátio, mea manu Pauli: quod est signum in omni epístola, ita scribo.'
  "18": Grátia Dómini nostri Iesu Christi cum ómnibus vobis. Amen.
