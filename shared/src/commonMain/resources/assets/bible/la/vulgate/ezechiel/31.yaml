bible: vulgate
lang: la
language: Latina
book: Ezechiel
chapter: "31"
verses:
  "1": 'Et factum est in anno undécimo, tértio mense, una mensis, factum est verbum Dómini ad me, dicens:'
  "2": 'Fili hóminis dic Pharaóni regi Ægýpti et pópulo eius: Cui símilis factus es in magnitúdine tua?'
  "3": Ecce Assur quasi cedrus in Líbano, pulcher ramis, et fróndibus nemorósus, excelsúsque altitúdine, et inter condénsas frondes elevátum est cacúmen eius.
  "4": 'Aquæ nutriérunt illum, abýssus exaltávit illum: flúmina eius manábant in circúitu radícum eius, et rivos suos emísit ad univérsa ligna regiónis.'
  "5": 'Proptérea eleváta est altitúdo eius super ómnia ligna regiónis: et multiplicáta sunt arbústa eius, et eleváti sunt rami eius præ aquis multis.'
  "6": Cumque extendísset umbram suam, in ramis eius fecérunt nidos ómnia volatília cæli, et sub fróndibus eius genuérunt omnes béstiæ sáltuum, et sub umbráculo illíus habitábat cœtus géntium plurimárum.
  "7": 'Erátque pulchérrimus in magnitúdine sua, et in dilatatióne arbustórum suórum: erat enim radix illíus iuxta aquas multas.'
  "8": 'Cedri non fuérunt altióres illo in paradíso Dei: abiétes non adæquavérunt summitátem eius, et plátani non fuérunt æquæ fróndibus illíus: omne lignum paradísi Dei non est assimilátum illi, et pulchritúdini eius.'
  "9": 'Quóniam speciósum feci eum, et multis condensísque fróndibus: et æmuláta sunt eum ómnia ligna voluptátis, quæ erant in paradíso Dei.'
  "10": 'Proptérea hæc dicit Dóminus Deus: Pro eo quod sublimátus est in altitúdine, et dedit summitátem suam viréntem atque condénsam, et elevátum est cor eius in altitúdine sua:'
  "11": 'trádidi eum in manu fortíssimi géntium, fáciens fáciet ei: iuxta impietátem eius eiéci eum.'
  "12": 'Et succídent eum aliéni, et crudelíssimi natiónum, et proícient eum super montes: et in cunctis convállibus córruent rami eius, et confringéntur arbústa eius in univérsis rúpibus terræ: et recédent de umbráculo eius omnes pópuli terræ, et relínquent eum.'
  "13": In ruína eius habitavérunt ómnia volatília cæli, et in ramis eius fuérunt univérsæ béstiæ regiónis.
  "14": 'Quam ob rem non elevabúntur in altitúdine sua ómnia ligna aquárum, nec ponent sublimitátem suam inter nemorósa atque frondósa, nec stabunt in sublimitáte sua ómnia, quæ irrigántur aquis: quia omnes tráditi sunt in mortem ad terram últimam, in médio filiórum hóminum, ad eos, qui descéndunt in lacum.'
  "15": 'Hæc dicit Dóminus Deus: In die quando descéndit ad ínferos, indúxi luctum, opérui eum abýsso: et prohíbui flúmina eius, et coércui aquas multas: contristátus est super eum Líbanus, et ómnia ligna agri concússa sunt.'
  "16": 'A sónitu ruínæ eius commóvi gentes, cum dedúcerem eum ad inférnum cum his, qui descendébant in lacum: et consoláta sunt in terra ínfima ómnia ligna voluptátis egrégia atque præclára in Líbano, univérsa quæ irrigabántur aquis.'
  "17": 'Nam et ipsi cum eo descéndent in inférnum ad interféctos gládio: et bráchium uniuscuiúsque sedébit sub umbráculo eius in médio natiónum.'
  "18": 'Cui assimilátus es o ínclyte atque sublímis inter ligna voluptátis? Ecce dedúctus es cum lignis voluptátis ad terram últimam: in médio incircumcisórum dórmies, cum eis, qui interfécti sunt gládio: ipse est Phárao, et omnis multitúdo eius, dicit Dóminus Deus.'
