bible: vulgate
lang: la
language: Latina
book: Ezechiel
chapter: "8"
verses:
  "1": 'Et factum est in anno sexto, in sexto mense, in quinta mensis: ego sedébam in domo mea, et senes Iuda sedébant coram me, et cécidit ibi super me manus Dómini Dei.'
  "2": 'Et vidi: et ecce similitúdo quasi aspéctus ignis: ab aspéctu lumbórum eius, et deórsum, ignis: et a lumbis eius, et sursum, quasi aspéctus splendóris, ut vísio eléctri.'
  "3": 'Et emíssa similitúdo manus apprehéndit me in cincínno cápitis mei: et elevávit me spíritus inter terram, et cælum: et addúxit me in Ierúsalem in visióne Dei, iuxta óstium intérius, quod respiciébat ad aquilónem, ubi erat statútum idólum zeli ad provocándam æmulatiónem.'
  "4": Et ecce ibi glória Dei Israel, secúndum visiónem, quam víderam in campo.
  "5": 'Et dixit ad me: Fili hóminis, leva óculos tuos ad viam aquilónis. Et levávi óculos meos ad viam aquilónis: et ecce ab aquilóne portæ altáris idólum zeli in ipso intróitu.'
  "6": 'Et dixit ad me: Fili hóminis, putásne, vides tu quid isti fáciunt, abominatiónes magnas, quas domus Israel facit hic, ut procul recédam a sanctuário meo? et adhuc convérsus vidébis abominatiónes maióres.'
  "7": 'Et introdúxit me ad óstium átrii: et vidi, et ecce forámen unum in paríete.'
  "8": 'Et dixit ad me: Fili hóminis, fode paríetem. Et cum fodíssem paríetem, appáruit óstium unum.'
  "9": 'Et dixit ad me: Ingrédere, et vide abominatiónes péssimas, quas isti fáciunt hic.'
  "10": Et ingréssus vidi, et ecce omnis similitúdo reptílium, et animálium, abominátio, et univérsa idóla domus Israel depícta erant in paríete in circúitu per totum.
  "11": 'Et septuagínta viri de senióribus domus Israel, et Iezonías fílius Saphan stabat in médio eórum stántium ante pictúras: et unusquísque habébat thuríbulum in manu sua: et vapor nébulæ de thure consurgébat.'
  "12": 'Et dixit ad me: Certe vides fili hóminis quæ senióres domus Israel fáciunt in ténebris, unusquísque in abscóndito cubículi sui: dicunt enim: Non videt Dóminus nos, derelíquit Dóminus terram.'
  "13": 'Et dixit ad me: Adhuc convérsus vidébis abominatiónes maióres, quas isti fáciunt.'
  "14": 'Et introdúxit me per óstium portæ domus Dómini, quod respiciébat ad aquilónem: et ecce ibi mulíeres sedébant plangéntes Adónidem.'
  "15": 'Et dixit ad me: Certe vidísti, fili hóminis: adhuc convérsus vidébis abominatiónes maióres his.'
  "16": 'Et introdúxit me in átrium domus Dómini intérius: et ecce in óstio templi Dómini, inter vestíbulum et altáre, quasi vigínti quinque viri dorsa habéntes contra templum Dómini, et fácies ad oriéntem: et adorábant ad ortum solis.'
  "17": 'Et dixit ad me: Certe vidísti fili hóminis: numquid leve est hoc dómui Iuda, ut fácerent abominatiónes istas, quas fecérunt hic: quia repléntes terram iniquitáte, convérsi sunt ad irritándum me? et ecce ápplicant ramum ad nares suas.'
  "18": 'Ergo et ego fáciam in furóre: non parcet óculus meus, nec miserébor: et cum clamáverint ad aures meas voce magna, non exáudiam eos.'
