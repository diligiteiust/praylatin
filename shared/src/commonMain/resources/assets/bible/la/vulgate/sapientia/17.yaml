bible: vulgate
lang: la
language: Latina
book: Sapientia
chapter: "17"
verses:
  "1": 'Magna sunt enim iudícia tua Dómine, et inenarrabília verba tua: propter hoc indisciplinátæ ánimæ erravérunt.'
  "2": Dum enim persuásum habent iníqui posse dominári natióni sanctæ, vínculis tenebrárum et longæ noctis compedíti, inclúsi sub tectis, fugitívi perpétuæ providéntiæ iacuérunt.
  "3": Et dum putant se latére in obscúris peccátis, tenebróso obliviónis velaménto dispérsi sunt, pavéntes horrénde, et cum admiratióne nímia perturbáti.
  "4": 'Neque enim quæ continébat illos spelúnca, sine timóre custodiébat: quóniam sónitus descéndens perturbábat illos, et persónæ tristes illis apparéntes pavórem illis præstábant.'
  "5": Et ignis quidem nulla vis póterat illis lumen præbére, nec síderum límpidæ flammæ illumináre póterant illam noctem horréndam.
  "6": 'Apparébat autem illis subitáneus ignis, timóre plenus: et timóre percúlsi illíus, quæ non videbátur, faciéi, æstimábant deterióra esse quæ videbántur:'
  "7": et mágicæ artis appósiti erant derísus, et sapiéntiæ glóriæ corréptio cum contumélia.
  "8": Illi enim qui promittébant timóres et perturbatiónes expéllere se ab ánima languénte, hi cum derísu pleni timóre languébant.
  "9": 'Nam etsi nihil illos ex monstris perturbábat: tránsitu animálium et serpéntium sibilatióne commóti, tremebúndi períbant: et áerem, quem nulla ratióne quis effúgere posset, negántes se vidére.'
  "10": 'Cum sit enim tímida nequítia, dat testimónium condemnatiónis: semper enim præsúmit sæva, perturbáta consciéntia.'
  "11": Nihil enim est timor nisi prodítio cogitatiónis auxiliórum.
  "12": Et dum ab intus minor est exspectátio, maiórem cómputat insciéntiam eius causæ, de qua torméntum præstat.
  "13": Illi autem qui impoténtem vere noctem, et ab ínfimis et ab altíssimis ínferis superveniéntem, eúmdem somnum dormiéntes,
  "14": 'aliquándo monstrórum exagitabántur timóre, aliquándo ánimæ deficiébant traductióne: subitáneus enim illis et insperátus timor supervénerat.'
  "15": Deínde si quisquam ex illis decidísset, custodiebátur in cárcere sine ferro reclúsus.
  "16": Si enim rústicus quis erat, aut pastor, aut agri labórum operárius præoccupátus esset, ineffugíbilem sustinébat necessitátem.
  "17": Una enim caténa tenebrárum omnes erant colligáti. Sive spíritus síbilans, aut inter spissos árborum ramos ávium sonus suávis, aut vis aquæ decurréntis nímium,
  "18": 'aut sonus válidus præcipitatárum petrárum, aut ludéntium animálium cursus invísus, aut mugiéntium válida bestiárum vox, aut résonans de altíssimis móntibus echo: deficiéntes faciébant illos præ timóre.'
  "19": Omnis enim orbis terrárum límpido illuminabátur lúmine, et non impedítis opéribus continebátur.
  "20": Solis autem illis superpósita erat gravis nox, imágo tenebrárum, quæ superventúra illis erat. Ipsi ergo sibi erant gravióres ténebris.
