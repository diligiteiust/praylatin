bible: vulgate
lang: la
language: Latina
book: Isaias
chapter: "43"
verses:
  "1": 'Et nunc hæc dicit Dóminus creans te Iacob, et formans te Israel: Noli timére, quia redémi te, et vocávi te nómine tuo: meus es tu.'
  "2": 'Cum transíeris per aquas, tecum ero, et flúmina non opérient te: cum ambuláveris in igne, non comburéris, et flamma non ardébit in te.'
  "3": Quia ego Dóminus Deus tuus sanctus Israel salvátor tuus, dedi propitiatiónem tuam Ægýptum, Æthiópiam, et Saba pro te.
  "4": 'Ex quo honorábilis factus es in óculis meis, et gloriósus: ego diléxi te, et dabo hómines pro te, et pópulos pro ánima tua.'
  "5": 'Noli timére, quia ego tecum sum: ab oriénte addúcam semen tuum, et ab occidénte congregábo te.'
  "6": 'Dicam aquilóni: Da: et austro: Noli prohibére: affer fílios meos de longínquo, et fílias meas ab extrémis terræ.'
  "7": Et omnem, qui ínvocat nomen meum, in glóriam meam creávi eum, formávi eum, et feci eum.
  "8": 'Educ foras pópulum cæcum, et óculos habéntem: surdum, et aures ei sunt.'
  "9": 'Omnes gentes congregátæ sunt simul, et colléctæ sunt tribus: quis in vobis annúntiet istud, et quæ prima sunt audíre nos fáciet? dent testes eórum, iustificéntur, et áudiant, et dicant: Vere.'
  "10": 'Vos testes mei, dicit Dóminus, et servus meus, quem elégi: ut sciátis, et credátis mihi, et intelligátis quia ego ipse sum: ante me non est formátus Deus, et post me non erit.'
  "11": Ego sum, ego sum Dóminus, et non est absque me salvátor.
  "12": 'Ego annuntiávi, et salvávi: audítum feci, et non fuit in vobis aliénus: vos testes mei, dicit Dóminus, et ego Deus.'
  "13": 'Et ab inítio ego ipse, et non est qui de manu mea éruat: operábor, et quis avértet illud?'
  "14": 'Hæc dicit Dóminus redémptor vester, sanctus Israel: Propter vos misi in Babylónem, et detráxi vectes univérsos, et Chaldǽos in návibus suis gloriántes.'
  "15": Ego Dóminus sanctus vester, creans Israel, rex vester.
  "16": 'Hæc dicit Dóminus, qui dedit in mari viam, et in aquis torréntibus sémitam:'
  "17": 'qui edúxit quadrígam et equum, agmen et robústum: simul obdormiérunt, nec resúrgent: contríti sunt quasi linum, et exstíncti sunt.'
  "18": Ne meminéritis priórum, et antíqua ne intueámini.
  "19": 'Ecce ego fácio nova, et nunc oriéntur, útique cognoscétis ea: ponam in desérto viam, et in ínvio flúmina.'
  "20": 'Glorificábit me béstia agri, dracónes, et struthiónes: quia dedi in desérto aquas, flúmina in ínvio, ut darem potum pópulo meo, elécto meo.'
  "21": 'Pópulum istum formávi mihi: laudem meam narrábit.'
  "22": Non me invocásti Iacob, nec laborásti in me Israel.
  "23": 'Non obtulísti mihi aríetem holocáusti tui, et víctimis tuis non glorificásti me: non te servíre feci in oblatióne, nec labórem tibi prǽbui in thure.'
  "24": 'Non emísti mihi argénto cálamum, et ádipe victimárum tuárum non inebriásti me: verúmtamen servíre me fecísti in peccátis tuis: præbuísti mihi labórem in iniquitátibus tuis.'
  "25": Ego sum, ego sum ipse qui déleo iniquitátes tuas propter me, et peccatórum tuórum non recordábor.
  "26": 'Reduc me in memóriam, et iudicémur simul: narra si quid habes ut iustificéris.'
  "27": Pater tuus primus peccávit, et intérpretes tui prævaricáti sunt in me.
  "28": 'Et contaminávi príncipes sanctos: dedi ad interneciónem Iacob, et Israel in blasphémiam.'
