bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "92"
verses:
  "1": 'Laus Cántici ipsi David in die ante sábbatum, quando fundáta est terra. Dóminus regnávit, decórem indútus est: indútus est Dóminus fortitúdinem, et præcínxit se. Etenim firmávit orbem terræ, qui non commovébitur.'
  "2": 'Paráta sedes tua ex tunc: a sǽculo tu es.'
  "3": 'Elevavérunt flúmina Dómine: elevavérunt flúmina vocem suam. Elevavérunt flúmina fluctus suos,'
  "4": 'a vócibus aquárum multárum. Mirábiles elatiónes maris: mirábilis in altis Dóminus.'
  "5": 'Testimónia tua credibília facta sunt nimis: domum tuam decet sanctitúdo Dómine, in longitúdinem diérum.'
