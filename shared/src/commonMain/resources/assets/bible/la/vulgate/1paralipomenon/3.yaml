bible: vulgate
lang: la
language: Latina
book: I Paralipomenon
chapter: "3"
verses:
  "1": 'David vero hos hábuit fílios, qui ei nati sunt in Hebron: primogénitum Amnon ex Achínoam Iezrahelítide, secúndum Dániel de Abígail Carmelítide,'
  "2": tértium Absalom fílium Máacha fíliæ Thólmai regis Gessur, quartum Adoníam fílium Aggith,
  "3": quintum Saphathíam ex Abital, sextum Iéthraham de Egla uxóre sua.
  "4": Sex ergo nati sunt ei in Hebron, ubi regnávit septem annis et sex ménsibus. Trigínta autem et tribus annis regnávit in Ierúsalem.
  "5": Porro in Ierúsalem nati sunt ei fílii, Símmaa, et Sobab, et Nathan, et Sálomon, quátuor de Bethsabée fília Ammiel,
  "6": Iébaar quoque et Elísama,
  "7": et Elíphaleth, et Noge, et Nepheg, et Iáphia,
  "8": 'necnon Elísama, et Elíada, et Elípheleth, novem:'
  "9": 'omnes hi, fílii David, absque fíliis concubinárum: habuerúntque sorórem Thamar.'
  "10": 'Fílius autem Salomónis, Róboam: cuius Abía fílius génuit Asa. De hoc quoque natus est Iósaphat,'
  "11": 'pater Ioram: qui Ioram génuit Ochozíam, ex quo ortus est Ioas:'
  "12": et huius Amasías fílius génuit Azaríam. Porro Azaríæ fílius Ióatham
  "13": procreávit Achaz patrem Ezechíæ, de quo natus est Manásses.
  "14": Sed et Manásses génuit Amon patrem Iosíæ.
  "15": 'Fílii autem Iosíæ fuérunt: primogénitus Ióhanan, secúndus Ióakim, tértius Sedecías, quartus Sellum.'
  "16": De Ióakim natus est Iechonías, et Sedecías.
  "17": 'Fílii Iechoníæ fuérunt: Asir, Saláthiel,'
  "18": Melchíram, Phadaía, Sénneser, et Iecemía, Sama, et Nadabía.
  "19": 'De Phadaía orti sunt Zoróbabel et Sémei. Zoróbabel génuit Mosóllam, Hananíam, et Sálomith sorórem eórum:'
  "20": Hásaban quoque, et Ohol, et Barachían, et Hasadían, Iosábhesed, quinque.
  "21": 'Fílius autem Hananíæ, Phaltías pater Ieseíæ, cuius fílius Raphaía: huius quoque fílius, Arnan, de quo natus est Obdía, cuius fílius fuit Sechenías.'
  "22": 'Fílius Secheníæ, Semeía: cuius fílii Hattus, et Iégaal, et Baría, et Naaría, et Saphat, sex número.'
  "23": Fílius Naaríæ, Elioénai, et Ezechías, et Ezricam, tres.
  "24": Fílii Elioénai, Oduía, et Elíasub, et Pheleía, et Accub, et Ióhanan, et Dalaía, et Anani, septem.
