bible: vulgate
lang: la
language: Latina
book: Deuteronomium
chapter: "31"
verses:
  "1": Abiit ítaque Móyses, et locútus est ómnia verba hæc ad univérsum Israel,
  "2": 'et dixit ad eos: Centum vigínti annórum sum hódie, non possum ultra égredi et íngredi, præsértim cum et Dóminus díxerit mihi: Non transíbis Iordánem istum.'
  "3": 'Dóminus ergo Deus tuus transíbit ante te: ipse delébit omnes gentes has in conspéctu tuo, et possidébis eas: et Iósue iste transíbit ante te, sicut locútus est Dóminus.'
  "4": Faciétque Dóminus eis sicut fecit Sehon et Og régibus Amorrhæórum, et terræ eórum, delebítque eos.
  "5": Cum ergo et hos tradíderit vobis, simíliter faciétis eis, sicut præcépi vobis.
  "6": 'Viríliter ágite, et confortámini: nolíte timére, nec paveátis ad conspéctum eórum: quia Dóminus Deus tuus ipse est ductor tuus, et non dimíttet, nec derelínquet te.'
  "7": 'Vocavítque Móyses Iósue, et dixit ei coram omni Israel: Confortáre, et esto robústus: tu enim introdúces pópulum istum in terram, quam datúrum se pátribus eórum iurávit Dóminus, et tu eam sorte dívides.'
  "8": 'Et Dóminus qui ductor est vester, ipse erit tecum: non dimíttet, nec derelínquet te: noli timére, nec páveas.'
  "9": Scripsit ítaque Móyses legem hanc, et trádidit eam sacerdótibus fíliis Levi, qui portábant arcam fœ́deris Dómini, et cunctis senióribus Israel.
  "10": 'Præcepítque eis, dicens: Post septem annos, anno remissiónis, in solemnitáte tabernaculórum,'
  "11": conveniéntibus cunctis ex Israel, ut appáreant in conspéctu Dómini Dei tui in loco, quem elégerit Dóminus, leges verba legis huius coram omni Israel, audiéntibus eis,
  "12": 'et in unum omni pópulo congregáto, tam viris quam muliéribus, párvulis, et ádvenis, qui sunt intra portas tuas: ut audiéntes discant, et tímeant Dóminum Deum vestrum, et custódiant, impleántque omnes sermónes legis huius:'
  "13": fílii quoque eórum qui nunc ignórant, ut audíre possint, et tímeant Dóminum Deum suum cunctis diébus quibus versántur in terra, ad quam vos, Iordáne transmísso, pérgitis obtinéndam.
  "14": 'Et ait Dóminus ad Móysen: Ecce prope sunt dies mortis tuæ: voca Iósue, et state in tabernáculo testimónii, ut præcípiam ei. Abiérunt ergo Móyses et Iósue, et stetérunt in tabernáculo testimónii:'
  "15": apparuítque Dóminus ibi in colúmna nubis, quæ stetit in intróitu tabernáculi.
  "16": 'Dixítque Dóminus ad Móysen: Ecce tu dórmies cum pátribus tuis, et pópulus iste consúrgens fornicábitur post deos aliénos in terra, ad quam ingréditur ut hábitet in ea: ibi derelínquet me, et írritum fáciet fœdus, quod pépigi cum eo.'
  "17": 'Et irascétur furor meus contra eum in die illo: et derelínquam eum, et abscóndam fáciem meam ab eo, et erit in devoratiónem: invénient eum ómnia mala et afflictiónes, ita ut dicat in illo die: Vere quia non est Deus mecum, invenérunt me hæc mala.'
  "18": Ego autem abscóndam, et celábo fáciem meam in die illo propter ómnia mala, quæ fecit, quia secútus est deos aliénos.
  "19": 'Nunc ítaque scríbite vobis cánticum istud, et docéte fílios Israel: ut memóriter téneant, et ore decántent, et sit mihi carmen istud pro testimónio inter fílios Israel.'
  "20": 'Introdúcam enim eum in terram, pro qua iurávi pátribus eius, lacte et melle manántem. Cumque coméderint, et saturáti, crassíque fúerint, averténtur ad deos aliénos, et sérvient eis: detrahéntque mihi, et írritum fácient pactum meum.'
  "21": Postquam invénerint eum mala multa et afflictiónes, respondébit ei cánticum istud pro testimónio, quod nulla delébit oblívio ex ore séminis sui. Scio enim cogitatiónes eius, quæ factúrus sit hódie, ántequam introdúcam eum in terram, quam ei pollícitus sum.
  "22": Scripsit ergo Móyses cánticum, et dócuit fílios Israel.
  "23": 'Præcepítque Dóminus Iósue fílio Nun, et ait: Confortáre, et esto robústus: tu enim introdúces fílios Israel in terram, quam pollícitus sum, et ego ero tecum.'
  "24": Postquam ergo scripsit Móyses verba legis huius in volúmine, atque complévit,
  "25": 'præcépit Levítis, qui portábant arcam fœ́deris Dómini, dicens:'
  "26": 'Tóllite librum istum, et pónite eum in látere arcæ fœ́deris Dómini Dei vestri: ut sit ibi contra te in testimónium.'
  "27": 'Ego enim scio contentiónem tuam, et cervícem tuam duríssimam. Adhuc vivénte me et ingrediénte vobíscum, semper contentióse egístis contra Dóminum: quanto magis cum mórtuus fúero?'
  "28": Congregáte ad me omnes maióres natu per tribus vestras, atque doctóres, et loquar audiéntibus eis sermónes istos, et invocábo contra eos cælum et terram.
  "29": 'Novi enim quod post mortem meam iníque agétis, et declinábitis cito de via, quam præcépi vobis: et occúrrent vobis mala in extrémo témpore, quando fecéritis malum in conspéctu Dómini, ut irritétis eum per ópera mánuum vestrárum.'
  "30": Locútus est ergo Móyses, audiénte univérso cœtu Israel, verba cárminis huius, et ad finem usque complévit.
