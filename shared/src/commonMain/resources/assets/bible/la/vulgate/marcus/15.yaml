bible: vulgate
lang: la
language: Latina
book: Marcus
chapter: "15"
verses:
  "1": Et conféstim mane consílium faciéntes summi sacerdótes cum senióribus, et scribis, et univérso concílio, vinciéntes Iesum, duxérunt, et tradidérunt Piláto.
  "2": 'Et interrogávit eum Pilátus: Tu es rex Iudæórum? At ille respóndens, ait illi: Tu dicis.'
  "3": Et accusábant eum summi sacerdótes in multis.
  "4": 'Pilátus autem rursum interrogávit eum, dicens: Non respóndes quidquam? vide in quantis te accúsant.'
  "5": Iesus autem ámplius nihil respóndit, ita ut mirarétur Pilátus.
  "6": Per diem autem festum solébat dimíttere illis unum ex vinctis, quemcúmque petíssent.
  "7": Erat autem qui dicebátur Barábbas, qui cum seditiósis erat vinctus, qui in seditióne fécerat homicídium.
  "8": Et cum ascendísset turba, cœpit rogáre, sicut semper faciébat illis.
  "9": 'Pilátus autem respóndit eis, et dixit: Vultis dimíttam vobis regem Iudæórum?'
  "10": Sciébat enim quod per invídiam tradidíssent eum summi sacerdótes.
  "11": Pontífices autem concitavérunt turbam, ut magis Barábbam dimítteret eis.
  "12": 'Pilátus autem íterum respóndens, ait illis: Quid ergo vultis fáciam regi Iudæórum?'
  "13": 'At illi íterum clamavérunt: Crucifíge eum.'
  "14": 'Pilátus vero dicébat illis: Quid enim mali fecit? At illi magis clamábant: Crucifíge eum.'
  "15": Pilátus autem volens pópulo satisfácere, dimísit illis Barábbam, et trádidit Iesum flagéllis cæsum, ut crucifigerétur.
  "16": Mílites autem duxérunt eum in átrium prætórii, et cónvocant totam cohórtem.
  "17": Et índuunt eum púrpura, et impónunt ei plecténtes spíneam corónam.
  "18": 'Et cœpérunt salutáre eum: Ave rex Iudæórum.'
  "19": 'Et percutiébant caput eius arúndine: et conspuébant eum, et ponéntes génua, adorábant eum.'
  "20": 'Et postquam illusérunt ei, exuérunt illum púrpura, et induérunt eum vestiméntis suis: et edúcunt illum ut crucifígerent eum.'
  "21": Et angariavérunt prætereúntem quémpiam, Simónem Cyrenǽum veniéntem de villa, patrem Alexándri, et Rufi, ut tólleret crucem eius.
  "22": 'Et perdúcunt illum in Gólgotha locum: quod est interpretátum Calváriæ locus.'
  "23": 'Et dabant ei bíbere myrrhátum vinum: et non accépit.'
  "24": Et crucifigéntes eum, divisérunt vestiménta eius, mitténtes sortem super eis, quis quid tólleret.
  "25": 'Erat autem hora tértia: et crucifixérunt eum.'
  "26": 'Et erat títulus causæ eius inscríptus: Rex Iudæórum.'
  "27": 'Et cum eo crucifígunt duos latrónes: unum a dextris, et álium a sinístris eius.'
  "28": 'Et impléta est Scriptúra, quæ dicit: Et cum iníquis reputátus est.'
  "29": 'Et prætereúntes blasphemábant eum, movéntes cápita sua, et dicéntes: Vah qui déstruis templum Dei, et in tribus diébus reædíficas:'
  "30": salvum fac temetípsum descéndens de cruce.
  "31": 'Simíliter et summi sacerdótes illudéntes, ad altérutrum cum scribis dicébant: Alios salvos fecit: seípsum non potest salvum fácere.'
  "32": Christus rex Israel descéndat nunc de cruce, ut videámus, et credámus. Et qui cum eo crucifíxi erant, convitiabántur ei.
  "33": Et facta hora sexta, ténebræ factæ sunt per totam terram usque in horam nonam.
  "34": 'Et hora nona exclamávit Iesus voce magna, dicens: Eloi, Eloi, lamma sabactháni? quod est interpretátum: Deus meus, Deus meus, ut quid dereliquísti me?'
  "35": 'Et quidam de circumstántibus audiéntes, dicébant: Ecce Elíam vocat.'
  "36": 'Currens autem unus, et implens spóngiam acéto, circumponénsque cálamo, potum dabat ei, dicens: Sínite, videámus si véniat Elías ad deponéndum eum.'
  "37": Iesus autem emíssa voce magna exspirávit.
  "38": Et velum templi scissum est in duo, a summo usque deórsum.
  "39": 'Videns autem centúrio, qui ex advérso stabat, quia sic clamans exspirásset, ait: Vere hic homo Fílius Dei erat.'
  "40": 'Erant autem et mulíeres de longe aspiciéntes: inter quas erat María Magdaléne, et María Iacóbi minóris, et Ioseph mater, et Salóme:'
  "41": et cum esset in Galilǽa, sequebántur eum, et ministrábant ei, et áliæ multæ, quæ simul cum eo ascénderant Ierosólymam.
  "42": Et cum iam sero esset factum (quia erat parascéve, quod est ante sábbatum),
  "43": venit Ioseph ab Arimathǽa nóbilis decúrio, qui et ipse erat exspéctans regnum Dei, et audácter introívit ad Pilátum, et pétiit corpus Iesu.
  "44": Pilátus autem mirabátur si iam obiísset. Et accersíto centurióne, interrogávit eum si iam mórtuus esset.
  "45": Et cum cognovísset a centurióne, donávit corpus Ioseph.
  "46": Ioseph autem mercátus síndonem, et depónens eum invólvit síndone, et pósuit eum in monuménto, quod erat excísum de petra, et advólvit lápidem ad óstium monuménti.
  "47": María autem Magdaléne, et María Ioseph aspiciébant ubi ponerétur.
