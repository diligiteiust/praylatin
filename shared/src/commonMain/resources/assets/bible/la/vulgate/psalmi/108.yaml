bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "108"
verses:
  "1": In finem, Psalmus David.
  "2": 'Deus laudem meam ne tacúeris: quia os peccatóris, et os dolósi super me apértum est.'
  "3": 'Locúti sunt advérsum me lingua dolósa, et sermónibus ódii circumdedérunt me: et expugnavérunt me gratis.'
  "4": 'Pro eo ut me dilígerent, detrahébant mihi: ego autem orábam.'
  "5": 'Et posuérunt advérsum me mala pro bonis: et ódium pro dilectióne mea.'
  "6": Constítue super eum peccatórem, et diábolus stet a dextris eius.
  "7": 'Cum iudicátur, éxeat condemnátus: et orátio eius fiat in peccátum.'
  "8": 'Fiant dies eius pauci: et episcopátum eius accípiat alter.'
  "9": 'Fiant fílii eius órphani: et uxor eius vídua.'
  "10": 'Nutántes transferántur fílii eius, et mendícent: et eiciántur de habitatiónibus suis.'
  "11": 'Scrutétur fœnerátor omnem substántiam eius: et dirípiant aliéni labóres eius.'
  "12": 'Non sit illi adiútor: nec sit qui misereátur pupíllis eius.'
  "13": 'Fiant nati eius in intéritum: in generatióne una deleátur nomen eius.'
  "14": 'In memóriam rédeat iníquitas patrum eius in conspéctu Dómini: et peccátum matris eius non deleátur.'
  "15": 'Fiant contra Dóminum semper, et dispéreat de terra memória eórum:'
  "16": pro eo quod non est recordátus fácere misericórdiam.
  "17": Et persecútus est hóminem ínopem, et mendícum, et compúnctum corde mortificáre.
  "18": 'Et diléxit maledictiónem, et véniet ei: et nóluit benedictiónem, et elongábitur ab eo. Et índuit maledictiónem sicut vestiméntum, et intrávit sicut aqua in interióra eius, et sicut óleum in óssibus eius.'
  "19": 'Fiat ei sicut vestiméntum quo operítur: et sicut zona, qua semper præcíngitur.'
  "20": 'Hoc opus eórum, qui détrahunt mihi apud Dóminum: et qui loquúntur mala advérsus ánimam meam.'
  "21": 'Et tu Dómine, Dómine, fac mecum propter nomen tuum: quia suávis est misericórdia tua.'
  "22": 'Líbera me, quia egénus et pauper ego sum: et cor meum conturbátum est intra me.'
  "23": 'Sicut umbra cum declínat, ablátus sum: et excússus sum sicut locústæ.'
  "24": 'Génua mea infirmáta sunt a ieiúnio: et caro mea immutáta est propter óleum.'
  "25": 'Et ego factus sum oppróbrium illis: vidérunt me, et movérunt cápita sua.'
  "26": 'Adiuva me Dómine Deus meus: salvum me fac secúndum misericórdiam tuam.'
  "27": 'Et sciant quia manus tua hæc: et tu Dómine fecísti eam.'
  "28": 'Maledícent illi, et tu benedíces: qui insúrgunt in me confundántur: servus autem tuus lætábitur.'
  "29": 'Induántur qui détrahunt mihi, pudóre: et operiántur sicut diplóide confusióne sua.'
  "30": 'Confitébor Dómino nimis in ore meo: et in médio multórum laudábo eum:'
  "31": quia ástitit a dextris páuperis, ut salvam fáceret a persequéntibus ánimam meam.
