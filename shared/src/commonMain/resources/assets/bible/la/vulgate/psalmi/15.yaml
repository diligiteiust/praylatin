bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "15"
verses:
  "1": Títuli inscríptio ipsi David. Consérva me Dómine, quóniam sperávi in te.
  "2": 'Dixi Dómino: Deus meus es tu, quóniam bonórum meórum non eges.'
  "3": Sanctis qui sunt in terra eius, mirificávit omnes voluntátes meas in eis.
  "4": 'Multiplicátæ sunt infirmitátes eórum: póstea acceleravérunt. Non congregábo conventícula eórum de sanguínibus: nec memor ero nóminum eórum per lábia mea.'
  "5": 'Dóminus pars hereditátis meæ, et cálicis mei: tu es, qui restítues hereditátem meam mihi.'
  "6": 'Funes cecidérunt mihi in præcláris: étenim heréditas mea præclára est mihi.'
  "7": 'Benedícam Dóminum, qui tríbuit mihi intelléctum: ínsuper et usque ad noctem increpuérunt me renes mei.'
  "8": 'Providébam Dóminum in conspéctu meo semper: quóniam a dextris est mihi, ne commóvear.'
  "9": 'Propter hoc lætátum est cor meum, et exsultávit lingua mea: ínsuper et caro mea requiéscet in spe.'
  "10": 'Quóniam non derelínques ánimam meam in inférno: nec dabis sanctum tuum vidére corruptiónem. Notas mihi fecísti vias vitæ, adimplébis me lætítia cum vultu tuo: delectatiónes in déxtera tua usque in finem.'
