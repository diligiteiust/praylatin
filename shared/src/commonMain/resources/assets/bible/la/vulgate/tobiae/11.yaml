bible: vulgate
lang: la
language: Latina
book: Tobiae
chapter: "11"
verses:
  "1": Cumque reverteréntur, pervenérunt ad Charan, quæ est in médio itínere contra Níniven, undécimo die.
  "2": 'Dixítque ángelus: Tobía frater, scis quemádmodum reliquísti patrem tuum.'
  "3": Si placet ítaque tibi, præcedámus, et lento gradu sequántur iter nostrum famíliæ, simul cum cóniuge tua, et cum animálibus.
  "4": 'Cumque hoc placuísset ut irent, dixit Ráphael ad Tobíam: Tolle tecum ex felle piscis: erit enim necessárium. Tulit ítaque Tobías ex felle illo, et abiérunt.'
  "5": Anna autem sedébat secus viam quotídie in supercílio montis, unde respícere póterat de longínquo.
  "6": 'Et dum ex eódem loco specularétur advéntum eius, vidit a longe, et íllico agnóvit veniéntem fílium suum: currénsque nuntiávit viro suo, dicens: Ecce venit fílius tuus.'
  "7": 'Dixítque Ráphael ad Tobíam: At ubi introíeris domum tuam, statim adóra Dóminum Deum tuum: et grátias agens ei, accéde ad patrem tuum, et osculáre eum.'
  "8": 'Statímque lini super óculos eius ex felle isto piscis, quod portas tecum: scias enim quóniam mox aperiéntur óculi eius, et vidébit pater tuus lumen cæli, et in aspéctu tuo gaudébit.'
  "9": 'Tunc præcucúrrit canis, qui simul fúerat in via: et quasi núntius advéniens, blandiménto suæ caudæ gaudébat.'
  "10": 'Et consúrgens cæcus pater eius, cœpit offéndens pédibus cúrrere: et data manu púero, occúrrit óbviam fílio suo.'
  "11": Et suscípiens osculátus est eum cum uxóre sua, et cœpérunt ambo flere præ gáudio.
  "12": Cumque adorássent Deum, et grátias egíssent, consedérunt.
  "13": Tunc sumens Tobías de felle piscis, linívit óculos patris sui.
  "14": 'Et sustínuit quasi dimídiam fere horam: et cœpit albúgo ex óculis eius, quasi membrána ovi, égredi.'
  "15": 'Quam apprehéndens Tobías, traxit ab óculis eius: statímque visum recépit.'
  "16": Et glorificábant Deum, ipse vidélicet, et uxor eius, et omnes qui sciébant eum.
  "17": 'Dicebátque Tobías: Benedíco te Dómine Deus Israel, quia tu castigásti me, et tu salvásti me: et ecce ego vídeo Tobíam fílium meum.'
  "18": 'Ingréssa est étiam post septem dies Sara uxor fílii eius, et omnis família sana, et pécora, et caméli, et pecúnia multa uxóris: sed et illa pecúnia, quam recéperat a Gabélo:'
  "19": et narrávit paréntibus suis ómnia benefícia Dei, quæ fecísset circa eum per hóminem, qui eum dúxerat.
  "20": Venerúntque Achior et Nabath consobríni Tobíæ, gaudéntes ad Tobíam, et congratulántes ei de ómnibus bonis, quæ circa illum osténderat Deus.
  "21": Et per septem dies epulántes, omnes cum gáudio magno gavísi sunt.
