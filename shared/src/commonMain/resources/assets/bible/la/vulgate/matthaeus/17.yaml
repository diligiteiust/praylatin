bible: vulgate
lang: la
language: Latina
book: Matthaeus
chapter: "17"
verses:
  "1": 'Et post dies sex assúmit Iesus Petrum, et Iacóbum, et Ioánnem fratrem eius, et ducit illos in montem excélsum seórsum:'
  "2": 'et transfigurátus est ante eos. Et resplénduit fácies eius sicut sol: vestiménta autem eius facta sunt alba sicut nix.'
  "3": Et ecce apparuérunt illis Móyses, et Elías cum eo loquéntes.
  "4": 'Respóndens autem Petrus, dixit ad Iesum: Dómine, bonum est nos hic esse: si vis, faciámus tria tabernácula, tibi unum, Móysi unum, et Elíæ unum.'
  "5": 'Adhuc eo loquénte, ecce nubes lúcida obumbrávit eos. Et ecce vox de nube, dicens: Hic est Fílius meus diléctus, in quo mihi bene complácui: ipsum audíte.'
  "6": Et audiéntes discípuli cecidérunt in fáciem suam, et timuérunt valde.
  "7": 'Et accéssit Iesus, et tétigit eos: dixítque eis: Súrgite, et nolíte timére.'
  "8": Levántes autem óculos suos, néminem vidérunt, nisi solum Iesum.
  "9": 'Et descendéntibus illis de monte, præcépit eis Iesus, dicens: Némini dixéritis visiónem, donec Fílius hóminis a mórtuis resúrgat.'
  "10": 'Et interrogavérunt eum discípuli, dicéntes: Quid ergo scribæ dicunt, quod Elíam opórteat primum veníre?'
  "11": 'At ille respóndens, ait eis: Elías quidem ventúrus est, et restítuet ómnia.'
  "12": Dico autem vobis, quia Elías iam venit, et non cognovérunt eum, sed fecérunt in eo quæcúmque voluérunt. Sic et Fílius hóminis passúrus est ab eis.
  "13": Tunc intellexérunt discípuli, quia de Ioánne Baptísta dixísset eis.
  "14": 'Et cum venísset ad turbam, accéssit ad eum homo génibus provolútus ante eum, dicens: Dómine, miserére fílio meo, quia lunáticus est, et male pátitur: nam sæpe cadit in ignem, et crebro in aquam.'
  "15": Et óbtuli eum discípulis tuis, et non potuérunt curáre eum.
  "16": 'Respóndens autem Iesus, ait: O generátio incrédula, et pervérsa, quoúsque ero vobíscum? úsquequo pátiar vos? Afférte huc illum ad me.'
  "17": Et increpávit illum Iesus, et éxiit ab eo dæmónium, et curátus est puer ex illa hora.
  "18": 'Tunc accessérunt discípuli ad Iesum secréto, et dixérunt: Quare nos non potúimus eícere illum?'
  "19": 'Dixit illis Iesus: Propter incredulitátem vestram. Amen quippe dico vobis, si habuéritis fidem sicut granum sinápis, dicétis monti huic: Transi hinc illuc, et transíbit, et nihil impossíbile erit vobis.'
  "20": Hoc autem genus non eícitur nisi per oratiónem, et ieiúnium.
  "21": 'Conversántibus autem eis in Galilǽa, dixit illis Iesus: Fílius hóminis tradéndus est in manus hóminum:'
  "22": et occídent eum, et tértia die resúrget. Et contristáti sunt veheménter.
  "23": 'Et cum veníssent Caphárnaum, accessérunt qui didráchma accipiébant, ad Petrum, et dixérunt ei: Magíster vester non solvit didráchma?'
  "24": 'Ait: Etiam. Et cum intrásset in domum, prævénit eum Iesus, dicens: Quid tibi vidétur Simon? Reges terræ a quibus accípiunt tribútum vel censum? a fíliis suis, an ab aliénis?'
  "25": 'Et ille dixit: Ab aliénis. Dixit illi Iesus: Ergo líberi sunt fílii.'
  "26": 'Ut autem non scandalizémus eos, vade ad mare, et mitte hamum: et eum piscem, qui primus ascénderit, tolle: et apérto ore eius, invénies statérem: illum sumens, da eis pro me, et te.'
