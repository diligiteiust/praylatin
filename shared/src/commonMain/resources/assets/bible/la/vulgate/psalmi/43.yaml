bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "43"
verses:
  "1": In finem, fíliis Core ad intelléctum.
  "2": 'Deus áuribus nostris audívimus: patres nostri annuntiavérunt nobis. Opus, quod operátus es in diébus eórum: et in diébus antíquis.'
  "3": 'Manus tua gentes dispérdidit, et plantásti eos: afflixísti pópulos, et expulísti eos:'
  "4": 'nec enim in gládio suo possedérunt terram, et bráchium eórum non salvávit eos: sed déxtera tua, et bráchium tuum, et illuminátio vultus tui: quóniam complacuísti in eis.'
  "5": 'Tu es ipse rex meus et Deus meus: qui mandas salútes Iacob.'
  "6": In te inimícos nostros ventilábimus cornu, et in nómine tuo spernémus insurgéntes in nobis.
  "7": 'Non enim in arcu meo sperábo: et gládius meus non salvábit me.'
  "8": 'Salvásti enim nos de affligéntibus nos: et odiéntes nos confudísti.'
  "9": 'In Deo laudábimur tota die: et in nómine tuo confitébimur in sǽculum.'
  "10": 'Nunc autem repulísti et confudísti nos: et non egrediéris Deus in virtútibus nostris.'
  "11": 'Avertísti nos retrórsum post inimícos nostros: et qui odérunt nos diripiébant sibi.'
  "12": 'Dedísti nos tamquam oves escárum: et in géntibus dispersísti nos.'
  "13": 'Vendidísti pópulum tuum sine prétio: et non fuit multitúdo in commutatiónibus eórum.'
  "14": Posuísti nos oppróbrium vicínis nostris, subsannatiónem et derísum his, qui sunt in circúitu nostro.
  "15": 'Posuísti nos in similitúdinem géntibus: commotiónem cápitis in pópulis.'
  "16": Tota die verecúndia mea contra me est, et confúsio faciéi meæ coopéruit me.
  "17": 'A voce exprobrántis, et obloquéntis: a fácie inimíci, et persequéntis.'
  "18": 'Hæc ómnia venérunt super nos, nec oblíti sumus te: et iníque non égimus in testaménto tuo.'
  "19": 'Et non recéssit retro cor nostrum: et declinásti sémitas nostras a via tua:'
  "20": quóniam humiliásti nos in loco afflictiónis, et coopéruit nos umbra mortis.
  "21": 'Si oblíti sumus nomen Dei nostri, et si expándimus manus nostras ad deum aliénum:'
  "22": 'nonne Deus requíret ista? ipse enim novit abscóndita cordis. Quóniam propter te mortificámur tota die: æstimáti sumus sicut oves occisiónis.'
  "23": Exsúrge, quare obdórmis Dómine? exsúrge, et ne repéllas in finem.
  "24": Quare fáciem tuam avértis, oblivísceris inópiæ nostræ et tribulatiónis nostræ?
  "25": 'Quóniam humiliáta est in púlvere ánima nostra: conglutinátus est in terra venter noster.'
  "26": 'Exsúrge Dómine, ádiuva nos: et rédime nos propter nomen tuum.'
