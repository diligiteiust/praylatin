bible: vulgate
lang: la
language: Latina
book: II Samuelis
chapter: "18"
verses:
  "1": Igitur consideráto David pópulo suo, constítuit super eos tribúnos et centuriónes,
  "2": 'et dedit pópuli tértiam partem sub manu Ioab, et tértiam partem sub manu Abísai fílii Sárviæ fratris Ioab, et tértiam partem sub manu Ethái, qui erat de Geth: dixítque rex ad pópulum: Egrédiar et ego vobíscum.'
  "3": 'Et respóndit pópulus: Non exíbis: sive enim fugérimus, non magnópere ad eos de nobis pertinébit: sive média pars cecíderit e nobis, non satis curábunt, quia tu unus pro decem míllibus computáris: mélius est ígitur ut sis nobis in urbe præsídio.'
  "4": 'Ad quos rex ait: Quod vobis vidétur rectum, hoc fáciam. Stetit ergo rex iuxta portam: egrediebatúrque pópulus per turmas suas centéni, et milléni.'
  "5": 'Et præcépit rex Ioab, et Abísai, et Ethái, dicens: Serváte mihi púerum Absalom. Et omnis pópulus audiébat præcipiéntem regem cunctis princípibus pro Absalom.'
  "6": Itaque egréssus est pópulus in campum contra Israel, et factum est prœ́lium in saltu Ephraim.
  "7": Et cæsus est ibi pópulus Israel ab exércitu David, factáque est plaga magna in die illa, vigínti míllium.
  "8": Fuit autem ibi prœ́lium dispérsum super fáciem omnis terræ, et multo plures erant, quos saltus consúmpserat de pópulo, quam hi, quos voráverat gládius in die illa.
  "9": 'Accidit autem ut occúrreret Absalom servis David, sedens mulo: cumque ingréssus fuísset mulus subter condénsam quercum et magnam, adhǽsit caput eius quércui: et illo suspénso inter cælum et terram, mulus, cui inséderat, pertransívit.'
  "10": 'Vidit autem hoc quíspiam, et nuntiávit Ioab, dicens: Vidi Absalom pendére de quercu.'
  "11": 'Et ait Ioab viro, qui nuntiáverat ei: Si vidísti, quare non confodísti eum cum terra, et ego dedíssem tibi decem argénti siclos, et unum bálteum?'
  "12": 'Qui dixit ad Ioab: Si appénderes in mánibus meis mille argénteos, nequáquam mítterem manum meam in fílium regis: audiéntibus enim nobis præcépit rex tibi, et Abísai, et Ethái, dicens: Custodíte mihi púerum Absalom.'
  "13": Sed etsi fecíssem contra ánimam meam audácter, nequáquam hoc regem latére potuísset, et tu stares ex advérso?
  "14": 'Et ait Ioab: Non sicut tu vis, sed aggrédiar eum coram te. Tulit ergo tres lánceas in manu sua, et infíxit eas in corde Absalom: cumque adhuc palpitáret hærens in quercu,'
  "15": cucurrérunt decem iúvenes armígeri Ioab, et percutiéntes interfecérunt eum.
  "16": Cécinit autem Ioab búccina, et retínuit pópulum, ne persequerétur fugiéntem Israel, volens párcere multitúdini.
  "17": 'Et tulérunt Absalom, et proiecérunt eum in saltu, in fóveam grandem, et comportavérunt super eum acérvum lápidum magnum nimis: omnis autem Israel fugit in tabernácula sua.'
  "18": 'Porro Absalom eréxerat sibi, cum adhuc víveret, títulum qui est in Valle regis: díxerat enim: Non hábeo fílium, et hoc erit monuméntum nóminis mei. Vocavítque títulum nómine suo, et appellátur Manus Absalom, usque ad hanc diem.'
  "19": 'Achímaas autem fílius Sadoc, ait: Curram, et nuntiábo regi quia iudícium fécerit ei Dóminus de manu inimicórum eius.'
  "20": 'Ad quem Ioab dixit: Non eris núntius in hac die, sed nuntiábis in ália: hódie nolo te nuntiáre, fílius enim regis est mórtuus.'
  "21": 'Et ait Ioab Chusi: Vade, et núntia regi quæ vidísti. Adorávit Chusi Ioab, et cucúrrit.'
  "22": 'Rursus autem Achímaas fílius Sadoc dixit ad Ioab: Quid ímpedit si étiam ego curram post Chusi? Dixítque ei Ioab: Quid vis cúrrere fili mi? non eris boni núntii báiulus.'
  "23": 'Qui respóndit: Quid enim si cucúrrero? Et ait ei: Curre. Currens ergo Achímaas per viam compéndii, transívit Chusi.'
  "24": 'David autem sedébat inter duas portas: speculátor vero, qui erat in fastígio portæ super murum, élevans óculos, vidit hóminem curréntem solum.'
  "25": 'Et exclámans indicávit regi: dixítque rex: Si solus est, bonus est núntius in ore eius. Properánte autem illo, et accedénte própius,'
  "26": 'vidit speculátor hóminem álterum curréntem, et vocíferans in cúlmine, ait: Appáret mihi alter homo currens solus. Dixítque rex: Et iste bonus est núntius.'
  "27": 'Speculátor autem: Contémplor, ait, cursum prióris, quasi cursum Achímaas fílii Sadoc. Et ait rex: Vir bonus est, et núntium portans bonum venit.'
  "28": 'Clamans autem Achímaas, dixit ad regem: Salve rex. Et adórans regem coram eo pronus in terram, ait: Benedíctus Dóminus Deus tuus, qui conclúsit hómines qui levavérunt manus suas contra dóminum meum regem.'
  "29": 'Et ait rex: Estne pax púero Absalom? Dixítque Achímaas: Vidi tumúltum magnum cum mítteret Ioab servus tuus, o rex, me servum tuum: néscio áliud.'
  "30": 'Ad quem rex: Transi, ait, et sta hic. Cumque ille transísset, et staret,'
  "31": 'appáruit Chusi: et véniens ait: Bonum appórto núntium, dómine mi rex: iudicávit enim pro te Dóminus hódie de manu ómnium qui surrexérunt contra te.'
  "32": 'Dixit autem rex ad Chusi: Estne pax púero Absalom? Cui respóndens Chusi: Fiant, inquit, sicut puer, inimíci dómini mei regis, et univérsi qui consúrgunt advérsus eum in malum.'
  "33": 'Contristátus ítaque rex, ascéndit cœnáculum portæ, et flevit. Et sic loquebátur, vadens: Fili mi Absalom, Absalom fili mi: quis mihi tríbuat ut ego móriar pro te, Absalom fili mi, fili mi Absalom?'
