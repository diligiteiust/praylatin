bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "5"
verses:
  "1": In finem, pro ea quæ hereditátem conséquitur, Psalmus David.
  "2": 'Verba mea áuribus pércipe Dómine: intéllige clamórem meum.'
  "3": Inténde voci oratiónis meæ, rex meus et Deus meus.
  "4": 'Quóniam ad te orábo: Dómine mane exáudies vocem meam.'
  "5": 'Mane astábo tibi et vidébo: quóniam non Deus volens iniquitátem tu es.'
  "6": 'Neque habitábit iuxta te malígnus: neque permanébunt iniústi ante óculos tuos.'
  "7": 'Odísti omnes, qui operántur iniquitátem: perdes omnes, qui loquúntur mendácium. Virum sánguinum et dolósum abominábitur Dóminus:'
  "8": 'ego autem in multitúdine misericórdiæ tuæ, introíbo in domum tuam: adorábo ad templum sanctum tuum in timóre tuo.'
  "9": 'Dómine deduc me in iustítia tua: propter inimícos meos dírige in conspéctu tuo viam meam.'
  "10": 'Quóniam non est in ore eórum véritas: cor eórum vanum est.'
  "11": 'Sepúlcrum patens est guttur eórum, linguis suis dolóse agébant: iúdica illos Deus. Décidant a cogitatiónibus suis, secúndum multitúdinem impietátum eórum expélle eos, quóniam irritavérunt te Dómine.'
  "12": 'Et læténtur omnes, qui sperant in te: in ætérnum exsultábunt, et habitábis in eis. Et gloriabúntur in te omnes, qui díligunt nomen tuum,'
  "13": quóniam tu benedíces iusto. Dómine, ut scuto bonæ voluntátis tuæ coronásti nos.
