bible: vulgate
lang: la
language: Latina
book: I Regum
chapter: "20"
verses:
  "1": 'Porro Bénadad rex Sýriæ congregávit omnem exércitum suum, et trigínta duos reges secum, et equos, et currus: et ascéndens pugnábat contra Samaríam, et obsidébat eam.'
  "2": Mitténsque núntios ad Achab regem Israel in civitátem,
  "3": 'ait: Hæc dicit Bénadad: Argéntum tuum, et aurum tuum meum est: et uxóres tuæ, et fílii tui óptimi, mei sunt.'
  "4": 'Respondítque rex Israel: Iuxta verbum tuum, dómine mi rex, tuus sum ego, et ómnia mea.'
  "5": 'Revertentésque núntii, dixérunt: Hæc dicit Bénadad, qui misit nos ad te: Argéntum tuum, et aurum tuum, et uxóres tuas, et fílios tuos, dabis mihi.'
  "6": 'Cras ígitur hac eádem hora mittam servos meos ad te, et scrutabúntur domum tuam, et domum servórum tuórum: et omne, quod eis placúerit, ponent in mánibus suis, et áuferent.'
  "7": 'Vocávit autem rex Israel omnes senióres terræ, et ait: Animadvértite, et vidéte quóniam insidiétur nobis: misit enim ad me pro uxóribus meis, et fíliis, et pro argénto et auro: et non ábnui.'
  "8": 'Dixerúntque omnes maióres natu, et univérsus pópulus, ad eum: Non áudias, neque acquiéscas illi.'
  "9": 'Respóndit ítaque núntiis Bénadad: Dícite dómino meo regi: Omnia propter quæ misísti ad me servum tuum in inítio, fáciam: hanc autem rem fácere non possum.'
  "10": 'Reversíque núntii retulérunt ei. Qui remísit, et ait: Hæc fáciant mihi dii, et hæc addant, si suffécerit pulvis Samaríæ pugíllis omnis pópuli qui séquitur me.'
  "11": 'Et respóndens rex Israel, ait: Dícite ei: Ne gloriétur accínctus æque ut discínctus.'
  "12": 'Factum est autem cum audísset Bénadad verbum istud, bibébat ipse et reges in umbráculis: et ait servis suis: Circúmdate civitátem. Et circumdedérunt eam.'
  "13": 'Et ecce prophéta unus accédens ad Achab regem Israel, ait ei: Hæc dicit Dóminus: Certe vidísti omnem multitúdinem hanc nímiam? ecce ego tradam eam in manu tua hódie, ut scias quia ego sum Dóminus.'
  "14": 'Et ait Achab: Per quem? Dixítque ei: Hæc dicit Dóminus: Per pedíssequos príncipum provinciárum. Et ait: Quis incípiet prœliári? Et ille dixit: Tu.'
  "15": 'Recénsuit ergo púeros príncipum provinciárum, et réperit númerum ducentórum trigínta duórum: et recénsuit post eos pópulum, omnes fílios Israel, septem míllia.'
  "16": Et egréssi sunt merídie. Bénadad autem bibébat temuléntus in umbráculo suo, et reges trigínta duo cum eo, qui ad auxílium eius vénerant.
  "17": 'Egréssi sunt autem púeri príncipum provinciárum in prima fronte. Misit ítaque Bénadad: qui nuntiavérunt ei, dicéntes: Viri egréssi sunt de Samaría.'
  "18": 'Et ille ait: Sive pro pace véniunt, apprehéndite eos vivos: sive ut prœliéntur, vivos eos cápite.'
  "19": 'Egréssi sunt ergo púeri príncipum provinciárum, ac réliquus exércitus sequebátur:'
  "20": 'et percússit unusquísque virum qui contra se veniébat: fugerúntque Syri, et persecútus est eos Israel. Fugit quoque Bénadad rex Sýriæ in equo cum equítibus suis.'
  "21": Necnon egréssus rex Israel percússit equos et currus, et percússit Sýriam plaga magna.
  "22": 'Accédens autem prophéta ad regem Israel, dixit ei: Vade, et confortáre, et scito, et vide quid fácias: sequénti enim anno rex Sýriæ ascéndet contra te.'
  "23": 'Servi vero regis Sýriæ dixérunt ei: Dii móntium sunt dii eórum, ídeo superavérunt nos: sed mélius est ut pugnémus contra eos in campéstribus, et obtinébimus eos.'
  "24": 'Tu ergo verbum hoc fac: ámove reges síngulos ab exércitu tuo, et pone príncipes pro eis:'
  "25": 'et instáura númerum mílitum qui cecidérunt de tuis, et equos secúndum equos prístinos, et currus secúndum currus quos ante habuísti: et pugnábimus contra eos in campéstribus, et vidébis quod obtinébimus eos. Crédidit consílio eórum, et fecit ita.'
  "26": Igitur postquam annus transíerat, recénsuit Bénadad Syros, et ascéndit in Aphec ut pugnáret contra Israel.
  "27": 'Porro fílii Israel recensíti sunt, et accéptis cibáriis profécti ex advérso, castráque metáti sunt contra eos, quasi duo parvi greges caprárum: Syri autem replevérunt terram.'
  "28": '(Et accédens unus vir Dei, dixit ad regem Israel: Hæc dicit Dóminus: Quia dixérunt Syri: Deus móntium est Dóminus, et non est Deus vállium: dabo omnem multitúdinem hanc grandem in manu tua, et sciétis quia ego sum Dóminus.)'
  "29": 'Dirigebántque septem diébus ex advérso hi atque illi ácies, séptima autem die commíssum est bellum: percusserúntque fílii Israel de Syris centum míllia péditum in die una.'
  "30": 'Fugérunt autem qui remánserant in Aphec, in civitátem: et cécidit murus super vigínti septem míllia hóminum qui remánserant. Porro Bénadad fúgiens ingréssus est civitátem, in cubículum quod erat intra cubículum.'
  "31": 'Dixerúntque ei servi sui: Ecce, audívimus quod reges domus Israel cleméntes sint: ponámus ítaque saccos in lumbis nostris, et funículos in capítibus nostris, et egrediámur ad regem Israel: fórsitan salvábit ánimas nostras.'
  "32": 'Accinxérunt saccis lumbos suos, et posuérunt funículos in capítibus suis, venerúntque ad regem Israel, et dixérunt ei: Servus tuus Bénadad dicit: Vivat, oro te, ánima mea. Et ille ait: Si adhuc vivit, frater meus est.'
  "33": 'Quod accepérunt viri pro ómine: et festinántes rapuérunt verbum ex ore eius, atque dixérunt: Frater tuus Bénadad. Et dixit eis: Ite, et addúcite eum ad me. Egréssus est ergo ad eum Bénadad, et levávit eum in currum suum.'
  "34": 'Qui dixit ei: Civitátes quas tulit pater meus a patre tuo, reddam: et platéas fac tibi in Damásco, sicut fecit pater meus in Samaría, et ego fœderátus recédam a te. Pépigit ergo fœdus, et dimísit eum.'
  "35": 'Tunc vir quidam de fíliis prophetárum dixit ad sócium suum in sermóne Dómini: Pércute me. At ille nóluit percútere.'
  "36": 'Cui ait: Quia noluísti audíre vocem Dómini, ecce recédes a me, et percútiet te leo. Cumque páululum recessísset ab eo, invénit eum leo, atque percússit.'
  "37": 'Sed et álterum invéniens virum, dixit ad eum: Pércute me. Qui percússit eum, et vulnerávit.'
  "38": Abiit ergo prophéta, et occúrrit regi in via, et mutávit aspersióne púlveris os et óculos suos.
  "39": 'Cumque rex transísset, clamávit ad regem, et ait: Servus tuus egréssus est ad prœliándum cóminus: cumque fugísset vir unus, addúxit eum quidam ad me, et ait: Custódi virum istum: qui si lapsus fúerit, erit ánima tua pro ánima eius, aut taléntum argénti appéndes.'
  "40": 'Dum autem ego turbátus huc illúcque me vérterem, súbito non compáruit. Et ait rex Israel ad eum: Hoc est iudícium tuum, quod ipse decrevísti.'
  "41": At ille statim abstérsit púlverem de fácie sua, et cognóvit eum rex Israel, quod esset de prophétis.
  "42": 'Qui ait ad eum: Hæc dicit Dóminus: Quia dimisísti virum dignum morte de manu tua, erit ánima tua pro ánima eius, et pópulus tuus pro pópulo eius.'
  "43": Revérsus est ígitur rex Israel in domum suam, audíre contémnens, et furibúndus venit in Samaríam.
