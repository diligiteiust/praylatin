bible: vulgate
lang: la
language: Latina
book: Ieremias
chapter: "6"
verses:
  "1": Confortámini fílii Béniamin in médio Ierúsalem, et in Thécua clángite búccina, et super Bethácarem leváte vexíllum, quia malum visum est ab aquilóne, et contrítio magna.
  "2": Speciósæ et delicátæ assimilávi fíliam Sion.
  "3": 'Ad eam vénient pastóres et greges eórum: fixérunt in ea tentória in circúitu: pascet unusquísque eos, qui sub manu sua sunt.'
  "4": 'Sanctificáte super eam bellum: consúrgite, et ascendámus in merídie: væ nobis, quia declinávit dies, quia longióres factæ sunt umbræ vésperi.'
  "5": Súrgite, et ascendámus in nocte, et dissipémus domos eius.
  "6": 'Quia hæc dicit Dóminus exercítuum: Cǽdite lignum eius, et fúndite circa Ierúsalem ággerem: hæc est cívitas visitatiónis, omnis calúmnia in médio eius.'
  "7": 'Sicut frígidam fecit cistérna aquam suam, sic frígidam fecit malítiam suam: iníquitas et vástitas audiétur in ea, coram me semper infírmitas et plaga.'
  "8": Erudíre Ierúsalem, ne forte recédat ánima mea a te, ne forte ponam te desértam, terram inhabitábilem.
  "9": 'Hæc dicit Dóminus exercítuum: Usque ad racémum cólligent quasi in vínea relíquias Israel: convérte manum tuam quasi vindemiátor ad cartállum.'
  "10": 'Cui loquar? et quem contestábor ut áudiat? ecce incircumcísæ aures eórum, et audíre non possunt: ecce verbum Dómini factum est eis in oppróbrium, et non suscípient illud.'
  "11": 'Idcírco furóre Dómini plenus sum, laborávi sústinens: effúnde super párvulum foris, et super consílium iúvenum simul: vir enim cum mulíere capiétur, senex cum pleno diérum.'
  "12": 'Et transíbunt domus eórum ad álteros, agri et uxóres páriter: quia exténdam manum meam super habitántes terram, dicit Dóminus.'
  "13": A minóre quippe usque ad maiórem omnes avarítiæ student, et a prophéta usque ad sacerdótem cuncti fáciunt dolum.
  "14": 'Et curábant contritiónem fíliæ pópuli mei cum ignomínia, dicéntes: Pax, pax: et non erat pax.'
  "15": 'Confúsi sunt, quia abominatiónem fecérunt: quin pótius confusióne non sunt confúsi, et erubéscere nesciérunt: quam ob rem cadent inter ruéntes: in témpore visitatiónis suæ córruent, dicit Dóminus.'
  "16": 'Hæc dicit Dóminus: State super vias, et vidéte, et interrogáte de sémitis antíquis, quæ sit via bona, et ambuláte in ea: et inveniétis refrigérium animábus vestris. Et dixérunt: Non ambulábimus.'
  "17": 'Et constítui super vos speculatóres. Audíte vocem tubæ. Et dixérunt: Non audiémus.'
  "18": Ideo audíte gentes, et cognósce congregátio, quanta ego fáciam eis.
  "19": 'Audi terra: Ecce ego addúcam mala super pópulum istum, fructum cogitatiónum eius: quia verba mea non audiérunt, et legem meam proiecérunt.'
  "20": Ut quid mihi thus de Saba affértis, et cálamum suáve oléntem de terra longínqua? holocautómata vestra non sunt accépta, et víctimæ vestræ non placuérunt mihi.
  "21": 'Proptérea hæc dicit Dóminus: Ecce ego dabo in pópulum istum ruínas, et ruent in eis patres et fílii simul, vicínus, et próximus períbunt.'
  "22": 'Hæc dicit Dóminus: Ecce pópulus venit de terra aquilónis, et gens magna consúrget a fínibus terræ.'
  "23": 'Sagíttam et scutum arrípiet: crudélis est, et non miserébitur: vox eius quasi mare sonábit: et super equos ascéndent, præparáti quasi vir ad prœ́lium, advérsum te fília Sion.'
  "24": 'Audívimus famam eius, dissolútæ sunt manus nostræ: tribulátio apprehéndit nos, dolóres ut parturiéntem.'
  "25": 'Nolíte exíre ad agros, et in via ne ambulétis: quóniam gládius inimíci pavor in circúitu.'
  "26": 'Fília pópuli mei accíngere cilício, et conspérgere cínere: luctum unigéniti fac tibi, planctum amárum, quia repénte véniet vastátor super nos.'
  "27": 'Probatórem dedi te in pópulo meo robústum: et scies, et probábis viam eórum.'
  "28": 'Omnes isti príncipes declinántes, ambulántes fraudulénter, æs et ferrum: univérsi corrúpti sunt.'
  "29": 'Defécit sufflatórium, in igne consúmptum est plumbum, frustra conflávit conflátor: malítiæ enim eórum non sunt consúmptæ.'
  "30": Argéntum réprobum vocáte eos, quia Dóminus proiécit illos.
