bible: vulgate
lang: la
language: Latina
book: Aggaeus
chapter: "2"
verses:
  "1": In die vigésima et quarta mensis, in sexto mense, in anno secúndo Daríi regis.
  "2": 'In séptimo mense, vigésima et prima mensis, factum est verbum Dómini in manu Aggǽi prophétæ, dicens:'
  "3": 'Lóquere ad Zoróbabel fílium Saláthiel, ducem Iuda, et ad Iesum fílium Iósedec sacerdótem magnum, et ad réliquos pópuli, dicens:'
  "4": Quis in vobis est derelíctus, qui vidit domum istam in glória sua prima? et quid vos vidétis hanc nunc? numquid non ita est, quasi non sit in óculis vestris?
  "5": 'Et nunc confortáre Zoróbabel, dicit Dóminus: et confortáre Iesu fili Iósedec sacérdos magne, et confortáre omnis pópulus terræ, dicit Dóminus exercítuum: et fácite (quóniam ego vobíscum sum, dicit Dóminus exercítuum)'
  "6": 'verbum quod pépigi vobíscum cum egrederémini de terra Ægýpti: et spíritus meus erit in médio vestrum, nolíte timére.'
  "7": 'Quia hæc dicit Dóminus exercítuum: Adhuc unum módicum est, et ego commovébo cælum, et terram, et mare, et áridam.'
  "8": 'Et movébo omnes gentes: et véniet desiderátus cunctis géntibus: et implébo domum istam glória, dicit Dóminus exercítuum.'
  "9": Meum est argéntum, et meum est aurum, dicit Dóminus exercítuum.
  "10": 'Magna erit glória domus istíus novíssimæ plus quam primæ, dicit Dóminus exercítuum: et in loco isto dabo pacem, dicit Dóminus exercítuum.'
  "11": 'In vigésima et quarta noni mensis, in anno secúndo Daríi regis, factum est verbum Dómini ad Aggǽum prophétam, dicens:'
  "12": 'Hæc dicit Dóminus exercítuum: Intérroga sacerdótes legem, dicens:'
  "13": 'Si túlerit homo carnem sanctificátam in ora vestiménti sui, et tetígerit de summitáte eius panem, aut pulméntum, aut vinum, aut óleum, aut omnem cibum: numquid sanctificábitur? Respondéntes autem sacerdótes, dixérunt: Non.'
  "14": 'Et dixit Aggǽus: Si tetígerit pollútus in ánima ex ómnibus his, numquid contaminábitur? Et respondérunt sacerdótes, et dixérunt: Contaminábitur.'
  "15": 'Et respóndit Aggǽus, et dixit: Sic pópulus iste, et sic gens ista ante fáciem meam, dicit Dóminus, et sic omne opus mánuum eórum: et ómnia quæ obtulérunt ibi, contamináta erunt.'
  "16": Et nunc pónite corda vestra a die hac et supra, ántequam ponerétur lapis super lápidem in templo Dómini.
  "17": 'Cum accederétis ad acérvum vigínti modiórum, et fíerent decem: et intrarétis ad tórcular, ut exprimerétis quinquagínta lagénas, et fiébant vigínti.'
  "18": 'Percússi vos vento urénte, et aurúgine, et grándine ómnia ópera mánuum vestrárum: et non fuit in vobis, qui reverterétur ad me, dicit Dóminus.'
  "19": 'Pónite corda vestra ex die ista, et in futúrum, a die vigésima et quarta noni mensis: a die, qua fundaménta iacta sunt templi Dómini, pónite super cor vestrum.'
  "20": 'Numquid iam semen in gérmine est: et adhuc vínea, et ficus, et malogranátum, et lignum olívæ non flóruit? ex die ista benedícam.'
  "21": 'Et factum est verbum Dómini secúndo ad Aggǽum in vigésima et quarta mensis, dicens:'
  "22": 'Lóquere ad Zoróbabel ducem Iuda, dicens: Ego movébo cælum páriter et terram.'
  "23": 'Et subvértam sólium regnórum, et cónteram fortitúdinem regni géntium: et subvértam quadrígam, et ascensórem eius: et descéndent equi, et ascensóres eórum: vir in gládio fratris sui.'
  "24": 'In die illa, dicit Dóminus exercítuum, assúmam te Zoróbabel fili Saláthiel serve meus, dicit Dóminus: et ponam te quasi signáculum, quia te elégi, dicit Dóminus exercítuum.'
