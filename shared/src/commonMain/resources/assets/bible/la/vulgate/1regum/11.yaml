bible: vulgate
lang: la
language: Latina
book: I Regum
chapter: "11"
verses:
  "1": 'Rex autem Sálomon adamávit mulíeres alienígenas multas, fíliam quoque Pharaónis, et Moabítidas, et Ammonítidas, Idumǽas, et Sidónias, et Hethǽas:'
  "2": 'de géntibus, super quibus dixit Dóminus fíliis Israel: Non ingrediémini ad eas, neque de illis ingrediéntur ad vestras: certíssime enim avértent corda vestra ut sequámini deos eárum. His ítaque copulátus est Sálomon ardentíssimo amóre.'
  "3": 'Fuerúntque ei uxóres quasi regínæ septingéntæ, et concubínæ trecéntæ: et avertérunt mulíeres cor eius.'
  "4": 'Cumque iam esset senex, depravátum est cor eius per mulíeres, ut sequerétur deos aliénos: nec erat cor eius perféctum cum Dómino Deo suo, sicut cor David patris eius.'
  "5": Sed colébat Sálomon Astárthen deam Sidoniórum, et Moloch idólum Ammonitárum.
  "6": Fecítque Sálomon quod non placúerat coram Dómino, et non adimplévit ut sequerétur Dóminum sicut David pater eius.
  "7": Tunc ædificávit Sálomon fanum Chamos idólo Moab, in monte qui est contra Ierúsalem, et Moloch idólo filiórum Ammon.
  "8": Atque in hunc modum fecit univérsis uxóribus suis alienígenis, quæ adolébant thura, et immolábant diis suis.
  "9": Igitur irátus est Dóminus Salomóni, quod avérsa esset mens eius a Dómino Deo Israel, qui apparúerat ei secúndo,
  "10": 'et præcéperat de verbo hoc ne sequerétur deos aliénos: et non custodívit quæ mandávit ei Dóminus.'
  "11": 'Dixit ítaque Dóminus Salomóni: Quia habuísti hoc apud te, et non custodísti pactum meum, et præcépta mea, quæ mandávi tibi, disrúmpens scindam regnum tuum, et dabo illud servo tuo.'
  "12": 'Verúmtamen in diébus tuis non fáciam propter David patrem tuum: de manu fílii tui scindam illud,'
  "13": nec totum regnum áuferam, sed tribum unam dabo fílio tuo propter David servum meum, et Ierúsalem quam elégi.
  "14": Suscitávit autem Dóminus adversárium Salomóni Adad Idumǽum de sémine régio, qui erat in Edom.
  "15": Cum enim esset David in Idumǽa, et ascendísset Ioab princeps milítiæ ad sepeliéndum eos, qui fúerant interfécti, et occidísset omnem masculínum in Idumǽa
  "16": (sex enim ménsibus ibi morátus est Ioab, et omnis Israel, donec interímeret omne masculínum in Idumǽa),
  "17": 'fugit Adad ipse, et viri Idumǽi de servis patris eius cum eo, ut ingrederétur Ægýptum: erat autem Adad puer párvulus.'
  "18": 'Cumque surrexíssent de Mádian, venérunt in Pharan, tulerúntque secum viros de Pharan, et introiérunt Ægýptum ad Pharaónem regem Ægýpti: qui dedit ei domum, et cibos constítuit, et terram delegávit.'
  "19": Et invénit Adad grátiam coram Pharaóne valde, in tantum ut daret ei uxórem sorórem uxóris suæ germánam Taphnes regínæ.
  "20": 'Genuítque ei soror Taphnes Génubath fílium, et nutrívit eum Taphnes in domo Pharaónis: erátque Génubath hábitans apud Pharaónem cum fíliis eius.'
  "21": 'Cumque audísset Adad in Ægýpto dormísse David cum pátribus suis, et mórtuum esse Ioab príncipem milítiæ, dixit Pharaóni: Dimítte me, ut vadam in terram meam.'
  "22": 'Dixítque ei Phárao: Qua enim re apud me índiges, ut quæras ire ad terram tuam? At ille respóndit: Nulla: sed óbsecro te ut dimíttas me.'
  "23": 'Suscitávit quoque ei Deus adversárium Razon fílium Elíada, qui fúgerat Adarézer regem Soba dóminum suum:'
  "24": 'et congregávit contra eum viros, et factus est princeps latrónum cum interfíceret eos David: abierúntque Damáscum, et habitavérunt ibi, et constituérunt eum regem in Damásco:'
  "25": 'erátque adversárius Israéli cunctis diébus Salomónis: et hoc est malum Adad, et ódium contra Israel: regnavítque in Sýria.'
  "26": Ieróboam quoque fílius Nabat, Ephrathǽus, de Saréda, servus Salomónis, cuius mater erat nómine Sarva, múlier vídua, levávit manum contra regem.
  "27": Et hæc est causa rebelliónis advérsus eum, quia Sálomon ædificávit Mello, et coæquávit voráginem civitátis David patris sui.
  "28": 'Erat autem Ieróboam vir fortis et potens: vidénsque Sálomon adolescéntem bonæ índolis et indústrium, constitúerat eum præféctum super tribúta univérsæ domus Ioseph.'
  "29": 'Factum est ígitur in témpore illo, ut Ieróboam egrederétur de Ierúsalem, et inveníret eum Ahías Silonítes prophéta in via, opértus pállio novo: erant autem duo tantum in agro.'
  "30": Apprehendénsque Ahías pállium suum novum, quo coopértus erat, scidit in duódecim partes.
  "31": 'Et ait ad Ieróboam: Tolle tibi decem scissúras: hæc enim dicit Dóminus Deus Israel: Ecce ego scindam regnum de manu Salomónis, et dabo tibi decem tribus.'
  "32": 'Porro una tribus remanébit ei propter servum meum David, et Ierúsalem civitátem, quam elégi ex ómnibus tríbubus Israel:'
  "33": 'eo quod derelíquerit me, et adoráverit Astárthen deam Sidoniórum, et Chamos deum Moab, et Moloch deum filiórum Ammon: et non ambuláverit in viis meis, ut fáceret iustítiam coram me, et præcépta mea et iudícia, sicut David pater eius.'
  "34": Nec áuferam omne regnum de manu eius, sed ducem ponam eum cunctis diébus vitæ suæ, propter David servum meum, quem elégi, qui custodívit mandáta mea et præcépta mea.
  "35": 'Auferam autem regnum de manu fílii eius, et dabo tibi decem tribus:'
  "36": fílio autem eius dabo tribum unam, ut remáneat lucérna David servo meo cunctis diébus coram me in Ierúsalem civitáte, quam elégi ut esset nomen meum ibi.
  "37": Te autem assúmam, et regnábis super ómnia, quæ desíderat ánima tua, erísque rex super Israel.
  "38": 'Si ígitur audíeris ómnia, quæ præcépero tibi, et ambuláveris in viis meis, et féceris quod rectum est coram me, custódiens mandáta mea et præcépta mea, sicut fecit David servus meus: ero tecum, et ædificábo tibi domum fidélem, quómodo ædificávi David domum: et tradam tibi Israel:'
  "39": et afflígam semen David super hoc, verúmtamen non cunctis diébus.
  "40": 'Vóluit ergo Sálomon interfícere Ieróboam: qui surréxit, et aufúgit in Ægýptum ad Sesac regem Ægýpti, et fuit in Ægýpto usque ad mortem Salomónis.'
  "41": 'Réliquum autem verbórum Salomónis, et ómnia quæ fecit, et sapiéntia eius: ecce univérsa scripta sunt in Libro verbórum diérum Salomónis.'
  "42": Dies autem, quos regnávit Sálomon in Ierúsalem super omnem Israel, quadragínta anni sunt.
  "43": 'Dormivítque Sálomon cum pátribus suis, et sepúltus est in civitáte David patris sui: regnavítque Róboam fílius eius pro eo.'
