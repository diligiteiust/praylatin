bible: vulgate
lang: la
language: Latina
book: Ecclesiasticus
chapter: "30"
verses:
  "1": Qui díligit fílium suum, assíduat illi flagélla, ut lætétur in novíssimo suo, et non palpet proximórum óstia.
  "2": Qui docet fílium suum, laudábitur in illo, et in médio domesticórum in illo gloriábitur.
  "3": Qui docet fílium suum, in zelum mittit inimícum, et in médio amicórum gloriábitur in illo.
  "4": 'Mórtuus est pater eius, et quasi non est mórtuus: símilem enim relíquit sibi post se.'
  "5": 'In vita sua vidit, et lætátus est in illo: in óbitu suo non est contristátus, nec confúsus est coram inimícis.'
  "6": Relíquit enim defensórem domus contra inimícos, et amícis reddéntem grátiam.
  "7": Pro animábus filiórum colligábit vúlnera sua, et super omnem vocem turbabúntur víscera eius.
  "8": Equus indómitus evádit durus, et fílius remíssus evádet præceps.
  "9": 'Lacta fílium, et pavéntem te fáciet: lude cum eo, et contristábit te.'
  "10": Non corrídeas illi, ne dóleas, et in novíssimo obstupéscent dentes tui.
  "11": Non des illi potestátem in iuventúte, et ne despícias cogitátus illíus.
  "12": Curva cervícem eius in iuventúte, et tunde látera eius dum infans est, ne forte indúret, et non credat tibi, et erit tibi dolor ánimæ.
  "13": Doce fílium tuum, et operáre in illo, ne in turpitúdinem illíus offéndas.
  "14": Mélior est pauper sanus, et fortis víribus, quam dives imbecíllis et flagellátus malítia.
  "15": 'Salus ánimæ in sanctitáte iustítiæ mélior est omni auro et argénto: et corpus válidum quam census imménsus.'
  "16": 'Non est census super censum salútis córporis: et non est oblectaméntum super cordis gáudium.'
  "17": 'Mélior est mors quam vita amára: et réquies ætérna quam languor persevérans.'
  "18": Bona abscóndita in ore clauso, quasi appositiónes epulárum circumpósitæ sepúlcro.
  "19": 'Quid próderit libátio idólo? nec enim manducábit, nec odorábit:'
  "20": 'sic qui effugátur a Dómino, portans mercédes iniquitátis:'
  "21": videns óculis, et ingemíscens, sicut spado compléctens vírginem, et suspírans.
  "22": Tristítiam non des ánimæ tuæ, et non afflígas temetípsum in consílio tuo.
  "23": 'Iucúnditas cordis, hæc est vita hóminis, et thesáurus sine defectióne sanctitátis: et exsultátio viri est longǽvitas.'
  "24": 'Miserére ánimæ tuæ placens Deo, et cóntine: cóngrega cor tuum in sanctitáte eius, et tristítiam longe repélle a te.'
  "25": Multos enim occídit tristítia, et non est utílitas in illa.
  "26": Zelus et iracúndia mínuunt dies, et ante tempus senéctam addúcet cogitátus.
  "27": 'Spléndidum cor, et bonum in épulis est: épulæ enim illíus diligénter fiunt.'
