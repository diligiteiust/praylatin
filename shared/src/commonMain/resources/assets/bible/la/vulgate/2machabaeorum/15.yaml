bible: vulgate
lang: la
language: Latina
book: II Machabaeorum
chapter: "15"
verses:
  "1": Nicánor autem, ut cómperit Iudam esse in locis Samaríæ, cogitávit cum omni ímpetu die sábbati commíttere bellum.
  "2": 'Iudǽis vero, qui illum per necessitátem sequebántur, dicéntibus: Ne ita feróciter, et bárbare féceris, sed honórem tríbue diéi sanctificatiónis, et honóra eum, qui univérsa cónspicit:'
  "3": ille infélix interrogávit, si est potens in cælo, qui imperávit agi diem sabbatórum.
  "4": 'Et respondéntibus illis: Est Dóminus vivus ipse in cælo potens, qui iussit agi séptimam diem:'
  "5": 'at ille ait: Et ego potens sum super terram, qui ímpero sumi arma, et negótia regis impléri. Tamen non obtínuit ut consílium perfíceret.'
  "6": Et Nicánor quidem cum summa supérbia eréctus, cogitáverat commúne trophǽum statúere de Iuda.
  "7": 'Machabǽus autem semper confidébat cum omni spe auxílium sibi a Deo affutúrum:'
  "8": et hortabátur suos ne formidárent ad advéntum natiónum, sed in mente habérent adiutória sibi facta de cælo, et nunc sperárent ab Omnipoténte sibi affutúram victóriam.
  "9": 'Et allocútus eos de lege, et prophétis, ádmonens étiam certámina, quæ fécerant prius, promptióres constítuit eos:'
  "10": et ita ánimis eórum eréctis simul ostendébat géntium falláciam, et iuramentórum prævaricatiónem.
  "11": Síngulos autem illórum armávit, non clýpei, et hastæ munitióne, sed sermónibus óptimis, et exhortatiónibus, expósito digno fide sómnio, per quod univérsos lætificávit.
  "12": 'Erat autem huiuscémodi visus: Oníam, qui fúerat summus sacérdos, virum bonum et benígnum, verecúndum visu, modéstum móribus, et elóquio decórum, et qui a púero in virtútibus exercitátus sit, manus protendéntem oráre pro omni pópulo Iudæórum:'
  "13": 'post hoc apparuísse et álium virum ætáte, et glória mirábilem, et magni decóris habitúdine circa illum:'
  "14": 'respondéntem vero Oníam dixísse: Hic est fratrum amátor, et pópuli Israel: hic est, qui multum orat pro pópulo, et univérsa sancta civitáte, Ieremías prophéta Dei.'
  "15": 'Extendísse autem Ieremíam dextram, et dedísse Iudæ gládium áureum, dicéntem:'
  "16": Accipe sanctum gládium munus a Deo, in quo deícies adversários pópuli mei Israel.
  "17": 'Exhortáti ítaque Iudæ sermónibus bonis valde, de quibus extólli posset ímpetus, et ánimi iúvenum confortári, statuérunt dimicáre et conflígere fórtiter: ut virtus de negótiis iudicáret, eo quod cívitas sancta, et templum periclitaréntur.'
  "18": 'Erat enim pro uxóribus, et fíliis, itémque pro frátribus, et cognátis minor sollicitúdo: máximus vero et primus pro sanctitáte timor erat templi.'
  "19": Sed et eos qui in civitáte erant, non mínima sollicitúdo habébat pro his, qui congressúri erant.
  "20": Et cum iam omnes sperárent iudícium futúrum, hostésque adéssent, atque exércitus esset ordinátus, béstiæ equitésque opportúno in loco compósiti,
  "21": consíderans Machabǽus advéntum multitúdinis, et apparátum várium armórum, et ferocitátem bestiárum, exténdens manus in cælum, prodígia faciéntem Dóminum invocávit, qui non secúndum armórum poténtiam, sed prout ipsi placet, dat dignis victóriam.
  "22": 'Dixit autem ínvocans hoc modo: Tu Dómine, qui misísti ángelum tuum sub Ezechía rege Iuda, et interfecísti de castris Sennácherib centum octogínta quinque míllia:'
  "23": et nunc dominátor cælórum mitte ángelum tuum bonum ante nos, in timóre, et tremóre magnitúdinis bráchii tui,
  "24": ut métuant qui cum blasphémia véniunt advérsus sanctum pópulum tuum. Et hic quidem ita perorávit.
  "25": Nicánor autem, et qui cum ipso erant, cum tubis et cánticis admovébant.
  "26": 'Iudas vero, et qui cum eo erant, invocáto Deo, per oratiónes congréssi sunt:'
  "27": manu quidem pugnántes, sed Dóminum córdibus orántes, prostravérunt non minus trigínta quinque míllia, præséntia Dei magnífice delectáti.
  "28": Cumque cessássent, et cum gáudio redírent, cognovérunt Nicánorem ruísse cum armis suis.
  "29": Facto ítaque clamóre, et perturbatióne excitáta, pátria voce omnipoténtem Dóminum benedicébant.
  "30": Præcépit autem Iudas, qui per ómnia córpore et ánimo mori pro cívibus parátus erat, caput Nicánoris, et manum cum húmero abscíssam, Ierosólymam perférri.
  "31": Quo cum pervenísset, convocátis contribúlibus, et sacerdótibus ad altáre, accersíit et eos, qui in arce erant.
  "32": Et osténso cápite Nicánoris, et manu nefária, quam exténdens contra domum sanctam omnipoténtis Dei, magnífice gloriátus est.
  "33": 'Linguam étiam ímpii Nicánoris præcísam iussit particulátim ávibus dari: manum autem deméntis contra templum suspéndi.'
  "34": 'Omnes ígitur cæli benedixérunt Dóminum, dicéntes: Benedíctus, qui locum suum incontaminátum servávit.'
  "35": Suspéndit autem Nicánoris caput in summa arce, ut évidens esset, et maniféstum signum auxílii Dei.
  "36": 'Itaque omnes commúni consílio decrevérunt nullo modo diem istum absque celebritáte præteríre:'
  "37": habére autem celebritátem tertiadécima die mensis Adar, quod dícitur voce Syríaca, prídie Mardochǽi diéi.
  "38": Igitur his erga Nicánorem gestis, et ex illis tempóribus ab Hebrǽis civitáte posséssa, ego quoque in his fáciam finem sermónis.
  "39": 'Et si quidem bene, et ut históriæ cómpetit, hoc et ipse velim: sin autem minus digne, concedéndum est mihi.'
  "40": 'Sicut enim vinum semper bíbere, aut semper aquam, contrárium est: altérnis autem uti, delectábile: ita legéntibus si semper exáctus sit sermo, non erit gratus. Hic ergo erit consummátus.'
