bible: vulgate
lang: la
language: Latina
book: Ecclesiasticus
chapter: "16"
verses:
  "1": 'Ne iucundéris in fíliis ímpiis, si multiplicéntur: nec oblectéris super ipsos, si non est timor Dei in illis.'
  "2": Non credas vitæ illórum, et ne respéxeris in labóres eórum.
  "3": Mélior est enim unus timens Deum, quam mille fílii ímpii.
  "4": Et útile est mori sine fíliis, quam relínquere fílios ímpios.
  "5": Ab uno sensáto inhabitábitur pátria, tribus impiórum deserétur.
  "6": Multa tália vidit óculus meus, et fortióra horum audívit auris mea.
  "7": In synagóga peccántium exardébit ignis, et in gente incredíbili exardéscet ira.
  "8": 'Non exoravérunt pro peccátis suis antíqui gigántes, qui destrúcti sunt confidéntes suæ virtúti:'
  "9": et non pepércit peregrinatióni Lot, et exsecrátus est eos præ supérbia verbi illórum.
  "10": Non misértus est illis, gentem totam perdens, et extolléntem se in peccátis suis.
  "11": 'Et sicut sexcénta míllia péditum, qui congregáti sunt in durítia cordis sui: et si unus fuísset cervicátus, mirum si fuísset immúnis.'
  "12": Misericórdia enim et ira est cum illo. Potens exorátio, et effúndens iram.
  "13": Secúndum misericórdiam suam, sic corréptio illíus hóminem secúndum ópera sua iúdicat.
  "14": Non effúgiet in rapína peccátor, et non retardábit sufferéntia misericórdiam faciéntis.
  "15": Omnis misericórdia fáciet locum unicuíque, secúndum méritum óperum suórum, et secúndum intelléctum peregrinatiónis ipsíus.
  "16": 'Non dicas: A Deo abscóndar, et ex summo quis mei memorábitur?'
  "17": 'In pópulo magno non agnóscar: quæ est enim ánima mea in tam imménsa creatúra?'
  "18": Ecce cælum, et cæli cælórum, abýssus, et univérsa terra, et quæ in eis sunt, in conspéctu illíus commovebúntur.
  "19": Montes simul, et colles, et fundaménta terræ, cum conspéxerit illa Deus, tremóre concutiéntur.
  "20": 'Et in ómnibus his insensátum est cor, et omne cor intellígitur ab illo:'
  "21": et vias illíus quis intélligit, et procéllam, quam nec óculus vidébit hóminis?
  "22": 'Nam plúrima illíus ópera sunt in abscónsis: sed ópera iustítiæ eius quis enuntiábit, aut quis sustinébit? Longe enim est testaméntum a quibúsdam, et interrogátio ómnium in consummatióne est.'
  "23": Qui minorátur corde cógitat inánia, et vir imprúdens et errans cógitat stulta.
  "24": Audi me fili, et disce disciplínam sensus, et in verbis meis atténde in corde tuo,
  "25": 'et dicam in æquitáte disciplínam, et scrutábor enarráre sapiéntiam: et in verbis meis atténde in corde tuo, et dico in æquitáte spíritus virtútes, quas pósuit Deus in ópera sua ab inítio, et in veritáte enúntio sciéntiam eius.'
  "26": In iudício Dei ópera eius ab inítio, et ab institutióne ipsórum distínxit partes illórum, et inítia eórum in géntibus suis.
  "27": 'Ornávit in ætérnum ópera illórum: nec esuriérunt, nec laboravérunt, et non destitérunt ab opéribus suis.'
  "28": Unusquísque próximum sibi non angustiábit in ætérnum.
  "29": Non sis incredíbilis verbo illíus.
  "30": Post hæc Deus in terram respéxit, et implévit illam bonis suis.
  "31": Anima omnis vitális denuntiávit ante fáciem ipsíus, et in ipsam íterum revérsio illórum.
