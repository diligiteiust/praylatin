bible: vulgate
lang: la
language: Latina
book: Proverbia
chapter: "6"
verses:
  "1": Fili mi, si spopónderis pro amíco tuo, defixísti apud extráneum manum tuam,
  "2": illaqueátus es verbis oris tui, et captus própriis sermónibus.
  "3": 'Fac ergo quod dico fili mi, et temetípsum líbera: quia incidísti in manum próximi tui. Discúrre, festína, súscita amícum tuum:'
  "4": ne déderis somnum óculis tuis, nec dormítent pálpebræ tuæ.
  "5": Erúere quasi dámula de manu, et quasi avis de manu áucupis.
  "6": 'Vade ad formícam o piger, et consídera vias eius, et disce sapiéntiam:'
  "7": quæ cum non hábeat ducem, nec præceptórem, nec príncipem,
  "8": parat in æstáte cibum sibi, et cóngregat in messe quod cómedat.
  "9": Usquequo piger dórmies? quando consúrges e somno tuo?
  "10": 'Páululum dórmies, páululum dormitábis, páululum cónseres manus, ut dórmias:'
  "11": et véniet tibi quasi viátor egéstas, et paupéries quasi vir armátus. Si vero ímpiger fúeris, véniet ut fons messis tua, et egéstas longe fúgiet a te.
  "12": Homo apóstata, vir inútilis, gráditur ore pervérso,
  "13": ánnuit óculis, terit pede, dígito lóquitur,
  "14": 'pravo corde machinátur malum, et omni témpore iúrgia séminat:'
  "15": huic extémplo véniet perdítio sua, et súbito conterétur, nec habébit ultra medicínam.
  "16": 'Sex sunt, quæ odit Dóminus, et séptimum detestátur ánima eius:'
  "17": óculos sublímes, linguam mendácem, manus effundéntes innóxium sánguinem,
  "18": cor máchinans cogitatiónes péssimas, pedes velóces ad curréndum in malum,
  "19": proferéntem mendácia testem fallácem, et eum qui séminat inter fratres discórdias.
  "20": Consérva fili mi præcépta patris tui, et ne dimíttas legem matris tuæ.
  "21": Liga ea in corde tuo iúgiter, et circúmda gútturi tuo.
  "22": 'Cum ambuláveris, gradiántur tecum: cum dormíeris, custódiant te: et evígilans lóquere cum eis.'
  "23": 'Quia mandátum lucérna est, et lex lux, et via vitæ increpátio disciplínæ:'
  "24": ut custódiant te a mulíere mala, et a blanda lingua extráneæ.
  "25": 'Non concupíscat pulchritúdinem eius cor tuum, nec capiáris nútibus illíus:'
  "26": 'prétium enim scorti vix est uníus panis: múlier autem viri pretiósam ánimam capit.'
  "27": Numquid potest homo abscóndere ignem in sinu suo, ut vestiménta illíus non árdeant?
  "28": aut ambuláre super prunas, ut non comburántur plantæ eius?
  "29": Sic qui ingréditur ad mulíerem próximi sui, non erit mundus cum tetígerit eam.
  "30": 'Non grandis est culpa cum quis furátus fúerit: furátur enim ut esuriéntem ímpleat ánimam:'
  "31": deprehénsus quoque reddet séptuplum, et omnem substántiam domus suæ tradet.
  "32": 'Qui autem adúlter est, propter cordis inópiam perdet ánimam suam:'
  "33": turpitúdinem et ignomíniam cóngregat sibi, et oppróbrium illíus non delébitur.
  "34": Quia zelus et furor viri non parcet in die vindíctæ,
  "35": nec acquiéscet cuiúsquam précibus, nec suscípiet pro redemptióne dona plúrima.
