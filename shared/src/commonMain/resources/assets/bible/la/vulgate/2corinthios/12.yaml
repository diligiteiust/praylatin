bible: vulgate
lang: la
language: Latina
book: ad Corinthios II
chapter: "12"
verses:
  "1": 'Si gloriári opórtet (non éxpedit quidem): véniam autem ad visiónes, et revelatiónes Dómini.'
  "2": Scio hóminem in Christo ante annos quatuórdecim, sive in córpore néscio, sive extra corpus néscio, Deus scit, raptum huiúsmodi usque ad tértium cælum.
  "3": 'Et scio huiúsmodi hóminem sive in córpore, sive extra corpus néscio, Deus scit:'
  "4": 'quóniam raptus est in paradísum: et audívit arcána verba, quæ non licet hómini loqui.'
  "5": 'Pro huiúsmodi gloriábor: pro me autem nihil gloriábor nisi in infirmitátibus meis.'
  "6": 'Nam, et si volúero gloriári, non ero insípiens: veritátem enim dicam: parco autem, ne quis me exístimet supra id, quod videt in me, aut áliquid audit ex me.'
  "7": Et ne magnitúdo revelatiónum extóllat me, datus est mihi stímulus carnis meæ ángelus Sátanæ, qui me colaphízet.
  "8": 'Propter quod ter Dóminum rogávi ut discéderet a me:'
  "9": 'et dixit mihi: Súfficit tibi grátia mea: nam virtus in infirmitáte perfícitur. Libénter ígitur gloriábor in infirmitátibus meis, ut inhábitet in me virtus Christi.'
  "10": 'Propter quod pláceo mihi in infirmitátibus meis, in contuméliis, in necessitátibus, in persecutiónibus, in angústiis pro Christo: cum enim infírmor, tunc potens sum.'
  "11": 'Factus sum insípiens, vos me coegístis. Ego enim a vobis débui commendári: nihil enim minus fui ab iis, qui sunt supra modum Apóstoli: tamétsi nihil sum:'
  "12": signa tamen apostolátus mei facta sunt super vos in omni patiéntia, in signis, et prodígiis, et virtútibus.
  "13": Quid est enim, quod minus habuístis præ céteris ecclésiis, nisi quod ego ipse non gravávi vos? donáte mihi hanc iniúriam.
  "14": 'Ecce tértio hoc parátus sum veníre ad vos: et non ero gravis vobis. Non enim quæro quæ vestra sunt, sed vos. Nec enim debent fílii paréntibus thesaurizáre, sed paréntes fíliis.'
  "15": 'Ego autem libentíssime impéndam, et superimpéndar ipse pro animábus vestris: licet plus vos díligens, minus díligar.'
  "16": 'Sed esto: ego vos non gravávi: sed cum essem astútus, dolo vos cepi.'
  "17": Numquid per áliquem eórum, quos misi ad vos, circumvéni vos?
  "18": Rogávi Titum, et misi cum illo fratrem. Numquid Titus vos circumvénit? nonne eódem spíritu ambulávimus? nonne iísdem vestígiis?
  "19": 'Olim putátis quod excusémus nos apud vos? Coram Deo in Christo lóquimur: ómnia autem caríssimi propter ædificatiónem vestram.'
  "20": 'Tímeo enim ne forte cum vénero, non quales volo, invéniam vos: et ego invéniar a vobis, qualem non vultis: ne forte contentiónes, æmulatiónes, animositátes, dissensiónes, detractiónes, susurratiónes, inflatiónes, seditiónes sint inter vos:'
  "21": ne íterum cum vénero, humíliet me Deus apud vos, et lúgeam multos ex iis, qui ante peccavérunt, et non egérunt pœniténtiam super immundítia, et fornicatióne, et impudicítia, quam gessérunt.
