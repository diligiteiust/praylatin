bible: vulgate
lang: la
language: Latina
book: Actus Apostolorum
chapter: "2"
verses:
  "1": 'Et cum compleréntur dies Pentecóstes, erant omnes páriter in eódem loco:'
  "2": et factus est repénte de cælo sonus, tamquam adveniéntis spíritus veheméntis, et replévit totam domum ubi erant sedéntes.
  "3": 'Et apparuérunt illis dispertítæ linguæ tamquam ignis, sedítque supra síngulos eórum:'
  "4": et repléti sunt omnes Spíritu sancto, et cœpérunt loqui váriis linguis, prout Spíritus sanctus dabat éloqui illis.
  "5": Erant autem in Ierúsalem habitántes Iudǽi, viri religiósi ex omni natióne, quæ sub cælo est.
  "6": Facta autem hac voce, convénit multitúdo, et mente confúsa est, quóniam audiébat unusquísque lingua sua illos loquéntes.
  "7": 'Stupébant autem omnes, et mirabántur, dicéntes: Nonne ecce omnes isti, qui loquúntur, Galilǽi sunt,'
  "8": et quómodo nos audívimus unusquísque linguam nostram, in qua nati sumus?
  "9": Parthi, et Medi, et Ælamítæ, et qui hábitant Mesopotámiam, Iudǽam, et Cappadóciam, Pontum, et Asiam,
  "10": 'Phrýgiam, et Pamphýliam, Ægýptum, et partes Líbyæ, quæ est circa Cyrénen: et ádvenæ Románi,'
  "11": 'Iudǽi quoque, et Prosélyti, Cretes, et Arabes: audívimus eos loquéntes nostris linguis magnália Dei.'
  "12": 'Stupébant autem omnes, et mirabántur ad ínvicem, dicéntes: Quidnam vult hoc esse?'
  "13": 'Alii autem irridéntes dicébant: Quia musto pleni sunt isti.'
  "14": 'Stans autem Petrus cum úndecim, levávit vocem suam, et locútus est eis: Viri Iudǽi, et qui habitátis Ierúsalem univérsi, hoc vobis notum sit, et áuribus percípite verba mea.'
  "15": 'Non enim, sicut vos æstimátis, hi ébrii sunt, cum sit hora diéi tértia:'
  "16": 'sed hoc est, quod dictum est per prophétam Ioel:'
  "17": 'Et erit in novíssimis diébus, dicit Dóminus, effúndam de Spíritu meo super omnem carnem: et prophetábunt fílii vestri, et fíliæ vestræ, et iúvenes vestri visiónes vidébunt, et senióres vestri sómnia somniábunt.'
  "18": 'Et quidem super servos meos, et super ancíllas meas, in diébus illis effúndam de Spíritu meo, et prophetábunt:'
  "19": 'et dabo prodígia in cælo sursum, et signa in terra deórsum, sánguinem, et ignem, et vapórem fumi:'
  "20": sol convertétur in ténebras, et luna in sánguinem, ántequam véniat dies Dómini magnus et maniféstus.
  "21": 'Et erit: omnis, quicúmque invocáverit nomen Dómini, salvus erit.'
  "22": 'Viri Israelítæ, audíte verba hæc: Iesum Nazarénum, virum approbátum a Deo in vobis, virtútibus, et prodígiis, et signis, quæ fecit Deus per illum in médio vestri, sicut et vos scitis:'
  "23": 'hunc, definíto consílio et præsciéntia Dei tráditum, per manus iniquórum affligéntes interemístis:'
  "24": quem Deus suscitávit, solútis dolóribus inférni, iuxta quod impossíbile erat tenéri illum ab eo.
  "25": 'David enim dicit in eum: Providébam Dóminum in conspéctu meo semper: quóniam a dextris est mihi, ne commóvear:'
  "26": 'propter hoc lætátum est cor meum, et exsultávit lingua mea, ínsuper et caro mea requiéscet in spe:'
  "27": quóniam non derelínques ánimam meam in inférno, nec dabis sanctum tuum vidére corruptiónem.
  "28": 'Notas mihi fecísti vias vitæ: et replébis me iucunditáte cum fácie tua.'
  "29": 'Viri fratres, líceat audénter dícere ad vos de patriárcha David, quóniam defúnctus est, et sepúltus: et sepúlcrum eius est apud nos usque in hodiérnum diem.'
  "30": 'Prophéta ígitur cum esset, et sciret quia iureiurándo iurásset illi Deus de fructu lumbi eius sedére super sedem eius:'
  "31": próvidens locútus est de resurrectióne Christi, quia neque derelíctus est in inférno, neque caro eius vidit corruptiónem.
  "32": Hunc Iesum resuscitávit Deus, cuius omnes nos testes sumus.
  "33": Déxtera ígitur Dei exaltátus, et promissióne Spíritus sancti accépta a Patre, effúdit hunc, quem vos vidétis, et audítis.
  "34": 'Non enim David ascéndit in cælum: dixit autem ipse: Dixit Dóminus Dómino meo: Sede a dextris meis,'
  "35": donec ponam inimícos tuos scabéllum pedum tuórum.
  "36": Certíssime sciat ergo omnis domus Israel, quia et Dóminum eum, et Christum fecit Deus hunc Iesum, quem vos crucifixístis.
  "37": 'His autem audítis, compúncti sunt corde, et dixérunt ad Petrum, et ad réliquos Apóstolos: Quid faciémus, viri fratres?'
  "38": 'Petrus vero ad illos: Pœniténtiam, inquit, ágite, et baptizétur unusquísque vestrum in nómine Iesu Christi in remissiónem peccatórum vestrórum: et accipiétis donum Spíritus sancti.'
  "39": Vobis enim est repromíssio, et fíliis vestris, et ómnibus, qui longe sunt, quoscúmque advocáverit Dóminus Deus noster.
  "40": 'Aliis étiam verbis plúrimis testificátus est, et exhortabátur eos, dicens: Salvámini a generatióne ista prava.'
  "41": 'Qui ergo recepérunt sermónem eius, baptizáti sunt: et appósitæ sunt in die illa ánimæ círciter tria míllia.'
  "42": Erant autem perseverántes in doctrína Apostolórum, et communicatióne fractiónis panis, et oratiónibus.
  "43": 'Fiébat autem omni ánimæ timor: multa quoque prodígia, et signa per Apóstolos in Ierúsalem fiébant, et metus erat magnus in univérsis.'
  "44": Omnes étiam, qui credébant, erant páriter, et habébant ómnia commúnia.
  "45": Possessiónes, et substántias vendébant, et dividébant illa ómnibus, prout cuíque opus erat.
  "46": Quotídie quoque perdurántes unanímiter in templo, et frangéntes circa domos panem, sumébant cibum cum exsultatióne, et simplicitáte cordis,
  "47": collaudántes Deum, et habéntes grátiam ad omnem plebem. Dóminus autem augébat qui salvi fíerent quotídie in idípsum.
