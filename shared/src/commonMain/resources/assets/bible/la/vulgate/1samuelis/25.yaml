bible: vulgate
lang: la
language: Latina
book: I Samuelis
chapter: "25"
verses:
  "1": Mórtuus est autem Sámuel, et congregátus est univérsus Israel, et planxérunt eum, et sepeliérunt eum in domo sua in Rámatha. Consurgénsque David descéndit in desértum Pharan.
  "2": 'Erat autem vir quíspiam in solitúdine Maon, et posséssio eius in Carmélo, et homo ille magnus nimis: erántque ei oves tria míllia, et mille capræ: et áccidit ut tonderétur grex eius in Carmélo.'
  "3": 'Nomen autem viri illíus erat Nabal. Et nomen uxóris eius Abígail: erátque múlier illa prudentíssima, et speciósa: porro vir eius durus, et péssimus, et malitiósus: erat autem de génere Caleb.'
  "4": Cum ergo audísset David in desérto quod tondéret Nabal gregem suum,
  "5": 'misit decem iúvenes, et dixit eis: Ascéndite in Carmélum, et veniétis ad Nabal, et salutábitis eum ex nómine meo pacífice.'
  "6": 'Et dicétis: Sit frátribus meis et tibi pax, et dómui tuæ pax, et ómnibus, quæcúmque habes, sit pax.'
  "7": 'Audívi quod tondérent pastóres tui, qui erant nobíscum in desérto: numquam eis molésti fúimus, nec aliquándo défuit quidquam eis de grege, omni témpore quo fuérunt nobíscum in Carmélo.'
  "8": 'Intérroga púeros tuos, et indicábunt tibi. Nunc ergo invéniant púeri tui grátiam in óculis tuis: in die enim bona vénimus: quodcúmque invénerit manus tua, da servis tuis, et fílio tuo David.'
  "9": 'Cumque veníssent púeri David, locúti sunt ad Nabal ómnia verba hæc ex nómine David: et siluérunt.'
  "10": 'Respóndens autem Nabal púeris David, ait: Quis est David? et quis est fílius Isai? hódie increvérunt servi qui fúgiunt dóminos suos.'
  "11": Tollam ergo panes meos, et aquas meas, et carnes pécorum, quæ occídi tonsóribus meis, et dabo viris quos néscio unde sint?
  "12": Regréssi sunt ítaque púeri David per viam suam, et revérsi venérunt, et nuntiavérunt ei ómnia verba quæ díxerat.
  "13": 'Tunc ait David púeris suis: Accingátur unusquísque gládio suo. Et accíncti sunt sínguli gládiis suis, accinctúsque est et David ense suo: et secúti sunt David quasi quadringénti viri: porro ducénti remansérunt ad sárcinas.'
  "14": 'Abígail autem uxóri Nabal nuntiávit unus de púeris suis, dicens: Ecce David misit núntios de desérto, ut benedícerent dómino nostro: et aversátus est eos.'
  "15": 'Hómines isti boni satis fuérunt nobis, et non molésti: nec quidquam aliquándo périit omni témpore, quo fúimus conversáti cum eis in desérto:'
  "16": pro muro erant nobis tam in nocte quam in die, ómnibus diébus quibus pávimus apud eos greges.
  "17": 'Quam ob rem consídera, et recógita quid fácias: quóniam compléta est malítia advérsum virum tuum, et advérsum domum tuam, et ipse est fílius Bélial, ita ut nemo possit ei loqui.'
  "18": 'Festinávit ígitur Abígail, et tulit ducéntos panes, et duos utres vini, et quinque aríetes coctos, et quinque sata poléntæ, et centum ligatúras uvæ passæ, et ducéntas massas caricárum, et pósuit super ásinos:'
  "19": 'dixítque púeris suis: Præcédite me: ecce, ego post tergum sequar vos: viro autem suo Nabal non indicávit.'
  "20": 'Cum ergo ascendísset ásinum, et descénderet ad radíces montis, David et viri eius descendébant in occúrsum eius: quibus et illa occúrrit.'
  "21": 'Et ait David: Vere frustra servávi ómnia quæ huius erant in desérto, et non périit quidquam de cunctis quæ ad eum pertinébant: et réddidit mihi malum pro bono.'
  "22": Hæc fáciat Deus inimícis David, et hæc addat, si relíquero de ómnibus quæ ad ipsum pértinent usque mane, mingéntem ad paríetem.
  "23": Cum autem vidísset Abígail David, festinávit, et descéndit de ásino, et prócidit coram David super fáciem suam, et adorávit super terram,
  "24": 'et cécidit ad pedes eius, et dixit: In me sit, dómine mi, hæc iníquitas: loquátur, óbsecro, ancílla tua in áuribus tuis, et audi verba fámulæ tuæ.'
  "25": 'Ne ponat, oro, dóminus meus rex cor suum super virum istum iníquum Nabal: quóniam secúndum nomen suum stultus est, et stultítia est cum eo: ego autem ancílla tua non vidi púeros tuos, dómine mi, quos misísti.'
  "26": 'Nunc ergo dómine mi, vivit Dóminus, et vivit ánima tua, qui prohíbuit te ne veníres in sánguinem, et salvávit manum tuam tibi: et nunc fiant sicut Nabal inimíci tui, et qui quærunt dómino meo malum.'
  "27": 'Quaprópter súscipe benedictiónem hanc, quam áttulit ancílla tua tibi dómino meo: et da púeris qui sequúntur te dóminum meum.'
  "28": 'Aufer iniquitátem fámulæ tuæ: fáciens enim fáciet Dóminus tibi dómino meo domum fidélem, quia prœ́lia Dómini, dómine mi, tu prœliáris: malítia ergo non inveniátur in te ómnibus diébus vitæ tuæ.'
  "29": 'Si enim surréxerit aliquándo homo pérsequens te, et quærens ánimam tuam, erit ánima dómini mei custodíta quasi in fascículo vivéntium, apud Dóminum Deum tuum: porro inimicórum tuórum ánima rotábitur, quasi in ímpetu et círculo fundæ.'
  "30": Cum ergo fécerit Dóminus tibi dómino meo ómnia quæ locútus est bona de te, et constitúerit te ducem super Israel,
  "31": 'non erit tibi hoc in singúltum, et in scrúpulum cordis dómino meo, quod effúderis sánguinem innóxium, aut ipse te ultus fúeris: et cum benefécerit Dóminus dómino meo, recordáberis ancíllæ tuæ.'
  "32": 'Et ait David ad Abígail: Benedíctus Dóminus Deus Israel, qui misit hódie te in occúrsum meum, et benedíctum elóquium tuum,'
  "33": et benedícta tu, quæ prohibuísti me hódie ne irem ad sánguinem, et ulcíscerer me manu mea.
  "34": 'Alióquin vivit Dóminus Deus Israel, qui prohíbuit me ne malum fácerem tibi: nisi cito venísses in occúrsum mihi, non remansísset Nabal usque ad lucem matutínam, mingens ad paríetem.'
  "35": 'Suscépit ergo David de manu eius ómnia quæ attúlerat ei, dixítque ei: Vade pacífice in domum tuam: ecce audívi vocem tuam, et honorávi fáciem tuam.'
  "36": 'Venit autem Abígail ad Nabal: et ecce erat ei convívium in domo eius quasi convívium regis, et cor Nabal iucúndum: erat enim ébrius nimis: et non indicávit ei verbum pusíllum aut grande usque mane.'
  "37": 'Dilúculo autem cum digessísset vinum Nabal, indicávit ei uxor sua verba hæc: et emórtuum est cor eius intrínsecus, et factus est quasi lapis.'
  "38": Cumque pertransíssent decem dies, percússit Dóminus Nabal, et mórtuus est.
  "39": 'Quod cum audísset David mórtuum Nabal, ait: Benedíctus Dóminus, qui iudicávit causam oppróbrii mei de manu Nabal, et servum suum custodívit a malo, et malítiam Nabal réddidit Dóminus in caput eius. Misit ergo David, et locútus est ad Abígail, ut súmeret eam sibi in uxórem.'
  "40": 'Et venérunt púeri David ad Abígail in Carmélum, et locúti sunt ad eam, dicéntes: David misit nos ad te, ut accípiat te sibi in uxórem.'
  "41": 'Quæ consúrgens, adorávit prona in terram, et ait: Ecce fámula tua sit in ancíllam, ut lavet pedes servórum dómini mei.'
  "42": 'Et festinávit, et surréxit Abígail, et ascéndit super ásinum, et quinque puéllæ iérunt cum ea, pedíssequæ eius, et secúta est núntios David: et facta est illi uxor.'
  "43": 'Sed et Achínoam accépit David de Iézrael: et fuit útraque uxor eius.'
  "44": Saul autem dedit Michol fíliam suam uxórem David, Phalti fílio Lais, qui erat de Gallim.
