bible: vulgate
lang: la
language: Latina
book: Deuteronomium
chapter: "9"
verses:
  "1": 'Audi Israel: tu transgrediéris hódie Iordánem, ut possídeas natiónes máximas et fortióres te, civitátes ingéntes, et ad cælum usque murátas,'
  "2": pópulum magnum atque sublímem, fílios Enacim, quos ipse vidísti et audísti, quibus nullus potest ex advérso resístere.
  "3": Scies ergo hódie quod Dóminus Deus tuus ipse transíbit ante te, ignis dévorans atque consúmens, qui cónterat eos, et déleat atque dispérdat ante fáciem tuam velóciter, sicut locútus est tibi.
  "4": 'Ne dicas in corde tuo, cum deléverit eos Dóminus Deus tuus in conspéctu tuo: Propter iustítiam meam introdúxit me Dóminus ut terram hanc possidérem, cum propter impietátes suas istæ delétæ sint natiónes.'
  "5": 'Neque enim propter iustítias tuas, et æquitátem cordis tui ingrediéris, ut possídeas terras eárum: sed quia illæ egérunt ímpie, introeúnte te delétæ sunt: et ut compléret verbum suum Dóminus, quod sub iuraménto pollícitus est pátribus tuis, Abraham, Isaac, et Iacob.'
  "6": Scito ergo quod non propter iustítias tuas Dóminus Deus tuus déderit tibi terram hanc óptimam in possessiónem, cum duríssimæ cervícis sis pópulus.
  "7": Meménto, et ne obliviscáris, quómodo ad iracúndiam provocáveris Dóminum Deum tuum in solitúdine. Ex eo die, quo egréssus es ex Ægýpto usque ad locum istum, semper advérsum Dóminum contendísti.
  "8": Nam et in Horeb provocásti eum, et irátus delére te vóluit,
  "9": 'quando ascéndi in montem, ut accíperem tábulas lapídeas, tábulas pacti quod pépigit vobíscum Dóminus: et perseverávi in monte quadragínta diébus ac nóctibus, panem non cómedens, et aquam non bibens.'
  "10": Dedítque mihi Dóminus duas tábulas lapídeas scriptas dígito Dei, et continéntes ómnia verba quæ vobis locútus est in monte de médio ignis, quando cóncio pópuli congregáta est.
  "11": Cumque transíssent quadragínta dies, et tótidem noctes, dedit mihi Dóminus duas tábulas lapídeas, tábulas fœ́deris,
  "12": 'dixítque mihi: Surge, et descénde hinc cito: quia pópulus tuus, quem eduxísti de Ægýpto, deseruérunt velóciter viam, quam demonstrásti eis, fecerúntque sibi conflátile.'
  "13": 'Rursúmque ait Dóminus ad me: Cerno quod pópulus iste duræ cervícis sit:'
  "14": dimítte me ut cónteram eum, et déleam nomen eius de sub cælo, et constítuam te super gentem, quæ hac maior et fórtior sit.
  "15": Cumque de monte ardénte descénderem, et duas tábulas fœ́deris utráque tenérem manu,
  "16": 'vidissémque vos peccásse Dómino Deo vestro, et fecísse vobis vítulum conflátilem, ac deseruísse velóciter viam eius, quam vobis osténderat:'
  "17": proiéci tábulas de mánibus meis, confregíque eas in conspéctu vestro.
  "18": 'Et prócidi ante Dóminum sicut prius, quadragínta diébus et nóctibus panem non cómedens, et aquam non bibens, propter ómnia peccáta vestra quæ gessístis contra Dóminum, et eum ad iracúndiam provocástis:'
  "19": tímui enim indignatiónem et iram illíus, qua advérsum vos concitátus, delére vos vóluit. Et exaudívit me Dóminus étiam hac vice.
  "20": Advérsum Aaron quoque veheménter irátus, vóluit eum contérere, et pro illo simíliter deprecátus sum.
  "21": Peccátum autem vestrum quod fecerátis, id est, vítulum, arrípiens, igne combússi, et in frusta commínuens, omninóque in púlverem rédigens, proiéci in torréntem, qui de monte descéndit.
  "22": 'In incéndio quoque, et in tentatióne, et in Sepúlcris concupiscéntiæ provocástis Dóminum:'
  "23": 'et quando misit vos de Cadesbárne, dicens: Ascéndite, et possidéte terram, quam dedi vobis, et contempsístis impérium Dómini Dei vestri, et non credidístis ei, neque vocem eius audíre voluístis:'
  "24": sed semper fuístis rebélles a die qua nosse vos cœpi.
  "25": 'Et iácui coram Dómino quadragínta diébus ac nóctibus, quibus eum supplíciter deprecábar, ne deléret vos ut fúerat comminátus:'
  "26": 'et orans dixi: Dómine Deus, ne dispérdas pópulum tuum, et hereditátem tuam, quam redemísti in magnitúdine tua, quos eduxísti de Ægýpto in manu forti.'
  "27": 'Recordáre servórum tuórum Abraham, Isaac, et Iacob: ne aspícias durítiam pópuli huius, et impietátem atque peccátum:'
  "28": 'ne forte dicant habitatóres terræ, de qua eduxísti nos: Non póterat Dóminus introdúcere eos in terram, quam pollícitus est eis, et óderat illos: idcírco edúxit, ut interfíceret eos in solitúdine.'
  "29": Qui sunt pópulus tuus et heréditas tua, quos eduxísti in fortitúdine tua magna, et in bráchio tuo exténto.
