bible: vulgate
lang: la
language: Latina
book: II Machabaeorum
chapter: "7"
verses:
  "1": Cóntigit autem et septem fratres una cum matre sua apprehénsos compélli a rege édere contra fas carnes porcínas, flagris, et táureis cruciátos.
  "2": 'Unus autem ex illis, qui erat primus, sic ait: Quid quæris, et quid vis díscere a nobis? paráti sumus mori, magis quam pátrias Dei leges prævaricári.'
  "3": 'Irátus ítaque rex, iussit sartágines, et ollas ǽneas succéndi: quibus statim succénsis,'
  "4": 'iussit, ei, qui prior fúerat locútus, amputári linguam: et cute cápitis abstrácta, summas quoque manus et pedes ei præscíndi, céteris eius frátribus, et matre inspiciéntibus.'
  "5": 'Et cum iam per ómnia inútilis factus esset, iussit ignem admovéri, et adhuc spirántem torréri in sartágine: in qua cum diu cruciarétur, céteri una cum matre ínvicem se hortabántur mori fórtiter,'
  "6": 'dicéntes: Dóminus Deus aspíciet veritátem, et consolábitur in nobis, quemádmodum in protestatióne cántici declarávit Móyses: Et in servis suis consolábitur.'
  "7": 'Mórtuo ítaque illo primo hoc modo, sequéntem deducébant ad illudéndum: et cute cápitis eius cum capíllis abstrácta, interrogábant si manducáret, priúsquam toto córpore per membra síngula punirétur.'
  "8": 'At ille respóndens pátria voce, dixit: Non fáciam. Propter quod et iste, sequénti loco, primi torménta suscépit:'
  "9": 'et in último spíritu constitútus, sic ait: Tu quidem scelestíssime in præsénti vita nos perdis: sed Rex mundi defúnctos nos pro suis légibus in ætérnæ vitæ resurrectióne suscitábit.'
  "10": 'Post hunc tértius illúditur, et linguam postulátus cito prótulit, et manus constánter exténdit:'
  "11": 'et cum fidúcia ait: E cælo ista possídeo, sed propter Dei leges nunc hæc ipsa despício, quóniam ab ipso me ea receptúrum spero:'
  "12": ita ut rex, et qui cum ipso erant, miraréntur adolescéntis ánimum, quod tamquam níhilum dúceret cruciátus.
  "13": Et hoc ita defúncto, quartum vexábant simíliter torquéntes.
  "14": 'Et cum iam esset ad mortem, sic ait: Pótius est ab homínibus morti datos spem exspectáre a Deo, íterum ab ipso resuscitándos: tibi enim resurréctio ad vitam non erit.'
  "15": Et cum admovíssent quintum, vexábant eum. At ille respíciens in eum,
  "16": 'dixit: Potestátem inter hómines habens, cum sis corruptíbilis, facis quod vis: noli autem putáre genus nostrum a Deo esse derelíctum:'
  "17": tu autem patiénter sústine, et vidébis magnam potestátem ipsíus, quáliter te, et semen tuum torquébit.
  "18": 'Post hunc ducébant sextum, et is, mori incípiens, sic ait: Noli frustra erráre: nos enim propter nosmetípsos hæc pátimur, peccántes in Deum nostrum, et digna admiratióne facta sunt in nobis:'
  "19": tu autem ne exístimes tibi impúne futúrum, quod contra Deum pugnáre tentáveris.
  "20": 'Supra modum autem mater mirábilis, et bonórum memória digna, quæ pereúntes septem fílios sub uníus diéi témpore conspíciens, bono ánimo ferébat propter spem, quam in Deum habébat:'
  "21": 'síngulos illórum hortabátur voce pátria fórtiter, repléta sapiéntia: et, femíneæ cogitatióni masculínum ánimum ínserens,'
  "22": 'dixit ad eos: Néscio quáliter in útero meo apparuístis, neque enim ego spíritum et ánimam donávi vobis et vitam, et singulórum membra non ego ipsa compégi:'
  "23": sed enim mundi Creátor, qui formávit hóminis nativitátem, quique ómnium invénit oríginem, et spíritum vobis íterum cum misericórdia reddet et vitam, sicut nunc vosmetípsos despícitis propter leges eius.
  "24": Antíochus autem, contémni se arbitrátus, simul et exprobrántis voce despécta, cum adhuc adolescéntior superésset, non solum verbis hortabátur, sed et cum iuraménto affirmábat se dívitem et beátum factúrum, et translátum a pátriis légibus amícum habitúrum, et res necessárias ei præbitúrum.
  "25": Sed ad hæc cum adoléscens nequáquam inclinarétur, vocávit rex matrem, et suadébat ei ut adolescénti fíeret in salútem.
  "26": Cum autem multis eam verbis esset hortátus, promísit suasúrum se fílio suo.
  "27": 'Itaque inclináta ad illum, irrídens crudélem tyránnum, ait pátria voce: Fili mi, miserére mei, quæ te in útero novem ménsibus portávi, et lac triénnio dedi et álui, et in ætátem istam perdúxi.'
  "28": 'Peto, nate, ut aspícias ad cælum, et terram, et ad ómnia quæ in eis sunt: et intélligas quia ex níhilo fecit illa Deus, et hóminum genus:'
  "29": ita fiet, ut non tímeas carníficem istum, sed dignus frátribus tuis efféctus párticeps, súscipe mortem, ut in illa miseratióne cum frátribus tuis te recípiam.
  "30": 'Cum hæc illa adhuc díceret, ait adoléscens: Quem sustinétis? non obédio præcépto regis, sed præcépto legis, quæ data est nobis per Móysen.'
  "31": Tu vero, qui invéntor omnis malítiæ factus es in Hebrǽos, non effúgies manum Dei.
  "32": Nos enim pro peccátis nostris hæc pátimur.
  "33": 'Et si nobis propter increpatiónem, et correptiónem Dóminus Deus noster módicum irátus est: sed íterum reconciliábitur servis suis.'
  "34": 'Tu autem, o sceléste, et ómnium hóminum flagitiosíssime, noli frustra extólli vanis spebus in servos eius inflammátus:'
  "35": nondum enim omnipoténtis Dei, et ómnia inspiciéntis, iudícium effugísti.
  "36": 'Nam fratres mei, módico nunc dolóre sustentáto, sub testaménto ætérnæ vitæ effécti sunt: tu vero iudício Dei iustas supérbiæ tuæ pœnas exsólves.'
  "37": Ego autem, sicut fratres mei, ánimam, et corpus meum trado pro pátriis légibus, ínvocans Deum matúrius genti nostræ propítium fíeri, teque cum torméntis, et verbéribus confitéri quod ipse est Deus solus.
  "38": In me vero et in frátribus meis désinet Omnipoténtis ira, quæ super omne genus nostrum iuste superdúcta est.
  "39": Tunc rex accénsus ira in hunc, super omnes crudélius desǽvit, indígne ferens se derísum.
  "40": Et hic ítaque mundus óbiit, per ómnia in Dómino confídens.
  "41": Novíssime autem post fílios, et mater consúmpta est.
  "42": Igitur de sacrifíciis, et de nímiis crudelitátibus satis dictum est.
