bible: vulgate
lang: la
language: Latina
book: Isaias
chapter: "63"
verses:
  "1": Quis est iste, qui venit de Edom, tinctis véstibus de Bosra? iste formósus in stola sua, grádiens in multitúdine fortitúdinis suæ. Ego, qui loquor iustítiam, et propugnátor sum ad salvándum.
  "2": Quare ergo rubrum est induméntum tuum, et vestiménta tua sicut calcántium in torculári?
  "3": 'Tórcular calcávi solus, et de géntibus non est vir mecum: calcávi eos in furóre meo, et conculcávi eos in ira mea: et aspérsus est sanguis eórum super vestiménta mea, et ómnia induménta mea inquinávi.'
  "4": Dies enim ultiónis in corde meo, annus redemptiónis meæ venit.
  "5": 'Circumspéxi, et non erat auxiliátor: quæsívi, et non fuit qui adiuváret: et salvávit mihi bráchium meum, et indignátio mea ipsa auxiliáta est mihi.'
  "6": Et conculcávi pópulos in furóre meo, et inebriávi eos in indignatióne mea, et detráxi in terram virtútem eórum.
  "7": Miseratiónum Dómini recordábor, laudem Dómini super ómnibus, quæ réddidit nobis Dóminus, et super multitúdinem bonórum dómui Israel, quæ largítus est eis secúndum indulgéntiam suam, et secúndum multitúdinem misericordiárum suárum.
  "8": 'Et dixit: Verúmtamen pópulus meus est, fílii non negántes: et factus est eis salvátor.'
  "9": 'In omni tribulatióne eórum non est tribulátus, et ángelus faciéi eius salvávit eos: in dilectióne sua, et in indulgéntia sua ipse redémit eos, et portávit eos, et elevávit eos cunctis diébus sǽculi.'
  "10": 'Ipsi autem ad iracúndiam provocavérunt, et afflixérunt spíritum sancti eius: et convérsus est eis in inimícum, et ipse debellávit eos.'
  "11": 'Et recordátus est diérum sǽculi Móysi, et pópuli sui: Ubi est qui edúxit eos de mari cum pastóribus gregis sui? ubi est qui pósuit in médio eius spíritum sancti sui?'
  "12": 'qui edúxit ad déxteram Móysen bráchio maiestátis suæ, qui scidit aquas ante eos, ut fáceret sibi nomen sempitérnum:'
  "13": 'qui edúxit eos per abýssos, quasi equum in desérto non impingéntem:'
  "14": 'quasi ánimal in campo descéndens, spíritus Dómini ductor eius fuit: sic adduxísti pópulum tuum, ut fáceres tibi nomen glóriæ.'
  "15": 'Atténde de cælo, et vide de habitáculo sancto tuo, et glóriæ tuæ: ubi est zelus tuus, et fortitúdo tua, multitúdo víscerum tuórum et miseratiónum tuárum? super me continuérunt se.'
  "16": 'Tu enim pater noster, et Abraham nescívit nos, et Israel ignorávit nos: tu Dómine pater noster, redémptor noster, a sǽculo nomen tuum.'
  "17": 'Quare erráre nos fecísti Dómine de viis tuis: indurásti cor nostrum ne timerémus te? convértere propter servos tuos, tribus hereditátis tuæ.'
  "18": 'Quasi níhilum possedérunt pópulum sanctum tuum: hostes nostri conculcavérunt sanctificatiónem tuam.'
  "19": Facti sumus quasi in princípio, cum non dominaréris nostri, neque invocarétur nomen tuum super nos.
