bible: vulgate
lang: la
language: Latina
book: Ioannes
chapter: "7"
verses:
  "1": 'Post hæc autem ambulábat Iesus in Galilǽam: non enim volébat in Iudǽam ambuláre, quia quærébant eum Iudǽi interfícere.'
  "2": Erat autem in próximo dies festus Iudæórum, Scenopégia.
  "3": 'Dixérunt autem ad eum fratres eius: Transi hinc, et vade in Iudǽam, ut et discípuli tui vídeant ópera tua, quæ facis.'
  "4": 'Nemo quippe in occúlto quid facit, et quærit ipse in palam esse: si hæc facis, manifésta teípsum mundo.'
  "5": Neque enim fratres eius credébant in eum.
  "6": 'Dicit ergo eis Iesus: Tempus meum nondum advénit: tempus autem vestrum semper est parátum.'
  "7": 'Non potest mundus odísse vos: me autem odit, quia ego testimónium perhíbeo de illo quod ópera eius mala sunt.'
  "8": 'Vos ascéndite ad diem festum hunc, ego autem non ascéndo ad diem festum istum: quia meum tempus nondum implétum est.'
  "9": Hæc cum dixísset, ipse mansit in Galilǽa.
  "10": Ut autem ascendérunt fratres eius, tunc et ipse ascéndit ad diem festum non maniféste, sed quasi in occúlto.
  "11": 'Iudǽi ergo quærébant eum in die festo, et dicébant: Ubi est ille?'
  "12": 'Et murmur multum erat in turba de eo. Quidam enim dicébant: Quia bonus est. Alii autem dicébant: Non, sed sedúcit turbas.'
  "13": Nemo tamen palam loquebátur de illo propter metum Iudæórum.
  "14": Iam autem die festo mediánte, ascéndit Iesus in templum, et docébat.
  "15": 'Et mirabántur Iudǽi, dicéntes: Quómodo hic lítteras scit, cum non didícerit?'
  "16": 'Respóndit eis Iesus, et dixit: Mea doctrína non est mea, sed eius, qui misit me.'
  "17": Si quis volúerit voluntátem eius fácere, cognóscet de doctrína, utrum ex Deo sit, an ego a meípso loquar.
  "18": 'Qui a semetípso lóquitur, glóriam própriam quærit: qui autem quærit glóriam eius, qui misit eum, hic verax est, et iniustítia in illo non est.'
  "19": 'Nonne Móyses dedit vobis legem: et nemo ex vobis facit legem?'
  "20": 'Quid me quǽritis interfícere? Respóndit turba, et dixit: Dæmónium habes: quis te quærit interfícere?'
  "21": 'Respóndit Iesus et dixit eis: Unum opus feci, et omnes mirámini.'
  "22": Proptérea Móyses dedit vobis circumcisiónem (non quia ex Móyse est, sed ex pátribus), et in sábbato circumcíditis hóminem.
  "23": 'Si circumcisiónem áccipit homo in sábbato, ut non solvátur lex Móysi: mihi indignámini quia totum hóminem sanum feci in sábbato?'
  "24": Nolíte iudicáre secúndum fáciem, sed iustum iudícium iudicáte.
  "25": 'Dicébant ergo quidam ex Ierosólymis: Nonne hic est, quem quærunt interfícere?'
  "26": et ecce palam lóquitur, et nihil ei dicunt. Numquid vere cognovérunt príncipes quia hic est Christus?
  "27": 'Sed hunc scimus unde sit: Christus autem cum vénerit, nemo scit unde sit.'
  "28": 'Clamábat ergo Iesus in templo docens, et dicens: Et me scitis, et unde sim scitis: et a meípso non veni, sed est verus, qui misit me, quem vos nescítis.'
  "29": 'Ego scio eum: quia ab ipso sum, et ipse me misit.'
  "30": 'Quærébant ergo eum apprehéndere: et nemo misit in illum manus, quia nondum vénerat hora eius.'
  "31": 'De turba autem multi credidérunt in eum, et dicébant: Christus cum vénerit, numquid plura signa fáciet quam quæ hic facit?'
  "32": 'Audiérunt Pharisǽi turbam murmurántem de illo hæc: et misérunt príncipes, et Pharisǽi minístros ut apprehénderent eum.'
  "33": 'Dixit ergo eis Iesus: Adhuc módicum tempus vobíscum sum: et vado ad eum, qui me misit.'
  "34": 'Quærétis me, et non inveniétis: et ubi ego sum, vos non potéstis veníre.'
  "35": 'Dixérunt ergo Iudǽi ad semetípsos: Quo hic itúrus est, quia non inveniémus eum? numquid in dispersiónem géntium itúrus est, et doctúrus gentes?'
  "36": 'Quis est hic sermo, quem dixit: Quærétis me, et non inveniétis: et ubi sum ego, vos non potéstis veníre?'
  "37": 'In novíssimo autem die magno festivitátis stabat Iesus, et clamábat, dicens: Si quis sitit, véniat ad me, et bibat.'
  "38": Qui credit in me, sicut dicit Scriptúra, flúmina de ventre eius fluent aquæ vivæ.
  "39": 'Hoc autem dixit de Spíritu, quem acceptúri erant credéntes in eum: nondum enim erat Spíritus datus, quia Iesus nondum erat glorificátus.'
  "40": 'Ex illa ergo turba cum audíssent hos sermónes eius, dicébant: Hic est vere prophéta.'
  "41": 'Alii dicébant: Hic est Christus. Quidam autem dicébant: Numquid a Galilǽa venit Christus?'
  "42": 'Nonne Scriptúra dicit: Quia ex sémine David, et de Béthlehem castéllo, ubi erat David, venit Christus?'
  "43": Dissénsio ítaque facta est in turba propter eum.
  "44": 'Quidam autem ex ipsis volébant apprehéndere eum: sed nemo misit super eum manus.'
  "45": 'Venérunt ergo minístri ad pontífices, et Pharisǽos. Et dixérunt eis illi: Quare non adduxístis illum?'
  "46": 'Respondérunt minístri: Numquam sic locútus est homo, sicut hic homo.'
  "47": 'Respondérunt ergo eis Pharisǽi: Numquid et vos sedúcti estis?'
  "48": Numquid ex princípibus áliquis crédidit in eum, aut ex Pharisǽis?
  "49": Sed turba hæc, quæ non novit legem, maledícti sunt.
  "50": 'Dixit Nicodémus ad eos, ille, qui venit ad eum nocte, qui unus erat ex ipsis:'
  "51": Numquid lex nostra iúdicat hóminem, nisi prius audíerit ab ipso, et cognóverit quid fáciat?
  "52": 'Respondérunt, et dixérunt ei: Numquid et tu Galilǽus es? scrutáre Scriptúras, et vide quia a Galilǽa prophéta non surgit.'
  "53": Et revérsi sunt unusquísque in domum suam.
