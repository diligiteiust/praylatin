bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "144"
verses:
  "1": 'Laudátio ipsi David. Exaltábo te Deus meus rex: et benedícam nómini tuo in sǽculum, et in sǽculum sǽculi.'
  "2": 'Per síngulos dies benedícam tibi: et laudábo nomen tuum in sǽculum, et in sǽculum sǽculi.'
  "3": 'Magnus Dóminus et laudábilis nimis: et magnitúdinis eius non est finis.'
  "4": 'Generátio et generátio laudábit ópera tua: et poténtiam tuam pronuntiábunt.'
  "5": 'Magnificéntiam glóriæ sanctitátis tuæ loquéntur: et mirabília tua narrábunt.'
  "6": 'Et virtútem terribílium tuórum dicent: et magnitúdinem tuam narrábunt.'
  "7": 'Memóriam abundántiæ suavitátis tuæ eructábunt: et iustítia tua exsultábunt.'
  "8": 'Miserátor et miséricors Dóminus: pátiens, et multum miséricors.'
  "9": 'Suávis Dóminus univérsis: et miseratiónes eius super ómnia ópera eius.'
  "10": 'Confiteántur tibi Dómine ómnia ópera tua: et sancti tui benedícant tibi.'
  "11": 'Glóriam regni tui dicent: et poténtiam tuam loquéntur:'
  "12": 'ut notam fáciant fíliis hóminum poténtiam tuam: et glóriam magnificéntiæ regni tui.'
  "13": 'Regnum tuum regnum ómnium sæculórum: et dominátio tua in omni generatióne et generatiónem. Fidélis Dóminus in ómnibus verbis suis: et sanctus in ómnibus opéribus suis.'
  "14": 'Allevat Dóminus omnes, qui córruunt: et érigit omnes elísos.'
  "15": 'Oculi ómnium in te sperant Dómine: et tu das escam illórum in témpore opportúno.'
  "16": 'Aperis tu manum tuam: et imples omne ánimal benedictióne.'
  "17": 'Iustus Dóminus in ómnibus viis suis: et sanctus in ómnibus opéribus suis.'
  "18": 'Prope est Dóminus ómnibus invocántibus eum: ómnibus invocántibus eum in veritáte.'
  "19": 'Voluntátem timéntium se fáciet, et deprecatiónem eórum exáudiet: et salvos fáciet eos.'
  "20": 'Custódit Dóminus omnes diligéntes se: et omnes peccatóres dispérdet.'
  "21": 'Laudatiónem Dómini loquétur os meum: et benedícat omnis caro nómini sancto eius in sǽculum, et in sǽculum sǽculi.'
