bible: vulgate
lang: la
language: Latina
book: I Samuelis
chapter: "22"
verses:
  "1": Abiit ergo David inde, et fugit in spelúncam Odóllam. Quod cum audíssent fratres eius, et omnis domus patris eius, descendérunt ad eum illuc.
  "2": 'Et convenérunt ad eum omnes, qui erant in angústia constitúti, et oppréssi ære aliéno, et amáro ánimo: et factus est eórum princeps, fuerúntque cum eo quasi quadringénti viri.'
  "3": 'Et proféctus est David inde in Maspha, quæ est Moab: et dixit ad regem Moab: Máneat, oro, pater meus et mater mea vobíscum, donec sciam quid fáciat mihi Deus.'
  "4": 'Et relíquit eos ante fáciem regis Moab: manserúntque apud eum cunctis diébus, quibus David fuit in præsídio.'
  "5": 'Dixítque Gad prophéta ad David: Noli manére in præsídio: proficíscere, et vade in terram Iuda. Et proféctus est David, et venit in saltum Haret.'
  "6": Et audívit Saul quod apparuísset David, et viri qui erant cum eo. Saul autem cum manéret in Gábaa, et esset in némore, quod est in Rama, hastam manu tenens, cunctíque servi eius circumstárent eum,
  "7": 'ait ad servos suos qui assistébant ei: Audíte nunc fílii Iémini: numquid ómnibus vobis dabit fílius Isai agros et víneas, et univérsos vos fáciet tribúnos, et centuriónes:'
  "8": 'quóniam coniurástis omnes advérsum me, et non est qui mihi renúntiet, máxime cum et fílius meus fœdus iníerit cum fílio Isai? Non est qui vicem meam dóleat ex vobis, nec qui annúntiet mihi: eo quod suscitáverit fílius meus servum meum advérsum me, insidiántem mihi usque hódie.'
  "9": Respóndens autem Doeg Idumǽus, qui assistébat, et erat primus inter servos Saul, Vidi, inquit, fílium Isai in Nobe apud Achímelech fílium Achitob sacerdótem.
  "10": 'Qui consúluit pro eo Dóminum, et cibária dedit ei: sed et gládium Góliath Philisthǽi dedit illi.'
  "11": Misit ergo rex ad accerséndum Achímelech sacerdótem fílium Achitob, et omnem domum patris eius, sacerdótum qui erant in Nobe, qui univérsi venérunt ad regem.
  "12": 'Et ait Saul ad Achímelech: Audi fili Achitob. Qui respóndit: Præsto sum dómine.'
  "13": 'Dixítque ad eum Saul: Quare coniurástis advérsum me, tu et fílius Isai, et dedísti ei panes et gládium, et consuluísti pro eo Deum, ut consúrgeret advérsum me, insidiátor usque hódie pérmanens?'
  "14": 'Respondénsque Achímelech regi, ait: Et quis in ómnibus servis tuis, sicut David fidélis, et gener regis, et pergens ad impérium tuum, et gloriósus in domo tua?'
  "15": 'Num hódie cœpi pro eo consúlere Deum? absit hoc a me: ne suspicétur rex advérsus servum suum rem huiuscémodi, in univérsa domo patris mei: non enim scivit servus tuus quidquam super hoc negótio, vel módicum vel grande.'
  "16": 'Dixítque rex: Morte moriéris Achímelech, tu et omnis domus patris tui.'
  "17": 'Et ait rex emissáriis, qui circumstábant eum: Convertímini, et interfícite sacerdótes Dómini, nam manus eórum cum David est: sciéntes quod fugísset, et non indicavérunt mihi. Noluérunt autem servi regis exténdere manus suas in sacerdótes Dómini.'
  "18": 'Et ait rex ad Doeg: Convértere tu, et írrue in sacerdótes. Conversúsque Doeg Idumǽus, írruit in sacerdótes, et trucidávit in die illa octogínta quinque viros vestítos ephod líneo.'
  "19": Nobe autem civitátem sacerdótum percússit in ore gládii, viros et mulíeres, et párvulos et lacténtes, bovémque, et ásinum, et ovem in ore gládii.
  "20": Evádens autem unus fílius Achímelech, fílii Achitob, cuius nomen erat Abíathar, fugit ad David,
  "21": et annuntiávit ei quod occidísset Saul sacerdótes Dómini.
  "22": 'Et ait David ad Abíathar: Sciébam in die illa, quod cum ibi esset Doeg Idumǽus, procul dúbio annuntiáret Sauli: ego sum reus ómnium animárum patris tui.'
  "23": 'Mane mecum, ne tímeas: si quis quæsíerit ánimam meam, quæret et ánimam tuam, mecúmque serváberis.'
