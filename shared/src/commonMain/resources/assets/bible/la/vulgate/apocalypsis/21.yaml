bible: vulgate
lang: la
language: Latina
book: Apocalypsis
chapter: "21"
verses:
  "1": Et vidi cælum novum, et terram novam. Primum enim cælum, et prima terra ábiit, et mare iam non est.
  "2": Et ego Ioánnes vidi sanctam civitátem Ierúsalem novam descendéntem de cælo a Deo, parátam sicut sponsam ornátam viro suo.
  "3": 'Et audívi vocem magnam de throno dicéntem: Ecce tabernáculum Dei cum homínibus, et habitábit cum eis. Et ipsi pópulus eius erunt, et ipse Deus cum eis erit eórum Deus:'
  "4": 'et abstérget Deus omnem lácrymam ab óculis eórum: et mors ultra non erit, neque luctus, neque clamor, neque dolor erit ultra, quia prima abiérunt.'
  "5": 'Et dixit qui sedébat in throno: Ecce nova fácio ómnia. Et dixit mihi: Scribe, quia hæc verba fidelíssima sunt, et vera.'
  "6": 'Et dixit mihi: Factum est: ego sum α et ω, inítium et finis. Ego sitiénti dabo de fonte aquæ vitæ, gratis.'
  "7": 'Qui vícerit, possidébit hæc: et ero illi Deus, et ille erit mihi fílius.'
  "8": 'Tímidis autem, et incrédulis, et exsecrátis, et homicídis, et fornicatóribus, et venéficis, et idololátris, et ómnibus mendácibus, pars illórum erit in stagno ardénti igne, et súlphure: quod est mors secúnda.'
  "9": 'Et venit unus de septem ángelis habéntibus phíalas plenas septem plagis novíssimis, et locútus est mecum, dicens: Veni, et osténdam tibi sponsam, uxórem Agni.'
  "10": Et sústulit me in spíritu in montem magnum, et altum, et osténdit mihi civitátem sanctam Ierúsalem descendéntem de cælo a Deo,
  "11": 'habéntem claritátem Dei: et lumen eius símile lápidi pretióso tamquam lápidi iáspidis, sicut crystállum.'
  "12": 'Et habébat murum magnum, et altum, habéntem portas duódecim: et in portis ángelos duódecim, et nómina inscrípta, quæ sunt nómina duódecim tríbuum filiórum Israel.'
  "13": Ab oriénte portæ tres, et ab aquilóne portæ tres, et ab austro portæ tres, et ab occásu portæ tres.
  "14": Et murus civitátis habens fundaménta duódecim, et in ipsis duódecim nómina duódecim apostolórum Agni.
  "15": Et qui loquebátur mecum, habébat mensúram arundíneam áuream, ut metirétur civitátem, et portas eius, et murum.
  "16": 'Et cívitas in quadro pósita est, et longitúdo eius tanta est quanta et latitúdo: et mensus est civitátem de arúndine áurea per stádia duódecim míllia: et longitúdo, et altitúdo, et latitúdo eius æquália sunt.'
  "17": Et mensus est murum eius centum quadragínta quátuor cubitórum, mensúra hóminis, quæ est ángeli.
  "18": 'Et erat structúra muri eius ex lápide iáspide: ipsa vero cívitas aurum mundum símile vitro mundo.'
  "19": 'Et fundaménta muri civitátis omni lápide pretióso ornáta. Fundaméntum primum, iaspis: secúndum, sapphírus: tértium, calcedónius: quartum, smarágdus:'
  "20": 'quintum, sardónyx: sextum, sárdius: séptimum, chrysólithus: octávum, berýllus: nonum, topázius: décimum, chrysóprasus: undécimum, hyacínthus: duodécimum, amethýstus.'
  "21": 'Et duódecim portæ, duódecim margarítæ sunt, per síngulas: et síngulæ portæ erant ex síngulis margarítis: et plátea civitátis aurum mundum, tamquam vitrum perlúcidum.'
  "22": 'Et templum non vidi in ea: Dóminus enim Deus omnípotens templum illíus est, et Agnus.'
  "23": 'Et cívitas non eget sole, neque luna ut lúceant in ea: nam cláritas Dei illuminávit eam, et lucérna eius est Agnus.'
  "24": 'Et ambulábunt gentes in lúmine eius: et reges terræ áfferent glóriam suam, et honórem in illam.'
  "25": 'Et portæ eius non claudéntur per diem: nox enim non erit illic.'
  "26": Et áfferent glóriam, et honórem géntium in illam.
  "27": Non intrábit in eam áliquod coinquinátum, aut abominatiónem fáciens, et mendácium, nisi qui scripti sunt in Libro vitæ Agni.
