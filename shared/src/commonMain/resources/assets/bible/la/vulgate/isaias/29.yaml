bible: vulgate
lang: la
language: Latina
book: Isaias
chapter: "29"
verses:
  "1": 'Væ Ariel, Ariel cívitas, quam expugnávit David: ádditus est annus ad annum: solemnitátes evolútæ sunt.'
  "2": Et circumvallábo Ariel, et erit tristis et mœrens, et erit mihi quasi Ariel.
  "3": Et circúmdabo quasi sphæram in circúitu tuo, et iáciam contra te ággerem, et muniménta ponam in obsidiónem tuam.
  "4": 'Humiliáberis, de terra loquéris, et de humo audiétur elóquium tuum: et erit quasi pythónis de terra vox tua, et de humo elóquium tuum mussitábit.'
  "5": 'Et erit sicut pulvis ténuis multitúdo ventilántium te, et sicut favílla pertránsiens multitúdo eórum, qui contra te prævaluérunt:'
  "6": erítque repénte conféstim. A Dómino exercítuum visitábitur in tonítruo, et commotióne terræ, et voce magna túrbinis et tempestátis, et flammæ ignis devorántis.
  "7": Et erit sicut sómnium visiónis noctúrnæ multitúdo ómnium géntium, quæ dimicavérunt contra Ariel, et omnes qui militavérunt, et obsedérunt, et prævaluérunt advérsus eam.
  "8": 'Et sicut sómniat esúriens, et cómedit, cum autem fúerit expergefáctus, vácua est ánima eius: et sicut sómniat sítiens et bibit, et postquam fúerit expergefáctus, lassus adhuc sitit, et ánima eius vácua est: sic erit multitúdo ómnium géntium, quæ dimicavérunt contra montem Sion.'
  "9": 'Obstupéscite et admirámini, fluctuáte, et vacilláte: inebriámini, et non a vino: movémini, et non ab ebrietáte.'
  "10": Quóniam míscuit vobis Dóminus spíritum sopóris, claudet óculos vestros, prophétas et príncipes vestros, qui vident visiónes, opériet.
  "11": 'Et erit vobis vísio ómnium sicut verba libri signáti, quem cum déderint sciénti lítteras, dicent: Lege istum: et respondébit: Non possum, signátus est enim.'
  "12": 'Et dábitur liber nesciénti lítteras, dicetúrque ei: Lege: et respondébit: Néscio lítteras.'
  "13": 'Et dixit Dóminus: Eo quod appropínquat pópulus iste ore suo, et lábiis suis gloríficat me, cor autem eius longe est a me, et timuérunt me mandáto hóminum et doctrínis:'
  "14": 'ídeo ecce ego addam ut admiratiónem fáciam pópulo huic miráculo grandi et stupéndo: períbit enim sapiéntia a sapiéntibus eius, et intelléctus prudéntium eius abscondétur.'
  "15": 'Væ qui profúndi estis corde, ut a Dómino abscondátis consílium: quorum sunt in ténebris ópera, et dicunt: Quis videt nos, et quis novit nos?'
  "16": 'Pervérsa est hæc vestra cogitátio: quasi si lutum contra fígulum cógitet, et dicat opus factóri suo: Non fecísti me: et figméntum dicat fictóri suo: Non intélligis.'
  "17": Nonne adhuc in módico et in brevi convertétur Líbanus in charmel, et charmel in saltum reputábitur?
  "18": Et áudient in die illa surdi verba libri, et de ténebris et calígine óculi cæcórum vidébunt.
  "19": 'Et addent mites in Dómino lætítiam, et páuperes hómines in sancto Israel exsultábunt:'
  "20": 'quóniam defécit qui prævalébat, consummátus est illúsor, et succísi sunt omnes qui vigilábant super iniquitátem:'
  "21": qui peccáre faciébant hómines in verbo, et arguéntem in porta supplantábant, et declinavérunt frustra a iusto.
  "22": 'Propter hoc, hæc dicit Dóminus ad domum Iacob, qui redémit Abraham: Non modo confundétur Iacob, nec modo vultus eius erubéscet:'
  "23": 'sed cum víderit fílios suos, ópera mánuum meárum in médio sui sanctificántes nomen meum, et sanctificábunt sanctum Iacob, et Deum Israel prædicábunt:'
  "24": et scient errántes spíritu intelléctum, et mussitatóres discent legem.
