bible: vulgate
lang: la
language: Latina
book: Nehemiae
chapter: "12"
verses:
  "1": 'Hi sunt autem sacerdótes et Levítæ, qui ascendérunt cum Zoróbabel fílio Saláthiel, et Iósue: Saraía, Ieremías, Esdras,'
  "2": Amaría, Melluch, Hattus,
  "3": Sebenías, Rheum, Mérimuth,
  "4": Addo, Genthon, Abía,
  "5": Míamin, Madía, Belga,
  "6": Semeía, et Ióiarib, Idaía, Sellum, Amoc, Helcías,
  "7": Idaía. Isti príncipes sacerdótum, et fratres eórum in diébus Iósue.
  "8": 'Porro Levítæ, Iésua, Bénnui, Cédmihel, Sarebía, Iuda, Mathanías, super hymnos ipsi et fratres eórum:'
  "9": et Becbecía atque Hanni, et fratres eórum, unusquísque in offício suo.
  "10": Iósue autem génuit Ióacim, et Ióacim génuit Elíasib, et Elíasib génuit Ióiada,
  "11": et Ióiada génuit Iónathan, et Iónathan génuit Iéddoa.
  "12": 'In diébus autem Ióacim erant sacerdótes et príncipes familiárum: Saraíæ, Maraía: Ieremíæ, Hananía:'
  "13": 'Esdræ, Mosóllam: Amaríæ, Ióhanan:'
  "14": 'Mílicho, Iónathan: Sebeníæ, Ioseph:'
  "15": 'Haram, Edna: Máraioth, Helci:'
  "16": 'Adaíæ, Zacharía: Genthon, Mosóllam:'
  "17": 'Abíæ, Zechri: Míamin et Moadíæ, Phelti:'
  "18": 'Belgæ, Sámmua: Semaíæ, Iónathan:'
  "19": 'Ióiarib, Mathánai: Iodaíæ, Azzi:'
  "20": 'Séllai, Célai: Amoc, Heber:'
  "21": 'Helcíæ, Hasebía: Idaíæ, Nathánael.'
  "22": Levítæ in diébus Elíasib, et Ióiada, et Ióhanan, et Iéddoa, scripti príncipes familiárum, et sacerdótes in regno Daríi Persæ.
  "23": Fílii Levi príncipes familiárum, scripti in Libro verbórum diérum, et usque ad dies Iónathan, fílii Elíasib.
  "24": 'Et príncipes Levitárum, Hasebía, Serebía, et Iósue fílius Cédmihel: et fratres eórum per vices suas, ut laudárent et confiteréntur iuxta præcéptum David viri Dei, et observárent æque per órdinem.'
  "25": Mathanía, et Becbecía, Obedía, Mosóllam, Telmon, Accub, custódes portárum et vestibulórum ante portas.
  "26": Hi in diébus Ióacim fílii Iósue, fílii Iósedec, et in diébus Nehemíæ ducis, et Esdræ sacerdótis scribǽque.
  "27": In dedicatióne autem muri Ierúsalem, requisiérunt Levítas de ómnibus locis suis ut addúcerent eos in Ierúsalem, et fácerent dedicatiónem et lætítiam in actióne gratiárum, et cántico, et in cýmbalis, psaltériis, et cítharis.
  "28": Congregáti sunt autem fílii cantórum de campéstribus circa Ierúsalem, et de villis Nethúphathi,
  "29": 'et de domo Galgal, et de regiónibus Geba et Azmaveth: quóniam villas ædificavérunt sibi cantóres in circúitu Ierúsalem.'
  "30": Et mundáti sunt sacerdótes et Levítæ, et mundavérunt pópulum, et portas, et murum.
  "31": Ascéndere autem feci príncipes Iuda super murum, et státui duos magnos choros laudántium. Et iérunt ad déxteram super murum ad portam sterquilínii.
  "32": Et ivit post eos Osaías, et média pars príncipum Iuda,
  "33": et Azarías, Esdras, et Mosóllam, Iudas, et Béniamin, et Semeía, et Ieremías.
  "34": Et de fíliis sacerdótum in tubis, Zacharías fílius Iónathan, fílius Semeíæ, fílius Mathaníæ, fílius Michaíæ, fílius Zechur, fílius Asaph,
  "35": 'et fratres eius Semeía, et Azáreel, Malálai, Galálai, Máai, Nathánael, et Iudas, et Hánani, in vasis cántici David viri Dei: et Esdras scriba ante eos in porta fontis.'
  "36": Et contra eos ascendérunt in grádibus civitátis David in ascénsu muri super domum David, et usque ad portam aquárum ad oriéntem.
  "37": Et chorus secúndus grátias referéntium ibat ex advérso, et ego post eum, et média pars pópuli super murum, et super turrim furnórum, et usque ad murum latíssimum,
  "38": 'et super portam Ephraim, et super portam antíquam, et super portam píscium et turrim Hanáneel, et turrim Emath, et usque ad portam gregis: et stetérunt in porta custódiæ,'
  "39": steterúntque duo chori laudántium in domo Dei, et ego, et dimídia pars magistrátuum mecum.
  "40": Et sacerdótes, Elíachim, Maasía, Míamin, Michéa, Elioénai, Zacharía, Hananía in tubis,
  "41": 'et Maasía, et Semeía, et Eleázar, et Azzi, et Ióhanan, et Melchía, et Ælam, et Ezer. Et clare cecinérunt cantóres, et Iezraía præpósitus:'
  "42": 'et immolavérunt in die illa víctimas magnas, et lætáti sunt: Deus enim lætificáverat eos lætítia magna: sed et uxóres eórum et líberi gavísi sunt, et audíta est lætítia Ierúsalem procul.'
  "43": 'Recensuérunt quoque in die illa viros super gazophylácia thesáuri ad libámina, et ad primítias, et ad décimas, ut introférrent per eos príncipes civitátis in decóre gratiárum actiónis, sacerdótes et Levítas: quia lætificátus est Iuda in sacerdótibus et Levítis adstántibus.'
  "44": Et custodiérunt observatiónem Dei sui, et observatiónem expiatiónis, et cantóres, et ianitóres iuxta præcéptum David, et Salomónis fílii eius,
  "45": quia in diébus David et Asaph ab exórdio erant príncipes constitúti cantórum in cármine laudántium, et confiténtium Deo.
  "46": Et omnis Israel, in diébus Zoróbabel, et in diébus Nehemíæ, dabant partes cantóribus et ianitóribus per dies síngulos, et sanctificábant Levítas, et Levítæ sanctificábant fílios Aaron.
