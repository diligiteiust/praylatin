bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "133"
verses:
  "1": 'Cánticum gráduum. Ecce nunc benedícite Dóminum, omnes servi Dómini: qui statis in domo Dómini, in átriis domus Dei nostri,'
  "2": in nóctibus extóllite manus vestras in sancta, et benedícite Dóminum.
  "3": Benedícat te Dóminus ex Sion, qui fecit cælum et terram.
