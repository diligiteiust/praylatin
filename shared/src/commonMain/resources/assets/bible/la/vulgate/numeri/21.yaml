bible: vulgate
lang: la
language: Latina
book: Numeri
chapter: "21"
verses:
  "1": Quod cum audísset Chananǽus rex Arad, qui habitábat ad merídiem, venísse scílicet Israel per exploratórum viam, pugnávit contra illum, et victor exsístens, duxit ex eo prædam.
  "2": 'At Israel voto se Dómino óbligans, ait: Si tradíderis pópulum istum in manu mea, delébo urbes eius.'
  "3": 'Exaudivítque Dóminus preces Israel, et trádidit Chananǽum, quem ille interfécit subvérsis úrbibus eius: et vocávit nomen loci illíus Horma, id est, anáthema.'
  "4": 'Profécti sunt autem et de monte Hor, per viam quæ ducit ad mare Rubrum, ut circumírent terram Edom. Et tædére cœpit pópulum itíneris ac labóris:'
  "5": 'locutúsque contra Deum et Móysen, ait: Cur eduxísti nos de Ægýpto, ut morerémur in solitúdine? Deest panis, non sunt aquæ: ánima nostra iam náuseat super cibo isto levíssimo.'
  "6": Quamóbrem misit Dóminus in pópulum ignítos serpéntes, ad quorum plagas et mortes plurimórum,
  "7": 'venérunt ad Móysen, atque dixérunt: Peccávimus, quia locúti sumus contra Dóminum et te: ora ut tollat a nobis serpéntes. Oravítque Móyses pro pópulo,'
  "8": 'et locútus est Dóminus ad eum: Fac serpéntem ǽneum, et pone eum pro signo: qui percússus aspéxerit eum, vivet.'
  "9": 'Fecit ergo Móyses serpéntem ǽneum, et pósuit eum pro signo: quem cum percússi aspícerent, sanabántur.'
  "10": Profectíque fílii Israel castrametáti sunt in Oboth.
  "11": Unde egréssi fixére tentória in Ieábarim, in solitúdine, quæ réspicit Moab contra orientálem plagam.
  "12": Et inde movéntes, venérunt ad torréntem Zared.
  "13": Quem relinquéntes castrametáti sunt contra Arnon, quæ est in desérto, et próminet in fínibus Amorrhǽi. Síquidem Arnon términus est Moab, dívidens Moabítas et Amorrhǽos.
  "14": 'Unde dícitur in libro bellórum Dómini: Sicut fecit in mari Rubro, sic fáciet in torréntibus Arnon.'
  "15": Scópuli torréntium inclináti sunt, ut requiéscerent in Ar, et recúmberent in fínibus Moabitárum.
  "16": 'Ex eo loco appáruit púteus, super quo locútus est Dóminus ad Móysen: Cóngrega pópulum, et dabo ei aquam.'
  "17": 'Tunc cécinit Israel carmen istud: Ascéndat púteus. Concinébant:'
  "18": Púteus, quem fodérunt príncipes, et paravérunt duces multitúdinis in datóre legis, et in báculis suis. De solitúdine, Matthána.
  "19": 'De Matthána in Naháliel: de Naháliel in Bamoth.'
  "20": De Bamoth, vallis est in regióne Moab, in vértice Phasga, quod réspicit contra desértum.
  "21": 'Misit autem Israel núntios ad Sehon regem Amorrhæórum, dicens:'
  "22": 'Obsecro ut transíre mihi líceat per terram tuam: non declinábimus in agros et víneas: non bibémus aquas ex púteis: via régia gradiémur, donec transeámus términos tuos.'
  "23": 'Qui concédere nóluit ut transíret Israel per fines suos: quin pótius exércitu congregáto, egréssus est óbviam in desértum, et venit in Iasa, pugnavítque contra eum.'
  "24": 'A quo percússus est in ore gládii, et posséssa est terra eius ab Arnon usque Ieboc, et fílios Ammon: quia forti præsídio tenebántur términi Ammonitárum.'
  "25": Tulit ergo Israel omnes civitátes eius, et habitávit in úrbibus Amorrhǽi, in Hésebon scílicet, et vículis eius.
  "26": 'Urbs Hésebon fuit Sehon regis Amorrhǽi, qui pugnávit contra regem Moab: et tulit omnem terram, quæ ditiónis illíus fúerat usque Arnon.'
  "27": 'Idcírco dícitur in provérbio: Veníte in Hésebon: ædificétur, et construátur cívitas Sehon:'
  "28": ignis egréssus est de Hésebon, flamma de óppido Sehon, et devorávit Ar Moabitárum, et habitatóres excelsórum Arnon.
  "29": 'Væ tibi Moab: perísti pópule Chamos. Dedit fílios eius in fugam, et fílias in captivitátem regi Amorrhæórum Sehon.'
  "30": Iugum ipsórum dispériit ab Hésebon usque Dibon, lassi pervenérunt in Nophe, et usque Médaba.
  "31": Habitávit ítaque Israel in terra Amorrhǽi.
  "32": 'Misítque Móyses qui explorárent Iazer: cuius cepérunt vículos, et possedérunt habitatóres.'
  "33": Verterúntque se, et ascendérunt per viam Basan, et occúrrit eis Og rex Basan cum omni pópulo suo, pugnatúrus in Edrai.
  "34": 'Dixítque Dóminus ad Móysen: Ne tímeas eum, quia in manu tua trádidi illum, et omnem pópulum ac terram eius: faciésque illi sicut fecísti Sehon regi Amorrhæórum habitatóri Hésebon.'
  "35": Percussérunt ígitur et hunc cum fíliis suis, universúmque pópulum eius usque ad interneciónem, et possedérunt terram illíus.
