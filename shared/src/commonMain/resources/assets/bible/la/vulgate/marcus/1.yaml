bible: vulgate
lang: la
language: Latina
book: Marcus
chapter: "1"
verses:
  "1": Inítium Evangélii Iesu Christi, Fílii Dei.
  "2": 'Sicut scriptum est in Isaía prophéta: Ecce ego mitto ángelum meum ante fáciem tuam, qui præparábit viam tuam ante te.'
  "3": 'Vox clamántis in desérto: Paráte viam Dómini, rectas fácite sémitas eius.'
  "4": Fuit Ioánnes in desérto baptízans, et prǽdicans baptísmum pœniténtiæ in remissiónem peccatórum.
  "5": Et egrediebátur ad eum omnis Iudǽæ régio, et Ierosolymítæ univérsi, et baptizabántur ab illo in Iordánis flúmine, confiténtes peccáta sua.
  "6": 'Et erat Ioánnes vestítus pilis caméli, et zona pellícea circa lumbos eius, et locústas, et mel silvéstre edébat. Et prædicábat dicens:'
  "7": Venit fórtior me post me, cuius non sum dignus procúmbens sólvere corrígiam calceamentórum eius.
  "8": Ego baptizávi vos aqua, ille vero baptizábit vos Spíritu sancto.
  "9": 'Et factum est: in diébus illis venit Iesus a Názareth Galilǽæ: et baptizátus est a Ioánne in Iordáne.'
  "10": Et statim ascéndens de aqua, vidit cælos apértos, et Spíritum tamquam colúmbam descendéntem, et manéntem in ipso.
  "11": 'Et vox facta est de cælis: Tu es Fílius meus diléctus, in te complácui.'
  "12": Et statim Spíritus éxpulit eum in desértum.
  "13": 'Et erat in desérto quadragínta diébus, et quadragínta nóctibus: et tentabátur a Sátana: erátque cum béstiis, et ángeli ministrábant illi.'
  "14": Postquam autem tráditus est Ioánnes, venit Iesus in Galilǽam, prǽdicans Evangélium regni Dei,
  "15": 'et dicens: Quóniam implétum est tempus, et appropinquávit regnum Dei: pœnitémini, et crédite Evangélio.'
  "16": Et prætériens secus mare Galilǽæ, vidit Simónem, et Andréam fratrem eius, mitténtes rétia in mare (erant enim piscatóres),
  "17": 'et dixit eis Iesus: Veníte post me, et fáciam vos fíeri piscatóres hóminum.'
  "18": Et prótinus relíctis rétibus, secúti sunt eum.
  "19": 'Et progréssus inde pusíllum, vidit Iacóbum Zebedǽi, et Ioánnem fratrem eius, et ipsos componéntes rétia in navi:'
  "20": et statim vocávit illos. Et relícto patre suo Zebedǽo in navi cum mercenáriis, secúti sunt eum.
  "21": 'Et ingrediúntur Caphárnaum: et statim sábbatis ingréssus in synagógam, docébat eos.'
  "22": 'Et stupébant super doctrína eius: erat enim docens eos quasi potestátem habens, et non sicut scribæ.'
  "23": 'Et erat in synagóga eórum homo in spíritu immúndo: et exclamávit,'
  "24": 'dicens: Quid nobis et tibi, Iesu Nazaréne? venísti pérdere nos? scio qui sis, Sanctus Dei.'
  "25": 'Et comminátus est ei Iesus, dicens: Obmutésce, et exi de hómine.'
  "26": Et discérpens eum spíritus immúndus, et exclámans voce magna, éxiit ab eo.
  "27": 'Et miráti sunt omnes, ita ut conquírerent inter se dicéntes: Quidnam est hoc? quænam doctrína hæc nova? quia in potestáte étiam spirítibus immúndis ímperat, et obédiunt ei.'
  "28": Et procéssit rumor eius statim in omnem regiónem Galilǽæ.
  "29": Et prótinus egrediéntes de synagóga, venérunt in domum Simónis, et Andréæ cum Iacóbo, et Ioánne.
  "30": 'Decumbébat autem socrus Simónis febrícitans: et statim dicunt ei de illa.'
  "31": 'Et accédens elevávit eam, apprehénsa manu eius: et contínuo dimísit eam febris, et ministrábat eis.'
  "32": 'Véspere autem facto cum occidísset sol, afferébant ad eum omnes male habéntes, et dæmónia habéntes:'
  "33": et erat omnis cívitas congregáta ad iánuam.
  "34": Et curávit multos, qui vexabántur váriis languóribus, et dæmónia multa eiciébat, et non sinébat ea loqui, quóniam sciébant eum.
  "35": Et dilúculo valde surgens, egréssus ábiit in desértum locum, ibíque orábat.
  "36": Et prosecútus est eum Simon, et qui cum illo erant.
  "37": 'Et cum inveníssent eum, dixérunt ei: Quia omnes quærunt te.'
  "38": 'Et ait illis: Eámus in próximos vicos, et civitátes, ut et ibi prǽdicem: ad hoc enim veni.'
  "39": Et erat prǽdicans in synagógis eórum, et in omni Galilǽa, et dæmónia eíciens.
  "40": 'Et venit ad eum leprósus déprecans eum: et genu flexo dixit ei: Si vis, potes me mundáre.'
  "41": 'Iesus autem misértus eius, exténdit manum suam: et tangens eum, ait illi: Volo: mundáre.'
  "42": Et cum dixísset, statim discéssit ab eo lepra, et mundátus est.
  "43": Et comminátus est ei, statímque eiécit illum,
  "44": 'et dicit ei: Vide némini díxeris: sed vade, osténde te príncipi sacerdótum, et offer pro emundatióne tua, quæ præcépit Móyses in testimónium illis.'
  "45": At ille egréssus cœpit prædicáre, et diffamáre sermónem, ita ut iam non posset maniféste introíre in civitátem, sed foris in desértis locis esset, et conveniébant ad eum úndique.
