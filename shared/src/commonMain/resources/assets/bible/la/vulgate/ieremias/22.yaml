bible: vulgate
lang: la
language: Latina
book: Ieremias
chapter: "22"
verses:
  "1": 'Hæc dicit Dóminus: Descénde in domum regis Iuda, et loquéris ibi verbum hoc,'
  "2": 'et dices: Audi verbum Dómini rex Iuda, qui sedes super sólium David: tu et servi tui, et pópulus tuus, qui ingredímini per portas istas.'
  "3": 'Hæc dicit Dóminus: Fácite iudícium et iustítiam, et liberáte vi oppréssum de manu calumniatóris: et ádvenam, et pupíllum, et víduam nolíte contristáre, neque opprimátis iníque, et sánguinem innocéntem ne effundátis in loco isto.'
  "4": Si enim faciéntes fecéritis verbum istud, ingrediéntur per portas domus huius reges sedéntes de génere David super thronum eius, et ascendéntes currus et equos, ipsi et servi, et pópulus eórum.
  "5": 'Quod si non audiéritis verba hæc: in memetípso iurávi, dicit Dóminus, quia in solitúdinem erit domus hæc.'
  "6": 'Quia hæc dicit Dóminus super domum regis Iuda: Gálaad tu mihi caput Líbani: si non posúero te solitúdinem, urbes inhabitábiles.'
  "7": 'Et sanctificábo super te interficiéntem virum et arma eius: et succídent eléctas cedros tuas, et præcipitábunt in ignem.'
  "8": 'Et pertransíbunt gentes multæ per civitátem hanc, et dicet unusquísque próximo suo: Quare fecit Dóminus sic civitáti huic grandi?'
  "9": 'Et respondébunt: Eo quod derelíquerint pactum Dómini Dei sui, et adoráverint deos aliénos, et servíerint eis.'
  "10": 'Nolíte flere mórtuum, neque lugeátis super eum fletu: plángite eum, qui egréditur, quia non revertétur ultra, nec vidébit terram nativitátis suæ.'
  "11": 'Quia hæc dicit Dóminus ad Sellum fílium Iosíæ regem Iuda, qui regnávit pro Iosía patre suo, qui egréssus est de loco isto: Non revertétur huc ámplius,'
  "12": sed in loco, ad quem tránstuli eum, ibi moriétur, et terram istam non vidébit ámplius.
  "13": 'Væ qui ædíficat domum suam in iniustítia, et cœnácula sua non in iudício: amícum suum ópprimet frustra, et mercédem eius non reddet ei.'
  "14": 'Qui dicit: Ædificábo mihi domum latam, et cœnácula spatiósa: qui áperit sibi fenéstras, et facit laqueária cédrina, pingítque sinópide.'
  "15": Numquid regnábis, quóniam confers te cedro? pater tuus numquid non comédit et bibit, et fecit iudícium et iustítiam tunc cum bene erat ei?
  "16": 'Iudicávit causam páuperis et egéni in bonum suum: numquid non ídeo quia cognóvit me, dicit Dóminus?'
  "17": Tui vero óculi et cor ad avarítiam, et ad sánguinem innocéntem fundéndum, et ad calúmniam, et ad cursum mali óperis.
  "18": 'Proptérea hæc dicit Dóminus ad Ióakim, fílium Iosíæ, regem Iuda: Non plangent eum: Væ frater et væ soror: non concrepábunt ei: Væ dómine, et væ ínclyte.'
  "19": Sepultúra ásini sepeliétur, putrefáctus et proiéctus extra portas Ierúsalem.
  "20": 'Ascénde Líbanum, et clama, et in Basan da vocem tuam: et clama ad transeúntes, quia contríti sunt omnes amatóres tui.'
  "21": 'Locútus sum ad te in abundántia tua, et dixísti: Non áudiam: hæc est via tua ab adolescéntia tua, quia non audísti vocem meam.'
  "22": 'Omnes pastóres tuos pascet ventus, et amatóres tui in captivitátem ibunt: et tunc confundéris, et erubésces ab omni malítia tua.'
  "23": Quæ sedes in Líbano, et nidíficas in cedris, quómodo congemuísti cum veníssent tibi dolóres, quasi dolóres parturiéntis?
  "24": 'Vivo ego, dicit Dóminus: quia si fúerit Iechonías fílius Ióakim regis Iuda, ánnulus in manu déxtera mea, inde evéllam eum.'
  "25": Et dabo te in manu quæréntium ánimam tuam, et in manu quorum tu formídas fáciem, et in manu Nabuchodónosor regis Babylónis, et in manu Chaldæórum.
  "26": 'Et mittam te, et matrem tuam, quæ génuit te, in terram aliénam, in qua nati non estis, ibíque moriémini:'
  "27": et in terram, ad quam ipsi levant ánimam suam ut revertántur illuc, non reverténtur.
  "28": Numquid vas fíctile atque contrítum vir iste Iechonías? numquid vas absque omni voluptáte? quare abiécti sunt ipse et semen eius, et proiécti in terram, quam ignoravérunt?
  "29": Terra, terra, terra, audi sermónem Dómini.
  "30": 'Hæc dicit Dóminus: Scribe virum istum stérilem, virum, qui in diébus suis non prosperábitur: nec enim erit de sémine eius vir, qui sédeat super sólium David, et potestátem hábeat ultra in Iuda.'
