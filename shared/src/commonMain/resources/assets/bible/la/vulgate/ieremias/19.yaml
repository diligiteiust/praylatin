bible: vulgate
lang: la
language: Latina
book: Ieremias
chapter: "19"
verses:
  "1": 'Hæc dicit Dóminus: Vade, et áccipe lagúnculam fíguli tésteam a senióribus pópuli, et a senióribus sacerdótum:'
  "2": 'et egrédere ad vallem fílii Ennom, quæ est iuxta intróitum portæ fíctilis: et prædicábis ibi verba, quæ ego loquar ad te.'
  "3": 'Et dices: Audíte verbum Dómini reges Iuda, et habitatóres Ierúsalem: hæc dicit Dóminus exercítuum, Deus Israel: Ecce ego indúcam afflictiónem super locum istum, ita ut omnis qui audíerit illam, tínniant aures eius:'
  "4": 'eo quod derelíquerint me, et aliénum fécerint locum istum: et libavérunt in eo diis aliénis, quos nesciérunt, ipsi et patres eórum, et reges Iuda: et replevérunt locum istum sánguine innocéntum.'
  "5": 'Et ædificavérunt excélsa Báalim ad comburéndos fílios suos igni in holocáustum Báalim: quæ non præcépi, nec locútus sum, nec ascendérunt in cor meum.'
  "6": 'Proptérea ecce dies véniunt, dicit Dóminus: et non vocábitur ámplius locus iste Topheth, et Vallis fílii Ennom, sed Vallis occisiónis.'
  "7": 'Et dissipábo consílium Iuda et Ierúsalem in loco isto: et subvértam eos gládio in conspéctu inimicórum suórum, et in manu quæréntium ánimas eórum: et dabo cadávera eórum escam volatílibus cæli, et béstiis terræ.'
  "8": 'Et ponam civitátem hanc in stupórem, et in síbilum: omnis, qui præteríerit per eam obstupéscet, et sibilábit super univérsa plaga eius.'
  "9": 'Et cibábo eos cárnibus filiórum suórum, et cárnibus filiárum suárum: et unusquísque carnem amíci sui cómedet in obsidióne, et in angústia, in qua conclúdent eos inimíci eórum, et qui quærunt ánimas eórum.'
  "10": 'Et cónteres lagúnculam in óculis virórum, qui ibunt tecum:'
  "11": 'et dices ad eos: Hæc dicit Dóminus exercítuum: Sic cónteram pópulum istum, et civitátem istam, sicut contéritur vas fíguli, quod non potest ultra instaurári: et in Topheth sepeliéntur, eo quod non sit álius locus ad sepeliéndum.'
  "12": Sic fáciam loco huic, ait Dóminus, et habitatóribus eius, et ponam civitátem istam sicut Topheth.
  "13": 'Et erunt domus Ierúsalem, et domus regum Iuda, sicut locus Topheth, immúndæ: omnes domus, in quarum domátibus sacrificavérunt omni milítiæ cæli, et libavérunt libámina diis aliénis.'
  "14": 'Venit autem Ieremías de Topheth, quo míserat eum Dóminus ad prophetándum, et stetit in átrio domus Dómini, et dixit ad omnem pópulum:'
  "15": 'Hæc dicit Dóminus exercítuum, Deus Israel: Ecce ego indúcam super civitátem hanc, et super omnes urbes eius, univérsa mala, quæ locútus sum advérsum eam: quóniam induravérunt cervícem suam ut non audírent sermónes meos.'
