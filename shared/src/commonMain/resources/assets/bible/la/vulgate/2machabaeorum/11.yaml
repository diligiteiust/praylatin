bible: vulgate
lang: la
language: Latina
book: II Machabaeorum
chapter: "11"
verses:
  "1": Sed parvo post témpore, Lýsias procurátor regis, et propínquus, ac negotiórum præpósitus, gráviter ferens de his, quæ accíderant,
  "2": congregátis octogínta míllibus, et equitátu univérso, veniébat advérsus Iudǽos, exístimans se civitátem quidem captam géntibus habitáculum factúrum,
  "3": 'templum vero in pecúniæ quæstum, sicut cétera delúbra géntium, habitúrum, et per síngulos annos venále sacerdótium:'
  "4": nusquam recógitans Dei potestátem, sed mente effrenátus in multitúdine péditum, et in míllibus équitum, et in octogínta elephántis confidébat.
  "5": Ingréssus autem Iudǽam, et apprópians Bethsúræ, quæ erat in angústo loco, ab Ierosólyma intervállo quinque stadiórum, illud præsídium expugnábat.
  "6": Ut autem Machabǽus, et qui cum eo erant, cognovérunt expugnári præsídia, cum fletu et lácrymis rogábant Dóminum, et omnis turba simul, ut bonum ángelum mítteret ad salútem Israel.
  "7": Et ipse primus Machabǽus, sumptis armis, céteros adhortátus est simul secum perículum subíre, et ferre auxílium frátribus suis.
  "8": Cumque páriter prompto ánimo procéderent, Ierosólymis appáruit præcédens eos eques in veste cándida, armis áureis hastam vibrans.
  "9": 'Tunc omnes simul benedixérunt misericórdem Dóminum, et convaluérunt ánimis: non solum hómines, sed et béstias ferocíssimas, et muros férreos paráti penetráre.'
  "10": Ibant ígitur prompti, de cælo habéntes adiutórem, et miserántem super eos Dóminum.
  "11": 'Leónum autem more ímpetu irruéntes in hostes, prostravérunt ex eis úndecim míllia péditum, et équitum mille sexcéntos:'
  "12": univérsos autem in fugam vertérunt, plures autem ex eis vulneráti nudi evasérunt. Sed et ipse Lýsias túrpiter fúgiens evásit.
  "13": 'Et quia non insensátus erat, secum ipse réputans factam erga se diminutiónem, et intélligens invíctos esse Hebrǽos, omnipoténtis Dei auxílio inniténtes, misit ad eos:'
  "14": promisítque se consensúrum ómnibus, quæ iusta sunt, et regem compulsúrum amícum fíeri.
  "15": 'Annuit autem Machabǽus précibus Lýsiæ, in ómnibus utilitáti cónsulens: et quæcúmque Machabǽus scripsit Lýsiæ de Iudǽis, ea rex concéssit.'
  "16": 'Nam erant scriptæ Iudǽis epístolæ a Lýsia quidem hunc modum continéntes: Lýsias pópulo Iudæórum salútem.'
  "17": Ioánnes, et Abésalom, qui missi fúerant a vobis, tradéntes scripta, postulábant ut ea, quæ per illos significabántur, implérem.
  "18": 'Quæcúmque ígitur regi potuérunt perférri, expósui: et quæ res permittébat, concéssit.'
  "19": Si ígitur in negótiis fidem conservavéritis, et deínceps bonórum vobis causa esse tentábo.
  "20": De céteris autem per síngula verbo mandávi et istis, et his, qui a me missi sunt, cólloqui vobíscum.
  "21": Bene valéte. Anno centésimo, quadragésimo octávo mensis Dióscori, die vigésima et quarta.
  "22": 'Regis autem epístola ista continébat: Rex Antíochus Lýsiæ fratri salútem.'
  "23": Patre nostro inter deos transláto, nos voléntes eos, qui sunt in regno nostro sine tumúltu ágere, et rebus suis adhibére diligéntiam,
  "24": audívimus Iudǽos non consensísse patri meo ut transferréntur ad ritum Græcórum, sed tenére velle suum institútum, ac proptérea postuláre a nobis concédi sibi legítima sua.
  "25": Voléntes ígitur hanc quoque gentem quiétam esse, statuéntes iudicávimus templum restítui illis, ut ágerent secúndum suórum maiórum consuetúdinem.
  "26": 'Bene ígitur féceris, si míseris ad eos, et déxteram déderis: ut cógnita nostra voluntáte, bono ánimo sint, et utilitátibus própriis desérviant.'
  "27": 'Ad Iudǽos vero regis epístola talis erat: Rex Antíochus senátui Iudæórum, et céteris Iudǽis salútem.'
  "28": 'Si valétis, sic estis ut vólumus: sed et ipsi bene valémus.'
  "29": Adiit nos Meneláus, dicens velle vos descéndere ad vestros, qui sunt apud nos.
  "30": His ígitur, qui cómmeant usque ad diem trigésimum mensis Xánthici, damus dextras securitátis,
  "31": 'ut Iudǽi utántur cibis, et légibus suis, sicut et prius: et nemo eórum ullo modo moléstiam patiátur de his, quæ per ignorántiam gesta sunt.'
  "32": Mísimus autem et Meneláum, qui vos alloquátur.
  "33": Valéte. Anno centésimo quadragésimo octávo, Xánthici mensis quintadécima die.
  "34": 'Misérunt autem étiam Románi epístolam, ita se habéntem: Quintus Mémmius, et Titus Manílius legáti Romanórum, pópulo Iudæórum salútem.'
  "35": De his, quæ Lýsias cognátus regis concéssit vobis, et nos concéssimus.
  "36": 'De quibus autem ad regem iudicávit referéndum, conféstim áliquem míttite, diligéntius inter vos conferéntes, ut decernámus, sicut cóngruit vobis: nos enim Antiochíam accédimus.'
  "37": Ideóque festináte rescríbere, ut nos quoque sciámus cuius estis voluntátis.
  "38": Bene valéte. Anno centésimo quadragésimo octávo, quintadécima die mensis Xánthici.
