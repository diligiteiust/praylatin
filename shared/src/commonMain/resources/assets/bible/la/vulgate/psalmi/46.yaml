bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "46"
verses:
  "1": In finem, pro fíliis Core, Psalmus.
  "2": 'Omnes gentes pláudite mánibus: iubiláte Deo in voce exsultatiónis.'
  "3": 'Quóniam Dóminus excélsus, terríbilis: rex magnus super omnem terram.'
  "4": 'Subiécit pópulos nobis: et gentes sub pédibus nostris.'
  "5": 'Elégit nobis hereditátem suam: spéciem Iacob, quam diléxit.'
  "6": 'Ascéndit Deus in iúbilo: et Dóminus in voce tubæ.'
  "7": 'Psállite Deo nostro, psállite: psállite regi nostro, psállite.'
  "8": 'Quóniam rex omnis terræ Deus: psállite sapiénter.'
  "9": 'Regnábit Deus super gentes: Deus sedet super sedem sanctam suam.'
  "10": 'Príncipes populórum congregáti sunt cum Deo Abraham: quóniam dii fortes terræ veheménter eleváti sunt.'
