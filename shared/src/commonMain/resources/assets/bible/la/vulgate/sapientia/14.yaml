bible: vulgate
lang: la
language: Latina
book: Sapientia
chapter: "14"
verses:
  "1": Iterum álius navigáre cógitans, et per feros fluctus iter fácere incípiens, ligno portánte se, fragílius lignum ínvocat.
  "2": Illud enim cupíditas acquiréndi excogitávit, et ártifex sapiéntia fabricávit sua.
  "3": 'Tua autem, Pater, providéntia gubérnat: quóniam dedísti et in mari viam, et inter fluctus sémitam firmíssimam,'
  "4": osténdens quóniam potens es ex ómnibus salváre, étiam si sine arte áliquis ádeat mare.
  "5": Sed ut non essent vácua sapiéntiæ tuæ ópera, propter hoc étiam et exíguo ligno credunt hómines ánimas suas, et transeúntes mare per ratem liberáti sunt.
  "6": Sed et ab inítio cum perírent supérbi gigántes, spes orbis terrárum ad ratem confúgiens, remísit sǽculo semen nativitátis, quæ manu tua erat gubernáta.
  "7": Benedíctum est enim lignum, per quod fit iustítia.
  "8": 'Per manus autem quod fit idólum, maledíctum est et ipsum, et qui fecit illud: quia ille quidem operátus est, illud autem cum esset frágile, deus cognominátus est.'
  "9": Simíliter autem ódio sunt Deo ímpius, et impíetas eius.
  "10": Etenim quod factum est, cum illo, qui fecit, torménta patiétur.
  "11": Propter hoc et in idólis natiónum non erit respéctus, quóniam creatúræ Dei in ódium factæ sunt, et in tentatiónem animábus hóminum, et in muscípulam pédibus insipiéntium.
  "12": 'Inítium enim fornicatiónis est exquisítio idolórum, et adinvéntio illórum corrúptio vitæ est:'
  "13": neque enim erant ab inítio, neque erunt in perpétuum.
  "14": Supervacúitas enim hóminum hæc advénit in orbem terrárum, et ídeo brevis illórum finis est invéntus.
  "15": 'Acérbo enim luctu dolens pater, cito sibi rapti fílii fecit imáginem: et illum, qui tunc quasi homo mórtuus fúerat, nunc tamquam deum cólere cœpit, et constítuit inter servos suos sacra et sacrifícia.'
  "16": Deínde interveniénte témpore, convalescénte iníqua consuetúdine, hic error tamquam lex custodítus est, et tyrannórum império colebántur figménta.
  "17": 'Et hos, quos in palam hómines honoráre non póterant propter hoc quod longe essent, e longínquo figúra eórum alláta, evidéntem imáginem regis, quem honoráre volébant, fecérunt: ut illum, qui áberat, tamquam præséntem cólerent sua sollicitúdine.'
  "18": Provéxit autem ad horum cultúram et hos, qui ignorábant, artíficis exímia diligéntia.
  "19": Ille enim, volens placére illi, qui se assúmpsit, elaborávit arte sua ut similitúdinem in mélius figuráret.
  "20": Multitúdo autem hóminum, abdúcta per spéciem óperis, eum qui ante tempus tamquam homo honorátus fúerat, nunc deum æstimavérunt.
  "21": Et hæc fuit vitæ humánæ decéptio, quóniam aut afféctui aut régibus deserviéntes hómines, incommunicábile nomen lapídibus et lignis imposuérunt.
  "22": Et non suffécerat errásse eos circa Dei sciéntiam, sed et in magno vivéntes insciéntiæ bello, tot et tam magna mala pacem appéllant.
  "23": Aut enim fílios suos sacrificántes, aut obscúra sacrifícia faciéntes, aut insániæ plenas vigílias habéntes,
  "24": 'neque vitam, neque núptias mundas iam custódiunt: sed álius álium per invídiam occídit, aut adúlterans contrístat,'
  "25": 'et ómnia commísta sunt: sanguis, homicídium, furtum et fíctio, corrúptio et infidélitas, turbátio et periúrium, tumúltus bonórum,'
  "26": Dei immemorátio, animárum inquinátio, nativitátis immutátio, nuptiárum inconstántia, inordinátio mœchíæ et impudicítiæ.
  "27": Infandórum enim idolórum cultúra, omnis mali causa est, et inítium et finis.
  "28": 'Aut enim dum lætántur, insániunt: aut certe vaticinántur falsa, aut vivunt iniúste, aut péierant cito.'
  "29": Dum enim confídunt in idólis, quæ sine ánima sunt, male iurántes nocéri se non sperant.
  "30": Utraque ergo illis evénient digne, quóniam male sensérunt de Deo, attendéntes idólis, et iuravérunt iniúste, in dolo contemnéntes iustítiam.
  "31": Non enim iuratórum virtus, sed peccántium pœna, perámbulat semper iniustórum prævaricatiónem.
