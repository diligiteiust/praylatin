bible: vulgate
lang: la
language: Latina
book: Proverbia
chapter: "15"
verses:
  "1": 'Respónsio mollis frangit iram: sermo durus súscitat furórem.'
  "2": 'Lingua sapiéntium ornat sciéntiam: os fatuórum ebúllit stultítiam.'
  "3": In omni loco, óculi Dómini contemplántur bonos et malos.
  "4": 'Lingua placábilis, lignum vitæ: quæ autem immoderáta est, cónteret spíritum.'
  "5": 'Stultus irrídet disciplínam patris sui: qui autem custódit increpatiónes astútior fiet. In abundánti iustítia virtus máxima est: cogitatiónes autem impiórum eradicabúntur.'
  "6": 'Domus iusti plúrima fortitúdo: et in frúctibus ímpii conturbátio.'
  "7": 'Lábia sapiéntium disseminábunt sciéntiam: cor stultórum dissímile erit.'
  "8": 'Víctimæ impiórum abominábiles Dómino: vota iustórum placabília.'
  "9": 'Abominátio est Dómino via ímpii: qui séquitur iustítiam dilígitur ab eo.'
  "10": 'Doctrína mala deserénti viam vitæ: qui increpatiónes odit, moriétur.'
  "11": 'Inférnus et perdítio coram Dómino: quanto magis corda filiórum hóminum?'
  "12": 'Non amat péstilens eum, qui se córripit: nec ad sapiéntes gráditur.'
  "13": 'Cor gaudens exhílarat fáciem: in mœróre ánimi deícitur spíritus.'
  "14": 'Cor sapiéntis quærit doctrínam: et os stultórum páscitur imperítia.'
  "15": 'Omnes dies páuperis, mali: secúra mens quasi iuge convívium.'
  "16": Mélius est parum cum timóre Dómini, quam thesáuri magni et insatiábiles.
  "17": Mélius est vocári ad ólera cum caritáte, quam ad vítulum saginátum cum ódio.
  "18": 'Vir iracúndus próvocat rixas: qui pátiens est mítigat suscitátas.'
  "19": 'Iter pigrórum quasi sepes spinárum: via iustórum absque offendículo.'
  "20": 'Fílius sápiens lætíficat patrem: et stultus homo déspicit matrem suam.'
  "21": 'Stultítia gáudium stulto: et vir prudens dírigit gressus suos.'
  "22": 'Dissipántur cogitatiónes ubi non est consílium: ubi vero sunt plures consiliárii, confirmántur.'
  "23": 'Lætátur homo in senténtia oris sui: et sermo opportúnus est óptimus.'
  "24": Sémita vitæ super erudítum, ut declínet de inférno novíssimo.
  "25": 'Domum superbórum demoliétur Dóminus: et firmos fáciet términos víduæ.'
  "26": 'Abominátio Dómini cogitatiónes malæ: et purus sermo pulchérrimus firmábitur ab eo.'
  "27": 'Contúrbat domum suam qui sectátur avarítiam: qui autem odit múnera, vivet. Per misericórdiam et fidem purgántur peccáta: per timórem autem Dómini declínat omnis a malo.'
  "28": 'Mens iusti meditátur obediéntiam: os impiórum redúndat malis.'
  "29": 'Longe est Dóminus ab ímpiis: et oratiónes iustórum exáudiet.'
  "30": 'Lux oculórum lætíficat ánimam: fama bona impínguat ossa.'
  "31": Auris, quæ audit increpatiónes vitæ, in médio sapiéntium commorábitur.
  "32": 'Qui ábicit disciplínam, déspicit ánimam suam: qui autem acquiéscit increpatiónibus, posséssor est cordis.'
  "33": 'Timor Dómini disciplína sapiéntiæ: et glóriam præcédit humílitas.'
