bible: vulgate
lang: la
language: Latina
book: Isaias
chapter: "65"
verses:
  "1": 'Quæsiérunt me qui ante non interrogábant, invenérunt qui non quæsiérunt me: dixi: Ecce ego, ecce ego, ad gentem quæ non invocábat nomen meum.'
  "2": Expándi manus meas tota die ad pópulum incrédulum, qui gráditur in via non bona post cogitatiónes suas.
  "3": 'Pópulus qui ad iracúndiam próvocat me ante fáciem meam semper: qui ímmolant in hortis, et sacríficant super láteres:'
  "4": 'qui hábitant in sepúlcris, et in delúbris idolórum dórmiunt: qui cómedunt carnem suíllam, et ius profánum in vasis eórum:'
  "5": 'qui dicunt: Recéde a me, non appropínques mihi, quia immúndus es: isti fumus erunt in furóre meo, ignis ardens tota die.'
  "6": 'Ecce scriptum est coram me: non tacébo, sed reddam, et retríbuam in sinum eórum.'
  "7": 'Iniquitátes vestras, et iniquitátes patrum vestrórum simul, dicit Dóminus: qui sacrificavérunt super montes, et super colles exprobravérunt mihi: et remétiar opus eórum primum in sinu eórum.'
  "8": 'Hæc dicit Dóminus: Quómodo si inveniátur granum in botro, et dicátur: Ne díssipes illud, quóniam benedíctio est: sic fáciam propter servos meos, ut non dispérdam totum.'
  "9": 'Et edúcam de Iacob semen, et de Iuda possidéntem montes meos: et hereditábunt eam elécti mei, et servi mei habitábunt ibi.'
  "10": Et erunt campéstria in caulas gregum, et vallis Achor in cubíle armentórum pópulo meo qui requisiérunt me.
  "11": Et vos, qui dereliquístis Dóminum, qui oblíti estis montem sanctum meum, qui pónitis fortúnæ mensam, et libátis super eam,
  "12": 'numerábo vos in gládio, et omnes in cæde corruétis: pro eo quod vocávi, et non respondístis: locútus sum, et non audístis: et faciebátis malum in óculis meis, et quæ nólui elegístis.'
  "13": 'Propter hoc, hæc dicit Dóminus Deus: Ecce servi mei cómedent, et vos esuriétis: ecce servi mei bibent, et vos sitiétis:'
  "14": 'ecce servi mei lætabúntur, et vos confundémini: ecce servi mei laudábunt præ exsultatióne cordis, et vos clamábitis præ dolóre cordis, et præ contritióne spíritus ululábitis.'
  "15": 'Et dimittétis nomen vestrum in iuraméntum eléctis meis: et interfíciet te Dóminus Deus, et servos suos vocábit nómine álio.'
  "16": 'In quo qui benedíctus est super terram, benedicétur in Deo amen: et qui iurat in terra, iurábit in Deo amen: quia oblivióni tráditæ sunt angústiæ prióres, et quia abscónditæ sunt ab óculis meis.'
  "17": 'Ecce enim ego creo cælos novos, et terram novam: et non erunt in memória prióra, et non ascéndent super cor.'
  "18": 'Sed gaudébitis et exsultábitis usque in sempitérnum in his, quæ ego creo: quia ecce ego creo Ierúsalem exsultatiónem, et pópulum eius gáudium.'
  "19": 'Et exsultábo in Ierúsalem, et gaudébo in pópulo meo: et non audiétur in eo ultra vox fletus et vox clamóris.'
  "20": 'Non erit ibi ámplius infans diérum, et senex qui non ímpleat dies suos: quóniam puer centum annórum moriétur, et peccátor centum annórum maledíctus erit.'
  "21": 'Et ædificábunt domos, et habitábunt: et plantábunt víneas, et cómedent fructus eárum.'
  "22": 'Non ædificábunt, et álius habitábit: non plantábunt, et álius cómedet: secúndum enim dies ligni erunt dies pópuli mei, et ópera mánuum eórum inveterábunt.'
  "23": Elécti mei non laborábunt frustra, neque generábunt in conturbatióne, quia semen benedictórum Dómini est, et nepótes eórum cum eis.
  "24": 'Erítque ántequam clament, ego exáudiam: adhuc illis loquéntibus, ego áudiam.'
  "25": 'Lupus et agnus pascéntur simul, leo et bos cómedent páleas: et serpénti pulvis panis eius: non nocébunt, neque occídent in omni monte sancto meo, dicit Dóminus.'
