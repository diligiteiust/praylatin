bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "70"
verses:
  "1": 'Psalmus David, Filiórum Iónadab, et priórum captivórum. In te Dómine sperávi, non confúndar in ætérnum:'
  "2": in iustítia tua líbera me, et éripe me. Inclína ad me aurem tuam, et salva me.
  "3": 'Esto mihi in Deum protectórem, et in locum munítum: ut salvum me fácias, quóniam firmaméntum meum, et refúgium meum es tu.'
  "4": 'Deus meus éripe me de manu peccatóris, et de manu contra legem agéntis et iníqui:'
  "5": 'quóniam tu es patiéntia mea Dómine: Dómine spes mea a iuventúte mea.'
  "6": 'In te confirmátus sum ex útero: de ventre matris meæ tu es protéctor meus. In te cantátio mea semper:'
  "7": 'tamquam prodígium factus sum multis: et tu adiútor fortis.'
  "8": 'Repleátur os meum laude, ut cantem glóriam tuam: tota die magnitúdinem tuam.'
  "9": 'Ne proícias me in témpore senectútis: cum defécerit virtus mea, ne derelínquas me.'
  "10": 'Quia dixérunt inimíci mei mihi: et qui custodiébant ánimam meam, consílium fecérunt in unum,'
  "11": 'dicéntes: Deus derelíquit eum, persequímini et comprehéndite eum: quia non est qui erípiat.'
  "12": 'Deus ne elongéris a me: Deus meus in auxílium meum réspice.'
  "13": 'Confundántur et defíciant detrahéntes ánimæ meæ: operiántur confusióne, et pudóre, qui quærunt mala mihi.'
  "14": 'Ego autem semper sperábo: et adíciam super omnem laudem tuam.'
  "15": Os meum annuntiábit iustítiam tuam, tota die salutáre tuum. Quóniam non cognóvi litteratúram,
  "16": 'introíbo in poténtias Dómini: Dómine memorábor iustítiæ tuæ solíus.'
  "17": 'Deus docuísti me a iuventúte mea: et usque nunc pronuntiábo mirabília tua.'
  "18": 'Et usque in senéctam et sénium: Deus ne derelínquas me, donec annúntiem bráchium tuum generatióni omni, quæ ventúra est: poténtiam tuam,'
  "19": 'et iustítiam tuam Deus usque in altíssima, quæ fecísti magnália: Deus quis símilis tibi?'
  "20": 'Quantas ostendísti mihi tribulatiónes multas, et malas: et convérsus vivificásti me: et de abýssis terræ íterum reduxísti me.'
  "21": 'Multiplicásti magnificéntiam tuam: et convérsus consolátus es me.'
  "22": 'Nam et ego confitébor tibi in vasis psalmi veritátem tuam: Deus psallam tibi in cíthara, sanctus Israel.'
  "23": 'Exsultábunt lábia mea cum cantávero tibi: et ánima mea, quam redemísti.'
  "24": 'Sed et lingua mea tota die meditábitur iustítiam tuam: cum confúsi et revériti fúerint qui quærunt mala mihi.'
