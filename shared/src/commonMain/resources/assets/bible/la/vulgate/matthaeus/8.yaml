bible: vulgate
lang: la
language: Latina
book: Matthaeus
chapter: "8"
verses:
  "1": 'Cum autem descendísset de monte, secútæ sunt eum turbæ multæ:'
  "2": 'et ecce leprósus véniens, adorábat eum, dicens: Dómine, si vis, potes me mundáre.'
  "3": 'Et exténdens Iesus manum, tétigit eum, dicens: Volo. Mundáre. Et conféstim mundáta est lepra eius.'
  "4": 'Et ait illi Iesus: Vide, némini díxeris: sed vade, osténde te sacerdóti, et offer munus, quod præcépit Móyses, in testimónium illis.'
  "5": Cum autem introísset Caphárnaum, accéssit ad eum centúrio, rogans eum,
  "6": 'et dicens: Dómine, puer meus iacet in domo paralýticus, et male torquétur.'
  "7": 'Et ait illi Iesus: Ego véniam, et curábo eum.'
  "8": 'Et respóndens centúrio, ait: Dómine, non sum dignus ut intres sub tectum meum: sed tantum dic verbo, et sanábitur puer meus.'
  "9": 'Nam et ego homo sum sub potestáte constitútus, habens sub me mílites, et dico huic: Vade, et vadit: et álii: Veni, et venit: et servo meo: Fac hoc, et facit.'
  "10": 'Audiens autem Iesus mirátus est, et sequéntibus se dixit: Amen dico vobis, non invéni tantam fidem in Israel.'
  "11": 'Dico autem vobis, quod multi ab oriénte et occidénte vénient, et recúmbent cum Abraham, et Isaac, et Iacob in regno cælórum:'
  "12": 'fílii autem regni eiciéntur in ténebras exterióres: ibi erit fletus, et stridor déntium.'
  "13": 'Et dixit Iesus centurióni: Vade, et sicut credidísti, fiat tibi. Et sanátus est puer in illa hora.'
  "14": 'Et cum venísset Iesus in domum Petri, vidit socrum eius iacéntem, et febricitántem:'
  "15": et tétigit manum eius, et dimísit eam febris, et surréxit, et ministrábat eis.
  "16": 'Véspere autem facto, obtulérunt ei multos dæmónia habéntes: et eiciébat spíritus verbo, et omnes male habéntes curávit:'
  "17": 'ut adimplerétur quod dictum est per Isaíam prophétam, dicéntem: Ipse infirmitátes nostras accépit: et ægrotatiónes nostras portávit.'
  "18": Videns autem Iesus turbas multas circum se, iussit ire trans fretum.
  "19": 'Et accédens unus scriba, ait illi: Magíster, sequar te, quocúmque íeris.'
  "20": 'Et dicit ei Iesus: Vulpes fóveas habent, et vólucres cæli nidos: Fílius autem hóminis non habet ubi caput reclínet.'
  "21": 'Alius autem de discípulis eius ait illi: Dómine, permítte me primum ire, et sepelíre patrem meum.'
  "22": 'Iesus autem ait illi: Séquere me, et dimítte mórtuos sepelíre mórtuos suos.'
  "23": 'Et ascendénte eo in navículam, secúti sunt eum discípuli eius:'
  "24": 'et ecce motus magnus factus est in mari, ita ut navícula operirétur flúctibus: ipse vero dormiébat.'
  "25": 'Et accessérunt ad eum discípuli eius, et suscitavérunt eum, dicéntes: Dómine, salva nos, perímus.'
  "26": 'Et dicit eis Iesus: Quid tímidi estis, módicæ fídei? Tunc surgens imperávit ventis, et mari, et facta est tranquíllitas magna.'
  "27": 'Porro hómines miráti sunt, dicéntes: Qualis est hic, quia venti et mare obédiunt ei?'
  "28": Et cum venísset trans fretum in regiónem Gerasenórum, occurrérunt ei duo habéntes dæmónia, de monuméntis exeúntes, sævi nimis, ita ut nemo posset transíre per viam illam.
  "29": 'Et ecce clamavérunt, dicéntes: Quid nobis, et tibi, Iesu fili Dei? Venísti huc ante tempus torquére nos?'
  "30": Erat autem non longe ab illis grex multórum porcórum pascens.
  "31": 'Dǽmones autem rogábant eum, dicéntes: Si éicis nos hinc, mitte nos in gregem porcórum.'
  "32": 'Et ait illis: Ite. At illi exeúntes abiérunt in porcos, et ecce ímpetu ábiit totus grex per præceps in mare: et mórtui sunt in aquis.'
  "33": 'Pastóres autem fugérunt: et veniéntes in civitátem, nuntiavérunt ómnia, et de eis, qui dæmónia habúerant.'
  "34": 'Et ecce tota cívitas éxiit óbviam Iesu: et viso eo rogábant, ut transíret a fínibus eórum.'
