bible: vulgate
lang: la
language: Latina
book: Proverbia
chapter: "19"
verses:
  "1": Mélior est pauper qui ámbulat in simplicitáte sua, quam dives torquens lábia sua, et insípiens.
  "2": 'Ubi non est sciéntia ánimæ, non est bonum: et qui festínus est pédibus, offéndet.'
  "3": 'Stultítia hóminis supplántat gressus eius: et contra Deum fervet ánimo suo.'
  "4": 'Divítiæ addunt amícos plúrimos: a páupere autem et hi, quos hábuit, separántur.'
  "5": 'Testis falsus non erit impunítus: et qui mendácia lóquitur, non effúgiet.'
  "6": Multi colunt persónam poténtis, et amíci sunt dona tribuéntis.
  "7": 'Fratres hóminis páuperis odérunt eum: ínsuper et amíci procul recessérunt ab eo. Qui tantum verba sectátur, nihil habébit:'
  "8": qui autem posséssor est mentis, díligit ánimam suam, et custos prudéntiæ invéniet bona.
  "9": Falsus testis non erit impunítus, et qui lóquitur mendácia períbit.
  "10": Non decent stultum delíciæ, nec servum dominári princípibus.
  "11": 'Doctrína viri per patiéntiam nóscitur: et glória eius est iníqua prætérgredi.'
  "12": 'Sicut frémitus leónis, ita et regis ira: et sicut ros super herbam, ita et hiláritas eius.'
  "13": 'Dolor patris, fílius stultus: et tecta iúgiter perstillántia, litigiósa múlier.'
  "14": 'Domus, et divítiæ dantur a paréntibus: a Dómino autem próprie uxor prudens.'
  "15": Pigrédo immíttit sopórem, et ánima dissolúta esúriet.
  "16": 'Qui custódit mandátum, custódit ánimam suam: qui autem négligit viam suam, mortificábitur.'
  "17": 'Fœnerátur Dómino, qui miserétur páuperis: et vicissitúdinem suam reddet ei.'
  "18": 'Erudi fílium tuum, ne despéres: ad interfectiónem autem eius ne ponas ánimam tuam.'
  "19": 'Qui impátiens est, sustinébit damnum: et cum rapúerit, áliud appónet.'
  "20": Audi consílium, et súscipe disciplínam, ut sis sápiens in novíssimis tuis.
  "21": 'Multæ cogitatiónes in corde viri: volúntas autem Dómini permanébit.'
  "22": 'Homo índigens miséricors est: et mélior est pauper, quam vir mendax.'
  "23": 'Timor Dómini ad vitam: et in plenitúdine commorábitur, absque visitatióne péssima.'
  "24": Abscóndit piger manum suam sub ascélla, nec ad os suum ápplicat eam.
  "25": 'Pestilénte flagelláto stultus sapiéntior erit: si autem corripúeris sapiéntem, intélliget disciplínam.'
  "26": Qui afflígit patrem, et fugat matrem, ignominiósus est et infélix.
  "27": Non cesses fili audíre doctrínam, nec ignóres sermónes sciéntiæ.
  "28": 'Testis iníquus derídet iudícium: et os impiórum dévorat iniquitátem.'
  "29": 'Paráta sunt derisóribus iudícia: et mállei percutiéntes stultórum corpóribus.'
