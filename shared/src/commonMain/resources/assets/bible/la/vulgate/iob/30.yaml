bible: vulgate
lang: la
language: Latina
book: Iob
chapter: "30"
verses:
  "1": 'Nunc autem derídent me iunióres témpore, quorum non dignábar patres pónere cum cánibus gregis mei:'
  "2": quorum virtus mánuum mihi erat pro níhilo, et vita ipsa putabántur indígni.
  "3": Egestáte et fame stériles, qui rodébant in solitúdine, squalléntes calamitáte et miséria.
  "4": Et mandébant herbas, et árborum córtices, et radix iuniperórum erat cibus eórum.
  "5": Qui de convállibus ista rapiéntes, cum síngula reperíssent, ad ea cum clamóre currébant.
  "6": In desértis habitábant torréntium, et in cavérnis terræ, vel super gláream.
  "7": Qui inter huiuscémodi lætabántur, et esse sub séntibus delícias computábant.
  "8": Fílii stultórum et ignobílium, et in terra pénitus non paréntes.
  "9": Nunc in eórum cánticum versus sum, et factus sum eis in provérbium.
  "10": Abominántur me, et longe fúgiunt a me, et fáciem meam conspúere non veréntur.
  "11": Pháretram enim suam apéruit, et afflíxit me, et frenum pósuit in os meum.
  "12": 'Ad déxteram oriéntis calamitátes meæ íllico surrexérunt: pedes meos subvertérunt, et oppressérunt quasi flúctibus sémitis suis.'
  "13": Dissipavérunt itínera mea, insidiáti sunt mihi, et prævaluérunt, et non fuit qui ferret auxílium.
  "14": Quasi rupto muro, et apérta iánua, irruérunt super me, et ad meas misérias devolúti sunt.
  "15": 'Redáctus sum in níhilum: abstulísti quasi ventus desidérium meum: et velut nubes pertránsiit salus mea.'
  "16": Nunc autem in memetípso marcéscit ánima mea, et póssident me dies afflictiónis.
  "17": 'Nocte os meum perforátur dolóribus: et qui me cómedunt, non dórmiunt.'
  "18": In multitúdine eórum consúmitur vestiméntum meum, et quasi cápito túnicæ succinxérunt me.
  "19": Comparátus sum luto, et assimilátus sum favíllæ et cíneri.
  "20": 'Clamo ad te, et non exáudis me: sto, et non réspicis me.'
  "21": Mutátus es mihi in crudélem, et in durítia manus tuæ adversáris mihi.
  "22": Elevásti me, et quasi super ventum ponens elisísti me válide.
  "23": Scio quia morti trades me, ubi constitúta est domus omni vivénti.
  "24": 'Verúmtamen non ad consumptiónem eórum emíttis manum tuam: et si corrúerint, ipse salvábis.'
  "25": Flebam quondam super eo, qui afflíctus erat, et compatiebátur ánima mea páuperi.
  "26": 'Exspectábam bona, et venérunt mihi mala: præstolábar lucem, et erupérunt ténebræ.'
  "27": Interióra mea efferbuérunt absque ulla réquie, prævenérunt me dies afflictiónis.
  "28": 'Mœrens incedébam, sine furóre: consúrgens, in turba clamábam.'
  "29": Frater fui dracónum, et sócius struthiónum.
  "30": Cutis mea denigráta est super me, et ossa mea aruérunt præ cáumate.
  "31": Versa est in luctum cíthara mea, et órganum meum in vocem fléntium.
