bible: vulgate
lang: la
language: Latina
book: II Regum
chapter: "24"
verses:
  "1": 'In diébus eius ascéndit Nabuchodónosor rex Babylónis, et factus est ei Ióakim servus tribus annis: et rursum rebellávit contra eum.'
  "2": 'Immisítque ei Dóminus latrúnculos Chaldæórum, et latrúnculos Sýriæ, et latrúnculos Moab, et latrúnculos filiórum Ammon: et immísit eos in Iudam ut dispérderent eum, iuxta verbum Dómini, quod locútus fúerat per servos suos prophétas.'
  "3": Factum est autem hoc per verbum Dómini contra Iudam, ut auférret eum coram se propter peccáta Manásse univérsa quæ fecit,
  "4": 'et propter sánguinem innóxium, quem effúdit, et implévit Ierúsalem cruóre innocéntium: et ob hanc rem nóluit Dóminus propitiári.'
  "5": 'Réliqua autem sermónum Ióakim, et univérsa quæ fecit, nonne hæc scripta sunt in Libro sermónum diérum regum Iuda? Et dormívit Ióakim cum pátribus suis:'
  "6": et regnávit Ióachin fílius eius pro eo.
  "7": 'Et ultra non áddidit rex Ægýpti, ut egrederétur de terra sua: túlerat enim rex Babylónis, a rivo Ægýpti usque ad flúvium Euphráten, ómnia quæ fúerant regis Ægýpti.'
  "8": 'Decem et octo annórum erat Ióachin cum regnáre cœpísset, et tribus ménsibus regnávit in Ierúsalem: nomen matris eius Nohésta fília Elnathan de Ierúsalem.'
  "9": Et fecit malum coram Dómino, iuxta ómnia quæ fécerat pater eius.
  "10": In témpore illo ascendérunt servi Nabuchodónosor regis Babylónis in Ierúsalem, et circúmdata est urbs munitiónibus.
  "11": Venítque Nabuchodónosor rex Babylónis ad civitátem cum servis suis ut oppugnárent eam.
  "12": 'Egressúsque est Ióachin rex Iuda ad regem Babylónis, ipse et mater eius, et servi eius, et príncipes eius, et eunúchi eius: et suscépit eum rex Babylónis anno octávo regni sui.'
  "13": 'Et prótulit inde omnes thesáuros domus Dómini, et thesáuros domus régiæ: et concídit univérsa vasa áurea, quæ fécerat Sálomon rex Israel in templo Dómini iuxta verbum Dómini.'
  "14": 'Et tránstulit omnem Ierúsalem, et univérsos príncipes, et omnes fortes exércitus, decem míllia, in captivitátem, et omnem artíficem et clusórem: nihílque relíctum est, excéptis paupéribus pópuli terræ.'
  "15": 'Tránstulit quoque Ióachin in Babylónem, et matrem regis, et uxóres regis, et eunúchos eius: et iúdices terræ duxit in captivitátem de Ierúsalem in Babylónem.'
  "16": 'Et omnes viros robústos, septem míllia, et artífices, et clusóres mille, omnes viros fortes et bellatóres: duxítque eos rex Babylónis captívos in Babylónem.'
  "17": 'Et constítuit Matthaníam pátruum eius pro eo: imposuítque nomen ei Sedecíam.'
  "18": 'Vigésimum et primum annum ætátis habébat Sedecías cum regnáre cœpísset, et úndecim annis regnávit in Ierúsalem: nomen matris eius erat Amítal fília Ieremíæ de Lobna.'
  "19": Et fecit malum coram Dómino, iuxta ómnia quæ fécerat Ióakim.
  "20": 'Irascebátur enim Dóminus contra Ierúsalem et contra Iudam, donec proíceret eos a fácie sua: recessítque Sedecías a rege Babylónis.'
