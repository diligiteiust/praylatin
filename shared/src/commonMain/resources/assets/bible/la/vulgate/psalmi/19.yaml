bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "19"
verses:
  "1": In finem. Psalmus David.
  "2": 'Exáudiat te Dóminus in die tribulatiónis: prótegat te nomen Dei Iacob.'
  "3": 'Mittat tibi auxílium de sancto: et de Sion tueátur te.'
  "4": 'Memor sit omnis sacrifícii tui: et holocáustum tuum pingue fiat.'
  "5": 'Tríbuat tibi secúndum cor tuum: et omne consílium tuum confírmet.'
  "6": 'Lætábimur in salutári tuo: et in nómine Dei nostri magnificábimur.'
  "7": 'Impleat Dóminus omnes petitiónes tuas: nunc cognóvi quóniam salvum fecit Dóminus Christum suum. Exáudiet illum de cælo sancto suo: in potentátibus salus déxteræ eius.'
  "8": 'Hi in cúrribus, et hi in equis: nos autem in nómine Dómini Dei nostri invocábimus.'
  "9": 'Ipsi obligáti sunt, et cecidérunt: nos autem surréximus, et erécti sumus.'
  "10": 'Dómine salvum fac regem: et exáudi nos in die, qua invocavérimus te.'
