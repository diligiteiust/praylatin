bible: vulgate
lang: la
language: Latina
book: I Paralipomenon
chapter: "12"
verses:
  "1": Hi quoque venérunt ad David in Síceleg, cum adhuc fúgeret Saul fílium Cis, qui erant fortíssimi et egrégii pugnatóres,
  "2": 'tendéntes arcum, et utráque manu fundis saxa iaciéntes, et dirigéntes sagíttas: de frátribus Saul ex Béniamin.'
  "3": Princeps Ahiézer, et Ioas fílii Sámaa Gabaathítes, et Iáziel, et Phallet fílii Azmoth, et Báracha, et Iehu Anathotítes.
  "4": Samaías quoque Gabaonítes fortíssimus inter trigínta et super trigínta. Ieremías, et Iehéziel, et Ióhanan, et Iézabad Gaderothítes.
  "5": Et Elúzai, et Iérimuth, et Baalía, et Samaría, et Saphatía Haruphítes.
  "6": 'Elcana, et Iesía, et Azáreel, et Ioézer, et Iésbaam de Cárehim:'
  "7": Ioéla quoque, et Zabadía fílii Iéroham de Gedor.
  "8": 'Sed et de Gaddi transfugérunt ad David cum latéret in desérto, viri robustíssimi, et pugnatóres óptimi, tenéntes clýpeum et hastam: fácies eórum quasi fácies leónis, et velóces quasi cápreæ in móntibus:'
  "9": Ezer princeps, Obdías secúndus, Eliab tértius,
  "10": Másmana quartus, Ieremías quintus,
  "11": Ethi sextus, Eliel séptimus,
  "12": Ióhanan octávus, Elzebad nonus,
  "13": Ieremías décimus, Machbánai undécimus.
  "14": 'Hi de fíliis Gad príncipes exércitus: novíssimus centum milítibus prǽerat, et máximus mille.'
  "15": 'Isti sunt qui transiérunt Iordánem mense primo, quando inundáre consuévit super ripas suas: et omnes fugavérunt qui morabántur in vállibus ad orientálem plagam et occidentálem.'
  "16": Venérunt autem et de Béniamin, et de Iuda ad præsídium, in quo morabátur David.
  "17": 'Egressúsque est David óbviam eis, et ait: Si pacífice venístis ad me ut auxiliémini mihi, cor meum iungátur vobis: si autem insidiámini mihi pro adversáriis meis, cum ego iniquitátem in mánibus non hábeam, vídeat Deus patrum nostrórum, et iúdicet.'
  "18": 'Spíritus vero índuit Amásai príncipem inter trigínta, et ait: Tui sumus, o David, et tecum fili Isai. Pax, pax tibi, et pax adiutóribus tuis: te enim ádiuvat Deus tuus. Suscépit ergo eos David, et constítuit príncipes turmæ.'
  "19": 'Porro de Manásse transfugérunt ad David, quando veniébat cum Philísthiim advérsus Saul ut pugnáret: et non dimicávit cum eis, quia ínito consílio remisérunt eum príncipes Philisthinórum, dicéntes: Perículo cápitis nostri revertétur ad dóminum suum Saul.'
  "20": Quando ígitur revérsus est in Síceleg, transfugérunt ad eum de Manásse, Ednas, et Iózabad, et Iédihel, et Míchael, et Ednas, et Iózabad, et Eliu, et Sálathi, príncipes míllium in Manásse.
  "21": 'Hi præbuérunt auxílium David advérsus latrúnculos: omnes enim erant viri fortíssimi, et facti sunt príncipes in exércitu.'
  "22": Sed et per síngulos dies veniébant ad David ad auxiliándum ei, usque dum fíeret grandis númerus, quasi exércitus Dei.
  "23": Iste quoque est númerus príncipum exércitus, qui venérunt ad David cum esset in Hebron, ut transférrent regnum Saul ad eum, iuxta verbum Dómini.
  "24": Fílii Iuda portántes clýpeum et hastam, sex míllia octingénti expedíti ad prœ́lium.
  "25": De fíliis Símeon virórum fortissimórum ad pugnándum, septem míllia centum.
  "26": De fíliis Levi, quátuor míllia sexcénti.
  "27": Ióiada quoque princeps de stirpe Aaron, et cum eo tria míllia septingénti.
  "28": Sadoc étiam puer egrégiæ índolis, et domus patris eius, príncipes vigínti duo.
  "29": 'De fíliis autem Béniamin frátribus Saul, tria míllia: magna enim pars eórum adhuc sequebátur domum Saul.'
  "30": Porro de fíliis Ephraim vigínti míllia octingénti, fortíssimi róbore, viri nomináti in cognatiónibus suis.
  "31": Et ex dimídia tribu Manásse, decem et octo míllia, sínguli per nómina sua, venérunt ut constitúerent regem David.
  "32": 'De fíliis quoque Issachar viri erudíti, qui nóverant síngula témpora ad præcipiéndum quid fácere debéret Israel, príncipes ducénti: omnis autem réliqua tribus eórum consílium sequebátur.'
  "33": Porro de Zábulon qui egrediebántur ad prœ́lium, et stabant in ácie instrúcti armis béllicis, quinquagínta míllia venérunt in auxílium, non in corde dúplici.
  "34": Et de Néphthali, príncipes mille, et cum eis instrúcti clýpeo et hasta, trigínta et septem míllia.
  "35": De Dan étiam præparáti ad prœ́lium, vigínti octo míllia sexcénti.
  "36": Et de Aser egrediéntes ad pugnam, et in ácie provocántes, quadragínta míllia.
  "37": Trans Iordánem autem de fíliis Ruben, et de Gad, et dimídia parte tribus Manásse, instrúcti armis béllicis, centum vigínti míllia.
  "38": 'Omnes isti viri bellatóres expedíti ad pugnándum, corde perfécto venérunt in Hebron, ut constitúerent regem David super univérsum Israel: sed et omnes réliqui ex Israel uno corde erant, ut rex fíeret David.'
  "39": 'Fuerúntque ibi apud David tribus diébus comedéntes et bibéntes: præparáverant enim eis fratres sui.'
  "40": 'Sed et qui iuxta eos erant, usque ad Issachar, et Zábulon, et Néphthali, afferébant panes in ásinis, et camélis, et mulis, et bobus ad vescéndum: farínam, pálathas, uvam passam, vinum, óleum, boves, aríetes ad omnem cópiam: gáudium quippe erat in Israel.'
