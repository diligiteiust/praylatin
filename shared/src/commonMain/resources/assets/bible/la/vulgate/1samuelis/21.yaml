bible: vulgate
lang: la
language: Latina
book: I Samuelis
chapter: "21"
verses:
  "1": 'Venit autem David in Nobe ad Achímelech sacerdótem: et obstúpuit Achímelech, eo quod venísset David. Et dixit ei: Quare tu solus, et nullus est tecum?'
  "2": 'Et ait David ad Achímelech sacerdótem: Rex præcépit mihi sermónem, et dixit: Nemo sciat rem, propter quam missus es a me, et cuiúsmodi præcépta tibi déderim: nam et púeris condíxi in illum et illum locum.'
  "3": Nunc ergo si quid habes ad manum, vel quinque panes, da mihi, aut quidquid invéneris.
  "4": 'Et respóndens sacérdos ad David, ait illi: Non hábeo láicos panes ad manum, sed tantum panem sanctum: si mundi sunt púeri, máxime a muliéribus?'
  "5": 'Et respóndit David sacerdóti, et dixit ei: Equidem, si de muliéribus ágitur: continúimus nos ab heri et nudiustértius, quando egrediebámur, et fuérunt vasa puerórum sancta. Porro via hæc pollúta est, sed et ipsa hódie sanctificábitur in vasis.'
  "6": 'Dedit ergo ei sacérdos sanctificátum panem: neque enim erat ibi panis, nisi tantum panes propositiónis, qui subláti fúerant a fácie Dómini, ut poneréntur panes cálidi.'
  "7": 'Erat autem ibi vir quidam de servis Saul in die illa, intus in tabernáculo Dómini: et nomen eius Doeg Idumǽus, potentíssimus pastórum Saul.'
  "8": 'Dixit autem David ad Achímelech: Si habes hic ad manum hastam, aut gládium? quia gládium meum, et arma mea non tuli mecum: sermo enim regis urgébat.'
  "9": 'Et dixit sacérdos: Ecce hic gládius Góliath Philisthǽi, quem percussísti in Valle terebínthi: est involútus pállio post ephod: si istum vis tóllere, tolle: neque enim hic est álius absque eo. Et ait David: Non est huic alter símilis, da mihi eum.'
  "10": 'Surréxit ítaque David, et fugit in die illa a fácie Saul: et venit ad Achis regem Geth.'
  "11": 'Dixerúntque servi Achis ad eum cum vidíssent David: Numquid non iste est David rex terræ? nonne huic cantábant per choros, dicéntes: Percússit Saul mille, et David decem míllia?'
  "12": Pósuit autem David sermónes istos in corde suo, et extímuit valde a fácie Achis regis Geth.
  "13": 'Et immutávit os suum coram eis, et collabebátur inter manus eórum: et impingébat in óstia portæ, defluebántque salívæ eius in barbam.'
  "14": 'Et ait Achis ad servos suos: Vidístis hóminem insánum: quare adduxístis eum ad me?'
  "15": An desunt nobis furiósi, quod introduxístis istum, ut fúreret me præsénte? híccine ingrediétur domum meam?
