bible: vulgate
lang: la
language: Latina
book: Ecclesiasticus
chapter: "23"
verses:
  "1": Dómine pater, et dominátor vitæ meæ, ne derelínquas me in consílio eórum, nec sinas me cádere in illis.
  "2": Quis superpónet in cogitátu meo flagélla, et in corde meo doctrínam sapiéntiæ, ut ignoratiónibus eórum non parcant mihi, et non appáreant delícta eórum,
  "3": et ne adincréscant ignorántiæ meæ, et multiplicéntur delícta mea, et peccáta mea abúndent, et íncidam in conspéctu adversariórum meórum, et gáudeat super me inimícus meus?
  "4": Dómine pater, et Deus vitæ meæ, ne derelínquas me in cogitátu illórum.
  "5": Extolléntiam oculórum meórum ne déderis mihi, et omne desidérium avérte a me.
  "6": Aufer a me ventris concupiscéntias, et concúbitus concupiscéntiæ ne apprehéndant me, et ánimæ irreverénti et infrunítæ ne tradas me.
  "7": 'Doctrínam oris audíte fílii: et qui custodíerit illam, non périet lábiis, nec scandalizábitur in opéribus nequíssimis.'
  "8": 'In vanitáte sua apprehénditur peccátor: et supérbus et malédicus scandalizábitur in illis.'
  "9": 'Iuratióni non assuéscat os tuum: multi enim casus in illa.'
  "10": 'Nominátio vero Dei non sit assídua in ore tuo, et nomínibus sanctórum non admisceáris: quóniam non eris immúnis ab eis.'
  "11": Sicut enim servus interrogátus assídue a livóre non minúitur, sic omnis iurans et nóminans in toto a peccáto non purgábitur.
  "12": Vir multum iurans implébitur iniquitáte, et non discédet a domo illíus plaga.
  "13": 'Et si frustráverit, delíctum illíus super ipsum erit: et si dissimuláverit, delínquit duplíciter:'
  "14": 'et si in vácuum iuráverit, non iustificábitur: replébitur enim retributióne domus illíus.'
  "15": 'Est et ália loquéla contrária morti: non inveniátur in hereditáte Iacob.'
  "16": Etenim a misericórdibus ómnia hæc auferéntur, et in delíctis non volutabúntur.
  "17": 'Indisciplinátæ loquélæ non assuéscat os tuum: est enim in illa verbum peccáti.'
  "18": 'Meménto patris et matris tuæ, in médio enim magnatórum consístis:'
  "19": ne forte obliviscátur te Deus in conspéctu illórum, et assiduitáte tua infatuátus, impropérium patiáris, et maluísses non nasci, et diem nativitátis tuæ maledícas.
  "20": Homo assuétus in verbis impropérii, in ómnibus diébus suis non erudiétur.
  "21": Duo génera abúndant in peccátis, et tértium addúcit iram et perditiónem.
  "22": 'Anima cálida quasi ignis ardens, non exstinguétur donec áliquid glútiat:'
  "23": et homo nequam in ore carnis suæ non désinet donec incéndat ignem.
  "24": 'Hómini fornicário omnis panis dulcis: non fatigábitur transgrédiens usque ad finem.'
  "25": 'Omnis homo qui transgréditur lectum suum, contémnens in ánimam suam, et dicens: Quis me videt?'
  "26": 'Ténebræ circúmdant me, et paríetes coopériunt me, et nemo circúmspicit me: quem véreor? delictórum meórum non memorábitur Altíssimus.'
  "27": 'Et non intélligit quóniam ómnia videt óculus illíus, quóniam expéllit a se timórem Dei huiúsmodi hóminis timor, et óculi hóminum timéntes illum:'
  "28": et non cognóvit quóniam óculi Dómini multo plus lucidióres sunt super solem, circumspiciéntes omnes vias hóminum, et profúndum abýssi, et hóminum corda, intuéntes in abscónditas partes.
  "29": 'Dómino enim Deo ántequam crearéntur, ómnia sunt ágnita: sic et post perféctum réspicit ómnia.'
  "30": Hic in platéis civitátis vindicábitur, et quasi pullus equínus fugábitur, et ubi non sperávit apprehendétur.
  "31": Et erit dédecus ómnibus, eo quod non intelléxerit timórem Dómini.
  "32": 'Sic et múlier omnis relínquens virum suum, et státuens hereditátem ex aliéno matrimónio:'
  "33": 'primo enim in lege Altíssimi incredíbilis fuit: secúndo in virum suum delíquit: tértio in adultério fornicáta est, et ex álio viro fílios státuit sibi.'
  "34": Hæc in ecclésiam adducétur, et in fílios eius respiciétur.
  "35": 'Non tradent fílii eius radíces, et rami eius non dabunt fructum:'
  "36": derelínquet in maledíctum memóriam eius, et dédecus illíus non delébitur.
  "37": 'Et agnóscent qui derelícti sunt, quóniam nihil mélius est quam timor Dei: et nihil dúlcius, quam respícere in mandátis Dómini.'
  "38": 'Glória magna est sequi Dóminum: longitúdo enim diérum assumétur ab eo.'
