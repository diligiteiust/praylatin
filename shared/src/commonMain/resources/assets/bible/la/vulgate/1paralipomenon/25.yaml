bible: vulgate
lang: la
language: Latina
book: I Paralipomenon
chapter: "25"
verses:
  "1": 'Igitur David et magistrátus exércitus segregavérunt in ministérium fílios Asaph, et Heman, et Idithun: qui prophetárent in cítharis, et psaltériis, et cýmbalis secúndum númerum suum, dedicáto sibi offício serviéntes.'
  "2": 'De fíliis Asaph: Zachur, et Ioseph, et Nathanía, et Asaréla, fílii Asaph: sub manu Asaph prophetántis iuxta regem.'
  "3": 'Porro Idithun: fílii Idithun, Godolías, Sori, Ieseías, et Hasabías, et Mathathías, sex, sub manu patris sui Idithun, qui in cíthara prophetábat super confiténtes et laudántes Dóminum.'
  "4": 'Heman quoque: fílii Heman, Boccíau, Mathaníau, Oziel, Súbuel, et Iérimoth, Hananías, Hánani, Elíatha, Geddélthi, et Romemthiézer, et Iesbacássa, Mellóthi, Othir, Maházioth:'
  "5": 'omnes isti fílii Heman vidéntis regis in sermónibus Dei, ut exaltáret cornu: dedítque Deus Heman fílios quatuórdecim, et fílias tres.'
  "6": 'Univérsi sub manu patris sui ad cantándum in templo Dómini distribúti erant, in cýmbalis, et psaltériis, et cítharis, in ministéria domus Dómini iuxta regem: Asaph vidélicet, et Idithun, et Heman.'
  "7": Fuit autem númerus eórum cum frátribus suis, qui erudiébant cánticum Dómini, cuncti doctóres, ducénti octogínta octo.
  "8": Miserúntque sortes per vices suas, ex æquo tam maior quam minor, doctus páriter et indóctus.
  "9": Egressáque est sors prima Ioseph, qui erat de Asaph. Secúnda Godolíæ, ipsi et fíliis eius, et frátribus eius duódecim.
  "10": Tértia Zachur, fíliis et frátribus eius duódecim.
  "11": Quarta Isari, fíliis et frátribus eius duódecim.
  "12": Quinta Nathaníæ, fíliis et frátribus eius duódecim.
  "13": Sexta Boccíau, fíliis et frátribus eius duódecim.
  "14": Séptima Isreéla, fíliis et frátribus eius duódecim.
  "15": Octáva Iesaíæ, fíliis et frátribus eius duódecim.
  "16": Nona Mathaníæ, fíliis et frátribus eius duódecim.
  "17": Décima Semeíæ, fíliis et frátribus eius duódecim.
  "18": Undécima Azáreel, fíliis et frátribus eius duódecim.
  "19": Duodécima Hasabíæ, fíliis et frátribus eius duódecim.
  "20": Tertiadécima Súbael, fíliis et frátribus eius duódecim.
  "21": Quartadécima Mathathíæ, fíliis et frátribus eius duódecim.
  "22": Quintadécima Iérimoth, fíliis et frátribus eius duódecim.
  "23": Sextadécima Hananíæ, fíliis et frátribus eius duódecim.
  "24": Séptima décima Iesbacássæ, fíliis et frátribus eius duódecim.
  "25": Octáva décima Hánani, fíliis et frátribus eius duódecim.
  "26": Nonadécima Mellóthi, fíliis et frátribus eius duódecim.
  "27": Vigésima Elíatha, fíliis et frátribus eius duódecim.
  "28": Vigésima prima Othir, fíliis et frátribus eius duódecim.
  "29": Vigésima secúnda Geddélthi, fíliis et frátribus eius duódecim.
  "30": Vigésima tértia Maházioth, fíliis et frátribus eius duódecim.
  "31": Vigésima quarta Romemthiézer, fíliis et frátribus eius duódecim.
