bible: vulgate
lang: la
language: Latina
book: Ecclesiasticus
chapter: "26"
verses:
  "1": 'Mulíeris bonæ beátus vir: númerus enim annórum illíus duplex.'
  "2": Múlier fortis obléctat virum suum, et annos vitæ illíus in pace implébit.
  "3": 'Pars bona, múlier bona, in parte timéntium Deum dábitur viro pro factis bonis:'
  "4": dívitis autem, et páuperis cor bonum, in omni témpore vultus illórum hílaris.
  "5": 'A tribus tímuit cor meum, et in quarto fácies mea métuit:'
  "6": 'delatúram civitátis, et collectiónem pópuli:'
  "7": calúmniam mendácem, super mortem, ómnia grávia.
  "8": Dolor cordis et luctus, múlier zelótypa.
  "9": In mulíere zelótypa flagéllum linguæ, ómnibus commúnicans.
  "10": 'Sicut boum iugum, quod movétur, ita et múlier nequam: qui tenet illam, quasi qui apprehéndit scorpiónem.'
  "11": 'Múlier ebriósa, ira magna: et contumélia, et turpitúdo illíus non tegétur.'
  "12": Fornicátio mulíeris in extolléntia oculórum, et in pálpebris illíus agnoscétur.
  "13": 'In fília non averténte se, firma custódiam: ne invénta occasióne utátur se.'
  "14": 'Ab omni irreveréntia oculórum eius cave, et ne miréris si te negléxerit:'
  "15": sicut viátor sítiens ad fontem os apériet, et ab omni aqua próxima bibet, et contra omnem palum sedébit, et contra omnem sagíttam apériet pháretram donec defíciat.
  "16": Grátia mulíeris sédulæ delectábit virum suum, et ossa illíus impinguábit.
  "17": Disciplína illíus datum Dei est.
  "18": Múlier sensáta et tácita, non est immutátio erudítæ ánimæ.
  "19": Grátia super grátiam, múlier sancta et pudoráta.
  "20": Omnis autem ponderátio non est digna continéntis ánimæ.
  "21": 'Sicut sol óriens mundo in altíssimis Dei, sic mulíeris bonæ spécies in ornaméntum domus eius:'
  "22": lucérna splendens super candelábrum sanctum, et spécies faciéi super ætátem stábilem.
  "23": Colúmnæ áureæ super bases argénteas, et pedes firmi super plantas stábilis mulíeris.
  "24": Fundaménta ætérna supra petram sólidam, et mandáta Dei in corde mulíeris sanctæ.
  "25": 'In duóbus contristátum est cor meum, et in tértio iracúndia mihi advénit:'
  "26": 'vir bellátor defíciens per inópiam: et vir sensátus contémptus:'
  "27": et qui transgréditur a iustítia ad peccátum, Deus parávit eum ad rhomphǽam.
  "28": 'Duæ spécies diffíciles et periculósæ mihi apparuérunt: diffícile exúitur negótians a negligéntia: et non iustificábitur caupo a peccátis labiórum.'
