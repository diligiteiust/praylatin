bible: vulgate
lang: la
language: Latina
book: Isaias
chapter: "55"
verses:
  "1": 'Omnes sitiéntes veníte ad aquas: et qui non habétis argéntum, properáte, émite, et comédite: veníte, émite absque argénto et absque ulla commutatióne vinum et lac.'
  "2": Quare appénditis argéntum non in pánibus, et labórem vestrum non in saturitáte? Audíte audiéntes me, et comédite bonum, et delectábitur in crassitúdine ánima vestra.
  "3": 'Inclináte aurem vestram, et veníte ad me: audíte, et vivet ánima vestra, et fériam vobíscum pactum sempitérnum, misericórdias David fidéles.'
  "4": Ecce testem pópulis dedi eum, ducem ac præceptórem géntibus.
  "5": 'Ecce gentem, quam nesciébas, vocábis: et gentes, quæ te non cognovérunt, ad te current propter Dóminum Deum tuum, et sanctum Israel, quia glorificávit te.'
  "6": 'Quǽrite Dóminum, dum inveníri potest: invocáte eum, dum prope est.'
  "7": 'Derelínquat ímpius viam suam, et vir iníquus cogitatiónes suas, et revertátur ad Dóminum, et miserébitur eius, et ad Deum nostrum: quóniam multus est ad ignoscéndum.'
  "8": Non enim cogitatiónes meæ cogitatiónes vestræ, neque viæ vestræ viæ meæ, dicit Dóminus.
  "9": Quia sicut exaltántur cæli a terra, sic exaltátæ sunt viæ meæ a viis vestris, et cogitatiónes meæ a cogitatiónibus vestris.
  "10": 'Et quómodo descéndit imber et nix de cælo, et illuc ultra non revértitur, sed inébriat terram, et infúndit eam, et germináre eam facit, et dat semen serénti, et panem comedénti:'
  "11": 'sic erit verbum meum, quod egrediétur de ore meo: non revertétur ad me vácuum, sed fáciet quæcúmque vólui, et prosperábitur in his, ad quæ misi illud.'
  "12": 'Quia in lætítia egrediémini, et in pace deducémini: montes et colles cantábunt coram vobis laudem, et ómnia ligna regiónis plaudent manu.'
  "13": 'Pro saliúnca ascéndet ábies, et pro urtíca crescet myrtus: et erit Dóminus nominátus in signum ætérnum, quod non auferétur.'
