bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "139"
verses:
  "1": In finem, Psalmus David.
  "2": 'Eripe me Dómine ab hómine malo: a viro iníquo éripe me.'
  "3": 'Qui cogitavérunt iniquitátes in corde: tota die constituébant prœ́lia.'
  "4": 'Acuérunt linguas suas sicut serpéntis: venénum áspidum sub lábiis eórum.'
  "5": 'Custódi me Dómine de manu peccatóris: et ab homínibus iníquis éripe me. Qui cogitavérunt supplantáre gressus meos:'
  "6": 'abscondérunt supérbi láqueum mihi: et funes extendérunt in láqueum: iuxta iter scándalum posuérunt mihi.'
  "7": 'Dixi Dómino: Deus meus es tu: exáudi Dómine vocem deprecatiónis meæ.'
  "8": 'Dómine, Dómine virtus salútis meæ: obumbrásti super caput meum in die belli:'
  "9": 'ne tradas me Dómine a desidério meo peccatóri: cogitavérunt contra me, ne derelínquas me, ne forte exalténtur.'
  "10": 'Caput circúitus eórum: labor labiórum ipsórum opériet eos.'
  "11": 'Cadent super eos carbónes, in ignem deícies eos: in misériis non subsístent.'
  "12": 'Vir linguósus non dirigétur in terra: virum iniústum mala cápient in intéritu.'
  "13": 'Cognóvi quia fáciet Dóminus iudícium ínopis: et vindíctam páuperum.'
  "14": 'Verúmtamen iusti confitebúntur nómini tuo: et habitábunt recti cum vultu tuo.'
