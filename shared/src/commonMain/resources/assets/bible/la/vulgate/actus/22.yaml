bible: vulgate
lang: la
language: Latina
book: Actus Apostolorum
chapter: "22"
verses:
  "1": Viri fratres, et patres, audíte quam ad vos nunc reddo ratiónem.
  "2": Cum audíssent autem quia Hebrǽa lingua loquerétur ad illos, magis præstitérunt siléntium.
  "3": 'Et dicit: Ego sum vir Iudǽus, natus in Tarso Cilíciæ, nutrítus autem in ista civitáte, secus pedes Gamáliel erudítus iuxta veritátem patérnæ legis, æmulátor legis, sicut et vos omnes estis hódie:'
  "4": qui hanc viam persecútus sum usque ad mortem, álligans et tradens in custódias viros ac mulíeres,
  "5": 'sicut princeps sacerdótum mihi testimónium reddit, et omnes maióres natu: a quibus et epístolas accípiens, ad fratres Damáscum pergébam, ut addúcerem inde vinctos in Ierúsalem ut puniréntur.'
  "6": 'Factum est autem, eúnte me, et appropinquánte Damásco média die, súbito de cælo circumfúlsit me lux copiósa:'
  "7": 'et décidens in terram, audívi vocem dicéntem mihi: Saule, Saule, quid me perséqueris?'
  "8": 'Ego autem respóndi: Quis es, Dómine? Dixítque ad me: Ego sum Iesus Nazarénus, quem tu perséqueris.'
  "9": Et qui mecum erant, lumen quidem vidérunt, vocem autem non audiérunt eius, qui loquebátur mecum.
  "10": 'Et dixi: Quid fáciam, Dómine? Dóminus autem dixit ad me: Surgens vade Damáscum: et ibi tibi dicétur de ómnibus, quæ te opórteat fácere.'
  "11": Et cum non vidérem præ claritáte lúminis illíus, ad manum dedúctus a comítibus, veni Damáscum.
  "12": Ananías autem quidam vir secúndum legem, testimónium habens ab ómnibus cohabitántibus Iudǽis,
  "13": 'véniens ad me, et astans dixit mihi: Saule frater réspice. Et ego eádem hora respéxi in eum.'
  "14": 'At ille dixit: Deus patrum nostrórum præordinávit te, ut cognósceres voluntátem eius, et vidéres iustum, et audíres vocem ex ore eius:'
  "15": quia eris testis illíus ad omnes hómines eórum, quæ vidísti, et audísti.
  "16": Et nunc quid moráris? Exsúrge, et baptizáre, et áblue peccáta tua, invocáto nómine ipsíus.
  "17": Factum est autem reverténti mihi in Ierúsalem, et oránti in templo, fíeri me in stupóre mentis,
  "18": 'et vidére illum dicéntem mihi: Festína, et exi velóciter ex Ierúsalem: quóniam non recípient testimónium tuum de me.'
  "19": 'Et ego dixi: Dómine ipsi sciunt quia ego eram conclúdens in cárcerem, et cædens per synagógas eos, qui credébant in te:'
  "20": et cum funderétur sanguis Stéphani testis tui, ego astábam, et consentiébam, et custodiébam vestiménta interficiéntium illum.
  "21": 'Et dixit ad me: Vade, quóniam ego in natiónes longe mittam te.'
  "22": 'Audiébant autem eum usque ad hoc verbum, et levavérunt vocem suam, dicéntes: Tolle de terra huiúsmodi: non enim fas est eum vívere.'
  "23": Vociferántibus autem eis, et proiciéntibus vestiménta sua, et púlverem iactántibus in áerem,
  "24": iussit tribúnus indúci eum in castra, et flagéllis cædi, et torquéri eum, ut sciret propter quam causam sic acclamárent ei.
  "25": 'Et cum astrinxíssent eum loris, dicit astánti sibi centurióni Paulus: Si hóminem Románum et indemnátum licet vobis flagelláre?'
  "26": 'Quo audíto, centúrio accéssit ad tribúnum, et nuntiávit ei, dicens: Quid actúrus es? hic enim homo civis Románus est.'
  "27": 'Accédens autem tribúnus, dixit illi: Dic mihi si tu Románus es? At ille dixit: Etiam.'
  "28": 'Et respóndit tribúnus: Ego multa summa civilitátem hanc consecútus sum. Et Paulus ait: Ego autem et natus sum.'
  "29": Prótinus ergo discessérunt ab illo, qui eum tortúri erant. Tribúnus quoque tímuit postquam rescívit, quia civis Románus esset, et quia alligásset eum.
  "30": 'Póstera autem die volens scire diligéntius qua ex causa accusarétur a Iudǽis, solvit eum, et iussit sacerdótes conveníre, et omne concílium: et prodúcens Paulum, státuit inter illos.'
