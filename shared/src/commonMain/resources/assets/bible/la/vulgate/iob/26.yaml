bible: vulgate
lang: la
language: Latina
book: Iob
chapter: "26"
verses:
  "1": 'Respóndens autem Iob dixit:'
  "2": Cuius adiútor es? numquid imbecíllis? et susténtas bráchium eius, qui non est fortis?
  "3": Cui dedísti consílium? fórsitan illi, qui non habet sapiéntiam, et prudéntiam tuam ostendísti plúrimam.
  "4": Quem docére voluísti? nonne eum, qui fecit spiraméntum?
  "5": Ecce gigántes gemunt sub aquis, et qui hábitant cum eis.
  "6": Nudus est inférnus coram illo, et nullum est operiméntum perditióni.
  "7": Qui exténdit aquilónem super vácuum, et appéndit terram super níhilum.
  "8": Qui ligat aquas in núbibus suis, ut non erúmpant páriter deórsum.
  "9": Qui tenet vultum sólii sui, et expándit super illud nébulam suam.
  "10": Términum circúmdedit aquis, usque dum finiántur lux et ténebræ.
  "11": Colúmnæ cæli contremíscunt, et pavent ad nutum eius.
  "12": In fortitúdine illíus repénte mária congregáta sunt, et prudéntia eius percússit supérbum.
  "13": 'Spíritus eius ornávit cælos: et obstetricánte manu eius, edúctus est cóluber tortuósus.'
  "14": 'Ecce, hæc ex parte dicta sunt viárum eius: et cum vix parvam stillam sermónis eius audiérimus, quis póterit tonítruum magnitúdinis illíus intuéri?'
