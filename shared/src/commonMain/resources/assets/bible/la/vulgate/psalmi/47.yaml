bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "47"
verses:
  "1": Psalmus Cántici fíliis Core secúnda sábbati.
  "2": Magnus Dóminus, et laudábilis nimis in civitáte Dei nostri, in monte sancto eius.
  "3": Fundátur exsultatióne univérsæ terræ mons Sion, látera aquilónis, cívitas regis magni.
  "4": Deus in dómibus eius cognoscétur, cum suscípiet eam.
  "5": 'Quóniam ecce reges terræ congregáti sunt: convenérunt in unum.'
  "6": 'Ipsi vidéntes, sic admiráti sunt, conturbáti sunt, commóti sunt:'
  "7": 'tremor apprehéndit eos. Ibi dolóres ut parturiéntis:'
  "8": in spíritu veheménti cónteres naves Tharsis.
  "9": 'Sicut audívimus, sic vídimus in civitáte Dómini virtútum, in civitáte Dei nostri: Deus fundávit eam in ætérnum.'
  "10": Suscépimus Deus misericórdiam tuam, in médio templi tui.
  "11": 'Secúndum nomen tuum Deus, sic et laus tua in fines terræ: iustítia plena est déxtera tua.'
  "12": Lætétur mons Sion, et exsúltent fíliæ Iudæ, propter iudícia tua Dómine.
  "13": 'Circúmdate Sion, et complectímini eam: narráte in túrribus eius.'
  "14": 'Pónite corda vestra in virtúte eius: et distribúite domos eius, ut enarrétis in progénie áltera.'
  "15": 'Quóniam hic est Deus, Deus noster in ætérnum, et in sǽculum sǽculi: ipse reget nos in sǽcula.'
