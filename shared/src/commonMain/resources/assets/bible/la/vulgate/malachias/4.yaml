bible: vulgate
lang: la
language: Latina
book: Malachias
chapter: "4"
verses:
  "1": 'Ecce enim dies véniet succénsa quasi camínus: et erunt omnes supérbi, et omnes faciéntes impietátem stípula: et inflammábit eos dies véniens, dicit Dóminus exercítuum, quæ non derelínquet eis radícem, et germen.'
  "2": 'Et oriétur vobis timéntibus nomen meum Sol iustítiæ, et sánitas in pennis eius: et egrediémini, et saliétis sicut vítuli de arménto.'
  "3": Et calcábitis ímpios, cum fúerint cinis sub planta pedum vestrórum in die, qua ego fácio, dicit Dóminus exercítuum.
  "4": Mementóte legis Móysi servi mei, quam mandávi ei in Horeb ad omnem Israel præcépta, et iudícia.
  "5": Ecce ego mittam vobis Elíam prophétam, ántequam véniat dies Dómini magnus, et horríbilis.
  "6": 'Et convértet cor patrum ad fílios, et cor filiórum ad patres eórum: ne forte véniam, et percútiam terram anathémate.'
