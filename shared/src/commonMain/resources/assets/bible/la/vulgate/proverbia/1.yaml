bible: vulgate
lang: la
language: Latina
book: Proverbia
chapter: "1"
verses:
  "1": Parábolæ Salomónis, fílii David, regis Israel.
  "2": 'Ad sciéndam sapiéntiam et disciplínam:'
  "3": 'ad intelligénda verba prudéntiæ, et suscipiéndam eruditiónem doctrínæ, iustítiam, et iudícium, et æquitátem:'
  "4": ut detur párvulis astútia, adolescénti sciéntia et intelléctus.
  "5": 'Audiens sápiens, sapiéntior erit: et intélligens gubernácula possidébit.'
  "6": Animadvértet parábolam et interpretatiónem, verba sapiéntum et ænígmata eórum.
  "7": Timor Dómini princípium sapiéntiæ. Sapiéntiam, atque doctrínam stulti despíciunt.
  "8": 'Audi, fili mi, disciplínam patris tui, et ne dimíttas legem matris tuæ:'
  "9": ut addátur grátia cápiti tuo, et torques collo tuo.
  "10": Fili mi, si te lactáverint peccatóres, ne acquiéscas eis.
  "11": 'Si díxerint: Veni nobíscum, insidiémur sánguini: abscondámus tendículas contra insóntem frustra:'
  "12": deglutiámus eum sicut inférnus vivéntem, et íntegrum quasi descendéntem in lacum.
  "13": 'Omnem pretiósam substántiam reperiémus: implébimus domos nostras spóliis.'
  "14": Sortem mitte nobíscum, marsúpium unum sit ómnium nostrum.
  "15": 'Fili mi, ne ámbules cum eis: próhibe pedem tuum a sémitis eórum.'
  "16": Pedes enim illórum ad malum currunt, et festínant ut effúndant sánguinem.
  "17": Frustra autem iácitur rete ante óculos pennatórum.
  "18": Ipsi quoque contra sánguinem suum insidiántur, et moliúntur fraudes contra ánimas suas.
  "19": Sic sémitæ omnis avári, ánimas possidéntium rápiunt.
  "20": 'Sapiéntia foris prǽdicat, in platéis dat vocem suam:'
  "21": 'in cápite turbárum clámitat, in fóribus portárum urbis profert verba sua, dicens:'
  "22": Usquequo párvuli dilígitis infántiam, et stulti ea, quæ sibi sunt nóxia, cúpient, et imprudéntes odíbunt sciéntiam?
  "23": 'Convertímini ad correptiónem meam: en próferam vobis spíritum meum, et osténdam vobis verba mea.'
  "24": 'Quia vocávi, et renuístis: exténdi manum meam, et non fuit qui aspíceret.'
  "25": Despexístis omne consílium meum, et increpatiónes meas neglexístis.
  "26": Ego quoque in intéritu vestro ridébo, et subsannábo cum vobis id, quod timebátis, advénerit.
  "27": 'Cum irrúerit repentína calámitas, et intéritus quasi tempéstas ingrúerit: quando vénerit super vos tribulátio et angústia:'
  "28": 'tunc invocábunt me, et non exáudiam: mane consúrgent, et non invénient me:'
  "29": eo quod exósam habúerint disciplínam, et timórem Dómini non suscéperint,
  "30": nec acquiéverint consílio meo, et detráxerint univérsæ correptióni meæ.
  "31": Cómedent ígitur fructus viæ suæ, suísque consíliis saturabúntur.
  "32": Avérsio parvulórum interfíciet eos, et prospéritas stultórum perdet illos.
  "33": Qui autem me audíerit, absque terróre requiéscet, et abundántia perfruétur, timóre malórum subláto.
