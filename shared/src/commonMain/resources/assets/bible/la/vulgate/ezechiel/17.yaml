bible: vulgate
lang: la
language: Latina
book: Ezechiel
chapter: "17"
verses:
  "1": 'Et factum est verbum Dómini ad me, dicens:'
  "2": Fili hóminis propóne ænígma, et narra parábolam ad domum Israel,
  "3": 'et dices: Hæc dicit Dóminus Deus: Aquila grandis magnárum alárum, longo membrórum ductu, plena plumis, et varietáte, venit ad Líbanum, et tulit medúllam cedri.'
  "4": 'Summitátem fróndium eius avúlsit: et transportávit eam in terram Chánaan, in urbe negotiatórum pósuit illam.'
  "5": 'Et tulit de sémine terræ, et pósuit illud in terra pro sémine, ut firmáret radícem super aquas multas: in superfície pósuit illud.'
  "6": 'Cumque germinásset, crevit in víneam latiórem, húmili statúra, respiciéntibus ramis eius ad eam: et radíces eius sub illa erant: facta est ergo vínea, et fructificávit in pálmites, et emísit propágines.'
  "7": 'Et facta est áquila áltera grandis, magnis alis, multísque plumis: et ecce vínea ista quasi mittens radíces suas ad eam, pálmites suos exténdit ad illam, ut irrigáret eam de aréolis gérminis sui.'
  "8": In terra bona super aquas multas plantáta est, ut fáciat frondes, et portet fructum, ut sit in víneam grandem.
  "9": 'Dic: Hæc dicit Dóminus Deus: Ergóne prosperábitur? nonne radíces eius evéllet, et fructus eius distrínget, et siccábit omnes pálmites gérminis eius, et aréscet: et non in bráchio grandi, neque in pópulo multo, ut evélleret eam radícitus?'
  "10": 'Ecce plantáta est: ergóne prosperábitur? nonne, cum tetígerit eam ventus urens, siccábitur, et in áreis gérminis sui aréscet?'
  "11": 'Et factum est verbum Dómini ad me, dicens:'
  "12": 'Dic ad domum exasperántem: Nescítis quid ista signíficent? Dic: Ecce venit rex Babylónis in Ierúsalem, et assúmet regem et príncipes eius, et addúcet eos ad semetípsum in Babylónem.'
  "13": 'Et tollet de sémine regni, feriétque cum eo fœdus: et ab eo accípiet iusiurándum: sed et fortes terræ tollet,'
  "14": ut sit regnum húmile, et non elevétur, sed custódiat pactum eius, et servet illud.
  "15": Qui recédens ab eo misit núntios ad Ægýptum, ut daret sibi equos, et pópulum multum. Numquid prosperábitur, vel consequétur salútem, qui fecit hæc? et qui dissólvit pactum, numquid effúgiet?
  "16": 'Vivo ego, dicit Dóminus Deus: quóniam in loco regis, qui constítuit eum regem, cuius fecit írritum iuraméntum, et solvit pactum, quod habébat cum eo, in médio Babylónis moriétur.'
  "17": 'Et non in exércitu grandi, neque in pópulo multo, fáciet contra eum Phárao prœ́lium: in iactu ággeris, et in exstructióne vallórum, ut interfíciat ánimas multas.'
  "18": 'Spréverat enim iuraméntum, ut sólveret fœdus, et ecce dedit manum suam: et cum ómnia hæc fécerit, non effúgiet.'
  "19": 'Proptérea hæc dicit Dóminus Deus: Vivo ego, quóniam iuraméntum, quod sprevit, et fœdus, quod prævaricátus est, ponam in caput eius.'
  "20": 'Et expándam super eum rete meum, et comprehendétur in sagéna mea: et addúcam eum in Babylónem, et iudicábo eum ibi in prævaricatióne, qua despéxit me.'
  "21": 'Et omnes prófugi eius, cum univérso ágmine suo, gládio cadent: resídui autem in omnem ventum dispergéntur: et sciétis quia ego Dóminus locútus sum.'
  "22": 'Hæc dicit Dóminus Deus: Et sumam ego de medúlla cedri sublímis, et ponam: de vértice ramórum eius ténerum distríngam, et plantábo super montem excélsum et eminéntem.'
  "23": 'In monte sublími Israel plantábo illud, et erúmpet in germen, et fáciet fructum, et erit in cedrum magnam: et habitábunt sub ea omnes vólucres, et univérsum volátile sub umbra fróndium eius nidificábit.'
  "24": 'Et scient ómnia ligna regiónis, quia ego Dóminus humiliávi lignum sublíme, et exaltávi lignum húmile: et siccávi lignum víride, et frondére feci lignum áridum. Ego Dóminus locútus sum, et feci.'
