bible: vulgate
lang: la
language: Latina
book: Ecclesiasticus
chapter: "40"
verses:
  "1": Occupátio magna creáta est ómnibus homínibus, et iugum grave super fílios Adam, a die éxitus de ventre matris eórum, usque in diem sepultúræ, in matrem ómnium.
  "2": Cogitatiónes eórum, et timóres cordis, adinvéntio exspectatiónis, et dies finitiónis,
  "3": 'a residénte super sedem gloriósam, usque ad humiliátum in terra et cínere:'
  "4": 'ab eo, qui útitur hyacíntho, et portat corónam, usque ad eum, qui operítur lino crudo: furor, zelus, tumúltus, fluctuátio, et timor mortis, iracúndia persevérans, et conténtio,'
  "5": et in témpore refectiónis in cubíli somnus noctis immútat sciéntiam eius.
  "6": Módicum tamquam nihil in réquie, et ab eo in somnis, quasi in die respéctus.
  "7": 'Conturbátus est in visu cordis sui, tamquam qui eváserit in die belli. In témpore salútis suæ exsurréxit, et admírans ad nullum timórem:'
  "8": cum omni carne, ab hómine usque ad pecus, et super peccatóres séptuplum.
  "9": 'Ad hæc mors, sanguis, conténtio, et rhomphǽa, oppressiónes, fames, et contrítio, et flagélla:'
  "10": 'super iníquos creáta sunt hæc ómnia: et propter illos factus est cataclýsmus.'
  "11": Omnia, quæ de terra sunt, in terram converténtur, et omnes aquæ in mare reverténtur.
  "12": Omne munus et iníquitas delébitur, et fides in sǽculum stabit.
  "13": Substántiæ iniustórum sicut flúvius siccabúntur, et sicut tonítruum magnum in plúvia personábunt.
  "14": 'In aperiéndo manus suas lætábitur: sic prævaricatóres in consummatióne tabéscent.'
  "15": Nepótes impiórum non multiplicábunt ramos, et radíces immúndæ super cacúmen petræ sonant.
  "16": Super omnem aquam viríditas, et ad oram flúminis ante omne fœnum evellétur.
  "17": Grátia sicut paradísus in benedictiónibus, et misericórdia in sǽculum pérmanet.
  "18": Vita sibi sufficiéntis operárii condulcábitur, et in ea invénies thesáurum.
  "19": Fílii, et ædificátio civitátis confirmábit nomen, et super hæc múlier immaculáta computábitur.
  "20": 'Vinum et música lætíficant cor: et super útraque diléctio sapiéntiæ.'
  "21": Tíbiæ et psaltérium suávem fáciunt melódiam, et super útraque lingua suávis.
  "22": Grátiam et spéciem desiderábit óculus tuus, et super hæc vírides satiónes.
  "23": Amícus et sodális in témpore conveniéntes, et super utrósque múlier cum viro.
  "24": Fratres in adiutórium in témpore tribulatiónis, et super eos misericórdia liberábit.
  "25": 'Aurum et argéntum est constitútio pedum: et super utrúmque consílium beneplácitum.'
  "26": Facultátes et virtútes exáltant cor, et super hæc timor Dómini.
  "27": Non est in timóre Dómini minorátio, et non est in eo inquírere adiutórium.
  "28": Timor Dómini sicut paradísus benedictiónis, et super omnem glóriam operuérunt illum.
  "29": 'Fili in témpore vitæ tuæ ne indígeas: mélius est enim mori, quam indigére.'
  "30": 'Vir respíciens in mensam aliénam, non est vita eius in cogitatióne victus: alit enim ánimam suam cibis aliénis.'
  "31": Vir autem disciplinátus, et erudítus custódiet se.
  "32": In ore imprudéntis condulcábitur inópia, et in ventre eius ignis ardébit.
