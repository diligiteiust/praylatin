bible: vulgate
lang: la
language: Latina
book: Ezechiel
chapter: "37"
verses:
  "1": 'Facta est super me manus Dómini, et edúxit me in spíritu Dómini: et dimísit me in médio campi qui erat plenus óssibus:'
  "2": 'et circumdúxit me per ea in gyro: erant autem multa valde super fáciem campi, siccáque veheménter.'
  "3": 'Et dixit ad me: Fili hóminis, putásne vivent ossa ista? Et dixi: Dómine Deus, tu nosti.'
  "4": 'Et dixit ad me: Vaticináre de óssibus istis, et dices eis: Ossa árida audíte verbum Dómini.'
  "5": 'Hæc dicit Dóminus Deus óssibus his: Ecce ego intromíttam in vos spíritum, et vivétis.'
  "6": 'Et dabo super vos nervos, et succréscere fáciam super vos carnes, et superexténdam in vobis cutem: et dabo vobis spíritum, et vivétis, et sciétis quia ego Dóminus.'
  "7": 'Et prophetávi sicut præcéperat mihi: factus est autem sónitus, prophetánte me, et ecce commótio: et accessérunt ossa ad ossa, unumquódque ad iunctúram suam.'
  "8": 'Et vidi, et ecce super ea nervi, et carnes ascendérunt: et exténta est in eis cutis désuper, et spíritum non habébant.'
  "9": 'Et dixit ad me: Vaticináre ad spíritum, vaticináre fili hóminis, et dices ad spíritum: Hæc dicit Dóminus Deus: A quátuor ventis veni spíritus, et insúffla super interféctos istos, et revivíscant.'
  "10": 'Et prophetávi sicut præcéperat mihi: et ingréssus est in ea spíritus, et vixérunt: steterúntque super pedes suos, exércitus grandis nimis valde.'
  "11": 'Et dixit ad me: Fili hóminis, ossa hæc univérsa, domus Israel est: ipsi dicunt: Aruérunt ossa nostra, et périit spes nostra, et abscíssi sumus.'
  "12": 'Proptérea vaticináre, et dices ad eos: Hæc dicit Dóminus Deus: Ecce ego apériam túmulos vestros, et edúcam vos de sepúlcris vestris pópulus meus: et indúcam vos in terram Israel.'
  "13": 'Et sciétis quia ego Dóminus, cum aperúero sepúlcra vestra, et edúxero vos de túmulis vestris pópule meus:'
  "14": 'et dédero spíritum meum in vobis, et vixéritis, et requiéscere vos fáciam super humum vestram: et sciétis quia ego Dóminus locútus sum, et feci, ait Dóminus Deus.'
  "15": 'Et factus est sermo Dómini ad me, dicens:'
  "16": 'Et tu fili hóminis sume tibi lignum unum, et scribe super illud: Iudæ, et filiórum Israel sociórum eius: et tolle lignum álterum, et scribe super illud: Ioseph ligno Ephraim, et cunctæ dómui Israel sociorúmque eius.'
  "17": 'Et adiúnge illa unum ad álterum tibi in lignum unum: et erunt in uniónem in manu tua.'
  "18": 'Cum autem díxerint ad te fílii pópuli tui, loquéntes: Nonne índicas nobis quid in his tibi velis?'
  "19": 'loquéris ad eos: Hæc dicit Dóminus Deus: Ecce ego assúmam lignum Ioseph, quod est in manu Ephraim, et tribus Israel, quæ sunt ei adiúnctæ, et dabo eas páriter cum ligno Iuda, et fáciam eas in lignum unum: et erunt unum in manu eius.'
  "20": Erunt autem ligna, super quæ scrípseris in manu tua, in óculis eórum.
  "21": 'Et dices ad eos: Hæc dicit Dóminus Deus: Ecce ego assúmam fílios Israel de médio natiónum, ad quas abiérunt: et congregábo eos úndique, et addúcam eos ad humum suam.'
  "22": 'Et fáciam eos in gentem unam in terra in móntibus Israel, et rex unus erit ómnibus ímperans: et non erunt ultra duæ gentes, nec dividéntur ámplius in duo regna.'
  "23": 'Neque polluéntur ultra in idólis suis, et abominatiónibus suis, et cunctis iniquitátibus suis: et salvos eos fáciam de univérsis sédibus, in quibus peccavérunt, et emundábo eos: et erunt mihi pópulus, et ego ero eis Deus.'
  "24": 'Et servus meus David rex super eos, et pastor unus erit ómnium eórum: in iudíciis meis ambulábunt, et mandáta mea custódient, et fácient ea.'
  "25": 'Et habitábunt super terram, quam dedi servo meo Iacob, in qua habitavérunt patres vestri: et habitábunt super eam ipsi, et fílii eórum, et fílii filiórum eórum, usque in sempitérnum: et David servus meus princeps eórum in perpétuum.'
  "26": 'Et percútiam illis fœdus pacis: pactum sempitérnum erit eis: et fundábo eos, et multiplicábo, et dabo sanctificatiónem meam in médio eórum in perpétuum.'
  "27": 'Et erit tabernáculum meum in eis: et ero eis Deus, et ipsi erunt mihi pópulus.'
  "28": Et scient gentes quia ego Dóminus sanctificátor Israel, cum fúerit sanctificátio mea in médio eórum in perpétuum.
