bible: vulgate
lang: la
language: Latina
book: Genesis
chapter: "50"
verses:
  "1": Quod cernens Ioseph, ruit super fáciem patris, flens et deósculans eum.
  "2": Præcepítque servis suis médicis ut aromátibus condírent patrem.
  "3": 'Quibus iussa expléntibus, transiérunt quadragínta dies: iste quippe mos erat cadáverum conditórum: flevítque eum Ægýptus septuagínta diébus.'
  "4": 'Et expléto planctus témpore, locútus est Ioseph ad famíliam Pharaónis: Si invéni grátiam in conspéctu vestro, loquímini in áuribus Pharaónis:'
  "5": 'eo quod pater meus adiuráverit me, dicens: En mórior: in sepúlcro meo, quod fodi mihi in terra Chánaan, sepélies me. Ascéndam ígitur, et sepéliam patrem meum, ac revértar.'
  "6": 'Dixítque ei Phárao: Ascénde, et sépeli patrem tuum sicut adiurátus es.'
  "7": 'Quo ascendénte, iérunt cum eo omnes senes domus Pharaónis, cunctíque maióres natu terræ Ægýpti:'
  "8": domus Ioseph cum frátribus suis, absque párvulis, et grégibus atque arméntis, quæ derelíquerant in terra Gessen.
  "9": 'Hábuit quoque in comitátu currus et équites: et facta est turba non módica.'
  "10": 'Venerúntque ad Aream Atad, quæ sita est trans Iordánem: ubi celebrántes exséquias planctu magno atque veheménti implevérunt septem dies.'
  "11": 'Quod cum vidíssent habitatóres terræ Chánaan, dixérunt: Planctus magnus est iste Ægýptiis. Et idcírco vocátum est nomen loci illíus, Planctus Ægýpti.'
  "12": 'Fecérunt ergo fílii Iacob sicut præcéperat eis:'
  "13": et portántes eum in terram Chánaan, sepeliérunt eum in spelúnca dúplici, quam émerat Abraham cum agro in possessiónem sepúlcri ab Ephron Hethǽo, contra fáciem Mambre.
  "14": Reversúsque est Ioseph in Ægýptum cum frátribus suis, et omni comitátu, sepúlto patre.
  "15": 'Quo mórtuo, timéntes fratres eius, et mútuo colloquéntes: Ne forte memor sit iniúriæ quam passus est, et reddat nobis omne malum quod fécimus,'
  "16": 'mandavérunt ei dicéntes: Pater tuus præcépit nobis ántequam morerétur,'
  "17": 'ut hæc tibi verbis illíus dicerémus: Obsecro ut obliviscáris scéleris fratrum tuórum, et peccáti atque malítiæ quam exercuérunt in te: nos quoque orámus ut servis Dei patris tui dimíttas iniquitátem hanc. Quibus audítis flevit Ioseph.'
  "18": 'Venerúntque ad eum fratres sui: et proni adorántes in terram, dixérunt: Servi tui sumus.'
  "19": 'Quibus ille respóndit: Nolíte timére: num Dei póssumus resístere voluntáti?'
  "20": 'Vos cogitástis de me malum: sed Deus vertit illud in bonum, ut exaltáret me, sicut in præsentiárum cérnitis, et salvos fáceret multos pópulos.'
  "21": 'Nolíte timére: ego pascam vos et párvulos vestros: consolatúsque est eos, et blande ac léniter est locútus.'
  "22": 'Et habitávit in Ægýpto cum omni domo patris sui: vixítque centum decem annis. Et vidit Ephraim fílios usque ad tértiam generatiónem. Fílii quoque Machir fílii Manásse nati sunt in génibus Ioseph.'
  "23": 'Quibus transáctis, locútus est frátribus suis: Post mortem meam Deus visitábit vos, et ascéndere vos fáciet de terra ista ad terram quam iurávit Abraham, Isaac et Iacob.'
  "24": 'Cumque adiurásset eos atque dixísset: Deus visitábit vos, asportáte ossa mea vobíscum de loco isto:'
  "25": mórtuus est, explétis centum decem vitæ suæ annis. Et cónditus aromátibus, repósitus est in lóculo in Ægýpto.
