bible: vulgate
lang: la
language: Latina
book: II Machabaeorum
chapter: "14"
verses:
  "1": Sed post triénnii tempus, cognóvit Iudas, et qui cum eo erant, Demétrium Seléuci cum multitúdine válida, et návibus, per portum Trípolis ascendísse ad loca opportúna,
  "2": et tenuísse regiónes advérsus Antíochum, et ducem eius Lýsiam.
  "3": Alcimus autem quidam, qui summus sacérdos fúerat, sed voluntárie coinquinátus est tempóribus commistiónis, consíderans nullo modo sibi esse salútem, neque accéssum ad altáre,
  "4": venit ad regem Demétrium centésimo quinquagésimo anno, ófferens ei corónam áuream, et palmam, super hæc et thallos, qui templi esse videbántur. Et ipsa quidem die síluit.
  "5": Tempus autem opportúnum deméntiæ suæ nactus, convocátus a Demétrio ad consílium, et interrogátus quibus rebus et consíliis Iudǽi niteréntur,
  "6": 'respóndit: Ipsi, qui dicúntur Assidǽi Iudæórum, quibus præest Iudas Machabǽus, bella nútriunt, et seditiónes movent, nec patiúntur regnum esse quiétum:'
  "7": 'nam et ego defraudátus paréntum glória (dico autem summo sacerdótio) huc veni:'
  "8": 'primo quidem utilitátibus regis fidem servans, secúndo autem étiam cívibus cónsulens: nam illórum pravitáte univérsum genus nostrum non mínime vexátur.'
  "9": 'Sed oro his síngulis o rex cógnitis, et regióni et géneri, secúndum humanitátem tuam pervulgátam ómnibus, próspice:'
  "10": nam, quámdiu súperest Iudas, impossíbile est pacem esse negótiis.
  "11": Tálibus autem ab hoc dictis, et céteri amíci hostíliter se habéntes advérsus Iudam, inflammavérunt Demétrium.
  "12": 'Qui statim Nicánorem præpósitum elephantórum ducem misit in Iudǽam:'
  "13": 'datis mandátis ut ipsum quidem Iudam cáperet: eos vero, qui cum illo erant, dispérgeret, et constitúeret Alcimum máximi templi summum sacerdótem.'
  "14": Tunc gentes, quæ de Iudǽa fúgerant Iudam, gregátim se Nicánori miscébant, misérias, et clades Iudæórum prosperitátes rerum suárum existimántes.
  "15": Audíto ítaque Iudǽi Nicánoris advéntu, et convéntu natiónum, conspérsi terra rogábant eum, qui pópulum suum constítuit, ut in ætérnum custodíret, quique suam portiónem signis evidéntibus prótegit.
  "16": Imperánte autem duce, statim inde movérunt, convenerúntque ad castéllum Dessau.
  "17": 'Simon vero frater Iudæ commíserat cum Nicánore: sed contérritus est repentíno advéntu adversariórum.'
  "18": Nicánor tamen, áudiens virtútem cómitum Iudæ, et ánimi magnitúdinem, quam pro pátriæ certamínibus habébant, sánguine iudícium fácere metuébat.
  "19": Quam ob rem præmísit Posidónium, et Theodótium, et Matthíam, ut darent dextras atque accíperent.
  "20": Et cum diu de his consílium agerétur, et ipse dux ad multitúdinem retulísset, ómnium una fuit senténtia amicítiis annúere.
  "21": 'Itaque diem constituérunt, qua secréto inter se ágerent: et síngulis sellæ prolátæ sunt, et pósitæ.'
  "22": 'Præcépit autem Iudas armátos esse locis opportúnis, ne forte ab hóstibus repénte mali áliquid orirétur: et cóngruum collóquium fecérunt.'
  "23": 'Morabátur autem Nicánor Ierosólymis, nihílque iníque agébat: gregésque turbárum, quæ congregátæ fúerant, dimísit.'
  "24": Habébat autem Iudam semper carum ex ánimo, et erat viro inclinátus.
  "25": 'Rogavítque eum dúcere uxórem, filiósque procreáre. Núptias fecit: quiéte egit, communitérque vivébant.'
  "26": Alcimus autem, videns caritátem illórum ad ínvicem, et conventiónes, venit ad Demétrium, et dicébat Nicánorem rebus aliénis assentíre, Iudámque regni insidiatórem successórem sibi destinásse.
  "27": Itaque rex exasperátus, et péssimis huius criminatiónibus irritátus, scripsit Nicánori, dicens gráviter quidem se ferre de amicítiæ conventióne, iubére tamen Machabǽum cítius vinctum míttere Antiochíam.
  "28": 'Quibus cógnitis, Nicánor consternabátur, et gráviter ferébat, si ea, quæ convénerant, írrita fáceret, nihil læsus a viro:'
  "29": sed, quia regi resístere non póterat, opportunitátem observábat, qua præcéptum perfíceret.
  "30": At Machabǽus, videns secum austérius ágere Nicánorem, et consuétum occúrsum ferócius exhibéntem, intélligens non ex bono esse austeritátem istam, paucis suórum congregátis, occultávit se a Nicánore.
  "31": 'Quod cum ille cognóvit fórtiter se a viro prævéntum, venit ad máximum et sanctíssimum templum: et sacerdótibus sólitas hóstias offeréntibus, iussit sibi tradi virum.'
  "32": Quibus cum iuraménto dicéntibus nescíre se ubi esset qui quærebátur, exténdens manum ad templum,
  "33": 'iurávit, dicens: Nisi Iudam mihi vinctum tradidéritis, istud Dei fanum in planítiem dedúcam, et altáre effódiam, et templum hoc Líbero patri consecrábo.'
  "34": 'Et his dictis ábiit. Sacerdótes autem protendéntes manus in cælum, invocábant eum, qui semper propugnátor esset gentis ipsórum, hæc dicéntes:'
  "35": Tu Dómine universórum, qui nullíus índiges, voluísti templum habitatiónis tuæ fíeri in nobis.
  "36": Et nunc sancte sanctórum ómnium Dómine, consérva in ætérnum impollútam domum istam, quæ nuper mundáta est.
  "37": 'Razías autem quidam de senióribus ab Ierosólymis delátus est Nicánori, vir amátor civitátis, et bene áudiens: qui pro afféctu pater Iudæórum appellabátur.'
  "38": Hic multis tempóribus continéntiæ propósitum ténuit in Iudaísmo, corpúsque et ánimam trádere conténtus pro perseverántia.
  "39": Volens autem Nicánor manifestáre ódium, quod habébat in Iudǽos, misit mílites quingéntos, ut eum comprehénderent.
  "40": Putábat enim, si illum decepísset, se cladem Iudǽis máximam illatúrum.
  "41": 'Turbis autem irrúere in domum eius, et iánuam dirúmpere, atque ignem admovére cupiéntibus, cum iam comprehenderétur, gládio se pétiit:'
  "42": éligens nobíliter mori pótius, quam súbditus fíeri peccatóribus, et contra natáles suos indígnis iniúriis agi.
  "43": 'Sed cum per festinatiónem non certo ictu plagam dedísset, et turbæ intra óstia irrúmperent, recúrrens audácter ad murum præcipitávit semetípsum viríliter in turbas:'
  "44": 'quibus velóciter locum dántibus cásui eius, venit per médiam cervícem:'
  "45": 'et cum adhuc spiráret, accénsus ánimo, surréxit: et cum sanguis eius magno fluxu deflúeret, et gravíssimis vulnéribus esset sáucius, cursu turbam pertránsiit:'
  "46": 'et stans supra quamdam petram prærúptam, et iam exsánguis efféctus, compléxus intestína sua, utrísque mánibus proiécit super turbas, ínvocans dominatórem vitæ ac spíritus, ut hæc illi íterum rédderet: atque ita vita defúnctus est.'
