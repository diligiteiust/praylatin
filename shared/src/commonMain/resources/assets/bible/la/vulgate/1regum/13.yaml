bible: vulgate
lang: la
language: Latina
book: I Regum
chapter: "13"
verses:
  "1": Et ecce vir Dei venit de Iuda in sermóne Dómini in Bethel, Ieróboam stante super altáre, et thus iaciénte.
  "2": 'Et exclamávit contra altáre in sermóne Dómini, et ait: Altáre, altáre, hæc dicit Dóminus: Ecce fílius nascétur dómui David, Iosías nómine, et immolábit super te sacerdótes excelsórum, qui nunc in te thura succéndunt: et ossa hóminum super te incéndet.'
  "3": 'Dedítque in illa die signum, dicens: Hoc erit signum quod locútus est Dóminus: ecce altáre scindétur, et effundétur cinis qui in eo est.'
  "4": 'Cumque audísset rex sermónem hóminis Dei, quem inclamáverat contra altáre in Bethel, exténdit manum suam de altári, dicens: Apprehéndite eum. Et exáruit manus eius, quam exténderat contra eum, nec váluit retráhere eam ad se.'
  "5": Altáre quoque scissum est, et effúsus est cinis de altári, iuxta signum quod prædíxerat vir Dei in sermóne Dómini.
  "6": 'Et ait rex ad virum Dei: Deprecáre fáciem Dómini Dei tui, et ora pro me, ut restituátur manus mea mihi. Oravítque vir Dei fáciem Dómini, et revérsa est manus regis ad eum, et facta est sicut prius fúerat.'
  "7": 'Locútus est autem rex ad virum Dei: Veni mecum domum ut prándeas, et dabo tibi múnera.'
  "8": 'Respondítque vir Dei ad regem: Si déderis mihi médiam partem domus tuæ, non véniam tecum, nec cómedam panem, neque bibam aquam in loco isto:'
  "9": 'sic enim mandátum est mihi in sermóne Dómini præcipiéntis: Non cómedes panem, neque bibes aquam, nec revertéris per viam, qua venísti.'
  "10": Abiit ergo per áliam viam, et non est revérsus per iter, quo vénerat in Bethel.
  "11": 'Prophétes autem quidam senex habitábat in Bethel: ad quem venérunt fílii sui, et narravérunt ei ómnia ópera, quæ fécerat vir Dei illa die in Bethel: et verba quæ locútus fúerat ad regem, narravérunt patri suo.'
  "12": 'Et dixit eis pater eórum: Per quam viam ábiit? Ostendérunt ei fílii sui viam, per quam abíerat vir Dei, qui vénerat de Iuda.'
  "13": 'Et ait fíliis suis: Stérnite mihi ásinum. Qui cum stravíssent, ascéndit,'
  "14": 'et ábiit post virum Dei, et invénit eum sedéntem subtus terebínthum: et ait illi: Tune es vir Dei qui venísti de Iuda? Respóndit ille: Ego sum.'
  "15": 'Dixítque ad eum: Veni mecum domum, ut cómedas panem.'
  "16": 'Qui ait: Non possum revérti, neque veníre tecum: nec cómedam panem, neque bibam aquam in loco isto:'
  "17": 'quia locútus est Dóminus ad me in sermóne Dómini, dicens: Non cómedes panem, et non bibes aquam ibi, nec revertéris per viam, qua íeris.'
  "18": 'Qui ait illi: Et ego prophéta sum símilis tui: et ángelus locútus est mihi in sermóne Dómini, dicens: Reduc eum tecum in domum tuam, ut cómedat panem, et bibat aquam. Feféllit eum,'
  "19": 'et redúxit secum: comédit ergo panem in domo eius, et bibit aquam.'
  "20": Cumque sedérent ad mensam, factus est sermo Dómini ad prophétam, qui redúxerat eum.
  "21": 'Et exclamávit ad virum Dei, qui vénerat de Iuda, dicens: Hæc dicit Dóminus: Quia non obédiens fuísti ori Dómini, et non custodísti mandátum, quod præcépit tibi Dóminus Deus tuus,'
  "22": et revérsus es, et comedísti panem, et bibísti aquam in loco in quo præcépit tibi ne coméderes panem neque bíberes aquam, non inferétur cadáver tuum in sepúlcrum patrum tuórum.
  "23": Cumque comedísset et bibísset, stravit ásinum suum prophétæ, quem redúxerat.
  "24": 'Qui cum abiísset, invénit eum leo in via, et occídit, et erat cadáver eius proiéctum in itínere: ásinus autem stabat iuxta illum, et leo stabat iuxta cadáver.'
  "25": Et ecce viri transeúntes vidérunt cadáver proiéctum in via, et leónem stantem iuxta cadáver. Et venérunt, et divulgavérunt in civitáte, in qua prophétes ille senex habitábat.
  "26": 'Quod cum audísset prophéta ille, qui redúxerat eum, ait: Vir Dei est, qui inobédiens fuit ori Dómini, et trádidit eum Dóminus leóni, et confrégit eum, et occídit iuxta verbum Dómini, quod locútus est ei.'
  "27": 'Dixítque ad fílios suos: Stérnite mihi ásinum. Qui cum stravíssent,'
  "28": 'et ille abiísset, invénit cadáver eius proiéctum in via, et ásinum et leónem stantes iuxta cadáver: non comédit leo de cadávere, nec læsit ásinum.'
  "29": Tulit ergo prophétes cadáver viri Dei, et pósuit illud super ásinum, et revérsus íntulit in civitátem prophétæ senis ut plángeret eum.
  "30": 'Et pósuit cadáver eius in sepúlcro suo, et planxérunt eum: Heu heu mi frater.'
  "31": 'Cumque planxíssent eum, dixit ad fílios suos: Cum mórtuus fúero, sepelíte me in sepúlcro, in quo vir Dei sepúltus est: iuxta ossa eius pónite ossa mea.'
  "32": Profécto enim véniet sermo, quem prædíxit in sermóne Dómini contra altáre quod est in Bethel, et contra ómnia fana excelsórum, quæ sunt in úrbibus Samaríæ.
  "33": 'Post verba hæc non est revérsus Ieróboam de via sua péssima, sed e contrário fecit de novíssimis pópuli sacerdótes excelsórum: quicúmque volébat, implébat manum suam, et fiébat sacérdos excelsórum.'
  "34": Et propter hanc causam peccávit domus Ieróboam, et evérsa est, et deléta de superfície terræ.
