bible: vulgate
lang: la
language: Latina
book: I Samuelis
chapter: "23"
verses:
  "1": 'Et annuntiavérunt David, dicéntes: Ecce Philísthiim oppúgnant Céilam et dirípiunt áreas.'
  "2": 'Consúluit ergo David Dóminum, dicens: Num vadam, et percútiam Philisthǽos istos? Et ait Dóminus ad David: Vade, et percúties Philisthǽos, et Céilam salvábis.'
  "3": 'Et dixérunt viri, qui erant cum David, ad eum: Ecce nos hic in Iudǽa consisténtes timémus: quanto magis si iérimus in Céilam advérsum ágmina Philisthinórum?'
  "4": 'Rursum ergo David consúluit Dóminum. Qui respóndens, ait ei: Surge, et vade in Céilam: ego enim tradam Philisthǽos in manu tua.'
  "5": 'Abiit ergo David, et viri eius in Céilam, et pugnávit advérsum Philisthǽos: et abégit iuménta eórum, et percússit eos plaga magna: et salvávit David habitatóres Céilæ.'
  "6": Porro eo témpore, quo fugiébat Abíathar fílius Achímelech ad David in Céilam, ephod secum habens descénderat.
  "7": 'Nuntiátum est autem Sauli quod venísset David in Céilam: et ait Saul: Trádidit eum Deus in manus meas, conclusúsque est introgréssus urbem, in qua portæ et seræ sunt.'
  "8": Et præcépit Saul omni pópulo ut ad pugnam descénderet in Céilam, et obsíderet David et viros eius.
  "9": 'Quod cum David rescísset quia præparáret ei Saul clam malum, dixit ad Abíathar sacerdótem: Applica ephod.'
  "10": 'Et ait David: Dómine Deus Israel, audívit famam servus tuus, quod dispónat Saul veníre in Céilam, ut evértat urbem propter me:'
  "11": 'si tradent me viri Céilæ in manus eius? et si descéndet Saul, sicut audívit servus tuus? Dómine Deus Israel, índica servo tuo. Et ait Dóminus: Descéndet.'
  "12": 'Dixítque David: Si tradent me viri Céilæ, et viros qui sunt mecum, in manus Saul? Et dixit Dóminus: Tradent.'
  "13": 'Surréxit ergo David et viri eius quasi sexcénti, et egréssi de Céila, huc atque illuc vagabántur incérti: nuntiatúmque est Sauli quod fugísset David de Céila, et salvátus esset: quam ob rem dissimulávit exíre.'
  "14": 'Morabátur autem David in desérto in locis firmíssimis, mansítque in monte solitúdinis Ziph, in monte opáco: quærébat eum tamen Saul cunctis diébus, et non trádidit eum Deus in manus eius.'
  "15": Et vidit David quod egréssus esset Saul ut quǽreret ánimam eius. Porro David erat in desérto Ziph in silva.
  "16": 'Et surréxit Iónathas fílius Saul, et ábiit ad David in silvam, et confortávit manus eius in Deo: dixítque ei:'
  "17": 'Ne tímeas: neque enim invéniet te manus Saul patris mei, et tu regnábis super Israel, et ego ero tibi secúndus: sed et Saul pater meus scit hoc.'
  "18": 'Percússit ergo utérque fœdus coram Dómino: mansítque David in silva, Iónathas autem revérsus est in domum suam.'
  "19": 'Ascendérunt autem Ziphǽi ad Saul in Gábaa, dicéntes: Nonne ecce David látitat apud nos in locis tutíssimis silvæ, in colle Háchila, quæ est ad déxteram desérti?'
  "20": 'Nunc ergo, sicut desiderávit ánima tua ut descénderes, descénde: nostrum autem erit ut tradámus eum in manus regis.'
  "21": 'Dixítque Saul: Benedícti vos a Dómino, quia doluístis vicem meam.'
  "22": 'Abíte ergo, oro, et diligéntius præparáte, et curiósius ágite, et consideráte locum ubi sit pes eius, vel quis víderit eum ibi: recógitat enim de me, quod cállide insídier ei.'
  "23": 'Consideráte, et vidéte ómnia latíbula eius, in quibus abscónditur: et revertímini ad me ad rem certam, ut vadam vobíscum. Quod si étiam in terram se abstrúserit, perscrutábor eum in cunctis míllibus Iuda.'
  "24": 'At illi surgéntes abiérunt in Ziph ante Saul: David autem et viri eius erant in desérto Maon, in campéstribus ad déxteram Iésimon.'
  "25": 'Ivit ergo Saul et sócii eius ad quæréndum eum. Et nuntiátum est David: statímque descéndit ad petram, et versabátur in desérto Maon: quod cum audísset Saul, persecútus est David in desérto Maon.'
  "26": 'Et ibat Saul ad latus montis ex parte una: David autem et viri eius erant in látere montis ex parte áltera. Porro David desperábat se posse evádere a fácie Saul: ítaque Saul et viri eius in modum corónæ cingébant David et viros eius, ut cáperent eos.'
  "27": 'Et núntius venit ad Saul, dicens: Festína, et veni, quóniam infudérunt se Philísthiim super terram.'
  "28": 'Revérsus est ergo Saul desístens pérsequi David, et perréxit in occúrsum Philisthinórum: propter hoc vocavérunt locum illum, Petram dividéntem.'
