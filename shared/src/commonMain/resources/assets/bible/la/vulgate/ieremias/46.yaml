bible: vulgate
lang: la
language: Latina
book: Ieremias
chapter: "46"
verses:
  "1": Quod factum est verbum Dómini ad Ieremíam prophétam contra gentes,
  "2": ad Ægýptum, advérsum exércitum Pharaónis Néchao regis Ægýpti, qui erat iuxta flúvium Euphráten in Chárcamis, quem percússit Nabuchodónosor rex Babylónis, in quarto anno Ióakim fílii Iosíæ regis Iuda.
  "3": Præparáte scutum, et clýpeum, et procédite ad bellum.
  "4": 'Iúngite equos, et ascéndite équites: state in gáleis, políte lánceas, indúite vos lorícis.'
  "5": 'Quid ígitur? vidi ipsos pávidos, et terga verténtes, fortes eórum cæsos: fugérunt cónciti, nec respexérunt: terror úndique, ait Dóminus.'
  "6": 'Non fúgiat velox, nec salvári se putet fortis: ad aquilónem iuxta flumen Euphráten victi sunt, et ruérunt.'
  "7": 'Quis est iste, qui quasi flumen ascéndit: et véluti fluviórum intuméscunt gúrgites eius?'
  "8": 'Ægýptus flúminis instar ascéndit, et velut flúmina movebúntur fluctus eius, et dicet: Ascéndens opériam terram: perdam civitátem, et habitatóres eius.'
  "9": Ascéndite equos, et exsultáte in cúrribus, et procédant fortes, Æthiópia et Líbyes tenéntes scutum, et Lýdii arripiéntes et iaciéntes sagíttas.
  "10": 'Dies autem ille Dómini Dei exercítuum dies ultiónis, ut sumat vindíctam de inimícis suis: devorábit gládius, et saturábitur, et inebriábitur sánguine eórum: víctima enim Dómini Dei exercítuum in terra aquilónis iuxta flumen Euphráten.'
  "11": 'Ascénde in Gálaad, et tolle resínam virgo fília Ægýpti: frustra multíplicas medicámina, sánitas non erit tibi.'
  "12": 'Audiérunt gentes ignomíniam tuam, et ululátus tuus replévit terram: quia fortis impégit in fortem, et ambo páriter concidérunt.'
  "13": 'Verbum, quod locútus est Dóminus ad Ieremíam prophétam, super eo quod ventúrus esset Nabuchodónosor rex Babylónis, et percussúrus terram Ægýpti:'
  "14": 'Annuntiáte Ægýpto, et audítum fácite in Mágdalo, et résonet in Memphis, et in Taphnis, dícite: Sta, et prǽpara te: quia devorábit gládius ea, quæ per circúitum tuum sunt.'
  "15": Quare compútruit fortis tuus? non stetit, quóniam Dóminus subvértit eum.
  "16": 'Multiplicávit ruéntes, cecidítque vir ad próximum suum, et dicent: Surge, et revertámur ad pópulum nostrum, et ad terram nativitátis nostræ, a fácie gládii colúmbæ.'
  "17": Vocáte nomen Pharaónis regis Ægýpti, tumúltum addúxit tempus.
  "18": Vivo ego (inquit rex, Dóminus exercítuum nomen eius), quóniam sicut Thabor in móntibus, et sicut Carmélus in mari, véniet.
  "19": 'Vasa transmigratiónis fac tibi habitátrix fília Ægýpti: quia Memphis in solitúdinem erit, et deserétur, et inhabitábilis erit.'
  "20": Vítula élegans atque formósa Ægýptus, stimulátor ab aquilóne véniet ei.
  "21": 'Mercenárii quoque eius, qui versabántur in médio eius quasi vítuli sagináti versi sunt, et fugérunt simul, nec stare potuérunt: quia dies interfectiónis eórum venit super eos, tempus visitatiónis eórum.'
  "22": 'Vox eius quasi æris sonábit: quóniam cum exércitu properábunt, et cum secúribus vénient ei quasi cædéntes ligna.'
  "23": 'Succidérunt saltum eius, ait Dóminus, qui supputári non potest: multiplicáti sunt super locústas, et non est eis númerus.'
  "24": Confúsa est fília Ægýpti, et trádita in manu pópuli aquilónis.
  "25": 'Dixit Dóminus exercítuum, Deus Israel: Ecce ego visitábo super tumúltum Alexandríæ, et super Pharaónem, et super Ægýptum, et super deos eius, et super reges eius, et super Pharaónem, et super eos, qui confídunt in eo.'
  "26": 'Et dabo eos in manu quæréntium ánimam eórum, et in manu Nabuchodónosor regis Babylónis, et in manu servórum eius: et post hæc habitábitur sicut diébus prístinis, ait Dóminus.'
  "27": 'Et tu ne tímeas serve meus Iacob, et ne páveas Israel: quia ecce ego salvum te fáciam de longínquo, et semen tuum de terra captivitátis tuæ: et revertétur Iacob, et requiéscet, et prosperábitur: et non erit, qui extérreat eum.'
  "28": 'Et tu noli timére serve meus Iacob, ait Dóminus: quia tecum ego sum, quia ego consúmam cunctas gentes, ad quas eiéci te: te vero non consúmam, sed castigábo te in iudício, nec quasi innocénti parcam tibi.'
