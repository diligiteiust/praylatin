bible: vulgate
lang: la
language: Latina
book: Ieremias
chapter: "18"
verses:
  "1": 'Verbum quod factum est ad Ieremíam a Dómino, dicens:'
  "2": Surge, et descénde in domum fíguli, et ibi áudies verba mea.
  "3": Et descéndi in domum fíguli, et ecce ipse faciébat opus super rotam.
  "4": 'Et dissipátum est vas, quod ipse faciébat e luto mánibus suis: conversúsque fecit illud vas álterum, sicut placúerat in óculis eius ut fáceret.'
  "5": 'Et factum est verbum Dómini ad me, dicens:'
  "6": Numquid sicut fígulus iste, non pótero vobis fácere, domus Israel, ait Dóminus? ecce sicut lutum in manu fíguli, sic vos in manu mea, domus Israel.
  "7": Repénte loquar advérsum gentem et advérsus regnum, ut eradícem, et déstruam, et dispérdam illud.
  "8": 'Si pœniténtiam égerit gens illa a malo suo, quod locútus sum advérsus eam: agam et ego pœniténtiam super malo, quod cogitávi ut fácerem ei.'
  "9": Et súbito loquar de gente et de regno, ut ædíficem et plantem illud.
  "10": 'Si fécerit malum in óculis meis, ut non áudiat vocem meam: pœniténtiam agam super bono, quod locútus sum ut fácerem ei.'
  "11": 'Nunc ergo dic viro Iuda, et habitatóribus Ierúsalem, dicens: Hæc dicit Dóminus: Ecce ego fingo contra vos malum, et cógito contra vos cogitatiónem: revertátur unusquísque a via sua mala, et dirígite vias vestras et stúdia vestra.'
  "12": 'Qui dixérunt: Desperávimus: post cogitatiónes enim nostras íbimus, et unusquísque pravitátem cordis sui mali faciémus.'
  "13": 'Ideo hæc dicit Dóminus: Interrogáte gentes: Quis audívit tália horribília, quæ fecit nimis virgo Israel?'
  "14": Numquid defíciet de petra agri nix Líbani? aut evélli possunt aquæ erumpéntes frígidæ, et defluéntes?
  "15": 'Quia oblítus est mei pópulus meus, frustra libántes, et impingéntes in viis suis, in sémitis sǽculi, ut ambulárent per eas in itínere non trito:'
  "16": 'ut fíeret terra eórum in desolatiónem, et in síbilum sempitérnum: omnis, qui præteríerit per eam, obstupéscet, et movébit caput suum.'
  "17": 'Sicut ventus urens dispérgam eos coram inimíco: dorsum, et non fáciem osténdam eis in die perditiónis eórum.'
  "18": 'Et dixérunt: Veníte, et cogitémus contra Ieremíam cogitatiónes: non enim períbit lex a sacerdóte, neque consílium a sapiénte, nec sermo a prophéta: veníte, et percutiámus eum lingua, et non attendámus ad univérsos sermónes eius.'
  "19": Atténde Dómine ad me, et audi vocem adversariórum meórum.
  "20": Numquid rédditur pro bono malum, quia fodérunt fóveam ánimæ meæ? Recordáre quod stéterim in conspéctu tuo ut lóquerer pro eis bonum, et avérterem indignatiónem tuam ab eis.
  "21": 'Proptérea da fílios eórum in famem, et deduc eos in manus gládii: fiant uxóres eórum absque líberis, et víduæ: et viri eárum interficiántur morte: iúvenes eórum confodiántur gládio in prœ́lio.'
  "22": 'Audiátur clamor de dómibus eórum: addúces enim super eos latrónem repénte, quia fodérunt fóveam ut cáperent me, et láqueos abscondérunt pédibus meis.'
  "23": 'Tu autem Dómine scis omne consílium eórum advérsum me in mortem: ne propitiéris iniquitáti eórum, et peccátum eórum a fácie tua non deleátur: fiant corruéntes in conspéctu tuo, in témpore furóris tui abútere eis.'
