bible: vulgate
lang: la
language: Latina
book: Ezechiel
chapter: "25"
verses:
  "1": 'Et factus est sermo Dómini ad me, dicens:'
  "2": Fili hóminis, pone fáciem tuam contra fílios Ammon, et prophetábis de eis.
  "3": 'Et dices fíliis Ammon: Audíte verbum Dómini Dei: Hæc dicit Dóminus Deus: Pro eo quod dixísti: Euge, euge super sanctuárium meum, quia pollútum est: et super terram Israel, quóniam desoláta est: et super domum Iuda, quóniam ducti sunt in captivitátem:'
  "4": 'idcírco ego tradam te fíliis orientálibus in hereditátem: et collocábunt caulas suas in te, et ponent in te tentória sua: ipsi cómedent fruges tuas, et ipsi bibent lac tuum.'
  "5": 'Dabóque Rabbath in habitáculum camelórum, et fílios Ammon in cubíle pécorum: et sciétis quia ego Dóminus.'
  "6": 'Quia hæc dicit Dóminus Deus: Pro eo quod plausísti manu et percussísti pede, et gavísa es ex toto afféctu super terram Israel:'
  "7": 'idcírco ecce ego exténdam manum meam super te, et tradam te in direptiónem géntium, et interfíciam te de pópulis, et perdam de terris, et cónteram: et scies quia ego Dóminus.'
  "8": 'Hæc dicit Dóminus Deus: Pro eo quod dixérunt Moab et Seir: Ecce sicut omnes gentes, domus Iuda:'
  "9": idcírco ecce ego apériam húmerum Moab de civitátibus, de civitátibus, inquam, eius, et de fínibus eius, ínclytas terræ Bethiésimoth, et Beélmeon, et Cariáthaim,
  "10": 'fíliis oriéntis cum fíliis Ammon, et dabo eam in hereditátem: ut non sit ultra memória filiórum Ammon in géntibus.'
  "11": 'Et in Moab fáciam iudícia: et scient quia ego Dóminus.'
  "12": 'Hæc dicit Dóminus Deus: Pro eo quod fecit Idumǽa ultiónem ut se vindicáret de fíliis Iuda, peccavítque delínquens, et vindíctam expetívit de eis:'
  "13": 'idcírco hæc dicit Dóminus Deus: Exténdam manum meam super Idumǽam, et áuferam de ea hóminem et iuméntum, et fáciam eam desértam ab austro: et qui sunt in Dedan, gládio cadent.'
  "14": 'Et dabo ultiónem meam super Idumǽam per manum pópuli mei Israel: et fácient in Edom iuxta iram meam, et furórem meum: et scient vindíctam meam, dicit Dóminus Deus.'
  "15": 'Hæc dicit Dóminus Deus: Pro eo quod fecérunt Palæstíni vindíctam, et ulti se sunt toto ánimo, interficiéntes, et impléntes inimicítias véteres:'
  "16": 'proptérea hæc dicit Dóminus Deus: Ecce ego exténdam manum meam super Palæstínos, et interfíciam interfectóres, et perdam relíquias marítimæ regiónis:'
  "17": 'faciámque in eis ultiónes magnas, árguens in furóre: et scient quia ego Dóminus, cum dédero vindíctam meam super eos.'
