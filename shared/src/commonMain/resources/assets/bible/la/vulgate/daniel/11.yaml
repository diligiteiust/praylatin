bible: vulgate
lang: la
language: Latina
book: Daniel
chapter: "11"
verses:
  "1": Ego autem ab anno primo Daríi Medi stabam ut confortarétur, et roborarétur.
  "2": 'Et nunc veritátem annuntiábo tibi. Ecce adhuc tres reges stabunt in Pérside, et quartus ditábitur ópibus nímiis super omnes: et cum invalúerit divítiis suis, concitábit omnes advérsum regnum Grǽciæ.'
  "3": Surget vero rex fortis, et dominábitur potestáte multa, et fáciet quod placúerit ei.
  "4": 'Et cum stéterit, conterétur regnum eius, et dividétur in quátuor ventos cæli: sed non in pósteros eius, neque secúndum poténtiam illíus, qua dominátus est: lacerábitur enim regnum eius étiam in extérnos, excéptis his.'
  "5": 'Et confortábitur rex austri: et de princípibus eius prævalébit super eum, et dominábitur ditióne: multa enim dominátio eius.'
  "6": 'Et post finem annórum fœderabúntur: filiáque regis austri véniet ad regem aquilónis fácere amicítiam, et non obtinébit fortitúdinem bráchii, nec stabit semen eius: et tradétur ipsa, et qui adduxérunt eam, adolescéntes eius, et qui confortábant eam in tempóribus.'
  "7": 'Et stabit de gérmine radícum eius plantátio: et véniet cum exércitu, et ingrediétur provínciam regis aquilónis: et abutétur eis, et obtinébit.'
  "8": 'Insuper et deos eórum, et sculptília, vasa quoque pretiósa argénti et auri, captíva ducet in Ægýptum: ipse prævalébit advérsus regem aquilónis.'
  "9": Et intrábit in regnum rex austri, et revertétur ad terram suam.
  "10": 'Fílii autem eius provocabúntur, et congregábunt multitúdinem exercítuum plurimórum: et véniet próperans, et inúndans: et revertétur, et concitábitur, et congrediétur cum róbore eius.'
  "11": Et provocátus rex austri egrediétur, et pugnábit advérsus regem aquilónis, et præparábit multitúdinem nímiam, et dábitur multitúdo in manu eius.
  "12": Et cápiet multitúdinem, et exaltábitur cor eius, et deíciet multa míllia, sed non prævalébit.
  "13": 'Convertétur enim rex aquilónis, et præparábit multitúdinem multo maiórem quam prius: et in fine témporum annorúmque véniet próperans cum exércitu magno, et ópibus nímiis.'
  "14": 'Et in tempóribus illis multi consúrgent advérsus regem austri: fílii quoque prævaricatórum pópuli tui extolléntur ut ímpleant visiónem, et córruent.'
  "15": 'Et véniet rex aquilónis, et comportábit ággerem, et cápiet urbes munitíssimas: et bráchia austri non sustinébunt, et consúrgent elécti eius ad resisténdum, et non erit fortitúdo.'
  "16": 'Et fáciet véniens super eum iuxta plácitum suum, et non erit qui stet contra fáciem eius: et stabit in terra ínclyta, et consumétur in manu eius.'
  "17": 'Et ponet fáciem suam ut véniat ad tenéndum univérsum regnum eius, et recta fáciet cum eo: et fíliam feminárum dabit ei, ut evértat illud: et non stabit, nec illíus erit.'
  "18": 'Et convértet fáciem suam ad ínsulas, et cápiet multas: et cessáre fáciet príncipem oppróbrii sui, et oppróbrium eius convertétur in eum.'
  "19": Et convértet fáciem suam ad impérium terræ suæ, et impínget, et córruet, et non inveniétur.
  "20": 'Et stabit in loco eius vilíssimus, et indígnus decóre régio: et in paucis diébus conterétur, non in furóre, nec in prœ́lio.'
  "21": 'Et stabit in loco eius despéctus, et non tribuétur ei honor régius: et véniet clam, et obtinébit regnum in frauduléntia.'
  "22": 'Et bráchia pugnántis expugnabúntur a fácie eius, et conteréntur: ínsuper et dux fœ́deris.'
  "23": 'Et post amicítias, cum eo fáciet dolum: et ascéndet, et superábit in módico pópulo.'
  "24": 'Et abundántes, et úberes urbes ingrediétur: et fáciet quæ non fecérunt patres eius, et patres patrum eius: rapínas, et prædam, et divítias eórum dissipábit, et contra firmíssimas cogitatiónes iníbit: et hoc usque ad tempus.'
  "25": 'Et concitábitur fortitúdo eius, et cor eius advérsum regem austri in exércitu magno: et rex austri provocábitur ad bellum multis auxíliis, et fórtibus nimis: et non stabunt, quia iníbunt advérsus eum consília.'
  "26": 'Et comedéntes panem cum eo, cónterent illum, exercitúsque eius opprimétur: et cadent interfécti plúrimi.'
  "27": 'Duórum quoque regum cor erit ut malefáciant, et ad mensam unam mendácium loquéntur: et non profícient, quia adhuc finis in áliud tempus.'
  "28": 'Et revertétur in terram suam cum ópibus multis: et cor eius advérsum testaméntum sanctum, et fáciet, et revertétur in terram suam.'
  "29": 'Statúto témpore revertétur, et véniet ad austrum: et non erit prióri símile novíssimum.'
  "30": 'Et vénient super eum triéres, et Románi: et percutiétur, et revertétur, et indignábitur contra testaméntum sanctuárii, et fáciet: revertetúrque, et cogitábit advérsum eos, qui dereliquérunt testaméntum sanctuárii.'
  "31": 'Et bráchia ex eo stabunt, et pólluent sanctuárium fortitúdinis, et áuferent iuge sacrifícium: et dabunt abominatiónem in desolatiónem.'
  "32": 'Et ímpii in testaméntum simulábunt fraudulénter: pópulus autem sciens Deum suum, obtinébit, et fáciet.'
  "33": 'Et docti in pópulo docébunt plúrimos: et ruent in gládio, et in flamma, et in captivitáte, et in rapína diérum.'
  "34": 'Cumque corrúerint, sublevabúntur auxílio párvulo: et applicabúntur eis plúrimi fraudulénter.'
  "35": 'Et de erudítis ruent, ut confléntur, et eligántur, et dealbéntur usque ad tempus præfinítum: quia adhuc áliud tempus erit.'
  "36": 'Et fáciet iuxta voluntátem suam rex, et elevábitur, et magnificábitur advérsus omnem deum: et advérsus Deum deórum loquétur magnífica, et dirigétur, donec compleátur iracúndia: perpetráta quippe est definítio.'
  "37": 'Et Deum patrum suórum non reputábit: et erit in concupiscéntiis feminárum, nec quemquam deórum curábit, quia advérsum univérsa consúrget.'
  "38": 'Deum autem Maózim in loco suo venerábitur: et Deum, quem ignoravérunt patres eius, colet auro, et argénto, et lápide pretióso, rebúsque pretiósis.'
  "39": Et fáciet ut múniat Maózim cum deo aliéno, quem cognóvit, et multiplicábit glóriam, et dabit eis potestátem in multis, et terram dívidet gratuíto.
  "40": Et in témpore præfiníto prœliábitur advérsus eum rex austri, et quasi tempéstas véniet contra illum rex aquilónis in cúrribus, et in equítibus, et in classe magna, et ingrediétur terras, et cónteret, et pertránsiet.
  "41": 'Et introíbit in terram gloriósam, et multæ córruent: hæ autem solæ salvabúntur de manu eius, Edom, et Moab, et princípium filiórum Ammon.'
  "42": 'Et mittet manum suam in terras: et terra Ægýpti non effúgiet.'
  "43": 'Et dominábitur thesaurórum auri, et argénti, et in ómnibus pretiósis Ægýpti: per Líbyam quoque, et Æthiópiam transíbit.'
  "44": 'Et fama turbábit eum ab oriénte et ab aquilóne: et véniet in multitúdine magna ut cónterat et interfíciat plúrimos.'
  "45": 'Et figet tabernáculum suum Apádno inter mária, super montem ínclytum et sanctum: et véniet usque ad summitátem eius, et nemo auxiliábitur ei.'
