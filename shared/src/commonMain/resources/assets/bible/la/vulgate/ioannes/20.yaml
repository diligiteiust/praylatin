bible: vulgate
lang: la
language: Latina
book: Ioannes
chapter: "20"
verses:
  "1": 'Una autem sábbati, María Magdaléne venit mane, cum adhuc ténebræ essent, ad monuméntum: et vidit lápidem sublátum a monuménto.'
  "2": 'Cucúrrit ergo, et venit ad Simónem Petrum, et ad álium discípulum, quem amábat Iesus, et dicit illis: Tulérunt Dóminum de monuménto, et nescímus ubi posuérunt eum.'
  "3": Exiit ergo Petrus, et ille álius discípulus, et venérunt ad monuméntum.
  "4": Currébant autem duo simul, et ille álius discípulus præcucúrrit cítius Petro, et venit primus ad monuméntum.
  "5": 'Et cum se inclinásset, vidit pósita linteámina: non tamen introívit.'
  "6": Venit ergo Simon Petrus sequens eum, et introívit in monuméntum, et vidit linteámina pósita,
  "7": et sudárium, quod fúerat super caput eius, non cum linteamínibus pósitum, sed separátim involútum in unum locum.
  "8": 'Tunc ergo introívit et ille discípulus, qui vénerat primus ad monuméntum: et vidit, et crédidit:'
  "9": nondum enim sciébant Scriptúram, quia oportébat eum a mórtuis resúrgere.
  "10": Abiérunt ergo íterum discípuli ad semetípsos.
  "11": 'María autem stabat ad monuméntum foris, plorans. Dum ergo fleret, inclinávit se, et prospéxit in monuméntum:'
  "12": et vidit duos ángelos in albis sedéntes, unum ad caput, et unum ad pedes, ubi pósitum fúerat corpus Iesu.
  "13": 'Dicunt ei illi: Múlier, quid ploras? Dicit eis: Quia tulérunt Dóminum meum: et néscio ubi posuérunt eum.'
  "14": 'Hæc cum dixísset, convérsa est retrórsum, et vidit Iesum stantem: et non sciébat quia Iesus est.'
  "15": 'Dicit ei Iesus: Múlier, quid ploras? quem quæris? Illa exístimans quia hortulánus esset, dicit ei: Dómine, si tu sustulísti eum, dícito mihi ubi posuísti eum, et ego eum tollam.'
  "16": 'Dicit ei Iesus: María. Convérsa illa, dicit ei: Rabbóni (quod dícitur Magíster).'
  "17": 'Dicit ei Iesus: Noli me tángere, nondum enim ascéndi ad Patrem meum: vade autem ad fratres meos, et dic eis: Ascéndo ad Patrem meum, et Patrem vestrum, Deum meum, et Deum vestrum.'
  "18": 'Venit María Magdaléne annúntians discípulis: Quia vidi Dóminum, et hæc dixit mihi.'
  "19": 'Cum ergo sero esset die illo, una sabbatórum, et fores essent clausæ, ubi erant discípuli congregáti propter metum Iudæórum: venit Iesus, et stetit in médio, et dixit eis: Pax vobis.'
  "20": Et cum hoc dixísset, osténdit eis manus, et latus. Gavísi sunt ergo discípuli, viso Dómino.
  "21": 'Dixit ergo eis íterum: Pax vobis. Sicut misit me Pater, et ego mitto vos.'
  "22": 'Hæc cum dixísset, insufflávit, et dixit eis: Accípite Spíritum sanctum:'
  "23": 'quorum remiséritis peccáta, remittúntur eis: et quorum retinuéritis, reténta sunt.'
  "24": Thomas autem unus ex duódecim, qui dícitur Dídymus, non erat cum eis quando venit Iesus.
  "25": 'Dixérunt ergo ei álii discípuli: Vídimus Dóminum. Ille autem dixit eis: Nisi vídero in mánibus eius fixúram clavórum, et mittam dígitum meum in locum clavórum, et mittam manum meam in latus eius, non credam.'
  "26": 'Et post dies octo, íterum erant discípuli eius intus, et Thomas cum eis. Venit Iesus iánuis clausis, et stetit in médio, et dixit: Pax vobis.'
  "27": 'Deínde dicit Thomæ: Infer dígitum tuum huc, et vide manus meas, et affer manum tuam, et mitte in latus meum: et noli esse incrédulus, sed fidélis.'
  "28": 'Respóndit Thomas, et dixit ei: Dóminus meus, et Deus meus.'
  "29": 'Dixit ei Iesus: Quia vidísti me Thoma, credidísti: beáti, qui non vidérunt, et credidérunt.'
  "30": Multa quidem et ália signa fecit Iesus in conspéctu discipulórum suórum, quæ non sunt scripta in libro hoc.
  "31": 'Hæc autem scripta sunt ut credátis, quia Iesus est Christus Fílius Dei: et ut credéntes, vitam habeátis in nómine eius.'
