bible: vulgate
lang: la
language: Latina
book: Proverbia
chapter: "5"
verses:
  "1": 'Fili mi, atténde ad sapiéntiam meam, et prudéntiæ meæ inclína aurem tuam:'
  "2": 'ut custódias cogitatiónes, et disciplínam lábia tua consérvent. Ne atténdas falláciæ mulíeris:'
  "3": 'favus enim distíllans lábia meretrícis, et nitídius óleo guttur eius:'
  "4": novíssima autem illíus amára quasi absínthium, et acúta quasi gládius biceps.
  "5": Pedes eius descéndunt in mortem, et ad ínferos gressus illíus pénetrant.
  "6": 'Per sémitam vitæ non ámbulant: vagi sunt gressus eius, et investigábiles.'
  "7": Nunc ergo fili mi audi me, et ne recédas a verbis oris mei.
  "8": Longe fac ab ea viam tuam, et ne appropínques fóribus domus eius.
  "9": 'Ne des aliénis honórem tuum, et annos tuos crudéli:'
  "10": ne forte impleántur extránei víribus tuis, et labóres tui sint in domo aliéna,
  "11": 'et gemas in novíssimis, quando consúmpseris carnes tuas et corpus tuum, et dicas:'
  "12": Cur detestátus sum disciplínam, et increpatiónibus non acquiévit cor meum,
  "13": nec audívi vocem docéntium me, et magístris non inclinávi aurem meam?
  "14": Pene fui in omni malo, in médio ecclésiæ et synagógæ.
  "15": 'Bibe aquam de cistérna tua, et fluénta pútei tui:'
  "16": derivéntur fontes tui foras, et in platéis aquas tuas dívide.
  "17": Habéto eas solus, nec sint aliéni partícipes tui.
  "18": Sit vena tua benedícta, et lætáre cum mulíere adolescéntiæ tuæ.
  "19": 'Cerva caríssima, et gratíssimus hínnulus: úbera eius inébrient te in omni témpore: in amóre eius delectáre iúgiter.'
  "20": Quare sedúceris fili mi ab aliéna, et fovéris in sinu altérius?
  "21": Réspicit Dóminus vias hóminis, et omnes gressus eius consíderat.
  "22": Iniquitátes suas cápiunt ímpium, et fúnibus peccatórum suórum constríngitur.
  "23": 'Ipse moriétur, quia non hábuit disciplínam: et in multitúdine stultítiæ suæ decipiétur.'
