bible: vulgate
lang: la
language: Latina
book: Numeri
chapter: "5"
verses:
  "1": 'Locutúsque est Dóminus ad Móysen, dicens:'
  "2": 'Prǽcipe fíliis Israel, ut eíciant de castris omnem leprósum, et qui sémine fluit, pollutúsque est super mórtuo:'
  "3": tam másculum quam féminam eícite de castris, ne contáminent ea cum habitáverint vobíscum.
  "4": Fecerúntque ita fílii Israel, et eiecérunt eos extra castra, sicut locútus erat Dóminus Móysi.
  "5": 'Locutúsque est Dóminus ad Móysen, dicens:'
  "6": 'Lóquere ad fílios Israel: Vir, sive múlier, cum fécerint ex ómnibus peccátis, quæ solent homínibus accídere, et per negligéntiam transgréssi fúerint mandátum Dómini, atque delíquerint,'
  "7": confitebúntur peccátum suum, et reddent ipsum caput, quintámque partem désuper ei, in quem peccáverint.
  "8": Sin autem non fúerit qui recípiat, dabunt Dómino, et erit sacerdótis, excépto aríete, qui offértur pro expiatióne, ut sit placábilis hóstia.
  "9": 'Omnes quoque primítiæ, quas ófferunt fílii Israel, ad sacerdótem pértinent:'
  "10": et quidquid in sanctuárium offértur a síngulis, et tráditur mánibus sacerdótis, ipsíus erit.
  "11": 'Locutúsque est Dóminus ad Móysen, dicens:'
  "12": 'Lóquere ad fílios Israel, et dices ad eos: Vir, cuius uxor erráverit, maritúmque contémnens'
  "13": 'dormíerit cum áltero viro, et hoc marítus deprehéndere non quíverit, sed latet adultérium, et téstibus árgui non potest, quia non est invénta in stupro:'
  "14": si spíritus zelotýpiæ concitáverit virum contra uxórem suam, quæ vel pollúta est, vel falsa suspicióne appétitur,
  "15": 'addúcet eam ad sacerdótem, et ófferet oblatiónem pro illa, décimam partem sati farínæ hordeáceæ: non fundet super eam óleum, nec impónet thus: quia sacrifícium zelotýpiæ est, et oblátio investígans adultérium.'
  "16": Offeret ígitur eam sacérdos, et státuet coram Dómino,
  "17": assumétque aquam sanctam in vase fíctili, et pauxíllum terræ de paviménto tabernáculi mittet in eam.
  "18": 'Cumque stéterit múlier in conspéctu Dómini, discoopériet caput eius, et ponet super manus illíus sacrifícium recordatiónis, et oblatiónem zelotýpiæ: ipse autem tenébit aquas amaríssimas, in quibus cum exsecratióne maledícta congéssit.'
  "19": 'Adiurabítque eam, et dicet: Si non dormívit vir aliénus tecum, et si non pollúta es desérto maríti thoro, non te nocébunt aquæ istæ amaríssimæ, in quas maledícta congéssi.'
  "20": 'Sin autem declinásti a viro tuo, atque pollúta es, et concubuísti cum áltero viro:'
  "21": 'his maledictiónibus subiacébis: det te Dóminus in maledictiónem, exemplúmque cunctórum in pópulo suo: putréscere fáciat femur tuum, et tumens úterus tuus disrumpátur.'
  "22": Ingrediántur aquæ maledíctæ in ventrem tuum, et útero tumescénte putréscat femur. Et respondébit múlier, Amen, amen.
  "23": Scribétque sacérdos in libéllo ista maledícta, et delébit ea aquis amaríssimis, in quas maledícta congéssit,
  "24": et dabit ei bíbere. Quas cum exháuserit,
  "25": 'tollet sacérdos de manu eius sacrifícium zelotýpiæ, et elevábit illud coram Dómino, imponétque illud super altáre: ita dumtáxat ut prius,'
  "26": 'pugíllum sacrifícii tollat de eo, quod offértur, et incéndat super altáre: et sic potum det mulíeri aquas amaríssimas.'
  "27": 'Quas cum bíberit, si pollúta est, et contémpto viro adultérii rea, pertransíbunt eam aquæ maledictiónis, et infláto ventre, computréscet femur: erítque múlier in maledictiónem, et in exémplum omni pópulo.'
  "28": Quod si pollúta non fúerit, erit innóxia, et fáciet líberos.
  "29": Ista est lex zelotýpiæ. Si declináverit múlier a viro suo, et si pollúta fúerit,
  "30": 'maritúsque zelotýpiæ spíritu concitátus addúxerit eam in conspéctu Dómini, et fécerit ei sacérdos iuxta ómnia quæ scripta sunt:'
  "31": marítus absque culpa erit, et illa recípiet iniquitátem suam.
