bible: vulgate
lang: la
language: Latina
book: II Regum
chapter: "23"
verses:
  "1": 'Et renuntiavérunt regi quod díxerat. Qui misit: et congregáti sunt ad eum omnes senes Iuda et Ierúsalem.'
  "2": 'Ascendítque rex templum Dómini, et omnes viri Iuda, universíque qui habitábant in Ierúsalem cum eo sacerdótes et prophétæ, et omnis pópulus a parvo usque ad magnum: legítque cunctis audiéntibus ómnia verba libri fœ́deris, qui invéntus est in domo Dómini.'
  "3": 'Stetítque rex super gradum: et fœdus percússit coram Dómino, ut ambulárent post Dóminum, et custodírent præcépta eius, et testimónia, et cæremónias in omni corde, et in tota ánima, et suscitárent verba fœ́deris huius, quæ scripta erant in libro illo: acquievítque pópulus pacto.'
  "4": 'Et præcépit rex Helcíæ pontífici, et sacerdótibus secúndi órdinis, et ianitóribus, ut proícerent de templo Dómini ómnia vasa, quæ facta fúerant Baal, et in luco, et univérsæ milítiæ cæli: et combússit ea foris Ierúsalem in conválle Cedron, et tulit púlverem eórum in Bethel.'
  "5": 'Et delévit arúspices, quos posúerant reges Iuda ad sacrificándum in excélsis per civitátes Iuda, et in circúitu Ierúsalem: et eos, qui adolébant incénsum Baal, et soli, et lunæ, et duódecim signis, et omni milítiæ cæli.'
  "6": Et efférri fecit lucum de domo Dómini foras Ierúsalem in conválle Cedron, et combússit eum ibi, et redégit in púlverem, et proiécit super sepúlcra vulgi.
  "7": Destrúxit quoque ædículas effeminatórum, quæ erant in domo Dómini, pro quibus mulíeres texébant quasi domúnculas luci.
  "8": 'Congregavítque omnes sacerdótes de civitátibus Iuda: et contaminávit excélsa ubi sacrificábant sacerdótes de Gábaa usque Bersabée: et destrúxit aras portárum in intróitu óstii Iósue príncipis civitátis, quod erat ad sinístram portæ civitátis.'
  "9": 'Verúmtamen non ascendébant sacerdótes excelsórum ad altáre Dómini in Ierúsalem: sed tantum comedébant ázyma in médio fratrum suórum.'
  "10": 'Contaminávit quoque Topheth, quod est in conválle fílii Ennom: ut nemo consecráret fílium suum aut fíliam per ignem, Moloch.'
  "11": 'Abstulit quoque equos, quos déderant reges Iuda Soli, in intróitu templi Dómini iuxta éxedram Nathánmelech eunúchi, qui erat in Phárurim: currus autem Solis combússit igni.'
  "12": Altária quoque, quæ erant super tecta cœnáculi Achaz, quæ fécerant reges Iuda, et altária quæ fécerat Manásses in duóbus átriis templi Dómini, destrúxit rex, et cucúrrit inde, et dispérsit cínerem eórum in torréntem Cedron.
  "13": Excélsa quoque, quæ erant in Ierúsalem ad déxteram partem montis offensiónis, quæ ædificáverat Sálomon rex Israel Astaroth idólo Sidoniórum, et Chamos offensióni Moab, et Melchom abominatióni filiórum Ammon, pólluit rex.
  "14": 'Et contrívit státuas, et succídit lucos: replevítque loca eórum óssibus mortuórum.'
  "15": 'Insuper et altáre, quod erat in Bethel, et excélsum, quod fécerat Ieróboam fílius Nabat, qui peccáre fecit Israel: et altáre illud, et excélsum destrúxit, atque combússit, et commínuit in púlverem, succendítque étiam lucum.'
  "16": 'Et convérsus Iosías, vidit ibi sepúlcra, quæ erant in monte: misítque et tulit ossa de sepúlcris, et combússit ea super altáre, et pólluit illud iuxta verbum Dómini, quod locútus est vir Dei, qui prædíxerat verba hæc.'
  "17": 'Et ait: Quis est títulus ille, quem vídeo? Responderúntque ei cives urbis illíus: Sepúlcrum est hóminis Dei, qui venit de Iuda, et prædíxit verba hæc, quæ fecísti super altáre Bethel.'
  "18": 'Et ait: Dimíttite eum, nemo commóveat ossa eius. Et intácta mansérunt ossa illíus cum óssibus prophétæ, qui vénerat de Samaría.'
  "19": 'Insuper et ómnia fana excelsórum, quæ erant in civitátibus Samaríæ, quæ fécerant reges Israel ad irritándum Dóminum, ábstulit Iosías: et fecit eis secúndum ómnia ópera, quæ fécerat in Bethel.'
  "20": 'Et occídit univérsos sacerdótes excelsórum, qui erant ibi super altária: et combússit ossa humána super ea: reversúsque est Ierúsalem.'
  "21": 'Et præcépit omni pópulo, dicens: Fácite Phase Dómino Deo vestro, secúndum quod scriptum est in libro fœ́deris huius.'
  "22": Nec enim factum est Phase tale a diébus iúdicum, qui iudicavérunt Israel, et ómnium diérum regum Israel et regum Iuda,
  "23": sicut in octávo décimo anno regis Iosíæ factum est Phase istud Dómino in Ierúsalem.
  "24": 'Sed et pythónes, et aríolos, et figúras idolórum, et immundítias, et abominatiónes, quæ fúerant in terra Iuda et Ierúsalem, ábstulit Iosías: ut statúeret verba legis, quæ scripta sunt in libro, quem invénit Helcías sacérdos in templo Dómini.'
  "25": 'Símilis illi non fuit ante eum rex, qui reverterétur ad Dóminum in omni corde suo, et in tota ánima sua, et in univérsa virtúte sua iuxta omnem legem Móysi: neque post eum surréxit símilis illi.'
  "26": 'Verúmtamen non est avérsus Dóminus ab ira furóris sui magni, quo irátus est furor eius contra Iudam: propter irritatiónes, quibus provocáverat eum Manásses.'
  "27": 'Dixit ítaque Dóminus: Etiam Iudam áuferam a fácie mea, sicut ábstuli Israel: et proíciam civitátem hanc, quam elégi Ierúsalem, et domum, de qua dixi: Erit nomen meum ibi.'
  "28": Réliqua autem sermónum Iosíæ, et univérsa quæ fecit, nonne hæc scripta sunt in Libro verbórum diérum regum Iuda?
  "29": 'In diébus eius ascéndit Phárao Néchao rex Ægýpti contra regem Assyriórum ad flumen Euphráten, et ábiit Iosías rex in occúrsum eius: et occísus est in Magéddo cum vidísset eum.'
  "30": 'Et portavérunt eum servi sui mórtuum de Magéddo: et pertulérunt in Ierúsalem, et sepeliérunt eum in sepúlcro suo. Tulítque pópulus terræ Ióachaz fílium Iosíæ: et unxérunt eum, et constituérunt eum regem pro patre suo.'
  "31": 'Vigínti trium annórum erat Ióachaz cum regnáre cœpísset, et tribus ménsibus regnávit in Ierúsalem: nomen matris eius Amítal fília Ieremíæ de Lobna.'
  "32": Et fecit malum coram Dómino, iuxta ómnia quæ fécerant patres eius.
  "33": 'Vinxítque eum Phárao Néchao in Rebla, quæ est in terra Emath, ne regnáret in Ierúsalem: et impósuit mulctam terræ centum taléntis argénti, et talénto auri.'
  "34": 'Regémque constítuit Phárao Néchao Elíacim fílium Iosíæ pro Iosía patre eius: vertítque nomen eius Ióakim: porro Ióachaz tulit, et duxit in Ægýptum, et mórtuus est ibi.'
  "35": 'Argéntum autem et aurum dedit Ióakim Pharaóni, cum indixísset terræ per síngulos, ut conferrétur iuxta præcéptum Pharaónis: et unumquémque iuxta vires suas exégit, tam argéntum quam aurum, de pópulo terræ, ut daret Pharaóni Néchao.'
  "36": 'Vigínti quinque annórum erat Ióakim cum regnáre cœpísset, et úndecim annis regnávit in Ierúsalem: nomen matris eius Zebída fília Phadaía de Ruma.'
  "37": Et fecit malum coram Dómino, iuxta ómnia quæ fécerant patres eius.
