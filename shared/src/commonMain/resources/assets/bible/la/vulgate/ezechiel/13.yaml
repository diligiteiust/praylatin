bible: vulgate
lang: la
language: Latina
book: Ezechiel
chapter: "13"
verses:
  "1": 'Et factus est sermo Dómini ad me, dicens:'
  "2": 'Fili hóminis, vaticináre ad prophétas Israel, qui prophétant: et dices prophetántibus de corde suo: Audíte verbum Dómini.'
  "3": 'Hæc dicit Dóminus Deus: Væ prophétis insipiéntibus, qui sequúntur spíritum suum, et nihil vident.'
  "4": Quasi vulpes in desértis, prophétæ tui Israel erant.
  "5": Non ascendístis ex advérso, neque opposuístis murum pro domo Israel, ut starétis in prœ́lio in die Dómini.
  "6": 'Vident vana, et divínant mendácium, dicéntes: Ait Dóminus: cum Dóminus non míserit eos: et perseveravérunt confirmáre sermónem.'
  "7": 'Numquid non visiónem cassam vidístis, et divinatiónem mendácem locúti estis, et dícitis: Ait Dóminus: cum ego non sim locútus?'
  "8": 'Proptérea hæc dicit Dóminus Deus: Quia locúti estis vana, et vidístis mendácium: ídeo ecce ego ad vos, dicit Dóminus Deus.'
  "9": 'Et erit manus mea super prophétas, qui vident vana, et divínant mendácium: in consílio pópuli mei non erunt, et in scriptúra domus Israel non scribéntur, nec in terram Israel ingrediéntur: et sciétis quia ego Dóminus Deus:'
  "10": 'eo quod decéperint pópulum meum, dicéntes: Pax, et non est pax: et ipse ædificábat paríetem, illi autem liniébant eum luto absque páleis.'
  "11": 'Dic ad eos, qui líniunt absque temperatúra, quod casúrus sit: erit enim imber inúndans, et dabo lápides prægrándes désuper irruéntes, et ventum procéllæ dissipántem.'
  "12": 'Síquidem ecce cécidit páries: numquid non dicétur vobis: Ubi est litúra quam linístis?'
  "13": 'Proptérea hæc dicit Dóminus Deus: Et erúmpere fáciam spíritum tempestátum in indignatióne mea, et imber inúndans in furóre meo erit: et lápides grandes in ira in consumptiónem.'
  "14": 'Et déstruam paríetem, quem linístis absque temperaménto: et adæquábo eum terræ, et revelábitur fundaméntum eius: et cadet, et consumétur in médio eius: et sciétis quia ego sum Dóminus.'
  "15": 'Et complébo indignatiónem meam in paríete, et in his, qui líniunt eum absque temperaménto: dicámque vobis: Non est páries, et non sunt qui líniunt eum.'
  "16": 'Prophétæ Israel, qui prophétant ad Ierúsalem, et vident ei visiónem pacis: et non est pax, ait Dóminus Deus.'
  "17": 'Et tu fili hóminis, pone fáciem tuam contra fílias pópuli tui, quæ prophétant de corde suo: et vaticináre super eas,'
  "18": 'et dic: Hæc dicit Dóminus Deus: Væ quæ cónsuunt pulvíllos sub omni cúbito manus, et fáciunt cervicália sub cápite univérsæ ætátis ad capiéndas ánimas: et cum cáperent ánimas pópuli mei, vivificábant ánimas eórum.'
  "19": Et violábant me ad pópulum meum propter pugíllum hórdei, et fragmen panis, ut interfícerent ánimas, quæ non moriúntur, et vivificárent ánimas, quæ non vivunt, mentiéntes pópulo meo credénti mendáciis.
  "20": 'Propter hoc hæc dicit Dóminus Deus: Ecce ego ad pulvíllos vestros, quibus vos cápitis ánimas volántes: et dirúmpam eos de bráchiis vestris, et dimíttam ánimas, quas vos cápitis, ánimas ad volándum.'
  "21": 'Et dirúmpam cervicália vestra, et liberábo pópulum meum de manu vestra, neque erunt ultra in mánibus vestris ad prædándum: et sciétis quia ego Dóminus.'
  "22": 'Pro eo quod mœrére fecístis cor iusti mendáciter, quem ego non contristávi: et confortástis manus ímpii, ut non reverterétur a via sua mala, et víveret:'
  "23": 'proptérea vana non vidébitis, et divinatiónes non divinábitis ámplius, et éruam pópulum meum de manu vestra: et sciétis quia ego Dóminus.'
