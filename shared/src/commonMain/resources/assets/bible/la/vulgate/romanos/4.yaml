bible: vulgate
lang: la
language: Latina
book: ad Romanos
chapter: "4"
verses:
  "1": Quid ergo dicémus invenísse Abraham patrem nostrum secúndum carnem?
  "2": Si enim Abraham ex opéribus iustificátus est, habet glóriam, sed non apud Deum.
  "3": 'Quid enim dicit Scriptúra? Crédidit Abraham Deo: et reputátum est illi ad iustítiam.'
  "4": Ei autem, qui operátur, merces non imputátur secúndum grátiam, sed secúndum débitum.
  "5": Ei vero, qui non operátur, credénti autem in eum, qui iustíficat ímpium, reputátur fides eius ad iustítiam secúndum propósitum grátiæ Dei.
  "6": 'Sicut et David dicit beatitúdinem hóminis, cui Deus accépto fert iustítiam sine opéribus:'
  "7": Beáti, quorum remíssæ sunt iniquitátes, et quorum tecta sunt peccáta.
  "8": Beátus vir, cui non imputávit Dóminus peccátum.
  "9": Beatitúdo ergo hæc in circumcisióne tantum manet, an étiam in præpútio? Dícimus enim quia reputáta est Abrahæ fides ad iustítiam.
  "10": Quómodo ergo reputáta est? in circumcisióne, an in præpútio? Non in circumcisióne, sed in præpútio.
  "11": 'Et signum accépit circumcisiónis, signáculum iustítiæ fídei, quæ est in præpútio: ut sit pater ómnium credéntium per præpútium, ut reputétur et illis ad iustítiam:'
  "12": et sit pater circumcisiónis non iis tantum, qui sunt ex circumcisióne, sed et iis, qui sectántur vestígia fídei, quæ est in præpútio patris nostri Abrahæ.
  "13": 'Non enim per legem promíssio Abrahæ, aut sémini eius ut heres esset mundi: sed per iustítiam fídei.'
  "14": 'Si enim qui ex lege, herédes sunt: exinaníta est fides, abólita est promíssio.'
  "15": Lex enim iram operátur. Ubi enim non est lex, nec prævaricátio.
  "16": Ideo ex fide, ut secúndum grátiam firma sit promíssio omni sémini, non ei, qui ex lege est solum, sed et ei, qui ex fide est Abrahæ, qui pater est ómnium nostrum
  "17": '(sicut scriptum est: Quia patrem multárum géntium pósui te) ante Deum, cui crédidit, qui vivíficat mórtuos, et vocat ea quæ non sunt, tamquam ea quæ sunt:'
  "18": 'qui contra spem in spem crédidit, ut fíeret pater multárum géntium secúndum quod dictum est ei: Sic erit semen tuum.'
  "19": Et non infirmátus est fide, nec considerávit corpus suum emórtuum, cum iam fere centum esset annórum, et emórtuam vulvam Saræ.
  "20": 'In repromissióne étiam Dei non hæsitávit diffidéntia, sed confortátus est fide, dans glóriam Deo:'
  "21": pleníssime sciens, quia quæcúmque promísit, potens est et fácere.
  "22": Ideo et reputátum est illi ad iustítiam.
  "23": 'Non est autem scriptum tantum propter ipsum quia reputátum est illi ad iustítiam:'
  "24": sed et propter nos, quibus reputábitur credéntibus in eum, qui suscitávit Iesum Christum Dóminum nostrum a mórtuis,
  "25": qui tráditus est propter delícta nostra, et resurréxit propter iustificatiónem nostram.
