bible: vulgate
lang: la
language: Latina
book: I Machabaeorum
chapter: "16"
verses:
  "1": Et ascéndit Ioánnes de Gázaris, et nuntiávit Simóni patri suo quæ fecit Cendebǽus in pópulo ipsórum.
  "2": 'Et vocávit Simon duos fílios senióres, Iudam, et Ioánnem, et ait illis: Ego, et fratres mei, et domus patris mei expugnávimus hostes Israel ab adolescéntia usque in hunc diem: et prosperátum est in mánibus nostris liberáre Israel aliquóties.'
  "3": 'Nunc autem sénui, sed estóte loco meo, et fratres mei, et egréssi pugnáte pro gente nostra: auxílium vero de cælo vobíscum sit.'
  "4": 'Et elégit de regióne vigínti míllia virórum belligeratórum, et équites: et profécti sunt ad Cendebǽum, et dormiérunt in Modin.'
  "5": 'Et surrexérunt mane, et abiérunt in campum: et ecce exércitus copiósus in óbviam illis péditum, et équitum, et flúvius torrens erat inter médium ipsórum.'
  "6": 'Et admóvit castra contra fáciem eórum ipse, et pópulus eius, et vidit pópulum trepidántem ad transfretándum torréntem, et transfretávit primus: et vidérunt eum viri, et transiérunt post eum.'
  "7": 'Et divísit pópulum, et équites in médio péditum: erat autem equitátus adversariórum copiósus nimis.'
  "8": 'Et exclamavérunt sacris tubis, et in fugam convérsus est Cendebǽus, et castra eius: et cecidérunt ex eis multi vulneráti: resídui autem in munitiónem fugérunt.'
  "9": 'Tunc vulnerátus est Iudas frater Ioánnis: Ioánnes autem insecútus est eos, donec venit Cedrónem, quam ædificávit:'
  "10": et fugérunt usque ad turres, quæ erant in agris Azóti, et succéndit eas igni. Et cecidérunt ex illis duo míllia virórum, et revérsus est in Iudǽam in pace.
  "11": 'Et Ptolemǽus fílius Abóbi constitútus erat dux in campo Iéricho, et habébat argéntum, et aurum multum:'
  "12": erat enim gener summi sacerdótis.
  "13": Et exaltátum est cor eius, et volébat obtinére regiónem, et cogitábat dolum advérsus Simónem, et fílios eius, ut tólleret eos.
  "14": 'Simon autem, perámbulans civitátes, quæ erant in regióne Iudǽæ, et sollicitúdinem gerens eárum, descéndit in Iéricho ipse, et Mathathías fílius eius, et Iudas, anno centésimo septuagésimo séptimo, mense undécimo: hic est mensis Sabath.'
  "15": 'Et suscépit eos fílius Abóbi in munitiúnculam, quæ vocátur Doch, cum dolo, quam ædificávit: et fecit eis convívium magnum, et abscóndit illic viros.'
  "16": 'Et cum inebriátus esset Simon, et fílii eius, surréxit Ptolemǽus cum suis, et sumpsérunt arma sua, et intravérunt in convívium: et occidérunt eum, et duos fílios eius, et quosdam púeros eius:'
  "17": et fecit deceptiónem magnam in Israel, et réddidit mala pro bonis.
  "18": Et scripsit hæc Ptolemǽus, et misit regi ut mítteret ei exércitum in auxílium, et tráderet ei regiónem, et civitátes eórum, et tribúta.
  "19": 'Et misit álios in Gázaram tóllere Ioánnem: et tribúnis misit epístolas, ut venírent ad se, et daret eis argéntum, et aurum, et dona.'
  "20": Et álios misit occupáre Ierúsalem, et montem templi.
  "21": Et præcúrrens quidam, nuntiávit Ioánni in Gázara, quia périit pater eius, et fratres eius, et quia misit te quoque intérfici.
  "22": 'Ut audívit autem, veheménter expávit: et comprehéndit viros, qui vénerant pérdere eum, et occídit eos: cognóvit enim quia quærébant eum pérdere.'
  "23": 'Et cétera sermónum Ioánnis, et bellórum eius, et bonárum virtútum, quibus fórtiter gessit, et ædifícii murórum, quos exstrúxit, et rerum gestárum eius:'
  "24": ecce hæc scripta sunt in libro diérum sacerdótii eius, ex quo factus est princeps sacerdótum post patrem suum.
