bible: vulgate
lang: la
language: Latina
book: Iosue
chapter: "2"
verses:
  "1": 'Misit ígitur Iósue fílius Nun de Setim duos viros exploratóres in abscóndito: et dixit eis: Ite, et consideráte terram, urbémque Iéricho. Qui pergéntes ingréssi sunt domum mulíeris meretrícis, nómine Rahab, et quievérunt apud eam.'
  "2": 'Nuntiatúmque est regi Iéricho, et dictum: Ecce viri ingréssi sunt huc per noctem de fíliis Israel, ut explorárent terram.'
  "3": 'Misítque rex Iéricho ad Rahab, dicens: Educ viros, qui venérunt ad te, et ingréssi sunt domum tuam: exploratóres quippe sunt, et omnem terram consideráre venérunt.'
  "4": 'Tollénsque múlier viros, abscóndit, et ait: Fáteor, venérunt ad me, sed nesciébam unde essent:'
  "5": 'cumque porta clauderétur in ténebris, et illi páriter exiérunt, néscio quo abiérunt: persequímini cito, et comprehendétis eos.'
  "6": Ipsa autem fecit ascéndere viros in solárium domus suæ, operuítque eos stípula lini, quæ ibi erat.
  "7": 'Hi autem, qui missi fúerant, secúti sunt eos per viam, quæ ducit ad vadum Iordánis: illísque egréssis statim porta clausa est.'
  "8": 'Necdum obdormíerant qui latébant, et ecce múlier ascéndit ad eos, et ait:'
  "9": 'Novi quod Dóminus tradíderit vobis terram: étenim írruit in nos terror vester, et elanguérunt omnes habitatóres terræ.'
  "10": 'Audívimus quod siccáverit Dóminus aquas maris Rubri ad vestrum intróitum, quando egréssi estis ex Ægýpto: et quæ fecéritis duóbus Amorrhæórum régibus, qui erant trans Iordánem, Sehon et Og, quos interfecístis.'
  "11": 'Et hæc audiéntes pertimúimus, et elánguit cor nostrum, nec remánsit in nobis spíritus ad intróitum vestrum: Dóminus enim Deus vester ipse est Deus in cælo sursum, et in terra deórsum.'
  "12": 'Nunc ergo iuráte mihi per Dóminum, ut quómodo ego misericórdiam feci vobíscum, ita et vos faciátis cum domo patris mei: detísque mihi verum signum,'
  "13": ut salvétis patrem meum et matrem, et fratres ac soróres meas, et ómnia quæ illórum sunt, et eruátis ánimas nostras a morte.
  "14": 'Qui respondérunt ei: Anima nostra sit pro vobis in mortem, si tamen non prodíderis nos: cumque tradíderit nobis Dóminus terram, faciémus in te misericórdiam et veritátem.'
  "15": 'Demísit ergo eos per funem de fenéstra: domus enim eius hærébat muro.'
  "16": 'Dixítque ad eos: Ad montána conscéndite, ne forte occúrrant vobis reverténtes: ibíque latitáte tribus diébus, donec rédeant, et sic íbitis per viam vestram.'
  "17": 'Qui dixérunt ad eam: Innóxii érimus a iuraménto hoc, quo adiurásti nos:'
  "18": 'si ingrediéntibus nobis terram, signum fúerit funículus iste coccíneus, et ligáveris eum in fenéstra, per quam demisísti nos: et patrem tuum ac matrem, fratrésque et omnem cognatiónem tuam congregáveris in domum tuam.'
  "19": Qui óstium domus tuæ egréssus fúerit, sanguis ipsíus erit in caput eius, et nos érimus aliéni. Cunctórum autem sanguis, qui tecum in domo fúerint, redundábit in caput nostrum, si eos áliquis tetígerit.
  "20": Quod si nos pródere volúeris, et sermónem istum proférre in médium, érimus mundi ab hoc iuraménto, quo adiurásti nos.
  "21": 'Et illa respóndit: Sicut locúti estis, ita fiat: dimitténsque eos ut pérgerent, appéndit funículum coccíneum in fenéstra.'
  "22": 'Illi vero ambulántes pervenérunt ad montána, et mansérunt ibi tres dies, donec reverteréntur qui fúerant persecúti: quæréntes enim per omnem viam, non reperérunt eos.'
  "23": 'Quibus urbem ingréssis, revérsi sunt, et descendérunt exploratóres de monte: et, transmísso Iordáne, venérunt ad Iósue fílium Nun, narraverúntque ei ómnia quæ accíderant sibi,'
  "24": 'atque dixérunt: Trádidit Dóminus omnem terram hanc in manus nostras, et timóre prostráti sunt cuncti habitatóres eius.'
