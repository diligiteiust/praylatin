bible: vulgate
lang: la
language: Latina
book: II Regum
chapter: "18"
verses:
  "1": Anno tértio Osée fílii Ela regis Israel, regnávit Ezechías fílius Achaz regis Iuda.
  "2": 'Vigínti quinque annórum erat cum regnáre cœpísset: et vigínti novem annis regnávit in Ierúsalem: nomen matris eius Abi fília Zacharíæ.'
  "3": Fecítque quod erat bonum coram Dómino, iuxta ómnia quæ fécerat David pater eius.
  "4": 'Ipse dissipávit excélsa, et contrívit státuas, et succídit lucos, confregítque serpéntem ǽneum, quem fécerat Móyses: síquidem usque ad illud tempus fílii Israel adolébant ei incénsum: vocavítque nomen eius Nohéstan.'
  "5": 'In Dómino Deo Israel sperávit: ítaque post eum non fuit símilis ei de cunctis régibus Iuda, sed neque in his, qui ante eum fuérunt:'
  "6": et adhǽsit Dómino, et non recéssit a vestígiis eius, fecítque mandáta eius, quæ præcéperat Dóminus Móysi.
  "7": Unde et erat Dóminus cum eo, et in cunctis, ad quæ procedébat, sapiénter se agébat. Rebellávit quoque contra regem Assyriórum, et non servívit ei.
  "8": Ipse percússit Philisthǽos usque ad Gazam, et omnes términos eórum, a Turre custódum usque ad Civitátem munítam.
  "9": Anno quarto regis Ezechíæ, qui erat annus séptimus Osée fílii Ela regis Israel, ascéndit Salmánasar rex Assyriórum in Samaríam, et oppugnávit eam,
  "10": 'et cepit. Nam post annos tres, anno sexto Ezechíæ, id est nono anno Osée regis Israel, capta est Samaría:'
  "11": 'et tránstulit rex Assyriórum Israel in Assýrios, collocavítque eos in Hala et in Habor flúviis Gozan in civitátibus Medórum:'
  "12": 'quia non audiérunt vocem Dómini Dei sui, sed prætergréssi sunt pactum eius: ómnia, quæ præcéperat Móyses servus Dómini, non audiérunt, neque fecérunt.'
  "13": Anno quartodécimo regis Ezechíæ, ascéndit Sennácherib rex Assyriórum ad univérsas civitátes Iuda munítas, et cepit eas.
  "14": 'Tunc misit Ezechías rex Iuda núntios ad regem Assyriórum in Lachis, dicens: Peccávi, recéde a me: et omne, quod imposúeris mihi, feram. Indíxit ítaque rex Assyriórum Ezechíæ regi Iudæ trecénta talénta argénti, et trigínta talénta auri.'
  "15": Dedítque Ezechías omne argéntum quod repértum fúerat in domo Dómini, et in thesáuris regis.
  "16": In témpore illo confrégit Ezechías valvas templi Dómini, et láminas auri, quas ipse affíxerat, et dedit eas regi Assyriórum.
  "17": 'Misit autem rex Assyriórum Tharthan, et Rábsaris, et Rábsacen de Lachis ad regem Ezechíam cum manu válida Ierúsalem: qui cum ascendíssent, venérunt Ierúsalem, et stetérunt iuxta aquædúctum piscínæ superióris, quæ est in via Agri fullónis.'
  "18": 'Vocaverúntque regem: egréssus est autem ad eos Elíacim fílius Helcíæ præpósitus domus, et Sobna scriba, et Ióahe fílius Asaph a commentáriis.'
  "19": 'Dixítque ad eos Rábsaces: Loquímini Ezechíæ: Hæc dicit rex magnus, rex Assyriórum: Quæ est ista fidúcia, qua níteris?'
  "20": Fórsitan inísti consílium, ut prǽpares te ad prœ́lium. In quo confídis, ut áudeas rebelláre?
  "21": An speras in báculo arundíneo atque confrácto Ægýpto, super quem, si incubúerit homo, comminútus ingrediétur manum eius, et perforábit eam? sic est Phárao rex Ægýpti ómnibus, qui confídunt in se.
  "22": 'Quod si dixéritis mihi: In Dómino Deo nostro habémus fidúciam: nonne iste est, cuius ábstulit Ezechías excélsa et altária: et præcépit Iudæ et Ierúsalem: Ante altáre hoc adorábitis in Ierúsalem?'
  "23": Nunc ígitur transíte ad dóminum meum regem Assyriórum, et dabo vobis duo míllia equórum, et vidéte an habére valeátis ascensóres eórum.
  "24": Et quómodo potéstis resístere ante unum sátrapam de servis dómini mei mínimis? an fidúciam habes in Ægýpto propter currus et équites?
  "25": 'Numquid sine Dómini voluntáte ascéndi ad locum istum, ut demolírer eum? Dóminus dixit mihi: Ascénde ad terram hanc, et demolíre eam.'
  "26": 'Dixérunt autem Elíacim fílius Helcíæ, et Sobna, et Ióahe Rábsaci: Precámur ut loquáris nobis servis tuis Syríace: síquidem intellígimus hanc linguam: et non loquáris nobis Iudáice, audiénte pópulo, qui est super murum.'
  "27": 'Respondítque eis Rábsaces, dicens: Numquid ad dóminum tuum, et ad te misit me dóminus meus, ut lóquerer sermónes hos, et non pótius ad viros, qui sedent super murum, ut cómedant stércora sua, et bibant urínam suam vobíscum?'
  "28": 'Stetit ítaque Rábsaces, et exclamávit voce magna Iudáice, et ait: Audíte verba regis magni, regis Assyriórum.'
  "29": 'Hæc dicit rex: Non vos sedúcat Ezechías: non enim póterit erúere vos de manu mea.'
  "30": 'Neque fidúciam vobis tríbuat super Dóminum, dicens: Eruens liberábit nos Dóminus, et non tradétur cívitas hæc in manu regis Assyriórum.'
  "31": 'Nolíte audíre Ezechíam. Hæc enim dicit rex Assyriórum: Fácite mecum quod vobis est útile, et egredímini ad me: et cómedet unusquísque de vínea sua, et de ficu sua: et bibétis aquas de cistérnis vestris:'
  "32": 'donec véniam, et tránsferam vos in terram, quæ símilis est terræ vestræ, in terram fructíferam, et fértilem vini, terram panis et vineárum, terram olivárum, et ólei ac mellis, et vivétis, et non moriémini. Nolíte audíre Ezechíam, qui vos décipit, dicens: Dóminus liberábit nos.'
  "33": Numquid liberavérunt dii géntium terram suam de manu regis Assyriórum?
  "34": Ubi est deus Emath, et Arphad? ubi est deus Sephárvaim, Ana, et Ava? numquid liberavérunt Samaríam de manu mea?
  "35": Quinam illi sunt in univérsis diis terrárum, qui eruérunt regiónem suam de manu mea, ut possit erúere Dóminus Ierúsalem de manu mea?
  "36": 'Tácuit ítaque pópulus, et non respóndit ei quidquam: síquidem præcéptum regis accéperant, ut non respondérent ei.'
  "37": Venítque Elíacim fílius Helcíæ, præpósitus domus, et Sobna scriba, et Ióahe fílius Asaph a commentáriis ad Ezechíam scissis véstibus, et nuntiavérunt ei verba Rábsacis.
