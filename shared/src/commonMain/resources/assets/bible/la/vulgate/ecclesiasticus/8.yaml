bible: vulgate
lang: la
language: Latina
book: Ecclesiasticus
chapter: "8"
verses:
  "1": Non lítiges cum hómine poténte, ne forte íncidas in manus illíus.
  "2": 'Non conténdas cum viro locupléte, ne forte contra te constítuat litem tibi:'
  "3": multos enim pérdidit aurum et argéntum, et usque ad cor regum exténdit et convértit.
  "4": Non lítiges cum hómine linguáto, et non strues in ignem illíus ligna.
  "5": Non commúnices hómini indócto, ne male de progénie tua loquátur.
  "6": 'Ne despícias hóminem averténtem se a peccáto, neque impróperes ei: meménto quóniam omnes in correptióne sumus.'
  "7": 'Ne spernas hóminem in sua senectúte: étenim ex nobis senéscunt.'
  "8": 'Noli de mórtuo inimíco tuo gaudére: sciens quóniam omnes mórimur, et in gáudium nólumus veníre.'
  "9": 'Ne despícias narratiónem presbyterórum sapiéntium, et in provérbiis eórum conversáre:'
  "10": ab ipsis enim disces sapiéntiam, et doctrínam intelléctus, et servíre magnátis sine queréla.
  "11": 'Non te prætéreat narrátio seniórum: ipsi enim didicérunt a pátribus suis:'
  "12": quóniam ab ipsis disces intelléctum, et in témpore necessitátis dare respónsum.
  "13": Non incéndas carbónes peccatórum árguens eos, et ne incendáris flamma ignis peccatórum illórum.
  "14": Ne contra fáciem stes contumeliósi, ne sédeat quasi insidiátor ori tuo.
  "15": 'Noli fœnerári hómini fortióri te: quod si fœneráveris, quasi pérditum habe.'
  "16": 'Non spóndeas super virtútem tuam: quod si spopónderis, quasi restítuens cógita.'
  "17": 'Non iúdices contra iúdicem: quóniam secúndum quod iustum est iúdicat.'
  "18": 'Cum audáce non eas in via, ne forte gravet mala sua in te: ipse enim secúndum voluntátem suam vadit, et simul cum stultítia illíus péries.'
  "19": 'Cum iracúndo non fácias rixam, et cum audáce non eas in desértum: quóniam quasi nihil est ante illum sanguis, et ubi non est adiutórium, elídet te.'
  "20": 'Cum fátuis consílium non hábeas: non enim póterunt dilígere nisi quæ eis placent.'
  "21": 'Coram extráneo ne fácias consílium: nescis enim quid páriet.'
  "22": Non omni hómini cor tuum maniféstes, ne forte ínferat tibi grátiam falsam, et conviciétur tibi.
