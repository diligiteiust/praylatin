bible: vulgate
lang: la
language: Latina
book: Iosue
chapter: "19"
verses:
  "1": 'Et egréssa est sors secúnda filiórum Símeon per cognatiónes suas: fuítque heréditas'
  "2": 'eórum in médio possessiónis filiórum Iuda: Bersabée, et Sabée, et Mólada,'
  "3": et Hasérsual, Bala, et Asem,
  "4": et Elthólad, Bethul, et Harma,
  "5": et Síceleg, et Bethmárchaboth, et Hasérsusa,
  "6": 'et Bethlébaoth, et Sárohen: civitátes trédecim, et villæ eárum.'
  "7": 'Ain, et Remmon, et Athar, et Asan: civitátes quátuor, et villæ eárum:'
  "8": omnes vículi per circúitum úrbium istárum usque ad Báalath Beer Ramath contra austrálem plagam. Hæc est heréditas filiórum Símeon iuxta cognatiónes suas,
  "9": 'in possessióne et funículo filiórum Iuda: quia maior erat, et idcírco fílii Símeon possedérunt in médio hereditátis eórum.'
  "10": 'Cecidítque sors tértia filiórum Zábulon per cognatiónes suas: factus est términus possessiónis eórum usque Sarid.'
  "11": Ascendítque de mari et Mérala, et pérvenit in Débbaseth, usque ad torréntem qui est contra Iéconam.
  "12": 'Et revértitur de Sared contra oriéntem in fines Ceseléththabor: et egréditur ad Dábereth, ascendítque contra Iáphie.'
  "13": 'Et inde pertránsit usque ad orientálem plagam Géthepher et Thácasin: et egréditur in Remmon, Amthar et Noa.'
  "14": 'Et círcuit ad aquilónem Hánathon: suntque egréssus eius vallis Iéphthael,'
  "15": 'et Cateth, et Náalol, et Sémeron, et Iérala, et Béthlehem: civitátes duódecim, et villæ eárum.'
  "16": Hæc est heréditas tribus filiórum Zábulon per cognatiónes suas, urbes et vículi eárum.
  "17": 'Issachar egréssa est sors quarta per cognatiónes suas:'
  "18": fuítque eius heréditas Iézrael, et Cásaloth, et Sunem,
  "19": et Hapháraim, et Seon, et Anáharath,
  "20": et Rabboth, et Césion, Abes,
  "21": et Rameth, et Engánnim, et Enhádda, et Béthpheses.
  "22": 'Et pérvenit términus eius usque Thabor, et Sehesíma, et Béthsames, erúntque éxitus eius Iordánis: civitátes sédecim, et villæ eárum.'
  "23": Hæc est posséssio filiórum Issachar per cognatiónes suas, urbes et vículi eárum.
  "24": 'Cecidítque sors quinta tríbui filiórum Aser per cognatiónes suas:'
  "25": fuítque términus eórum Halcath, et Chali, et Beten, et Axaph,
  "26": 'et Elmelech, et Amaad, et Messal: et pérvenit usque ad Carmélum maris et Sihor, et Lábanath,'
  "27": 'ac revértitur contra oriéntem Béthdagon: et pertránsit usque Zábulon et vallem Iéphthael contra aquilónem in Béthemec et Néhiel. Egreditúrque ad lævam Cabul,'
  "28": et Abran, et Rohob, et Hamon, et Cana, usque ad Sidónem magnam.
  "29": 'Revertitúrque in Horma usque ad civitátem munitíssimam Tyrum, et usque Hosa: erúntque éxitus eius in mare de funículo Achzíba:'
  "30": 'et Amma, et Aphec, et Rohob: civitátes vigínti duæ, et villæ eárum.'
  "31": Hæc est posséssio filiórum Aser per cognatiónes suas, urbésque et vículi eárum.
  "32": 'Filiórum Néphthali sexta sors cécidit per famílias suas:'
  "33": 'et cœpit términus de Heleph et Elon in Saánanim, et Adami, quæ est Neceb, et Iébnael usque Lecum: et egréssus eórum usque ad Iordánem:'
  "34": 'revertitúrque términus contra occidéntem in Azanóththabor, atque inde egréditur in Húcuca, et pertránsit in Zábulon contra merídiem, et in Aser contra occidéntem, et in Iuda ad Iordánem contra ortum solis:'
  "35": civitátes munitíssimæ, Assedim, Ser, et Emath, et Reccath, et Cénereth,
  "36": et Edema, et Arama, Asor,
  "37": et Cedes, et Edrai, Enhasor,
  "38": 'et Ieron, et Mágdalel, Horem, et Béthanath, et Béthsames: civitátes decem et novem, et villæ eárum.'
  "39": Hæc est posséssio tribus filiórum Néphthali per cognatiónes suas, urbes et vículi eárum.
  "40": 'Tríbui filiórum Dan per famílias suas egréssa est sors séptima:'
  "41": et fuit términus possessiónis eius Sáraa, et Esthaol, et Hírsemes, id est, cívitas solis.
  "42": Sélebin, et Aialon, et Iéthela,
  "43": Elon, et Themna, et Acron,
  "44": Elthece, Gébbethon, et Bálaath,
  "45": 'et Iud, et Bane, et Barach, et Gethrémmon:'
  "46": et Meiárcon, et Arecon, cum término qui réspicit Ioppen,
  "47": 'et ipso fine conclúditur. Ascenderúntque fílii Dan, et pugnavérunt contra Lesem, ceperúntque eam: et percussérunt eam in ore gládii, et possedérunt, et habitavérunt in ea, vocántes nomen eius Lesem Dan, ex nómine Dan patris sui.'
  "48": Hæc est posséssio tribus filiórum Dan, per cognatiónes suas, urbes et vículi eárum.
  "49": Cumque complésset sorte divídere terram síngulis per tribus suas, dedérunt fílii Israel possessiónem Iósue fílio Nun in médio sui,
  "50": 'iuxta præcéptum Dómini, urbem quam postulávit, Thamnath Sáraa in monte Ephraim: et ædificávit civitátem, habitavítque in ea.'
  "51": 'Hæ sunt possessiónes, quas sorte divisérunt Eleázar sacérdos, et Iósue fílius Nun, et príncipes familiárum ac tríbuum filiórum Israel in Silo, coram Dómino ad óstium tabernáculi testimónii: partitíque sunt terram.'
