bible: vulgate
lang: la
language: Latina
book: Iob
chapter: "40"
verses:
  "1": 'Respóndens autem Dóminus Iob de túrbine, dixit:'
  "2": 'Accínge sicut vir lumbos tuos: interrogábo te, et índica mihi.'
  "3": 'Numquid írritum fácies iudícium meum: et condemnábis me, ut tu iustificéris?'
  "4": Et si habes bráchium sicut Deus, et si voce símili tonas?
  "5": Circúmda tibi decórem, et in sublíme erígere, et esto gloriósus, et speciósis indúere véstibus.
  "6": Dispérge supérbos in furóre tuo, et respíciens omnem arrogántem humília.
  "7": Réspice cunctos supérbos, et confúnde eos, et cóntere ímpios in loco suo.
  "8": 'Abscónde eos in púlvere simul, et fácies eórum demérge in fóveam:'
  "9": et ego confitébor, quod salváre te possit déxtera tua.
  "10": 'Ecce, Béhemoth, quem feci tecum, fœnum quasi bos cómedet:'
  "11": fortitúdo eius in lumbis eius, et virtus illíus in umbilíco ventris eius.
  "12": Stringit caudam suam quasi cedrum, nervi testiculórum eius perpléxi sunt.
  "13": Ossa eius velut fístulæ æris, cartilágo illíus quasi láminæ férreæ.
  "14": Ipse est princípium viárum Dei, qui fecit eum, applicábit gládium eius.
  "15": 'Huic montes herbas ferunt: omnes béstiæ agri ludent ibi.'
  "16": Sub umbra dormit in secréto cálami, et in locis huméntibus.
  "17": Prótegunt umbræ umbram eius, circúmdabunt eum sálices torréntis.
  "18": 'Ecce, absorbébit flúvium, et non mirábitur: et habet fidúciam quod ínfluat Iordánis in os eius.'
  "19": In óculis eius quasi hamo cápiet eum, et in súdibus perforábit nares eius.
  "20": An extráhere póteris Levíathan hamo, et fune ligábis linguam eius?
  "21": Numquid pones círculum in náribus eius, aut armílla perforábis maxíllam eius?
  "22": Numquid multiplicábit ad te preces, aut loquétur tibi móllia?
  "23": Numquid fériet tecum pactum, et accípies eum servum sempitérnum?
  "24": Numquid illúdes ei quasi avi, aut ligábis eum ancíllis tuis?
  "25": Concídent eum amíci, dívident illum negotiatóres?
  "26": Numquid implébis sagénas pelle eius, et gurgústium píscium cápite illíus?
  "27": 'Pone super eum manum tuam: meménto belli, nec ultra addas loqui.'
  "28": Ecce, spes eius frustrábitur eum, et vidéntibus cunctis præcipitábitur.
