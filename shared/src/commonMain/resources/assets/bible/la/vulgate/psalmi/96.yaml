bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "96"
verses:
  "1": 'Huic David, Quando terra eius restitúta est. Dóminus regnávit, exsúltet terra: læténtur ínsulæ multæ.'
  "2": 'Nubes, et calígo in circúitu eius: iustítia, et iudícium corréctio sedis eius.'
  "3": Ignis ante ipsum præcédet, et inflammábit in circúitu inimícos eius.
  "4": 'Illuxérunt fúlgura eius orbi terræ: vidit, et commóta est terra.'
  "5": 'Montes sicut cera fluxérunt a fácie Dómini: a fácie Dómini omnis terra.'
  "6": 'Annuntiavérunt cæli iustítiam eius: et vidérunt omnes pópuli glóriam eius.'
  "7": 'Confundántur omnes, qui adórant sculptília: et qui gloriántur in simulácris suis. Adoráte eum omnes ángeli eius:'
  "8": 'audívit, et lætáta est Sion. Et exsultavérunt fíliæ Iudæ, propter iudícia tua Dómine:'
  "9": 'quóniam tu Dóminus altíssimus super omnem terram: nimis exaltátus es super omnes deos.'
  "10": 'Qui dilígitis Dóminum, odíte malum: custódit Dóminus ánimas sanctórum suórum, de manu peccatóris liberábit eos.'
  "11": Lux orta est iusto, et rectis corde lætítia.
  "12": 'Lætámini iusti in Dómino: et confitémini memóriæ sanctificatiónis eius.'
