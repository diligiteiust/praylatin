bible: vulgate
lang: la
language: Latina
book: II Paralipomenon
chapter: "34"
verses:
  "1": Octo annórum erat Iosías cum regnáre cœpísset, et trigínta et uno anno regnávit in Ierúsalem.
  "2": 'Fecítque quod erat rectum in conspéctu Dómini, et ambulávit in viis David patris sui: non declinávit neque ad dextram, neque ad sinístram.'
  "3": 'Octávo autem anno regni sui, cum adhuc esset puer, cœpit quǽrere Deum patris sui David: et duodécimo anno postquam regnáre cœ́perat, mundávit Iudam et Ierúsalem ab excélsis, et lucis, simulacrísque et sculptílibus.'
  "4": 'Destruxerúntque coram eo aras Báalim: et simulácra, quæ superpósita fúerant, demolíti sunt: lucos étiam et sculptília succídit atque commínuit: et super túmulos eórum, qui eis immoláre consuéverant, fragménta dispérsit.'
  "5": Ossa prætérea sacerdótum combússit in altáribus idolórum, mundavítque Iudam et Ierúsalem.
  "6": Sed et in úrbibus Manásse, et Ephraim, et Símeon, usque Néphthali, cuncta subvértit.
  "7": Cumque altária dissipásset, et lucos, et sculptília contrivísset in frusta, cunctáque delúbra demolítus esset de univérsa terra Israel, revérsus est in Ierúsalem.
  "8": Igitur anno octávo décimo regni sui, mundáta iam terra, et templo Dómini, misit Saphan fílium Eselíæ, et Maasíam príncipem civitátis, et Ioha fílium Ióachaz a commentáriis, ut instaurárent domum Dómini Dei sui.
  "9": 'Qui venérunt ad Helcíam sacerdótem magnum: acceptámque ab eo pecúniam, quæ illáta fúerat in domum Dómini, et quam congregáverant Levítæ, et ianitóres de Manásse, et Ephraim, et univérsis relíquiis Israel, ab omni quoque Iuda, et Béniamin, et habitatóribus Ierúsalem,'
  "10": tradidérunt in mánibus eórum, qui prǽerant operáriis in domo Dómini, ut instaurárent templum, et infírma quæque sarcírent.
  "11": At illi dedérunt eam artifícibus, et cæmentáriis, ut émerent lápides de lapicidínis, et ligna ad commissúras ædifícii, et ad contignatiónem domórum, quas destrúxerant reges Iuda.
  "12": 'Qui fidéliter cuncta faciébant. Erant autem præpósiti operántium, Iahath et Abdías de fíliis Merári, Zacharías et Mosóllam de fíliis Caath, qui urgébant opus: omnes Levítæ sciéntes órganis cánere.'
  "13": Super eos vero, qui ad divérsos usus ónera portábant, erant scribæ, et magístri de Levítis, ianitóres.
  "14": Cumque efférrent pecúniam, quæ illáta fúerat in templum Dómini, réperit Helcías sacérdos librum legis Dómini per manum Móysi.
  "15": 'Et ait ad Saphan scribam: Librum legis invéni in domo Dómini: et trádidit ei.'
  "16": 'At ille íntulit volúmen ad regem, et nuntiávit ei, dicens: Omnia, quæ dedísti in manu servórum tuórum, ecce compléntur.'
  "17": 'Argéntum, quod repértum est in domo Dómini, conflavérunt: datúmque est præféctis artíficum, et divérsa ópera fabricántium.'
  "18": Prætérea trádidit mihi Helcías sacérdos hunc librum. Quem cum rege præsénte recitásset,
  "19": 'audissétque ille verba legis, scidit vestiménta sua:'
  "20": 'et præcépit Helcíæ, et Ahicam fílio Saphan, et Abdon fílio Micha, Saphan quoque scribæ, et Asaæ servo regis, dicens:'
  "21": 'Ite, et oráte Dóminum pro me, et pro relíquiis Israel, et Iuda, super univérsis sermónibus libri istíus, qui repértus est: magnus enim furor Dómini stillávit super nos, eo quod non custodíerint patres nostri verba Dómini, ut fácerent ómnia, quæ scripta sunt in isto volúmine.'
  "22": 'Abiit ergo Helcías, et hi qui simul a rege missi fúerant, ad Oldam prophétidem, uxórem Sellum fílii Thécuath fílii Hasra custódis véstium, quæ habitábat in Ierúsalem in Secúnda: et locúti sunt ei verba, quæ supra narrávimus.'
  "23": 'At illa respóndit eis: Hæc dicit Dóminus Deus Israel: Dícite viro, qui misit vos ad me:'
  "24": 'Hæc dicit Dóminus: Ecce ego indúcam mala super locum istum, et super habitatóres eius, cunctáque maledícta, quæ scripta sunt in libro hoc, quem legérunt coram rege Iuda.'
  "25": Quia dereliquérunt me, et sacrificavérunt diis aliénis, ut me ad iracúndiam provocárent in cunctis opéribus mánuum suárum, idcírco stillábit furor meus super locum istum, et non exstinguétur.
  "26": 'Ad regem autem Iuda, qui misit vos pro Dómino deprecándo, sic loquímini: Hæc dicit Dóminus Deus Israel: Quóniam audísti verba volúminis,'
  "27": 'atque emollítum est cor tuum, et humiliátus es in conspéctu Dei super his, quæ dicta sunt contra locum hunc, et habitatóres Ierúsalem, reveritúsque fáciem meam, scidísti vestiménta tua, et flevísti coram me: ego quoque exaudívi te, dicit Dóminus.'
  "28": 'Iam enim cólligam te ad patres tuos, et inferéris in sepúlcrum tuum in pace: nec vidébunt óculi tui omne malum, quod ego inductúrus sum super locum istum, et super habitatóres eius. Retulérunt ítaque regi cuncta quæ díxerat.'
  "29": At ille convocátis univérsis maióribus natu Iuda et Ierúsalem,
  "30": 'ascéndit in domum Dómini, unáque omnes viri Iuda et habitatóres Ierúsalem, sacerdótes et Levítæ, et cunctus pópulus a mínimo usque ad máximum. Quibus audiéntibus in domo Dómini, legit rex ómnia verba volúminis:'
  "31": et stans in tribunáli suo, percússit fœdus coram Dómino ut ambuláret post eum, et custodíret præcépta, et testimónia, et iustificatiónes eius in toto corde suo, et in tota ánima sua, facerétque quæ scripta sunt in volúmine illo, quod légerat.
  "32": 'Adiurávit quoque super hoc omnes, qui repérti fúerant in Ierúsalem et Béniamin: et fecérunt habitatóres Ierúsalem iuxta pactum Dómini Dei patrum suórum.'
  "33": 'Abstulit ergo Iosías cunctas abominatiónes de univérsis regiónibus filiórum Israel: et fecit omnes, qui resídui erant in Israel, servíre Dómino Deo suo. Cunctis diébus eius non recessérunt a Dómino Deo patrum suórum.'
