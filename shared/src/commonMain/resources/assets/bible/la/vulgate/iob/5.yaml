bible: vulgate
lang: la
language: Latina
book: Iob
chapter: "5"
verses:
  "1": Voca ergo, si est qui tibi respóndeat, et ad áliquem sanctórum convértere.
  "2": Vere stultum intérficit iracúndia, et párvulum occídit invídia.
  "3": Ego vidi stultum firma radíce, et maledíxi pulchritúdini eius statim.
  "4": Longe fient fílii eius a salúte, et conteréntur in porta, et non erit qui éruat.
  "5": Cuius messem famélicus cómedet, et ipsum rápiet armátus, et bibent sitiéntes divítias eius.
  "6": Nihil in terra sine causa fit, et de humo non orítur dolor.
  "7": Homo náscitur ad labórem, et avis ad volátum.
  "8": 'Quam ob rem ego deprecábor Dóminum, et ad Deum ponam elóquium meum:'
  "9": 'qui facit magna et inscrutabília, et mirabília absque número:'
  "10": 'qui dat plúviam super fáciem terræ, et írrigat aquis univérsa:'
  "11": 'qui ponit húmiles in sublíme, et mœréntes érigit sospitáte:'
  "12": 'qui díssipat cogitatiónes malignórum, ne possint implére manus eórum quod cœ́perant:'
  "13": 'qui apprehéndit sapiéntes in astútia eórum, et consílium pravórum díssipat:'
  "14": per diem incúrrent ténebras, et quasi in nocte sic palpábunt in merídie.
  "15": Porro salvum fáciet egénum a gládio oris eórum, et de manu violénti páuperem.
  "16": Et erit egéno spes, iníquitas autem cóntrahet os suum.
  "17": 'Beátus homo, qui corrípitur a Deo: increpatiónem ergo Dómini ne réprobes:'
  "18": 'quia ipse vúlnerat, et medétur: pércutit, et manus eius sanábunt.'
  "19": In sex tribulatiónibus liberábit te, et in séptima non tanget te malum.
  "20": In fame éruet te de morte, et in bello de manu gládii.
  "21": A flagéllo linguæ abscondéris, et non timébis calamitátem cum vénerit.
  "22": In vastitáte, et fame ridébis, et béstias terræ non formidábis.
  "23": Sed cum lapídibus regiónum pactum tuum, et béstiæ terræ pacíficæ erunt tibi.
  "24": Et scies quod pacem hábeat tabernáculum tuum, et vísitans spéciem tuam, non peccábis.
  "25": Scies quoque quóniam múltiplex erit semen tuum, et progénies tua quasi herba terræ.
  "26": Ingrediéris in abundántia sepúlcrum, sicut infértur acérvus trítici in témpore suo.
  "27": 'Ecce hoc, ut investigávimus, ita est: quod audítum, mente pertrácta.'
