bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "57"
verses:
  "1": In finem, Ne dispérdas, David in títuli inscriptiónem.
  "2": 'Si vere útique iustítiam loquímini: recta iudicáte fílii hóminum.'
  "3": 'Etenim in corde iniquitátes operámini: in terra iniustítias manus vestræ concínnant.'
  "4": 'Alienáti sunt peccatóres a vulva, erravérunt ab útero: locúti sunt falsa.'
  "5": 'Furor illis secúndum similitúdinem serpéntis: sicut áspidis surdæ, et obturántis aures suas,'
  "6": 'quæ non exáudiet vocem incantántium: et venéfici incantántis sapiénter.'
  "7": 'Deus cónteret dentes eórum in ore ipsórum: molas leónum confrínget Dóminus.'
  "8": 'Ad níhilum devénient tamquam aqua decúrrens: inténdit arcum suum donec infirméntur.'
  "9": 'Sicut cera, quæ fluit, auferéntur: supercécidit ignis, et non vidérunt solem.'
  "10": 'Priúsquam intellígerent spinæ vestræ rhamnum: sicut vivéntes, sic in ira absórbet eos.'
  "11": 'Lætábitur iustus cum víderit vindíctam: manus suas lavábit in sánguine peccatóris.'
  "12": 'Et dicet homo: Si útique est fructus iusto: útique est Deus iúdicans eos in terra.'
