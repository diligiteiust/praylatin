bible: vulgate
lang: la
language: Latina
book: Lucas
chapter: "23"
verses:
  "1": Et surgens omnis multitúdo eórum, duxérunt illum ad Pilátum.
  "2": 'Cœpérunt autem illum accusáre, dicéntes: Hunc invénimus subverténtem gentem nostram, et prohibéntem tribúta dare Cǽsari, et dicéntem se Christum regem esse.'
  "3": 'Pilátus autem interrogávit eum, dicens: Tu es rex Iudæórum? At ille respóndens ait: Tu dicis.'
  "4": 'Ait autem Pilátus ad príncipes sacerdótum, et turbas: Nihil invénio causæ in hoc hómine.'
  "5": 'At illi invalescébant, dicéntes: Cómmovet pópulum docens per univérsam Iudǽam, incípiens a Galilǽa usque huc.'
  "6": Pilátus autem áudiens Galilǽam, interrogávit si homo Galilǽus esset.
  "7": Et ut cognóvit quod de Heródis potestáte esset, remísit eum ad Heródem, qui et ipse Ierosólymis erat illis diébus.
  "8": Heródes autem viso Iesu, gavísus est valde. Erat enim cúpiens ex multo témpore vidére eum, eo quod audíerat multa de eo, et sperábat signum áliquod vidére ab eo fíeri.
  "9": Interrogábat autem eum multis sermónibus. At ipse nihil illi respondébat.
  "10": Stabant autem príncipes sacerdótum, et scribæ constánter accusántes eum.
  "11": 'Sprevit autem illum Heródes cum exércitu suo: et illúsit indútum veste alba, et remísit ad Pilátum.'
  "12": 'Et facti sunt amíci Heródes et Pilátus in ipsa die: nam ántea inimíci erant ad ínvicem.'
  "13": Pilátus autem, convocátis princípibus sacerdótum, et magistrátibus, et plebe,
  "14": 'dixit ad illos: Obtulístis mihi hunc hóminem, quasi averténtem pópulum, et ecce ego coram vobis intérrogans, nullam causam invéni in hómine isto ex his, in quibus eum accusátis.'
  "15": 'Sed neque Heródes: nam remísi vos ad illum, et ecce nihil dignum morte actum est ei.'
  "16": Emendátum ergo illum dimíttam.
  "17": Necésse autem habébat dimíttere eis per diem festum unum.
  "18": 'Exclamávit autem simul univérsa turba, dicens: Tolle hunc, et dimítte nobis Barábbam,'
  "19": qui erat propter seditiónem quamdam factam in civitáte et homicídium missus in cárcerem.
  "20": Iterum autem Pilátus locútus est ad eos, volens dimíttere Iesum.
  "21": 'At illi succlamábant, dicéntes: Crucifíge, crucifíge eum.'
  "22": 'Ille autem tértio dixit ad illos: Quid enim mali fecit iste? nullam causam mortis invénio in eo: corrípiam ergo illum, et dimíttam.'
  "23": 'At illi instábant vócibus magnis postulántes ut crucifigerétur: et invalescébant voces eórum.'
  "24": Et Pilátus adiudicávit fíeri petitiónem eórum.
  "25": 'Dimísit autem illis eum, qui propter homicídium, et seditiónem missus fúerat in cárcerem, quem petébant: Iesum vero trádidit voluntáti eórum.'
  "26": 'Et cum dúcerent eum, apprehendérunt Simónem quemdam Cyrenénsem veniéntem de villa: et imposuérunt illi crucem portáre post Iesum.'
  "27": 'Sequebátur autem illum multa turba pópuli, et mulíerum: quæ plangébant, et lamentabántur eum.'
  "28": 'Convérsus autem ad illas Iesus, dixit: Fíliæ Ierúsalem, nolíte flere super me, sed super vos ipsas flete, et super fílios vestros.'
  "29": 'Quóniam ecce vénient dies, in quibus dicent: Beátæ stériles, et ventres, qui non genuérunt, et úbera, quæ non lactavérunt.'
  "30": 'Tunc incípient dícere móntibus: Cádite super nos: et cóllibus: Operíte nos.'
  "31": Quia si in víridi ligno hæc fáciunt, in árido quid fiet?
  "32": Ducebántur autem et álii duo nequam cum eo, ut interficeréntur.
  "33": 'Et postquam venérunt in locum, qui vocátur Calváriæ, ibi crucifixérunt eum: et latrónes, unum a dextris, et álterum a sinístris.'
  "34": 'Iesus autem dicébat: Pater dimítte illis: non enim sciunt quid fáciunt. Dividéntes vero vestiménta eius, misérunt sortes.'
  "35": 'Et stabat pópulus spectans, et deridébant eum príncipes cum eis, dicéntes: Alios salvos fecit, se salvum fáciat, si hic est Christus Dei eléctus.'
  "36": Illudébant autem ei et mílites accedéntes, et acétum offeréntes ei,
  "37": 'et dicéntes: Si tu es rex Iudæórum, salvum te fac.'
  "38": 'Erat autem et superscríptio scripta super eum lítteris græcis, et latínis, et hebráicis: Hic est rex Iudæórum.'
  "39": 'Unus autem de his, qui pendébant, latrónibus, blasphemábat eum, dicens: Si tu es Christus, salvum fac temetípsum, et nos.'
  "40": 'Respóndens autem alter increpábat eum, dicens: Neque tu times Deum, quod in eádem damnatióne es.'
  "41": 'Et nos quidem iuste, nam digna factis recípimus: hic vero nihil mali gessit.'
  "42": 'Et dicébat ad Iesum: Dómine, meménto mei, cum véneris in regnum tuum.'
  "43": 'Et dixit illi Iesus: Amen dico tibi: hódie mecum eris in paradíso.'
  "44": Erat autem fere hora sexta, et ténebræ factæ sunt in univérsam terram usque ad horam nonam.
  "45": Et obscurátus est sol, et velum templi scissum est médium.
  "46": 'Et clamans voce magna Iesus ait: Pater, in manus tuas comméndo spíritum meum. Et hæc dicens, exspirávit.'
  "47": 'Videns autem centúrio quod factum fúerat, glorificávit Deum, dicens: Vere hic homo iustus erat.'
  "48": Et omnis turba eórum, qui simul áderant ad spectáculum istud, et vidébant quæ fiébant, percutiéntes péctora sua revertebántur.
  "49": Stabant autem omnes noti eius a longe, et mulíeres, quæ secútæ eum erant a Galilǽa, hæc vidéntes.
  "50": 'Et ecce vir nómine Ioseph, qui erat decúrio, vir bonus, et iustus:'
  "51": 'hic non consénserat consílio, et áctibus eórum: ab Arimathǽa civitáte Iudǽæ, qui exspectábat et ipse regnum Dei:'
  "52": 'hic accéssit ad Pilátum, et pétiit corpus Iesu:'
  "53": et depósitum invólvit síndone, et pósuit eum in monuménto excíso, in quo nondum quisquam pósitus fúerat.
  "54": Et dies erat parascéves, et sábbatum illucescébat.
  "55": Subsecútæ autem mulíeres, quæ cum eo vénerant de Galilǽa, vidérunt monuméntum, et quemádmodum pósitum erat corpus eius.
  "56": 'Et reverténtes paravérunt arómata, et unguénta: et sábbato quidem siluérunt secúndum mandátum.'
