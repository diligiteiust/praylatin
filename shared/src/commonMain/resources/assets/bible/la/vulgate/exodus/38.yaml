bible: vulgate
lang: la
language: Latina
book: Exodus
chapter: "38"
verses:
  "1": 'Fecit et altáre holocáusti de lignis setim, quinque cubitórum per quadrum, et trium in altitúdine:'
  "2": cuius córnua de ángulis procedébant, operuítque illum láminis ǽneis.
  "3": Et in usus eius parávit ex ære vasa divérsa, lebétes, fórcipes, fuscínulas, uncínos, et ígnium receptácula.
  "4": Craticulámque eius in modum retis fecit ǽneam, et subter eam in altáris médio árulam,
  "5": 'fusis quátuor ánnulis per tótidem retiáculi summitátes, ad immitténdos vectes ad portándum:'
  "6": 'quos et ipsos fecit de lignis setim, et opéruit láminis ǽneis:'
  "7": induxítque in círculos, qui in latéribus altáris eminébant. Ipsum autem altáre non erat sólidum, sed cavum ex tábulis, et intus vácuum.
  "8": Fecit et labrum ǽneum cum basi sua de spéculis mulíerum, quæ excubábant in óstio tabernáculi.
  "9": Fecit et átrium, in cuius austráli plaga erant tentória de bysso retórta, cubitórum centum,
  "10": colúmnæ ǽneæ vigínti cum básibus suis, cápita columnárum, et tota óperis cælatúra, argéntea.
  "11": Æque ad septentrionálem plagam tentória colúmnæ, basésque et cápita columnárum eiúsdem mensúræ, et óperis ac metálli, erant.
  "12": In ea vero plaga, quæ ad occidéntem réspicit, fuérunt tentória cubitórum quinquagínta, colúmnæ decem cum básibus suis ǽneæ, et cápita columnárum, et tota óperis cælatúra, argéntea.
  "13": 'Porro contra oriéntem quinquagínta cubitórum parávit tentória:'
  "14": 'e quibus, quíndecim cúbitos columnárum trium, cum básibus suis, unum tenébat latus:'
  "15": et in parte áltera (quia inter útraque intróitum tabernáculi fecit) quíndecim æque cubitórum erant tentória, columnǽque tres, et bases tótidem.
  "16": Cuncta átrii tentória byssus retórta texúerat.
  "17": 'Bases columnárum fuére ǽneæ, cápita autem eárum cum cunctis cælatúris suis argéntea: sed et ipsas colúmnas átrii vestívit argénto.'
  "18": Et in intróitu eius ópere plumário fecit tentórium ex hyacíntho, púrpura, vermículo, ac bysso retórta, quod habébat vigínti cúbitos in longitúdine, altitúdo vero quinque cubitórum erat iuxta mensúram, quam cuncta átrii tentória habébant.
  "19": Colúmnæ autem in ingréssu fuére quátuor cum básibus ǽneis, capitáque eárum et cælatúræ argénteæ.
  "20": Paxíllos quoque tabernáculi et átrii per gyrum fecit ǽneos.
  "21": 'Hæc sunt instruménta tabernáculi testimónii, quæ enumeráta sunt iuxta præcéptum Móysi in cæremóniis Levitárum per manum Ithamar fílii Aaron sacerdótis:'
  "22": quæ Beséleel fílius Uri fílii Hur de tribu Iuda, Dómino per Móysen iubénte, compléverat,
  "23": 'iuncto sibi sócio Oóliab fílio Achísamech de tribu Dan: qui et ipse ártifex lignórum egrégius fuit, et polymitárius atque plumárius ex hyacíntho, púrpura, vermículo et bysso.'
  "24": Omne aurum quod expénsum est in ópere sanctuárii, et quod oblátum est in donáriis, vigínti novem talentórum fuit, et septingentórum trigínta siclórum ad mensúram sanctuárii.
  "25": Oblátum est autem ab his qui transiérunt ad númerum a vigínti annis et supra, de sexcéntis tribus míllibus et quingéntis quinquagínta, armatórum.
  "26": Fuérunt prætérea centum talénta argénti, e quibus conflátæ sunt bases sanctuárii, et intróitus ubi velum pendet.
  "27": Centum bases factæ sunt de taléntis centum, síngulis taléntis per bases síngulas supputátis.
  "28": De mille autem septingéntis et septuagínta quinque, fecit cápita columnárum, quas et ipsas vestívit argénto.
  "29": Æris quoque obláta sunt talénta septuagínta duo míllia, et quadringénti supra sicli,
  "30": ex quibus fusæ sunt bases in intróitu tabernáculi testimónii, et altáre ǽneum cum cratícula sua, omniáque vasa, quæ ad usum eius pértinent,
  "31": et bases átrii tam in circúitu quam in ingréssu eius, et paxílli tabernáculi atque átrii per gyrum.
