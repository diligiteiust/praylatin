bible: vulgate
lang: la
language: Latina
book: Osee
chapter: "12"
verses:
  "1": 'Ephraim pascit ventum, et séquitur æstum: tota die mendácium, et vastitátem multíplicat: et fœdus cum Assýriis íniit, et óleum in Ægýptum ferébat.'
  "2": 'Iudícium ergo Dómini cum Iuda, et visitátio super Iacob: iuxta vias eius, et iuxta adinventiónes eius reddet ei.'
  "3": In útero supplantávit fratrem suum, et in fortitúdine sua diréctus est cum ángelo.
  "4": 'Et inváluit ad ángelum, et confortátus est: flevit, et rogávit eum: in Bethel invénit eum, et ibi locútus est nobíscum.'
  "5": Et Dóminus Deus exercítuum, Dóminus memoriále eius.
  "6": 'Et tu ad Deum tuum convertéris: misericórdiam et iudícium custódi, et spera in Deo tuo semper.'
  "7": Chánaan, in manu eius statéra dolósa, calúmniam diléxit.
  "8": 'Et dixit Ephraim: Verúmtamen dives efféctus sum, invéni idólum mihi: omnes labóres mei non invénient mihi iniquitátem, quam peccávi.'
  "9": Et ego Dóminus Deus tuus ex terra Ægýpti, adhuc sedére te fáciam in tabernáculis, sicut in diébus festivitátis.
  "10": Et locútus sum super prophétas, et ego visiónem multiplicávi, et in manu prophetárum assimilátus sum.
  "11": 'Si Gálaad idólum, ergo frustra erant in Galgal bobus immolántes: nam et altária eórum quasi acérvi super sulcos agri.'
  "12": Fugit Iacob in regiónem Sýriæ, et servívit Israel in uxórem, et in uxórem servávit.
  "13": 'In prophéta autem edúxit Dóminus Israel de Ægýpto: et in prophéta servátus est.'
  "14": Ad iracúndiam me provocávit Ephraim in amaritudínibus suis, et sanguis eius super eum véniet, et oppróbrium eius restítuet ei Dóminus suus.
