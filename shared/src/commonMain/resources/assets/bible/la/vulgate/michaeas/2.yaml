bible: vulgate
lang: la
language: Latina
book: Michaeas
chapter: "2"
verses:
  "1": 'Væ qui cogitátis inútile, et operámini malum in cubílibus vestris: in luce matutína fáciunt illud, quóniam contra Deum est manus eórum.'
  "2": 'Et concupiérunt agros, et violénter tulérunt, et rapuérunt domos: et calumniabántur virum, et domum eius: virum, et hereditátem eius.'
  "3": 'Idcírco hæc dicit Dóminus: Ecce ego cógito super famíliam istam malum: unde non auferétis colla vestra, et non ambulábitis supérbi, quóniam tempus péssimum est.'
  "4": 'In die illa sumétur super vos parábola, et cantábitur cánticum cum suavitáte, dicéntium: Depopulatióne vastáti sumus: pars pópuli mei commutáta est: quómodo recédet a me, cum revertátur, qui regiónes nostras dívidat?'
  "5": Propter hoc non erit tibi mittens funículum sortis in cœtu Dómini.
  "6": 'Ne loquámini loquéntes: Non stillábit super istos, non comprehéndet confúsio.'
  "7": 'Dicit domus Iacob: Numquid abbreviátus est spíritus Dómini, aut tales sunt cogitatiónes eius? Nonne verba mea bona sunt cum eo, qui recte gráditur?'
  "8": 'Et e contrário pópulus meus in adversárium consurréxit: désuper túnica pállium sustulístis: et eos, qui transíbant simplíciter, convertístis in bellum.'
  "9": 'Mulíeres pópuli mei eiecístis de domo deliciárum suárum: a párvulis eárum tulístis laudem meam in perpétuum.'
  "10": 'Súrgite, et ite, quia non habétis hic réquiem: propter immundítiam eius corrumpétur putrédine péssima.'
  "11": 'Utinam non essem vir habens spíritum, et mendácium pótius lóquerer: stillábo tibi in vinum, et in ebrietátem: et erit super quem stillátur pópulus iste.'
  "12": 'Congregatióne congregábo Iacob totum te: in unum condúcam relíquias Israel, páriter ponam illum quasi gregem in ovíli, quasi pecus in médio caulárum, tumultuabúntur a multitúdine hóminum.'
  "13": 'Ascéndet enim pandens iter ante eos: dívident, et transíbunt portam, et ingrediéntur per eam: et transíbit rex eórum coram eis, et Dóminus in cápite eórum.'
