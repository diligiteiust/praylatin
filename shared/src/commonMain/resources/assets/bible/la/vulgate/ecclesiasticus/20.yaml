bible: vulgate
lang: la
language: Latina
book: Ecclesiasticus
chapter: "20"
verses:
  "1": Quam bonum est argúere, quam irásci, et confiténtem in oratióne non prohibére!
  "2": 'Concupiscéntia spadónis devirginábit iuvénculam:'
  "3": sic qui facit per vim iudícium iníquum.
  "4": Quam bonum est corréptum manifestáre pœniténtiam! sic enim effúgies voluntárium peccátum.
  "5": 'Est tacens, qui invenítur sápiens: et est odíbilis, qui procax est ad loquéndum.'
  "6": 'Est tacens non habens sensum loquélæ: et est tacens sciens tempus aptum.'
  "7": 'Homo sápiens tacébit usque ad tempus: lascívus autem, et imprúdens non servábunt tempus.'
  "8": 'Qui multis útitur verbis, lædet ánimam suam: et qui potestátem sibi sumit iniúste, odiétur.'
  "9": Est procéssio in malis viro indisciplináto, et est invéntio in detriméntum.
  "10": 'Est datum, quod non est útile: et est datum, cuius retribútio duplex.'
  "11": 'Est propter glóriam minorátio: et est qui ab humilitáte levábit caput.'
  "12": Est qui multa rédimat módico prétio, et restítuens ea in séptuplum.
  "13": 'Sápiens in verbis seípsum amábilem facit: grátiæ autem fatuórum effundéntur.'
  "14": 'Datus insipiéntis non erit útilis tibi: óculi enim illíus septémplices sunt.'
  "15": 'Exígua dabit, et multa improperábit: et apértio oris illíus inflammátio est.'
  "16": 'Hódie fœnerátur quis, et cras éxpetit: odíbilis est homo huiúsmodi.'
  "17": 'Fátuo non erit amícus, et non erit grátia bonis illíus:'
  "18": qui enim edunt panem illíus, falsæ linguæ sunt. Quóties, et quanti irridébunt eum?
  "19": 'Neque enim quod habéndum erat, dirécto sensu distríbuit: simíliter et quod non erat habéndum.'
  "20": 'Lapsus falsæ linguæ, quasi qui in paviménto cadens: sic casus malórum festinánter véniet.'
  "21": Homo ácharis quasi fábula vana, in ore indisciplinatórum assídua erit.
  "22": 'Ex ore fátui reprobábitur parábola: non enim dicit illam in témpore suo.'
  "23": Est qui vetátur peccáre præ inópia, et in réquie sua stimulábitur.
  "24": 'Est qui perdet ánimam suam præ confusióne, et ab imprudénti persóna perdet eam: persónæ autem acceptióne perdet se.'
  "25": Est qui præ confusióne promíttit amíco, et lucrátus est eum inimícum gratis.
  "26": Oppróbrium nequam in hómine mendácium, et in ore indisciplinatórum assídue erit.
  "27": 'Pótior fur quam assidúitas viri mendácis: perditiónem autem ambo hereditábunt.'
  "28": 'Mores hóminum mendácium sine honóre: et confúsio illórum cum ipsis sine intermissióne.'
  "29": Sápiens in verbis prodúcet seípsum, et homo prudens placébit magnátis.
  "30": 'Qui operátur terram suam, inaltábit acérvum frugum: et qui operátur iustítiam, ipse exaltábitur: qui vero placet magnátis, effúgiet iniquitátem.'
  "31": Xénia et dona excǽcant óculos iúdicum, et quasi mutus in ore avértit correptiónes eórum.
  "32": 'Sapiéntia abscónsa, et thesáurus invísus: quæ utílitas in utrísque?'
  "33": Mélior est qui celat insipiéntiam suam, quam homo qui abscóndit sapiéntiam suam.
