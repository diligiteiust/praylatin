bible: vulgate
lang: la
language: Latina
book: Apocalypsis
chapter: "3"
verses:
  "1": 'Et ángelo ecclésiæ Sardis scribe: Hæc dicit qui habet septem spíritus Dei, et septem stellas: Scio ópera tua, quia nomen habes quod vivas, et mórtuus es.'
  "2": Esto vígilans, et confírma cétera, quæ moritúra erant. Non enim invénio ópera tua plena coram Deo meo.
  "3": In mente ergo habe quáliter accéperis, et audíeris, et serva, et pœniténtiam age. Si ergo non vigiláveris, véniam ad te tamquam fur et néscies qua hora véniam ad te.
  "4": 'Sed habes pauca nómina in Sardis, qui non inquinavérunt vestiménta sua: et ambulábunt mecum in albis, quia digni sunt.'
  "5": Qui vícerit, sic vestiétur vestiméntis albis, et non delébo nomen eius de Libro vitæ, et confitébor nomen eius coram Patre meo, et coram ángelis eius.
  "6": Qui habet aurem, áudiat quid Spíritus dicat ecclésiis.
  "7": 'Et ángelo Philadelphíæ ecclésiæ scribe: Hæc dicit Sanctus et Verus, qui habet clavem David: qui áperit, et nemo claudit: claudit, et nemo áperit:'
  "8": 'Scio ópera tua. Ecce dedi coram te óstium apértum, quod nemo potest cláudere: quia módicam habes virtútem, et servásti verbum meum, et non negásti nomen meum.'
  "9": 'Ecce dabo de synagóga Sátanæ, qui dicunt se Iudǽos esse, et non sunt, sed mentiúntur: ecce fáciam illos ut véniant, et adórent ante pedes tuos: et scient quia ego diléxi te:'
  "10": quóniam servásti verbum patiéntiæ meæ, et ego servábo te ab hora tentatiónis, quæ ventúra est in orbem univérsum tentáre habitántes in terra.
  "11": 'Ecce vénio cito: tene quod habes, ut nemo accípiat corónam tuam.'
  "12": 'Qui vícerit, fáciam illum colúmnam in templo Dei mei, et foras non egrediétur ámplius: et scribam super eum nomen Dei mei, et nomen civitátis Dei mei novæ Ierúsalem, quæ descéndit de cælo a Deo meo, et nomen meum novum.'
  "13": Qui habet aurem, áudiat quid Spíritus dicat ecclésiis.
  "14": 'Et ángelo Laodicíæ ecclésiæ scribe: Hæc dicit: Amen, testis fidélis et verus, qui est princípium creatúræ Dei.'
  "15": 'Scio ópera tua: quia neque frígidus es, neque cálidus: útinam frígidus esses, aut cálidus:'
  "16": sed quia tépidus es, et nec frígidus, nec cálidus, incípiam te evómere ex ore meo.
  "17": 'Quia dicis: Quod dives sum, et locupletátus, et nullíus égeo: et nescis quia tu es miser, et miserábilis, et pauper, et cæcus, et nudus.'
  "18": Suádeo tibi émere a me aurum ignítum probátum, ut lócuples fias, et vestiméntis albis induáris, et non appáreat confúsio nuditátis tuæ, et collýrio inúnge óculos tuos ut vídeas.
  "19": Ego quos amo, árguo, et castígo. Æmuláre ergo, et pœniténtiam age.
  "20": 'Ecce sto ad óstium, et pulso: si quis audíerit vocem meam, et aperúerit mihi iánuam, intrábo ad illum, et cœnábo cum illo, et ipse mecum.'
  "21": 'Qui vícerit, dabo ei sedére mecum in throno meo: sicut et ego vici, et sedi cum Patre meo in throno eius.'
  "22": Qui habet aurem, áudiat quid Spíritus dicat ecclésiis.
