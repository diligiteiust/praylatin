bible: vulgate
lang: la
language: Latina
book: II Paralipomenon
chapter: "25"
verses:
  "1": Vigínti quinque annórum erat Amasías cum regnáre cœpísset, et vigínti novem annis regnávit in Ierúsalem, nomen matris eius Ióadan de Ierúsalem.
  "2": 'Fecítque bonum in conspéctu Dómini: verúmtamen non in corde perfécto.'
  "3": Cumque roborátum sibi vidéret impérium, iugulávit servos, qui occíderant regem patrem suum,
  "4": 'sed fílios eórum non interfécit, sicut scriptum est in Libro legis Móysi, ubi præcépit Dóminus, dicens: Non occidéntur patres pro fíliis, neque fílii pro pátribus suis, sed unusquísque in suo peccáto moriétur.'
  "5": 'Congregávit ígitur Amasías Iudam, et constítuit eos per famílias, tribunósque et centuriónes in univérso Iuda, et Béniamin: et recénsuit a vigínti annis supra, invenítque trecénta míllia iúvenum, qui egrederéntur ad pugnam, et tenérent hastam et clýpeum.'
  "6": Mercéde quoque condúxit de Israel centum míllia robustórum, centum taléntis argénti.
  "7": 'Venit autem homo Dei ad illum, et ait: O rex, ne egrediátur tecum exércitus Israel: non est enim Dóminus cum Israel, et cunctis fíliis Ephraim:'
  "8": 'quod si putas in róbore exércitus bella consístere, superári te fáciet Deus ab hóstibus: Dei quippe est et adiuváre, et in fugam convértere.'
  "9": 'Dixítque Amasías ad hóminem Dei: Quid ergo fiet de centum taléntis, quæ dedi milítibus Israel? Et respóndit ei homo Dei: Habet Dóminus unde tibi dare possit multo his plura.'
  "10": 'Separávit ítaque Amasías exércitum, qui vénerat ad eum ex Ephraim, ut reverterétur in locum suum: at illi contra Iudam veheménter iráti, revérsi sunt in regiónem suam.'
  "11": 'Porro Amasías confidénter edúxit pópulum suum, et ábiit in vallem Salinárum, percussítque fílios Seir decem míllia:'
  "12": 'et ália decem míllia virórum cepérunt fílii Iuda, et adduxérunt ad prærúptum cuiúsdam petræ, præcipitaverúntque eos de summo in præceps: qui univérsi crepuérunt.'
  "13": At ille exércitus, quem remíserat Amasías ne secum iret ad prœ́lium, diffúsus est in civitátibus Iuda, a Samaría usque ad Béthoron, et interféctis tribus míllibus, dirípuit prædam magnam.
  "14": Amasías vero post cædem Idumæórum, et allátos deos filiórum Seir, státuit illos in deos sibi, et adorábat eos, et illis adolébat incénsum.
  "15": 'Quam ob rem irátus Dóminus contra Amasíam misit ad illum prophétam, qui díceret ei: Cur adorásti deos, qui non liberavérunt pópulum suum de manu tua?'
  "16": 'Cumque hæc ille loquerétur, respóndit ei: Num consiliárius regis es? quiésce, ne interfíciam te. Discedénsque prophéta: Scio, inquit, quod cogitáverit Deus occídere te, quia fecísti hoc malum, et ínsuper non acquievísti consílio meo.'
  "17": 'Igitur Amasías rex Iuda ínito péssimo consílio, misit ad Ioas fílium Ióachaz fílii Iehu, regem Israel, dicens: Veni, videámus nos mútuo.'
  "18": 'At ille remísit núntios, dicens: Cárduus, qui est in Líbano, misit ad cedrum Líbani, dicens: Da fíliam tuam fílio meo uxórem: et ecce béstiæ, quæ erant in silva Líbani, transiérunt, et conculcavérunt cárduum.'
  "19": 'Dixísti: Percússi Edom, et idcírco erígitur cor tuum in supérbiam: sede in domo tua: cur malum advérsum te próvocas, ut cadas et tu, et Iuda tecum?'
  "20": Nóluit audíre Amasías, eo quod Dómini esset volúntas ut traderétur in manus hóstium propter deos Edom.
  "21": 'Ascéndit ígitur Ioas rex Israel, et mútuos sibi præbuére conspéctus: Amasías autem rex Iuda erat in Béthsames Iuda:'
  "22": corruítque Iuda coram Israel, et fugit in tabernácula sua.
  "23": 'Porro Amasíam regem Iuda, fílium Ioas fílii Ióachaz, cepit Ioas rex Israel in Béthsames, et addúxit in Ierúsalem: destruxítque murum eius a porta Ephraim usque ad portam ánguli quadringéntis cúbitis.'
  "24": Omne quoque aurum, et argéntum, et univérsa vasa, quæ repérerat in domo Dei, et apud Obédedom in thesáuris étiam domus régiæ, necnon et fílios óbsidum, redúxit in Samaríam.
  "25": Vixit autem Amasías fílius Ioas rex Iuda, postquam mórtuus est Ioas fílius Ióachaz rex Israel, quíndecim annis.
  "26": Réliqua autem sermónum Amasíæ priórum et novissimórum scripta sunt in Libro regum Iuda et Israel.
  "27": Qui postquam recéssit a Dómino, tetendérunt ei insídias in Ierúsalem. Cumque fugísset in Lachis, misérunt, et interfecérunt eum ibi.
  "28": Reportantésque super equos, sepeliérunt eum cum pátribus suis in civitáte David.
