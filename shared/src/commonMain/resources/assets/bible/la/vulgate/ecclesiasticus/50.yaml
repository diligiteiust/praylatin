bible: vulgate
lang: la
language: Latina
book: Ecclesiasticus
chapter: "50"
verses:
  "1": Simon, Oníæ fílius, sacérdos magnus, qui in vita sua suffúlsit domum, et in diébus suis corroborávit templum.
  "2": Templi étiam altitúdo ab ipso fundáta est, duplex ædificátio, et excélsi paríetes templi.
  "3": In diébus ipsíus emanavérunt pútei aquárum, et quasi mare adimpléti sunt supra modum.
  "4": Qui curávit gentem suam, et liberávit eam a perditióne.
  "5": 'Qui præváluit amplificáre civitátem, qui adéptus est glóriam in conversatióne gentis: et ingréssum domus, et átrii amplificávit.'
  "6": Quasi stella matutína in médio nébulæ, et quasi luna plena in diébus suis lucet.
  "7": Et quasi sol refúlgens, sic ille effúlsit in templo Dei.
  "8": Quasi arcus refúlgens inter nébulas glóriæ, et quasi flos rosárum in diébus vernis, et quasi lília quæ sunt in tránsitu aquæ, et quasi thus rédolens in diébus æstátis.
  "9": Quasi ignis effúlgens, et thus ardens in igne.
  "10": Quasi vas auri sólidum, ornátum omni lápide pretióso.
  "11": Quasi olíva púllulans, et cypréssus in altitúdinem se extóllens, in accipiéndo ipsum stolam glóriæ, et vestíri eum in consummatiónem virtútis.
  "12": In ascénsu altáris sancti, glóriam dedit sanctitátis amíctum.
  "13": 'In accipiéndo autem partes de manu sacerdótum, et ipse stans iuxta aram. Et circa illum coróna fratrum: quasi plantátio cedri in monte Líbano,'
  "14": sic circa illum stetérunt quasi rami palmæ, et omnes fílii Aaron in glória sua.
  "15": 'Oblátio autem Dómini in mánibus ipsórum, coram omni synagóga Israel: et consummatióne fungens in ara, amplificáre oblatiónem excélsi regis'
  "16": porréxit manum suam in libatióne, et libávit de sánguine uvæ.
  "17": Effúdit in fundaménto altáris odórem divínum excélso príncipi.
  "18": Tunc exclamavérunt fílii Aaron, in tubis productílibus sonuérunt, et audítam fecérunt vocem magnam in memóriam coram Deo.
  "19": Tunc omnis pópulus simul properavérunt, et cecidérunt in fáciem super terram, adoráre Dóminum Deum suum, et dare preces omnipoténti Deo excélso.
  "20": Et amplificavérunt psalléntes in vócibus suis, et in magna domo auctus est sonus suavitátis plenus.
  "21": Et rogávit pópulus Dóminum excélsum in prece, usque dum perféctus est honor Dómini, et munus suum perfecérunt.
  "22": 'Tunc descéndens, manus suas éxtulit in omnem congregatiónem filiórum Israel dare glóriam Deo a lábiis suis, et in nómine ipsíus gloriári:'
  "23": et iterávit oratiónem suam, volens osténdere virtútem Dei.
  "24": 'Et nunc oráte Deum ómnium, qui magna fecit in omni terra, qui auxit dies nostros a ventre matris nostræ, et fecit nobíscum secúndum suam misericórdiam:'
  "25": 'det nobis iucunditátem cordis, et fíeri pacem in diébus nostris in Israel per dies sempitérnos:'
  "26": crédere Israel nobíscum esse Dei misericórdiam, ut líberet nos in diébus suis.
  "27": 'Duas gentes odit ánima mea: tértia autem non est gens, quam óderim:'
  "28": qui sedent in monte Seir, et Philísthiim, et stultus pópulus, qui hábitat in Síchimis.
  "29": Doctrínam sapiéntiæ et disciplínæ scripsit in códice isto Iesus, fílius Sirach, Ierosolymíta, qui renovávit sapiéntiam de corde suo.
  "30": 'Beátus, qui in istis versátur bonis: qui ponit illa in corde suo, sápiens erit semper.'
  "31": 'Si enim hæc fécerit, ad ómnia valébit: quia lux Dei, vestígium eius est.'
