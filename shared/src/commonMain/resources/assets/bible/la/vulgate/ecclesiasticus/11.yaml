bible: vulgate
lang: la
language: Latina
book: Ecclesiasticus
chapter: "11"
verses:
  "1": Sapiéntia humiliáti exaltábit caput illíus, et in médio magnatórum consedére illum fáciet.
  "2": Non laudes virum in spécie sua, neque spernas hóminem in visu suo.
  "3": Brevis in volatílibus est apis, et inítium dulcóris habet fructus illíus.
  "4": 'In vestítu ne gloriéris unquam, nec in die honóris tui extolláris: quóniam mirabília ópera Altíssimi solíus, et gloriósa, et abscónsa, et invísa ópera illíus.'
  "5": Multi tyránni sedérunt in throno, et insuspicábilis portávit diadéma.
  "6": Multi poténtes oppréssi sunt válide, et gloriósi tráditi sunt in manus alterórum.
  "7": 'Priúsquam intérroges, ne vitúperes quemquam: et cum interrogáveris, córripe iuste.'
  "8": 'Priúsquam áudias, ne respóndeas verbum: et in médio sermónum ne adícias loqui.'
  "9": 'De ea re, quæ te non moléstat, ne certéris: et in iudício peccántium ne consístas.'
  "10": 'Fili ne in multis sint actus tui: et si dives fúeris, non eris immúnis a delícto. Si enim secútus fúeris, non apprehéndes: et non effúgies, si præcucúrreris.'
  "11": Est homo labórans, et festínans, et dolens ímpius, et tanto magis non abundábit.
  "12": 'Est homo márcidus egens recuperatióne, plus defíciens virtúte, et abúndans paupertáte:'
  "13": 'et óculus Dei respéxit illum in bono, et eréxit eum ab humilitáte ipsíus, et exaltávit caput eius: et miráti sunt in illo multi, et honoravérunt Deum.'
  "14": Bona et mala, vita et mors, paupértas et honéstas a Deo sunt.
  "15": Sapiéntia et disciplína, et sciéntia legis apud Deum. Diléctio, et viæ bonórum apud ipsum.
  "16": 'Error et ténebræ peccatóribus concreáta sunt: qui autem exsúltant in malis, consenéscunt in malo.'
  "17": Dátio Dei pérmanet iustis, et proféctus illíus succéssus habébit in ætérnum.
  "18": Est qui locupletátur parce agéndo, et hæc est pars mercédis illíus.
  "19": 'In eo quod dicit: Invéni réquiem mihi, et nunc manducábo de bonis meis solus:'
  "20": et nescit quod tempus prætériet, et mors appropínquet, et relínquat ómnia áliis, et moriétur.
  "21": Sta in testaménto tuo, et in illo collóquere, et in ópere mandatórum tuórum veterásce.
  "22": 'Ne mánseris in opéribus peccatórum: confíde autem in Deo, et mane in loco tuo.'
  "23": Fácile est enim in óculis Dei súbito honestáre páuperem.
  "24": Benedíctio Dei in mercédem iusti festínat, et in hora velóci procéssus illíus fructíficat.
  "25": 'Ne dicas: Quid est mihi opus? et quæ erunt mihi ex hoc bona?'
  "26": 'Ne dicas: Suffíciens mihi sum: et quid ex hoc pessimábor?'
  "27": 'In die bonórum ne ímmemor sis malórum: et in die malórum ne ímmemor sis bonórum:'
  "28": quóniam fácile est coram Deo in die óbitus retribúere unicuíque secúndum vias suas.
  "29": Malítia horæ obliviónem facit luxúriæ magnæ, et in fine hóminis denudátio óperum illíus.
  "30": 'Ante mortem ne laudes hóminem quemquam: quóniam in fíliis suis agnóscitur vir.'
  "31": 'Non omnem hóminem indúcas in domum tuam: multæ enim sunt insídiæ dolósi.'
  "32": 'Sicut enim erúctant præcórdia fœténtium, et sicut perdix indúcitur in cáveam, et ut cáprea in láqueum: sic et cor superbórum, et sicut prospéctor videns casum próximi sui.'
  "33": Bona enim in mala convértens insidiátur, et in eléctis impónet máculam.
  "34": 'A scintílla una augétur ignis, et ab uno dolóso augétur sanguis: homo vero peccátor sánguini insidiátur.'
  "35": 'Atténde tibi a pestífero, fábricat enim mala: ne forte indúcat super te subsannatiónem in perpétuum.'
  "36": 'Admítte ad te alienígenam: et subvértet te in túrbine, et abalienábit te a tuis própriis.'
