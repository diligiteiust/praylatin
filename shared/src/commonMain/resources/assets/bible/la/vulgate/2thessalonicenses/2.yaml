bible: vulgate
lang: la
language: Latina
book: ad Thessalonicenses II
chapter: "2"
verses:
  "1": 'Rogámus autem vos fratres per advéntum Dómini nostri Iesu Christi, et nostræ congregatiónis in ipsum:'
  "2": ut non cito moveámini a vestro sensu, neque terreámini, neque per spíritum, neque per sermónem, neque per epístolam tamquam per nos missam, quasi instet dies Dómini.
  "3": 'Ne quis vos sedúcat ullo modo: quóniam nisi vénerit discéssio primum, et revelátus fúerit homo peccáti fílius perditiónis,'
  "4": qui adversátur, et extóllitur supra omne, quod dícitur Deus, aut quod cólitur, ita ut in templo Dei sédeat osténdens se tamquam sit Deus.
  "5": Non retinétis quod cum adhuc essem apud vos, hæc dicébam vobis?
  "6": Et nunc quid detíneat scitis, ut revelétur in suo témpore.
  "7": 'Nam mystérium iam operátur iniquitátis: tantum ut qui tenet nunc, téneat, donec de médio fiat.'
  "8": 'Et tunc revelábitur ille iníquus, quem Dóminus Iesus interfíciet spíritu oris sui, et déstruet illustratióne advéntus sui eum:'
  "9": cuius est advéntus secúndum operatiónem Sátanæ in omni virtúte, et signis, et prodígiis mendácibus,
  "10": 'et in omni seductióne iniquitátis iis, qui péreunt: eo quod caritátem veritátis non recepérunt ut salvi fíerent.'
  "11": Ideo mittet illis Deus operatiónem erróris ut credant mendácio,
  "12": ut iudicéntur omnes, qui non credidérunt veritáti, sed consensérunt iniquitáti.
  "13": 'Nos autem debémus grátias ágere Deo semper pro vobis fratres dilécti a Deo, quod elégerit vos Deus primítias in salútem in sanctificatióne spíritus, et in fide veritátis:'
  "14": in qua et vocávit vos per Evangélium nostrum in acquisitiónem glóriæ Dómini nostri Iesu Christi.
  "15": 'Itaque fratres state: et tenéte traditiónes, quas didicístis, sive per sermónem, sive per epístolam nostram.'
  "16": Ipse autem Dóminus noster Iesus Christus, et Deus et Pater noster, qui diléxit nos, et dedit consolatiónem ætérnam, et spem bonam in grátia,
  "17": exhortétur corda vestra, et confírmet in omni ópere, et sermóne bono.
