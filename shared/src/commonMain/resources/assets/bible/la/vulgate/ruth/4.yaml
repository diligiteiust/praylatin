bible: vulgate
lang: la
language: Latina
book: Ruth
chapter: "4"
verses:
  "1": 'Ascéndit ergo Booz ad portam, et sedit ibi. Cumque vidísset propínquum præteríre, de quo prius sermo hábitus est, dixit ad eum: Declína paulísper, et sede hic: vocans eum nómine suo. Qui divértit, et sedit.'
  "2": 'Tollens autem Booz decem viros de senióribus civitátis, dixit ad eos: Sedéte hic.'
  "3": 'Quibus sedéntibus, locútus est ad propínquum: Partem agri fratris nostri Elímelech vendet Nóemi, quæ revérsa est de regióne Moabítide:'
  "4": 'quod audíre te vólui, et tibi dícere coram cunctis sedéntibus, et maióribus natu de pópulo meo. Si vis possidére iure propinquitátis, eme, et pósside: sin autem dísplicet tibi, hoc ipsum índica mihi, ut sciam quid fácere débeam: nullus enim est propínquus, excépto te, qui prior es: et me, qui secúndus sum. At ille respóndit: Ego agrum emam.'
  "5": 'Cui dixit Booz: Quando émeris agrum de manu mulíeris, Ruth quoque Moabítidem, quæ uxor defúncti fuit, debes accípere: ut súscites nomen propínqui tui in hereditáte sua.'
  "6": 'Qui respóndit: Cedo iuri propinquitátis: neque enim posteritátem famíliæ meæ delére débeo: tu meo útere privilégio, quo me libénter carére profíteor.'
  "7": 'Hic autem erat mos antíquitus in Israel inter propínquos, ut si quándo alter álteri suo iuri cedébat, ut esset firma concéssio, solvébat homo calceaméntum suum, et dabat próximo suo: hoc erat testimónium cessiónis in Israel.'
  "8": 'Dixit ergo propínquo suo Booz: Tolle calceaméntum tuum. Quod statim solvit de pede suo.'
  "9": 'At ille maióribus natu, et univérso pópulo, Testes vos, inquit, estis hódie, quod posséderim omnia quæ fuérunt Elímelech, et Chélion, et Máhalon, tradénte Nóemi:'
  "10": et Ruth Moabítidem, uxórem Máhalon, in coniúgium súmpserim, ut súscitem nomen defúncti in hereditáte sua, ne vocábulum eius de família sua ac frátribus et pópulo deleátur. Vos, inquam, huius rei testes estis.
  "11": 'Respóndit omnis pópulus, qui erat in porta, et maióres natu: Nos testes sumus: fáciat Dóminus hanc mulíerem, quæ ingréditur domum tuam, sicut Rachel et Liam, quæ ædificavérunt domum Israel: ut sit exémplum virtútis in Ephratha, et hábeat célebre nomen in Béthlehem:'
  "12": fiátque domus tua, sicut domus Phares, quem Thamar péperit Iudæ, de sémine quod tibi déderit Dóminus ex hac puélla.
  "13": 'Tulit ítaque Booz Ruth, et accépit uxórem: ingressúsque est ad eam, et dedit illi Dóminus ut concíperet, et páreret fílium.'
  "14": 'Dixerúntque mulíeres ad Nóemi: Benedíctus Dóminus, qui non est passus ut defíceret succéssor famíliæ tuæ, et vocarétur nomen eius in Israel.'
  "15": 'Et hábeas qui consolétur ánimam tuam, et enútriat senectútem: de nuru enim tua natus est, quæ te díligit: et multo tibi mélior est, quam si septem habéres fílios.'
  "16": Susceptúmque Nóemi púerum pósuit in sinu suo, et nutrícis ac gérulæ fungebátur offício.
  "17": 'Vicínæ autem mulíeres congratulántes ei, et dicéntes: Natus est fílius Nóemi: vocavérunt nomen eius Obed: hic est pater Isai, patris David.'
  "18": 'Hæ sunt generatiónes Phares: Phares génuit Esron,'
  "19": Esron génuit Aram, Aram génuit Amínadab,
  "20": Amínadab génuit Nahásson, Nahásson génuit Salmon,
  "21": Salmon génuit Booz, Booz génuit Obed,
  "22": Obed génuit Isai, Isai génuit David.
