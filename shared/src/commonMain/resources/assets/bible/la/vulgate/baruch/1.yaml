bible: vulgate
lang: la
language: Latina
book: Baruch
chapter: "1"
verses:
  "1": Et hæc verba libri, quæ scripsit Baruch fílius Nériæ, fílii Maasíæ, fílii Sedecíæ, fílii Sédei, fílii Helcíæ in Babylónia,
  "2": in anno quinto, in séptimo die mensis, in témpore quo cepérunt Chaldǽi Ierúsalem, et succendérunt eam igni.
  "3": Et legit Baruch verba libri huius ad aures Iechoníæ fílii Ióakim regis Iuda, et ad aures univérsi pópuli veniéntis ad librum,
  "4": et ad aures poténtium filiórum regum, et ad aures presbyterórum, et ad aures pópuli, a mínimo usque ad máximum eórum, ómnium habitántium in Babylónia, ad flumen Sodi.
  "5": Qui audiéntes plorábant, et ieiunábant, et orábant in conspéctu Dómini.
  "6": Et collegérunt pecúniam, secúndum quod pótuit uniuscuiúsque manus,
  "7": 'et misérunt in Ierúsalem ad Ióakim fílium Helcíæ fílii Salom sacerdótem, et ad sacerdótes, et ad omnem pópulum, qui invénti sunt cum eo in Ierúsalem:'
  "8": cum accíperet vasa templi Dómini, quæ abláta fúerant de templo, revocáre in terram Iuda décima die mensis Sivan, vasa argéntea, quæ fecit Sedecías fílius Iosíæ rex Iuda,
  "9": posteáquam cepísset Nabuchodónosor rex Babylónis Iechoníam, et príncipes, et cunctos poténtes, et pópulum terræ ab Ierúsalem, et duxit eos vinctos in Babylónem.
  "10": 'Et dixérunt: Ecce mísimus ad vos pecúnias, de quibus émite holocautómata et thus, et fácite manna, et offérte pro peccáto, ad aram Dómini Dei nostri:'
  "11": 'et oráte pro vita Nabuchodónosor regis Babylónis, et pro vita Baltássar fílii eius, ut sint dies eórum sicut dies cæli super terram:'
  "12": et ut det Dóminus virtútem nobis, et illúminet óculos nostros, ut vivámus sub umbra Nabuchodónosor regis Babylónis, et sub umbra Baltássar fílii eius, et serviámus eis multis diébus, et inveniámus grátiam in conspéctu eórum.
  "13": Et pro nobis ipsis oráte ad Dóminum Deum nostrum, quia peccávimus Dómino Deo nostro, et non est avérsus furor eius a nobis usque in hunc diem.
  "14": 'Et légite librum istum, quem mísimus ad vos recitári in templo Dómini, in die solémni et in die opportúno:'
  "15": 'et dicétis: Dómino Deo nostro iustítia, nobis autem confúsio faciéi nostræ, sicut est dies hæc omni Iuda, et habitántibus in Ierúsalem,'
  "16": régibus nostris, et princípibus nostris, et sacerdótibus nostris, et prophétis nostris, et pátribus nostris.
  "17": 'Peccávimus ante Dóminum Deum nostrum, et non credídimus, diffidéntes in eum:'
  "18": et non fúimus subiectíbiles illi, et non audívimus vocem Dómini Dei nostri, ut ambularémus in mandátis eius, quæ dedit nobis.
  "19": 'A die, qua edúxit patres nostros de terra Ægýpti, usque ad diem hanc, erámus incredíbiles ad Dóminum Deum nostrum: et dissipáti recéssimus, ne audirémus vocem ipsíus.'
  "20": 'Et adhæsérunt nobis multa mala, et maledictiónes, quæ constítuit Dóminus Móysi servo suo: qui edúxit patres nostros de terra Ægýpti, dare nobis terram fluéntem lac et mel, sicut hodiérna die.'
  "21": 'Et non audívimus vocem Dómini Dei nostri, secúndum ómnia verba prophetárum, quos misit ad nos:'
  "22": et abívimus unusquísque in sensum cordis nostri malígni, operári diis aliénis, faciéntes mala ante óculos Dómini Dei nostri.
