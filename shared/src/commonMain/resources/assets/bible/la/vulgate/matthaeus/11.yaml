bible: vulgate
lang: la
language: Latina
book: Matthaeus
chapter: "11"
verses:
  "1": Et factum est, cum consummásset Iesus, præcípiens duódecim discípulis suis, tránsiit inde ut docéret, et prædicáret in civitátibus eórum.
  "2": Ioánnes autem cum audísset in vínculis ópera Christi, mittens duos de discípulis suis,
  "3": 'ait illi: Tu es, qui ventúrus es, an álium exspectámus?'
  "4": 'Et respóndens Iesus ait illis: Eúntes renuntiáte Ioánni quæ audístis, et vidístis.'
  "5": 'Cæci vident, claudi ámbulant, leprósi mundántur, surdi áudiunt, mórtui resúrgunt, páuperes evangelizántur:'
  "6": et beátus est, qui non fúerit scandalizátus in me.
  "7": 'Illis autem abeúntibus, cœpit Iesus dícere ad turbas de Ioánne: Quid exístis in desértum vidére? arúndinem vento agitátam?'
  "8": Sed quid exístis vidére? hóminem móllibus vestítum? Ecce qui móllibus vestiúntur, in dómibus regum sunt.
  "9": Sed quid exístis vidére? prophétam? Etiam dico vobis, et plus quam prophétam.
  "10": 'Hic est enim, de quo scriptum est: Ecce ego mitto ángelum meum ante fáciem tuam, qui præparábit viam tuam ante te.'
  "11": 'Amen dico vobis, non surréxit inter natos mulíerum maior Ioánne Baptísta: qui autem minor est in regno cælórum, maior est illo.'
  "12": A diébus autem Ioánnis Baptístæ usque nunc, regnum cælórum vim pátitur, et violénti rápiunt illud.
  "13": 'Omnes enim prophétæ, et lex usque ad Ioánnem prophetavérunt:'
  "14": et si vultis recípere, ipse est Elías, qui ventúrus est.
  "15": Qui habet aures audiéndi, áudiat.
  "16": 'Cui autem símilem æstimábo generatiónem istam? Símilis est púeris sedéntibus in foro: qui clamántes coæquálibus'
  "17": 'dicunt: Cecínimus vobis, et non saltástis: lamentávimus, et non planxístis.'
  "18": 'Venit enim Ioánnes neque mandúcans, neque bibens, et dicunt: Dæmónium habet.'
  "19": 'Venit Fílius hóminis mandúcans, et bibens, et dicunt: Ecce homo vorax, et potátor vini, publicanórum, et peccatórum amícus. Et iustificáta est sapiéntia a fíliis suis.'
  "20": 'Tunc cœpit exprobráre civitátibus, in quibus factæ sunt plúrimæ virtútes eius, quia non egíssent pœniténtiam:'
  "21": 'Væ tibi Corózain, væ tibi Bethsáida: quia si in Tyro, et Sidóne factæ essent virtútes, quæ factæ sunt in vobis, olim in cilício, et cínere pœniténtiam egíssent.'
  "22": 'Verúmtamen dico vobis: Tyro, et Sidóni remíssius erit in die iudícii, quam vobis.'
  "23": 'Et tu Caphárnaum, numquid usque in cælum exaltáberis? usque in inférnum descéndes: quia, si in Sódomis factæ fuíssent virtútes, quæ factæ sunt in te, forte mansíssent usque in hanc diem.'
  "24": Verúmtamen dico vobis, quia terræ Sodomórum remíssius erit in die iudícii, quam tibi.
  "25": 'In illo témpore respóndens Iesus dixit: Confíteor tibi Pater, Dómine cæli et terræ, quia abscondísti hæc a sapiéntibus, et prudéntibus, et revelásti ea párvulis.'
  "26": 'Ita Pater: quóniam sic fuit plácitum ante te.'
  "27": 'Omnia mihi trádita sunt a Patre meo. Et nemo novit Fílium, nisi Pater: neque Patrem quis novit, nisi Fílius, et cui volúerit Fílius reveláre.'
  "28": Veníte ad me omnes, qui laborátis, et oneráti estis, et ego refíciam vos.
  "29": 'Tóllite iugum meum super vos, et díscite a me, quia mitis sum, et húmilis corde: et inveniétis réquiem animábus vestris.'
  "30": Iugum enim meum suáve est, et onus meum leve.
