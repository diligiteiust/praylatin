bible: vulgate
lang: la
language: Latina
book: II Paralipomenon
chapter: "31"
verses:
  "1": 'Cumque hæc fuíssent rite celebráta, egréssus est omnis Israel, qui invéntus fúerat in úrbibus Iuda, et fregérunt simulácra, succiderúntque lucos, demolíti sunt excélsa, et altária destruxérunt, non solum de univérso Iuda et Béniamin, sed et de Ephraim quoque et Manásse, donec pénitus evérterent: reversíque sunt omnes fílii Israel in possessiónes et civitátes suas.'
  "2": Ezechías autem constítuit turmas sacerdotáles, et Levíticas per divisiónes suas, unumquémque in offício próprio, tam sacerdótum vidélicet quam Levitárum, ad holocáusta et pacífica, ut ministrárent et confiteréntur, caneréntque in portis castrórum Dómini.
  "3": Pars autem regis erat, ut de própria eius substántia offerrétur holocáustum, mane semper et véspere, sábbatis quoque, et caléndis, et solemnitátibus céteris, sicut scriptum est in lege Móysi.
  "4": Præcépit étiam pópulo habitántium Ierúsalem, ut darent partes sacerdótibus, et Levítis, ut possent vacáre legi Dómini.
  "5": 'Quod cum percrebruísset in áuribus multitúdinis, plúrimas obtulére primítias fílii Israel fruménti, vini, et ólei, mellis quoque: et ómnium, quæ gignit humus, décimas obtulérunt.'
  "6": 'Sed et fílii Israel et Iuda, qui habitábant in úrbibus Iuda, obtulérunt décimas boum et óvium, decimásque sanctórum, quæ vóverant Dómino Deo suo: atque univérsa portántes, fecérunt acérvos plúrimos.'
  "7": Mense tértio cœpérunt acervórum iacére fundaménta, et mense séptimo complevérunt eos.
  "8": Cumque ingréssi fuíssent Ezechías, et príncipes eius, vidérunt acérvos, et benedixérunt Dómino ac pópulo Israel.
  "9": Interrogavítque Ezechías sacerdótes et Levítas, cur ita iacérent acérvi.
  "10": 'Respóndit illi Azarías sacérdos primus de stirpe Sadoc, dicens: Ex quo cœpérunt offérri primítiæ in domo Dómini, comédimus, et saturáti sumus, et remansérunt plúrima, eo quod benedíxerit Dóminus pópulo suo: reliquárum autem cópia est ista, quam cernis.'
  "11": Præcépit ígitur Ezechías ut præparárent hórrea in domo Dómini. Quod cum fecíssent,
  "12": intulérunt tam primítias, quam décimas, et quæcúmque vóverant, fidéliter. Fuit autem præféctus eórum Chonenías Levíta, et Sémei frater eius, secúndus,
  "13": post quem Iáhiel, et Azarías, et Nahath, et Asael, et Iérimoth, Iózabad quoque, et Eliel, et Iesmachías, et Mahath, et Banaías, præpósiti sub mánibus Choneníæ, et Sémei fratris eius, ex império Ezechíæ regis et Azaríæ pontíficis domus Dei, ad quos ómnia pertinébant.
  "14": Core vero fílius Iemna Levítes, et iánitor orientális portæ, præpósitus erat iis, quæ sponte offerebántur Dómino, primitiísque et consecrátis in Sancta sanctórum.
  "15": 'Et sub cura eius Eden, et Béniamin, Iésue, et Semeías, Amarías quoque, et Sechenías in civitátibus sacerdótum, ut fidéliter distribúerent frátribus suis partes, minóribus atque maióribus:'
  "16": excéptis máribus ab annis tribus et supra, cunctis qui ingrediebántur templum Dómini, et quidquid per síngulos dies conducébat in ministério, atque observatiónibus iuxta divisiónes suas,
  "17": sacerdótibus per famílias, et Levítis a vigésimo anno et supra, per órdines et turmas suas,
  "18": universǽque multitúdini tam uxóribus, quam líberis eórum utriúsque sexus, fidéliter cibi de his, quæ sanctificáta fúerant, præbebántur.
  "19": Sed et filiórum Aaron per agros, et suburbána úrbium singulárum, dispósiti erant viri, qui partes distribúerent univérso séxui masculíno de sacerdótibus, et Levítis.
  "20": 'Fecit ergo Ezechías univérsa quæ díximus in omni Iuda: operatúsque est bonum et rectum, et verum coram Dómino Deo suo,'
  "21": 'in univérsa cultúra ministérii domus Dómini, iuxta legem et cæremónias, volens requírere Deum suum in toto corde suo: fecítque, et prosperátus est.'
