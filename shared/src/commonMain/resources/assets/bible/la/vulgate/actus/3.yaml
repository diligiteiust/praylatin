bible: vulgate
lang: la
language: Latina
book: Actus Apostolorum
chapter: "3"
verses:
  "1": Petrus autem, et Ioánnes ascendébant in templum ad horam oratiónis nonam.
  "2": 'Et quidam vir, qui erat claudus ex útero matris suæ, baiulabátur: quem ponébant quotídie ad portam templi, quæ dícitur Speciósa, ut péteret eleemósynam ab introeúntibus in templum.'
  "3": Is cum vidísset Petrum, et Ioánnem incipiéntes introíre in templum, rogábat ut eleemósynam accíperet.
  "4": 'Intuens autem in eum Petrus cum Ioánne, dixit: Réspice in nos.'
  "5": At ille intendébat in eos, sperans se áliquid acceptúrum ab eis.
  "6": 'Petrus autem dixit: Argéntum et aurum non est mihi: quod autem hábeo, hoc tibi do: in nómine Iesu Christi Nazaréni surge, et ámbula.'
  "7": Et apprehénsa manu eius déxtera, allevávit eum, et prótinus consolidátæ sunt bases eius, et plantæ.
  "8": 'Et exsíliens stetit, et ambulábat: et intrávit cum illis in templum ámbulans, et exsíliens, et laudans Deum.'
  "9": Et vidit omnis pópulus eum ambulántem, et laudántem Deum.
  "10": 'Cognoscébant autem illum, quod ipse erat, qui ad eleemósynam sedébat ad Speciósam portam templi: et impléti sunt stupóre et éxtasi in eo, quod contígerat illi.'
  "11": Cum tenéret autem Petrum, et Ioánnem, cucúrrit omnis pópulus ad eos ad pórticum, quæ appellátur Salomónis, stupéntes.
  "12": 'Videns autem Petrus, respóndit ad pópulum: Viri Israelítæ, quid mirámini in hoc, aut nos quid intuémini, quasi nostra virtúte aut potestáte fecérimus hunc ambuláre?'
  "13": Deus Abraham, et Deus Isaac, et Deus Iacob, Deus patrum nostrórum glorificávit Fílium suum Iesum, quem vos quidem tradidístis, et negástis ante fáciem Piláti, iudicánte illo dimítti.
  "14": 'Vos autem sanctum, et iustum negástis, et petístis virum homicídam donári vobis:'
  "15": auctórem vero vitæ interfecístis, quem Deus suscitávit a mórtuis, cuius nos testes sumus.
  "16": 'Et in fide nóminis eius, hunc, quem vos vidístis, et nostis, confirmávit nomen eius: et fides, quæ per eum est, dedit íntegram sanitátem istam in conspéctu ómnium vestrum.'
  "17": Et nunc fratres scio quia per ignorántiam fecístis, sicut et príncipes vestri.
  "18": Deus autem, quæ prænuntiávit per os ómnium prophetárum, pati Christum suum, sic implévit.
  "19": 'Pœnitémini ígitur, et convertímini, ut deleántur peccáta vestra:'
  "20": ut cum vénerint témpora refrigérii a conspéctu Dómini, et míserit eum, qui prædicátus est vobis, Iesum Christum,
  "21": quem opórtet quidem cælum suscípere usque in témpora restitutiónis ómnium, quæ locútus est Deus per os sanctórum suórum a sǽculo prophetárum.
  "22": 'Móyses quidem dixit: Quóniam prophétam suscitábit vobis Dóminus Deus vester de frátribus vestris, tamquam me: ipsum audiétis iuxta ómnia quæcúmque locútus fúerit vobis.'
  "23": 'Erit autem: omnis ánima, quæ non audíerit prophétam illum, exterminábitur de plebe.'
  "24": Et omnes prophétæ a Sámuel, et deínceps, qui locúti sunt, annuntiavérunt dies istos.
  "25": 'Vos estis fílii prophetárum et testaménti, quod dispósuit Deus ad patres nostros, dicens ad Abraham: Et in sémine tuo benedicéntur omnes famíliæ terræ.'
  "26": 'Vobis primum Deus súscitans Fílium suum, misit eum benedicéntem vobis: ut convértat se unusquísque a nequítia sua.'
