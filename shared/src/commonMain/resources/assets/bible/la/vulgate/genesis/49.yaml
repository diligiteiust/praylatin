bible: vulgate
lang: la
language: Latina
book: Genesis
chapter: "49"
verses:
  "1": 'Vocávit autem Iacob fílios suos, et ait eis: Congregámini, ut annúntiem quæ ventúra sunt vobis in diébus novíssimis.'
  "2": 'Congregámini, et audíte fílii Iacob, audíte Israel patrem vestrum:'
  "3": 'Ruben primogénitus meus, tu fortitúdo mea, et princípium dolóris mei: prior in donis, maior in império.'
  "4": 'Effúsus es sicut aqua, non crescas: quia ascendísti cubíle patris tui, et maculásti stratum eius.'
  "5": 'Símeon et Levi fratres: vasa iniquitátis bellántia.'
  "6": 'In consílium eórum non véniat ánima mea, et in cœtu illórum non sit glória mea: quia in furóre suo occidérunt virum, et in voluntáte sua suffodérunt murum.'
  "7": 'Maledíctus furor eórum, quia pértinax: et indignátio eórum, quia dura: dívidam eos in Iacob, et dispérgam eos in Israel.'
  "8": 'Iuda, te laudábunt fratres tui: manus tua in cervícibus inimicórum tuórum, adorábunt te fílii patris tui.'
  "9": 'Cátulus leónis Iuda: ad prædam fili mi ascendísti: requiéscens accubuísti ut leo, et quasi leǽna: quis suscitábit eum?'
  "10": Non auferétur sceptrum de Iuda, et dux de fémore eius, donec véniat qui mitténdus est, et ipse erit exspectátio géntium.
  "11": Ligans ad víneam pullum suum, et ad vitem, o fili mi, ásinam suam. Lavábit in vino stolam suam, et in sánguine uvæ pállium suum.
  "12": Pulchrióres sunt óculi eius vino, et dentes eius lacte candidióres.
  "13": Zábulon in líttore maris habitábit, et in statióne návium pertíngens usque ad Sidónem.
  "14": Issachar ásinus fortis áccubans inter términos.
  "15": 'Vidit réquiem quod esset bona: et terram quod óptima: et suppósuit húmerum suum ad portándum, factúsque est tribútis sérviens.'
  "16": Dan iudicábit pópulum suum sicut et ália tribus in Israel.
  "17": Fiat Dan cóluber in via, cerástes in sémita, mordens úngulas equi, ut cadat ascénsor eius retro.
  "18": Salutáre tuum exspectábo Dómine.
  "19": 'Gad, accínctus prœliabátur ante eum: et ipse accingétur retrórsum.'
  "20": Aser, pinguis panis eius, et præbébit delícias régibus.
  "21": Néphthali, cervus emíssus, et dans elóquia pulchritúdinis.
  "22": 'Fílius accréscens Ioseph, fílius accréscens et decórus aspéctu: fíliæ discurrérunt super murum.'
  "23": Sed exasperavérunt eum, et iurgáti sunt, inviderúntque illi habéntes iácula.
  "24": 'Sedit in forti arcus eius, et dissolúta sunt víncula brachiórum et mánuum illíus per manus poténtis Iacob: inde pastor egréssus est, lapis Israel.'
  "25": Deus patris tui erit adiútor tuus, et omnípotens benedícet tibi benedictiónibus cæli désuper, benedictiónibus abýssi iacéntis deórsum, benedictiónibus úberum et vulvæ.
  "26": 'Benedictiónes patris tui confortátæ sunt benedictiónibus patrum eius, donec veníret desidérium cóllium æternórum: fiant in cápite Ioseph, et in vértice Nazarǽi inter fratres suos.'
  "27": Béniamin lupus rapax, mane cómedet prædam, et véspere dívidet spólia.
  "28": 'Omnes hi in tríbubus Israel duódecim: hæc locútus est eis pater suus, benedixítque síngulis benedictiónibus própriis.'
  "29": 'Et præcépit eis, dicens: Ego cóngregor ad pópulum meum: sepelíte me cum pátribus meis in spelúnca dúplici quæ est in agro Ephron Hethǽi,'
  "30": contra Mambre in terra Chánaan, quam emit Abraham cum agro ab Ephron Hethǽo in possessiónem sepúlcri.
  "31": 'Ibi sepeliérunt eum, et Saram uxórem eius: ibi sepúltus est Isaac cum Rebécca cóniuge sua: ibi et Lia cóndita iacet.'
  "32": 'Finitísque mandátis quibus fílios instruébat, collégit pedes suos super léctulum, et óbiit: appositúsque est ad pópulum suum.'
