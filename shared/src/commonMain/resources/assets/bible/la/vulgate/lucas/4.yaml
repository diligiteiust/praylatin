bible: vulgate
lang: la
language: Latina
book: Lucas
chapter: "4"
verses:
  "1": 'Iesus autem plenus Spíritu sancto regréssus est a Iordáne: et agebátur a Spíritu in desértum'
  "2": 'diébus quadragínta, et tentabátur a diábolo. Et nihil manducávit in diébus illis: et consummátis illis esúriit.'
  "3": 'Dixit autem illi diábolus: Si Fílius Dei es, dic lápidi huic ut panis fiat.'
  "4": 'Et respóndit ad illum Iesus: Scriptum est: Quia non in solo pane vivit homo, sed in omni verbo Dei.'
  "5": Et duxit illum diábolus in montem excélsum, et osténdit illi ómnia regna orbis terræ in moménto témporis,
  "6": 'et ait illi: Tibi dabo potestátem hanc univérsam, et glóriam illórum: quia mihi trádita sunt, et cui volo do illa.'
  "7": Tu ergo si adoráveris coram me, erunt tua ómnia.
  "8": 'Et respóndens Iesus, dixit illi: Scriptum est: Dóminum Deum tuum adorábis, et illi soli sérvies.'
  "9": 'Et duxit illum in Ierúsalem, et státuit eum super pinnam templi, et dixit illi: Si Fílius Dei es, mitte te hinc deórsum.'
  "10": 'Scriptum est enim quod ángelis suis mandávit de te, ut consérvent te:'
  "11": et quia in mánibus tollent te, ne forte offéndas ad lápidem pedem tuum.
  "12": 'Et respóndens Iesus, ait illi: Dictum est: Non tentábis Dóminum Deum tuum.'
  "13": Et consummáta omni tentatióne, diábolus recéssit ab illo, usque ad tempus.
  "14": Et regréssus est Iesus in virtúte Spíritus in Galilǽam, et fama éxiit per univérsam regiónem de illo.
  "15": Et ipse docébat in synagógis eórum, et magnificabátur ab ómnibus.
  "16": Et venit Názareth, ubi erat nutrítus, et intrávit secúndum consuetúdinem suam die sábbati in synagógam, et surréxit légere.
  "17": 'Et tráditus est illi liber Isaíæ prophétæ. Et ut revólvit librum, invénit locum ubi scriptum erat:'
  "18": 'Spíritus Dómini super me: propter quod unxit me, evangelizáre paupéribus misit me, sanáre contrítos corde,'
  "19": prædicáre captívis remissiónem, et cæcis visum, dimíttere confráctos in remissiónem, prædicáre annum Dómini accéptum, et diem retributiónis.
  "20": Et cum plicuísset librum, réddidit minístro, et sedit. Et ómnium in synagóga óculi erant intendéntes in eum.
  "21": 'Cœpit autem dícere ad illos: Quia hódie impléta est hæc scriptúra in áuribus vestris.'
  "22": 'Et omnes testimónium illi dabant: et mirabántur in verbis grátiæ, quæ procedébant de ore ipsíus, et dicébant: Nonne hic est fílius Ioseph?'
  "23": 'Et ait illis: Utique dicétis mihi hanc similitúdinem: Médice cura teípsum: quanta audívimus facta in Caphárnaum, fac et hic in pátria tua.'
  "24": 'Ait autem: Amen dico vobis, quia nemo prophéta accéptus est in pátria sua.'
  "25": 'In veritáte dico vobis, multæ víduæ erant in diébus Elíæ in Israel, quando clausum est cælum annis tribus, et ménsibus sex, cum facta esset fames magna in omni terra:'
  "26": et ad nullam illárum missus est Elías, nisi in Sarépta Sidóniæ, ad mulíerem víduam.
  "27": 'Et multi leprósi erant in Israel sub Eliséo prophéta: et nemo eórum mundátus est nisi Náaman Syrus.'
  "28": Et repléti sunt omnes in synagóga ira, hæc audiéntes.
  "29": 'Et surrexérunt, et eiecérunt illum extra civitátem: et duxérunt illum usque ad supercílium montis, super quem cívitas illórum erat ædificáta, ut præcipitárent eum.'
  "30": Ipse autem tránsiens per médium illórum, ibat.
  "31": Et descéndit in Caphárnaum civitátem Galilǽæ, ibíque docébat illos sábbatis.
  "32": Et stupébant in doctrína eius, quia in potestáte erat sermo ipsíus.
  "33": Et in synagóga erat homo habens dæmónium immúndum, et exclamávit voce magna,
  "34": 'dicens: Sine, quid nobis et tibi, Iesu Nazaréne? venísti pérdere nos? scio te quis sis, Sanctus Dei.'
  "35": 'Et increpávit illum Iesus, dicens: Obmutésce, et exi ab eo. Et cum proiecísset illum dæmónium in médium, éxiit ab illo, nihílque illum nócuit.'
  "36": 'Et factus est pavor in ómnibus, et colloquebántur ad ínvicem, dicéntes: Quod est hoc verbum, quia in potestáte et virtúte ímperat immúndis spirítibus, et éxeunt?'
  "37": Et divulgabátur fama de illo in omnem locum regiónis.
  "38": 'Surgens autem Iesus de synagóga, introívit in domum Simónis. Socrus autem Simónis tenebátur magnis fébribus: et rogavérunt illum pro ea.'
  "39": 'Et stans super illam imperávit febri: et dimísit illam. Et contínuo surgens, ministrábat illis.'
  "40": 'Cum autem sol occidísset: omnes, qui habébant infírmos váriis languóribus, ducébant illos ad eum. At ille síngulis manus impónens, curábat eos.'
  "41": 'Exíbant autem dæmónia a multis clamántia, et dicéntia: Quia tu es Fílius Dei: et íncrepans non sinébat ea loqui: quia sciébant ipsum esse Christum.'
  "42": 'Facta autem die egréssus ibat in desértum locum, et turbæ requirébant eum, et venérunt usque ad ipsum: et detinébant illum ne discéderet ab eis.'
  "43": 'Quibus ille ait: Quia et áliis civitátibus opórtet me evangelizáre regnum Dei: quia ídeo missus sum.'
  "44": Et erat prǽdicans in synagógis Galilǽæ.
