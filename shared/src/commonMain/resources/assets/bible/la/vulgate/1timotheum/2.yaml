bible: vulgate
lang: la
language: Latina
book: ad Timotheum I
chapter: "2"
verses:
  "1": 'Obsecro ígitur primum ómnium fíeri obsecratiónes, oratiónes, postulatiónes, gratiárum actiónes, pro ómnibus homínibus:'
  "2": 'pro régibus, et ómnibus, qui in sublimitáte sunt, ut quiétam, et tranquíllam vitam agámus in omni pietáte, et castitáte:'
  "3": hoc enim bonum est, et accéptum coram Salvatóre nostro Deo,
  "4": qui omnes hómines vult salvos fíeri, et ad agnitiónem veritátis veníre.
  "5": 'Unus enim Deus, unus et mediátor Dei et hóminum homo Christus Iesus:'
  "6": 'qui dedit redemptiónem semetípsum pro ómnibus, testimónium tempóribus suis:'
  "7": in quo pósitus sum ego prædicátor, et Apóstolus (veritátem dico, non méntior) doctor géntium in fide, et veritáte.
  "8": Volo ergo viros oráre in omni loco, levántes puras manus sine ira, et disceptatióne.
  "9": 'Simíliter et mulíeres in hábitu ornáto, cum verecúndia, et sobrietáte ornántes se, et non in tortis crínibus, aut auro, aut margarítis, vel veste pretiósa:'
  "10": sed quod decet mulíeres, promitténtes pietátem per ópera bona.
  "11": Múlier in siléntio discat cum omni subiectióne.
  "12": 'Docére autem mulíeri non permítto, neque dominári in virum: sed esse in siléntio.'
  "13": 'Adam enim primus formátus est: deínde Heva.'
  "14": 'Et Adam non est sedúctus: múlier autem sedúcta in prævaricatióne fuit.'
  "15": Salvábitur autem per filiórum generatiónem, si permánserit in fide, et dilectióne, et sanctificatióne cum sobrietáte.
