bible: vulgate
lang: la
language: Latina
book: Ezechiel
chapter: "45"
verses:
  "1": 'Cumque cœpéritis terram divídere sortíto, separáte primítias Dómino, sanctificátum de terra, longitúdine vigínti quinque míllia, et latitúdine decem míllia: sanctificátum erit in omni término eius per circúitum.'
  "2": Et erit ex omni parte sanctificátum quingéntos per quingéntos, quadrifáriam per circúitum, et quinquagínta cúbitis in suburbána eius per gyrum.
  "3": Et a mensúra ista mensurábis longitúdinem vigínti quinque míllium, et latitúdinem decem míllium, et in ipso erit templum, sanctúmque sanctórum.
  "4": 'Sanctificátum de terra erit sacerdótibus minístris sanctuárii, qui accédunt ad ministérium Dómini: et erit eis locus in domos, et in sanctuárium sanctitátis.'
  "5": 'Vigínti quinque autem míllia longitúdinis, et decem míllia latitúdinis erunt Levítis, qui minístrant dómui: ipsi possidébunt vigínti gazophylácia.'
  "6": Et possessiónem civitátis dábitis quinque míllia latitúdinis, et longitúdinis vigínti quinque míllia, secúndum separatiónem sanctuárii, omni dómui Israel.
  "7": 'Príncipi quoque hinc et inde in separatiónem sanctuárii, et in possessiónem civitátis, contra fáciem separatiónis sanctuárii, et contra fáciem possessiónis urbis, a látere maris usque ad mare, et a látere oriéntis usque ad oriéntem: longitúdinis autem iuxta unamquámque partem, a término occidentáli usque ad términum orientálem.'
  "8": 'De terra erit ei posséssio in Israel, et non depopulabúntur ultra príncipes pópulum meum: sed terram dabunt dómui Israel secúndum tribus eórum.'
  "9": 'Hæc dicit Dóminus Deus: Suffíciat vobis príncipes Israel: iniquitátem et rapínas intermíttite, et iudícium et iustítiam fácite, separáte confínia vestra a pópulo meo, ait Dóminus Deus.'
  "10": Statéra iusta, et ephi iustum, et batus iustus erit vobis.
  "11": 'Ephi, et batus æquália, et uníus mensúræ erunt: ut cápiat décimam partem cori batus, et décimam partem cori ephi: iuxta mensúram cori erit æqua librátio eórum.'
  "12": 'Siclus autem vigínti óbolos habet: porro vigínti sicli, et vigínti quinque sicli, et quíndecim sicli, mnam fáciunt.'
  "13": 'Et hæ sunt primítiæ, quas tollétis: sextam partem ephi de coro fruménti, et sextam partem ephi de coro hórdei.'
  "14": 'Mensúra quoque ólei, batus ólei, décima pars cori est: et decem bati corum fáciunt, quia decem bati implent corum.'
  "15": Et aríetem unum de grege ducentórum de his, quæ nútriunt Israel, in sacrifícium, et in holocáustum, et in pacífica, ad expiándum pro eis, ait Dóminus Deus.
  "16": Omnis pópulus terræ tenébitur primítiis his príncipi in Israel.
  "17": 'Et super príncipem erunt holocáusta, et sacrifícium, et libámina, in solemnitátibus, et in caléndis, et in sábbatis, et in univérsis solemnitátibus domus Israel: ipse fáciet pro peccáto sacrifícium, et holocáustum, et pacífica, ad expiándum pro domo Israel.'
  "18": 'Hæc dicit Dóminus Deus: In primo mense, una mensis, sumes vítulum de arménto immaculátum, et expiábis sanctuárium.'
  "19": 'Et tollet sacérdos de sánguine quod erit pro peccáto: et ponet in póstibus domus, et in quátuor ángulis crepídinis altáris, et in póstibus portæ átrii interióris.'
  "20": Et sic fácies in séptima mensis pro unoquóque, qui ignorávit, et erróre decéptus est, et expiábis pro domo.
  "21": 'In primo mense, quartadécima die mensis, erit vobis Paschæ solémnitas: septem diébus ázyma comedéntur.'
  "22": Et fáciet princeps in die illa, pro se et pro univérso pópulo terræ, vítulum pro peccáto.
  "23": 'Et in septem diérum solemnitáte fáciet holocáustum Dómino, septem vítulos et septem aríetes immaculátos, quotídie septem diébus: et pro peccáto hircum caprárum quotídie.'
  "24": 'Et sacrifícium ephi per vítulum, et ephi per aríetem fáciet: et ólei hin per síngula ephi.'
  "25": 'Séptimo mense, quintadécima die mensis, in solemnitáte fáciet sicut supra dicta sunt per septem dies: tam pro peccáto, quam pro holocáusto, et in sacrifício, et in óleo.'
