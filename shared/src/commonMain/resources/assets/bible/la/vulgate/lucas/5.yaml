bible: vulgate
lang: la
language: Latina
book: Lucas
chapter: "5"
verses:
  "1": Factum est autem, cum turbæ irrúerent in eum, ut audírent verbum Dei, et ipse stabat secus stagnum Genésareth.
  "2": 'Et vidit duas naves stantes secus stagnum: piscatóres autem descénderant, et lavábant rétia.'
  "3": Ascéndens autem in unam navim, quæ erat Simónis, rogávit eum a terra redúcere pusíllum. Et sedens docébat de navícula turbas.
  "4": 'Ut cessávit autem loqui, dixit ad Simónem: Duc in altum, et laxáte rétia vestra in captúram.'
  "5": 'Et respóndens Simon, dixit illi: Præcéptor, per totam noctem laborántes nihil cépimus: in verbo autem tuo laxábo rete.'
  "6": 'Et cum hoc fecíssent, conclusérunt píscium multitúdinem copiósam: rumpebátur autem rete eórum.'
  "7": Et annuérunt sóciis, qui erant in ália navi, ut venírent, et adiuvárent eos. Et venérunt, et implevérunt ambas navículas, ita ut pene mergeréntur.
  "8": 'Quod cum vidéret Simon Petrus, prócidit ad génua Iesu, dicens: Exi a me, quia homo peccátor sum, Dómine.'
  "9": 'Stupor enim circumdéderat eum, et omnes, qui cum illo erant, in captúra píscium, quam céperant:'
  "10": 'simíliter autem Iacóbum, et Ioánnem, fílios Zebedǽi, qui erant sócii Simónis. Et ait ad Simónem Iesus: Noli timére: ex hoc iam hómines eris cápiens.'
  "11": Et subdúctis ad terram návibus, relíctis ómnibus, secúti sunt eum.
  "12": 'Et factum est, cum esset in una civitátum, et ecce vir plenus lepra, et videns Iesum, et prócidens in fáciem, rogávit eum, dicens: Dómine, si vis, potes me mundáre.'
  "13": 'Et exténdens manum, tétigit eum, dicens: Volo: mundáre. Et conféstim lepra discéssit ab illo.'
  "14": 'Et ipse præcépit illi ut némini díceret: sed, Vade, osténde te sacerdóti, et offer pro emundatióne tua, sicut præcépit Móyses, in testimónium illis.'
  "15": 'Perambulábat autem magis sermo de illo: et conveniébant turbæ multæ ut audírent, et curaréntur ab infirmitátibus suis.'
  "16": Ipse autem secedébat in desértum, et orábat.
  "17": 'Et factum est in una diérum, et ipse sedébat docens. Et erant Pharisǽi sedéntes, et legis doctóres, qui vénerant ex omni castéllo Galilǽæ, et Iudǽæ, et Ierúsalem: et virtus Dómini erat ad sanándum eos.'
  "18": 'Et ecce viri portántes in lecto hóminem, qui erat paralýticus: et quærébant eum inférre, et pónere ante eum.'
  "19": Et non inveniéntes qua parte illum inférrent præ turba, ascendérunt supra tectum, et per tégulas summisérunt eum cum lecto in médium ante Iesum.
  "20": 'Quorum fidem ut vidit, dixit: Homo, remittúntur tibi peccáta tua.'
  "21": 'Et cœpérunt cogitáre scribæ, et Pharisǽi, dicéntes: Quis est hic, qui lóquitur blasphémias? quis potest dimíttere peccáta, nisi solus Deus?'
  "22": 'Ut cognóvit autem Iesus cogitatiónes eórum, respóndens, dixit ad illos: Quid cogitátis in córdibus vestris?'
  "23": 'Quid est facílius dícere: Dimittúntur tibi peccáta: an dícere: Surge, et ámbula?'
  "24": Ut autem sciátis quia Fílius hóminis habet potestátem in terra dimitténdi peccáta, (ait paralýtico) tibi dico, surge, tolle lectum tuum, et vade in domum tuam.
  "25": 'Et conféstim consúrgens coram illis, tulit lectum, in quo iacébat: et ábiit in domum suam, magníficans Deum.'
  "26": 'Et stupor apprehéndit omnes, et magnificábant Deum. Et repléti sunt timóre, dicéntes: Quia vídimus mirabília hódie.'
  "27": 'Et post hæc éxiit, et vidit publicánum nómine Levi, sedéntem ad telónium, et ait illi: Séquere me.'
  "28": Et relíctis ómnibus, surgens secútus est eum.
  "29": 'Et fecit ei convívium magnum Levi in domo sua: et erat turba multa publicanórum, et aliórum, qui cum illis erant discumbéntes.'
  "30": 'Et murmurábant Pharisǽi, et scribæ eórum, dicéntes ad discípulos eius: Quare cum publicánis, et peccatóribus manducátis, et bíbitis?'
  "31": 'Et respóndens Iesus, dixit ad illos: Non egent qui sani sunt médico, sed qui male habent.'
  "32": Non veni vocáre iustos, sed peccatóres ad pœniténtiam.
  "33": 'At illi dixérunt ad eum: Quare discípuli Ioánnis ieiúnant frequénter, et obsecratiónes fáciunt, simíliter et Pharisæórum: tui autem edunt, et bibunt?'
  "34": 'Quibus ipse ait: Numquid potéstis fílios sponsi, dum cum illis est sponsus, fácere ieiunáre?'
  "35": 'Vénient autem dies, cum ablátus fúerit ab illis sponsus: tunc ieiunábunt in illis diébus.'
  "36": 'Dicébat autem et similitúdinem ad illos: Quia nemo commissúram a novo vestiménto immíttit in vestiméntum vetus: alióquin et novum rumpit, et véteri non cónvenit commissúra a novo.'
  "37": 'Et nemo mittit vinum novum in utres véteres: alióquin rumpet vinum novum utres, et ipsum effundétur, et utres períbunt:'
  "38": sed vinum novum in utres novos mitténdum est, et útraque conservántur.
  "39": 'Et nemo bibens vetus, statim vult novum: dicit enim: Vetus mélius est.'
