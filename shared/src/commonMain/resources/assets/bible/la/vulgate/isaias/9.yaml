bible: vulgate
lang: la
language: Latina
book: Isaias
chapter: "9"
verses:
  "1": 'Primo témpore alleviáta est terra Zábulon et terra Néphthali: et novíssimo aggraváta est via maris trans Iordánem Galilǽæ géntium.'
  "2": 'Pópulus, qui ambulábat in ténebris, vidit lucem magnam: habitántibus in regióne umbræ mortis, lux orta est eis.'
  "3": 'Multiplicásti gentem, et non magnificásti lætítiam. Lætabúntur coram te, sicut qui lætántur in messe: sicut exsúltant victóres capta præda, quando dívidunt spólia.'
  "4": Iugum enim óneris eius, et virgam húmeri eius, et sceptrum exactóris eius superásti sicut in die Mádian.
  "5": Quia omnis violénta prædátio cum tumúltu, et vestiméntum mistum sánguine, erit in combustiónem, et cibus ignis.
  "6": 'Párvulus enim natus est nobis, et fílius datus est nobis, et factus est principátus super húmerum eius: et vocábitur nomen eius, Admirábilis, Consiliárius, Deus, Fortis, Pater futúri sǽculi, Princeps pacis.'
  "7": 'Multiplicábitur eius impérium, et pacis non erit finis: super sólium David, et super regnum eius sedébit, ut confírmet illud et corróboret in iudício et iustítia, ámodo et usque in sempitérnum: zelus Dómini exercítuum fáciet hoc.'
  "8": Verbum misit Dóminus in Iacob, et cécidit in Israel.
  "9": 'Et sciet omnis pópulus Ephraim, et habitántes Samaríam, in supérbia et magnitúdine cordis dicéntes:'
  "10": 'Láteres cecidérunt, sed quadris lapídibus ædificábimus: sycómoros succidérunt, sed cedros immutábimus.'
  "11": Et elevábit Dóminus hostes Rasin super eum, et inimícos eius in tumúltum vertet.
  "12": 'Sýriam ab oriénte, et Philísthiim ab occidénte: et devorábunt Israel toto ore. In ómnibus his non est avérsus furor eius, sed adhuc manus eius exténta.'
  "13": Et pópulus non est revérsus ad percutiéntem se, et Dóminum exercítuum non inquisiérunt.
  "14": Et dispérdet Dóminus ab Israel caput et caudam, incurvántem et refrenántem die una.
  "15": 'Longǽvus et honorábilis, ipse est caput: et prophéta docens mendácium, ipse est cauda.'
  "16": 'Et erunt, qui beatíficant pópulum istum, seducéntes: et qui beatificántur, præcipitáti.'
  "17": 'Propter hoc super adolescéntulis eius non lætábitur Dóminus, et pupillórum eius et viduárum non miserébitur: quia omnis hypócrita est et nequam, et univérsum os locútum est stultítiam. In ómnibus his non est avérsus furor eius, sed adhuc manus eius exténta.'
  "18": 'Succénsa est enim quasi ignis impíetas: veprem et spinam vorábit, et succendétur in densitáte saltus, et convolvétur supérbia fumi.'
  "19": 'In ira Dómini exercítuum conturbáta est terra, et erit pópulus quasi esca ignis: vir fratri suo non parcet.'
  "20": 'Et declinábit ad déxteram, et esúriet: et cómedet ad sinístram, et non saturábitur: unusquísque carnem bráchii sui vorábit: Manásses Ephraim, et Ephraim Manássen: simul ipsi contra Iudam.'
  "21": In ómnibus his non est avérsus furor eius, sed adhuc manus eius exténta.
