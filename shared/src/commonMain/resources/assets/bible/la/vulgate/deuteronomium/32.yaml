bible: vulgate
lang: la
language: Latina
book: Deuteronomium
chapter: "32"
verses:
  "1": Audíte cæli quæ loquor, áudiat terra verba oris mei.
  "2": Concréscat ut plúvia doctrína mea, fluat ut ros elóquium meum, quasi imber super herbam, et quasi stillæ super grámina.
  "3": 'Quia nomen Dómini invocábo: date magnificéntiam Deo nostro.'
  "4": 'Dei perfécta sunt ópera, et omnes viæ eius iudícia: Deus fidélis, et absque ulla iniquitáte, iustus et rectus.'
  "5": 'Peccavérunt ei, et non fílii eius in sórdibus: generátio prava atque pervérsa.'
  "6": Hǽccine reddis Dómino, pópule stulte et insípiens? numquid non ipse est pater tuus, qui possédit te, et fecit, et creávit te?
  "7": 'Meménto diérum antiquórum, cógita generatiónes síngulas: intérroga patrem tuum, et annuntiábit tibi: maióres tuos, et dicent tibi.'
  "8": 'Quando dividébat Altíssimus gentes: quando separábat fílios Adam, constítuit términos populórum iuxta númerum filiórum Israel.'
  "9": 'Pars autem Dómini, pópulus eius: Iacob funículus hereditátis eius.'
  "10": 'Invénit eum in terra desérta, in loco horróris, et vastæ solitúdinis: circumdúxit eum, et dócuit: et custodívit quasi pupíllam óculi sui.'
  "11": Sicut áquila próvocans ad volándum pullos suos, et super eos vólitans, expándit alas suas, et assúmpsit eum, atque portávit in húmeris suis.
  "12": 'Dóminus solus dux eius fuit: et non erat cum eo deus aliénus.'
  "13": 'Constítuit eum super excélsam terram: ut coméderet fructus agrórum, ut súgeret mel de petra, oleúmque de saxo duríssimo.'
  "14": 'Butýrum de arménto, et lac de óvibus cum ádipe agnórum, et aríetum filiórum Basan: et hircos cum medúlla trítici, et sánguinem uvæ bíberet meracíssimum.'
  "15": 'Incrassátus est diléctus, et recalcitrávit: incrassátus, impinguátus, dilatátus, derelíquit Deum factórem suum, et recéssit a Deo salutári suo.'
  "16": Provocavérunt eum in diis aliénis, et in abominatiónibus ad iracúndiam concitavérunt.
  "17": 'Immolavérunt dæmóniis, et non Deo, diis, quos ignorábant: novi recentésque venérunt, quos non coluérunt patres eórum.'
  "18": Deum, qui te génuit dereliquísti, et oblítus es Dómini creatóris tui.
  "19": 'Vidit Dóminus, et ad iracúndiam concitátus est: quia provocavérunt eum fílii sui et fíliæ.'
  "20": 'Et ait: Abscóndam fáciem meam ab eis, et considerábo novíssima eórum: generátio enim pervérsa est, et infidéles fílii.'
  "21": 'Ipsi me provocavérunt in eo, qui non erat Deus, et irritavérunt in vanitátibus suis: et ego provocábo eos in eo, qui non est pópulus, et in gente stulta irritábo illos.'
  "22": 'Ignis succénsus est in furóre meo, et ardébit usque ad inférni novíssima: devorabítque terram cum gérmine suo, et móntium fundaménta combúret.'
  "23": Congregábo super eos mala, et sagíttas meas complébo in eis.
  "24": 'Consuméntur fame, et devorábunt eos aves morsu amaríssimo: dentes bestiárum immíttam in eos, cum furóre trahéntium super terram, atque serpéntium.'
  "25": Foris vastábit eos gládius, et intus pavor, iúvenem simul ac vírginem, lacténtem cum hómine sene.
  "26": 'Dixi: Ubinam sunt? cessáre fáciam ex homínibus memóriam eórum.'
  "27": 'Sed propter iram inimicórum dístuli: ne forte superbírent hostes eórum, et dícerent: Manus nostra excélsa, et non Dóminus, fecit hæc ómnia.'
  "28": Gens absque consílio est, et sine prudéntia.
  "29": Utinam sáperent, et intellígerent, ac novíssima providérent.
  "30": Quómodo persequátur unus mille, et duo fugent decem míllia? nonne ídeo, quia Deus suus véndidit eos, et Dóminus conclúsit illos?
  "31": 'Non enim est Deus noster ut dii eórum: et inimíci nostri sunt iúdices.'
  "32": 'De vínea Sodomórum, vínea eórum, et de suburbánis Gomórrhæ: uva eórum, uva fellis, et botri amaríssimi.'
  "33": Fel dracónum vinum eórum, et venénum áspidum insanábile.
  "34": Nonne hæc cóndita sunt apud me, et signáta in thesáuris meis?
  "35": 'Mea est últio, et ego retríbuam in témpore, ut labátur pes eórum: iuxta est dies perditiónis, et adésse festínant témpora.'
  "36": 'Iudicábit Dóminus pópulum suum, et in servis suis miserébitur: vidébit quod infirmáta sit manus, et clausi quoque defecérunt, residuíque consúmpti sunt.'
  "37": 'Et dicet: Ubi sunt dii eórum, in quibus habébant fidúciam?'
  "38": 'de quorum víctimis comedébant ádipes, et bibébant vinum libáminum: surgant, et opituléntur vobis, et in necessitáte vos prótegant.'
  "39": 'Vidéte quod ego sim solus, et non sit álius Deus præter me: ego occídam, et ego vívere fáciam: percútiam, et ego sanábo, et non est qui de manu mea possit erúere.'
  "40": 'Levábo ad cælum manum meam, et dicam: Vivo ego in ætérnum.'
  "41": 'Si acúero ut fulgur gládium meum, et arripúerit iudícium manus mea: reddam ultiónem hóstibus meis, et his qui odérunt me retríbuam.'
  "42": 'Inebriábo sagíttas meas sánguine, et gládius meus devorábit carnes: de cruóre occisórum et de captivitáte, nudáti inimicórum cápitis.'
  "43": 'Laudáte gentes pópulum eius, quia sánguinem servórum suórum ulciscétur: et vindíctam retríbuet in hostes eórum, et propítius erit terræ pópuli sui.'
  "44": Venit ergo Móyses, et locútus est ómnia verba cántici huius in áuribus pópuli, ipse et Iósue fílius Nun.
  "45": Complevítque omnes sermónes istos, loquens ad univérsum Israel.
  "46": 'Et dixit ad eos: Pónite corda vestra in ómnia verba, quæ ego testíficor vobis hódie: ut mandétis ea fíliis vestris custodíre et fácere, et implére univérsa quæ scripta sunt legis huius:'
  "47": 'quia non incássum præcépta sunt vobis, sed ut sínguli in eis víverent: quæ faciéntes longo perseverétis témpore in terra, ad quam, Iordáne transmísso, ingredímini possidéndam.'
  "48": 'Locutúsque est Dóminus ad Móysen in eádem die, dicens:'
  "49": 'Ascénde in montem istum Abarim, id est, transítuum, in montem Nebo, qui est in terra Moab contra Iéricho: et vide terram Chánaan, quam ego tradam fíliis Israel obtinéndam, et mórere in monte.'
  "50": 'Quem conscéndens iungéris pópulis tuis, sicut mórtuus est Aaron frater tuus in monte Hor, et appósitus pópulis suis:'
  "51": 'quia prævaricáti estis contra me in médio filiórum Israel ad Aquas contradictiónis in Cades desérti Sin: et non sanctificástis me inter fílios Israel.'
  "52": Ecóntra vidébis terram, et non ingrediéris in eam, quam ego dabo fíliis Israel.
