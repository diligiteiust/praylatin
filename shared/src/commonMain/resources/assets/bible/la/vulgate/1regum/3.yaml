bible: vulgate
lang: la
language: Latina
book: I Regum
chapter: "3"
verses:
  "1": 'Confirmátum est ígitur regnum in manu Salomónis, et affinitáte coniúnctus est Pharaóni regi Ægýpti: accépit namque fíliam eius, et addúxit in civitátem David, donec compléret ædíficans domum suam, et domum Dómini, et murum Ierúsalem per circúitum.'
  "2": 'Attamen pópulus immolábat in excélsis: non enim ædificátum erat templum nómini Dómini usque in diem illum.'
  "3": Diléxit autem Sálomon Dóminum, ámbulans in præcéptis David patris sui, excépto quod in excélsis immolábat, et accendébat thymiáma.
  "4": 'Abiit ítaque in Gábaon, ut immoláret ibi: illud quippe erat excélsum máximum: mille hóstias in holocáustum óbtulit Sálomon super altáre illud in Gábaon.'
  "5": 'Appáruit autem Dóminus Salomóni per sómnium nocte, dicens: Póstula quod vis ut dem tibi.'
  "6": 'Et ait Sálomon: Tu fecísti cum servo tuo David patre meo misericórdiam magnam, sicut ambulávit in conspéctu tuo in veritáte, et iustítia, et recto corde tecum: custodísti ei misericórdiam tuam grandem, et dedísti ei fílium sedéntem super thronum eius, sicut est hódie.'
  "7": 'Et nunc Dómine Deus, tu regnáre fecísti servum tuum pro David patre meo: ego autem sum puer párvulus, et ignórans egréssum, et intróitum meum.'
  "8": Et servus tuus in médio est pópuli, quem elegísti, pópuli infiníti, qui numerári et supputári non potest præ multitúdine.
  "9": Dabis ergo servo tuo cor dócile, ut pópulum tuum iudicáre possit, et discérnere inter bonum et malum. Quis enim póterit iudicáre pópulum istum, pópulum tuum hunc multum?
  "10": Plácuit ergo sermo coram Dómino, quod Sálomon postulásset huiuscémodi rem.
  "11": 'Et dixit Dóminus Salomóni: Quia postulásti verbum hoc, et non petísti tibi dies multos, nec divítias, aut ánimas inimicórum tuórum, sed postulásti tibi sapiéntiam ad discernéndum iudícium:'
  "12": ecce feci tibi secúndum sermónes tuos, et dedi tibi cor sápiens et intélligens, in tantum ut nullus ante te símilis tui fúerit, nec post te surrectúrus sit.
  "13": 'Sed et hæc, quæ non postulásti, dedi tibi: divítias scílicet, et glóriam, ut nemo fúerit símilis tui in régibus cunctis retro diébus.'
  "14": Si autem ambuláveris in viis meis, et custodíeris præcépta mea et mandáta mea, sicut ambulávit pater tuus, longos fáciam dies tuos.
  "15": 'Igitur evigilávit Sálomon, et intelléxit quod esset sómnium: cumque venísset Ierúsalem, stetit coram arca fœ́deris Dómini, et óbtulit holocáusta, et fecit víctimas pacíficas, et grande convívium univérsis fámulis suis.'
  "16": Tunc venérunt duæ mulíeres meretríces ad regem, steterúntque coram eo,
  "17": 'quarum una ait: Obsecro, mi dómine: ego et múlier hæc habitabámus in domo una, et péperi apud eam in cubículo.'
  "18": 'Tértia autem die postquam ego péperi, péperit et hæc: et erámus simul, nullúsque álius nobíscum in domo, excéptis nobis duábus.'
  "19": 'Mórtuus est autem fílius mulíeris huius nocte: dórmiens quippe oppréssit eum.'
  "20": 'Et consúrgens intempéstæ noctis siléntio, tulit fílium meum de látere meo, ancíllæ tuæ dormiéntis, et collocávit in sinu suo: suum autem fílium, qui erat mórtuus, pósuit in sinu meo.'
  "21": 'Cumque surrexíssem mane ut darem lac fílio meo, appáruit mórtuus: quem diligéntius íntuens clara luce, deprehéndi non esse meum quem genúeram.'
  "22": 'Respondítque áltera múlier: Non est ita ut dicis, sed fílius tuus mórtuus est, meus autem vivit. E contrário illa dicébat: Mentíris: fílius quippe meus vivit, et fílius tuus mórtuus est. Atque in hunc modum contendébant coram rege.'
  "23": 'Tunc rex ait: Hæc dicit: Fílius meus vivit, et fílius tuus mórtuus est: et ista respóndit: Non, sed fílius tuus mórtuus est, meus autem vivit.'
  "24": 'Dixit ergo rex: Afférte mihi gládium. Cumque attulíssent gládium coram rege,'
  "25": Divídite, inquit, infántem vivum in duas partes, et date dimídiam partem uni, et dimídiam partem álteri.
  "26": 'Dixit autem múlier, cuius fílius erat vivus, ad regem (commóta sunt quippe víscera eius super fílio suo): Obsecro dómine, date illi infántem vivum, et nolíte interfícere eum. E contrário illa dicébat: Nec mihi, nec tibi sit, sed dividátur.'
  "27": 'Respóndit rex, et ait: Date huic infántem vivum, et non occidátur: hæc est enim mater eius.'
  "28": Audívit ítaque omnis Israel iudícium quod iudicásset rex, et timuérunt regem, vidéntes sapiéntiam Dei esse in eo ad faciéndum iudícium.
