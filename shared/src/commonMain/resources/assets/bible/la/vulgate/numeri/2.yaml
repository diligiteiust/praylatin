bible: vulgate
lang: la
language: Latina
book: Numeri
chapter: "2"
verses:
  "1": 'Locutúsque est Dóminus ad Móysen et Aaron, dicens:'
  "2": Sínguli per turmas, signa, atque vexílla, et domos cognatiónum suárum, castrametabúntur fílii Israel, per gyrum tabernáculi fœ́deris.
  "3": 'Ad oriéntem Iudas figet tentória per turmas exércitus sui: erítque princeps filiórum eius Nahásson fílius Amínadab.'
  "4": Et omnis de stirpe eius summa pugnántium, septuagínta quátuor míllia sexcénti.
  "5": Iuxta eum castrametáti sunt de tribu Issachar, quorum princeps fuit Nathánael fílius Suar.
  "6": Et omnis númerus pugnatórum eius quinquagínta quátuor míllia quadringénti.
  "7": In tribu Zábulon princeps fuit Eliab fílius Helon.
  "8": Omnis de stirpe eius exércitus pugnatórum, quinquagínta septem míllia quadringénti.
  "9": 'Univérsi qui in castris Iudæ enumeráti sunt, fuérunt centum octogínta sex míllia quadringénti: et per turmas suas primi egrediéntur.'
  "10": In castris filiórum Ruben ad meridiánam plagam erit princeps Elisur fílius Sédeur.
  "11": Et cunctus exércitus pugnatórum eius qui numeráti sunt, quadragínta sex míllia quingénti.
  "12": 'Iuxta eum castrametáti sunt de tribu Símeon: quorum princeps fuit Salámiel fílius Surisáddai.'
  "13": Et cunctus exércitus pugnatórum eius qui numeráti sunt, quinquagínta novem míllia trecénti.
  "14": In tribu Gad princeps fuit Elíasaph fílius Duel.
  "15": Et cunctus exércitus pugnatórum eius, qui numeráti sunt, quadragínta quinque míllia sexcénti quinquagínta.
  "16": 'Omnes qui recensíti sunt in castris Ruben, centum quinquagínta míllia et mille quadringénti quinquagínta per turmas suas: in secúndo loco proficiscéntur.'
  "17": 'Levábitur autem tabernáculum testimónii per offícia Levitárum, et turmas eórum: quómodo erigétur, ita et deponétur. Sínguli per loca et órdines suos proficiscéntur.'
  "18": Ad occidentálem plagam erunt castra filiórum Ephraim, quorum princeps fuit Elísama fílius Ammiud.
  "19": Cunctus exércitus pugnatórum eius, qui numeráti sunt, quadragínta míllia quingénti.
  "20": Et cum eis tribus filiórum Manásse, quorum princeps fuit Gamáliel fílius Phadássur.
  "21": Cunctúsque exércitus pugnatórum eius, qui numeráti sunt, trigínta duo míllia ducénti.
  "22": In tribu filiórum Béniamin princeps fuit Abidan fílius Gedeónis.
  "23": Et cunctus exércitus pugnatórum eius, qui recensíti sunt, trigínta quinque míllia quadringénti.
  "24": 'Omnes qui numeráti sunt in castris Ephraim, centum octo míllia centum per turmas suas: tértii proficiscéntur.'
  "25": 'Ad aquilónis partem castrametáti sunt fílii Dan: quorum princeps fuit Ahiézer fílius Ammisáddai.'
  "26": Cunctus exércitus pugnatórum eius, qui numeráti sunt, sexagínta duo míllia septingénti.
  "27": 'Iuxta eum fixére tentória de tribu Aser: quorum princeps fuit Phégiel fílius Ochran.'
  "28": Cunctus exércitus pugnatórum eius, qui numeráti sunt, quadragínta míllia et mille quingénti.
  "29": De tribu filiórum Néphthali princeps fuit Ahira fílius Enan.
  "30": Cunctus exércitus pugnatórum eius, quinquagínta tria míllia quadringénti.
  "31": 'Omnes qui numeráti sunt in castris Dan, fuérunt centum quinquagínta septem míllia sexcénti: et novíssimi proficiscéntur.'
  "32": Hic númerus filiórum Israel, per domos cognatiónum suárum et turmas divísi exércitus, sexcénta tria míllia quingénti quinquagínta.
  "33": 'Levítæ autem non sunt numeráti inter fílios Israel: sic enim præcéperat Dóminus Móysi.'
  "34": Fecerúntque fílii Israel iuxta ómnia quæ mandáverat Dóminus. Castrametáti sunt per turmas suas, et profécti per famílias ac domos patrum suórum.
