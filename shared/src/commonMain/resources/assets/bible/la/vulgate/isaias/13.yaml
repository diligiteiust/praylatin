bible: vulgate
lang: la
language: Latina
book: Isaias
chapter: "13"
verses:
  "1": Onus Babylónis, quod vidit Isaías fílius Amos.
  "2": 'Super montem caliginósum leváte signum: exaltáte vocem, leváte manum, et ingrediántur portas duces.'
  "3": Ego mandávi sanctificátis meis, et vocávi fortes meos in ira mea, exsultántes in glória mea.
  "4": 'Vox multitúdinis in móntibus, quasi populórum frequéntium: vox sónitus regum, géntium congregatárum: Dóminus exercítuum præcépit milítiæ belli,'
  "5": 'veniéntibus de terra procul, a summitáte cæli: Dóminus, et vasa furóris eius, ut dispérdat omnem terram.'
  "6": 'Ululáte, quia prope est dies Dómini: quasi vástitas a Dómino véniet.'
  "7": Propter hoc omnes manus dissolvéntur, et omne cor hóminis contabéscet,
  "8": 'et conterétur. Torsiónes et dolóres tenébunt: quasi partúriens dolébunt: unusquísque ad próximum suum stupébit, fácies combústæ vultus eórum.'
  "9": Ecce dies Dómini véniet, crudélis, et indignatiónis plenus, et iræ, furorísque, ad ponéndam terram in solitúdinem, et peccatóres eius conteréndos de ea.
  "10": 'Quóniam stellæ cæli, et splendor eárum, non expándent lumen suum: obtenebrátus est sol in ortu suo, et luna non splendébit in lúmine suo.'
  "11": 'Et visitábo super orbis mala, et contra ímpios iniquitátem eórum: et quiéscere fáciam supérbiam infidélium, et arrogántiam fórtium humiliábo.'
  "12": Pretiósior erit vir auro, et homo mundo obrízo.
  "13": 'Super hoc cælum turbábo: et movébitur terra de loco suo, propter indignatiónem Dómini exercítuum, et propter diem iræ furóris eius.'
  "14": 'Et erit quasi dámula fúgiens, et quasi ovis: et non erit qui cóngreget: unusquísque ad pópulum suum convertétur, et sínguli ad terram suam fúgient.'
  "15": 'Omnis, qui invéntus fúerit, occidétur: et omnis, qui supervénerit, cadet in gládio.'
  "16": 'Infántes eórum allidéntur in óculis eórum: diripiéntur domus eórum, et uxóres eórum violabúntur.'
  "17": 'Ecce ego suscitábo super eos Medos, qui argéntum non quærant, nec aurum velint:'
  "18": sed sagíttis párvulos interfícient, et lactántibus úteris non miserebúntur, et super fílios non parcet óculus eórum.
  "19": Et erit Bábylon illa gloriósa in regnis, ínclyta supérbia Chaldæórum, sicut subvértit Dóminus Sódomam et Gomórrham.
  "20": 'Non habitábitur usque in finem, et non fundábitur usque ad generatiónem et generatiónem: nec ponet ibi tentória Arabs, nec pastóres requiéscent ibi.'
  "21": 'Sed requiéscent ibi béstiæ, et replebúntur domus eórum dracónibus: et habitábunt ibi struthiónes, et pilósi saltábunt ibi:'
  "22": et respondébunt ibi úlulæ in ǽdibus eius, et sirénes in delúbris voluptátis.
