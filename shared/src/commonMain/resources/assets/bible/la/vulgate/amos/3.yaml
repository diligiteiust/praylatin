bible: vulgate
lang: la
language: Latina
book: Amos
chapter: "3"
verses:
  "1": 'Audíte verbum, quod locútus est Dóminus super vos, fílii Israel: super omnem cognatiónem, quam edúxi de terra Ægýpti, dicens:'
  "2": 'Tantúmmodo vos cognóvi ex ómnibus cognatiónibus terræ: idcírco visitábo super vos omnes iniquitátes vestras.'
  "3": Numquid ambulábunt duo páriter, nisi convénerit eis?
  "4": numquid rúgiet leo in saltu, nisi habúerit prædam? numquid dabit cátulus leónis vocem de cubíli suo, nisi áliquid apprehénderit?
  "5": numquid cadet avis in láqueum terræ absque áucupe? numquid auferétur láqueus de terra ántequam quid céperit?
  "6": Si clanget tuba in civitáte, et pópulus non expavéscet? si erit malum in civitáte, quod Dóminus non fécerit?
  "7": Quia non facit Dóminus Deus verbum, nisi reveláverit secrétum suum ad servos suos prophétas.
  "8": Leo rúgiet, quis non timébit? Dóminus Deus locútus est, quis non prophetábit?
  "9": 'Audítum fácite in ǽdibus Azóti, et in ǽdibus terræ Ægýpti: et dícite: Congregámini super montes Samaríæ, et vidéte insánias multas in médio eius, et calúmniam patiéntes in penetrálibus eius.'
  "10": Et nesciérunt fácere rectum, dicit Dóminus, thesaurizántes iniquitátem, et rapínas in ǽdibus suis.
  "11": 'Proptérea hæc dicit Dóminus Deus: Tribulábitur, et circuiétur terra: et detrahétur ex te fortitúdo tua, et diripiéntur ædes tuæ.'
  "12": 'Hæc dicit Dóminus: Quómodo si éruat pastor de ore leónis duo crura, aut extrémum aurículæ: sic eruéntur fílii Israel, qui hábitant in Samaría in plaga léctuli, et in Damásci grabáto.'
  "13": 'Audíte, et contestámini in domo Iacob, dicit Dóminus Deus exercítuum:'
  "14": 'Quia in die cum visitáre cœ́pero prævaricatiónes Israel, super eum visitábo, et super altária Bethel: et amputabúntur córnua altáris, et cadent in terram.'
  "15": 'Et percútiam domum hiemálem cum domo æstíva: et períbunt domus ebúrneæ, et dissipabúntur ædes multæ, dicit Dóminus.'
