bible: vulgate
lang: la
language: Latina
book: Ezechiel
chapter: "24"
verses:
  "1": 'Et factum est verbum Dómini ad me in anno nono, in mense décimo, décima die mensis, dicens:'
  "2": Fili hóminis scribe tibi nomen diéi huius, in qua confirmátus est rex Babylónis advérsum Ierúsalem hódie.
  "3": 'Et dices per provérbium ad domum irritatrícem parábolam, et loquéris ad eos: Hæc dicit Dóminus Deus: Pone ollam: pone, inquam, et mitte in eam aquam.'
  "4": Cóngere frusta eius in eam, omnem partem bonam, femur et armum, elécta et óssibus plena.
  "5": 'Pinguíssimum pecus assúme, compóne quoque strues óssium sub ea: efférbuit cóctio eius, et discócta sunt ossa illíus in médio eius.'
  "6": 'Proptérea hæc dicit Dóminus Deus: Væ civitáti sánguinum, ollæ, cuius rubígo in ea est, et rubígo eius non exívit de ea: per partes et per partes suas éice eam: non cécidit super eam sors.'
  "7": 'Sanguis enim eius in médio eius est, super limpidíssimam petram effúdit illum: non effúdit illum super terram, ut possit operíri púlvere.'
  "8": 'Ut superindúcerem indignatiónem meam, et vindícta ulcíscerer: dedi sánguinem eius super petram limpidíssimam, ne operirétur.'
  "9": 'Proptérea hæc dicit Dóminus Deus: Væ civitáti sánguinum, cuius ego grandem fáciam pyram.'
  "10": 'Cóngere ossa, quæ igne succéndam: consuméntur carnes, et coquétur univérsa composítio, et ossa tabéscent.'
  "11": 'Pone quoque eam super prunas vácuam, ut incaléscat, et liquefíat æs eius: et conflétur in médio eius inquinaméntum eius, et consumátur rubígo eius.'
  "12": Multo labóre sudátum est, et non exívit de ea nímia rubígo eius, neque per ignem.
  "13": 'Immundítia tua exsecrábilis: quia mundáre te vólui, et non es mundáta a sórdibus tuis: sed nec mundáberis prius, donec quiéscere fáciam indignatiónem meam in te.'
  "14": 'Ego Dóminus locútus sum: Véniet, et fáciam: non tránseam, nec parcam, nec placábor: iuxta vias tuas, et iuxta adinventiónes tuas iudicábo te, dicit Dóminus.'
  "15": 'Et factum est verbum Dómini ad me, dicens:'
  "16": 'Fili hóminis, ecce ego tollo a te desiderábile oculórum tuórum in plaga: et non planges, neque plorábis, neque fluent lácrymæ tuæ.'
  "17": 'Ingemísce tacens, mortuórum luctum non fácies: coróna tua circumligáta sit tibi, et calceaménta tua erunt in pédibus tuis, nec amíctu ora velábis, nec cibos lugéntium cómedes.'
  "18": 'Locútus sum ergo ad pópulum mane, et mórtua est uxor mea véspere: fecíque mane sicut præcéperat mihi.'
  "19": 'Et dixit ad me pópulus: Quare non índicas nobis quid ista signíficent, quæ tu facis?'
  "20": 'Et dixi ad eos: Sermo Dómini factus est ad me, dicens:'
  "21": 'Lóquere dómui Israel: Hæc dicit Dóminus Deus: Ecce ego pólluam sanctuárium meum, supérbiam impérii vestri, et desiderábile oculórum vestrórum, et super quo pavet ánima vestra: fílii vestri, et fíliæ vestræ, quas reliquístis, gládio cadent.'
  "22": 'Et faciétis sicut feci: ora amíctu non velábitis, et cibos lugéntium non comedétis.'
  "23": 'Corónas habébitis in capítibus vestris, et calceaménta in pédibus: non plangétis, neque flébitis, sed tabescétis in iniquitátibus vestris, et unusquísque gemet ad fratrem suum.'
  "24": 'Erítque Ezéchiel vobis in porténtum: iuxta ómnia, quæ fecit, faciétis cum vénerit istud: et sciétis quia ego Dóminus Deus.'
  "25": 'Et tu fili hóminis, ecce in die, qua tollam ab eis fortitúdinem eórum, et gáudium dignitátis, et desidérium oculórum eórum, super quo requiéscunt ánimæ eórum, fílios, et fílias eórum:'
  "26": 'in die illa, cum vénerit fúgiens ad te, ut annúntiet tibi:'
  "27": 'in die, inquam, illa aperiétur os tuum cum eo, qui fugit: et loquéris, et non silébis ultra: erísque eis in porténtum, et sciétis quia ego Dóminus.'
