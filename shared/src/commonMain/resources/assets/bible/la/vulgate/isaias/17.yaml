bible: vulgate
lang: la
language: Latina
book: Isaias
chapter: "17"
verses:
  "1": Onus Damásci. Ecce Damáscus désinet esse cívitas, et erit sicut acérvus lápidum in ruína.
  "2": Derelíctæ civitátes Aroer grégibus erunt, et requiéscent ibi, et non erit qui extérreat.
  "3": 'Et cessábit adiutórium ab Ephraim, et regnum a Damásco: et relíquiæ Sýriæ sicut glória filiórum Israel erunt, dicit Dóminus exercítuum.'
  "4": 'Et erit in die illa: attenuábitur glória Iacob, et pinguédo carnis eius marcéscet.'
  "5": 'Et erit sicut cóngregans in messe quod restíterit, et bráchium eius spicas leget: et erit sicut quærens spicas in valle Ráphaim.'
  "6": Et relinquétur in eo sicut racémus, et sicut excússio óleæ duárum vel trium olivárum in summitáte rami, sive quátuor aut quinque in cacumínibus eius fructus eius, dicit Dóminus Deus Israel.
  "7": 'In die illa inclinábitur homo ad Factórem suum, et óculi eius ad sanctum Israel respícient:'
  "8": 'et non inclinábitur ad altária, quæ fecérunt manus eius: et quæ operáti sunt dígiti eius non respíciet, lucos et delúbra.'
  "9": In die illa erunt civitátes fortitúdinis eius derelíctæ sicut arátra, et ségetes quæ derelíctæ sunt a fácie filiórum Israel, et eris desérta.
  "10": 'Quia oblíta es Dei salvatóris tui, et fortis adiutóris tui non es recordáta: proptérea plantábis plantatiónem fidélem, et germen aliénum seminábis.'
  "11": 'In die plantatiónis tuæ labrúsca, et mane semen tuum florébit: abláta est messis in die hereditátis, et dolébit gráviter.'
  "12": 'Væ multitúdini populórum multórum, ut multitúdo maris sonántis: et tumúltus turbárum, sicut sónitus aquárum multárum.'
  "13": 'Sonábunt pópuli sicut sónitus aquárum inundántium, et increpábit eum, et fúgiet procul: et rapiétur sicut pulvis móntium a fácie venti, et sicut turbo coram tempestáte.'
  "14": 'In témpore véspere, et ecce turbátio: in matutíno, et non subsístet: hæc est pars eórum, qui vastavérunt nos, et sors diripiéntium nos.'
