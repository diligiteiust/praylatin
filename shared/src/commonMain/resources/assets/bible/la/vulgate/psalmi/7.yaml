bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "7"
verses:
  "1": Psalmus David, quem cantávit Dómino pro verbis Chusi, fílii Iémini.
  "2": 'Dómine Deus meus in te sperávi: salvum me fac ex ómnibus persequéntibus me, et líbera me.'
  "3": Nequándo rápiat ut leo ánimam meam, dum non est qui rédimat, neque qui salvum fáciat.
  "4": 'Dómine Deus meus si feci istud, si est iníquitas in mánibus meis:'
  "5": si réddidi retribuéntibus mihi mala, décidam mérito ab inimícis meis inánis.
  "6": Persequátur inimícus ánimam meam, et comprehéndat, et concúlcet in terra vitam meam, et glóriam meam in púlverem dedúcat.
  "7": 'Exsúrge Dómine in ira tua, et exaltáre in fínibus inimicórum meórum. Et exsúrge Dómine Deus meus in præcépto quod mandásti:'
  "8": 'et synagóga populórum circúmdabit te. Et propter hanc in altum regrédere:'
  "9": Dóminus iúdicat pópulos. Iúdica me Dómine secúndum iustítiam meam, et secúndum innocéntiam meam super me.
  "10": Consumétur nequítia peccatórum, et díriges iustum, scrutans corda et renes Deus.
  "11": Iustum adiutórium meum a Dómino, qui salvos facit rectos corde.
  "12": 'Deus iudex iustus, fortis, et pátiens: numquid iráscitur per síngulos dies?'
  "13": 'Nisi convérsi fuéritis, gládium suum vibrábit: arcum suum teténdit, et parávit illum.'
  "14": Et in eo parávit vasa mortis, sagíttas suas ardéntibus effécit.
  "15": 'Ecce partúriit iniustítiam: concépit dolórem, et péperit iniquitátem.'
  "16": 'Lacum apéruit, et effódit eum: et íncidit in fóveam, quam fecit.'
  "17": Convertétur dolor eius in caput eius, et in vérticem ipsíus iníquitas eius descéndet.
  "18": Confitébor Dómino secúndum iustítiam eius, et psallam nómini Dómini altíssimi.
