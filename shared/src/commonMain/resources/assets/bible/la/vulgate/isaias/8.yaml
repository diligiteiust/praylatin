bible: vulgate
lang: la
language: Latina
book: Isaias
chapter: "8"
verses:
  "1": 'Et dixit Dóminus ad me: Sume tibi librum grandem, et scribe in eo stylo hóminis: Velóciter spólia détrahe, cito prædáre.'
  "2": 'Et adhíbui mihi testes fidéles, Uríam sacerdótem, et Zacharíam fílium Barachíæ:'
  "3": 'et accéssi ad prophetíssam, et concépit, et péperit fílium. Et dixit Dóminus ad me: Voca nomen eius: Accélera spólia detráhere: Festína prædári:'
  "4": quia ántequam sciat puer vocáre patrem suum et matrem suam, auferétur fortitúdo Damásci, et spólia Samaríæ, coram rege Assyriórum.
  "5": 'Et adiécit Dóminus loqui ad me adhuc, dicens:'
  "6": 'Pro eo quod abiécit pópulus iste aquas Síloe, quæ vadunt cum siléntio, et assúmpsit magis Rasin, et fílium Romelíæ:'
  "7": propter hoc ecce Dóminus addúcet super eos aquas flúminis fortes et multas, regem Assyriórum, et omnem glóriam eius, et ascéndet super omnes rivos eius, et fluet super univérsas ripas eius,
  "8": et ibit per Iudam, inúndans, et tránsiens usque ad collum véniet. Et erit exténsio alárum eius implens latitúdinem terræ tuæ, o Emmánuel.
  "9": 'Congregámini pópuli, et vincímini, et audíte univérsæ procul terræ: confortámini et vincímini, accíngite vos et vincímini:'
  "10": 'iníte consílium, et dissipábitur: loquímini verbum, et non fiet: quia nobíscum Deus.'
  "11": 'Hæc enim ait Dóminus ad me: Sicut in manu forti erudívit me, ne irem in via pópuli huius, dicens:'
  "12": 'Non dicátis: Coniurátio: ómnia enim quæ lóquitur pópulus iste, coniurátio est: et timórem eius ne timeátis, neque paveátis.'
  "13": 'Dóminum exercítuum ipsum sanctificáte: ipse pavor vester, et ipse terror vester.'
  "14": Et erit vobis in sanctificatiónem. In lápidem autem offensiónis, et in petram scándali duábus dómibus Israel, in láqueum et in ruínam habitántibus Ierúsalem.
  "15": Et offéndent ex eis plúrimi, et cadent, et conteréntur, et irretiéntur, et capiéntur.
  "16": Liga testimónium, signa legem in discípulis meis.
  "17": Et exspectábo Dóminum, qui abscóndit fáciem suam a domo Iacob, et præstolábor eum.
  "18": Ecce ego et púeri mei, quos dedit mihi Dóminus in signum, et in porténtum Israel a Dómino exercítuum, qui hábitat in monte Sion.
  "19": 'Et cum díxerint ad vos: Quǽrite a pythónibus, et a divínis, qui strident in incantatiónibus suis: Numquid non pópulus a Deo suo requíret pro vivis a mórtuis?'
  "20": Ad legem magis, et ad testimónium. Quod si non díxerint iuxta verbum hoc, non erit eis matutína lux.
  "21": 'Et transíbit per eam, córruet, et esúriet: et cum esuríerit, irascétur, et maledícet regi suo, et Deo suo, et suspíciet sursum.'
  "22": 'Et ad terram intuébitur: et ecce tribulátio et ténebræ, dissolútio et angústia, et calígo pérsequens, et non póterit avoláre de angústia sua.'
