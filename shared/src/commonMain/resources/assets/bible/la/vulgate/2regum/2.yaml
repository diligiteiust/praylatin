bible: vulgate
lang: la
language: Latina
book: II Regum
chapter: "2"
verses:
  "1": Factum est autem, cum leváre vellet Dóminus Elíam per túrbinem in cælum, ibant Elías et Eliséus de Gálgalis.
  "2": 'Dixítque Elías ad Eliséum: Sede hic, quia Dóminus misit me usque in Bethel. Cui ait Eliséus: Vivit Dóminus, et vivit ánima tua, quia non derelínquam te. Cumque descendíssent Bethel,'
  "3": 'egréssi sunt fílii prophetárum, qui erant in Bethel, ad Eliséum, et dixérunt ei: Numquid nosti quia hódie Dóminus tollet dóminum tuum a te? Qui respóndit: Et ego novi: siléte.'
  "4": 'Dixit autem Elías ad Eliséum: Sede hic, quia Dóminus misit me in Iéricho. Et ille ait: Vivit Dóminus, et vivit ánima tua, quia non derelínquam te. Cumque veníssent Iéricho,'
  "5": 'accessérunt fílii prophetárum, qui erant in Iéricho, ad Eliséum, et dixérunt ei: Numquid nosti quia Dóminus hódie tollet dóminum tuum a te? Et ait: Et ego novi: siléte.'
  "6": 'Dixit autem ei Elías: Sede hic, quia Dóminus misit me usque ad Iordánem. Qui ait: Vivit Dóminus, et vivit ánima tua, quia non derelínquam te. Iérunt ígitur ambo páriter,'
  "7": 'et quinquagínta viri de fíliis prophetárum secúti sunt eos, qui et stetérunt ecóntra, longe: illi autem ambo stabant super Iordánem.'
  "8": 'Tulítque Elías pállium suum, et invólvit illud, et percússit aquas: quæ divísæ sunt in utrámque partem, et transiérunt ambo per siccum.'
  "9": 'Cumque transíssent, Elías dixit ad Eliséum: Póstula quod vis ut fáciam tibi, ántequam tollar a te. Dixítque Eliséus: Obsecro ut fiat in me duplex spíritus tuus.'
  "10": 'Qui respóndit: Rem diffícilem postulásti: áttamen si víderis me quando tollar a te, erit tibi quod petísti: si autem non víderis, non erit.'
  "11": 'Cumque pérgerent, et incedéntes sermocinaréntur, ecce currus ígneus, et equi ígnei divisérunt utrúmque: et ascéndit Elías per túrbinem in cælum.'
  "12": 'Eliséus autem vidébat, et clamábat: Pater mi, pater mi, currus Israel, et auríga eius. Et non vidit eum ámplius: apprehendítque vestiménta sua, et scidit illa in duas partes.'
  "13": 'Et levávit pállium Elíæ, quod cecíderat ei: reversúsque stetit super ripam Iordánis,'
  "14": 'et pállio Elíæ, quod cecíderat ei, percússit aquas, et non sunt divísæ: et dixit: Ubi est Deus Elíæ étiam nunc? Percussítque aquas, et divísæ sunt huc atque illuc, et tránsiit Eliséus.'
  "15": 'Vidéntes autem fílii prophetárum, qui erant in Iéricho ecóntra, dixérunt: Requiévit spíritus Elíæ super Eliséum. Et veniéntes in occúrsum eius, adoravérunt eum proni in terram,'
  "16": 'dixerúntque illi: Ecce, cum servis tuis sunt quinquagínta viri fortes, qui possunt ire, et quǽrere dóminum tuum, ne forte túlerit eum Spíritus Dómini, et proiécerit eum in unum móntium, aut in unam vállium. Qui ait: Nolíte míttere.'
  "17": 'Coegerúntque eum, donec acquiésceret, et díceret: Míttite. Et misérunt quinquagínta viros: qui cum quæsíssent tribus diébus, non invenérunt.'
  "18": 'Et revérsi sunt ad eum: at ille habitábat in Iéricho, et dixit eis: Numquid non dixi vobis: Nolíte míttere?'
  "19": 'Dixérunt quoque viri civitátis ad Eliséum: Ecce habitátio civitátis huius óptima est, sicut tu ipse dómine pérspicis: sed aquæ péssimæ sunt, et terra stérilis.'
  "20": 'At ille ait: Afférte mihi vas novum, et míttite in illud sal. Quod cum attulíssent,'
  "21": 'egréssus ad fontem aquárum, misit in illum sal, et ait: Hæc dicit Dóminus: Sanávi aquas has, et non erit ultra in eis mors, neque sterílitas.'
  "22": Sanátæ sunt ergo aquæ usque in diem hanc, iuxta verbum Eliséi, quod locútus est.
  "23": 'Ascéndit autem inde in Bethel: cumque ascénderet per viam, púeri parvi egréssi sunt de civitáte, et illudébant ei, dicéntes: Ascénde calve, ascénde calve.'
  "24": 'Qui cum respexísset, vidit eos, et maledíxit eis in nómine Dómini: egressíque sunt duo ursi de saltu, et laceravérunt ex eis quadragínta duos púeros.'
  "25": Abiit autem inde in montem Carméli, et inde revérsus est in Samaríam.
