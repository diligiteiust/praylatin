bible: vulgate
lang: la
language: Latina
book: Ieremias
chapter: "23"
verses:
  "1": Væ pastóribus, qui dispérdunt et dilácerant gregem páscuæ meæ, dicit Dóminus.
  "2": 'Ideo hæc dicit Dóminus Deus Israel ad pastóres, qui pascunt pópulum meum: Vos dispersístis gregem meum, et eiecístis eos, et non visitástis eos: ecce ego visitábo super vos malítiam studiórum vestrórum, ait Dóminus.'
  "3": 'Et ego congregábo relíquias gregis mei de ómnibus terris, ad quas eiécero eos illuc: et convértam eos ad rura sua: et crescent et multiplicabúntur.'
  "4": 'Et suscitábo super eos pastóres, et pascent eos: non formidábunt ultra, et non pavébunt: et nullus quærétur ex número, dicit Dóminus.'
  "5": 'Ecce dies véniunt, dicit Dóminus, et suscitábo David germen iustum: et regnábit rex, et sápiens erit: et fáciet iudícium et iustítiam in terra.'
  "6": 'In diébus illis salvábitur Iuda, et Israel habitábit confidénter: et hoc est nomen quod vocábunt eum, Dóminus iustus noster.'
  "7": 'Propter hoc ecce dies véniunt, dicit Dóminus, et non dicent ultra: Vivit Dóminus, qui edúxit fílios Israel de terra Ægýpti:'
  "8": 'sed: Vivit Dóminus, qui edúxit et addúxit semen domus Israel de terra aquilónis, et de cunctis terris, ad quas eiéceram eos illuc, et habitábunt in terra sua.'
  "9": 'Ad prophétas: Contrítum est cor meum in médio mei, contremuérunt ómnia ossa mea: factus sum quasi vir ébrius, et quasi homo mádidus a vino, a fácie Dómini, et a fácie verbórum sanctórum eius.'
  "10": 'Quia adúlteris repléta est terra, quia a fácie maledictiónis luxit terra, arefácta sunt arva desérti: factus est cursus eórum malus, et fortitúdo eórum dissímilis.'
  "11": 'Prophéta namque et sacérdos pollúti sunt: et in domo mea invéni malum eórum, ait Dóminus.'
  "12": 'Idcírco via eórum erit quasi lúbricum in ténebris: impelléntur enim, et córruent in ea: áfferam enim super eos mala, annum visitatiónis eórum, ait Dóminus.'
  "13": 'Et in prophétis Samaríæ vidi fatuitátem: prophetábant in Baal, et decipiébant pópulum meum Israel.'
  "14": 'Et in prophétis Ierúsalem vidi similitúdinem adulterántium, et iter mendácii: et confortavérunt manus pessimórum, ut non converterétur unusquísque a malítia sua: facti sunt mihi omnes ut Sódoma, et habitatóres eius quasi Gomórrha.'
  "15": 'Proptérea hæc dicit Dóminus exercítuum ad prophétas: Ecce ego cibábo eos absínthio, et potábo eos felle: a prophétis enim Ierúsalem egréssa est pollútio super omnem terram.'
  "16": 'Hæc dicit Dóminus exercítuum: Nolíte audíre verba prophetárum, qui prophétant vobis, et decípiunt vos: visiónem cordis sui loquúntur, non de ore Dómini.'
  "17": 'Dicunt his, qui blasphémant me: Locútus est Dóminus: Pax erit vobis: et omni, qui ámbulat in pravitáte cordis sui, dixérunt: Non véniet super vos malum.'
  "18": Quis enim áffuit in consílio Dómini, et vidit et audívit sermónem eius? quis considerávit verbum illíus, et audívit?
  "19": Ecce turbo Domínicæ indignatiónis egrediétur, et tempéstas erúmpens super caput impiórum véniet.
  "20": 'Non revertétur furor Dómini usque dum fáciat, et usque dum cómpleat cogitatiónem cordis sui: in novíssimis diébus intelligétis consílium eius.'
  "21": 'Non mittébam prophétas, et ipsi currébant: non loquébar ad eos, et ipsi prophetábant.'
  "22": Si stetíssent in consílio meo, et nota fecíssent verba mea pópulo meo, avertíssem útique eos a via sua mala, et a cogitatiónibus suis péssimis.
  "23": Putásne Deus e vicíno ego sum, dicit Dóminus, et non Deus de longe?
  "24": Si occultábitur vir in abscónditis, et ego non vidébo eum, dicit Dóminus? numquid non cælum et terram ego ímpleo, dicit Dóminus?
  "25": 'Audívi quæ dixérunt prophétæ, prophetántes in nómine meo mendácium, atque dicéntes: Somniávi, somniávi.'
  "26": Usquequo istud est in corde prophetárum vaticinántium mendácium, et prophetántium seductiónes cordis sui?
  "27": 'Qui volunt fácere ut obliviscátur pópulus meus nóminis mei propter sómnia eórum, quæ narrat unusquísque ad próximum suum: sicut oblíti sunt patres eórum nóminis mei propter Baal.'
  "28": 'Prophéta qui habet sómnium, narret sómnium: et qui habet sermónem meum, loquátur sermónem meum vere: quid páleis ad tríticum, dicit Dóminus?'
  "29": Numquid non verba mea sunt quasi ignis, dicit Dóminus, et quasi málleus cónterens petram?
  "30": Proptérea ecce ego ad prophétas, ait Dóminus, qui furántur verba mea unusquísque a próximo suo.
  "31": 'Ecce ego ad prophétas, ait Dóminus, qui assúmunt linguas suas, et aiunt: Dicit Dóminus.'
  "32": 'Ecce ego ad prophétas somniántes mendácium, ait Dóminus, qui narravérunt ea, et seduxérunt pópulum meum in mendácio suo, et in miráculis suis: cum ego non misíssem eos, nec mandássem eis, qui nihil profuérunt pópulo huic, dicit Dóminus.'
  "33": 'Si ígitur interrogáverit te pópulus iste, vel prophéta, aut sacérdos, dicens: Quod est onus Dómini? dices ad eos: Vos estis onus: proíciam quippe vos, dicit Dóminus.'
  "34": 'Et prophéta, et sacérdos, et pópulus qui dicit: Onus Dómini: visitábo super virum illum, et super domum eius.'
  "35": 'Hæc dicétis unusquísque ad próximum, et ad fratrem suum: Quid respóndit Dóminus? et quid locútus est Dóminus?'
  "36": 'Et onus Dómini ultra non memorábitur: quia onus erit unicuíque sermo suus: et pervertístis verba Dei vivéntis, Dómini exercítuum Dei nostri.'
  "37": 'Hæc dices ad prophétam: Quid respóndit tibi Dóminus? et quid locútus est Dóminus?'
  "38": 'Si autem onus Dómini dixéritis: propter hoc hæc dicit Dóminus: Quia dixístis sermónem istum: Onus Dómini: et misi ad vos, dicens: Nolíte dícere: Onus Dómini:'
  "39": proptérea ecce ego tollam vos portans, et derelínquam vos, et civitátem, quam dedi vobis et pátribus vestris, a fácie mea.
  "40": Et dabo vos in oppróbrium sempitérnum, et in ignomíniam ætérnam, quæ numquam oblivióne delébitur.
