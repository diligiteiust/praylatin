bible: vulgate
lang: la
language: Latina
book: I Petri
chapter: "3"
verses:
  "1": 'Simíliter et mulíeres súbditæ sint viris suis: ut et si qui non credunt verbo, per mulíerum conversatiónem sine verbo lucrifíant,'
  "2": considerántes in timóre castam conversatiónem vestram.
  "3": 'Quarum non sit extrínsecus capillatúra, aut circumdátio auri, aut induménti vestimentórum cultus:'
  "4": sed qui abscónditus est cordis homo, in incorruptibilitáte quiéti, et modésti spíritus, qui est in conspéctu Dei lócuples.
  "5": Sic enim aliquándo et sanctæ mulíeres, sperántes in Deo, ornábant se, subiéctæ própriis viris.
  "6": 'Sicut Sara obediébat Abrahæ, dóminum eum vocans: cuius estis fíliæ benefaciéntes, et non pertiméntes ullam perturbatiónem.'
  "7": 'Viri simíliter cohabitántes secúndum sciéntiam, quasi infirmióri vásculo mulíebri impartiéntes honórem, tamquam et coherédibus grátiæ vitæ: ut non impediántur oratiónes vestræ.'
  "8": 'In fine autem omnes unánimes, compatiéntes, fraternitátis amatóres, misericórdes, modésti, húmiles:'
  "9": 'non reddéntes malum pro malo, nec maledíctum pro maledícto, sed e contrário benedicéntes: quia in hoc vocáti estis, ut benedictiónem hereditáte possideátis.'
  "10": Qui enim vult vitam dilígere, et dies vidére bonos, coérceat linguam suam a malo, et lábia eius ne loquántur dolum.
  "11": 'Declínet a malo, et fáciat bonum: inquírat pacem, et sequátur eam:'
  "12": 'quia óculi Dómini super iustos, et aures eius in preces eórum: vultus autem Dómini super faciéntes mala.'
  "13": Et quis est qui vobis nóceat, si boni æmulatóres fuéritis?
  "14": Sed et si quid patímini propter iustítiam, beáti. Timórem autem eórum ne timuéritis, et non conturbémini.
  "15": Dóminum autem Christum sanctificáte in córdibus vestris, paráti semper ad satisfactiónem omni poscénti vos ratiónem de ea, quæ in vobis est, spe.
  "16": 'Sed cum modéstia, et timóre, consciéntiam habéntes bonam: ut in eo, quod détrahunt vobis, confundántur, qui calumniántur vestram bonam in Christo conversatiónem.'
  "17": Mélius est enim benefaciéntes (si volúntas Dei velit) pati, quam malefaciéntes.
  "18": Quia et Christus semel pro peccátis nostris mórtuus est, iustus pro iniústis, ut nos offérret Deo, mortificátus quidem carne, vivificátus autem spíritu.
  "19": 'In quo et his, qui in cárcere erant, spirítibus véniens prædicávit:'
  "20": 'qui incréduli fúerant aliquándo, quando exspectábant Dei patiéntiam in diébus Noe, cum fabricarétur arca: in qua pauci, id est octo ánimæ, salvæ factæ sunt per aquam.'
  "21": 'Quod et vos nunc símilis formæ salvos fecit baptísma: non carnis deposítio sórdium, sed consciéntiæ bonæ interrogátio in Deum per resurrectiónem Iesu Christi.'
  "22": 'Qui est in déxtera Dei, deglútiens mortem ut vitæ ætérnæ herédes efficerémur: proféctus in cælum subiéctis sibi ángelis, et potestátibus, et virtútibus.'
