bible: vulgate
lang: la
language: Latina
book: Iosue
chapter: "17"
verses:
  "1": 'Cécidit autem sors tríbui Manásse (ipse enim est primogénitus Ioseph): Machir primogénito Manásse patri Gálaad, qui fuit vir pugnátor, habuítque possessiónem Gálaad et Basan:'
  "2": et réliquis filiórum Manásse iuxta famílias suas, fíliis Abiézer, et fíliis Helec, et fíliis Esriel, et fíliis Sechem, et fíliis Hepher, et fíliis Semída. Isti sunt fílii Manásse fílii Ioseph, mares, per cognatiónes suas.
  "3": 'Sálphaad vero fílio Hepher fílii Gálaad fílii Machir fílii Manásse non erant fílii, sed solæ fíliæ: quarum ista sunt nómina, Máala et Noa et Hegla et Melcha et Thersa.'
  "4": 'Venerúntque in conspéctu Eleázari sacerdótis, et Iósue fílii Nun, et príncipum, dicéntes: Dóminus præcépit per manum Móysi, ut darétur nobis posséssio in médio fratrum nostrórum. Dedítque eis iuxta impérium Dómini possessiónem in médio fratrum patris eárum.'
  "5": Et cecidérunt funículi Manásse, decem, absque terra Gálaad et Basan trans Iordánem.
  "6": Fíliæ enim Manásse possedérunt hereditátem in médio filiórum eius. Terra autem Gálaad cécidit in sortem filiórum Manásse qui réliqui erant.
  "7": 'Fuítque términus Manásse ab Aser, Máchmethath quæ réspicit Sichem: et egréditur ad déxteram iuxta habitatóres fontis Táphuæ.'
  "8": Etenim in sorte Manásse cecíderat terra Táphuæ, quæ est iuxta términos Manásse filiórum Ephraim.
  "9": 'Descendítque términus Vallis arundinéti in merídiem torréntis civitátum Ephraim, quæ in médio sunt úrbium Manásse: términus Manásse ab aquilóne torréntis, et éxitus eius pergit ad mare:'
  "10": ita ut posséssio Ephraim sit ab austro, et ab aquilóne Manásse, et utrámque claudat mare, et coniungántur sibi in tribu Aser ab aquilóne, et in tribu Issachar ab oriénte.
  "11": 'Fuítque heréditas Manásse in Issachar et in Aser, Bethsan et vículi eius, et Iéblaam cum vículis suis, et habitatóres Dor cum óppidis suis, habitatóres quoque Endor cum vículis suis: similitérque habitatóres Thenac cum vículis suis, et habitatóres Magéddo cum vículis suis, et tértia pars urbis Nopheth.'
  "12": Nec potuérunt fílii Manásse has civitátes subvértere, sed cœpit Chananǽus habitáre in terra sua.
  "13": Postquam autem convaluérunt fílii Israel, subiecérunt Chananǽos, et fecérunt sibi tributários, nec interfecérunt eos.
  "14": 'Locutíque sunt fílii Ioseph ad Iósue, et dixérunt: Quare dedísti mihi possessiónem sortis et funículi uníus, cum sim tantæ multitúdinis, et benedíxerit mihi Dóminus?'
  "15": 'Ad quos Iósue ait: Si pópulus multus es, ascénde in silvam, et succíde tibi spátia in terra Pherezǽi et Ráphaim: quia angústa est tibi posséssio montis Ephraim.'
  "16": 'Cui respondérunt fílii Ioseph: Non potérimus ad montána conscéndere, cum férreis cúrribus utántur Chananǽi, qui hábitant in terra campéstri, in qua sitæ sunt Bethsan cum vículis suis, et Iézrael médiam póssidens vallem.'
  "17": 'Dixítque Iósue ad domum Ioseph, Ephraim et Manásse: Pópulus multus es, et magnæ fortitúdinis: non habébis sortem unam,'
  "18": 'sed transíbis ad montem, et succídes tibi, atque purgábis ad habitándum spátia: et póteris ultra procédere cum subvérteris Chananǽum, quem dicis férreos habére currus, et esse fortíssimum.'
