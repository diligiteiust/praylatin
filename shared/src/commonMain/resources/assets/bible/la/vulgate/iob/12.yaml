bible: vulgate
lang: la
language: Latina
book: Iob
chapter: "12"
verses:
  "1": 'Respóndens autem Iob, dixit:'
  "2": Ergo vos estis soli hómines, et vobíscum moriétur sapiéntia?
  "3": 'Et mihi est cor sicut et vobis, nec inférior vestri sum: quis enim hæc, quæ nostis, ignórat?'
  "4": 'Qui deridétur ab amíco suo sicut ego, invocábit Deum, et exáudiet eum: deridétur enim iusti simplícitas.'
  "5": Lampas contémpta apud cogitatiónes dívitum paráta ad tempus statútum.
  "6": Abúndant tabernácula prædónum, et audácter próvocant Deum, cum ipse déderit ómnia in manus eórum.
  "7": 'Nimírum intérroga iuménta, et docébunt te: et volatília cæli, et indicábunt tibi.'
  "8": 'Lóquere terræ, et respondébit tibi: et narrábunt pisces maris.'
  "9": Quis ignórat quod ómnia hæc manus Dómini fécerit?
  "10": In cuius manu ánima omnis vivéntis, et spíritus univérsæ carnis hóminis.
  "11": Nonne auris verba diiúdicat? et fauces comedéntis, sapórem?
  "12": In antíquis est sapiéntia, et in multo témpore prudéntia.
  "13": Apud ipsum est sapiéntia et fortitúdo, ipse habet consílium et intelligéntiam.
  "14": 'Si destrúxerit, nemo est qui ædíficet: si inclúserit hóminem, nullus est qui apériat.'
  "15": 'Si continúerit aquas, ómnia siccabúntur: et si emíserit eas, subvértent terram.'
  "16": 'Apud ipsum est fortitúdo et sapiéntia: ipse novit et decipiéntem, et eum qui decípitur.'
  "17": Addúcit consiliários in stultum finem, et iúdices in stupórem.
  "18": Bálteum regum dissólvit, et præcíngit fune renes eórum.
  "19": 'Ducit sacerdótes inglórios, et optimátes supplántat:'
  "20": commútans lábium verácium, et doctrínam senum áuferens.
  "21": Effúndit despectiónem super príncipes, eos, qui oppréssi fúerant, rélevans.
  "22": Qui revélat profúnda de ténebris, et prodúcit in lucem umbram mortis.
  "23": Qui multíplicat gentes et perdit eas, et subvérsas in íntegrum restítuit.
  "24": 'Qui immútat cor príncipum pópuli terræ, et décipit eos ut frustra incédant per ínvium:'
  "25": palpábunt quasi in ténebris, et non in luce, et erráre eos fáciet quasi ébrios.
