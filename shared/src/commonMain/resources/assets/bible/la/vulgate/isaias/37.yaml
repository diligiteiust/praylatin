bible: vulgate
lang: la
language: Latina
book: Isaias
chapter: "37"
verses:
  "1": Et factum est, cum audísset rex Ezechías, scidit vestiménta sua, et obvolútus est sacco, et intrávit in domum Dómini.
  "2": Et misit Elíacim, qui erat super domum, et Sobnam scribam, et senióres de sacerdótibus opértos saccis ad Isaíam fílium Amos prophétam,
  "3": 'et dixérunt ad eum: Hæc dicit Ezechías: Dies tribulatiónis, et correptiónis, et blasphémiæ dies hæc: quia venérunt fílii usque ad partum, et virtus non est pariéndi.'
  "4": 'Si quo modo áudiat Dóminus Deus tuus verba Rábsacis, quem misit rex Assyriórum dóminus suus ad blasphemándum Deum vivéntem, et exprobrándum sermónibus, quos audívit Dóminus Deus tuus: leva ergo oratiónem pro relíquiis, quæ repértæ sunt.'
  "5": Et venérunt servi regis Ezechíæ ad Isaíam.
  "6": 'Et dixit ad eos Isaías: Hæc dicétis dómino vestro: Hæc dicit Dóminus: Ne tímeas a fácie verbórum, quæ audísti, quibus blasphemavérunt púeri regis Assyriórum me.'
  "7": Ecce ego dabo ei spíritum, et áudiet núntium, et revertétur ad terram suam, et corrúere eum fáciam gládio in terra sua.
  "8": 'Revérsus est autem Rábsaces, et invénit regem Assyriórum prœliántem advérsus Lobnam: audíerat enim quia proféctus esset de Lachis.'
  "9": 'Et audívit de Tháraca rege Æthiópiæ, dicéntes: Egréssus est ut pugnet contra te. Quod cum audísset, misit núntios ad Ezechíam, dicens:'
  "10": 'Hæc dicétis Ezechíæ regi Iudæ, loquéntes: Non te decípiat Deus tuus, in quo tu confídis, dicens: Non dábitur Ierúsalem in manu regis Assyriórum.'
  "11": 'Ecce tu audísti ómnia, quæ fecérunt reges Assyriórum ómnibus terris, quas subvertérunt: et tu póteris liberári?'
  "12": Numquid eruérunt eos dii géntium, quos subvertérunt patres mei Gozam, et Haram, et Reseph, et fílios Eden, qui erant in Thalássar?
  "13": Ubi est rex Emath, et rex Arphad, et rex urbis Sephárvaim, Ana, et Ava?
  "14": Et tulit Ezechías libros de manu nuntiórum, et legit eos, et ascéndit in domum Dómini, et expándit eos Ezechías coram Dómino.
  "15": 'Et orávit Ezechías ad Dóminum, dicens:'
  "16": 'Dómine exercítuum Deus Israel, qui sedes super Chérubim: tu es Deus solus ómnium regnórum terræ, tu fecísti cælum et terram.'
  "17": 'Inclína Dómine aurem tuam, et audi: áperi Dómine óculos tuos, et vide, et audi ómnia verba Sennácherib, quæ misit ad blasphemándum Deum vivéntem.'
  "18": Vere enim Dómine desértas fecérunt reges Assyriórum terras, et regiónes eárum.
  "19": 'Et dedérunt deos eárum igni: non enim erant dii, sed ópera mánuum hóminum, lignum et lapis, et comminuérunt eos.'
  "20": Et nunc Dómine Deus noster, salva nos de manu eius, et cognóscant ómnia regna terræ, quia tu es Dóminus solus.
  "21": 'Et misit Isaías fílius Amos ad Ezechíam, dicens: Hæc dicit Dóminus Deus Israel: Pro quibus rogásti me de Sennácherib, rege Assyriórum:'
  "22": 'hoc est verbum, quod locútus est Dóminus super eum: Despéxit te, et subsannávit te virgo fília Sion: post te caput movit fília Ierúsalem.'
  "23": Cui exprobrásti? et quem blasphemásti? et super quem exaltásti vocem, et levásti altitúdinem oculórum tuórum? Ad sanctum Israel.
  "24": 'In manu servórum tuórum exprobrásti Dómino, et dixísti: In multitúdine quadrigárum meárum ego ascéndi altitúdinem móntium, iuga Líbani: et succídam excélsa cedrórum eius, et eléctas abiétes illíus, et introíbo altitúdinem summitátis eius, saltum Carméli eius.'
  "25": Ego fodi, et bibi aquam, et exsiccávi vestígio pedis mei omnes rivos ággerum.
  "26": 'Numquid non audísti, quæ olim fécerim ei? Ex diébus antíquis ego plasmávi illud: et nunc addúxi, et factum est in eradicatiónem cóllium compugnántium, et civitátum munitárum.'
  "27": 'Habitatóres eárum breviáta manu contremuérunt, et confúsi sunt: facti sunt sicut fœnum agri, et gramen páscuæ, et herba tectórum, quæ exáruit ántequam maturésceret.'
  "28": Habitatiónem tuam, et egréssum tuum, et intróitum tuum cognóvi, et insániam tuam contra me.
  "29": 'Cum fúreres advérsum me, supérbia tua ascéndit in aures meas: ponam ergo círculum in náribus tuis, et frenum in lábiis tuis, et redúcam te in viam, per quam venísti.'
  "30": 'Tibi autem hoc erit signum: Cómede hoc anno quæ sponte nascúntur, et in anno secúndo pomis véscere: in anno autem tértio semináte et métite, et plantáte víneas, et comédite fructum eárum.'
  "31": 'Et mittet id, quod salvátum fúerit de domo Iuda, et quod réliquum est, radícem deórsum, et fáciet fructum sursum:'
  "32": 'quia de Ierúsalem exíbunt relíquiæ, et salvátio de monte Sion: zelus Dómini exercítuum fáciet istud.'
  "33": 'Proptérea hæc dicit Dóminus de rege Assyriórum: Non intrábit civitátem hanc, et non iáciet ibi sagíttam, et non occupábit eam clýpeus, et non mittet in circúitu eius ággerem.'
  "34": In via, qua venit, per eam revertétur, et civitátem hanc non ingrediétur, dicit Dóminus.
  "35": Et prótegam civitátem istam, ut salvem eam propter me, et propter David servum meum.
  "36": Egréssus est autem ángelus Dómini, et percússit in castris Assyriórum centum octogínta quinque míllia. Et surrexérunt mane, et ecce omnes cadávera mortuórum.
  "37": Et egréssus est, et ábiit, et revérsus est Sennácherib rex Assyriórum, et habitávit in Nínive.
  "38": 'Et factum est, cum adoráret in templo Nesroch deum suum, Adrámelech et Sárasar, fílii eius, percussérunt eum gládio, fugerúntque in terram Ararat: et regnávit Asarháddon fílius eius pro eo.'
