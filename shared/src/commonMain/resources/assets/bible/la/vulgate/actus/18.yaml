bible: vulgate
lang: la
language: Latina
book: Actus Apostolorum
chapter: "18"
verses:
  "1": 'Post hæc egréssus ab Athénis, venit Corínthum:'
  "2": et invéniens quemdam Iudǽum nómine Aquilam, Pónticum génere, qui nuper vénerat ab Itália, et Priscíllam uxórem eius (eo quod præcepísset Cláudius discédere omnes Iudǽos a Roma), accéssit ad eos.
  "3": Et quia eiúsdem erat artis, manébat apud eos, et operabátur. (Erant autem scenofactóriæ artis.)
  "4": 'Et disputábat in synagóga per omne sábbatum, interpónens nomen Dómini Iesu: suadebátque Iudǽis, et Græcis.'
  "5": Cum veníssent autem de Macedónia Silas et Timótheus, instábat verbo Paulus, testíficans Iudǽis esse Christum Iesum.
  "6": 'Contradicéntibus autem eis, et blasphemántibus, excútiens vestiménta sua, dixit ad eos: Sanguis vester super caput vestrum: mundus ego, ex hoc ad gentes vadam.'
  "7": Et migrans inde, intrávit in domum cuiúsdam, nómine Titi Iusti, coléntis Deum, cuius domus erat coniúncta synagógæ.
  "8": 'Crispus autem archisynagógus crédidit Dómino cum omni domo sua: et multi Corinthiórum audiéntes credébant, et baptizabántur.'
  "9": 'Dixit autem Dóminus nocte per visiónem Paulo: Noli timére, sed lóquere, et ne táceas:'
  "10": 'propter quod ego sum tecum, et nemo apponétur tibi ut nóceat te: quóniam pópulus est mihi multus in hac civitáte.'
  "11": Sedit autem ibi annum et sex menses, docens apud eos verbum Dei.
  "12": Gallióne autem procónsule Acháiæ, insurrexérunt uno ánimo Iudǽi in Paulum, et adduxérunt eum ad tribúnal,
  "13": 'dicéntes: Quia contra legem hic persuádet homínibus cólere Deum.'
  "14": 'Incipiénte autem Paulo aperíre os, dixit Gállio ad Iudǽos: Si quidem esset iníquum áliquid aut fácinus péssimum, o viri Iudǽi, recte vos sustinérem.'
  "15": 'Si vero quæstiónes sunt de verbo, et nomínibus, et lege vestra, vos ipsi vidéritis: iudex ego horum nolo esse.'
  "16": Et minávit eos a tribunáli.
  "17": 'Apprehendéntes autem omnes Sósthenem príncipem synagógæ, percutiébant eum ante tribúnal: et nihil eórum Gallióni curæ erat.'
  "18": 'Paulus vero cum adhuc sustinuísset dies multos, frátribus valefáciens, navigávit in Sýriam (et cum eo Priscílla, et Aquila), qui sibi totónderat in Cenchris caput: habébat enim votum.'
  "19": Devenítque Ephesum, et illos ibi relíquit. Ipse vero ingréssus synagógam, disputábat cum Iudǽis.
  "20": Rogántibus autem eis ut amplióri témpore manéret, non consénsit,
  "21": 'sed valefáciens, et dicens: Iterum revértar ad vos, Deo volénte: proféctus est ab Epheso.'
  "22": Et descéndens Cæsaréam, ascéndit, et salutávit Ecclésiam, et descéndit Antiochíam.
  "23": Et facto ibi aliquánto témpore proféctus est, perámbulans ex órdine Galáticam regiónem, et Phrýgiam, confírmans omnes discípulos.
  "24": Iudǽus autem quidam, Apóllo nómine, Alexandrínus génere, vir éloquens, devénit Ephesum, potens in Scriptúris.
  "25": 'Hic erat edóctus viam Dómini: et fervens spíritu loquebátur, et docébat diligénter ea, quæ sunt Iesu, sciens tantum baptísma Ioánnis.'
  "26": Hic ergo cœpit fiduciáliter ágere in synagóga. Quem cum audíssent Priscílla et Aquila, assumpsérunt eum, et diligéntius exposuérunt ei viam Dómini.
  "27": Cum autem vellet ire Acháiam, exhortáti fratres, scripsérunt discípulis ut suscíperent eum. Qui cum venísset, cóntulit multum his, qui credíderant.
  "28": Veheménter enim Iudǽos revincébat públice, osténdens per Scriptúras, esse Christum Iesum.
