bible: vulgate
lang: la
language: Latina
book: Ioannes
chapter: "19"
verses:
  "1": Tunc ergo apprehéndit Pilátus Iesum, et flagellávit.
  "2": 'Et mílites plecténtes corónam de spinis, imposuérunt cápiti eius: et veste purpúrea circumdedérunt eum.'
  "3": 'Et veniébant ad eum, et dicébant: Ave rex Iudæórum: et dabant ei álapas.'
  "4": 'Exívit ergo íterum Pilátus foras, et dicit eis: Ecce addúco vobis eum foras, ut cognoscátis quia nullam invénio in eo causam.'
  "5": '(Exívit ergo Iesus portans corónam spíneam, et purpúreum vestiméntum.) Et dicit eis: Ecce homo.'
  "6": 'Cum ergo vidíssent eum pontífices, et minístri, clamábant, dicéntes: Crucifíge, crucifíge eum. Dicit eis Pilátus: Accípite eum vos, et crucifígite: ego enim non invénio in eo causam.'
  "7": 'Respondérunt ei Iudǽi: Nos legem habémus, et secúndum legem debet mori, quia Fílium Dei se fecit.'
  "8": Cum ergo audísset Pilátus hunc sermónem, magis tímuit.
  "9": 'Et ingréssus est prætórium íterum: et dixit ad Iesum: Unde es tu? Iesus autem respónsum non dedit ei.'
  "10": 'Dicit ergo ei Pilátus: Mihi non lóqueris? nescis quia potestátem hábeo crucifígere te, et potestátem hábeo dimíttere te?'
  "11": 'Respóndit Iesus: Non habéres potestátem advérsum me ullam, nisi tibi datum esset désuper. Proptérea qui me trádidit tibi, maius peccátum habet.'
  "12": 'Et exínde quærébat Pilátus dimíttere eum. Iudǽi autem clamábant dicéntes: Si hunc dimíttis, non es amícus Cǽsaris. Omnis enim, qui se regem facit, contradícit Cǽsari.'
  "13": 'Pilátus autem cum audísset hos sermónes, addúxit foras Iesum: et sedit pro tribunáli, in loco qui dícitur Lithóstrotos, hebráice autem Gábbatha.'
  "14": 'Erat autem parascéve Paschæ, hora quasi sexta, et dicit Iudǽis: Ecce rex vester.'
  "15": 'Illi autem clamábant: Tolle, tolle, crucifíge eum. Dicit eis Pilátus: Regem vestrum crucifígam? Respondérunt pontífices: Non habémus regem, nisi Cǽsarem.'
  "16": Tunc ergo trádidit eis illum ut crucifigerétur. Suscepérunt autem Iesum, et eduxérunt.
  "17": 'Et báiulans sibi crucem exívit in eum, qui dícitur Calváriæ locum, hebráice autem Gólgotha:'
  "18": ubi crucifixérunt eum, et cum eo álios duos hinc et hinc, médium autem Iesum.
  "19": 'Scripsit autem et títulum Pilátus, et pósuit super crucem. Erat autem scriptum: Iesus Nazarénus, Rex Iudæórum.'
  "20": 'Hunc ergo títulum multi Iudæórum legérunt: quia prope civitátem erat locus, ubi crucifíxus est Iesus, et erat scriptum hebráice, græce, et latíne.'
  "21": 'Dicébant ergo Piláto pontífices Iudæórum: Noli scríbere: Rex Iudæórum: sed quia ipse dixit: Rex sum Iudæórum.'
  "22": 'Respóndit Pilátus: Quod scripsi, scripsi.'
  "23": Mílites ergo cum crucifixíssent eum, accepérunt vestiménta eius (et fecérunt quátuor partes, unicuíque míliti partem), et túnicam. Erat autem túnica inconsútilis, désuper contéxta per totum.
  "24": 'Dixérunt ergo ad ínvicem: Non scindámus eam, sed sortiámur de illa cuius sit. Ut Scriptúra implerétur, dicens: Partíti sunt vestiménta mea sibi: et in vestem meam misérunt sortem. Et mílites quidem hæc fecérunt.'
  "25": Stabant autem iuxta crucem Iesu mater eius, et soror matris eius, María Cléophæ, et María Magdaléne.
  "26": 'Cum vidísset ergo Iesus matrem, et discípulum stantem, quem diligébat, dicit matri suæ: Múlier, ecce fílius tuus.'
  "27": 'Deínde dicit discípulo: Ecce mater tua. Et ex illa hora accépit eam discípulus in sua.'
  "28": 'Póstea sciens Iesus quia ómnia consummáta sunt, ut consummarétur Scriptúra, dixit: Sítio.'
  "29": Vas ergo erat pósitum acéto plenum. Illi autem spóngiam plenam acéto, hyssópo circumponéntes, obtulérunt ori eius.
  "30": 'Cum ergo accepísset Iesus acétum, dixit: Consummátum est. Et inclináto cápite trádidit spíritum.'
  "31": Iudǽi ergo (quóniam parascéve erat) ut non remanérent in cruce córpora sábbato (erat enim magnus dies ille sábbati), rogavérunt Pilátum ut frangeréntur eórum crura, et tolleréntur.
  "32": 'Venérunt ergo mílites: et primi quidem fregérunt crura, et altérius, qui crucifíxus est cum eo.'
  "33": Ad Iesum autem cum veníssent, ut vidérunt eum iam mórtuum, non fregérunt eius crura,
  "34": sed unus mílitum láncea latus eius apéruit, et contínuo exívit sanguis, et aqua.
  "35": 'Et qui vidit, testimónium perhíbuit: et verum est testimónium eius. Et ille scit quia vera dicit: ut et vos credátis.'
  "36": 'Facta sunt enim hæc ut Scriptúra implerétur: Os non comminuétis ex eo.'
  "37": 'Et íterum ália Scriptúra dicit: Vidébunt in quem transfixérunt.'
  "38": Post hæc autem rogávit Pilátum Ioseph ab Arimathǽa (eo quod esset discípulus Iesu, occúltus autem propter metum Iudæórum), ut tólleret corpus Iesu. Et permísit Pilátus. Venit ergo, et tulit corpus Iesu.
  "39": Venit autem et Nicodémus, qui vénerat ad Iesum nocte primum, ferens mixtúram myrrhæ, et áloes, quasi libras centum.
  "40": Accepérunt ergo corpus Iesu, et ligavérunt illud línteis cum aromátibus, sicut mos est Iudǽis sepelíre.
  "41": 'Erat autem in loco, ubi crucifíxus est, hortus: et in horto monuméntum novum, in quo nondum quisquam pósitus erat.'
  "42": Ibi ergo propter parascéven Iudæórum, quia iuxta erat monuméntum, posuérunt Iesum.
