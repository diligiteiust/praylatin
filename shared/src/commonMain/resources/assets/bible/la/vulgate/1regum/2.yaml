bible: vulgate
lang: la
language: Latina
book: I Regum
chapter: "2"
verses:
  "1": 'Appropinquavérunt autem dies David ut morerétur: præcepítque Salomóni fílio suo, dicens:'
  "2": 'Ego ingrédior viam univérsæ terræ: confortáre, et esto vir.'
  "3": 'Et obsérva custódias Dómini Dei tui, ut ámbules in viis eius: ut custódias cæremónias eius, et præcépta eius, et iudícia, et testimónia, sicut scriptum est in lege Móysi: ut intélligas univérsa quæ facis, et quocúmque te vérteris:'
  "4": 'ut confírmet Dóminus sermónes suos, quos locútus est de me, dicens: Si custodíerint fílii tui vias suas, et ambuláverint coram me in veritáte, in omni corde, suo et in omni ánima sua, non auferétur tibi vir de sólio Israel.'
  "5": 'Tu quoque nosti quæ fécerit mihi Ioab fílius Sárviæ, quæ fécerit duóbus princípibus exércitus Israel, Abner fílio Ner, et Amasæ fílio Iether: quos occídit, et effúdit sánguinem belli in pace, et pósuit cruórem prœ́lii in bálteo suo, qui erat circa lumbos eius, et in calceaménto suo, quod erat in pédibus eius.'
  "6": Fácies ergo iuxta sapiéntiam tuam, et non dedúces canítiem eius pacífice ad ínferos.
  "7": 'Sed et fíliis Berzellái Galaadítis reddes grátiam, erúntque comedéntes in mensa tua: occurrérunt enim mihi quando fugiébam a fácie Absalom fratris tui.'
  "8": 'Habes quoque apud te Sémei fílium Gera fílii Iémini de Bahúrim, qui maledíxit mihi maledictióne péssima, quando ibam ad Castra: sed quia descéndit mihi in occúrsum cum transírem Iordánem, et iurávi ei per Dóminum, dicens: Non te interfíciam gládio:'
  "9": tu noli pati eum esse innóxium. Vir autem sápiens es, ut scias quæ fácies ei, deducésque canos eius cum sánguine ad ínferos.
  "10": Dormívit ígitur David cum pátribus suis, et sepúltus est in civitáte David.
  "11": 'Dies autem, quibus regnávit David super Israel, quadragínta anni sunt: in Hebron regnávit septem annis: in Ierúsalem, trigínta tribus.'
  "12": Sálomon autem sedit super thronum David patris sui, et firmátum est regnum eius nimis.
  "13": 'Et ingréssus est Adonías fílius Haggith ad Bethsabée matrem Salomónis. Quæ dixit ei: Pacificúsne est ingréssus tuus? Qui respóndit: Pacíficus.'
  "14": 'Addidítque: Sermo mihi est ad te. Cui ait: Lóquere. Et ille:'
  "15": 'Tu, inquit, nosti, quia meum erat regnum, et me præposúerat omnis Israel sibi in regem: sed translátum est regnum, et factum est fratris mei: a Dómino enim constitútum est ei.'
  "16": 'Nunc ergo petitiónem unam precor a te: ne confúndas fáciem meam. Quæ dixit ad eum: Lóquere.'
  "17": 'Et ille ait: Precor ut dicas Salomóni regi (neque enim negáre tibi quidquam potest) ut det mihi Abisag Sunamítidem uxórem.'
  "18": 'Et ait Bethsabée: Bene: ego loquar pro te regi.'
  "19": 'Venit ergo Bethsabée ad regem Salomónem, ut loquerétur ei pro Adonía: et surréxit rex in occúrsum eius, adoravítque eam, et sedit super thronum suum: positúsque est thronus matri regis, quæ sedit ad déxteram eius.'
  "20": 'Dixítque ei: Petitiónem unam párvulam ego déprecor a te: ne confúndas fáciem meam. Et dixit ei rex: Pete mater mea: neque enim fas est ut avértam fáciem tuam.'
  "21": 'Quæ ait: Detur Abisag Sunamítis Adoníæ fratri tuo uxor.'
  "22": 'Respondítque rex Sálomon, et dixit matri suæ: Quare póstulas Abisag Sunamítidem Adoníæ? póstula ei et regnum: ipse est enim frater meus maior me, et habet Abíathar sacerdótem, et Ioab fílium Sárviæ.'
  "23": 'Iurávit ítaque rex Sálomon per Dóminum, dicens: Hæc fáciat mihi Deus, et hæc addat, quia contra ánimam suam locútus est Adonías verbum hoc.'
  "24": Et nunc vivit Dóminus, qui firmávit me, et collocávit me super sólium David patris mei, et qui fecit mihi domum, sicut locútus est, quia hódie occidétur Adonías.
  "25": Misítque rex Sálomon per manum Banaíæ fílii Ióiadæ, qui interfécit eum, et mórtuus est.
  "26": 'Abíathar quoque sacerdóti dixit rex: Vade in Anathoth ad agrum tuum: équidem vir mortis es: sed hódie te non interfíciam, quia portásti arcam Dómini Dei coram David patre meo, et sustinuísti labórem in ómnibus, in quibus laborávit pater meus.'
  "27": Eiécit ergo Sálomon Abíathar ut non esset sacérdos Dómini, ut implerétur sermo Dómini, quem locútus est super domum Heli in Silo.
  "28": 'Venit autem núntius ad Ioab, quod Ioab declinásset post Adoníam, et post Salomónem non declinásset: fugit ergo Ioab in tabernáculum Dómini, et apprehéndit cornu altáris.'
  "29": 'Nuntiatúmque est regi Salomóni quod fugísset Ioab in tabernáculum Dómini, et esset iuxta altáre: misítque Sálomon Banaíam fílium Ióiadæ, dicens: Vade, intérfice eum.'
  "30": 'Et venit Banaías ad tabernáculum Dómini, et dixit ei: Hæc dicit rex: Egrédere. Qui ait: Non egrédiar, sed hic móriar. Renuntiávit Banaías regi sermónem, dicens: Hæc locútus est Ioab, et hæc respóndit mihi.'
  "31": 'Dixítque ei rex: Fac sicut locútus est, et intérfice eum, et sépeli: et amovébis sánguinem innocéntem, qui effúsus est a Ioab, a me, et a domo patris mei.'
  "32": 'Et reddet Dóminus sánguinem eius super caput eius, quia interfécit duos viros iustos, meliorésque se: et occídit eos gládio, patre meo David ignoránte, Abner fílium Ner príncipem milítiæ Israel, et Amasam fílium Iether príncipem exércitus Iuda:'
  "33": et revertétur sanguis illórum in caput Ioab, et in caput séminis eius in sempitérnum. David autem et sémini eius, et dómui, et throno illíus, sit pax usque in ætérnum a Dómino.
  "34": 'Ascéndit ítaque Banaías fílius Ióiadæ, et aggréssus eum interfécit: sepultúsque est in domo sua in desérto.'
  "35": Et constítuit rex Banaíam fílium Ióiadæ pro eo super exércitum, et Sadoc sacerdótem pósuit pro Abíathar.
  "36": 'Misit quoque rex, et vocávit Sémei: dixítque ei: Ædífica tibi domum in Ierúsalem, et hábita ibi: et non egrediéris inde huc atque illuc.'
  "37": 'Quacúmque autem die egréssus fúeris, et transíeris torréntem Cedron, scito te interficiéndum: sanguis tuus erit super caput tuum.'
  "38": 'Dixítque Sémei regi: Bonus sermo: sicut locútus est dóminus meus rex, sic fáciet servus tuus. Habitávit ítaque Sémei in Ierúsalem diébus multis.'
  "39": 'Factum est autem post annos tres ut fúgerent servi Sémei ad Achis fílium Máacha regem Geth: nuntiatúmque est Sémei quod servi eius issent in Geth.'
  "40": Et surréxit Sémei, et stravit ásinum suum, ivítque ad Achis in Geth ad requiréndum servos suos, et addúxit eos de Geth.
  "41": Nuntiátum est autem Salomóni quod isset Sémei in Geth de Ierúsalem, et rediísset.
  "42": 'Et mittens vocávit eum, dixítque illi: Nonne testificátus sum tibi per Dóminum, et prædíxi tibi: Quacúmque die egréssus íeris huc et illuc, scito te esse moritúrum? Et respondísti mihi: Bonus sermo, quem audívi.'
  "43": Quare ergo non custodísti iusiurándum Dómini, et præcéptum quod præcéperam tibi?
  "44": 'Dixítque rex ad Sémei: Tu nosti omne malum, cuius tibi cónscium est cor tuum, quod fecísti David patri meo: réddidit Dóminus malítiam tuam in caput tuum.'
  "45": Et rex Sálomon benedíctus, et thronus David erit stábilis coram Dómino usque in sempitérnum.
  "46": 'Iussit ítaque rex Banaíæ fílio Ióiadæ: qui egréssus, percússit eum, et mórtuus est.'
