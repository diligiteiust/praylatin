bible: vulgate
lang: la
language: Latina
book: I Samuelis
chapter: "2"
verses:
  "1": 'Exsultávit cor meum in Dómino, et exaltátum est cornu meum in Deo meo: dilatátum est os meum super inimícos meos: quia lætáta sum in salutári tuo.'
  "2": 'Non est sanctus, ut est Dóminus: neque enim est álius extra te, et non est fortis sicut Deus noster.'
  "3": 'Nolíte multiplicáre loqui sublímia, gloriántes: recédant vétera de ore vestro: quia Deus scientiárum, Dóminus est, et ipsi præparántur cogitatiónes.'
  "4": Arcus fórtium superátus est, et infírmi accíncti sunt róbore.
  "5": 'Repléti prius, pro pánibus se locavérunt: et famélici saturáti sunt, donec stérilis péperit plúrimos: et quæ multos habébat fílios, infirmáta est.'
  "6": Dóminus mortíficat et vivíficat, dedúcit ad ínferos et redúcit.
  "7": Dóminus páuperem facit et ditat, humíliat et súblevat.
  "8": 'Súscitat de púlvere egénum, et de stércore élevat páuperem: ut sédeat cum princípibus, et sólium glóriæ téneat. Dómini enim sunt cárdines terræ, et pósuit super eos orbem.'
  "9": 'Pedes sanctórum suórum servábit, et ímpii in ténebris conticéscent: quia non in fortitúdine sua roborábitur vir.'
  "10": 'Dóminum formidábunt adversárii eius, et super ipsos in cælis tonábit: Dóminus iudicábit fines terræ, et dabit impérium regi suo, et sublimábit cornu christi sui.'
  "11": 'Et ábiit Elcana Rámatha, in domum suam: puer autem erat miníster in conspéctu Dómini ante fáciem Heli sacerdótis.'
  "12": Porro fílii Heli, fílii Bélial, nesciéntes Dóminum,
  "13": 'neque offícium sacerdótum ad pópulum: sed quicúmque immolásset víctimam, veniébat puer sacerdótis, dum coqueréntur carnes, et habébat fuscínulam tridéntem in manu sua,'
  "14": 'et mittébat eam in lebétem, vel in caldáriam, aut in ollam, sive in cácabum: et omne, quod levábat fuscínula, tollébat sacérdos sibi: sic faciébant univérso Israéli veniéntium in Silo.'
  "15": 'Etiam ántequam adolérent ádipem, veniébat puer sacerdótis, et dicébat immolánti: Da mihi carnem, ut coquam sacerdóti: non enim accípiam a te carnem coctam, sed crudam.'
  "16": 'Dicebátque illi ímmolans: Incendátur primum iuxta morem hódie adeps, et tolle tibi quantumcúmque desíderat ánima tua. Qui respóndens aiébat ei: Nequáquam: nunc enim dabis, alióquin tollam vi.'
  "17": 'Erat ergo peccátum puerórum grande nimis coram Dómino: quia retrahébant hómines a sacrifício Dómini.'
  "18": Sámuel autem ministrábat ante fáciem Dómini, puer accínctus ephod líneo.
  "19": Et túnicam parvam faciébat ei mater sua, quam afferébat statútis diébus, ascéndens cum viro suo, ut immoláret hóstiam solémnem.
  "20": 'Et benedíxit Heli Elcanæ et uxóri eius: dixítque ei: Reddat tibi Dóminus semen de mulíere hac, pro fœ́nore quod commodásti Dómino. Et abiérunt in locum suum.'
  "21": 'Visitávit ergo Dóminus Annam, et concépit, et péperit tres fílios, et duas fílias: et magnificátus est puer Sámuel apud Dóminum.'
  "22": 'Heli autem erat senex valde, et audívit ómnia quæ faciébant fílii sui univérso Israéli, et quómodo dormiébant cum muliéribus quæ observábant ad óstium tabernáculi:'
  "23": 'et dixit eis: Quare fácitis res huiuscémodi, quas ego áudio, res péssimas, ab omni pópulo?'
  "24": 'Nolíte fílii mei: non enim est bona fama, quam ego áudio, ut tránsgredi faciátis pópulum Dómini.'
  "25": 'Si peccáverit vir in virum, placári ei potest Deus: si autem in Dóminum peccáverit vir, quis orábit pro eo? Et non audiérunt vocem patris sui: quia vóluit Dóminus occídere eos.'
  "26": Puer autem Sámuel proficiébat, atque crescébat, et placébat tam Dómino quam homínibus.
  "27": 'Venit autem vir Dei ad Heli, et ait ad eum: Hæc dicit Dóminus: Numquid non apérte revelátus sum dómui patris tui, cum essent in Ægýpto in domo Pharaónis?'
  "28": 'Et elégi eum ex ómnibus tríbubus Israel mihi in sacerdótem, ut ascénderet ad altáre meum, et adoléret mihi incénsum, et portáret ephod coram me: et dedi dómui patris tui ómnia de sacrifíciis filiórum Israel.'
  "29": 'Quare calce abiecístis víctimam meam, et múnera mea quæ præcépi ut offerréntur in templo: et magis honorásti fílios tuos quam me, ut comederétis primítias omnis sacrifícii Israel pópuli mei?'
  "30": 'Proptérea ait Dóminus Deus Israel: Loquens locútus sum, ut domus tua, et domus patris tui, ministráret in conspéctu meo usque in sempitérnum. Nunc autem dicit Dóminus: Absit hoc a me: sed quicúmque glorificáverit me, glorificábo eum: qui autem contémnunt me, erunt ignóbiles.'
  "31": Ecce dies véniunt, et præcídam bráchium tuum, et bráchium domus patris tui, ut non sit senex in domo tua.
  "32": 'Et vidébis ǽmulum tuum in templo, in univérsis prósperis Israel: et non erit senex in domo tua ómnibus diébus.'
  "33": 'Verúmtamen non áuferam pénitus virum ex te ab altári meo: sed ut defíciant óculi tui, et tabéscat ánima tua: et pars magna domus tuæ moriétur cum ad virílem ætátem vénerit.'
  "34": 'Hoc autem erit tibi signum, quod ventúrum est duóbus fíliis tuis, Ophni et Phínees: In die uno moriéntur ambo.'
  "35": 'Et suscitábo mihi sacerdótem fidélem, qui iuxta cor meum et ánimam meam fáciet: et ædificábo ei domum fidélem, et ambulábit coram christo meo cunctis diébus.'
  "36": 'Futúrum est autem, ut quicúmque remánserit in domo tua, véniat ut orétur pro eo, et ófferat nummum argénteum, et tortam panis, dicátque: Dimítte me óbsecro ad unam partem sacerdotálem, ut cómedam buccéllam panis.'
