bible: vulgate
lang: la
language: Latina
book: Actus Apostolorum
chapter: "8"
verses:
  "1": Facta est autem in illa die persecútio magna in Ecclésia, quæ erat Ierosólymis, et omnes dispérsi sunt per regiónes Iudǽæ, et Samaríæ præter Apóstolos.
  "2": Curavérunt autem Stéphanum viri timoráti, et fecérunt planctum magnum super eum.
  "3": Saulus autem devastábat Ecclésiam per domos intrans, et trahens viros, ac mulíeres, tradébat in custódiam.
  "4": Igitur qui dispérsi erant pertransíbant, evangelizántes verbum Dei.
  "5": Philíppus autem descéndens in civitátem Samaríæ, prædicábat illis Christum.
  "6": Intendébant autem turbæ his, quæ a Philíppo dicebántur, unanímiter audiéntes, et vidéntes signa quæ faciébat.
  "7": Multi enim eórum, qui habébant spíritus immúndos, clamántes voce magna exíbant. Multi autem paralýtici, et claudi curáti sunt.
  "8": Factum est ergo gáudium magnum in illa civitáte.
  "9": 'Vir autem quidam nómine Simon, qui ante fúerat in civitáte magus, sedúcens gentem Samaríæ, dicens se esse áliquem magnum:'
  "10": 'cui auscultábant omnes a mínimo usque ad máximum, dicéntes: Hic est virtus Dei, quæ vocátur magna.'
  "11": 'Attendébant autem eum: propter quod multo témpore magíis suis dementásset eos.'
  "12": Cum vero credidíssent Philíppo evangelizánti de regno Dei, in nómine Iesu Christi baptizabántur viri, ac mulíeres.
  "13": 'Tunc Simon et ipse crédidit: et cum baptizátus esset, adhærébat Philíppo. Videns étiam signa, et virtútes máximas fíeri, stupens admirabátur.'
  "14": Cum autem audíssent Apóstoli, qui erant Ierosólymis, quod recepísset Samaría verbum Dei, misérunt ad eos Petrum, et Ioánnem.
  "15": 'Qui cum veníssent, oravérunt pro ipsis ut accíperent Spíritum sanctum:'
  "16": nondum enim in quemquam illórum vénerat, sed baptizáti tantum erant in nómine Dómini Iesu.
  "17": Tunc imponébant manus super illos, et accipiébant Spíritum sanctum.
  "18": Cum vidísset autem Simon quia per impositiónem manus Apostolórum darétur Spíritus sanctus, óbtulit eis pecúniam,
  "19": 'dicens: Date et mihi hanc potestátem, ut cuicúmque imposúero manus, accípiat Spíritum sanctum. Petrus autem dixit ad eum:'
  "20": 'Pecúnia tua tecum sit in perditiónem: quóniam donum Dei existimásti pecúnia possidéri.'
  "21": 'Non est tibi pars, neque sors in sermóne isto: cor enim tuum non est rectum coram Deo.'
  "22": 'Pœniténtiam ítaque age ab hac nequítia tua: et roga Deum, si forte remittátur tibi hæc cogitátio cordis tui.'
  "23": In felle enim amaritúdinis, et obligatióne iniquitátis vídeo te esse.
  "24": 'Respóndens autem Simon, dixit: Precámini vos pro me ad Dóminum, ut nihil véniat super me horum, quæ dixístis.'
  "25": Et illi quidem testificáti, et locúti verbum Dómini, redíbant Ierosólymam, et multis regiónibus Samaritanórum evangelizábant.
  "26": 'Angelus autem Dómini locútus est ad Philíppum, dicens: Surge, et vade contra meridiánum ad viam, quæ descéndit ab Ierúsalem in Gazam: hæc est desérta.'
  "27": 'Et surgens ábiit. Et ecce vir Æthiops, eunúchus, potens Cándacis regínæ Æthíopum, qui erat super omnes gazas eius, vénerat adoráre in Ierúsalem:'
  "28": et revertebátur sedens super currum suum, legénsque Isaíam prophétam.
  "29": 'Dixit autem Spíritus Philíppo: Accéde, et adiúnge te ad currum istum.'
  "30": 'Accúrrens autem Philíppus, audívit eum legéntem Isaíam prophétam, et dixit: Putásne intélligis quæ legis?'
  "31": 'Qui ait: Et quómodo possum, si non áliquis osténderit mihi? Rogavítque Philíppum ut ascénderet, et sedéret secum.'
  "32": 'Locus autem Scriptúræ, quam legébat, erat hic: Tamquam ovis ad occisiónem ductus est: et sicut agnus coram tondénte se, sine voce, sic non apéruit os suum.'
  "33": In humilitáte iudícium eius sublátum est. Generatiónem eius quis enarrábit, quóniam tollétur de terra vita eius?
  "34": 'Respóndens autem eunúchus Philíppo, dixit: Obsecro te, de quo prophéta dicit hoc? de se, an de álio áliquo?'
  "35": Apériens autem Philíppus os suum, et incípiens a Scriptúra ista, evangelizávit illi Iesum.
  "36": 'Et dum irent per viam, venérunt ad quamdam aquam: et ait eunúchus: Ecce aqua, quid próhibet me baptizári?'
  "37": 'Dixit autem Philíppus: Si credis ex toto corde, licet. Et respóndens ait: Credo, Fílium Dei esse Iesum Christum.'
  "38": 'Et iussit stare currum: et descendérunt utérque in aquam, Philíppus, et eunúchus, et baptizávit eum.'
  "39": Cum autem ascendíssent de aqua, Spíritus Dómini rápuit Philíppum, et ámplius non vidit eum eunúchus. Ibat autem per viam suam gaudens.
  "40": Philíppus autem invéntus est in Azóto, et pertránsiens evangelizábat civitátibus cunctis, donec veníret Cæsaréam.
