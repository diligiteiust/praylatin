bible: vulgate
lang: la
language: Latina
book: Ecclesiasticus
chapter: "21"
verses:
  "1": 'Fili peccásti? non adícias íterum: sed et de prístinis deprecáre, ut tibi dimittántur.'
  "2": 'Quasi a fácie cólubri fuge peccáta: et si accésseris ad illa, suscípient te.'
  "3": Dentes leónis dentes eius, interficiéntes ánimas hóminum.
  "4": Quasi rhomphǽa bis acúta omnis iníquitas, plagæ illíus non est sánitas.
  "5": 'Obiurgátio et iniúriæ annullábunt substántiam: et domus quæ nimis lócuples est annullábitur supérbia: sic substántia supérbi eradicábitur.'
  "6": Deprecátio páuperis ex ore usque ad aures eius pervéniet, et iudícium festináto advéniet illi.
  "7": 'Qui odit correptiónem, vestígium est peccatóris: et qui timet Deum, convertétur ad cor suum.'
  "8": 'Notus a longe potens lingua audáci: et sensátus scit labi se ab ipso.'
  "9": Qui ædíficat domum suam impéndiis aliénis, quasi qui cólligat lápides suos in híeme.
  "10": Stupa collécta synagóga peccántium, et consummátio illórum flamma ignis.
  "11": 'Via peccatórum complanáta lapídibus: et in fine illórum ínferi, et ténebræ, et pœnæ.'
  "12": Qui custódit iustítiam, continébit sensum eius.
  "13": Consummátio timóris Dei, sapiéntia et sensus.
  "14": Non erudiétur qui non est sápiens in bono.
  "15": 'Est autem sapiéntia, quæ abúndat in malo: et non est sensus ubi est amaritúdo.'
  "16": Sciéntia sapiéntis tamquam inundátio abundábit, et consílium illíus sicut fons vitæ pérmanet.
  "17": Cor fátui quasi vas confráctum, et omnem sapiéntiam non tenébit.
  "18": 'Verbum sápiens quodcúmque audíerit scius laudábit, et ad se adíciet: audívit luxuriósus, et displicébit illi, et proíciet illud post dorsum suum.'
  "19": 'Narrátio fátui quasi sárcina in via: nam in lábiis sensáti inveniétur grátia.'
  "20": Os prudéntis quǽritur in ecclésia, et verba illíus cogitábunt in córdibus suis.
  "21": 'Tamquam domus extermináta, sic fátuo sapiéntia: et sciéntia insensáti inenarrabília verba.'
  "22": 'Cómpedes in pédibus, stulto doctrína: et quasi víncula mánuum super manum dextram.'
  "23": 'Fátuus in risu exáltat vocem suam: vir autem sápiens vix tácite ridébit.'
  "24": Ornaméntum áureum prudénti doctrína, et quasi brachiále in bráchio dextro.
  "25": 'Pes fátui fácilis in domum próximi: et homo perítus confundétur a persóna poténtis.'
  "26": 'Stultus a fenéstra respíciet in domum: vir autem erudítus foris stabit.'
  "27": 'Stultítia hóminis auscultáre per óstium: et prudens gravábitur contumélia.'
  "28": 'Lábia imprudéntium stulta narrábunt: verba autem prudéntium statéra ponderabúntur.'
  "29": 'In ore fatuórum cor illórum: et in corde sapiéntium os illórum.'
  "30": Dum maledícit ímpius diábolum, maledícit ipse ánimam suam.
  "31": 'Susúrro coinquinábit ánimam suam, et in ómnibus odiétur: et qui cum eo mánserit, odiósus erit: tácitus et sensátus honorábitur.'
