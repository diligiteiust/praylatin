bible: vulgate
lang: la
language: Latina
book: Exodus
chapter: "29"
verses:
  "1": Sed et hoc fácies, ut mihi in sacerdótio consecréntur. Tolle vítulum de arménto, et aríetes duos immaculátos,
  "2": 'panésque ázymos, et crústulam absque ferménto, quæ conspérsa sit óleo, lágana quoque ázyma óleo lita: de símila tritícea cuncta fácies.'
  "3": 'Et pósita in canístro ófferes: vítulum autem et duos aríetes.'
  "4": Et Aaron ac fílios eius applicábis ad óstium tabernáculi testimónii. Cumque láveris patrem cum fíliis suis aqua,
  "5": índues Aaron vestiméntis suis, id est, línea et túnica, et superhumeráli et rationáli, quod constrínges bálteo.
  "6": Et pones tiáram in cápite eius, et láminam sanctam super tiáram,
  "7": 'et óleum unctiónis fundes super caput eius: atque hoc ritu consecrábitur.'
  "8": Fílios quoque illíus applicábis, et índues túnicis líneis, cingésque bálteo,
  "9": 'Aaron scílicet et líberos eius, et impónes eis mitras: erúntque sacerdótes mihi religióne perpétua. Postquam initiáveris manus eórum,'
  "10": applicábis et vítulum coram tabernáculo testimónii. Imponéntque Aaron et fílii eius manus super caput illíus,
  "11": et mactábis eum in conspéctu Dómini, iuxta óstium tabernáculi testimónii.
  "12": Sumptúmque de sánguine vítuli, pones super córnua altáris dígito tuo, réliquum autem sánguinem fundes iuxta basim eius.
  "13": 'Sumes et ádipem totum qui óperit intestína, et retículum iécoris, ac duos renes, et ádipem qui super eos est, et ófferes incénsum super altáre:'
  "14": carnes vero vítuli et córium et fimum combúres foris extra castra, eo quod pro peccáto sit.
  "15": Unum quoque aríetem sumes, super cuius caput ponent Aaron et fílii eius manus.
  "16": Quem cum mactáveris, tolles de sánguine eius, et fundes circa altáre.
  "17": 'Ipsum autem aríetem secábis in frusta: lotáque intestína eius ac pedes, pones super concísas carnes, et super caput illíus.'
  "18": 'Et ófferes totum aríetem in incénsum super altáre: oblátio est Dómino, odor suavíssimus víctimæ Dómini.'
  "19": Tolles quoque aríetem álterum, super cuius caput Aaron et fílii eius ponent manus.
  "20": Quem cum immoláveris, sumes de sánguine eius, et pones super extrémum aurículæ dextræ Aaron et filiórum eius, et super póllices manus eórum ac pedis dextri, fundésque sánguinem super altáre per circúitum.
  "21": Cumque túleris de sánguine qui est super altáre, et de óleo unctiónis, aspérges Aaron et vestes eius, fílios et vestiménta eórum. Consecratísque ipsis et véstibus,
  "22": 'tolles ádipem de aríete, et caudam et arvínam, quæ óperit vitália, ac retículum iécoris, et duos renes, atque ádipem, qui super eos est, armúmque dextrum, eo quod sit áries consecratiónis:'
  "23": 'tortámque panis uníus, crústulam conspérsam óleo, láganum de canístro azymórum, quod pósitum est in conspéctu Dómini:'
  "24": ponésque ómnia super manus Aaron et filiórum eius, et sanctificábis eos élevans coram Dómino.
  "25": 'Suscipiésque univérsa de mánibus eórum: et incéndes super altáre in holocáustum, odórem suavíssimum in conspéctu Dómini, quia oblátio eius est.'
  "26": Sumes quoque pectúsculum de aríete, quo initiátus est Aaron, sanctificabísque illud elevátum coram Dómino, et cedet in partem tuam.
  "27": Sanctificabísque et pectúsculum consecrátum, et armum quem de aríete separásti,
  "28": 'quo initiátus est Aaron et fílii eius, cedéntque in partem Aaron et filiórum eius iure perpétuo a fíliis Israel: quia primitíva sunt et inítia de víctimis eórum pacíficis quæ ófferunt Dómino.'
  "29": Vestem autem sanctam, qua utétur Aaron, habébunt fílii eius post eum, ut ungántur in ea, et consecréntur manus eórum.
  "30": Septem diébus utétur illa qui póntifex pro eo fúerit constitútus de fíliis eius, et qui ingrediétur tabernáculum testimónii ut minístret in sanctuário.
  "31": 'Aríetem autem consecratiónis tolles, et coques carnes eius in loco sancto:'
  "32": quibus vescétur Aaron et fílii eius. Panes quoque, qui sunt in canístro, in vestíbulo tabernáculi testimónii cómedent,
  "33": ut sit placábile sacrifícium, et sanctificéntur offeréntium manus. Alienígena non vescétur ex eis, quia sancti sunt.
  "34": 'Quod si remánserit de cárnibus consecrátis, sive de pánibus usque mane, combúres relíquias igni: non comedéntur, quia sanctificáta sunt.'
  "35": 'Omnia, quæ præcépi tibi, fácies super Aaron et fíliis eius. Septem diébus consecrábis manus eórum:'
  "36": et vítulum pro peccáto ófferes per síngulos dies ad expiándum. Mundabísque altáre cum immoláveris expiatiónis hóstiam, et unges illud in sanctificatiónem.
  "37": 'Septem diébus expiábis altáre, et sanctificábis, et erit Sanctum sanctórum: omnis, qui tetígerit illud, sanctificábitur.'
  "38": 'Hoc est quod fácies in altári: Agnos annículos duos per síngulos dies iúgiter,'
  "39": unum agnum mane, et álterum véspere,
  "40": décimam partem símilæ conspérsæ óleo tuso, quod hábeat mensúram quartam partem hin, et vinum ad libándum eiúsdem mensúræ in agno uno.
  "41": 'Alterum vero agnum ófferes ad vésperam iuxta ritum matutínæ oblatiónis, et iuxta ea quæ díximus, in odórem suavitátis:'
  "42": sacrifícium est Dómino, oblatióne perpétua in generatiónes vestras, ad óstium tabernáculi testimónii coram Dómino, ubi constítuam ut loquar ad te.
  "43": Ibíque præcípiam fíliis Israel, et sanctificábitur altáre in glória mea.
  "44": Sanctificábo et tabernáculum testimónii cum altári, et Aaron cum fíliis suis, ut sacerdótio fungántur mihi.
  "45": Et habitábo in médio filiórum Israel, eróque eis Deus,
  "46": et scient quia ego Dóminus Deus eórum, qui edúxi eos de terra Ægýpti, ut manérem inter illos, ego Dóminus Deus ipsórum.
