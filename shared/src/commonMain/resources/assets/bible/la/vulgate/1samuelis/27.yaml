bible: vulgate
lang: la
language: Latina
book: I Samuelis
chapter: "27"
verses:
  "1": 'Et ait David in corde suo: Aliquándo íncidam una die in manus Saul: nonne mélius est ut fúgiam, et salver in terra Philisthinórum, ut despéret Saul, cessétque me quǽrere in cunctis fínibus Israel? fúgiam ergo manus eius.'
  "2": Et surréxit David, et ábiit ipse, et sexcénti viri cum eo, ad Achis fílium Maoch regem Geth.
  "3": 'Et habitávit David cum Achis in Geth, ipse et viri eius: vir et domus eius: et David, et duæ uxóres eius, Achínoam Iezrahelítis, et Abígail uxor Nabal Carméli.'
  "4": Et nuntiátum est Sauli quod fugísset David in Geth, et non áddidit ultra quǽrere eum.
  "5": 'Dixit autem David ad Achis: Si invéni grátiam in óculis tuis, detur mihi locus in una úrbium regiónis huius, ut hábitem ibi: cur enim manet servus tuus in civitáte regis tecum?'
  "6": 'Dedit ítaque ei Achis in die illa Síceleg: propter quam causam facta est Síceleg regum Iuda usque in diem hanc.'
  "7": Fuit autem númerus diérum, quibus habitávit David in regióne Philisthinórum, quátuor ménsium.
  "8": 'Et ascéndit David, et viri eius, et agébant prædas de Géssuri, et de Gerzi, et de Amalecítis: hi enim pagi habitabántur in terra antíquitus, eúntibus Sur usque ad terram Ægýpti.'
  "9": 'Et percutiébat David omnem terram, nec relinquébat vivéntem virum et mulíerem: tollénsque oves, et boves, et ásinos, et camélos, et vestes, revertebátur, et veniébat ad Achis.'
  "10": 'Dicébat autem ei Achis: In quem irruísti hódie? Respondébat David: Contra merídiem Iudæ, et contra merídiem Ierámeel, et contra merídiem Ceni.'
  "11": 'Virum et mulíerem non vivificábat David, nec adducébat in Geth, dicens: Ne forte loquántur advérsum nos: Hæc fecit David: et hoc erat decrétum illi ómnibus diébus quibus habitávit in regióne Philisthinórum.'
  "12": 'Crédidit ergo Achis David, dicens: Multa mala operátus est contra pópulum suum Israel: erit ígitur mihi servus sempitérnus.'
