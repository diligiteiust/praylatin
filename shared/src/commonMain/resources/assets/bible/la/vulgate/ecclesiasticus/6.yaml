bible: vulgate
lang: la
language: Latina
book: Ecclesiasticus
chapter: "6"
verses:
  "1": 'Noli fíeri pro amíco inimícus próximo: impropérium enim et contuméliam malus hereditábit, et omnis peccátor ínvidus et bilínguis.'
  "2": 'Non te extóllas in cogitatióne ánimæ tuæ velut taurus, ne forte elidátur virtus tua per stultítiam:'
  "3": et fólia tua cómedat, et fructus tuos perdat, et relinquáris velut lignum áridum in erémo.
  "4": Anima enim nequam dispérdet qui se habet, et in gáudium inimícis dat illum, et dedúcet in sortem impiórum.
  "5": 'Verbum dulce multíplicat amícos, et mítigat inimícos: et lingua éucharis in bono hómine abúndat.'
  "6": 'Multi pacífici sint tibi: et consiliárius sit tibi unus de mille.'
  "7": Si póssides amícum, in tentatióne pósside eum, et ne fácile credas ei.
  "8": Est enim amícus secúndum tempus suum, et non permanébit in die tribulatiónis.
  "9": 'Et est amícus, qui convértitur ad inimicítiam: et est amícus, qui ódium et rixam, et convítia denudábit.'
  "10": Est autem amícus sócius mensæ, et non permanébit in die necessitátis.
  "11": 'Amícus si permánserit fixus, erit tibi quasi coæquális, et in domésticis tuis fiduciáliter aget:'
  "12": si humiliáverit se contra te, et a fácie tua abscónderit se, unánimem habébis amicítiam bonam.
  "13": Ab inimícis tuis separáre, et ab amícis tuis atténde.
  "14": 'Amícus fidélis, protéctio fortis: qui autem invénit illum, invénit thesáurum.'
  "15": Amíco fidéli nulla est comparátio, et non est digna ponderátio auri et argénti contra bonitátem fídei illíus.
  "16": 'Amícus fidélis, medicaméntum vitæ et immortalitátis: et qui métuunt Dóminum, invénient illum.'
  "17": 'Qui timet Deum, æque habébit amicítiam bonam: quóniam secúndum illum erit amícus illíus.'
  "18": Fili a iuventúte tua éxcipe doctrínam, et usque ad canos invénies sapiéntiam.
  "19": 'Quasi is qui arat, et séminat, accéde ad eam, et sústine bonos fructus illíus:'
  "20": in ópere enim ipsíus exíguum laborábis, et cito edes de generatiónibus illíus.
  "21": Quam áspera est nímium sapiéntia indóctis homínibus, et non permanébit in illa excors.
  "22": Quasi lápidis virtus probátio erit in illis, et non demorabúntur proícere illam.
  "23": 'Sapiéntia enim doctrínæ secúndum nomen est eius, et non est multis manifésta: quibus autem cógnita est, pérmanet usque ad conspéctum Dei.'
  "24": Audi fili, et áccipe consílium intelléctus, et ne abícias consílium meum.
  "25": 'Inice pedem tuum in cómpedes illíus, et in torques illíus collum tuum:'
  "26": súbice húmerum tuum, et porta illam, et ne acediéris vínculis eius.
  "27": In omni ánimo tuo accéde ad illam, et in omni virtúte tua consérva vias eius.
  "28": 'Investíga illam, et manifestábitur tibi, et cóntinens factus, ne derelínquas eam:'
  "29": in novíssimis enim invénies réquiem in ea, et convertétur tibi in oblectatiónem.
  "30": 'Et erunt tibi cómpedes eius in protectiónem fortitúdinis, et bases virtútis, et torques illíus in stolam glóriæ:'
  "31": decor enim vitæ est in illa, et víncula illíus alligatúra salutáris.
  "32": Stolam glóriæ índues eam, et corónam gratulatiónis superpónes tibi.
  "33": 'Fili, si atténderis mihi, disces: et si accommodáveris ánimum tuum, sápiens eris.'
  "34": 'Si inclináveris aurem tuam, excípies doctrínam: et si diléxeris audíre, sápiens eris.'
  "35": In multitúdine presbyterórum prudéntium sta, et sapiéntiæ illórum ex corde coniúngere, ut omnem narratiónem Dei possis audíre, et provérbia laudis non effúgiant a te.
  "36": Et si víderis sensátum, evígila ad eum, et gradus ostiórum illíus éxterat pes tuus.
  "37": 'Cogitátum tuum habe in præcéptis Dei, et in mandátis illíus máxime assíduus esto: et ipse dabit tibi cor, et concupiscéntia sapiéntiæ dábitur tibi.'
