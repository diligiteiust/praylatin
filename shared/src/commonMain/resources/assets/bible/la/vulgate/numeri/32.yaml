bible: vulgate
lang: la
language: Latina
book: Numeri
chapter: "32"
verses:
  "1": Fílii autem Ruben et Gad habébant pécora multa, et erat illis in iuméntis infiníta substántia. Cumque vidíssent Iazer et Gálaad aptas animálibus aléndis terras,
  "2": 'venérunt ad Móysen, et ad Eleázarum sacerdótem, et príncipes multitúdinis, atque dixérunt:'
  "3": Ataroth, et Dibon, et Iazer, et Nemra, Hésebon, et Eleále, et Saban, et Nebo, et Beon,
  "4": 'terra, quam percússit Dóminus in conspéctu filiórum Israel, régio ubérrima est ad pastum animálium: et nos servi tui habémus iuménta plúrima:'
  "5": precamúrque si invénimus grátiam coram te, ut des nobis fámulis tuis eam in possessiónem, nec fácias nos transíre Iordánem.
  "6": 'Quibus respóndit Móyses: Numquid fratres vestri ibunt ad pugnam, et vos hic sedébitis?'
  "7": Cur subvértitis mentes filiórum Israel, ne transíre áudeant in locum, quem eis datúrus est Dóminus?
  "8": Nonne ita egérunt patres vestri, quando misi de Cadesbárne ad explorándam terram?
  "9": Cumque veníssent usque ad Vallem botri, lustráta omni regióne, subvertérunt cor filiórum Israel, ut non intrárent fines, quos eis Dóminus dedit.
  "10": 'Qui irátus iurávit, dicens:'
  "11": 'Si vidébunt hómines isti, qui ascendérunt ex Ægýpto a vigínti annis et supra, terram, quam sub iuraménto pollícitus sum Abraham, Isaac, et Iacob: et noluérunt sequi me,'
  "12": 'præter Caleb fílium Iéphone Cenezǽum, et Iósue fílium Nun: isti implevérunt voluntátem meam.'
  "13": Iratúsque Dóminus advérsum Israel, circumdúxit eum per desértum quadragínta annis, donec consumerétur univérsa generátio, quæ fécerat malum in conspéctu eius.
  "14": Et ecce, inquit, vos surrexístis pro pátribus vestris, increménta et alúmni hóminum peccatórum, ut augerétis furórem Dómini contra Israel.
  "15": Quod si noluéritis sequi eum, in solitúdine pópulum derelínquet, et vos causa éritis necis ómnium.
  "16": 'At illi prope accedéntes, dixérunt: Caulas óvium fabricábimus, et stábula iumentórum, párvulis quoque nostris urbes munítas:'
  "17": nos autem ipsi armáti et accíncti pergémus ad prœ́lium ante fílios Israel, donec introducámus eos ad loca sua. Párvuli nostri, et quidquid habére póssumus, erunt in úrbibus murátis, propter habitatórum insídias.
  "18": 'Non revertémur in domos nostras, usque dum possídeant fílii Israel hereditátem suam:'
  "19": nec quidquam quærémus trans Iordánem, quia iam habémus nostram possessiónem in orientáli eius plaga.
  "20": 'Quibus Móyses ait: Si fácitis quod promíttitis, expedíti pérgite coram Dómino ad pugnam:'
  "21": et omnis vir bellátor armátus Iordánem tránseat, donec subvértat Dóminus inimícos suos,
  "22": 'et subiciátur ei omnis terra: tunc éritis inculpábiles apud Dóminum et apud Israel, et obtinébitis regiónes, quas vultis, coram Dómino.'
  "23": 'Sin autem quod dícitis, non fecéritis, nulli dúbium est quin peccétis in Deum: et scitóte quóniam peccátum vestrum apprehéndet vos.'
  "24": 'Ædificáte ergo urbes párvulis vestris, et caulas, et stábula óvibus ac iuméntis: et quod pollíciti estis, impléte.'
  "25": 'Dixerúntque fílii Gad et Ruben ad Móysen: Servi tui sumus: faciémus quod iubet dóminus noster.'
  "26": 'Párvulos nostros, et mulíeres, et pécora, ac iuménta relinquémus in úrbibus Gálaad:'
  "27": nos autem fámuli tui omnes expedíti pergémus ad bellum, sicut tu dómine lóqueris.
  "28": 'Præcépit ergo Móyses Eleázaro sacerdóti, et Iósue fílio Nun, et princípibus familiárum per tribus Israel, et dixit ad eos:'
  "29": Si transíerint fílii Gad, et fílii Ruben vobíscum Iordánem omnes armáti ad bellum coram Dómino, et vobis fúerit terra subiécta, date eis Gálaad in possessiónem.
  "30": Sin autem nolúerint transíre armáti vobíscum in terram Chánaan, inter vos habitándi accípiant loca.
  "31": 'Responderúntque fílii Gad, et fílii Ruben: Sicut locútus est Dóminus servis suis, ita faciémus:'
  "32": ipsi armáti pergémus coram Dómino in terram Chánaan, et possessiónem iam suscepísse nos confitémur trans Iordánem.
  "33": Dedit ítaque Móyses fíliis Gad et Ruben, et dimídiæ tríbui Manásse fílii Ioseph, regnum Sehon regis Amorrhǽi, et regnum Og regis Basan, et terram eórum cum úrbibus suis per circúitum.
  "34": Igitur exstruxérunt fílii Gad, Dibon, et Ataroth, et Aroer,
  "35": et Etroth, et Sophan, et Iazer, et Iégbaa,
  "36": et Bethnémra, et Bétharan, urbes munítas, et caulas pecóribus suis.
  "37": Fílii vero Ruben ædificavérunt Hésebon, et Eleále, et Cariáthaim,
  "38": 'et Nabo, et Baálmeon versis nomínibus, Sábama quoque: imponéntes vocábula úrbibus, quas exstrúxerant.'
  "39": Porro fílii Machir fílii Manásse, perrexérunt in Gálaad, et vastavérunt eam interfécto Amorrhǽo habitatóre eius.
  "40": Dedit ergo Móyses terram Gálaad Machir fílio Manásse, qui habitávit in ea.
  "41": Iair autem fílius Manásse ábiit, et occupávit vicos eius, quos appellávit Havoth Iair, id est, Villas Iair.
  "42": 'Nobe quoque perréxit, et apprehéndit Chanath cum vículis suis: vocavítque eam ex nómine suo Nobe.'
