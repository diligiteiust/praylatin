bible: vulgate
lang: la
language: Latina
book: I Paralipomenon
chapter: "19"
verses:
  "1": Accidit autem ut morerétur Naas rex filiórum Ammon, et regnáret fílius eius pro eo.
  "2": 'Dixítque David: Fáciam misericórdiam cum Hanon fílio Naas: prǽstitit enim mihi pater eius grátiam. Misítque David núntios ad consolándum eum super morte patris sui. Qui cum perveníssent in terram filiórum Ammon, ut consolaréntur Hanon,'
  "3": 'dixérunt príncipes filiórum Ammon ad Hanon: Tu fórsitan putas, quod David honóris causa in patrem tuum míserit qui consoléntur te: nec animadvértis quod ut explórent, et investígent, et scruténtur terram tuam, vénerint ad te servi eius.'
  "4": Igitur Hanon púeros David decalvávit, et rasit, et præcídit túnicas eórum a nátibus usque ad pedes, et dimísit eos.
  "5": Qui cum abiíssent, et hoc mandássent David, misit in occúrsum eórum (grandem enim contuméliam sustinúerant) et præcépit ut manérent in Iéricho, donec crésceret barba eórum, et tunc reverteréntur.
  "6": Vidéntes autem fílii Ammon quod iniúriam fecíssent David, tam Hanon, quam réliquus pópulus, misérunt mille talénta argénti, ut condúcerent sibi de Mesopotámia, et de Sýria Máacha, et de Soba currus et équites.
  "7": Conduxerúntque trigínta duo míllia cúrruum, et regem Máacha cum pópulo eius. Qui cum veníssent, castrametáti sunt e regióne Médaba. Fílii quoque Ammon congregáti de úrbibus suis, venérunt ad bellum.
  "8": 'Quod cum audísset David, misit Ioab, et omnem exércitum virórum fórtium:'
  "9": 'egressíque fílii Ammon, direxérunt áciem iuxta portam civitátis: reges autem, qui ad auxílium eius vénerant, separátim in agro stetérunt.'
  "10": Igitur Ioab, intélligens bellum ex advérso et post tergum contra se fíeri, elégit viros fortíssimos de univérso Israel, et perréxit contra Syrum.
  "11": 'Réliquam autem partem pópuli dedit sub manu Abísai fratris sui: et perrexérunt contra fílios Ammon.'
  "12": 'Dixítque: Si vícerit me Syrus, auxílio eris mihi: si autem superáverint te fílii Ammon, ero tibi in præsídium.'
  "13": 'Confortáre, et agámus viríliter pro pópulo nostro, et pro úrbibus Dei nostri: Dóminus autem, quod in conspéctu suo bonum est, fáciet.'
  "14": 'Perréxit ergo Ioab, et pópulus qui cum eo erat, contra Syrum ad prœ́lium: et fugávit eos.'
  "15": 'Porro fílii Ammon vidéntes quod fugísset Syrus, ipsi quoque fugérunt Abísai fratrem eius, et ingréssi sunt civitátem: reversúsque est étiam Ioab in Ierúsalem.'
  "16": 'Videns autem Syrus quod cecidísset coram Israel, misit núntios, et addúxit Syrum, qui erat trans flúvium: Sophach autem princeps milítiæ Adarézer, erat dux eórum.'
  "17": Quod cum nuntiátum esset David, congregávit univérsum Israel, et transívit Iordánem, irruítque in eos, et diréxit ex advérso áciem, illis contra pugnántibus.
  "18": 'Fugit autem Syrus Israel: et interfécit David de Syris septem míllia cúrruum, et quadragínta míllia péditum, et Sophach exércitus príncipem.'
  "19": 'Vidéntes autem servi Adarézer se ab Israel esse superátos, transfugérunt ad David, et serviérunt ei: noluítque ultra Sýria auxílium præbére fíliis Ammon.'
