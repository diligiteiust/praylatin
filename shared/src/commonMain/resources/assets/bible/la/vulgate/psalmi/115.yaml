bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "115"
verses:
  "1": 'Allelúia. Crédidi, propter quod locútus sum: ego autem humiliátus sum nimis.'
  "2": 'Ego dixi in excéssu meo: Omnis homo mendax.'
  "3": Quid retríbuam Dómino, pro ómnibus quæ retríbuit mihi?
  "4": 'Cálicem salutáris accípiam: et nomen Dómini invocábo.'
  "5": 'Vota mea Dómino reddam coram omni pópulo eius:'
  "6": pretiósa in conspéctu Dómini mors sanctórum eius.
  "7": 'O Dómine quia ego servus tuus: ego servus tuus, et fílius ancíllæ tuæ. Dirupísti víncula mea:'
  "8": tibi sacrificábo hóstiam laudis, et nomen Dómini invocábo.
  "9": 'Vota mea Dómino reddam in conspéctu omnis pópuli eius:'
  "10": in átriis domus Dómini, in médio tui Ierúsalem.
