bible: vulgate
lang: la
language: Latina
book: Nehemiae
chapter: "3"
verses:
  "1": 'Et surréxit Elíasib sacérdos magnus, et fratres eius sacerdótes, et ædificavérunt portam gregis: ipsi sanctificavérunt eam, et statuérunt valvas eius, et usque ad turrim centum cubitórum sanctificavérunt eam, usque ad turrim Hanáneel.'
  "2": 'Et iuxta eum ædificavérunt viri Iéricho: et iuxta eum ædificávit Zachur fílius Amri.'
  "3": 'Portam autem píscium ædificavérunt fílii Asnaa: ipsi texérunt eam, et statuérunt valvas eius, et seras, et vectes. Et iuxta eos ædificávit Márimuth fílius Uríæ, fílii Accus.'
  "4": 'Et iuxta eum ædificávit Mosóllam fílius Barachíæ, fílii Mesézebel: et iuxta eos ædificávit Sadoc fílius Báana.'
  "5": 'Et iuxta eos ædificavérunt Thecuéni: optimátes autem eórum non supposuérunt colla sua in ópere Dómini sui.'
  "6": 'Et portam véterem ædificavérunt Ióiada fílius Phásea, et Mosóllam fílius Besodía: ipsi texérunt eam, et statuérunt valvas eius, et seras, et vectes.'
  "7": Et iuxta eos ædificavérunt Meltías Gabaonítes, et Iadon Meronathítes, viri de Gábaon et Maspha, pro duce qui erat in regióne trans flumen.
  "8": 'Et iuxta eum ædificávit Eziel fílius Araía áurifex: et iuxta eum ædificávit Ananías fílius pigmentárii: et dimisérunt Ierúsalem usque ad murum platéæ latióris.'
  "9": Et iuxta eum ædificávit Raphaía fílius Hur, princeps vici Ierúsalem.
  "10": 'Et iuxta eum ædificávit Iedaía fílius Harómaph contra domum suam: et iuxta eum ædificávit Hattus fílius Haseboníæ.'
  "11": Médiam partem vici ædificávit Melchías fílius Herem, et Hasub fílius Phahath Moab, et turrim furnórum.
  "12": Et iuxta eum ædificávit Sellum fílius Alohes, princeps médiæ partis vici Ierúsalem, ipse et fíliæ eius.
  "13": 'Et portam vallis ædificávit Hanun, et habitatóres Zánoe: ipsi ædificavérunt eam, et statuérunt valvas eius, et seras, et vectes, et mille cúbitos in muro usque ad portam sterquilínii.'
  "14": 'Et portam sterquilínii ædificávit Melchías fílius Rechab, princeps vici Bethácharam: ipse ædificávit eam, et státuit valvas eius, et seras, et vectes.'
  "15": 'Et portam fontis ædificávit Sellum fílius Cholhóza, princeps pagi Maspha: ipse ædificávit eam, et texit, et státuit valvas eius, et seras, et vectes, et muros piscínæ Síloe in hortum regis, et usque ad gradus, qui descéndunt de civitáte David.'
  "16": Post eum ædificávit Nehemías fílius Azboc, princeps dimídiæ partis vici Bethsur, usque contra sepúlcrum David, et usque ad piscínam, quæ grandi ópere constrúcta est, et usque ad domum fórtium.
  "17": 'Post eum ædificavérunt Levítæ, Rehum fílius Benni: post eum ædificávit Hasebías princeps dimídiæ partis vici Céilæ in vico suo.'
  "18": 'Post eum ædificavérunt fratres eórum: Bavái fílius Enadad, princeps dimídiæ partis Céilæ.'
  "19": Et ædificávit iuxta eum Azer fílius Iósue, princeps Maspha, mensúram secúndam, contra ascénsum firmíssimi ánguli.
  "20": Post eum in monte ædificávit Baruch fílius Záchai mensúram secúndam, ab ángulo usque ad portam domus Elíasib sacerdótis magni.
  "21": Post eum ædificávit Mérimuth fílius Uríæ fílii Haccus, mensúram secúndam, a porta domus Elíasib, donec extenderétur domus Elíasib.
  "22": Et post eum ædificavérunt sacerdótes, viri de campéstribus Iordánis.
  "23": 'Post eum ædificávit Béniamin et Hasub contra domum suam: et post eum ædificávit Azarías fílius Maasíæ fílii Ananíæ contra domum suam.'
  "24": Post eum ædificávit Bénnui fílius Hénadad mensúram secúndam, a domo Azaríæ usque ad flexúram, et usque ad ángulum.
  "25": 'Phalel fílius Ozi contra flexúram et turrim, quæ éminet de domo regis excélsa, id est, in átrio cárceris: post eum Phadaía fílius Pharos.'
  "26": Nathinǽi autem habitábant in Ophel usque contra portam aquárum ad oriéntem, et turrim, quæ prominébat.
  "27": Post eum ædificavérunt Thecuéni mensúram secúndam e regióne, a turre magna et eminénte usque ad murum templi.
  "28": Sursum autem a porta equórum ædificavérunt sacerdótes, unusquísque contra domum suam.
  "29": Post eos ædificávit Sadoc fílius Emmer contra domum suam. Et post eum ædificávit Semaía fílius Secheníæ, custos portæ orientális.
  "30": 'Post eum ædificávit Hananía fílius Selemíæ, et Hanun fílius Seleph sextus, mensúram secúndam: post eum ædificávit Mosóllam fílius Barachíæ, contra gazophylácium suum. Post eum ædificávit Melchías fílius auríficis usque ad domum Nathinæórum, et scruta vendéntium contra portam iudiciálem, et usque ad cœnáculum ánguli.'
  "31": Et inter cœnáculum ánguli in porta gregis ædificavérunt aurífices et negotiatóres.
