bible: vulgate
lang: la
language: Latina
book: I Paralipomenon
chapter: "8"
verses:
  "1": Béniamin autem génuit Bale primogénitum suum, Asbel secúndum, Ahara tértium,
  "2": Nóhaa quartum, et Rapha quintum.
  "3": 'Fuerúntque fílii Bale: Addar, et Gera, et Abiud,'
  "4": Abísue quoque et Náaman, et Ahoe,
  "5": sed et Gera, et Séphuphan, et Huram.
  "6": Hi sunt fílii Ahod, príncipes cognatiónum habitántium in Gábaa, qui transláti sunt in Mánahath.
  "7": Náaman autem, et Achía, et Gera, ipse tránstulit eos, et génuit Osa, et Ahiud.
  "8": Porro Saháraim génuit in regióne Moab, postquam dimísit Husim et Bara uxóres suas.
  "9": Génuit autem de Hodes uxóre sua Iobab, et Sebía, et Mosa, et Molchom,
  "10": 'Iehus quoque, et Sechía, et Marma: hi sunt fílii eius, príncipes in famíliis suis.'
  "11": Méhusim vero génuit Abitob et Elphaal.
  "12": 'Porro fílii Elphaal: Heber, et Mísaam, et Samad: hic ædificávit Ono, et Lod, et fílias eius.'
  "13": 'Baría autem et Sama príncipes cognatiónum habitántium in Aialon: hi fugavérunt habitatóres Geth.'
  "14": Et Ahio, et Sesac, et Iérimoth,
  "15": et Zabadía, et Arod, et Heder,
  "16": Míchael quoque, et Iespha, et Ioha fílii Baría.
  "17": Et Zabadía, et Mosóllam, et Hézeci, et Heber,
  "18": et Iesámari, et Iézlia, et Iobab fílii Elphaal,
  "19": et Iacim, et Zechri, et Zabdi,
  "20": et Elioénai, et Sélethai, et Eliel,
  "21": et Adaía, et Baraía, et Sámarath, fílii Sémei.
  "22": Et Iespham, et Heber, et Eliel,
  "23": et Abdon, et Zechri, et Hanan,
  "24": et Hananía, et Ælam, et Anathothía,
  "25": et Iephdaía, et Phánuel, fílii Sesac.
  "26": Et Sámsari, et Sohoría, et Otholía,
  "27": et Iersía, et Elía, et Zechri, fílii Iéroham.
  "28": Hi patriárchæ, et cognatiónum príncipes, qui habitavérunt in Ierúsalem.
  "29": 'In Gábaon autem habitavérunt Abigábaon, et nomen uxóris eius Máacha:'
  "30": filiúsque eius primogénitus Abdon, et Sur, et Cis, et Baal, et Nadab,
  "31": 'Gedor quoque, et Ahio, et Zacher, et Macélloth:'
  "32": 'et Macélloth génuit Sámaa: habitaverúntque ex advérso fratrum suórum in Ierúsalem cum frátribus suis.'
  "33": Ner autem génuit Cis, et Cis génuit Saul. Porro Saul génuit Iónathan, et Melchísua, et Abínadab, et Esbaal.
  "34": 'Fílius autem Iónathan, Meríbbaal: et Meríbbaal génuit Micha.'
  "35": Fílii Micha, Phithon, et Melech, et Tháraa, et Ahaz.
  "36": 'Et Ahaz génuit Ióada, et Ióada génuit Alamath, et Azmoth, et Zamri: porro Zamri génuit Mosa,'
  "37": et Mosa génuit Bánaa, cuius fílius fuit Rapha, de quo ortus est Elasa, qui génuit Asel.
  "38": 'Porro Asel sex fílii fuérunt his nomínibus: Ezricam, Bocru, Ismahel, Saría, Obdía, et Hanan: omnes hi fílii Asel.'
  "39": Fílii autem Esec fratris eius, Ulam primogénitus, et Iehus secúndus, et Elíphalet tértius.
  "40": 'Fuerúntque fílii Ulam viri robustíssimi, et magno róbore tendéntes arcum: et multos habéntes fílios ac nepótes, usque ad centum quinquagínta. Omnes hi fílii Béniamin.'
