bible: vulgate
lang: la
language: Latina
book: Matthaeus
chapter: "19"
verses:
  "1": Et factum est, cum consummásset Iesus sermónes istos, migrávit a Galilǽa, et venit in fines Iudǽæ trans Iordánem,
  "2": et secútæ sunt eum turbæ multæ, et curávit eos ibi.
  "3": 'Et accessérunt ad eum Pharisǽi tentántes eum, et dicéntes: Si licet hómini dimíttere uxórem suam, quacúmque ex causa?'
  "4": 'Qui respóndens, ait eis: Non legístis, quia qui fecit hóminem ab inítio, másculum, et féminam fecit eos? et dixit:'
  "5": Propter hoc dimíttet homo patrem, et matrem, et adhærébit uxóri suæ, et erunt duo in carne una.
  "6": Itaque iam non sunt duo, sed una caro. Quod ergo Deus coniúnxit, homo non séparet.
  "7": 'Dicunt illi: Quid ergo Móyses mandávit dare libéllum repúdii, et dimíttere?'
  "8": 'Ait illis: Quóniam Móyses ad durítiam cordis vestri permísit vobis dimíttere uxóres vestras: ab inítio autem non fuit sic.'
  "9": 'Dico autem vobis, quia quicúmque dimíserit uxórem suam, nisi ob fornicatiónem, et áliam dúxerit, mœchátur: et qui dimíssam dúxerit, mœchátur.'
  "10": 'Dicunt ei discípuli eius: Si ita est causa hóminis cum uxóre, non éxpedit núbere.'
  "11": 'Qui dixit illis: Non omnes cápiunt verbum istud, sed quibus datum est.'
  "12": 'Sunt enim eunúchi, qui de matris útero sic nati sunt: et sunt eunúchi, qui facti sunt ab homínibus: et sunt eunúchi, qui seípsos castravérunt propter regnum cælórum. Qui potest cápere cápiat.'
  "13": Tunc obláti sunt ei párvuli, ut manus eis impóneret, et oráret. Discípuli autem increpábant eos.
  "14": 'Iesus vero ait eis: Sínite párvulos, et nolíte eos prohibére ad me veníre: tálium est enim regnum cælórum.'
  "15": Et cum imposuísset eis manus, ábiit inde.
  "16": 'Et ecce unus accédens, ait illi: Magíster bone, quid boni fáciam ut hábeam vitam ætérnam?'
  "17": 'Qui dixit ei: Quid me intérrogas de bono? Unus est bonus, Deus. Si autem vis ad vitam íngredi, serva mandáta.'
  "18": 'Dicit illi: Quæ? Iesus autem dixit: Non homicídium fácies: Non adulterábis: Non fácies furtum: Non falsum testimónium dices:'
  "19": Honóra patrem tuum, et matrem tuam, et díliges próximum tuum sicut teípsum.
  "20": 'Dicit illi adoléscens: Omnia hæc custodívi a iuventúte mea: quid adhuc mihi deest?'
  "21": 'Ait illi Iesus: Si vis perféctus esse, vade, vende quæ habes, et da paupéribus, et habébis thesáurum in cælo: et veni, séquere me.'
  "22": 'Cum audísset autem adoléscens verbum, ábiit tristis: erat enim habens multas possessiónes.'
  "23": 'Iesus autem dixit discípulis suis: Amen dico vobis, quia dives diffícile intrábit in regnum cælórum.'
  "24": 'Et íterum dico vobis: Facílius est camélum per forámen acus transíre, quam dívitem intráre in regnum cælórum.'
  "25": 'Audítis autem his, discípuli mirabántur valde, dicéntes: Quis ergo póterit salvus esse?'
  "26": 'Aspíciens autem Iesus, dixit illis: Apud hómines hoc impossíbile est: apud Deum autem ómnia possibília sunt.'
  "27": 'Tunc respóndens Petrus, dixit ei: Ecce nos relíquimus ómnia, et secúti sumus te: quid ergo erit nobis?'
  "28": 'Iesus autem dixit illis: Amen dico vobis, quod vos, qui secúti estis me, in regeneratióne cum séderit Fílius hóminis in sede maiestátis suæ, sedébitis et vos super sedes duódecim, iudicántes duódecim tribus Israel.'
  "29": Et omnis, qui relíquerit domum, vel fratres, aut soróres, aut patrem, aut matrem, aut uxórem, aut fílios, aut agros propter nomen meum, céntuplum accípiet, et vitam ætérnam possidébit.
  "30": Multi autem erunt primi novíssimi, et novíssimi primi.
