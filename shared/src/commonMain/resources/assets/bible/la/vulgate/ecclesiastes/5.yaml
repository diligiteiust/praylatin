bible: vulgate
lang: la
language: Latina
book: Ecclesiastes
chapter: "5"
verses:
  "1": 'Ne témere quid loquáris, neque cor tuum sit velox ad proferéndum sermónem coram Deo. Deus enim in cælo, et tu super terram: idcírco sint pauci sermónes tui.'
  "2": Multas curas sequúntur sómnia, et in multis sermónibus inveniétur stultítia.
  "3": 'Si quid vovísti Deo, ne moréris réddere: dísplicet enim ei infidélis et stulta promíssio, sed quodcúmque vóveris, redde:'
  "4": multóque mélius est non vovére, quam post votum promíssa non réddere.
  "5": 'Ne déderis os tuum ut peccáre fácias carnem tuam, neque dicas coram ángelo: Non est providéntia: ne forte irátus Deus contra sermónes tuos, díssipet cuncta ópera mánuum tuárum.'
  "6": 'Ubi multa sunt sómnia, plúrimæ sunt vanitátes, et sermónes innúmeri: tu vero Deum time.'
  "7": 'Si víderis calúmnias egenórum, et violénta iudícia, et subvérti iustítiam in província, non miréris super hoc negótio: quia excélso excélsior est álius, et super hos quoque eminentióres sunt álii,'
  "8": et ínsuper univérsæ terræ rex ímperat serviénti.
  "9": 'Avárus non implébitur pecúnia: et qui amat divítias, fructum non cápiet ex eis: et hoc ergo vánitas.'
  "10": Ubi multæ sunt opes, multi et qui cómedunt eas. Et quid prodest possessóri, nisi quod cernit divítias óculis suis?
  "11": 'Dulcis est somnus operánti, sive parum sive multum cómedat: satúritas autem dívitis non sinit eum dormíre.'
  "12": 'Est et ália infírmitas péssima, quam vidi sub sole: divítiæ conservátæ in malum dómini sui.'
  "13": 'Péreunt enim in afflictióne péssima: generávit fílium, qui in summa egestáte erit.'
  "14": Sicut egréssus est nudus de útero matris suæ, sic revertétur, et nihil áuferet secum de labóre suo.
  "15": 'Miserábilis prorsus infírmitas: quómodo venit, sic revertétur. Quid ergo prodest ei quod laborávit in ventum?'
  "16": Cunctis diébus vitæ suæ comédit in ténebris et in curis multis, et in ærúmna atque tristítia.
  "17": Hoc ítaque visum est mihi bonum, ut cómedat quis, et bibat, et fruátur lætítia ex labóre suo, quo laborávit ipse sub sole, número diérum vitæ suæ, quos dedit ei Deus, et hæc est pars illíus.
  "18": 'Et omni hómini, cui dedit Deus divítias atque substántiam, potestatémque ei tríbuit, ut cómedat ex eis, et fruátur parte sua, et lætétur de labóre suo: hoc est donum Dei.'
  "19": Non enim satis recordábitur diérum vitæ suæ, eo quod Deus óccupet delíciis cor eius.
