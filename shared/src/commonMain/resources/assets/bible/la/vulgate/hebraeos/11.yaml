bible: vulgate
lang: la
language: Latina
book: ad Hebraeos
chapter: "11"
verses:
  "1": Est autem fides sperandárum substántia rerum, arguméntum non apparéntium.
  "2": In hac enim testimónium consecúti sunt senes.
  "3": 'Fide intellígimus aptáta esse sǽcula verbo Dei: ut ex invisibílibus visibília fíerent.'
  "4": Fide plúrimam hóstiam Abel, quam Cain, óbtulit Deo, per quam testimónium consecútus est esse iustus, testimónium perhibénte munéribus eius Deo, et per illam defúnctus adhuc lóquitur.
  "5": 'Fide Henoch translátus est ne vidéret mortem, et non inveniebátur, quia tránstulit illum Deus: ante translatiónem enim testimónium hábuit placuísse Deo.'
  "6": Sine fide autem impossíbile est placére Deo. Crédere enim opórtet accedéntem ad Deum quia est, et inquiréntibus se remunerátor sit.
  "7": 'Fide Noe respónso accépto de iis, quæ adhuc non videbántur, métuens aptávit arcam in salútem domus suæ, per quam damnávit mundum: et iustítiæ, quæ per fidem est, heres est institútus.'
  "8": 'Fide qui vocátur Abraham obedívit in locum exíre, quem acceptúrus erat in hereditátem: et éxiit, nésciens quo iret.'
  "9": Fide demorátus est in terra repromissiónis, tamquam in aliéna, in cásulis habitándo cum Isaac, et Iacob coherédibus repromissiónis eiúsdem.
  "10": 'Exspectábat enim fundaménta habéntem civitátem: cuius ártifex et cónditor Deus.'
  "11": 'Fide et ipsa Sara stérilis virtútem in conceptiónem séminis accépit, étiam præter tempus ætátis: quóniam fidélem crédidit esse eum, qui repromíserat.'
  "12": Propter quod et ab uno orti sunt (et hoc emórtuo) tamquam sídera cæli in multitúdinem, et sicut aréna, quæ est ad oram maris, innumerábilis.
  "13": Iuxta fidem defúncti sunt omnes isti, non accéptis repromissiónibus, sed a longe eas aspiciéntes, et salutántes, et confiténtes, quia peregríni, et hóspites sunt super terram.
  "14": Qui enim hæc dicunt, signíficant se pátriam inquírere.
  "15": 'Et si quidem ipsíus meminíssent de qua exiérunt, habébant útique tempus reverténdi:'
  "16": 'nunc autem meliórem áppetunt, id est, cæléstem. Ideo non confúnditur Deus vocári Deus eórum: parávit enim illis civitátem.'
  "17": 'Fide óbtulit Abraham Isaac, cum tentarétur, et unigénitum offerébat, qui suscéperat repromissiónes:'
  "18": 'ad quem dictum est: Quia in Isaac vocábitur tibi semen:'
  "19": 'árbitrans quia et a mórtuis suscitáre potens est Deus: unde eum et in parábolam accépit.'
  "20": Fide et de futúris benedíxit Isaac Iacob, et Esau.
  "21": 'Fide Iacob, móriens, síngulos filiórum Ioseph benedíxit: et adorávit fastígium virgæ eius.'
  "22": Fide Ioseph, móriens, de profectióne filiórum Israel memorátus est, et de óssibus suis mandávit.
  "23": Fide Móyses, natus, occultátus est ménsibus tribus a paréntibus suis, eo quod vidíssent elegántem infántem, et non timuérunt regis edíctum.
  "24": Fide Móyses grandis factus negávit se esse fílium fíliæ Pharaónis,
  "25": magis éligens afflígi cum pópulo Dei, quam temporális peccáti habére iucunditátem,
  "26": 'maióres divítias ǽstimans thesáuro Ægyptiórum, impropérium Christi: aspiciébat enim in remuneratiónem.'
  "27": 'Fide relíquit Ægýptum, non véritus animositátem regis: invisíbilem enim tamquam videns sustínuit.'
  "28": 'Fide celebrávit Pascha, et sánguinis effusiónem: ne qui vastábat primitíva, tángeret eos.'
  "29": 'Fide transiérunt mare Rubrum tamquam per áridam terram: quod expérti Ægýptii, devoráti sunt.'
  "30": Fide muri Iéricho corruérunt, circúitu diérum septem.
  "31": Fide Rahab méretrix non périit cum incrédulis, excípiens exploratóres cum pace.
  "32": 'Et quid adhuc dicam? defíciet enim me tempus enarrántem de Gédeon, Barac, Samson, Iephte, David, Sámuel, et prophétis:'
  "33": qui per fidem vicérunt regna, operáti sunt iustítiam, adépti sunt repromissiónes, obturavérunt ora leónum,
  "34": 'exstinxérunt ímpetum ignis, effugérunt áciem gládii, convaluérunt de infirmitáte, fortes facti sunt in bello, castra vertérunt exterórum:'
  "35": 'accepérunt mulíeres de resurrectióne mórtuos suos: álii autem disténti sunt non suscipiéntes redemptiónem, ut meliórem invenírent resurrectiónem.'
  "36": 'Alii vero ludíbria, et vérbera expérti, ínsuper et víncula, et cárceres:'
  "37": 'lapidáti sunt, secti sunt, tentáti sunt, in occisióne gládii mórtui sunt, circuiérunt in melótis, in péllibus caprínis, egéntes, angustiáti, afflícti:'
  "38": 'quibus dignus non erat mundus: in solitudínibus errántes, in móntibus, in spelúncis, et in cavérnis terræ.'
  "39": Et hi omnes testimónio fídei probáti, non accepérunt repromissiónem,
  "40": Deo pro nobis mélius áliquid providénte, ut non sine nobis consummaréntur.
