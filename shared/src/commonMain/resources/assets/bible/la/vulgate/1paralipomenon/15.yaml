bible: vulgate
lang: la
language: Latina
book: I Paralipomenon
chapter: "15"
verses:
  "1": 'Fecit quoque sibi domos in civitáte David: et ædificávit locum arcæ Dei, tetendítque ei tabernáculum.'
  "2": 'Tunc dixit David: Illícitum est ut a quocúmque portétur arca Dei nisi a Levítis, quos elégit Dóminus ad portándum eam, et ad ministrándum sibi usque in ætérnum.'
  "3": 'Congregavítque univérsum Israel in Ierúsalem, ut afferrétur arca Dei in locum suum, quem præparáverat ei:'
  "4": necnon et fílios Aaron, et Levítas.
  "5": De fíliis Caath, Uriel princeps fuit, et fratres eius centum vigínti.
  "6": 'De fíliis Merári, Asaía princeps: et fratres eius ducénti vigínti.'
  "7": 'De fíliis Gersom, Ioel princeps: et fratres eius centum trigínta.'
  "8": 'De fíliis Elísaphan, Semeías princeps: et fratres eius ducénti.'
  "9": 'De fíliis Hebron, Eliel princeps: et fratres eius octogínta.'
  "10": 'De fíliis Oziel, Amínadab princeps: et fratres eius centum duódecim.'
  "11": 'Vocavítque David Sadoc et Abíathar sacerdótes, et Levítas, Uriel, Asaíam, Ioel, Semeíam, Eliel, et Amínadab:'
  "12": 'et dixit ad eos: Vos qui estis príncipes familiárum Leviticárum, sanctificámini cum frátribus vestris, et afférte arcam Dómini Dei Israel ad locum, qui ei præparátus est:'
  "13": 'ne ut a princípio, quia non erátis præséntes, percússit nos Dóminus: sic et nunc fiat, illícitum quid nobis agéntibus.'
  "14": Sanctificáti sunt ergo sacerdótes, et Levítæ, ut portárent arcam Dómini Dei Israel.
  "15": Et tulérunt fílii Levi arcam Dei, sicut præcéperat Móyses iuxta verbum Dómini, húmeris suis in véctibus.
  "16": Dixítque David princípibus Levitárum, ut constitúerent de frátribus suis cantóres in órganis musicórum, nablis vidélicet, et lyris, et cýmbalis, ut resonáret in excélsis sónitus lætítiæ.
  "17": 'Constituerúntque Levítas: Heman fílium Ioel, et de frátribus eius Asaph fílium Barachíæ: de fíliis vero Merári, frátribus eórum: Ethan fílium Casaíæ.'
  "18": 'Et cum eis fratres eórum: in secúndo órdine, Zacharíam, et Ben, et Iáziel, et Semíramoth, et Iáhiel, et Ani, Eliab, et Banaíam, et Maasíam, et Mathathíam, et Elíphalu, et Maceníam, et Obédedom, et Iéhiel, ianitóres.'
  "19": Porro cantóres, Heman, Asaph, et Ethan, in cýmbalis ǽneis concrepántes.
  "20": Zacharías autem, et Oziel, et Semíramoth, et Iáhiel, et Ani, et Eliab, et Maasías, et Banaías in nablis arcána cantábant.
  "21": Porro Mathathías, et Elíphalu, et Macenías, et Obédedom, et Iéhiel, et Ozáziu, in cítharis pro octáva canébant epinícion.
  "22": 'Chonenías autem princeps Levitárum, prophetíæ prǽerat, ad præcinéndam melódiam: erat quippe valde sápiens.'
  "23": Et Barachías, et Elcana, ianitóres arcæ.
  "24": 'Porro Sebenías, et Iósaphat, et Nathánael, et Amásai, et Zacharías, et Banaías, et Eliézer sacerdótes, clangébant tubis coram arca Dei: et Obédedom, et Iehías erant ianitóres arcæ.'
  "25": Igitur David, et omnes maióres natu Israel, et tribúni, iérunt ad deportándam arcam fœ́deris Dómini de domo Obédedom cum lætítia.
  "26": Cumque adiuvísset Deus Levítas, qui portábant arcam fœ́deris Dómini, immolabántur septem tauri, et septem aríetes.
  "27": 'Porro David erat indútus stola býssina, et univérsi Levítæ qui portábant arcam, cantorésque, et Chonenías princeps prophetíæ inter cantóres: David autem étiam indútus erat ephod líneo.'
  "28": Universúsque Israel deducébant arcam fœ́deris Dómini in iúbilo, et sónitu búccinæ, et tubis, et cýmbalis, et nablis, et cítharis concrepántes.
  "29": Cumque pervenísset arca fœ́deris Dómini usque ad civitátem David, Michol fília Saul prospíciens per fenéstram vidit regem David saltántem atque ludéntem, et despéxit eum in corde suo.
