bible: vulgate
lang: la
language: Latina
book: II Samuelis
chapter: "23"
verses:
  "1": 'Hæc autem sunt verba David novíssima. Dixit David fílius Isai: Dixit vir, cui constitútum est de christo Dei Iacob, egrégius psaltes Israel:'
  "2": Spíritus Dómini locútus est per me, et sermo eius per linguam meam.
  "3": Dixit Deus Israel mihi, locútus est Fortis Israel, Dominátor hóminum, iustus dominátor in timóre Dei.
  "4": Sicut lux auróræ, oriénte sole, mane absque núbibus rútilat, et sicut plúviis gérminat herba de terra.
  "5": 'Nec tanta est domus mea apud Deum, ut pactum ætérnum iníret mecum, firmum in ómnibus atque munítum. Cuncta enim salus mea, et omnis volúntas: nec est quidquam ex ea quod non gérminet.'
  "6": 'Prævaricatóres autem quasi spinæ evelléntur univérsi: quæ non tollúntur mánibus.'
  "7": Et si quis tángere volúerit eas, armábitur ferro et ligno lanceáto, ignéque succénsæ comburéntur usque ad níhilum.
  "8": Hæc nómina fórtium David. Sedens in cáthedra sapientíssimus princeps inter tres, ipse est quasi tenérrimus ligni vermículus, qui octingéntos interfécit ímpetu uno.
  "9": Post hunc, Eleázar fílius pátrui eius Ahohítes inter tres fortes, qui erant cum David quando exprobravérunt Philísthiim, et congregáti sunt illuc in prœ́lium.
  "10": 'Cumque ascendíssent viri Israel, ipse stetit et percússit Philisthǽos donec defíceret manus eius, et obrigésceret cum gládio: fecítque Dóminus salútem magnam in die illa: et pópulus qui fúgerat, revérsus est ad cæsórum spólia detrahénda.'
  "11": 'Et post hunc, Semma fílius Age de Arári: et congregáti sunt Philísthiim in statióne: erat quippe ibi ager lente plenus. Cumque fugísset pópulus a fácie Philísthiim,'
  "12": 'stetit ille in médio agri, et túitus est eum, percussítque Philisthǽos: et fecit Dóminus salútem magnam.'
  "13": 'Necnon et ante descénderant tres qui erant príncipes inter trigínta, et vénerant témpore messis ad David in spelúncam Odóllam: castra autem Philisthinórum erant pósita in Valle gigántum.'
  "14": 'Et David erat in præsídio: porro státio Philisthinórum tunc erat in Béthlehem.'
  "15": 'Desiderávit ergo David, et ait: O si quis mihi daret potum aquæ de cistérna, quæ est in Béthlehem iuxta portam!'
  "16": 'Irrupérunt ergo tres fortes castra Philisthinórum, et hausérunt aquam de cistérna Béthlehem, quæ erat iuxta portam, et attulérunt ad David: at ille nóluit bíbere, sed libávit eam Dómino,'
  "17": 'dicens: Propítius sit mihi Dóminus, ne fáciam hoc: num sánguinem hóminum istórum, qui profécti sunt, et animárum perículum bibam? Nóluit ergo bíbere. Hæc fecérunt tres robustíssimi.'
  "18": 'Abísai quoque frater Ioab fílius Sárviæ, princeps erat de tribus: ipse est qui levávit hastam suam contra trecéntos, quos interfécit, nominátus in tribus,'
  "19": et inter tres nobílior, erátque eórum princeps, sed usque ad tres primos non pervénerat.
  "20": 'Et Banaías fílius Ióiadæ viri fortíssimi, magnórum óperum, de Cábseel: ipse percússit duos leónes Moab, et ipse descéndit, et percússit leónem in média cistérna in diébus nivis.'
  "21": 'Ipse quoque interfécit virum Ægýptium, virum dignum spectáculo, habéntem in manu hastam: ítaque cum descendísset ad eum in virga, vi extórsit hastam de manu Ægýptii, et interfécit eum hasta sua.'
  "22": Hæc fecit Banaías fílius Ióiadæ.
  "23": 'Et ipse nominátus inter tres robústos, qui erant inter trigínta nobilióres: verúmtamen usque ad tres non pervénerat: fecítque eum sibi David auriculárium, a secréto.'
  "24": Asael frater Ioab inter trigínta, Eléhanan fílius pátrui eius de Béthlehem,
  "25": Semma de Hárodi, Elica de Hárodi,
  "26": Heles de Phalti, Hira fílius Acces de Thécua,
  "27": Abiézer de Anathoth, Mobónnai de Húsati,
  "28": Selmon Ahohítes, Mahárai Netophathítes,
  "29": Heled fílius Báana, et ipse Netophathítes, Ithai fílius Ríbai de Gábaath filiórum Béniamin,
  "30": Banaía Pharathonítes, Héddai de torrénte Gaas,
  "31": Abiálbon Arbathítes, Azmaveth de Béromi,
  "32": Elíaba de Saláboni. Fílii Iassen, Iónathan,
  "33": Semma de Oróri, Aiam fílius Sarar Arorítes,
  "34": Elíphelet fílius Aásbai fílii Macháti, Elíam fílius Achítophel Gelonítes,
  "35": Hésrai de Carmélo, Phárai de Arbi,
  "36": Igaal fílius Nathan de Soba, Bonni de Gadi,
  "37": Selec de Ammóni, Nahárai Berothítes ármiger Ioab fílii Sárviæ,
  "38": Ira Iethrítes, Gareb et ipse Iethrítes,
  "39": Urías Hethǽus. Omnes trigínta septem.
