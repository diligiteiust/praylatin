bible: vulgate
lang: la
language: Latina
book: Deuteronomium
chapter: "34"
verses:
  "1": 'Ascéndit ergo Móyses de campéstribus Moab super montem Nebo, in vérticem Phasga contra Iéricho: ostendítque ei Dóminus omnem terram Gálaad usque Dan,'
  "2": et univérsum Néphthali, terrámque Ephraim et Manásse, et omnem terram Iuda usque ad mare novíssimum,
  "3": et austrálem partem, et latitúdinem campi Iéricho civitátis palmárum usque Segor.
  "4": 'Dixítque Dóminus ad eum: Hæc est terra, pro qua iurávi Abraham, Isaac, et Iacob, dicens: Sémini tuo dabo eam. Vidísti eam óculis tuis, et non transíbis ad illam.'
  "5": 'Mortuúsque est ibi Móyses servus Dómini, in terra Moab, iubénte Dómino:'
  "6": 'et sepelívit eum in valle terræ Moab contra Phogor: et non cognóvit homo sepúlcrum eius usque in præséntem diem.'
  "7": 'Móyses centum et vigínti annórum erat quando mórtuus est: non caligávit óculus eius, nec dentes illíus moti sunt.'
  "8": 'Fleverúntque eum fílii Israel in campéstribus Moab trigínta diébus: et compléti sunt dies planctus lugéntium Móysen.'
  "9": Iósue vero fílius Nun replétus est Spíritu sapiéntiæ, quia Móyses pósuit super eum manus suas. Et obediérunt ei fílii Israel, fecerúntque sicut præcépit Dóminus Móysi.
  "10": Et non surréxit ultra prophéta in Israel sicut Móyses, quem nosset Dóminus fácie ad fáciem,
  "11": in ómnibus signis atque porténtis, quæ misit per eum, ut fáceret in terra Ægýpti Pharaóni, et ómnibus servis eius, universǽque terræ illíus,
  "12": et cunctam manum robústam, magnáque mirabília, quæ fecit Móyses coram univérso Israel.
