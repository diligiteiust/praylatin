bible: vulgate
lang: la
language: Latina
book: Isaias
chapter: "5"
verses:
  "1": Cantábo dilécto meo cánticum patruélis mei víneæ suæ. Vínea facta est dilécto meo in cornu fílio ólei.
  "2": 'Et sepívit eam, et lápides elégit ex illa, et plantávit eam eléctam, et ædificávit turrim in médio eius, et tórcular exstrúxit in ea: et exspectávit ut fáceret uvas, et fecit labrúscas.'
  "3": Nunc ergo habitatóres Ierúsalem et viri Iuda, iudicáte inter me et víneam meam.
  "4": Quid est quod débui ultra fácere víneæ meæ, et non feci ei? an quod exspectávi ut fáceret uvas, et fecit labrúscas?
  "5": 'Et nunc osténdam vobis quid ego fáciam víneæ meæ: áuferam sepem eius, et erit in direptiónem: díruam macériam eius, et erit in conculcatiónem.'
  "6": 'Et ponam eam desértam: non putábitur, et non fodiétur: et ascéndent vepres et spinæ: et núbibus mandábo ne pluant super eam imbrem.'
  "7": 'Vínea enim Dómini exercítuum domus Israel est: et vir Iuda germen eius delectábile: et exspectávi ut fáceret iudícium, et ecce iníquitas: et iustítiam, et ecce clamor.'
  "8": 'Væ qui coniúngitis domum ad domum, et agrum agro copulátis usque ad términum loci: numquid habitábitis vos soli in médio terræ?'
  "9": 'In áuribus meis sunt hæc, dicit Dóminus exercítuum: nisi domus multæ desértæ fúerint, grandes et pulchræ, absque habitatóre.'
  "10": Decem enim iúgera vineárum fácient lagúnculam unam, et trigínta módii seméntis fácient módios tres.
  "11": Væ qui consúrgitis mane ad ebrietátem sectándam, et potándum usque ad vésperam, ut vino æstuétis.
  "12": 'Cíthara, et lyra, et týmpanum, et tíbia, et vinum in convíviis vestris: et opus Dómini non respícitis, nec ópera mánuum eius considerátis.'
  "13": Proptérea captívus ductus est pópulus meus, quia non hábuit sciéntiam, et nóbiles eius interiérunt fame, et multitúdo eius siti exáruit.
  "14": 'Proptérea dilatávit inférnus ánimam suam, et apéruit os suum absque ullo término: et descéndent fortes eius, et pópulus eius, et sublímes, gloriosíque eius ad eum.'
  "15": Et incurvábitur homo, et humiliábitur vir, et óculi sublímium depriméntur.
  "16": Et exaltábitur Dóminus exercítuum in iudício, et Deus sanctus sanctificábitur in iustítia.
  "17": Et pascéntur agni iuxta órdinem suum, et desérta in ubertátem versa ádvenæ cómedent.
  "18": Væ qui tráhitis iniquitátem in funículis vanitátis, et quasi vínculum plaustri peccátum.
  "19": 'Qui dícitis: Festínet, et cito véniat opus eius, ut videámus: et apprópiet, et véniat consílium sancti Israel, et sciémus illud.'
  "20": 'Væ qui dícitis malum bonum, et bonum malum: ponéntes ténebras lucem, et lucem ténebras: ponéntes amárum in dulce, et dulce in amárum.'
  "21": Væ qui sapiéntes estis in óculis vestris, et coram vobismetípsis prudéntes.
  "22": Væ qui poténtes estis ad bibéndum vinum, et viri fortes ad miscéndam ebrietátem.
  "23": Qui iustificátis ímpium pro munéribus, et iustítiam iusti aufértis ab eo.
  "24": 'Propter hoc, sicut dévorat stípulam lingua ignis, et calor flammæ exúrit: sic radix eórum quasi favílla erit, et germen eórum ut pulvis ascéndet. Abiecérunt enim legem Dómini exercítuum, et elóquium sancti Israel blasphemavérunt.'
  "25": 'Ideo irátus est furor Dómini in pópulum suum, et exténdit manum suam super eum, et percússit eum: et conturbáti sunt montes, et facta sunt morticína eórum quasi stercus in médio plateárum. In his ómnibus non est advérsus furor eius, sed adhuc manus eius exténta.'
  "26": 'Et elevábit signum in natiónibus procul, et sibilábit ad eum de fínibus terræ: et ecce festínus velóciter véniet.'
  "27": 'Non est defíciens, neque labórans in eo: non dormitábit, neque dórmiet, neque solvétur cíngulum renum eius, nec rumpétur corrígia calceaménti eius.'
  "28": Sagíttæ eius acútæ, et omnes arcus eius exténti. Ungulæ equórum eius ut silex, et rotæ eius quasi ímpetus tempestátis.
  "29": 'Rugítus eius ut leónis, rúgiet ut cátuli leónum: et frendet, et tenébit prædam: et amplexábitur, et non erit qui éruat.'
  "30": 'Et sonábit super eum in die illa sicut sónitus maris: aspiciémus in terram, et ecce ténebræ tribulatiónis, et lux obtenebráta est in calígine eius.'
