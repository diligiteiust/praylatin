bible: vulgate
lang: la
language: Latina
book: Isaias
chapter: "50"
verses:
  "1": 'Hæc dicit Dóminus: Quis est hic liber repúdii matris vestræ, quo dimísi eam? aut quis est créditor meus, cui véndidi vos? Ecce in iniquitátibus vestris vénditi estis, et in sceléribus vestris dimísi matrem vestram.'
  "2": 'Quia veni, et non erat vir: vocávi, et non erat qui audíret. Numquid abbreviáta et párvula facta est manus mea, ut non possim redímere? aut non est in me virtus ad liberándum? Ecce in increpatióne mea desértum fáciam mare, ponam flúmina in siccum: computréscent pisces sine aqua, et moriéntur in siti.'
  "3": Induam cælos ténebris, et saccum ponam operiméntum eórum.
  "4": 'Dóminus dedit mihi linguam erudítam, ut sciam sustentáre eum qui lassus est verbo: érigit mane, mane érigit mihi aurem, ut áudiam quasi magístrum.'
  "5": 'Dóminus Deus apéruit mihi aurem, ego autem non contradíco: retrórsum non ábii.'
  "6": 'Corpus meum dedi percutiéntibus, et genas meas velléntibus: fáciem meam non avérti ab increpántibus, et conspuéntibus in me.'
  "7": 'Dóminus Deus auxiliátor meus, ídeo non sum confúsus: ídeo pósui fáciem meam ut petram duríssimam, et scio quóniam non confúndar.'
  "8": 'Iuxta est qui iustíficat me, quis contradícet mihi? stemus simul: quis est adversárius meus? accédat ad me.'
  "9": 'Ecce Dóminus Deus auxiliátor meus: quis est qui condémnet me? Ecce omnes quasi vestiméntum conteréntur: tínea cómedet eos.'
  "10": Quis ex vobis timens Dóminum, áudiens vocem servi sui? qui ambulávit in ténebris, et non est lumen ei, speret in nómine Dómini, et innitátur super Deum suum.
  "11": 'Ecce vos omnes accendéntes ignem, accíncti flammis, ambuláte in lúmine ignis vestri, et in flammis, quas succendístis: de manu mea factum est hoc vobis, in dolóribus dormiétis.'
