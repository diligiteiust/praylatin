bible: vulgate
lang: la
language: Latina
book: Ieremias
chapter: "20"
verses:
  "1": Et audívit Phassur fílius Emmer sacérdos, qui constitútus erat princeps in domo Dómini, Ieremíam prophetántem sermónes istos.
  "2": Et percússit Phassur Ieremíam prophétam, et misit eum in nervum, quod erat in porta Béniamin superióri, in domo Dómini.
  "3": 'Cumque illuxísset in crástinum, edúxit Phassur Ieremíam de nervo: et dixit ad eum Ieremías: Non Phassur vocávit Dóminus nomen tuum, sed pavórem úndique.'
  "4": 'Quia hæc dicit Dóminus: Ecce ego dabo te in pavórem, te et omnes amícos tuos: et córruent gládio inimicórum suórum, et óculi tui vidébunt: et omnem Iudam dabo in manum regis Babylónis, et tradúcet eos in Babylónem, et percútiet eos gládio.'
  "5": 'Et dabo univérsam substántiam civitátis huius, et omnem labórem eius, omnéque prétium, et cunctos thesáuros regum Iuda dabo in manu inimicórum eórum: et dirípient eos, et tollent, et ducent in Babylónem.'
  "6": 'Tu autem Phassur, et omnes habitatóres domus tuæ, íbitis in captivitátem: et in Babylónem vénies, et ibi moriéris, ibíque sepeliéris tu, et omnes amíci tui, quibus prophetásti mendácium.'
  "7": 'Seduxísti me Dómine, et sedúctus sum: fórtior me fuísti, et invaluísti: factus sum in derísum tota die, omnes subsánnant me.'
  "8": 'Quia iam olim loquor, vocíferans iniquitátem, et vastitátem clámito: et factus est mihi sermo Dómini in oppróbrium, et in derísum tota die.'
  "9": 'Et dixi: Non recordábor eius, neque loquar ultra in nómine illíus: et factus est in corde meo quasi ignis exǽstuans, clausúsque in óssibus meis: et deféci, ferre non sústinens.'
  "10": 'Audívi enim contumélias multórum, et terrórem in circúitu: Persequímini, et persequámur eum: ab ómnibus viris, qui erant pacífici mei, et custodiéntes latus meum: si quo modo decipiátur, et prævaleámus advérsus eum, et consequámur ultiónem ex eo.'
  "11": 'Dóminus autem mecum est, quasi bellátor fortis: idcírco qui persequúntur me cadent, et infírmi erunt: confundéntur veheménter, quia non intellexérunt oppróbrium sempitérnum, quod numquam delébitur.'
  "12": 'Et tu Dómine exercítuum, probátor iusti, qui vides renes et cor: vídeam quæso ultiónem tuam ex eis: tibi enim revelávi causam meam.'
  "13": 'Cantáte Dómino, laudáte Dóminum: quia liberávit ánimam páuperis de manu malórum.'
  "14": 'Maledícta dies, in qua natus sum: dies, in qua péperit me mater mea, non sit benedícta.'
  "15": 'Maledíctus vir, qui annuntiávit patri meo, dicens: Natus est tibi puer másculus: et quasi gáudio lætificávit eum.'
  "16": 'Sit homo ille ut sunt civitátes, quas subvértit Dóminus, et non pœnítuit eum: áudiat clamórem mane, et ululátum in témpore meridiáno:'
  "17": qui non me interfécit a vulva, ut fíeret mihi mater mea sepúlcrum, et vulva eius concéptus ætérnus.
  "18": Quare de vulva egréssus sum, ut vidérem labórem et dolórem, et consumeréntur in confusióne dies mei?
