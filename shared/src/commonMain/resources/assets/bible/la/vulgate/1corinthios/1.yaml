bible: vulgate
lang: la
language: Latina
book: ad Corinthios I
chapter: "1"
verses:
  "1": Paulus vocátus Apóstolus Iesu Christi per voluntátem Dei, et Sósthenes frater,
  "2": ecclésiæ Dei, quæ est Corínthi, sanctificátis in Christo Iesu, vocátis sanctis, cum ómnibus, qui ínvocant nomen Dómini nostri Iesu Christi, in omni loco ipsórum et nostro.
  "3": Grátia vobis, et pax a Deo Patre nostro, et Dómino Iesu Christo.
  "4": 'Grátias ago Deo meo semper pro vobis in grátia Dei, quæ data est vobis in Christo Iesu:'
  "5": 'quod in ómnibus dívites facti estis in illo, in omni verbo, et in omni sciéntia:'
  "6": 'sicut testimónium Christi confirmátum est in vobis:'
  "7": ita ut nihil vobis desit in ulla grátia, exspectántibus revelatiónem Dómini nostri Iesu Christi,
  "8": qui et confirmábit vos usque in finem sine crímine, in die advéntus Dómini nostri Iesu Christi.
  "9": 'Fidélis Deus: per quem vocáti estis in societátem Fílii eius Iesu Christi Dómini nostri.'
  "10": 'Obsecro autem vos fratres per nomen Dómini nostri Iesu Christi: ut idípsum dicátis omnes, et non sint in vobis schísmata: sitis autem perfécti in eódem sensu, et in eádem senténtia.'
  "11": Significátum est enim mihi de vobis fratres mei ab iis, qui sunt Chloes, quia contentiónes sunt inter vos.
  "12": 'Hoc autem dico, quod unusquísque vestrum dicit: Ego quidem sum Pauli: ego autem Apóllo: ego vero Cephæ: ego autem Christi.'
  "13": Divísus est Christus? numquid Paulus crucifíxus est pro vobis? aut in nómine Pauli baptizáti estis?
  "14": 'Grátias ago Deo, quod néminem vestrum baptizávi, nisi Crispum, et Caium:'
  "15": ne quis dicat quod in nómine meo baptizáti estis.
  "16": 'Baptizávi autem et Stéphanæ domum: céterum néscio si quem álium baptizáverim.'
  "17": 'Non enim misit me Christus baptizáre, sed evangelizáre: non in sapiéntia verbi, ut non evacuétur crux Christi.'
  "18": 'Verbum enim crucis pereúntibus quidem stultítia est: iis autem, qui salvi fiunt, id est nobis, Dei virtus est.'
  "19": 'Scriptum est enim: Perdam sapiéntiam sapiéntium, et prudéntiam prudéntium reprobábo.'
  "20": Ubi sápiens? ubi scriba? ubi conquisítor huius sǽculi? Nonne stultam fecit Deus sapiéntiam huius mundi?
  "21": 'Nam quia in Dei sapiéntia non cognóvit mundus per sapiéntiam Deum: plácuit Deo per stultítiam prædicatiónis salvos fácere credéntes.'
  "22": 'Quóniam et Iudǽi signa petunt, et Græci sapiéntiam quærunt:'
  "23": 'nos autem prædicámus Christum crucifíxum: Iudǽis quidem scándalum, géntibus autem stultítiam,'
  "24": 'ipsis autem vocátis Iudǽis, atque Græcis, Christum Dei virtútem, et Dei sapiéntiam:'
  "25": 'quia quod stultum est Dei, sapiéntius est homínibus: et quod infírmum est Dei, fórtius est homínibus.'
  "26": 'Vidéte enim vocatiónem vestram fratres, quia non multi sapiéntes secúndum carnem, non multi poténtes, non multi nóbiles:'
  "27": 'sed quæ stulta sunt mundi elégit Deus, ut confúndat sapiéntes: et infírma mundi elégit Deus, ut confúndat fórtia:'
  "28": 'et ignobília mundi, et contemptibília elégit Deus, et ea, quæ non sunt, ut ea quæ sunt destrúeret:'
  "29": ut non gloriétur omnis caro in conspéctu eius.
  "30": 'Ex ipso autem vos estis in Christo Iesu, qui factus est nobis sapiéntia a Deo, et iustítia, et sanctificátio, et redémptio:'
  "31": 'ut quemádmodum scriptum est: Qui gloriátur, in Dómino gloriétur.'
