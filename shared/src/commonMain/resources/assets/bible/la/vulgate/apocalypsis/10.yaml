bible: vulgate
lang: la
language: Latina
book: Apocalypsis
chapter: "10"
verses:
  "1": 'Et vidi álium ángelum fortem descendéntem de cælo amíctum nube, et iris in cápite eius, et fácies eius erat ut sol, et pedes eius tamquam colúmnæ ignis:'
  "2": 'et habébat in manu sua libéllum apértum: et pósuit pedem suum dextrum super mare, sinístrum autem super terram:'
  "3": et clamávit voce magna, quemádmodum cum leo rugit. Et cum clamásset, locúta sunt septem tonítrua voces suas.
  "4": 'Et cum locúta fuíssent septem tonítrua voces suas, ego scriptúrus eram: et audívi vocem de cælo dicéntem mihi: Signa quæ locúta sunt septem tonítrua: et noli ea scríbere.'
  "5": 'Et ángelus, quem vidi stantem super mare, et super terram, levávit manum suam ad cælum:'
  "6": 'et iurávit per vivéntem in sǽcula sæculórum, qui creávit cælum, et ea quæ in eo sunt: et terram, et ea quæ in ea sunt: et mare, et ea quæ in eo sunt: Quia tempus non erit ámplius:'
  "7": sed in diébus vocis séptimi ángeli, cum cœ́perit tuba cánere, consummábitur mystérium Dei, sicut evangelizávit per servos suos prophétas.
  "8": 'Et audívi vocem de cælo íterum loquéntem mecum, et dicéntem: Vade, et áccipe librum apértum de manu ángeli stantis super mare, et super terram.'
  "9": 'Et ábii ad ángelum, dicens ei, ut daret mihi librum. Et dixit mihi: Accipe librum, et dévora illum: et fáciet amaricári ventrem tuum, sed in ore tuo erit dulce tamquam mel.'
  "10": 'Et accépi librum de manu ángeli, et devorávi illum: et erat in ore meo tamquam mel dulce, et cum devorássem eum, amaricátus est venter meus:'
  "11": 'et dixit mihi: Opórtet te íterum prophetáre géntibus, et pópulis, et linguis, et régibus multis.'
