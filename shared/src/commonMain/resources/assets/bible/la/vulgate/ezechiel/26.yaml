bible: vulgate
lang: la
language: Latina
book: Ezechiel
chapter: "26"
verses:
  "1": 'Et factum est in undécimo anno, prima mensis, factus est sermo Dómini ad me, dicens:'
  "2": 'Fili hóminis, pro eo quod dixit Tyrus de Ierúsalem: Euge, confráctæ sunt portæ populórum, convérsa est ad me: implébor, desérta est.'
  "3": 'Proptérea hæc dicit Dóminus Deus: Ecce ego super te Tyre, et ascéndere fáciam ad te gentes multas, sicut ascéndit mare flúctuans.'
  "4": 'Et dissipábunt muros Tyri, et déstruent turres eius: et radam púlverem eius de ea, et dabo eam in limpidíssimam petram.'
  "5": 'Siccátio sagenárum erit in médio maris, quia ego locútus sum, ait Dóminus Deus: et erit in direptiónem géntibus.'
  "6": 'Fíliæ quoque eius, quæ sunt in agro, gládio interficiéntur: et scient quia ego Dóminus.'
  "7": 'Quia hæc dicit Dóminus Deus: Ecce ego addúcam ad Tyrum Nabuchodónosor regem Babylónis ab aquilóne, regem regum, cum equis, et cúrribus, et equítibus, et cœtu, populóque magno.'
  "8": 'Fílias tuas, quæ sunt in agro, gládio interfíciet: et circúmdabit te munitiónibus, et comportábit ággerem in gyro, et elevábit contra te clýpeum.'
  "9": Et víneas, et aríetes temperábit in muros tuos, et turres tuas déstruet in armatúra sua.
  "10": 'Inundatióne equórum eius opériet te pulvis eórum: a sónitu équitum, et rotárum, et cúrruum movebúntur muri tui, cum ingréssus fúerit portas tuas quasi per intróitum urbis dissipátæ.'
  "11": 'Ungulis equórum suórum conculcábit omnes platéas tuas: pópulum tuum gládio cædet, et státuæ tuæ nóbiles in terram córruent.'
  "12": 'Vastábunt opes tuas, dirípient negotiatiónes tuas: et déstruent muros tuos, et domos tuas præcláras subvértent: et lápides tuos, et ligna tua, et púlverem tuum in médio aquárum ponent.'
  "13": 'Et quiéscere fáciam multitúdinem canticórum tuórum: et sónitus citharárum tuárum non audiétur ámplius.'
  "14": 'Et dabo te in limpidíssimam petram, siccátio sagenárum eris, nec ædificáberis ultra: quia ego locútus sum, ait Dóminus Deus.'
  "15": 'Hæc dicit Dóminus Deus Tyro: Numquid non a sónitu ruínæ tuæ, et gémitu interfectórum tuórum, cum occísi fúerint in médio tui, commovebúntur ínsulæ?'
  "16": 'Et descéndent de sédibus suis omnes príncipes maris: et áuferent exúvias suas, et vestiménta sua vária abícient, et induéntur stupóre: in terra sedébunt, et attóniti super repentíno casu tuo admirabúntur.'
  "17": 'Et assuméntes super te laméntum, dicent tibi: Quómodo perísti, quæ hábitas in mari, urbs ínclyta, quæ fuísti fortis in mari cum habitatóribus tuis, quos formidábant univérsi?'
  "18": 'Nunc stupébunt naves in die pavóris tui: et turbabúntur ínsulæ in mari, eo quod nullus egrediátur ex te.'
  "19": 'Quia hæc dicit Dóminus Deus: Cum dédero te urbem desolátam sicut civitátes, quæ non habitántur: et addúxero super te abýssum, et operúerint te aquæ multæ:'
  "20": 'et detráxero te cum his, qui descéndunt in lacum ad pópulum sempitérnum, et collocávero te in terra novíssima sicut solitúdines véteres cum his, qui deducúntur in lacum, ut non habitéris: porro cum dédero glóriam in terra vivéntium,'
  "21": in níhilum rédigam te, et non eris, et requisíta non inveniéris ultra in sempitérnum, dicit Dóminus Deus.
