bible: vulgate
lang: la
language: Latina
book: Ezechiel
chapter: "18"
verses:
  "1": 'Et factus est sermo Dómini ad me, dicens:'
  "2": 'Quid est quod inter vos parábolam vértitis in provérbium istud in terra Israel, dicéntes: Patres comedérunt uvam acérbam, et dentes filiórum obstupéscunt?'
  "3": Vivo ego, dicit Dóminus Deus, si erit ultra vobis parábola hæc in provérbium in Israel.
  "4": 'Ecce omnes ánimæ meæ sunt: ut ánima patris, ita et ánima fílii mea est: ánima, quæ peccáverit, ipsa moriétur.'
  "5": Et vir si fúerit iustus, et fécerit iudícium, et iustítiam,
  "6": 'in móntibus non coméderit, et óculos suos non leváverit ad idóla domus Israel: et uxórem próximi sui non violáverit, et ad mulíerem menstruátam non accésserit:'
  "7": 'et hóminem non contristáverit, pignus debitóri reddíderit, per vim nihil rapúerit: panem suum esuriénti déderit, et nudum operúerit vestiménto:'
  "8": 'ad usúram non commodáverit, et ámplius non accéperit: ab iniquitáte avérterit manum suam, et iudícium verum fécerit inter virum et virum:'
  "9": 'in præcéptis meis ambuláverit, et iudícia mea custodíerit ut fáciat veritátem: hic iustus est, vita vivet, ait Dóminus Deus.'
  "10": 'Quod si genúerit fílium latrónem, effundéntem sánguinem, et fécerit unum de istis:'
  "11": 'et hæc quidem ómnia non faciéntem, sed in móntibus comedéntem, et uxórem próximi sui polluéntem:'
  "12": 'egénum et páuperem contristántem, rapiéntem rapínas, pignus non reddéntem, et ad idóla levántem óculos suos, abominatiónem faciéntem:'
  "13": 'ad usúram dantem, et ámplius accipiéntem: numquid vivet? non vivet: cum univérsa hæc detestánda fécerit, morte moriétur: sanguis eius in ipso erit.'
  "14": 'Quod si genúerit fílium, qui videns ómnia peccáta patris sui, quæ fecit, timúerit, et non fécerit símile eis:'
  "15": 'super montes non coméderit, et óculos suos non leváverit ad idóla domus Israel, et uxórem próximi sui non violáverit:'
  "16": 'et virum non contristáverit, pignus non retinúerit, et rapínam non rapúerit: panem suum esuriénti déderit, et nudum operúerit vestiménto:'
  "17": 'a páuperis iniúria avérterit manum suam, usúram et superabundántiam non accéperit, iudícia mea fécerit, in præcéptis meis ambuláverit: hic non moriétur in iniquitáte patris sui, sed vita vivet.'
  "18": Pater eius, quia calumniátus est, et vim fecit fratri, et malum operátus est in médio pópuli sui, ecce mórtuus est in iniquitáte sua.
  "19": 'Et dícitis: Quare non portávit fílius iniquitátem patris? Vidélicet, quia fílius iudícium, et iustítiam operátus est, ómnia præcépta mea custodívit, et fecit illa, vivet vita.'
  "20": 'Anima, quæ peccáverit, ipsa moriétur: fílius non portábit iniquitátem patris, et pater non portábit iniquitátem fílii: iustítia iusti super eum erit, et impíetas ímpii erit super eum.'
  "21": 'Si autem ímpius égerit pœniténtiam ab ómnibus peccátis suis, quæ operátus est, et custodíerit ómnia præcépta mea, et fécerit iudícium et iustítiam: vita vivet, et non moriétur.'
  "22": 'Omnium iniquitátum eius, quas operátus est, non recordábor: in iustítia sua, quam operátus est, vivet.'
  "23": Numquid voluntátis meæ est mors ímpii, dicit Dóminus Deus, et non ut convertátur a viis suis, et vivat?
  "24": 'Si autem avérterit se iustus a iustítia sua, et fécerit iniquitátem secúndum omnes abominatiónes, quas operári solet ímpius, numquid vivet? omnes iustítiæ eius, quas fécerat, non recordabúntur: in prævaricatióne, qua prævaricátus est, et in peccáto suo, quod peccávit, in ipsis moriétur.'
  "25": 'Et dixístis: Non est æqua via Dómini. Audíte ergo domus Israel: numquid via mea non est æqua, et non magis viæ vestræ pravæ sunt?'
  "26": 'Cum enim avérterit se iustus a iustítia sua, et fécerit iniquitátem, moriétur in eis: in iniustítia, quam operátus est, moriétur.'
  "27": 'Et cum avérterit se ímpius ab impietáte sua, quam operátus est, et fécerit iudícium et iustítiam: ipse ánimam suam vivificábit.'
  "28": Consíderans enim, et avértens se ab ómnibus iniquitátibus suis, quas operátus est, vita vivet, et non moriétur.
  "29": 'Et dicunt fílii Israel: Non est æqua via Dómini. Numquid viæ meæ non sunt æquæ, domus Israel, et non magis viæ vestræ pravæ?'
  "30": 'Idcírco unumquémque iuxta vias suas iudicábo domus Israel, ait Dóminus Deus. Convertímini, et ágite pœniténtiam ab ómnibus iniquitátibus vestris: et non erit vobis in ruínam iníquitas.'
  "31": 'Proícite a vobis omnes prævaricatiónes vestras, in quibus prævaricáti estis, et fácite vobis cor novum, et spíritum novum: et quare moriémini, domus Israel?'
  "32": Quia nolo mortem moriéntis, dicit Dóminus Deus, revertímini, et vívite.
