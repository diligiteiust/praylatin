bible: vulgate
lang: la
language: Latina
book: Daniel
chapter: "9"
verses:
  "1": In anno primo Daríi fílii Assuéri de sémine Medórum, qui imperávit super regnum Chaldæórum,
  "2": anno uno regni eius, ego Dániel intelléxi in libris númerum annórum, de quo factus est sermo Dómini ad Ieremíam prophétam, ut compleréntur desolatiónis Ierúsalem septuagínta anni.
  "3": Et pósui fáciem meam ad Dóminum Deum meum rogáre et deprecári in ieiúniis, sacco, et cínere.
  "4": 'Et orávi Dóminum Deum meum, et conféssus sum, et dixi: Obsecro Dómine Deus magne et terríbilis, custódiens pactum, et misericórdiam diligéntibus te, et custodiéntibus mandáta tua.'
  "5": 'Peccávimus, iniquitátem fécimus, ímpie égimus, et recéssimus: et declinávimus a mandátis tuis, ac iudíciis.'
  "6": Non obedívimus servis tuis prophétis, qui locúti sunt in nómine tuo régibus nostris, princípibus nostris, pátribus nostris, omníque pópulo terræ.
  "7": 'Tibi Dómine iustítia: nobis autem confúsio faciéi, sicut est hódie viro Iuda, et habitatóribus Ierúsalem, et omni Israel, his qui prope sunt, et his qui procul in univérsis terris, ad quas eiecísti eos propter iniquitátes eórum, in quibus peccavérunt in te.'
  "8": Dómine nobis confúsio faciéi, régibus nostris, princípibus nostris, et pátribus nostris, qui peccavérunt.
  "9": 'Tibi autem Dómino Deo nostro misericórdia, et propitiátio, quia recéssimus a te:'
  "10": et non audívimus vocem Dómini Dei nostri ut ambularémus in lege eius, quam pósuit nobis per servos suos prophétas.
  "11": 'Et omnis Israel prævaricáti sunt legem tuam, et declinavérunt ne audírent vocem tuam: et stillávit super nos maledíctio, et detestátio, quæ scripta est in libro Móysi servi Dei, quia peccávimus ei.'
  "12": Et státuit sermónes suos, quos locútus est super nos, et super príncipes nostros, qui iudicavérunt nos, ut superindúceret in nos magnum malum, quale numquam fuit sub omni cælo, secúndum quod factum est in Ierúsalem.
  "13": 'Sicut scriptum est in lege Móysi, omne malum hoc venit super nos: et non rogávimus fáciem tuam Dómine Deus noster, ut reverterémur ab iniquitátibus nostris, et cogitarémus veritátem tuam.'
  "14": 'Et vigilávit Dóminus super malítiam, et addúxit eam super nos: iustus Dóminus Deus noster in ómnibus opéribus suis, quæ fecit: non enim audívimus vocem eius.'
  "15": 'Et nunc Dómine Deus noster, qui eduxísti pópulum tuum de terra Ægýpti in manu forti, et fecísti tibi nomen secúndum diem hanc: peccávimus, iniquitátem fécimus'
  "16": 'Dómine in omnem iustítiam tuam: avertátur óbsecro ira tua, et furor tuus a civitáte tua Ierúsalem, et monte sancto tuo. Propter peccáta enim nostra, et iniquitátes patrum nostrórum, Ierúsalem, et pópulus tuus in oppróbrium sunt ómnibus per circúitum nostrum.'
  "17": 'Nunc ergo exáudi Deus noster oratiónem servi tui, et preces eius: et osténde fáciem tuam super sanctuárium tuum, quod desértum est, propter temetípsum.'
  "18": 'Inclína Deus meus aurem tuam, et audi: áperi óculos tuos, et vide desolatiónem nostram, et civitátem super quam invocátum est nomen tuum: neque enim in iustificatiónibus nostris prostérnimus preces ante fáciem tuam, sed in miseratiónibus tuis multis.'
  "19": 'Exáudi Dómine, placáre Dómine: atténde et fac: ne moréris propter temetípsum Deus meus: quia nomen tuum invocátum est super civitátem tuam, et super pópulum tuum.'
  "20": 'Cumque adhuc lóquerer, et orárem, et confitérer peccáta mea, et peccáta pópuli mei Israel, et prostérnerem preces meas in conspéctu Dei mei, pro monte sancto Dei mei:'
  "21": adhuc me loquénte in oratióne, ecce vir Gábriel, quem víderam in visióne a princípio, cito volans tétigit me in témpore sacrifícii vespertíni.
  "22": 'Et dócuit me, et locútus est mihi, dixítque: Dániel nunc egréssus sum ut docérem te, et intellígeres.'
  "23": 'Ab exórdio precum tuárum egréssus est sermo: ego autem veni ut indicárem tibi, quia vir desideriórum es: tu ergo animadvérte sermónem, et intéllige visiónem.'
  "24": Septuagínta hebdómades abbreviátæ sunt super pópulum tuum, et super urbem sanctam tuam, ut consummétur prævaricátio, et finem accípiat peccátum, et deleátur iníquitas, et adducátur iustítia sempitérna, et impleátur vísio et prophetía, et ungátur Sanctus sanctórum.
  "25": 'Scito ergo, et animadvérte: Ab éxitu sermónis, ut íterum ædificétur Ierúsalem, usque ad Christum ducem, hebdómades septem, et hebdómades sexagínta duæ erunt: et rursum ædificábitur platéa, et muri in angústia témporum.'
  "26": 'Et post hebdómades sexagínta duas occidétur Christus: et non erit eius pópulus, qui eum negatúrus est. Et civitátem, et sanctuárium dissipábit pópulus cum duce ventúro: et finis eius vástitas, et post finem belli statúta desolátio.'
  "27": 'Confirmábit autem pactum multis hebdómada una: et in dimídio hebdómadis defíciet hóstia et sacrifícium: et erit in templo abominátio desolatiónis: et usque ad consummatiónem et finem perseverábit desolátio.'
