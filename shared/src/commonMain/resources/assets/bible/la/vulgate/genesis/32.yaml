bible: vulgate
lang: la
language: Latina
book: Genesis
chapter: "32"
verses:
  "1": 'Iacob quoque ábiit itínere quo cœ́perat: fuerúntque ei óbviam ángeli Dei.'
  "2": 'Quos cum vidísset, ait: Castra Dei sunt hæc: et appellávit nomen loci illíus Mahanáim, id est, Castra.'
  "3": 'Misit autem et núntios ante se ad Esau fratrem suum in terram Seir, in regiónem Edom:'
  "4": 'præcepítque eis, dicens: Sic loquímini dómino meo Esau: Hæc dicit frater tuus Iacob: Apud Laban peregrinátus sum, et fui usque in præséntem diem.'
  "5": 'Hábeo boves, et ásinos, et oves, et servos, et ancíllas: mittóque nunc legatiónem ad dóminum meum, ut invéniam grátiam in conspéctu tuo.'
  "6": 'Reversíque sunt núntii ad Iacob, dicéntes: Vénimus ad Esau fratrem tuum, et ecce próperat tibi in occúrsum cum quadringéntis viris.'
  "7": 'Tímuit Iacob valde: et pertérritus divísit pópulum qui secum erat, greges quoque et oves et boves, et camélos, in duas turmas,'
  "8": 'dicens: Si vénerit Esau ad unam turmam, et percússerit eam, ália turma, quæ relícta est, salvábitur.'
  "9": 'Dixítque Iacob: Deus patris mei Abraham, et Deus patris mei Isaac: Dómine qui dixísti mihi: Revértere in terram tuam, et in locum nativitátis tuæ, et benefáciam tibi:'
  "10": 'minor sum cunctis miseratiónibus tuis, et veritáte tua quam explevísti servo tuo. In báculo meo transívi Iordánem istum: et nunc cum duábus turmis regrédior.'
  "11": 'Erue me de manu fratris mei Esau, quia valde eum tímeo: ne forte véniens percútiat matrem cum fíliis.'
  "12": Tu locútus es quod benefáceres mihi, et dilatáres semen meum sicut arénam maris, quæ præ multitúdine numerári non potest.
  "13": Cumque dormísset ibi nocte illa, separávit de his quæ habébat, múnera Esau fratri suo,
  "14": capras ducéntas, hircos vigínti, oves ducéntas, et aríetes vigínti,
  "15": camélos fœtas cum pullis suis trigínta, vaccas quadragínta, et tauros vigínti, ásinas vigínti et pullos eárum decem.
  "16": 'Et misit per manus servórum suórum síngulos seórsum greges, dixítque púeris suis: Antecédite me, et sit spátium inter gregem et gregem.'
  "17": 'Et præcépit prióri, dicens: Si óbvium habúeris fratrem meum Esau, et interrogáverit te: Cuius es? aut, Quo vadis? aut, Cuius sunt ista quæ séqueris?'
  "18": 'respondébis: Servi tui Iacob, múnera misit dómino meo Esau: ipse quoque post nos venit.'
  "19": 'Simíliter dedit mandáta secúndo, et tértio, et cunctis qui sequebántur greges, dicens: Iísdem verbis loquímini ad Esau cum invenéritis eum.'
  "20": 'Et addétis: Ipse quoque servus tuus Iacob iter nostrum inséquitur. Dixit enim: Placábo illum munéribus quæ præcédunt, et póstea vidébo illum: fórsitan propitiábitur mihi.'
  "21": Præcessérunt ítaque múnera ante eum, ipse vero mansit nocte illa in castris.
  "22": Cumque matúre surrexísset, tulit duas uxóres suas, et tótidem fámulas cum úndecim fíliis, et transívit vadum Iaboc.
  "23": Traductísque ómnibus quæ ad se pertinébant,
  "24": 'mansit solus: et ecce vir luctabátur cum eo usque mane.'
  "25": Qui cum vidéret quod eum superáre non posset, tétigit nervum fémoris eius, et statim emárcuit.
  "26": 'Dixítque ad eum: Dimítte me: iam enim ascéndit auróra. Respóndit: Non dimíttam te, nisi benedíxeris mihi.'
  "27": 'Ait ergo: Quod nomen est tibi? Respóndit: Iacob.'
  "28": 'At ille: Nequáquam, inquit, Iacob appellábitur nomen tuum, sed Israel: quóniam si contra Deum fortis fuísti, quanto magis contra hómines prævalébis?'
  "29": 'Interrogávit eum Iacob: Dic mihi, quo appelláris nómine? Respóndit: Cur quæris nomen meum? Et benedíxit ei in eódem loco.'
  "30": 'Vocavítque Iacob nomen loci illíus Phánuel, dicens: Vidi Deum fácie ad fáciem, et salva facta est ánima mea.'
  "31": 'Ortúsque est ei statim sol, postquam transgréssus est Phánuel: ipse vero claudicábat pede.'
  "32": 'Quam ob causam non cómedunt nervum fílii Israel, qui emárcuit in fémore Iacob, usque in præséntem diem: eo quod tetígerit nervum fémoris eius, et obstupúerit.'
