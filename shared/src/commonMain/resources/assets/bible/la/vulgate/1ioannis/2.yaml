bible: vulgate
lang: la
language: Latina
book: I Ioannis
chapter: "2"
verses:
  "1": 'Filíoli mei, hæc scribo vobis, ut non peccétis. Sed et si quis peccáverit, advocátum habémus apud Patrem, Iesum Christum iustum:'
  "2": 'et ipse est propitiátio pro peccátis nostris: non pro nostris autem tantum, sed étiam pro totíus mundi.'
  "3": Et in hoc scimus quóniam cognóvimus eum, si mandáta eius observémus.
  "4": Qui dicit se nosse eum, et mandáta eius non custódit, mendax est, et in hoc véritas non est.
  "5": 'Qui autem servat verbum eius, vere in hoc cáritas Dei perfécta est: et in hoc scimus quóniam in ipso sumus.'
  "6": Qui dicit se in ipso manére, debet, sicut ille ambulávit, et ipse ambuláre.
  "7": 'Caríssimi, non mandátum novum scribo vobis, sed mandátum vetus, quod habuístis ab inítio: mandátum vetus est verbum, quod audístis.'
  "8": 'Iterum mandátum novum scribo vobis, quod verum est et in ipso, et in vobis: quia ténebræ transiérunt, et verum lumen iam lucet.'
  "9": Qui dicit se in luce esse, et fratrem suum odit, in ténebris est usque adhuc.
  "10": Qui díligit fratrem suum, in lúmine manet, et scándalum in eo non est.
  "11": 'Qui autem odit fratrem suum, in ténebris est, et in ténebris ámbulat, et nescit quo eat: quia ténebræ obcæcavérunt óculos eius.'
  "12": Scribo vobis, filíoli, quóniam remittúntur vobis peccáta propter nomen eius.
  "13": Scribo vobis patres, quóniam cognovístis eum, qui ab inítio est. Scribo vobis adolescéntes, quóniam vicístis malígnum.
  "14": Scribo vobis infántes, quóniam cognovístis patrem. Scribo vobis iúvenes, quóniam fortes estis, et verbum Dei manet in vobis, et vicístis malígnum.
  "15": 'Nolíte dilígere mundum, neque ea, quæ in mundo sunt. Si quis díligit mundum, non est cáritas Patris in eo:'
  "16": 'quóniam omne, quod est in mundo, concupiscéntia carnis est, et concupiscéntia oculórum, et supérbia vitæ: quæ non est ex Patre, sed ex mundo est.'
  "17": 'Et mundus transit, et concupiscéntia eius: qui autem facit voluntátem Dei, manet in ætérnum.'
  "18": 'Filíoli, novíssima hora est: et sicut audístis quia Antichrístus venit, et nunc Antichrísti multi facti sunt: unde scimus, quia novíssima hora est.'
  "19": 'Ex nobis prodiérunt, sed non erant ex nobis: nam, si fuíssent ex nobis, permansíssent útique nobíscum: sed ut manifésti sint quóniam non sunt omnes ex nobis.'
  "20": Sed vos unctiónem habétis a Sancto, et nostis ómnia.
  "21": 'Non scripsi vobis quasi ignorántibus veritátem, sed quasi sciéntibus eam: et quóniam omne mendácium ex veritáte non est.'
  "22": Quis est mendax, nisi is, qui negat quóniam Iesus est Christus? Hic est Antichrístus, qui negat Patrem, et Fílium.
  "23": 'Omnis, qui negat Fílium, nec Patrem habet: qui confitétur Fílium, et Patrem habet.'
  "24": 'Vos quod audístis ab inítio, in vobis permáneat: si in vobis permánserit quod audístis ab inítio, et vos in Fílio, et Patre manébitis.'
  "25": Et hæc est repromíssio, quam ipse pollícitus est nobis, vitam ætérnam.
  "26": Hæc scripsi vobis de his, qui sedúcunt vos.
  "27": 'Et vos unctiónem, quam accepístis ab eo, máneat in vobis. Et non necésse habétis ut áliquis dóceat vos: sed sicut únctio eius docet vos de ómnibus, et verum est, et non est mendácium. Et sicut dócuit vos: manéte in eo.'
  "28": 'Et nunc filíoli manéte in eo: ut cum apparúerit, habeámus fidúciam, et non confundámur ab eo in advéntu eius.'
  "29": Si scitis quóniam iustus est, scitóte quóniam et omnis, qui facit iustítiam, ex ipso natus est.
