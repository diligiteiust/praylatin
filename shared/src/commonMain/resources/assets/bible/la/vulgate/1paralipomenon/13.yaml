bible: vulgate
lang: la
language: Latina
book: I Paralipomenon
chapter: "13"
verses:
  "1": Iniit autem consílium David cum tribúnis, et centuriónibus, et univérsis princípibus,
  "2": 'et ait ad omnem cœtum Israel: Si placet vobis, et a Dómino Deo nostro egréditur sermo, quem loquor: mittámus ad fratres nostros réliquos in univérsas regiónes Israel, et ad sacerdótes, et Levítas, qui hábitant in suburbánis úrbium, ut congregéntur ad nos,'
  "3": 'et reducámus arcam Dei nostri ad nos: non enim requisívimus eam in diébus Saul.'
  "4": 'Et respóndit univérsa multitúdo ut ita fíeret: placúerat enim sermo omni pópulo.'
  "5": Congregávit ergo David cunctum Israel, a Sihor Ægýpti usque dum ingrediáris Emath, ut addúceret arcam Dei de Cariathíarim.
  "6": Et ascéndit David, et omnis vir Israel, ad collem Cariathíarim, qui est in Iuda, ut afférret inde arcam Dómini Dei sedéntis super chérubim, ubi invocátum est nomen eius.
  "7": 'Imposuerúntque arcam Dei super plaustrum novum, de domo Abínadab: Oza autem, et frater eius minábant plaustrum.'
  "8": Porro David, et univérsus Israel, ludébant coram Deo omni virtúte in cánticis, et in cítharis, et psaltériis, et týmpanis, et cýmbalis, et tubis.
  "9": 'Cum autem pervenísset ad áream Chidon, teténdit Oza manum suam, ut sustentáret arcam: bos quippe lascíviens páululum inclináverat eam.'
  "10": 'Irátus est ítaque Dóminus contra Ozam, et percússit eum, eo quod tetigísset arcam: et mórtuus est ibi coram Dómino.'
  "11": 'Contristatúsque est David, eo quod divisísset Dóminus Ozam: vocavítque locum illum Divísio Ozæ, usque in præséntem diem.'
  "12": 'Et tímuit Deum tunc témporis, dicens: Quómodo possum ad me introdúcere arcam Dei?'
  "13": Et ob hanc causam non addúxit eam ad se, hoc est, in civitátem David, sed avértit in domum Obédedom Gethǽi.
  "14": 'Mansit ergo arca Dei in domo Obédedom tribus ménsibus: et benedíxit Dóminus dómui eius, et ómnibus quæ habébat.'
