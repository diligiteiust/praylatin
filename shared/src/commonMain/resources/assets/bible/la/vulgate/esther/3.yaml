bible: vulgate
lang: la
language: Latina
book: Esther
chapter: "3"
verses:
  "1": 'Post hæc rex Assuérus exaltávit Aman fílium Amadáthi, qui erat de stirpe Agag: et pósuit sólium eius super omnes príncipes, quos habébat.'
  "2": 'Cunctíque servi regis, qui in fóribus palátii versabántur, flectébant génua, et adorábant Aman: sic enim præcéperat eis imperátor: solus Mardochǽus non flectébat genu, neque adorábat eum.'
  "3": 'Cui dixérunt púeri regis, qui ad fores palátii præsidébant: Cur præter céteros non obsérvas mandátum regis?'
  "4": 'Cumque hoc crébrius dícerent, et ille nollet audíre, nuntiavérunt Aman, scire cupiéntes utrum perseveráret in senténtia: díxerat enim eis se esse Iudǽum.'
  "5": Quod cum audísset Aman, et experiménto probásset quod Mardochǽus non flécteret sibi genu, nec se adoráret, irátus est valde,
  "6": 'et pro níhilo duxit in unum Mardochǽum míttere manus suas: audíerat enim quod esset gentis Iudǽæ: magísque vóluit omnem Iudæórum, qui erant in regno Assuéri, pérdere natiónem.'
  "7": 'Mense primo (cuius vocábulum est Nisan), anno duodécimo regni Assuéri, missa est sors in urnam, quæ hebráice dícitur phur, coram Aman, quo die et quo mense gens Iudæórum debéret intérfici: et exívit mensis duodécimus, qui vocátur Adar.'
  "8": 'Dixítque Aman regi Assuéro: Est pópulus per omnes províncias regni tui dispérsus, et a se mútuo separátus, novis utens légibus et cæremóniis, ínsuper et regis scita contémnens. Et óptime nosti quod non expédiat regno tuo, ut insoléscat per licéntiam.'
  "9": Si tibi placet, decérne, ut péreat, et decem míllia talentórum appéndam arcáriis gazæ tuæ.
  "10": Tulit ergo rex ánnulum, quo utebátur, de manu sua, et dedit eum Aman fílio Amadáthi de progénie Agag, hosti Iudæórum,
  "11": 'dixítque ad eum: Argéntum, quod tu pollicéris, tuum sit: de pópulo age quod tibi placet.'
  "12": 'Vocatíque sunt scribæ regis mense primo Nisan, tertiadécima die eiúsdem mensis: et scriptum est, ut iússerat Aman, ad omnes sátrapas regis, et iúdices provinciárum, diversarúmque géntium, ut quæque gens légere póterat, et audíre pro varietáte linguárum ex nómine regis Assuéri: et lítteræ signátæ ipsíus ánnulo,'
  "13": missæ sunt per cursóres regis ad univérsas províncias, ut occíderent atque delérent omnes Iudǽos, a púero usque ad senem, párvulos et mulíeres, uno die, hoc est tertiodécimo mensis duodécimi, qui vocátur Adar, et bona eórum diríperent.
  "14": Summa autem epistolárum hæc fuit, ut omnes provínciæ scirent, et parárent se ad prædíctam diem.
  "15": Festinábant cursóres, qui missi erant, regis impérium explére. Statímque in Susan pepéndit edíctum, rege et Aman celebránte convívium, et cunctis Iudǽis, qui in urbe erant, fléntibus.
