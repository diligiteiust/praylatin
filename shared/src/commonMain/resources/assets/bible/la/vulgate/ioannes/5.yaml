bible: vulgate
lang: la
language: Latina
book: Ioannes
chapter: "5"
verses:
  "1": Post hæc erat dies festus Iudæórum, et ascéndit Iesus Ierosólymam.
  "2": Est autem Ierosólymis probática piscína, quæ cognominátur hebráice Bethsáida, quinque pórticus habens.
  "3": In his iacébat multitúdo magna languéntium, cæcórum, claudórum, aridórum, exspectántium aquæ motum.
  "4": 'Angelus autem Dómini descendébat secúndum tempus in piscínam: et movebátur aqua. Et qui prior descendísset in piscínam post motiónem aquæ, sanus fiébat a quacúmque detinebátur infirmitáte.'
  "5": Erat autem quidam homo ibi trigínta et octo annos habens in infirmitáte sua.
  "6": 'Hunc autem cum vidísset Iesus iacéntem, et cognovísset quia iam multum tempus habéret, dicit ei: Vis sanus fíeri?'
  "7": 'Respóndit ei lánguidus: Dómine, hóminem non hábeo, ut, cum turbáta fúerit aqua, mittat me in piscínam: dum vénio enim ego, álius ante me descéndit.'
  "8": 'Dicit ei Iesus: Surge, tolle grabátum tuum, et ámbula.'
  "9": 'Et statim sanus factus est homo ille: et sústulit grabátum suum, et ambulábat. Erat autem sábbatum in die illo.'
  "10": 'Dicébant ergo Iudǽi illi, qui sanátus fúerat: Sábbatum est, non licet tibi tóllere grabátum tuum.'
  "11": 'Respóndit eis: Qui me sanum fecit, ille mihi dixit: Tolle grabátum tuum, et ámbula.'
  "12": 'Interrogavérunt ergo eum: Quis est ille homo qui dixit tibi: Tolle grabátum tuum, et ámbula?'
  "13": Is autem, qui sanus fúerat efféctus, nesciébat quis esset. Iesus enim declinávit a turba constitúta in loco.
  "14": 'Póstea invénit eum Iesus in templo, et dixit illi: Ecce sanus factus es: iam noli peccáre, ne detérius tibi áliquid contíngat.'
  "15": Abiit ille homo, et nuntiávit Iudǽis quia Iesus esset, qui fecit eum sanum.
  "16": Proptérea persequebántur Iudǽi Iesum, quia hæc faciébat in sábbato.
  "17": 'Iesus autem respóndit eis: Pater meus usque modo operátur, et ego óperor.'
  "18": 'Proptérea ergo magis quærébant eum Iudǽi interfícere: quia non solum solvébat sábbatum, sed et Patrem suum dicébat Deum, æquálem se fáciens Deo. Respóndit ítaque Iesus, et dixit eis:'
  "19": 'Amen, amen dico vobis: non potest Fílius a se fácere quidquam, nisi quod víderit Patrem faciéntem: quæcúmque enim ille fécerit, hæc et Fílius simíliter facit.'
  "20": 'Pater enim díligit Fílium, et ómnia demónstrat ei, quæ ipse facit: et maióra his demonstrábit ei ópera, ut vos mirémini.'
  "21": 'Sicut enim Pater súscitat mórtuos, et vivíficat: sic et Fílius, quos vult, vivíficat.'
  "22": 'Neque enim Pater iúdicat quemquam: sed omne iudícium dedit Fílio,'
  "23": 'ut omnes honoríficent Fílium, sicut honoríficant Patrem: qui non honoríficat Fílium, non honoríficat Patrem, qui misit illum.'
  "24": Amen, amen dico vobis, quia qui verbum meum audit, et credit ei, qui misit me, habet vitam ætérnam, et in iudícium non venit, sed tránsiit a morte in vitam.
  "25": 'Amen, amen dico vobis, quia venit hora, et nunc est, quando mórtui áudient vocem Fílii Dei: et qui audíerint, vivent.'
  "26": 'Sicut enim Pater habet vitam in semetípso, sic dedit et Fílio habére vitam in semetípso:'
  "27": et potestátem dedit ei iudícium fácere, quia Fílius hóminis est.
  "28": 'Nolíte mirári hoc, quia venit hora, in qua omnes, qui in monuméntis sunt, áudient vocem Fílii Dei:'
  "29": 'et procédent qui bona fecérunt, in resurrectiónem vitæ: qui vero mala egérunt, in resurrectiónem iudícii.'
  "30": 'Non possum ego a meípso fácere quidquam. Sicut áudio, iúdico: et iudícium meum iustum est, quia non quæro voluntátem meam, sed voluntátem eius, qui misit me.'
  "31": Si ego testimónium perhíbeo de meípso, testimónium meum non est verum.
  "32": 'Alius est, qui testimónium pérhibet de me: et scio quia verum est testimónium, quod pérhibet de me.'
  "33": Vos misístis ad Ioánnem, et testimónium perhíbuit veritáti.
  "34": 'Ego autem non ab hómine testimónium accípio: sed hæc dico ut vos salvi sitis.'
  "35": 'Ille erat lucérna ardens, et lucens: vos autem voluístis ad horam exsultáre in luce eius.'
  "36": 'Ego autem hábeo testimónium maius Ioánne. Opera enim, quæ dedit mihi Pater ut perfíciam ea: ipsa ópera, quæ ego fácio, testimónium pérhibent de me, quia Pater misit me:'
  "37": 'et qui misit me Pater, ipse testimónium perhíbuit de me: neque vocem eius unquam audístis, neque spéciem eius vidístis:'
  "38": 'et verbum eius non habétis in vobis manens: quia quem misit ille, huic vos non créditis.'
  "39": 'Scrutámini Scriptúras, quia vos putátis in ipsis vitam ætérnam habére: et illæ sunt, quæ testimónium pérhibent de me:'
  "40": et non vultis veníre ad me ut vitam habeátis.
  "41": Claritátem ab homínibus non accípio.
  "42": Sed cognóvi vos, quia dilectiónem Dei non habétis in vobis.
  "43": 'Ego veni in nómine Patris mei, et non accípitis me: si álius vénerit in nómine suo, illum accipiétis.'
  "44": 'Quómodo vos potéstis crédere, qui glóriam ab ínvicem accípitis: et glóriam, quæ a solo Deo est, non quǽritis?'
  "45": 'Nolíte putáre quia ego accusatúrus sim vos apud Patrem: est qui accúsat vos Móyses, in quo vos sperátis.'
  "46": 'Si enim crederétis Móysi, crederétis fórsitan et mihi: de me enim ille scripsit.'
  "47": Si autem illíus lítteris non créditis, quómodo verbis meis credétis?
