bible: vulgate
lang: la
language: Latina
book: Iob
chapter: "27"
verses:
  "1": 'Addidit quoque Iob, assúmens parábolam suam, et dixit:'
  "2": Vivit Deus, qui ábstulit iudícium meum, et Omnípotens, qui ad amaritúdinem addúxit ánimam meam,
  "3": quia donec súperest hálitus in me, et spíritus Dei in náribus meis,
  "4": non loquéntur lábia mea iniquitátem, nec lingua mea meditábitur mendácium.
  "5": 'Absit a me ut iustos vos esse iúdicem: donec defíciam, non recédam ab innocéntia mea.'
  "6": 'Iustificatiónem meam, quam cœpi tenére, non déseram: neque enim reprehéndit me cor meum in omni vita mea.'
  "7": 'Sit ut ímpius, inimícus meus: et adversárius meus, quasi iníquus.'
  "8": Quæ est enim spes hypócritæ si aváre rápiat, et non líberet Deus ánimam eius?
  "9": Numquid Deus áudiet clamórem eius, cum vénerit super eum angústia?
  "10": Aut póterit in Omnipoténte delectári, et invocáre Deum omni témpore?
  "11": Docébo vos per manum Dei quæ Omnípotens hábeat, nec abscóndam.
  "12": Ecce, vos omnes nostis, et quid sine causa vana loquímini?
  "13": Hæc est pars hóminis ímpii apud Deum, et heréditas violentórum, quam ab Omnipoténte suscípient.
  "14": Si multiplicáti fúerint fílii eius, in gládio erunt, et nepótes eius non saturabúntur pane.
  "15": Qui réliqui fúerint ex eo sepeliéntur in intéritu, et víduæ illíus non plorábunt.
  "16": 'Si comportáverit quasi terram argéntum, et sicut lutum præparáverit vestiménta:'
  "17": 'præparábit quidem, sed iustus vestiétur illis: et argéntum ínnocens dívidet.'
  "18": Ædificávit sicut tínea domum suam, et sicut custos fecit umbráculum.
  "19": 'Dives cum dormíerit, nihil secum áuferet: apériet óculos suos, et nihil invéniet.'
  "20": Apprehéndet eum quasi aqua inópia, nocte ópprimet eum tempéstas.
  "21": Tollet eum ventus urens, et áuferet, et velut turbo rápiet eum de loco suo.
  "22": 'Et mittet super eum, et non parcet: de manu eius fúgiens fúgiet.'
  "23": Stringet super eum manus suas, et sibilábit super illum, íntuens locum eius.
