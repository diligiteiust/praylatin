bible: vulgate
lang: la
language: Latina
book: Ieremias
chapter: "50"
verses:
  "1": Verbum, quod locútus est Dóminus de Babylóne et de terra Chaldæórum, in manu Ieremíæ prophétæ.
  "2": 'Annuntiáte in géntibus, et audítum fácite: leváte signum, prædicáte, et nolíte celáre: dícite: Capta est Bábylon, confúsus est Bel, victus est Mérodach, confúsa sunt sculptília eius, superáta sunt idóla eórum.'
  "3": 'Quóniam ascéndit contra eam gens ab aquilóne, quæ ponet terram eius in solitúdinem: et non erit qui hábitet in ea ab hómine usque ad pecus: et moti sunt, et abiérunt.'
  "4": 'In diébus illis, et in témpore illo, ait Dóminus: vénient fílii Israel, ipsi et fílii Iuda simul: ambulántes et flentes properábunt, et Dóminum Deum suum quærent.'
  "5": 'In Sion interrogábunt viam, huc fácies eórum: vénient, et apponéntur ad Dóminum fœ́dere sempitérno, quod nulla oblivióne delébitur.'
  "6": 'Grex pérditus factus est pópulus meus: pastóres eórum seduxérunt eos, fecerúntque vagári in móntibus: de monte in collem transiérunt, oblíti sunt cubílis sui.'
  "7": 'Omnes, qui invenérunt, comedérunt eos, et hostes eórum dixérunt: Non peccávimus: pro eo quod peccavérunt Dómino decóri iustítiæ, et exspectatióni patrum eórum Dómino.'
  "8": 'Recédite de médio Babylónis, et de terra Chaldæórum egredímini: et estóte quasi hædi ante gregem.'
  "9": 'Quóniam ecce ego súscito, et addúcam in Babylónem congregatiónem géntium magnárum de terra aquilónis: et præparabúntur advérsus eam, et inde capiétur: sagítta eius quasi viri fortis interfectóris, non revertétur vácua.'
  "10": 'Et erit Chaldǽa in prædam: omnes vastántes eam replebúntur, ait Dóminus.'
  "11": 'Quóniam exsultátis, et magna loquímini, diripiéntes hereditátem meam: quóniam effúsi estis sicut vítuli super herbam, et mugístis sicut tauri.'
  "12": 'Confúsa est mater vestra nimis, et adæquáta púlveri, quæ génuit vos: ecce novíssima erit in géntibus, desérta, ínvia, et arens.'
  "13": 'Ab ira Dómini non habitábitur, sed redigétur tota in solitúdinem: omnis, qui transíbit per Babylónem, stupébit, et sibilábit super univérsis plagis eius.'
  "14": 'Præparámini contra Babylónem per circúitum omnes qui ténditis arcum: debelláte eam, non parcátis iáculis, quia Dómino peccávit.'
  "15": 'Clamáte advérsus eam, ubíque dedit manum, cecidérunt fundaménta eius, destrúcti sunt muri eius, quóniam últio Dómini est: ultiónem accípite de ea: sicut fecit, fácite ei.'
  "16": 'Dispérdite satórem de Babylóne, et tenéntem falcem in témpore messis: a fácie gládii colúmbæ unusquísque ad pópulum suum convertétur, et sínguli ad terram suam fúgient.'
  "17": 'Grex dispérsus Israel, leónes eiecérunt eum: primus comédit eum rex Assur: iste novíssimus exossávit eum Nabuchodónosor rex Babylónis.'
  "18": 'Proptérea hæc dicit Dóminus exercítuum, Deus Israel: Ecce ego visitábo regem Babylónis et terram eius, sicut visitávi regem Assur:'
  "19": 'et redúcam Israel ad habitáculum suum: et pascétur Carmélum, et Basan, et in monte Ephraim, et Gálaad saturábitur ánima eius.'
  "20": 'In diébus illis, et in témpore illo, ait Dóminus, quærétur iníquitas Israel, et non erit: et peccátum Iuda, et non inveniétur: quóniam propítius ero eis quos relíquero.'
  "21": 'Super terram dominántium ascénde, et super habitatóres eius vísita, díssipa, et intérfice quæ post eos sunt, ait Dóminus: et fac iuxta ómnia quæ præcépi tibi.'
  "22": Vox belli in terra, et contrítio magna.
  "23": Quómodo confráctus est, et contrítus málleus univérsæ terræ? quómodo versa est in desértum Bábylon in géntibus?
  "24": 'Illaqueávi te, et capta es Bábylon, et nesciébas: invénta es et apprehénsa, quóniam Dóminum provocásti.'
  "25": 'Apéruit Dóminus thesáurum suum, et prótulit vasa iræ suæ: quóniam opus est Dómino Deo exercítuum in terra Chaldæórum.'
  "26": 'Veníte ad eam ab extrémis fínibus, aperíte ut éxeant qui concúlcent eam: tóllite de via lápides, et redígite in acérvos, et interfícite eam: nec sit quidquam réliquum.'
  "27": 'Dissipáte univérsos fortes eius, descéndant in occisiónem: væ eis, quia venit dies eórum, tempus visitatiónis eórum.'
  "28": Vox fugiéntium, et eórum, qui evasérunt de terra Babylónis, ut annúntient in Sion ultiónem Dómini Dei nostri, ultiónem templi eius.
  "29": 'Annuntiáte in Babylónem plúrimis ómnibus, qui tendunt arcum: consístite advérsus eam per gyrum, et nullus evádat: réddite ei secúndum opus suum: iuxta ómnia quæ fecit, fácite illi: quia contra Dóminum erécta est, advérsum sanctum Israel.'
  "30": 'Idcírco cadent iúvenes eius in platéis eius: et omnes viri bellatóres eius conticéscent in die illa, ait Dóminus.'
  "31": 'Ecce ego ad te supérbe, dicit Dóminus Deus exercítuum: quia venit dies tuus, tempus visitatiónis tuæ.'
  "32": 'Et cadet supérbus, et córruet, et non erit qui súscitet eum: et succéndam ignem in úrbibus eius, et devorábit ómnia in circúitu eius.'
  "33": 'Hæc dicit Dóminus exercítuum: Calúmniam sústinent fílii Israel, et fílii Iuda simul: omnes, qui cepérunt eos, tenent, nolunt dimíttere eos.'
  "34": 'Redémptor eórum fortis, Dóminus exercítuum nomen eius: iudício deféndet causam eórum, ut extérreat terram, et commóveat habitatóres Babylónis.'
  "35": Gládius ad Chaldǽos, ait Dóminus, et ad habitatóres Babylónis, et ad príncipes, et ad sapiéntes eius.
  "36": 'Gládius ad divínos eius, qui stulti erunt: gládius ad fortes illíus, qui timébunt.'
  "37": 'Gládius ad equos eius, et ad currus eius, et ad omne vulgus, quod est in médio eius: et erunt quasi mulíeres: gládius ad thesáuros eius, qui diripiéntur.'
  "38": Síccitas super aquas eius erit, et aréscent, quia terra sculptílium est, et in porténtis gloriántur.
  "39": 'Proptérea habitábunt dracónes cum faunis ficáriis: et habitábunt in ea struthiónes: et non inhabitábitur ultra usque in sempitérnum, nec exstruétur usque ad generatiónem et generatiónem.'
  "40": 'Sicut subvértit Dóminus Sódomam et Gomórrham, et vicínas eius, ait Dóminus: non habitábit ibi vir, et non íncolet eam fílius hóminis.'
  "41": Ecce pópulus venit ab aquilóne, et gens magna, et reges multi consúrgent a fínibus terræ.
  "42": 'Arcum et scutum apprehéndent: crudéles sunt, et immisericórdes: vox eórum quasi mare sonábit, et super equos ascéndent, sicut vir parátus ad prœ́lium contra te fília Bábylon.'
  "43": 'Audívit rex Babylónis famam eórum, et dissolútæ sunt manus eius: angústia apprehéndit eum, dolor quasi parturiéntem.'
  "44": 'Ecce quasi leo ascéndet de supérbia Iordánis ad pulchritúdinem robústam: quia súbito cúrrere fáciam eum ad illam: et quis erit eléctus, quem præpónam ei? quis est enim símilis mei? et quis sustinébit me? et quis est iste pastor, qui resístat vúltui meo?'
  "45": 'Proptérea audíte consílium Dómini, quod mente concépit advérsum Babylónem: et cogitatiónes eius, quas cogitávit super terram Chaldæórum: Nisi detráxerint eos párvuli gregum, nisi dissipátum fúerit cum ipsis habitáculum eórum.'
  "46": A voce captivitátis Babylónis commóta est terra, et clamor inter gentes audítus est.
