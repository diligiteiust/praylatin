bible: vulgate
lang: la
language: Latina
book: Deuteronomium
chapter: "16"
verses:
  "1": 'Obsérva mensem novárum frugum, et verni primum témporis, ut fácias Phase Dómino Deo tuo: quóniam in isto mense edúxit te Dóminus Deus tuus de Ægýpto nocte.'
  "2": Immolabísque Phase Dómino Deo tuo de óvibus, et de bobus in loco, quem elégerit Dóminus Deus tuus, ut hábitet nomen eius ibi.
  "3": 'Non cómedes in eo panem fermentátum: septem diébus cómedes absque ferménto afflictiónis panem, quóniam in pavóre egréssus es de Ægýpto: ut memíneris diéi egressiónis tuæ de Ægýpto, ómnibus diébus vitæ tuæ.'
  "4": Non apparébit ferméntum in ómnibus términis tuis septem diébus, et non remanébit de cárnibus eius quod immolátum est véspere in die primo usque mane.
  "5": 'Non póteris immoláre Phase in quálibet úrbium tuárum, quas Dóminus Deus tuus datúrus est tibi:'
  "6": 'sed in loco, quem elégerit Dóminus Deus tuus, ut hábitet nomen eius ibi: immolábis Phase véspere ad solis occásum, quando egréssus es de Ægýpto.'
  "7": Et coques, et cómedes in loco, quem elégerit Dóminus Deus tuus, manéque consúrgens vades in tabernácula tua.
  "8": 'Sex diébus cómedes ázyma: et in die séptima, quia collécta est Dómini Dei tui, non fácies opus.'
  "9": Septem hebdómadas numerábis tibi ab ea die qua falcem in ségetem míseris.
  "10": 'Et celebrábis diem festum hebdomadárum Dómino Deo tuo, oblatiónem spontáneam manus tuæ, quam ófferes iuxta benedictiónem Dómini Dei tui:'
  "11": 'et epuláberis coram Dómino Deo tuo, tu, fílius tuus, et fília tua, servus tuus, et ancílla tua, et Levítes qui est intra portas tuas, ádvena ac pupíllus et vídua, qui morántur vobíscum: in loco quem elégerit Dóminus Deus tuus, ut hábitet nomen eius ibi:'
  "12": 'et recordáberis quóniam servus fúeris in Ægýpto: custodiésque ac fácies quæ præcépta sunt.'
  "13": 'Solemnitátem quoque tabernaculórum celebrábis per septem dies, quando collégeris de área et torculári fruges tuas:'
  "14": et epuláberis in festivitáte tua, tu, fílius tuus, et fília, servus tuus et ancílla, Levítes quoque et ádvena, pupíllus ac vídua qui intra portas tuas sunt.
  "15": 'Septem diébus Dómino Deo tuo festa celebrábis in loco, quem elégerit Dóminus: benedicétque tibi Dóminus Deus tuus in cunctis frúgibus tuis, et in omni ópere mánuum tuárum, erísque in lætítia.'
  "16": 'Tribus vícibus per annum apparébit omne masculínum tuum in conspéctu Dómini Dei tui in loco quem elégerit: in solemnitáte azymórum, in solemnitáte hebdomadárum, et in solemnitáte tabernaculórum. Non apparébit ante Dóminum vácuus:'
  "17": sed ófferet unusquísque secúndum quod habúerit iuxta benedictiónem Dómini Dei sui, quam déderit ei.
  "18": 'Iúdices et magístros constítues in ómnibus portis tuis, quas Dóminus Deus tuus déderit tibi, per síngulas tribus tuas: ut iúdicent pópulum iusto iudício,'
  "19": 'nec in álteram partem declínent. Non accípies persónam, nec múnera: quia múnera excǽcant óculos sapiéntum, et mutant verba iustórum.'
  "20": 'Iuste quod iustum est persequéris: ut vivas et possídeas terram, quam Dóminus Deus tuus déderit tibi.'
  "21": Non plantábis lucum, et omnem árborem iuxta altáre Dómini Dei tui.
  "22": 'Nec fácies tibi, neque constítues státuam: quæ odit Dóminus Deus tuus.'
