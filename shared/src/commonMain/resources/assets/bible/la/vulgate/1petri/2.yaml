bible: vulgate
lang: la
language: Latina
book: I Petri
chapter: "2"
verses:
  "1": Deponéntes ígitur omnem malítiam, et omnem dolum, et simulatiónes, et invídias, et omnes detractiónes,
  "2": 'sicut modo géniti infántes, rationábile, sine dolo lac concupíscite: ut in eo crescátis in salútem:'
  "3": si tamen gustástis quóniam dulcis est Dóminus.
  "4": 'Ad quem accedéntes lápidem vivum, ab homínibus quidem reprobátum, a Deo autem eléctum, et honorificátum:'
  "5": et ipsi tamquam lápides vivi superædificámini, domus spirituális, sacerdótium sanctum, offérre spirituáles hóstias, acceptábiles Deo per Iesum Christum.
  "6": 'Propter quod cóntinet Scriptúra: Ecce pono in Sion lápidem summum angulárem, eléctum, pretiósum: et qui credíderit in eum, non confundétur.'
  "7": 'Vobis ígitur honor credéntibus: non credéntibus autem lapis, quem reprobavérunt ædificántes: hic factus est in caput ánguli,'
  "8": et lapis offensiónis, et petra scándali his, qui offéndunt verbo, nec credunt in quo et pósiti sunt.
  "9": 'Vos autem genus eléctum, regále sacerdótium, gens sancta, pópulus acquisitiónis: ut virtútes annuntiétis eius, qui de ténebris vos vocávit in admirábile lumen suum.'
  "10": 'Qui aliquándo non pópulus, nunc autem pópulus Dei: qui non consecúti misericórdiam, nunc autem misericórdiam consecúti.'
  "11": Caríssimi, óbsecro vos tamquam ádvenas et peregrínos abstinére vos a carnálibus desidériis, quæ mílitant advérsus ánimam,
  "12": 'conversatiónem vestram inter gentes habéntes bonam: ut in eo, quod detréctant de vobis tamquam de malefactóribus, ex bonis opéribus vos considerántes, gloríficent Deum in die visitatiónis.'
  "13": 'Subiécti ígitur estóte omni humánæ creatúræ propter Deum: sive regi quasi præcellénti:'
  "14": 'sive dúcibus tamquam ab eo missis ad vindíctam malefactórum, laudem vero bonórum:'
  "15": 'quia sic est volúntas Dei, ut benefaciéntes obmutéscere faciátis imprudéntium hóminum ignorántiam:'
  "16": quasi líberi, et non quasi velámen habéntes malítiæ libertátem, sed sicut servi Dei.
  "17": 'Omnes honoráte: fraternitátem dilígite: Deum timéte: regem honorificáte.'
  "18": Servi súbditi estóte in omni timóre dóminis, non tantum bonis et modéstis, sed étiam dýscolis.
  "19": Hæc est enim grátia, si propter Dei consciéntiam sústinet quis tristítias, pátiens iniúste.
  "20": Quæ enim est glória, si peccántes, et colaphizáti suffértis? sed si bene faciéntes patiénter sustinétis, hæc est grátia apud Deum.
  "21": 'In hoc enim vocáti estis: quia et Christus passus est pro nobis, vobis relínquens exémplum ut sequámini vestígia eius:'
  "22": 'qui peccátum non fecit, nec invéntus est dolus in ore eius:'
  "23": 'qui cum maledicerétur, non maledicébat: cum paterétur, non comminabátur: tradébat autem iudicánti se iniúste:'
  "24": 'qui peccáta nostra ipse pértulit in córpore suo super lignum: ut peccátis mórtui, iustítiæ vivámus: cuius livóre sanáti estis.'
  "25": Erátis enim sicut oves errántes, sed convérsi estis nunc ad pastórem, et epíscopum animárum vestrárum.
