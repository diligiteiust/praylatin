bible: vulgate
lang: la
language: Latina
book: Ecclesiasticus
chapter: "2"
verses:
  "1": Fili accédens ad servitútem Dei, sta in iustítia, et timóre, et prǽpara ánimam tuam ad tentatiónem.
  "2": 'Déprime cor tuum, et sústine: inclína aurem tuam, et súscipe verba intelléctus: et ne festínes in témpore obductiónis.'
  "3": 'Sústine sustentatiónes Dei: coniúngere Deo, et sústine, ut crescat in novíssimo vita tua.'
  "4": 'Omne, quod tibi applicítum fúerit, áccipe: et in dolóre sústine, et in humilitáte tua patiéntiam habe:'
  "5": quóniam in igne probátur aurum et argéntum, hómines vero receptíbiles in camíno humiliatiónis.
  "6": 'Crede Deo, et recuperábit te: et dírige viam tuam, et spera in illum: serva timórem illíus, et in illo veterásce.'
  "7": 'Metuéntes Dóminum, sustinéte misericórdiam eius: et non deflectátis ab illo, ne cadátis.'
  "8": 'Qui timétis Dóminum, crédite illi: et non evacuábitur merces vestra.'
  "9": 'Qui timétis Dóminum, speráte in illum: et in oblectatiónem véniet vobis misericórdia.'
  "10": 'Qui timétis Dóminum, dilígite illum: et illuminabúntur corda vestra.'
  "11": 'Respícite fílii natiónes hóminum: et scitóte quia nullus sperávit in Dómino, et confúsus est.'
  "12": Quis enim permánsit in mandátis eius, et derelíctus est? aut quis invocávit eum, et despéxit illum?
  "13": 'Quóniam pius et miséricors est Deus, et remíttet in die tribulatiónis peccáta: et protéctor est ómnibus exquiréntibus se in veritáte.'
  "14": Væ dúplici corde, et lábiis sceléstis, et mánibus malefaciéntibus, et peccatóri terram ingrediénti duábus viis.
  "15": 'Væ dissolútis corde, qui non credunt Deo: et ídeo non protegéntur ab eo.'
  "16": Væ his, qui perdidérunt sustinéntiam, et qui dereliquérunt vias rectas, et divertérunt in vias pravas.
  "17": Et quid fácient cum inspícere cœ́perit Dóminus?
  "18": 'Qui timent Dóminum, non erunt incredíbiles verbo illíus: et qui díligunt illum, conservábunt viam illíus.'
  "19": 'Qui timent Dóminum, inquírent quæ beneplácita sunt ei: et qui díligunt eum, replebúntur lege ipsíus.'
  "20": Qui timent Dóminum, præparábunt corda sua, et in conspéctu illíus sanctificábunt ánimas suas.
  "21": Qui timent Dóminum, custódiunt mandáta illíus, et patiéntiam habébunt usque ad inspectiónem illíus,
  "22": 'dicéntes: Si pœniténtiam non egérimus, incidémus in manus Dómini, et non in manus hóminum.'
  "23": Secúndum enim magnitúdinem ipsíus, sic et misericórdia illíus cum ipso est.
