bible: vulgate
lang: la
language: Latina
book: Iob
chapter: "13"
verses:
  "1": Ecce ómnia hæc vidit óculus meus, et audívit auris mea, et intelléxi síngula.
  "2": 'Secúndum sciéntiam vestram et ego novi: nec inférior vestri sum.'
  "3": 'Sed tamen ad Omnipoténtem loquar, et disputáre cum Deo cúpio:'
  "4": prius vos osténdens fabricatóres mendácii, et cultóres perversórum dógmatum.
  "5": Atque útinam tacerétis, ut putarémini esse sapiéntes.
  "6": Audíte ergo correptiónem meam, et iudícium labiórum meórum atténdite.
  "7": Numquid Deus índiget vestro mendácio, ut pro illo loquámini dolos?
  "8": Numquid fáciem eius accípitis, et pro Deo iudicáre nitímini?
  "9": Aut placébit ei quem celáre nihil potest? aut decipiétur ut homo, vestris frauduléntiis?
  "10": Ipse vos árguet, quóniam in abscóndito fáciem eius accípitis.
  "11": Statim ut se commóverit, turbábit vos, et terror eius írruet super vos.
  "12": Memória vestra comparábitur cíneri, et redigéntur in lutum cervíces vestræ.
  "13": Tacéte paulísper, ut loquar quodcúmque mihi mens suggésserit.
  "14": Quare lácero carnes meas déntibus meis, et ánimam meam porto in mánibus meis?
  "15": 'Etiam si occíderit me, in ipso sperábo: verúmtamen vias meas in conspéctu eius árguam.'
  "16": 'Et ipse erit salvátor meus: non enim véniet in conspéctu eius omnis hypócrita.'
  "17": Audíte sermónem meum, et ænígmata percípite áuribus vestris.
  "18": Si fúero iudicátus, scio quod iustus invéniar.
  "19": 'Quis est qui iudicétur mecum? véniat: quare tacens consúmor?'
  "20": 'Duo tantum ne fácias mihi, et tunc a fácie tua non abscóndar:'
  "21": manum tuam longe fac a me, et formído tua non me térreat.
  "22": 'Voca me, et ego respondébo tibi: aut certe loquar, et tu respónde mihi.'
  "23": Quantas hábeo iniquitátes et peccáta, scélera mea et delícta osténde mihi.
  "24": Cur fáciem tuam abscóndis, et arbitráris me inimícum tuum?
  "25": 'Contra fólium, quod vento rápitur, osténdis poténtiam tuam, et stípulam siccam perséqueris:'
  "26": scribis enim contra me amaritúdines, et consúmere me vis peccátis adolescéntiæ meæ.
  "27": 'Posuísti in nervo pedem meum, et observásti omnes sémitas meas, et vestígia pedum meórum considerásti:'
  "28": qui quasi putrédo consuméndus sum, et quasi vestiméntum, quod coméditur a tínea.
