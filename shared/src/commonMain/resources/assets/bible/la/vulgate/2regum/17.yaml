bible: vulgate
lang: la
language: Latina
book: II Regum
chapter: "17"
verses:
  "1": Anno duodécimo Achaz regis Iuda, regnávit Osée fílius Ela in Samaría super Israel novem annis.
  "2": Fecítque malum coram Dómino, sed non sicut reges Israel qui ante eum fúerant.
  "3": Contra hunc ascéndit Salmánasar rex Assyriórum, et factus est ei Osée servus, reddebátque illi tribúta.
  "4": Cumque deprehendísset rex Assyriórum Osée, quod rebelláre nitens misísset núntios ad Sua regem Ægýpti, ne præstáret tribúta regi Assyriórum sicut síngulis annis sólitus erat, obsédit eum, et vinctum misit in cárcerem.
  "5": 'Pervagatúsque est omnem terram: et ascéndens Samaríam, obsédit eam tribus annis.'
  "6": 'Anno autem nono Osée, cepit rex Assyriórum Samaríam, et tránstulit Israel in Assýrios: posuítque eos in Hala, et in Habor iuxta flúvium Gozan, in civitátibus Medórum.'
  "7": Factum est enim, cum peccássent fílii Israel Dómino Deo suo, qui edúxerat eos de terra Ægýpti, de manu Pharaónis regis Ægýpti, coluérunt deos aliénos.
  "8": 'Et ambulavérunt iuxta ritum géntium, quas consúmpserat Dóminus in conspéctu filiórum Israel, et regum Israel: quia simíliter fécerant.'
  "9": 'Et offendérunt fílii Israel verbis non rectis Dóminum Deum suum: et ædificavérunt sibi excélsa in cunctis úrbibus suis, a turre custódum usque ad civitátem munítam.'
  "10": 'Fecerúntque sibi státuas, et lucos in omni colle sublími, et subter omne lignum nemorósum:'
  "11": 'et adolébant ibi incénsum super aras in morem géntium, quas transtúlerat Dóminus a fácie eórum: fecerúntque verba péssima irritántes Dóminum.'
  "12": Et coluérunt immundítias, de quibus præcépit eis Dóminus ne fácerent verbum hoc.
  "13": 'Et testificátus est Dóminus in Israel et in Iuda per manum ómnium prophetárum et vidéntium, dicens: Revertímini a viis vestris péssimis, et custodíte præcépta mea, et cæremónias, iuxta omnem legem, quam præcépi pátribus vestris, et sicut misi ad vos in manu servórum meórum prophetárum.'
  "14": Qui non audiérunt, sed induravérunt cervícem suam iuxta cervícem patrum suórum, qui noluérunt obedíre Dómino Deo suo.
  "15": 'Et abiecérunt legítima eius, et pactum, quod pépigit cum pátribus eórum, et testificatiónes, quibus contestátus est eos: secutíque sunt vanitátes, et vane egérunt: et secúti sunt gentes, quæ erant per circúitum eórum, super quibus præcéperat Dóminus eis, ut non fácerent sicut et illæ faciébant.'
  "16": 'Et dereliquérunt ómnia præcépta Dómini Dei sui: fecerúntque sibi conflátiles duos vítulos, et lucos, et adoravérunt univérsam milítiam cæli: servierúntque Baal,'
  "17": 'et consecravérunt fílios suos, et fílias suas per ignem: et divinatiónibus inserviébant, et augúriis: et tradidérunt se ut fácerent malum coram Dómino, ut irritárent eum.'
  "18": Iratúsque est Dóminus veheménter Israéli, et ábstulit eos a conspéctu suo, et non remánsit nisi tribus Iuda tantúmmodo.
  "19": 'Sed nec ipse Iuda custodívit mandáta Dómini Dei sui: verum ambulávit in erróribus Israel, quos operátus fúerat.'
  "20": 'Proiecítque Dóminus omne semen Israel, et afflíxit eos, et trádidit eos in manu diripiéntium, donec proíceret eos a fácie sua:'
  "21": 'ex eo iam témpore, quo scissus est Israel a domo David, et constituérunt sibi regem Ieróboam fílium Nabat: separávit enim Ieróboam Israel a Dómino, et peccáre eos fecit peccátum magnum.'
  "22": 'Et ambulavérunt fílii Israel in univérsis peccátis Ieróboam quæ fécerat: et non recessérunt ab eis,'
  "23": 'úsquequo Dóminus auférret Israel a fácie sua, sicut locútus fúerat in manu ómnium servórum suórum prophetárum: translatúsque est Israel de terra sua in Assýrios, usque in diem hanc.'
  "24": 'Addúxit autem rex Assyriórum de Babylóne, et de Cutha, et de Avah, et de Emath, et de Sephárvaim: et collocávit eos in civitátibus Samaríæ pro fíliis Israel: qui possedérunt Samaríam, et habitavérunt in úrbibus eius.'
  "25": 'Cumque ibi habitáre cœpíssent, non timébant Dóminum: et immísit in eos Dóminus leónes, qui interficiébant eos.'
  "26": 'Nuntiatúmque est regi Assyriórum, et dictum: Gentes, quas transtulísti, et habitáre fecísti in civitátibus Samaríæ, ignórant legítima Dei terræ: et immísit in eos Dóminus leónes, et ecce interfíciunt eos, eo quod ignórent ritum Dei terræ.'
  "27": 'Præcépit autem rex Assyriórum, dicens: Dúcite illuc unum de sacerdótibus, quos inde captívos adduxístis, et vadat, et hábitet cum eis: et dóceat eos legítima Dei terræ.'
  "28": Igitur cum venísset unus de sacerdótibus his, qui captívi ducti fúerant de Samaría, habitávit in Bethel, et docébat eos quómodo cólerent Dóminum.
  "29": 'Et unaquǽque gens fabricáta est deum suum: posuerúntque eos in fanis excélsis, quæ fécerant Samarítæ, gens et gens in úrbibus suis, in quibus habitábat.'
  "30": 'Viri enim Babylónii fecérunt Sochóthbenoth: viri autem Cuthǽi fecérunt Nergel: et viri de Emath fecérunt Asima.'
  "31": Porro Hevǽi fecérunt Nébahaz et Tharthac. Hi autem, qui erant de Sephárvaim, comburébant fílios suos igni, Adrámelech et Anámelech diis Sephárvaim,
  "32": et nihilóminus colébant Dóminum. Fecérunt autem sibi de novíssimis sacerdótes excelsórum, et ponébant eos in fanis sublímibus.
  "33": Et cum Dóminum cólerent, diis quoque suis serviébant iuxta consuetúdinem géntium, de quibus transláti fúerant Samaríam.
  "34": 'Usque in præséntem diem morem sequúntur antíquum: non timent Dóminum, neque custódiunt cæremónias eius, iudícia, et legem, et mandátum, quod præcéperat Dóminus fíliis Iacob, quem cognominávit Israel:'
  "35": 'et percússerat cum eis pactum, et mandáverat eis, dicens: Nolíte timére deos aliénos, et non adorétis eos, neque colátis eos, et non immolétis eis:'
  "36": sed Dóminum Deum vestrum, qui edúxit vos de terra Ægýpti in fortitúdine magna et in bráchio exténto, ipsum timéte, et illum adoráte, et ipsi immoláte.
  "37": 'Cæremónias quoque, et iudícia, et legem, et mandátum, quod scripsit vobis, custodíte ut faciátis cunctis diébus: et non timeátis deos aliénos.'
  "38": 'Et pactum, quod percússit vobíscum, nolíte oblivísci: nec colátis deos aliénos,'
  "39": sed Dóminum Deum vestrum timéte, et ipse éruet vos de manu ómnium inimicórum vestrórum.
  "40": Illi vero non audiérunt, sed iuxta consuetúdinem suam prístinam perpetrábant.
  "41": 'Fuérunt ígitur gentes istæ timéntes quidem Dóminum, sed nihilóminus et idólis suis serviéntes: nam et fílii eórum, et nepótes, sicut fecérunt patres sui, ita fáciunt usque in præséntem diem.'
