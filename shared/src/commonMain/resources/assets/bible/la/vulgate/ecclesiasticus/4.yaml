bible: vulgate
lang: la
language: Latina
book: Ecclesiasticus
chapter: "4"
verses:
  "1": Fili eleemósynam páuperis ne defráudes, et óculos tuos ne transvértas a páupere.
  "2": 'Animam esuriéntem ne despéxeris: et non exásperes páuperem in inópia sua.'
  "3": Cor ínopis ne afflíxeris, et non prótrahas datum angustiánti.
  "4": Rogatiónem contribuláti ne abícias, et non avértas fáciem tuam ab egéno.
  "5": 'Ab ínope ne avértas óculos tuos propter iram: et non relínquas quæréntibus tibi retro maledícere:'
  "6": 'maledicéntis enim tibi in amaritúdine ánimæ, exaudiétur deprecátio illíus: exáudiet autem eum, qui fecit illum.'
  "7": Congregatióni páuperum affábilem te fácito, et presbýtero humília ánimam tuam, et magnáto humília caput tuum.
  "8": Declína páuperi sine tristítia aurem tuam, et redde débitum tuum, et respónde illi pacífica in mansuetúdine.
  "9": 'Líbera eum, qui iniúriam pátitur de manu supérbi: et non ácide feras in ánima tua.'
  "10": 'In iudicándo esto pupíllis miséricors ut pater, et pro viro matri illórum:'
  "11": et eris tu velut fílius Altíssimi obédiens, et miserébitur tui magis quam mater.
  "12": 'Sapiéntia fíliis suis vitam inspírat: et súscipit inquiréntes se, et præíbit in via iustítiæ.'
  "13": 'Et qui illam díligit, díligit vitam: et qui vigiláverint ad illam, complecténtur placórem eius.'
  "14": 'Qui tenúerint illam, vitam hereditábunt: et quo introíbit, benedícet Deus.'
  "15": 'Qui sérviunt ei, obsequéntes erunt sancto: et eos, qui díligunt illam, díligit Deus.'
  "16": 'Qui audit illam, iudicábit gentes: et qui intuétur illam, permanébit confídens.'
  "17": 'Si credíderit ei, hereditábit illam, et erunt in confirmatióne creatúræ illíus:'
  "18": quóniam in tentatióne ámbulat cum eo, et in primis éligit eum.
  "19": 'Timórem et metum, et probatiónem indúcet super illum: et cruciábit illum in tribulatióne doctrínæ suæ, donec tentet eum in cogitatiónibus suis, et credat ánimæ illíus.'
  "20": Et firmábit illum, et iter addúcet diréctum ad illum, et lætificábit illum,
  "21": et denudábit abscónsa sua illi, et thesaurizábit super illum sciéntiam et intelléctum iustítiæ.
  "22": Si autem oberráverit, derelínquet eum, et tradet eum in manus inimíci sui.
  "23": Fili consérva tempus, et devíta a malo.
  "24": Pro ánima tua ne confundáris dícere verum.
  "25": Est enim confúsio addúcens peccátum, et est confúsio addúcens glóriam et grátiam.
  "26": Ne accípias fáciem advérsus fáciem tuam, nec advérsus ánimam tuam mendácium.
  "27": 'Ne revereáris próximum tuum in casu suo:'
  "28": nec retíneas verbum in témpore salútis. Non abscóndas sapiéntiam tuam in décore suo.
  "29": 'In lingua enim sapiéntia dignóscitur: et sensus, et sciéntia, et doctrína in verbo sensáti, et firmaméntum in opéribus iustítiæ.'
  "30": Non contradícas verbo veritátis ullo modo, et de mendácio ineruditiónis tuæ confúndere.
  "31": Non confundáris confitéri peccáta tua, et ne subícias te omni hómini pro peccáto.
  "32": Noli resístere contra fáciem poténtis, nec conéris contra ictum flúvii.
  "33": 'Pro iustítia agonizáre pro ánima tua, et usque ad mortem certa pro iustítia: et Deus expugnábit pro te inimícos tuos.'
  "34": 'Noli citátus esse in lingua tua: et inútilis, et remíssus in opéribus tuis.'
  "35": Noli esse sicut leo in domo tua, evértens domésticos tuos, et ópprimens subiéctos tibi.
  "36": Non sit porrécta manus tua ad accipiéndum, et ad dandum collécta.
