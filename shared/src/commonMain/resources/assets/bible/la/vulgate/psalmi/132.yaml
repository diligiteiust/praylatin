bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "132"
verses:
  "1": 'Cánticum gráduum David. Ecce quam bonum, et quam iucúndum, habitáre fratres in unum:'
  "2": 'sicut unguéntum in cápite, quod descéndit in barbam, barbam Aaron: quod descéndit in oram vestiménti eius:'
  "3": sicut ros Hermon, qui descéndit in montem Sion. Quóniam illic mandávit Dóminus benedictiónem, et vitam usque in sǽculum.
