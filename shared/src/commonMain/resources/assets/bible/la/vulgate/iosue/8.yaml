bible: vulgate
lang: la
language: Latina
book: Iosue
chapter: "8"
verses:
  "1": 'Dixit autem Dóminus ad Iósue: Ne tímeas, neque formídes: tolle tecum omnem multitúdinem pugnatórum, et consúrgens ascénde in óppidum Hai. Ecce trádidi in manu tua regem eius et pópulum, urbémque et terram.'
  "2": 'Faciésque urbi Hai, et regi eius, sicut fecísti Iéricho, et regi illíus: prædam vero, et ómnia animántia diripiétis vobis: pone insídias urbi post eam.'
  "3": 'Surrexítque Iósue, et omnis exércitus bellatórum cum eo, ut ascénderent in Hai: et elécta trigínta míllia virórum fórtium misit nocte,'
  "4": 'præcepítque eis, dicens: Pónite insídias post civitátem, nec lóngius recedátis: et éritis omnes paráti.'
  "5": Ego autem, et réliqua multitúdo, quæ mecum est, accedémus ex advérso contra urbem. Cumque exíerint contra nos, sicut ante fécimus, fugiémus, et terga vertémus,
  "6": 'donec persequéntes ab urbe lóngius protrahántur: putábunt enim nos fúgere sicut prius.'
  "7": 'Nobis ergo fugiéntibus, et illis persequéntibus, consurgétis de insídiis, et vastábitis civitátem: tradétque eam Dóminus Deus vester in manus vestras.'
  "8": Cumque cepéritis, succéndite eam, et sic ómnia faciétis, ut iussi.
  "9": 'Dimisítque eos, et perrexérunt ad locum insidiárum, sederúntque inter Bethel et Hai, ad occidentálem plagam urbis Hai: Iósue autem nocte illa in médio mansit pópuli,'
  "10": surgénsque dilúculo recénsuit sócios, et ascéndit cum senióribus in fronte exércitus, vallátus auxílio pugnatórum.
  "11": Cumque veníssent et ascendíssent ex advérso civitátis, stetérunt ad septentrionálem urbis plagam, inter quam et eos erat vallis média.
  "12": 'Quinque autem míllia viros elégerat, et posúerat in insídiis inter Bethel et Hai ex occidentáli parte eiúsdem civitátis:'
  "13": omnis vero réliquus exércitus ad aquilónem áciem dirigébat, ita ut novíssimi illíus multitúdinis occidentálem plagam urbis attíngerent. Abiit ergo Iósue nocte illa, et stetit in vallis médio.
  "14": Quod cum vidísset rex Hai, festinávit mane, et egréssus est cum omni exércitu civitátis, direxítque áciem contra desértum, ignórans quod post tergum latérent insídiæ.
  "15": Iósue vero, et omnis Israel cessérunt loco, simulántes metum, et fugiéntes per solitúdinis viam.
  "16": At illi vociferántes páriter, et se mútuo cohortántes, persecúti sunt eos. Cumque recessíssent a civitáte,
  "17": et ne unus quidem in urbe Hai et Bethel remansísset qui non persequerétur Israel (sicut erúperant apérta óppida relinquéntes),
  "18": 'dixit Dóminus ad Iósue: Leva clýpeum, qui in manu tua est, contra urbem Hai, quóniam tibi tradam eam.'
  "19": 'Cumque elevásset clýpeum ex advérso civitátis, insídiæ, quæ latébant, surrexérunt conféstim: et pergéntes ad civitátem, cepérunt, et succendérunt eam.'
  "20": 'Viri autem civitátis, qui persequebántur Iósue, respiciéntes et vidéntes fumum urbis ad cælum usque conscéndere, non potuérunt ultra huc illúcque diffúgere: præsértim cum hi qui simuláverant fugam, et tendébant ad solitúdinem, contra persequéntes fortíssime restitíssent.'
  "21": Vidénsque Iósue et omnis Israel quod capta esset cívitas, et fumus urbis ascénderet, revérsus percússit viros Hai.
  "22": Síquidem et illi qui céperant et succénderant civitátem, egréssi ex urbe contra suos, médios hóstium feríre cœpérunt. Cum ergo ex utráque parte adversárii cæderéntur, ita ut nullus de tanta multitúdine salvarétur,
  "23": regem quoque urbis Hai apprehendérunt vivéntem, et obtulérunt Iósue.
  "24": Igitur ómnibus interféctis, qui Israélem ad desérta tendéntem fúerant persecúti, et in eódem loco gládio corruéntibus, revérsi fílii Israel percussérunt civitátem.
  "25": Erant autem qui in eódem die concíderant a viro usque ad mulíerem, duódecim míllia hóminum, omnes urbis Hai.
  "26": Iósue vero non contráxit manum, quam in sublíme porréxerat, tenens clýpeum donec interficeréntur omnes habitatóres Hai.
  "27": Iuménta autem et prædam civitátis divisérunt sibi fílii Israel, sicut præcéperat Dóminus Iósue.
  "28": 'Qui succéndit urbem, et fecit eam túmulum sempitérnum:'
  "29": 'regem quoque eius suspéndit in patíbulo usque ad vésperam et solis occásum. Præcepítque Iósue, et deposuérunt cadáver eius de cruce: proiecerúntque in ipso intróitu civitátis, congésto super eum magno acérvo lápidum, qui pérmanet usque in præséntem diem.'
  "30": 'Tunc ædificávit Iósue altáre Dómino Deo Israel in monte Hebal:'
  "31": 'sicut præcéperat Móyses fámulus Dómini fíliis Israel, et scriptum est in volúmine legis Móysi: Altáre vero de lapídibus impolítis, quos ferrum non tétigit: et óbtulit super eo holocáusta Dómino, immolavítque pacíficas víctimas.'
  "32": Et scripsit super lápides Deuteronómium legis Móysi, quod ille digésserat coram fíliis Israel.
  "33": Omnis autem pópulus, et maióres natu, ducésque ac iúdices, stabant ex utráque parte arcæ, in conspéctu sacerdótum qui portábant arcam fœ́deris Dómini, ut ádvena ita et indígena. Média pars eórum iuxta montem Garízim, et média iuxta montem Hebal, sicut præcéperat Móyses fámulus Dómini. Et primum quidem benedíxit pópulo Israel.
  "34": Post hæc legit ómnia verba benedictiónis et maledictiónis, et cuncta quæ scripta erant in legis volúmine.
  "35": Nihil ex his, quæ Móyses iússerat, relíquit intáctum, sed univérsa replicávit coram omni multitúdine Israel, muliéribus ac párvulis et ádvenis, qui inter eos morabántur.
