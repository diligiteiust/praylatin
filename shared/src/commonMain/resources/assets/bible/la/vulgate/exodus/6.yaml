bible: vulgate
lang: la
language: Latina
book: Exodus
chapter: "6"
verses:
  "1": 'Dixítque Dóminus ad Móysen: Nunc vidébis quæ factúrus sim Pharaóni: per manum enim fortem dimíttet eos, et in manu robústa eíciet illos de terra sua.'
  "2": 'Locutúsque est Dóminus ad Móysen dicens: Ego Dóminus'
  "3": 'qui appárui Abraham, Isaac, et Iacob in Deo omnipoténte: et nomen meum Adónai non indicávi eis.'
  "4": Pepigíque fœdus cum eis, ut darem eis terram Chánaan, terram peregrinatiónis eórum, in qua fuérunt ádvenæ.
  "5": 'Ego audívi gémitum filiórum Israel, quo Ægýptii oppressérunt eos: et recordátus sum pacti mei.'
  "6": 'Ideo dic fíliis Israel: Ego Dóminus qui edúcam vos de ergástulo Ægyptiórum, et éruam de servitúte, ac rédimam in bráchio excélso, et iudíciis magnis.'
  "7": 'Et assúmam vos mihi in pópulum, et ero vester Deus: et sciétis quod ego sum Dóminus Deus vester qui edúxerim vos de ergástulo Ægyptiórum:'
  "8": 'et indúxerim in terram, super quam levávi manum meam ut darem eam Abraham, Isaac, et Iacob: dabóque illam vobis possidéndam. Ego Dóminus.'
  "9": 'Narrávit ergo Móyses ómnia fíliis Israel: qui non acquievérunt ei propter angústiam spíritus, et opus duríssimum.'
  "10": 'Locutúsque est Dóminus ad Móysen, dicens:'
  "11": Ingrédere, et lóquere ad Pharaónem regem Ægýpti, ut dimíttat fílios Israel de terra sua.
  "12": 'Respóndit Móyses coram Dómino: Ecce fílii Israel non áudiunt me: et quómodo áudiet Phárao, præsértim cum incircumcísus sim lábiis?'
  "13": Locutúsque est Dóminus ad Móysen et Aaron, et dedit mandátum ad fílios Israel, et ad Pharaónem regem Ægýpti ut edúcerent fílios Israel de terra Ægýpti.
  "14": 'Isti sunt príncipes domórum per famílias suas. Fílii Ruben primogéniti Israélis: Henoch et Phallu, Hesron et Charmi:'
  "15": 'hæ cognatiónes Ruben. Fílii Símeon: Iámuel, et Iamin, et Ahod, et Iachin, et Soar, et Saul fílius Chananítidis: hæ progénies Símeon.'
  "16": 'Et hæc nómina filiórum Levi per cognatiónes suas: Gerson, et Caath, et Merári. Anni autem vitæ Levi fuérunt centum trigínta septem.'
  "17": 'Fílii Gerson: Lobni et Sémei, per cognatiónes suas.'
  "18": 'Fílii Caath: Amram, et Isaar, et Hebron, et Oziel: anni quoque vitæ Caath, centum trigínta tres.'
  "19": 'Fílii Merári: Móholi et Musi: hæ cognatiónes Levi per famílias suas.'
  "20": 'Accépit autem Amram uxórem Ióchabed patruélem suam: quæ péperit ei Aaron et Móysen. Fuerúntque anni vitæ Amram, centum trigínta septem.'
  "21": 'Fílii quoque Isaar: Core, et Nepheg, et Zechri.'
  "22": 'Fílii quoque Oziel: Mísael, et Elísaphan, et Sethri.'
  "23": Accépit autem Aaron uxórem Elísabeth fíliam Amínadab, sorórem Naháson, quæ péperit ei Nadab, et Abiu, et Eleázar, et Ithamar.
  "24": 'Fílii quoque Core: Aser, et Elcana, et Abíasaph: hæ sunt cognatiónes Coritárum.'
  "25": 'At vero Eleázar fílius Aaron accépit uxórem de filiábus Phútiel: quæ péperit ei Phínees. Hi sunt príncipes familiárum Leviticárum per cognatiónes suas.'
  "26": Iste est Aaron et Móyses, quibus præcépit Dóminus ut edúcerent fílios Israel de terra Ægýpti per turmas suas.
  "27": 'Hi sunt, qui loquúntur ad Pharaónem regem Ægýpti, ut edúcant fílios Israel de Ægýpto: iste est Móyses et Aaron,'
  "28": in die qua locútus est Dóminus ad Móysen, in terra Ægýpti.
  "29": 'Et locútus est Dóminus ad Móysen, dicens: Ego Dóminus: lóquere ad Pharaónem regem Ægýpti, ómnia quæ ego loquor tibi.'
  "30": 'Et ait Móyses coram Dómino: En incircumcísus lábiis sum, quómodo áudiet me Phárao?'
