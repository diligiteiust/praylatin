bible: vulgate
lang: la
language: Latina
book: Proverbia
chapter: "29"
verses:
  "1": 'Viro, qui corripiéntem dura cervíce contémnit, repentínus ei supervéniet intéritus: et eum sánitas non sequétur.'
  "2": 'In multiplicatióne iustórum lætábitur vulgus: cum ímpii súmpserint principátum, gemet pópulus.'
  "3": 'Vir, qui amat sapiéntiam, lætíficat patrem suum: qui autem nutrit scorta, perdet substántiam.'
  "4": 'Rex iustus érigit terram: vir avárus déstruet eam.'
  "5": Homo, qui blandis fictísque sermónibus lóquitur amíco suo, rete expándit gréssibus eius.
  "6": 'Peccántem virum iníquum invólvet láqueus: et iustus laudábit atque gaudébit.'
  "7": 'Novit iustus causam páuperum: ímpius ignórat sciéntiam.'
  "8": 'Hómines pestiléntes díssipant civitátem: sapiéntes vero avértunt furórem.'
  "9": Vir sápiens, si cum stulto conténderit, sive irascátur, sive rídeat, non invéniet réquiem.
  "10": 'Viri sánguinum odérunt símplicem: iusti autem quærunt ánimam eius.'
  "11": 'Totum spíritum suum profert stultus: sápiens differt, et resérvat in pósterum.'
  "12": Princeps, qui libénter audit verba mendácii, omnes minístros habet ímpios.
  "13": 'Pauper et créditor obviavérunt sibi: utriúsque illuminátor est Dóminus.'
  "14": Rex, qui iúdicat in veritáte páuperes, thronus eius in ætérnum firmábitur.
  "15": 'Virga atque corréptio tríbuit sapiéntiam: puer autem, qui dimíttitur voluntáti suæ, confúndit matrem suam.'
  "16": In multiplicatióne impiórum multiplicabúntur scélera, et iusti ruínas eórum vidébunt.
  "17": Erudi fílium tuum, et refrigerábit te, et dabit delícias ánimæ tuæ.
  "18": 'Cum prophetía defécerit, dissipábitur pópulus: qui vero custódit legem, beátus est.'
  "19": 'Servus verbis non potest erudíri: quia quod dicis intélligit, et respondére contémnit.'
  "20": Vidísti hóminem velócem ad loquéndum? stultítia magis speránda est, quam illíus corréptio.
  "21": Qui delicáte a puerítia nutrit servum suum, póstea séntiet eum contumácem.
  "22": 'Vir iracúndus próvocat rixas: et qui ad indignándum fácilis est, erit ad peccándum proclívior.'
  "23": 'Supérbum séquitur humílitas: et húmilem spíritu suscípiet glória.'
  "24": 'Qui cum fure partícipat, odit ánimam suam: adiurántem audit, et non índicat.'
  "25": 'Qui timet hóminem, cito córruet: qui sperat in Dómino, sublevábitur.'
  "26": 'Multi requírunt fáciem príncipis: et iudícium a Dómino egréditur singulórum.'
  "27": 'Abominántur iusti virum ímpium: et abominántur ímpii eos, qui in recta sunt via. Verbum custódiens fílius, extra perditiónem erit.'
