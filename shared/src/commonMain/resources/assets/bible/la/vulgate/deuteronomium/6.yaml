bible: vulgate
lang: la
language: Latina
book: Deuteronomium
chapter: "6"
verses:
  "1": 'Hæc sunt præcépta, et cæremóniæ, atque iudícia, quæ mandávit Dóminus Deus vester ut docérem vos, et faciátis ea in terra, ad quam transgredímini possidéndam:'
  "2": ut tímeas Dóminum Deum tuum, et custódias ómnia mandáta et præcépta eius, quæ ego præcípio tibi, et fíliis, ac nepótibus tuis, cunctis diébus vitæ tuæ, ut prolongéntur dies tui.
  "3": Audi Israel, et obsérva ut fácias quæ præcépit tibi Dóminus, et bene sit tibi, et multiplicéris ámplius, sicut pollícitus est Dóminus Deus patrum tuórum tibi terram lacte et melle manántem.
  "4": 'Audi Israel: Dóminus Deus noster, Dóminus unus est.'
  "5": Díliges Dóminum Deum tuum ex toto corde tuo, et ex tota ánima tua, et ex tota fortitúdine tua.
  "6": 'Erúntque verba hæc, quæ ego præcípio tibi hódie, in corde tuo:'
  "7": et narrábis ea fíliis tuis, et meditáberis in eis sedens in domo tua, et ámbulans in itínere, dórmiens atque consúrgens.
  "8": Et ligábis ea quasi signum in manu tua, erúntque et movebúntur inter óculos tuos,
  "9": scribésque ea in límine, et óstiis domus tuæ.
  "10": 'Cumque introdúxerit te Dóminus Deus tuus in terram, pro qua iurávit pátribus tuis Abraham, Isaac, et Iacob: et déderit tibi civitátes magnas et óptimas, quas non ædificásti,'
  "11": domos plenas cunctárum opum, quas non exstruxísti, cistérnas, quas non fodísti, vinéta et olivéta, quæ non plantásti,
  "12": 'et coméderis, et saturátus fúeris:'
  "13": cave diligénter ne obliviscáris Dómini, qui edúxit te de terra Ægýpti, de domo servitútis. Dóminum Deum tuum timébis, et illi soli sérvies, ac per nomen illíus iurábis.
  "14": 'Non íbitis post deos aliénos cunctárum géntium, quæ in circúitu vestro sunt:'
  "15": 'quóniam Deus æmulátor Dóminus Deus tuus in médio tui: nequándo irascátur furor Dómini Dei tui contra te, et áuferat te de superfície terræ.'
  "16": Non tentábis Dóminum Deum tuum, sicut tentásti in loco tentatiónis.
  "17": 'Custódi præcépta Dómini Dei tui, ac testimónia et cæremónias, quas præcépit tibi:'
  "18": 'et fac quod plácitum est et bonum in conspéctu Dómini, ut bene sit tibi: et ingréssus possídeas terram óptimam, de qua iurávit Dóminus pátribus tuis,'
  "19": ut deléret omnes inimícos tuos coram te, sicut locútus est.
  "20": 'Cumque interrogáverit te fílius tuus cras, dicens: Quid sibi volunt testimónia hæc, et cæremóniæ, atque iudícia, quæ præcépit Dóminus Deus noster nobis?'
  "21": 'dices ei: Servi erámus Pharaónis in Ægýpto, et edúxit nos Dóminus de Ægýpto in manu forti:'
  "22": fecítque signa atque prodígia magna et péssima in Ægýpto contra Pharaónem, et omnem domum illíus in conspéctu nostro,
  "23": et edúxit nos inde, ut introdúctis daret terram, super qua iurávit pátribus nostris.
  "24": Præcepítque nobis Dóminus ut faciámus ómnia legítima hæc, et timeámus Dóminum Deum nostrum, ut bene sit nobis cunctis diébus vitæ nostræ, sicut est hódie.
  "25": Erítque nostri miséricors, si custodiérimus et fecérimus ómnia præcépta eius coram Dómino Deo nostro, sicut mandávit nobis.
