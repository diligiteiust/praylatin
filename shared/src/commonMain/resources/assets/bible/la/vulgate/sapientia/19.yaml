bible: vulgate
lang: la
language: Latina
book: Sapientia
chapter: "19"
verses:
  "1": 'Impiis autem usque in novíssimum sine misericórdia ira supervénit. Præsciébat enim et futúra illórum:'
  "2": quóniam cum ipsi permisíssent ut se edúcerent, et cum magna sollicitúdine præmisíssent illos, consequebántur illos pœniténtia acti.
  "3": Adhuc enim inter manus habéntes luctum, et deplorántes ad monuménta mortuórum, áliam sibi assumpsérunt cogitatiónem insciéntiæ, et quos rogántes proiécerant, hos tamquam fugitívos persequebántur.
  "4": 'Ducébat enim illos ad hunc finem digna necéssitas: et horum, quæ accíderant, commemoratiónem amittébant, ut quæ déerant torméntis, repléret punítio:'
  "5": et pópulus quidem tuus mirabíliter transíret, illi autem novam mortem invenírent.
  "6": Omnis enim creatúra ad suum genus ab inítio refigurabátur, desérviens tuis præcéptis, ut púeri tui custodiréntur illǽsi.
  "7": 'Nam nubes castra eórum obumbrábat, et ex aqua, quæ ante erat, terra árida appáruit, et in mari Rubro via sine impediménto, et campus gérminans de profúndo nímio:'
  "8": per quem omnis nátio transívit, quæ tegebátur tua manu, vidéntes tua mirabília et monstra.
  "9": Tamquam enim equi depavérunt escam, et tamquam agni exsultavérunt, magnificántes te Dómine, qui liberásti illos.
  "10": Mémores enim erant adhuc eórum, quæ in incolátu illórum facta fúerant, quemádmodum pro natióne animálium edúxit terra muscas, et pro píscibus eructávit flúvius multitúdinem ranárum.
  "11": Novíssime autem vidérunt novam creatúram ávium, cum addúcti concupiscéntia postulavérunt escas epulatiónis.
  "12": 'In allocutióne enim desidérii, ascéndit illis de mari ortygométra: et vexatiónes peccatóribus supervenérunt, non sine illis, quæ ante facta erant, arguméntis per vim fúlminum: iuste enim patiebántur secúndum suas nequítias.'
  "13": 'Etenim detestabiliórem inhospitalitátem instituérunt: álii quidem ignótos non recipiébant ádvenas, álii autem bonos hóspites in servitútem redigébant.'
  "14": 'Et non solum hæc, sed et álius quidam respéctus illórum erat: quóniam invíti recipiébant extráneos.'
  "15": Qui autem cum lætítia recepérunt hos, qui eísdem usi erant iustítiis, sævíssimis afflixérunt dolóribus.
  "16": 'Percússi sunt autem cæcitáte: sicut illi in fóribus iusti, cum subitáneis coopérti essent ténebris, unusquísque tránsitum óstii sui quærébat.'
  "17": 'In se enim eleménta dum convertúntur, sicut in órgano qualitátis sonus immutátur, et ómnia suum sonum custódiunt: unde æstimári ex ipso visu certo potest.'
  "18": 'Agréstia enim in aquática convertebántur: et quæcúmque erant natántia, in terram transíbant.'
  "19": Ignis in aqua valébat supra suam virtútem, et aqua exstinguéntis natúræ obliviscebátur.
  "20": Flammæ e contrário corruptibílium animálium non vexavérunt carnes coambulántium, nec dissolvébant illam, quæ fácile dissolvebátur sicut glácies, bonam escam. In ómnibus enim magnificásti pópulum tuum Dómine, et honorásti, et non despexísti, in omni témpore et in omni loco assístens eis.
