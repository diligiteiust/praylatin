bible: vulgate
lang: la
language: Latina
book: Iob
chapter: "8"
verses:
  "1": 'Respóndens autem Baldad Suhítes, dixit:'
  "2": Usquequo loquéris tália, et spíritus múltiplex sermónes oris tui?
  "3": Numquid Deus supplántat iudícium? aut Omnípotens subvértit quod iustum est?
  "4": 'Etiam si fílii tui peccavérunt ei, et dimísit eos in manu iniquitátis suæ:'
  "5": 'tu tamen si dilúculo consurréxeris ad Deum, et Omnipoténtem fúeris deprecátus:'
  "6": 'si mundus et rectus incésseris, statim evigilábit ad te, et pacátum reddet habitáculum iustítiæ tuæ:'
  "7": in tantum, ut si prióra tua fúerint parva, et novíssima tua multiplicéntur nimis.
  "8": 'Intérroga enim generatiónem prístinam, et diligénter investíga patrum memóriam:'
  "9": (hestérni quippe sumus, et ignorámus quóniam sicut umbra dies nostri sunt super terram.)
  "10": 'Et ipsi docébunt te: loquéntur tibi, et de corde suo próferent elóquia.'
  "11": Numquid virére potest scirpus absque humóre? aut créscere caréctum sine aqua?
  "12": 'Cum adhuc sit in flore, nec carpátur manu, ante omnes herbas aréscit:'
  "13": sic viæ ómnium, qui obliviscúntur Deum, et spes hypócritæ períbit.
  "14": Non ei placébit vecórdia sua, et sicut tela araneárum fidúcia eius.
  "15": 'Innitétur super domum suam, et non stabit: fúlciet eam, et non consúrget.'
  "16": Huméctus vidétur ántequam véniat sol, et in ortu suo germen eius egrediétur.
  "17": Super acérvum petrárum radíces eius densabúntur, et inter lápides commorábitur.
  "18": 'Si absorbúerit eum de loco suo, negábit eum, et dicet: Non novi te.'
  "19": Hæc est enim lætítia viæ eius, ut rursum de terra álii germinéntur.
  "20": 'Deus non proíciet símplicem, nec porríget manum malígnis:'
  "21": donec impleátur risu os tuum, et lábia tua iúbilo.
  "22": Qui odérunt te induéntur confusióne, et tabernáculum impiórum non subsístet.
