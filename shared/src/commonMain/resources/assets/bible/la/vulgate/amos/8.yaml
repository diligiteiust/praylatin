bible: vulgate
lang: la
language: Latina
book: Amos
chapter: "8"
verses:
  "1": 'Hæc osténdit mihi Dóminus Deus: et ecce uncínus pomórum.'
  "2": 'Et dixit: Quid tu vides Amos? Et dixi: Uncínum pomórum. Et dixit Dóminus ad me: Venit finis super pópulum meum Israel: non adíciam ultra ut pertránseam eum.'
  "3": 'Et stridébunt cárdines templi in die illa, dicit Dóminus Deus: multi moriéntur: in omni loco proiciétur siléntium.'
  "4": Audíte hoc qui contéritis páuperem, et defícere fácitis egénos terræ,
  "5": 'dicéntes: Quando transíbit mensis, et venumdábimus merces: et sábbatum, et aperiémus fruméntum: ut imminuámus mensúram, et augeámus siclum, et supponámus statéras dolósas,'
  "6": ut possideámus in argénto egénos et páuperes pro calceaméntis, et quisquílias fruménti vendámus?
  "7": 'Iurávit Dóminus in supérbiam Iacob: Si oblítus fúero usque ad finem ómnia ópera eórum.'
  "8": 'Numquid super isto non commovébitur terra, et lugébit omnis habitátor eius: et ascéndet quasi flúvius univérsus, et eicicétur, et défluet quasi rivus Ægýpti?'
  "9": 'Et erit in die illa, dicit Dóminus Deus: óccidet sol in merídie, et tenebréscere fáciam terram in die lúminis:'
  "10": 'et convértam festivitátes vestras in luctum, et ómnia cántica vestra in planctum: et indúcam super omne dorsum vestrum saccum, et super omne caput calvítium: et ponam eam quasi luctum unigéniti, et novíssima eius quasi diem amárum.'
  "11": 'Ecce dies véniunt, dicit Dóminus: et mittam famem in terram: non famem panis, neque sitim aquæ, sed audiéndi verbum Dómini.'
  "12": 'Et commovebúntur a mari usque ad mare, et ab aquilóne usque ad oriéntem: circuíbunt quæréntes verbum Dómini, et non invénient.'
  "13": In die illa defícient vírgines pulchræ, et adolescéntes in siti.
  "14": 'Qui iurant in delícto Samaríæ, et dicunt: Vivit Deus tuus Dan: et vivit via Bersabée: et cadent, et non resúrgent ultra.'
