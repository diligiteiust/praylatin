bible: vulgate
lang: la
language: Latina
book: ad Corinthios I
chapter: "9"
verses:
  "1": Non sum liber? Non sum Apóstolus? Nonne Christum Iesum Dóminum nostrum vidi? Nonne opus meum vos estis in Dómino?
  "2": 'Et si áliis non sum Apóstolus, sed tamen vobis sum: nam signáculum apostolátus mei vos estis in Dómino.'
  "3": 'Mea defénsio apud eos, qui me intérrogant, hæc est:'
  "4": Numquid non habémus potestátem manducándi, et bibéndi?
  "5": Numquid non habémus potestátem mulíerem sorórem circumducéndi sicut et céteri Apóstoli, et fratres Dómini, et Cephas?
  "6": Aut ego solus, et Bárnabas, non habémus potestátem hoc operándi?
  "7": Quis mílitat suis stipéndiis unquam? Quis plantat víneam, et de fructu eius non edit? Quis pascit gregem, et de lacte gregis non mandúcat?
  "8": Numquid secúndum hóminem hæc dico? An et lex hæc non dicit?
  "9": 'Scriptum est enim in lege Móysi: Non alligábis os bovi trituránti. Numquid de bobus cura est Deo?'
  "10": 'An propter nos útique hoc dicit? Nam propter nos scripta sunt: quóniam debet in spe qui arat, aráre: et qui tritúrat, in spe fructus percipiéndi.'
  "11": Si nos vobis spirituália seminávimus, magnum est si nos carnália vestra metámus?
  "12": 'Si álii potestátis vestræ partícipes sunt, quare non pótius nos? Sed non usi sumus hac potestáte: sed ómnia sustinémus, ne quod offendículum demus Evangélio Christi.'
  "13": 'Nescítis quóniam qui in sacrário operántur, quæ de sacrário sunt, edunt: et qui altári desérviunt, cum altári partícipant?'
  "14": Ita et Dóminus ordinávit iis, qui Evangélium annúntiant, de Evangélio vívere.
  "15": 'Ego autem nullo horum usus sum. Non autem scripsi hæc ut ita fiant in me: bonum est enim mihi magis mori, quam ut glóriam meam quis evácuet.'
  "16": 'Nam si evangelizávero, non est mihi glória: necéssitas enim mihi incúmbit: væ enim mihi est, si non evangelizávero.'
  "17": 'Si enim volens hoc ago, mercédem hábeo: si autem invítus, dispensátio mihi crédita est.'
  "18": Quæ est ergo merces mea? Ut Evangélium prǽdicans, sine sumptu ponam Evangélium, ut non abútar potestáte mea in Evangélio.
  "19": Nam cum liber essem ex ómnibus, ómnium me servum feci, ut plures lucrifácerem.
  "20": 'Et factus sum Iudǽis tamquam Iudǽus, ut Iudǽos lucrárer:'
  "21": 'iis, qui sub lege sunt, quasi sub lege essem (cum ipse non essem sub lege) ut eos, qui sub lege erant, lucrifácerem: iis, qui sine lege erant, tamquam sine lege essem (cum sine lege Dei non essem: sed in lege essem Christi) ut lucrifácerem eos, qui sine lege erant.'
  "22": Factus sum infírmis infírmus, ut infírmos lucrifácerem. Omnibus ómnia factus sum, ut omnes fácerem salvos.
  "23": 'Omnia autem fácio propter Evangélium: ut párticeps eius effíciar.'
  "24": Nescítis quod ii, qui in stádio currunt, omnes quidem currunt, sed unus áccipit bravíum? Sic cúrrite ut comprehendátis.
  "25": 'Omnis autem, qui in agóne conténdit, ab ómnibus se ábstinet, et illi quidem ut corruptíbilem corónam accípiant: nos autem incorrúptam.'
  "26": 'Ego ígitur sic curro, non quasi in incértum: sic pugno, non quasi áerem vérberans:'
  "27": 'sed castígo corpus meum, et in servitútem rédigo: ne forte cum áliis prædicáverim, ipse réprobus effíciar.'
