bible: vulgate
lang: la
language: Latina
book: Ecclesiasticus
chapter: "9"
verses:
  "1": Non zeles mulíerem sinus tui, ne osténdat super te malítiam doctrínæ nequam.
  "2": Non des mulíeri potestátem ánimæ tuæ, ne ingrediátur in virtútem tuam, et confundáris.
  "3": Ne respícias mulíerem multívolam, ne forte íncidas in láqueos illíus.
  "4": Cum saltatríce ne assíduus sis, nec áudias illam, ne forte péreas in efficácia illíus.
  "5": Vírginem ne conspícias, ne forte scandalizéris in decóre illíus.
  "6": Ne des fornicáriis ánimam tuam in ullo, ne perdas te et hereditátem tuam.
  "7": Noli circumspícere in vicis civitátis, nec oberráveris in platéis illíus.
  "8": Avérte fáciem tuam a mulíere compta, et ne circumspícias spéciem aliénam.
  "9": 'Propter spéciem mulíeris multi periérunt: et ex hoc concupiscéntia quasi ignis exardéscit.'
  "10": Omnis múlier, quæ est fornicária, quasi stercus in via conculcábitur.
  "11": 'Spéciem mulíeris aliénæ multi admiráti, réprobi facti sunt: collóquium enim illíus quasi ignis exardéscit.'
  "12": 'Cum aliéna mulíere ne sédeas omníno, nec accúmbas cum ea super cúbitum:'
  "13": et non altercéris cum illa in vino, ne forte declínet cor tuum in illam, et sánguine tuo labáris in perditiónem.
  "14": 'Ne derelínquas amícum antíquum: novus enim non erit símilis illi.'
  "15": 'Vinum novum, amícus novus: veteráscet, et cum suavitáte bibes illud.'
  "16": 'Non zeles glóriam, et opes peccatóris: non enim scis quæ futúra sit illíus subvérsio.'
  "17": Non pláceat tibi iniúria iniustórum, sciens quóniam usque ad ínferos non placébit ímpius.
  "18": Longe abésto ab hómine potestátem habénte occidéndi, et non suspicáberis timórem mortis.
  "19": Et si accésseris ad illum, noli áliquid commíttere, ne forte áuferat vitam tuam.
  "20": 'Communiónem mortis scito: quóniam in médio laqueórum ingrediéris, et super doléntium arma ambulábis.'
  "21": Secúndum virtútem tuam cave te a próximo tuo, et cum sapiéntibus et prudéntibus tracta.
  "22": 'Viri iusti sint tibi convívæ, et in timóre Dei sit tibi gloriátio:'
  "23": et in sensu sit tibi cogitátus Dei, et omnis enarrátio tua in præcéptis Altíssimi.
  "24": In manu artíficum ópera laudabúntur, et princeps pópuli in sapiéntia sermónis sui, in sensu vero seniórum verbum.
  "25": 'Terríbilis est in civitáte sua homo linguósus: et temerárius in verbo suo odíbilis erit.'
