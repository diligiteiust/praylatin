bible: vulgate
lang: la
language: Latina
book: Matthaeus
chapter: "27"
verses:
  "1": Mane autem facto, consílium iniérunt omnes príncipes sacerdótum, et senióres pópuli advérsus Iesum, ut eum morti tráderent.
  "2": Et vinctum adduxérunt eum, et tradidérunt Póntio Piláto prǽsidi.
  "3": Tunc videns Iudas, qui eum trádidit, quod damnátus esset, pœniténtia ductus, rétulit trigínta argénteos princípibus sacerdótum, et senióribus,
  "4": 'dicens: Peccávi, tradens sánguinem iustum. At illi dixérunt: Quid ad nos? tu víderis.'
  "5": 'Et proiéctis argénteis in templo, recéssit: et ábiens láqueo se suspéndit.'
  "6": 'Príncipes autem sacerdótum, accéptis argénteis, dixérunt: Non licet eos míttere in córbonam: quia prétium sánguinis est.'
  "7": Consílio autem ínito, emérunt ex illis agrum fíguli, in sepultúram peregrinórum.
  "8": Propter hoc vocátus est ager ille, Hacéldama, hoc est, Ager sánguinis, usque in hodiérnum diem.
  "9": 'Tunc implétum est quod dictum est per Ieremíam prophétam, dicéntem: Et accepérunt trigínta argénteos prétium appretiáti, quem appretiavérunt a fíliis Israel:'
  "10": et dedérunt eos in agrum fíguli, sicut constítuit mihi Dóminus.
  "11": 'Iesus autem stetit ante prǽsidem, et interrogávit eum præses, dicens: Tu es rex Iudæórum? Dicit illi Iesus: Tu dicis.'
  "12": Et cum accusarétur a princípibus sacerdótum, et senióribus, nihil respóndit.
  "13": 'Tunc dicit illi Pilátus: Non audis quanta advérsum te dicunt testimónia?'
  "14": Et non respóndit ei ad ullum verbum, ita ut mirarétur præses veheménter.
  "15": Per diem autem solémnem consuéverat præses pópulo dimíttere unum vinctum, quem voluíssent.
  "16": Habébat autem tunc vinctum insígnem, qui dicebátur Barábbas.
  "17": 'Congregátis ergo illis, dixit Pilátus: Quem vultis dimíttam vobis: Barábbam, an Iesum, qui dícitur Christus?'
  "18": Sciébat enim quod per invídiam tradidíssent eum.
  "19": 'Sedénte autem illo pro tribunáli, misit ad eum uxor eius, dicens: Nihil tibi, et iusto illi: multa enim passa sum hódie per visum propter eum.'
  "20": Príncipes autem sacerdótum, et senióres persuasérunt pópulis ut péterent Barábbam, Iesum vero pérderent.
  "21": 'Respóndens autem præses, ait illis: Quem vultis vobis de duóbus dimítti? At illi dixérunt: Barábbam.'
  "22": 'Dicit illis Pilátus: Quid ígitur fáciam de Iesu, qui dícitur Christus?'
  "23": 'Dicunt omnes: Crucifigátur. Ait illis præses: Quid enim mali fecit? At illi magis clamábant dicéntes: Crucifigátur.'
  "24": 'Videns autem Pilátus quia nihil profíceret, sed magis tumúltus fíeret: accépta aqua, lavit manus coram pópulo, dicens: Innocens ego sum a sánguine iusti huius: vos vidéritis.'
  "25": 'Et respóndens univérsus pópulus, dixit: Sanguis eius super nos, et super fílios nostros.'
  "26": 'Tunc dimísit illis Barábbam: Iesum autem flagellátum trádidit eis ut crucifigerétur.'
  "27": 'Tunc mílites prǽsidis suscipiéntes Iesum in prætórium, congregavérunt ad eum univérsam cohórtem:'
  "28": et exuéntes eum, chlámydem coccíneam circumdedérunt ei,
  "29": 'et plecténtes corónam de spinis, posuérunt super caput eius, et arúndinem in déxtera eius. Et genu flexo ante eum, illudébant ei, dicéntes: Ave rex Iudæórum.'
  "30": Et exspuéntes in eum, accepérunt arúndinem, et percutiébant caput eius.
  "31": Et postquam illusérunt ei, exuérunt eum chlámyde, et induérunt eum vestiméntis eius, et duxérunt eum ut crucifígerent.
  "32": 'Exeúntes autem invenérunt hóminem Cyrenǽum, nómine Simónem: hunc angariavérunt ut tólleret crucem eius.'
  "33": Et venérunt in locum, qui dícitur Gólgotha, quod est Calváriæ locus.
  "34": Et dedérunt ei vinum bíbere cum felle mistum. Et cum gustásset, nóluit bíbere.
  "35": 'Postquam autem crucifixérunt eum, divisérunt vestiménta eius, sortem mitténtes: ut implerétur quod dictum est per prophétam dicéntem: Divisérunt sibi vestiménta mea, et super vestem meam misérunt sortem.'
  "36": Et sedéntes servábant eum.
  "37": 'Et imposuérunt super caput eius causam ipsíus scriptam: Hic est Iesus rex Iudæórum.'
  "38": 'Tunc crucifíxi sunt cum eo duo latrónes: unus a dextris, et unus a sinístris.'
  "39": Prætereúntes autem blasphemábant eum movéntes cápita sua,
  "40": 'et dicéntes: Vah qui déstruis templum Dei, et in tríduo illud reædíficas: salva temetípsum: si Fílius Dei es, descénde de cruce.'
  "41": 'Simíliter et príncipes sacerdótum illudéntes cum scribis, et senióribus dicébant:'
  "42": 'Alios salvos fecit, seípsum non potest salvum fácere: si rex Israel est, descéndat nunc de cruce, et crédimus ei:'
  "43": 'confídit in Deo: líberet nunc, si vult eum: dixit enim: Quia Fílius Dei sum.'
  "44": Idípsum autem et latrónes, qui crucifíxi erant cum eo, improperábant ei.
  "45": A sexta autem hora ténebræ factæ sunt super univérsam terram usque ad horam nonam.
  "46": 'Et circa horam nonam clamávit Iesus voce magna, dicens: Eli, Eli, lamma sabactháni? hoc est: Deus meus, Deus meus, ut quid dereliquísti me?'
  "47": 'Quidam autem illic stantes, et audiéntes, dicébant: Elíam vocat iste.'
  "48": Et contínuo currens unus ex eis, accéptam spóngiam implévit acéto, et impósuit arúndini, et dabat ei bíbere.
  "49": 'Céteri vero dicébant: Sine, videámus an véniat Elías líberans eum.'
  "50": Iesus autem íterum clamans voce magna, emísit spíritum.
  "51": 'Et ecce velum templi scissum est in duas partes a summo usque deórsum: et terra mota est, et petræ scissæ sunt,'
  "52": 'et monuménta apérta sunt: et multa córpora sanctórum, qui dormíerant, surrexérunt.'
  "53": Et exeúntes de monuméntis post resurrectiónem eius, venérunt in sanctam civitátem, et apparuérunt multis.
  "54": 'Centúrio autem, et qui cum eo erant, custodiéntes Iesum, viso terræmótu et his, quæ fiébant, timuérunt valde, dicéntes: Vere Fílius Dei erat iste.'
  "55": 'Erant autem ibi mulíeres multæ a longe, quæ secútæ erant Iesum a Galilǽa, ministrántes ei:'
  "56": inter quas erat María Magdaléne, et María Iacóbi, et Ioseph mater, et mater filiórum Zebedǽi.
  "57": 'Cum autem sero factum esset, venit quidam homo dives ab Arimathǽa, nómine Ioseph, qui et ipse discípulus erat Iesu:'
  "58": hic accéssit ad Pilátum, et pétiit corpus Iesu. Tunc Pilátus iussit reddi corpus.
  "59": Et accépto córpore, Ioseph invólvit illud in síndone munda.
  "60": Et pósuit illud in monuménto suo novo, quod excíderat in petra. Et advólvit saxum magnum ad óstium monuménti, et ábiit.
  "61": Erant autem ibi María Magdaléne, et áltera María, sedéntes contra sepúlcrum.
  "62": Altera autem die, quæ est post Parascéven, convenérunt príncipes sacerdótum, et Pharisǽi ad Pilátum,
  "63": 'dicéntes: Dómine, recordáti sumus, quia sedúctor ille dixit adhuc vivens: Post tres dies resúrgam.'
  "64": 'Iube ergo custodíri sepúlcrum usque in diem tértium: ne forte véniant discípuli eius, et furéntur eum, et dicant plebi: Surréxit a mórtuis: et erit novíssimus error peior prióre.'
  "65": 'Ait illis Pilátus: Habétis custódiam, ite, custodíte sicut scitis.'
  "66": Illi autem abeúntes, muniérunt sepúlcrum, signántes lápidem, cum custódibus.
