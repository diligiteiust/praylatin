bible: vulgate
lang: la
language: Latina
book: Ecclesiasticus
chapter: "24"
verses:
  "1": Sapiéntia laudábit ánimam suam, et in Deo honorábitur, et in médio pópuli sui gloriábitur,
  "2": et in ecclésiis Altíssimi apériet os suum, et in conspéctu virtútis illíus gloriábitur,
  "3": et in médio pópuli sui exaltábitur, et in plenitúdine sancta admirábitur,
  "4": 'et in multitúdine electórum habébit laudem, et inter benedíctos benedicétur, dicens:'
  "5": 'Ego ex ore Altíssimi prodívi, primogénita ante omnem creatúram:'
  "6": 'ego feci in cælis ut orirétur lumen indefíciens, et sicut nébula texi omnem terram:'
  "7": ego in altíssimis habitávi, et thronus meus in colúmna nubis.
  "8": Gyrum cæli circuívi sola, et profúndum abýssi penetrávi, in flúctibus maris ambulávi,
  "9": 'et in omni terra steti: et in omni pópulo,'
  "10": 'et in omni gente primátum hábui:'
  "11": 'et ómnium excelléntium et humílium corda virtúte calcávi: et in his ómnibus réquiem quæsívi, et in hereditáte Dómini morábor.'
  "12": 'Tunc præcépit, et dixit mihi Creátor ómnium: et qui creávit me, requiévit in tabernáculo meo,'
  "13": 'et dixit mihi: In Iacob inhábita, et in Israel hereditáre, et in eléctis meis mitte radíces.'
  "14": Ab inítio, et ante sǽcula creáta sum, et usque ad futúrum sǽculum non désinam, et in habitatióne sancta coram ipso ministrávi.
  "15": Et sic in Sion firmáta sum, et in civitáte sanctificáta simíliter requiévi, et in Ierúsalem potéstas mea.
  "16": Et radicávi in pópulo honorificáto, et in parte Dei mei heréditas illíus, et in plenitúdine sanctórum deténtio mea.
  "17": 'Quasi cedrus exaltáta sum in Líbano, et quasi cypréssus in monte Sion:'
  "18": 'quasi palma exaltáta sum in Cades, et quasi plantátio rosæ in Iéricho:'
  "19": quasi olíva speciósa in campis, et quasi plátanus exaltáta sum iuxta aquam in platéis.
  "20": 'Sicut cinnamómum, et bálsamum aromatízans odórem dedi: quasi myrrha elécta dedi suavitátem odóris:'
  "21": et quasi storax, et gálbanus, et úngula, et gutta, et quasi Líbanus non incísus vaporávi habitatiónem meam, et quasi bálsamum non mistum odor meus.
  "22": Ego quasi terebínthus exténdi ramos meos, et rami mei honóris et grátiæ.
  "23": 'Ego quasi vitis fructificávi suavitátem odóris: et flores mei fructus honóris et honestátis.'
  "24": Ego mater pulchræ dilectiónis, et timóris, et agnitiónis, et sanctæ spei.
  "25": In me grátia omnis viæ et veritátis, in me omnis spes vitæ et virtútis.
  "26": 'Transíte ad me omnes qui concupíscitis me, et a generatiónibus meis implémini:'
  "27": 'spíritus enim meus super mel dulcis, et heréditas mea super mel et favum:'
  "28": memória mea in generatiónes sæculórum.
  "29": 'Qui edunt me, adhuc esúrient: et qui bibunt me, adhuc sítient.'
  "30": 'Qui audit me, non confundétur: et qui operántur in me, non peccábunt.'
  "31": Qui elúcidant me, vitam ætérnam habébunt.
  "32": Hæc ómnia liber vitæ, et testaméntum Altíssimi, et agnítio veritátis.
  "33": Legem mandávit Móyses in præcéptis iustitiárum, et hereditátem dómui Iacob, et Israel promissiónes.
  "34": Pósuit David púero suo excitáre regem ex ipso fortíssimum, et in throno honóris sedéntem in sempitérnum.
  "35": Qui implet quasi Phison sapiéntiam, et sicut Tigris in diébus novórum.
  "36": 'Qui adímplet quasi Euphrátes sensum: qui multíplicat quasi Iordánis in témpore messis.'
  "37": Qui mittit disciplínam sicut lucem, et assístens quasi Gehon in die vindémiæ.
  "38": Qui pérficit primus scire ipsam, et infírmior non investigábit eam.
  "39": A mari enim abundávit cogitátio eius, et consílium illíus ab abýsso magna.
  "40": Ego sapiéntia effúdi flúmina.
  "41": 'Ego quasi trames aquæ imménsæ de flúvio, ego quasi flúvii dióryx, et sicut aquædúctus exívi de paradíso:'
  "42": 'dixi: Rigábo hortum meum plantatiónum, et inebriábo prati mei fructum.'
  "43": 'Et ecce factus est mihi trames abúndans, et flúvius meus appropinquávit ad mare:'
  "44": quóniam doctrínam quasi antelucánum illúmino ómnibus, et enarrábo illam usque ad longínquum.
  "45": Penetrábo omnes inferióres partes terræ, et inspíciam omnes dormiéntes, et illuminábo omnes sperántes in Dómino.
  "46": Adhuc doctrínam quasi prophetíam effúndam, et relínquam illam quæréntibus sapiéntiam, et non désinam in progénies illórum usque in ævum sanctum.
  "47": Vidéte quóniam non soli mihi laborávi, sed ómnibus exquiréntibus veritátem.
