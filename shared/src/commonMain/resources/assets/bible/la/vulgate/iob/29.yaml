bible: vulgate
lang: la
language: Latina
book: Iob
chapter: "29"
verses:
  "1": 'Addidit quoque Iob, assúmens parábolam suam, et dixit:'
  "2": Quis mihi tríbuat, ut sim iuxta menses prístinos, secúndum dies, quibus Deus custodiébat me?
  "3": Quando splendébat lucérna eius super caput meum, et ad lumen eius ambulábam in ténebris?
  "4": Sicut fui in diébus adolescéntiæ meæ, quando secréto Deus erat in tabernáculo meo?
  "5": Quando erat Omnípotens mecum, et in circúitu meo púeri mei?
  "6": Quando lavábam pedes meos butýro, et petra fundébat mihi rivos ólei?
  "7": Quando procedébam ad portam civitátis, et in platéa parábant cáthedram mihi?
  "8": 'Vidébant me iúvenes, et abscondebántur: et senes assurgéntes stabant.'
  "9": Príncipes cessábant loqui, et dígitum superponébant ori suo.
  "10": Vocem suam cohibébant duces, et lingua eórum gútturi suo adhærébat.
  "11": 'Auris áudiens beatificábat me, et óculus videns testimónium reddébat mihi:'
  "12": eo quod liberássem páuperem vociferántem, et pupíllum, cui non esset adiútor.
  "13": Benedíctio peritúri super me veniébat, et cor víduæ consolátus sum.
  "14": 'Iustítia indútus sum: et vestívi me, sicut vestiménto et diadémate, iudício meo.'
  "15": Oculus fui cæco, et pes claudo.
  "16": 'Pater eram páuperum: et causam quam nesciébam, diligentíssime investigábam.'
  "17": Conterébam molas iníqui, et de déntibus illíus auferébam prædam.
  "18": 'Dicebámque: In nídulo meo móriar, et sicut palma multiplicábo dies.'
  "19": Radix mea apérta est secus aquas, et ros morábitur in messióne mea.
  "20": Glória mea semper innovábitur, et arcus meus in manu mea instaurábitur.
  "21": Qui me audiébant, exspectábant senténtiam, et inténti tacébant ad consílium meum.
  "22": Verbis meis áddere nihil audébant, et super illos stillábat elóquium meum.
  "23": Exspectábant me sicut plúviam, et os suum aperiébant quasi ad imbrem serótinum.
  "24": Si quando ridébam ad eos, non credébant, et lux vultus mei non cadébat in terram.
  "25": 'Si voluíssem ire ad eos, sedébam primus: cumque sedérem quasi rex, circumstánte exércitu, eram tamen mœréntium consolátor.'
