bible: vulgate
lang: la
language: Latina
book: Iudicum
chapter: "3"
verses:
  "1": 'Hæ sunt gentes, quas Dóminus derelíquit, ut erudíret in eis Israélem, et omnes, qui non nóverant bella Chananæórum:'
  "2": 'ut póstea díscerent fílii eórum certáre cum hóstibus, et habére consuetúdinem prœliándi:'
  "3": quinque sátrapas Philisthinórum, omnémque Chananǽum, et Sidónium, atque Hevǽum, qui habitábat in monte Líbano, de monte Baal Hermon usque ad intróitum Emath.
  "4": Dimisítque eos, ut in ipsis experirétur Israélem, utrum audíret mandáta Dómini quæ præcéperat pátribus eórum per manum Móysi, an non.
  "5": 'Itaque fílii Israel habitavérunt in médio Chananǽi, et Hethǽi, et Amorrhǽi, et Pherezǽi, et Hevǽi, et Iebusǽi:'
  "6": et duxérunt uxóres fílias eórum, ipsíque fílias suas fíliis eórum tradidérunt, et serviérunt diis eórum.
  "7": Fecerúntque malum in conspéctu Dómini, et oblíti sunt Dei sui, serviéntes Báalim et Astaroth.
  "8": Iratúsque contra Israel Dóminus, trádidit eos in manus Chusan Rasáthaim regis Mesopotámiæ, servierúntque ei octo annis.
  "9": 'Et clamavérunt ad Dóminum, qui suscitávit eis salvatórem, et liberávit eos, Othóniel vidélicet fílium Cenez, fratrem Caleb minórem:'
  "10": fuítque in eo Spíritus Dómini, et iudicávit Israel. Egressúsque est ad pugnam, et trádidit Dóminus in manus eius Chusan Rasáthaim regem Sýriæ, et oppréssit eum.
  "11": Quievítque terra quadragínta annis, et mórtuus est Othóniel fílius Cenez.
  "12": 'Addidérunt autem fílii Israel fácere malum in conspéctu Dómini: qui confortávit advérsum eos Eglon regem Moab, quia fecérunt malum in conspéctu eius.'
  "13": 'Et copulávit ei fílios Ammon, et Amalec: abiítque et percússit Israel, atque possédit Urbem palmárum.'
  "14": Servierúntque fílii Israel Eglon regi Moab decem et octo annis.
  "15": Et póstea clamavérunt ad Dóminum, qui suscitávit eis salvatórem vocábulo Aod, fílium Gera, fílii Iémini, qui utráque manu pro déxtera utebátur. Miserúntque fílii Israel per illum múnera Eglon regi Moab.
  "16": Qui fecit sibi gládium ancípitem, habéntem in médio cápulum longitúdinis palmæ manus, et accínctus est eo subter sagum in dextro fémore.
  "17": Obtulítque múnera Eglon regi Moab. Erat autem Eglon crassus nimis.
  "18": Cumque obtulísset ei múnera, prosecútus est sócios, qui cum eo vénerant.
  "19": 'Et revérsus de Gálgalis, ubi erant idóla, dixit ad regem: Verbum secrétum hábeo ad te, o rex. Et ille imperávit siléntium: egressísque ómnibus qui circa eum erant,'
  "20": 'ingréssus est Aod ad eum: sedébat autem in æstívo cœnáculo solus: dixítque: Verbum Dei hábeo ad te. Qui statim surréxit de throno.'
  "21": Extendítque Aod sinístram manum, et tulit sicam de dextro fémore suo, infixítque eam in ventre eius
  "22": 'tam válide, ut cápulus sequerétur ferrum in vúlnere, ac pinguíssimo ádipe stringerétur. Nec edúxit gládium, sed ita ut percússerat, relíquit in córpore: statímque per secréta natúræ alvi stércora prorupérunt.'
  "23": Aod autem clausis diligentíssime óstiis cœnáculi, et obfirmátis sera,
  "24": 'per postícum egréssus est. Servíque regis ingréssi vidérunt clausas fores cœnáculi, atque dixérunt: Fórsitan purgat alvum in æstívo cubículo.'
  "25": 'Exspectantésque diu donec erubéscerent, et vidéntes quod nullus aperíret, tulérunt clavem: et aperiéntes invenérunt dóminum suum in terra iacéntem mórtuum.'
  "26": 'Aod autem, dum illi turbaréntur, effúgit, et pertránsiit locum idolórum, unde revérsus fúerat. Venítque in Séirath:'
  "27": et statim insónuit búccina in monte Ephraim, descenderúntque cum eo fílii Israel, ipso in fronte gradiénte.
  "28": 'Qui dixit ad eos: Sequímini me: trádidit enim Dóminus inimícos nostros Moabítas in manus nostras. Descenderúntque post eum, et occupavérunt vada Iordánis quæ transmíttunt in Moab: et non dimisérunt transíre quemquam:'
  "29": 'sed percussérunt Moabítas in témpore illo, círciter decem míllia, omnes robústos et fortes viros: nullus eórum evádere pótuit.'
  "30": 'Humiliatúsque est Moab in die illo sub manu Israel: et quiévit terra octogínta annis.'
  "31": 'Post hunc fuit Samgar fílius Anath, qui percússit de Philísthiim sexcéntos viros vómere: et ipse quoque deféndit Israel.'
