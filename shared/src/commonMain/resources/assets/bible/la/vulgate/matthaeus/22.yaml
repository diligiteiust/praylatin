bible: vulgate
lang: la
language: Latina
book: Matthaeus
chapter: "22"
verses:
  "1": 'Et respóndens Iesus, dixit íterum in parábolis eis, dicens:'
  "2": Símile factum est regnum cælórum hómini regi, qui fecit núptias fílio suo.
  "3": Et misit servos suos vocáre invitátos ad núptias, et nolébant veníre.
  "4": 'Iterum misit álios servos, dicens: Dícite invitátis: Ecce prándium meum parávi, tauri mei, et altília occísa sunt, et ómnia paráta: veníte ad núptias.'
  "5": 'Illi autem neglexérunt: et abiérunt, álius in villam suam, álius vero ad negotiatiónem suam:'
  "6": réliqui vero tenuérunt servos eius, et contuméliis afféctos occidérunt.
  "7": 'Rex autem cum audísset, irátus est: et missis exercítibus suis, pérdidit homicídas illos, et civitátem illórum succéndit.'
  "8": 'Tunc ait servis suis: Núptiæ quidem parátæ sunt, sed qui invitáti erant, non fuérunt digni.'
  "9": Ite ergo ad éxitus viárum, et quoscúmque invenéritis, vocáte ad núptias.
  "10": 'Et egréssi servi eius in vias, congregavérunt omnes, quos invenérunt, malos et bonos: et implétæ sunt núptiæ discumbéntium.'
  "11": Intrávit autem rex ut vidéret discumbéntes, et vidit ibi hóminem non vestítum veste nuptiáli.
  "12": 'Et ait illi: Amíce, quómodo huc intrásti non habens vestem nuptiálem? At ille obmútuit.'
  "13": 'Tunc dicit rex minístris: Ligátis mánibus, et pédibus eius, míttite eum in ténebras exterióres: ibi erit fletus, et stridor déntium.'
  "14": Multi enim sunt vocáti, pauci vero elécti.
  "15": Tunc abeúntes Pharisǽi, consílium iniérunt ut cáperent eum in sermóne.
  "16": 'Et mittunt ei discípulos suos cum Herodiánis, dicéntes: Magíster, scimus quia verax es, et viam Dei in veritáte doces, et non est tibi cura de áliquo: non enim réspicis persónam hóminum:'
  "17": dic ergo nobis quid tibi vidétur, licet censum dare Cǽsari, an non?
  "18": 'Cógnita autem Iesus nequítia eórum, ait: Quid me tentátis hypócritæ?'
  "19": Osténdite mihi numísma census. At illi obtulérunt ei denárium.
  "20": 'Et ait illis Iesus: Cuius est imágo hæc, et superscríptio?'
  "21": 'Dicunt ei: Cǽsaris. Tunc ait illis: Réddite ergo quæ sunt Cǽsaris, Cǽsari: et quæ sunt Dei, Deo.'
  "22": Et audiéntes miráti sunt, et relícto eo abiérunt.
  "23": 'In illo die accessérunt ad eum Sadducǽi, qui dicunt non esse resurrectiónem: et interrogavérunt eum,'
  "24": 'dicéntes: Magíster, Móyses dixit: Si quis mórtuus fúerit non habens fílium, ut ducat frater eius uxórem illíus, et súscitet semen fratri suo.'
  "25": 'Erant autem apud nos septem fratres: et primus, uxóre ducta, defúnctus est: et non habens semen, relíquit uxórem suam fratri suo.'
  "26": Simíliter secúndus, et tértius usque ad séptimum.
  "27": Novíssime autem ómnium et múlier defúncta est.
  "28": In resurrectióne ergo cuius erit de septem uxor? omnes enim habuérunt eam.
  "29": 'Respóndens autem Iesus, ait illis: Errátis nesciéntes Scriptúras, neque virtútem Dei.'
  "30": 'In resurrectióne enim neque nubent, neque nubéntur: sed erunt sicut ángeli Dei in cælo.'
  "31": 'De resurrectióne autem mortuórum non legístis quod dictum est a Deo dicénte vobis:'
  "32": Ego sum Deus Abraham, et Deus Isaac, et Deus Iacob? Non est Deus mortuórum, sed vivéntium.
  "33": Et audiéntes turbæ, mirabántur in doctrína eius.
  "34": 'Pharisǽi autem audiéntes quod siléntium imposuísset Sadducǽis, convenérunt in unum:'
  "35": 'et interrogávit eum unus ex eis legis doctor, tentans eum:'
  "36": Magíster, quod est mandátum magnum in lege?
  "37": 'Ait illi Iesus: Díliges Dóminum Deum tuum ex toto corde tuo, et in tota ánima tua, et in tota mente tua.'
  "38": Hoc est máximum, et primum mandátum.
  "39": 'Secúndum autem símile est huic: Díliges próximum tuum, sicut teípsum.'
  "40": In his duóbus mandátis univérsa lex pendet, et prophétæ.
  "41": Congregátis autem Pharisǽis, interrogávit eos Iesus,
  "42": 'dicens: Quid vobis vidétur de Christo? cuius fílius est? Dicunt ei: David.'
  "43": 'Ait illis: Quómodo ergo David in Spíritu vocat eum Dóminum, dicens:'
  "44": 'Dixit Dóminus Dómino meo: Sede a dextris meis, donec ponam inimícos tuos scabéllum pedum tuórum?'
  "45": Si ergo David vocat eum Dóminum, quómodo fílius eius est?
  "46": 'Et nemo póterat ei respondére verbum: neque ausus fuit quisquam ex illa die eum ámplius interrogáre.'
