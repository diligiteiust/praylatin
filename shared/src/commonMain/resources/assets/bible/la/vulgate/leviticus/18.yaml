bible: vulgate
lang: la
language: Latina
book: Leviticus
chapter: "18"
verses:
  "1": 'Locútus est Dóminus ad Móysen, dicens:'
  "2": 'Lóquere fíliis Israel, et dices ad eos: Ego Dóminus Deus vester:'
  "3": 'iuxta consuetúdinem terræ Ægýpti, in qua habitástis, non faciétis: et iuxta morem regiónis Chánaan, ad quam ego introductúrus sum vos, non agétis, nec in legítimis eórum ambulábitis.'
  "4": Faciétis iudícia mea, et præcépta mea servábitis, et ambulábitis in eis. Ego Dóminus Deus vester.
  "5": Custodíte leges meas atque iudícia, quæ fáciens homo, vivet in eis. Ego Dóminus.
  "6": Omnis homo ad próximam sánguinis sui non accédet, ut revélet turpitúdinem eius. Ego Dóminus.
  "7": 'Turpitúdinem patris tui et turpitúdinem matris tuæ non discoopéries: mater tua est: non revelábis turpitúdinem eius.'
  "8": 'Turpitúdinem uxóris patris tui non discoopéries: turpitúdo enim patris tui est.'
  "9": Turpitúdinem soróris tuæ ex patre sive ex matre, quæ domi vel foris génita est, non revelábis.
  "10": 'Turpitúdinem fíliæ fílii tui vel neptis ex fília non revelábis: quia turpitúdo tua est.'
  "11": Turpitúdinem fíliæ uxóris patris tui, quam péperit patri tuo, et est soror tua, non revelábis.
  "12": 'Turpitúdinem soróris patris tui non discoopéries: quia caro est patris tui.'
  "13": Turpitúdinem soróris matris tuæ non revelábis, eo quod caro sit matris tuæ.
  "14": Turpitúdinem pátrui tui non revelábis, nec accédes ad uxórem eius, quæ tibi affinitáte coniúngitur.
  "15": 'Turpitúdinem nurus tuæ non revelábis, quia uxor fílii tui est: nec discoopéries ignomíniam eius.'
  "16": 'Turpitúdinem uxóris fratris tui non revelábis: quia turpitúdo fratris tui est.'
  "17": 'Turpitúdinem uxóris tuæ et fíliæ eius non revelábis. Fíliam fílii eius, et fíliam fíliæ illíus non sumes, ut revéles ignomíniam eius: quia caro illíus sunt, et talis cóitus incéstus est.'
  "18": Sorórem uxóris tuæ in pellicátum illíus non accípies, nec revelábis turpitúdinem eius adhuc illa vivénte.
  "19": Ad mulíerem quæ pátitur ménstrua non accédes, nec revelábis fœditátem eius.
  "20": Cum uxóre próximi tui non coíbis, nec séminis commistióne maculáberis.
  "21": De sémine tuo non dabis ut consecrétur idólo Moloch, nec póllues nomen Dei tui. Ego Dóminus.
  "22": Cum másculo non commisceáris cóitu femíneo, quia abominátio est.
  "23": Cum omni pécore non coíbis, nec maculáberis cum eo. Múlier non succúmbet iuménto, nec miscébitur ei, quia scelus est.
  "24": Nec polluámini in ómnibus his, quibus contaminátæ sunt univérsæ gentes, quas ego eíciam ante conspéctum vestrum,
  "25": 'et quibus pollúta est terra: cuius ego scélera visitábo, ut évomat habitatóres suos.'
  "26": Custodíte legítima mea atque iudícia, et non faciátis ex ómnibus abominatiónibus istis, tam indígena quam colónus qui peregrinántur apud vos.
  "27": Omnes enim exsecratiónes istas fecérunt áccolæ terræ qui fuérunt ante vos, et polluérunt eam.
  "28": Cavéte ergo ne et vos simíliter évomat, cum pária fecéritis, sicut evómuit gentem, quæ fuit ante vos.
  "29": Omnis ánima, quæ fécerit de abominatiónibus his quíppiam, períbit de médio pópuli sui.
  "30": Custodíte mandáta mea. Nolíte fácere quæ fecérunt hi qui fuérunt ante vos, et ne polluámini in eis. Ego Dóminus Deus vester.
