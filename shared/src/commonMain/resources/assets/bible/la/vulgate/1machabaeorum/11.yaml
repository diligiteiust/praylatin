bible: vulgate
lang: la
language: Latina
book: I Machabaeorum
chapter: "11"
verses:
  "1": 'Et rex Ægýpti congregávit exércitum, sicut aréna, quæ est circa oram maris, et naves multas: et quærébat obtinére regnum Alexándri dolo, et áddere illud regno suo.'
  "2": 'Et éxiit in Sýriam verbis pacíficis, et aperiébant ei civitátes, et occurrébant ei: quia mandáverat Alexánder rex exíre ei óbviam, eo quod socer suus esset.'
  "3": Cum autem introíret civitátem Ptolemǽus, ponébat custódias mílitum in síngulis civitátibus.
  "4": Et ut appropiávit Azóto, ostendérunt ei templum Dagon succénsum igni, et Azótum, et cétera eius demolíta, et córpora proiécta, et eórum, qui cæsi erant in bello, túmulos quos fécerant secus viam.
  "5": 'Et narravérunt regi quia hæc fecit Iónathas, ut invídiam fácerent ei: et tácuit rex.'
  "6": Et occúrrit Iónathas regi in Ioppen cum glória, et ínvicem se salutavérunt, et dormiérunt illic.
  "7": 'Et ábiit Iónathas cum rege usque ad flúvium, qui vocátur Eléutherus: et revérsus est in Ierúsalem.'
  "8": Rex autem Ptolemǽus obtínuit domínium civitátum usque Seléuciam marítimam, et cogitábat in Alexándrum consília mala.
  "9": 'Et misit legátos ad Demétrium, dicens: Veni, componámus inter nos pactum, et dabo tibi fíliam meam, quam habet Alexánder, et regnábis in regno patris tui:'
  "10": 'pœ́nitet enim me quod déderim illi fíliam meam: quæsívit enim me occídere.'
  "11": Et vituperávit eum, proptérea quod concupíerat regnum eius.
  "12": Et ábstulit fíliam suam, et dedit eam Demétrio, et alienávit se ab Alexándro, et maniféstæ sunt inimicítiæ eius.
  "13": Et intrávit Ptolemǽus Antiochíam, et impósuit duo diadémata cápiti suo, Ægýpti, et Asiæ.
  "14": 'Alexánder autem rex erat in Cilícia illis tempóribus: quia rebellábant qui erant in locis illis.'
  "15": 'Et audívit Alexánder, et venit ad eum in bellum: et prodúxit Ptolemǽus rex exércitum, et occúrrit ei in manu válida, et fugávit eum.'
  "16": 'Et fugit Alexánder in Arábiam, ut ibi protegerétur: rex autem Ptolemǽus exaltátus est.'
  "17": Et ábstulit Zábdiel Arabs caput Alexándri, et misit Ptolemǽo.
  "18": 'Et rex Ptolemǽus mórtuus est in die tértia: et qui erant in munitiónibus, periérunt ab his, qui erant intra castra.'
  "19": Et regnávit Demétrius anno centésimo sexagésimo séptimo.
  "20": 'In diébus illis congregávit Iónathas eos, qui erant in Iudǽa, ut expugnárent arcem, quæ est in Ierúsalem: et fecérunt contra eam máchinas multas.'
  "21": Et abiérunt quidam qui óderant gentem suam viri iníqui ad regem Demétrium, et renuntiavérunt ei quod Iónathas obsidéret arcem.
  "22": 'Et ut audívit, irátus est: et statim venit ad Ptolemáidam, et scripsit Iónathæ ne obsidéret arcem, sed occúrreret sibi ad collóquium festináto.'
  "23": 'Ut audívit autem Iónathas, iussit obsidére: et elégit de senióribus Israel, et de sacerdótibus, et dedit se perículo.'
  "24": 'Et accépit aurum, et argéntum, et vestem, et ália xénia multa, et ábiit ad regem Ptolemáidam: et invénit grátiam in conspéctu eius.'
  "25": Et interpellábant advérsus eum quidam iníqui ex gente sua.
  "26": 'Et fecit ei rex sicut fécerant ei, qui ante eum fúerant: et exaltávit eum in conspéctu ómnium amicórum suórum,'
  "27": et státuit ei principátum sacerdótii, et quæcúmque ália hábuit prius pretiósa, et fecit eum príncipem amicórum.
  "28": 'Et postulávit Iónathas a rege ut immúnem fáceret Iudǽam, et tres topárchias, et Samaríam, et confínes eius: et promísit ei talénta trecénta.'
  "29": 'Et consénsit rex: et scripsit Iónathæ epístolas de his ómnibus, hunc modum continéntes:'
  "30": Rex Demétrius fratri Iónathæ salútem, et genti Iudæórum.
  "31": 'Exémplum epístolæ, quam scrípsimus Lástheni parénti nostro de vobis, mísimus ad vos ut scirétis:'
  "32": Rex Demétrius Lástheni parénti salútem.
  "33": Genti Iudæórum amícis nostris, et conservántibus quæ iusta sunt apud nos, decrévimus benefácere propter benignitátem ipsórum, quam erga nos habent.
  "34": Statúimus ergo illis omnes fines Iudǽæ, et tres civitátes, Lydan, et Rámathan, quæ ádditæ sunt Iudǽæ ex Samaría, et omnes confínes eárum, sequestrári ómnibus sacrificántibus in Ierosólymis pro his, quæ ab eis prius accipiébat rex per síngulos annos, et pro frúctibus terræ, et pomórum.
  "35": 'Et ália, quæ ad nos pertinébant decimárum, et tributórum, ex hoc témpore remíttimus eis: et áreas salinárum, et corónas, quæ nobis deferebántur,'
  "36": 'ómnia ipsis concédimus: et nihil horum írritum erit, ex hoc, et in omne tempus.'
  "37": Nunc ergo curáte fácere horum exémplum, et detur Iónathæ, et ponátur in monte sancto, in loco célebri.
  "38": 'Et videns Demétrius rex quod síluit terra in conspéctu suo, et nihil ei resístit, dimísit totum exércitum suum, unumquémque in locum suum, excépto peregríno exércitu, quem contráxit ab ínsulis géntium: et inimíci erant ei omnes exércitus patrum eius.'
  "39": 'Tryphon autem erat quidam pártium Alexándri prius: et vidit quóniam omnis exércitus murmurábat contra Demétrium, et ivit ad Emálchuel Arabem, qui nutriébat Antíochum fílium Alexándri:'
  "40": 'et assidébat ei, ut tráderet eum ipsi, ut regnáret loco patris sui: et enuntiávit ei quanta fecit Demétrius, et inimicítias exercítuum eius advérsus illum. Et mansit ibi diébus multis.'
  "41": 'Et misit Iónathas ad Demétrium regem, ut eíceret eos, qui in arce erant in Ierúsalem, et qui in præsídiis erant: quia impugnábant Israel.'
  "42": 'Et misit Demétrius ad Iónathan, dicens: Non hæc tantum fáciam tibi, et genti tuæ, sed glória illustrábo te, et gentem tuam, cum fúerit opportúnum.'
  "43": 'Nunc ergo recte féceris, si míseris in auxílium mihi viros: quia discéssit omnis exércitus meus.'
  "44": 'Et misit ei Iónathas tria míllia virórum fórtium Antiochíam: et venérunt ad regem, et delectátus est rex in advéntu eórum.'
  "45": Et convenérunt qui erant de civitáte, centum vigínti míllia virórum, et volébant interfícere regem.
  "46": 'Et fugit rex in aulam: et occupavérunt qui erant de civitáte, itínera civitátis, et cœpérunt pugnáre.'
  "47": 'Et vocávit rex Iudǽos in auxílium, et convenérunt omnes simul ad eum, et dispérsi sunt omnes per civitátem:'
  "48": et occidérunt in illa die centum míllia hóminum, et succendérunt civitátem, et cepérunt spólia multa in die illa, et liberavérunt regem.
  "49": 'Et vidérunt qui erant de civitáte, quod obtinuíssent Iudǽi civitátem sicut volébant: et infirmáti sunt mente sua, et clamavérunt ad regem cum précibus, dicéntes:'
  "50": Da nobis dextras, et cessent Iudǽi oppugnáre nos, et civitátem.
  "51": 'Et proiecérunt arma sua, et fecérunt pacem, et glorificáti sunt Iudǽi in conspéctu regis, et in conspéctu ómnium, qui erant in regno eius, et nomináti sunt in regno: et regréssi sunt in Ierúsalem habéntes spólia multa.'
  "52": 'Et sedit Demétrius rex in sede regni sui: et síluit terra in conspéctu eius.'
  "53": Et mentítus est ómnia quæcúmque dixit, et abalienávit se a Iónatha, et non retríbuit ei secúndum benefícia, quæ sibi tribúerat, et vexábat eum valde.
  "54": Post hæc autem revérsus est Tryphon, et Antíochus cum eo puer adoléscens, et regnávit, et impósuit sibi diadéma.
  "55": 'Et congregáti sunt ad eum omnes exércitus, quos dispérserat Demétrius, et pugnavérunt contra eum: et fugit, et terga vertit.'
  "56": Et accépit Tryphon béstias, et obtínuit Antiochíam.
  "57": 'Et scripsit Antíochus adoléscens Iónathæ, dicens: Constítuo tibi sacerdótium, et constítuo te super quátuor civitátes, ut sis de amícis regis.'
  "58": 'Et misit illi vasa áurea in ministérium, et dedit ei potestátem bibéndi in auro, et esse in púrpura, et habére fíbulam áuream:'
  "59": et Simónem fratrem eius constítuit ducem a términis Tyri usque ad fines Ægýpti.
  "60": 'Et éxiit Iónathas, et perambulábat trans flumen civitátes: et congregátus est ad eum omnis exércitus Sýriæ in auxílium, et venit Ascalónem, et occurrérunt ei honorífice de civitáte.'
  "61": 'Et ábiit inde Gazam: et conclusérunt se qui erant Gazæ: et obsédit eam, et succéndit quæ erant in circúitu civitátis, et prædátus est ea.'
  "62": 'Et rogavérunt Gazénses Iónathan, et dedit illis déxteram: et accépit fílios eórum óbsides, et misit illos in Ierúsalem: et perambulávit regiónem usque Damáscum.'
  "63": 'Et audívit Iónathas quod prævaricáti sunt príncipes Demétrii in Cades, quæ est in Galilǽa, cum exércitu multo, voléntes eum removére a negótio regni:'
  "64": 'et occúrrit illis: fratrem autem suum Simónem relíquit intra provínciam.'
  "65": Et applícuit Simon ad Bethsúram, et expugnábat eam diébus multis, et conclúsit eos.
  "66": 'Et postulavérunt ab eo dextras accípere, et dedit illis: et eiécit eos inde, et cepit civitátem, et pósuit in ea præsídium.'
  "67": 'Et Iónathas, et castra eius applicuérunt ad aquam Génesar, et ante lucem vigilavérunt in campo Asor:'
  "68": 'et ecce castra alienigenárum occurrébant in campo, et tendébant ei insídias in móntibus: ipse autem occúrrit ex advérso.'
  "69": Insídiæ vero exsurrexérunt de locis suis, et commisérunt prœ́lium.
  "70": Et fugérunt qui erant ex parte Iónathæ omnes, et nemo relíctus est ex eis, nisi Mathathías fílius Absolómi, et Iudas fílius Calphi, princeps milítiæ exércitus.
  "71": Et scidit Iónathas vestiménta sua, et pósuit terram in cápite suo, et orávit.
  "72": Et revérsus est Iónathas ad eos in prœ́lium, et convértit eos in fugam, et pugnavérunt.
  "73": 'Et vidérunt qui fugiébant partis illíus, et revérsi sunt ad eum, et insequebántur cum eo omnes usque Cades ad castra sua, et pervenérunt usque illuc:'
  "74": 'et cecidérunt de alienígenis in die illa tria míllia virórum: et revérsus est Iónathas in Ierúsalem.'
