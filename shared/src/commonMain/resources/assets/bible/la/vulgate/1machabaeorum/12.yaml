bible: vulgate
lang: la
language: Latina
book: I Machabaeorum
chapter: "12"
verses:
  "1": 'Et vidit Iónathas quia tempus eum iuvat, et elégit viros, et misit eos Romam statúere, et renováre cum eis amicítiam:'
  "2": 'et ad Spartiátas, et ad ália loca misit epístolas secúndum eámdem formam:'
  "3": 'et abiérunt Romam, et intravérunt cúriam, et dixérunt: Iónathas summus sacérdos, et gens Iudæórum misérunt nos, ut renovarémus amicítiam, et societátem secúndum prístinum.'
  "4": Et dedérunt illis epístolas ad ipsos per loca, ut dedúcerent eos in terram Iuda cum pace.
  "5": 'Et hoc est exémplum epistolárum, quas scripsit Iónathas Spartiátis:'
  "6": Iónathas summus sacérdos, et senióres gentis, et sacerdótes, et réliquus pópulus Iudæórum, Spartiátis frátribus salútem.
  "7": Iamprídem missæ erant epístolæ ad Oníam summum sacerdótem ab Arío, qui regnábat apud vos, quóniam estis fratres nostri, sicut rescríptum cóntinet, quod subiéctum est.
  "8": 'Et suscépit Onías virum, qui missus fúerat, cum honóre: et accépit epístolas, in quibus significabátur de societáte, et amicítia.'
  "9": Nos cum nullo horum indigerémus, habéntes solátio sanctos libros, qui sunt in mánibus nostris,
  "10": 'malúimus míttere ad vos renováre fraternitátem, et amicítiam, ne forte aliéni efficiámur a vobis: multa enim témpora transiérunt, ex quo misístis ad nos.'
  "11": Nos ergo in omni témpore sine intermissióne in diébus solémnibus, et céteris, quibus opórtet, mémores sumus vestri in sacrifíciis, quæ offérimus, et in observatiónibus, sicut fas est, et decet meminísse fratrum.
  "12": Lætámur ítaque de glória vestra.
  "13": Nos autem circumdedérunt multæ tribulatiónes, et multa prœ́lia, et impugnavérunt nos reges, qui sunt in circúitu nostro.
  "14": 'Nolúimus ergo vobis molésti esse, neque céteris sóciis, et amícis nostris in his prœ́liis:'
  "15": habúimus enim de cælo auxílium, et liberáti sumus nos, et humiliáti sunt inimíci nostri.
  "16": Elégimus ítaque Numénium Antíochi fílium, et Antipátrem Iasónis fílium, et mísimus ad Romános renováre cum eis amicítiam, et societátem prístinam.
  "17": Mandávimus ítaque eis ut véniant étiam ad vos, et salútent vos, et reddant vobis epístolas nostras de innovatióne fraternitátis nostræ.
  "18": Et nunc benefaciétis respondéntes nobis ad hæc.
  "19": 'Et hoc est rescríptum epistolárum, quod míserat Oníæ:'
  "20": Aríus, rex Spartiatárum, Oníæ sacerdóti magno salútem.
  "21": Invéntum est in scriptúra de Spartiátis, et Iudǽis, quóniam sunt fratres, et quod sunt de génere Abraham.
  "22": Et nunc ex quo hæc cognóvimus, benefácitis scribéntes nobis de pace vestra.
  "23": 'Sed et nos rescrípsimus vobis: Pécora nostra, et possessiónes nostræ, vestræ sunt: et vestræ, nostræ: mandávimus ítaque hæc nuntiári vobis.'
  "24": 'Et audívit Iónathas quóniam regréssi sunt príncipes Demétrii cum exércitu multo supra quam prius, pugnáre advérsus eum:'
  "25": 'et éxiit ab Ierúsalem, et occúrrit eis in Amathíte regióne: non enim déderat eis spátium ut ingrederéntur regiónem eius.'
  "26": 'Et misit speculatóres in castra eórum: et revérsi renuntiavérunt quod constítuunt superveníre illis nocte.'
  "27": 'Cum occidísset autem sol, præcépit Iónathas suis vigiláre, et esse in armis parátos ad pugnam tota nocte: et pósuit custódes per circúitum castrórum.'
  "28": 'Et audiérunt adversárii quod parátus est Iónathas cum suis in bello: et timuérunt, et formidavérunt in corde suo: et accendérunt focos in castris suis.'
  "29": 'Iónathas autem, et qui cum eo erant, non cognovérunt usque mane: vidébant autem luminária ardéntia,'
  "30": 'et secútus est eos Iónathas, et non comprehéndit eos: transíerant enim flumen Eléutherum.'
  "31": 'Et divértit Iónathas ad Arabas, qui vocántur Zabadǽi: et percússit eos, et accépit spólia eórum.'
  "32": Et iunxit, et venit Damáscum, et perambulábat omnem regiónem illam.
  "33": 'Simon autem éxiit, et venit usque ad Ascalónem, et ad próxima præsídia: et declinávit in Ioppen, et occupávit eam'
  "34": (audívit enim quod vellent præsídium trádere pártibus Demétrii), et pósuit ibi custódes ut custodírent eam.
  "35": Et revérsus est Iónathas, et convocávit senióres pópuli, et cogitávit cum eis ædificáre præsídia in Iudǽa,
  "36": et ædificáre muros in Ierúsalem, et exaltáre altitúdinem magnam inter médium arcis et civitátis, ut separáret eam a civitáte, ut esset ipsa singuláriter, et neque emant, neque vendant.
  "37": 'Et convenérunt ut ædificárent civitátem: et cécidit murus, qui erat super torréntem ab ortu solis, et reparávit eum, qui vocátur Caphétetha:'
  "38": et Simon ædificávit Adíada in Séphela, et munívit eam, et impósuit portas, et seras.
  "39": 'Et cum cogitásset Tryphon regnáre Asiæ, et assúmere diadéma, et exténdere manum in Antíochum regem:'
  "40": timens ne forte non permítteret eum Iónathas, sed pugnáret advérsus eum, quærébat comprehéndere eum, et occídere. Et exsúrgens ábiit in Bethsan.
  "41": Et exívit Iónathas óbviam illi cum quadragínta míllibus virórum electórum in prœ́lium, et venit Bethsan.
  "42": 'Et vidit Tryphon quia venit Iónathas cum exércitu multo ut exténderet in eum manus, tímuit:'
  "43": 'et excépit eum cum honóre, et commendávit eum ómnibus amícis suis, et dedit ei múnera: et præcépit exercítibus suis ut obedírent ei, sicut sibi.'
  "44": 'Et dixit Iónathæ: Ut quid vexásti univérsum pópulum, cum bellum nobis non sit?'
  "45": 'Et nunc remítte eos in domos suas: élige autem tibi viros paucos, qui tecum sint, et veni mecum Ptolemáidam, et tradam eam tibi, et réliqua præsídia, et exércitum, et univérsos præpósitos negótii, et convérsus abíbo: proptérea enim veni.'
  "46": 'Et crédidit ei, et fecit sicut dixit: et dimísit exércitum, et abiérunt in terram Iuda.'
  "47": 'Retínuit autem secum tria míllia virórum: ex quibus remísit in Galilǽam duo míllia: mille autem venérunt cum eo.'
  "48": 'Ut autem intrávit Ptolemáidam Iónathas, clausérunt portas civitátis Ptoleménses, et comprehendérunt eum: et omnes, qui cum eo intráverant, gládio interfecérunt.'
  "49": Et misit Tryphon exércitum, et équites in Galilǽam, et in campum magnum, ut pérderent omnes sócios Iónathæ.
  "50": At illi cum cognovíssent quia comprehénsus est Iónathas, et périit, et omnes, qui cum eo erant, hortáti sunt semetípsos, et exiérunt paráti in prœ́lium.
  "51": 'Et vidéntes hi, qui insecúti fúerant, quia pro ánima res est illis, revérsi sunt:'
  "52": 'illi autem venérunt omnes cum pace in terram Iuda. Et planxérunt Iónathan, et eos, qui cum ipso fúerant, valde: et luxit Israel luctu magno.'
  "53": 'Et quæsiérunt omnes gentes, quæ erant in circúitu eórum, contérere eos: dixérunt enim:'
  "54": 'Non habent príncipem, et adiuvántem: nunc ergo expugnémus illos, et tollámus de homínibus memóriam eórum.'
