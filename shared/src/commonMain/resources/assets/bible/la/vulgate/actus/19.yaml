bible: vulgate
lang: la
language: Latina
book: Actus Apostolorum
chapter: "19"
verses:
  "1": 'Factum est autem cum Apóllo esset Corínthi, ut Paulus peragrátis superióribus pártibus veníret Ephesum, et inveníret quosdam discípulos:'
  "2": 'dixítque ad eos: Si Spíritum sanctum accepístis credéntes? At illi dixérunt ad eum: Sed neque si Spíritus sanctus est, audívimus.'
  "3": 'Ille vero ait: In quo ergo baptizáti estis? Qui dixérunt: In Ioánnis baptísmate.'
  "4": 'Dixit autem Paulus: Ioánnes baptizávit baptísmo pœniténtiæ pópulum, dicens: In eum, qui ventúrus esset post ipsum, ut créderent, hoc est, in Iesum.'
  "5": His audítis, baptizáti sunt in nómine Dómini Iesu.
  "6": Et cum imposuísset illis manus Paulus, venit Spíritus sanctus super eos, et loquebántur linguis, et prophetábant.
  "7": Erant autem omnes viri fere duódecim.
  "8": Introgréssus autem synagógam, cum fidúcia loquebátur per tres menses, dísputans, et suadens de regno Dei.
  "9": Cum autem quidam induraréntur, et non créderent, maledicéntes viam Dómini coram multitúdine, discédens ab eis, segregávit discípulos, quotídie dísputans in schola tyránni cuiúsdam.
  "10": Hoc autem factum est per biénnium, ita ut omnes, qui habitábant in Asia audírent verbum Dómini, Iudǽi atque gentíles.
  "11": Virtutésque non quáslibet faciébat Deus per manum Pauli,
  "12": ita ut étiam super lánguidos deferréntur a córpore eius sudária et semicínctia, et recedébant ab eis languóres, et spíritus nequam egrediebántur.
  "13": 'Tentavérunt autem quidam et de circumeúntibus Iudǽis exorcístis, invocáre super eos, qui habébant spíritus malos nomen Dómini Iesu, dicéntes: Adiúro vos per Iesum, quem Paulus prǽdicat.'
  "14": Erant autem quidam Iudǽi, Scevæ príncipis sacerdótum septem fílii, qui hoc faciébant.
  "15": 'Respóndens autem spíritus nequam dixit eis: Iesum novi, et Paulum scio: vos autem qui estis?'
  "16": Et insíliens in eos homo, in quo erat dæmónium péssimum, et dominátus ambórum, inváluit contra eos, ita ut nudi, et vulneráti effúgerent de domo illa.
  "17": 'Hoc autem notum factum est ómnibus Iudǽis, atque gentílibus, qui habitábant Ephesi: et cécidit timor super omnes illos, et magnificabátur nomen Dómini Iesu.'
  "18": Multíque credéntium veniébant confiténtes, et annuntiántes actus suos.
  "19": 'Multi autem ex eis, qui fúerant curiósa sectáti, contulérunt libros, et combussérunt coram ómnibus: et computátis prétiis illórum, invenérunt pecúniam denariórum quinquagínta míllium.'
  "20": Ita fórtiter crescébat verbum Dei, et confirmabátur.
  "21": 'His autem explétis, propósuit Paulus in Spíritu, tránsita Macedónia et Acháia, ire Ierosólymam, dicens: Quóniam postquam fúero ibi, opórtet me et Romam vidére.'
  "22": Mittens autem in Macedóniam duos ex ministrántibus sibi, Timótheum, et Erástum, ipse remánsit ad tempus in Asia.
  "23": Facta est autem illo témpore turbátio non mínima de via Dómini.
  "24": 'Demétrius enim quidam nómine, argentárius, fáciens ædes argénteas Diánæ, præstábat artifícibus non módicum quæstum:'
  "25": 'quos cónvocans, et eos, qui huiúsmodi erant opífices, dixit: Viri, scitis quia de hoc artifício est nobis acquisítio:'
  "26": 'et vidétis, et audítis quia non solum Ephesi, sed pene totíus Asiæ, Paulus hic suadens avértit multam turbam, dicens: Quóniam non sunt dii, qui mánibus fiunt.'
  "27": Non solum autem hæc periclitábitur nobis pars in redargutiónem veníre, sed et magnæ Diánæ templum in níhilum reputábitur, sed et déstrui incípiet maiéstas eius, quam tota Asia, et orbis colit.
  "28": 'His audítis, repléti sunt ira, et exclamavérunt dicéntes: Magna Diána Ephesiórum.'
  "29": Et impléta est cívitas confusióne, et ímpetum fecérunt uno ánimo in theátrum, rapto Gáio, et Aristárcho Macedónibus, comítibus Pauli.
  "30": Paulo autem volénte intráre in pópulum, non permisérunt discípuli.
  "31": 'Quidam autem et de Asiæ princípibus, qui erant amíci eius, misérunt ad eum rogántes ne se daret in theátrum:'
  "32": 'álii autem áliud clamábant. Erat enim ecclésia confúsa: et plures nesciébant qua ex causa conveníssent.'
  "33": De turba autem detraxérunt Alexándrum, propelléntibus eum Iudǽis. Alexánder autem manu siléntio postuláto, volébat réddere ratiónem pópulo.
  "34": 'Quem ut cognovérunt Iudǽum esse, vox facta una est ómnium, quasi per horas duas clamántium: Magna Diána Ephesiórum.'
  "35": 'Et cum sedásset scriba turbas, dixit: Viri Ephésii, quis enim est hóminum, qui nésciat Ephesiórum civitátem cultrícem esse magnæ Diánæ, Iovísque prolis?'
  "36": Cum ergo his contradíci non possit, opórtet vos sedátos esse, et nihil témere ágere.
  "37": Adduxístis enim hómines istos, neque sacrílegos, neque blasphemántes deam vestram.
  "38": Quod si Demétrius, et qui cum eo sunt artífices, habent advérsus áliquem causam, convéntus forénses agúntur, et procónsules sunt, accúsent ínvicem.
  "39": Si quid autem altérius rei quǽritis, in legítima ecclésia póterit absólvi.
  "40": 'Nam et periclitámur árgui seditiónis hodiérnæ: cum nullus obnóxius sit (de quo possímus réddere ratiónem) concúrsus istíus. Et cum hæc dixísset, dimísit ecclésiam.'
