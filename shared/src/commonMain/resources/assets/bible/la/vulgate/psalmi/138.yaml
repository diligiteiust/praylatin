bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "138"
verses:
  "1": 'In finem, psalmus David. Dómine probásti me, et cognovísti me:'
  "2": tu cognovísti sessiónem meam, et resurrectiónem meam.
  "3": 'Intellexísti cogitatiónes meas de longe: sémitam meam, et funículum meum investigásti.'
  "4": 'Et omnes vias meas prævidísti: quia non est sermo in lingua mea.'
  "5": 'Ecce Dómine tu cognovísti ómnia novíssima, et antíqua: tu formásti me, et posuísti super me manum tuam.'
  "6": 'Mirábilis facta est sciéntia tua ex me: confortáta est, et non pótero ad eam.'
  "7": Quo ibo a spíritu tuo? et quo a fácie tua fúgiam?
  "8": 'Si ascéndero in cælum, tu illic es: si descéndero in inférnum, ades.'
  "9": 'Si súmpsero pennas meas dilúculo, et habitávero in extrémis maris:'
  "10": 'étenim illuc manus tua dedúcet me: et tenébit me déxtera tua.'
  "11": 'Et dixi: Fórsitan ténebræ conculcábunt me: et nox illuminátio mea in delíciis meis.'
  "12": 'Quia ténebræ non obscurabúntur a te, et nox sicut dies illuminábitur: sicut ténebræ eius, ita et lumen eius.'
  "13": 'Quia tu possedísti renes meos: suscepísti me de útero matris meæ.'
  "14": 'Confitébor tibi quia terribíliter magnificátus es: mirabília ópera tua, et ánima mea cognóscit nimis.'
  "15": 'Non est occultátum os meum a te, quod fecísti in occúlto: et substántia mea in inferióribus terræ.'
  "16": 'Imperféctum meum vidérunt óculi tui, et in libro tuo omnes scribéntur: dies formabúntur, et nemo in eis.'
  "17": 'Mihi autem nimis honorificáti sunt amíci tui, Deus: nimis confortátus est principátus eórum.'
  "18": 'Dinumerábo eos, et super arénam multiplicabúntur: exsurréxi, et adhuc sum tecum.'
  "19": 'Si occíderis Deus peccatóres: viri sánguinum declináte a me:'
  "20": 'quia dícitis in cogitatióne: Accípient in vanitáte civitátes tuas.'
  "21": 'Nonne qui odérunt te Dómine, óderam: et super inimícos tuos tabescébam?'
  "22": 'Perfécto ódio óderam illos: et inimíci facti sunt mihi.'
  "23": 'Proba me Deus, et scito cor meum: intérroga me, et cognósce sémitas meas.'
  "24": 'Et vide, si via iniquitátis in me est: et deduc me in via ætérna.'
