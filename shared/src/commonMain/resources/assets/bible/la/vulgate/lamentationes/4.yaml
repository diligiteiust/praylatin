bible: vulgate
lang: la
language: Latina
book: Lamentationes
chapter: "4"
verses:
  "1": Aleph. Quómodo obscurátum est aurum, mutátus est color óptimus, dispérsi sunt lápides sanctuárii in cápite ómnium plateárum?
  "2": 'Beth. Fílii Sion ínclyti, et amícti auro primo: quómodo reputáti sunt in vasa téstea, opus mánuum fíguli?'
  "3": 'Ghimel. Sed et lámiæ nudavérunt mammam, lactavérunt cátulos suos: fília pópuli mei crudélis quasi strúthio in desérto.'
  "4": 'Daleth. Adhǽsit lingua lacténtis ad palátum eius in siti: párvuli petiérunt panem, et non erat qui frángeret eis.'
  "5": 'He. Qui vescebántur voluptuóse, interiérunt in viis: qui nutriebántur in cróceis, amplexáti sunt stércora.'
  "6": Vau. Et maior effécta est iníquitas fíliæ pópuli mei peccáto Sodomórum, quæ subvérsa est in moménto, et non cepérunt in ea manus.
  "7": Zain. Candidióres Nazarǽi eius nive, nitidióres lacte, rubicundióres ébore antíquo, sapphíro pulchrióres.
  "8": 'Heth. Denigráta est super carbónes fácies eórum, et non sunt cógniti in platéis: adhǽsit cutis eórum óssibus: áruit, et facta est quasi lignum.'
  "9": 'Teth. Mélius fuit occísis gládio, quam interféctis fame: quóniam isti extabuérunt consúmpti a sterilitáte terræ.'
  "10": 'Iod. Manus mulíerum misericórdium coxérunt fílios suos: facti sunt cibus eárum in contritióne fíliæ pópuli mei.'
  "11": 'Caph. Complévit Dóminus furórem suum, effúdit iram indignatiónis suæ: et succéndit ignem in Sion, et devorávit fundaménta eius.'
  "12": 'Lamed. Non credidérunt reges terræ, et univérsi habitatóres orbis, quóniam ingrederétur hostis et inimícus per portas Ierúsalem:'
  "13": Mem. propter peccáta prophetárum eius, et iniquitátes sacerdótum eius, qui effudérunt in médio eius sánguinem iustórum.
  "14": 'Nun. Erravérunt cæci in platéis, pollúti sunt in sánguine: cumque non possent, tenuérunt lacínias suas.'
  "15": 'Samech. Recédite pollúti, clamavérunt eis: recédite, abíte, nolíte tángere: iurgáti quippe sunt, et commóti dixérunt inter gentes: Non addet ultra ut hábitet in eis.'
  "16": 'Phe. Fácies Dómini divísit eos, non addet ut respíciat eos: fácies sacerdótum non erubuérunt, neque senum misérti sunt.'
  "17": Ain. Cum adhuc subsisterémus, defecérunt óculi nostri ad auxílium nostrum vanum, cum respicerémus atténti ad gentem, quæ salváre non póterat.
  "18": 'Sade. Lubricavérunt vestígia nostra in itínere plateárum nostrárum, appropinquávit finis noster: compléti sunt dies nostri, quia venit finis noster.'
  "19": 'Coph. Velocióres fuérunt persecutóres nostri áquilis cæli: super montes persecúti sunt nos, in desérto insidiáti sunt nobis.'
  "20": 'Res. Spíritus oris nostri Christus Dóminus captus est in peccátis nostris: cui díximus: In umbra tua vivémus in géntibus.'
  "21": 'Sin. Gaude et lætáre fília Edom, quæ hábitas in terra Hus: ad te quoque pervéniet calix, inebriáberis, atque nudáberis.'
  "22": 'Thau. Compléta est iníquitas tua fília Sion, non addet ultra ut tránsmigret te: visitávit iniquitátem tuam fília Edom, discoopéruit peccáta tua.'
