bible: vulgate
lang: la
language: Latina
book: II Regum
chapter: "4"
verses:
  "1": 'Múlier autem quædam de uxóribus prophetárum clamábat ad Eliséum, dicens: Servus tuus vir meus mórtuus est, et tu nosti quia servus tuus fuit timens Dóminum: et ecce créditor venit ut tollat duos fílios meos ad serviéndum sibi.'
  "2": 'Cui dixit Eliséus: Quid vis ut fáciam tibi? dic mihi, quid habes in domo tua? At illa respóndit: Non hábeo ancílla tua quidquam in domo mea, nisi parum ólei, quo ungar.'
  "3": 'Cui ait: Vade, pete mútuo ab ómnibus vicínis tuis vasa vácua non pauca.'
  "4": 'Et ingrédere, et claude óstium tuum cum intrínsecus fúeris tu, et fílii tui: et mitte inde in ómnia vasa hæc, et cum plena fúerint, tolles.'
  "5": 'Ivit ítaque múlier, et clausit óstium super se, et super fílios suos: illi offerébant vasa, et illa infundébat.'
  "6": 'Cumque plena fuíssent vasa, dixit ad fílium suum: Affer mihi adhuc vas. Et ille respóndit: Non hábeo. Stetítque óleum.'
  "7": 'Venit autem illa, et indicávit hómini Dei. Et ille: Vade, inquit, vende óleum, et redde creditóri tuo: tu autem, et fílii tui vívite de réliquo.'
  "8": 'Facta est autem quædam dies, et transíbat Eliséus per Sunam: erat autem ibi múlier magna, quæ ténuit eum ut coméderet panem: cumque frequénter inde transíret, divertébat ad eam ut coméderet panem.'
  "9": 'Quæ dixit ad virum suum: Animadvérto quod vir Dei sanctus est iste, qui transit per nos frequénter.'
  "10": Faciámus ergo ei cœnáculum parvum, et ponámus ei in eo léctulum, et mensam, et sellam, et candelábrum, ut cum vénerit ad nos, máneat ibi.
  "11": Facta est ergo dies quædam, et véniens divértit in cœnáculum, et requiévit ibi.
  "12": 'Dixítque ad Giézi púerum suum: Voca Sunamítidem istam. Qui cum vocásset eam, et illa stetísset coram eo,'
  "13": 'dixit ad púerum suum: Lóquere ad eam: Ecce, sédule in ómnibus ministrásti nobis: quid vis ut fáciam tibi? numquid habes negótium, et vis ut loquar regi, sive príncipi milítiæ? Quæ respóndit: In médio pópuli mei hábito.'
  "14": 'Et ait: Quid ergo vult ut fáciam ei? Dixítque Giézi: Ne quæras: fílium enim non habet, et vir eius senex est.'
  "15": 'Præcépit ítaque ut vocáret eam: quæ cum vocáta fuísset, et stetísset ante óstium,'
  "16": 'dixit ad eam: In témpore isto, et in hac eádem hora, si vita comes fúerit, habébis in útero fílium. At illa respóndit: Noli quæso dómine mi, vir Dei, noli mentíri ancíllæ tuæ.'
  "17": Et concépit múlier, et péperit fílium in témpore, et in hora eádem, qua díxerat Eliséus.
  "18": 'Crevit autem puer: et cum esset quædam dies, et egréssus isset ad patrem suum, ad messóres,'
  "19": 'ait patri suo: Caput meum dóleo, caput meum dóleo. At ille dixit púero: Tolle, et duc eum ad matrem suam.'
  "20": Qui cum tulísset, et duxísset eum ad matrem suam, pósuit eum illa super génua sua usque ad merídiem, et mórtuus est.
  "21": 'Ascéndit autem, et collocávit eum super léctulum hóminis Dei, et clausit óstium: et egréssa,'
  "22": 'vocávit virum suum, et ait: Mitte mecum, óbsecro, unum de púeris, et ásinam, ut excúrram usque ad hóminem Dei, et revértar.'
  "23": 'Qui ait illi: Quam ob causam vadis ad eum? hódie non sunt caléndæ, neque sábbatum. Quæ respóndit: Vadam.'
  "24": 'Stravítque ásinam, et præcépit púero: Mina, et própera: ne mihi moram fácias in eúndo: et hoc age quod præcípio tibi.'
  "25": 'Profécta est ígitur, et venit ad virum Dei in montem Carméli: cumque vidísset eam vir Dei ecóntra, ait ad Giézi púerum suum: Ecce Sunamítis illa.'
  "26": 'Vade ergo in occúrsum eius, et dic ei: Recténe ágitur circa te, et circa virum tuum, et circa fílium tuum? Quæ respóndit: Recte.'
  "27": 'Cumque venísset ad virum Dei in montem, apprehéndit pedes eius: et accéssit Giézi ut amovéret eam. Et ait homo Dei: Dimítte illam: ánima enim eius in amaritúdine est, et Dóminus celávit a me, et non indicávit mihi.'
  "28": 'Quæ dixit illi: Numquid petívi fílium a dómino meo? numquid non dixi tibi: Ne illúdas me?'
  "29": 'Et ille ait ad Giézi: Accínge lumbos tuos, et tolle báculum meum in manu tua, et vade. Si occúrrerit tibi homo, non salútes eum: et si salutáverit te quíspiam, non respóndeas illi: et pones báculum meum super fáciem púeri.'
  "30": 'Porro mater púeri ait: Vivit Dóminus, et vivit ánima tua, non dimíttam te. Surréxit ergo, et secútus est eam.'
  "31": 'Giézi autem præcésserat ante eos, et posúerat báculum super fáciem púeri, et non erat vox, neque sensus: reversúsque est in occúrsum eius, et nuntiávit ei, dicens: Non surréxit puer.'
  "32": 'Ingréssus est ergo Eliséus domum, et ecce puer mórtuus iacébat in léctulo eius:'
  "33": 'ingressúsque clausit óstium super se, et super púerum: et orávit ad Dóminum.'
  "34": 'Et ascéndit, et incúbuit super púerum: posuítque os suum super os eius, et óculos suos super óculos eius, et manus suas super manus eius: et incurvávit se super eum, et calefácta est caro púeri.'
  "35": 'At ille revérsus, deambulávit in domo, semel huc atque illuc: et ascéndit, et incúbuit super eum: et oscitávit puer sépties, aperuítque óculos.'
  "36": 'At ille vocávit Giézi, et dixit ei: Voca Sunamítidem hanc. Quæ vocáta, ingréssa est ad eum. Qui ait: Tolle fílium tuum.'
  "37": 'Venit illa, et córruit ad pedes eius, et adorávit super terram: tulítque fílium suum, et egréssa est.'
  "38": 'Et Eliséus revérsus est in Gálgala. Erat autem fames in terra, et fílii prophetárum habitábant coram eo. Dixítque uni de púeris suis: Pone ollam grandem, et coque pulméntum fíliis prophetárum.'
  "39": 'Et egréssus est unus in agrum ut collígeret herbas agréstes: invenítque quasi vitem silvéstrem, et collégit ex ea colocýnthidas agri, et implévit pállium suum, et revérsus concídit in ollam pulménti: nesciébat enim quid esset.'
  "40": 'Infudérunt ergo sóciis, ut coméderent: cumque gustássent de coctióne, clamavérunt, dicéntes: Mors in olla vir Dei. Et non potuérunt comédere.'
  "41": 'At ille: Afférte, inquit, farínam. Cumque tulíssent, misit in ollam, et ait: Infúnde turbæ, ut cómedant. Et non fuit ámplius quidquam amaritúdinis in olla.'
  "42": 'Vir autem quidam venit de Baalsálisa déferens viro Dei panes primitiárum, vigínti panes hordeáceos, et fruméntum novum in pera sua. At ille dixit: Da pópulo, ut cómedat.'
  "43": 'Respondítque ei miníster eius: Quantum est hoc, ut appónam centum viris? Rursum ille ait: Da pópulo, ut cómedat: hæc enim dicit Dóminus: Cómedent, et supérerit.'
  "44": 'Pósuit ítaque coram eis: qui comedérunt, et supérfuit iuxta verbum Dómini.'
