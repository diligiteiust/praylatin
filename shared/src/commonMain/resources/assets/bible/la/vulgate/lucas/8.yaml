bible: vulgate
lang: la
language: Latina
book: Lucas
chapter: "8"
verses:
  "1": 'Et factum est deínceps, et ipse iter faciébat per civitátes, et castélla prǽdicans, et evangelízans regnum Dei: et duódecim cum illo,'
  "2": 'et mulíeres áliquæ, quæ erant curátæ a spirítibus malígnis, et infirmitátibus: María, quæ vocátur Magdaléne, de qua septem dæmónia exíerant,'
  "3": et Ioánna uxor Chusæ procuratóris Heródis, et Susánna, et áliæ multæ, quæ ministrábant ei de facultátibus suis.
  "4": 'Cum autem turba plúrima convenírent, et de civitátibus properárent ad eum, dixit per similitúdinem:'
  "5": Exiit qui séminat, semináre semen suum. Et dum séminat, áliud cécidit secus viam, et conculcátum est, et vólucres cæli comedérunt illud.
  "6": 'Et áliud cécidit supra petram: et natum áruit, quia non habébat humórem.'
  "7": Et áliud cécidit inter spinas, et simul exórtæ spinæ suffocavérunt illud.
  "8": 'Et áliud cécidit in terram bonam: et ortum fecit fructum céntuplum. Hæc dicens clamábat: Qui habet aures audiéndi, áudiat.'
  "9": Interrogábant autem eum discípuli eius, quæ esset hæc parábola.
  "10": 'Quibus ipse dixit: Vobis datum est nosse mystérium regni Dei, céteris autem in parábolis: ut vidéntes non vídeant, et audiéntes non intélligant.'
  "11": 'Est autem hæc parábola: Semen est verbum Dei.'
  "12": 'Qui autem secus viam, hi sunt qui áudiunt: deínde venit diábolus, et tollit verbum de corde eórum, ne credéntes salvi fiant.'
  "13": 'Nam qui supra petram, qui cum audíerint, cum gáudio suscípiunt verbum: et hi radíces non habent: qui ad tempus credunt, et in témpore tentatiónis recédunt.'
  "14": 'Quod autem in spinas cécidit: hi sunt, qui audiérunt, et a sollicitudínibus, et divítiis, et voluptátibus vitæ eúntes, suffocántur, et non réferunt fructum.'
  "15": 'Quod autem in bonam terram: hi sunt, qui in corde bono et óptimo audiéntes verbum rétinent, et fructum áfferunt in patiéntia.'
  "16": 'Nemo autem lucérnam accéndens, óperit eam vase, aut subtus lectum ponit: sed supra candelábrum ponit, ut intrántes vídeant lumen.'
  "17": 'Non est enim occúltum, quod non manifestétur: nec abscónditum, quod non cognoscátur, et in palam véniat.'
  "18": 'Vidéte ergo quómodo audiátis. Qui enim habet, dábitur illi: et quicúmque non habet, étiam quod putat se habére, auferétur ab illo.'
  "19": Venérunt autem ad illum mater, et fratres eius, et non póterant adíre eum præ turba.
  "20": 'Et nuntiátum est illi: Mater tua, et fratres tui stant foris, voléntes te vidére.'
  "21": 'Qui respóndens, dixit ad eos: Mater mea, et fratres mei hi sunt, qui verbum Dei áudiunt, et fáciunt.'
  "22": 'Factum est autem in una diérum: et ipse ascéndit in navículam, et discípuli eius, et ait ad illos: Transfretémus trans stagnum. Et ascendérunt.'
  "23": Et navigántibus illis, obdormívit, et descéndit procélla venti in stagnum, et complebántur, et periclitabántur.
  "24": 'Accedéntes autem suscitavérunt eum, dicéntes: Præcéptor, perímus. At ille surgens, increpávit ventum, et tempestátem aquæ, et cessávit: et facta est tranquíllitas.'
  "25": 'Dixit autem illis: Ubi est fides vestra? Qui timéntes, miráti sunt ad ínvicem, dicéntes: Quis putas hic est, quia et ventis, et mari ímperat, et obédiunt ei?'
  "26": Et navigavérunt ad regiónem Gerasenórum, quæ est contra Galilǽam.
  "27": Et cum egréssus esset ad terram, occúrrit illi vir quidam, qui habébat dæmónium iam tempóribus multis, et vestiménto non induebátur, neque in domo manébat, sed in monuméntis.
  "28": 'Is, ut vidit Iesum, prócidit ante illum: et exclámans voce magna, dixit: Quid mihi et tibi est, Iesu Fili Dei Altíssimi? óbsecro te, ne me tórqueas.'
  "29": Præcipiébat enim spirítui immúndo ut exíret ab hómine. Multis enim tempóribus arripiébat illum, et vinciebátur caténis, et compédibus custodítus. Et ruptis vínculis agebátur a dæmónio in desérta.
  "30": 'Interrogávit autem illum Iesus, dicens: Quod tibi nomen est? At ille dixit: Légio: quia intráverant dæmónia multa in eum.'
  "31": Et rogábant illum ne imperáret illis ut in abýssum irent.
  "32": 'Erat autem ibi grex porcórum multórum pascéntium in monte: et rogábant eum, ut permítteret eis in illos íngredi. Et permísit illis.'
  "33": 'Exiérunt ergo dæmónia ab hómine, et intravérunt in porcos: et ímpetu ábiit grex per præceps in stagnum, et suffocátus est.'
  "34": Quod ut vidérunt factum qui pascébant, fugérunt, et nuntiavérunt in civitátem, et in villas.
  "35": Exiérunt autem vidére quod factum est, et venérunt ad Iesum, et invenérunt hóminem sedéntem, a quo dæmónia exíerant, vestítum ac sana mente, ad pedes eius, et timuérunt.
  "36": 'Nuntiavérunt autem illis, et qui víderant, quómodo sanus factus esset a legióne:'
  "37": 'et rogavérunt illum omnis multitúdo regiónis Gerasenórum ut discéderet ab ipsis: quia magno timóre tenebántur. Ipse autem ascéndens navim, revérsus est.'
  "38": 'Et rogábat illum vir, a quo dæmónia exíerant, ut cum eo esset. Dimísit autem eum Iesus, dicens:'
  "39": Redi in domum tuam, et narra quanta tibi fecit Deus. Et ábiit per univérsam civitátem, prǽdicans quanta illi fecísset Iesus.
  "40": 'Factum est autem cum rediísset Iesus, excépit illum turba: erant enim omnes exspectántes eum.'
  "41": 'Et ecce venit vir, cui nomen Iáirus, et ipse princeps synagógæ erat: et cécidit ad pedes Iesu, rogans eum ut intráret in domum eius,'
  "42": quia única fília erat ei fere annórum duódecim, et hæc moriebátur. Et cóntigit, dum iret, a turba comprimebátur.
  "43": 'Et múlier quædam erat in fluxu sánguinis ab annis duódecim, quæ in médicos erogáverat omnem substántiam suam, nec ab ullo pótuit curári:'
  "44": 'accéssit retro, et tétigit fímbriam vestiménti eius: et conféstim stetit fluxus sánguinis eius.'
  "45": 'Et ait Iesus: Quis est, qui me tétigit? Negántibus autem ómnibus, dixit Petrus, et qui cum illo erant: Præcéptor, turbæ te cómprimunt, et afflígunt, et dicis: Quis me tétigit?'
  "46": 'Et dicit Iesus: Tétigit me áliquis: nam ego novi virtútem de me exiísse.'
  "47": 'Videns autem múlier, quia non látuit, tremens venit, et prócidit ante pedes eius: et ob quam causam tetígerit eum, indicávit coram omni pópulo: et quemádmodum conféstim sanáta sit.'
  "48": 'At ipse dixit ei: Fília, fides tua salvam te fecit: vade in pace.'
  "49": 'Adhuc illo loquénte, venit quidam ad príncipem synagógæ, dicens ei: Quia mórtua est fília tua, noli vexáre illum.'
  "50": 'Iesus autem, audíto hoc verbo, respóndit patri puéllæ: Noli timére, crede tantum, et salva erit.'
  "51": Et cum venísset domum, non permísit intráre secum quemquam, nisi Petrum, et Iacóbum, et Ioánnem, et patrem, et matrem puéllæ.
  "52": 'Flebant autem omnes, et plangébant illam. At ille dixit: Nolíte flere: non est mórtua puélla, sed dormit.'
  "53": Et deridébant eum, sciéntes quod mórtua esset.
  "54": 'Ipse autem tenens manum eius clamávit, dicens: Puélla, surge.'
  "55": Et revérsus est spíritus eius, et surréxit contínuo. Et iussit illi dari manducáre.
  "56": Et stupuérunt paréntes eius, quibus præcépit ne alícui dícerent quod factum erat.
