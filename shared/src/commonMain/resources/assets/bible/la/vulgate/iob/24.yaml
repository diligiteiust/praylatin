bible: vulgate
lang: la
language: Latina
book: Iob
chapter: "24"
verses:
  "1": 'Ab Omnipoténte non sunt abscóndita témpora: qui autem novérunt eum, ignórant dies illíus.'
  "2": Alii términos transtulérunt, diripuérunt greges, et pavérunt eos.
  "3": Asinum pupillórum abegérunt, et abstulérunt pro pígnore bovem víduæ.
  "4": Subvertérunt páuperum viam, et oppressérunt páriter mansuétos terræ.
  "5": 'Alii quasi ónagri in desérto egrediúntur ad opus suum: vigilántes ad prædam, prǽparant panem líberis.'
  "6": 'Agrum non suum demétunt: et víneam eius, quem vi opprésserint, vindémiant.'
  "7": 'Nudos dimíttunt hómines, induménta tolléntes, quibus non est operiméntum in frígore:'
  "8": 'quos imbres móntium rigant: et non habéntes velámen, amplexántur lápides.'
  "9": Vim fecérunt deprædántes pupíllos, et vulgum páuperem spoliavérunt.
  "10": Nudis et incedéntibus absque vestítu, et esuriéntibus tulérunt spicas.
  "11": Inter acérvos eórum meridiáti sunt, qui calcátis torculáribus sítiunt.
  "12": De civitátibus fecérunt viros gémere, et ánima vulneratórum clamávit, et Deus inúltum abíre non pátitur.
  "13": Ipsi fuérunt rebélles lúmini, nesciérunt vias eius, nec revérsi sunt per sémitas eius.
  "14": 'Mane primo consúrgit homicída, intérficit egénum et páuperem: per noctem vero erit quasi fur.'
  "15": 'Oculus adúlteri obsérvat calíginem, dicens: Non me vidébit óculus: et opériet vultum suum.'
  "16": Pérfodit in ténebris domos, sicut in die condíxerant sibi, et ignoravérunt lucem.
  "17": 'Si súbito apparúerit auróra, arbitrántur umbram mortis: et sic in ténebris quasi in luce ámbulant.'
  "18": 'Levis est super fáciem aquæ: maledícta sit pars eius in terra, nec ámbulet per viam vineárum.'
  "19": Ad nímium calórem tránseat ab aquis nívium, et usque ad ínferos peccátum illíus.
  "20": 'Obliviscátur eius misericórdia: dulcédo illíus vermes: non sit in recordatióne, sed conterátur quasi lignum infructuósum.'
  "21": Pavit enim stérilem, quæ non parit, et víduæ bene non fecit.
  "22": 'Detráxit fortes in fortitúdine sua: et cum stéterit, non credet vitæ suæ.'
  "23": 'Dedit ei Deus locum pœniténtiæ, et ille abútitur eo in supérbiam: óculi autem eius sunt in viis illíus.'
  "24": Eleváti sunt ad módicum, et non subsístent, et humiliabúntur sicut ómnia, et auferéntur, et sicut summitátes spicárum conteréntur.
  "25": Quod si non est ita, quis me potest argúere esse mentítum, et pónere ante Deum verba mea?
