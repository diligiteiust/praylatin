bible: vulgate
lang: la
language: Latina
book: Tobiae
chapter: "7"
verses:
  "1": Ingréssi sunt autem ad Raguélem, et suscépit eos Ráguel cum gáudio.
  "2": 'Intuénsque Tobíam Ráguel, dixit Annæ uxóri suæ: Quam símilis est iúvenis iste consobríno meo!'
  "3": 'Et cum hæc dixísset, ait: Unde estis iúvenes fratres nostri? At illi dixérunt: Ex tribu Néphthali sumus, ex captivitáte Nínive.'
  "4": 'Dixítque illis Ráguel: Nostis Tobíam fratrem meum? Qui dixérunt: Nóvimus.'
  "5": 'Cumque multa bona loquerétur de eo, dixit ángelus ad Raguélem: Tobías, de quo intérrogas, pater istíus est.'
  "6": Et misit se Ráguel, et cum lácrymis osculátus est eum, et plorans supra collum eius,
  "7": 'dixit: Benedíctio sit tibi fili mi, quia boni et óptimi viri fílius es.'
  "8": Et Anna uxor eius, et Sara ipsórum fília, lacrymátæ sunt.
  "9": Postquam autem locúti sunt, præcépit Ráguel occídi aríetem, et parári convívium. Cumque hortarétur eos discúmbere ad prándium,
  "10": 'Tobías dixit: Hic ego hódie non manducábo neque bibam, nisi prius petitiónem meam confírmes, et promíttas mihi dare Saram fíliam tuam.'
  "11": 'Quo audíto verbo Ráguel expávit, sciens quid evénerit illis septem viris, qui ingréssi sunt ad eam: et timére cœpit ne forte et huic simíliter contíngeret. Et cum nutáret, et non daret peténti ullum respónsum,'
  "12": 'dixit ei ángelus: Noli timére dare eam isti, quóniam huic timénti Deum debétur coniux fília tua: proptérea álius non pótuit habére illam.'
  "13": 'Tunc dixit Ráguel: Non dúbito quod Deus preces et lácrymas meas in conspéctu suo admíserit.'
  "14": 'Et credo quóniam ídeo fecit vos veníre ad me, ut ista coniungerétur cognatióni suæ secúndum legem Móysi: et nunc noli dúbium gérere quod tibi eam tradam.'
  "15": 'Et apprehéndens déxteram fíliæ suæ, déxteræ Tobíæ trádidit, dicens: Deus Abraham, et Deus Isaac, et Deus Iacob vobíscum sit, et ipse coniúngat vos, impleátque benedictiónem suam in vobis.'
  "16": Et accépta charta, fecérunt conscriptiónem coniúgii.
  "17": Et post hæc epuláti sunt, benedicéntes Deum.
  "18": Vocavítque Ráguel ad se Annam uxórem suam, et præcépit ei ut præparáret álterum cubículum.
  "19": Et introdúxit illuc Saram fíliam suam, et lacrymáta est.
  "20": 'Dixítque ei: Forti ánimo esto fília mea: Dóminus cæli det tibi gáudium pro tǽdio quod perpéssa es.'
