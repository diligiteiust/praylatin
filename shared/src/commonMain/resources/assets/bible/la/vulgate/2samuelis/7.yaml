bible: vulgate
lang: la
language: Latina
book: II Samuelis
chapter: "7"
verses:
  "1": Factum est autem cum sedísset rex in domo sua, et Dóminus dedísset ei réquiem úndique ab univérsis inimícis suis,
  "2": 'dixit ad Nathan prophétam: Vidésne quod ego hábitem in domo cédrina, et arca Dei pósita sit in médio péllium?'
  "3": 'Dixítque Nathan ad regem: Omne quod est in corde tuo, vade, fac: quia Dóminus tecum est.'
  "4": 'Factum est autem in illa nocte: et ecce sermo Dómini ad Nathan, dicens:'
  "5": 'Vade, et lóquere ad servum meum David: Hæc dicit Dóminus: Numquid tu ædificábis mihi domum ad habitándum?'
  "6": 'Neque enim habitávi in domo ex die illa, qua edúxi fílios Israel de terra Ægýpti, usque in diem hanc: sed ambulábam in tabernáculo, et in tentório.'
  "7": 'Per cuncta loca, quæ transívi cum ómnibus fíliis Israel, numquid loquens locútus sum ad unam de tríbubus Israel, cui præcépi ut pásceret pópulum meum Israel, dicens: Quare non ædificástis mihi domum cédrinam?'
  "8": 'Et nunc hæc dices servo meo David: Hæc dicit Dóminus exercítuum: Ego tuli te de páscuis sequéntem greges, ut esses dux super pópulum meum Israel:'
  "9": 'et fui tecum in ómnibus ubicúmque ambulásti, et interféci univérsos inimícos tuos a fácie tua: fecíque tibi nomen grande, iuxta nomen magnórum, qui sunt in terra.'
  "10": 'Et ponam locum pópulo meo Israel, et plantábo eum, et habitábit sub eo, et non turbábitur ámplius: nec addent fílii iniquitátis ut afflígant eum sicut prius,'
  "11": 'ex die qua constítui iúdices super pópulum meum Israel: et réquiem dabo tibi ab ómnibus inimícis tuis: prædicítque tibi Dóminus quod domum fáciat tibi Dóminus.'
  "12": Cumque compléti fúerint dies tui, et dormíeris cum pátribus tuis, suscitábo semen tuum post te, quod egrediétur de útero tuo, et firmábo regnum eius.
  "13": Ipse ædificábit domum nómini meo, et stabíliam thronum regni eius usque in sempitérnum.
  "14": 'Ego ero ei in patrem, et ipse erit mihi in fílium: qui si iníque áliquid gésserit, árguam eum in virga virórum, et in plagis filiórum hóminum.'
  "15": Misericórdiam autem meam non áuferam ab eo, sicut ábstuli a Saul, quem amóvi a fácie mea.
  "16": Et fidélis erit domus tua, et regnum tuum usque in ætérnum ante fáciem tuam, et thronus tuus erit firmus iúgiter.
  "17": Secúndum ómnia verba hæc, et iuxta univérsam visiónem istam, sic locútus est Nathan ad David.
  "18": 'Ingréssus est autem rex David, et sedit coram Dómino, et dixit: Quis ego sum Dómine Deus, et quæ domus mea, quia adduxísti me hucúsque?'
  "19": 'Sed et hoc parum visum est in conspéctu tuo Dómine Deus, nisi loqueréris étiam de domo servi tui in longínquum: ista est enim lex Adam, Dómine Deus.'
  "20": Quid ergo áddere póterit adhuc David, ut loquátur ad te? tu enim scis servum tuum Dómine Deus.
  "21": Propter verbum tuum, et secúndum cor tuum, fecísti ómnia magnália hæc, ita ut notum fáceres servo tuo.
  "22": Idcírco magnificátus es Dómine Deus, quia non est símilis tui, neque est Deus extra te, in ómnibus quæ audívimus áuribus nostris.
  "23": Quæ est autem ut pópulus tuus Israel gens in terra, propter quam ivit Deus ut redímeret eam sibi in pópulum, et póneret sibi nomen, facerétque eis magnália, et horribília super terram a fácie pópuli tui, quem redemísti tibi ex Ægýpto, gentem, et deum eius?
  "24": 'Firmásti enim tibi pópulum tuum Israel in pópulum sempitérnum: et tu Dómine Deus factus es eis in Deum.'
  "25": 'Nunc ergo Dómine Deus, verbum, quod locútus es super servum tuum, et super domum eius, súscita in sempitérnum: et fac sicut locútus es,'
  "26": 'ut magnificétur nomen tuum usque in sempitérnum, atque dicátur: Dóminus exercítuum, Deus super Israel. Et domus servi tui David erit stabilíta coram Dómino,'
  "27": 'quia tu Dómine exercítuum Deus Israel, revelásti aurem servi tui, dicens: Domum ædificábo tibi: proptérea invénit servus tuus cor suum ut oráret te oratióne hac.'
  "28": 'Nunc ergo Dómine Deus, tu es Deus, et verba tua erunt vera: locútus es enim ad servum tuum bona hæc.'
  "29": 'Incipe ergo, et bénedic dómui servi tui, ut sit in sempitérnum coram te: quia tu Dómine Deus locútus es, et benedictióne tua benedicétur domus servi tui in sempitérnum.'
