bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "99"
verses:
  "1": Psalmus in confessióne.
  "2": 'Iubiláte Deo omnis terra: servíte Dómino in lætítia. Introíte in conspéctu eius, in exsultatióne.'
  "3": 'Scitóte quóniam Dóminus ipse est Deus: ipse fecit nos, et non ipsi nos: pópulus eius, et oves páscuæ eius:'
  "4": 'introíte portas eius in confessióne, átria eius in hymnis: confitémini illi. Laudáte nomen eius:'
  "5": quóniam suávis est Dóminus, in ætérnum misericórdia eius, et usque in generatiónem et generatiónem véritas eius.
