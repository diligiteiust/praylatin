bible: vulgate
lang: la
language: Latina
book: Lucas
chapter: "19"
verses:
  "1": Et ingréssus perambulábat Iéricho.
  "2": 'Et ecce vir nómine Zachǽus: et hic princeps erat publicanórum, et ipse dives:'
  "3": 'et quærébat vidére Iesum, quis esset: et non póterat præ turba, quia statúra pusíllus erat.'
  "4": 'Et præcúrrens ascéndit in árborem sycómorum ut vidéret eum: quia inde erat transitúrus.'
  "5": 'Et cum venísset ad locum, suspíciens Iesus vidit illum, et dixit ad eum: Zachǽe, festínans descénde: quia hódie in domo tua opórtet me manére.'
  "6": Et festínans descéndit, et excépit illum gaudens.
  "7": Et cum vidérent omnes, murmurábant, dicéntes quod ad hóminem peccatórem divertísset.
  "8": 'Stans autem Zachǽus, dixit ad Dóminum: Ecce dimídium bonórum meórum, Dómine, do paupéribus: et si quid áliquem defraudávi, reddo quádruplum.'
  "9": 'Ait Iesus ad eum: Quia hódie salus dómui huic facta est: eo quod et ipse fílius sit Abrahæ.'
  "10": Venit enim Fílius hóminis quǽrere, et salvum fácere quod períerat.
  "11": 'Hæc illis audiéntibus adíciens, dixit parábolam, eo quod esset prope Ierúsalem: et quia existimárent quod conféstim regnum Dei manifestarétur.'
  "12": 'Dixit ergo: Homo quidam nóbilis ábiit in regiónem longínquam accípere sibi regnum, et revérti.'
  "13": 'Vocátis autem decem servis suis, dedit eis decem mnas, et ait ad illos: Negotiámini dum vénio.'
  "14": 'Cives autem eius óderant eum: et misérunt legatiónem post illum, dicéntes: Nólumus hunc regnáre super nos.'
  "15": 'Et factum est ut redíret accépto regno: et iussit vocári servos, quibus dedit pecúniam, ut sciret quantum quisque negotiátus esset.'
  "16": 'Venit autem primus dicens: Dómine, mna tua decem mnas acquisívit.'
  "17": 'Et ait illi: Euge bone serve, quia in módico fuísti fidélis, eris potestátem habens super decem civitátes.'
  "18": 'Et alter venit, dicens: Dómine, mna tua fecit quinque mnas.'
  "19": 'Et huic ait: Et tu esto super quinque civitátes.'
  "20": 'Et alter venit, dicens: Dómine, ecce mna tua, quam hábui repósitam in sudário:'
  "21": 'tímui enim te, quia homo austérus es: tollis quod non posuísti, et metis quod non seminásti.'
  "22": 'Dicit ei: De ore tuo te iúdico, serve nequam: sciébas quod ego homo austérus sum, tollens quod non pósui, et metens quod non seminávi:'
  "23": et quare non dedísti pecúniam meam ad mensam, ut ego véniens cum usúris útique exegíssem illam?
  "24": 'Et astántibus dixit: Auférte ab illo mnam, et date illi, qui decem mnas habet.'
  "25": 'Et dixérunt ei: Dómine, habet decem mnas.'
  "26": 'Dico autem vobis, quia omni habénti dábitur, et abundábit: ab eo autem, qui non habet, et quod habet auferétur ab eo.'
  "27": 'Verúmtamen inimícos meos illos, qui noluérunt me regnáre super se, addúcite huc: et interfícite ante me.'
  "28": Et his dictis, præcedébat ascéndens Ierosólymam.
  "29": Et factum est, cum appropinquásset ad Béthphage, et Bethániam, ad montem, qui vocátur Olivéti, misit duos discípulos suos,
  "30": 'dicens: Ite in castéllum, quod contra est: in quod introeúntes, inveniétis pullum ásinæ alligátum, cui nemo unquam hóminum sedit: sólvite illum, et addúcite.'
  "31": 'Et si quis vos interrogáverit: Quare sólvitis? sic dicétis ei: Quia Dóminus óperam eius desíderat.'
  "32": 'Abiérunt autem qui missi erant: et invenérunt, sicut dixit illis, stantem pullum.'
  "33": 'Solvéntibus autem illis pullum, dixérunt dómini eius ad illos: Quid sólvitis pullum?'
  "34": 'At illi dixérunt: Quia Dóminus eum necessárium habet.'
  "35": Et duxérunt illum ad Iesum. Et iactántes vestiménta sua supra pullum, imposuérunt Iesum.
  "36": Eúnte autem illo, substernébant vestiménta sua in via.
  "37": Et cum appropinquáret iam ad descénsum montis Olivéti, cœpérunt omnes turbæ discipulórum gaudéntes laudáre Deum voce magna super ómnibus, quas víderant, virtútibus,
  "38": 'dicéntes: Benedíctus, qui venit rex in nómine Dómini: pax in cælo, et glória in excélsis.'
  "39": 'Et quidam Pharisæórum de turbis dixérunt ad illum: Magíster, íncrepa discípulos tuos.'
  "40": 'Quibus ipse ait: Dico vobis, quia si hi tacúerint, lápides clamábunt.'
  "41": 'Et ut appropinquávit, videns civitátem flevit super illam, dicens:'
  "42": 'Quia si cognovísses et tu, et quidem in hac die tua, quæ ad pacem tibi: nunc autem abscóndita sunt ab óculis tuis.'
  "43": 'Quia vénient dies in te: et circúmdabunt te inimíci tui vallo, et circúmdabunt te: et coangustábunt te úndique:'
  "44": 'et ad terram prostérnent te, et fílios tuos, qui in te sunt, et non relínquent in te lápidem super lápidem: eo quod non cognóveris tempus visitatiónis tuæ.'
  "45": Et ingréssus in templum, cœpit eícere vendéntes in illo, et eméntes,
  "46": 'dicens illis: Scriptum est: Quia domus mea domus oratiónis est: vos autem fecístis illam spelúncam latrónum.'
  "47": 'Et erat docens quotídie in templo. Príncipes autem sacerdótum, et scribæ, et príncipes plebis quærébant illum pérdere:'
  "48": et non inveniébant quid fácerent illi. Omnis enim pópulus suspénsus erat, áudiens illum.
