bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "41"
verses:
  "1": In finem, Intelléctus fíliis Core.
  "2": 'Quemádmodum desíderat cervus ad fontes aquárum: ita desíderat ánima mea ad te Deus.'
  "3": 'Sitívit ánima mea ad Deum fortem vivum: quando véniam, et apparébo ante fáciem Dei?'
  "4": 'Fuérunt mihi lácrymæ meæ panes die ac nocte: dum dícitur mihi quotídie: Ubi est Deus tuus?'
  "5": 'Hæc recordátus sum, et effúdi in me ánimam meam: quóniam transíbo in locum tabernáculi admirábilis, usque ad domum Dei: in voce exsultatiónis et confessiónis, sonus epulántis.'
  "6": 'Quare tristis es ánima mea? et quare contúrbas me? Spera in Deo, quóniam adhuc confitébor illi: salutáre vultus mei,'
  "7": 'et Deus meus. Ad meípsum ánima mea conturbáta est: proptérea memor ero tui de terra Iordánis, et Hermóniim a monte módico.'
  "8": Abýssus abýssum ínvocat, in voce cataractárum tuárum. Omnia excélsa tua, et fluctus tui super me transiérunt.
  "9": 'In die mandávit Dóminus misericórdiam suam: et nocte cánticum eius. Apud me orátio Deo vitæ meæ,'
  "10": 'dicam Deo: Suscéptor meus es, quare oblítus es mei? et quare contristátus incédo, dum afflígit me inimícus?'
  "11": 'Dum confringúntur ossa mea, exprobravérunt mihi qui tríbulant me inimíci mei: dum dicunt mihi per síngulos dies: Ubi est Deus tuus?'
  "12": 'Quare tristis es ánima mea? et quare contúrbas me? Spera in Deo, quóniam adhuc confitébor illi: salutáre vultus mei, et Deus meus.'
