bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "44"
verses:
  "1": In finem, pro iis, qui commutabúntur, fíliis Core, ad intelléctum, Cánticum pro dilécto.
  "2": 'Eructávit cor meum verbum bonum: dico ego ópera mea regi. Lingua mea cálamus scribæ, velóciter scribéntis.'
  "3": 'Speciósus forma præ fíliis hóminum, diffúsa est grátia in lábiis tuis: proptérea benedíxit te Deus in ætérnum.'
  "4": Accíngere gládio tuo super femur tuum, potentíssime.
  "5": 'Spécie tua et pulchritúdine tua inténde, próspere procéde, et regna, propter veritátem, et mansuetúdinem, et iustítiam: et dedúcet te mirabíliter déxtera tua.'
  "6": 'Sagíttæ tuæ acútæ: pópuli sub te cadent, in corda inimicórum regis.'
  "7": 'Sedes tua Deus in sǽculum sǽculi: virga directiónis virga regni tui.'
  "8": 'Dilexísti iustítiam, et odísti iniquitátem: proptérea unxit te Deus Deus tuus óleo lætítiæ, præ consórtibus tuis.'
  "9": 'Myrrha, et gutta, et cásia a vestiméntis tuis, a dómibus ebúrneis: ex quibus delectavérunt te'
  "10": 'fíliæ regum in honóre tuo. Astitit regína a dextris tuis in vestítu deauráto: circúmdata varietáte.'
  "11": 'Audi fília, et vide, et inclína aurem tuam: et oblivíscere pópulum tuum, et domum patris tui.'
  "12": 'Et concupíscet rex decórem tuum: quóniam ipse est Dóminus Deus tuus, et adorábunt eum.'
  "13": 'Et fíliæ Tyri in munéribus vultum tuum deprecabúntur: omnes dívites plebis.'
  "14": Omnis glória eius fíliæ regis ab intus, in fímbriis áureis
  "15": 'circumamícta varietátibus. Adducéntur regi vírgines post eam: próximæ eius afferéntur tibi.'
  "16": 'Afferéntur in lætítia et exsultatióne: adducéntur in templum regis.'
  "17": 'Pro pátribus tuis nati sunt tibi fílii: constítues eos príncipes super omnem terram.'
  "18": 'Mémores erunt nóminis tui in omni generatióne et generatiónem. Proptérea pópuli confitebúntur tibi in ætérnum: et in sǽculum sǽculi.'
