bible: vulgate
lang: la
language: Latina
book: Iob
chapter: "3"
verses:
  "1": Post hæc apéruit Iob os suum, et maledíxit diéi suo,
  "2": 'et locútus est:'
  "3": 'Péreat dies in qua natus sum, et nox in qua dictum est: Concéptus est homo.'
  "4": 'Dies ille vertátur in ténebras: non requírat eum Deus désuper, et non illustrétur lúmine.'
  "5": 'Obscúrent eum ténebræ, et umbra mortis: óccupet eum calígo, et involvátur amaritúdine.'
  "6": 'Noctem illam tenebrósus turbo possídeat: non computétur in diébus anni, nec numerétur in ménsibus.'
  "7": Sit nox illa solitária, nec laude digna.
  "8": Maledícant ei qui maledícunt diéi, qui paráti sunt suscitáre Levíathan.
  "9": 'Obtenebréntur stellæ calígine eius: exspéctet lucem, et non vídeat, nec ortum surgéntis auróræ.'
  "10": Quia non conclúsit óstia ventris, qui portávit me, nec ábstulit mala ab óculis meis.
  "11": Quare non in vulva mórtuus sum, egréssus ex útero non statim périi?
  "12": Quare excéptus génibus? cur lactátus ubéribus?
  "13": 'Nunc enim dórmiens silérem, et somno meo requiéscerem:'
  "14": 'cum régibus et consúlibus terræ, qui ædíficant sibi solitúdines:'
  "15": 'aut cum princípibus, qui póssident aurum, et replent domos suas argénto:'
  "16": aut sicut abortívum abscónditum non subsísterem, vel qui concépti non vidérunt lucem.
  "17": Ibi ímpii cessavérunt a tumúltu, et ibi requievérunt fessi róbore.
  "18": Et quondam vincti páriter sine moléstia, non audiérunt vocem exactóris.
  "19": Parvus et magnus ibi sunt, et servus liber a dómino suo.
  "20": Quare mísero data est lux, et vita his, qui in amaritúdine ánimæ sunt?
  "21": 'Qui exspéctant mortem, et non venit, quasi effodiéntes thesáurum:'
  "22": gaudéntque veheménter cum invénerint sepúlcrum.
  "23": Viro cuius abscóndita est via, et circúmdedit eum Deus ténebris?
  "24": 'Antequam cómedam, suspíro: et tamquam inundántes aquæ, sic rugítus meus:'
  "25": 'quia timor, quem timébam, evénit mihi: et quod verébar áccidit.'
  "26": Nonne dissimulávi? nonne sílui? nonne quiévi? et venit super me indignátio.
