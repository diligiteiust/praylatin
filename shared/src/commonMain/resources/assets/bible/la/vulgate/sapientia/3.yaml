bible: vulgate
lang: la
language: Latina
book: Sapientia
chapter: "3"
verses:
  "1": Iustórum autem ánimæ in manu Dei sunt, et non tanget illos torméntum mortis.
  "2": Visi sunt óculis insipiéntium mori, et æstimáta est afflíctio éxitus illórum,
  "3": 'et quod a nobis est iter extermínium: illi autem sunt in pace.'
  "4": Etsi coram homínibus torménta passi sunt, spes illórum immortalitáte plena est.
  "5": 'In paucis vexáti, in multis bene disponéntur: quóniam Deus tentávit eos, et invénit illos dignos se.'
  "6": Tamquam aurum in fornáce probávit illos, et quasi holocáusti hóstiam accépit illos, et in témpore erit respéctus illórum.
  "7": Fulgébunt iusti, et tamquam scintíllæ in arundinéto discúrrent.
  "8": Iudicábunt natiónes, et dominabúntur pópulis, et regnábit Dóminus illórum in perpétuum.
  "9": 'Qui confídunt in illo intélligent veritátem, et fidéles in dilectióne acquiéscent illi: quóniam donum et pax est eléctis eius.'
  "10": 'Impii autem secúndum quæ cogitavérunt, correptiónem habébunt: qui neglexérunt iustum, et a Dómino recessérunt.'
  "11": 'Sapiéntiam enim et disciplínam qui ábicit infélix est: et vácua est spes illórum, et labóres sine fructu, et inutília ópera eórum.'
  "12": Mulíeres eórum insensátæ sunt, et nequíssimi fílii eórum.
  "13": 'Maledícta creatúra eórum, quóniam felix est stérilis: et incoinquináta, quæ nescívit thorum in delícto, habébit fructum in respectióne animárum sanctárum:'
  "14": 'et spado, qui non operátus est per manus suas iniquitátem, nec cogitávit advérsus Deum nequíssima: dábitur enim illi fídei donum eléctum, et sors in templo Dei acceptíssima.'
  "15": Bonórum enim labórum gloriósus est fructus, et quæ non cóncidat radix sapiéntiæ.
  "16": Fílii autem adulterórum in inconsummatióne erunt, et ab iníquo thoro semen exterminábitur.
  "17": Et si quidem longæ vitæ erunt, in níhilum computabúntur, et sine honóre erit novíssima senéctus illórum.
  "18": Et si celérius defúncti fúerint, non habébunt spem, nec in die agnitiónis allocutiónem.
  "19": Natiónis enim iníquæ diræ sunt consummatiónes.
