bible: vulgate
lang: la
language: Latina
book: Ecclesiasticus
chapter: "31"
verses:
  "1": Vigília honestátis tabefáciet carnes, et cogitátus illíus áuferet somnum.
  "2": Cogitátus præsciéntiæ avértit sensum, et infírmitas gravis sóbriam facit ánimam.
  "3": Laborávit dives in congregatióne substántiæ, et in réquie sua replébitur bonis suis.
  "4": Laborávit pauper in diminutióne victus, et in fine inops fit.
  "5": 'Qui aurum díligit, non iustificábitur: et qui inséquitur consumptiónem, replébitur ex ea.'
  "6": Multi dati sunt in auri casus, et facta est in spécie ipsíus perdítio illórum.
  "7": 'Lignum offensiónis est aurum sacrificántium: væ illis, qui sectántur illud, et omnis imprúdens depériet in illo.'
  "8": 'Beátus dives, qui invéntus est sine mácula: et qui post aurum non ábiit, nec sperávit in pecúnia et thesáuris.'
  "9": Quis est hic, et laudábimus eum? fecit enim mirabília in vita sua.
  "10": 'Qui probátus est in illo, et perféctus est, erit illi glória ætérna: qui pótuit tránsgredi, et non est transgréssus: fácere mala, et non fecit:'
  "11": ideo stabilíta sunt bona illíus in Dómino, et eleemósynas illíus enarrábit omnis ecclésia sanctórum.
  "12": Supra mensam magnam sedísti? non apérias super illam faucem tuam prior.
  "13": 'Non dicas sic: Multa sunt, quæ super illam sunt.'
  "14": Meménto quóniam malus est óculus nequam.
  "15": Néquius óculo quid creátum est? ídeo ab omni fácie sua lacrymábitur, cum víderit.
  "16": Ne exténdas manum tuam prior, et invídia contaminátus erubéscas.
  "17": Ne comprimáris in convívio.
  "18": 'Intéllige quæ sunt próximi tui ex teípso:'
  "19": 'útere quasi homo frugi his, quæ tibi apponúntur: ne, cum mandúcas multum, ódio habeáris.'
  "20": 'Cessa prior causa disciplínæ: et noli nímius esse, ne forte offéndas.'
  "21": Et si in médio multórum sedísti, prior illis ne exténdas manum tuam, nec prior poscas bíbere.
  "22": Quam suffíciens est hómini erudíto vinum exíguum, et in dormiéndo non laborábis ab illo, et non sénties dolórem.
  "23": 'Vigília, chólera et tortúra viro infruníto:'
  "24": 'somnus sanitátis in hómine parco: dórmiet usque mane, et ánima illíus cum ipso delectábitur.'
  "25": 'Et si coáctus fúeris in edéndo multum, surge e médio, évome: et refrigerábit te, et non addúces córpori tuo infirmitátem.'
  "26": 'Audi me fili, et ne spernas me: et in novíssimo invénies verba mea.'
  "27": In ómnibus opéribus tuis esto velox, et omnis infírmitas non occúrret tibi.
  "28": Spléndidum in pánibus benedícent lábia multórum, et testimónium veritátis illíus fidéle.
  "29": Nequíssimo in pane murmurábit cívitas, et testimónium nequítiæ illíus verum est.
  "30": 'Diligéntes in vino noli provocáre: multos enim exterminávit vinum.'
  "31": 'Ignis probat ferrum durum: sic vinum corda superbórum árguet in ebrietáte potátum.'
  "32": 'Æqua vita homínibus vinum in sobrietáte: si bibas illud moderáte, eris sóbrius.'
  "33": Quæ vita est ei, qui minúitur vino?
  "34": Quid defráudat vitam? Mors.
  "35": Vinum in iucunditátem creátum est, et non in ebrietátem ab inítio.
  "36": Exsultátio ánimæ et cordis, vinum moderáte potátum.
  "37": Sánitas est ánimæ et córpori sóbrius potus.
  "38": Vinum multum potátum irritatiónem, et iram, et ruínas multas facit.
  "39": Amaritúdo ánimæ vinum multum potátum.
  "40": Ebrietátis animósitas, imprudéntis offénsio, minórans virtútem, et fáciens vúlnera.
  "41": 'In convívio vini non árguas próximum: et non despícias eum in iucunditáte illíus:'
  "42": 'verba impropérii non dicas illi: et non premas illum repeténdo.'
