bible: vulgate
lang: la
language: Latina
book: Isaias
chapter: "21"
verses:
  "1": Onus desérti maris. Sicut túrbines ab Africo véniunt, de desérto venit, de terra horríbili.
  "2": 'Vísio dura nuntiáta est mihi: qui incrédulus est, infidéliter agit: et qui depopulátor est, vastat. Ascénde Ælam, óbside Mede: omnem gémitum eius cessáre feci.'
  "3": 'Proptérea repléti sunt lumbi mei dolóre: angústia possédit me sicut angústia parturiéntis: córrui cum audírem, conturbátus sum cum vidérem.'
  "4": 'Emárcuit cor meum, ténebræ stupefecérunt me: Bábylon dilécta mea pósita est mihi in miráculum.'
  "5": 'Pone mensam, contempláre in spécula comedéntes et bibéntes: súrgite príncipes, arrípite clýpeum.'
  "6": 'Hæc enim dixit mihi Dóminus: Vade, et pone speculatórem, et quodcúmque víderit annúntiet.'
  "7": 'Et vidit currum duórum équitum, ascensórem ásini, et ascensórem caméli: et contemplátus est diligénter multo intúitu.'
  "8": 'Et clamávit leo: Super spéculam Dómini ego sum, stans iúgiter per diem: et super custódiam meam ego sum, stans totis nóctibus.'
  "9": 'Ecce iste venit ascénsor vir bigæ équitum: et respóndit, et dixit: Cécidit, cécidit Bábylon, et ómnia sculptília deórum eius contríta sunt in terram.'
  "10": Tritúra mea, et fílii áreæ meæ, quæ audívi a Dómino exercítuum, Deo Israel, annuntiávi vobis.
  "11": 'Onus Duma. Ad me clamat ex Seir: Custos quid de nocte? custos quid de nocte?'
  "12": 'Dixit custos: Venit mane et nox: si quǽritis, quǽrite: convertímini, veníte.'
  "13": Onus in Arábia. In saltu ad vésperam dormiétis, in sémitis Dédanim.
  "14": 'Occurréntes sitiénti ferte aquam, qui habitátis terram austri: cum pánibus occúrrite fugiénti.'
  "15": A fácie enim gladiórum fugérunt, a fácie gládii imminéntis, a fácie arcus exténti, a fácie gravis prœ́lii.
  "16": 'Quóniam hæc dicit Dóminus ad me: Adhuc in uno anno, quasi in anno mercenárii, et auferétur omnis glória Cedar.'
  "17": 'Et relíquiæ númeri sagittariórum fórtium de fíliis Cedar imminuéntur: Dóminus enim Deus Israel locútus est.'
