bible: vulgate
lang: la
language: Latina
book: Matthaeus
chapter: "18"
verses:
  "1": 'In illa hora accessérunt discípuli ad Iesum, dicéntes: Quis putas, maior est in regno cælórum?'
  "2": Et ádvocans Iesus párvulum, státuit eum in médio eórum,
  "3": 'et dixit: Amen dico vobis, nisi convérsi fuéritis, et efficiámini sicut párvuli, non intrábitis in regnum cælórum.'
  "4": Quicúmque ergo humiliáverit se sicut párvulus iste, hic est maior in regno cælórum.
  "5": 'Et qui suscéperit unum párvulum talem in nómine meo, me súscipit:'
  "6": qui autem scandalizáverit unum de pusíllis istis, qui in me credunt, éxpedit ei ut suspendátur mola asinária in collo eius, et demergátur in profúndum maris.
  "7": 'Væ mundo a scándalis. Necésse est enim ut véniant scándala: verúmtamen væ hómini illi, per quem scándalum venit.'
  "8": 'Si autem manus tua, vel pes tuus scandalízat te, abscíde eum, et próice abs te: bonum tibi est ad vitam íngredi débilem, vel claudum, quam duas manus, vel duos pedes habéntem mitti in ignem ætérnum.'
  "9": 'Et si óculus tuus scandalízat te, érue eum, et próice abs te: bonum tibi est cum uno óculo in vitam intráre, quam duos óculos habéntem mitti in gehénnam ignis.'
  "10": 'Vidéte ne contemnátis unum ex his pusíllis: dico enim vobis, quia ángeli eórum in cælis semper vident fáciem Patris mei, qui in cælis est.'
  "11": Venit enim Fílius hóminis salváre quod períerat.
  "12": 'Quid vobis vidétur? si fúerint alícui centum oves, et erráverit una ex eis: nonne relínquit nonagínta novem in móntibus, et vadit quǽrere eam, quæ errávit?'
  "13": 'Et si contígerit ut invéniat eam: amen dico vobis, quia gaudet super eam magis quam super nonagínta novem, quæ non erravérunt.'
  "14": Sic non est volúntas ante Patrem vestrum, qui in cælis est, ut péreat unus de pusíllis istis.
  "15": 'Si autem peccáverit in te frater tuus, vade, et córripe eum inter te, et ipsum solum: si te audíerit, lucrátus eris fratrem tuum.'
  "16": Si autem te non audíerit, ádhibe tecum adhuc unum, vel duos, ut in ore duórum, vel trium téstium stet omne verbum.
  "17": 'Quod si non audíerit eos, dic Ecclésiæ: si autem Ecclésiam non audíerit, sit tibi sicut éthnicus, et publicánus.'
  "18": 'Amen dico vobis, quæcúmque alligavéritis super terram, erunt ligáta et in cælo: et quæcúmque solvéritis super terram, erunt solúta et in cælo.'
  "19": Iterum dico vobis, quia si duo ex vobis consénserint super terram, de omni re quamcúmque petíerint, fiet illis a Patre meo, qui in cælis est.
  "20": Ubi enim sunt duo, vel tres congregáti in nómine meo, ibi sum in médio eórum.
  "21": 'Tunc accédens Petrus ad eum, dixit: Dómine, quóties peccábit in me frater meus, et dimíttam ei? usque sépties?'
  "22": 'Dicit illi Iesus: Non dico tibi usque sépties: sed usque septuágies sépties.'
  "23": Ideo assimilátum est regnum cælórum hómini regi, qui vóluit ratiónem pónere cum servis suis.
  "24": Et cum cœpísset ratiónem pónere, oblátus est ei unus, qui debébat ei decem míllia talénta.
  "25": Cum autem non habéret unde rédderet, iussit eum dóminus eius venúmdari, et uxórem eius, et fílios, et ómnia quæ habébat, et reddi.
  "26": 'Prócidens autem servus ille, orábat eum, dicens: Patiéntiam habe in me, et ómnia reddam tibi.'
  "27": Misértus autem dóminus servi illíus, dimísit eum, et débitum dimísit ei.
  "28": 'Egréssus autem servus ille invénit unum de consérvis suis, qui debébat ei centum denários: et tenens suffocávit eum, dicens: Redde quod debes.'
  "29": 'Et prócidens consérvus eius, rogábat eum, dicens: Patiéntiam habe in me, et ómnia reddam tibi.'
  "30": 'Ille autem nóluit: sed ábiit, et misit eum in cárcerem donec rédderet débitum.'
  "31": 'Vidéntes autem consérvi eius quæ fiébant, contristáti sunt valde: et venérunt, et narravérunt dómino suo ómnia, quæ facta fúerant.'
  "32": 'Tunc vocávit illum dóminus suus: et ait illi: Serve nequam, omne débitum dimísi tibi quóniam rogásti me:'
  "33": nonne ergo opórtuit et te miseréri consérvi tui, sicut et ego tui misértus sum?
  "34": Et irátus dóminus eius trádidit eum tortóribus, quoadúsque rédderet univérsum débitum.
  "35": Sic et Pater meus cæléstis fáciet vobis, si non remiséritis unusquísque fratri suo de córdibus vestris.
