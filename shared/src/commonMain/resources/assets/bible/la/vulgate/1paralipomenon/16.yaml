bible: vulgate
lang: la
language: Latina
book: I Paralipomenon
chapter: "16"
verses:
  "1": 'Attulérunt ígitur arcam Dei, et constituérunt eam in médio tabernáculi, quod teténderat ei David: et obtulérunt holocáusta, et pacífica coram Deo.'
  "2": Cumque complésset David ófferens holocáusta, et pacífica, benedíxit pópulo in nómine Dómini.
  "3": Et divísit univérsis per síngulos, a viro usque ad mulíerem, tortam panis, et partem assæ carnis búbalæ, et frixam óleo símilam.
  "4": 'Constituítque coram arca Dómini de Levítis, qui ministrárent, et recordaréntur óperum eius, et glorificárent atque laudárent Dóminum Deum Israel:'
  "5": 'Asaph príncipem, et secúndum eius Zacharíam: porro Iáhiel, et Semíramoth, et Iéhiel, et Mathathíam, et Eliab, et Banaíam, et Obédedom: Iéhiel super órgana psaltérii, et lyras: Asaph autem ut cýmbalis personáret:'
  "6": Banaíam vero, et Iáziel sacerdótes cánere tuba iúgiter coram arca fœ́deris Dómini.
  "7": In illo die fecit David príncipem ad confiténdum Dómino Asaph, et fratres eius.
  "8": 'Confitémini Dómino, et invocáte nomen eius: notas fácite in pópulis adinventiónes eius.'
  "9": 'Cantáte ei, et psállite ei: et narráte ómnia mirabília eius.'
  "10": 'Laudáte nomen sanctum eius: lætétur cor quæréntium Dóminum.'
  "11": 'Quǽrite Dóminum, et virtútem eius: quǽrite fáciem eius semper.'
  "12": 'Recordámini mirabílium eius quæ fecit: signórum illíus, et iudiciórum oris eius.'
  "13": 'Semen Israel servi eius: fílii Iacob elécti eius.'
  "14": 'Ipse Dóminus Deus noster: in univérsa terra iudícia eius.'
  "15": 'Recordámini in sempitérnum pacti eius: sermónis, quem præcépit in mille generatiónes,'
  "16": quem pépigit cum Abraham, et iuraménti illíus cum Isaac.
  "17": 'Et constítuit illud Iacob in præcéptum: et Israel in pactum sempitérnum,'
  "18": 'dicens: Tibi dabo terram Chánaan, funículum hereditátis vestræ:'
  "19": cum essent pauci número, parvi et colóni eius.
  "20": Et transiérunt de gente in gentem, et de regno ad pópulum álterum.
  "21": Non dimísit quemquam calumniári eos, sed increpávit pro eis reges.
  "22": 'Nolíte tángere christos meos: et in prophétis meis nolíte malignári.'
  "23": 'Cantáte Dómino omnis terra: annuntiáte ex die in diem salutáre eius.'
  "24": 'Narráte in géntibus glóriam eius: in cunctis pópulis mirabília eius.'
  "25": 'Quia magnus Dóminus, et laudábilis nimis: et horríbilis super omnes deos.'
  "26": 'Omnes enim dii populórum idóla: Dóminus autem cælos fecit.'
  "27": 'Conféssio et magnificéntia coram eo: fortitúdo et gáudium in loco eius.'
  "28": 'Afférte Dómino famíliæ populórum: afférte Dómino glóriam et impérium.'
  "29": 'Date Dómino glóriam, nómini eius, leváte sacrifícium, et veníte in conspéctu eius: et adoráte Dóminum in decóre sancto.'
  "30": 'Commoveátur a fácie eius omnis terra: ipse enim fundávit orbem immóbilem.'
  "31": 'Læténtur cæli, et exsúltet terra: et dicant in natiónibus: Dóminus regnávit.'
  "32": 'Tonet mare, et plenitúdo eius: exsúltent agri, et ómnia quæ in eis sunt.'
  "33": 'Tunc laudábunt ligna saltus coram Dómino: quia venit iudicáre terram.'
  "34": 'Confitémini Dómino, quóniam bonus: quóniam in ætérnum misericórdia eius.'
  "35": 'Et dícite: Salva nos Deus salvátor noster: et cóngrega nos, et érue de géntibus: ut confiteámur nómini sancto tuo, et exsultémus in carmínibus tuis.'
  "36": 'Benedíctus Dóminus Deus Israel ab ætérno usque in ætérnum: et dicat omnis pópulus: Amen, et hymnum Dómino.'
  "37": Relíquit ítaque ibi coram arca fœ́deris Dómini Asaph, et fratres eius, ut ministrárent in conspéctu arcæ iúgiter per síngulos dies, et vices suas.
  "38": 'Porro Obédedom, et fratres eius sexagínta octo: et Obédedom fílium Idithun, et Hosa constítuit ianitóres.'
  "39": Sadoc autem sacerdótem, et fratres eius sacerdótes, coram tabernáculo Dómini in excélso, quod erat in Gábaon,
  "40": ut offérrent holocáusta Dómino super altáre holocautómatis iúgiter, mane et véspere, iuxta ómnia quæ scripta sunt in lege Dómini, quam præcépit Israéli.
  "41": 'Et post eum Heman, et Idithun, et réliquos eléctos, unumquémque vocábulo suo ad confiténdum Dómino: Quóniam in ætérnum misericórdia eius.'
  "42": 'Heman quoque, et Idithun canéntes tuba, et quatiéntes cýmbala, et ómnia musicórum órgana ad canéndum Deo: fílios autem Idithun fecit esse portários.'
  "43": 'Reversúsque est omnis pópulus in domum suam: et David, ut benedíceret étiam dómui suæ.'
