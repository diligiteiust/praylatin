bible: vulgate
lang: la
language: Latina
book: Ieremias
chapter: "26"
verses:
  "1": 'In princípio regni Ióakim fílii Iosíæ regis Iuda, factum est verbum istud a Dómino, dicens:'
  "2": 'Hæc dicit Dóminus: Sta in átrio domus Dómini, et loquéris ad omnes civitátes Iuda, de quibus véniunt ut adórent in domo Dómini, univérsos sermónes, quos ego mandávi tibi ut loquáris ad eos: noli subtráhere verbum,'
  "3": 'si forte áudiant, et convertántur unusquísque a via sua mala: et pœníteat me mali, quod cógito fácere eis propter malítiam studiórum eórum.'
  "4": 'Et dices ad eos: Hæc dicit Dóminus: Si non audiéritis me, ut ambulétis in lege mea, quam dedi vobis,'
  "5": 'ut audiátis sermónes servórum meórum prophetárum, quos ego misi ad vos de nocte consúrgens, et dírigens, et non audístis:'
  "6": dabo domum istam sicut Silo, et urbem hanc dabo in maledictiónem cunctis géntibus terræ.
  "7": Et audiérunt sacerdótes, et prophétæ, et omnis pópulus Ieremíam loquéntem verba hæc in domo Dómini.
  "8": 'Cumque complésset Ieremías loquens ómnia, quæ præcéperat ei Dóminus ut loquerétur ad univérsum pópulum, apprehendérunt eum sacerdótes, et prophétæ, et omnis pópulus, dicens: Morte moriátur.'
  "9": 'Quare prophetávit in nómine Dómini, dicens: Sicut Silo erit domus hæc, et urbs ista desolábitur, eo quod non sit habitátor? Et congregátus est omnis pópulus advérsus Ieremíam in domo Dómini.'
  "10": Et audiérunt príncipes Iuda verba hæc, et ascendérunt de domo regis in domum Dómini, et sedérunt in intróitu portæ domus Dómini novæ.
  "11": 'Et locúti sunt sacerdótes et prophétæ ad príncipes, et ad omnem pópulum, dicéntes: Iudícium mortis est viro huic: quia prophetávit advérsus civitátem istam, sicut audístis áuribus vestris.'
  "12": 'Et ait Ieremías ad omnes príncipes, et ad univérsum pópulum, dicens: Dóminus misit me ut prophetárem ad domum istam, et ad civitátem hanc, ómnia verba quæ audístis.'
  "13": 'Nunc ergo bonas fácite vias vestras et stúdia vestra, et audíte vocem Dómini Dei vestri: et pœnitébit Dóminum mali, quod locútus est advérsum vos.'
  "14": 'Ego autem ecce in mánibus vestris sum: fácite mihi quod bonum et rectum est in óculis vestris:'
  "15": 'verúmtamen scitóte et cognóscite quod si occidéritis me, sánguinem innocéntem tradétis contra vosmetípsos, et contra civitátem istam, et habitatóres eius: in veritáte enim misit me Dóminus ad vos, ut lóquerer in áuribus vestris ómnia verba hæc.'
  "16": 'Et dixérunt príncipes, et omnis pópulus, ad sacerdótes, et ad prophétas: Non est viro huic iudícium mortis, quia in nómine Dómini Dei nostri locútus est ad nos.'
  "17": 'Surrexérunt ergo viri de senióribus terræ, et dixérunt ad omnem cœtum pópuli, loquéntes:'
  "18": 'Michǽas de Morásthi fuit prophéta in diébus Ezechíæ regis Iuda, et ait ad omnem pópulum Iuda, dicens: Hæc dicit Dóminus exercítuum: Sion quasi ager arábitur, et Ierúsalem in acérvum lápidum erit, et mons domus in excélsa silvárum.'
  "19": 'Numquid morte condemnávit eum Ezechías rex Iuda, et omnis Iuda? numquid non timuérunt Dóminum, et deprecáti sunt fáciem Dómini: et pœnítuit Dóminum mali, quod locútus fúerat advérsum eos? Itaque nos fácimus malum grande contra ánimas nostras.'
  "20": Fuit quoque vir prophétans in nómine Dómini, Urías fílius Sémei de Cariathíarim, et prophetávit advérsus civitátem istam, et advérsus terram hanc, iuxta ómnia verba Ieremíæ.
  "21": 'Et audívit rex Ióakim, et omnes poténtes, et príncipes eius verba hæc: et quæsívit rex interfícere eum. Et audívit Urías, et tímuit, fugítque et ingréssus est Ægýptum.'
  "22": Et misit rex Ióakim viros in Ægýptum, Elnathan fílium Achobor, et viros cum eo, in Ægýptum.
  "23": 'Et eduxérunt Uríam de Ægýpto, et adduxérunt eum ad regem Ióakim, et percússit eum gládio: et proiécit cadáver eius in sepúlcris vulgi ignóbilis.'
  "24": Igitur manus Ahicam fílii Saphan fuit cum Ieremía, ut non traderétur in manus pópuli, et interfícerent eum.
