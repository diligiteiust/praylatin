bible: vulgate
lang: la
language: Latina
book: Matthaeus
chapter: "24"
verses:
  "1": Et egréssus Iesus de templo, ibat. Et accessérunt discípuli eius, ut osténderent ei ædificatiónes templi.
  "2": 'Ipse autem respóndens dixit illis: Vidétis hæc ómnia? amen dico vobis, non relinquétur hic lapis super lápidem, qui non destruátur.'
  "3": 'Sedénte autem eo super montem Olivéti, accessérunt ad eum discípuli secréto, dicéntes: Dic nobis, quando hæc erunt? et quod signum advéntus tui, et consummatiónis sǽculi?'
  "4": 'Et respóndens Iesus, dixit eis: Vidéte ne quis vos sedúcat.'
  "5": 'Multi enim vénient in nómine meo, dicéntes: Ego sum Christus: et multos sedúcent.'
  "6": 'Auditúri enim estis prœ́lia, et opiniónes prœliórum. Vidéte ne turbémini: opórtet enim hæc fíeri, sed nondum est finis.'
  "7": Consúrget enim gens in gentem, et regnum in regnum, et erunt pestiléntiæ, et fames, et terræmótus per loca.
  "8": Hæc autem ómnia inítia sunt dolórum.
  "9": 'Tunc tradent vos in tribulatiónem, et occídent vos: et éritis ódio ómnibus géntibus propter nomen meum.'
  "10": Et tunc scandalizabúntur multi, et ínvicem tradent, et ódio habébunt ínvicem.
  "11": Et multi pseudoprophétæ surgent, et sedúcent multos.
  "12": Et quóniam abundávit iníquitas, refrigéscet cáritas multórum.
  "13": Qui autem perseveráverit usque in finem, hic salvus erit.
  "14": 'Et prædicábitur hoc Evangélium regni in univérso orbe, in testimónium ómnibus géntibus: et tunc véniet consummátio.'
  "15": 'Cum ergo vidéritis abominatiónem desolatiónis, quæ dicta est a Daniéle prophéta, stantem in loco sancto, qui legit, intélligat:'
  "16": 'tunc qui in Iudǽa sunt, fúgiant ad montes:'
  "17": 'et qui in tecto, non descéndat tóllere áliquid de domo sua:'
  "18": et qui in agro, non revertátur tóllere túnicam suam.
  "19": Væ autem prægnántibus, et nutriéntibus in illis diébus.
  "20": Oráte autem ut non fiat fuga vestra in híeme, vel sábbato.
  "21": Erit enim tunc tribulátio magna, qualis non fuit ab inítio mundi usque modo, neque fiet.
  "22": 'Et nisi breviáti fuíssent dies illi, non fíeret salva omnis caro: sed propter eléctos breviabúntur dies illi.'
  "23": 'Tunc si quis vobis díxerit: Ecce hic est Christus, aut illic: nolíte crédere.'
  "24": 'Surgent enim pseudochrísti, et pseudoprophétæ: et dabunt signa magna, et prodígia, ita ut in errórem inducántur (si fíeri potest) étiam elécti.'
  "25": Ecce prædíxi vobis.
  "26": 'Si ergo díxerint vobis: Ecce in desérto est, nolíte exíre: Ecce in penetrálibus, nolíte crédere.'
  "27": 'Sicut enim fulgur exit ab Oriénte, et paret usque in Occidéntem: ita erit et advéntus Fílii hóminis.'
  "28": Ubicúmque fúerit corpus, illic congregabúntur et áquilæ.
  "29": 'Statim autem post tribulatiónem diérum illórum sol obscurábitur, et luna non dabit lumen suum, et stellæ cadent de cælo, et virtútes cælórum commovebúntur:'
  "30": 'et tunc parébit signum Fílii hóminis in cælo: et tunc plangent omnes tribus terræ: et vidébunt Fílium hóminis veniéntem in núbibus cæli cum virtúte multa, et maiestáte.'
  "31": 'Et mittet ángelos suos cum tuba, et voce magna: et congregábunt eléctos eius a quátuor ventis, a summis cælórum usque ad términos eórum.'
  "32": 'Ab árbore autem fici díscite parábolam: cum iam ramus eius tener fúerit, et fólia nata, scitis quia prope est æstas:'
  "33": ita et vos cum vidéritis hæc ómnia, scitóte quia prope est in iánuis.
  "34": Amen dico vobis, quia non præteríbit generátio hæc, donec ómnia hæc fiant.
  "35": Cælum, et terra transíbunt, verba autem mea non præteríbunt.
  "36": De die autem illa, et hora nemo scit, neque ángeli cælórum, nisi solus Pater.
  "37": Sicut autem in diébus Noe, ita erit et advéntus Fílii hóminis.
  "38": Sicut enim erant in diébus ante dilúvium comedéntes et bibéntes, nubéntes et nuptum tradéntes, usque ad eum diem, quo intrávit Noe in arcam,
  "39": 'et non cognovérunt donec venit dilúvium, et tulit omnes: ita erit et advéntus Fílii hóminis.'
  "40": 'Tunc duo erunt in agro: unus assumétur, et unus relinquétur.'
  "41": 'Duæ moléntes in mola: una assumétur, et una relinquétur.'
  "42": Vigiláte ergo, quia nescítis qua hora Dóminus vester ventúrus sit.
  "43": Illud autem scitóte, quóniam si sciret paterfamílias qua hora fur ventúrus esset, vigiláret útique, et non síneret pérfodi domum suam.
  "44": 'Ideo et vos estóte paráti: quia qua nescítis hora Fílius hóminis ventúrus est.'
  "45": Quis, putas, est fidélis servus, et prudens, quem constítuit dóminus suus super famíliam suam, ut det illis cibum in témpore?
  "46": Beátus ille servus, quem cum vénerit dóminus eius, invénerit sic faciéntem.
  "47": Amen dico vobis, quóniam super ómnia bona sua constítuet eum.
  "48": 'Si autem díxerit malus servus ille in corde suo: Moram facit dóminus meus veníre:'
  "49": 'et cœ́perit percútere consérvos suos, mandúcet autem, et bibat cum ebriósis:'
  "50": 'véniet dóminus servi illíus in die, qua non sperat, et hora, qua ignórat:'
  "51": 'et dívidet eum, partémque eius ponet cum hypócritis: illic erit fletus, et stridor déntium.'
