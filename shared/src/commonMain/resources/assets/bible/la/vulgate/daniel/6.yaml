bible: vulgate
lang: la
language: Latina
book: Daniel
chapter: "6"
verses:
  "1": Plácuit Darío, et constítuit super regnum sátrapas centum vigínti ut essent in toto regno suo.
  "2": 'Et super eos príncipes tres, ex quibus Dániel unus erat: ut sátrapæ illis rédderent ratiónem, et rex non sustinéret moléstiam.'
  "3": 'Igitur Dániel superábat omnes príncipes, et sátrapas: quia spíritus Dei ámplior erat in illo.'
  "4": 'Porro rex cogitábat constitúere eum super omne regnum: unde príncipes, et sátrapæ quærébant occasiónem ut invenírent Daniéli ex látere regis: nullámque causam, et suspiciónem reperíre potuérunt, eo quod fidélis esset, et omnis culpa, et suspício non invenirétur in eo.'
  "5": 'Dixérunt ergo viri illi: Non inveniémus Daniéli huic áliquam occasiónem, nisi forte in lege Dei sui.'
  "6": 'Tunc príncipes, et sátrapæ surripuérunt regi, et sic locúti sunt ei: Dari rex in ætérnum vive:'
  "7": 'consílium iniérunt omnes príncipes regni tui, magistrátus, et sátrapæ, senatóres, et iúdices, ut decrétum imperatórium éxeat, et edíctum: ut omnis, qui petíerit áliquam petitiónem a quocúmque deo et hómine usque ad trigínta dies, nisi a te rex, mittátur in lacum leónum.'
  "8": 'Nunc ítaque rex, confírma senténtiam, et scribe decrétum: ut non immutétur quod statútum est a Medis et Persis, nec prævaricári cuíquam líceat.'
  "9": Porro rex Daríus propósuit edíctum, et státuit.
  "10": 'Quod cum Dániel comperísset, id est, constitútam legem, ingréssus est domum suam: et fenéstris apértis in cœnáculo suo contra Ierúsalem tribus tempóribus in die flectébat génua sua, et adorábat, confitebatúrque coram Deo suo sicut et ante fácere consuéverat.'
  "11": Viri ergo illi curiósius inquiréntes invenérunt Daniélem orántem, et obsecrántem Deum suum.
  "12": 'Et accedéntes locúti sunt regi super edícto: Rex numquid non constituísti, ut omnis homo, qui rogáret quemquam de diis et homínibus usque ad dies trigínta, nisi te, rex, mitterétur in lacum leónum? Ad quos respóndens rex, ait: Verus est sermo iuxta decrétum Medórum atque Persárum, quod prævaricári non licet.'
  "13": 'Tunc respondéntes dixérunt coram rege: Dániel de fíliis captivitátis Iuda, non curávit de lege tua, et de edícto, quod constituísti: sed tribus tempóribus per diem orat obsecratióne sua.'
  "14": 'Quod verbum cum audísset rex, satis contristátus est: et pro Daniéle pósuit cor ut liberáret eum, et usque ad occásum solis laborábat ut erúeret illum.'
  "15": 'Viri autem illi intelligéntes regem dixérunt ei: Scito rex, quia lex Medórum, atque Persárum est ut omne decrétum, quod constitúerit rex, non líceat immutári.'
  "16": 'Tunc rex præcépit, et adduxérunt Daniélem, et misérunt eum in lacum leónum. Dixítque rex Daniéli: Deus tuus, quem colis semper, ipse liberábit te.'
  "17": 'Allatúsque est lapis unus, et pósitus est super os laci: quem obsignávit rex ánnulo suo, et ánnulo optimátum suórum, ne quid fíeret contra Daniélem.'
  "18": Et ábiit rex in domum suam, et dormívit incœnátus, cibíque non sunt alláti coram eo, ínsuper et somnus recéssit ab eo.
  "19": 'Tunc rex primo dilúculo consúrgens, festínus ad lacum leónum perréxit:'
  "20": 'appropinquánsque lácui, Daniélem voce lacrymábili inclamávit, et affátus est eum: Dániel serve Dei vivéntis, Deus tuus, cui tu servis semper, putásne váluit te liberáre a leónibus?'
  "21": 'Et Dániel regi respóndens ait: Rex in ætérnum vive:'
  "22": 'Deus meus misit ángelum suum, et conclúsit ora leónum, et non nocuérunt mihi: quia coram eo iustítia invénta est in me: sed et coram te, rex, delíctum non feci.'
  "23": 'Tunc veheménter rex gavísus est super eo, et Daniélem præcépit edúci de lacu: eductúsque est Dániel de lacu, et nulla lǽsio invénta est in eo, quia crédidit Deo suo.'
  "24": 'Iubénte autem rege, addúcti sunt viri illi, qui accusáverant Daniélem: et in lacum leónum missi sunt, ipsi, et fílii, et uxóres eórum: et non pervenérunt usque ad paviméntum laci, donec arríperent eos leónes, et ómnia ossa eórum comminuérunt.'
  "25": 'Tunc Daríus rex scripsit univérsis pópulis, tríbubus, et linguis habitántibus in univérsa terra: Pax vobis multiplicétur.'
  "26": 'A me constitútum est decrétum, ut in univérso império, et regno meo, tremíscant et páveant Deum Daniélis: ipse est enim Deus vivens, et ætérnus in sǽcula, et regnum eius non dissipábitur, et potéstas eius usque in ætérnum.'
  "27": 'Ipse liberátor atque salvátor, fáciens signa, et mirabília in cælo, et in terra: qui liberávit Daniélem de lacu leónum.'
  "28": Porro Dániel perseverávit usque ad regnum Daríi, regnúmque Cyri Persæ.
