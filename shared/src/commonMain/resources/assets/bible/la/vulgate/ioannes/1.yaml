bible: vulgate
lang: la
language: Latina
book: Ioannes
chapter: "1"
verses:
  "1": In princípio erat Verbum, et Verbum erat apud Deum, et Deus erat Verbum.
  "2": Hoc erat in princípio apud Deum.
  "3": 'Omnia per ipsum facta sunt: et sine ipso factum est nihil, quod factum est.'
  "4": 'In ipso vita erat, et vita erat lux hóminum:'
  "5": et lux in ténebris lucet, et ténebræ eam non comprehendérunt.
  "6": Fuit homo missus a Deo, cui nomen erat Ioánnes.
  "7": Hic venit in testimónium ut testimónium perhibéret de lúmine, ut omnes créderent per illum.
  "8": Non erat ille lux, sed ut testimónium perhibéret de lúmine.
  "9": Erat lux vera, quæ illúminat omnem hóminem veniéntem in hunc mundum.
  "10": In mundo erat, et mundus per ipsum factus est, et mundus eum non cognóvit.
  "11": In própria venit, et sui eum non recepérunt.
  "12": 'Quotquot autem recepérunt eum, dedit eis potestátem fílios Dei fíeri, his, qui credunt in nómine eius:'
  "13": qui non ex sanguínibus, neque ex voluntáte carnis, neque ex voluntáte viri, sed ex Deo nati sunt.
  "14": 'Et Verbum caro factum est, et habitávit in nobis: et vídimus glóriam eius, glóriam quasi Unigéniti a Patre plenum grátiæ, et veritátis.'
  "15": 'Ioánnes testimónium pérhibet de ipso, et clamat dicens: Hic erat, quem dixi: Qui post me ventúrus est, ante me factus est: quia prior me erat.'
  "16": 'Et de plenitúdine eius nos omnes accépimus, et grátiam pro grátia:'
  "17": quia lex per Móysen data est, grátia, et véritas per Iesum Christum facta est.
  "18": 'Deum nemo vidit unquam: unigénitus Fílius, qui est in sinu Patris, ipse enarrávit.'
  "19": 'Et hoc est testimónium Ioánnis, quando misérunt Iudǽi ab Ierosólymis sacerdótes et Levítas ad eum ut interrogárent eum: Tu quis es?'
  "20": 'Et conféssus est, et non negávit, et conféssus est: Quia non sum ego Christus.'
  "21": 'Et interrogavérunt eum: Quid ergo? Elías es tu? Et dixit: Non sum. Prophéta es tu? Et respóndit: Non.'
  "22": 'Dixérunt ergo ei: Quis es ut respónsum demus his, qui misérunt nos? quid dicis de teípso?'
  "23": 'Ait: Ego vox clamántis in desérto: Dirígite viam Dómini, sicut dixit Isaías prophéta.'
  "24": Et qui missi fúerant, erant ex Pharisǽis.
  "25": 'Et interrogavérunt eum, et dixérunt ei: Quid ergo baptízas, si tu non es Christus, neque Elías, neque prophéta?'
  "26": 'Respóndit eis Ioánnes, dicens: Ego baptízo in aqua: médius autem vestrum stetit, quem vos nescítis.'
  "27": 'Ipse est, qui post me ventúrus est, qui ante me factus est: cuius ego non sum dignus ut solvam eius corrígiam calceaménti.'
  "28": Hæc in Bethánia facta sunt trans Iordánem, ubi erat Ioánnes baptízans.
  "29": 'Altera die vidit Ioánnes Iesum veniéntem ad se, et ait: Ecce agnus Dei, ecce qui tollit peccátum mundi.'
  "30": 'Hic est de quo dixi: Post me venit vir, qui ante me factus est: quia prior me erat:'
  "31": et ego nesciébam eum, sed ut manifestétur in Israel, proptérea veni ego in aqua baptízans.
  "32": 'Et testimónium perhíbuit Ioánnes, dicens: Quia vidi Spíritum descendéntem quasi colúmbam de cælo, et mansit super eum.'
  "33": 'Et ego nesciébam eum: sed qui misit me baptizáre in aqua, ille mihi dixit: Super quem víderis Spíritum descendéntem, et manéntem super eum, hic est, qui baptízat in Spíritu sancto.'
  "34": 'Et ego vidi: et testimónium perhíbui quia hic est Fílius Dei.'
  "35": Altera die íterum stabat Ioánnes, et ex discípulis eius duo.
  "36": 'Et respíciens Iesum ambulántem, dicit: Ecce agnus Dei.'
  "37": Et audiérunt eum duo discípuli loquéntem, et secúti sunt Iesum.
  "38": 'Convérsus autem Iesus, et videns eos sequéntes se, dicit eis: Quid quǽritis? Qui dixérunt ei: Rabbi (quod dícitur interpretátum Magíster), ubi hábitas?'
  "39": 'Dicit eis: Veníte, et vidéte. Venérunt, et vidérunt ubi manéret, et apud eum mansérunt die illo: hora autem erat quasi décima.'
  "40": Erat autem Andréas, frater Simónis Petri, unus ex duóbus, qui audíerant a Ioánne, et secúti fúerant eum.
  "41": 'Invenit hic primum fratrem suum Simónem, et dicit ei: Invénimus Messíam (quod est interpretátum Christus).'
  "42": 'Et addúxit eum ad Iesum. Intúitus autem eum Iesus, dixit: Tu es Simon, fílius Iona: tu vocáberis Cephas, quod interpretátur Petrus.'
  "43": 'In crástinum vóluit exíre in Galilǽam, et invénit Philíppum. Et dicit ei Iesus: Séquere me.'
  "44": Erat autem Philíppus a Bethsáida, civitáte Andréæ, et Petri.
  "45": 'Invenit Philíppus Nathánael, et dicit ei: Quem scripsit Móyses in lege, et prophétæ, invénimus Iesum fílium Ioseph a Názareth.'
  "46": 'Et dixit ei Nathánael: A Názareth potest áliquid boni esse? Dicit ei Philíppus: Veni, et vide.'
  "47": 'Vidit Iesus Nathánael veniéntem ad se, et dicit de eo: Ecce vere Israelíta, in quo dolus non est.'
  "48": 'Dicit ei Nathánael: Unde me nosti? Respóndit Iesus, et dixit ei: Priúsquam te Philíppus vocáret, cum esses sub ficu, vidi te.'
  "49": 'Respóndit ei Nathánael, et ait: Rabbi, tu es Fílius Dei, tu es rex Israel.'
  "50": 'Respóndit Iesus, et dixit ei: Quia dixi tibi: Vidi te sub ficu, credis: maius his vidébis.'
  "51": 'Et dicit ei: Amen, amen dico vobis, vidébitis cælum apértum, et ángelos Dei ascendéntes, et descendéntes supra Fílium hóminis.'
