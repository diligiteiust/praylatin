bible: vulgate
lang: la
language: Latina
book: Ecclesiasticus
chapter: "49"
verses:
  "1": Memória Iosíæ in compositiónem odóris facta opus pigmentárii.
  "2": In omni ore quasi mel indulcábitur eius memória, et ut música in convívio vini.
  "3": Ipse est diréctus divínitus in pœniténtiam gentis, et tulit abominatiónes impietátis.
  "4": Et gubernávit ad Dóminum cor ipsíus, et in diébus peccatórum corroborávit pietátem.
  "5": 'Præter David, et Ezechíam, et Iosíam, omnes peccátum commisérunt:'
  "6": nam reliquérunt legem Altíssimi reges Iuda, et contempsérunt timórem Dei.
  "7": Dedérunt enim regnum suum áliis, et glóriam suam alienígenæ genti.
  "8": Incendérunt eléctam sanctitátis civitátem, et desértas fecérunt vias ipsíus in manu Ieremíæ.
  "9": Nam male tractavérunt illum, qui a ventre matris consecrátus est prophéta, evértere, et erúere, et pérdere, et íterum ædificáre, et renováre.
  "10": Ezéchiel qui vidit conspéctum glóriæ, quam osténdit illi in curru chérubim.
  "11": Nam commemorátus est inimicórum in imbre, benefácere illis, qui ostendérunt rectas vias.
  "12": 'Et duódecim prophetárum ossa púllulent de loco suo: nam corroboravérunt Iacob, et redemérunt se in fide virtútis.'
  "13": 'Quómodo amplificémus Zoróbabel? nam et ipse quasi signum in déxtera manu:'
  "14": 'sic et Iesum, fílium Iósedec: qui in diébus suis ædificavérunt domum, et exaltavérunt templum sanctum Dómino, parátum in glóriam sempitérnam.'
  "15": Et Nehemías in memóriam multi témporis, qui eréxit nobis muros evérsos, et stare fecit portas et seras, qui eréxit domos nostras.
  "16": 'Nemo natus est in terra qualis Henoch: nam et ipse recéptus est a terra.'
  "17": 'Neque ut Ioseph, qui natus est homo princeps fratrum, firmaméntum gentis, rector fratrum, stabiliméntum pópuli:'
  "18": et ossa ipsíus visitáta sunt, et post mortem prophetavérunt.
  "19": 'Seth, et Sem apud hómines glóriam adépti sunt: et super omnem ánimam in orígine Adam.'
