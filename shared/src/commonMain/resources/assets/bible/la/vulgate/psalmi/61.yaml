bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "61"
verses:
  "1": In finem, pro Idithun, Psalmus David.
  "2": Nonne Deo subiécta erit ánima mea? ab ipso enim salutáre meum.
  "3": 'Nam et ipse Deus meus et salutáris meus: suscéptor meus, non movébor ámplius.'
  "4": 'Quoúsque irrúitis in hóminem? interfícitis univérsi vos: tamquam paríeti inclináto et macériæ depúlsæ.'
  "5": 'Verúmtamen prétium meum cogitavérunt repéllere, cucúrri in siti: ore suo benedicébant, et corde suo maledicébant.'
  "6": 'Verúmtamen Deo subiécta esto ánima mea: quóniam ab ipso patiéntia mea.'
  "7": 'Quia ipse Deus meus et salvátor meus: adiútor meus, non emigrábo.'
  "8": 'In Deo salutáre meum et glória mea: Deus auxílii mei, et spes mea in Deo est.'
  "9": 'Speráte in eo omnis congregátio pópuli, effúndite coram illo corda vestra: Deus adiútor noster in ætérnum.'
  "10": 'Verúmtamen vani fílii hóminum, mendáces fílii hóminum in statéris: ut decípiant ipsi de vanitáte in idípsum.'
  "11": 'Nolíte speráre in iniquitáte, et rapínas nolíte concupíscere: divítiæ si áffluant, nolíte cor appónere.'
  "12": Semel locútus est Deus, duo hæc audívi, quia potéstas Dei est,
  "13": 'et tibi Dómine misericórdia: quia tu reddes unicuíque iuxta ópera sua.'
