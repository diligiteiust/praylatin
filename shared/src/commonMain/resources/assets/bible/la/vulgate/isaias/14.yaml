bible: vulgate
lang: la
language: Latina
book: Isaias
chapter: "14"
verses:
  "1": 'Prope est ut véniat tempus eius, et dies eius non elongabúntur. Miserébitur enim Dóminus Iacob, et éliget adhuc de Israel, et requiéscere eos fáciet super humum suam: adiungétur ádvena ad eos, et adhærébit dómui Iacob.'
  "2": 'Et tenébunt eos pópuli, et addúcent eos in locum suum: et possidébit eos domus Israel super terram Dómini in servos et ancíllas: et erunt capiéntes eos, qui se céperant, et subícient exactóres suos.'
  "3": 'Et erit in die illa: cum réquiem déderit tibi Deus a labóre tuo, et a concussióne tua, et a servitúte dura, qua ante servísti:'
  "4": 'sumes parábolam istam contra regem Babylónis, et dices: Quómodo cessávit exáctor, quiévit tribútum?'
  "5": Contrívit Dóminus báculum impiórum, virgam dominántium,
  "6": cædéntem pópulos in indignatióne plaga insanábili, subiciéntem in furóre gentes, persequéntem crudéliter.
  "7": 'Conquiévit et síluit omnis terra, gavísa est et exsultávit:'
  "8": 'abiétes quoque lætátæ sunt super te, et cedri Líbani: ex quo dormísti, non ascéndet qui succídat nos.'
  "9": 'Inférnus subter conturbátus est in occúrsum advéntus tui: suscitávit tibi gigántes. Omnes príncipes terræ surrexérunt de sóliis suis, omnes príncipes natiónum.'
  "10": 'Univérsi respondébunt, et dicent tibi: Et tu vulnerátus es sicut et nos, nostri símilis efféctus es.'
  "11": 'Detrácta est ad ínferos supérbia tua, cóncidit cadáver tuum: subter te sternétur tínea, et operiméntum tuum erunt vermes.'
  "12": Quómodo cecidísti de cælo lúcifer, qui mane oriebáris? corruísti in terram, qui vulnerábas gentes?
  "13": 'Qui dicébas in corde tuo: In cælum conscéndam, super astra Dei exaltábo sólium meum: sedébo in monte testaménti, in latéribus aquilónis.'
  "14": Ascéndam super altitúdinem núbium, símilis ero Altíssimo.
  "15": 'Verúmtamen ad inférnum detrahéris, in profúndum laci:'
  "16": 'qui te víderint, ad te inclinabúntur, teque prospícient: Numquid iste est vir, qui conturbávit terram, qui concússit regna,'
  "17": qui pósuit orbem desértum, et urbes eius destrúxit, vinctis eius non apéruit cárcerem?
  "18": Omnes reges géntium univérsi dormiérunt in glória, vir in domo sua.
  "19": Tu autem proiéctus es de sepúlcro tuo, quasi stirps inútilis pollútus, et obvolútus cum his, qui interfécti sunt gládio, et descendérunt ad fundaménta laci, quasi cadáver pútridum.
  "20": 'Non habébis consórtium, neque cum eis in sepultúra: tu enim terram tuam disperdidísti, tu pópulum tuum occidísti: non vocábitur in ætérnum semen pessimórum.'
  "21": 'Præparáte fílios eius occisióni, in iniquitáte patrum suórum: non consúrgent, nec hereditábunt terram, neque implébunt fáciem orbis civitátum.'
  "22": 'Et consúrgam super eos, dicit Dóminus exercítuum: et perdam Babylónis nomen, et relíquias, et germen, et progéniem, dicit Dóminus:'
  "23": et ponam eam in possessiónem erícii, et in palúdes aquárum, et scopábo eam in scopa terens, dicit Dóminus exercítuum.
  "24": 'Iurávit Dóminus exercítuum, dicens: Si non, ut putávi, ita erit: et quómodo mente tractávi,'
  "25": 'sic evéniet: ut cónteram Assýrium in terra mea, et in móntibus meis concúlcem eum: et auferétur ab eis iugum eius, et onus illíus ab húmero eórum tollétur.'
  "26": 'Hoc consílium, quod cogitávi super omnem terram: et hæc est manus exténta super univérsas gentes.'
  "27": 'Dóminus enim exercítuum decrévit: et quis póterit infirmáre? et manus eius exténta: et quis avértet eam?'
  "28": 'In anno, quo mórtuus est rex Achaz, factum est onus istud:'
  "29": 'Ne lætéris Philisthǽa omnis tu, quóniam comminúta est virga percussóris tui: de radíce enim cólubri egrediétur régulus, et semen eius absórbens vólucrem.'
  "30": 'Et pascéntur primogéniti páuperum, et páuperes fiduciáliter requiéscent: et interíre fáciam in fame radícem tuam, et relíquias tuas interfíciam.'
  "31": 'Ulula porta, clama cívitas: prostráta est Philisthǽa omnis: ab aquilóne enim fumus véniet, et non est qui effúgiet agmen eius.'
  "32": Et quid respondébitur núntiis gentis? Quia Dóminus fundávit Sion, et in ipso sperábunt páuperes pópuli eius.
