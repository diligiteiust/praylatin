bible: vulgate
lang: la
language: Latina
book: Ezechiel
chapter: "46"
verses:
  "1": 'Hæc dicit Dóminus Deus: Porta átrii interióris, quæ réspicit ad oriéntem, erit clausa sex diébus, in quibus opus fit: die autem sábbati aperiétur, sed et in die calendárum aperiétur.'
  "2": 'Et intrábit princeps per viam vestíbuli portæ déforis, et stabit in límine portæ: et fácient sacerdótes holocáustum eius, et pacífica eius: et adorábit super limen portæ, et egrediétur: porta autem non claudétur usque ad vésperam.'
  "3": Et adorábit pópulus terræ ad óstium portæ illíus in sábbatis, et in caléndis coram Dómino.
  "4": 'Holocáustum autem hoc ófferet princeps Dómino: in die sábbati, sex agnos immaculátos, et aríetem immaculátum,'
  "5": 'et sacrifícium ephi per aríetem: in agnis autem sacrifícium quod déderit manus eius: et ólei hin per síngula ephi.'
  "6": 'In die autem calendárum vítulum de arménto immaculátum: et sex agni, et aríetes immaculáti erunt.'
  "7": 'Et ephi per vítulum, ephi quoque per aríetem fáciet sacrifícium: de agnis autem sicut invénerit manus eius: et ólei hin per síngula ephi.'
  "8": Cumque ingressúrus est princeps, per viam vestíbuli portæ ingrediátur, et per eámdem viam éxeat.
  "9": 'Et cum intrábit pópulus terræ in conspéctu Dómini in solemnitátibus: qui ingréditur per portam aquilónis ut adóret, egrediátur per viam portæ meridiánæ: porro qui ingréditur per viam portæ meridiánæ, egrediátur per viam portæ aquilónis: non revertétur per viam portæ, per quam ingréssus est, sed e regióne illíus egrediétur.'
  "10": Princeps autem in médio eórum cum ingrediéntibus ingrediétur, et cum egrediéntibus egrediétur.
  "11": 'Et in núndinis, et in solemnitátibus erit sacrifícium ephi per vítulum, et ephi per aríetem: agnis autem erit sacrifícium sicut invénerit manus eius, et ólei hin per síngula ephi.'
  "12": 'Cum autem fécerit princeps spontáneum holocáustum, aut pacífica voluntária Dómino: aperiétur ei porta, quæ réspicit ad oriéntem, et fáciet holocáustum suum, et pacífica sua, sicut fíeri solet in die sábbati: et egrediétur, claudetúrque porta postquam exíerit.'
  "13": 'Et agnum eiúsdem anni immaculátum fáciet holocáustum quotídie Dómino: semper mane fáciet illud.'
  "14": 'Et fáciet sacrifícium super eo cata mane mane sextam partem ephi, et de óleo tértiam partem hin, ut misceátur símilæ: sacrifícium Dómino legítimum, iuge atque perpétuum.'
  "15": 'Fáciet agnum, et sacrifícium, et óleum cata mane mane: holocáustum sempitérnum.'
  "16": 'Hæc dicit Dóminus Deus: Si déderit princeps donum alícui de fíliis suis: heréditas eius, filiórum suórum erit, possidébunt eam hereditárie.'
  "17": 'Si autem déderit legátum de hereditáte sua uni servórum suórum, erit illíus usque ad annum remissiónis, et revertétur ad príncipem: heréditas autem eius fíliis eius erit.'
  "18": 'Et non accípiet princeps de hereditáte pópuli per violéntiam, et de possessióne eórum: sed de possessióne sua hereditátem dabit fíliis suis, ut non dispergátur pópulus meus unusquísque a possessióne sua.'
  "19": 'Et introdúxit me per ingréssum, qui erat ex látere portæ, in gazophylácia sanctuárii ad sacerdótes, quæ respiciébant ad aquilónem: et erat ibi locus vergens ad occidéntem.'
  "20": 'Et dixit ad me: Iste est locus ubi coquent sacerdótes pro peccáto, et pro delícto: ubi coquent sacrifícium, ut non éfferant in átrium extérius, et sanctificétur pópulus.'
  "21": 'Et edúxit me in átrium extérius, et circumdúxit me per quátuor ángulos átrii: et ecce atríolum erat in ángulo átrii, atríola síngula per ángulos átrii.'
  "22": 'In quátuor ángulis átrii atríola dispósita, quadragínta cubitórum per longum, et trigínta per latum: mensúræ uníus quátuor erant.'
  "23": 'Et páries per circúitum ámbiens quátuor atríola: et culínæ fabricátæ erant subter pórticus per gyrum.'
  "24": 'Et dixit ad me: Hæc est domus culinárum, in qua coquent minístri domus Dómini víctimas pópuli.'
