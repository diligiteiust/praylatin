bible: vulgate
lang: la
language: Latina
book: I Paralipomenon
chapter: "22"
verses:
  "1": 'Dixítque David: Hæc est domus Dei, et hoc altáre in holocáustum Israéli.'
  "2": Et præcépit ut congregaréntur omnes prosélyti de terra Israel, et constítuit ex eis látomos ad cædéndos lápides et poliéndos, ut ædificarétur domus Dei.
  "3": 'Ferrum quoque plúrimum ad clavos ianuárum, et ad commissúras atque iunctúras, præparávit David: et æris pondus innumerábile.'
  "4": Ligna quoque cédrina non póterant æstimári, quæ Sidónii et Týrii deportáverant ad David.
  "5": 'Et dixit David: Sálomon fílius meus puer párvulus est et delicátus: domus autem, quam ædificári volo Dómino, talis esse debet ut in cunctis regiónibus nominétur: præparábo ergo ei necessária. Et ob hanc causam ante mortem suam omnes præparávit impénsas.'
  "6": Vocavítque Salomónem fílium suum, et præcépit ei ut ædificáret domum Dómino Deo Israel.
  "7": 'Dixítque David ad Salomónem: Fili mi, voluntátis meæ fuit ut ædificárem domum nómini Dómini Dei mei,'
  "8": 'sed factus est sermo Dómini ad me, dicens: Multum sánguinem effudísti, et plúrima bella bellásti: non póteris ædificáre domum nómini meo, tanto effúso sánguine coram me:'
  "9": 'fílius, qui nascétur tibi, erit vir quietíssimus: fáciam enim eum requiéscere ab ómnibus inimícis suis per circúitum: et ob hanc causam Pacíficus vocábitur: et pacem et ótium dabo in Israel cunctis diébus eius.'
  "10": 'Ipse ædificábit domum nómini meo, et ipse erit mihi in fílium, et ego ero illi in patrem: firmabóque sólium regni eius super Israel in ætérnum.'
  "11": Nunc ergo fili mi, sit Dóminus tecum, et prosperáre, et ædífica domum Dómino Deo tuo sicut locútus est de te.
  "12": Det quoque tibi Dóminus prudéntiam et sensum, ut régere possis Israel, et custodíre legem Dómini Dei tui.
  "13": 'Tunc enim profícere póteris, si custodíeris mandáta, et iudícia, quæ præcépit Dóminus Móysi ut docéret Israel. Confortáre, et viríliter age: ne tímeas, neque páveas.'
  "14": 'Ecce ego in paupertáte mea præparávi impénsas domus Dómini, auri talénta centum míllia, et argénti mille míllia talentórum: æris vero, et ferri non est pondus, víncitur enim númerus magnitúdine: ligna et lápides præparávi ad univérsa impéndia.'
  "15": Habes quoque plúrimos artífices, látomos, et cæmentários, artificésque lignórum, et ómnium ártium ad faciéndum opus prudentíssimos,
  "16": in auro et argénto et ære et ferro, cuius non est númerus. Surge ígitur, et fac, et erit Dóminus tecum.
  "17": 'Præcépit quoque David cunctis princípibus Israel, ut adiuvárent Salomónem fílium suum:'
  "18": Cérnitis, ínquiens, quod Dóminus Deus vester vobíscum sit, et déderit vobis réquiem per circúitum, et tradíderit omnes inimícos vestros in manus vestras, et subiécta sit terra coram Dómino, et coram pópulo eius.
  "19": 'Præbéte ígitur corda vestra et ánimas vestras, ut quærátis Dóminum Deum vestrum: et consúrgite, et ædificáte sanctuárium Dómino Deo, ut introducátur arca fœ́deris Dómini, et vasa Dómino consecráta, in domum, quæ ædificátur nómini Dómini.'
