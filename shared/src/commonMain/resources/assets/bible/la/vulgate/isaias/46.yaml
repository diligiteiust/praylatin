bible: vulgate
lang: la
language: Latina
book: Isaias
chapter: "46"
verses:
  "1": 'Confráctus est Bel, contrítus est Nabo: facta sunt simulácra eórum béstiis et iuméntis, ónera vestra gravi póndere usque ad lassitúdinem.'
  "2": 'Contabuérunt, et contríta sunt simul: non potuérunt salváre portántem, et ánima eórum in captivitátem ibit.'
  "3": Audíte me domus Iacob, et omne resíduum domus Israel, qui portámini a meo útero, qui gestámini a mea vulva.
  "4": 'Usque ad senéctam ego ipse, et usque ad canos ego portábo: ego feci, et ego feram: ego portábo, et salvábo.'
  "5": Cui assimilástis me, et adæquástis, et comparástis me, et fecístis símilem?
  "6": 'Qui confértis aurum de sácculo, et argéntum statéra ponderátis, conducéntes auríficem ut fáciat deum: et prócidunt, et adórant.'
  "7": 'Portant illum in húmeris gestántes, et ponéntes in loco suo, et stabit, ac de loco suo non movébitur: sed et cum clamáverint ad eum, non áudiet: de tribulatióne non salvábit eos.'
  "8": 'Mementóte istud, et confundámini: redíte prævaricatóres ad cor.'
  "9": Recordámini prióris sǽculi, quóniam ego sum Deus, et non est ultra Deus, nec est símilis mei.
  "10": 'Annúntians ab exórdio novíssimum, et ab inítio quæ necdum facta sunt, dicens: Consílium meum stabit, et omnis volúntas mea fiet.'
  "11": 'Vocans ab oriénte avem, et de terra longínqua virum voluntátis meæ: et locútus sum, et addúcam illud: creávi, et fáciam illud.'
  "12": Audíte me duro corde, qui longe estis a iustítia.
  "13": Prope feci iustítiam meam, non elongábitur, et salus mea non morábitur. Dabo in Sion salútem, et in Israel glóriam meam.
