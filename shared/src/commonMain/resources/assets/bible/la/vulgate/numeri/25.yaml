bible: vulgate
lang: la
language: Latina
book: Numeri
chapter: "25"
verses:
  "1": Morabátur autem eo témpore Israel in Settim, et fornicátus est pópulus cum filiábus Moab,
  "2": quæ vocavérunt eos ad sacrifícia sua. At illi comedérunt et adoravérunt deos eárum.
  "3": 'Initiatúsque est Israel Beélphegor: et irátus Dóminus,'
  "4": 'ait ad Móysen: Tolle cunctos príncipes pópuli, et suspénde eos contra solem in patíbulis, ut avertátur furor meus ab Israel.'
  "5": 'Dixítque Móyses ad iúdices Israel: Occídat unusquísque próximos suos, qui initiáti sunt Beélphegor.'
  "6": Et ecce unus de fíliis Israel intrávit coram frátribus suis ad scortum Madianítidem, vidénte Móyse, et omni turba filiórum Israel, qui flebant ante fores tabernáculi.
  "7": Quod cum vidísset Phínees fílius Eleázari fílii Aaron sacerdótis, surréxit de médio multitúdinis, et arrépto pugióne,
  "8": 'ingréssus est post virum Israelítem in lupánar, et perfódit ambos simul, virum scílicet et mulíerem in locis genitálibus. Cessavítque plaga a fíliis Israel:'
  "9": et occísi sunt vigínti quátuor míllia hóminum.
  "10": 'Dixítque Dóminus ad Móysen:'
  "11": 'Phínees fílius Eleázari fílii Aaron sacerdótis avértit iram meam a fíliis Israel: quia zelo meo commótus est contra eos, ut non ipse delérem fílios Israel in zelo meo.'
  "12": 'Idcírco lóquere ad eum: Ecce do ei pacem fœ́deris mei,'
  "13": 'et erit tam ipsi quam sémini eius pactum sacerdótii sempitérnum: quia zelátus est pro Deo suo, et expiávit scelus filiórum Israel.'
  "14": Erat autem nomen viri Israelítæ, qui occísus est cum Madianítide, Zambri fílius Salu, dux de cognatióne et tribu Simeónis.
  "15": Porro múlier Madianítis, quæ páriter interfécta est, vocabátur Cozbi fília Sur príncipis nobilíssimi Madianitárum.
  "16": 'Locutúsque est Dóminus ad Móysen, dicens:'
  "17": 'Hostes vos séntiant Madianítæ, et percútite eos:'
  "18": quia et ipsi hostíliter egérunt contra vos, et decepére insídiis per idólum Phogor, et Cozbi fíliam ducis Mádian sorórem suam, quæ percússa est in die plagæ pro sacrilégio Phogor.
