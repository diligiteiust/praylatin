bible: vulgate
lang: la
language: Latina
book: Lucas
chapter: "9"
verses:
  "1": Convocátis autem duódecim Apóstolis, dedit illis virtútem, et potestátem super ómnia dæmónia, et ut languóres curárent.
  "2": Et misit illos prædicáre regnum Dei, et sanáre infírmos.
  "3": 'Et ait ad illos: Nihil tuléritis in via, neque virgam, neque peram, neque panem, neque pecúniam, neque duas túnicas habeátis.'
  "4": Et in quamcúmque domum intravéritis, ibi manéte, et inde ne exeátis.
  "5": 'Et quicúmque non recéperint vos: exeúntes de civitáte illa, étiam púlverem pedum vestrórum excútite in testimónium supra illos.'
  "6": Egréssi autem circuíbant per castélla evangelizántes, et curántes ubíque.
  "7": Audívit autem Heródes tetrárcha ómnia, quæ fiébant ab eo, et hæsitábat eo quod dicerétur
  "8": 'a quibúsdam: Quia Ioánnes surréxit a mórtuis: a quibúsdam vero: Quia Elías appáruit: ab áliis autem: Quia prophéta unus de antíquis surréxit.'
  "9": 'Et ait Heródes: Ioánnem ego decollávi: quis est autem iste, de quo ego tália áudio? Et quærébat vidére eum.'
  "10": 'Et revérsi Apóstoli, narravérunt illi quæcúmque fecérunt: et assúmptis illis secéssit seórsum in locum desértum, qui est Bethsáidæ.'
  "11": 'Quod cum cognovíssent turbæ, secútæ sunt illum: et excépit eos, et loquebátur illis de regno Dei, et eos, qui cura indigébant, sanábat.'
  "12": 'Dies autem cœ́perat declináre, et accedéntes duódecim dixérunt illi: Dimítte turbas, ut eúntes in castélla, villásque quæ circa sunt, divértant, et invéniant escas: quia hic in loco desérto sumus.'
  "13": 'Ait autem ad illos: Vos date illis manducáre. At illi dixérunt: Non sunt nobis plus quam quinque panes, et duo pisces: nisi forte nos eámus, et emámus in omnem hanc turbam escas.'
  "14": 'Erant autem fere viri quinque míllia. Ait autem ad discípulos suos: Fácite illos discúmbere per convívia quinquagénos.'
  "15": Et ita fecérunt. Et discúmbere fecérunt omnes.
  "16": 'Accéptis autem quinque pánibus, et duóbus píscibus, respéxit in cælum, et benedíxit illis: et fregit, et distríbuit discípulis suis, ut pónerent ante turbas.'
  "17": Et manducavérunt omnes, et saturáti sunt. Et sublátum est quod supérfuit illis, fragmentórum cóphini duódecim.
  "18": 'Et factum est cum solus esset orans, erant cum illo et discípuli: et interrogávit illos, dicens: Quem me dicunt esse turbæ?'
  "19": 'At illi respondérunt, et dixérunt: Ioánnem Baptístam, álii autem Elíam, álii vero quia unus prophéta de prióribus surréxit.'
  "20": 'Dixit autem illis: Vos autem quem me esse dícitis? Respóndens Simon Petrus, dixit: Christum Dei.'
  "21": At ille íncrepans illos, præcépit ne cui dícerent hoc,
  "22": 'dicens: Quia opórtet Fílium hóminis multa pati, et reprobári a senióribus, et princípibus sacerdótum, et scribis, et occídi, et tértia die resúrgere.'
  "23": 'Dicébat autem ad omnes: Si quis vult post me veníre, ábneget semetípsum, et tollat crucem suam quotídie, et sequátur me.'
  "24": 'Qui enim volúerit ánimam suam salvam fácere, perdet illam: nam qui perdíderit ánimam suam propter me, salvam fáciet illam.'
  "25": Quid enim próficit homo, si lucrétur univérsum mundum, se autem ipsum perdat, et detriméntum sui fáciat?
  "26": 'Nam qui me erubúerit, et meos sermónes: hunc Fílius hóminis erubéscet cum vénerit in maiestáte sua, et Patris, et sanctórum angelórum.'
  "27": 'Dico autem vobis vere: sunt áliqui hic stantes, qui non gustábunt mortem donec vídeant regnum Dei.'
  "28": Factum est autem post hæc verba fere dies octo, et assúmpsit Petrum, et Iacóbum, et Ioánnem, et ascéndit in montem ut oráret.
  "29": 'Et facta est, dum oráret, spécies vultus eius áltera: et vestítus eius albus et refúlgens.'
  "30": Et ecce duo viri loquebántur cum illo. Erant autem Móyses, et Elías,
  "31": 'visi in maiestáte: et dicébant excéssum eius, quem completúrus erat in Ierúsalem.'
  "32": Petrus vero, et qui cum illo erant, graváti erant somno. Et evigilántes vidérunt maiestátem eius, et duos viros, qui stabant cum illo.
  "33": 'Et factum est cum discéderent ab illo, ait Petrus ad Iesum: Præcéptor, bonum est nos hic esse: et faciámus tria tabernácula, unum tibi, et unum Móysi, et unum Elíæ: nésciens quid díceret.'
  "34": 'Hæc autem illo loquénte, facta est nubes, et obumbrávit eos: et timuérunt, intrántibus illis in nubem.'
  "35": 'Et vox facta est de nube, dicens: Hic est Fílius meus diléctus, ipsum audíte.'
  "36": Et dum fíeret vox, invéntus est Iesus solus. Et ipsi tacuérunt, et némini dixérunt in illis diébus quidquam ex his, quæ víderant.
  "37": Factum est autem in sequénti die, descendéntibus illis de monte, occúrrit illis turba multa.
  "38": 'Et ecce vir de turba exclamávit, dicens: Magíster, óbsecro te, réspice in fílium meum quia únicus est mihi:'
  "39": 'et ecce spíritus apprehéndit eum, et súbito clamat, et elídit, et díssipat eum cum spuma, et vix discédit dilánians eum:'
  "40": et rogávi discípulos tuos ut eícerent illum, et non potuérunt.
  "41": 'Respóndens autem Iesus, dixit: O generátio infidélis, et pervérsa, úsquequo ero apud vos, et pátiar vos? Adduc huc fílium tuum.'
  "42": Et cum accéderet, elísit illum dæmónium, et dissipávit.
  "43": Et increpávit Iesus spíritum immúndum, et sanávit púerum, et réddidit illum patri eius.
  "44": 'Stupébant autem omnes in magnitúdine Dei: omnibúsque mirántibus in ómnibus, quæ faciébat, dixit ad discípulos suos: Pónite vos in córdibus vestris sermónes istos: Fílius enim hóminis futúrum est ut tradátur in manus hóminum.'
  "45": 'At illi ignorábant verbum istud, et erat velátum ante eos ut non sentírent illud: et timébant eum interrogáre de hoc verbo.'
  "46": Intrávit autem cogitátio in eos, quis eórum maior esset.
  "47": At Iesus videns cogitatiónes cordis illórum, apprehéndit púerum, et státuit illum secus se,
  "48": 'et ait illis: Quicúmque suscéperit púerum istum in nómine meo, me récipit: et quicúmque me recéperit, récipit eum, qui me misit. Nam qui minor est inter vos omnes, hic maior est.'
  "49": 'Respóndens autem Ioánnes dixit: Præcéptor, vídimus quemdam in nómine tuo eiciéntem dæmónia, et prohibúimus eum: quia non séquitur nobíscum.'
  "50": 'Et ait ad illum Iesus: Nolíte prohibére: qui enim non est advérsum vos, pro vobis est.'
  "51": Factum est autem dum compleréntur dies assumptiónis eius, et ipse fáciem suam firmávit ut iret in Ierúsalem.
  "52": 'Et misit núntios ante conspéctum suum: et eúntes intravérunt in civitátem Samaritanórum ut parárent illi.'
  "53": Et non recepérunt eum, quia fácies eius erat eúntis in Ierúsalem.
  "54": 'Cum vidíssent autem discípuli eius Iacóbus, et Ioánnes, dixérunt: Dómine, vis dícimus ut ignis descéndat de cælo, et consúmat illos?'
  "55": 'Et convérsus increpávit illos, dicens: Nescítis cuius spíritus estis.'
  "56": Fílius hóminis non venit ánimas pérdere, sed salváre. Et abiérunt in áliud castéllum.
  "57": 'Factum est autem: ambulántibus illis in via, dixit quidam ad illum: Sequar te quocúmque íeris.'
  "58": 'Dixit illi Iesus: Vulpes fóveas habent, et vólucres cæli nidos: Fílius autem hóminis non habet ubi caput reclínet.'
  "59": 'Ait autem ad álterum: Séquere me: ille autem dixit: Dómine, permítte mihi primum ire, et sepelíre patrem meum.'
  "60": 'Dixítque ei Iesus: Sine ut mórtui sepéliant mórtuos suos: tu autem vade, et annúntia regnum Dei.'
  "61": 'Et ait alter: Sequar te Dómine, sed permítte mihi primum renuntiáre his, quæ domi sunt.'
  "62": 'Ait ad illum Iesus: Nemo mittens manum suam ad arátrum, et respíciens retro, aptus est regno Dei.'
