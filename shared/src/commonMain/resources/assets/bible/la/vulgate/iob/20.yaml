bible: vulgate
lang: la
language: Latina
book: Iob
chapter: "20"
verses:
  "1": 'Respóndens autem Sophar Naamathítes, dixit:'
  "2": Idcírco cogitatiónes meæ váriæ succédunt sibi, et mens in divérsa rápitur.
  "3": Doctrínam, qua me árguis, áudiam, et spíritus intelligéntiæ meæ respondébit mihi.
  "4": Hoc scio a princípio, ex quo pósitus est homo super terram,
  "5": quod laus impiórum brevis sit, et gáudium hypócritæ ad instar puncti.
  "6": 'Si ascénderit usque ad cælum supérbia eius, et caput eius nubes tetígerit:'
  "7": 'quasi sterquilínium in fine perdétur: et qui eum víderant, dicent: Ubi est?'
  "8": Velut sómnium ávolans non inveniétur, tránsiet sicut vísio noctúrna.
  "9": Oculus, qui eum víderat, non vidébit, neque ultra intuébitur eum locus suus.
  "10": Fílii eius atteréntur egestáte, et manus illíus reddent ei dolórem suum.
  "11": Ossa eius implebúntur vítiis adolescéntiæ eius, et cum eo in púlvere dórmient.
  "12": Cum enim dulce fúerit in ore eius malum, abscóndet illud sub lingua sua.
  "13": Parcet illi, et non derelínquet illud, et celábit in gútture suo.
  "14": Panis eius in útero illíus vertétur in fel áspidum intrínsecus.
  "15": Divítias, quas devorávit, évomet, et de ventre illíus éxtrahet eas Deus.
  "16": Caput áspidum suget, et occídet eum lingua víperæ.
  "17": (Non vídeat rívulos flúminis, torréntes mellis, et butýri.)
  "18": 'Luet quæ fecit ómnia, nec tamen consumétur: iuxta multitúdinem adinventiónum suárum, sic et sustinébit.'
  "19": 'Quóniam confríngens nudávit páuperes: domum rápuit, et non ædificávit eam.'
  "20": 'Nec est satiátus venter eius: et cum habúerit quæ concupíerat, possidére non póterit.'
  "21": Non remánsit de cibo eius, et proptérea nihil permanébit de bonis eius.
  "22": Cum satiátus fúerit, arctábitur, æstuábit, et omnis dolor írruet super eum.
  "23": Utinam impleátur venter eius, ut emíttat in eum iram furóris sui, et pluat super illum bellum suum.
  "24": Fúgiet arma férrea, et írruet in arcum ǽreum.
  "25": 'Edúctus, et egrédiens de vagína sua, et fúlgurans in amaritúdine sua: vadent, et vénient super eum horríbiles.'
  "26": 'Omnes ténebræ abscónditæ sunt in occúltis eius: devorábit eum ignis, qui non succénditur, affligétur relíctus in tabernáculo suo.'
  "27": Revelábunt cæli iniquitátem eius, et terra consúrget advérsus eum.
  "28": Apértum erit germen domus illíus, detrahétur in die furóris Dei.
  "29": Hæc est pars hóminis ímpii a Deo, et heréditas verbórum eius a Dómino.
