bible: vulgate
lang: la
language: Latina
book: Proverbia
chapter: "21"
verses:
  "1": 'Sicut divisiónes aquárum, ita cor regis in manu Dómini: quocúmque volúerit, inclinábit illud.'
  "2": 'Omnis via viri recta sibi vidétur: appéndit autem corda Dóminus.'
  "3": Fácere misericórdiam et iudícium, magis placet Dómino, quam víctimæ.
  "4": 'Exaltátio oculórum est dilatátio cordis: lucérna impiórum peccátum.'
  "5": 'Cogitatiónes robústi semper in abundántia: omnis autem piger semper in egestáte est.'
  "6": Qui cóngregat thesáuros lingua mendácii, vanus et excors est, et impingétur ad láqueos mortis.
  "7": Rapínæ impiórum détrahent eos, quia noluérunt fácere iudícium.
  "8": 'Pervérsa via viri aliéna est: qui autem mundus est, rectum opus eius.'
  "9": Mélius est sedére in ángulo dómatis, quam cum mulíere litigiósa, et in domo commúni.
  "10": 'Anima ímpii desíderat malum: non miserébitur próximo suo.'
  "11": 'Mulctáto pestilénte sapiéntior erit párvulus: et si sectétur sapiéntem, sumet sciéntiam.'
  "12": Excógitat iustus de domo ímpii, ut détrahat ímpios a malo.
  "13": Qui obtúrat aurem suam ad clamórem páuperis, et ipse clamábit, et non exaudiétur.
  "14": 'Munus abscónditum exstínguit iras: et donum in sinu indignatiónem máximam.'
  "15": 'Gáudium iusto est fácere iudícium: et pavor operántibus iniquitátem.'
  "16": Vir, qui erráverit a via doctrínæ, in cœtu gigántum commorábitur.
  "17": 'Qui díligit épulas, in egestáte erit: qui amat vinum, et pínguia, non ditábitur.'
  "18": 'Pro iusto datur ímpius: et pro rectis iníquus.'
  "19": Mélius est habitáre in terra desérta, quam cum mulíere rixósa et iracúnda.
  "20": 'Thesáurus desiderábilis, et óleum in habitáculo iusti: et imprúdens homo dissipábit illud.'
  "21": Qui séquitur iustítiam et misericórdiam invéniet vitam, iustítiam, et glóriam.
  "22": Civitátem fórtium ascéndit sápiens, et destrúxit robur fidúciæ eius.
  "23": Qui custódit os suum et linguam suam, custódit ab angústiis ánimam suam.
  "24": Supérbus et árrogans vocátur indóctus, qui in ira operátur supérbiam.
  "25": 'Desidéria occídunt pigrum: noluérunt enim quidquam manus eius operári.'
  "26": 'Tota die concupíscit et desíderat: qui autem iustus est, tríbuet, et non cessábit.'
  "27": Hóstiæ impiórum abominábiles, quia offerúntur ex scélere.
  "28": 'Testis mendax períbit: vir obédiens loquétur victóriam.'
  "29": 'Vir ímpius procáciter obfírmat vultum suum: qui autem rectus est, córrigit viam suam.'
  "30": Non est sapiéntia, non est prudéntia, non est consílium contra Dóminum.
  "31": 'Equus parátur ad diem belli: Dóminus autem salútem tríbuit.'
