bible: vulgate
lang: la
language: Latina
book: Iudicum
chapter: "2"
verses:
  "1": 'Ascendítque ángelus Dómini de Gálgalis ad Locum fléntium, et ait: Edúxi vos de Ægýpto, et introdúxi in terram, pro qua iurávi pátribus vestris: et pollícitus sum ut non fácerem írritum pactum meum vobíscum in sempitérnum:'
  "2": 'ita dumtáxat ut non ferirétis fœdus cum habitatóribus terræ huius, sed aras eórum subverterétis: et noluístis audíre vocem meam: cur hoc fecístis?'
  "3": 'Quam ob rem nólui delére eos a fácie vestra: ut habeátis hostes, et dii eórum sint vobis in ruínam.'
  "4": Cumque loquerétur ángelus Dómini hæc verba ad omnes fílios Israel, elevavérunt ipsi vocem suam, et flevérunt.
  "5": 'Et vocátum est nomen loci illíus, Locus fléntium, sive lacrymárum: immolaverúntque ibi hóstias Dómino.'
  "6": 'Dimísit ergo Iósue pópulum, et abiérunt fílii Israel unusquísque in possessiónem suam, ut obtinérent eam:'
  "7": servierúntque Dómino cunctis diébus eius, et seniórum, qui longo post eum vixérunt témpore, et nóverant ómnia ópera Dómini, quæ fécerat cum Israel.
  "8": Mórtuus est autem Iósue fílius Nun, fámulus Dómini, centum et decem annórum,
  "9": et sepeliérunt eum in fínibus possessiónis suæ in Thamnáthsare in monte Ephraim, a septentrionáli plaga montis Gaas.
  "10": 'Omnísque illa generátio congregáta est ad patres suos: et surrexérunt álii, qui non nóverant Dóminum, et ópera quæ fécerat cum Israel.'
  "11": Fecerúntque fílii Israel malum in conspéctu Dómini, et serviérunt Báalim.
  "12": 'Ac dimisérunt Dóminum Deum patrum suórum, qui edúxerat eos de terra Ægýpti, et secúti sunt deos aliénos, deósque populórum, qui habitábant in circúitu eórum, et adoravérunt eos: et ad iracúndiam concitavérunt Dóminum,'
  "13": dimitténtes eum, et serviéntes Baal et Astaroth.
  "14": 'Iratúsque Dóminus contra Israel, trádidit eos in manus diripiéntium: qui cepérunt eos, et vendidérunt hóstibus, qui habitábant per gyrum: nec potuérunt resístere adversáriis suis,'
  "15": sed quocúmque pérgere voluíssent, manus Dómini super eos erat, sicut locútus est, et iurávit eis, et veheménter afflícti sunt.
  "16": 'Suscitavítque Dóminus iúdices, qui liberárent eos de vastántium mánibus: sed nec eos audíre voluérunt,'
  "17": 'fornicántes cum diis aliénis, et adorántes eos. Cito deseruérunt viam, per quam ingréssi fúerant patres eórum: et audiéntes mandáta Dómini, ómnia fecére contrária.'
  "18": Cumque Dóminus iúdices suscitáret, in diébus eórum flectebátur misericórdia, et audiébat afflictórum gémitus, et liberábat eos de cæde vastántium.
  "19": Postquam autem mórtuus esset iudex, revertebántur, et multo faciébant peióra quam fécerant patres eórum, sequéntes deos aliénos, serviéntes eis, et adorántes illos. Non dimisérunt adinventiónes suas, et viam duríssimam, per quam ambuláre consuevérunt.
  "20": 'Iratúsque est furor Dómini in Israel, et ait: Quia írritum fecit gens ista pactum meum, quod pepígeram cum pátribus eórum, et vocem meam audíre contémpsit:'
  "21": 'et ego non delébo gentes, quas dimísit Iósue, et mórtuus est:'
  "22": ut in ipsis expériar Israel, utrum custódiant viam Dómini, et ámbulent in ea, sicut custodiérunt patres eórum, an non.
  "23": Dimísit ergo Dóminus omnes natiónes has, et cito subvértere nóluit, nec trádidit in manus Iósue.
