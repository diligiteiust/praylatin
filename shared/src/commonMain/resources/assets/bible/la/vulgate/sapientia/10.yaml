bible: vulgate
lang: la
language: Latina
book: Sapientia
chapter: "10"
verses:
  "1": Hæc illum, qui primus formátus est a Deo patre orbis terrárum, cum solus esset creátus, custodívit,
  "2": et edúxit illum a delícto suo, et dedit illi virtútem continéndi ómnia.
  "3": Ab hac ut recéssit iniústus in ira sua, per iram homicídii fratérni depériit.
  "4": Propter quem, cum aqua deléret terram, sanávit íterum sapiéntia, per contemptíbile lignum iustum gubérnans.
  "5": Hæc et in consénsu nequítiæ cum se natiónes contulíssent, scivit iustum, et conservávit sine queréla Deo, et in fílii misericórdia fortem custodívit.
  "6": 'Hæc iustum a pereúntibus ímpiis liberávit fugiéntem, descendénte igne in Pentápolim:'
  "7": 'quibus in testimónium nequítiæ fumigabúnda constat desérta terra, et incérto témpore fructus habéntes árbores: et incredíbilis ánimæ memória stans figméntum salis.'
  "8": Sapiéntiam enim prætereúntes, non tantum in hoc lapsi sunt ut ignorárent bona, sed et insipiéntiæ suæ reliquérunt homínibus memóriam, ut in his, quæ peccavérunt, nec latére potuíssent.
  "9": Sapiéntia autem hos, qui se obsérvant, a dolóribus liberávit.
  "10": 'Hæc prófugum iræ fratris iustum dedúxit per vias rectas, et osténdit illi regnum Dei, et dedit illi sciéntiam sanctórum: honestávit illum in labóribus, et complévit labóres illíus.'
  "11": In fraude circumveniéntium illum áffuit illi, et honéstum fecit illum.
  "12": 'Custodívit illum ab inimícis, et a seductóribus tutávit illum: et certámen forte dedit illi ut vínceret, et sciret quóniam ómnium poténtior est sapiéntia.'
  "13": 'Hæc vénditum iustum non derelíquit, sed a peccatóribus liberávit eum: descendítque cum illo in fóveam,'
  "14": 'et in vínculis non derelíquit illum, donec afférret illi sceptrum regni, et poténtiam advérsus eos, qui eum deprimébant: et mendáces osténdit, qui maculavérunt illum, et dedit illi claritátem ætérnam.'
  "15": Hæc pópulum iustum, et semen sine queréla liberávit a natiónibus, quæ illum deprimébant.
  "16": Intrávit in ánimam servi Dei, et stetit contra reges horréndos in porténtis et signis.
  "17": 'Et réddidit iustis mercédem labórum suórum, et dedúxit illos in via mirábili: et fuit illis in velaménto diéi, et in luce stellárum per noctem:'
  "18": tránstulit illos per mare Rubrum, et transvéxit illos per aquam nímiam.
  "19": Inimícos autem illórum demérsit in mare, et ab altitúdine inferórum edúxit illos. Ideo iusti tulérunt spólia impiórum,
  "20": 'et decantavérunt Dómine nomen sanctum tuum, et víctricem manum tuam laudavérunt páriter:'
  "21": quóniam sapiéntia apéruit os mutórum, et linguas infántium fecit disértas.
