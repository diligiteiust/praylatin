bible: vulgate
lang: la
language: Latina
book: Proverbia
chapter: "28"
verses:
  "1": 'Fugit ímpius némine persequénte: iustus autem quasi leo confídens, absque terróre erit.'
  "2": 'Propter peccáta terræ multi príncipes eius: et propter hóminis sapiéntiam, et horum sciéntiam quæ dicúntur, vita ducis lóngior erit.'
  "3": Vir pauper calúmnians páuperes, símilis est imbri veheménti in quo parátur fames.
  "4": 'Qui derelínquunt legem, laudant ímpium: qui custódiunt, succendúntur contra eum.'
  "5": 'Viri mali non cógitant iudícium: qui autem inquírunt Dóminum, animadvértunt ómnia.'
  "6": Mélior est pauper ámbulans in simplicitáte sua, quam dives in pravis itinéribus.
  "7": 'Qui custódit legem, fílius sápiens est: qui autem comessatóres pascit, confúndit patrem suum.'
  "8": Qui coacérvat divítias usúris et fœ́nore, liberáli in páuperes cóngregat eas.
  "9": Qui declínat aures suas ne áudiat legem, orátio eius erit exsecrábilis.
  "10": 'Qui décipit iustos in via mala, in intéritu suo córruet: et símplices possidébunt bona eius.'
  "11": 'Sápiens sibi vidétur vir dives: pauper autem prudens scrutábitur eum.'
  "12": 'In exsultatióne iustórum multa glória est: regnántibus ímpiis, ruínæ hóminum.'
  "13": 'Qui abscóndit scélera sua, non dirigétur: qui autem conféssus fúerit, et relíquerit ea, misericórdiam consequétur.'
  "14": 'Beátus homo, qui semper est pávidus: qui vero mentis est duræ, córruet in malum.'
  "15": Leo rúgiens, et ursus esúriens, princeps ímpius super pópulum páuperem.
  "16": 'Dux índigens prudéntia, multos ópprimet per calúmniam: qui autem odit avarítiam, longi fient dies eius.'
  "17": Hóminem, qui calumniátur ánimæ sánguinem, si usque ad lacum fúgerit, nemo sústinet.
  "18": 'Qui ámbulat simplíciter, salvus erit: qui pervérsis gráditur viis, cóncidet semel.'
  "19": 'Qui operátur terram suam, satiábitur pánibus: qui autem sectátur ótium, replébitur egestáte.'
  "20": 'Vir fidélis multum laudábitur: qui autem festínat ditári, non erit ínnocens.'
  "21": 'Qui cognóscit in iudício fáciem, non bene facit: iste et pro buccélla panis déserit veritátem.'
  "22": Vir qui festínat ditári, et áliis ínvidet, ignórat quod egéstas supervéniet ei.
  "23": Qui córripit hóminem, grátiam póstea invéniet apud eum, magis quam ille, qui per linguæ blandiménta décipit.
  "24": 'Qui súbtrahit áliquid a patre suo, et a matre: et dicit hoc non esse peccátum, párticeps homicídæ est.'
  "25": 'Qui se iactat et dilátat, iúrgia cóncitat: qui vero sperat in Dómino, sanábitur.'
  "26": 'Qui confídit in corde suo, stultus est: qui autem gráditur sapiénter, ipse salvábitur.'
  "27": 'Qui dat páuperi, non indigébit: qui déspicit deprecántem, sustinébit penúriam.'
  "28": 'Cum surréxerint ímpii, abscondéntur hómines: cum illi períerint, multiplicabúntur iusti.'
