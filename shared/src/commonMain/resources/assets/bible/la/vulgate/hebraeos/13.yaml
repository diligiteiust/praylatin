bible: vulgate
lang: la
language: Latina
book: ad Hebraeos
chapter: "13"
verses:
  "1": Cáritas fraternitátis máneat in vobis.
  "2": 'Et hospitalitátem nolíte oblivísci: per hanc enim latuérunt quidam, ángelis hospítio recéptis.'
  "3": 'Mementóte vinctórum, tamquam simul vincti: et laborántium, tamquam et ipsi in córpore morántes.'
  "4": Honorábile connúbium in ómnibus, et thorus immaculátus. Fornicatóres enim, et adúlteros iudicábit Deus.
  "5": 'Sint mores sine avarítia, conténti præséntibus: ipse enim dixit: Non te déseram, neque derelínquam:'
  "6": 'ita ut confidénter dicámus: Dóminus mihi adiútor: non timébo quid fáciat mihi homo.'
  "7": 'Mementóte præpositórum vestrórum, qui vobis locúti sunt verbum Dei: quorum intuéntes éxitum conversatiónis, imitámini fidem.'
  "8": 'Iesus Christus heri, et hódie: ipse et in sǽcula.'
  "9": 'Doctrínis váriis, et peregrínis nolíte abdúci. Optimum est enim grátia stabilíre cor, non escis: quæ non profuérunt ambulántibus in eis.'
  "10": Habémus altáre, de quo édere non habent potestátem, qui tabernáculo desérviunt.
  "11": Quorum enim animálium infértur sanguis pro peccáto in Sancta per pontíficem, horum córpora cremántur extra castra.
  "12": Propter quod et Iesus, ut sanctificáret per suum sánguinem pópulum, extra portam passus est.
  "13": Exeámus ígitur ad eum extra castra, impropérium eius portántes.
  "14": Non enim habémus hic manéntem civitátem, sed futúram inquírimus.
  "15": Per ipsum ergo offerámus hóstiam laudis semper Deo, id est, fructum labiórum confiténtium nómini eius.
  "16": 'Beneficéntiæ autem, et communiónis nolíte oblivísci: tálibus enim hóstiis promerétur Deus.'
  "17": 'Obedíte præpósitis vestris, et subiacéte eis. Ipsi enim pervígilant quasi ratiónem pro animábus vestris redditúri, ut cum gáudio hoc fáciant, et non geméntes: hoc enim non éxpedit vobis.'
  "18": 'Oráte pro nobis: confídimus enim quia bonam consciéntiam habémus in ómnibus bene voléntes conversári.'
  "19": Amplius autem déprecor vos hoc fácere, quo celérius restítuar vobis.
  "20": Deus autem pacis, qui edúxit de mórtuis pastórem magnum óvium, in sánguine testaménti ætérni, Dóminum nostrum Iesum Christum,
  "21": 'aptet vos in omni bono, ut faciátis eius voluntátem: fáciens in vobis quod pláceat coram se per Iesum Christum: cui est glória in sǽcula sæculórum. Amen.'
  "22": Rogo autem vos fratres, ut sufferátis verbum solátii. Etenim perpáucis scripsi vobis.
  "23": 'Cognóscite fratrem nostrum Timótheum dimíssum: cum quo (si celérius vénerit) vidébo vos.'
  "24": Salutáte omnes præpósitos vestros, et omnes sanctos. Salútant vos de Itália fratres.
  "25": Grátia cum ómnibus vobis. Amen.
