bible: vulgate
lang: la
language: Latina
book: I Regum
chapter: "15"
verses:
  "1": Igitur in octávo décimo anno regni Ieróboam fílii Nabat, regnávit Abíam super Iudam.
  "2": 'Tribus annis regnávit in Ierúsalem: nomen matris eius Máacha fília Abéssalom.'
  "3": 'Ambulavítque in ómnibus peccátis patris sui, quæ fécerat ante eum: nec erat cor eius perféctum cum Dómino Deo suo, sicut cor David patris eius.'
  "4": 'Sed propter David dedit ei Dóminus Deus suus lucérnam in Ierúsalem, ut suscitáret fílium eius post eum, et statúeret Ierúsalem:'
  "5": eo quod fecísset David rectum in óculis Dómini, et non declinásset ab ómnibus, quæ præcéperat ei cunctis diébus vitæ suæ, excépto sermóne Uríæ Hethǽi.
  "6": Attamen bellum fuit inter Róboam, et Ieróboam omni témpore vitæ eius.
  "7": Réliqua autem sermónum Abíam, et ómnia quæ fecit, nonne hæc scripta sunt in Libro verbórum diérum regum Iuda? Fuítque prœ́lium inter Abíam et inter Ieróboam.
  "8": 'Et dormívit Abíam cum pátribus suis, et sepeliérunt eum in civitáte David: regnavítque Asa fílius eius pro eo.'
  "9": In anno ergo vigésimo Ieróboam regis Israel regnávit Asa rex Iuda,
  "10": et quadragínta et uno anno regnávit in Ierúsalem. Nomen matris eius Máacha fília Abéssalom.
  "11": 'Et fecit Asa rectum ante conspéctum Dómini, sicut David pater eius:'
  "12": et ábstulit effeminátos de terra, purgavítque univérsas sordes idolórum, quæ fécerant patres eius.
  "13": 'Insuper et Máacham matrem suam amóvit, ne esset princeps in sacris Priápi, et in luco eius, quem consecráverat: subvertítque specum eius, et confrégit simulácrum turpíssimum, et combússit in torrénte Cedron:'
  "14": 'excélsa autem non ábstulit. Verúmtamen cor Asa perféctum erat cum Dómino cunctis diébus suis:'
  "15": et íntulit ea, quæ sanctificáverat pater suus, et vóverat, in domum Dómini, argéntum, et aurum, et vasa.
  "16": Bellum autem erat inter Asa, et Báasa regem Israel cunctis diébus eórum.
  "17": Ascéndit quoque Báasa rex Israel in Iudam, et ædificávit Rama, ut non posset quíspiam égredi vel íngredi de parte Asa regis Iuda.
  "18": 'Tollens ítaque Asa omne argéntum, et aurum, quod remánserat in thesáuris domus Dómini, et in thesáuris domus régiæ, et dedit illud in manus servórum suórum: et misit ad Bénadad fílium Tábremon fílii Hézion, regem Sýriæ, qui habitábat in Damásco, dicens:'
  "19": 'Fœdus est inter me et te, et inter patrem meum et patrem tuum: ídeo misi tibi múnera, argéntum et aurum: et peto ut vénias, et írritum fácias fœdus, quod habes cum Báasa rege Israel, et recédat a me.'
  "20": Acquiéscens Bénadad regi Asa, misit príncipes exércitus sui in civitátes Israel, et percussérunt Ahion, et Dan, et Abeldómum Máacha, et univérsam Cénneroth, omnem scílicet terram Néphthali.
  "21": Quod cum audísset Báasa, intermísit ædificáre Rama, et revérsus est in Thersa.
  "22": 'Rex autem Asa núntium misit in omnem Iudam, dicens: Nemo sit excusátus. Et tulérunt lápides de Rama, et ligna eius, quibus ædificáverat Báasa, et exstrúxit de eis rex Asa Gábaa Béniamin, et Maspha.'
  "23": Réliqua autem ómnium sermónum Asa, et univérsæ fortitúdines eius, et cuncta quæ fecit, et civitátes, quas exstrúxit, nonne hæc scripta sunt in Libro verbórum diérum regum Iuda? Verúmtamen in témpore senectútis suæ dóluit pedes.
  "24": Et dormívit cum pátribus suis, et sepúltus est cum eis in civitáte David patris sui. Regnavítque Iósaphat fílius eius pro eo.
  "25": 'Nadab vero fílius Ieróboam regnávit super Israel anno secúndo Asa regis Iuda: regnavítque super Israel duóbus annis.'
  "26": Et fecit quod malum est in conspéctu Dómini, et ambulávit in viis patris sui, et in peccátis eius, quibus peccáre fecit Israel.
  "27": 'Insidiátus est autem ei Báasa fílius Ahíæ de domo Issachar, et percússit eum in Gébbethon, quæ est urbs Philisthinórum: síquidem Nadab et omnis Israel obsidébant Gébbethon.'
  "28": Interfécit ergo illum Báasa in anno tértio Asa regis Iuda, et regnávit pro eo.
  "29": 'Cumque regnásset, percússit omnem domum Ieróboam: non dimísit ne unam quidem ánimam de sémine eius donec deléret eum, iuxta verbum Dómini, quod locútus fúerat in manu servi sui Ahíæ Silonítis,'
  "30": 'propter peccáta Ieróboam, quæ peccáverat, et quibus peccáre fécerat Israel: et propter delíctum, quo irritáverat Dóminum Deum Israel.'
  "31": Réliqua autem sermónum Nadab, et ómnia quæ operátus est, nonne hæc scripta sunt in Libro verbórum diérum regum Israel?
  "32": Fuítque bellum inter Asa, et Báasa regem Israel, cunctis diébus eórum.
  "33": Anno tértio Asa regis Iuda, regnávit Báasa fílius Ahíæ super omnem Israel in Thersa, vigínti quátuor annis.
  "34": Et fecit malum coram Dómino, ambulavítque in via Ieróboam, et in peccátis eius, quibus peccáre fecit Israel.
