bible: vulgate
lang: la
language: Latina
book: Ezechiel
chapter: "35"
verses:
  "1": 'Et factus est sermo Dómini ad me, dicens:'
  "2": 'Fili hóminis pone fáciem tuam advérsum montem Seir, et prophetábis de eo, et dices illi:'
  "3": 'Hæc dicit Dóminus Deus: Ecce ego ad te mons Seir, et exténdam manum meam super te, et dabo te desolátum atque desértum.'
  "4": 'Urbes tuas demóliar, et tu desértus eris: et scies quia ego Dóminus.'
  "5": Eo quod fúeris inimícus sempitérnus, et conclúseris fílios Israel in manus gládii in témpore afflictiónis eórum, in témpore iniquitátis extrémæ.
  "6": 'Proptérea vivo ego, dicit Dóminus Deus: quóniam sánguini tradam te, et sanguis te persequétur: et cum sánguinem óderis, sanguis persequétur te.'
  "7": 'Et dabo montem Seir desolátum atque desértum: et áuferam de eo eúntem, et redeúntem.'
  "8": 'Et implébo montes eius occisórum suórum: in cóllibus tuis, et in vállibus tuis atque in torréntibus, interfécti gládio cadent.'
  "9": 'In solitúdines sempitérnas tradam te, et civitátes tuæ non habitabúntur: et sciétis quia ego Dóminus Deus.'
  "10": 'Eo quod díxeris: Duæ gentes, et duæ terræ meæ erunt, et hereditáte possidébo eas: cum Dóminus esset ibi:'
  "11": 'proptérea vivo ego, dicit Dóminus Deus, quia fáciam iuxta iram tuam, et secúndum zelum tuum, quem fecísti ódio habens eos: et notus effíciar per eos, cum te iudicávero.'
  "12": 'Et scies quia ego Dóminus audívi univérsa oppróbria tua, quæ locútus es de móntibus Israel, dicens: Desérti, nobis ad devorándum dati sunt.'
  "13": 'Et insurrexístis super me ore vestro, et derogástis advérsum me verba vestra: ego audívi.'
  "14": 'Hæc dicit Dóminus Deus: Lætánte univérsa terra, in solitúdinem te rédigam.'
  "15": 'Sícuti gavísus es super hereditátem domus Israel, eo quod fúerit dissipáta, sic fáciam tibi: dissipátus eris mons Seir, et Idumǽa omnis: et scient quia ego Dóminus.'
