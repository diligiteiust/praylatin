bible: vulgate
lang: la
language: Latina
book: Ieremias
chapter: "17"
verses:
  "1": Peccátum Iuda scriptum est stylo férreo in ungue adamántino, exarátum super latitúdinem cordis eórum, et in córnibus arárum eórum.
  "2": Cum recordáti fúerint fílii eórum arárum suárum, et lucórum suórum, lignorúmque frondéntium, in móntibus excélsis,
  "3": 'sacrificántes in agro: fortitúdinem tuam, et omnes thesáuros tuos in direptiónem dabo, excélsa tua propter peccáta in univérsis fínibus tuis.'
  "4": 'Et relinquéris sola ab hereditáte tua, quam dedi tibi: et servíre te fáciam inimícis tuis in terra, quam ignóras: quóniam ignem succendísti in furóre meo, usque in ætérnum ardébit.'
  "5": 'Hæc dicit Dóminus: Maledíctus homo, qui confídit in hómine, et ponit carnem bráchium suum, et a Dómino recédit cor eius.'
  "6": 'Erit enim quasi myrícæ in desérto, et non vidébit cum vénerit bonum: sed habitábit in siccitáte in desérto, in terra salsúginis et inhabitábili.'
  "7": Benedíctus vir, qui confídit in Dómino, et erit Dóminus fidúcia eius.
  "8": 'Et erit quasi lignum quod transplantátur super aquas, quod ad humórem mittit radíces suas: et non timébit cum vénerit æstus. Et erit fólium eius víride, et in témpore siccitátis non erit sollícitum, nec aliquándo désinet fácere fructum.'
  "9": 'Pravum est cor ómnium, et inscrutábile: quis cognóscet illud?'
  "10": 'Ego Dóminus scrutans cor, et probans renes: qui do unicuíque iuxta viam suam, et iuxta fructum adinventiónum suárum.'
  "11": 'Perdix fovit quæ non péperit: fecit divítias, et non in iudício: in dimídio diérum suórum derelínquet eas, et in novíssimo suo erit insípiens.'
  "12": 'Sólium glóriæ altitúdinis a princípio, locus sanctificatiónis nostræ:'
  "13": 'exspectátio Israel Dómine: omnes, qui te derelínquunt confundéntur: recedéntes a te, in terra scribéntur: quóniam dereliquérunt venam aquárum vivéntium Dóminum.'
  "14": 'Sana me Dómine, et sanábor: salvum me fac, et salvus ero: quóniam laus mea tu es.'
  "15": 'Ecce ipsi dicunt ad me: Ubi est verbum Dómini? véniat.'
  "16": 'Et ego non sum turbátus, te pastórem sequens: et diem hóminis non desiderávi, tu scis: quod egréssum est de lábiis meis, rectum in conspéctu tuo fuit.'
  "17": 'Non sis tu mihi formídini: spes mea tu in die afflictiónis.'
  "18": 'Confundántur qui me persequúntur, et non confúndar ego: páveant illi, et non páveam ego: induc super eos diem afflictiónis, et dúplici contritióne cóntere eos.'
  "19": 'Hæc dicit Dóminus ad me: Vade, et sta in porta filiórum pópuli, per quam ingrediúntur reges Iuda, et egrediúntur, et in cunctis portis Ierúsalem:'
  "20": 'et dices ad eos: Audíte verbum Dómini reges Iuda, et omnis Iuda, cunctíque habitatóres Ierúsalem, qui ingredímini per portas istas.'
  "21": 'Hæc dicit Dóminus: Custodíte ánimas vestras, et nolíte portáre póndera in die sábbati, nec inferátis per portas Ierúsalem.'
  "22": 'Et nolíte eícere ónera de dómibus vestris in die sábbati, et omne opus non faciétis: sanctificáte diem sábbati, sicut præcépi pátribus vestris.'
  "23": 'Et non audiérunt, nec inclinavérunt aurem suam: sed induravérunt cervícem suam, ne audírent me, et ne accíperent disciplínam.'
  "24": 'Et erit: si audiéritis me, dicit Dóminus, ut non inferátis ónera per portas civitátis huius in die sábbati: et si sanctificavéritis diem sábbati, ne faciátis in eo omne opus:'
  "25": 'ingrediéntur per portas civitátis huius reges et príncipes, sedéntes super sólium David, et ascendéntes in cúrribus et equis, ipsi et príncipes eórum, viri Iuda, et habitatóres Ierúsalem: et habitábitur cívitas hæc in sempitérnum.'
  "26": Et vénient de civitátibus Iuda, et de circúitu Ierúsalem, et de terra Béniamin, et de campéstribus, et de montuósis, et ab austro, portántes holocáustum, et víctimam, et sacrifícium, et thus, et ínferent oblatiónem in domum Dómini.
  "27": 'Si autem non audiéritis me ut sanctificétis diem sábbati, et ne portétis onus, et ne inferátis per portas Ierúsalem in die sábbati: succéndam ignem in portis eius, et devorábit domos Ierúsalem, et non exstinguétur.'
