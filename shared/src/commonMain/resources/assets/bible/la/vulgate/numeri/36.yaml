bible: vulgate
lang: la
language: Latina
book: Numeri
chapter: "36"
verses:
  "1": 'Accessérunt autem et príncipes familiárum Gálaad fílii Machir fílii Manásse, de stirpe filiórum Ioseph: locutíque sunt Móysi coram princípibus Israel, atque dixérunt:'
  "2": 'Tibi dómino nostro præcépit Dóminus ut terram sorte divíderes fíliis Israel, et ut filiábus Sálphaad fratris nostri dares possessiónem débitam patri:'
  "3": quas si altérius tribus hómines uxóres accéperint, sequétur posséssio sua, et transláta ad áliam tribum, de nostra hereditáte minuétur.
  "4": Atque ita fiet, ut cum iubilǽus, id est, quinquagésimus annus remissiónis advénerit, confundátur sórtium distribútio, et aliórum posséssio ad álios tránseat.
  "5": 'Respóndit Móyses fíliis Israel, et Dómino præcipiénte ait: Recte tribus filiórum Ioseph locúta est.'
  "6": 'Et hæc lex super filiábus Sálphaad a Dómino promulgáta est: nubant quibus volunt, tantum ut suæ tribus homínibus:'
  "7": 'ne commisceátur posséssio filiórum Israel de tribu in tribum. Omnes enim viri ducent uxóres de tribu et cognatióne sua:'
  "8": 'et cunctæ féminæ de eádem tribu marítos accípient: ut heréditas permáneat in famíliis,'
  "9": nec sibi misceántur tribus, sed ita máneant
  "10": 'ut a Dómino separátæ sunt. Fecerúntque fíliæ Sálphaad ut fúerat imperátum:'
  "11": et nupsérunt Máala, et Thersa, et Hegla, et Melcha, et Noa fíliis pátrui sui
  "12": 'de família Manásse, qui fuit fílius Ioseph: et posséssio, quæ illis fúerat attribúta, mansit in tribu et família patris eárum.'
  "13": Hæc sunt mandáta atque iudícia, quæ mandávit Dóminus per manum Móysi ad fílios Israel, in campéstribus Moab supra Iordánem contra Iéricho.
