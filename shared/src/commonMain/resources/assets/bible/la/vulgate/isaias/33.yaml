bible: vulgate
lang: la
language: Latina
book: Isaias
chapter: "33"
verses:
  "1": 'Væ qui prædáris, nonne et ipse prædáberis? et qui spernis, nonne et ipse spernéris? cum consummáveris deprædatiónem, deprædáberis: cum fatigátus desíeris contémnere, contemnéris.'
  "2": 'Dómine miserére nostri: te enim exspectávimus: esto bráchium nostrum in mane, et salus nostra in témpore tribulatiónis.'
  "3": A voce ángeli fugérunt pópuli, et ab exaltatióne tua dispérsæ sunt gentes.
  "4": Et congregabúntur spólia vestra sicut collígitur bruchus, velut cum fossæ plenæ fúerint de eo.
  "5": 'Magnificátus est Dóminus, quóniam habitávit in excélso: implévit Sion iudício et iustítia.'
  "6": 'Et erit fides in tempóribus tuis: divítiæ salútis sapiéntia et sciéntia: timor Dómini ipse est thesáurus eius.'
  "7": 'Ecce vidéntes clamábunt foris: ángeli pacis amáre flebunt.'
  "8": Dissipátæ sunt viæ, cessávit tránsiens per sémitam, írritum factum est pactum, proiécit civitátes, non reputávit hómines.
  "9": 'Luxit et elánguit terra: confúsus est Líbanus, et obsórduit, et factus est Saron sicut desértum: et concússa est Basan, et Carmélus.'
  "10": 'Nunc consúrgam, dicit Dóminus: nunc exaltábor, nunc sublevábor.'
  "11": 'Concipiétis ardórem, pariétis stípulam: spíritus vester ut ignis vorábit vos.'
  "12": 'Et erunt pópuli quasi de incéndio cinis: spinæ congregátæ igni comburéntur.'
  "13": Audíte qui longe estis, quæ fécerim, et cognóscite vicíni fortitúdinem meam.
  "14": 'Contérriti sunt in Sion peccatóres, possédit tremor hypócritas: quis póterit habitáre de vobis cum igne devoránte? quis habitábit ex vobis cum ardóribus sempitérnis?'
  "15": Qui ámbulat in iustítiis, et lóquitur veritátem, qui próicit avarítiam ex calúmnia, et éxcutit manus suas ab omni múnere, qui obtúrat aures suas ne áudiat sánguinem, et claudit óculos suos ne vídeat malum.
  "16": 'Iste in excélsis habitábit, muniménta saxórum sublímitas eius: panis ei datus est, aquæ eius fidéles sunt.'
  "17": Regem in decóre suo vidébunt óculi eius, cernent terram de longe.
  "18": 'Cor tuum meditábitur timórem: ubi est litterátus? ubi legis verba pónderans? ubi doctor parvulórum?'
  "19": 'Pópulum impudéntem non vidébis, pópulum alti sermónis: ita ut non possis intellígere disertitúdinem linguæ eius, in quo nulla est sapiéntia.'
  "20": 'Réspice Sion civitátem solemnitátis nostræ: óculi tui vidébunt Ierúsalem, habitatiónem opuléntam, tabernáculum quod nequáquam transférri póterit: nec auferéntur clavi eius in sempitérnum, et omnes funículi eius non rumpéntur:'
  "21": 'quia solúmmodo ibi magníficus est Dóminus noster: locus fluviórum rivi latíssimi et paténtes: non transíbit per eum navis rémigum, neque triéris magna transgrediétur eum.'
  "22": 'Dóminus enim iudex noster, Dóminus légifer noster, Dóminus rex noster: ipse salvábit nos.'
  "23": 'Laxáti sunt funículi tui, et non prævalébunt: sic erit malus tuus ut dilatáre signum non queas. Tunc dividéntur spólia prædárum multárum: claudi dirípient rapínam.'
  "24": 'Nec dicet vicínus: Elángui: pópulus qui hábitat in ea, auferétur ab eo iníquitas.'
