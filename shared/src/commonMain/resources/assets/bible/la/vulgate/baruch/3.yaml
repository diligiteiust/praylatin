bible: vulgate
lang: la
language: Latina
book: Baruch
chapter: "3"
verses:
  "1": Et nunc Dómine omnípotens, Deus Israel, ánima in angústiis, et spíritus ánxius clamat ad te.
  "2": 'Audi Dómine, et miserére, quia Deus es miséricors, et miserére nostri: quia peccávimus ante te.'
  "3": Quia tu sedes in sempitérnum, et nos períbimus in ævum?
  "4": Dómine omnípotens, Deus Israel, audi nunc oratiónem mortuórum Israel, et filiórum ipsórum, qui peccavérunt ante te, et non audiérunt vocem Dómini Dei sui, et agglutináta sunt nobis mala.
  "5": 'Noli meminísse iniquitátum patrum nostrórum, sed meménto manus tuæ et nóminis tui in témpore isto:'
  "6": 'quia tu es Dóminus Deus noster, et laudábimus te Dómine:'
  "7": quia propter hoc dedísti timórem tuum in córdibus nostris, et ut invocémus nomen tuum, et laudémus te in captivitáte nostra, quia convértimur ab iniquitáte patrum nostrórum, qui peccavérunt ante te.
  "8": Et ecce nos in captivitáte nostra sumus hódie, qua nos dispersísti in impropérium, et in maledíctum, et in peccátum, secúndum omnes iniquitátes patrum nostrórum, qui recessérunt a te Dómine Deus noster.
  "9": 'Audi Israel mandáta vitæ: áuribus pércipe, ut scias prudéntiam.'
  "10": Quid est Israel quod in terra inimicórum es?
  "11": Inveterásti in terra aliéna, coinquinátus es cum mórtuis, deputátus es cum descendéntibus in inférnum.
  "12": 'Dereliquísti fontem sapiéntiæ:'
  "13": nam si in via Dei ambulásses, habitásses útique in pace sempitérna.
  "14": 'Disce ubi sit prudéntia, ubi sit virtus, ubi sit intelléctus: ut scias simul ubi sit longitúrnitas vitæ et victus, ubi sit lumen oculórum, et pax.'
  "15": Quis invénit locum eius? et quis intrávit in thesáuros eius?
  "16": Ubi sunt príncipes géntium, et qui dominántur super béstias, quæ sunt super terram?
  "17": qui in ávibus cæli ludunt,
  "18": qui argéntum thesaurízant, et aurum, in quo confídunt hómines, et non est finis acquisitiónis eórum? qui argéntum fábricant et sollíciti sunt, nec est invéntio óperum illórum?
  "19": Extermináti sunt, et ad ínferos descendérunt, et álii loco eórum surrexérunt.
  "20": 'Iúvenes vidérunt lumen, et habitavérunt super terram: viam autem disciplínæ ignoravérunt,'
  "21": 'neque intellexérunt sémitas eius, neque fílii eórum suscepérunt eam, a fácie ipsórum longe facta est:'
  "22": non est audíta in terra Chánaan, neque visa est in Theman.
  "23": 'Fílii quoque Agar, qui exquírunt prudéntiam, quæ de terra est, negotiatóres Merrhæ, et Theman, et fabulatóres, et exquisitóres prudéntiæ et intelligéntiæ: viam autem sapiéntiæ nesciérunt, neque commemoráti sunt sémitas eius.'
  "24": O Israel quam magna est domus Dei, et ingens locus possessiónis eius!
  "25": 'Magnus est, et non habet finem: excélsus et imménsus.'
  "26": Ibi fuérunt gigántes nomináti illi, qui ab inítio fuérunt, statúra magna, sciéntes bellum.
  "27": 'Non hos elégit Dóminus, neque viam disciplínæ invenérunt: proptérea periérunt.'
  "28": Et quóniam non habuérunt sapiéntiam, interiérunt propter suam insipiéntiam.
  "29": Quis ascéndit in cælum, et accépit eam, et edúxit eam de núbibus?
  "30": Quis transfretávit mare, et invénit illam, et áttulit illam super aurum eléctum?
  "31": 'Non est qui possit scire vias eius, neque qui exquírat sémitas eius:'
  "32": 'sed qui scit univérsa, novit eam, et adinvénit eam prudéntia sua: qui præparávit terram in ætérno témpore, et replévit eam pecúdibus et quadrupédibus:'
  "33": 'qui emíttit lumen, et vadit: et vocávit illud, et obédit illi in tremóre.'
  "34": 'Stellæ autem dedérunt lumen in custódiis suis, et lætátæ sunt:'
  "35": 'vocátæ sunt, et dixérunt: Adsumus: et luxérunt ei cum iucunditáte, qui fecit illas.'
  "36": Hic est Deus noster, et non æstimábitur álius advérsus eum.
  "37": Hic adinvénit omnem viam disciplínæ, et trádidit illam Iacob púero suo, et Israel dilécto suo.
  "38": Post hæc in terris visus est, et cum homínibus conversátus est.
