bible: vulgate
lang: la
language: Latina
book: I Paralipomenon
chapter: "20"
verses:
  "1": 'Factum est autem post anni círculum, eo témpore, quo solent reges ad bella procédere, congregávit Ioab exércitum, et robur milítiæ, et vastávit terram filiórum Ammon: perrexítque et obsédit Rabba: porro David manébat in Ierúsalem, quando Ioab percússit Rabba et destrúxit eam.'
  "2": 'Tulit autem David corónam Melchom de cápite eius, et invénit in ea auri pondo taléntum, et pretiosíssimas gemmas, fecítque sibi inde diadéma: manúbias quoque urbis plúrimas tulit:'
  "3": 'pópulum autem, qui erat in ea, edúxit, et fecit super eos tríbulas, et trahas, et ferráta carpénta transíre, ita ut dissecaréntur et contereréntur: sic fecit David cunctis úrbibus filiórum Ammon: et revérsus est cum omni pópulo suo in Ierúsalem.'
  "4": Post hæc ínitum est bellum in Gazer advérsum Philisthǽos, in quo percússit Sobóchai Husathítes, Sáphai de génere Ráphaim, et humiliávit eos.
  "5": Aliud quoque bellum gestum est advérsus Philisthǽos, in quo percússit Adeódatus fílius Saltus Bethlehemítes fratrem Góliath Gethǽi, cuius hastæ lignum erat quasi liciatórium texéntium.
  "6": 'Sed et áliud bellum áccidit in Geth, in quo fuit homo longíssimus, senos habens dígitos, id est, simul vigínti quátuor: qui et ipse de Rapha fúerat stirpe generátus.'
  "7": 'Hic blasphemávit Israel: et percússit eum Iónathan fílius Sámaa fratris David. Hi sunt fílii Rapha in Geth, qui cecidérunt in manu David et servórum eius.'
