bible: vulgate
lang: la
language: Latina
book: Isaias
chapter: "30"
verses:
  "1": 'Væ fílii desertóres, dicit Dóminus, ut facerétis consílium, et non ex me: et ordirémini telam, et non per spíritum meum, ut adderétis peccátum super peccátum:'
  "2": qui ambulátis ut descendátis in Ægýptum, et os meum non interrogástis, sperántes auxílium in fortitúdine Pharaónis, et habéntes fidúciam in umbra Ægýpti.
  "3": Et erit vobis fortitúdo Pharaónis in confusiónem, et fidúcia umbræ Ægýpti in ignomíniam.
  "4": Erant enim in Tani príncipes tui, et núntii tui usque ad Hanes pervenérunt.
  "5": 'Omnes confúsi sunt super pópulo, qui eis prodésse non pótuit: non fuérunt in auxílium et in áliquam utilitátem, sed in confusiónem et in oppróbrium.'
  "6": 'Onus iumentórum austri. In terra tribulatiónis et angústiæ leǽna, et leo ex eis, vípera et régulus volans: portántes super húmeros iumentórum divítias suas, et super gibbum camelórum thesáuros suos, ad pópulum qui eis prodésse non póterit.'
  "7": 'Ægýptus enim frustra et vane auxiliábitur. Ideo clamávi super hoc: Supérbia tantum est, quiésce.'
  "8": Nunc ergo ingréssus, scribe ei super buxum, et in libro diligénter éxara illud, et erit in die novíssimo in testimónium usque in ætérnum.
  "9": Pópulus enim ad iracúndiam próvocans est, et fílii mendáces, fílii noléntes audíre legem Dei.
  "10": 'Qui dicunt vidéntibus: Nolíte vidére: et aspiciéntibus: Nolíte aspícere nobis ea, quæ recta sunt: loquímini nobis placéntia, vidéte nobis erróres.'
  "11": Auférte a me viam, declináte a me sémitam, cesset a fácie nostra sanctus Israel.
  "12": 'Proptérea hæc dicit sanctus Israel: Pro eo quod reprobástis verbum hoc, et sperástis in calúmnia et in tumúltu, et inníxi estis super eo:'
  "13": proptérea erit vobis iníquitas hæc sicut interrúptio cadens, et requisíta in muro excélso, quóniam súbito, dum non sperátur, véniet contrítio eius.
  "14": 'Et comminuétur sicut contéritur lagéna fíguli contritióne perválida: et non inveniétur de fragméntis eius testa, in qua portétur ignículus de incéndio, aut hauriátur parum aquæ de fóvea.'
  "15": 'Quia hæc dicit Dóminus Deus sanctus Israel: Si revertámini et quiescátis, salvi éritis: in siléntio et in spe erit fortitúdo vestra. Et noluístis:'
  "16": 'et dixístis: Nequáquam, sed ad equos fugiémus: ídeo fugiétis. Et super velóces ascendémus: ídeo velocióres erunt, qui persequéntur vos.'
  "17": 'Mille hómines a fácie terróris uníus: et a fácie terróris quinque fugiétis, donec relinquámini quasi malus navis in vértice montis, et quasi signum super collem.'
  "18": 'Proptérea exspéctat Dóminus ut misereátur vestri: et ídeo exaltábitur parcens vobis: quia Deus iudícii Dóminus: beáti omnes qui exspéctant eum.'
  "19": 'Pópulus enim Sion habitábit in Ierúsalem: plorans nequáquam plorábis, míserans miserébitur tui: ad vocem clamóris tui statim ut audíerit, respondébit tibi.'
  "20": 'Et dabit vobis Dóminus panem arctum, et aquam brevem: et non fáciet avoláre a te ultra doctórem tuum: et erunt óculi tui vidéntes præceptórem tuum.'
  "21": 'Et aures tuæ áudient verbum post tergum monéntis: Hæc est via, ambuláte in ea, et non declinétis neque ad déxteram, neque ad sinístram.'
  "22": 'Et contaminábis láminas sculptílium argénti tui, et vestiméntum conflátilis auri tui, et dispérges ea sicut immundítiam menstruátæ. Egrédere, dices ei:'
  "23": 'et dábitur plúvia sémini tuo, ubicúmque semináveris in terra, et panis frugum terræ erit ubérrimus, et pinguis: pascétur in possessióne tua in die illo agnus spatióse:'
  "24": et tauri tui, et pulli asinórum, qui operántur terram, commístum migma cómedent sicut in área ventilátum est.
  "25": 'Et erunt super omnem montem excélsum, et super omnem collem elevátum, rivi curréntium aquárum, in die interfectiónis multórum, cum cecíderint turres:'
  "26": et erit lux lunæ sicut lux solis, et lux solis erit septemplíciter sicut lux septem diérum, in die qua alligáverit Dóminus vulnus pópuli sui, et percussúram plagæ eius sanáverit.
  "27": 'Ecce nomen Dómini venit de longínquo, ardens furor eius, et gravis ad portándum: lábia eius repléta sunt indignatióne, et lingua eius quasi ignis dévorans.'
  "28": Spíritus eius velut torrens inúndans usque ad médium colli ad perdéndas gentes in níhilum, et frenum erróris, quod erat in maxíllis populórum.
  "29": Cánticum erit vobis sicut nox sanctificátæ solemnitátis, et lætítia cordis sicut qui pergit cum tíbia, ut intret in montem Dómini ad fortem Israel.
  "30": 'Et audítam fáciet Dóminus glóriam vocis suæ, et terrórem bráchii sui osténdet in comminatióne furóris, et flamma ignis devorántis: allídet in túrbine, et in lápide grándinis.'
  "31": A voce enim Dómini pavébit Assur virga percússus.
  "32": 'Et erit tránsitus virgæ fundátus, quam requiéscere fáciet Dóminus super eum in týmpanis et cítharis: et in bellis præcípuis expugnábit eos.'
  "33": 'Præparáta est enim ab heri Topheth, a rege præparáta, profúnda, et dilatáta. Nutriménta eius, ignis et ligna multa: flatus Dómini sicut torrens súlphuris succéndens eam.'
