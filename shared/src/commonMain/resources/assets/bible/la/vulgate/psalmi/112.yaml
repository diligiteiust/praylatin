bible: vulgate
lang: la
language: Latina
book: Psalmi
chapter: "112"
verses:
  "1": 'Allelúia. Laudáte púeri Dóminum: laudáte nomen Dómini.'
  "2": Sit nomen Dómini benedíctum, ex hoc nunc et usque in sǽculum.
  "3": A solis ortu usque ad occásum, laudábile nomen Dómini.
  "4": Excélsus super omnes gentes Dóminus, et super cælos glória eius.
  "5": Quis sicut Dóminus Deus noster, qui in altis hábitat,
  "6": et humília réspicit in cælo et in terra?
  "7": 'Súscitans a terra ínopem, et de stércore érigens páuperem:'
  "8": ut cóllocet eum cum princípibus, cum princípibus pópuli sui.
  "9": Qui habitáre facit stérilem in domo, matrem filiórum lætántem.
