bible: vulgate
lang: la
language: Latina
book: II Samuelis
chapter: "2"
verses:
  "1": 'Igitur post hæc consúluit David Dóminum, dicens: Num ascéndam in unam de civitátibus Iuda? Et ait Dóminus ad eum: Ascénde. Dixítque David: Quo ascéndam? Et respóndit ei: In Hebron.'
  "2": 'Ascéndit ergo David, et duæ uxóres eius, Achínoam Iezraelítes, et Abígail uxor Nabal Carméli:'
  "3": 'sed et viros, qui erant cum eo, duxit David síngulos cum domo sua: et mansérunt in óppidis Hebron.'
  "4": Venerúntque viri Iuda, et unxérunt ibi David ut regnáret super domum Iuda. Et nuntiátum est David quod viri Iabes Gálaad sepelíssent Saul.
  "5": 'Misit ergo David núntios ad viros Iabes Gálaad, dixítque ad eos: Benedícti vos Dómino, qui fecístis misericórdiam hanc cum dómino vestro Saul, et sepelístis eum.'
  "6": 'Et nunc retríbuet vobis quidem Dóminus misericórdiam et veritátem: sed et ego reddam grátiam, eo quod fecístis verbum istud.'
  "7": 'Conforténtur manus vestræ, et estóte fílii fortitúdinis: licet enim mórtuus sit dóminus vester Saul, tamen me unxit domus Iuda in regem sibi.'
  "8": Abner autem fílius Ner, princeps exércitus Saul, tulit Isboseth fílium Saul, et circumdúxit eum per castra,
  "9": regémque constítuit super Gálaad, et super Géssuri, et super Iézrael, et super Ephraim, et super Béniamin, et super Israel univérsum.
  "10": 'Quadragínta annórum erat Isboseth fílius Saul cum regnáre cœpísset super Israel, et duóbus annis regnávit: sola autem domus Iuda sequebátur David.'
  "11": Et fuit númerus diérum, quos commorátus est David ímperans in Hebron super domum Iuda, septem annórum et sex ménsium.
  "12": Egressúsque est Abner fílius Ner, et púeri Isboseth fílii Saul, de castris in Gábaon.
  "13": 'Porro Ioab fílius Sárviæ, et púeri David, egréssi sunt, et occurrérunt eis iuxta piscínam Gábaon. Et cum in unum conveníssent, e regióne sedérunt: hi ex una parte piscínæ, et illi ex áltera.'
  "14": 'Dixítque Abner ad Ioab: Surgant púeri, et ludant coram nobis. Et respóndit Ioab: Surgant.'
  "15": Surrexérunt ergo, et transiérunt número duódecim de Béniamin, ex parte Isboseth fílii Saul, et duódecim de púeris David.
  "16": 'Apprehensóque unusquísque cápite cómparis sui, defíxit gládium in latus contrárii, et cecidérunt simul: vocatúmque est nomen loci illíus: Ager robustórum, in Gábaon.'
  "17": 'Et ortum est bellum durum satis in die illa: fugatúsque est Abner, et viri Israel a púeris David.'
  "18": 'Erant autem ibi tres fílii Sárviæ, Ioab, et Abísai, et Asael: porro Asael cursor velocíssimus fuit, quasi unus de cápreis, quæ morántur in silvis.'
  "19": Persequebátur autem Asael Abner, et non declinávit ad dextram neque ad sinístram omíttens pérsequi Abner.
  "20": 'Respéxit ítaque Abner post tergum suum, et ait: Tune es Asael? Qui respóndit: Ego sum.'
  "21": 'Dixítque ei Abner: Vade ad dextram, sive ad sinístram, et apprehénde unum de adolescéntibus, et tolle tibi spólia eius. Nóluit autem Asael omíttere quin urgéret eum.'
  "22": 'Rursúmque locútus est Abner ad Asael: Recéde, noli me sequi, ne compéllar confódere te in terram, et leváre non pótero fáciem meam ad Ioab fratrem tuum.'
  "23": 'Qui audíre contémpsit, et nóluit declináre: percússit ergo eum Abner avérsa hasta in ínguine, et transfódit, et mórtuus est in eódem loco: omnésque qui transíbant per locum illum, in quo cecíderat Asael, et mórtuus erat, subsistébant.'
  "24": 'Persequéntibus autem Ioab, et Abísai fugiéntem Abner, sol occúbuit: et venérunt usque ad Collem aquædúctus, qui est ex advérso vallis itíneris desérti in Gábaon.'
  "25": 'Congregatíque sunt fílii Béniamin ad Abner: et conglobáti in unum cúneum, stetérunt in summitáte túmuli uníus.'
  "26": 'Et exclamávit Abner ad Ioab, et ait: Num usque ad interneciónem tuus mucro desǽviet? an ignóras quod periculósa sit desperátio? úsquequo non dicis pópulo ut omíttat pérsequi fratres suos?'
  "27": 'Et ait Ioab: Vivit Dóminus, si locútus fuísses, mane recessísset pópulus pérsequens fratrem suum.'
  "28": Insónuit ergo Ioab búccina, et stetit omnis exércitus, nec persecúti sunt ultra Israel, neque iniére certámen.
  "29": 'Abner autem et viri eius abiérunt per campéstria, tota nocte illa: et transiérunt Iordánem, et lustráta omni Béthoron, venérunt ad castra.'
  "30": 'Porro Ioab revérsus, omísso Abner, congregávit omnem pópulum: et defuérunt de púeris David decem et novem viri, excépto Asaéle.'
  "31": Servi autem David percussérunt de Béniamin, et de viris, qui erant cum Abner, trecéntos sexagínta, qui et mórtui sunt.
  "32": 'Tulerúntque Asael, et sepeliérunt eum in sepúlcro patris sui in Béthlehem: et ambulavérunt tota nocte Ioab et viri qui erant cum eo, et in ipso crepúsculo pervenérunt in Hebron.'
