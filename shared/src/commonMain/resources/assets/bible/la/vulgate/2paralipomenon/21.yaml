bible: vulgate
lang: la
language: Latina
book: II Paralipomenon
chapter: "21"
verses:
  "1": 'Dormívit autem Iósaphat cum pátribus suis, et sepúltus est cum eis in civitáte David: regnavítque Ioram fílius eius pro eo.'
  "2": 'Qui hábuit fratres fílios Iósaphat, Azaríam, et Iáhiel, et Zacharíam, et Azaríam, et Míchael, et Saphatíam: omnes hi fílii Iósaphat regis Iuda.'
  "3": 'Dedítque eis pater suus multa múnera argénti, et auri, et pensitatiónes, cum civitátibus munitíssimis in Iuda: regnum autem trádidit Ioram, eo quod esset primogénitus.'
  "4": 'Surréxit ergo Ioram super regnum patris sui: cumque se confirmásset, occídit omnes fratres suos gládio, et quosdam de princípibus Israel.'
  "5": Trigínta duórum annórum erat Ioram cum regnáre cœpísset, et octo annis regnávit in Ierúsalem.
  "6": 'Ambulavítque in viis regum Israel, sicut égerat domus Achab: fília quippe Achab erat uxor eius, et fecit malum in conspéctu Dómini.'
  "7": 'Nóluit autem Dóminus dispérdere domum David propter pactum, quod iníerat cum eo: et quia promíserat ut daret ei lucérnam, et fíliis eius omni témpore.'
  "8": In diébus illis rebellávit Edom, ne esset súbditus Iudæ, et constítuit sibi regem.
  "9": Cumque transísset Ioram cum princípibus suis, et cuncto equitátu, qui erat secum, surréxit nocte, et percússit Edom, qui se circumdéderat, et omnes duces equitátus eius.
  "10": 'Attamen rebellávit Edom, ne esset sub ditióne Iuda usque ad hanc diem: eo témpore et Lobna recéssit ne esset sub manu illíus. Derelíquerat enim Dóminum Deum patrum suórum:'
  "11": ínsuper et excélsa fabricátus est in úrbibus Iuda, et fornicári fecit habitatóres Ierúsalem, et prævaricári Iudam.
  "12": 'Allátæ sunt autem ei lítteræ ab Elía prophéta, in quibus scriptum erat: Hæc dicit Dóminus Deus David patris tui: Quóniam non ambulásti in viis Iósaphat patris tui, et in viis Asa regis Iuda,'
  "13": 'sed incessísti per iter regum Israel, et fornicári fecísti Iudam, et habitatóres Ierúsalem, imitátus fornicatiónem domus Achab, ínsuper et fratres tuos, domum patris tui, melióres te, occidísti:'
  "14": ecce Dóminus percútiet te plaga magna cum pópulo tuo, et fíliis, et uxóribus tuis, universáque substántia tua.
  "15": Tu autem ægrotábis péssimo languóre úteri tui, donec egrediántur vitália tua paulátim per síngulos dies.
  "16": Suscitávit ergo Dóminus contra Ioram spíritum Philisthinórum, et Arabum, qui confínes sunt Æthiópibus.
  "17": 'Et ascendérunt in terram Iuda, et vastavérunt eam, diripuerúntque cunctam substántiam, quæ invénta est in domo regis, ínsuper et fílios eius, et uxóres: nec remánsit ei fílius, nisi Ióachaz, qui mínimus natu erat.'
  "18": Et super hæc ómnia percússit eum Dóminus alvi languóre insanábili.
  "19": 'Cumque diéi succéderet dies, et témporum spátia volveréntur, duórum annórum explétus est círculus: et sic longa consúmptus tabe, ita ut egéreret étiam víscera sua, languóre páriter, et vita cáruit. Mortuúsque est in infirmitáte péssima, et non fecit ei pópulus secúndum morem combustiónis exséquias, sicut fécerat maióribus eius.'
  "20": 'Trigínta duórum annórum fuit cum regnáre cœpísset, et octo annis regnávit in Ierúsalem. Ambulavítque non recte, et sepeliérunt eum in civitáte David: verúmtamen non in sepúlcro regum.'
