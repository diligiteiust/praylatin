bible: vulgate
lang: la
language: Latina
book: Nehemiae
chapter: "11"
verses:
  "1": 'Habitavérunt autem príncipes pópuli in Ierúsalem: réliqua vero plebs misit sortem, ut tóllerent unam partem de decem, qui habitatúri essent in Ierúsalem civitáte sancta, novem vero partes in civitátibus.'
  "2": Benedíxit autem pópulus ómnibus viris, qui se sponte obtúlerant ut habitárent in Ierúsalem.
  "3": Hi sunt ítaque príncipes provínciæ, qui habitavérunt in Ierúsalem, et in civitátibus Iuda. Habitávit autem unusquísque in possessióne sua, in úrbibus suis, Israel, sacerdótes, Levítæ, Nathinǽi, et fílii servórum Salomónis.
  "4": 'Et in Ierúsalem habitavérunt de fíliis Iuda, et de fíliis Béniamin: de fíliis Iuda, Athaías fílius Azíam, fílii Zacharíæ, fílii Amaríæ, fílii Saphatíæ, fílii Maláleel: de fíliis Phares,'
  "5": 'Maasía fílius Baruch, fílius Cholhóza, fílius Hazía, fílius Adaía, fílius Ióiarib, fílius Zacharíæ, fílius Silonítis:'
  "6": omnes hi fílii Phares, qui habitavérunt in Ierúsalem, quadringénti sexagínta octo viri fortes.
  "7": 'Hi sunt autem fílii Béniamin: Sellum fílius Mosóllam, fílius Ioed, fílius Phadaía, fílius Colaía, fílius Masía, fílius Etheel, fílius Isaía,'
  "8": et post eum Gébbai, Séllai, nongénti vigínti octo,
  "9": et Ioel fílius Zechri præpósitus eórum, et Iudas fílius Sénua super civitátem secúndus.
  "10": Et de sacerdótibus, Idaía fílius Ióarib, Iachin,
  "11": Saraía fílius Helcíæ, fílius Mosóllam, fílius Sadoc, fílius Méraioth, fílius Achitob princeps domus Dei,
  "12": 'et fratres eórum faciéntes ópera templi: octingénti vigínti duo. Et Adaía fílius Iéroham, fílius Phelelía, fílius Amsi, fílius Zacharíæ, fílius Pheshur, fílius Melchíæ,'
  "13": 'et fratres eius príncipes patrum: ducénti quadragínta duo. Et Amássai fílius Azreel, fílius Aházi, fílius Mosóllamoth, fílius Emmer,'
  "14": 'et fratres eórum poténtes nimis: centum vigínti octo, et præpósitus eórum Zábdiel fílius poténtium.'
  "15": Et de Levítis, Semeía fílius Hasub, fílius Azarícam, fílius Hasabía, fílius Boni,
  "16": et Sabáthai et Iózabed, super ómnia ópera, quæ erant forínsecus in domo Dei, a princípibus Levitárum.
  "17": 'Et Mathanía fílius Micha, fílius Zebédei, fílius Asaph, princeps ad laudándum, et ad confiténdum in oratióne, et Becbecía secúndus de frátribus eius, et Abda fílius Sámua, fílius Galal, fílius Idithum:'
  "18": omnes Levítæ in civitáte sancta ducénti octogínta quátuor.
  "19": 'Et ianitóres, Accub, Telmon, et fratres eórum, qui custodiébant óstia: centum septuagínta duo.'
  "20": Et réliqui ex Israel sacerdótes et Levítæ in univérsis civitátibus Iuda, unusquísque in possessióne sua.
  "21": Et Nathinǽi, qui habitábant in Ophel, et Síaha, et Gaspha de Nathinǽis.
  "22": Et epíscopus Levitárum in Ierúsalem, Azzi fílius Bani, fílius Hasabíæ, fílius Mathaníæ, fílius Michæ. De fíliis Asaph, cantóres in ministério domus Dei.
  "23": Præcéptum quippe regis super eos erat, et ordo in cantóribus per dies síngulos,
  "24": et Phathahía fílius Mesézebel, de fíliis Zara fílii Iuda in manu regis, iuxta omne verbum pópuli,
  "25": 'et in dómibus per omnes regiónes eórum. De fíliis Iuda habitavérunt in Cariathárbe, et in filiábus eius: et in Dibon, et in filiábus eius: et in Cábseel, et in vículis eius:'
  "26": et in Iésue, et in Mólada, et in Béthphaleth,
  "27": et in Hasérsual, et in Bersabée, et in filiábus eius,
  "28": et in Síceleg, et in Móchona, et in filiábus eius,
  "29": et in Remmon, et in Sáraa, et in Iérimuth,
  "30": Zánoa, Odóllam, et in villis eárum, Lachis et regiónibus eius, et Azéca, et filiábus eius. Et mansérunt in Bersabée usque ad vallem Ennom.
  "31": 'Fílii autem Béniamin, a Geba, Mechmas, et Hai, et Bethel, et filiábus eius:'
  "32": Anathoth, Nob, Ananía,
  "33": Asor, Rama, Géthaim,
  "34": Hadid, Séboim, et Nebállat, Lod,
  "35": et Ono valle artíficum.
  "36": Et de Levítis portiónes Iudæ et Béniamin.
