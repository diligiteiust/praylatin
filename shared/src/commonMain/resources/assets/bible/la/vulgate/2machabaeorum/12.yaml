bible: vulgate
lang: la
language: Latina
book: II Machabaeorum
chapter: "12"
verses:
  "1": His factis pactiónibus, Lýsias pergébat ad regem, Iudǽi autem agricultúræ óperam dabant.
  "2": Sed hi, qui reséderant, Timótheus, et Apollónius Gennǽi fílius, sed et Hierónymus, et Démophon super hos, et Nicánor Cypriárches, non sinébant eos in siléntio ágere, et quiéte.
  "3": 'Ioppítæ vero tale quoddam flagítium perpetrárunt: rogavérunt Iudǽos, cum quibus habitábant, ascéndere scaphas, quas paráverant, cum uxóribus, et fíliis, quasi nullis inimicítiis inter eos subiacéntibus.'
  "4": 'Secúndum commúne ítaque decrétum civitátis, et ipsis acquiescéntibus, pacísque causa nihil suspéctum habéntibus: cum in altum processíssent, submersérunt non minus ducéntos.'
  "5": 'Quam crudelitátem Iudas in suæ gentis hómines factam ut cognóvit, præcépit viris, qui erant cum ipso: et invocáto iusto iúdice Deo,'
  "6": venit advérsus interfectóres fratrum, et portum quidem noctu succéndit, scaphas exússit, eos autem, qui ab igne refúgerant, gládio perémit.
  "7": Et cum hæc ita egísset, discéssit quasi íterum reversúrus, et univérsos Ioppítas eradicatúrus.
  "8": Sed cum cognovísset et eos, qui erant Iámniæ, velle pari modo fácere habitántibus secum Iudǽis,
  "9": 'Iamnítis quoque nocte supervénit, et portum cum návibus succéndit: ita ut lumen ignis apparéret Ierosólymis a stádiis ducéntis quadragínta.'
  "10": Inde cum iam abiíssent novem stádiis, et iter fácerent ad Timótheum, commisérunt cum eo Arabes quinque míllia viri, et équites quingénti.
  "11": Cumque pugna válida fíeret, et auxílio Dei próspere cessísset, resídui Arabes victi petébant a Iuda dextram sibi dari, promitténtes se páscua datúros, et in céteris profutúros.
  "12": 'Iudas autem arbitrátus vere in multis eos útiles, promísit pacem: dextrísque accéptis, discessére ad tabernácula sua.'
  "13": 'Aggréssus est autem et civitátem quamdam firmam póntibus murísque circumséptam, quæ a turbis habitabátur géntium promiscuárum: cui nomen Casphin.'
  "14": Hi vero, qui intus erant, confidéntes in stabilitáte murórum, et apparátu alimoniárum, remíssius agébant, maledíctis lacesséntes Iudam, et blasphemántes, ac loquéntes quæ fas non est.
  "15": 'Machabǽus autem, invocáto magno mundi Príncipe, qui sine ariétibus et máchinis tempóribus Iesu præcipitávit Iéricho, írruit feróciter muris:'
  "16": et capta civitáte per Dómini voluntátem, innumerábiles cædes fecit, ita ut ádiacens stagnum stadiórum duórum latitúdinis, sánguine interfectórum flúere viderétur.
  "17": 'Inde discessérunt stádia septingénta quinquagínta, et venérunt in Cháraca ad eos, qui dicúntur Tubianǽi, Iudǽos:'
  "18": et Timótheum quidem in illis locis non comprehendérunt, nullóque negótio perfécto regréssus est, relícto in quodam loco firmíssimo præsídio.
  "19": Dosítheus autem et Sosípater, qui erant duces cum Machabǽo, peremérunt a Timótheo relíctos in præsídio, decem míllia viros.
  "20": At Machabǽus, ordinátis circum se sex míllibus, et constitútis per cohórtes, advérsus Timótheum procéssit, habéntem secum centum vigínti míllia péditum, equitúmque duo míllia quingéntos.
  "21": 'Cógnito autem Iudæ advéntu, Timótheus præmísit mulíeres, et fílios, et réliquum apparátum, in præsídium, quod Cárnion dícitur: erat enim inexpugnábile, et accéssu diffícile propter locórum angústias.'
  "22": 'Cumque cohors Iudæ prima apparuísset, timor hóstibus incússus est ex præséntia Dei, qui univérsa cónspicit: et in fugam versi sunt álius ab álio, ita ut magis a suis deiceréntur, et gladiórum suórum íctibus debilitaréntur.'
  "23": Iudas autem veheménter instábat púniens profános, et prostrávit ex eis trigínta míllia virórum.
  "24": 'Ipse vero Timótheus íncidit in partes Dosíthei, et Sosípatris: et multis précibus postulábat ut vivus dimitterétur, eo quod multórum ex Iudǽis paréntes habéret ac fratres, quos morte eius décipi eveníret.'
  "25": Et cum fidem dedísset restitutúrum se eos secúndum constitútum, illǽsum eum dimisérunt propter fratrum salútem.
  "26": Iudas autem egréssus est ad Cárnion, interféctis vigínti quinque míllibus.
  "27": 'Post horum fugam, et necem, movit exércitum ad Ephron civitátem munítam, in qua multitúdo diversárum géntium habitábat: et robústi iúvenes pro muris consisténtes fórtiter repugnábant: in hac autem máchinæ multæ, et telórum erat apparátus.'
  "28": 'Sed cum Omnipoténtem invocássent, qui potestáte sua vires hóstium confríngit, cepérunt civitátem: et ex eis, qui intus erant, vigínti quinque míllia prostravérunt.'
  "29": Inde ad civitátem Scythárum abiérunt, quæ ab Ierosólymis sexcéntis stádiis áberat.
  "30": 'Contestántibus autem his, qui apud Scythopolítas erant, Iudǽis, quod benígne ab eis haberéntur, étiam tempóribus infelicitátis quod modéste secum égerint:'
  "31": grátias agéntes eis, et exhortáti étiam de cétero erga genus suum benígnos esse, venérunt Ierosólymam die solémni septimanárum instánte.
  "32": Et post Pentecósten abiérunt contra Górgiam præpósitum Idumǽæ.
  "33": Exívit autem cum pedítibus tribus míllibus, et equítibus quadringéntis.
  "34": Quibus congréssis, cóntigit paucos rúere Iudæórum.
  "35": 'Dosítheus vero quidam de Bacénoris eques, vir fortis, Górgiam tenébat: et, cum vellet illum cápere vivum, eques quidam de Thrácibus írruit in eum, humerúmque eius amputávit: atque ita Górgias effúgit in Marésa.'
  "36": 'At illis, qui cum Esdrim erant, diútius pugnántibus et fatigátis, invocávit Iudas Dóminum adiutórem, et ducem belli fíeri:'
  "37": incípiens voce pátria, et cum hymnis clamórem extóllens, fugam Górgiæ milítibus incússit.
  "38": 'Iudas autem collécto exércitu venit in civitátem Odóllam: et cum séptima dies superveníret, secúndum consuetúdinem purificáti, in eódem loco sábbatum egérunt.'
  "39": Et sequénti die venit cum suis Iudas, ut córpora prostratórum tólleret, et cum paréntibus póneret in sepúlcris patérnis.
  "40": 'Invenérunt autem sub túnicis interfectórum de donáriis idolórum, quæ apud Iámniam fuérunt, a quibus lex próhibet Iudǽos: ómnibus ergo maniféstum factum est, ob hanc causam eos corruísse.'
  "41": Omnes ítaque benedixérunt iustum iudícium Dómini, qui occúlta fécerat manifésta.
  "42": Atque ita ad preces convérsi, rogavérunt ut id, quod factum erat, delíctum oblivióni traderétur. At vero fortíssimus Iudas hortabátur pópulum conserváre se sine peccáto, sub óculis vidéntes quæ facta sunt pro peccátis eórum, qui prostráti sunt.
  "43": Et facta collatióne, duódecim míllia drachmas argénti misit Ierosólymam offérri pro peccátis mortuórum sacrifícium, bene et religióse de resurrectióne cógitans
  "44": (nisi enim eos, qui cecíderant, resurrectúros speráret, supérfluum viderétur, et vanum oráre pro mórtuis),
  "45": et quia considerábat quod hi, qui cum pietáte dormitiónem accéperant, óptimam habérent repósitam grátiam.
  "46": Sancta ergo et salúbris est cogitátio pro defúnctis exoráre, ut a peccátis solvántur.
