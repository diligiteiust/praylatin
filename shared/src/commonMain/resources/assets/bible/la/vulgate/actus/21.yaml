bible: vulgate
lang: la
language: Latina
book: Actus Apostolorum
chapter: "21"
verses:
  "1": Cum autem factum esset ut navigarémus abstrácti ab eis, recto cursu vénimus Coum, et sequénti die Rhodum, et inde Pátaram.
  "2": Et cum invenissémus navem transfretántem in Phœnícen, ascendéntes navigávimus.
  "3": 'Cum apparuissémus autem Cypro, relinquéntes eam ad sinístram, navigávimus in Sýriam, et vénimus Tyrum: ibi enim navis expositúra erat onus.'
  "4": 'Invéntis autem discípulis, mánsimus ibi diébus septem: qui Paulo dicébant per Spíritum ne ascénderet Ierosólymam.'
  "5": 'Et explétis diébus, profécti ibámus, deducéntibus nos ómnibus cum uxóribus, et fíliis usque foras civitátem: et pósitis génibus in líttore, orávimus.'
  "6": 'Et cum valefecissémus ínvicem, ascéndimus navem: illi autem rediérunt in sua.'
  "7": 'Nos vero navigatióne expléta a Tyro descéndimus Ptolemáidam: et salutátis frátribus, mánsimus die una apud illos.'
  "8": Alia autem die profécti, vénimus Cæsaréam. Et intrántes domum Philíppi evangelístæ, qui erat unus de septem, mánsimus apud eum.
  "9": Huic autem erant quátuor fíliæ vírgines prophetántes.
  "10": Et cum morarémur per dies áliquot, supervénit quidam a Iudǽa prophéta, nómine Agabus.
  "11": 'Is cum venísset ad nos, tulit zonam Pauli: et álligans sibi pedes, et manus, dixit: Hæc dicit Spíritus sanctus: Virum, cuius est zona hæc, sic alligábunt in Ierúsalem Iudǽi, et tradent in manus géntium.'
  "12": Quod cum audissémus, rogabámus nos, et qui loci illíus erant, ne ascénderet Ierosólymam.
  "13": 'Tunc respóndit Paulus, et dixit: Quid fácitis flentes, et affligéntes cor meum? Ego enim non solum alligári, sed et mori in Ierúsalem parátus sum propter nomen Dómini Iesu.'
  "14": 'Et cum ei suadére non possémus, quiévimus, dicéntes: Dómini volúntas fiat.'
  "15": Post dies autem istos, præparáti ascendebámus in Ierúsalem.
  "16": Venérunt autem et ex discípulis a Cæsaréa nobíscum, adducéntes secum apud quem hospitarémur Mnasónem quemdam Cýprium, antíquum discípulum.
  "17": Et cum venissémus Ierosólymam, libénter excepérunt nos fratres.
  "18": Sequénti autem die introíbat Paulus nobíscum ad Iacóbum, omnésque collécti sunt senióres.
  "19": Quos cum salutásset, narrábat per síngula, quæ Deus fecísset in géntibus per ministérium ipsíus.
  "20": 'At illi cum audíssent, magnificábant Deum, dixerúntque ei: Vides frater, quot míllia sunt in Iudǽis, qui credidérunt, et omnes æmulatóres sunt legis.'
  "21": 'Audiérunt autem de te quia discessiónem dóceas a Móyse eórum, qui per gentes sunt, Iudæórum: dicens non debére eos circumcídere fílios suos, neque secúndum consuetúdinem íngredi.'
  "22": 'Quid ergo est? útique opórtet conveníre multitúdinem: áudient enim te supervenísse.'
  "23": 'Hoc ergo fac quod tibi dícimus: Sunt nobis viri quátuor, votum habéntes super se.'
  "24": 'His assúmptis, sanctífica te cum illis: et impénde in illis ut radant cápita: et scient omnes, quia quæ de te audiérunt, falsa sunt, sed ámbulas et ipse custódiens legem.'
  "25": De his autem, qui credidérunt ex géntibus, nos scrípsimus, iudicántes ut abstíneant se ab idólis immoláto, et sánguine, et suffocáto, et fornicatióne.
  "26": Tunc Paulus, assúmptis viris, póstera die purificátus cum illis intrávit in templum, annúntians expletiónem diérum purificatiónis, donec offerrétur pro unoquóque eórum oblátio.
  "27": 'Dum autem septem dies consummaréntur, hi, qui de Asia erant Iudǽi, cum vidíssent eum in templo, concitavérunt omnem pópulum, et iniecérunt ei manus, clamántes:'
  "28": 'Viri Israelítæ, adiuváte: hic est homo, qui advérsus pópulum, et legem, et locum hunc, omnes ubíque docens, ínsuper et gentíles indúxit in templum, et violávit sanctum locum istum.'
  "29": Víderant enim Tróphimum Ephésium in civitáte cum ipso, quem æstimavérunt quóniam in templum introduxísset Paulus.
  "30": 'Commotáque est cívitas tota, et facta est concúrsio pópuli. Et apprehendéntes Paulum, trahébant eum extra templum: et statim clausæ sunt iánuæ.'
  "31": Quæréntibus autem eum occídere, nuntiátum est tribúno cohórtis quia tota confúnditur Ierúsalem.
  "32": Qui statim assúmptis milítibus, et centuriónibus, decúrrit ad illos. Qui cum vidíssent tribúnum, et mílites, cessavérunt percútere Paulum.
  "33": 'Tunc accédens tribúnus apprehéndit eum, et iussit eum alligári caténis duábus: et interrogábat quis esset, et quid fecísset.'
  "34": Alii autem áliud clamábant in turba. Et cum non posset certum cognóscere præ tumúltu, iussit duci eum in castra.
  "35": Et cum venísset ad gradus, cóntigit ut portarétur a milítibus propter vim pópuli.
  "36": 'Sequebátur enim multitúdo pópuli, clamans: Tolle eum.'
  "37": 'Et cum cœpísset indúci in castra Paulus, dicit tribúno: Si licet mihi loqui áliquid ad te? Qui dixit: Græce nosti?'
  "38": Nonne tu es Ægýptius, qui ante hos dies tumúltum concitásti, et eduxísti in desértum quátuor míllia virórum sicariórum?
  "39": 'Et dixit ad eum Paulus: Ego homo sum quidem Iudǽus a Tarso Cilíciæ, non ignótæ civitátis múniceps. Rogo autem te, permítte mihi loqui ad pópulum.'
  "40": 'Et cum ille permisísset, Paulus stans in grádibus, ánnuit manu ad plebem, et magno siléntio facto, allocútus est lingua Hebrǽa, dicens:'
