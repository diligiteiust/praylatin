bible: vulgate
lang: la
language: Latina
book: Ezechiel
chapter: "28"
verses:
  "1": 'Et factus est sermo Dómini ad me, dicens:'
  "2": 'Fili hóminis, dic príncipi Tyri: Hæc dicit Dóminus Deus: Eo quod elevátum est cor tuum, et dixísti: Deus ego sum, et in cáthedra Dei sedi in corde maris: cum sis homo, et non Deus, et dedísti cor tuum quasi cor Dei.'
  "3": 'Ecce sapiéntior es tu Daniéle: omne secrétum non est abscónditum a te.'
  "4": 'In sapiéntia et prudéntia tua fecísti tibi fortitúdinem: et acquisísti aurum, et argéntum in thesáuris tuis.'
  "5": In multitúdine sapiéntiæ tuæ, et in negotiatióne tua multiplicásti tibi fortitúdinem, et elevátum est cor tuum in róbore tuo.
  "6": 'Proptérea hæc dicit Dóminus Deus: Eo quod elevátum est cor tuum quasi cor Dei:'
  "7": 'idcírco ecce ego addúcam super te aliénos, robustíssimos géntium: et nudábunt gládios suos super pulchritúdinem sapiéntiæ tuæ, et pólluent decórem tuum.'
  "8": 'Interfícient, et détrahent te: et moriéris in intéritu occisórum in corde maris.'
  "9": 'Numquid dicens loquéris: Deus ego sum, coram interficiéntibus te: cum sis homo, et non Deus, in manu occidéntium te?'
  "10": 'Morte incircumcisórum moriéris in manu alienórum: quia ego locútus sum, ait Dóminus Deus.'
  "11": 'Et factus est sermo Dómini ad me, dicens: Fili hóminis leva planctum super regem Tyri:'
  "12": 'et dices ei: Hæc dicit Dóminus Deus: Tu signáculum similitúdinis, plenus sapiéntia, et perféctus decóre,'
  "13": 'in delíciis paradísi Dei fuísti: omnis lapis pretiósus operiméntum tuum: sárdius, topázius, et iaspis, chrysólithus, et onyx, et berýllus, sapphírus, et carbúnculus, et smarágdus: aurum opus decóris tui: et forámina tua in die, qua cónditus es, præparáta sunt.'
  "14": Tu cherub exténtus, et prótegens, et pósui te in monte sancto Dei, in médio lápidum ignitórum ambulásti.
  "15": Perféctus in viis tuis a die conditiónis tuæ, donec invénta est iníquitas in te.
  "16": 'In multitúdine negotiatiónis tuæ repléta sunt interióra tua iniquitáte, et peccásti: et eiéci te de monte Dei, et pérdidi te o cherub prótegens, de médio lápidum ignitórum.'
  "17": 'Et elevátum est cor tuum in decóre tuo: perdidísti sapiéntiam tuam in decóre tuo, in terram proiéci te: ante fáciem regum dedi te ut cérnerent te.'
  "18": 'In multitúdine iniquitátum tuárum, et iniquitáte negotiatiónis tuæ polluísti sanctificatiónem tuam: prodúcam ergo ignem de médio tui, qui cómedat te, et dabo te in cínerem super terram, in conspéctu ómnium vidéntium te.'
  "19": 'Omnes, qui víderint te in géntibus, obstupéscent super te: níhili factus es, et non eris in perpétuum.'
  "20": 'Et factus est sermo Dómini ad me, dicens:'
  "21": 'Fili hóminis pone fáciem tuam contra Sidónem, et prophetábis de ea:'
  "22": 'et dices: Hæc dicit Dóminus Deus: Ecce ego ad te Sidon, et glorificábor in médio tui: et scient quia ego Dóminus, cum fécero in ea iudícia, et sanctificátus fúero in ea.'
  "23": 'Et immíttam ei pestiléntiam, et sánguinem in platéis eius: et córruent interfécti in médio eius gládio per circúitum: et scient quia ego Dóminus.'
  "24": 'Et non erit ultra dómui Israel offendículum amaritúdinis, et spina dolórem ínferens úndique per circúitum eórum, qui adversántur eis: et scient quia ego Dóminus Deus.'
  "25": 'Hæc dicit Dóminus Deus: Quando congregávero domum Israel de pópulis, in quibus dispérsi sunt, sanctificábor in eis coram géntibus: et habitábunt in terra sua, quam dedi servo meo Iacob.'
  "26": 'Et habitábunt in ea secúri: et ædificábunt domos, et plantábunt víneas, et habitábunt confidénter, cum fécero iudícia in ómnibus, qui adversántur eis per circúitum: et scient quia ego Dóminus Deus eórum.'
