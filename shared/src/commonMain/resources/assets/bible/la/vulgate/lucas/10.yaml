bible: vulgate
lang: la
language: Latina
book: Lucas
chapter: "10"
verses:
  "1": 'Post hæc autem designávit Dóminus et álios septuagínta duos: et misit illos binos ante fáciem suam in omnem civitátem et locum, quo erat ipse ventúrus.'
  "2": 'Et dicébat illis: Messis quidem multa, operárii autem pauci. Rogáte ergo dóminum messis ut mittat operários in messem suam.'
  "3": 'Ite: ecce ego mitto vos sicut agnos inter lupos.'
  "4": Nolíte portáre sácculum, neque peram, neque calceaménta, et néminem per viam salutavéritis.
  "5": 'In quamcúmque domum intravéritis, primum dícite: Pax huic dómui:'
  "6": 'et si ibi fúerit fílius pacis, requiéscet super illum pax vestra: sin autem, ad vos revertétur.'
  "7": 'In eádem autem domo manéte, edéntes et bibéntes quæ apud illos sunt: dignus est enim operárius mercéde sua. Nolíte transíre de domo in domum.'
  "8": 'Et in quamcúmque civitátem intravéritis, et suscéperint vos, manducáte quæ apponúntur vobis:'
  "9": 'et curáte infírmos, qui in illa sunt, et dícite illis: Appropinquávit in vos regnum Dei.'
  "10": 'In quamcúmque autem civitátem intravéritis, et non suscéperint vos, exeúntes in platéas eius, dícite:'
  "11": 'Etiam púlverem, qui adhǽsit nobis de civitáte vestra, extérgimus in vos: tamen hoc scitóte, quia appropinquávit regnum Dei.'
  "12": Dico vobis, quia Sódomis in die illa remíssius erit, quam illi civitáti.
  "13": 'Væ tibi Corózain, væ tibi Bethsáida: quia si in Tyro, et Sidóne factæ fuíssent virtútes, quæ factæ sunt in vobis, olim in cilício, et cínere sedéntes pœnitérent.'
  "14": Verúmtamen Tyro, et Sidóni remíssius erit in iudício, quam vobis.
  "15": Et tu Caphárnaum, usque ad cælum exaltáta, usque ad inférnum demergéris.
  "16": 'Qui vos audit, me audit: et qui vos spernit, me spernit. Qui autem me spernit, spernit eum, qui misit me.'
  "17": 'Revérsi sunt autem septuagínta duo cum gáudio, dicéntes: Dómine, étiam dæmónia subiciúntur nobis in nómine tuo.'
  "18": 'Et ait illis: Vidébam Sátanam sicut fulgur de cælo cadéntem.'
  "19": 'Ecce dedi vobis potestátem calcándi supra serpéntes, et scorpiónes, et super omnem virtútem inimíci: et nihil vobis nocébit.'
  "20": 'Verúmtamen in hoc nolíte gaudére quia spíritus vobis subiciúntur: gaudéte autem, quod nómina vestra scripta sunt in cælis.'
  "21": 'In ipsa hora exsultávit Spíritu sancto, et dixit: Confíteor tibi Pater, Dómine cæli et terræ, quod abscondísti hæc a sapiéntibus, et prudéntibus, et revelásti ea párvulis. Etiam Pater: quóniam sic plácuit ante te.'
  "22": 'Omnia mihi trádita sunt a Patre meo. Et nemo scit quis sit Fílius, nisi Pater: et quis sit Pater, nisi Fílius, et cui volúerit Fílius reveláre.'
  "23": 'Et convérsus ad discípulos suos, dixit: Beáti óculi, qui vident quæ vos vidétis.'
  "24": 'Dico enim vobis, quod multi prophétæ, et reges voluérunt vidére quæ vos vidétis, et non vidérunt: et audíre quæ audítis, et non audiérunt.'
  "25": 'Et ecce quidam legisperítus surréxit tentans illum, et dicens: Magíster, quid faciéndo vitam ætérnam possidébo?'
  "26": 'At ille dixit ad eum: In lege quid scriptum est? quómodo legis?'
  "27": 'Ille respóndens dixit: Díliges Dóminum Deum tuum ex toto corde tuo, et ex tota ánima tua, et ex ómnibus víribus tuis, et ex omni mente tua: et próximum tuum sicut teípsum.'
  "28": 'Dixítque illi: Recte respondísti: hoc fac, et vives.'
  "29": 'Ille autem volens iustificáre seípsum, dixit ad Iesum: Et quis est meus próximus?'
  "30": 'Suscípiens autem Iesus, dixit: Homo quidam descendébat ab Ierúsalem in Iéricho, et íncidit in latrónes, qui étiam despoliavérunt eum: et plagis impósitis abiérunt semivívo relícto.'
  "31": 'Accidit autem ut sacérdos quidam descénderet eádem via: et viso illo præterívit.'
  "32": Simíliter et Levíta, cum esset secus locum, et vidéret eum, pertránsiit.
  "33": 'Samaritánus autem quidam iter fáciens, venit secus eum: et videns eum, misericórdia motus est.'
  "34": 'Et apprópians alligávit vúlnera eius, infúndens óleum, et vinum: et impónens illum in iuméntum suum, duxit in stábulum, et curam eius egit.'
  "35": 'Et áltera die prótulit duos denários, et dedit stabulário, et ait: Curam illíus habe: et quodcúmque supererogáveris, ego cum redíero reddam tibi.'
  "36": Quis horum trium vidétur tibi próximus fuísse illi, qui íncidit in latrónes?
  "37": 'At ille dixit: Qui fecit misericórdiam in illum. Et ait illi Iesus: Vade, et tu fac simíliter.'
  "38": 'Factum est autem, dum irent, et ipse intrávit in quoddam castéllum: et múlier quædam, Martha nómine, excépit illum in domum suam:'
  "39": et huic erat soror nómine María, quæ étiam sedens secus pedes Dómini, audiébat verbum illíus.
  "40": 'Martha autem satagébat circa frequens ministérium: quæ stetit, et ait: Dómine, non est tibi curæ quod soror mea relíquit me solam ministráre? dic ergo illi ut me ádiuvet.'
  "41": 'Et respóndens dixit illi Dóminus: Martha, Martha, sollícita es, et turbáris erga plúrima.'
  "42": Porro unum est necessárium. María óptimam partem elégit, quæ non auferétur ab ea.
