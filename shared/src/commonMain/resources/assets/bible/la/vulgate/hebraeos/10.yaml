bible: vulgate
lang: la
language: Latina
book: ad Hebraeos
chapter: "10"
verses:
  "1": 'Umbram enim habens lex futurórum bonórum, non ipsam imáginem rerum: per síngulos annos eísdem ipsis hóstiis, quas ófferunt indesinénter, numquam potest accedéntes perféctos fácere:'
  "2": 'alióquin cessássent offérri: ídeo quod nullam habérent ultra consciéntiam peccáti, cultóres semel mundáti:'
  "3": sed in ipsis commemorátio peccatórum per síngulos annos fit.
  "4": Impossíbile enim est sánguine taurórum et hircórum auférri peccáta.
  "5": 'Ideo ingrédiens mundum dicit: Hóstiam, et oblatiónem noluísti: corpus autem aptásti mihi:'
  "6": holocautómata pro peccáto non tibi placuérunt.
  "7": 'Tunc dixi: Ecce vénio: in cápite libri scriptum est de me: Ut fáciam, Deus, voluntátem tuam.'
  "8": 'Supérius dicens: Quia hóstias, et oblatiónes, et holocautómata pro peccáto noluísti, nec plácita sunt tibi, quæ secúndum legem offerúntur,'
  "9": 'tunc dixi: Ecce vénio, ut fáciam, Deus, voluntátem tuam: aufert primum, ut sequens státuat.'
  "10": In qua voluntáte sanctificáti sumus per oblatiónem córporis Iesu Christi semel.
  "11": 'Et omnis quidem sacérdos præsto est quotídie minístrans, et eásdem sæpe ófferens hóstias, quæ numquam possunt auférre peccáta:'
  "12": hic autem unam pro peccátis ófferens hóstiam, in sempitérnum sedet in déxtera Dei,
  "13": de cétero exspéctans donec ponántur inimíci eius scabéllum pedum eius.
  "14": Una enim oblatióne, consummávit in sempitérnum sanctificátos.
  "15": 'Contestátur autem nos et Spíritus sanctus. Postquam enim dixit:'
  "16": 'Hoc autem testaméntum, quod testábor ad illos post dies illos, dicit Dóminus, dando leges meas in córdibus eórum, et in méntibus eórum superscríbam eas:'
  "17": et peccatórum, et iniquitátum eórum iam non recordábor ámplius.
  "18": 'Ubi autem horum remíssio: iam non est oblátio pro peccáto.'
  "19": Habéntes ítaque fratres fidúciam in intróitu sanctórum in sánguine Christi,
  "20": quam initiávit nobis viam novam, et vivéntem per velámen, id est, carnem suam,
  "21": 'et sacerdótem magnum super domum Dei:'
  "22": accedámus cum vero corde in plenitúdine fídei, aspérsi corda a consciéntia mala, et ablúti corpus aqua munda,
  "23": teneámus spei nostræ confessiónem indeclinábilem (fidélis enim est qui repromísit),
  "24": 'et considerémus ínvicem in provocatiónem caritátis, et bonórum óperum:'
  "25": non deseréntes collectiónem nostram, sicut consuetúdinis est quibúsdam, sed consolántes, et tanto magis quanto vidéritis appropinquántem diem.
  "26": Voluntárie enim peccántibus nobis post accéptam notítiam veritátis, iam non relínquitur pro peccátis hóstia,
  "27": terríbilis autem quædam exspectátio iudícii, et ignis æmulátio, quæ consumptúra est adversários.
  "28": 'Irritam quis fáciens legem Móysi, sine ulla miseratióne duóbus vel tribus téstibus móritur:'
  "29": quanto magis putátis deterióra meréri supplícia qui Fílium Dei conculcáverit, et sánguinem testaménti pollútum dúxerit, in quo sanctificátus est, et spirítui grátiæ contuméliam fécerit?
  "30": 'Scimus enim qui dixit: Mihi vindícta, et ego retríbuam. Et íterum: Quia iudicábit Dóminus pópulum suum.'
  "31": Horréndum est incídere in manus Dei vivéntis.
  "32": 'Rememorámini autem prístinos dies, in quibus illumináti, magnum certámen sustinuístis passiónum:'
  "33": 'et in áltero quidem oppróbriis, et tribulatiónibus spectáculum facti: in áltero autem sócii táliter conversántium effécti.'
  "34": Nam et vinctis compássi estis, et rapínam bonórum vestrórum cum gáudio suscepístis, cognoscéntes vos habére meliórem et manéntem substántiam.
  "35": Nolíte ítaque amíttere confidéntiam vestram, quæ magnam habet remuneratiónem.
  "36": 'Patiéntia enim vobis necessária est: ut voluntátem Dei faciéntes, reportétis promissiónem.'
  "37": Adhuc enim módicum aliquántulum, qui ventúrus est, véniet, et non tardábit.
  "38": 'Iustus autem meus ex fide vivit: quod si subtráxerit se, non placébit ánimæ meæ.'
  "39": Nos autem non sumus subtractiónis fílii in perditiónem, sed fídei in acquisitiónem ánimæ.
