title: Litania do św. Józefa
lang: pl
language: Polski
dates:
  - "* * * 19 3 ? *"
tags:
  - Litania
  - Święty Józef
lines:
  - "@litkyrie"
  - ^^^
  - Święta Maryjo, __módl się za nami.__
  - Święty Józefie,...
  - Przesławny potomku Dawida,...
  - Światłości Patriarchów,...
  - Oblubieńcze Bogarodzicy,...
  - Przeczysty Stróżu Dziewicy,...
  - Żywicielu Syna Bożego,...
  - Troskliwy Obrońco Chrystusa,...
  - Głowo Najświętszej Rodziny,...
  - Józefie najsprawiedliwszy,...
  - Józefie najczystszy,...
  - Józefie najroztropniejszy,...
  - Józefie najmężniejszy,...
  - Józefie najposłuszniejszy,...
  - Józefie najwierniejszy,...
  - Zwierciadło sprawiedliwości,...
  - Miłośniku ubóstwa,...
  - Wzorze pracujących,...
  - Ozdobo życia rodzinnego,...
  - Opiekunie dziewic,...
  - Podporo rodzin,...
  - Pociecho nieszczęśliwych,...
  - Nadziejo chorych,...
  - Patronie umierających,...
  - Postrachu duchów piekielnych,...
  - Opiekunie Kościoła świętego,...
  - ^^^
  - "@litagnus"
  - ^^^
  - "__K:__ Ustanowił go panem domu swego."
  - "__W:__ I zarządcą wszystkich posiadłości swoich."
  - ^^^
  - "__Módlmy się:__"
  - Boże, któryś w niewysłowionej Opatrzności
  - raczył wybrać Józefa na Oblubieńca Najświętszej Rodzicielki swojej;
  - spraw, prosimy, abyśmy zasłużyli na jego orędownictwo w niebie,
  - gdy jako opiekuna czcimy go na ziemi,
  - który żyjesz i królujesz na wieki wieków.
  - Amen.
