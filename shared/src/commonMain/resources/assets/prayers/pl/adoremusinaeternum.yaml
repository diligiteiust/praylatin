title: Uwielbiajmy na wieki
lang: pl
language: Polski
tags:
  - Najświętszy Sacrament
  - Pieśn
lines:
  - Uwielbiajmy na wieki Przenajświętszy Sakrament.
  - Chwalcie Pana wszystkie narody,
  - chwalcie go wszystkie ludy.
  - Bo możne jest nad nami miłosierdzie jego,
  - a prawda Pańska trwa na wieki.
  -
  - Uwielbiajmy na wieki Przenajświętszy Sakrament.
  - Chwała Ojcu, i Synowi,
  - i Duchowi Świętemu.
  - Jak była na początku, teraz i zawsze,
  - i na wieki wieków.
  -
  - Uwielbiajmy na wieki Przenajświętszy Sakrament.
