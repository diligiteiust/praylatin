title: Modlitwa na wtorek
lang: pl
language: Polski
tags:
  - Hide
lines:
  - >
    __Panie Jezu Chryste,__ błagamy Cię o łaskę ochrony pod osłoną płaszcza Maryjnego, abyśmy byli 
    otoczeni świętym wrzosem Twej korony cierniowej i poprzez moc Ducha Świętego abyśmy byli
    nasyceni Twą najdroższą krwią wraz z Aniołami Stróżami w chwale Boga Ojca. Amen.
