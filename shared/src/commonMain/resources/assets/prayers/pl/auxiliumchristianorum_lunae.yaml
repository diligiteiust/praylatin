title: Modlitwa na poniedziałek
lang: pl
language: Polski
tags:
  - Hide
lines:
  - >
    __Panie Jezu Chryste,__ prosimy Cię, okryj nasze rodziny i całe nasze mienie Twą miłością 
    i osłoń nas Twoją najdroższą krwią. Otocz nas Twymi Aniołami Niebiańskimi, wszystkimi świętymi 
    i płaszczem naszej Matki Błogosławionej. Amen.
