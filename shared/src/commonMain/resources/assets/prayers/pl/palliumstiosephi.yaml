  - "### WEZWANIA DO ŚWIĘTEGO JÓZEFA"
  - ^^^
  - >
    a). Pomnij, o najczystszy Oblubieńcze Błogosławionej Dziewicy Maryi, mój najmilszy
    Opiekunie, święty Józefie, że nigdy nie słyszano, aby ktokolwiek, kto ucieka się pod Twoją
    opiekę i błaga o Twą pomoc, pozostał bez pociechy. Tą ufnością ożywiony przychodzę do
    Ciebie. Nie odrzucaj mojej modlitwy, przybrany Ojcze Odkupiciela, ale racz ją przyjąć
    łaskawie i wysłuchać. Amen.
  - >
    b). Chwalebny święty Józefie, Oblubieńcze Najświętszej Dziewicy Maryi, Dziewiczy
    Opiekunie Jezusa, nie zapomnij o mnie i czuwaj nade mną. Naucz mnie kroczyć drogą
    prowadzącą do świętości. Wejrzyj na moje modlitwy i otaczaj mnie zawsze swoją ojcowską
    opieką. Usuń wszystkie przeszkody i trudności stojące na drodze mojej modlitwy i spraw,
    niech wysłuchanie mej prośby będzie na większą chwałę Bożą i dla mojego zbawienia.
    W dowód mojej ogromnej wdzięczności, obiecuję głosić Twoją chwałę i dziękować Bogu za
    udzielenie Ci tak wielkiej mocy pośrednictwa zarówno w niebie, jak i na ziemi. Amen.
  - ^^^
  - "@@litstioseph"
  - ^^^
  - "### MODLITWA NA ZAKOŃCZENIE KAŻDEGO DNIA NOWENNY"
  - ^^^
  - >
    Chwalebny Patriarcho, święty Józefie, Ciebie Bóg wybrał jako Głowę i Opiekuna
    Najświętszej Rodziny: proszę Cię, byś osłaniał mnie zawsze płaszczem swej opieki.
    Wybieram Cię dziś na mojego Ojca, Orędownika, Towarzysza i Opiekuna. Błagam, abyś
    mnie przyjął pod swoją opiekę: wszystko, czym jestem i co posiadam, moje całe życie i moją
    śmierć.
  - >
    Wejrzyj na mnie jako swe dziecko i broń mnie od zasadzek nieprzyjaciół widzialnych i
    niewidzialnych. Wspomagaj mnie w każdej potrzebie. Pocieszaj w gorzkich cierpieniach, a
    szczególnie bądź przy mnie w godzinie walki śmiertelnej. Wstawiaj się za mną do Boskiego
    Odkupiciela, którego jako Dziecię mogłeś tulić w swych ramionach, oraz do Najświętszej
    Dziewicy Maryi, Twej Najczystszej Oblubienicy.
  - >
    Udziel mi tych łask, które doprowadzą mnie do wiecznego zbawienia. Zalicz mnie do grona
    Twych czcicieli, ponieważ chcę słuchać Twoich rad i być wdzięcznym za Twą pomoc i
    wsparcie. Amen.
  - >
    Święty Józefie, niewinny i czysty, pozwól mi być Twym dzieckiem. Zachowaj mnie czystym
    na ciele i duszy, abym pozostawał w stanie łaski Bożej. Święty Józefie, Opiekunie,
    Oblubieńcze Najświętszej Maryi Panny, bądź moim przewodnikiem i doradcą, pomóż mi
    pozostać wiernym Bogu.
  - ^^^
