  - Niech będzie pochwalony Jezus Chrystus. Na wieki wieków. Amen
notes: |
  Nowenna ta, to jakby okrycie się płaszczem opieki świętego Józefa, to nadzwyczajne
  nabożeństwo ku Jego czci, wyjednujące Jego szczególne wstawiennictwo w trudnych
  sytuacjach. Wszystkie te modlitwy należy odmawiać codziennie przez trzydzieści dni, na
  wspomnienie trzydziestu lat, które święty Józef przeżył w Nazarecie z Jezusem, Synem
  Bożym i Jego Matką, Najświętszą Maryją Panną.
