  - "### 30-DNIOWE NABOŻEŃSTWO KU CZCI ŚWIĘTEGO JÓZEFA"
  - ^^^
  - "@signumcrucis"
  - ^^^
  - Jezu, Maryjo i Józefie, oświecajcie nas, pomagajcie nam, ratujcie nas. Amen.
  - ^^^
  - "@gloriapatri"
  - "@gloriapatri"
  - "@gloriapatri"
  - ^^^
  - "### OFIAROWANIE SIĘ OPIECE ŚWIĘTEGO JÓZEFA"
  - ^^^
  - >
    __O chwalebny Patriarcho,__ święty Józefie, z pokorą upadam przed Tobą. Z wielką czcią
    oddaję się pod Twą przemożną opiekę i proszę cały Dwór Niebieski, aby był przy mnie.
    Zobowiązuję się do najszczerszej wiary i pobożności oraz przyrzekam czynić wszystko to, co
    jest w mojej mocy, aby Cię czcić przez całe życie i okazywać Ci miłość.
  - >
    Dopomóż mi w tym święty Józefie. Bądź przy mnie teraz oraz wyjednaj mi łaskę odejścia z 
    tego świata podobnie jak Ty, w objęciach Jezusa i Maryi, abym mógł pewnego dnia razem z 
    Tobą osiągnąć wieczną szczęśliwość w niebie. Amen.
  - ^^^
  - >
    __Chwalebny Patriarcho,__ święty Józefie, z pobożnym oddaniem i sercem przepełnionym
    miłością, zanoszę tę szczerą modlitwę do Twoich stóp i rozmyślam nad Twoimi licznymi
    cnotami. Potężny Patriarcho, jak w Starym Testamencie Józef, syn Jakuba, wypełniał wolę
    Boga, tak Ty podążasz jego drogą w Nowym Testamencie. Opromienia Cię nie tylko
    wspaniałe światło Boskiego Słońca, lecz także łagodne światło mistycznego księżyca - Maryi.
    Jakub wyruszył w drogę do Egiptu, aby pogratulować swemu synowi Józefowi - rządcy w
    Egipcie. Za przykładem ojca podążyli wszyscy jego synowie.
  - ^^^
  - >
    Niewypowiedzianie piękniejszym jest jednak przykład Jezusa i Maryi, którzy otaczali Ciebie
    wielkim szacunkiem i oddaniem. Z wielką przeto czcią i ufnością pragniemy zwracać się do
    Ciebie we wszystkich naszych potrzebach tak doczesnych, jak i duchowych, pewni, że Twój
    Syn, który zawsze był Ci posłuszny na ziemi, wysłucha Cię także w niebie.
  - >
    I tak jak Józef, syn Jakuba, nie odepchnął swoich winnych braci, lecz pełen miłości ich
    przygarnął, ochronił i uratował przed głodem i śmiercią, tak i Ty, o święty Józefie, nie
    pozostań obojętnym na moje modlitwy. Poprzez Twoje wstawiennictwo uproś mi tę łaskę,
    aby Bóg nie pozostawiał mnie samego na tym łez padole, lecz zawsze zaliczał do tych, którzy
    w życiu i w chwili śmierci są nieustannie ogarnięci płaszczem Twej przemożnej opieki.
  - ^^^
  - "### MODLITWY:"
  - ^^^
  - >
    __Bądź pozdrowiony, święty Józefie,__ któremu powierzono bezcenne Skarby nieba i ziemi.
    Bądź pozdrowiony, przybrany Ojcze Tego, który karmi wszystkie stworzenia świata. Ty
    bowiem po Maryi, spośród świętych, jesteś godzien naszej największej czci i miłości, bo
    zostałeś wybrany do najwyższej godności wychowywania, karmienia, a nawet trzymania na
    rękach Mesjasza, którego tak wielu królów i proroków pragnęło choćby tylko zobaczyć.
    O święty Józefie, ratuj moją duszę i wyproś mi u Miłosiernego Boga tę łaskę, o którą
    pokornie proszę: _(Należy wymienić swoją prośbę)._
  - >
    Uproś także dla dusz czyśćcowych ulgę w ich cierpieniu. Amen.
  - ^^^
  - "@gloriapatri"
  - "@gloriapatri"
  - "@gloriapatri"
  - ^^^
  - >
    __Święty Józefie, Kościół czci Ciebie,__ jako swego Patrona, Opiekuna i Obrońcę. Spośród
    wszystkich świętych wołam do Ciebie, najpotężniejszego Opiekuna słabych i potrzebujących
    pomocy, i po tysiąckroć wysławiam łaskawość Twego serca, które zawsze gotowe jest nieść
    pomoc wszystkim potrzebującym.
  - >
    Do Ciebie, święty Józefie, zwracają się wdowy i sieroty, opuszczeni, zasmuceni i
    potrzebujący na całej ziemi. Nie ma takiej boleści, troski czy potrzeby, wobec których
    pozostałbyś obojętny. Mój najdroższy Opiekunie w niebie, którego Bóg obdarzył
    szczególnymi łaskami, uciekam się do Ciebie, przedstawiając Ci moją prośbę. Uproś mi tę
    łaskę, o którą Cię gorąco proszę. Również wy, wszystkie Dusze w czyśćcu cierpiące,
    błagajcie świętego Józefa o wstawiennictwo za mną. Amen.
  - ^^^
  - "@gloriapatri"
  - "@gloriapatri"
  - "@gloriapatri"
  - ^^^
  - >
    __Pomnij, o najczystszy Oblubieńcze Maryi,__ o mój najmilszy Opiekunie Józefie święty, że
    nigdy nie słyszano, aby ktokolwiek wzywając Twej opieki. Twej pomocy błagając, pozostał
    bez pociechy. O pełen miłości święty Józefie, Ty znasz moje potrzeby i pragnienia. Żaden
    człowiek, nawet ten najlepszy, nie może zrozumieć mojego problemu i rzeczywiście mi
    pomóc. Posłuszny nauczaniu świętej Teresy, staję przed Tobą, o święty Józefie, i błagam o
    Twe przemożne wstawiennictwo w moich obecnych trudnościach. Święta Teresa, Twoja
    oddana czcicielka, powiedziała: „Biedni grzesznicy, bez względu na wielkość waszych
    potrzeb, zwróćcie się o pomoc do świętego Józefa! Idźcie do Józefa ze szczerą pewnością i
    spokojem, że wasze prośby będą wysłuchane".
  - >
    O święty Józefie, pocieszycielu zatroskanych, przyjdź mi z pomocą w moim utrapieniu i
    obejmij moją modlitwą także Dusze czyśćcowe, aby dzięki niej mogły one wkrótce osiągnąć
    radość i świętość. Amen.
  - ^^^
  - "@gloriapatri"
  - "@gloriapatri"
  - "@gloriapatri"
  - ^^^
  - >
    __O Ty, wywyższony Święty,__ przez Twoje całkowite posłuszeństwo wobec Boga miej litość
    nade mną.
  - "* Przez Twoje święte i zasłużone życie wysłuchaj mojego błagania."
  - "* Przez Twoje umiłowane imię pomóż mi."
  - "* Przez łagodność i siłę Twojego serca strzeż mnie."
  - "* Przez Twoje święte łzy umacniaj mnie."
  - "* Przez siedem boleści Twoich zlituj się nade mną."
  - "* Przez siedem radości Twoich pociesz moje serce."
  - "* Od wszelkiego zła na ciele i duszy uwolnij mnie."
  - "* Z każdej biedy i nędzy wyratuj mnie."
  - "* Wyproś dla mnie litościwie łaskę Bożą."
  - "* Wyjednaj dla Dusz w czyśćcu cierpiących szybkie wybawienie z ich cierpień. Amen."
  - ^^^
  - "@gloriapatri"
  - "@gloriapatri"
  - "@gloriapatri"
  - ^^^
  - >
    __O święty Józefie, niezliczone są łaski,__ które otrzymali modlący się do Ciebie. Chorzy,
    uciskani, cierpiący niesprawiedliwość, zdradzeni, opuszczeni - wszyscy, którzy się oddali pod
    Twoją opiekę, uzyskali pomoc w swoich potrzebach.
  - >
    Święty Józefie, nie pozwól, proszę, abym był jedynym spośród wszystkich zwracających się
    do Ciebie, który nie został wysłuchany. Okaż się hojnym i łaskawym także dla mnie. Za to,
    pełen wdzięczności, zawsze będę Cię czcił, o chwalebny święty Józefie, mój Opiekunie i
    Wybawco Dusz w czyśćcu cierpiących. Amen.
  - ^^^
  - "@gloriapatri"
  - "@gloriapatri"
  - "@gloriapatri"
  - ^^^
  - >
    __O Boże i Ojcze wieczny w niebie,__ przez zasługi Twego Syna Jezusa i Jego Najświętszej
    Matki błagam o udzielenie mi tej szczególnej łaski. W imię Jezusa i Maryi upadam przed
    Tobą i wielbię Cię w Twej cudownej obecności. Przyjmij, proszę, moje mocne postanowienie
    pozostania pod opieką Żywiciela Świętej Rodziny, przez którego zanoszę do Ciebie błagania.
    Pobłogosław, Boże, w swej dobroci to święte nabożeństwo i wysłuchaj mej prośby. Amen.
  - ^^^
  - "@gloriapatri"
  - "@gloriapatri"
  - "@gloriapatri"
  - ^^^
  - >
    O święty Józefie, obroń Kościół święty przed wszelkimi przeciwnościami i ukryj nas
    wszystkich pod płaszczem swej opieki.
  - ^^^
  - "### WEZWANIA KU CZCI UKRYTEGO ŻYCIA ŚWIĘTEGO JÓZEFA Z JEZUSEM I MARYJĄ"
  - ^^^
  - "* Święty Józefie, uproś Jezusa, aby zechciał moją duszę uświęcić."
  - "* Święty Józefie, uproś Jezusa, aby zechciał moje serce miłością rozpalić."
  - "* Święty Józefie, uproś Jezusa, aby zechciał mój rozum oświecić."
  - "* Święty Józefie, uproś Jezusa, aby zechciał moją wolę wzmocnić."
  - "* Święty Józefie, uproś Jezusa, aby zechciał moje myśli oczyścić."
  - "* Święty Józefie, uproś Jezusa, aby zechciał moimi uczuciami sterować."
  - "* Święty Józefie, uproś Jezusa, aby zechciał moimi życzeniami kierować."
  - "* Święty Józefie, uproś Jezusa, aby zechciał moje uczynki błogosławić."
  - "* Święty Józefie, wybłagaj mi u Jezusa łaskę, abym Twe cnoty naśladował."
  - "* Święty Józefie, wybłagaj mi u Jezusa łaskę pokornego serca i ducha."
  - "* Święty Józefie, wybłagaj mi u Jezusa łaskę łagodności i dobroci serca."
  - "* Święty Józefie, wybłagaj mi u Jezusa łaskę pokoju w mym sercu."
  - "* Święty Józefie, wybłagaj mi u Jezusa łaskę pobożności i bojaźni Bożej."
  - "* Święty Józefie, wybłagaj mi u Jezusa łaskę dążenia do doskonałości."
  - "* Święty Józefie, wybłagaj mi u Jezusa łaskę czystości serca."
  - "* Święty Józefie, wybłagaj mi u Jezusa łaskę cierpliwości w próbie i cierpieniu."
  - "* Święty Józefie, wybłagaj mi u Jezusa łaskę łagodności charakteru."
  - "* Święty Józefie, wybłagaj mi u Jezusa łaskę poznawania wiecznych prawd."
  - "* Święty Józefie, wybłagaj mi u Jezusa łaskę rozróżniania duchów."
  - "* Święty Józefie, wybłagaj mi u Jezusa łaskę wytrwałości w czynieniu dobra."
  - "* Święty Józefie, wybłagaj mi u Jezusa łaskę męstwa w niesieniu krzyża."
  - "* Święty Józefie, wybłagaj mi u Jezusa łaskę uwolnienia się od przywiązania do rzeczy światowych."
  - "* Święty Józefie, wybłagaj mi u Jezusa łaskę tęsknoty za niebem."
  - "* Święty Józefie, wybłagaj mi u Jezusa łaskę siły, abym unikał wszelkich okazji do grzechu."
  - "* Święty Józefie, wybłagaj mi u Jezusa łaskę woli wiernego wytrwania w wierze aż do końca."
  - "* Święty Józefie, wybłagaj mi u Jezusa łaskę dobrej śmierci."
  - "* Święty Józefie, nie pozwól mi nigdy oddalić się od Ciebie."
  - "* Święty Józefie, spraw, aby moje serce nigdy nie przestało Cię kochać, a moje usta Ciebie chwalić."
  - "* Święty Józefie, pozwól mi być Twym przybranym dzieckiem."
  - "* Święty Józefie, pomóż mi kochać Jezusa tak, jak Ty Go kochałeś."
  - "* Święty Józefie, nie opuszczaj mnie nigdy, a zwłaszcza w godzinie śmierci."
  - "* Jezu, Maryjo i Józefie, poświęcam Wam moje serce i moją duszę."
  - "* Jezu, Maryjo i Józefie, oświecajcie mnie, pomagajcie mi, ratujcie mnie. Amen."
  - ^^^
  - "@gloriapatri"
  - "@gloriapatri"
  - "@gloriapatri"
