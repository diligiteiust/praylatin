title: Zakończenie na każdy dzień
lang: pl
language: Polski
tags:
  - Hide
lines:
  - >
    __Zasłużona Królowo Niebios,__ rajska Pani Aniołów, Ty, któraś od zarania otrzymała od Boga moc 
    i misję zmiażdżenia głowy szatana, pokornie Cię błagamy, ześlij Twe święte zastępy, 
    aby z poleceń Twoich i poprzez moc Twoją, mogły one doścignąć i zwalczyć wszystkie złe demony, 
    stłumić ich odwagę i zepchnąć je spowrotem w otchłań piekielną. O dobra i czuła Matko, Ty jesteś
    na zawsze naszą miłością i nadzieją! O Boska Matko, ześlij nam swe anioły aby nas broniły 
    od okrutnego wroga. Święci Aniołowie i Archaniołowie, brońcie nas i osłaniajcie. Amen.
  - ^^^
  - Przenajświętsze Serce Jezusa, __zmiłuj się nad nami.__
  - Mario, wspmożenie wiernych, __módl się za nami.__
  - Panno Można, __módl się za nami.__
  - Święty Józefie, __módl się za nami.__
  - Święty Michale Archaniele, __módl się za nami.__
  - Wszyscy Święci Aniołowie, __módlcie się za nami.__
  - ^^^
  - W imię Ojca i Syna i Ducha Świętego. Amen.
