    ### Lipiec - miesiąc adoracji Najdroższej Krwi Pańskiej.
  - ^^^
  - >
    Miesiąc lipiec, wg.tradycyjnego kalendarza liturgicznego rozpoczyna się uroczystością 
    Najdroższej Krwi Pana Jezusa i poświęcony jest kontemplacji i adoracji Najdroższej Krwi Chrystusa.
    Czcimy tę tajemnicę, jednocząc się z Chrystusem w Komunii świętej, rozważając momenty przelania
    Krwi przez Chrystusa, zawarte w liturgii, w Piśmie Świętym czy w świadectwie męczenników.
  - ^^^
  - >
    W doświadczeniu codziennego tryumfu zła, bagatelizowania grzechu, mody na powątpiewanie, 
    profanacji świętych tajemnic i miejsc, jesteśmy zaproszeni i wezwani zarazem, by stawać w sposób 
    duchowy pod Krzyżem Jezusa i zbierać Krew Chrystusa, która i dziś wypływa z Jego Ran.
  - ^^^
  - >
    Z adoracji płynie łaska do przyjęcia każdego bólu, każdej ciemności, skutku każdego grzechu 
    jako szczególnej obecności Krwi Jezusa. Nędza otaczającego świata wypływająca z ludzkiej pychy 
    każe zanosić błagalne: Wybaw nas! do Chrystusa, słowami Litanii do Jego Krwi. W litanijnych 
    wezwaniach wyznajemy wiarę w moc Przenajświętszej Krwi, a doświadczając jej działania, stajemy 
    się zdolni, by upodabniać się do Chrystusa Zmartwychwstałego i stawać się: "mocą wyznawców", 
    "zdrojem miłosierdzia", "nadzieją pokutujących", "pociechą płaczących", "ostoją zagrożonych", 
    "otuchą umierających".
  - ^^^
  - >
    Gorliwym propagatorem w XIX w. kultu Prznajdroższej Krwi Chrystusa był 
    Kasper del Bufalo - założyciel Zgromadzenia Misjonarzy Krwi Przenajdroższej. 
    Poświęcił on nowe dzieło tajemnicy Krwi Chrystusa, ponieważ był przekonany, że: Niegdyś 
    atakowano jedynie poszczególne prawdy wiary. W naszych czasach ten bój toczony jest przeciw 
    religii, a zwłaszcza przeciw naszemu Ukrzyżowanemu Panu. Trzeba więc znów odnowić chwałę krzyża 
    naszego Zbawiciela. Uzyskał w 1822 r. zezwolenie na obchodzenie liturgiczne święta Krwi Chrystusa 
    1 lipca we wszystkich domach swego stowarzyszenia, a później w miejscach istnienia 
    Bractwa Najdroższej Krwi.
  - ^^^
  - >
    Papież Pius IX dekretem Redempti sumus (1849) rozszerzył obchód święta na cały Kościół, 
    a papież Pius X zatwierdził jego datę na 1 lipca. Do tego kultu zachęcał papież Jan XXIII w 
    Liście apostolskim Inde a primis o rozszerzeniu nabożeństwa ku czci 
    Przenajdroższej Krwi Pana Naszego Jezusa Chrystusa (30 czerwca 1959 r.), na który powołuje się 
    Jan Paweł II podczas swoich katechez.
