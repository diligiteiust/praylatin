title: Modlitwa na czwartek
lang: pl
language: Polski
tags:
  - Hide
lines:
  - >
    __Wszechmogący Boże i Ojcze,__ błagamy Ciebie, przez wstawiennictwo i pomoc 
    Świętych Archaniołów Michała, Rafała i Gabriela o uwolnienie naszych braci i sióstr zniewolonych 
    przez diabła. Przyjdźcie nam z pomocą wszyscy święci z nieba.
  - ^^^
  - Od niepokoju, smutku i prześladowania - __Błagamy Cię, wybaw nas, Panie.__
  - Od nienawiści, nierządu i zazdrości - __Błagamy Cię, wybaw nas, Panie.__
  - Od myśli o zazdrości, złości i śmierci - __Błagamy Cię, wybaw nas, Panie.__
  - Od każdej myśli o samobójstwie i aborcji - __Błagamy Cię, wybaw nas, Panie.__
  - Od każdego rodzaju grzesznej erotyki - __Błagamy Cię, wybaw nas, Panie.__
  - Od wszelkiego rozłamu w naszej rodzinie i od każdej szkodliwej przyjaźni – __Błagamy Cię, wybaw nas, Panie.__
  - Od wszelkiej zguby, wszelkich zaklęć, czarów i wszelkich rodzajów okultyzmu – __Błagamy Cię, wybaw nas, Panie.__
  - ^^^
  - >
    Ty, który powiedziałeś: _"Pokój zostawiam wam, pokój mój daję wam."_ Pozwól, żeby przez 
    wstawiennictwo Dziewicy Maryi, moglibyśmy być uwolnieni od wszelkich diabelskich wpływów i
    abyśmy mogli cieszyć się zawsze Twoim pokojem. W imię Chrystusa, Pana naszego. Amen.