lines:
  - __Baranku Boży, który gładzisz grzechy świata__, przepuść nam, Panie
  - __Baranku Boży, który gładzisz grzechy świata__, wysłuchaj nas, Panie
  - __Baranku Boży, który gładzisz grzechy świata__, zmiłuj się nad nami, Panie
