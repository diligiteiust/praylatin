title: Modlitwa przed snem
lang: pl
language: Polski
tags:
  - Uwolnienie
lines:
  - >
    Lord Jesus Christ, I ask Thee that from now on and until I fall asleep, while I sleep and during 
    my dreams, that if any evil spirit try to affect me that Thou wouldst punish him by making him 
    focus on the thing that causes him the most pain during the entire time he tries to affect me 
    and for ten minutes more. I also ask Thee not to allow him to retaliate. 
    In Jesus' most powerful name. Amen.
