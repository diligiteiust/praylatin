title: Akt skruchy
lang: pl
language: Polski
tags:
  - Spowiedź
lines:
  - Upokarzam się przed Tobą, o Panie i Boże mój, na widok tylu nieprawości moich;
  - a zważając z jednéj strony dobroć Twoję, a z drugiéj złość moję,
  - wstydzę się bardzo niewdzięczności mojéj,
  - i całém sercem żałuję i boleję,
  - żem Ciebie Boga mojego, tak dobrego i miłosiernego, tylu grzechami zasmucił.
  - Brzydząc się niemi wszystkiemi, nienawidzę ich nad wszystko,
  - i postanawiam sobie, a Tobie przyrzekam, przy pomocy łaski Twojéj,
  - nigdy już nie grzeszyć. Tak mi Boże dopomóż. Amen.
