title: Litania o pokorę
lang: pl
language: Polski
tags:
  - Litania
lines:
  - O Jezu, cichy i pokornego serca, __wysłuchaj mnie.__
  - ^^^
  - Od pragnienia, aby mnie szanowano, __wybaw mnie, Jezu.__
  - Od pragnienia, aby mnie kochano, ...
  - Od pragnienia, aby mnie wywyższano, ...
  - Od pragnienia, aby mnie okazywano cześć, ...
  - Od pragnienia, aby mnie chwalono, ...
  - Od pragnienia, aby mnie nad innych przedkładano, ...
  - Od pragnienia, aby mnie się radzono, ...
  - Od pragnienia, aby mnie uznawano, ...
  - Od lęku przed upokorzeniem, ...
  - Od lęku przed pogardą, ...
  - Od lęku przed odtrąceniem, ...
  - Od lęku przed oszczerstwami, ...
  - Od lęku przed popadnięciem w zapomnienie, ...
  - Od lęku przed wyśmianiem, ...
  - Od lęku przed obelgami, ...
  - Od lęku przed fałszywymi posądzeniami, ...
  - ^^^
  - Aby inni byli kochani bardziej niż ja, __Jezu, udziel mi łaski, bym tego pragnął.__
  - Aby inni byli cenieni bardziej niż ja, ...
  - Aby inni byli w oczach świata coraz więksi, a ja się umniejszał, ...
  - Aby inni byli wybierani, a ja odstawiany na bok, ...
  - Aby inni byli chwaleni, a ja zapomniany, ...
  - Aby inni byli we wszystkim przedkładani ponad mnie, ...
  - Aby inni byli bardziej święci ode mnie, bylebym ja sam stał się święty, jak tylko zdołam, ...
  - ^^^
  - Najświętsze Serce Jazusa, __zmiłuj się nad nami.__
  - Wspomożenie Wiernych, __módl się za nami.__
  - Panno można, __módl się za nami.__
  - Święty Józefie, __módl się za nami.__
  - Święty Michale Archaniele, __módl się za nami.__
  - Wszyscy Święci Aniołowie, __módlcie się za nami.__
