lines:
  - "@"
  - >
    Godzina Święta to nabożeństwo odprawiane ku czci Najświętszego Serca Pana Jezusa.
  - ^^^
  - >
    Zbawiciel kilkakrotnie sam uświęcił to nabożeństwo, uznając je wyraźnie za jeden 
    z najodpowiedniejszych sposobów składania czci Jego Sercu i zalecił swej służebnicy, 
    Świętej Małgorzacie Marii Alacoque, aby do końca życia pozostała wierną temu świętemu ćwiczeniu.
  - ^^^
  - >
    _"Każdej nocy – powiedział do niej – z czwartku na piątek, uczynię cię uczestniczką śmiertelnego 
    smutku, któremu dobrowolnie poddałem się w Ogrodzie Oliwnym, a ten smutek, którego nie będziesz 
    mogła pojąć, przyprawi cię o pewnego rodzaju konanie, cięższe do zniesienia niż śmierć._
  - >
    _Aby Mi towarzyszyć w tej pokornej modlitwie, którą wtedy posyłałem do Mego Ojca wśród tych 
    wszystkich udręczeń, wstawać będziesz między godziną 11 a 12 w nocy i leżąc krzyżem twarzą 
    ku ziemi  będziesz przez tę godzinę łagodzić gniew Boży, błagać o zmiłowanie nad grzesznikami 
    oraz w pewnej mierze osładzać mi boleść zadaną przez opuszczenie od Apostołów, która była powodem 
    uczynionej im wymówki, że jednej godziny nie mogli ze Mną czuwać. W ciągu tej godziny czynić będziesz 
    to, czego cię nauczę."_
  - ^^^
  - "### Sposób odprawiania Godziny Świętej"
  - ^^^
  - >
    Nie było chwili, w której nasz Pan więcej by cierpiał w swej duszy, jak w czasie swego konania 
    w Ogrodzie Oliwnym. Jego boleść była tak wielka, że dla wyrażenia jej ogromu rzekł do Apostołów: 
  - >
    _„Smutna jest dusza Moja aż do śmierci.”_
  - >
    Na pamiątkę tego strasznego konania wiele osób spędza na modlitwie każdy czwartek 
    od godziny 11 do 12 w nocy w celu podzielenia i uwielbienia cierpień Zbawiciela oraz dla 
    powstrzymania gniewu Bożego wywołanego naszymi grzechami. Można jednak odprawić to pobożne 
    ćwiczenie we czwartek dużo wcześniej. Bardzo stosownie jest odprawić to nabożeństwo w 
    Wielki Czwartek wieczorem, jak również wieczorem w czwartek przed pierwszym piątkiem miesiąca. 
    Za odprawienie „Godziny Świętej” zyskuje się odpust zupełny po dopełnieniu zwykłych warunków.
  - ^^^
  - "### Akt ofiarowania Godziny Świętej"
  - >
    O Jezu, tak bardzo nas miłujący i ofiarujący się za nasze grzechy, pozwól mi spędzić 
    w najściślejszym zjednoczeniu z Twym Sercem konającym w Ogrójcu tę Godzinę Świętą, 
    której żądałeś od Twej wiernej Oblubienicy, świętej Małgorzaty Marii. O Zbawicielu, 
    godzien największej czci i uwielbienia, daj mi wziąć jak najobfitszy udział w Twych 
    niewypowiedzianych boleściach oraz w smutku i trwodze, które przenikały duszę 
    Twej Najświętszej Matki w czasie tej strasznej i bolesnej nocy. Aby dopełnić to, 
    czego nie dostaje mojej nieudolności, ofiaruję Ci uczucia Twej Najświętszej Matki, 
    świętej Małgorzaty Marii i wszystkich dusz, które umiały i umieją pocieszać Cię w tej tajemnicy 
    boleści i miłości. Amen.
  - ^^^
  - "### Czytania na Świętą Godzinę"
  - ^^^
  - "@Mt 26,1 - Mt 27,66; Mk 14,1 - Mk 15,47; Lk 22,1 - Lk 23,56; J 18,1 - J 19,42"
  - "### Propozycja rozmyślań w czasie Godziny Świętej"
  - ___O modlitwie Chrystusa Pana w Ogrodzie Getsemani, o Jego smutku i krwawym pocie___
  - ^^^
  - >
    Po Ostatniej Wieczerzy i ustanowieniu Przenajświętszego Sakramentu Pan Jezus wiedząc, 
    że się zbliża godzina, w której miał być wydany, idzie z uczniami do Ogrodu Oliwnego… 
  - >
    Szukając samotności oddala się od nich, pada twarzą na ziemię i – zdając się zupełnie na wolę 
    Ojca Przedwiecznego – tak się modli:
  - >
    _„Ojcze, jeśli to możliwe, zabierz ode Mnie ten kielich! Jednak nie moja wola, lecz Twoja niech 
    się stanie!”_ (Łk 22,42)
  - ^^^
  - >
    Potem, szukając pociechy, idzie do swych uczniów, a znalazłszy ich śpiących wraca na miejsce 
    i powtarza tę samą modlitwę… Ale smutek, który przygniata Jego duszę, jest tak ciężki, 
    że pragnąc go złagodzić znowu zbliża się do apostołów, a widząc, że jest przez nich opuszczony, 
    zwraca się do Ojca Przedwiecznego i prosi o oddalenie kielicha Męki. Wtedy cała jej okropność 
    w sposób przerażający przedstawia się Zbawicielowi i napełnia Go ogromną boleścią i smutkiem.
  - ^^^
  - >
    Widok niezliczonych grzechów, jakie Zbawiciel miał zgładzić, bardziej jeszcze niż zbliżająca 
    się Męka, przyprawia Go o tak wielki smutek i boleść. Widział wprawdzie czekające Nań obelgi 
    i zniewagi, ale równocześnie także ogrom grzechów, których straszny ciężar przyjął na Siebie. 
    Był to jakby rozhukany potok nieprawości spadający na Niego. Starty bólem korzy się w prochu 
    przed swym Ojcem, a krwawy pot kroplami spada na ziemię…
  - ^^^
  - >
    Cóż czyni Pan Jezus, aby ulżyć smutkowi i boleściom? Oto na nowo rozpoczyna dłuższą i gorętszą 
    modlitwę… Przez to nauczył nas, że modlitwa jest najskuteczniejszym lekarstwem na nasze 
    cierpienia, że im pokusa silniejsza, im walka cięższa, tym modlitwa powinna być częstsza i żarliwsza…
  - ^^^
  - >
    Gdy Pan Jezus tak się modlił, przybył Anioł, aby Go wzmocnić. Nie dlatego, żeby Zbawiciel 
    potrzebował Anioła, lecz aby nas nauczyć, że modląc się wytrwale, zawsze znajdziemy w Bogu siłę 
    i pociechę.
  - ^^^
  - >
    Duszo miłująca Jezusa! W boleściach ciała i w uciskach duszy zawsze powtarzaj: _„Boże, nie moja, 
    ale Twoja wola niechaj się stanie!”_ Cierpienia przyjmuj w duchu zadośćuczynienia za grzechy 
    wszystkich ludzi i za twoje własne. Uciekaj się do modlitwy, wyczekując z ufnością pomocy 
    i pociechy, jakie ona przynosi. Oddawaj Panu Jezusowi cześć w Jego konaniu błagając Go, aby 
    kiedyś osłodził twoje konanie i konanie tych wszystkich, którzy dziś mają umrzeć, krewnych, 
    przyjaciół i nieprzyjaciół. Jeżeli będziesz czynić to wiernie, wówczas przyjmiesz śmierć bez 
    żalu, o którejkolwiek godzinie spodoba się Bogu powołać cię do Siebie. Serce Jezusa potrafi ci 
    ją tak osłodzić, że z jednym z największych teologów zdziwisz się, że „tak słodko można umierać”.
