title: Zdrowaś Maryjo
lang: pl
language: Polski
tags:
  - Podstawowe
  - Do Matki Bożej
lines:
  - Zdrowaś Maryjo, łaski pełna
  - Pan z Tobą
  - Błogosławionaś Ty między niewiastami
  - i błogosławiony owoc żywota Twojego, Jezus.
  - Święta Maryjo, Matko Boża
  - Módl się za nami grzesznikami,
  - Teraz, i w godzinie śmierci naszej.
notes: >
  > Najstarszy zapis modlitwy Zdrowaś Mario w języku polskim zachował się w Statutach Wacława, 
  Księcia Legnickiego z roku 1412. Najstarsza polska wersja drukowana tej modlitwy ukazała 
  się natomiast w 1475 roku we Wrocławiu. 
  Została wydrukowana wraz z modlitwami Ojcze nasz i Wierzę w Boga 
  w tzw. Statutach Elyana (łac. Statuta Synodalia Episcoporum Wratislaviensium), 
  wydrukowanych w pierwszej oficynie wrocławskiej Kaspra Elyana.