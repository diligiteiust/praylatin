    ### Obietnice dla czcicieli Najświętszego Serca Pana Jezusa
  - ^^^
  - >
    Jezus przekazał św. Małgorzacie Marii Alacoque, że Jego Serce stanie się źródłem wielu łask dla
    wiernych. _"Serce moje wyleje hojne łaski na tych wszystkich, którzy Sercu memu oddadzą cześć 
    lub przyczynią się do jej rozszerzenia"._
  - ^^^
  - >
    Wśród przyrzeczeń znalazło się 12 obietnic, które zakonnica opisała w listach.
  - ^^^
  - |
    ### 12 obietnic dla czcicieli Serca Jezusowego:
  - |
    1. _Dam im wszystkie łaski potrzebne w ich stanie._
    2. _Zgoda i pokój będą panowały w ich rodzinach._
    3. _Będę ich pocieszał we wszystkich ich strapieniach._
    4. _Będę ich bezpieczną ucieczką za życia, a szczególnie przy śmierci._
    5. _Wyleję obfite błogosławieństwa na wszystkie ich przedsięwzięcia._
    6. _Grzesznicy znajdą w mym Sercu źródło nieskończonego miłosierdzia._
    7. _Dusze oziębłe staną się gorliwymi._
    8. _Dusze gorliwe dojdą szybko do wysokiej doskonałości._
    9. _Błogosławić będę domy, w których obraz mego Serca będzie umieszczony i czczony._
    10. _Kapłanom dam moc kruszenia serc najzatwardzialszych._
    11. _Imiona tych, co rozszerzać będą to nabożeństwo, będą zapisane w mym Sercu i na zawsze 
        w Nim pozostaną._
    12. _Przyrzekam w nadmiarze miłosierdzia Serca mojego, że wszechmocna miłość moja udzieli 
        tym wszystkim, którzy będą przystępować do Komunii św. w pierwsze piątki przez dziewięć 
        miesięcy z rzędu, łaskę skruchy i pokuty ostatecznej, tak że nie umrą w Mojej niełasce 
        ani bez sakramentów i że Serce moje stanie się dla nich najpewniejszą ucieczką w godzinę śmierci._
