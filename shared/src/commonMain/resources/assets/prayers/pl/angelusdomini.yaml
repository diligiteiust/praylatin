title: Anioł Pański
lang: pl
language: Polski
tags:
  - Podstawowe
  - Do Matki Bożej
lines:
  - __Anioł Pański zwiastował Pannie Maryi__
  - __I poczęła z Ducha Świętego.__
  - ^^^
  - "@avemaria"
  - ^^^
  - __Oto ja Służebnica Pańska,__
  - __Niech mi się stanie według słowa twego.__
  - ^^^
  - "@avemaria"
  - ^^^
  - __A Słowo Ciałem się stało__
  - __I mieszkało między nami.__
  - ^^^
  - "@avemaria"
  - ^^^
  - __Módl się za nami__ święta Boża Rodzicielko,
  - abyśmy się stali godnymi obietnic Chrystusowych.
  - ^^^
  - "__Módlmy się:__"
  - Łaskę Twoją, prosimy Cię, Panie,
  - racz wlać w serca nasze,
  - abyśmy, którzy przez Zwiastowanie anielskie,
  - Wcielenie Chrystusa Syna Twojego poznali,
  - przez mękę Jego i krzyż 
  - do chwały zmartwychwstania zostali doprowadzeni.
  - Przez tegoż Chrystusa Pana naszego. Amen.
  