title: Anioł Pański
lang: pl
language: Polski
tags:
  - Podstawowe
  - Do Matki Bożej
lines:
  - Anioł Pański zwiastował Pannie Maryi
  - I poczęła z Ducha Świętego.
  - "@avemaria"
  - ^^^
  - Oto ja Służebnica Pańska,
  - Niech mi się stanie według słowa twego.
  - "@avemaria"
  - ^^^
  - A Słowo Ciałem się stało
  - I mieszkało między nami.
  - "@avemaria"
  - ^^^
  - Módl się za nami święta Boża Rodzicielko,
  - abyśmy się stali godnymi obietnic Chrystusowych.
  - ^^^
  - "Módlmy się:"
  - Łaskę Twoją, prosimy Cię, Panie,
  - racz wlać w serca nasze,
  - abyśmy, którzy przez Zwiastowanie anielskie,
  - Wcielenie Chrystusa Syna Twojego poznali,
  - przez mękę Jego i krzyż 
  - do chwały zmartwychwstania zostali doprowadzeni.
  - Przez tegoż Chrystusa Pana naszego. Amen.
  