    ### Obietnica
  - >
    Matka Boża objawiła się Łucji ponownie 10 grudnia 1925 r. w Pontevedra i złożyła następującą obietnicę:
  - ^^^
  - >
    _Ogłoś w moim imieniu, że obiecuję przybyć w chwili śmierci ze wszystkimi łaskami koniecznymi 
    do zbawienia tym osobom, które w pierwsze soboty pięciu kolejnych miesięcy przystąpią
    do sakramentu spowiedzi, Komunii Św., odmówią pięć dziesiątek różańca i dotrzymają 
    mi towarzystwa przez 15 minut, rozważając 15 tajemnic różańcowych z intencją zadośćuczynienia 
    mojemu Niepokalanemu Sercu._
  - ^^^
  - "### Warunki nabożeństwa pierwszych sobót miesiąca"
  - ^^^
  - > 
    1. Spowiedź św. – w pierwszą sobotę miesiąca albo do 8 dni przed lub po pierwszej sobocie, 
    pod warunkiem zachowania stanu łaski uświęcającej (bez grzechu ciężkiego);
  - > 
    2. Komunia św. – w pierwszą sobotę miesiąca albo, z uzasadnionego powodu i za zgodą kapłana, 
    następnego dnia, w niedzielę;
  - >
    3. Różaniec – pięć tajemnic różańca należy odmówić w sposób poprawny, rozważając każdą z nich;
  - > 
    4. Rozważanie – w ciągu 15. minut można rozważać wszystkie tajemnice lub dowolnie wybrane, 
    jednak Matka Boża prosiła, byśmy w ciągu pięciu pierwszych sobót przynajmniej raz rozważyli 
    każdą z nich. Ponieważ Matka Boża mówiła o tych, którzy „dotrzymują jej towarzystwa”, 
    powinniśmy pamiętać o Jej uczestnictwie w każdej z tajemnic, które wybieramy do rozważania.
  - ^^^
  - "__Wszystkie__ warunki nabożeństwa należy wypełniać z intencją:"
  - ^^^
  - >
    __Wynagrodzenia za bluźnierstwa i zniewagi popełniane przez ludzi przeciw Niepokalanemu Sercu Maryi.__
  - ^^^
  - |
    ### Dlaczego pięć sobót?
  - >
    Pan Jezus wyjaśnił Łucji podczas czuwania w nocy z 29 na 30 maja 1930 roku:
  - ^^^
  - >
    _Moja córko, powód jest bardzo prosty: jest pięć rodzajów zniewag i bluźnierstw przeciwko Niepokalanemu Sercu Maryi:_
  - ^^^
  - >
    1. _Bluźnierstwa przeciwko Niepokalanemu Poczęciu._
  - >
    2. _Bluźnierstwa przeciw Dziewictwu Matki Bożej._
  - >
    3. _Bluźnierstwa przeciw Jej Boskiemu Macierzyństwu, przy równoczesnym sprzeciwie uznania Jej za Matkę rodzaju ludzkiego._
  - >
    4. _Czyny tych, którzy usiłują publicznie wpoić w serca dzieci obojętność, pogardę, a nawet nienawiść do tej Matki Niepokalanej._
  - >
    5. _Czyny tych, którzy profanują wizerunki Najświętszej Panny._
