title: O mój Jezu
lang: pl
language: Polski
tags:
  - Do Pana Jezusa
  - Różaniec
lines:
  - O mój Jezu,
  - Przebacz nam nasze grzechy,
  - Zachowaj nas od ognia piekielnego,
  - Zaprowadź wszystkie dusze do nieba
  - I dopomoż szczególnie tym,
  - Którzy najbardziej potrzebują Twojego miłosierdzia.
