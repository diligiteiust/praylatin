title: Symbol Nicejski
lang: pl
language: Polski
lines:
  - Wierzę w jednego Boga,
  - Ojca Wszechmogącego
  - Stworzyciela nieba i ziemi
  - wszystkich rzeczy widzialnych
  - i niewidzialnych.
  - I w jednego Pana Jezusa Chrystusa,
  - Syna Bożego Jednorodzonego,
  - który z Ojca jest zrodzony
  - przed wszystkimi wiekami.
  - Bóg z Boga, Światłość ze Światłości,
  - Bóg prawdziwy z Boga prawdziwego,
  - zrodzony, a nie stworzony,
  - współistotny Ojcu
  - a przez Niego wszystko się stało.
  - On to dla nas ludzi
  - i dla naszego zbawienia
  - zstąpił z nieba,
  - i za sprawą Ducha Świętego
  - przyjął ciało z Maryi Dziewicy
  - i stał się człowiekiem.
  - Ukrzyżowany również za nas
  - pod Poncjuszem Piłatem
  - został umęczony i pogrzebany.
  - I zmartwychwstał trzeciego dnia,
  - jak oznajmia Pismo,
  - I wstąpił do nieba;
  - siedzi po prawicy Ojca.
  - I powtórnie przyjdzie w chwale
  - sądzić żywych i umarłych,
  - a królestwu Jego nie będzie końca.
  - I (wierzę) w Ducha Świętego,
  - Pana i Ożywiciela,
  - który od Ojca i Syna pochodzi,
  - który z Ojcem i Synem wspólnie
  - odbiera uwielbienie i chwałę,
  - który mówił przez Proroków.
  - I (wierzę) w jeden, święty, powszechny
  - i apostolski Kościół,
  - wyznaję jeden chrzest
  - na odpuszczenie grzechów,
  - i oczekuję wskrzeszenia umarłych
  - i życia wiecznego w przyszłym świecie.