title: Auxilium Christianorum Initiatio
lang: pl
language: Polski
tags:
  - Hide
lines:
  - __K.__ Wspomożenie nasze w imieniu Pana.
  - __W.__ Który stworzył niebo i ziemię.
  - ^^^
  - >
    __Przenajświętsza Mario Panno__, Ty która zmiażdżyłaś głowę węża,
      chroń nas przed zemstą szatana. Ofiarujemy Tobie nasze
      modlitwy, cierpienia i dobre uczynki abyś mogła je oczyścić,
      uświęcić i przedstawić je Synowi Twojemu jako ofiarę doskonałą.
      Niechaj ta ofiara zostanie oddana tak aby siły nieczyste które
      oddziaływują lub dążą do wywierania wpływu na członkach
      Auxilium Christianorum nie znały źródła ich wydalenia i ślepoty.
      Oślep je tak aby nie wiedziały o naszych dobrych uczynkach.
      Oślep je tak aby nie wiedziały na kim się mają zemścić. Oślep je
      tak aby otrzymały sprawiedliwy wyrok za swoje dzieła. Osłoń nas
      najdroższą krwią Twego Syna, tak abyśmy mogli się cieszyć
      ochroną która płynie z Jego męki i śmierci. Amen.
