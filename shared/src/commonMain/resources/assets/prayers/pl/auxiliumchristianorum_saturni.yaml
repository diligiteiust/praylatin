title: Modlitwa na sobotę
lang: pl
language: Polski
tags:
  - Hide
lines:
  - >
    __O Boże Ojcze Pana naszego Jezusa Chrystusa,__ wzywamy Twe święte imię i pokornie błagamy 
    Twej łaski, aby za wstawiennictwem zawsze Niepokalanej Dziewicy, naszej Matki Maryi 
    i chwalebnego Archanioła Michała, raczyłbyś nam pomóc w walce przeciw szatanowi i wszystkim 
    innym duchom nieczystym, które grasują po świecie i stanowią niebezpieczeństwo dla 
    ludzkości i utraty dusz. Amen.
