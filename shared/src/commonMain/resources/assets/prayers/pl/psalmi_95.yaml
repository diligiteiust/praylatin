title: Psalm 95 (94) - Venite
lang: pl
language: Polski
tags:
  - "Księga Psalmów"
lines:
  - "Pieśń pochwalna Dawida."
  - "95:1 Pójdźcie, śpiewajmy z radością Panu, śpiewajmy Bogu, zbawicielowi naszemu,"
  - "95:2 uprzedzajmy oblicze jego z wychwalaniem i psalmy śpiewajmy mu!"
  - "95:3 Albowiem Bogiem wielkim Pan i królem wielkim ponad wszystkie bogi."
  - "95:4 Bo w ręce jego wszystkie krańce ziemi i gór wysokości jego są;"
  - "95:5 bo jego jest morze, i on je uczynił, i lądy utworzyły ręce jego."
  - "95:6 Pójdźcie, pokłońmy się i upadnijmy, i płaczmy przed Panem, który nas stworzył!"
  - "95:7 Albowiem on jest Panem, Bogiem naszym, a my ludem pastwiska jego i owcami ręki jego."
  - "95:8 Dziś, jeśli głos jego usłyszycie, nie zatwardzajcie serc waszych,"
  - "95:9 jak w rozdrażnieniu, jak w dzień kuszenia na puszczy, kędy mię kusili ojcowie wasi, doświadczyli mię, a widzieli uczynki moje!"
  - "95:10 Czterdzieści lat gniewałem się na ten naród, i rzekłem: „Zawsze ci błądzą sercem.”"
  - "95:11 A oni nie poznali dróg moich, jak zaprzysiągłem w gniewie moim, że nie wnijdą do pokoju mego."
notes: >
  > PS 94 (95). WEZWANIE DO CHWALENIA BOGA I DO POSŁUSZEŃSTWA. Śpiewajmy Bogu i chwalmy go (I-2), 
  albowiem on jest Bogiem wielkim, Panem i Stwórcą świata (3-5). Oddajmy mu hołd jako lud jego 
  wiemy, związany z nim przymierzem (6-7)! Nie naśladujmy w zatwardziałości ojców naszych, 
  którzy za karę zostali wykluczeni od wejścia do Ziemi Obiecanej (8-11).