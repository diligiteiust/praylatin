title: Modlitwa akceptacji i nieakceptacji
lang: pl
language: Polski
tags:
  - Uwolnienie
lines:
  - >
    Lord Jesus Christ, if “THIS” is from You, I accept it for the reparation of my sins and the 
    sins of others, all to Your Glory. Lord Jesus Christ, if “THIS” is not from You, I send it back 
    to where it came from and attach a blessing to it, all to Your Glory.
  - In the Name of the Father, and of the Son and of the Holy Spirit. Amen.
  - (3X)
