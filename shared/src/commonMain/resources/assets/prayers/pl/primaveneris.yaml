lines:
  - "@"
  - >
    Dwunasta obietnica Pana Jezusa dla czcicieli Serca Jezusowego,  nazywana __wielką__:
  - >
    12. _Przyrzekam w nadmiarze miłosierdzia Serca mojego, że wszechmocna miłość moja udzieli tym 
    wszystkim, którzy będą przystępować do Komunii św. w pierwsze piątki przez dziewięć miesięcy z 
    rzędu, łaskę skruchy i pokuty ostatecznej, tak że nie umrą w Mojej niełasce ani bez sakramentów 
    i że Serce moje stanie się dla nich najpewniejszą ucieczką w godzinę śmierci._
  - ^^^
  - >
    Warunkiem dostąpienia tej wielkiej łaski jest godne przyjęcie Komunii (w stanie łaski uświęcającej) 
    przez dziewięć kolejnych pierwszych piątków miesiąca. Ważna jest także intencja Komunii świętej, 
    którą w tym dniu przyjmujemy. Sakrament powinien być przyjęty:
  - ^^^
  - > 
    __W intencji wynagradzającej Bożemu Sercu za grzechy i zniewagi, jakie spotykają Je w Najświętszym Sakramencie.__
