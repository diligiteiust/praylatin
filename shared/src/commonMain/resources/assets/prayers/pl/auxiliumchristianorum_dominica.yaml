title: Modlitwa na niedzielę
lang: pl
language: Polski
tags:
  - Hide
lines:
  - >
    __O Chwalebna Królowo Nieba i Ziemi,__ Panno Można, Ty, która masz moc aby zmiażdżyć pod swą 
    piętą głowę przedwiecznego węża, przybądź i wykorzystaj tę moc płynącą z łaski 
    Twego Niepokalanego Poczęcia. Osłoń nas płaszczem twej czystości i miłości, usadowiając nas 
    w słodkiej siedzibie serca Twego. Unicestwji i ubezwłasnowolnij siły które chcą nas zniszczyć.
    Przyjdź o Niepodległa Królowo Aniołów i Różańca Świętego, która od poczęcia świata otrzymałaś 
    od Boga moc i misję zmiażdżenia głowy szatana. Ześlij Twe święte zastępy, pokornie Cię błagamy,
    aby pod Twym dowódctwem i za Twoją mocą mogły one doścignąć złe duchy, odeprzeć je i ich śmiałe 
    ataki i tak aby nie krzywdząc nikogo mogły uwiązać je pod Krzyżem na osąd i wyrok 
    Syna Twego Jezusa Chrystusa tak aby mógł się on ich pozbyć według swojej woli.
  - >
    __Święty Józefie,__ patronie Kościoła Powszechnego, przyjdź nam z pomocą w tej śmiertelnej walce 
    z siłami ciemności, odeprzyj ataki szatana i uwolnij z fortec wroga członków 
    Auxilium Christianorum i wszystkich tych, za których modlą się kapłani tego stowarzyszenia.
  - >
    Święty Michale Archaniele, wezwij cały dwór niebiański do użycia sił swych w tej zaciętej walce
    z mocami piekła. Przybądź o Książę Nieba ze swym potężnym mieczem i zepchnij do piekła szatana
    wraz z wszystkimi innymi złymi duchami. O Aniołowie Stróżowie, prowadźcie i chrońcie nas. Amen.
