title: Nowenna do Najdroższej Krwi Jezusa
lang: pl
language: Polski
tags:
  - Nowenny
lines:
  - "@"
  - >
    __O niezmierny i wieczny Majestacie Boży,__ Najświętsza Trójco: Ojcze,
    Synu i Duchu Święty, ja najpokorniejsze Twoje stworzenie adoruję i
    wielbię Ciebie, z wielkim uczuciem i uległością, które mogą ofiarować
    stworzenia. W obecności Twojej i Najświętszej Maryi Panny, Królowej
    nieba, w obecności mojego Anioła Stróża, moich Świętych Patronów i
    całego dworu niebiańskiego, potwierdzam, że tę modlitwę i prośbę,
    którą za chwilę rozpocznę do litościwej i miłosiernej Dziewicy Maryi
    przez zasługi drogocennej Krwi Jezusa, zamierzam uczynić z czystą
    intencją i przede wszystkim dla Twojej chwały, dla zbawienia mojego i
    mojego bliźniego. Z tego powodu oczekuję od Ciebie, mój Boże,
    najwyższe Dobro, za wstawiennictwem Najświętszej Dziewicy, otrzymać
    łaskę, o którą pokornie proszę ze względu na nieskończone zasługi
    Najdroższej Krwi Jezusa. Ale cóż mogę uczynić w obecnym stanie, w
    którym się znajduję, jeśli nie wyznać Tobie, mój Boże, wszystkie moje
    grzechy popełnione, aż do dzisiaj, prosząc Ciebie na nowo o
    oczyszczenie we Krwi Jezusa? Tak mój Boże, żałuję i boleję z tego
    powodu ze szczerego serca, nie z bojaźni przed piekłem, na które
    zasłużyłem, ale dlatego że obraziłem Ciebie, najwyższe Dobro.
    Postanawiam stanowczo z Twoją świętą łaską nie obrażać Ciebie więcej
    w przyszłości i unikać najbliższych okazji do grzechu. Miej miłosierdzie
    nade mną, Panie, przebacz mi. Amen.
  - ^^^
  - >
    __Pod Twoją obronę uciekam się o Święta Matko Boża,__ nie lekceważ
    modlitwy, którą do Ciebie kieruję, o Dziewico chwalebna i
    błogosławiona.
  - ^^^
  - >
    O Boże, przybądź, by mnie zbawić. Panie, pośpiesz mi na pomoc.
  - "@gloriapatri"
  - ^^^
  - >
    Wszystka piękna jesteś, o Maryjo i skazy pierworodnej nie ma w Tobie.
    Jesteś najczystsza, o Dziewico Maryjo, Królowo Nieba i Ziemi, Matko
    Boża. Pozdrawiam Cię, czczę i błogosławię Cię na wieki. O Maryjo, do
    Ciebie się uciekam, Ciebie wzywam. Pomóż mi, o najsłodsza Matko Boża,
    pomóż mi, Królowo nieba, pomóż mi, najlitościwsza Matko i Ucieczko
    grzeszników, pomóż mi, Matko mojego najsłodszego Jezusa. A ponieważ
    nie ma rzeczy, o którą nie prosiłoby się Ciebie na mocy męki Jezusa
    Chrystusa, której, by się nie otrzymało od Ciebie, z żywą wiarą proszę
    Cię, byś udzieliła mi łaski, która tak bardzo leży mi na sercu. Proszę Cię
    o nią przez Boską Krew Jezusa wylaną dla naszego zbawienia. Nie
    przestanę wołać do Ciebie, aż mnie nie wysłuchasz. O Matko
    miłosierdzia, ufam, że otrzymam tę łaskę, ponieważ proszę Cię o nią
    przez nieskończone zasługi Najdroższej Krwi Twojego umiłowanego Syna.
    O Matko najsłodsza, przez zasługi Najdroższej Krwi Twojego Bożego Syna
    udziel mi łaski _(tutaj prosi się o łaskę, której się pragnie)_.
  - >
    >  _1. O zbawienie duszy współmałżonka_
      _2. O pragnienie nieustannego nawracania serca do Boga._
      _3. O powrót do współmałżonka i pełnego realizowania przysięgi małżeńskiej_
  - ^^^
  - >
    __1. Proszę Cię o nią__, Matko Najświętsza, przez tę czystą, niewinną i
    błogosławioną Krew, którą Jezus przelał w czasie swojego obrzezania we
    wczesnym dzieciństwie, zaledwie ósmego dnia.
  - "@avemaria"
  - >
    O Dziewico Maryjo, przez zasługi drogocennej Krwi Twojego Bożego Syna
    wstawiaj się za mną przed Ojcem niebieskim.
  - ^^^
  - >
    __2. Proszę Cię o nią__, o Maryjo Najświętsza, przez tę czystą, niewinną i
    błogosławioną Krew, którą Jezus przelał obficie w czasie agonii w
    Ogrodzie.
  - "@avemaria"
  - >
    O Dziewico Maryjo, przez zasługi drogocennej Krwi Twojego Bożego Syna
    wstawiaj się za mną przed Ojcem niebieskim.
  - ^^^
  - >
    __3. Błagam Cię o nią__, Matko Najświętsza, przez tę czystą, niewinną i
    błogosławioną Krew, którą Jezus przelał obficie, gdy odarty i
    przywiązany do kolumny, był okrutnie biczowany.
  - "@avemaria"
  - >
    O Dziewico Maryjo, przez zasługi drogocennej Krwi Twojego Bożego Syna
    wstawiaj się za mną przed Ojcem niebieskim.
  - ^^^
  - >
    __4. Proszę Cię o nią__, Matko Najświętsza, przez tę czystą, niewinną i
    błogosławioną Krew, która wypłynęła z głowy Jezusa, kiedy był
    ukoronowany bardzo ostrymi cierniami.
  - "@avemaria"
  - >
    O Dziewico Maryjo, przez zasługi drogocennej Krwi Twojego Bożego Syna
    wstawiaj się za mną przed Ojcem niebieskim.
  - ^^^
  - >
    __5. Proszę Cię o nią__, Matko Najświętsza, przez tę czystą, niewinną i
    błogosławioną Krew, którą Jezus przelał, niosąc krzyż na drodze
    Kalwarii, a szczególnie przez tę żywą Krew zmieszaną ze łzami, którą Ty
    wylałaś, towarzysząc Mu w najwyższej ofierze.
  - "@avemaria"
  - >
    O Dziewico Maryjo, przez zasługi drogocennej Krwi Twojego Bożego Syna
    wstawiaj się za mną przed Ojcem niebieskim.
  - ^^^
  - >
    __6. Błagam Cię o nią__, Matko Najświętsza, przez tę czystą, niewinną i
    błogosławioną Krew, która wypłynęła z ciała Jezusa, gdy był odarty z
    szat, tę samą Krew, którą przelał z rąk i ze stóp, kiedy był przybity do
    krzyża ciężkimi i bardzo kłującymi gwoździami. Proszę Cię o nią przede
    wszystkim przez Krew, którą przelał podczas swojej najsurowszej i
    rozdzierającej agonii.
  - "@avemaria"
  - >
    O Dziewico Maryjo, przez zasługi drogocennej Krwi Twojego Bożego Syna
    wstawiaj się za mną przed Ojcem niebieskim.
  - ^^^
  - >
    __7. Wysłuchaj mnie__, najczystsza Dziewico i Matko Maryjo, przez tę
    najsłodszą i mistyczną Krew i wodę, która wypłynęła z boku Jezusa, gdy
    włócznią przebito Mu Serce. Przez tę najczystszą Krew udziel mi, o
    Dziewico Maryjo, łaski, o którą Cię proszę, przez tę Krew Najdroższą,
    którą głęboko czczę i która jest moim napojem na ołtarzu Pana Boga,
    wysłuchaj mnie o litościwa i słodka Dziewico Maryjo.
  - "@avemaria"
  - >
    O Dziewico Maryjo, przez zasługi drogocennej Krwi Twojego Bożego Syna
    wstawiaj się za mną przed Ojcem niebieskim.
  - ^^^
  - >
    __Aniołowie i Wszyscy Święci w niebie__, którzy kontemplujecie chwałę
    Boga, zjednoczcie waszą modlitwę z tą modlitwą drogiej Matki i
    Najświętszej Królowej Maryi i uzyskajcie dla mnie u Ojca niebieskiego
    łaskę, o którą proszę przez zasługi drogocennej Krwi naszego Bożego
    Odkupiciela.
  - ^^^
  - >   
    Również do Was się uciekam, Dusze Święte w czyśćcu, módlcie się za mnie i
    proście Ojca niebieskiego o łaskę, o którą błagam przez tę Krew Najdroższą,
    którą mój i wasz Zbawiciel przelał ze swoich Najświętszych Ran. Ja także
    ofiaruję za was Ojcu Przedwiecznemu Krew Przenajdroższą Jezusa, żebyście
    mogły radować się Nim w pełni i chwalić Go na wieki w chwale nieba,
    śpiewając: „Odkupiłeś nas, o Panie Boże, Twoją Krwią i uczyniłeś z nas
    królestwo dla naszego Boga”. Amen.
  - ^^^
  - >    
    O dobry i umiłowany Panie Boże, słodki i miłosierny, zmiłuj się nade mną i nad
    wszystkimi duszami, tak żywymi, jak zmarłymi, które odkupiłeś Twoją Krwią
    drogocenną. Amen.
  - ^^^
