title: Litania zaufania
lang: pl
language: Polski
tags:
  - Litaniae
lines:
  - Od przekonania, że muszę zasłużyć na Twą miłość, __wybaw mnie, Jezu.__
  - Od lęku, że na miłość nie zasługuję, ...
  - Od fałszywego przekonania, że mogę wszystko, ...
  - Od lęku, że ufając Tobie, poniosę stratę, ...
  - Od zwątpienia w Twoje słowa i obietnice, ...
  - Od buntu przed dziecięcą zależnością od Ciebie, ...
  - Od wzbraniania się i niechęci do przyjęcia Twojej woli, ...
  - Od niepokoju o przyszłość, ...
  - Od pielęgnowania urazów i nadmiernej koncentracji na przeszłości, ...
  - Od niespokojnego zapatrzenia się w siebie w teraźniejszości, ...
  - Od niewiary w Twoją miłość i obecność, ...
  - Od lęku przed żądaniem ofiarowania więcej, aniżeli posiadam, ...
  - Od przekonania, że moje życie nie ma sensu i jest bezwartościowe, ...
  - Od obawy przed tym, czego żąda miłość, ...
  - Od zniechęcenia, ...
  - ^^^
  - Za to, że nieustannie mnie podtrzymujesz, ożywiasz i obdarzasz miłością, __Jezu, ufam Tobie.__
  - Za to, że Twoja miłość większa jest od moich grzechów i słabości, i mnie przemienia, ...
  - Za to, że niewiedza o tym, co czeka mnie jutro przynagla mnie do zawierzenia Tobie, ...
  - Za to, że jesteś ze mną w moim cierpieniu, ...
  - Za to, że moje cierpienie, złączone z Twoim, przyniesie owoc w tym i przyszłym życiu, ...
  - Za to, że nie pozostawiasz mnie sierotą, bo jesteś obecny w swoim Kościele, ...
  - Za to, że Twój plan jest najlepszy ze wszystkich, ...
  - Za to, że zawsze mnie wysłuchujesz i w dobroci swojej zawsze mi odpowiadasz, ...
  - Za to, że dajesz mi łaskę przyjęcia przebaczenia i przebaczania innym, ...
  - Za to, że dajesz mi siłę potrzebną do działania, ...
  - Za to, że moje życie jest darem, ...
  - Za to, że uczysz mnie ufać sobie, ...
  - Za to, że jesteś moim Panem i Bogiem, ...
  - Za to, że mnie umiłowałeś, ...
