title: Modlitwa na środę
lang: pl
language: Polski
tags:
  - Hide
lines:
  - >
    __W imię Jezusa Chrystusa,__ naszego Pana i Boga, zaświadczam wszystkie duchy jako bezsilne, 
    sparaliżowane i nieskuteczne w próbach podjęcia zemsty na którymkolwiek z członków Auxilium 
    Christianorum, na naszych rodzinach, przyjaciołach, społecznościach, które modlą się za nas 
    i na członkach ich rodzin, na każdym związanym z nami i na tych za których modlą się kapłani 
    Auxilium Christianorum. Łączymy wszystkie złe duchy, wszystkie władze w powietrzu, w wodzie, 
    w ziemi, w ogniu, pod ziemią, lub tam, gdzie dokonują swych dzieł wszystkie siły satanistyczne 
    w przyrodzie i każdego jednego wysłannika szatańskiej siedziby. Łączymy we krwi Jezusa 
    wszystkie właściwości, cechy, oblicza i ich wzajemne oddziaływanie oraz wspólne kontakty 
    i podstępne gry złych duchów. Łamiemy wszelkie więzi, spójnie i przynależności w imię 
    Ojca, i Syna, ☩ i Ducha Świętego. Amen.
