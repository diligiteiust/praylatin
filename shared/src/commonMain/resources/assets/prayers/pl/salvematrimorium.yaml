  - >
    __W święte imię Jezusa Chrystusa,__ przez Jego Najdroższą Krew, przez
    którą wszyscy zostaliśmy zbawieni, za wstawiennictwem Najświętszej
    Maryi Panny, wszystkich świętych Archaniołów a szczególnie św. Michała
    Archanioła, wszystkich Świętych Archaniołów i Aniołów i wszystkich
    Świętych w Niebie, razem ze świętym ojcem Pio, św. Janem Pawłem II,
    św. siostrą Faustyną, św. Gemmą Galgani, św. Janem Bosko, św.
    Dominikiem Savio _(św. Józefem, $zmoimiswietymi)_ 
    rozkazuję i nakazuję Alimajowi i jego legionom,
    Asmodeuszowi i jego legionom, Belzebubowi i jego legionom, Szatanowi i
    jego legionom, Lucyferowi i jego legionom a szczególnie wszystkim złym
    duchom kłamstwa i zwodzenia, zaburzeń umysłowych psychicznych i
    fizycznych, zamętu myślenia, Danowi i jego legionom, Abu i jego
    legionom i wszelkim legionom diabelskim, które atakują mojego
    współmałżonka, żeby natychmiast odeszły od Niego i nigdy więcej nie
    wracały! Rozkazuję i nakazuję to w imię Jezusa Chrystusa!
  - ^^^
  - >
    __W święte Imię Jezusa Chrystusa,__ przez Jego Najdroższą Krew przelaną
    za całą ludzkość, za wstawiennictwem św. Michała Archanioła i
    wszystkich Świętych a szczególnie Matki Bożej, Matki Pięknej Miłości __NA
    MOCY SAKRAMENTU MAŁŻEŃSTWA__ zdejmuję i zrywam, rozwiązuję,
    niszczę, łamię i unicestwiam wszelki wpływ diabelski, którego __mój mąż
    (moja żona)__ doświadcza na skutek przekleństwa rzuconego na niego i na
    nas, na Jego i naszą rodzinę; zdejmuję, zrywam i niszczę każde zaklęcie,
    urok i związanie na skutek rytuałów, czaru, magii i okultyzmu
    wykonanego przeciwko mojemu współmałżonkowi, mojemu małżeństwu
    w celu wywołania kłótni, podziału, cudzołóstwa, rozwodu i potępienia
    wiecznego. W Imię Jezusa Chrystusa rozwiązuję i zrywam, zdejmuję i
    niszczę każde życzenie śmierci, niepowodzenia, klęski, zniszczenia i
    samozniszczenia rzucone na mnie, na mojego współmałżonka, na nasze
    małżeństwo, na nasz dom i nasze potomstwo. Rozwiązuję i zrywam,
    zdejmuję i niszczę każde przekleństwo rzucone na mnie i mojego
    współmałżonka przez osoby, które mnie nienawidzą z powodu zazdrości,
    zawiści i złośliwości serca.
  - ^^^
  - >
    __W święte Imię Jezusa Chrystusa,__ przez Jego Najdroższą Krew, za
    wstawiennictwem Matki Bożej Niepokalanej, św. Michała Archanioła,
    wszystkich Świętych Archaniołów, wszystkich Świętych Aniołów i
    wszystkich Świętych, __NA MOCY SAKRAMENTU MAŁŻEŃSTWA__, rozkazuję i
    nakazuję wszelkiemu duchowi nieczystemu, duchowi pornografii,
    masturbacji, cudzołóstwa i homoseksualizmu, który dręczy moje
    małżeństwo, mojego współmałżonka i mnie, żeby odszedł precz od nas i
    żeby nigdy więcej nie wracał! Rozwiązuję i niszczę te przekleństwa
    przywiązując je do krzyża Jezusa Chrystusa. Działaj Jezu, uwalniaj,
    uzdrawiaj i lecz, nawracaj i uświęcaj nasze serca, nasze małżeństwo,
    naszą rodzinę i nasze pokolenia żyjące, minione i przyszłe, przez wzgląd
    na wiarę, którą pokładam w Tobie i w Twoje nieskończone miłosierdzie.
    Dziękuję Jezu, dziękuję Tobie Maryjo-Matko Pięknej Miłości, dziękuję
    Wam wszyscy Święci i Aniołowie za walkę o tę osobę, o moje
    małżeństwo.
