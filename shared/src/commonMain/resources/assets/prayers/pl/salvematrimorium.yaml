    nowennę do Krwi Pana Jezusa. Modlitwy te, jak i nowenna powinny być tak długo odmawiane aż do
    całkowitego zwycięstwa Jezusa Chrystusa w naszym małżeństwie. Nowennę do
    Najdroższej Krwi Pana Jezusa należy odmówić minimum trzy razy w następujących intencjach:
     _1. O zbawienie duszy współmałżonka_,
     _2. O pragnienie nieustannego nawracania serca do Boga_,
     _3. O powrót do współmałżonka i pełnego realizowania przysięgi małżeńskiej_
