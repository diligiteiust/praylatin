title: Prosta modlitwa uwolnienia
lang: pl
language: Polski
tags:
  - Uwolnienie
lines:
  - >
    In the Name of our Lord Jesus Christ and by the power of His Most Precious Blood, I bind, 
    I chain, and I silence any demon(s) of “$demons” and I send them to the foot of the Cross 
    for Jesus Christ to do with as He wills.
  - In the Name of the Father, and of the Son and of the Holy Spirit. Amen.
  - (3X)
