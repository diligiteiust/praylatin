title: Litaniae Kyrie Eleison
lang: pl
language: Polski
tags:
  - Litania
  - Hide
lines:
  - __Kyrie eleison__, Chryste eleison, Kyrie eleison.
  - __Chryste, usłysz nas__. Chryste, wysłuchaj nas.
  - __Ojcze z nieba, Boże__, zmiłuj się nad nami
  - __Synu, Odkupicielu świata, Boże__, zmiłuj się nad nami
  - __Duchu Święty, Boże__, zmiłuj się nad nami
  - __Święta Trójco, jedyny Boże__, zmiłuj się nad nami
