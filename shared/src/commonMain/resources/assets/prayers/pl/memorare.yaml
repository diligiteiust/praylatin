title: Pomnij
lang: pl
language: Polski
tags:
  - Podstawowe
  - Do Matki Bożej
lines:
  - Pomnij, o najmiłosierniejsza Pano Maryjo,
  - że od wieków nie słyszano,
  - aby kto, uciekając się do Ciebie,
  - Twej pomocy wzywając,
  - Ciebie o przyczynę prosząc,
  - miał być od Ciebie opuszczonym.
  - Tą nadzieją ożywiony uciekam się do Ciebie,
  - o Maryjo, Panno nad pannami i Matko Jezusa Chrystusa.
  - Przystępuję do Ciebie,
  - staję przed Tobą jako grzeszny człowiek, drżąc i wzdychając.
  - O Pani świata! Racz nie gardzić moimi prośbami. O Matko Słowa przedwiedznego;
  - >
    racz wysłuchać mnie nędznego, który do Ciebie z tego padołu wołam. Bądź mi pomocą we wszystkich 
    moich potrzebach teraz i zawsze, a osobliwie w godzinę śmierci, o łaskawa, o litościwa,
    o słodka Panno Maryjo!
  - Amen
notes:
  "Modlitwa św Bernarda do Matki Boskiej.
  Imprimatur: W Krakowie, dnia 4 marca 1928. X. Dr. Jan Korzonkiewicz, cenzor. 
  Nihil Obstat: 9. VII. 1936. X. Dr. Kaz. Prażmowski, cenzor."