title: Litania do Ducha Świętego
lang: pl
language: Polski
tags:
  - Litania
  - Do Ducha Świetego
lines:
  - "@litkyrie"
  - ^^^
  - Duchu Święty, od Ojca i Syna pochodzący, __zmiłuj się nad nami__
  - Duchu Święty, mądrości...
  - Duchu Święty, bojaźni Bożej...
  - Duchu Święty, łaski i miłosierdzia...
  - Duchu Święty, wiary, pokoju i miłości...
  - Duchu Święty, pokory i czystości...
  - Duchu Święty, cierpliwości...
  - Duchu Święty, skruchy i żalu...
  - Duchu Święty, światłości serca...
  - Duchu Święty, radości i wesele wybranych...
  - Duchu Święty, światłości Proroków...
  - Duchu Święty, mądrości Apostołów...
  - Duchu Święty, czystości Dziewic...
  - Duchu Święty, nasz Pocieszycielu...
  - Duchu Święty, nasz Wodzu i Przewodniku...
  - ^^^
  - Bądź nam miłościw, __przepuść nam, Panie.__
  - Bądź nam miłościw, __wysłuchaj nas, Panie.__
  - ^^^
  - Od wszelkiego grzechu i pokusy doń, __wybaw nas, Duchu Święty, Boże__
  - Od sprzeciwiania się uznanej prawdzie wiary świętej...
  - Od zbytniej ufności w miłosierdzie Boże...
  - Od wszelkiej rozpaczy...
  - Od złości i nienawiści...
  - Od zatwardziałości serca...
  - Od wszelkiego zaniedbania...
  - Od wszelkich złych i nieczystych spraw i myśli...
  - Od nagłej i niespodziewanej śmierci...
  - Od potępienia wiekuistego...
  - ^^^
  - My grzeszni, __Ciebie Boga prosimy, wysłuchaj nas, Duchu Święty, Boże__
  - ^^^
  - Abyś Kościołem Twym świętym rządzić i zachować go raczył...
  - Abyś Namiestnika Apostolskiego i wszystkie duchowne stany w świętej pobożności zachować raczył...
  - Abyś w pobożności i pokorze utwierdzać raczył...
  - Abyś nam stałości i męstwa udzielić raczył...
  - Abyś umysły nasze ku pożądaniu nieba podnieśc raczył...
  - Abyś nas oczyściwszy, na godne mieszkanie dla siebie poświęcić raczył...
  - Abyś nas w cierpieniach naszych pocieszać raczył...
  - Abyś w łasce Twojej utwierdzać i zbawić raczył...
  - Abyś nas wszystkich do uczestnictwa chwały wiekuistej doprowadzić raczył...
  - ^^^
  - Przez wieczne pochodzenie Twoje od Ojca i Syna, __wysłuchaj nas, Panie__
  - Przez poczęcie Maryi Dziewicy, Najświętszej Matki Jezusa Chrystusa...
  - Przez przyjście Twoje w językach ognistych...
  - Abyśmy Ciebie miłowali i dla Ciebie grzechów się strzegli...
  - ^^^
  - "@litagnus"
  - ^^^
  - Kýrie, eléison. Christe, eléison. Kýrie, eléison.
  - ^^^
  - "@paternoster"
  - ^^^
  - V. __Serce czyste__ stwórz we mnie, Boże
  - R. __I Ducha prawego__ odnów we wnętrzu moim.
  - V. __Panie__, wysłuchaj modlitwy mojej.
  - R. __A wołanie moje__ niech do Ciebie przyjdzie.
  - ^^^
  - __Módlmy się.__
  - >
    Przybądź, Duchu Święty, któryś ludy różnych języków zespolił w jedności wiary,
    racz napełnić serca Twoich wiernych i zapal w nich ogień Twojej miłości, aby Twoja łaska nas
    oświeciła i broniła od wszelkiego zła. __Amen.__