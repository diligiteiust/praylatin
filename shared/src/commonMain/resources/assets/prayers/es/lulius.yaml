    ### Julio - mes de adoración a la Preciosísima Sangre del Señor.
  - ^^^
  - >
    El mes de julio, según el calendario litúrgico tradicional, comienza con la Solemnidad 
    de la Preciosísima Sangre del Señor Jesús y está dedicado a la contemplación y adoración 
    de la Preciosísima Sangre de Cristo. Honramos este misterio uniéndonos a Cristo en 
    la Sagrada Comunión, reflexionando sobre los momentos del derramamiento de la Sangre de Cristo, 
    tal como se registran en la liturgia, en la Sagrada Escritura y en el testimonio de los mártires.
  - ^^^
  - >
    En la experiencia diaria del triunfo del mal, de la banalización del pecado, de la moda 
    de la duda, de la profanación de los misterios y de los lugares sagrados, estamos invitados 
    y llamados a ponernos espiritualmente bajo la Cruz de Jesús y recoger la Sangre de Cristo, 
    que todavía hoy fluye de sus Llagas.
  - ^^^
  - >
    De la adoración brota la gracia de aceptar cada dolor, cada oscuridad, la consecuencia 
    de cada pecado como la presencia especial de la Sangre de Jesús. La miseria del mundo circundante, 
    nacida del orgullo humano, nos impulsa a ofrecer la súplica: "¡Sálvanos!" a Cristo, 
    en las palabras de la Letanía a su Sangre. En las invocaciones de la letanía, profesamos nuestra 
    fe en el poder de la Preciosísima Sangre y, al experimentar su acción, nos volvemos capaces 
    de asemejarnos a Cristo Resucitado y convertirnos en: "la fuerza de los creyentes", 
    "la fuente de la misericordia", "la esperanza del penitente", "el consuelo del que llora", 
    "el refugio del que está en peligro", "el consuelo del moribundo".
  - ^^^
  - >
    Un ferviente promotor del culto a la Preciosa Sangre de Cristo en el siglo XIX fue Gasper 
    del Búfalo, fundador de la Congregación de los Misioneros de la Preciosa Sangre. Dedicó una 
    nueva obra al misterio de la Preciosa Sangre de Cristo porque estaba convencido de que: 
    «En el pasado, solo se atacaban las verdades individuales de la fe. En nuestros tiempos, 
    esta batalla se libra contra la religión, y especialmente contra nuestro Señor Crucificado. 
    Por lo tanto, es necesario renovar la gloria de la cruz de nuestro Salvador». En 1822, obtuvo 
    permiso para celebrar la fiesta litúrgica de la Preciosa Sangre el 1 de julio en todas las casas 
    de su asociación, y posteriormente en los lugares donde existía la Cofradía de la Preciosa Sangre.
  - ^^^
  - >
    El Papa Pío IX, con el decreto Redempti sumus (1849), extendió la celebración de la fiesta 
    a toda la Iglesia, y el Papa Pío X aprobó su fecha para el 1 de julio. El Papa Juan XXIII fomentó 
    esta devoción en su Carta Apostólica Inde a primis sobre la extensión de la devoción 
    a la Preciosísima Sangre de Nuestro Señor Jesucristo (30 de junio de 1959), a la que Juan Pablo II 
    se refiere durante su catequesis.
