    ### Promesas para los devotos del Sagrado Corazón de Jesús.
  - ^^^
  - >
    Jesús le dijo a Santa Margarita María Alacoque que su Corazón se convertiría en fuente 
    de muchas gracias para los fieles. _"Te prometo que mi Corazón se expandirá para derramar 
    en abundancia la influencia de su divino amor sobre quienes así lo honren y hagan que sea honrado."_
  - ^^^
  - >
    Jesús reveló 12 promesas a la Hermana María Margarita para quienes practican la devoción 
    a Su Sagrado Corazón.
  - ^^^
  - |
    ### Las 12 Promesas del Sagrado Corazón de Jesús a Santa Margarita de Alacoque:
  - |
    1. _Les daré todas las gracias necesarias a su estado._
    2. _Pondré paz en sus familias._
    3. _Les consolaré en sus penas._
    4. _Seré su refugio seguro durante la vida, y, sobre todo, en la hora de la muerte._
    5. _Derramaré abundantes bendiciones sobre todas sus empresas._
    6. _Bendeciré las casas en que la imagen de mi Corazón sea expuesta y venerada._
    7. _Los pecadores hallarán en mi Corazón la fuente, el Océano infinito de la misericordia._
    8. _Las almas tibias se volverán fervorosas._
    9. _Las almas fervorosas se elevarán a gran perfección._
    10. _Daré a los sacerdotes el talento de mover los corazones más empedernidos._
    11. _Las personas que propaguen esta devoción tendrán su nombre escrito en mi Corazón, 
        y jamás será borrado de El._
    12. _Les prometo en el exceso de mi misericordia, que mi amor todopoderoso concederá 
        a todos aquellos que comulgaren por nueve primeros viernes consecutivos, la gracia 
        de la perseverancia final; no morirán sin mi gracia, ni sin la recepción de los santos 
        sacramentos. Mi Corazón será su seguro refugio en aquel momento supremo._
