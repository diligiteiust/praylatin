title: Te Deum
lang: es
language: Español
tags:
  - Básico
lines:
  - A Ti, oh Dios, te alabamos;
  - a Ti, Señor, te reconocemos.
  - A Ti, Eterno Padre,
  - te venera toda la creación.
  - ^^^
  - Los ángeles todos,
  - los cielos y todas las potestades te honran.
  - "Los querubines y serafines "
  - "te cantan sin cesar:"
  - ^^^
  - Santo, Santo, Santo,
  - es el Señor Dios del Universo.
  - Los cielos y la tierra
  - están llenos de la majestad de tu gloria.
  - ^^^
  - A Ti te ensalza el glorioso coro de los Apóstoles,
  - A Ti te ensalza la multitud admirable de los Profetas,
  - A Ti te ensalza el blanco ejército de los Mártires.
  - "A Ti la Iglesia Santa extendida por toda la tierra, te proclama:"
  - ^^^
  - Padre de inmensa majestad,
  - Hijo único y verdadero, digno de adoración,
  - Espíritu Santo Paráclito.
  - Tú eres el Rey de la gloria, Cristo.
  - ^^^
  - Tú eres el Hijo único del Padre.
  - Tú, para liberar al hombre,
  - aceptaste la condición humana,
  - sin desdeñar el seno de la Virgen.
  - ^^^
  - Tú, rotas las cadenas de la muerte,
  - abriste a los creyentes el Reino del Cielo.
  - ^^^
  - Tú te sientas a la derecha de Dios
  - en la gloria del Padre.
  - Creemos que un día has
  - de venir como Juez.
  - ^^^
  - Te rogamos, pues,
  - que vengas en ayuda de tus siervos,
  - a quienes redimiste
  - con tu preciosa Sangre.
  - ^^^
  - Haz que en la gloria eterna
  - nos asociemos a tus Santos.
  - ^^^
  - Salva a tu pueblo, Señor,
  - y bendice tu heredad.
  - Sé su Pastor
  - y ensálzalo eternamente.
  - ^^^
  - Día tras día te bendecimos.
  - Y alabamos tu Nombre
  - para siempre,
  - por eternidad de eternidades.
  - ^^^
  - Dígnate, Señor, en este
  - día guardarnos del pecado.
  - Ten piedad de nosotros, Señor, ten piedad de nosotros.
  - ^^^
  - Que tu misericordia, Señor, venga sobre nosotros,
  - como lo esperamos de Ti.
  - En Ti, Señor, confié,
  - no me vea defraudado para siempre.
  - ^^^
  - __V.__ Bendito eres, Señor, Dios de nuestros padres.
  - __R.__ Y digno de alabanza, y glorioso por lo siglos.
  - __V.__ Bendigamos al Padre, y al Hijo con el Espíritu Santo.
  - __R.__ Alabémosle y ensalcémosle sobre todas las cosas por los siglos.
  - __V.__ Bendito eres Señor en lo más alto del cielo.
  - __R.__ Y digno de alabanza, y glorioso y ensalzado por todos los siglos.
  - __V.__ Bendice, alma mía, al Señor.
  - __R.__ Y nunca olvides sus muchos beneficios.
  - __V.__ Señor, escucha mi oración.
  - __R.__ Y llegue a Ti mi clamor.
  - "Los sacerdotes añaden:"
  - __V.__ El Señor esté con vosotros.
  - __R.__ Y con tu espíritu.
  - ^^^
  - __Oremos__
  - >
    __Oh Dios,__ cuya misericordia es infinita e inagotable la
    bondad, damos gracias a tu divina Majestad, por los bienes
    que hemos recibido, implorando siempre tu clemencia, para
    que no abandonando a aquellos a quienes concedes lo que te
    piden, los dispongas para recibir las recompensas eternas.
  - ^^^
  - >
    __Oh Dios,__ que has instruido los corazones de los fieles con
    la luz del Espíritu Santo, concédenos según el mismo
    Espíritu conocer las cosas rectas y gozar siempre de sus
    divinos consuelos.
  - ^^^
  - >
    __Oh Dios,__ que no permites sea afligido en demasía
    cualquiera que en Ti espera, sino que atiendes piadoso a
    "nuestras súplicas: te damos gracias por haber aceptado"
    nuestras peticiones y votos, suplicándote piadosísimamente
    que merezcamos vernos libres de toda adversidad. Por
    nuestro Señor Jesucristo...
  - ^^^
  - R. Amén.
