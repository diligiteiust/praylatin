title: Padre Eterno
lang: es
language: Español
tags:
  - Jesucristo
  - Hide
lines:
  - Padre Eterno, yo Os ofrezco
  - el Cuerpo y la Sangre, el Alma y la Divinidad
  - de Vuestro Amadísimo Hijo Jesucristo, Nuestro Señor y Salvador,
  - en desagravio por nuestros pecados, y por los pecados del mundo entero.
