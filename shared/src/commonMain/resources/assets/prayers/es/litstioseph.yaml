title: Letanías De San José
lang: es
language: Español
dates:
  - "* * 19 3 *"
tags:
  - Letanía
  - San José
lines:
  - "@litkyrie"
  - ^^^
  - Santa Maria, __Ruega por nosotros.__
  - San José,...
  - Ilustre descendiente de David, ...
  - Luz de los Patriarcas,...
  - Esposo de la Madre de Dios,...
  - Casto guardián de la Virgen,...
  - Padre nutricio del Hijo de Dios,...
  - Celoso defensor de Cristo,...
  - Jefe de la Sagrada Familia,...
  - José, justísimo,...
  - José, castísimo,...
  - José, prudentísimo,...
  - José, fortísimo,...
  - José, valentísimo,...
  - José, fidelísimo,...
  - Espejo de paciencia,...
  - Amante de la pobreza,...
  - Modelo de trabajadores,...
  - Gloria de la vida doméstica,...
  - Custodio de Vírgenes,...
  - Sostén de las familias,...
  - Consuelo de los desgraciados,...
  - Esperanza de los enfermos,...
  - Patrón de los moribundos,...
  - Terror de los demonios,...
  - Protector de la Santa Iglesia,...
  - ^^^
  - "@litagnus"
  - ^^^
  - __V.__ Lo nombró administrador de su casa.
  - __R.__ Y señor de todas sus posesiones.
  - ^^^
  - "ORACIÓN:__"
  - ¡Oh Dios, que con inefable providencia
  - te dignaste elegir a San José para esposo de tu Santísima Madre!;
  - te rogamos nos concedas tenerlo como intercesor en el cielo,
  - ya que lo veneramos como protector en la tierra.
  - Tú, que vives y reinas por los siglos de los siglos.
  - Amen.
