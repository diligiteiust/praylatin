lines:
  - "@"
  - >
    La duodécima promesa del Señor Jesús a los que adoran al Sagrado Corazón de Jesús, llamado __el gran__:
  - >
    12. _Prometo en el exceso de la misericordia de mi Corazón que mi amor todopoderoso concederá 
    a todos aquellos que reciban la Sagrada Comunión los Primeros Viernes durante nueve meses seguidos, 
    la gracia de la contrición y de la penitencia final, para que no mueran en mi desgracia 
    ni sin los sacramentos, y que mi Corazón se convierta en su refugio más seguro en la hora 
    de la muerte._
  - ^^^
  - >
    La condición para recibir esta gran gracia es comulgar dignamente (en estado de gracia) durante 
    nueve primeros viernes de mes consecutivos. La intención de comulgar ese día también 
    es importante. El sacramento debe recibirse:
  - ^^^
  - > 
    __Con la intención de compensar al Divino Corazón de los pecados e injurias que le acontecen 
    en el Santísimo Sacramento.__
