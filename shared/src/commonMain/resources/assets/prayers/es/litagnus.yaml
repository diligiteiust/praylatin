title: Litaniae Cordero de Dios
lang: es
language: Espaniol
tags:
  - Letanía
  - Hide
lines:
  - __Cordero de Dios, que quitas los pecados del mundo__, Perdónanos, Jesús.
  - __Cordero de Dios, que quitas los pecados del mundo__, Escúchanos Jesús.
  - __Cordero de Dios, que quitas los pecados del mundo__, Ten misericordia de nosotros Jesús.
