    ### Promesa
  - >
    Nuestra Señora se apareció nuevamente a Lucía el 10 de diciembre de 1925, en Pontevedra 
    y le hizo la siguiente promesa:
  - ^^^
  - >
    _Anuncio en mi nombre que prometo venir en el momento de la muerte con todas las gracias 
    necesarias para la salvación a aquellos que, los primeros sábados de cinco meses consecutivos, 
    reciban el sacramento de la confesión, la Sagrada Comunión, recen cinco decenas del rosario 
    y me hagan compañía durante 15 minutos, meditando los 15 misterios del rosario con la intención 
    de hacer reparación a mi Inmaculado Corazón._
  - ^^^
  - "### Condiciones del culto los primeros sábados del mes"
  - ^^^
  - > 
    1. Confesión – el primer sábado del mes o hasta 8 días antes o después del primer sábado, 
    siempre que esté en estado de gracia (sin pecado mortal);
  - > 
    2. Sagrada Comunión – el primer sábado del mes o, por una causa válida y con permiso del 
    sacerdote, el día siguiente, domingo;
  - >
    3. Rosario – Los cinco misterios del Rosario deben ser recitados correctamente, meditando 
    cada uno de ellos;
  - > 
    4. Meditación - puedes meditar sobre todos los misterios o sobre cualquiera de los que elijas 
    durante 15 minutos, pero Nuestra Señora nos pidió que meditáramos sobre cada uno de ellos 
    al menos una vez durante los primeros cinco sábados. Ya que Nuestra Señora habló de quienes 
    la acompañan, debemos recordar su participación en cada uno de los misterios que elijamos meditar.
  - ^^^
  - "__Todas__ las condiciones deben cumplirse con la intención:"
  - ^^^
  - >
    __Reparaciones por las blasfemias e injurias cometidas por personas contra 
    el Inmaculado Corazón de María.__
  - ^^^
  - |
    ### ¿Por qué cinco sábados?
  - >
    El Señor Jesús explicó a Lucía durante la vigilia de la noche del 29 al 30 de mayo de 1930:
  - ^^^
  - >
    _Hija mía, la razón es muy sencilla: hay cinco tipos de insultos y blasfemias contra 
    el Inmaculado Corazón de María:_
  - ^^^
  - >
    1. _Blasfemias contra la Inmaculada Concepción._
  - >
    2. _Blasfemias contra la Virginidad de Nuestra Señora._
  - >
    3. _Blasfemias contra Su Divina Maternidad, con simultánea oposición a reconocerla como Madre 
    del género humano._
  - >
    4. _Las acciones de aquellos que públicamente intentan inculcar en los corazones de los niños 
    la indiferencia, el desprecio y hasta el odio hacia esta Madre Inmaculada._
  - >
    5. _Las acciones de quienes profanan imágenes de la Santísima Virgen María._
