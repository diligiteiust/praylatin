  - Jesús, nuestro refugio...
  - Jesús, padre de los pobres...
  - Jesús, tesoro de los fieles...
  - Jesús, pastor bueno...
  - Jesús, verdadera luz...
  - Jesús, sabiduría eterna...
  - Jesús, bondad infinita...
  - Jesús, camino y vida nuestra...
  - Jesús, alegría de los ángeles...
  - Jesús, rey de los patriarcas...
  - Jesús, maestro de los apóstoles...
  - Jesús, doctor de los evangelistas...
  - Jesús, fortaleza de los mártires...
  - Jesús, luz de los confesores...
  - Jesús, pureza de las vírgenes...
  - Jesús, corona de todos los santos...
  - ^^^
  - Senos propicio, Perdónanos, Jesús.
  - Senos propicio, Escúchanos, Jesús.
  - ^^^
  - De todo mala, __Líbranos, Jesús.__
  - De todo pecadoa...
  - De tu iraa...
  - De las asechanzas del demonioa...
  - Del espíritu impuroa...
  - De la muerte eternaa...
  - Del menosprecio de tus inspiracionesa...
  - Por el misterio de tu santa encarnacióna...
  - Por tu natividada...
  - Por tu infanciaa...
  - Por tu divinísima vidaa...
  - Por tus trabajosa...
  - Por tu agonía y Pasióna...
  - Por tu cruz y desamparoa...
  - Por tus sufrimientosa...
  - Por tu muerte y sepulturaa...
  - Por tu resurreccióna...
  - Por tu ascensióna...
  - Por tu institución de la santísima Eucaristíaa...
  - Por tus gozosa...
  - Por tu gloria...
  - ^^^
  - "@litagnus"
  - ^^^
  - Jesús, óyenos. Jesús, escúchanos.
  - ^^^
  - __Oración__
  - Te pedimos Señor, que quienes veneremos el Santísimo
  - Nombre de Jesús disfrutemos en esta vida de la dulzura de
  - su gracia y de su gozo eterno en el Cielo. Por Jesucristo
  - nuestro Señor. Amen.
