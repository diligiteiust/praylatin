title: Acordaos
lang: es
language: Español
tags:
  - Básico
  - Santisima Virgen Maria
lines:
  - Acordaos, ¡oh piadosísima Virgen María!,
  - que jamás se ha oído decir
  - que ninguno de los que haya acudido a vuestra protección,
  - implorado vuestra asistencia
  - y reclamado vuestro socorro,
  - haya sido abandonado de Vos.
  - Animado con esta confianza, a Vos también acudo,
  - oh Madre, Virgen de las vírgenes,
  - y aunque gimiendo bajo el peso de mis pecados
  - me atrevo a comparecer ante Vuestra presencia Soberana.
  - No desechéis oh purísima Madre de Dios mis humildes súplicas,
  - antes bien, inclinad vuestros oídos a ella y dignaos escucharlas favorablemente.
  - Amen
