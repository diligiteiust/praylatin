title: El Angelus
lang: es
language: Español
lines:
  - __El Angel del Señor anunció a María.__
  - __Y concibió por obra del Espíritu Santo.__
  - ^^^
  - "@avemaria"
  - ^^^
  - __He aquí la esclava del Señor.__
  - __Hágase en mí según Tu palabra.__
  - ^^^
  - "@avemaria"
  - ^^^
  - __Y el Verbo se hizo carne.__
  - __Y habitó entre nosotros.__
  - ^^^
  - "@avemaria"
  - ^^^
  - __Ruega por nosotros,__ Santa Madre de Dios.
  - Para que seamos dignos de alcanzar las promesas de Nuestro Señor Jesucristo.
  - ^^^
  - "__Oremos:__"
  - Derrama, Señor, Tu gracia en nuestros corazones;
  - que habiendo conocido la Encarnación de Jesucristo,
  - Tu Hijo, por la voz del Angel,
  - por los méritos de Su Pasión
  - y de Su Cruz seamos llevados
  - a la gloria de la Resurrección.
  - Por el mismo Jesucristo, Nuestro Señor. Amén.
