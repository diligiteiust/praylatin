title: El Angelus
lang: es
language: Español
lines:
  - El Angel del Señor anunció a María.
  - Y concibió por obra del Espíritu Santo.
  - "@avemaria"
  - ^^^
  - He aquí la esclava del Señor.
  - Hágase en mí según Tu palabra.
  - "@avemaria"
  - ^^^
  - Y el Verbo se hizo carne.
  - Y habitó entre nosotros.
  - "@avemaria"
  - ^^^
  - Ruega por nosotros, Santa Madre de Dios.
  - Para que seamos dignos de alcanzar las promesas de Nuestro Señor Jesucristo.
  - ^^^
  - "__Oremos:__"
  - Derrama, Señor, Tu gracia en nuestros corazones;
  - que habiendo conocido la Encarnación de Jesucristo,
  - Tu Hijo, por la voz del Angel,
  - por los méritos de Su Pasión
  - y de Su Cruz seamos llevados
  - a la gloria de la Resurrección.
  - Por el mismo Jesucristo, Nuestro Señor. Amén.
