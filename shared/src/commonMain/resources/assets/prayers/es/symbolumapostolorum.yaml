title: Creo en Dios
lang: es
language: Español
lines:
  - Creo en Dios, Padre todopoderoso,
  - creador del Cielo y de la Tierra.
  - Creo en Jesucristo
  - su único Hijo, Nuestro Seńor,
  - __que fue concebido por obra y gracia del Espíritu Santo;__
  - __nació de Santa María Virgen;__
  - padeció bajo el poder de Poncio Pilato;
  - fue crucificado, muerto y sepultado;
  - descendió a los infiernos;
  - al tercer día resucitó de entre los muertos;
  - subió a los cielos
  - y está a la diestra de Dios Padre;
  - desde allí ha de venir a juzgar a los vivos y a los muertos.
  - Creo en el Espíritu Santo,
  - en la Santa Iglesia Católica,
  - la comumión de los Santos
  - en el perdon de los pecados
  - la resurrección de los muertos
  - y la vida eterna.
  - Amen.
