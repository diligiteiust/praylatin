title: Litaniae Señor, Ten piedad de nosotros
lang: es
language: Espaniol
tags:
  - Letanía
  - Hide
lines:
  - __Señor, Ten piedad de nosotros__. Cristo, Ten piedad de nosotros. Señor, Ten piedad de nosotros.
  - __Cristo, óyenos__, Cristo, escúchanos.
  - __Dios, Padre celestial__, Ten misericordia de nosotros.
  - __Dios Hijo, Redentor del mundo__, Ten misericordia de nosotros.
  - __Dios Espíritu Santo__, Ten misericordia de nosotros.
  - __Santísima Trinidad, un solo Dios__, Ten misericordia de nosotros.
