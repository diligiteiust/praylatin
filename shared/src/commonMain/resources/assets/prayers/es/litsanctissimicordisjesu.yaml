title: Letanías Al Sagrado Corazón De Jesús
lang: es
language: Español
dates:
  - "* * * * JUN ? *"
tags:
  - Letanía
  - Jesucristo
lines:
  - "@litkyrie"
  - ^^^
  - Corazón de Jesús, Hijo del Eterno Padre, __ten piedad de nosotros.__
  - Corazón de Jesús, formado por el Espíritu Santo en el seno de la Virgen Madre...
  - Corazón de Jesús, unido sustancialmente al Verbo de Dios...
  -
  - Corazón de Jesús, templo santo de Dios...
  - Corazón de Jesús, tabernáculo del Altísimo...
  - Corazón de Jesús, casa de Dios y puerta del cielo...
  - Corazón de Jesús, horno ardiente de caridad...
  - Corazón de Jesús, santuario de la justicia y del amor...
  - Corazón de Jesús, lleno de bondad y de amor...
  - Corazón de Jesús, abismo de todas las virtudes...
  - Corazón de Jesús, digno de toda alabanza...
  - Corazón de Jesús, Rey y centro de todos los corazones...
  - Corazón de Jesús, en quien se hallan todos los tesoros de la sabiduría y de la ciencia...
  - Corazón de Jesús, en quien reside toda la plenitud de la divinidad...
  - Corazón de Jesús, en quien el Padre se complace...
  - Corazón de Jesús, de cuya plenitud todos hemos recibido...
  - Corazón de Jesús, deseado de los eternos collados...
  - Corazón de Jesús, paciente y lleno de misericordia...
  - Corazón de Jesús, generoso para todos los que te invocan...
  - Corazón de Jesús, fuente de vida y santidad...
  - Corazón de Jesús, propiciación por nuestros pecados...
  -
  - Corazón de Jesús, triturado por nuestros pecados...
  - Corazón de Jesús, hecho obediente hasta la muerte...
  - Corazón de Jesús, traspasado por una lanza...
  - Corazón de Jesús, fuente de todo consuelo...
  - Corazón de Jesús, vida y resurrección nuestra...
  - Corazón de Jesús, paz y reconciliación nuestra...
  - Corazón de Jesús, víctima por los pecadores...
  - Corazón de Jesús, salvación de los que en Ti esperan...
  - Corazón de Jesús, esperanza de los que en Ti mueren...
  - Corazón de Jesús, delicia de todos los santos...
  - ^^^
  - "@litagnus"
  - ^^^
  - __Jesús,__ manso y humilde de Corazón,
  - haz nuestro corazón semejante al tuyo.
  - ^^^
  - "Oración:"
  - Oh Dios todopoderoso y eterno,
  - mira el Corazón de tu amadísimo Hijo,
  - y a las alabanzas y satisfacciones
  - que en nombre de los pecadores te ofrece y concede el perdón
  - a éstos que imploran tu misericordia en el nombre
  - de tu mismo Hijo Jesucristo,
  - que contigo vive y reina en union con el Espíritu Santo,
  - Dios por los siglos de los siglos. Amén.
