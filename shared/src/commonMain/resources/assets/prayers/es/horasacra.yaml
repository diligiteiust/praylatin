  - "@"
  - >
    La Hora Santa es un servicio que se celebra en honor al Sagrado Corazón de Jesús.
  - ^^^
  - >
    El mismo Salvador santificó varias veces esta devoción, reconociéndola claramente como 
    una de las formas más adecuadas de honrar su Sagrado Corazón, y confió a su sierva, 
    Santa Margarita María Alacoque, a permanecer fiel a esta santa práctica hasta el final de su vida.
  - ^^^
  - >
    _"Todas las noches, le dijo, desde el jueves hasta el viernes, te haré partícipe del dolor 
    mortal al que me sometí voluntariamente en el Huerto de los Olivos, y este dolor, 
    que no podrás comprender, te hará experimentar una especie de agonía, más difícil de soportar 
    que la muerte._
  - >
    _Para acompañarme en esta humilde oración, que entonces envié a mi Padre en medio de todos 
    estos tormentos, te levantarás entre las 11 y las 12 de la noche y, acostado con las piernas 
    cruzadas y el rostro en tierra, pasarás esa hora apaciguando la ira de Dios, implorando 
    misericordia por los pecadores y, en cierta medida, aliviando el dolor que me causó el abandono 
    de los Apóstoles, motivo del reproche que se les infligió por no poder velar conmigo durante 
    una hora. Durante esa hora, harás lo que te enseñaré."_
  - ^^^
  - "### El método de celebrar la Hora Santa"
  - ^^^
  - >
    En ningún momento nuestro Señor sufrió más en su alma que durante su agonía en el Huerto 
    de los Olivos. Su dolor fue tan grande que, para expresar su inmensidad, dijo a los Apóstoles:
  - >
    _„Mi alma está triste hasta el punto de morir;”_
  - >
    En recuerdo de esta terrible agonía, muchas personas dedican cada jueves a la oración, 
    de 11:00 a 12:00, para compartir y glorificar el sufrimiento del Salvador y contener 
    la ira de Dios provocada por nuestros pecados. Sin embargo, este piadoso ejercicio puede 
    realizarse un jueves mucho antes. Es muy apropiado realizar esta devoción la tarde 
    del Jueves Santo, así como la tarde del jueves anterior al Primer Viernes de cada mes. 
    Se obtiene indulgencia plenaria por celebrar la "Hora Santa" tras cumplir las condiciones 
    habituales.
  - ^^^
  - "### Acto de Ofrenda de la Hora Santa"
  - >
    Oh Jesús, que tanto nos amas y te ofreces por nuestros pecados, permíteme pasar en íntima 
    unión con tu Corazón, muriendo en el Huerto de los Olivos, esta Hora Santa que pediste 
    a tu fiel Esposa, Santa Margarita María. Oh Salvador, digno del mayor honor y adoración, 
    concédeme la más abundante participación en tus inefables dolores y en la tristeza y angustia 
    que invadieron el alma de tu Santísima Madre durante aquella terrible y dolorosa noche. 
    Para suplir lo que me falta, te ofrezco los sentimientos de tu Santísima Madre, 
    Santa Margarita María, y de todas las almas que supieron y saben consolarte en este misterio 
    de dolor y amor. Amén.
  - ^^^
  - "### Una propuesta de meditación durante la Hora Santa"
  - ___Sobre la oración de Cristo el Señor en el Huerto de Getsemaní, sobre su dolor y sudor de sangre.___
  - ^^^
  - >
    Después de la Última Cena y de la institución del Santísimo Sacramento, el Señor Jesús, 
    sabiendo que se acercaba la hora en que sería entregado, fue con sus discípulos al Huerto 
    de los Olivos…
  - >
    Buscando la soledad, se aleja de ellos, cae rostro en tierra y, confiando completamente 
    en la voluntad del Padre Eterno, ora:
  - >
    _„Padre, si quieres, aparta de mí esta copa; pero no se haga mi voluntad, sino la tuya.”_ (Łk 22,42)
  - ^^^
  - >
    Entonces, buscando consuelo, se dirige a sus discípulos, y al encontrarlos dormidos, regresa 
    a su lugar y repite la misma oración... Pero la tristeza que oprime su alma es tan pesada que, 
    deseando aliviarla, se acerca de nuevo a los apóstoles, y al verse abandonado por ellos, 
    se dirige al Padre Eterno y pide que le aparten el cáliz de la Pasión. Entonces todo su horror 
    se presenta aterradoramente al Salvador y lo llena de inmenso dolor y tristeza.
  - ^^^
  - >
    La visión de los innumerables pecados que el Salvador debía borrar, incluso más que la inminente 
    Pasión, le causa una gran tristeza y dolor. Vio los insultos y ultrajes que le aguardaban, 
    pero al mismo tiempo también la enormidad de los pecados, cuya terrible carga había asumido. 
    Fue como un torrente furioso de iniquidad derramándose sobre él. Atormentado por el dolor, 
    se humilla en el polvo ante su Padre, y gotas de sudor sangriento caen al suelo…
  - ^^^
  - >
    ¿Qué hace el Señor Jesús para aliviar la tristeza y el dolor? Reanuda una oración más larga 
    y ferviente... Con esto, nos enseñó que la oración es el remedio más eficaz para nuestro 
    sufrimiento, que cuanto más fuerte sea la tentación, más dura la lucha, más frecuente 
    y ferviente debe ser nuestra oración...
  - ^^^
  - >
    Mientras el Señor Jesús oraba, un ángel vino a fortalecerlo. No porque el Salvador necesitara 
    un ángel, sino para enseñarnos que, al orar con persistencia, siempre encontraremos fuerza 
    y consuelo en Dios.
  - ^^^
  - >
    ¡Alma que ama a Jesús! En el dolor del cuerpo y la angustia del alma, repite siempre: 
    "¡Dios, no se haga mi voluntad, sino la tuya!". Acepta el sufrimiento con espíritu de expiación 
    por los pecados de todos y por los tuyos. Refugiate en la oración, esperando con confianza 
    la ayuda y el consuelo que trae. Honra al Señor Jesús en su agonía, rogándole que un día endulce 
    tu agonía y la de todos los que morirán hoy: familiares, amigos y enemigos. Si haces esto con fe, 
    aceptarás la muerte sin remordimientos, a la hora que Dios quiera llamarte. El Corazón 
    de Jesús puede endulzarla tanto que, como uno de los grandes teólogos, te sorprenderá que 
    "sea posible morir tan dulcemente".
