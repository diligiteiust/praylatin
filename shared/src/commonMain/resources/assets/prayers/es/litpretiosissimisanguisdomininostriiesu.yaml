title: Litany of the Most Precious Blood of Jesus Christ
lang: la
language: Latina
lines:
  - Kyrie eleison, Chryste eleison, Kyrie eleison.
  - Chryste, usłysz nas. Chryste, wysłuchaj nas.
  - Ojcze z nieba, Boże, zmiłuj się nad nami
  - Synu, Odkupicielu świata, Boże, zmiłuj się nad nami
  - Duchu Święty, Boże, zmiłuj się nad nami
  - Święta Trójco, jedyny Boże, zmiłuj się nad nami
  -
  - Blood of Christ, only-begotten Son of the Eternal Father, save us.
  - Blood of Christ, Incarnate Word of God...
  - Blood of Christ, of the New and Eternal Testament...
  - Blood of Christ, falling upon the earth in the Agony...
  - Blood of Christ, shed profusely in the Scourging...
  - Blood of Christ, flowing forth in the Crowning with Thorns...
  - Blood of Christ, poured out on the Cross...
  - Blood of Christ, price of our salvation...
  - Blood of Christ, without which there is no forgiveness...
  - Blood of Christ, Eucharistic drink and refreshment of souls...
  - Blood of Christ, stream of mercy...
  - Blood of Christ, victor over demons...
  - Blood of Christ, courage of martyrs...
  - Blood of Christ, strength of confessors...
  - Blood of Christ, bringing forth virgins...
  - Blood of Christ, help of those in peril...
  - Blood of Christ, relief of the burdened...
  - Blood of Christ, solace in sorrow...
  - Blood of Christ, hope of the penitent...
  - Blood of Christ, consolation of the dying...
  - Blood of Christ, peace and tenderness of hearts...
  - Blood of Christ, pledge of Eternal Life...
  - Blood of Christ, freeing souls from purgatory...
  - Blood of Christ, most worthy of all glory and honor...
  -
  - Baranku Boży, który gładzisz grzechy świata, przepuść nam, Panie
  - Baranku Boży, który gładzisz grzechy świata, wysłuchaj nas, Panie
  - Baranku Boży, który gładzisz grzechy świata, zmiłuj się nad nami, Panie
  -
  - Jezu cichy i pokornego Serca.
  - Uczyń serca nasze według Serca Twego.
  -
  - "Módlmy się:"
  - Wszechmogący, wieczny Boże,
  - wejrzyj na Serce najmilszego Syna swego
  - i na chwałę, i zadośćuczynienie,
  - jakie w imieniu grzeszników Ci składa;
  - daj się przebłagać tym, którzy żebrzą Twego miłosierdzia
  - i racz udzielić przebaczenia
  - w imię tegoż Syna swego, Jezusa Chrystusa,
  - który z Tobą żyje i króluje na wieki wieków. Amen.
