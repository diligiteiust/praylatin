    ### The month of July is dedicated to the Precious Blood.
  - ^^^
  - >
    The early Fathers say that the Church was born from the pierced side 
    of Christ, and that the sacraments were brought forth through His Blood.
  - ^^^
  - >
    Devotion to the Precious Blood is not a spiritual option, it is a spiritual obligation, 
    and that not only for priests, but for every follower of Christ. I really believe that one 
    of the symptoms of modern society (and I would even include, sadly, modern Catholic society) 
    one of the symptoms of a growing, gnawing secularism is the lessening and the weakening 
    of devotion to the Precious Blood. Devotion, as we know, is a composite of three elements: 
    It is first- veneration, it is secondly- invocation, and it is thirdly- imitation. 
    In other words, devotion to the Precious Blood of Christ, the Lamb of God who was slain, 
    is first of all to be veneration on our part, which is a composite of knowledge, 
    love and adoration. We are to study to come to a deeper understanding of what those two casual
    words, Precious Blood, really mean.
  - ^^^
  - >
    To understand the meaning of the Precious Blood we must get some comprehension of the gravity 
    of sin, of the awfulness of offending God, because it required the Blood of the Son of God 
    to forgive that sin. We are living in an age in which to sin has become fashionable.
  - ^^^
  - >
    A zealous promoter of the cult of the Precious Blood of Christ in the 19th century was
    Gasper del Bufalo, founder of the Congregation of the Missionaries of the Precious Blood.
    He dedicated a new work to the mystery of the Precious Blood of Christ because he was convinced 
    that: "In the past, only individual truths of faith were attacked. In our times, this battle 
    is waged against religion, and especially against our Crucified Lord. Therefore, it is necessary 
    to renew the glory of the cross of our Savior." In 1822, he obtained permission to celebrate 
    the liturgical feast of the Precious Blood on July 1st in all houses of his association, 
    and later in places where the Confraternity of the Precious Blood existed.
  - ^^^
  - >
    Pope Pius IX, with the decree Redempti sumus (1849), expanded the celebration of the feast 
    to the entire Church, and Pope Pius X approved its date for July 1. Pope John XXIII encouraged 
    this devotion in his Apostolic Letter Inde a primis on the extension of devotion to
    the Most Precious Blood of Our Lord Jesus Christ (June 30, 1959), to which John Paul II refers
    during his catechesis.
