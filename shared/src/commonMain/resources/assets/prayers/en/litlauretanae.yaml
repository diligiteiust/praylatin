lines:
  - "@litkyrie"
  - ^^^
  - Holy Mary, __Pray for us.__
  - Holy Mother of God,...
  - Holy Virgin of virgins,...
  - Mother of Christ,...
  - Mother of the Church,...
  - Mother of divine grace,...
  - Mother most pure,...
  - Mother most chaste,...
  - Mother inviolate,...
  - Mother undefiled,...
  - Mother most amiable,...
  - Mother most admirable,...
  - Mother of good counsel,...
  - Mother of our Creator,...
  - Mother of our Savior,...
  - Virgin most prudent,...
  - Virgin most venerable,...
  - Virgin most renowned,...
  - Virgin most powerful,...
  - Virgin most merciful,...
  - Virgin most faithful,...
  - Mirror of justice,...
  - Seat of wisdom,...
  - Cause of our joy,...
  - Spiritual vessel,...
  - Vessel of honor,...
  - Singular vessel of devotion,...
  - Mystical rose,...
  - Tower of David,...
  - Tower of ivory,...
  - House of gold,...
  - Ark of the covenant,...
  - Gate of heaven,...
  - Morning star,...
  - Health of the sick,...
  - Refuge of sinners,...
  - Comforter of the afflicted,...
  - Help of Christians,...
  - Queen of angels,...
  - Queen of patriarchs,...
  - Queen of prophets,...
  - Queen of apostles,...
  - Queen of martyrs,...
  - Queen of confessors,...
  - Queen of virgins,...
  - Queen of all saints,...
  - Queen conceived without original sin,...
  - Queen assumed into heaven,...
  - Queen of the most holy Rosary,...
  - Queen of peace,...
  - Queen of families,...
  -
  - ^^^
  - "@litagnus"
  - ^^^
  - Pray for us, O holy Mother of God.
  - That we may be made worthy of the promises of Christ.
  - ^^^
  - "__Let us pray:__"
  - Grant, O Lord God, we beseech Thee,
  - that we Thy servants may rejoice in continual health of mind and body;
  - and through the glorious intercession of Blessed Mary ever Virgin,
  - be freed from present sorrow
  - and enjoy eternal gladness.
  - Through Christ our Lord.
  - Amen.
