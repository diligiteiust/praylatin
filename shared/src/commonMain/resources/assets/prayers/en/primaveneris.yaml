dates:
  - "* * * * * FRI#1 *"
lines:
  - "@"
  - >
    The twelfth promise of the Lord Jesus to those who worship the Sacred Heart of Jesus, called __the great__:
  - >
    12. _I promise you in the excessive mercy of My Heart that Its all-powerful love will grant 
    to all those who receive Holy Communion on nine first Fridays of consecutive months the grace 
    of final repentance; they will not die under My displeasure or without receiving their sacraments, 
    My divine Heart making Itself their assured refuge at the last moment._
  - ^^^
  - >
    The condition for receiving this great grace is to worthily receive Holy Communion 
    (in a state of grace) on nine consecutive First Fridays of the month. 
    The intention of receiving Holy Communion on that day is also important. 
    The sacrament should be received:
  - ^^^
  - > 
    __For the intention of reparation to the Divine Heart for the sins and insults that come to 
    It in the Blessed Sacrament.__
notes:
