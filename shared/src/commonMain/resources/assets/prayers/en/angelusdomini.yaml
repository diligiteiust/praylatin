title: The Angelus Prayer
lang: en
language: English
tags:
  - Blessed Virgin Mary
lines:
  - __The Angel of the Lord declared unto Mary.__
  - __And She conceived of the Holy Spirit.__
  - ^^^
  - "@avemaria"
  - ^^^
  - __Behold the handmaid of the Lord.__
  - __Be it done unto me according to thy word.__
  - ^^^
  - "@avemaria"
  - ^^^
  - __And the Word was made flesh.__
  - __And dwelt among us.__
  - ^^^
  - "@avemaria"
  - ^^^
  - __Pray for us,__ O holy Mother of God.
  - That we may be made worthy of the promises of Christ.
  - ^^^
  - "__Let us pray:__"
  - Pour forth, we beseech Thee, O Lord,
  - Thy grace into our hearts;
  - that we to whom the Incarnation of Christ Thy Son was made known
  - by the message of an angel,
  - may by His Passion and Cross
  - be brought to the glory of His Resurrection.
  - Through the same Christ Our Lord. Amen.