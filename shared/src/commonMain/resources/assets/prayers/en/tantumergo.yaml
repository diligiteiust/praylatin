title: Down in adoration falling
lang: en
language: English
tags:
  - Holy Eucharist
lines:
  - Down in adoration falling,
  - Lo! the sacred Host we hail,
  - Lo! oe’r ancient forms departing
  - Newer rites of grace prevail;
  - Faith for all defects supplying,
  - Where the feeble senses fail.
  -
  - To the everlasting Father,
  - And the Son Who reigns on high
  - With the Holy Spirit proceeding
  - Forth from each eternally,
  - Be salvation, honor blessing,
  - Might and endless majesty. Amen.
  -
  - Thou hast given them bread from heaven.
  - Having within it all sweetness.
  -
  - "Let us pray:"
  - O God, who in this wonderful Sacrament left us a memorial
  - "of Thy Passion: grant, we implore Thee, that we may so"
  - venerate the sacred mysteries of Thy Body and Blood, as
  - always to be conscious of the fruit of Thy Redemption.
  - Thou who livest and reignest forever and ever. Amen.
