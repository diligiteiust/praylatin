    ### Promise
  - >
    Our Lady appeared to Lucia again on December 10, 1925, in Pontevedra and made the following promise:
  - ^^^
  - >
    _Announce in my name that I promise to come at the moment of death with all the graces necessary 
    for salvation to those who, on the first Saturdays of five consecutive months, will receive the 
    sacrament of confession, Holy Communion, recite five decades of the rosary, and keep me company 
    for 15 minutes, meditating on the 15 mysteries of the rosary with the intention of making 
    reparation to my Immaculate Heart._
  - ^^^
  - "### Conditions of worship on the first Saturdays of the month"
  - ^^^
  - > 
    1. Confession – on the first Saturday of the month or up to 8 days before or after the first 
    Saturday, provided you are in a state of grace (no mortal sin);
  - > 
    2. Holy Communion – on the first Saturday of the month or, for a valid reason and with the 
    priest's permission, on the following day, Sunday;
  - >
    3. Rosary – the five mysteries of the Rosary must be recited correctly, meditating on each of them;
  - > 
    4. Meditation – You can meditate on all the mysteries or any of the mysteries you choose 
    for 15 minutes, but Our Lady asked us to meditate on each of them at least once during the 
    first five Saturdays. Since Our Lady spoke of those who "keep her company", we should remember 
    her participation in each of the mysteries we choose to meditate on.
  - ^^^
  - "__All__ conditions must be fulfilled with the intention:"
  - ^^^
  - >
    __Reparations for blasphemies and insults committed by people against the Immaculate Heart of Mary.__
  - ^^^
  - |
    ### Why five Saturdays?
  - >
    The Lord Jesus explained to Lucia during the vigil on the night of May 29-30, 1930:
  - ^^^
  - >
    _My daughter, the reason is very simple: there are five types of insults and blasphemies against 
    the Immaculate Heart of Mary:_
  - ^^^
  - >
    1. _Blasphemies against the Immaculate Conception._
  - >
    2. _Blasphemies against the Virginity of Our Lady._
  - >
    3. _Blasphemies against Her Divine Motherhood, with simultaneous opposition to recognizing Her 
    as the Mother of the human race._
  - >
    4. _The actions of those who publicly try to instill in the hearts of children indifference, 
    contempt, and even hatred towards this Immaculate Mother._
  - >
    5. _The actions of those who desecrate images of the Blessed Virgin Mary._
