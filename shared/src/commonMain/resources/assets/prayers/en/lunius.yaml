    ### Promises for devotees of the Sacred Heart of Jesus
  - ^^^
  - >
    Jesus told St. Margaret Mary Alacoque that His Heart would become a source of many graces 
    for the faithful. _"I promise you that my heart shall expand itself to shed in abundance 
    the influence of its divine love upon those who shall thus honor it, and cause it to be honored."_
  - ^^^
  - >
    Jesus revealed 12 promises to Sister Mary Margaret for those who practice devotion 
    to His Sacred Heart.
  - ^^^
  - |
    ### 12 promises for devotees of the Sacred Heart of Jesus:
  - |
    1. _I will give them all the graces necessary in their state of life._
    2. _I will establish peace in their homes._
    3. _I will comfort them in all their afflictions._
    4. _I will be their secure refuge during life, and above all, in death._
    5. _I will bestow abundant blessings upon all their undertakings._
    6. _Sinners will find in my heart the source and infinite ocean of mercy._
    7. _Lukewarm souls shall become fervent._
    8. _Fervent souls shall quickly mount to high perfection._
    9. _I will bless every place in which an image of my heart is exposed and honored._
    10. _I will give to priests the gift of touching the most hardened hearts._
    11. _Those who shall promote this devotion shall have their names written in my heart._
    12. _I promise you in the excessive mercy of my heart that my all-powerful love will grant 
        to all those who receive holy Communion on the first Fridays in nine consecutive months 
        the grace of final perseverance; they shall not die in my disgrace, nor without receiving 
        their sacraments. My divine heart shall be their safe refuge in this last moment._
