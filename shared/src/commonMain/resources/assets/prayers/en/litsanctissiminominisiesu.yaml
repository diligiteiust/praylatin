title: Litany of The Most Holy Name of Jesus
lang: en
language: English
tags:
  - Litany
  - Juesus Christ
dates:
  - "* * 5 1 *"
lines:
  - "@litkyrie"
  - ^^^
  - Jesus, Son of the living God, __have mercy on us.__
  - Jesus, splendor of the Father...
  - Jesus, brightness of eternal light...
  - Jesus, King of glory...
  - Jesus, Sun of justice...
  - Jesus, Son of the Virgin Mary...
  - Jesus, most amiable...
  - Jesus, most admirable...
  - Jesus, mighty God...
  - Jesus, Father of the world to come...
  - Jesus, Angel of the great counsel...
  - Jesus, most powerful...
  - Jesus, most patient...
  - Jesus, most obedient...
  - Jesus, meek and humble of heart...
  - Jesus, Lover of chastity...
  - Jesus, Lover of us...
  - Jesus, God of peace...
  - Jesus, Author of life...
  - Jesus, Model of virtues...
  - Jesus, zealous for souls...
  - Jesus, our God...
  - Jesus, our Refuge...
  - Jesus, Father of the poor...
  - Jesus, Treasure of the faithful...
  - Jesus, Good Shepherd...
  - Jesus, true Light...
  - Jesus, eternal Wisdom...
  - Jesus, infinite Goodness...
  - Jesus, our Way and our Life...
  - Jesus, Joy of Angels...
  - Jesus, King of Patriarchs...
  - Jesus, Master of Apostles...
  - Jesus, Teacher of Evangelists...
  - Jesus, Strength of Martyrs...
  - Jesus, Light of Confessors...
  - Jesus, Purity of Virgins...
  - Jesus, Crown of all Saints...
  - Jesus, our Way and our Life...
  - Jesus, Joy of Angels...
  - Jesus, King of Patriarchs...
  - Jesus, Master of Apostles...
  - Jesus, Teacher of Evangelists...
  - Jesus, Strength of Martyrs...
  - Jesus, Light of Confessors...
  - Jesus, Purity of Virgins...
  - Jesus, Crown of all Saints...
  - ^^^
  - Be merciful, Spare us, O Jesus.
  - Be merciful, Graciously hear us, O Jesus.
  - ^^^
  - From all evil, __Jesus, deliver us.__
  - From all sin...
  - From Thy wrath...
  - From the snares of the devil...
  - From the spirit of fornication...
  - From everlasting death...
  - From the neglect of Thine inspirations...
  - Through the mystery of Thy holy Incarnation...
  - Through Thy Nativity...
  - Through Thine Infancy...
  - Through Thy most divine life...
  - Through Thy labors...
  - Through Thine Agony and Passion...
  - Through Thy Cross and dereliction...
  - Through Thy faintness and weariness...
  - Through Thy death and burial...
  - Through Thy Resurrection...
  - Through Thine Ascension...
  - Through Thine institution of the Most Holy Eucharist...
  - Through Thy joys...
  - Through Thy glory...
  - ^^^
  - "@litagnus"
  - ^^^
  - Jesus, hear us. Jesus, graciously hear us.
  - ^^^
  - "__Let us pray:__"
  - "O Lord Jesus Christ, Who hast said:"
  - Ask and ye shall receive;
  - seek, and ye shall find;
  - knock, and it shall be opened unto you;
  - grant, we beseech Thee, to us who ask, the gift of Thy most divine love,
  - that we may ever love Thee with all our heart, and in all our words and actions,
  - and never cease from praising Thee.
  - Make us, O Lord,
  - to have both a perpetual fear and love of Thy holy name,
  - for Thou never failest to govern those
  - whom Thou foundest upon the strength of Thy love,
  - Who livest and reignest, world without end. Amen.
