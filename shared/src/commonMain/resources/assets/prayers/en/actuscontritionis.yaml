title: Act of Contrition
lang: en
language: English
tags:
  - Confession
lines:
  - Oh my God, from all my heart I am sorry for all my sins,
  - and I detest them, not only because in sinning,
  - I deserve the penalties that you have justly established,
  - but especially because I have offended Thee,
  - who art the greatest good, and worthy beyond all my love.
  - Therefore I firmly purpose, with the help of Thy grace,
  - from henceforth to sin no more
  - and flee the next occasions of sinning. Amen.
