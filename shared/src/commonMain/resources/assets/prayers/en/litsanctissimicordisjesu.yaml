title: Litany of the Sacred Heart of Jesus
lang: en
language: English
dates:
  - "* * * JUN *"
tags:
  - Litany
  - Juesus Christ
lines:
  - "@litkyrie"
  -
  - Heart of Jesus, Son of the Eternal Father, Have mercy on us.
  - Heart of Jesus, Formed by the Holy Ghost in the womb of the Virgin Mother...
  - Heart of Jesus, Substantially united to the Word of God...
  - Heart of Jesus, Of Infinite Majesty...
  - Heart of Jesus, Holy Temple of God...
  - Heart of Jesus, Tabernacle of the Most High...
  - Heart of Jesus, House of God and Gate of Heaven...
  - Heart of Jesus, Burning Furnace of charity...
  - Heart of Jesus, Vessel of Justice and love...
  - Heart of Jesus, Full of goodness and love...
  - Heart of Jesus, Abyss of all virtues...
  - Heart of Jesus, Most worthy of all praises...
  - Heart of Jesus, King and center of all hearts...
  - Heart of Jesus, In Whom are all the treasures of wisdom and knowledge...
  - Heart of Jesus, In Whom dwelleth all the fulness of the Divinity...
  - Heart of Jesus, in Whom the Father is well pleased...
  - Heart of Jesus, Of Whose fullness we have all received...
  - Heart of Jesus, Desire of the everlasting hills...
  - Heart of Jesus, Patient and abounding in mercy...
  - Heart of Jesus, Rich unto all who call upon Thee...
  - Heart of Jesus, Fountain of life and holiness...
  - Heart of Jesus, Atonement for our sins...
  - Heart of Jesus, Filled with reproaches...
  - Heart of Jesus, Bruised for our offenses...
  - Heart of Jesus, Made obedient unto death...
  - Heart of Jesus, Pierced with a lance...
  - Heart of Jesus, Source of all consolation...
  - Heart of Jesus, Our Life and Resurrection...
  - Heart of Jesus, Our Peace and Reconciliation...
  - Heart of Jesus, Victim for our sins...
  - Heart of Jesus, Salvation of those who hope in Thee...
  - Heart of Jesus, Hope of those who die in Thee...
  - Heart of Jesus, Delight of all the Saints...
  -
  - "@litagnus"
  -
  - Jesus, meek and humble of heart,
  - Make our hearts like unto Thine.
  -
  - "Let us pray:"
  - Almighty and eternal God,
  - look upon the Heart of Thine most-beloved Son,
  - and upon the praises and satisfaction
  - He offers Thee in the name of sinners;
  - and appeased by worthy homage,
  - pardon those who implore Thy mercy, in Thy Great Goodness
  - in the name of the same Jesus Christ Thy Son,
  - Who liveth and reigneth with Thee, in the unity of the Holy Ghost, world without end. Amen.
