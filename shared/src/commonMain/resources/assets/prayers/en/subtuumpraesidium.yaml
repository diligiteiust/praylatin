title: Ancient Prayer to Our Lady
lang: en
language: English
tags:
  - Basic
  - Blessed Virgin Mary
lines:
  - We fly to thy protection,
  - O holy Mother of God.
  - Despise not our petitions in our necessities,
  - but deliver us always from all dangers,
  - O glorious and blessed Virgin.
notes: >
  > Some people might think that the oldest prayer to the Blessed Virgin Mary would be 
  the Hail Mary, but it’s not; the Sub Tuum Praesidium is an ancient Marian prayer of 
  the early Church, the oldest known prayer to Our Lady. The oldest version of this prayer
  is in Greek on an Egyptian papyrus dating back to the 3rd century. 
  The Latin translation dates from the 11th century and was likely made from the Greek.