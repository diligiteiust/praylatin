title: Litany Of Saint Joseph
lang: en
language: English
dates:
  - "* * * 19 3 ? *"
tags:
  - Litany
  - Saint Joseph
lines:
  - "@litkyrie"
  - ^^^
  - Holy Mary, __Pray for us.__
  - Saint Joseph,...
  - Illustrious son of David,...
  - Light of the patriarchs,...
  - Spouse of the Mother of God,...
  - Chaste guardian of the Virgin,...
  - Foster-father of the Son of God,...
  - Watchful defender of Christ,...
  - Head of the Holy Family,...
  - Joseph most just,...
  - Joseph most chaste,...
  - Joseph most prudent,...
  - Joseph most valiant,...
  - Joseph most obedient,...
  - Joseph most faithful,...
  - Mirror of patience,...
  - Lover of poverty,...
  - Model of workmen,...
  - Glory of domestic life,...
  - Guardian of virgins,...
  - Pillar of families,...
  - Solace of the afflicted,...
  - Hope of the sick,...
  - Patron of the dying,...
  - Terror of demons,...
  - Protector of Holy Church,...
  - ^^^
  - "@litagnus"
  - ^^^
  - He made him the lord of His household,
  - And prince over all His possessions.
  - ^^^
  - "__Let Us Pray:__"
  - God, Who in Thine ineffable providence
  - didst choose Blessed Joseph to be the spouse of Thy most Holy Mother,
  - grant that as we venerate him as our protector on earth,
  - we may deserve to have him as our intercessor in Heaven,
  - Thou Who livest and reignest forever and ever.
  - Amen.
