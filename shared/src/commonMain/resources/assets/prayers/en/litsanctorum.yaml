title: Litany of the Saints
lang: en
language: English
dates:
  - "* * 1 NOV *"
tags:
  - Litany
  - Saints
lines:
  - "@litkyrie"
  - ^^^
  - Holy Mary, __Pray for us.__
  - Holy Mother of God,...
  - Holy Virgin of virgins,...
  - ^^^
  - Saint Michael,...
  - Saint Gabriel,...
  - Saint Raphael,...
  - All ye holy angels and archangels,...
  - All ye holy orders of blessed spirits,...
  - ^^^
  - Saint John the Baptist,...
  - Saint Joseph,...
  - All ye holy patriarchs and prophets....
  - ^^^
  - Saint Peter,...
  - Saint Paul,...
  - Saint Andrew,...
  - Saint James,...
  - Saint John,...
  - Saint Thomas,...
  - Saint James,...
  - Saint Philip,...
  - Saint Bartholomew....
  - Saint Matthew,...
  - Saint Simon,...
  - Saint Thaddeus,...
  - Saint Matthias,...
  - Saint Barnabas,...
  - Saint Luke,...
  - Saint Mark,...
  - All ye holy apostles and evangelists,...
  - All ye holy disciples of our Lord....
  - All ye holy Innocents,...
  - ^^^
  - Saint Stephen,...
  - Saint Lawrence,...
  - Saint Vincent,...
  -
  -
  - Saints Fabian and Sebastian,...
  - Saints John and Paul,...
  - Saints Cosmas and Damian,...
  - Saints Gervase and Protase,...
  - All ye holy martyrs,...
  - ^^^
  - Saint Sylvester,...
  - Saint Gregory,...
  - Saint Ambrose,...
  - Saint Augustine....
  - Saint Jerome,...
  - Saint Martin,...
  - Saint Nicolas,...
  - All ye holy bishops and confessors,...
  - All ye holy doctors,...
  - ^^^
  - Saint Anthony,...
  - Saint Benedict,...
  - Saint Bernard,...
  - Saint Dominic,...
  - Saint Francis,...
  - Saint Kazimier,...
  - All ye holy priests and levites,...
  - All ye holy monks and hermits....
  - ^^^
  - Saint Mary Magdalen,...
  - Saint Agatha,...
  - Saint Lucy,...
  - Saint Agnes,...
  - Saint Cecily,...
  - Saint Catherine,...
  - Saint Anastasia,...
  -
  - All ye holy virgins and widows,...
  - All ye holy men and women, Saints of God, __Make intercession for us.__
  - ^^^
  - Be merciful, __Spare us, O Lord.__
  - Be merciful, __Graciously hear us, O Lord.__
  - ^^^
  - From all evil, __O Lord, deliver us.__
  - From all sin,...
  - From Thy wrath,...
  - From a sudden and unprovided death,...
  - From the snares of the devil,...
  - From anger, and hatred, and all ill will,...
  - From the spirit of fornication,...
  - From lightning and tempest,...
  - From the scourge of earthquake....
  - From pestilence, famine and war,...
  - From everlasting death,...
  - ^^^
  - Through the mystery of Thy holy Incarnation,...
  - Through Thy coming,...
  - Through Thy nativity,...
  - Through Thy baptism and holy fasting,...
  - Through Thy Cross and Passion,...
  - Through Thy death and burial,...
  - Through Thy holy Resurrection,...
  - Through Thine admirable Ascension,...
  - Through the coming of the Holy Spirit the Paraclete,...
  - In the day of judgment,...
  - ^^^
  - We sinners, __We beseech Thee, hear us,__
  -
  - That Thou wouldst spare us,...
  - That Thou wouldst pardon us,...
  - That Thou wouldst bring us to true penance,...
  - That Thou wouldst govern and preserve Thy holy Church...
  - That Thou wouldst preserve our Apostolic Prelate, and all ecclesiastical orders in holy religion,...
  - That Thou wouldst humble the enemies of Thy holy Church,...
  - That Thou wouldst give peace and true concord to Christian kings and princes,...
  - That Thou wouldst grant peace and unity to all Christian people,...
  - That Thou wouldst bring back to the unity of the Church all those who have strayed away, and lead to the light of the Gospel all unbelievers,...
  - That Thou wouldst confirm and preserve us in Thy holy service,...
  - That Thou wouldst lift up our minds to heavenly desires,...
  - That Thou wouldst render eternal blessings to all our benefactors,...
  - That Thou wouldst deliver our souls, and the souls of our brethren, relations and benefactors, from eternal damnation,...
  - That Thou wouldst give and preserve the fruit of the earth,...
  - That Thou wouldst give eternal rest to all the faithful departed,...
  - That Thou wouldst graciously hear us...
  - Son of God,...
  - ^^^
  - "@litagnus"
  - ^^^
  - Christ hear us. Christ, graciously hear us.
  - Lord, have mercy on us. Christ, have mercy on us. Lord, have mercy on us.
  - ^^^
  - "@paternoster"
  - Amen.
