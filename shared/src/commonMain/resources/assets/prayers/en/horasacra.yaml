lines:
  - "@"
  - >
    The Holy Hour is a devotional practice celebrated in honor of the Sacred Heart of Jesus.
  - ^^^
  - >
    The Savior himself sanctified this devotion several times, clearly recognizing it as one of 
    the most appropriate ways of honoring His Sacred Heart, and he entrusted his servant, 
    Saint Margaret Mary Alacoque, to remain faithful to this holy practice until the end of her life.
  - ^^^
  - >
    _"Every night – he said to her – from Thursday to Friday, I will make you a participant in 
    the mortal sorrow to which I willingly submitted in the Garden of Olives, and this sorrow, 
    which you will not be able to understand, will cause you to experience a kind of agony, 
    harder to bear than death._
  - >
    _To accompany Me in this humble prayer, which I then sent to My Father amidst all these torments, 
    you will rise between 11 and 12 at night and, lying prostrate with your face to the ground, 
    you will spend that hour soothing God's anger, begging for mercy for sinners, and to some 
    extent sweetening the pain inflicted on Me by the abandonment of the Apostles, which was 
    the reason for the reproach I gave them for not being able to watch with Me for one hour. 
    During that hour, you will do what I teach you."_
  - ^^^
  - "### The method of practicing the Holy Hour"
  - ^^^
  - >
    There was no moment when our Lord suffered more in his soul than during his agony in 
    the Garden of Olives. His sorrow was so great that to express its immensity he said 
    to the Apostles:
  - >
    _„My soul is sorrowful even unto death.”_
  - >
    In remembrance of this terrible agony, many people spend every Thursday in prayer 
    from 11 a.m. to 12 noon, to share and glorify the Savior's suffering and to restrain 
    God's wrath provoked by our sins. However, this pious exercise can be performed 
    on a Thursday much earlier. It is very appropriate to perform this devotion on the evening 
    of Holy Thursday, as well as on the evening of the Thursday before the First Friday of the month. 
    A plenary indulgence is gained for celebrating the "Holy Hour" after fulfilling the usual conditions.
  - ^^^
  - "### Act of Offering the Holy Hour"
  - >
    O Jesus, who loves us so much and offers Himself for our sins, allow me to spend
    in closest union with Your Heart, dying in the Garden of Olives, this Holy Hour
    which You requested of Your faithful Spouse, Saint Margaret Mary. O Savior,
    worthy of the greatest honor and adoration, grant me the most abundant participation in Your
    inexpressible sorrows and in the sadness and anguish that pervaded the soul
    of Your Most Holy Mother during that terrible and painful night. To make up
    for what my inadequacy lacks, I offer You the feelings of Your Most Holy Mother,
    Saint Margaret Mary, and all souls who knew and know how to console You in this mystery
    of sorrow and love. Amen.
  - ^^^
  - "### A proposal for meditation during the Holy Hour"
  - ___About the prayer of Christ the Lord in the Garden of Gethsemane, about His sorrow and bloody sweat___
  - ^^^
  - >
    After the Last Supper and the institution of the Blessed Sacrament, the Lord Jesus, knowing 
    that the hour was approaching for Him to be betrayed, went with His disciples to 
    the Garden of Olives...
  - >
    Seeking solitude, He withdrew from them, fell face down on the ground, and—completely abandoning 
    Himself to the will of the Eternal Father—prayed thus:
  - >
    _„Father, if thou wilt, remove this chalice from me: but yet not my will, but thine be done.”_ (Luk 22,42)
  - ^^^
  - >
    Then, seeking consolation, he goes to his disciples, and finding them sleeping, he returns to his place
    and repeats the same prayer... But the sadness that oppresses his soul is so heavy
    that, desiring to alleviate it, he approaches the apostles again, and seeing himself abandoned by them,
    he turns to the Eternal Father and asks for the cup of the Passion to be taken away. Then all its horror
    presents itself terrifyingly to the Savior and fills Him with immense pain and sadness.
  - ^^^
  - >
    The sight of the countless sins that the Savior was to blot out, even more than the approaching 
    Passion, brings Him such great sadness and pain. He saw the insults and outrages awaiting Him, 
    but at the same time also the enormity of the sins, the terrible burden of which 
    He had taken upon Himself. It was like a raging torrent of iniquity pouring down upon Him. 
    Wracked with pain, He humbles Himself in the dust before His Father, and drops of bloody sweat 
    fall to the ground…
  - ^^^
  - >
    What does the Lord Jesus do to alleviate sadness and pain? He begins anew a longer and more 
    fervent prayer... Through this, he taught us that prayer is the most effective remedy for our 
    suffering, that the stronger the temptation, the harder the struggle, the more frequent and 
    fervent our prayer should be...
  - ^^^
  - >
    While the Lord Jesus was praying, an angel came to strengthen Him. Not because the Savior 
    needed an angel, but to teach us that by praying persistently, we will always find strength 
    and comfort in God.
  - ^^^
  - >
    Soul that loves Jesus! In bodily pain and in soulful anguish, always repeat: 
    _"God, not my will, but thine be done."_ Accept suffering in a spirit of atonement 
    for the sins of all people and for your own. Recourse to prayer, confidently awaiting 
    the help and consolation it brings. Honor the Lord Jesus in His agony, begging Him to one day 
    sweeten your agony and the agony of all those who are to die today: relatives, friends, 
    and enemies. If you do this faithfully, then you will accept death without regret, at whatever 
    hour it pleases God to call you to Himself. The Heart of Jesus can sweeten it so much that, 
    like one of the greatest theologians, you will be amazed that "it is possible to die so sweetly."
