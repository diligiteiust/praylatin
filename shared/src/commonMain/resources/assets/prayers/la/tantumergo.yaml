title: Tantum Ergo
lang: la
language: Latina
tags:
  - Eucharistia
lines:
  - Tantum ergo Sacramentum
  - "veneremur cernui:"
  - Et antiquum documentum
  - "novo cedat ritui:"
  - Praestet fides supplementum
  - sensuum defectui.
  - ^^^
  - Genitori, Genitoque
  - laus et iubilatio,
  - salus, honor, virtus quoque
  - "sit et benedictio:"
  - Procedenti ab utroque
  - compar sit laudatio. Amen.
  - ^^^
  - "Panem de coelo praestitisti eis:"
  - Omne delectamentum in se habentem.
  - ^^^
  - "__Oremus:__"
  - >
    __Deus__, qui nobis sub sacramento mirabili passionis tuae
    "memoriam reliquisti: tribue, quaesumus, ita nos corporis"
    et sanguinis tui sacra mysteria venerari, ut redemptionis
    tuae fructum in nobis iugiter sentiamus. Qui vivis et
    regnas in saecula saeculorum. __Amen.__
