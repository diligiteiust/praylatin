title: Litaniae Kyrie Eleison
lang: la
language: Latina
tags:
  - Litaniae
  - Hide
lines:
  - __Kyrie, eleison,__ Christe, eleison. Kyrie, eleison,
  - __Christe, audi nos,__ Christe, exaudi nos.
  - __Pater de caelis, Deus,__ miserere nobis.
  - __Fili, Redemptor mundi, Deus,__ miserere nobis.
  - __Spiritus Sancte, Deus,__ miserere nobis.
  - __Sancta Trinitas, unus Deus,__ miserere nobis.
