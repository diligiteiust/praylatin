title: Litaniae Pretiosissimi Sanguinis Domini Nostri Iesu Christi
lang: la
language: Latina
tags:
  - Litaniae
  - Iesus Christus
lines:
  - __Kyrie, eleison,__ Christe, eleison. Kyrie, eleison,
  - __Christe, audi nos,__ Christe, exaudi nos.
  - __Pater de caelis, Deus,__ miserere nobis.
  - __Fili, Redemptor mundi,__ Deus, miserere nobis.
  - __Spiritus Sancte, Deus,__ miserere nobis.
  - __Sancta Trinitas, unus Deus,__ miserere nobis.
  -
  - Sanguis Christi, Unigeniti Patris aeterni, __Salva nos.__
  - Sanguis Christi, Verbi Dei incarnati, __Salva nos.__
  - Sanguis Christi, Novi et Aeterni Testamenti, __Salva nos.__
  - Sanguis Christi, in agonia decurrens in terram, __Salva nos.__
  - Sanguis Christi, in flagellatione profluens, __Salva nos.__
  - Sanguis Christi, in coronatione spinarum emanans, __Salva nos.__
  - Sanguis Christi, in Cruce effusus, __Salva nos.__
  - Sanguis Christi, pretium nostrae salutis, __Salva nos.__
  - Sanguis Christi, sine quo non fit remissio, __Salva nos.__
  - Sanguis Christi, in Eucharistia potus et lavacrum animarum, __Salva nos.__
  - Sanguis Christi, flumen misericordiae, __Salva nos.__
  - Sanguis Christi, victor daemonum, __Salva nos.__
  - Sanguis Christi, fortitudo martyrum, __Salva nos.__
  - Sanguis Christi, virtus confessorum, __Salva nos.__
  - Sanguis Christi, germinans virgines, __Salva nos.__
  - Sanguis Christi, robur periclitantium, __Salva nos.__
  - Sanguis Christi, levamen laborantium, __Salva nos.__
  - Sanguis Christi, in fletu solatium, __Salva nos.__
  - Sanguis Christi, spes paenitentium, __Salva nos.__
  - Sanguis Christi, solamen morientium, __Salva nos.__
  - Sanguis Christi, pax et dulcedo cordium, __Salva nos.__
  - Sanguis Christi, pignus vitae aeternae, __Salva nos.__
  - Sanguis Christi, animas liberans de lacu Purgatorii, __Salva nos.__
  - Sanguis Christi, omni gloria et honore dignissimus, __Salva nos.__
  -
  - __Agnus Dei, qui tollis peccata mundi,__ parce nobis, Domine.
  - __Agnus Dei, qui tollis peccata mundi,__ exaudi nos, Domine.
  - __Agnus Dei, qui tollis peccata mundi,__ miserere nobis, Domine.
  -
  - Redemisti nos, Domine, in sanguine tuo.
  - Et fecisti nos Deo nostro regnum.
  -
  - "__Oremus:__"
  - Omnipotens sempiterne Deus,
  - qui unigenitum Filium tuum mundi Redemptorem constituisti,
  - "ac eius sanguine placari voluisti:"
  - concede, quaesumus, salutis nostrae pretium ita venerari,
  - atque a praesentis vitae malis eius virtute defendi in terris,
  - ut fructu perpetuo laetemur in caelis.
  - Per eundem Christum Dominum nostrum. Amen.
