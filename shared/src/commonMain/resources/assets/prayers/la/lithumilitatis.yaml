title: Litaniae Humilitatis
lang: la
language: Latina
tags:
  - Litaniae
lines:
  - Iesu, mitis et humilis corde, __exaudi me.__
  - ^^^
  - A cupiditate, ut aestimer, __libera me Domine.__
  - A cupiditate, ut amer, ...
  - A cupiditate, ut exalter, ...
  - A cupiditate, ut honorer, ...
  - A cupiditate, ut lauder, ...
  - A cupiditate, ut aliis praeferar, ...
  - A cupiditate, ut consular, ...
  - A cupiditate, ut approber, ...
  - A timore, ne humilier, ...
  - A timore, ne spernar, ...
  - A timore, ne contemnar, ...
  - A timore, ne calumniam feram, ...
  - A timore, ne oblivioni tradar, ...
  - A timore, ne irridear, ...
  - A timore, ne iniuriam accipiam, ...
  - A timore, ne suspiciar, ...
  - ^^^
  - Ut magis alii amentur quam ego, __Jesu, da mihi gratiam desiderandi.__
  - Ut magis alii aestimentur quam ego, ...
  - Ut alii extollantur in mundi existimatione, ego autemminuar, ...
  - Ut alii eligantur, ego autem omittar, ...
  -
  - Ut alii mihi in omnibus rebus preferantur, ...
  - Ut alii sanctiores me sint, quamquam ego sum tam sanctusquam esse possum, ...
  - ^^^
  - Cor Jesu Sacratissimum, __miserere nobis.__
  - Auxilium Christianorum, __ora pro nobis.__
  - Virgo Potens, __ora pro nobis.__
  - Sancte Joseph, __ora pro nobis.__
  - Sancte Michæl Archangele, __ora pro nobis.__
  - Omnes Sancti Angeli, __orate pro nobis.__
