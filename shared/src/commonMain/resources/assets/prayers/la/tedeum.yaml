title: Te Deum
lang: la
language: Latina
tags:
  - Primus
lines:
  - "Te Deum laudamus:"
  - te Dominum confitemur.
  - Te aeternum Patrem omnis
  - terra veneratur.
  - ^^^
  - Tibi omnes Angeli;
  - tibi caeli et universae Potestates;
  - Tibi Cherubim et Seraphim
  - "incessabili voce proclamant:"
  - ^^^
  - Sanctus, Sanctus, Sanctus,
  - Dominus Deus Sabaoth.
  - Pleni sunt caeli et terra
  - maiestatis gloriae tuae.
  - ^^^
  - Te gloriosus Apostolorum chorus, Te Prophetarum laudabilis numerus,
  - Te Martyrum candidatus laudat exercitus.
  - Te per orbem terrarum
  - sancta confitetur Ecclesia,
  - ^^^
  - "Patrem immensae maiestatis:"
  - Venerandum tuum verum et unicum Filium;
  - Sanctum quoque Paraclitum Spiritum.
  - Tu Rex gloriae, Christe.
  - ^^^
  - Tu Patris sempiternus es Filius.
  - Tu ad liberandum
  - suscepturus hominem,
  - non horruisti Virginis uterum.
  - ^^^
  - Tu, devicto mortis aculeo,
  - aperuisti credentibus regna caelorum.
  - ^^^
  - Tu ad dexteram Dei sedes,
  - in gloria Patris.
  - Iudex crederis
  - esse venturus.
  - ^^^
  - Te ergo quaesumus,
  - "tuis famulis subveni:"
  - quos pretioso
  - sanguine redemisti.
  - ^^^
  - Aeterna fac cum sanctis
  - tuis in gloria numerari.
  - ^^^
  - __V.__ Salvum fac populum tuum, Domine,
  - et benedic hereditati tuae.
  - __R.__ Et rege eos, et extolle illos
  - usque in aeternum.
  - ^^^
  - __V.__ Per singulos dies benedicimus Te.
  - Et laudamus nomen tuum
  - __R.__ In saeculum,
  - et in saeculum saeculi.
  - ^^^
  - __V.__ Dignare, Domine, die isto
  - sine peccato nos custodire.
  - __R.__ Miserere nostri, Domine, miserere nostri.
  - ^^^
  - __V.__ Fiat misericordia tua, Domine, super nos,
  - quemadmodum speravimus in Te.
  - __R.__ "In Te, Domine, speravi:"
  - non confundar in aeternum.
