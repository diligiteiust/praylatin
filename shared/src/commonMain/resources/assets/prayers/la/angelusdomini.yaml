title: Angelus Domini
lang: la
language: Latina
tags:
  - Primus
  - Beata Virgo Maria
lines:
  - __Angelus Domini nuntiavit Mariae__
  - __Et concepit de Spiritu Sancto.__
  - ^^^
  - "@avemaria"
  - ^^^
  - __Ecce ancilla Domini,__
  - __Fiat mihi secundum verbum tuum.__
  - ^^^
  - "@avemaria"
  - ^^^
  - __Et Verbum caro factum est,__
  - __Et habitavit in nobis.__
  - ^^^
  - "@avemaria"
  - ^^^
  - __Ora pro nobis,__ sancta Dei Genetrix,
  - Ut digni efficiamur promissionibus Christi.
  - ^^^
  - "__Oremus:__"
  - Gratiam tuam, quaesumus, Domine,
  - mentibus nostris infunde;
  - ut qui, Angelo nuntiante,
  - Christi Filii tui incarnationem cognovimus,
  - per passionem eius et crucem 
  - ad resurrectionis gloriam perducamur.
  - Per eumdem Christum Dominum nostrum. Amen.