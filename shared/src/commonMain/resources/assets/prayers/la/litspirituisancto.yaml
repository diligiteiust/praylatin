title: Litaniæ de Spiritu Sancto
lang: la
language: Latina
tags:
  - Litaniae
  - Spiritus Sanctus
lines:
  - "@litkyrie"
  - ^^^
  - Sancte Spíritus a Patre Filioque procedens, __miserere nobis.__
  - Sancte Spíritus sapientiæ, ...
  - Sancte Spíritus intelléctus, ...
  - Sancte Spíritus consilii, ...
  - Sancte Spíritus fortitúdinis, ...
  - Sancte Spíritus scientiæ, ...
  - Sancte Spíritus pietátis, ...
  - Sancte Spíritus timóris Dei, ...
  - Sancte Spíritus, lux Prophetárum et Apostolórum, ...
  - Sancte Spíritus sine quo non fit remíssio, ...
  -
  -
  -
  -
  -
  - ^^^
  - Propitius esto, __parce nobis, Spíritus Sancte Deus.__
  - Propitius esto, __exaudi nos, Spíritus Sancte Deus.__
  - ^^^
  - A confidéntia audaci in Misericórdia Dei, __líbera nos, Spíritus Sancte Deus.__
  - A contradictióne apud veritátem christianam approbatam, ...
  - A malevoléntia et invidia fraterna gratiæ Dei, ...
  - Ab obstinatióne cordis, ...
  - Ab neglegéntia pœniténtiæ usque ad mortem, ...
  - A damnatióne æterna, ...
  - Per mirábilem Incarnatiónem Iesu Christi, ...
  - Per adventum tuum in línguas ignis, ...
  -
  -
  - ^^^
  - Peccatóres, __te rogamus, audi nos, Spíritus Sancte Deus.__
  - ^^^
  - Ut nos in pietáte et humilitáte confortáre digneris, __audi nos, Spíritus Sancte Deus.__
  - Ut nos stabilitátem et fortitúdinem donáre digneris, ...
  - Ut mentes nostras ad cæléstia desidéria erigas, ...
  - Ut nos purgáre et nos habitatiónem dignam te dedicare digneris, ...
  - Ut nos in dolóribus nostris consoláre digneris, ...
  - Ut nos in gratia tua confortáre digneris, ...
  - Ut nos omnes ad participatiónem in gloria sempiterna perdúcere digneris, ...
  - Ut te amamus et tui causa a peccátis cavimus, ...
  -
  - ^^^
  - Per aeternam a Patre et Filio processionem tuam, __libera nos, Spiritus Dei vivi.__
  - Per invisibilem unctionem tuam, ...
  - Per omnem gratiarum plenitudinem, qua Virginem Mariam semper possedisti, ...
  - Per supereffluentem sanctitatis abyssum, qua conceptione Verbi Matrem Dei inundare fecisti, ...
  - Per sanctam in baptismo Christi apparitionem tuam, ...
  - Per salutarem super apostolos adventum tuum, ...
  - Per ineffabilem bonitatem tuam, qua Ecclesiam gubernas, concilias Praesides, Martyres corroboras, Doctores illuminas, Religiones instituis, ...
  - ^^^
  - Agnus Dei, qui tollis peccata mundi, __Effunde in nos Sanctum Spiritum.__
  - Agnus Dei, qui tollis peccata mundi, __Emitte in nos promissum Patris Spiritum.__
  - Agnus Dei, qui tollis peccata mundi, __Da nobis spiritum bonum.__
  - ^^^
  - "Spiritus Domini replevit orbem terrarum:"
  - Et hoc, quod continet omnia, scientiam habet vocis.
  - ^^^
  - Kýrie, eléison. Christe, eléison. Kýrie, eléison.
  - ^^^
  - "@paternoster"
  - ^^^
  - V. __Cor mundum__ crea in me, Deus.
  - R. __Et spíritum rectum__ innova in viscéribus meis.
  - V. __Dómine__, exáudi oratiónem meam.
  - R. __Et clamor meus__ ad te véniat.
  - ^^^
  - __Orémus.__
  - >
    Veni Sancte Spíritus, reple tuorum corda fidélium et tui amoris in eis ignem accende, 
    qui omnes gentes in unitáte fidei contraxisti, ut gratia tua sanctíssima corda nostra 
    illustraret et ab omni malos nos defenderet. __Amen.__