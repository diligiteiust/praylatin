  - Iesu, amabilis...
  - Iesu, admirabilis...
  - Iesu, Deus fortis...
  - Iesu, pater futuri saeculi...
  - Iesu, magni consilii angele...
  - Iesu potentissime...
  - Iesu patientissime...
  - Iesu oboedientissime...
  - Iesu, mitis et humilis corde...
  - Iesu, amator castitatis...
  - Iesu, amator noster...
  - Iesu, Deus pacis...
  - Iesu, auctor vitae...
