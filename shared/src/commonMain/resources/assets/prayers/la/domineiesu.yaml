title: Domine Iesu
lang: la
language: Latina
tags:
  - Iesus Christus
  - Rosarium
lines:
  - "[Dómine Jesu](https://www.youtube.com/watch?v=b5uJmgjHkfQ),"
  - dimitte nobis débita nostra,
  - salva nos ab igne inferni,
  - perduc in caelum omnes ánimas,
  - praesertim eas,
  - quae misericórdiae tuae máxime indigent.
