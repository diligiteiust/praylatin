title: Litaniae ad Matrem Dei Consolationis
lang: la
language: Latina
tags:
  - Litaniae
  - Beata Virgo Maria
lines:
  - "@litkyrie"
  - ^^^
  - Sancta Maria, __Ora pro nobis.__
  - Sancta Dei Genetrix,...
  - Sancta Virgo Virginum,...
  - Consolatio animae nostrae,...
  - Consolatio mundi,...
  - Consolatio nostrum postquam Deo maximum,...
  - Consolatio afflictorum,...
  - Consolatio flentes,...
  - Consolatio derelictorum,...
  - Consolatio egenorum,...
  - Consolatio gementes,...
  - Consolatio viventes et defunctorum,...
  - Consolatio amicorum Dei,...
  - Consolatrix una peccatorum,...
  - Consolatrix desperantes,...
  - Consolatrix sanctissima,...
  - Consolatrix clementissima,...
  - Consolatrix pauperum,...
  - Consolatrix viduarum et orphanorum,...
  - Consolatrix miseratissima aegrorum,...
  - Consolatrix cordium nostrorum,...
  - Consolatrix iustorum et peccatorum,...
  - Consolatrix nostra,...
  - Consolatrix sine labe concepta,...
  - ^^^
  - "@litagnus"
  - ^^^
  - Ora pro nobis, Mater Consolationis.
  - Ut digni efficiamur promissionibus Christi.
  - ^^^
  - "__Oremus:__"
  - Deus, qui per Virginem Mariam,
  - consolationem populo tuo, Iesum Christum,
  - mittere dignatus es;
  - praesta, quaesumus, ut, ipsa intercedente,
  - omni consolatióne repleamur,
  - eamque cum fratribus participemus.
  - Per Christum Dominum nostrum.
  - Amen.
