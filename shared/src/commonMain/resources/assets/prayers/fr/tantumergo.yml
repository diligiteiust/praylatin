title: Tantum Ergo
lang: fr
language: français
tags:
  - Eucharistie
lines:
  - Ce sacrement est admirable. 
  - "Vénérons-le humblement,"
  - et qu'au précepte d'autrefois 
  - "succède un rite nouveau."
  - Que la foi vienne suppléer à nos sens 
  - et à leurs limites.
  - ^^^
  - Au Père, au Fils, 
  - "notre louange, l'allégresse de nos chants:"
  - salut, et puissance, et honneur 
  - "et toute bénédiction."
  - À l'Esprit du Père et du Fils, 
  - égale acclamation de gloire. Amen.
  - ^^^
  - "Tu leur as donné le pain du ciel."
  - Contenant en lui-même toutes les délices.
  - ^^^
  - "__Prions:__"
  - >
    __Ô Dieu__, qui nous as laissé le souvenir de ta passion dans le merveilleux sacrement 
    accorde-nous, nous t’en supplions, de vénérer les saints mystères de ton corps et de ton sang, 
    afin que nous ressentions sans cesse en nous 
    le fruit de ta rédemption. 
    Toi qui vis et règnes pour les siècles des siècles. __Amen.__