title: Litanie de l'humilité
lang: fr
language: français
tags:
  - Litanies
lines:
  - Ô Jésus doux et humble de cœur, __exaucez-moi !__
  - ^^^
  - Du désir d’être estimé, délivrez-moi, Jésus.
  - Du désir d’être aimé, ...
  - Du désir d’être exalté, ...
  - Du désir d’être honoré, ...
  - Du désir d’être loué, ...
  - Du désir d’être préféré ...
  - Du désir d’être consulté, ...
  - Du désir d’être approuvé, ...
  - De la crainte d’être humilié, ...
  - De la crainte d’être méprisé, ...
  - De la crainte d’être rebuté, ...
  - De la crainte d’être calomnié, ...
  - De la crainte d’être oublié, ...
  - De la crainte d’être tourné en ridicule, ...
  - De la crainte d’être injurié, ...
  - De la crainte d’être soupçonné, ...
  - ^^^
  - Que les autres soient plus aimés que moi, Jésus, __accordez-moi la grâce de le désirer.__
  - Que les autres soient plus estimés que moi, Jésus, ...
  - Que les autres puissent grandir dans l’opinion et moi diminuer, Jésus, ...
  - Que les autres puissent être choisis et moi mis de côté, Jésus, ...
  -  
  - Que les autres puissent m’être préférés en tout, Jésus, ...
  - Que les autres puissent être plus saints que moi, pourvu que je devienne saint tant que je le puis, Jésus, ... !
  - ^^^
  - Coeur sacré de Jésus, __ayez pitié de nous.__
  - Secours des chrétiens, __priez pour nous.__
  - Vierge puissante, __priez pour nous.__
  - Saint Joseph, __priez pour nous.__
  - Saint Michel Archange, __priez pour nous.__
  - Tous les saints anges, __priez pour nous.__