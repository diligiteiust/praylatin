title: Litanie à la Mère de Dieu de Consolation
lang: fr
language: français
tags:
  - Litanie
  - Bienheureuse Vierge Marie
lines:
  - "@litkyrie"
  - ^^^
  - Sainte Marie, __priez pour nous.__
  - Sainte Mère de Dieu,...
  - Sainte Vierge des Vierges,...
  - Consolation de nos âmes,...
  - Consolation du monde,...
  - Notre consolation après la plus grande des grâces de Dieu,...
  - Consolation des affligés,...
  - Consolation de ceux qui pleurent,...
  - Consolation des abandonnés,...
  - Consolation des nécessiteux,...
  - Consolation de ceux qui gémissent,...
  - Consolation des vivants et des morts,...
  - Consolation des amis de Dieu,...
  - Consolatrice des pécheurs,...
  - Consolatrice des désespérés,...
  - Très sainte Consolatrice,...
  - Très miséricordieuse Consolatrice,...
  - Consolatrice des pauvres,...
  - Consolatrice des veuves et des orphelins,...
  - Très compatissante Consolatrice des malades,...
  - Consolatrice de nos cœurs,...
  - Consolatrice des justes et des pécheurs,...
  - Notre Consolatrice,...
  - Consolatrice conçue sans tache,...
  - ^^^
  - "@litagnus"
  - ^^^
  - Priez pour nous, Mère de Consolation.
  - Afin que nous devenions dignes des promesses de Jésus Christ.
  - ^^^
  - "__Prions:__"
  - Dieu tout-puissant, qui par la Vierge Marie 
  - avez daigné envoyer Jésus-Christ, consolation pour votre peuple, 
  - accordez-nous, nous vous en supplions, 
  - que par son intercession 
  - nous soyons comblés de toute consolation 
  - et que nous la partagions avec nos frères. 
  - Par Jésus-Christ, notre Seigneur.
  - Amen.