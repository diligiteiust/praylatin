title: Souvenez-vous
lang: fr
language: français
tags:
  - Base
  - Bienheureuse Vierge Marie
lines:
  - Souvenez-vous, ô très miséricordieuse Vierge Marie, 
  - qu'on n'a jamais entendu dire
  - qu'aucun de ceux qui avaient eu recours à votre protection, 
  - imploré votre assistance,
  - réclamé votre secours, 
  - ait été abandonné.
  - Animé d'une pareille confiance,
  - ô Vierge des vierges, ô ma Mère, je cours vers vous
  - je viens vers vous,
  - et, gémissant sous le poids de mes péchés, je me prosterne à vos pieds.
  - Ô Mère du Verbe, ne méprisez pas mes prières,
  - mais accueillez-les favorablement et daignez les exaucer.
  - Amen.