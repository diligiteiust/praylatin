title: Litanie de Saint Joseph
lang: fr
language: français
dates:
  - "* * * 19 3 ? *"
tags:
  - Litanies
  - Saint Joseph
lines:
  - "@litkyrie"
  - ^^^ 
  - Sainte Marie, __priez pour nous.__
  - Saint Joseph, ...
  - Illustre descendant de David, ...
  - Lumière des Patriarches, ...
  - Époux de la Mère de Dieu, ...
  - Chaste gardien de la Vierge, ...
  - Nourricier du fils de Dieu, ...
  - Zélé défenseur de Jésus, ...
  - Chef de la Sainte Famille, ...
  - Joseph très juste, ...
  - Joseph très chaste, ...
  - Joseph très prudent, ...
  - Joseph très courageux, ...
  - Joseph très obéissant, ...
  - Joseph très fidèle, ...
  - Miroir de patience, ...
  - Ami de la pauvreté, ...
  - Modèle des travailleurs, ...
  - Gloire de la vie de famille, ...
  - Gardien des vierges, ...
  - Soutien des familles, ...
  - Consolation des malheureux, ...
  - Espérance des malades, ...
  - Patron des mourants, ...
  - Terreur des démons,...
  - Protecteur de la Sainte Eglise, ...
  - ^^^
  - "@litagnus"
  - ^^^
  - Il l’a établi le chef de sa maison.
  - Et l’intendant de tous ses biens.
  - ^^^
  - "__Prions:__"
  - O Dieu, qui, par une providence ineffable, 
  - avez daigné choisir le bienheureux Joseph, pour être l’époux de votre Sainte Mère, 
  - faites, nous vous en prions, que, l’honorant ici-bas comme protecteur, 
  - "nous méritions de l’avoir pour intercesseur dans le ciel" 
  - Vous qui vivez et régnez dans les siècles des siècles. 
  - Amen. 