  - ^^^
  - Soyez-nous propice, pardonnez-nous, Jésus.
  - Soyez-nous propice, exaucez-nous, Jésus
  - ^^^
  - De tout mal, __délivrez-nous, Jésus.__
  - De tout péché,...
  - De votre colère,...
  - Des embûches du démon,...
  - De l’esprit impur,...
  - De la mort éternelle,...
  - Du mépris de vos inspirations, ...
  - Par le mystère de votre sainte Incarnation,...
  - Par votre naissance,...
  - Par votre enfance,...
  - Par votre vie toute divine,...
  - Par vos travaux,...
  - Par votre agonie et votre Passion,...
  - Par votre Croix et votre délaissement,...
  - Par vos langueurs,...
  - Par votre mort et votre sépulture,...
  - Par votre résurrection,...
  - Par votre ascension,...
  - Par votre institution de la très sainte Eucharistie,...
  - Par vos joies,...
  - Par votre gloire, ...
  - ^^^
  - "@litagnus"
  - ^^^
  - Jésus, écoutez-nous. Jésus, exaucez-nous.
  - ^^^
  - __Prions.__
  - "Seigneur Jésus-Christ qui avez dit :"
  - Demandez et vous recevrez, 
  - cherchez et vous trouverez, 
  - frappez, et il vous sera ouvert ; 
  - nous vous en supplions, accordez à notre prière votre divin amour 
  - afin que nous vous aimions de tout cœur, de parole et d’action, 
  - et que jamais nous ne cessions de vous louer. 
  - Donnez-nous, Seigneur, 
  - et l’amour et la crainte continuelle de votre saint Nom, 
  - puisque votre providence n’abandonne jamais 
  - ceux que vous établissez solidement dans votre amour. 
  - Vous qui vivez et régnez dans les siècles des siècles. Amen.