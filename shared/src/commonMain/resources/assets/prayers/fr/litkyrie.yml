title: Kyrie
lang: fr
language: français
tags:
  - Litanies
  - Hide
lines:
  - __Seigneur prends pitié,__ O Christ, prends pitié. Seigneur, prends pitié,
  - __Christ, écoutez-nous,__ Christ, exaucez-nous.
  - __Père du Ciel, Dieu,__ ayez pitié de nous.
  - __Fils, Rédempteur du monde, Dieu,__ ayez pitié de nous.
  - __Esprit Saint, Dieu,__ ayez pitié de nous.
  - __Sainte Trinité, un seul Dieu,__ ayez pitié de nous.