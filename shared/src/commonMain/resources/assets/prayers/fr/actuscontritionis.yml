title: Acte de contrition
lang: fr
language: French
tags:
  - Confession
lines:
  - Mon Dieu, je me repens de tout mon cœur de tous mes péchés,
  - et je les déteste, car par le péché,
  - j'ai non seulement mérité les châtiments que Tu as justement institués,
  - mais surtout parce que je T'ai offensé,
  - toi, le Souverain Bien, digne d'être aimé par-dessus tout.
  - C'est pourquoi je prends la ferme résolution, avec le secours de Ta grâce,
  - de ne plus pécher désormais
  - et d'éviter toute nouvelle occasion de pécher.