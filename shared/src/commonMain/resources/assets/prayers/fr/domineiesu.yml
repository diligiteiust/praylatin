lines:
  - "Ô mon Jésus," 
  - pardonnez-nous nos péchés, 
  - préservez-nous du feu de l’enfer 
  - et conduisez au ciel toutes les âmes, 
  - spécialement celles 
  - qui ont le plus besoin de Votre miséricorde.