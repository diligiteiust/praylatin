title: Angelus Domini
lang: fr
language: français
tags:
  - Base
  - Bienheureuse Vierge Marie
lines:
  - __L’ange du Seigneur apporta l'annonce à Marie,__
  - __Et elle conçut du Saint-Esprit.__
  - ^^^
  - "@avemaria"
  - ^^^
  - __Voici la Servante du Seigneur,__
  - __Qu’il me soit fait selon votre parole.__
  - ^^^
  - "@avemaria"
  - ^^^
  - __Et le Verbe s’est fait chair,__
  - __Et il a habité parmi nous.__
  - ^^^
  - "@avemaria"
  - ^^^
  - __Priez pour nous, sainte Mère de Dieu,__
  - Afin que nous soyons rendus dignes des promesses du Christ.
  - ^^^
  - "__Prions:__"
  - Que votre grâce, Seigneur notre Père,
  - se répande en nos coeurs
  - par le message de l'Ange 
  - vous nous avez fait connaître l'Incarnation de votre Fils bien aimé, 
  - conduisez-nous par sa passion et par sa croix 
  - jusqu'à la gloire de la résurrection. 
  - Par Jésus, le Christ, notre Seigneur.
  - Amen