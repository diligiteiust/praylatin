title: Litanie du Saint Esprit
lang: fr
language: français
tags:
  - Litanies
  - Saint Esprit
lines:
  - "@litkyrie"
  - ^^^
  - Saint Esprit, qui procédez du Père et du Fils, __ayez pitié de nous.__
  - Saint Esprit de sagesse,...
  - Saint Esprit d’intelligence,...
  - Saint Esprit de conseil,...
  - Saint Esprit de force,...
  - Saint Esprit de science,...
  - Saint Esprit de piété,...
  - Saint Esprit de crainte du Seigneur,...
  - Saint Esprit lumière des Prophètes et des Apôtres,...
  - Saint Esprit sans quoi il n'y a pas de rémission, ...
  -
  -
  -
  -
  -
  - ^^^
  - Soyez-nous propice, __pardonnez-nous Esprit Saint Dieu.__
  - Soyez-nous propice, __exaucez-nous, Esprit Saint Dieu.__
  - ^^^
  - De l’obstination contre la Miséricorde de Dieu, __libérez-nous Esprit Saint Dieu__
  - De la résistance à la vérité connue,...
  - De la mauvaise volonté et de la haine,...
  - De l'obstination du coeur,...
  - De la présomption et du désespoir,...
  - De la damnation éternelle,...
  - Par la conception de Jésus-Christ qui s’est faite par votre opération,...
  - Par votre venue en des langues de feu,...
  -
  -
  - ^^^
  - Pécheurs, __nous vous supplions, écoutez-nous Esprit Saint Dieu.__
  - ^^^
  - Que nous soyons rendus dignes en piété et en humilité, __écoutez-nous Esprit Saint Dieu__ 
  - Afin que tu nous accordes stabilité et force, ...
  - Afin que tu élèves nos esprits vers les aspirations célestes,...
  - Afin que tu daignes nous purifier et nous consacrer une demeure digne de toi, ...
  - Afin que vous daigniez nous consoler dans nos peines,...
  - Afin que tu daignes nous fortifier par ta grâce,...
  - Afin que tu daignes nous conduire tous à la participation à la gloire éternelle,...
  - Que nous vous aimons et que, pour vous, nous évitons le péché,...
  -
  - ^^^
  - Par votre procession éternelle du Père et du Fils, __libérez-nous Esprit du Dieu Vivant.__
  - Par votre onction invisible,...
  - Par toute la plénitude des grâces dont vous avez toujours possédé la Vierge Marie,...
  - Par l’abîme débordant de sainteté, par la conception duquel tu as inondé la Mère de Dieu,...
  - Par ta sainte apparition dans le baptême du Christ,...
  - Par ta venue salvatrice sur les apôtres,...
  - Par votre ineffable bonté, par laquelle vous gouvernez l'Église, vous établissez des conciles, vous fortifiez les martyrs, vous éclairez les docteurs, vous fondez des religions,...
  - ^^^
  - Agneau de Dieu, qui effacez les péchés du monde, __diffusez en nous l'Esprit-Saint.__
  - Agneau de Dieu, qui effacez les péchés du monde, __Envoyez sur nous l'Esprit du Père promis.__
  - Agneau de Dieu, qui effacez les péchés du monde, __Donnez nous un esprit bon.__ 
  - ^^^
  - "L'Esprit de Dieu a rempli la terre:"
  - Et Lui, qui contient toutes choses, possède la connaissance de la parole.
  - ^^^
  - Kýrie, eléison. Christe, eléison. Kýrie, eléison.
  - ^^^
  - "@paternoster"
  - ^^^
  - V. __Créez en moi un cœur pur__, ô Dieu.
  - R. __Renouvellez en moi un esprit droit.__
  - V. __Seigneur__, écoutez ma prière.
  - R. __Que ma prière__ parvienne jusqu'à vous.
  - ^^^
  - __Prions.__
  - >
    Venez, Esprit Saint, remplissez le coeur de vos fidèles et allumez en eux le feu de votre amour.
    Envoyez votre Esprit, et tout sera créé ;
    Et vous renouvellerez la face de la terre. __Amen.__
  