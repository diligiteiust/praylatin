title: Adoremus in aeternum
lang: fr
language: français
tags:
  - Eucharistie
  - Cantique
lines:
  - Adorons à jamais le très saint Sacrement.
  - Nations, louez toutes le Seigneur,
  - Peuples, louez-le tous.
  - Parce qu'il a affermi sur nous sa miséricorde,
  - Et que la vérité du Seigneur demeure éternellement.
  - ^^^
  - Adorons à jamais le très saint Sacrement.
  - Gloire au Père, gloire au Fils,
  - Gloire au Saint Esprit.
  - Comme il était au commencement, et maintenant, et toujours,
  - Et dans les siècles des siècles.
  - ^^^
  - Adorons à jamais le très saint Sacrement.
