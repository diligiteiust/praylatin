title: Symbole des Apôtres
lang: fr
language: français
tags:
  - Base
lines:
  - Je crois en Dieu, le Père tout-puissant, 
  - Créateur du ciel et de la terre,
  - et en Jésus-Christ, 
  - son fils unique, notre Seigneur
  - __qui a été conçu du Saint-Esprit,__ 
  - et qui __est né de la Vierge Marie__ 
  - Il a souffert sous Ponce Pilate, 
  - Il a été crucifié, Il est mort, Il a été enseveli, 
  - Il est descendu aux enfers ;
  - le troisième jour, Il est ressuscité des morts 
  - Il est monté aux cieux,
  - Il est assis à la droite de Dieu, le père tout-puissant 
  - d'où Il viendra pour juger les vivants et les morts.
  - Je crois en l'Esprit-Saint
  - à la sainte église catholique
  - à la communion des saints,
  - la rémission des péchés,
  - la résurrection de la chair
  - la vie éternelle.
  - Amen.