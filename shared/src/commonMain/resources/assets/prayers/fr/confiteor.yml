title: Je confesse
lang: fr
language: français
tags:
  - Sainte Messe
lines:
  - Je confesse à Dieu tout-puissant, 
  - à la bienheureuse Marie toujours Vierge, 
  - à saint Michel Archange, 
  - à saint Jean Baptiste, 
  - aux saints apôtres Pierre et Paul, 
  - à tous les saints et à vous mon Père, 
  - que j’ai péché, 
  - en pensée, en parole et en action. 
  - C’est ma faute, c’est ma faute, 
  - c’est ma très grande faute. 
  - C’est pourquoi je supplie la bienheureuse Marie 
  - toujours Vierge, 
  - saint Michel Archange, 
  - saint Jean Baptiste, 
  - les saints apôtres Pierre et Paul, 
  - tous les saints et vous mon Père, 
  - de prier pour moi 
  - le Seigneur notre Dieu.