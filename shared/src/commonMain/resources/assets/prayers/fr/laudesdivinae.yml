title: Louanges divines
lang: fr
language: français
tags:
  - Eucharistie
lines:
  - Béni soit Dieu.
  - Béni soit son saint Nom.
  - Béni soit Jésus-Christ, vrai Dieu et vrai homme.
  - Béni soit le Nom de Jésus.
  - Béni soit son très Sacré-Coeur.
  - Béni soit son très précieux Sang.
  - Béni soit Jésus dans le très Saint Sacrement de l'autel.
  - Béni soit l'Esprit Saint Paraclet.
  - Béni soit l'auguste Mère de Dieu, la très sainte Vierge Marie.
  - Béni soit sa sainte et immaculée Conception.
  - Béni soit sa glorieuse Assomption.
  - Béni soit le nom de Marie, Vierge et Mère.
  - Béni soit saint Joseph, son très chaste époux.
  - Béni soit Dieu dans ses anges et dans ses saints.