title: Te Deum
lang: fr
language: français
tags:
  - Base
lines:
  - "À Toi, Dieu, notre louange!"
  - "Nous t'acclamons: tu es Seigneur!"
  - À Toi, Père éternel,
  - L'hymne de l'univers.
  - ^^^
  - Devant Toi se prosternent les archanges,
  - Les anges et les esprits des cieux ;
  - Ils Te rendent grâce ;
  - Ils adorent et ils chantent
  - ^^^
  - Saint, Saint, Saint, le Seigneur,
  - Dieu de l'univers ;
  - Le ciel et la terre sont remplis
  - De Ta gloire,
  - ^^^
  - C'est Toi que les Apôtres glorifient, Toi que proclament les prophètes,
  - Toi dont témoignent les martyrs ;
  - C'est Toi que par le monde entier
  - L’Église annonce et reconnaît.
  - ^^^
  - "Dieu, nous T'adorons: Père infiniment saint,"
  - Fils éternel et bien-aimé,
  - Esprit de puissance et de paix.
  - Christ, le Fils du Dieu vivant,
  - ^^^
  - Le Seigneur de la gloire,
  - Tu n'as pas craint de prendre chair
  - Dans le corps d'une vierge pour libérer l'humanité captive.
  - Par ta victoire sur la mort,
  - ^^^
  - Toi, ayant vaincu l'aiguillon de la mort,
  - Tu as ouvert à tout croyant les portes du Royaume
  - ^^^
  - Vous êtes assis à la droite de Dieu,
  - dans la gloire du Père.
  - vous viendrez
  - pour le Jugement.
  - ^^^
  - Nous vous en supplions donc,
  - "secourez vos serviteurs,"
  - que vous avez rachetés 
  - par votre précieux sang.
  - ^^^
  - Prends-les avec tous les saints
  - Dans Ta joie et dans Ta lumière.
  - ^^^
  - __V.__ Sauve ton peuple, Seigneur,
  - Et bénis Ton héritage.
  - __R.__ Dirige les tiens 
  - et conduis-les jusque dans l'éternité.
  - ^^^
  - __V.__ Chaque jour nous te bénissons
  - Et nous louons Ton nom à jamais 
  - __R.__ dans ce siècle, 
  - et dans les siècles des siècles.
  - ^^^
  - __V.__ Daigne, Seigneur, en ce jour,
  - Nous garder de tout péché.
  - __R.__ Aie pitié de nous, Seigneur, Aie pitié de nous.
  - ^^^
  - __V.__ Que ta miséricorde soit sur nous, Seigneur, 
  - Car nous avons mis en Toi notre espérance.
  - __R.__ "En Toi, Seigneur, j'ai mis mon espérance:" 
  - Que je ne sois jamais confondu.