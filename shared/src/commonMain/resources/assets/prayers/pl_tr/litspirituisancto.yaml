title: Litania do Ducha Świętego
lang: pl_tr
language: Polskie tłumaczenie
tags:
  - Litania
  - Do Ducha Świętego
lines:
  - "@litkyrie"
  - ^^^
  - Duch Święty pochodzący od Ojca i Syna, __zmiłuj się nad nami.__
  - Duch Święty mądrości, ...
  - Duchu Święty, rozumu., ...
  - Duch Święty rady, ...
  - Duch Święty mocy, ...
  - Duch Święty wiedzy, ...
  - Duchu Święty współczucia, ...
  - Duch Święty bojaźni Bożej, ...
  - Duchu Święty, światło Proroków i Apostołów, ...
  - Duchu Święty, bez którego nie ma przebaczenia., ...
  -
  -
  -
  -
  -
  - ^^^
  - Bądź nam miłościw, __przepuść nam, Duchu Święty Boża.__
  - Bądź nam miłościw, __wysłuchaj nas, Duchu Święty Boża.__
  - ^^^
  - Od zbytniej ufności w miłosierdzie Boże, __líbera nos, Spíritus Sancte Deus.__
  - Od sprzeciwiania się uznanej prawdzie wiary świętej, ...
  - Od złej woli i braterskiej zazdrości o łaskę Bożą, ...
  - Od zatwardziałości serca, ...
  - Od zaniedbania pokuty aż do śmierci, ...
  - Od potępienia wiekuistego, ...
  - Przez cudowne Wcielenie Jezusa Chrystusa, ...
  - Przez przyjście Twoje w językach ognistych, ...
  -
  -
  - ^^^
  - My grzeszni, __Ciebie prosimy, usłysz nas, Duchu Święty, Boże.__
  - ^^^
  - Abyś w pobożności i pokorze utwierdzać raczył, __usłysz nas, Duchu Święty, Boże.__
  - Abyś nam stałości i męstwa udzielić raczył, ...
  - Abyś umysły nasze ku pożądaniu nieba podnieśc raczył, ...
  - Abyś nas oczyściwszy, na godne mieszkanie dla siebie poświęcić raczył, ...
  - Abyś nas w cierpieniach naszych pocieszać raczył, ...
  - Abyś w łasce Twojej utwierdzać i zbawić raczył, ...
  - Abyś nas wszystkich do uczestnictwa chwały wiekuistej doprowadzić raczył, ...
  - Abyśmy Ciebie miłowali i dla Ciebie grzechów się strzegli, ...
  -
  - ^^^
  - Przez wieczne pochodzenie Twoje od Ojca i Syna, __wybaw nas, Duchu Boga żywego.__
  - Przez Twoje niewidzialne namaszczenie, ...
  - Przez pełnię łask, którymi zawsze obdarzałeś Maryję Dziewicę, ...
  - Przez otchłań świętości, którą odbarzyłeś Matkę Słowa Bożego, ...
  - Przez Twoje święte pojawienie się na chrzcie Chrystusa, ...
  - Przez przyjście Twoje zbawienne na apostołów, ...
  - Przez Twoją niewypowiedzianą dobroć, przez którą rządzisz Kościołem, ustanawiasz sobory, umacniasz męczenników, oświecasz doktorów, ustanawiasz religie, ...
  - ^^^
  - Baranku Boży, który gładzisz grzechy świata, __Wylej na nas Ducha Świętego.__
  - Baranku Boży, który gładzisz grzechy świata, __Ześlij na nas obiecanego Ducha Ojca.__
  - Baranku Boży, który gładzisz grzechy świata, __Daj nam dobrego ducha.__
  - ^^^
  - "Duch Pański napełnił cały świat:"
  - A Ten, który zawiera wszystko, ma wiedzę słowa.
  - ^^^
  - Kýrie, eléison. Christe, eléison. Kýrie, eléison.
  - ^^^
  - "@paternoster"
  - ^^^
  - V. __Serce czyste__ stwórz we mnie, Boże
  - R. __I ducha prawego__ odnów we wnętrzu moim.
  - V. __Panie__, wysłuchaj modlitwy mojej.
  - R. __A wołanie moje__ niech do Ciebie przyjdzie.
  - ^^^
  - __Módlmy się.__
  - >
    Przybądź, Duchu Święty, któryś ludy różnych języków zespolił w jedności wiary,
    racz napełnić serca Twoich wiernych i zapal w nich ogień Twojej miłości, aby Twoja łaska nas
    oświeciła i broniła od wszelkiego zła. __Amen.__